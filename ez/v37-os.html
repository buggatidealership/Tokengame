<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EZ OS</title>
<meta name="description" content="EZ OS: the Earnings Zeason operating system. Four AIs call earnings moves, the market grades them.">
<meta name="theme-color" content="#0c1411">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Martian+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#0c1411;--felt2:#13201b;--felt3:#1b2c25;
  --paper:#f2ecdd;--paper2:#e7dfcb;--paper3:#d8cfb8;
  --ink:#121412;--ink2:#5b5a52;--line:#cfc6ae;
  --gold:#f0bf34;--green:#2fcf7d;--red:#ff5a4f;
  --goldD:#9a6c00;--greenD:#0f7a45;--redD:#c22a22;
  --fd:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --fb:var(--fd);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--felt);color:var(--paper);font-family:var(--fd);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- the $EZ mark (OS logo) ---------- */
.ezm{display:inline-flex;align-items:center;justify-content:center;background:#0b0d0c;border-radius:.28em;padding:.08em .26em;font-family:var(--fd);font-weight:800;letter-spacing:-.04em;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.ezm b{font-weight:800}.ezm .d{color:var(--gold)}.ezm .e{color:var(--green)}.ezm .z{color:var(--red)}

/* ---------- logos ---------- */
.lg{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;flex:none;vertical-align:middle;overflow:hidden}
.lg svg{width:62%;height:62%}
.co-mark{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:.55em;background:#fff;color:#111;font:700 .62em/1 var(--fm);flex:none;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);vertical-align:middle;text-align:center}
.co-mark img{width:78%;height:78%;object-fit:contain}
.co-mark.dk{background:#16181a}

/* ---------- chips (app icons are betting chips) ---------- */
.chip{--c:var(--gold);--t:#0b0d0c;position:relative;width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--t);
  background:radial-gradient(circle,var(--c) 0 57%,transparent 58%),repeating-conic-gradient(from 7.5deg,var(--c) 0 15deg,var(--paper) 15deg 30deg);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.28),0 7px 16px -4px rgba(0,0,0,.6);transition:transform .25s var(--ease)}
.chip::after{content:"";position:absolute;inset:11px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55)}
.chip svg{width:44%;height:44%;position:relative;z-index:1}
.chip .lg{font-size:21px;position:relative;z-index:1;box-shadow:0 0 0 2px rgba(255,255,255,.65)}
.chip .ezm{font-size:16px;position:relative;z-index:1}
.chip.sm{width:22px;height:22px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.chip.sm::after{inset:4px;border-width:1px}
.chip.sm svg{width:56%;height:56%}.chip.sm .lg{font-size:10px;box-shadow:none}.chip.sm .ezm{font-size:7px}
.chip .badge{position:absolute;top:-3px;right:-3px;z-index:2;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font:700 11px/20px var(--fm);text-align:center;padding:0 5px;box-shadow:0 0 0 2px var(--felt)}

/* ---------- boot ---------- */
.boot{position:fixed;inset:0;z-index:9999;background:var(--felt);display:grid;place-items:center;transition:opacity .5s ease}
.boot.gone{opacity:0;pointer-events:none}
.boot-in{text-align:center}
.boot .ezm{font-size:64px;padding:.12em .3em}
.boot p{margin:18px 0 0;font:500 12px/1.4 var(--fm);color:#9fb3a8;letter-spacing:.06em}
.boot i{display:block;width:180px;height:3px;background:var(--felt3);margin:16px auto 0;border-radius:2px;overflow:hidden}
.boot i::after{content:"";display:block;height:100%;width:40%;background:var(--gold);animation:bootbar .9s var(--ease) infinite}
@keyframes bootbar{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

/* ---------- wallpaper: the bullseye of every call ever made ---------- */
.wall{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:radial-gradient(120% 90% at 78% 55%,var(--felt3) 0,var(--felt2) 35%,var(--felt) 75%)}
.wall::before{content:"";position:absolute;inset:0;opacity:.35;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:5px 5px}
.wall-eye{position:absolute;right:-6vmin;top:50%;transform:translateY(-46%);width:min(92vmin,880px);height:auto;opacity:.92}
.wall-words{position:absolute;right:4vw;bottom:84px;max-width:min(560px,46vw);text-align:right}
.wall-words .motto{font:600 12px/1 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.wall-words h1{margin:10px 0 0;font:800 clamp(30px,4.2vw,58px)/.95 var(--fd);letter-spacing:-.035em;color:var(--paper);text-wrap:balance}
.wall-words h1 em{font-style:normal;color:var(--green)}
.wall-foot{position:absolute;left:24px;bottom:18px;font:500 10.5px/1.6 var(--fm);color:#7f978a;letter-spacing:.02em}

/* ---------- menu bar ---------- */
.mbar{position:fixed;top:0;left:0;right:0;height:36px;z-index:5000;display:flex;align-items:center;gap:6px;padding:0 10px;
  background:rgba(8,12,10,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}
.mb-btn{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 9px;border-radius:7px;color:#dfe7e1;text-decoration:none;white-space:nowrap}
.mb-btn:hover,.mb-btn[aria-expanded="true"]{background:rgba(255,255,255,.09)}
.mb-logo .ezm{font-size:13px}
.mb-logo b.os{font-weight:800;letter-spacing:-.01em}
.mb-sp{flex:1}
.mb-live{background:rgba(240,191,52,.12);color:var(--paper);box-shadow:inset 0 0 0 1px rgba(240,191,52,.35)}
.mb-live .co-mark{font-size:11px;width:18px;height:18px;border-radius:5px}
.mb-live small{color:#b9c8bf;font:500 11px var(--fm)}
.mb-clock{font:500 12px var(--fm);color:#dfe7e1;padding:0 8px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,90,79,.7);animation:pulse 1.6s infinite;flex:none;display:inline-block}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,79,.6)}80%,100%{box-shadow:0 0 0 9px rgba(255,90,79,0)}}
.menu{position:fixed;top:40px;left:8px;z-index:6000;min-width:250px;background:rgba(18,24,21,.96);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:6px;box-shadow:0 24px 60px -10px rgba(0,0,0,.7)}
.menu[hidden]{display:none}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:#e6ece8;text-align:left;font-size:14px}
.menu a:hover,.menu button:hover,.menu a:focus-visible,.menu button:focus-visible{background:rgba(255,255,255,.08)}
.menu kbd{margin-left:auto;font:500 11px var(--fm);color:#8da096}
.menu hr{border:0;border-top:1px solid rgba(255,255,255,.08);margin:5px 4px}

/* ---------- desktop ---------- */
.desk{position:fixed;inset:36px 0 0 0;z-index:1}
.icons{position:absolute;left:14px;top:14px;bottom:70px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,90px);grid-auto-columns:96px;gap:2px 6px;align-content:start}
.ic{display:flex;flex-direction:column;align-items:center;gap:7px;padding:6px 2px;border-radius:12px;text-decoration:none;color:var(--paper);font-size:12.5px;font-weight:600;text-align:center;line-height:1.15}
.ic span.l{padding:1px 6px;border-radius:5px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.icons .chip{width:56px;height:56px}
.ic:hover .chip{transform:translateY(-3px) rotate(-12deg)}
.ic:focus-visible{outline:none}.ic:focus-visible span.l{background:var(--gold);color:#111;text-shadow:none}
.ic:focus-visible .chip{box-shadow:0 0 0 3px var(--gold),0 7px 16px -4px rgba(0,0,0,.6)}
.shelf{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:4000;display:flex;gap:6px;padding:7px;border-radius:40px;background:rgba(8,12,10,.72);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09);max-width:calc(100vw - 260px);overflow-x:auto;scrollbar-width:none}
.shelf:empty{display:none}
.shelf button{display:flex;align-items:center;gap:7px;height:34px;padding:0 13px 0 6px;border-radius:20px;color:#dfe7e1;font-size:12.5px;font-weight:600;white-space:nowrap}
.shelf button:hover{background:rgba(255,255,255,.08)}
.shelf button.on{background:var(--paper);color:var(--ink)}
.shelf-hint{position:fixed;right:18px;bottom:18px;z-index:2;font:500 11px var(--fm);color:#7f978a}
.shelf-hint kbd{border:1px solid #3a4a42;border-radius:4px;padding:1px 5px}

/* ---------- windows (paper bet slips) ---------- */
.wins{position:fixed;inset:36px 0 0 0;z-index:10;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border-radius:14px;overflow:hidden;
  box-shadow:0 0 0 1.5px #050706,0 30px 70px -18px rgba(0,0,0,.75),0 8px 18px -8px rgba(0,0,0,.5);min-width:320px;min-height:240px;resize:both;
  --bg:var(--paper);--ink2:#5b5a52;--line:#cfc6ae;--hi:var(--greenD);animation:winin .28s var(--ease)}
@keyframes winin{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.win.closing{animation:winout .18s ease forwards}
@keyframes winout{to{opacity:0;transform:scale(.96) translateY(6px)}}
.wt{flex:none;height:42px;display:flex;align-items:center;gap:9px;padding:0 8px 0 12px;background:#141714;color:#e9e3d2;cursor:grab;user-select:none;touch-action:none;position:relative}
.wt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ac,var(--gold));opacity:.25;transition:opacity .2s}
.win.focus .wt::after{opacity:1}
.win:not(.focus) .wt{color:#9a9789}
.win:focus{outline:none}
.win:focus-visible .wt{box-shadow:inset 0 0 0 3px var(--gold)}
.wt-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-file{font:500 11px var(--fm);color:#8b8a7f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wt-sp{flex:1}
.wt-b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;color:#e9e3d2}
.wt-b:hover{background:rgba(255,255,255,.1)}
.wt-x{background:var(--red);color:#1a0705}.wt-x:hover{background:#ff7a70}
.wt-b svg{width:12px;height:12px}
.wt-back{display:none}
.wb{flex:1;overflow:auto;overscroll-behavior:contain;container-type:inline-size;scroll-behavior:smooth}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 64px)!important;border-radius:0 0 14px 14px}

/* ---------- phone home ---------- */
.home{display:none}
@media (max-width:759px){
  body{font-size:15px}
  .mbar,.desk,.shelf,.shelf-hint,.wall-words,.wall-foot{display:none}
  .wall-eye{right:auto;left:50%;top:-8%;transform:translateX(-50%);width:150vw;opacity:.5}
  .home{display:flex;flex-direction:column;position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 120px}
  .wins{inset:0;z-index:100}
  .win{position:fixed!important;left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;resize:none;min-width:0;
    box-shadow:none;transform:translateX(0);animation:slidein .3s var(--ease);visibility:hidden}
  .win.top{visibility:visible}
  .win.under{visibility:visible}
  @keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
  .win.closing{animation:slideout .22s ease forwards}
  @keyframes slideout{to{transform:translateX(100%)}}
  .wt{height:54px;padding:env(safe-area-inset-top) 10px 0 6px;cursor:default}
  .wt .chip.sm,.wt-max{display:none}
  .wt-back{display:flex;align-items:center;gap:2px;height:38px;padding:0 10px 0 4px;border-radius:10px;color:var(--gold);font-weight:700;font-size:15px;flex:none}
  .wt-back svg{width:20px;height:20px}
  .wt-name{font-size:15px}
  .wt-file{display:none}
  .wt-x{display:none}
}
.sbar{display:flex;align-items:center;justify-content:space-between;height:44px;font:600 14px var(--fm);color:var(--paper);position:sticky;top:0;z-index:3;margin:0 -16px;padding:0 20px;background:linear-gradient(var(--felt) 60%,transparent)}
.sbar a{display:flex;align-items:center;gap:7px;text-decoration:none;font-size:12px;background:rgba(240,191,52,.14);padding:4px 10px;border-radius:20px;box-shadow:inset 0 0 0 1px rgba(240,191,52,.35)}
.h-hello{margin:8px 2px 14px;display:flex;align-items:center;gap:12px}
.h-hello .ezm{font-size:22px}
.h-hello div{line-height:1.2}
.h-hello b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.h-hello small{font:500 11px var(--fm);color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.home>*{flex:none}
.lock{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border-radius:22px;padding:16px 16px 14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.8);position:relative;overflow:hidden}
.lock .k{display:flex;align-items:center;gap:8px;font:700 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--redD)}
.lock h2{margin:8px 0 2px;font:800 26px/1.05 var(--fd);letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.lock h2 .co-mark{font-size:15px}
.lock p{margin:0;color:var(--ink2);font-size:14px}
.lock .calls4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
.lock .calls4 div{background:var(--paper2);border-radius:12px;padding:8px 4px;text-align:center}
.lock .calls4 .lg{font-size:15px}
.lock .calls4 b{display:block;font:700 14px var(--fm);color:var(--greenD);margin-top:4px}
.lock .calls4 b.dn{color:var(--redD)}
.lock .calls4 small{display:block;font-size:11px;color:var(--ink2)}
.lock .cd{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
.lock .cd b{font:800 18px var(--fm)}
.lock .go{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);border-radius:20px;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.note{display:flex;gap:11px;align-items:flex-start;margin:12px 0 0;padding:12px 14px;border-radius:18px;background:rgba(242,236,221,.12);backdrop-filter:blur(10px);color:var(--paper);text-decoration:none;font-size:13.5px;line-height:1.35;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.note .ezm{font-size:11px;margin-top:2px}
.note b{display:block;font-size:12px;font:600 11px var(--fm);color:var(--gold);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.h-search{display:flex;align-items:center;gap:8px;margin:16px 0 4px;height:42px;border-radius:21px;padding:0 16px;background:rgba(255,255,255,.08);color:#b9c8bf;font-size:14px;width:100%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.h-search svg{width:16px;height:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;margin-top:18px}
.grid .ic{font-size:11.5px;padding:2px 0}
.grid .chip{width:60px;height:60px}
.dock{position:fixed;left:12px;right:12px;bottom:12px;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 6px 8px;border-radius:28px;background:rgba(18,26,22,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.dock .ic{font-size:11px;gap:5px}
.dock .chip{width:56px;height:56px}
@media (min-width:760px){.dock{display:none}}
.h-foot{margin:22px 4px 0;font:500 10px/1.6 var(--fm);color:#7f978a;text-align:center}

/* notification banner */
.toast{position:fixed;z-index:8000;top:46px;right:14px;width:min(380px,calc(100vw - 24px));display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:16px;
  background:rgba(242,236,221,.97);color:var(--ink);box-shadow:0 22px 50px -14px rgba(0,0,0,.8);transform:translateY(calc(-100% - 80px));visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s;text-decoration:none}
.toast.in{transform:none;visibility:visible;transition:transform .45s var(--ease)}
.toast .ezm{font-size:13px;margin-top:2px}
.toast b{display:block;font:700 11px var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--goldD)}
.toast p{margin:2px 0 0;font-size:14px;line-height:1.35}
.toast .tx{margin-left:auto;width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--ink2)}
@media (max-width:759px){.toast{top:8px;left:12px;right:12px;width:auto}}

/* go palette */
.pal{position:fixed;inset:0;z-index:9000;background:rgba(4,7,6,.55);display:flex;justify-content:center;align-items:flex-start;padding:12vh 12px 12px}
.pal[hidden]{display:none}
.pal-in{width:min(560px,100%);background:var(--paper);color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px -10px rgba(0,0,0,.8)}
.pal-in label{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;height:54px;border:0;background:none;font:600 17px var(--fd);color:var(--ink);outline:none;min-width:0}
.pal-in ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto}
.pal-in li a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;font-weight:600}
.pal-in li a code{margin-left:auto;font:500 11px var(--fm);color:var(--ink2)}
.pal-in li a.sel,.pal-in li a:hover{background:var(--ink);color:var(--paper)}
.pal-in li a.sel code,.pal-in li a:hover code{color:#b5b09f}
.pal-in .chip.sm{width:24px;height:24px}

/* ---------- inside windows ---------- */
.pg{padding:20px 22px 28px}
@container (max-width:460px){.pg{padding:16px 16px 26px}}
.kick{display:flex;align-items:center;gap:8px;font:700 11px/1.2 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
.kick.red{color:var(--redD)}
.h1{margin:0;font:800 34px/1 var(--fd);letter-spacing:-.035em;text-wrap:balance}
@container (max-width:460px){.h1{font-size:28px}}
.h2{margin:26px 0 10px;font:800 21px/1.1 var(--fd);letter-spacing:-.025em;text-wrap:balance}
.lede{margin:8px 0 0;font-size:16px;color:#3b3a34;max-width:60ch;text-wrap:pretty}
.mut{color:var(--ink2)}
.fine{font-size:12.5px;color:var(--ink2);line-height:1.45;margin:10px 0 0}
.up{color:var(--greenD)}.dn{color:var(--redD)}
.tag{display:inline-flex;align-items:center;gap:5px;font:700 10.5px/1 var(--fm);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:20px;background:var(--paper2);color:var(--ink);white-space:nowrap}
.tag.wtag{background:var(--ink);color:var(--gold)}
.tag.none{background:var(--redD);color:#fff}
.tag.live{background:var(--red);color:#fff}
.tag .lg{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:21px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{background:#2a2e2a}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:var(--paper2)}
.btn[disabled],.btn[aria-disabled="true"]{background:var(--paper3);color:#777263;cursor:not-allowed;box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.card{background:#fbf7ec;border-radius:14px;padding:14px;box-shadow:inset 0 0 0 1px var(--line)}
.hr{border:0;border-top:1px dashed var(--line);margin:22px 0}
.split{display:grid;gap:12px;grid-template-columns:1fr}
@container (min-width:560px){.split.two{grid-template-columns:1fr 1fr}}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
@container (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fbf7ec;border-radius:14px;padding:12px;box-shadow:inset 0 0 0 1px var(--line);min-width:0}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin-top:8px}

/* live */

.count{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:14px;border-radius:14px;background:var(--ink);color:var(--paper)}
.count small{display:block;font:600 10.5px var(--fm);letter-spacing:.06em;text-transform:uppercase;color:#a8a495}
.count b{font:800 28px/1.1 var(--fm);letter-spacing:-.04em;color:var(--gold)}
.count p{margin:2px 0 0;font-size:13px;color:#cfc9b8}
.mine{margin-top:18px;border-radius:16px;padding:16px;background:repeating-linear-gradient(-45deg,#fbf7ec 0 10px,#f6f0e1 10px 20px);box-shadow:inset 0 0 0 1.5px var(--ink)}
.mine h3{margin:0;font:800 19px/1.1 var(--fd);letter-spacing:-.02em}

/* rounds browser */
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}

.files{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.files li a{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:11px 6px;border-bottom:1px solid var(--line);text-decoration:none}

.files .fn{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@container (max-width:460px){.pin{padding:10px 11px}.pin b{font-size:18px}.pin span{font-size:12px;line-height:1.3;display:block}}
.pin{display:block;text-decoration:none;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--paper);position:relative}
.pin small{display:block;font:600 10.5px var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}

/* round file */
.film{position:relative;margin-top:14px;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1/1;max-height:62vh;width:100%}
.film video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.film .fname{position:absolute;left:10px;top:10px;font:500 11px var(--fm);color:#e8e2d0;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:6px;pointer-events:none}
.outc{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 18px;margin-top:14px}
.outc .big{font:800 56px/.9 var(--fm);letter-spacing:-.06em}

.tbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.tbl th{text-align:left;font:600 10.5px var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:6px 6px;border-bottom:1.5px solid var(--ink)}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}

.tbl th.n{text-align:right}

.pager{display:flex;justify-content:space-between;gap:8px;margin-top:20px}

/* leaderboard */
.lb{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}

@container (min-width:600px){.lbs{grid-template-columns:repeat(4,auto);justify-content:space-between}}
.lbs small{display:block;font:600 10px var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.lbs b{font:700 15px var(--fm);letter-spacing:-.03em;white-space:nowrap}
.lbs em{font-style:normal;font-size:12px;opacity:.75;font-family:var(--fd);font-weight:500}
.lb li:first-child .form i.n{box-shadow:inset 0 0 0 1.5px #555}
.recs{display:grid;gap:8px;grid-template-columns:1fr;margin-top:10px}
@container (min-width:600px){.recs{grid-template-columns:repeat(3,1fr)}}
.rec{border-radius:14px;padding:14px;background:#fbf7ec;box-shadow:inset 0 0 0 1px var(--line);text-decoration:none;display:block}
.rec small{display:block;font:600 10.5px var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.rec b{display:flex;align-items:center;gap:8px;font:800 22px/1.1 var(--fm);letter-spacing:-.04em;margin:8px 0 4px}
.rec b .lg{font-size:16px}

/* AI app */
.aihead{display:flex;align-items:center;gap:14px}
.aihead .lg{font-size:44px;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ac)}

.calllog{list-style:none;margin:10px 0 0;padding:0}

.calllog .rn{font:700 12px var(--fm);color:var(--ink2)}
.calllog .c{font:700 14px var(--fm);white-space:nowrap}

.eye text{font-family:var(--fm);font-size:10px;fill:var(--ink2)}

/* charts */
.chart{margin-top:10px;position:relative}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--fm);font-size:11px;fill:var(--ink2)}
.rc-labs{pointer-events:none}
.rc-l{position:absolute;left:0;font-size:12px;line-height:1.1;white-space:nowrap}
.rc-l b{display:block;font-weight:700}
.rc-l span{font:500 11px var(--fm);color:var(--ink2)}
.rc-lead b{color:var(--greenD)}

.rc-tip{position:absolute;top:0;width:190px;background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 10px;font-size:12px;pointer-events:none;z-index:3}

.rc-tip em{font-style:normal}.rc-tip em.u{color:var(--green)}.rc-tip em.d{color:var(--red)}
.rc-tu{opacity:.7}
.follow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
@container (min-width:560px){.follow{grid-template-columns:repeat(4,1fr)}}

/* versus */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:16px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.vs .side>.lg{font-size:40px}
.vs .side .seg{justify-content:center}.vs .side .seg button{padding:0 7px}
.vs .side b{font-size:18px}
.vs .mid{font:800 22px var(--fm);color:var(--ink2)}
.vrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow b{font:800 18px var(--fm);letter-spacing:-.03em}
.vrow .a{text-align:right}.vrow .m{font:600 10.5px var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:center;min-width:80px}
.vrow .best{background:#fff3c9;border-radius:8px;padding:2px 6px}
.vrow em{display:block;font-style:normal;font-size:12px;color:var(--ink2)}
.h2h{list-style:none;padding:0;margin:8px 0 0}
.h2h a{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;font-family:var(--fm);font-size:13px}
.h2h .r{text-align:center;font-family:var(--fd);font-weight:600;font-size:13px}
.h2h .a{text-align:right}
.h2h .w{font-weight:800;color:var(--greenD)}

/* findings */
.fnd{margin-top:12px;padding:16px;border-radius:16px;background:#fbf7ec;box-shadow:inset 0 0 0 1px var(--line)}
.fnd h3{margin:4px 0 0;font:800 22px/1.1 var(--fd);letter-spacing:-.025em;text-wrap:balance}
.fnd p{margin:8px 0 0}
.fnd .st{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px}
.fnd .st b{display:block;font:800 26px/1 var(--fm);letter-spacing:-.04em}
.fnd .st span{font-size:12.5px;color:var(--ink2)}
.fnd .now{margin-top:12px;font-weight:700;display:flex;gap:8px;align-items:center}
.fnd.fun{background:#ffe680;box-shadow:none;transform:rotate(-1deg);position:relative}
.fnd.fun::before{content:"joke.txt";position:absolute;right:12px;top:12px;font:700 10.5px var(--fm);background:var(--ink);color:#ffe680;padding:3px 7px;border-radius:5px}

/* calendar */
.season{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-top:14px}
@container (max-width:460px){.season{gap:2px}.season a{border-radius:3px}}
.season a{aspect-ratio:1;border-radius:4px;background:var(--paper2);display:block;position:relative}

.season a.g.nw{background:var(--redD)}
.season a.l{background:var(--red);animation:blink 1.4s infinite}

.season a.hl{outline:2px solid var(--goldD);outline-offset:1px}
.upc{list-style:none;padding:0;margin:8px 0 0}
.upc .day{font:700 11px var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:14px 0 4px;border-bottom:1.5px solid var(--ink)}
.upc .it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);scroll-margin-top:60px}
.upc .it .co-mark{font-size:13px}
.upc .it b{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upc .it small{font:500 11px var(--fm);color:var(--ink2);white-space:nowrap}
.upc .it.hl{background:#fff3c9}
.upc .it.live{background:#ffe1dc}

/* vault */
.splitbar{display:grid;grid-template-columns:var(--p) 1fr;height:120px;margin-top:16px;border-radius:16px;overflow:hidden}
.splitbar div{padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between}
.splitbar .p{background:var(--ink);color:var(--gold)}
.splitbar .o{background:var(--paper3);color:var(--ink)}
.splitbar b{font:800 44px/1 var(--fm);letter-spacing:-.06em}
.splitbar small{font:700 11px var(--fm);letter-spacing:.06em;text-transform:uppercase}
.outs{display:grid;gap:8px;grid-template-columns:1fr;margin-top:12px}
@container (min-width:560px){.outs{grid-template-columns:repeat(3,1fr)}}
.outs div{padding:14px;border-radius:14px;background:#fbf7ec;box-shadow:inset 0 0 0 1px var(--line)}
.outs b{display:block;font-size:16px}
.outs .w{box-shadow:inset 0 0 0 2px var(--greenD)}.outs .l{box-shadow:inset 0 0 0 2px var(--redD)}
.wipe{margin-top:14px;padding:16px;border-radius:14px;background:var(--redD);color:#fff;font:800 22px/1.15 var(--fd);letter-spacing:-.02em;display:flex;gap:12px;align-items:center}
.wipe svg{width:28px;height:28px;flex:none}
.steps{list-style:none;padding:0;margin:10px 0 0;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.steps li::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paper2);font:800 13px var(--fm)}
.steps li.now::before{background:var(--ink);color:var(--gold)}
.steps b{display:block}
.bet{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--paper)}
.bet .lg{font-size:24px}
.bet b{font:800 22px var(--fm);color:var(--gold)}

.calc{max-width:420px;margin:0 auto;background:#1a1d1a;border-radius:22px;padding:14px;box-shadow:inset 0 0 0 1px #000,0 2px 0 #2e332e inset}
.lcd{background:#c5d6a4;color:#18200f;border-radius:12px;padding:14px;box-shadow:inset 0 3px 10px rgba(0,0,0,.35);font-family:var(--fm)}
.lcd small{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.lcd .v{font-size:40px;font-weight:800;letter-spacing:-.05em;line-height:1.1;text-align:right}
.lcd p{margin:8px 0 0;font-size:12.5px;line-height:1.4;font-family:var(--fd);font-weight:600}
.lcd p b{font-family:var(--fm)}
.keys{display:grid;gap:8px;margin-top:14px}
.keys .kl{font:600 10.5px var(--fm);letter-spacing:.06em;text-transform:uppercase;color:#a8a495;margin-top:4px}
.keys .kr{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.keys button{height:46px;border-radius:12px;background:#2d322d;color:#efe9d8;font:700 14px var(--fm);box-shadow:0 3px 0 #0b0d0b;transition:transform .08s}
.keys button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0d0b}
.keys button[aria-pressed="true"]{background:var(--gold);color:#1b1500}
.keys .lev button[aria-pressed="true"]{background:var(--green);color:#03170b}

/* read me */
.doc{font-size:15.5px;max-width:64ch}
.doc .h1{font-size:38px}
.rules{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.rules li{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:12px;border-radius:14px;background:#fbf7ec;box-shadow:inset 0 0 0 1px var(--line)}
.rules li span{font:800 26px/1 var(--fm);color:var(--goldD)}
.rules b{display:block}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-top:10px}
.places a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#fbf7ec;text-decoration:none;font-size:13.5px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.places code{margin-left:auto;font:500 10.5px var(--fm);color:var(--ink2)}

/* installer */
.inst{display:grid;gap:0;margin-top:14px;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--ink)}
.inst li{list-style:none;display:grid;grid-template-columns:40px 1fr;gap:12px;padding:16px;border-bottom:1px dashed var(--line)}
.inst li:last-child{border:0}
.inst .ck{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--fm);background:var(--paper2)}
.inst b{display:block;font-size:16px}
.inst p{margin:3px 0 0;color:#3b3a34}
.prog{margin-top:16px;height:10px;border-radius:5px;background:var(--paper2);overflow:hidden}
.prog i{display:block;height:100%;width:34%;background:repeating-linear-gradient(-45deg,var(--ink) 0 8px,#444 8px 16px);animation:stripes 1s linear infinite;background-size:22.6px 22.6px}

.disc{margin-top:22px;padding:12px 14px;border-radius:12px;background:var(--paper2);font-size:13px;color:#3b3a34}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

function bull(el,W,ms,o){o=o||{};return host(el,W,function(w){var D=Math.min(w,o.max||420),c=D/2,rM=c-14,MAXOFF=24;

  s+='<circle cx="'+c+'" cy="'+c+'" r="4" fill="var(--ink)"/>';
  var k=0;ms.forEach(function(m,mi){S.shots[m].forEach(function(sh,j){var ang=(sh.r.n*137.508+mi*29)*Math.PI/180,rd=rr(sh.off),x=c+rd*Math.cos(ang),y=c+rd*Math.sin(ang);

/* hit rate over time */
function hitChart(el,W,ms){host(el,W,function(w){var H=w<460?220:260,pl=34,pr=w<460?96:124,pt=12,pb=26,N=R.length;
  var X=function(i){return pl+(w-pl-pr)*(i)/(N-1)},Y=function(p){return pt+(H-pt-pb)*(1-p/100)};
  var s='<svg width="'+w+'" height="'+H+'" role="img" aria-label="Hit rate after each round">';
  [0,50,100].forEach(function(p){s+='<line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+Y(p)+'" y2="'+Y(p)+'" stroke="var(--line)" '+(p===50?'stroke-dasharray="4 4"':'')+'/><text x="'+(pl-6)+'" y="'+(Y(p)+4)+'" text-anchor="end">'+p+'%</text>'});
  [0,Math.floor((N-1)/2),N-1].forEach(function(i){s+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">R'+R[i].n+'</text>'});
  var ends=[];ms.forEach(function(m){var pth=S.hitPath[m],d="",last=null;pth.forEach(function(p,i){if(!p)return;d+=(d?"L":"M")+X(i).toFixed(1)+","+Y(p.pct).toFixed(1);last={i:i,p:p}});
    s+='<path d="'+d+'" fill="none" stroke="'+ac(m)+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
    pth.forEach(function(p,i){if(p&&p.calls===1)s+='<circle cx="'+X(i)+'" cy="'+Y(p.pct)+'" r="3.5" fill="'+ac(m)+'"/>'});
    if(last){s+='<circle cx="'+X(last.i)+'" cy="'+Y(last.p.pct)+'" r="4.5" fill="'+ac(m)+'" stroke="var(--paper)" stroke-width="2"/>';ends.push({m:m,y:Y(last.p.pct),p:last.p})}});
  ends.sort(function(a,b){return a.y-b.y});for(var i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<30)ends[i].y=ends[i-1].y+30;
  var ov=ends.length?ends[ends.length-1].y-(H-pb+4):0;if(ov>0)ends.forEach(function(e){e.y-=ov});
  ends.forEach(function(e){s+='<text x="'+(w-pr+10)+'" y="'+(e.y-1)+'" style="fill:'+ac(e.m)+';font-weight:700;font-family:var(--fd);font-size:12.5px">'+S.nm(e.m)+' '+e.p.pct+'%</text><text x="'+(w-pr+10)+'" y="'+(e.y+12)+'">'+e.p.calls+' calls</text>'});
  el.innerHTML=s+'</svg>'})}

  $("#pLive").innerHTML='<span class="pulse"></span>R'+P.n+' · '+l;
  var my=CALLS[P.n];
  $("#lockCard").innerHTML='<span class="k"><span class="pulse"></span>Live now · Round '+P.n+' of '+S.total+'</span><h2>'+coMark(P.ticker)+esc(S.co(P))+'</h2><p>The calls are in. The market answers at the close.</p>'+
    '<div class="calls4">'+P.calls.map(function(c){return '<div>'+logo(c.m)+'<b class="'+(c.dir==="DOWN"?"dn":"")+'">'+S.liveTxt(c)+'</b><small>'+S.nm(c.m)+'</small></div>'}).join("")+'</div>'+
    '<div class="cd"><span>Graded '+fmtDate(P.resolves)+' in<br><b class="num">'+l+'</b></span><span class="go">'+(my?"Your call: "+(my.dir==="DOWN"?"▼":"▲")+" "+my.mag+"%":"Make your call ›")+'</span></div>';
  $$("[data-left]").forEach(function(e){e.textContent=l})}
function clock(){var d=new Date();$("#clock").textContent=d.toLocaleDateString([], {weekday:"short"})+" "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});$("#pclock").textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}

/* since: banner + home note */
function noteText(){if(CH)return {k:"Since your last visit",t:CH.graded.length+" new "+(CH.graded.length>1?"rounds":"round")+" graded: "+CH.graded.map(function(r){return "Round "+r.n+" "+r.co+" "+S.outTxt(r)}).join(", ")+"."+(CH.leadChanged?" New leader: "+S.nm(S.board[0].m)+".":""),h:"#round-"+CH.graded[CH.graded.length-1].n};
  if(hadPrev)return {k:"Welcome back",t:"Nothing new graded since your last visit."+(P?" Round "+P.n+" is still live.":""),h:"#live"};
  return {k:"Welcome to EZ OS",t:(P?"Round "+P.n+" · "+S.co(P)+" is live. The calls are in.":"")+" Every round and every AI has its own place here.",h:"#live"}}
var NT=noteText();
$("#hNote").innerHTML='<a class="note" href="'+NT.h+'">'+MARK+'<span><b>'+esc(NT.k)+'</b>'+esc(NT.t)+'</span></a>';
var toastT;function showToast(){var t=$("#toast");t.href=NT.h;t.innerHTML=MARK+'<span><b>'+esc(NT.k)+'</b><p>'+esc(NT.t)+'</p></span><span class="tx" aria-hidden="true">'+G.x+'</span>';
  t.classList.add("in");toastT=setTimeout(hideToast,CH?12000:7000)}
function hideToast(){clearTimeout(toastT);$("#toast").classList.remove("in")}
$("#toast").addEventListener("click",function(e){if(e.target.closest(".tx")){e.preventDefault()}hideToast()});

/* ---------- palette ---------- */
var PL=[["live","Live: Round "+(P?P.n+" · "+S.co(P):""),"live"],["rounds","Rounds: every graded call","rounds"],["leaderboard","Leaderboard and record holders","leaderboard"],["lab","Lab: are they learning?","lab"],["compare","Versus: compare two AIs","compare"],["findings","Unusual findings","findings"],["calendar","Calendar: what is coming","calendar"],["buyback","Vault: the buyback","buyback"],["calculator","Calculator: how big could it get?","calculator"],["readme","Read me: how it works","readme"],["rules","The four grading rules","readme"],["get","Get $EZ","get"]]
  .concat(S.models.map(function(m){return ["ai-"+slug(m),S.nm(m)+" · "+S.ver(m),"ai-"+slug(m)]}))
  .concat(R.slice().reverse().map(function(r){return ["round-"+r.n,"Round "+r.n+" · "+S.co(r)+" "+S.outTxt(r),"rounds"]}))
  .concat(UPCOMING.slice(0,12).map(function(u){return ["round-"+u.n,"Round "+u.n+" · "+S.co(u)+" (coming "+fmtDate(u.called)+")","calendar"]}));
var palSel=0,palPrev=null;
function palDraw(){var q=$("#palIn").value.trim().toLowerCase(),items=PL.filter(function(p){return !q||(p[1]+" "+p[0]).toLowerCase().indexOf(q)>-1}).slice(0,40);palSel=Math.min(palSel,Math.max(0,items.length-1));
  $("#palList").innerHTML=items.map(function(p,i){return '<li role="option" aria-selected="'+(i===palSel)+'"><a href="#'+p[0]+'" class="'+(i===palSel?"sel":"")+'">'+chip(p[2],"sm")+'<span>'+esc(p[1])+'</span><code>#'+p[0]+'</code></a></li>'}).join("")||'<li style="padding:12px;color:var(--ink2)">Nothing here by that name.</li>'}
function palOpen(){palPrev=document.activeElement;$("#pal").hidden=false;$("#palIn").value="";palSel=0;palDraw();$("#palIn").focus();closeMenu()}
function palClose(){$("#pal").hidden=true;if(palPrev&&palPrev.focus)palPrev.focus()}
$("#palIn").addEventListener("input",function(){palSel=0;palDraw()});
$("#palIn").addEventListener("keydown",function(e){var n=$$("#palList a").length;if(e.key==="ArrowDown"){palSel=(palSel+1)%n;palDraw();e.preventDefault()}else if(e.key==="ArrowUp"){palSel=(palSel-1+n)%n;palDraw();e.preventDefault()}else if(e.key==="Enter"){var a=$$("#palList a")[palSel];if(a){palPrev=null;$("#pal").hidden=true;location.hash=a.getAttribute("href")}e.preventDefault()}});
$("#pal").addEventListener("click",function(e){if(e.target.id==="pal")palClose();var a=e.target.closest("a");if(a){palPrev=null;$("#pal").hidden=true}});

/* ---------- menu ---------- */
function closeMenu(){$("#sysmenu").hidden=true;$("#mbLogo").setAttribute("aria-expanded","false")}
$("#mbLogo").addEventListener("click",function(){var m=$("#sysmenu");m.hidden=!m.hidden;this.setAttribute("aria-expanded",String(!m.hidden));if(!m.hidden)$("#sysmenu a").focus()});
$("#mbGo").addEventListener("click",palOpen);
$("#sysmenu").addEventListener("click",function(e){if(e.target.closest("a"))closeMenu()});
document.addEventListener("click",function(e){if(!e.target.closest("#sysmenu,#mbLogo"))closeMenu()});

/* ---------- global actions ---------- */
document.addEventListener("click",function(e){var t=e.target.closest("[data-act],[data-shelf]");if(!t)return;
  if(t.dataset.shelf!=null){var w=wins[+t.dataset.shelf];if(w){focusWin(w);setHash(w.tok,true)}return}
  var a=t.dataset.act,W=wins.filter(function(w){return w.el.contains(t)})[0];
  if(a==="palette"){palOpen();return}
  if(a==="showdesk"){wins.slice().forEach(function(w){closeWin(w,true)});setHash("home",true);closeMenu();focusDesk();return}
  if(!W)return;
  if(a==="close"){closeWin(W);return}
  if(a==="back"){goBack(W);return}
  if(a==="max"){W.el.classList.toggle("max");return}
  if(W.act)W.act(a,t)});
/* clicking a link to the place already on top just focuses it */
document.addEventListener("click",function(e){var a=e.target.closest('a[href^="#"]');if(!a)return;if(a.getAttribute("href")===location.hash){e.preventDefault();route(false)}});
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#pal").hidden?palOpen():palClose();return}
  if(e.key==="Escape"){if(!$("#pal").hidden){palClose();return}if(!$("#sysmenu").hidden){closeMenu();$("#mbLogo").focus();return}
    if($("#toast").classList.contains("in")){hideToast()}var t=topWin();if(t){isPhone()?goBack(t):closeWin(t)}return}
  if(e.key==="/"&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||"")){e.preventDefault();palOpen()}});
addEventListener("hashchange",function(){closeMenu();route(true)});
phoneMQ.addEventListener("change",function(){var t=topWin();if(t)focusWin(t)});

/* ---------- boot ---------- */
paintStatus();clock();setInterval(function(){clock();paintStatus()},30000);
(function(){var p=parse(location.hash);
  if(p.home&&!isPhone()){openWin(parse("#leaderboard")).tok="leaderboard";var L=openWin(parse("#live"));L.tok="live";
    var lb=wins[0].el,L0=deskLeft(),lw=Math.min(600,Math.round((innerWidth-L0-30)*.56));
    L.el.style.left=L0+"px";L.el.style.top="14px";L.el.style.width=lw+"px";
    if(innerWidth-L0-lw-28>=380){lb.style.left=(L0+lw+14)+"px";lb.style.top="14px";lb.style.width=(innerWidth-L0-lw-28)+"px"}else{lb.style.left=(innerWidth-Math.min(700,innerWidth-L0-12)-12)+"px";lb.style.top="60px"}history.replaceState(null,"","#live");lastHash="#live";renderShelf()}
  else if(!p.home){route(false)}
  var boot=$("#boot"),delay=RM.matches?0:650;setTimeout(function(){boot.classList.add("gone");setTimeout(function(){boot.remove()},600);if(!(isPhone()&&!wins.length))setTimeout(showToast,RM.matches?0:500)},delay)})();
})();
</script>
</body>
</html>
