<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EZ Higher or Lower</title>
<meta name="description" content="Earnings Zeason, played as a game. Call each number before it lands, then see how four AIs did against the market.">
<meta name="theme-color" content="#0b0c0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#0b0c0f;--bg2:#111318;--card:#16181e;--card2:#1d2027;--line:#2a2d36;--ink:#f4f1e9;--ink2:#a7a8b0;--ink3:#74767f;
  --up:#2ad47e;--dn:#ff5a48;--gold:#ffc84a;--hi:#ffc84a;
  --fd:"Big Shoulders Display","Oswald","Roboto Condensed","Arial Narrow","Liberation Sans Narrow",Impact,sans-serif;
  --fb:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --hud:56px;--gut:16px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip;-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hud) + 12px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--fb);overflow-x:clip;min-height:100vh;
  background-image:repeating-linear-gradient(0deg,transparent 0 47px,rgba(255,255,255,.025) 47px 48px);}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--fm)}
.u{color:var(--up)}.d{color:var(--dn)}.g{color:var(--gold)}

/* $EZ mark */
.ez{display:inline-flex;align-items:center;font:900 20px/1 var(--fd);background:#000;border-radius:8px;padding:6px 7px 5px;box-shadow:inset 0 0 0 1px #2b2b2b;letter-spacing:.01em}
.ez i{font-style:normal}.ez i:nth-child(1){color:#ffc72c}.ez i:nth-child(2){color:#1fcf6b}.ez i:nth-child(3){color:#ff4136}
.ez.xl{font-size:30px;border-radius:11px;padding:8px 9px 6px}

/* logos */
.lg{display:inline-grid;place-items:center;width:1em;height:1em;border-radius:.28em;flex:none;font-size:26px;vertical-align:middle}
.lg svg{width:62%;height:62%}
.co-mark{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#fff;overflow:hidden;flex:none;font:800 10px/1 var(--fb);color:#111;box-shadow:0 0 0 1px var(--line)}
.co-mark img{width:78%;height:78%;object-fit:contain}
.co-mark.dk{background:#000}
.co-mark.sm{width:30px;height:30px;border-radius:8px;font-size:8px}

/* HUD */
.hud{position:fixed;inset:0 0 auto 0;height:var(--hud);z-index:20;display:flex;align-items:center;gap:12px;padding:0 var(--gut);
  background:rgba(11,12,15,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hud .ez{font-size:17px;padding:5px 6px 4px}
.prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.prog-t{font:700 11px/1 var(--fm);letter-spacing:.08em;color:var(--ink2);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:3px}
.pip{flex:1;height:6px;border-radius:2px;background:var(--line);transition:background .3s}
.pip.cur{background:var(--ink)}
.pip.ok{background:var(--up)}.pip.no{background:var(--dn)}.pip.sk{background:var(--ink3)}.pip.lv{background:var(--gold)}
.score{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.score b{font:900 26px/1 var(--fd);color:var(--gold);font-variant-numeric:tabular-nums}
.score small{font:700 10px/1 var(--fm);color:var(--ink2);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.score.bump b{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35)}}
.snd{font:700 11px/1 var(--fm);color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:8px 10px;min-height:36px;white-space:nowrap}
.snd[aria-pressed="true"]{color:var(--bg);background:var(--gold);border-color:var(--gold)}

/* layout */
.wrap{padding:calc(var(--hud) + 18px) var(--gut) 0;max-width:1240px;margin:0 auto}
.rail{padding-bottom:6px}
.kick{font:700 12px/1.3 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.hero-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hero-top .kick b{color:var(--ink);font-weight:700}
h1{font:900 clamp(34px,9.2vw,62px)/.92 var(--fd);text-transform:uppercase;letter-spacing:-.005em}
h1 .u,h1 .d{display:inline}
.thesis{font:500 17px/1.4 var(--fb);color:var(--ink);margin-top:12px;max-width:36ch}
.thesis b{font-weight:700}
.motto{margin-top:12px;font:700 13px/1.3 var(--fm);color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.howto{display:none;margin-top:12px;font-size:15px;color:var(--ink2);max-width:38ch}
.allbtn{margin-top:2px;font:600 15px/1 var(--fb);color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--ink3);padding:12px 0;min-height:44px}
.rail .vs{display:none}

/* the run */
#run{position:relative}
.q{position:relative;padding:30px 0 0;margin-top:22px;border-top:1px dashed var(--line);scroll-margin-top:calc(var(--hud) + 8px)}
.q:first-child{margin-top:18px}
.q::after{content:"";position:absolute;inset:0 calc(var(--gut)*-1);pointer-events:none;opacity:0;z-index:-1}
.q.fl-up::after{background:radial-gradient(120% 60% at 50% 40%,rgba(42,212,126,.28),transparent 70%);animation:flash 1.6s ease-out}
.q.fl-dn::after{background:radial-gradient(120% 60% at 50% 40%,rgba(255,90,72,.28),transparent 70%);animation:flash 1.6s ease-out}
.q.fl-gold::after{background:radial-gradient(120% 60% at 50% 40%,rgba(255,200,74,.22),transparent 70%);animation:flash 1.6s ease-out}
@keyframes flash{15%{opacity:1}100%{opacity:0}}
.q-k{display:flex;align-items:center;gap:10px;font:700 12px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.q-k .no{color:var(--bg);background:var(--ink);padding:4px 6px;border-radius:4px}
.q-k .no.done{background:var(--ink3)}
.q-t{font:900 clamp(34px,9.6vw,72px)/.94 var(--fd);text-transform:uppercase;margin-top:14px;letter-spacing:-.003em;overflow-wrap:break-word}
.q-t:focus{outline:none}
.q-t em{font-style:normal;color:var(--gold)}
.q-s{margin-top:16px}
.q.enter .q-k,.q.enter .q-t,.q.enter .q-s{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.q.enter .q-t{animation-delay:.06s}.q.enter .q-s{animation-delay:.14s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}

.rowco{display:flex;align-items:center;gap:12px;font:600 15px/1.3 var(--fb);color:var(--ink2)}
.rowco .lg{font-size:44px}
.rowco b{display:block;color:var(--ink);font:800 22px/1.1 var(--fd);text-transform:uppercase}

/* the answer bar: low and big, in thumb reach */
.bar{position:relative;padding:4px 0 0;margin-top:22px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.n3{grid-template-columns:1fr 1fr 1fr}
.opt{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:76px;padding:10px 12px;border-radius:16px;
  font:900 27px/1 var(--fd);text-transform:uppercase;letter-spacing:.01em;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);
  transition:transform .12s,background .2s,box-shadow .2s,opacity .3s;touch-action:manipulation;text-align:center}
.opt:hover{box-shadow:inset 0 0 0 2px var(--ink2)}
.opt:active{transform:scale(.97)}
.opt .ar{font-size:.85em}
.opt.o-up{color:var(--up);box-shadow:inset 0 0 0 2px rgba(42,212,126,.55);background:rgba(42,212,126,.07)}
.opt.o-dn{color:var(--dn);box-shadow:inset 0 0 0 2px rgba(255,90,72,.55);background:rgba(255,90,72,.07)}
.opt.o-up:hover{background:rgba(42,212,126,.16)}.opt.o-dn:hover{background:rgba(255,90,72,.16)}
.opt.o-ai{font-size:24px;justify-content:flex-start;padding-left:14px}
.opt.o-ai .lg{font-size:34px}
.opt.wide{grid-column:1/-1;min-height:60px;font-size:22px}
.opt small{display:block;font:600 12px/1.2 var(--fb);text-transform:none;letter-spacing:0;color:var(--ink2);margin-top:3px}
.opt kbd{position:absolute;top:7px;right:9px;font:700 10px/1 var(--fm);color:var(--ink3)}
@media (hover:none){.opt kbd{display:none}}
.skip{display:block;margin:6px auto 0;min-height:44px;padding:10px 14px;font:600 15px/1 var(--fb);color:var(--ink2);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--ink3)}
.skip:hover{color:var(--ink)}
.bar.done{padding-top:4px}
.bar.done .skip{display:none}
.bar.done .opt{min-height:52px;font-size:20px;opacity:.28;box-shadow:inset 0 0 0 1px var(--line);background:transparent;color:var(--ink2)}
.bar.done .opt.o-ai .lg{font-size:24px}
.bar.done .opt kbd{display:none}
.bar.done .opt.pick{opacity:1;color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold);background:rgba(255,200,74,.08)}
.bar.done .opt.truth{opacity:1;color:var(--ink)}
.bar.done .opt.truth::after{content:"Answer";position:absolute;top:-8px;left:12px;font:700 10px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:3px 5px;border-radius:3px}
.bar.done .opt.pick.truth::after{background:var(--up)}
.opt:disabled{cursor:default}
.opt:disabled:active{transform:none}

/* reveal */
.rev{padding:6px 0 4px}
.rev[hidden]{display:none}
.verdict{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.stamp{display:inline-block;font:700 13px/1 var(--fm);letter-spacing:.14em;text-transform:uppercase;border:2px solid currentColor;border-radius:6px;padding:7px 9px 6px;transform:rotate(-4deg)}
.stamp.ok{color:var(--up)}.stamp.no{color:var(--dn)}.stamp.sk{color:var(--ink2)}.stamp.lv{color:var(--gold)}
.verdict .yc{font:600 14px/1.3 var(--fb);color:var(--ink2)}
.anim .stamp{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(2.4)}}
.big{position:relative;min-width:0;margin:10px 0 4px;color:var(--ink);line-height:.84;padding:6px 0}
.big .bn{position:relative;z-index:1;display:inline-block;font:900 120px/.86 var(--fd);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big .bu{display:inline-block;font:800 26px/1 var(--fd);text-transform:uppercase;margin-left:8px;color:var(--ink2);vertical-align:top}
.big .lab{display:block;font:700 12px/1.2 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.big.t-up{color:var(--up)}.big.t-dn{color:var(--dn)}.big.t-gold{color:var(--gold)}
.big .spark{position:absolute;left:0;right:0;top:0;bottom:0;width:100%;height:100%;z-index:0;opacity:.38;color:inherit;overflow:visible}
.big .spark path{fill:none;stroke:currentColor;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.anim .big .spark path{animation:draw 1.2s .2s cubic-bezier(.4,0,.2,1) both}
@keyframes draw{from{stroke-dashoffset:1}}
.anim .big .bn{animation:slam .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{from{opacity:0;transform:translateY(18px) scale(.6)}}
.big.who .bn{display:inline-flex;align-items:center;gap:.16em}
.big.who .lg{font-size:.8em}
.duo{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:12px 0 4px}
.duo .big{margin:0}
.ctx{font:600 20px/1.35 var(--fb);max-width:32ch;margin-top:10px}
.ctx b{font-weight:700}
.note{font-size:14px;color:var(--ink2);max-width:52ch;margin-top:10px}
.blk{margin-top:26px}
.blk h3{font:900 30px/1 var(--fd);text-transform:uppercase;margin-bottom:10px}
.blk h4{font:700 12px/1.3 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.blk p{max-width:56ch}
.anim .st1{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.next{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin:28px 0 10px;min-height:68px;padding:12px 20px;border-radius:16px;background:var(--gold);color:#16120a;
  font:900 26px/1 var(--fd);text-transform:uppercase;text-align:left}
.next small{display:block;font:700 11px/1.2 var(--fm);letter-spacing:.08em;margin-bottom:4px;opacity:.75}
.next:hover{filter:brightness(1.06)}
.next[hidden]{display:none}

/* calls */
.calls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.call{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card);min-width:0}
.call b{font:700 15px/1.1 var(--fb);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call span{margin-left:auto;font:900 22px/1 var(--fd);font-variant-numeric:tabular-nums;white-space:nowrap}
.call.up span{color:var(--up)}.call.dn span{color:var(--dn)}
.anim .call{animation:flip .5s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i)*110ms)}
@keyframes flip{from{opacity:0;transform:perspective(500px) rotateX(-80deg)}}

/* lanes: each call against the real move */
.lanes{margin-top:8px}
.lane{display:grid;grid-template-columns:84px 1fr 78px;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line)}
.ln-n{display:flex;align-items:center;gap:8px;font:700 14px/1 var(--fb);min-width:0}
.ln-n .lg{font-size:22px}
.ln-t{position:relative;height:46px}
.ln-t .z{position:absolute;top:10px;bottom:10px;width:1px;background:var(--line)}
.ln-t .act{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px}
.ln-t .gap{position:absolute;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--ink3)}
.ln-t .gap.bad{background:rgba(255,90,72,.55)}
.ln-t .dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--bg)}
.ln-t .dot.up{background:var(--up)}.ln-t .dot.dn{background:var(--dn)}
.ln-t .dot.win{box-shadow:0 0 0 3px var(--gold)}
.ln-d{text-align:right;font:900 20px/1 var(--fd);font-variant-numeric:tabular-nums}
.ln-d small{display:block;white-space:nowrap;font:600 11px/1.2 var(--fb);color:var(--ink2);margin-top:2px}
.ln-d.win{color:var(--gold)}
.ln-head{display:grid;grid-template-columns:84px 1fr 78px;gap:10px;font:700 11px/1.2 var(--fm);color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;padding-bottom:6px;border-bottom:1px solid var(--line)}
.ln-head .ah{position:relative;height:16px}
.ln-head .ah span{position:absolute;white-space:nowrap;transform:translateX(-50%)}
.ln-head .ah span.r{transform:translateX(-100%)}.ln-head .ah span.l{transform:none}
.ln-head span:last-child{text-align:right}
.anim .lane{animation:rise .5s both;animation-delay:calc(var(--i)*90ms + .2s)}

/* rules */
.rules{list-style:none;counter-reset:r;display:grid;gap:10px}
.rules li{counter-increment:r;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:12px;background:var(--card)}
.rules li::before{content:counter(r);font:900 34px/1 var(--fd);color:var(--gold)}
.rules b{display:block;font:700 16px/1.3 var(--fb)}
.rules span{color:var(--ink2);font-size:15px}

/* standings */
.stand{list-style:none;display:grid;gap:10px}
.st{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px 12px;padding:14px;border-radius:14px;background:var(--card)}
.st.top{box-shadow:inset 0 0 0 2px var(--gold)}
.st-r{font:900 30px/1 var(--fd);color:var(--ink2);width:20px;text-align:center}
.st.top .st-r{color:var(--gold)}
.st .lg{font-size:34px}
.st-n b{display:block;font:800 22px/1 var(--fd);text-transform:uppercase}
.st-n small{display:block;color:var(--ink2);font-size:13px;margin-top:3px}
.st-w{text-align:right}
.st-w b{display:block;font:900 34px/1 var(--fd)}
.st-w small{font:700 10px/1 var(--fm);color:var(--ink2);text-transform:uppercase;letter-spacing:.08em}
.st-s{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;padding-top:10px;border-top:1px solid var(--line)}
.st-s div{min-width:0}
.st-s dt{font:700 10px/1.2 var(--fm);color:var(--ink2);text-transform:uppercase;letter-spacing:.08em}
.st-s dd{font:800 19px/1.15 var(--fd);font-variant-numeric:tabular-nums;margin-top:3px}
.st-s dd small{font:600 12px/1 var(--fb);color:var(--ink2);margin-left:4px}
.form{display:flex;gap:4px;margin-top:5px}
.form i{width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;font:700 9px/1 var(--fm);font-style:normal;color:#0b0c0f}
.form .w{background:var(--gold)}.form .g{background:var(--up)}.form .r{background:var(--dn)}.form .n{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink3);color:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .form{margin:0}

/* charts */
.chart{position:relative;margin-top:8px;min-height:120px}
.chart svg text{font-family:var(--fb)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tab{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:6px 12px 6px 7px;border-radius:999px;background:var(--card);font:700 14px/1 var(--fb);box-shadow:inset 0 0 0 1.5px var(--line)}
.tab .lg{font-size:26px}
.tab[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--gold);background:var(--card2)}
.eye-sum{font-size:14px;color:var(--ink2);margin-top:8px;text-align:center}
.eye-wrap{display:flex;justify-content:center}
.rc-l{position:absolute;left:0;display:flex;flex-direction:column;line-height:1.05;white-space:nowrap}
.rc-l b{font:700 12px/1.1 var(--fb);color:var(--ink2)}
.rc-l span{font:800 17px/1 var(--fd);font-variant-numeric:tabular-nums;color:var(--ink2)}
.rc-l.rc-lead b,.rc-l.rc-lead span{color:var(--ink)}
.rc-l.rc-lead span{background:var(--hi);color:#16120a;padding:1px 4px;border-radius:4px;margin-left:-4px}
.rc-l.rc-up b,.rc-l.rc-up span{color:var(--ink)}
.rc-tip{position:absolute;top:6px;width:190px;padding:10px 12px;border-radius:12px;background:#24262e;color:var(--ink);font:500 13px/1.35 var(--fb);pointer-events:none;z-index:2;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.rc-tip p{font-weight:700;margin-bottom:6px}.rc-tip em{font-style:normal}.rc-tip .u{color:var(--up)}.rc-tip .d{color:var(--dn)}
.rc-tip div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.rc-tip .rc-tu{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;color:var(--ink2)}

/* money bars */
.bars{display:grid;gap:8px}
.br{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.br-n{display:flex;align-items:center;gap:8px;font:700 14px/1 var(--fb)}
.br-n .lg{font-size:22px}
.br-t{position:relative;height:38px;border-radius:8px;background:var(--bg2);overflow:hidden}
.br-f{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--card2);transform-origin:left;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.br-f.up{background:rgba(42,212,126,.25)}.br-f.dn{background:rgba(255,90,72,.22)}.br-f.al{background:repeating-linear-gradient(135deg,rgba(255,200,74,.28) 0 6px,rgba(255,200,74,.14) 6px 12px)}
.br-v{position:absolute;inset:0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;font:800 19px/1 var(--fd);font-variant-numeric:tabular-nums;white-space:nowrap}
.br-v small{font:700 14px/1 var(--fd)}
.br-stake{position:absolute;top:0;bottom:0;width:2px;background:var(--ink3);z-index:1}

/* findings */
.fd-tag{display:inline-block;font:700 11px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:4px;background:var(--card2);color:var(--ink2);margin-bottom:8px}
.fd-tag.fun{background:var(--gold);color:#16120a}
.fd-h{font:900 34px/.98 var(--fd);text-transform:uppercase;max-width:20ch}
.fd-x{margin-top:10px;font-size:17px;max-width:46ch}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.stat{padding:12px 14px;border-radius:12px;background:var(--card);min-width:0}
.stat b{display:block;font:900 30px/1 var(--fd);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:13px;color:var(--ink2);margin-top:4px}
.now{margin-top:12px;padding:10px 12px;border-left:3px solid var(--gold);font:600 15px/1.4 var(--fb)}

/* records */
.recs{display:grid;gap:8px}
.rec{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--card)}
.rec .lg{font-size:34px}
.rec small{display:block;font:700 10px/1.2 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.rec b{display:block;font:800 21px/1.1 var(--fd);text-transform:uppercase;margin-top:3px}
.rec span{display:block;font-size:14px;color:var(--ink2);margin-top:2px}
.streak{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.streak div{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:10px;background:var(--card);font:600 14px/1.2 var(--fb)}
.anim .streak div{animation:rise .5s both}.anim .streak div:nth-child(2){animation-delay:.12s}.anim .streak div:nth-child(3){animation-delay:.24s}

/* the record list */
.log{list-style:none;display:grid;gap:10px}
.lr{padding:12px;border-radius:14px;background:var(--card)}
.lr-h{display:grid;grid-template-columns:68px 1fr auto;gap:12px;align-items:center}
.thumb{position:relative;width:68px;height:68px;border-radius:10px;overflow:hidden;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:18px;color:#fff;background:rgba(0,0,0,.28);text-shadow:0 1px 4px #000}
.lr-t small{display:block;font:700 10px/1.2 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.lr-t b{display:block;font:800 21px/1.05 var(--fd);text-transform:uppercase;margin:3px 0}
.lr-t span{display:block;font-size:12px;color:var(--ink2)}
.lr-o{font:900 30px/1 var(--fd);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lr-c{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.cc{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;background:var(--bg2);font:600 13px/1.1 var(--fb);min-width:0}
.cc .lg{font-size:20px}
.cc .ct{font:800 16px/1 var(--fd);white-space:nowrap}
.cc .cd{margin-left:auto;font:700 12px/1 var(--fm);color:var(--ink2);white-space:nowrap}
.cc.bad .ct{color:var(--dn)}.cc.okc .ct{color:var(--up)}
.cc.win{box-shadow:inset 0 0 0 2px var(--gold)}
.cc.win .cd{color:var(--gold)}
.lr-w{margin-top:8px;font:700 12px/1.2 var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:6px}
.lr-w .lg{font-size:18px}
.lr-w.none{color:var(--dn)}
.hl{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.hl div{padding:12px;border-radius:12px;background:var(--card)}
.hl small{display:block;font:700 10px/1.2 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.hl b{display:block;font:900 26px/1 var(--fd);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.hl span{display:block;font-size:13px;color:var(--ink2)}
.quote{font:800 26px/1.05 var(--fd);text-transform:uppercase}
.filmbtn{display:inline-flex;align-items:center;gap:12px;margin-top:16px;padding:8px 16px 8px 8px;border-radius:14px;background:var(--card);font:700 15px/1.2 var(--fb);min-height:60px;text-align:left}
.filmbtn .thumb{width:52px;height:52px}
.filmbtn small{display:block;font-weight:500;color:var(--ink2);font-size:13px}

/* live */
.livecard{padding:14px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 2px rgba(255,200,74,.35)}
.livetag{display:inline-flex;align-items:center;gap:8px;font:700 11px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.livetag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.up5{list-style:none;display:grid;gap:6px}
.up5 li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--card);font:600 15px/1.2 var(--fb)}
.up5 li small{margin-left:auto;color:var(--ink2);font:700 11px/1 var(--fm);white-space:nowrap}
.season{margin-top:14px}
.season .trk{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.season .trk i{display:block;height:100%;background:var(--gold)}
.season p{font:700 12px/1.2 var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-top:6px}

/* the pot */
.split{display:flex;height:64px;border-radius:14px;overflow:hidden;margin-top:6px}
.split div{display:flex;align-items:center;padding:0 14px;font:900 28px/1 var(--fd)}
.split .p1{background:var(--gold);color:#16120a}
.split .p2{background:var(--card2);color:var(--ink)}
.anim .split .p1{animation:grow 1s .3s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.flow{display:grid;gap:8px;margin-top:12px}
.flow div{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--card)}
.flow i{font-style:normal;font:900 26px/1 var(--fd);width:28px;text-align:center}
.flow b{display:block;font:700 15px/1.2 var(--fb)}
.flow span{color:var(--ink2);font-size:14px}
.potline{display:flex;align-items:center;gap:10px;margin-top:12px;font:600 16px/1.4 var(--fb)}
.potline .lg{font-size:36px}
.wipe{margin-top:14px;font:900 30px/1 var(--fd);text-transform:uppercase;color:var(--dn)}
.steps{list-style:none;display:grid;gap:8px}
.steps li{padding:12px 14px;border-radius:12px;background:var(--card)}
.steps b{font:700 15px/1.3 var(--fb)}
.steps span{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.steps .nowtag{display:inline-block;margin-left:8px;font:700 10px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#16120a;padding:3px 5px;border-radius:3px;vertical-align:2px}

/* estimator */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;min-width:64px;padding:8px 14px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font:800 20px/1 var(--fd);font-variant-numeric:tabular-nums}
.chip[aria-checked="true"]{background:var(--gold);color:#16120a;box-shadow:none}
.est{margin-top:18px;padding:16px;border-radius:16px;background:var(--card)}
.est .big{margin:4px 0 0}
.est p{font:600 17px/1.4 var(--fb);margin-top:10px}
.est p b{color:var(--up);font-weight:700}
.est .fine{font:400 13px/1.45 var(--fb);color:var(--ink2);margin-top:12px}

/* the end */
.end{padding:34px 0 40px;margin-top:22px;border-top:1px dashed var(--line)}
.end .q-t{margin-top:10px}
.vs{display:grid;gap:8px;margin-top:16px}
.vs-r{display:grid;grid-template-columns:96px 1fr 84px;gap:10px;align-items:center}
.vs-n{display:flex;align-items:center;gap:8px;font:700 14px/1 var(--fb)}
.vs-n .lg{font-size:22px}
.vs-n .you{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--gold);color:#16120a;font:900 13px/1 var(--fd)}
.vs-t{height:12px;border-radius:6px;background:var(--bg2);overflow:hidden}
.vs-t i{display:block;height:100%;border-radius:6px;background:var(--ink3);transition:width .6s}
.vs-r.me .vs-t i{background:var(--gold)}
.vs-v{text-align:right;font:800 17px/1 var(--fd);font-variant-numeric:tabular-nums;white-space:nowrap}
.vs-v small{display:block;font:600 11px/1.2 var(--fb);color:var(--ink2)}
.vs-cap{font-size:13px;color:var(--ink2);margin-top:8px}
.get{list-style:none;counter-reset:g;display:grid;gap:10px}
.get li{counter-increment:g;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px;border-radius:14px;background:var(--card)}
.get li::before{content:counter(g);font:900 40px/1 var(--fd);color:var(--gold)}
.get b{display:block;font:800 22px/1.05 var(--fd);text-transform:uppercase}
.get span{display:block;color:var(--ink2);font-size:15px;margin-top:4px}
.cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;margin-top:12px;border-radius:14px;background:var(--gold);color:#16120a;font:900 24px/1 var(--fd);text-transform:uppercase;text-decoration:none}
.cta:disabled,.cta[aria-disabled="true"]{background:var(--card2);color:var(--ink2);cursor:not-allowed}
.xbtn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:10px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);font:700 16px/1 var(--fb);color:var(--ink);text-decoration:none}
.xbtn[aria-disabled="true"]{color:var(--ink2);cursor:not-allowed}
.disc{margin-top:18px;font-size:13px;color:var(--ink2);max-width:56ch}
.glance{display:grid;gap:0;margin-top:6px}
.glance div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.glance dt{color:var(--ink2)}
.glance dd{font-weight:600}
.foot{padding:28px 0 calc(40px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:30px;display:grid;gap:8px;font-size:14px;color:var(--ink2)}
.foot b{color:var(--ink)}
.foot .ez{margin-bottom:6px}

/* film dialog */
dialog.film{border:0;padding:0;background:#000;border-radius:16px;width:min(92vw,560px);max-height:90vh;color:var(--ink)}
dialog.film::backdrop{background:rgba(0,0,0,.8)}
dialog.film video{display:block;width:100%;height:auto;max-height:78vh;background:#000}
dialog.film .fh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--bg2);font:700 14px/1.2 var(--fb)}
dialog.film button{min-height:40px;padding:6px 12px;border-radius:10px;background:var(--card2);font-weight:700}

@media (min-width:600px){
  :root{--gut:28px}
  .calls{grid-template-columns:repeat(4,1fr)}
  .call{flex-direction:column;align-items:flex-start;gap:6px}
  .call span{margin-left:0}
  .st-s{grid-template-columns:repeat(4,1fr)}
  .lr-c{grid-template-columns:repeat(4,1fr)}
  .hl{grid-template-columns:repeat(4,1fr)}
  .lane,.ln-head{grid-template-columns:110px 1fr 80px}
}
@media (min-width:1024px){
  :root{--hud:60px}
  .wrap{display:grid;grid-template-columns:minmax(340px,410px) minmax(0,720px);gap:72px;justify-content:center;padding-top:calc(var(--hud) + 28px)}
  .rail{position:sticky;top:calc(var(--hud) + 28px);align-self:start;max-height:calc(100vh - var(--hud) - 40px);overflow:auto;padding-right:6px}
  h1{font-size:48px}
  .ez.xl{font-size:40px;border-radius:13px;padding:9px 11px 7px}
  .howto{display:block}
  .rail .vs{display:grid;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
  .rail .vs-h{display:block}
  #run .q:first-child{border-top:0;padding-top:0;margin-top:0}
  .q-t{font-size:68px}
  .bar{padding-bottom:16px}
}
.vs-h{display:none;font:700 12px/1.2 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.end .vs-h{display:block}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

  </div>

</div>

<script src="ez-data.js"></script>

<script>
(function(){
"use strict";
var S=EZS,esc=S.esc,L=S.last,P=S.live,H=S.highlights,REC=S.records;
var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var F={};S.findings.forEach(function(f){F[f.k]=f});
function $(s,el){return (el||document).querySelector(s)}
function $$(s,el){return Array.prototype.slice.call((el||document).querySelectorAll(s))}
function of(s){var m=String(s).match(/(\d+) of (\d+)/);return m?{ok:+m[1],n:+m[2]}:null}
function isDn(c){return /^DOWN/.test(c[1])}
function callV(c){return (isDn(c)?-1:1)*parseFloat(c[1].split(" ")[1])}
function xTimes(x){return x>=10?String(Math.round(x)):x.toFixed(1)}
function list(a){return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" and "+a[a.length-1]}
var lead=S.rows[0],best=S.follow[0],GRADED=S.graded;
var MC={};S.models.forEach(function(m){MC[m]=(MODELS[m]&&MODELS[m].c)||"#999"});if(MC.GROK)MC.GROK="#e9e6df";

/* ---------- the brand bits ---------- */
$("#thesis").innerHTML="Before a company reports earnings, <b>"+S.word(S.models.length)+" AI models</b> call how its stock will react: up or down, and by how much.";
$("#howto").textContent="Play the season so far. Before each number lands, make your call. Your score runs against theirs.";

/* ---------- small renderers ---------- */
function spark(dir,seed){var n=26,y=60,s=seed*9301+49297,pts=[];function rnd(){s=(s*9301+49297)%233280;return s/233280}
  for(var i=0;i<n;i++){y+=(rnd()-.5)*30+(dir==="up"?-2.6:2.6);y=Math.max(10,Math.min(110,y));if(i===n-1)y=dir==="up"?8:112;pts.push((i*400/(n-1)).toFixed(1)+","+y.toFixed(1))}
  return '<svg class="spark" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M'+pts.join(" L")+'"/></svg>'}
function big(o){/* o: text, tone, unit, label, spark ('up'|'dn'), count {from,to,fmt}, who (html before text) */
  return '<div class="big'+(o.tone?' t-'+o.tone:'')+(o.who?' who':'')+'" data-fit="'+(o.max||0)+'">'+(o.label?'<span class="lab">'+o.label+'</span>':'')+(o.spark?spark(o.spark,o.seed||7):'')+
    '<span class="bn"'+(o.count?' data-from="'+o.count.from+'" data-to="'+o.count.to+'" data-fmt="'+o.count.fmt+'"':'')+' data-fin="'+esc(o.text)+'">'+(o.who||'')+'<span class="bt">'+esc(o.text)+'</span></span>'+(o.unit?'<span class="bu">'+o.unit+'</span>':'')+'</div>'}
var FMT={pct2:function(v){return (v<0?"−":"+")+Math.abs(v).toFixed(2)+"%"},usd:function(v){return S.usd(v)},int:function(v){return String(Math.round(v))},pct0:function(v){return Math.round(v)+"%"},dec2:function(v){return v.toFixed(2)}};
function calls(r){return '<div class="calls">'+r.calls.map(function(c,i){var m=c[0]||c.m,live=!!c.m,dn=live?c.dir==="DOWN":isDn(c);
  return '<div class="call '+(dn?'dn':'up')+'" style="--i:'+i+'">'+logo(m)+'<b>'+S.nm(m)+'</b><span>'+(live?S.liveTxt(c):S.callTxt(c))+'</span></div>'}).join("")+'</div>'}
function lanes(r,hide){var vs=r.calls.map(callV).concat([r.a,0]),lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs),pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;
  function x(v){return ((v-lo)/(hi-lo)*100).toFixed(2)+"%"}
  var W=hide?[]:S.winners(r),tone=r.a<0?"var(--dn)":"var(--up)";
  var h='<div class="lanes" role="img" aria-label="'+esc(S.co(r)+": each call against the real move of "+r.out)+'"><div class="ln-head"><span>AI</span><span class="ah"><span class="'+((r.a-lo)/(hi-lo)>.7?'r':(r.a-lo)/(hi-lo)<.3?'l':'')+'" style="left:'+x(r.a)+';color:'+tone+'">Real '+r.out+'</span></span><span>Points off</span></div>';
  r.calls.forEach(function(c,i){var v=callV(c),ok=(v>0)===(r.a>0),w=W.indexOf(c[0])>-1,a=Math.min(v,r.a),b=Math.max(v,r.a);
    h+='<div class="lane" style="--i:'+i+'"><span class="ln-n">'+logo(c[0])+S.nm(c[0])+'</span><div class="ln-t"><i class="z" style="left:'+x(0)+'"></i><i class="gap'+(ok?'':' bad')+'" style="left:'+x(a)+';width:calc('+x(b)+' - '+x(a)+')"></i><i class="act" style="left:'+x(r.a)+';background:'+tone+'"></i><i class="dot '+(v<0?'dn':'up')+(w?' win':'')+'" style="left:'+x(v)+'" title="'+esc(S.nm(c[0])+" said "+c[1])+'"></i></div>'+
      '<span class="ln-d'+(w?' win':'')+'">'+c[2]+'<small>'+(w?'won':ok?'right way':'wrong way')+'</small></span></div>';});
  return h+'</div>'}
function thumb(r){return '<span class="thumb"><img src="'+MEDIA+r.poster+'.jpg" alt="" loading="lazy"></span>'}
function filmBtn(r){return r.film?'<button class="filmbtn" type="button" data-film="'+r.n+'">'+thumb(r)+'<span>Watch round '+r.n+'<small>'+esc(S.co(r))+', the film</small></span></button>':''}
function form(m){return '<span class="form" aria-label="Last 5: '+S.form(m,5).map(function(f){return {w:"won",g:"right way",r:"wrong way",n:"no call"}[f]}).join(", ")+'">'+S.form(m,5).map(function(f){return '<i class="'+f+'">'+(f==="w"?"W":"")+'</i>'}).join("")+'</span>'}
function standings(){return '<ol class="stand">'+S.rows.map(function(r,i){return '<li class="st'+(i===0?' top':'')+'"><span class="st-r">'+(i+1)+'</span>'+logo(r.m)+
  '<div class="st-n"><b>'+S.nm(r.m)+'</b><small>'+esc(r.ver)+'</small></div><div class="st-w"><b>'+r.won+'</b><small>wins</small></div>'+
  '<dl class="st-s"><div><dt>Hit rate</dt><dd>'+r.right+' of '+r.n+'<small>'+r.hit+'%</small></dd></div><div><dt>Avg miss</dt><dd>'+r.avg+'<small>pts</small></dd></div>'+
  '<div><dt>ROI</dt><dd>'+S.usd(r.bal)+'<small>'+r.roi+'</small></dd></div><div><dt>Last 5</dt><dd>'+form(r.m)+'</dd></div></dl></li>'}).join("")+'</ol>'+
  '<div class="legend"><span><span class="form"><i class="w">W</i></span>won</span><span><span class="form"><i class="g"></i></span>right way</span><span><span class="form"><i class="r"></i></span>wrong way</span><span><span class="form"><i class="n"></i></span>no call</span></div>'+
  '<p class="note">Hit rate: calls right on direction. Avg miss: points off the real move. ROI: $100,000 rolled through every call. Simulated, before fees.</p>'+lateNote()}

/* sound: off until you tap it on */
var AC=null,snd=false;
$("#snd").addEventListener("click",function(){snd=!snd;this.setAttribute("aria-pressed",snd);this.textContent=snd?"Sound on":"Sound off";
  if(snd&&!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==="suspended")AC.resume();if(snd)tone([660,880],.08)});
function tone(fs,d){if(!snd||!AC)return;var t=AC.currentTime;fs.forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t+i*d);g.gain.linearRampToValueAtTime(.16,t+i*d+.01);g.gain.exponentialRampToValueAtTime(.001,t+i*d+d*1.8);o.connect(g);g.connect(AC.destination);o.start(t+i*d);o.stop(t+i*d+d*2)})}
function beep(ok,live){if(live)tone([523,659,784],.09);else if(ok)tone([523,784,1046],.08);else if(ok===false)tone([220,165],.14);else tone([440],.08)}

  var q=Q[st.i];if(!q||q.tool)return;var s=$("#q-"+q.id);if(!s||s.getAttribute("data-done"))return;

  else if(/^[1-9]$/.test(e.key))k=q.opts.filter(function(o){return o.kb===e.key})[0];
  else if(e.key==="s"||e.key==="S"){e.preventDefault();answer(st.i,null);return}
