<!doctype html>
<!--
EZ SITE3D, "THE MACHINE ON THE PAGE" (30 s, 60 fps, 1080 x 1080; treatment and critique of 2026-10-12).
The website's own components, built as one physical set on the page itself (cream and sand bands, low key):
the pot gauge (#/buyback .g-tank), the Blackwell chip with its LED countdown (#gpu, #gpuCore), the standings cards
(#roster > li, captured from the live page by site3d-capture.js) and the $EZ badge (footer .badge) as a tray of tiles
and a "bought back" bay that mirrors the pot.
PASSES (URL params):
  ?pass=plate    WebGL only. Frames are named p<key>.png, the key hashing this page's source, the capture manifest and the
                 frame's whole state (camera, every light, every LED cell, every object), so frames that look the same share one
                 plate and a stale plate can never be used. render.js names / SKIP_EXISTING=1 render each unique plate once.
  ?pass=type     the type layer only, on a transparent page (render.js ALPHA=1): rail, legal line, stamp, heads, labels, scrim,
                 vignette, the uk band, the end card. Named t<key>.png; there are about 30 unique states. site3d-render.sh
                 composites them over the plates with ffmpeg (overlay, then seeded grain).
  ?pass=both     plate and type in one page (stills and previews).
  &variant=std|uk   uk: the FCA band (exactly as ez-hype.html) on every frame.   &mica=1  the MiCA top band (only if counsel says so)
  &asof=ISO      REQUIRED: the stated render date. The LEDs show the true remaining time to the bet at that moment.
  &res=960       plates at 960 (the upscale fallback).   &ns=N  subframes override.   &lo=1  blocking quality (no MSAA, shadows, bloom)
DATA: everything from ../ez-data.js at render time (window.SITE3D_STRINGS lists every on-screen string and its source).
  Refuses to render if SIM.stopLoss is set (the film shows no stop loss), if SIM.leverage, SIM.leadHours or SIM.poolShare is null,
  if a model has no LABS entry, if a round before the latest graded one is ungraded, if the launch round is missing (before
  launch), or if the captured standings differ from LADDER ("stale textures").
SOUND: ez-site3d-audio.js, driven by window.SITE3D_PIC (the frame table below), so a re-time moves the sound with the picture.
-->

<script src="../ez-data.js"></script>
<script type="module">
try{
const Q=new URLSearchParams(location.search);
const PASS=Q.get('pass')||'both',VAR=Q.get('variant')||'std',UK=VAR==='uk',MICA=Q.get('mica')==='1',RES=+(Q.get('res')||1080),LO=Q.get('lo')==='1',NSQ=Q.get('ns');
const FPS=60,N=1800;window.FPS=FPS;window.N=N;
if(PASS==='type')document.documentElement.classList.add('tp');
/* ============================================================================================================
   0. HASHES: a stale plate or type state can never be reused (every name carries a key of what it is drawn from)
   ============================================================================================================ */
function h32(s,seed){let h=(2166136261^seed)>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return ('0000000'+h.toString(16)).slice(-8)}
const hash=s=>h32(s,0)+h32(s,0x9e3779b9).slice(0,4);
const SRC=hash(await (await fetch(location.pathname,{cache:'no-store'})).text());

/* ============================================================================================================
   1. DATA (ez-data.js). STRINGS records every on-screen string and the field that produced it.
   ============================================================================================================ */
const STRINGS=[];const S=(text,src)=>{STRINGS.push({text:String(text).replace(/<[^>]+>/g,''),src});return text};
const fail=m=>{throw new Error('EZ site3d: '+m)};
if(SIM.stopLoss!=null)fail('SIM.stopLoss is set ('+SIM.stopLoss+'); this film shows no stop loss (owner, 2026-10-12). Re-plan scenario B before rendering.');
['leverage','leadHours','poolShare'].forEach(k=>{if(SIM[k]==null||!isFinite(SIM[k]))fail('SIM.'+k+' is null; refusing to print it')});
const LEV=SIM.leverage,LEAD=SIM.leadHours,POOL=SIM.poolShare,POOLPCT=Math.round(POOL*100);
const LABS={GPT:'OPENAI',KIMI:'MOONSHOT AI',CLAUDE:'ANTHROPIC',GROK:'XAI'};   /* names only, never marks; a new model fails the build */
MODEL_KEYS.forEach(m=>{if(!LABS[m])fail('no lab name for model '+m+' (add it to LABS in ez-site3d.html)')});
if(!ROUNDS.length)fail('no graded round');
const RS=ROUNDS.slice().sort((a,b)=>a.n-b.n),LAST=RS[RS.length-1];
{const gap=[].concat(PENDING,UPCOMING).filter(u=>u.n<LAST.n).map(u=>u.n);if(gap.length)fail('round(s) '+gap.join(',')+' ungraded but round '+LAST.n+' is graded; the board stamp would be wrong')}
const NL=LADDER.length;if(NL<2||NL>6)fail('the set is built for 2 to 6 models on the board, LADDER has '+NL);
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const md=s=>{const m=String(s||'').match(/(\d+)\/(\d+)\/(\d+)/);return m?[2000+(+m[3]%100),+m[1]-1,+m[2]]:null};
/* the site's nyClose: 16:00 New York on that day (20:00 UTC in daylight time, 21:00 UTC otherwise) */
function nyClose(y,m,d){const f=new Date(Date.UTC(y,2,1)).getUTCDay(),a=Date.UTC(y,2,8+(7-f)%7),g=new Date(Date.UTC(y,10,1)).getUTCDay(),b=Date.UTC(y,10,1+(7-g)%7),t=Date.UTC(y,m,d);return Date.UTC(y,m,d,t>=a&&t<b?20:21)}
let BET=null,betSrc='',betSet=false;
{const b=md(SIM.betDate||CONFIG.betDate);if(b){BET=nyClose(...b);betSrc='SIM.betDate || CONFIG.betDate';betSet=true}
 else{const r=[].concat(UPCOMING,PENDING).filter(u=>u.ticker==='NVDA')[0],c=r&&md(r.called);
   if(c){let dt=new Date(Date.UTC(...c));do{dt=new Date(dt.getTime()+864e5)}while(dt.getUTCDay()%6===0);BET=nyClose(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate());
     betSrc='NVDA row (round '+r.n+') CALL DATE '+r.called+' + 1 weekday, 16:00 New York (fallback; the render script needs BET_OK=1)'}}}
if(BET==null)fail('no bet date: set SIM.betDate or add the NVDA row');
const AS_OF=Date.parse(Q.get('asof')||'');if(!isFinite(AS_OF))fail('&asof=ISO date is required (the stated render date, normally the posting day)');
if(AS_OF>=BET)fail('asof is after the bet');
const R0=Math.floor((BET-AS_OF)/1000);
const betNY=new Date(BET-5*3600e3),BETTXT=MON[betNY.getUTCMonth()]+' '+betNY.getUTCDate();
const asofNY=new Date(AS_OF-4*3600e3),ASOFTXT=MON[asofNY.getUTCMonth()]+' '+asofNY.getUTCDate();
/* LAUNCH (critique must-fix 12): the pot starts empty; the fee channel opens when the fast-forward reaches the day round
   CONFIG.launchAt resolves (the site: "launch comes after launchAt graded rounds"). Once CONFIG.launched, fees run from the start. */
let LAUNCH_REM=null,launchSrc='CONFIG.launched (fees run from the start)';
if(!CONFIG.launched){const r=[].concat(RS,PENDING,UPCOMING).filter(u=>u.n===CONFIG.launchAt)[0];if(!r||!md(r.resolves))fail('launch round '+CONFIG.launchAt+' (CONFIG.launchAt) not found with a resolve date');
  const L=nyClose(...md(r.resolves));LAUNCH_REM=Math.max(0,Math.floor((BET-L)/1000));launchSrc='round '+r.n+' (CONFIG.launchAt) resolves '+r.resolves+', 16:00 New York'}
const LH=LEAD*3600;if(R0<=LH+60)fail('asof is inside the last '+LEAD+' hours; the freeze would be in the past');
const labsTxt=(()=>{const a=MODEL_KEYS.map(m=>LABS[m]);return a.length>1?a.slice(0,-1).join(', ')+' OR '+a[a.length-1]:a[0]})();
const sitOut=NL===2?'#2 SITS OUT.':NL===3?'#2 AND #3 SIT OUT.':NL===4?'#2, #3 AND #4 SIT OUT.':'#2 TO #'+NL+' SIT OUT.';
const EZB='<span class="ez"><span class="s">$</span><span class="e">E</span><span class="z">Z</span></span>',EZ2='<span class="ez"><span class="e">E</span><span class="z">Z</span></span>';
const C={
  ad:S('AD','fixed (compliance: AD label on every frame)'),
  brand:S(EZB+' · EARNINGS ZEASON','fixed; $ #ffc72c, E #1fcf6b, Z #ff4136 (owner)'),
  legal:S('NOT AFFILIATED WITH NVIDIA, '+labsTxt+'.','NVIDIA + LABS[MODEL_KEYS] (names only)'),
  stHook:S('NVIDIA BET · '+BETTXT+' · AS OF '+ASOFTXT,betSrc+'; AS OF = &asof (stated render date)'),
  stFF:S('FAST-FORWARD','fixed'),
  stBoard:S("TODAY'S BOARD · ROUND "+LAST.n+' · #1 CAN CHANGE','ROUNDS (latest graded).n (critique must-fix 4)'),
  stA:S('ILLUSTRATIVE, NOT A FORECAST','fixed (scenario A)'),
  stB:S('ILLUSTRATIVE · THE NEXT BET','fixed (scenario B, critique must-fix 15)'),
  stEnd:S('NVIDIA BET · '+BETTXT,betSrc),
  hook:[S('WE’RE PUTTING BUYBACKS','owner copy (EZ Season hero)'),S('<span class="y">IN THE HANDS OF AN AI.</span>','owner copy, line 2 in #ffc72c (the hero highlight)')],
  clock:[S('THE CLOCK RUNS TO ONE BET:','fixed'),S('NVIDIA EARNINGS.','fixed')],
  ais:[S(NL+' AI<span class="lc">s</span> CALL STOCKS','LADDER.length ('+NL+') (critique must-fix 3)'),S('BEFORE EARNINGS.','fixed')],
  fees:S((CONFIG.launched?'':'AT LAUNCH, ')+POOLPCT+'% OF '+EZB+' FEES',(CONFIG.launched?'':'CONFIG.launched=false; ')+'SIM.poolShare ('+POOL+'); shown when the fast-forward reaches '+launchSrc),
  freeze:[S(LEAD+' HOURS BEFORE NVIDIA REPORTS,','SIM.leadHours ('+LEAD+')'),S('THE LEADERBOARD FREEZES.','fixed')],
  sit:S(sitOut,'LADDER.length ('+NL+')'),
  one:S('#1 MAKES THE CALL.','fixed'),
  zero:[S('ZERO: THE WHOLE FEE POT','fixed (the site: "fee pool"; critique must-fix 3)'),S('GOES IN ON #1’S CALL.','fixed (the site: a human clicks the button for now)')],
  lev:[S('AT LEAST '+LEV+'X LEVERAGE.','SIM.leverage ('+LEV+', a minimum; owner 2026-10-12)'),S('THE POT CAN BE WIPED OUT.','fixed; always with the leverage line')],
  A:[S('SCENARIO: RIGHT CALL.','fixed'),S('PROFITS BUY BACK '+EZB+'.','fixed (the site: "The profits buy back $EZ.")')],
  B:[S('SCENARIO: WRONG CALL.','fixed'),S('THE POT TAKES THE HIT.','fixed (owner 2026-10-12)'),S('IT CAN BE WIPED OUT.','fixed (owner 2026-10-12; no stop loss)')],
  end:[S('NOBODY SAID IT WOULD BE '+EZ2+'.','the site footer head')],
  card:S('$EZ is a memecoin. Not financial advice. The pot can be wiped out.','fixed (end disclaimer, both variants; held 3.5 s)'),
  follow:String(CONFIG.x||'').trim()?S('FOLLOW THE RACE · '+(String(CONFIG.x).trim().charAt(0)==='@'?String(CONFIG.x).trim():'@'+String(CONFIG.x).trim().replace(/^https?:\/\/(x|twitter)\.com\//,'')),'CONFIG.x'):null,
  fca:UK?S('Don’t invest unless you’re prepared to lose all the money you invest. This is a high-risk investment and you should not expect to be protected if something goes wrong.','fixed: COBS 4.12A.11R(1)(d), exact (uk only)'):null,
  mica:MICA?S('This crypto-asset marketing communication has not been reviewed or approved by any competent authority in any Member State of the European Union. The offeror of the crypto-asset is solely responsible for the content of this crypto-asset marketing communication.','fixed: MiCA Article 7 (only with &mica=1)'):null};
/* strings baked into the 3D plates (LED dies, labels on the set) */
S('LED dies: the remaining time to the bet at AS OF ('+R0+' s), racing to '+LEAD+':00:00 left, frozen, then to zero',betSrc+'; SIM.leadHours');
S('DAYS · HRS · MIN · SEC (die labels, as the site\'s #gpuCore)','fixed (site)');
S('↑ UP + "ILLUSTRATIVE CALL" (left die), ↑ UP / ↓ DN + "ILLUSTRATIVE MOVE" (right die)','not data: illustrative, labelled');
S('THE POT (gauge base) · BOUGHT BACK (bay base)','the site\'s #gLbl and "Bought back so far" labels');
LADDER.forEach((l,k)=>S('#'+(k+1)+' '+MODELS[l.m].name+' '+l.won+(l.won===1?' WIN':' WINS')+' (card face, captured from the live page)','LADDER['+k+'] via v24-live-x2.html #roster'));
window.SITE3D_STRINGS=STRINGS;

/* ============================================================================================================
   2. TIMELINE (master frames; 120 BPM: 1 beat = 30 f, 1 bar = 120 f). Cuts only on hits.
   ============================================================================================================ */
const T={ffStart:120,brake:375,settle:400,lock:420,rise0:300,cuts:[180,300,408,450,570,600,630,660,690,720,780,810,840,960,990,1080,1110,1140,1200,1230,1320,1350,1380,1440,1470,1560],
  elim:Array.from({length:NL-1},(_,j)=>570+Math.round(j*180/(NL-1))),one0:750,one1:780,last0:840,zero:938,out:945,seat:960,reflow:962,pot0:992,pot1:1040,levOn:1020,
  aMove:1110,aGold:1140,aTile0:1170,aTileStep:15,aSeat:45,bBet:1320,bMove:1350,bBack:1380,bBack1:1400,bCool0:1410,bCool1:1500,end:1560,card:1590,relight0:1650,relight1:1700};
const cl=(x,a=0,b=1)=>x<a?a:x>b?b:x,lin=(f,a,b)=>cl((f-a)/(b-a)),ss=x=>x*x*(3-2*x),eo=x=>1-Math.pow(1-x,3),
  cd=x=>{x=cl(x);return (1-(1+6*x)*Math.exp(-6*x))/(1-7*Math.exp(-6))};     /* critically damped, normalised, no overshoot */
/* remaining seconds on the dies at frame f */
function remAt(f){
  if(f<T.ffStart)return R0-f/FPS;                                            /* real time */
  if(f<T.lock){/* a long acceleration (cubic) to 97% of the way, then a hard brake: the distance to the 24 hour mark falls
     exponentially (about a day to 5 s in 25 frames), then the last seconds tick out slowly (clacks at f402, 405, 408, 414, 417) */
    const R1=R0-T.ffStart/FPS,D=R1-LH;
    if(f<T.brake)return R1-D*0.97*Math.pow(lin(f,T.ffStart,T.brake),3);
    if(f<T.settle){const u=lin(f,T.brake,T.settle);return LH+Math.pow(10,Math.log10(D*0.03)*(1-u)+Math.log10(5)*u)}
    return LH+5*Math.pow(1-lin(f,T.settle,T.lock),1.3)}
  if(f<T.last0)return LH;                                                    /* frozen at the 24 hour mark */
  if(f<T.zero){const x=lin(f,T.last0,T.zero);return (LH-1)*(1-Math.pow(x,2.2))}
  return 0}
/* the frame the fast-forward passes the launch date (fees start); before launch only */
const F_LAUNCH=(()=>{if(LAUNCH_REM==null)return null;for(let f=T.ffStart;f<T.lock;f++)if(remAt(f)<=LAUNCH_REM)return f;return T.ffStart})();
if(F_LAUNCH!=null&&(F_LAUNCH<180||F_LAUNCH>290))fail('the launch date falls at frame '+F_LAUNCH+', outside the pot shot (180..290): re-time the shot');
const P_LOSS=0.61,POT_FULL=0.88,POT_B=+(POT_FULL-P_LOSS).toFixed(2);       /* illustrative levels; A's profit = B's loss (critique must-fix 7) */
const NT=12,TILES_LIFT=Math.round(P_LOSS*10);if(TILES_LIFT*15+1170+45>1319)fail('the buyback runs past scenario A');                             /* bay: 10 slots = the gauge's 10 ticks; 0.61 -> 6 tiles */

/* ============================================================================================================
   3. TYPE LAYER: static states (about 30), composited over the plates by ffmpeg in production
   ============================================================================================================ */
const ov=document.getElementById('ov');
const FCA_TOP=824,WIN0=300,WIN1=800;
const CH_LABEL={x:48,y:668};            /* the fee label, under the channel (y 617..627) where it meets the pot, in the locked pot shot (measured, shot P) */
function head(lines){return '<div class="ab hd" style="top:'+(MICA?284:134)+'px">'+lines.join('<br>')+'</div>'}
function typeHTML(i){let h='',stamp='',scrim=.72;
  h+='<div class="ab" id="rail"><span id="ad">'+C.ad+'</span><span id="brand">'+C.brand+'</span></div><div class="ab" id="legal">'+C.legal+'</div>';
  if(i<180){stamp=C.stHook;h+=head(C.hook);if(i<60)scrim=.9}
  else if(i<300){stamp=C.stFF;h+=head(C.clock);if(F_LAUNCH==null||i>=F_LAUNCH)h+='<div class="ab lbl" style="left:'+CH_LABEL.x+'px;top:'+CH_LABEL.y+'px">'+C.fees+'</div>'}
  else if(i<T.lock){stamp=C.stFF;h+=head(C.ais)}
  else if(i<T.elim[0]){stamp=C.stBoard;h+=head(C.freeze)}
  else if(i<T.one0){stamp=C.stBoard;h+=head([C.sit])}
  else if(i<T.last0){stamp=C.stBoard;h+=head([C.sit,C.one])}
  else if(i<T.seat){stamp=C.stBoard}
  else if(i<T.levOn){stamp=C.stBoard;h+=head(C.zero)}
  else if(i<1080){stamp=C.stBoard;h+=head(C.lev)}
  else if(i<1320){stamp=C.stA;h+=head(C.A)}
  else if(i<1560){stamp=C.stB;h+=head(C.B)}
  else{stamp=C.stEnd;h+=head(C.end);
    if(i>=T.card){const top=UK?664:858;h+='<div class="ab" id="card" style="top:'+top+'px">'+C.card.split(/(?<=\.) /).map(t=>'<span style="white-space:nowrap">'+t+'</span>').join(' ')+'</div>';
      if(C.follow)h+='<div class="ab" id="follow" style="top:'+(top-44)+'px">'+C.follow+'</div>'}}
  if(stamp)h+='<div class="ab" id="stamp">'+stamp+'</div>';
  if(UK)h+='<div class="ab" id="band"><p>'+C.fca+'</p></div>';
  if(MICA)h+='<div class="ab" id="mica"><p>'+C.mica+'</p></div>';
  /* scrim (critique must-fix 5: mandatory, rgba(7,8,13) 0.72 to 0 over y 0..330) and a light vignette, both in the type state */
  const sc='<div class="ab" style="left:0;right:0;top:0;height:'+(MICA?480:330)+'px;background:linear-gradient(rgba(7,8,13,'+scrim+'),rgba(7,8,13,'+(scrim*.55).toFixed(2)+') 55%,rgba(7,8,13,0))"></div>'+
    '<div class="ab" style="inset:0;background:radial-gradient(circle at 50% 52%,rgba(7,8,13,0) 58%,rgba(7,8,13,.30) 100%)"></div>';
  return sc+h}
let typeKey='';const fitCache={};
function typeFrame(i){const html=typeHTML(i);if(html===typeKey)return;typeKey=html;ov.className=MICA?'mi':'';ov.innerHTML=html;fitStamp()}
/* the stamp never touches the rail: shrink from 28 px one px at a time; below 22 px the render stops (ez-hype's fitStamp) */
function fitStamp(){const st=document.getElementById('stamp');if(!st)return;const rr=document.getElementById('rail').getBoundingClientRect().right;
  for(let fs=28;fs>=22;fs--){st.style.fontSize=fs+'px';if(st.getBoundingClientRect().left>=rr+16)return fs}
  throw new Error('EZ site3d: the stamp "'+st.textContent+'" overlaps the rail even at 22 px')}
/* the legal line must fit the frame (a new lab makes it longer): shrink to 22 px, then fail */
function fitLegal(){const e=document.getElementById('legal');if(!e)return;for(let fs=26;fs>=22;fs--){e.style.fontSize=fs+'px';if(e.getBoundingClientRect().right<=1080-48)return}fail('the non-affiliation line does not fit at 22 px')}
