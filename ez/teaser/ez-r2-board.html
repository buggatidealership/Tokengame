<!doctype html>
<!--
EZ FILM, ROUND 2: "THE BIG BOARD" (slug board, night). Spec: scratchpad/films-r2/spec-board.md (2026-10-12).
One physical flip-disc board, one take, writes the story in clattering waves while the words sit still.
Square 1080, 60 fps, 26.0 s = 1560 frames, 120 BPM. Loops to frame 0 in picture and sound.
FIX R1 (2026-10-12, films-r2/board/fix-r1.md): one more 2 s bar for the fee story (B1 3.0..6.0, B2 6.0..9.0, all later beats +2.0 s);
  the money layers flip with the board's waves per disc; a 2x coin stream and a $EZ flip ripple in B0; paying trades fire;
  "69% OF FEES"; "THE #1 AI MAKES THE CALL."; every time derives from the T table.
CONTRACT (teaser/render.js): window.N, window.FPS, window.renderAt(t) (pure in t), window.renderAudio() (base64 WAV),
  window.__ready / window.__err, a 1080 #stage.
URL: v=uk|nonuk (alias variant=), asof=ISO (required), theme=night|day, marks=1|0 (AI logo flaps), big=mona|instrument,
  end=chip|board, ns=N (subframe override), upto=SECONDS (N becomes upto*60, for the motion test).
STATE: every disc's face is a pure function of t. At load the page builds an event table (every flip of every disc, at 240
  ticks a second) from the beat layouts, the waves and the moving elements (coins, grains, tape, bars, selector, ratchet,
  countdown); renderAt(t) only reads it. Exposes R2B_T (timing), R2B_EVENTS (flips, coin steps, grains, hits, ticks) and
  R2B_STRINGS (every on-screen string and its source in ez-data.js).
DATA: ../ez-data.js at render time: SIM.poolShare, SIM.leverage, SIM.leadHours, SIM.stopLoss, CONFIG.launched, ROUNDS (race,
  site rule), LADDER (check), UPCOMING (NVDA row), MODELS (marks), SIM/CONFIG.betDate else the site's fallback rule.
-->

<script>
(function(){
"use strict";
function main(){
var Q=new URLSearchParams(location.search);

/* =====================================================================================================

var LABS={GPT:"OpenAI",KIMI:"Moonshot AI",CLAUDE:"Anthropic",GROK:"xAI"};

  end:S("PLANNED "+D.betTxt+" · AS OF "+D.asofTxt,D.betSrc+"; asof param"),

  if(/\block(s|ed)?\b/i.test(t)||/at least/i.test(t)||/[—–]/.test(t)||/10X/.test(t)||/jackpot/i.test(t)||/guaranteed/i.test(t))throw new Error("banned word in on-screen string: "+t)});

/* 3x5 mini face for the unit labels */
var G3={};[["D","110 101 101 101 110"],["A","010 101 111 101 101"],["Y","101 101 010 010 010"],["S","011 100 010 001 110"],["H","101 101 111 101 101"],

 .forEach(function(p){var r=p[1].split(" ");G3[p[0]]={w:r[0].length,r:r}});
function tw(s,tab){tab=tab||G5;var w=0,ch=Array.from(s);ch.forEach(function(c,i){if(c===" ")w+=2;else{if(!tab[c])throw new Error("no glyph for "+c);w+=tab[c].w+1}});return w-1}

/* ---- big type: Mona Sans 75/800 (font H) rasterised onto the disc grid, 8x8 supersampled, 0.42 coverage ---- */
var SS=8,BIGFAM=BIGF==="mona"?"MS":"IS",BIGW=BIGF==="mona"?800:700;
