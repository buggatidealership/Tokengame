<!doctype html>
<!--
DIRECTED BRIEF (EZ liquid chrome loop, 2026-10-11)
GOAL: a brand loop for $EZ. The pot (one liquid chrome blob) squashes, stretches and pinches into 3 drops; each drop pours
      into its glyph of "$EZ"; a glint sweeps the word; the glyphs melt back into one wobbling blob. Seamless.
OUTPUT: one HTML file, raw WebGL2 (no libraries), 1080x1080. window.renderAt(t) draws exactly the frame at t seconds.
TIME: 6 s loop, 60 fps = 360 frames, 120 BPM (1 beat = 30 frames). Frame 359 flows into frame 0.
TYPE: "$EZ" in Barlow Condensed 800 (the site's display face), baked per glyph into a signed distance field
      (Felzenszwalb EDT at 2x, averaged down), extruded 0.28 deep with a 0.035 rounded edge. Cap height 1.5 units.
LIQUID: one raymarched SDF: blob, 3 drops and 3 glyphs; smooth-min k 0.35 while touching, 0.1 as they part, 0.02 on hold.
      Each drop becomes its glyph through mix(dropSDF, glyphSDF, K). Volume moves blob -> drops (cube roots).
      Surface ripple 0.008 at frequency 3.2, slow deform 0.035 at frequency 1.0, both periodic in 1.5 s and 6 s.
CHROME: F0 0.92, Schlick fresnel, 3 bounces. Studio: dark (0.012), black camera-side panel 86x57 deg with a soft horizon line,
      white softboxes overhead (2.4) and upper left (3.0), EZ yellow strip behind and up, EZ yellow kicker on the right
      (azimuth 55 to 125, elevation -16 to 10). Glints: 0.6 deg strips at intensity 3, sweeping 0.15 to 0.65 s and 2.45 to 3.25 s.
FLOOR: glossy black at y -1, 30% fresnel mirror fading with distance, soft overhead shadow, contact darkening.
CAMERA: 35 deg vertical fov, from (0, 0.45, 7.8) to (0, 0.1, 0), pushes to 7.5 on the hold and back by 6 s.
FILM: 4 subframes per frame over half a frame (180 deg shutter), each with a quarter-pixel jitter, averaged in linear light.
      Khronos PBR Neutral tone mapping, 8% vignette, 2% grain seeded per frame.
SHOTS (s): 0 to 0.7 idle wobble and first glint; 0.7 to 1.0 anticipation squash (y 0.86, xz 1.07), 3-frame hold;
      1.0 to 1.3 stretch to 1.18 and pinch; 1.15 to 1.97 drops arc to their glyphs, 7% overshoot; 1.75 to 2.4 drops pour
      into glyphs ($ first, 0.08 s apart); 2.4 to 4.2 hold, glint at 2.85 s, tagline; 4.2 to 4.8 glyphs melt (Z first);
      4.6 to 5.35 drops fall back and merge; 5.35 to 6 the blob wobbles out (damping ~0.55) and settles into frame 0.
COPY: "EARNINGS ZEASON" eyebrow; on the hold "NOBODY SAID IT WOULD BE EZ". No numbers, no claims about returns.
SOUND: Web Audio, synthesized, 48 kHz; every hit 1 frame after its picture. Mixed to about -14 LUFS, peak -1 dBTP in ffmpeg.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>EZ Liquid Chrome</title>
<meta name="viewport" content="width=1080">
<style>
@font-face{font-family:"BC";src:url(fonts/barlow-condensed-800.woff2) format("woff2");font-weight:800}
@font-face{font-family:"B";src:url(fonts/barlow-800.woff2) format("woff2");font-weight:800}
html,body{margin:0;background:#07080d}
#stage{position:relative;width:1080px;height:1080px;overflow:hidden;background:#07080d}
#gl{position:absolute;inset:0;width:1080px;height:1080px}
.ab{position:absolute}
#eb{left:72px;top:64px;font:800 24px/1 "B";letter-spacing:.32em;color:#ffc72c;text-transform:uppercase}
#tag{left:0;right:0;top:902px;text-align:center;font:800 64px/1 "BC";letter-spacing:.01em;color:#f3efe6;text-transform:uppercase;text-shadow:0 2px 18px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1080"></canvas>
  <div class="ab" id="eb">Earnings Zeason</div>
  <div class="ab" id="tag">Nobody said it would be EZ</div>
</div>
<script>
(function(){

    edt(outG,W2,H2);edt(inG,W2,H2);                       /* outG: distance to ink, inG: distance to paper */
    for(var ty=0;ty<TH;ty++)for(var tx=0;tx<TW;tx++){var a=0;
      for(var sy=0;sy<SS;sy++)for(var sx=0;sx<SS;sx++){var k=(ty*SS+sy)*W2+tx*SS+sx;a+=outG[k]-inG[k]}

    bb=bb.map(function(v){return v/SS});
    GC.push(bb);ink=[Math.min(ink[0],bb[0]),Math.max(ink[1],bb[1]),Math.min(ink[2],bb[2]),Math.max(ink[3],bb[3])]}

  var cxp=(ink[0]+ink[1])/2,cyp=(ink[2]+ink[3])/2,X0=-cxp*s,Y1=0.2+cyp*s;   /* world of pixel (0,0) is (X0, Y1) */
  BOX=[X0,Y1-TH*s,TW*s,TH*s];
  GC=GC.map(function(bb){return [X0+(bb[0]+bb[1])/2*s,Y1-(bb[2]+bb[3])/2*s,0]});
  var tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,TW,TH,0,gl.RGBA,gl.FLOAT,data);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE)}

float wav(vec3 p){

float map(vec3 p){

    float k=dK[i],o;
    if(k<=0.)o=ds;

vec3 nrm(vec3 p){const vec2 e=vec2(1.,-1.)*.0065;   /* wider than one glyph texel (0.0036), so bevels shade smooth, not faceted */

const vec3 YEL=vec3(1.,.62,.05);

/* ---------- 3. overlay copy, a pure function of t ---------- */
function sat(x){return Math.max(0,Math.min(1,x))}
function eOut(x){x=sat(x);return 1-Math.pow(2,-10*x)}
var tag=document.getElementById("tag");

window.renderAt=function(t){
  var T=((t%LOOP)+LOOP)%LOOP,fr=Math.round(T*FPS);
  gl.uniform1f(U.uT,T);gl.uniform1i(U.uNS,NS);gl.uniform1f(U.uFrame,fr);

  gl.enable(gl.SCISSOR_TEST);var B=12,h=Math.ceil(1080/B),px=new Uint8Array(4);

/* ---------- 4. sound: synthesized, each hit 1 frame after its picture ---------- */

    a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+d*.85);a.gain.linearRampToValueAtTime(0,t+d);s.connect(bp);bp.connect(a);a.connect(pan(p||0));s.start(t);s.stop(t+d+.02)}
  function gloop(t,g){var o=ctx.createOscillator(),a=ctx.createGain(),lfo=ctx.createOscillator(),lg=ctx.createGain();o.frequency.setValueAtTime(210,t);o.frequency.exponentialRampToValueAtTime(70,t+.35);
    lfo.frequency.value=2.4*4;lg.gain.value=14;lfo.connect(lg);lg.connect(o.frequency);env(a,t,.006,.6,g);o.connect(a);a.connect(master);o.start(t);lfo.start(t);o.stop(t+.7);lfo.stop(t+.7)}

  [0,120,240].forEach(function(f){kick(at(f),.55)});
  for(var b=0;b<12;b++){var f=b*30+15;if([75,105,165,285,315].indexOf(f)<0)shaker(at(f),.06)}
  pad(0,2,[146.83,220,293.66],.018);pad(2,2,[130.81,196,261.63],.018);pad(4,2,[110,164.81,220],.018);
  /* events */
  swell(at(42),.18,300,1400,.10);                                   /* squash inhale, peaks at frame 53, the squash bottoms at 57 */
  [86,88,91].forEach(function(f,i){bloop(at(f),380+i*60,1300+i*200,.12,.30,[-.5,0,.5][i])});   /* pinch: the necks snap at frames 86 to 91 */
  [118,123,128].forEach(function(f,i){bloop(at(f),[587.33,659.25,880][i],[587.33,659.25,880][i]*1.6,.18,.26,[-.5,0,.5][i])});  /* land */
  [111,116,121].forEach(function(f,i){bloop(at(f),300,180,.22,.16,[-.5,0,.5][i])});            /* pour */
  ting(at(171),.20);swell(at(150),.9,2500,7000,.03,0);               /* glint: ting at the crossing, shimmer */

document.fonts.load('800 600px "BC"').then(function(){return document.fonts.ready}).then(function(){
  bake();gl.uniform1i(U.uTx,0);gl.uniform4f(U.uBox,BOX[0],BOX[1],BOX[2],BOX[3]);
  gl.uniform3fv(U.uG,new Float32Array([].concat(GC[0],GC[1],GC[2])));
