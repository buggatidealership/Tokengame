<!doctype html>
<!--
EZ concept D, "THE SEASON, CAST" (wildcard): the whole season as one physical data sculpture, filmed in one unbroken camera move.
Every graded round is a white slab whose height is the real move; the AIs' calls are pins (stem + the AI's tile) at the heights
they called, so every miss is a gap you can see. The winning tile carries a yellow plate; the plates fly to four spindles (the
tally), the tallest spindle is #1, and #1 stands next to the NVIDIA card (ez-gpu2.jpg with the site's LED countdown) and the pot.
1:1, 30.0 s, loops (the last frame runs into frame 0). Every number and name comes from ../../../ez-data.js at render time.
Params: res=540|1080 (WebGL buffer; the DOM type layer follows the device scale), marks=0 (no AI marks: plain tiles + names),
        uk=1 (the FCA risk band at y 824..984), asof=ISO (the stated render date for the LED countdown and the AS OF stamp),
        link=TEXT (the end line; default "Full season: link in the post"), t=SECONDS (show that time on load, for checks)
window.renderAt(t) is a pure function of t (seconds). window.renderAudio() returns the temp sound (WAV, base64).
-->

window.SC_EVENTS=()=>{const ev=[[0.0,'poster'],[T.rise[1],'reveal'],[T.win+0.05,'win']];
  order.forEach((i,j)=>ev.push([WAVE[i]+T.waveDur,'wave',j]));

<script>
/* =================== TEMP SOUND (synthesized; rhythm and emphasis only, never information) ===================
   A soft pulse bed at 96 BPM (30 s = 48 beats, so the loop is in time), every hit one frame after its picture:
   the reveal (a soft bell), the win (a fifth above), the wave (quiet ticks rising), the plates landing (one note per AI, so the
   tally plays a chord), the lock (two notes after 300 ms of silence), one shared neutral tone for both scenarios, the end tone
   (after a silence) ringing into the loop. Two cycles are rendered and the second kept, so the seam carries the tails. */
window.renderAudio=function(){
  const T=window.SC_T,D=window.SC_EVENTS(),dur=window.DUR,SR=48000,CYC=2;
  const ctx=new OfflineAudioContext(2,Math.round(SR*(CYC*dur+0.5)),SR);
  const bus=ctx.createGain();bus.gain.value=.8;const comp=ctx.createDynamicsCompressor();comp.threshold.value=-22;comp.ratio.value=3;comp.attack.value=.006;comp.release.value=.2;
  const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=140;bus.connect(hp);hp.connect(comp);comp.connect(ctx.destination);
  const N={A3:220,Cs4:277.18,D4:293.66,E4:329.63,Fs4:369.99,A4:440,B4:493.88,Cs5:554.37,D5:587.33,E5:659.25,Fs5:739.99,A5:880,B5:987.77,Cs6:1108.7};
  function env(g,t,a,d,v){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0002,t+a+d);g.gain.setValueAtTime(0,t+a+d+.01)}
  function tone(t,f,v,a,d,parts,lp){const o0=ctx.createGain(),fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp||5200;o0.connect(fl);fl.connect(bus);env(o0,t,a,d,v);
    (parts||[[1,1]]).forEach(p=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f*p[0];g.gain.value=p[1];o.connect(g);g.connect(o0);o.start(t);o.stop(t+a+d+.05)})}
  const bell=(t,f,v,d)=>tone(t,f,v,.004,d||1.1,[[1,1],[2,.22],[2.76,.26],[5.4,.05]],6500);
  const pluck=(t,f,v)=>tone(t,f,v,.008,.3,[[1,1],[2,.5],[3,.28]],3000);
  const tick=(t,f,v)=>tone(t,f,v,.002,.07,[[1,1],[2,.3]],6000);
  const wood=(t,f,v)=>tone(t,f,v,.002,.16,[[1,1],[2.01,.45],[3.9,.12]],4200);
  const chord=(t,fs,v,d)=>fs.forEach(f=>tone(t,f,v/fs.length,.006,d,[[1,1],[2,.35],[3,.15]],5000));
  const fr=1/window.FPS;
  for(let cy=0;cy<CYC;cy++){const O=cy*dur,H=s=>O+s+fr;
    /* bed: plucks on the beat, chord by chapter; muted in the two silences */
    const BEAT=60/96,CH=[[0,['A3','E4','A4','E4']],[T.pull[0],['Fs4','Cs5','A4','Cs5']],[T.toBet[0],['D4','A4','D5','A4']],[T.split,['E4','B4','E5','B4']],[T.close[0],['A3','E4','A4','E4']]];
    const MUTE=[[T.lock-0.45,T.lock+0.1],[T.sil[0],T.sil[1]+0.05]];
    for(let k=0;k<Math.round(dur/BEAT);k++){const s=k*BEAT;if(MUTE.some(m=>s>=m[0]-0.3&&s<m[1]))continue;let ch=CH[0][1];CH.forEach(c=>{if(s>=c[0])ch=c[1]});pluck(O+s,N[ch[k%4]],.05*(k%4===0?1:.7))}
    D.forEach(ev=>{const [s,kind,arg]=ev;
      if(kind==='poster')bell(H(s),N.E5,.12,1.4);
      if(kind==='reveal')bell(H(s),N.A4,.22,1.2);
      if(kind==='win')bell(H(s),N.E5,.2,1.2);
      if(kind==='wave')tick(H(s),[N.Cs5,N.D5,N.E5,N.Fs5,N.A5,N.B5,N.Cs6][arg%7],.06);
      if(kind==='land')wood(H(s),[N.A4,N.Cs5,N.E5,N.A5][arg],.085);
      if(kind==='one')bell(H(s),N.A5,.16,1.4);
      if(kind==='lock')chord(H(s),[N.D5,N.A5],.3,1.5);
      if(kind==='split')tick(H(s),N.E5,.12);
      if(kind==='act'){bell(H(s),N.A4,.18,1.2);bell(H(s),N.E5,.12,1.2)}
      if(kind==='seat')bell(H(s),N.E4,.16,.7);
      if(kind==='end')chord(H(s),[N.A4,N.E5,N.A5],.3,3.2)})}
  return ctx.startRendering().then(buf=>{const k0=Math.round(SR*dur*(CYC-1)),n=Math.round(SR*dur);const L=buf.getChannelData(0).subarray(k0,k0+n),Rr=buf.getChannelData(1).subarray(k0,k0+n);
    let pk=0;for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(L[i]),Math.abs(Rr[i]));const gn=pk>0?0.84/pk:1;
    const bytes=44+n*4,ab=new ArrayBuffer(bytes),v=new DataView(ab);const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
    ws(0,'RIFF');v.setUint32(4,bytes-8,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,SR,true);v.setUint32(28,SR*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*4,true);
    for(let i=0,o=44;i<n;i++,o+=4){v.setInt16(o,Math.max(-32767,Math.min(32767,Math.round(L[i]*gn*32767))),true);v.setInt16(o+2,Math.max(-32767,Math.min(32767,Math.round(Rr[i]*gn*32767))),true)}
    const u=new Uint8Array(ab);let s='';for(let j=0;j<u.length;j+=32768)s+=String.fromCharCode.apply(null,u.subarray(j,j+32768));return btoa(s)})};
