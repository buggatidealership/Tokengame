<!doctype html>
<!--
EZ ARENA (concept C, exploration 2026-10-12): the four AIs as contenders on a clean broadcast set.
1:1, 1080 x 1080, 30 s, loops (the last 0.5 s returns to frame 0).
Shots: S1 poster (the NVIDIA card in front of the four contenders, hero line) . S2 the bout (the latest real round:
the round card rises, each contender shows its call, the card flips to the move, the closest right-way call wins)
. S3 the season (timing tower re-sorts through every graded round) . S4 the freeze (#2..#4 fall back, #1 steps out)
. S5 the final (#1 stands behind the NVIDIA card, countdown to zero, the card flips to the bet ticket)
. S6 two scenarios on identical split viewports . S7 the close (disclaimer) and the return to frame 0.
Every number and name comes from ../../../ez-data.js at render time. window.renderAt(t) is a pure function of t (seconds).
Params:  res=540|1080 (WebGL resolution; the DOM layer follows the device scale)  marks=0 (names only, no AI lab marks)
         asof=ISO (the stated render moment, default 2026-10-12T16:00:00Z; the LEDs show the time left to the bet then)
Sound: window.renderAudio() returns a base64 16-bit WAV of the temp score (events read from window.ARENA_T).
-->

  else{g.fillStyle=C.ink2;g.textAlign='center';g.fillText('0',bx+bw/2,ty+th/2+54);g.textAlign='left'}g.restore();
  F(g,600,112,'IS');g.fillStyle=C.ink;const y=960;
  if(!k){g.fillText('Profits buy',80,y);let x=80;g.fillText('back ',x,y+136);x+=g.measureText('back ').width;[['$',C.yel],['E',C.up],['Z',C.dn]].forEach(([c,col])=>{g.fillStyle=col;g.fillText(c,x,y+136);x+=g.measureText(c).width});g.fillStyle=C.ink;g.fillText('.',x,y+136)}
  else{g.fillText('The pot can be',80,y);g.fillText('wiped out.',80,y+136)}
  scTex[k].needsUpdate=true;return key}

/* =================== CAMERAS =================== */
const D2R=Math.PI/180;
function camFrom(tgt,dist,el,az,fov){const e=el*D2R,a=az*D2R;return {p:[tgt[0]+dist*Math.cos(e)*Math.sin(a),tgt[1]+dist*Math.sin(e),tgt[2]+dist*Math.cos(e)*Math.cos(a)],t:tgt,f:fov||26}}
const CAM={
  c1a:camFrom([0,0.16,1.12],6.9,25,0),c1b:camFrom([0,0.16,1.12],6.35,24,0),
  c2:camFrom([0,0.70,0],6.25,5,0),
  c3a:camFrom([-9.98,0.98,0.1],9.4,9,-20),c3b:camFrom([-9.98,0.98,0.1],8.8,8,-15),c4:camFrom([-10.45,1.05,0.0],7.6,7,-13),
  c5a:camFrom([0,0.30,1.40],6.1,22,0),c5b:camFrom([0,0.36,1.12],4.75,15,0),
  c6:camFrom([SX,0.37,0],4.9,3,0)};
const lerp3=(a,b,u)=>a.map((v,i)=>v+(b[i]-v)*u);
function camLerp(A,B,u){return {p:lerp3(A.p,B.p,u),t:lerp3(A.t,B.t,u),f:mix(A.f,B.f,u)}}
function camAt(t,s){if(s===1)return camLerp(CAM.c1a,CAM.c1b,EM(lin(t,0,3.0)));
  if(s===2)return camLerp(CAM.c1b,CAM.c2,EM(lin(t,...T.mv2)));
  if(s===3)return camLerp(CAM.c3a,CAM.c3b,EM(lin(t,...T.mv3)));
  if(s===4)return camLerp(CAM.c3b,CAM.c4,EM(lin(t,T.s4+0.3,T.s4+1.7)));
  if(s===5)return camLerp(CAM.c5a,CAM.c5b,EM(lin(t,...T.mv5)));
  if(s===6)return CAM.c6;
  return CAM.c1a}
function applyCam(c,aspect){cam.position.set(...c.p);cam.lookAt(new THREE.Vector3(...c.t));cam.fov=c.f;cam.aspect=aspect||1;cam.updateProjectionMatrix()}

/* =================== THE FRAME (a pure function of t) =================== */
const $=id=>document.getElementById(id);
const E={hero:$('hero'),cap:$('cap'),sub:$('sub'),veil:$('veil'),end:$('end'),brand:$('brand'),asof:$('asof'),foot:$('foot'),bfade:$('bfade'),tfade:$('tfade')};

{const link=CONFIG.x||CONFIG.buyUrl||'';E.end.querySelector('.ln').textContent=link.replace(/^https?:\/\//,'')}
const CAPS={7:'The pot: '+SHARE+'% of $EZ fees.',2:'Four AIs call stocks|before earnings.',3:'Closest right-way call wins.',4:'Most wins is #1.',5:'Frozen '+LEAD+' hours|before NVIDIA reports.',6:'#1 calls NVIDIA.'};
const SUBS={7:(LAUNCHED?'':'AT LAUNCH \u00b7 ')+'NO STOP LOSS',4:LATE.map(x=>NAME(x.m).toUpperCase()+' JOINED AT ROUND '+x.from).join(' · '),2:'SAME STOCK · SAME MOMENT · SAME PROMPT'};
function vis(e,o,dy){o=cl(o);e.style.opacity=o.toFixed(3);e.style.visibility=o>0.001?'visible':'hidden';e.style.transform=dy?'translateY('+dy.toFixed(1)+'px)':'';return o.toFixed(2)}

  E.cap.style.top=(txt.includes('|')?812:836)+'px';E.sub.style.top=(txt.includes('|')?962:922)+'px';lastCap=txt}}
let lastSub='';function setSub(txt){if(txt!==lastSub){E.sub.textContent=txt;lastSub=txt}}

function contenderState(c,t){const st={lay:EM(lin(t,T.rise[0],T.rise[0]+0.65)),call:fadeIn(t,T.calls[0],T.calls[1]-T.calls[0]),grade:fadeIn(t,T.grade[0],T.grade[1]-T.grade[0]),b:c.b};
  const k=st.lay.toFixed(3)+'|'+st.call.toFixed(2)+'|'+st.grade.toFixed(2);if(k!==c.key){c.key=k;drawContender(c.tex.userData.g,c.m,st);c.tex.needsUpdate=true}
  return st}
function lapIndex(t){let i=-1;T.lapAt.forEach((a,j)=>{if(t>=a)i=j});return i}
function rowsAt(t){/* each row's y slides to its new place over min(0.12 s, lap) */
  const i=lapIndex(t);const L=i<0?null:LAPS[i],P=i<1?null:LAPS[i-1];
  return KEYS.map(m=>{const rk=L?L.ord.indexOf(m):KEYS.indexOf(m),rk0=P?P.ord.indexOf(m):rk;const a=i<0?0:T.lapAt[i],dur=Math.min(0.12,(T.lapAt[i+1]||a+0.5)-a);
    const u=EM(lin(t,a,a+dur));return {m,rank:rk+1,y:mix(ROWY[rk0],ROWY[rk],u),won:L?L.won[m]:0,n:L?L.n[m]:0,mv:L&&P&&rk!==rk0?(rk<rk0?1:-1):0}})}

window.renderAt=function(t){t=((t%DUR)+DUR)%DUR;let s=shotOf(t);
  /* S7's veil covers the set; underneath, the set is already back at frame 0 for the return */
  const early7=s===7&&t<T.endIn[1]+0.05,tt=s===7?(early7?T.s7-0.001:0):t,ss=s===7?(early7?6:1):s;const K=[];
  /* --- contenders + round card (S1, S2) --- */
  const showC=ss<=2;CN.forEach(c=>{setOp(c.grp,showC?1:0);c.sh.visible=c.pl.visible=showC;if(!showC)return;
    const st=contenderState(c,tt);const isWin=c.b&&c.b.win,g=fadeIn(tt,T.grade[0],0.4);
    c.bar.visible=isWin&&g>0.01;c.bar.material.opacity=g;setDim(c.grp,c.b&&!c.b.none&&!c.b.win?1-0.42*g:1);c.pl.material.opacity=c.pl.userData.op*(isWin?1+1.6*g:1-0.5*g)});
  {const u=EM(lin(tt,...T.rise)),f=EM(lin(tt,...T.flip));const o=showC?cl(u*1.4):0;setOp(RC,o);RC.position.set(0,mix(0.40,RCY,u),mix(-0.3,-0.02,u));RC.rotation.y=Math.PI*f;
    rcSh.material.opacity=0.35*u*(showC?1:0)}
  /* --- the NVIDIA card --- */
  const showChip=ss===1||ss===2||ss===5;chip.visible=showChip;chipSh.forEach(x=>x.visible=showChip);chipPool.visible=showChip;
  if(ss===5){const ff=T.ff;let v=R0-tt;if(tt>=ff[0][0]){v=ff[0][1];ff.forEach(([a,val])=>{if(tt>=a)v=val})}K.push(setLED(v))}else K.push(setLED(R0-tt));
  /* --- the tower (S3, S4) --- */
  const showT=ss===3||ss===4;
  const rows=rowsAt(tt);const frozen=ss===4;
  ROWS.forEach((r,j)=>{const st=rows[j];setOp(r.grp,showT?1:0);if(!showT)return;
    let y=st.y,z=0,o=1;const rk=st.rank;
    if(frozen&&rk>1){const k=LADDER.length-rk;const a=T.recede[k]!=null?T.recede[k]:T.recede[T.recede.length-1];const u=EM(lin(tt,a,a+T.recDur));z=-0.9*u;y-=0.18*u;o=1-0.72*u}
    const anon=frozen&&rk===1&&tt>=(T.anon[0]+T.anon[1])/2;
    if(frozen&&rk===1){const u=EIN(lin(tt,...T.exit));r.grp.position.x=TX+5.0*u;y+=0.05*u}else r.grp.position.x=TX;
    r.grp.position.y=y;r.grp.position.z=z;setOp(r.grp,o);
    const a1=frozen&&rk===1?Math.min(1,Math.abs(tt-(T.anon[0]+T.anon[1])/2)/((T.anon[1]-T.anon[0])/2)):1;   /* the swap to "#1" dips through a quick fade */
    r.grp.userData.fm.opacity=o*a1;
    r.bar.visible=rk===1&&st.n>0;
    const kk=[st.rank,st.won,st.n,st.mv,anon?1:0].join('|');if(kk!==r.key){r.key=kk;drawRow(r.tex.userData.g,r.m,{rank:st.rank,won:st.won,n:st.n,mv:st.mv,anon});r.tex.needsUpdate=true}});
  setOp(HD,showT?1:0);HD.children[0].visible=false;
  const li=Math.max(0,lapIndex(tt));if(showT){K.push(drawHead(lapIndex(tt)<0?0:LAPS[li].r.n,frozen?1:0));K.push(drawLap(li))}
  {const lo=showT?(frozen?1-EM(lin(tt,T.recede[0],T.recede[0]+0.5)):fadeIn(tt,T.s3,0.3)):0;setOp(LP,lo*(frozen?1:fadeIn(tt,T.laps0-0.12,0.2)));lapSh.material.opacity=0.6*lo}
  towerSh.visible=showT;
  /* --- #1 on the NVIDIA card (S5) --- */
  const show1=ss===5;setOp(N1,show1?1:0);n1Sh.visible=show1;
  if(show1){const u=EOUT(lin(tt,...T.enter));N1.position.set(mix(-3.4,0,u),0.02+NH/2,N1Z);N1.rotation.y=Math.PI*EM(lin(tt,...T.flip2));n1Sh.position.x=N1.position.x}
  /* --- scenarios (S6) --- */
  const show6=ss===6;SC.forEach(x=>setOp(x,0));scSh.visible=show6;
  let pin=0,act=0,seat=0;if(show6){pin=EOUT(lin(tt,...T.panels));act=lin(tt,...T.act);seat=lin(tt,...T.seat);K.push(drawScenario(0,act,seat),drawScenario(1,act,seat))}

  /* --- render --- */
  if(show6){R.setScissorTest(true);[0,1].forEach(k=>{SC.forEach((x,j)=>setOp(x,j===k?pin:0));SC[k].position.y=0.02+SH/2-0.06*(1-pin);
      applyCam(CAM.c6,0.5);const W=RES/2;R.setViewport(k*W,0,W,RES);R.setScissor(k*W,0,W,RES);R.render(scene,cam)});
    R.setScissorTest(false);R.setViewport(0,0,RES,RES)}
  else{applyCam(camAt(tt,ss));R.render(scene,cam)}

  /* --- the type layer --- */
  const P=(e,o,dy)=>K.push(vis(e,o,dy));
  P(E.hero,s===1?(t<T.heroOut?1:fadeOut(t,T.heroOut+0.3,0.3)):s===7?fadeIn(t,T.endOut+0.05,0.38):0);
  let cap='',co=0,sub='',so=0;
  if(s===2){if(t<T.cap3[0]-0.05){cap=CAPS[2];co=win(t,...T.cap2);sub=SUBS[2];so=win(t,T.cap2[0]+0.25,T.cap2[1])}else{cap=CAPS[3];co=win(t,...T.cap3)}}
  else if(s===3){cap=CAPS[4];co=fadeIn(t,T.cap4[0]);sub=SUBS[4];so=sub?fadeIn(t,T.sub4[0]):0}
  else if(s===4){if(t<T.cap4[1]){cap=CAPS[4];co=fadeOut(t,T.cap4[1],0.15);sub=SUBS[4];so=sub?fadeOut(t,T.cap4[1],0.15):0}else{cap=CAPS[5];co=win(t,...T.cap5)}}
  else if(s===5){if(t<T.cap7[0]-0.05){cap=CAPS[6];co=win(t,...T.cap6)}else{cap=CAPS[7];co=win(t,...T.cap7);sub=SUBS[7];so=win(t,T.cap7[0]+0.2,T.cap7[1])}}
  setCap(cap);P(E.cap,co,(1-co)*10);setSub(sub);P(E.sub,so);K.push(cap,sub);
  /* the close: the end card holds the disclaimer >= 3.1 s, leaves first, then the veil lifts onto frame 0 (no double exposure) */
  P(E.veil,s===7?(t<T.endOut?fadeIn(t,T.endIn[0],0.3):fadeOut(t,T.ret[1],0.42)):0);
  P(E.end,s===7?win(t,T.disc[0],T.endOut,0.35,0.25):0);
  /* $EZ pulses at chapter turns (off-centre, small) */
  const pulses=[[0,3.0],[T.s3,T.s3+1.6],[T.s5,T.s5+1.6],[T.s6,T.s6+1.6],[T.ret[0],DUR+0.3]];
  P(E.brand,Math.max(...pulses.map(([a,b])=>a===0?(t<b?1:fadeOut(t,b+0.3)):win(t,a,b,0.3,0.3))));
  P(E.asof,s===1||s===3||s===4||(s===7&&t>=T.ret[0])?1:0.0);
  P(E.foot,1);
  window.__lastKey=K.join(';');return window.__lastKey};

window.frameName=i=>String(i).padStart(4,'0');
window.__ready=true;
}catch(e){if(!window.__err)window.__err=String(e&&e.stack||e);console.error(e)}

<script>
/* =================== TEMP SOUND (synthesized, offline; every hit marks a change of state, 300 Hz..5 kHz) =================== */
window.renderAudio=async function(){const T=window.ARENA_T,DUR=window.ARENA_DUR,SR=48000;
  const ctx=new OfflineAudioContext(2,SR*DUR,SR);const bus=ctx.createGain();bus.gain.value=0.9;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.attack.value=0.005;comp.release.value=0.2;
  bus.connect(comp);comp.connect(ctx.destination);
  const hz=n=>440*Math.pow(2,(n-69)/12);
  function tone(t,f,dur,amp,type,harm){[1,2,3].forEach((h,i)=>{const k=[1,(harm||0)*0.5,(harm||0)*0.25][i];if(!k)return;const o=ctx.createOscillator();o.type=type||'sine';o.frequency.value=f*h;
    const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp*k,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+0.05)})}
  const nb=ctx.createBuffer(1,SR,SR);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  function tick(t,f,amp,dur){const s=ctx.createBufferSource();s.buffer=nb;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=6;
    const g=ctx.createGain();g.gain.setValueAtTime(amp,t);g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.05));s.connect(bp);bp.connect(g);g.connect(bus);s.start(t,0,0.2)}
  function pad(a,b,notes,amp){notes.forEach(n=>{[0,-6,6].forEach(dt=>{const o=ctx.createOscillator();o.type='triangle';o.frequency.value=hz(n);o.detune.value=dt;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;
    const g=ctx.createGain();g.gain.setValueAtTime(0,a);g.gain.linearRampToValueAtTime(amp,a+0.5);g.gain.setValueAtTime(amp,Math.max(a+0.5,b-0.4));g.gain.linearRampToValueAtTime(0,b);o.connect(lp);lp.connect(g);g.connect(bus);o.start(a);o.stop(b+0.05)})})}
  /* the bed: one soft chord per chapter (A, F#m, D, E, A) with a quiet pulse in eighths at 96 BPM */
  const ch=[[0,T.s3,[57,64,69,73]],[T.s3,T.s5,[54,61,66,69]],[T.s5,T.s6,[50,57,62,66]],[T.s6,T.s7,[52,59,64,68]],[T.s7,DUR,[57,64,69,76]]];
  ch.forEach(([a,b,n])=>pad(a,b,n,0.012));
  const beat=60/96/2;for(let t=0,i=0;t<DUR-0.05;t+=beat,i++){const c=ch.find(([a,b])=>t>=a&&t<b);if(t>=T.s7+0.2&&t<T.ret[0])continue;tone(t,hz(c[2][0]+12),0.12,i%4===0?0.035:0.018,'sine',1)}
  /* events */
  tone(T.rise[1]-0.1,hz(81),0.5,0.07,'sine',1);                              /* the round card arrives */
  tone(T.calls[0]+0.05,hz(88),0.25,0.06,'sine',1);                           /* the four calls land together */
  tick(T.flip[1],2400,0.5,0.06);tone(T.flip[1],hz(76),0.35,0.09,'sine',1);   /* the flip lands */
  tone(T.grade[0]+0.05,hz(83),0.9,0.08,'sine',1);tone(T.grade[0]+0.12,hz(88),0.9,0.06,'sine',1);   /* graded: one neutral two-note chime */
  T.lapAt.forEach((a,i)=>tick(a,1600+i*40,i===0||i>=T.lapAt.length-3?0.32:0.18,0.04));          /* a lap tick per round */
  tone(T.lock,hz(69),1.0,0.07,'sine',1);tone(T.lock,hz(73),1.0,0.05,'sine',1);tone(T.lock,hz(76),1.0,0.05,'sine',1);   /* the freeze */
  T.recede.forEach((a,i)=>tone(a,hz(62-i*2),0.45,0.06,'sine',1));
  tone(T.enter[1]-0.05,hz(57),0.5,0.09,'sine',1);tick(T.enter[1]-0.05,900,0.25,0.06);           /* #1 lands */
  T.ff.forEach(([a],i)=>{if(i<T.ff.length-1)tone(a,hz(76+i),0.18,0.06,'sine',1)});
  tick(T.flip2[1],2400,0.5,0.06);tone(T.flip2[1],hz(69),0.6,0.08,'sine',1);tone(T.flip2[1]+0.08,hz(76),0.6,0.06,'sine',1);   /* the ticket */
  tone(T.panels[1]-0.1,hz(76),0.6,0.07,'sine',1);tone(T.seat[0],hz(71),0.8,0.07,'sine',1);       /* scenarios: one shared neutral tone, A and B together */
  tone(T.endIn[0]+0.2,hz(69),1.6,0.08,'sine',1);tone(T.endIn[0]+0.2,hz(76),1.6,0.05,'sine',1);
