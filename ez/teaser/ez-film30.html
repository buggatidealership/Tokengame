<!doctype html>
<!--
EZ FILM30 "Daylight": the 30 s film (1080 x 1080, 60 fps, 1800 frames, loops). Treatment: film30 LIGHT with the judge's
grafts from DARK (graphite chip body, LED glow, pot beat, identical split viewports, leverage pairing, poster and return,
AS OF stamp, QA) and the merged must-fix list.
Our own things as clean 3D objects on the site's cream (or its navy, theme=navy): the NVIDIA card (media/ez-gpu2.jpg, rights
confirmed by the owner) with the site's LED countdown on its dies, the leaderboard as four cards, #1's bet ticket, the pot
(the site's tank gauge) and the $EZ badge. One move then a hold per shot; no chrome, no gold slab, no glow except the LEDs.
Params:
  pass=plate|type|both  plate = WebGL only (one set for both variants); type = the DOM type layer on transparent; both = preview
  variant=nonuk|uk      uk adds the FCA risk band on every frame (type layer only)
  asof=ISO              the stated render date: the LEDs show the true time left to the bet at that moment ("AS OF")
  theme=cream|navy      cream (default) or the navy cut (the site's dark mode), same frame table and sound
  marks=1               the AI labs' marks on the leaderboard cards (default off until counsel; names stay)
  res=540               a faster low-res plate for previews (the type layer stays at 1080)
Every number on screen comes from ../ez-data.js at render time (window.FILM_STRINGS lists each string and its source).
window.renderAt(t) is a pure function of t. window.frameName(i) is a key of everything the frame is drawn from, so holds share
one plate (render.js SKIP_EXISTING). Sound: ez-film30-audio.js reads window.FILM_PIC (the same frame table).
-->

{const raw=SIM.betDate||CONFIG.betDate,b=md(raw)||isoD(raw);

  :{ground:'#0b1330',shadow:'#000000',shT:.55,shW:.35,pool:.10,poolC:'#9fb0ff',env:.55,key:2.0,keyC:'#ffffff',rim:2.6,hemi:.10,hemiS:'#dfe6f2',hemiG:'#0b1330',

/* =================== 1. THE NVIDIA CARD =================== */

const CW=1.834,CD=1.362,CT=0.05,HOVER=0.045,PX=px=>(px-999)/1000,PZ=py=>(py-744)/1000;   /* 1 unit = 1000 photo px; crop x 82..1916, y 63..1425 */

  if(s===3){const o=f<T.s3b?lerpCam(L0,L1,EM(lin(f,T.s3,T.s3m))):lerpCam(L1,L2,EM(lin(f,T.s3b,T.s4-1)));place(o);K.push(camKey(o));

    LBC.forEach(c=>{c.grp.visible=c.i===0});const c=LBC[0];c.grp.position.x=0;
    const ov=1-EOUT(lin(f,T.nameFade,T.nameFade+30)),rot=Math.PI*EM(lin(f,T.flip,T.flip+T.flipDur));
    cardState(c,0.03,0,ov,1,0.62,0.9,rot);
    const a=inA(f,T.row1),b=inA(f,T.row2),d=inA(f,T.row3);drawTicket(a,b,d);
    const lk=pop(lin(f,T.lock,T.lock+T.lockDur));c.lock.visible=lk>0;c.lock.scale.setScalar(Math.max(lk,0.001));
    K.push([ov,rot,a,b,d,lk].map(r4).join(','))}
  if(s===5){const o=lerpCam(S0,S1c,EM(lin(f,T.s5,T.s5m)));place(o);K.push(camKey(o));
    const st={lv:LV0*EM(lin(f,T.fill0,T.fill1)),slice:{u:0,flip:0},zero:0};setTank(st);K.push(JSON.stringify(st,(k,v)=>typeof v==='number'?r4(v):v))}
  if(s===6){const act=EM(lin(f,T.act0,T.act1)),seat=lin(f,T.seat0,T.seat1);
    const A={lv:LV0,slice:{u:act,flip:seat},zero:0},B={lv:LV0*(1-act),slice:{u:0,flip:0},zero:0.62*EOUT(seat)};
    SPLIT={A,B};K.push(camKey(SPL),JSON.stringify(SPLIT,(k,v)=>typeof v==='number'?r4(v):v))}
  return K.join('|')}
function cardState(c,y,g,ov,bar,shk,shw,rot){c.grp.position.y=y;c.grp.rotation.y=rot;
  c.bodyMat.color.copy(CARDC).lerp(GHOSTC,0.82*g);
  c.faceMat.color.setScalar(1-0.80*g);c.faceMat.emissive.copy(GHOSTC);c.faceMat.emissiveIntensity=0.80*g;
  c.ovMat.opacity=ov*(1-0.85*g);
  c.bar.visible=bar>0;c.bar.scale.set(Math.max(bar,0.001),1,1);
  c.sh.position.set(c.grp.position.x,0.002,0);c.shw.position.set(c.grp.position.x,0.0015,0.05);
  c.sh.material.opacity=c.sh.userData.op*shk;c.shw.material.opacity=c.shw.userData.op*shw;c.sh.visible=c.shw.visible=c.grp.visible;

  else R.render(scene,cam)}

function vis(e,o,dy){if(!e)return'';o=Math.max(0,Math.min(1,o));e.style.opacity=o.toFixed(3);e.style.visibility=o>0?'visible':'hidden';e.style.transform=dy?'translateY('+dy.toFixed(1)+'px)':'';return o?o.toFixed(3)+(dy?'/'+dy.toFixed(1):''):'0'}
function enter(f,a,b){/* in over 31 f (ease-out, 14 px rise), out over 18 f (ease-in, 10 px up); b null = cut */const i=inA(f,a),o=b!=null?outA(f,b):0;return [i*(1-o),(1-i)*14-o*10]}
function applyType(f){const s=shotOf(f),K=[VAR,THEME,DATAKEY.length,hash(DATAKEY)];const P=(e,v)=>K.push(vis(e,v[0],v[1]));
  /* S1 (and the return): line 1 is on screen at f0 (the poster) and fades back in over the last 18 frames */

/* =================== QA: the reserve zone, the loop seam, the reading rule =================== */
const V3=new THREE.Vector3(),BX=new THREE.Box3();
function scr(obj,half,xoff){const b=[1e9,1e9,-1e9,-1e9];obj.updateMatrixWorld(true);BX.makeEmpty();const bb=new THREE.Box3();
  obj.traverseVisible(m=>{if(m.isMesh&&!m.isInstancedMesh&&m.geometry){m.geometry.computeBoundingBox();bb.copy(m.geometry.boundingBox).applyMatrix4(m.matrixWorld);BX.union(bb)}});
  for(const x of [BX.min.x,BX.max.x])for(const y of [BX.min.y,BX.max.y])for(const z of [BX.min.z,BX.max.z]){V3.set(x,y,z).project(cam);
    const X=(V3.x+1)/2*(half?540:1080)+(xoff||0),Y=(1-V3.y)/2*1080;b[0]=Math.min(b[0],X);b[1]=Math.min(b[1],Y);b[2]=Math.max(b[2],X);b[3]=Math.max(b[3],Y)}return b.map(Math.round)}
window.FILM_BOUNDS=f=>{applyPlate(f);const s=shotOf(f),out=[];
