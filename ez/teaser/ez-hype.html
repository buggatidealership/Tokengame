<!doctype html>
<!--
EZ HYPE FILM, Option A "The Pot" (treatment + adversarial review, 2026-10-11). This file builds the 15 s cut.
PASSES (one page, URL params):
  ?pass=plate          WebGL only: the 3D plate of master frame m (no type, no vignette, no grain). Files are named
                       m0000-<plate key>.png, the key hashing every input of that plate (plateKey).
  ?pass=type           2D only: loads plate m from __plates/ (render.js serves PLATES=dir there), adds vignette, grain, scrims and type.
  ?pass=both           both in one page (quick previews).
  &variant=std|uk      std: AD rail, data stamps, leverage paired with "THE POT CAN BE WIPED OUT.", equal split, end disclaimer card.
                       uk : std plus the FCA band (COBS 4.12A.11R(1)(d), Instrument Sans 700 at 36 px, white, 2 px black border) on every frame.
  &cut=15              the 900-frame cut (critique must-fix 2). The 30 s and the 9:16 come later from the same master plates.
  &ns=N                subframes (default: the shot table's own value). &res=960 renders plates at 960 for the upscale fallback.
MASTER TIMELINE: plates are keyed by the 30 s master frame (0..1799), so the 15 s cut and the later 30 s share them.
DATA: every number and name comes from ../ez-data.js at render time (hypeData below). Nothing on screen is typed by hand
      except fixed copy and the legal texts.
LOOK: the loop's navy studio, chrome F0 0.92, EZ yellow lights, glossy floor; one accent (#ffc72c); green/red only on up/down data.
      No springs, pops, rotations, wipes, splats or confetti. Out drops sink through the floor. Impact squash no deeper than 0.9.
SOUND: window.renderAudio(): 120 BPM, D minor, sub thuds, pitched metal resonances, filtered granular liquid; no bloops,
      gurgles or whistles. Every hit lands 1 frame after its picture.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>EZ Hype Film</title>
<meta name="viewport" content="width=1080">
<style>
@font-face{font-family:"IS";src:url(fonts/instrument-sans-latin-wdth-normal.woff2) format("woff2");font-weight:400 700;font-stretch:75% 100%}
@font-face{font-family:"GM";src:url(fonts/geist-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 900}
:root{--cream:#f4efe6;--ink:#07080d;--yel:#ffc72c;--up:#1fcf6b;--dn:#ff4136}
html,body{margin:0;background:#07080d}
#stage{position:relative;width:1080px;height:1080px;overflow:hidden;background:#07080d}
#gl{position:absolute;left:0;top:0}
#bg{position:absolute;left:0;top:0;width:1080px;height:1080px}
#ov{position:absolute;inset:0;pointer-events:none}
.ab{position:absolute}
.scrim{position:absolute;left:0;right:0}

  font-family:"IS";font-weight:600;font-stretch:100%;font-size:34px;line-height:1.22;color:var(--cream);padding:10px 18px 11px;text-wrap:balance}
#band{left:24px;right:24px;bottom:96px;height:160px;background:#fff;border-radius:4px;box-sizing:border-box}

/* &mica=1 (only if counsel says MiCA Art 7 applies): a top band for the whole runtime; the rail moves under it */

.mi #rail{top:158px}.mi #stamp{top:170px}
</style>

<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="bg" width="1080" height="1080"></canvas><div id="ov"></div></div>
<script src="../ez-data.js"></script>
<script>
(function(){
"use strict";
var Q=new URLSearchParams(location.search);
var PASS=Q.get("pass")||"both",VAR=Q.get("variant")||"std",CUT=Q.get("cut")||"15",NSQ=Q.get("ns"),RES=+(Q.get("res")||1080);
var FPS=60;window.FPS=FPS;

/* ======================================================================================================
   1. DATA: every on-screen value, computed from ez-data.js. STRINGS records which field produced what.
   ====================================================================================================== */
var STRINGS=[];function S(text,src){STRINGS.push({text:text,src:src});return text}
/* the lab behind each model, for the non-affiliation line (names only, never marks). A new model fails the build. */
var LABS={GPT:"OPENAI",KIMI:"MOONSHOT AI",CLAUDE:"ANTHROPIC",GROK:"XAI"};
function hypeData(){
  if(MODEL_KEYS.length!==4)throw new Error("EZ hype needs exactly 4 AIs in MODEL_KEYS, got "+MODEL_KEYS.length);
  MODEL_KEYS.forEach(function(m){if(!LABS[m])throw new Error("EZ hype: no lab name for model "+m+" (add it to LABS in ez-hype.html)")});
  if(!ROUNDS.length)throw new Error("EZ hype needs at least one graded round");
  var RS=ROUNDS.slice().sort(function(a,b){return a.n-b.n}),LAST=RS[RS.length-1];
  /* "STANDINGS AS OF ROUND N" is only true if every round up to N is graded */
  var gap=[].concat(PENDING,UPCOMING).filter(function(u){return u.n<LAST.n}).map(function(u){return u.n});
  if(gap.length)throw new Error("EZ hype: round(s) "+gap.join(",")+" not graded but round "+LAST.n+" is; the standings stamp would be wrong");
  /* SHOWCASE ROUND (critique must-fix 11), a stated rule, not a pick: the latest graded round in which every AI called,
     with a winner and at least two right-way calls (so "CLOSEST WINS" is visible). If none qualifies: the latest graded round. */
  var R=null,showRule="latest graded round with all "+MODEL_KEYS.length+" calls, a winner and at least two right-way calls";
  for(var k=RS.length-1;k>=0&&!R;k--){var r=RS[k],upk=r.a>0,right=r.calls.filter(function(c){return (c[1].split(" ")[0]==="UP")===upk}).length;
    if(r.calls.length===MODEL_KEYS.length&&r.win&&right>=2)R=r}
  if(!R){R=LAST;showRule="latest graded round (no round met the showcase rule)"}
  var MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  function md(s){var m=String(s||"").match(/(\d+)\/(\d+)\/(\d+)/);return m?[2000+(+m[3]%100),+m[1]-1,+m[2]]:null}
  var bd=md(SIM.betDate||CONFIG.betDate),betSrc="SIM.betDate || CONFIG.betDate",bet=null;
  if(bd)bet={mon:MON[bd[1]],day:bd[2]};
  else{var nv=[].concat(UPCOMING,PENDING).filter(function(u){return u.ticker==="NVDA"})[0],c0=nv&&md(nv.called);
    if(c0){var dt=new Date(Date.UTC(c0[0],c0[1],c0[2]));do{dt=new Date(dt.getTime()+864e5)}while(dt.getUTCDay()===0||dt.getUTCDay()===6);
      bet={mon:MON[dt.getUTCMonth()],day:dt.getUTCDate()};betSrc="SHEET NVDA row (round "+nv.n+") CALL DATE "+nv.called+", next weekday (the site's rule)"}}
  var up=R.a>0,wins=R.win?R.win.split(" & "):[];
  var drops=MODEL_KEYS.map(function(m){var c=R.calls.filter(function(c){return c[0]===m})[0];
    var dir=c?c[1].split(" ")[0]:null,mag=c?c[1].split(" ")[1]:"";
    return {m:m,name:MODELS[m].name,dir:dir,mag:mag,ok:c?((dir==="UP")===up):false,has:!!c,win:wins.indexOf(m)>-1}});
  var lad=LADDER.map(function(L){return {m:L.m,name:MODELS[L.m].name,won:L.won}});
  /* THE RACE (critique must-fix 4): standings after each graded round, by the site's rule (wins, then the smaller average
     miss to date; equal wins do not share a place). The lanes keep the drops' order (MODEL_KEYS, left to right, as in A4/A5;
     QA 2026-10-11), so no AI swaps places across the cut; "#1" marks the leader. has[i]: lane i's AI had made a call by then
     (an AI that joined later shows no count before its first round; QA: GROK joined at round 9). */
  var lanes=MODEL_KEYS.map(function(m){return {m:m,name:MODELS[m].name,won:(LADDER.filter(function(L){return L.m===m})[0]||{}).won}});
  var tal={};MODEL_KEYS.forEach(function(m){tal[m]={won:0,n:0,err:0}});
  var steps=RS.map(function(r){var a=r.a,wn=r.win?r.win.split(" & "):[];
    r.calls.forEach(function(c){var p=c[1].split(" "),v=(p[0]==="DOWN"?-1:1)*parseFloat(p[1]),T=tal[c[0]];T.n++;T.err+=Math.abs(v-a)});
    wn.forEach(function(m){tal[m].won++});
    var order=MODEL_KEYS.filter(function(m){return tal[m].n}).sort(function(x,y){return (tal[y].won-tal[x].won)||(parseFloat((tal[x].err/tal[x].n).toFixed(2))-parseFloat((tal[y].err/tal[y].n).toFixed(2)))});
    return {n:r.n,date:fmtDate(r.resolves).toUpperCase(),won:lanes.map(function(l){return tal[l.m].won}),has:lanes.map(function(l){return tal[l.m].n>0}),lead:lanes.map(function(l){return l.m}).indexOf(order[0])}});
  var fin=steps[steps.length-1];lanes.forEach(function(l,i){if(fin.won[i]!==l.won)throw new Error("EZ hype: race tally for "+l.m+" ("+fin.won[i]+") disagrees with LADDER ("+l.won+")")});
  if(lanes[fin.lead].m!==lad[0].m)throw new Error("EZ hype: race leader disagrees with LADDER[0]");
  /* the NVDA round (the bet), for the stamp-width check: every standings stamp up to it must fit beside the rail */
  var nvR=[].concat(UPCOMING,PENDING,RS).filter(function(u){return u.ticker==="NVDA"}).map(function(u){return u.n});
  return {R:R,showRule:showRule,n:R.n,co:R.co.toUpperCase(),ticker:R.ticker,out:R.out,up:up,drops:drops,wins:wins,lad:lad,lanes:lanes,steps:steps,
    nvRound:nvR.length?Math.max.apply(null,nvR):LAST.n,
    lastN:LAST.n,lastDate:fmtDate(LAST.resolves).toUpperCase(),labs:MODEL_KEYS.map(function(m){return LABS[m]}),
    bet:bet,betSrc:betSrc,betSet:!!bd,lev:SIM.leverage!=null?SIM.leverage:null,
    pool:SIM.poolShare!=null?Math.round(SIM.poolShare*100):null,launched:!!CONFIG.launched,x:String(CONFIG.x||"").trim(),nAI:MODEL_KEYS.length};
}
var D=hypeData();window.HYPE_DATA=D;window.HYPE_STRINGS=STRINGS;

/* ======================================================================================================
   2. EASING AND VECTORS
   ====================================================================================================== */
function sat(x){return x<0?0:x>1?1:x}
function lerp(a,b,t){return a+(b-a)*t}
function eio(x){x=sat(x);return x*x*(3-2*x)}
function eOutCubic(x){x=sat(x);return 1-Math.pow(1-x,3)}
function eInQuad(x){x=sat(x);return x*x}
function eInCubic(x){x=sat(x);return x*x*x}
function eOutExpo(x){x=sat(x);return x>=1?1:1-Math.pow(2,-10*x)}
function eioSine(x){x=sat(x);return .5-.5*Math.cos(Math.PI*x)}
function eioQuart(x){x=sat(x);return x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2}
function bez(x1,y1,x2,y2){return function(x){x=sat(x);if(x===0||x===1)return x;var t=x;
  for(var i=0;i<8;i++){var cx=3*x1*t*(1-t)*(1-t)+3*x2*t*t*(1-t)+t*t*t-x,d=3*x1*(1-t)*(1-t)+6*(x2-x1)*t*(1-t)+3*(1-x2)*t*t;if(Math.abs(d)<1e-6)break;t=sat(t-cx/d)}
  return 3*y1*t*(1-t)*(1-t)+3*y2*t*t*(1-t)+t*t*t}}
var EIN=bez(.16,1,.3,1),EOUT=bez(.7,0,.84,0);
function v3(x,y,z){return [x,y,z]}
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function norm(a){var l=Math.hypot(a[0],a[1],a[2]);return [a[0]/l,a[1]/l,a[2]/l]}
function lerp3(a,b,t){return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]}
/* the camera, as the shader builds it. cx = viewport centre in 1080 px; returns pixel position, top-left origin */
function project(c,P,cx){var fw=norm(sub(c.ta,c.ro)),u0=Math.abs(fw[1])>.95?[0,0,-1]:[0,1,0],rt=norm(cross(fw,u0)),up=cross(rt,fw);
  var d=sub(P,c.ro),z=dot(d,fw),f=1/Math.tan(c.fov*Math.PI/360);
  return [(cx==null?540:cx)+f*dot(d,rt)/z*540,540-(f*dot(d,up)/z+c.sh)*540]}

/* ======================================================================================================
   3. THE SHOT TABLE (master 30 s timeline, 1800 frames, 120 BPM, 1 bar = 120 f).
      {id, f0, f1, prog, ns, cam(f), st(f) -> {s: 16 vec4 of scene state, T?, anchors}, box(f)}
      Shots marked todo:true are in the 30 s only and are not built yet.
   ====================================================================================================== */
var CHIPY=-.9,SH=.35;
var XS=[-2.1,-.7,.7,2.1];
/* --- LOOP time-warps --- */
function warpA1(f){return .95+1.65*(1-Math.pow(1-sat(f/120),2.2))}
function warpA14(f){return f<1668?2.6+1.6*(f-1560)/108:4.2+2.75*(f-1668)/132}
function warpSplitL(f){return f<=1392?.7+1.7*(f-1320)/72:2.4+.04*sat((f-1392)/167)}
function loopBox(sc,o){o=o||[0,-1,0];return [[o[0]-3*sc,o[1]-.05*sc,o[2]-1.05*sc],[o[0]+3*sc,o[1]+3.3*sc,o[2]+1.05*sc]]}
function slots(){return new Float32Array(64)}
function put(s,i,a,b,c,d){s[i*4]=a;s[i*4+1]=b;s[i*4+2]=c;s[i*4+3]=d}

/* --- FOUR: four AI drops (A3 pinch is 30 s only; A4 hover with calls; A5 graded) --- */
var WRONG=[],WIN_X=0,RIGHT_X=0;(function(){var k=0;D.drops.forEach(function(d,i){WRONG[i]=d.has&&!d.ok?k++:-1});
  var wx=D.drops.map(function(d,i){return d.win?XS[i]:null}).filter(function(x){return x!=null});WIN_X=wx.length?wx.reduce(function(a,b){return a+b},0)/wx.length:0;
  var rx=D.drops.map(function(d,i){return d.has&&d.ok?XS[i]:null}).filter(function(x){return x!=null});RIGHT_X=rx.length?(Math.min.apply(null,rx)+Math.max.apply(null,rx))/2:0})();
window.HYPE_WRONG=WRONG;
function fourDrop(i,f){var t=f/60,hov=.35+.025*Math.sin(2*Math.PI*(t/3+i/4)),y=hov,ring=null,lab=hov;
  var d=D.drops[i];
  if(WRONG[i]>=0&&f>=368){var fs=368+3*WRONG[i];
    if(f<fs+24){y=hov-(hov+1)*eInQuad((f-fs)/24)}else{y=-1-.78*eOutCubic((f-fs-24)/34)}
    var fc=fs+24*Math.sqrt((hov+1-.52)/(hov+1));if(f>=fc)ring=[XS[i],0,(f-fc)/60,.035];
    lab=.35}
  if(d.win&&f>=400){y=hov+.3*eOutCubic((f-400)/40);lab=y}
  return {p:[XS[i],y,0],r:.52,ring:ring,lab:[XS[i],lab+.52+.18,0]}}
function fourSt(f){var s=slots(),an=[];put(s,0,0,0,0,0);put(s,1,1,1,1,.05);
  for(var i=0;i<4;i++){var q=fourDrop(i,f);put(s,2+i,q.p[0],q.p[1],q.p[2],q.r);an.push(q.lab);if(q.ring)put(s,12+i,q.ring[0],q.ring[1],q.ring[2],q.ring[3])}
  put(s,6,f/60,.008,3.2,0);return {s:s,anchors:an}}
function fourCam(f){
  if(f<420){var z=f<360?9.0-.6*eio((f-240)/120):8.4-.15*eio((f-360)/60);return {ro:[0,.45,z],ta:[0,.1,0],fov:38,sh:.05}}   /* low enough that the rising winner's label clears the non-affiliation line */
  /* the push frames every right-way drop (the winner and the ones it beat), so "CLOSEST WINS" is visible */
  var u=eioQuart((f-420)/60),yt=(winY(f)+.35)/2;return {ro:[lerp(0,RIGHT_X,u),lerp(.45,yt+.3,u),lerp(8.25,7.0,u)],ta:[lerp(0,RIGHT_X,u),lerp(.1,yt,u),0],fov:38,sh:lerp(.05,.16,u)}}
function winY(f){var ys=[];for(var i=0;i<4;i++)if(D.drops[i].win)ys.push(fourDrop(i,f).p[1]);return ys.length?ys.reduce(function(a,b){return a+b},0)/ys.length:.35}
/* --- RACE (critique must-fix 4): columns grow round by round from the graded record (D.steps) from m480, at most one round
       per 32nd note (3.75 f), lanes in MODEL_KEYS order (the drops' order); each new win eases in over 8 f, so the column never
       jumps. The last round is counted by m480+57 at the latest, so its column has settled by m545 and the final standings
       hold at least 24 f (0.4 s) before the 15 s cut leaves the race at m569 (QA 2026-10-11). --- */
var RACE_M0=480,RACE_SPAN=57,RACE_EASE=8,RACE_STEP=Math.min(3.75,RACE_SPAN/Math.max(1,D.steps.length-1)),RACE_H=1.4;
function raceT(j){return RACE_M0+j*RACE_STEP}                                  /* master frame at which round j (0-based) is counted */
function raceK(f){return Math.max(0,Math.min(D.steps.length,Math.floor((f-RACE_M0)/RACE_STEP+1e-9)+1))}   /* rounds counted at f */
function raceW(i,f){var w=0,prev=0;for(var j=0;j<D.steps.length;j++){var c=D.steps[j].won[i],dw=c-prev;prev=c;if(dw)w+=dw*eOutCubic((f-raceT(j))/RACE_EASE)}return w}
function raceH(i,f){return -.9+RACE_H*raceW(i,f)/Math.max(1,Math.max.apply(null,D.lanes.map(function(l){return l.won})))}
function raceSt(f){var s=slots(),an=[];for(var i=0;i<4;i++){var x=-2.1+1.4*i,h=raceH(i,f);put(s,i,x,h,.31,0);an.push({name:[x,-1.0,1.05],top:[x,h+.31+.14,0],h:h})}
  put(s,4,2.85,.1,.95,-1);put(s,5,f/60,.008,3.2,0);return {s:s,anchors:an}}
/* camera from the review (ro.y .55, ta.y .05): no "porthole" reflections, the pool reads as a pool */
function raceCam(f){var u=eioSine((f-480)/120),rx=lerp(-.5,.5,u);return {ro:[rx,.55,9.1],ta:[.5*rx,.05,0],fov:38,sh:.23}}
/* --- FEES (critique must-fix 8): two straight streams of round beads; each lands one every 30 f, offset by 15 f, so
       together one bead lands per 8th note. Blend k .08, a small ripple ring per landing. --- */
var FEE_N=2,STREAM_X=[-.2,.26],STREAM_Z=[-.08,.1],FEE_PER=30,FEE_V=.056,FEE_SP=FEE_PER*FEE_V,FEE_R=[.13,.15];
function feesPot(f){var r=.80+.25*eOutCubic((f-840)/120);return {c:[0,-1+r,0],r:r}}
function feeHit0(i){return 840+15*i}
function feesSt(f){var s=slots(),P=feesPot(f);put(s,0,P.c[0],P.c[1],P.c[2],P.r);put(s,1,f/60,.008,3.2,.08);
  for(var i=0;i<FEE_N;i++){var x=STREAM_X[i],z=STREAM_Z[i],top=P.c[1]+Math.sqrt(Math.max(0,P.r*P.r-x*x-z*z)),E=[x,top,z],A=[x*1.6,6,z-.3],Dd=norm(sub(A,E));

/* ---- timing (out frames), derived from the cut and the plate events, never typed twice ---- */
var SEG={};CT.forEach(function(c){SEG[c[2]]={o0:c[0],o1:c[1],m0:c[3]}});

window.HYPE_PIC={outOf:outOf,seg:SEG,N:N,warpA1:warpA1,warpA14:warpA14,warpSplitL:warpSplitL,

    return {m:raceT(j),lanes:st.won.map(function(w,i){return w-prev[i]}).map(function(d,i){return d?i:-1}).filter(function(i){return i>=0}),lead:st.lead,leadChange:j>0&&st.lead!==D.steps[j-1].lead}}),

/* ---- elements ---- */
var E={};

  E.spL=h("div","ab half");E.spR=h("div","ab half");
  [[E.spL,C.splitL],[E.spR,C.splitR]].forEach(function(q){h("div","mono k",esc(q[1][0]),q[0]);var b=h("div","hd",null,q[0]);
    q[0].__l=q[1].slice(1).map(function(t){var l=h("div","ln",null,b);return h("span",null,esc(t),l)})});
  E.legal=h("div","ab",C.legal.map(esc).join("<br>"));E.legal.id="legal";E.legal.style.top=L.legalTop+"px";

/* THE RAIL STAMP never touches the rail (QA 2026-10-11). fitStamp shrinks it from 28 px, one px at a time, until it clears the
   rail by STAMP_GAP; below STAMP_MIN px it throws (the render stops) rather than overlap. stampCheck runs once per type pass:
   every standings stamp up to the NVDA round (the bet; the widest day, mono digits), the race stamp at that count, the
   showcase round's stamp and the bet stamp must all fit, so a later sheet sync cannot push the stamp into the rail. */
var STAMP_FS=28,STAMP_MIN=22,STAMP_GAP=16;
function fitStamp(txt){E.stamp.textContent=txt;show(E.stamp,!!txt);if(!txt)return STAMP_FS;
  var rr=document.getElementById("rail").getBoundingClientRect().right,fs=STAMP_FS;
  for(;fs>=STAMP_MIN;fs--){E.stamp.style.fontSize=fs+"px";if(E.stamp.getBoundingClientRect().left>=rr+STAMP_GAP)return fs}
  throw new Error("EZ hype: the rail stamp \""+txt+"\" overlaps the rail even at "+STAMP_MIN+" px")}
function stampCheck(){var t=[],day="SEP 30";
  for(var n=1;n<=D.nvRound;n++)t.push("STANDINGS AS OF ROUND "+n+" · "+day);
  t.push("WINS · ROUNDS "+D.steps[0].n+" TO "+D.nvRound,C.raceRun,C.rnd,C.stand);if(C.betl)t.push(C.betl);
  var worst=STAMP_FS;t.forEach(function(x){worst=Math.min(worst,fitStamp(x))});fitStamp("");
  window.HYPE_STAMP_CHECK={n:t.length,upTo:D.nvRound,smallestPx:worst}}
function show(e,on){if(e)e.style.display=on?"":"none"}
function posB(e,bottom,left){e.style.left=(left==null?48:left)+"px";e.style.bottom=(1080-bottom)+"px";e.style.top=""}
/* type is set hard on the cut and switches off hard (critique must-fix 2): no slide-ups, no exits. A line can carry its
   own on-frame (an event, e.g. the impact). */
function block(e,on,f,bottom,lineOn){show(e,on);if(!on)return;posB(e,bottom);
  e.__l.forEach(function(s,k){s.style.visibility=(lineOn&&lineOn[k]!=null&&f<lineOn[k])?"hidden":"visible"})}

function typeFrame(i){
  var pl=plateOf(i),m=pl.m,seg=pl.id;
  var cardOn=i>=T_CARD0&&i<=T_END,legalOn=i>=SEG.A4.o0&&i<=T_END;   /* the card holds 630..884 (4.25 s); the line whenever names, NVIDIA or the chip show */
  show(E.card,cardOn);var cardTop=L.cardB;

  else if(seg==="A11"||seg==="A12")st=C.stand;
  else if(seg==="A14"&&i<=T_END&&C.betl)st=C.betl;
  fitStamp(st);
  show(E.div,seg==="A13");E.div.style.height=(cardOn?cardTop:1080)+"px";
  /* top scrim: nearly solid to y 150 over the fee beads (A9) and the falling pot (A11 before the impact), so nothing passes
     behind the legal line or the stamp (QA 2026-10-11); deep over the impact's first frames and the A12 macro; light elsewhere */
  var solid=seg==="A9"||(seg==="A11"&&i<T_HIT),deep=(seg==="A11"&&i<T_HIT+4)||seg==="A12",mo=MICA?150:0;
  E.scrT.style.cssText="top:0;height:"+((solid||deep?300:200)+mo)+"px;background:"+(solid?"linear-gradient(rgba(7,8,13,.97) 0,rgba(7,8,13,.97) "+(150+mo)+"px,rgba(7,8,13,.62) "+(220+mo)+"px,rgba(7,8,13,0) "+(300+mo)+"px)"
    :deep?"linear-gradient(rgba(7,8,13,.88),rgba(7,8,13,.62) 50%,rgba(7,8,13,0))":"linear-gradient(rgba(7,8,13,.6),rgba(7,8,13,.3) 55%,rgba(7,8,13,0))");
  /* captions */
  block(E.hook,seg==="A1"||i>T_END,i,capB);

  block(E.graded,seg==="A5",i,capB);

  /* drop labels: names set on the cut, calls tick on at 16ths; wrong calls dim and strike as their drops fall; the winner gets the tag as it rises */
  var four=seg==="A4"||seg==="A5";

    var c=fourCam(m),an=fourSt(m).anchors[k],p=project(c,an);L4.w.style.left=p[0].toFixed(1)+"px";L4.w.style.top=p[1].toFixed(1)+"px";
    L4.cl.style.visibility=(seg==="A4"&&i<callAt(k))?"hidden":"visible";
    var d=D.drops[k],out=seg==="A5"&&WRONG[k]>=0,dim=out?sat((m-368-3*WRONG[k])/10):0;

    show(L4.tg,seg==="A5"&&d.win&&m>=400)});
  /* race: names under the lanes, each lane's wins after the latest counted round (none before that AI's first call), "#1" on the leader at that round */
  var race=seg==="A6",k=race?Math.max(1,raceK(m)):0,ld=race?D.steps[k-1].lead:-1;
  show(E.one,race);
  E.race.forEach(function(R,j){show(R.nm,race);show(R.num,race&&D.steps[k-1].has[j]);if(!race)return;
    var c=raceCam(m),an=raceSt(m).anchors[j],pn=project(c,an.name),pt=project(c,an.top);
    R.nm.style.left=pn[0].toFixed(1)+"px";R.nm.style.top=pn[1].toFixed(1)+"px";
    R.num.textContent=String(D.steps[k-1].won[j]);
    R.num.style.left=pt[0].toFixed(1)+"px";R.num.style.top=pt[1].toFixed(1)+"px";
    if(j===ld){E.one.style.left=pt[0].toFixed(1)+"px";E.one.style.top=(pt[1]-50).toFixed(1)+"px"}});
  /* split: both sides, same size, same frames */
  var sp=seg==="A13";show(E.spL,sp);show(E.spR,sp);
  if(sp){posB(E.spL,L.split,0);posB(E.spR,L.split,540)}
  /* furniture */
  show(E.legal,legalOn);
}
