EZ FILMS ROUND 2, "THE OBJECT: one glass $ pot, one call" (slug object, treatment T2). Spec: scratchpad/films-r2/spec-object.md.
26.0 s, 1080 x 1080, 60 fps (fps=30 fallback), loops to frame 0 in picture and sound. (v1 was 24.0 s; fix round 1 holds the
payoff 3.0 s and the 10x pair 3.5 s: films-r2/object/fix-r1.md.)
One sentence: an AI makes one call; the whole $ pot rides on it.
A porcelain set, a smoked-glass $ pot with a gold $ inlay on the navy $EZ plinth, gold $ coins. Every $EZ trade (buy or sell) sheds
a $ coin at a FEE gate, a glass Y splits the coins exactly SIM.poolShare : 1 - SIM.poolShare (Bresenham), the round card flips from
the calls to the real move, the leaderboard freezes under a frosted cover, #1 rises between up and down, the whole $ pot pours onto
the call (10x leverage, the pot can be wiped out), two equal outcomes, then the NVIDIA chip counts down to the planned bet.

  pass=plate|type|both   plate = WebGL only (subframes averaged in the page); type = DOM type on transparent; both = preview
  variant=uk|nonuk       uk adds the FCA risk band (exact text and style of ez-hype.html) on every frame (type layer)

  fps=60|30  res=1080|540  ns=N (force subframes)

window.frameName(i) keys a plate by everything it is drawn from (render.js SKIP_EXISTING resumes). Sound: ez-r2-object-audio.js
reads window.R2_PIC (the same timing table the picture uses).
The $ glyph outline below is Mona Sans (SIL OFL) at wdth 75, wght 800, extracted with fontTools (instancer + SVGPathPen).
-->

const TRAYP=new THREE.Vector3(-0.86,0,-0.30),TRW=1.24,TRH=0.30,TRD=0.78;   /* the bet tray (front left of the pot) */
const CHIPP=new THREE.Vector3(-2.12,0,-0.40);                             /* the NVIDIA chip, lying flat behind the tray */
const DISHP=new THREE.Vector3(1.48,0,0),DISHY=0.96;                       /* the ops dish on a column, under the narrow arm */
const XD=1.026,WWID=0.552,NWID=0.248,DIVW=0.04,XI=(XD-WWID+XD+DIVW+NWID)/2,YSPLIT=1.70,YEXITW=1.42,YIN=2.00,YINB=1.86;
const NSLX=0.29,NSLY=0.50,YNK=1.64,YEXITN=YNK-NSLY;                      /* the narrow arm's 30 degree slant */
const XNC0=XD+DIVW+NWID/2,XNC1=XNC0+NSLX;                                 /* narrow centreline x, top and exit */
const YR=2.55,YFUN0=2.50,YFUN1=2.30,TAGX=0.44;                           /* the rail, the funnel (the FEE gate) */
const CARDP=new THREE.Vector3(-8,0,0),CW=0.84,CH=0.92,CTH=0.024;
const STACKP=new THREE.Vector3(-16,0,0),SW=1.4,SHh=0.17,SD=0.45,SG=0.022;
const PAYP=new THREE.Vector3(8,0,0);

/* =================== PICTURE EVENTS (the sound reads these) =================== */
/* B1 / refill stream: 4 coins a second; coin k starts at -0.75 + 0.25k (cycle time) and lands 0.75 s later, so one lands on f0 */
const B1F=0.75,B1RATE=4,B1S0=-1.75;
const b1Start=k=>B1S0+k/B1RATE,b1Land=k=>b1Start(k)+B1F;
/* B2: the 4 shed coins (BUY, SELL, BUY, SELL) then 16 a second from the gate, all through the fork */
/* fix r1: 8 a second in the close-up and the crane (to 4.85 s), then 16 a second; at 16 from 4.10 the column under the gate read as a stack */
const STRATE=16,ST0=4.10,SLOWN=7,SLOWR=8;
const stSpawn=i=>i<4?T.sheds[i]:i-4<SLOWN?ST0+(i-4)/SLOWR:ST0+SLOWN/SLOWR+(i-4-SLOWN)/STRATE;
const STN=4+SLOWN+Math.ceil((6.5-ST0-SLOWN/SLOWR)*STRATE)+4;
const PIC={N,FPS,T,b1:[],b2pot:[],b2dish:[],sheds:T.sheds.slice(),flip:T.flip1,lid:T.lid1,hit:T.hit,pourLand:[],payL:[],payR:[],led:[]};
window.R2_PIC=PIC;

/* =================== STRINGS AND CHECKS (both passes) =================== */
const BANNED=[/\block(s|ed)?\b/i,/at least/i,/—/,/–/,/10X/,/jackpot/i,/guaranteed/i];
function checkStr(s){BANNED.forEach(re=>{if(re.test(s))fail('banned string "'+re+'" in: '+s)});if(/\b10x\b/.test(s)&&!/10x leverage/.test(s))fail('"10x" without "leverage": '+s)}

/* =================== TYPE LAYER (DOM) =================== */
const ov=document.getElementById('ov');
const el=(cls,html,css,id,par)=>{const e=document.createElement('div');e.className='ab '+(cls||'');if(html!=null)e.innerHTML=html;if(css)Object.assign(e.style,css);if(id)e.id=id;(par||ov).appendChild(e);return e};
const TRI=(up,px,col)=>'<svg class="ico" width="'+px+'" height="'+px+'" viewBox="0 0 10 10" aria-hidden="true"><path d="'+(up?'M5 .9 9.6 9.1H.4Z':'M.4 .9h9.2L5 9.1Z')+'" fill="'+(col||(up?'var(--up)':'var(--dn)'))+'"/></svg>';
const ARR=px=>'<svg class="ico" width="'+Math.round(px*1.1)+'" height="'+px+'" viewBox="0 0 11 10" aria-hidden="true" style="vertical-align:-.06em"><path d="M.6 5h8.4M5.8 1.6 9.4 5 5.8 8.4" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="square"/></svg>';
const COINI=px=>'<svg class="ico" width="'+px+'" height="'+px+'" viewBox="0 0 20 20" aria-hidden="true" style="vertical-align:-.14em"><defs><radialGradient id="cg'+px+'" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#ffe7a0"/><stop offset=".55" stop-color="#e2b250"/><stop offset="1" stop-color="#9a7024"/></radialGradient></defs><circle cx="10" cy="10" r="9.4" fill="url(#cg'+px+')"/><circle cx="10" cy="10" r="7.6" fill="none" stroke="#8a6420" stroke-width=".7" opacity=".7"/><text x="10" y="14.6" text-anchor="middle" font-family="MS" font-weight="800" font-stretch="75%" font-size="13" fill="#7a5618">$</text></svg>';
const words=s=>s.split(' ').map(w=>'<span class="w">'+w+'</span>').join('<span class="w"> </span>');
const E={};
const T1=T.b2a,TEND=DUR;
/* text lines: [element, on, off, words-by-word] */
const LINES=[];
function line(cls,text,x,y,t0,t1,opt={}){const e=el(cls,opt.html||words(text),Object.assign({left:x+'px',top:y+'px'},opt.css||{}));checkStr(text);
  const L={late:opt.late,hard:opt.hard,cut:opt.cut,e,t0,t1,wbw:opt.wbw!=null?opt.wbw:text.split(' ').length>=5,dur:opt.dur||0.25,keep0:opt.keep0,ret:opt.ret,kind:opt.kind||'story',text,ws:opt.html?[e]:[...e.querySelectorAll('.w')]};LINES.push(L);
  S(text,opt.src||'fixed copy',t0,t1,L.kind);return L}
/* B1: the hero (top left, in the negative space), resolves again from 23.75 */
const HERO=['We’re putting','buybacks in the','hands of an AI.'];
HERO.forEach((s,i)=>line('hero',s,64,128+i*80,0,T.b2a,{keep0:true,ret:T.b8,src:'owner copy (CLAUDE.md, EZ Season hero)'}));
/* B2 */
const FL=line('kick','FEES FROM LAUNCH',66,120,T.dock,T.b3,{src:'CONFIG.launched is false (fees start at launch); "FEES" ties 69% to the fee after FEE leaves (fix r1)',kind:'story'});
const FEEL=line('fee','FEE',0,0,T.b2a,T.b2b,{src:'fixed label (X2: Every $EZ trade pays a fee.)',kind:'label'});
const FEEH=el('hair',null,{left:'0',top:'0',width:'2px',height:'40px'});
const L69=line('big',SHARE+'%',56,214,T.l69,T.b3,{src:'SIM.poolShare ('+PS+')',wbw:false});
const L69b=line('kick','→ $ pot',66,452,T.l69,T.b3,{html:ARR(50)+' <span class="w dol">$</span><span class="w"> pot</span>',src:'fixed: the $ pot (a plain $ at cap height, fix r1: the coin glyph read as a dot at feed size)'});
const L31=line('kick',OPS+'% → runs EZ',0,0,T.l31-0.175,T.b3,{html:'<span class="w">'+OPS+'%</span> '+ARR(50)+'<span class="w"> runs EZ</span>',src:'1 - SIM.poolShare'});
/* B3 */
/* fix r1: what they compete on and how a round is won (step 2), in a left column beside the card */
line('st','Four AIs',64,100,T.b3,T.b4,{src:'MODEL_KEYS.length ('+MODEL_KEYS.length+')'});
line('st','call earnings.',64,188,T.b3+0.12,T.b4,{src:'fixed (the AIs call stocks before earnings)'});
line('st','Closest wins.',64,276,T.flip0-0.2,T.b4,{src:'fixed (the closest right-way call wins the round; the card back dims the wrong-way calls)'});
/* B4 */
line('st',LEAD+' hours before',64,100,T.b4,T.b4b-0.08,{src:'SIM.leadHours ('+LEAD+')',wbw:true});
line('st','NVIDIA reports,',64,188,T.b4+0.18,T.b4b-0.08,{wbw:true,src:'fixed (owner sentence)'});
line('st','the leaderboard freezes.',64,276,T.lid0-0.1,T.b4b-0.08,{wbw:false,src:'fixed (owner sentence)'});

/* B4b and B5: "#1 makes the call." then the 10x pair, the same face, size and weight */
const CALL=line('pair','First place makes the call.',64,100,T.b4b-0.1,T.b6,{wbw:false,src:'fixed (owner: the AI in first place makes the call): LADDER[0] at the freeze'});
/* fix r1: the venue in story type while #1 rises; off hard at the cut to the pour, where the pair takes its place */
line('kick','ON HYPERLIQUID',66,204,T.b4b+0.15,T.hit,{cut:true,src:'fixed (X2: the bet is placed on Hyperliquid)'});
const LEVL=line('pair',LEV+'x leverage.',64,188,T.hit,T.b6,{wbw:false,dur:0.12,src:'SIM.leverage ('+LEV+')'});
const WIPE=line('pair','The pot can be wiped out.',64,276,T.hit,T.b6,{wbw:false,dur:0.12,src:'fixed guardrail (paired with 10x; set on two lines so the pour has the right half)',
  html:(POTGLYPH?'<span class="w">The</span><span class="w"> </span>'+COINI(64)+'<span class="w"> pot can</span>':words('The pot can'))+'<br>'+words('be wiped out.')});
/* B6: two equal halves */
const HL=el('half',null,{left:'0'}),HR=el('half',null,{left:'542px'});
const hk1=el('kick','RIGHT CALL',{position:'absolute'},null,HL),hk2=el('kick','WRONG CALL',{position:'absolute'},null,HR);
hk1.className='kick';hk2.className='kick';
const hl1=el('l','Profit buys<br>back $EZ.',null,null,HL),hl2=el('l','The pot can<br>be wiped out.',null,null,HR);hl1.className='l';hl2.className='l';
S('RIGHT CALL','fixed',T.b6,T.b7,'story');S('Profit buys back $EZ.','fixed (owner copy, "the" dropped to fit a half)',T.b6,T.b7,'story');
S('WRONG CALL','fixed',T.b6,T.b7,'story');S('The pot can be wiped out.','fixed guardrail',T.b6,T.b7,'story');
const DIV=el('',null,null,'divider');
/* B7 */
const TTL=el('',null,null,'ttl');
line('st','Until the NVIDIA bet',96,114,T.b7,T.b8,{hard:true,cut:true,css:{fontSize:'64px',lineHeight:'72px'},wbw:false,src:'fixed: the planned bet (NVIDIA has not announced its date)'});
const PLN=line('k40','PLANNED · '+BETLAB,98,196,T.b7,T.b8,{hard:true,cut:true,wbw:false,src:'BET: '+betSrc,kind:'label'});
const DISC=el('','$EZ is a memecoin.<br>Not financial advice.<br>The pot can be wiped out.',null,'disc');
S('$EZ is a memecoin. Not financial advice. The pot can be wiped out.','fixed disclaimer (once, '+(T.b8-T.b7).toFixed(2)+' s)',T.b7,T.b8,'compliance');
/* the rail: AD, the $EZ tile, the stamp; the legal lines; the band */
E.ad=el('','AD',null,'ad');E.tile=el('','<span class="s">$</span><span class="e">E</span><span class="z">Z</span>',null,'tile');
E.stamp=el('','',null,'stamp');
E.legal=el('','Not affiliated with NVIDIA, OpenAI, Moonshot AI, xAI, Anthropic<br>or any company shown.',null,'legal');
S(LEGAL,'fixed (brief; LABS[MODEL_KEYS] checked against it)',0,DUR,'compliance');S('AD','fixed, every frame',0,DUR,'compliance');
if(VAR==='uk'){E.band=el('',null,null,'band');const p=document.createElement('p');p.textContent='Don’t invest unless you’re prepared to lose all the money you invest. This is a high-risk investment and you should not expect to be protected if something goes wrong.';E.band.appendChild(p);
  S(p.textContent,'FCA COBS 4.12A.11R(1)(d), exact text and style of ez-hype.html; every frame (uk)',0,DUR,'compliance')}
const STAMPS=[[0,T.b2a,'FEES FROM LAUNCH','CONFIG.launched false'],[T.b3,T.b4,ASOFLAB+' · ROUND '+LAST.n,'asof; latest graded round'],[T.b4,T.nm0,'WINS · AFTER ROUND '+LAST.n,'LADDER; latest graded ROUNDS[].n'],
  [T.b4b,T.b6,'PLANNED · ON HYPERLIQUID','fixed (X2: on Hyperliquid)'],[T.b7,T.b8,'PLANNED '+BETLAB+' · '+ASOFLAB,'BET ('+betSrc+'); asof'],[T.b8,DUR,'FEES FROM LAUNCH','CONFIG.launched false']];
STAMPS.forEach(s=>{S(s[2],s[3],s[0],s[1],'label');checkStr(s[2])});
S('LED countdown DD HH MM SS (B1, B8: D = bet - asof; B7: D + ceil('+T.b8+' - t))','BET - asof ('+D0+' s)',0,DUR,'data');
CALLS.forEach(c=>S(c.name+' '+(c.dir==='UP'?'▲':'▼')+c.mag,'ROUND '+SHOW.n+' .calls ('+showRule+')',T.b3,T.flip1,'data'));
S('ROUND '+SHOW.n+' · '+SHOW.co.toUpperCase(),'showcase round .n .co',T.b3,T.flip1,'data');
S('REAL MOVE '+(SHOWUP?'▲':'▼')+' '+OUTMAG,'showcase round .out',T.flip1,T.b4,'data');
S('WINS','card back: the yellow tag under the winner\'s row ('+SHOWWIN.join(' & ')+', SHOW.win; fix r1)',T.flip1,T.b4,'data');S('WINS','stack: the column header on the top slab, above LADDER[].won (fix r1)',T.b4,T.nm1,'label');
LADDER.forEach((L,i)=>S('#'+(i+1)+' '+MODELS[L.m].name+' '+L.won,'LADDER['+i+'] (wins, then the smaller average miss)',T.b4,T.nm1,'data'));
STR.forEach(s=>checkStr(s.text));checkStr(LEGAL);
window.R2_STRINGS=STR;

function setW(L,t){/* resolve from a 12 px blur and 0 opacity, word by word for lines of 5 words or more; exits fade over 0.2 s.
  hard: on at full with its card (no resolve); cut: off hard at t1 (on a cut, or where the next text replaces it in place) */
  let on=0,blur=0;const ws=L.ws;const fade=L.t1>=DUR||L.cut?1:L.late?1-lin(t,L.t1,L.t1+0.1):1-lin(t,L.t1-0.2,L.t1);
  const inRange=(t>=L.t0&&t<L.t1+(L.late?0.1:0))||(L.ret!=null&&t>=L.ret);
  if(!inRange){L.e.style.visibility='hidden';return '0'}
  L.e.style.visibility='visible';const t0=(L.ret!=null&&t>=L.ret)?L.ret:L.t0;const k=[];
  ws.forEach((w,i)=>{let u;if((L.keep0&&t0===0)||(L.hard&&t0===L.t0))u=1;else{const d=L.wbw&&!(L.ret!=null&&t>=L.ret)?0.06*Math.floor(i/2):0;u=EOUT(lin(t,t0+d,t0+d+L.dur))}
    const o=u*(t0===L.ret?1:fade);w.style.opacity=o.toFixed(3);w.style.filter=u<0.999?'blur('+((1-u)*12).toFixed(2)+'px)':'none';k.push(o.toFixed(3)+(u<0.999?'b'+(1-u).toFixed(3):''))});
  return k.join(',')}
let typeKey='';
function applyType(t){const s=shotOf(t),K=[VAR,VERSION,hash(DATAKEY)];
  LINES.forEach(L=>K.push(setW(L,t)));
  /* B2 labels that sit by objects (fixed screen positions, measured from the hold poses) */
  FEEL.e.style.left='604px';FEEL.e.style.top='468px';
  const fv=t>=T.b2a&&t<T.b2b?1-lin(t,T.b2b-0.2,T.b2b):0;FEEH.style.left='560px';FEEH.style.top='495px';FEEH.style.width='36px';FEEH.style.height='2px';FEEH.style.opacity=(0.55*fv).toFixed(3);FEEH.style.visibility=fv>0?'visible':'hidden';K.push(fv.toFixed(3));
  L31.e.style.left=LAY.l31x+'px';L31.e.style.top=LAY.l31y+'px';
  /* B6 halves: on hard at the cut, words resolve like every other line */
  const hv=s===6;[HL,HR,DIV].forEach(e=>e.style.visibility=hv?'visible':'hidden');
  if(hv){/* fix r1: the kickers on hard with the cut (no empty first frame), the lines resolve over 0.25 s */
    [hk1,hk2,hl1,hl2].forEach((e,i)=>{const uu=i<2?1:EOUT(lin(t,T.b6,T.b6+0.25));e.style.opacity=uu.toFixed(3);e.style.filter=uu<0.999?'blur('+((1-uu)*12).toFixed(2)+'px)':'none'});
    const fo=1-lin(t,T.b7-0.2,T.b7);HL.style.opacity=HR.style.opacity=fo.toFixed(3);K.push('h'+EOUT(lin(t,T.b6,T.b6+0.25)).toFixed(3)+','+fo.toFixed(3))}
  /* the disclaimer and the title card: on hard at T.b7, off hard at T.b8 (fix r1: no dissolve over the returning hero) */
  const dv=t>=T.b7&&t<T.b8?1:0;DISC.style.visibility=dv>0?'visible':'hidden';DISC.style.opacity=dv.toFixed(3);K.push('d'+dv.toFixed(3));
  const tv=dv;TTL.style.visibility=tv>0?'visible':'hidden';TTL.style.opacity=tv.toFixed(3);K.push('c'+tv.toFixed(3));
  /* the rail stamp */
  let st='';STAMPS.forEach(x=>{if(t>=x[0]&&t<x[1])st=x[2]});E.stamp.textContent=st;K.push(st);
  return K.join('|')}

/* =================== LAYOUT: screen positions shared by the plate (camera framing) and the type =================== */
const LAY={l31x:66,l31y:560};

/* =================== QA hooks shared by both passes =================== */
window.R2_LINES=()=>LINES.map(L=>({text:L.text,t:[L.t0,L.t1],kind:L.kind}));

if(PASS==='type'){
  await Promise.all(['600 76px G','650 76px G','500 26px G','600 56px GM','600 28px GM','800 40px MS','700 36px IS'].map(s=>document.fonts.load(s)));await document.fonts.ready;
  document.getElementById('out').style.display='none';document.getElementById('gl').style.display='none';
  window.renderAt=t=>{const f=Math.min(N-1,Math.max(0,Math.round(t*FPS)));typeKey=applyType(f/FPS);return f};
  window.frameName=i=>'t-'+hash(applyType(i/FPS));
  window.R2_TYPECHECK=typeCheck;
  window.renderAt(0);window.__ready=true;
}else{
  await import('./ez-r2-object-gl.js').then(m=>m.init({THREE,RoomEnvironment,RoundedBoxGeometry,SVGLoader,mergeGeometries,
    Q,PASS,VAR,FPS,DUR,N,RES,NSQ,MARKS,FRONT,LEDC,POTGLYPH,VERSION,DATAKEY,fail,cl,lin,mix,sm,bez,EA,EOUT,EIN,EIO,r4,hash,rng,T,SHOTS,shotOf,
    COIN_R,COIN_T,POT_B1,POT_B2,N2,POT_B5,TRAY_SL,DISH_SL,ND2,toPot,PH,POTX,PLH,POTS,WALL,POTFLOOR,TRAYP,TRW,TRH,TRD,CHIPP,DISHP,DISHY,
    XD,WWID,NWID,DIVW,XI,YSPLIT,YEXITW,YIN,YINB,NSLX,NSLY,YNK,YEXITN,XNC0,XNC1,YR,YFUN0,YFUN1,TAGX,CARDP,CW,CH,CTH,STACKP,SW,SHh,SD,SG,PAYP,
    B1F,B1RATE,B1S0,b1Start,b1Land,STRATE,ST0,stSpawn,STN,PIC,CALLS,SHOW,SHOWUP,OUTMAG,LADDER,LAST,D0,LEV,SHARE,MODELS,applyType,LAY}));
  if(PASS==='plate')ov.style.display='none';
  window.R2_TYPECHECK=typeCheck;
}
/* per frame (DOM): "10x" only with "The pot can be wiped out." at the same computed size and weight; "#1 makes the call." matches */
function typeCheck(f){applyType(f/FPS);const vis=L=>L.e.style.visibility==='visible'&&L.ws.some(w=>+w.style.opacity>0.01);
  const cs=e=>{const c=getComputedStyle(e);return c.fontSize+'/'+c.fontWeight+'/'+c.fontFamily};
  const bad=[];if(vis(LEVL)&&!vis(WIPE))bad.push('10x without the wipe-out line');
  if(vis(LEVL)&&cs(LEVL.e)!==cs(WIPE.e))bad.push('pair size or weight differs');if(vis(LEVL)&&vis(CALL)&&cs(CALL.e)!==cs(LEVL.e))bad.push('#1 line differs from the pair');
  return bad}
}catch(e){window.__err=window.__err||String(e&&e.stack||e)}
</script>
