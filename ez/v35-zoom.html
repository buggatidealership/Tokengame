<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EZ Powers of Ten</title>
<meta name="description" content="Earnings Zeason ($EZ). Four AIs call how a stock reacts to earnings and the market grades them. One continuous zoom, from a single coin out to the season and back.">
<meta name="theme-color" content="#07080a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080a;--ink:#f4efe4;--ink2:#bcb7ab;--ink3:#86827a;--line:rgba(244,239,228,.13);--line2:rgba(244,239,228,.24);
  --card:#101216;--card2:#161920;--gold:#ffc53d;--gold2:rgba(255,197,61,.14);--up:#3ee08f;--dn:#ff5d4d;
  --fd:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --top:52px;--bot:66px;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fd);font-size:16px;line-height:1.45;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,p,ol,ul{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.up{color:var(--up)}.dn{color:var(--dn)}.gold{color:var(--gold)}
.mono{font-family:var(--fm)}

/* ---------- marks ---------- */
.coin{display:inline-grid;place-items:center;width:1em;height:1em;border-radius:.21em;background:linear-gradient(155deg,#1d2027,#0b0c0f 70%);
  box-shadow:inset 0 0 0 max(1px,.012em) rgba(255,255,255,.16),0 .05em .22em rgba(0,0,0,.6);line-height:1;flex:none;vertical-align:middle}
.coin>span{font-family:var(--fd);font-weight:800;font-size:.4em;letter-spacing:-.05em;white-space:nowrap}
.coin i{font-style:normal}.coin .c1{color:var(--gold)}.coin .c2{color:var(--up)}.coin .c3{color:var(--dn)}
.lg{display:inline-grid;place-items:center;width:var(--s,28px);height:var(--s,28px);border-radius:24%;flex:none;vertical-align:middle;overflow:hidden}
.lg svg{width:62%;height:62%}
.co-mark{display:inline-grid;place-items:center;width:var(--s,28px);height:var(--s,28px);border-radius:26%;background:#fff;overflow:hidden;flex:none;
  font:800 calc(var(--s,28px)*.24)/1 var(--fm);color:#111;vertical-align:middle;letter-spacing:-.03em}
.co-mark img{width:78%;height:78%;object-fit:contain}
.co-mark.dk{background:#000}

/* ---------- stage ---------- */
#track{position:relative}
#stage{position:sticky;top:0;height:100vh;overflow:hidden;isolation:isolate;background:radial-gradient(120% 80% at 50% 45%,#0d0f13 0%,var(--bg) 70%)}
.bgg{position:absolute;inset:0;pointer-events:none;will-change:transform;transform-origin:50% 50%;
  background-image:radial-gradient(circle,rgba(244,239,228,.11) 1px,transparent 1.6px);background-size:36px 36px;background-position:center}
#layers{position:absolute;inset:0}
.layer{position:absolute;left:0;top:0;width:100%;transform-origin:0 0;visibility:hidden;pointer-events:none}
.layer.vis{visibility:visible}
.layer.on{pointer-events:auto}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:6px 16px 18px}
.wide{max-width:1140px}
#frame{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5}
#frame i{position:absolute;left:0;top:0;width:16px;height:16px;border:0 solid var(--gold)}
#frame i:nth-child(1){border-width:2px 0 0 2px}#frame i:nth-child(2){border-width:2px 2px 0 0}
#frame i:nth-child(3){border-width:0 0 2px 2px}#frame i:nth-child(4){border-width:0 2px 2px 0}
#frame span{position:absolute;left:0;top:0;font:700 11px/1 var(--fm);color:var(--gold);letter-spacing:.06em;white-space:nowrap}

/* ---------- chrome: top + the scale readout ---------- */
.top{position:fixed;z-index:30;top:0;left:0;right:0;height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:0 12px;
  background:linear-gradient(var(--bg) 35%,rgba(7,8,10,0));pointer-events:none}
.top>*{pointer-events:auto}
.home{display:flex;gap:9px;align-items:center;background:none;border:0;padding:6px 4px;cursor:pointer;font-weight:700;font-size:15px;letter-spacing:-.01em}
.home .coin{font-size:28px}
.getbtn{border:1.5px solid var(--gold);color:var(--gold);background:var(--gold2);border-radius:999px;padding:7px 15px;font-weight:700;font-size:14px;cursor:pointer}
.scale{position:fixed;z-index:30;left:0;right:0;bottom:0;height:var(--bot);display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:0 12px;background:linear-gradient(rgba(7,8,10,0),rgba(7,8,10,.94) 38%,var(--bg))}
.ro{min-width:0;font-family:var(--fm);line-height:1}
.ro .rl{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.ro b{font-size:30px;font-weight:800;color:var(--gold);letter-spacing:-.04em}
.ro b:empty{display:none}
.ro .u{font-size:17px;font-weight:700;color:var(--ink)}
.ro small{display:block;margin-top:5px;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw;letter-spacing:.02em}
.ruler{position:relative;display:flex;align-items:flex-end;height:46px;flex:none}
.ruler button{width:21px;height:46px;border:0;background:none;padding:0 0 6px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center}
.ruler button i{display:block;width:2px;border-radius:1px;background:var(--ink3);transition:background .2s}
.ruler button.cur i{background:var(--gold)}
.ruler .rind{position:absolute;left:0;bottom:0;width:21px;height:3px;background:var(--gold);border-radius:2px;will-change:transform}
.ruler .rcap{position:absolute;right:0;top:-2px;font:500 9px/1 var(--fm);color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}

/* ---------- shared type ---------- */
.kick{font:600 11.5px/1.3 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.h2{font-weight:800;font-size:clamp(30px,7.6vw,54px);line-height:1;letter-spacing:-.035em}
.h3{font-weight:800;font-size:clamp(21px,5vw,28px);line-height:1.08;letter-spacing:-.02em}
.sub{color:var(--ink2);font-size:15.5px;line-height:1.45;max-width:58ch}
.small{font-size:13px;color:var(--ink3);line-height:1.45}
.card{position:relative}
.card>.bg{position:absolute;inset:0;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.card>.in{position:relative}
.tag{display:inline-block;font:700 10px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;border-radius:5px;background:var(--gold2);color:var(--gold);white-space:nowrap}
.flowlab{display:none}

/* ---------- 1 coin ---------- */
.hero{text-align:center;display:flex;flex-direction:column;align-items:center}
.hero .wm{font-weight:800;font-size:clamp(20px,5.2vw,28px);letter-spacing:-.02em}
.hero .wm em{font-style:normal;color:var(--dn)}
.hero .cb{font-size:clamp(132px,36vw,196px);margin:18px 0 14px}
.hero .tk{font:700 13px/1 var(--fm);letter-spacing:.12em;color:var(--ink2);text-transform:uppercase}
.hero .tk b{color:var(--gold)}
.hero h1{font-weight:800;font-size:clamp(33px,9vw,70px);line-height:.98;letter-spacing:-.04em;margin:24px 0 14px;max-width:13em}
.hero h1 span{display:block;color:var(--gold)}
.hero .lede{color:var(--ink2);font-size:17px;max-width:30em}
.hero .motto{margin-top:18px;font-weight:700;font-style:italic;font-size:16px}
.hero .hint{margin-top:22px;font:600 12px/1 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:flex;gap:8px;align-items:center}
.hero .hint i{font-style:normal;display:inline-block;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}

/* ---------- 1 trade ---------- */
.trades{text-align:center}
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(8px,2.6vw,16px);width:min(100%,430px);margin:0 auto}
.tk1{position:relative;aspect-ratio:1/1.12;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.tk1 .coin{font-size:clamp(34px,10vw,52px)}
.tk1 .drop{position:relative;margin-top:6px;width:7px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--gold);box-shadow:0 0 8px rgba(255,197,61,.6)}
.layer.on .tk1 .drop{animation:drip 2.4s cubic-bezier(.5,0,.8,.4) infinite}
@keyframes drip{0%{transform:translateY(-6px) scale(.4);opacity:0}25%{opacity:1}100%{transform:translateY(14px) scale(1);opacity:0}}
.tk1:nth-child(3n) .drop{animation-delay:-.8s!important}.tk1:nth-child(3n+1) .drop{animation-delay:-1.6s!important}
.tk1.mid .coin{box-shadow:inset 0 0 0 1px rgba(255,197,61,.6),0 0 0 3px rgba(255,197,61,.18),0 6px 20px rgba(0,0,0,.6)}
.trades .h2{margin-top:26px}
.trades .small{margin-top:10px}
.trades .small i{display:inline-block;width:7px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--gold);vertical-align:-1px;margin-right:6px}

/* ---------- every fee ---------- */
.fees{text-align:center}
.fees .h2{max-width:12em;margin:0 auto}
.split{position:relative;margin:18px auto 0;width:min(100%,560px)}
.mini{display:block;width:clamp(64px,17vw,84px);height:auto;margin:0 auto}
.pipes{display:block;width:100%;height:46px}
.discs{display:flex;justify-content:center;align-items:center;gap:clamp(14px,5vw,40px)}
.disc{position:relative;width:var(--d);height:var(--d);border-radius:50%;display:grid;place-items:center}
.disc>.g{position:absolute;inset:0;border-radius:50%}
.disc.pot{--d:clamp(150px,44vw,236px)}
.disc.pot>.g{background:radial-gradient(circle at 35% 30%,#ffd978,#ffc53d 45%,#c98a00);box-shadow:0 0 50px rgba(255,197,61,.25)}
.disc.ops{--d:calc(clamp(150px,44vw,236px)*var(--k))}
.disc.ops>.g{background:#20242c;box-shadow:inset 0 0 0 1.5px var(--line2)}
.disc .t{position:relative;font:800 clamp(34px,10vw,56px)/1 var(--fm);letter-spacing:-.05em}
.disc.pot .t{color:#1a1200}
.disc.ops .t{font-size:clamp(24px,7vw,38px);color:var(--ink)}
.dlabels{display:flex;justify-content:center;gap:clamp(14px,5vw,40px);margin-top:10px}
.dlabels p{font-weight:800;font-size:18px}
.dlabels p:first-child{width:clamp(150px,44vw,236px)}
.dlabels p:last-child{width:calc(clamp(150px,44vw,236px)*var(--k))}
.opsx{margin:26px auto 0;max-width:30em;text-align:left}
.opsx .lead{font-size:16px;color:var(--ink2)}
.opsx .lead b{color:var(--ink)}
.steps{list-style:none;padding:0;margin-top:12px;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start;padding:11px 12px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.steps li>span{font:800 13px/28px var(--fm);text-align:center;border-radius:8px;background:var(--card2);color:var(--ink2)}
.steps li.now>span{background:var(--gold);color:#1a1200}
.steps b{display:block;font-size:15.5px}
.steps p{font-size:14px;color:var(--ink2);line-height:1.4}

/* ---------- the pot ---------- */
.potl .bet{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;margin:16px 0 8px}
.node{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.node p{font-size:13px;font-weight:700;line-height:1.2}
.node p small{display:block;font-weight:500;color:var(--ink3);font-size:12px;margin-top:2px}
.holder{position:relative;display:inline-block}
.holder .hl{--s:clamp(96px,26vw,128px);display:block}
.holder .hl .lg{border-radius:24%}
.potd{position:absolute;right:-12px;bottom:-12px;width:clamp(40px,11vw,52px);height:clamp(40px,11vw,52px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffd978,#ffc53d 45%,#c98a00);box-shadow:0 0 0 4px var(--bg),0 0 24px rgba(255,197,61,.5)}
.levx{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:60px}
.levx .ln{position:absolute;left:4px;right:4px;top:50%;height:2px;background:linear-gradient(90deg,var(--gold),rgba(255,197,61,.2))}
.levx .ln:after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:8px solid rgba(255,197,61,.6);border-right:0}
.levx b{position:relative;font:800 clamp(28px,8vw,40px)/1 var(--fm);color:var(--gold);background:var(--bg);padding:0 6px;letter-spacing:-.04em}
.levx span{position:relative;font:600 11px/1 var(--fm);color:var(--ink3);background:var(--bg);padding:4px 6px 0;letter-spacing:.06em;text-transform:uppercase}
.targets{display:flex;flex-direction:column;gap:10px;align-items:center}
.targets .ic{--s:clamp(54px,14vw,66px)}
.targets .row1{display:flex;gap:8px}
.potl .big{font-weight:700;font-size:clamp(20px,5vw,26px);line-height:1.22;letter-spacing:-.015em;margin-top:18px}
.potl .big b{color:var(--gold)}
.topnow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--ink2)}
.topnow .lg{--s:22px}
.outs{display:grid;grid-template-columns:1fr;gap:8px;margin-top:18px}
.outs .card>.in{padding:12px 14px 12px 46px}
.outs .ico{position:absolute;left:13px;top:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:800 12px/1 var(--fm)}
.outs .w .ico{background:var(--up);color:#062}.outs .l .ico{background:var(--dn);color:#300}.outs .n .ico{background:var(--card2);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2)}
.outs b{display:block;font-size:16px}
.outs p{color:var(--ink2);font-size:14.5px}
.wipe{margin-top:16px;font-weight:800;font-size:clamp(22px,6vw,32px);letter-spacing:-.02em;color:var(--dn)}
.est{margin-top:22px}
.est>.in{padding:16px}
.est .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.est .lbl{font:600 11px/1 var(--fm);color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line2);border-radius:9px;padding:9px 11px;font:700 14px/1 var(--fm);cursor:pointer;min-width:52px}
.chips button[aria-pressed="true"]{background:var(--gold);color:#1a1200;box-shadow:none}
.eout{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.eout .pv{font:800 clamp(32px,9vw,46px)/1 var(--fm);color:var(--gold);letter-spacing:-.04em}
.eout .pk{font-size:13px;color:var(--ink3)}
.eout p{font-size:15px}
.eout p b{color:var(--up);font-family:var(--fm)}
.eout .lose{color:var(--ink2)}
.fine{font-size:12px;color:var(--ink3);margin-top:10px}

/* ---------- 4 AIs ---------- */
.boardl .rows{display:grid;gap:8px;margin-top:16px}
.brow>.in{padding:14px 14px 13px 70px;min-height:92px}
.brow .rlg{position:absolute;left:14px;top:14px;--s:44px}
.brow:first-child>.bg{box-shadow:inset 0 0 0 1.5px rgba(255,197,61,.55);background:linear-gradient(180deg,rgba(255,197,61,.08),var(--card))}
.r1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.r1 .rk{font:800 13px/1 var(--fm);color:var(--ink3)}
.r1 .rn{font-weight:800;font-size:20px;letter-spacing:-.02em}
.r1 .rv{font-size:13px;color:var(--ink3)}
.r1 .rw{margin-left:auto;font:700 13px/1 var(--fm);color:var(--ink2);white-space:nowrap}
.r1 .rw b{font-size:22px;color:var(--ink)}
.brow:first-child .rw b{color:var(--gold)}
.r2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.r2>div{min-width:0}
.r2 span{display:block;font:600 10px/1.2 var(--fm);color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.r2 b{display:block;font:800 19px/1.15 var(--fm);letter-spacing:-.03em;margin-top:3px}
.r2 em{display:block;font-style:normal;font-size:12px;color:var(--ink2);line-height:1.25}
.r3{display:flex;align-items:center;gap:5px;margin-top:9px;font:600 10px/1 var(--fm);color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.fm{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font:800 11px/1 var(--fm);letter-spacing:0}
.fm.w{background:var(--gold);color:#1a1200}.fm.g{box-shadow:inset 0 0 0 1.5px var(--up);color:var(--up)}
.fm.r{box-shadow:inset 0 0 0 1.5px var(--dn);color:var(--dn)}.fm.n{box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink3)}
.r3 .fm:first-of-type{margin-left:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--ink3);align-items:center}
.legend .fm{width:16px;height:16px;font-size:9px;margin-right:4px}
.sec{margin-top:30px}
.sec .h3{margin-bottom:6px}
.fol{display:grid;gap:7px;margin-top:14px}
.frow{display:grid;grid-template-columns:78px 1fr 92px;align-items:center;gap:8px;font-size:14px}
.frow .who{display:flex;align-items:center;gap:6px;font-weight:700}
.frow .who .lg{--s:22px}
.ftr{position:relative;height:22px;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(244,239,228,.04) 6px 7px);border-radius:4px}
.ftr:before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1.5px;background:var(--ink3)}
.fbar{position:absolute;top:3px;bottom:3px;border-radius:3px}
.fval{text-align:right;font-family:var(--fm);line-height:1.15}
.fval b{display:block;font-size:14px}
.fval span{font-size:12px}
.fbase{display:flex;justify-content:space-between;font:600 10px/1 var(--fm);color:var(--ink3);margin:2px 0 0 86px;width:calc(100% - 186px);letter-spacing:.04em}
.recs{display:grid;gap:8px;margin-top:14px}
.rec>.in{padding:13px 14px 13px 58px}
.rec .lg{position:absolute;left:14px;top:14px;--s:32px}
.rec .k{font:600 10.5px/1.2 var(--fm);color:var(--gold);letter-spacing:.1em;text-transform:uppercase}
.rec .v{font-weight:800;font-size:18px;letter-spacing:-.01em;margin-top:3px}
.rec .x{font-size:13.5px;color:var(--ink2)}

/* findings */
.fd{margin-top:10px}
.fd>.in{padding:15px 16px}
.fd .k{font:600 10.5px/1.2 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.fd h3{font-weight:800;font-size:20px;line-height:1.15;letter-spacing:-.015em;margin:5px 0 6px}
.fd p{font-size:14.5px;color:var(--ink2)}
.fd .st{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:12px}
.fd .st b{display:block;font:800 22px/1.1 var(--fm);letter-spacing:-.03em;color:var(--ink)}
.fd .st span{font-size:12px;color:var(--ink3)}
.fd .bs{margin-top:10px;font-size:12.5px;color:var(--ink3)}
.fd .now{margin-top:8px;font-weight:700;color:var(--gold);font-size:14px}
.fd.fun>.bg{background:repeating-linear-gradient(-45deg,var(--card) 0 12px,#12141a 12px 24px)}
.fd.fun .k{color:var(--gold)}

/* ---------- 11 rounds ---------- */
.rndl .head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.mb{display:grid;gap:4px;width:clamp(78px,20vw,96px);padding:7px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line2)}
.mb>div{display:flex;align-items:center;gap:5px;height:14px}
.mb .lg{--s:14px;border-radius:4px}
.mb i{display:block;height:5px;border-radius:3px;background:var(--ink3)}
.mb>div:first-child i{background:var(--gold)}
.mbcap{font:600 10px/1.3 var(--fm);color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-top:6px;max-width:96px}
.rndl .sub{margin-top:8px}
.colhd{display:grid;grid-template-columns:1.25fr repeat(4,1fr);gap:5px;padding:0 10px;margin:18px 0 6px;align-items:end}

function hitChart(){var N=R.length,H=190,X=function(i){return N>1?i/(N-1)*100:50};
  var paths=S.models.map(function(m){var pts=[];S.hitPath[m].forEach(function(p,i){if(p)pts.push([X(i),100-p.pct])});
    return '<path d="'+pts.map(function(p,k){return (k?"L":"M")+p[0].toFixed(2)+","+p[1].toFixed(2)}).join("")+'" fill="none" stroke="'+mc(m)+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'}).join("");
  var labs=rows.map(function(r){var p=S.hitPath[r.m].filter(Boolean),e=p[p.length-1];return {m:r.m,y:(100-e.pct)/100*H,r:r}}).sort(function(a,b){return a.y-b.y});
  for(var i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<34)labs[i].y=labs[i-1].y+34;
  var ov=labs[labs.length-1].y-(H-8);if(ov>0)labs.forEach(function(l){l.y-=ov});
  var lab=labs.map(function(l){return '<div style="top:'+l.y.toFixed(1)+'px"><i style="background:'+mc(l.m)+'"></i><span><b>'+esc(nm(l.m))+' '+l.r.hit+'%</b><em>'+l.r.right+' of '+l.r.n+' right</em></span></div>'}).join("");
  return '<div class="hit" role="img" aria-label="Hit rate after each round for each AI"><div class="ya"><span style="top:0">100%</span><span style="top:50%">50%</span><span style="top:100%">0%</span></div>'+
  '<div class="pl"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="100" y1="50" y2="50" stroke="rgba(244,239,228,.22)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>'+paths+'</svg></div>'+
  '<div class="lab">'+lab+'</div><div class="xa"><span>R'+R[0].n+'</span><span>R'+R[Math.floor((N-1)/2)].n+'</span><span>R'+R[N-1].n+'</span></div></div>'}
