<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X2 · cel mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* X2 in X7's anime cel look. Mockup only (scratchpad); X2 itself is untouched. */
:root{color-scheme:dark;--bg:#0b0a14;--bg2:#12101e;--tx:#f3ead6;--mu:#a49fb4;--paper:#f3e6c8;--gold:#f2b632;--gr:#11714a;--grl:#4fe39a;--rd:#b3261e;--rdl:#ff6158;--vi:#2a2350;--s1:#15131f;
  --dsp:"Anton",Impact,"Arial Narrow",sans-serif;--sans:"Geist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding-inline:18px}
/* chrome: brand bar + tab slabs. Active tab = gold slab, tilted, bold: not colour alone */
.top{background:#000;border-bottom:3px solid var(--gold)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:52px;gap:10px}
.brand{font:400 22px/1 var(--dsp);letter-spacing:.04em;background:var(--gold);color:#000;padding:5px 14px 4px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.next{display:flex;align-items:center;gap:7px;font:400 14px/1 var(--dsp);letter-spacing:.06em;text-transform:uppercase;color:var(--tx)}
.next .co{width:22px;height:22px}
.next i{width:8px;height:8px;border-radius:50%;background:var(--rdl);box-shadow:0 0 0 3px rgba(255,97,88,.25)}
.tabs{background:#000;border-bottom:3px solid #000;overflow-x:auto;scrollbar-width:none}
.tabs .wrap{display:flex;gap:0;padding-block:8px 10px;padding-inline:10px}
.tabs a{flex:none;font:400 14px/1 var(--dsp);letter-spacing:.05em;text-transform:uppercase;color:var(--mu);padding:8px 7px 7px}
.tabs a.on{background:var(--gold);color:#000;transform:rotate(-2deg);clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);padding-right:16px}
.kick{display:inline-block;font:400 15px/1 var(--dsp);letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#000;padding:7px 16px 6px 10px;transform:rotate(-2deg);clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.kick.r{background:var(--rd);color:#fff}.kick.g{background:var(--grl)}
h1,h2{font-family:var(--dsp);font-weight:400;text-transform:uppercase;line-height:.95;letter-spacing:.01em;margin:.32em 0 0;text-wrap:balance;text-shadow:.05em .05em 0 var(--vi)}
h1{font-size:clamp(34px,6.6vw,62px)}h2{font-size:clamp(38px,8vw,68px)}
h1 em,h2 em{font-style:normal;color:var(--gold);text-shadow:.05em .05em 0 var(--rd)}
.sub{font:500 15px/1.45 var(--sans);color:#d6cebb;margin:12px 0 0;max-width:42ch}
section{position:relative;padding:64px 0;overflow:hidden}
section:nth-of-type(even){background:var(--bg2)}
section+section:before,section+section:after{content:"";position:absolute;left:0;right:0;top:0;height:30px;pointer-events:none}
section+section:before{background:var(--gold);clip-path:polygon(0 0,100% 0,100% 6px,0 30px)}
section+section:after{background:#000;clip-path:polygon(0 0,100% 0,100% 2px,0 25px)}
.speed{position:absolute;inset:-60%;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(243,234,214,.11) 0 .8deg,transparent .8deg 5deg);-webkit-mask:radial-gradient(circle,transparent 14%,#000 42%);mask:radial-gradient(circle,transparent 14%,#000 42%)}
.tile{display:inline-grid;place-items:center;border-radius:22%;flex:none;border:2.5px solid #000}.tile svg{width:58%;height:58%}
.co{display:inline-grid;place-items:center;background:#fff;border-radius:22%;flex:none;border:2px solid #000;overflow:hidden}.co img{width:76%}
.pose{display:block;pointer-events:none;height:auto;filter:drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000) drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000) drop-shadow(-6px 0 0 rgba(31,138,90,.75)) drop-shadow(6px 0 0 rgba(208,65,60,.65))}
.say{position:relative;display:inline-block;filter:drop-shadow(5px 6px 0 #000);max-width:min(310px,100%)}
.say .st{background:linear-gradient(90deg,transparent 0 11px,var(--gr) 11px 16px,transparent 16px calc(100% - 16px),var(--rd) calc(100% - 16px) calc(100% - 11px),transparent calc(100% - 11px)),var(--paper);color:#121214;padding:18px 26px 15px 28px;font:600 15px/1.38 var(--sans);
  -webkit-mask:radial-gradient(circle 4.5px at 0 7px,transparent 95%,#000) 0 0/51% 14px repeat-y,radial-gradient(circle 4.5px at 100% 7px,transparent 95%,#000) 100% 0/51% 14px repeat-y}
.say .st b{color:var(--rd)}.say .st em{font-style:normal;color:var(--gr)}
.say .nm{position:absolute;left:26px;top:-11px;z-index:2;background:#000;color:var(--gold);font:600 9.5px var(--mono);letter-spacing:.18em;padding:4px 8px;border:1px solid var(--gold)}
.say .tl{position:absolute;width:22px;height:18px;background:var(--paper);bottom:-16px;left:34px;clip-path:polygon(0 0,100% 0,30% 100%)}
.say.r .tl{left:auto;right:34px;clip-path:polygon(0 0,100% 0,70% 100%)}
/* panel: paper or night fill, ink line, one hard shadow band, halftone corner, hard offset shadow */
.pn{position:relative;background:var(--paper);color:#141217;border:3px solid #000;box-shadow:8px 8px 0 var(--sh,var(--gold));padding:22px 18px 18px;isolation:isolate;overflow:hidden;min-width:0}
.pn:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 0 66%,rgba(150,95,20,.15) 66%)}
.pn:after{content:"";position:absolute;right:0;top:0;width:50%;height:55%;z-index:-1;background:radial-gradient(rgba(0,0,0,.2) 1.2px,transparent 1.7px) 0 0/7px 7px;-webkit-mask:linear-gradient(215deg,#000,transparent 62%)}
.pn.dk{background:var(--s1);color:var(--tx)}.pn.dk:before{background:linear-gradient(115deg,transparent 0 66%,rgba(0,0,0,.3) 66%)}.pn.dk:after{background:radial-gradient(rgba(255,255,255,.09) 1.2px,transparent 1.7px) 0 0/7px 7px}
.pn .no{position:absolute;left:-3px;top:-3px;z-index:3;background:#000;color:var(--gold);font:400 15px/1 var(--dsp);letter-spacing:.08em;padding:8px 18px 7px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.pn p{margin:10px 0 0;font:500 15px/1.45 var(--sans)}.pn p.s{font-size:13px;color:#5c5662}.pn.dk p.s{color:var(--mu)}
.stack{display:grid;gap:26px;margin-top:30px}
.big{font:400 clamp(72px,13vw,118px)/.85 var(--dsp);color:var(--gold);-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:5px 5px 0 #000}
.mid{font:400 46px/.9 var(--dsp);color:var(--gold);-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #000}
.pn:not(.dk) .mid{text-shadow:3px 3px 0 #000}
.more{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font:400 17px/1 var(--dsp);letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:#000;border:3px solid #000;padding:11px 16px 10px;box-shadow:5px 5px 0 var(--vi)}
.tagx{display:inline-block;font:400 12px/1 var(--dsp);letter-spacing:.1em;background:#000;color:var(--gold);padding:5px 8px 4px;border:1.5px solid var(--gold);vertical-align:middle}
.sq{width:13px;height:13px;border-radius:2px;display:inline-block;border:1.5px solid #000}.sq.y{background:var(--grl)}.sq.x{background:var(--rdl)}.sq.z{background:#bdb5a5}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.pills span{font:400 15px/1 var(--dsp);letter-spacing:.06em;text-transform:uppercase;border:2.5px solid #000;background:var(--s1);color:var(--mu);padding:8px 12px 7px;box-shadow:3px 3px 0 #000}
.pills span.on{background:var(--gold);color:#000}.pills b{font-weight:400;opacity:.65;margin-left:5px}
/* HERO */
.hero{padding:34px 0 0}
.giant{white-space:nowrap;font:400 clamp(86px,22vw,200px)/.82 var(--dsp);color:var(--gold);-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:.04em .04em 0 var(--rd)}
.hero .shards{position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 0 58%,rgba(31,138,90,.16) 58% 70%,transparent 70%),linear-gradient(112deg,transparent 0 72%,rgba(208,65,60,.16) 72% 80%,transparent 80%)}
.honest{display:block;font:600 11px var(--mono);letter-spacing:.12em;color:var(--mu);margin-top:18px;text-transform:uppercase}
.hero-host{position:relative;width:min(340px,82vw);margin:76px 0 0 auto}
.hero-host .say{position:absolute;left:-6%;top:-12%;z-index:3}
.cast{position:relative;z-index:3;display:grid;grid-template-columns:repeat(4,1fr);background:#000;border-top:3px solid var(--gold)}
.cast div{display:grid;justify-items:center;gap:8px;padding:16px 4px 14px;font:400 18px/1 var(--dsp);letter-spacing:.06em;text-transform:uppercase}
.cast div+div{border-left:2px solid #24202f}.cast .tile{border-color:var(--paper)}
/* four buyback panels (from X7) */
.p1u{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.pot{width:clamp(120px,30vw,180px);height:auto;overflow:visible}
.myst{position:relative;width:96px;height:96px;border-radius:22%;background:#000;box-shadow:0 0 0 3px var(--gold);display:grid;place-items:center;font:400 66px/1 var(--dsp);color:var(--gold)}
.myst i{position:absolute;top:-16px;right:-18px;font:400 14px/1 var(--dsp);font-style:normal;background:var(--gold);color:#000;border:2.5px solid #000;padding:5px 7px 4px;transform:rotate(8deg)}
.p2u{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:28px}
.ud{display:grid;gap:8px}.ud span{font:400 24px/1 var(--dsp);color:#fff;border:3px solid #000;padding:7px 12px 6px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%);width:max-content}.ud .a{background:var(--gr)}.ud .b{background:var(--rd)}
.gpu-img{position:relative;aspect-ratio:1834/1362;overflow:hidden;border:3px solid #000;box-shadow:6px 6px 0 #000}
.gpu-img img,.gpu-img svg{position:absolute;left:-4.471%;top:-4.626%;width:109.051%;height:110.132%;max-width:none}
.gc-blk{fill:#141518;stroke:#3a3c42;stroke-width:2}.gc{fill:#26282d;stroke:#34363c;stroke-width:1}.gc.on{fill:#ff3b2f;stroke:#ff9a8f;stroke-width:.8;filter:drop-shadow(0 0 4px #ff2a1f)}
.gc-u{font:800 25px ui-monospace,Menlo,monospace;letter-spacing:.32em;fill:#f2efe6;paint-order:stroke;stroke:#0b0b0d;stroke-width:4px}
.gc-eng{font:400 50px/1 var(--dsp);letter-spacing:.1em;fill:#5a4512;stroke:#f6e6a8;stroke-opacity:.5;stroke-width:1.2px;paint-order:stroke}
.cap{display:inline-block;margin-top:12px;font:400 14px/1 var(--dsp);letter-spacing:.1em;text-transform:uppercase;background:var(--rd);color:#fff;padding:7px 14px 6px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.ten{font:400 clamp(86px,14vw,140px)/.8 var(--dsp);color:var(--gold);-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:6px 6px 0 var(--rd);margin-top:20px}
.ten small{display:block;font-size:.3em;margin-top:.25em;color:var(--tx);text-shadow:none;-webkit-text-stroke:0;letter-spacing:.06em}
.ends{display:grid;padding:0;background:#000;--sh:#000}.ends:before,.ends:after{display:none}
.end{position:relative;padding:50px 20px 22px;color:#fff;isolation:isolate}
.end:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 0 62%,rgba(0,0,0,.22) 62%)}
.end.v{background:var(--gr)}.end.d{background:var(--rd)}
.end h4{margin:0;font:400 40px/.9 var(--dsp);text-transform:uppercase;text-shadow:4px 4px 0 #000}
.end p{margin:10px 0 0;font:600 16px/1.4 var(--sans)}
.loop{display:grid;gap:6px;margin-top:30px}
.loop .lp{display:grid;grid-template-columns:40px 1fr;column-gap:12px;align-items:center;background:#000;color:var(--tx);border:3px solid #000;padding:10px 12px;box-shadow:4px 4px 0 var(--gold)}
.loop .lp:nth-of-type(3){background:var(--gold);color:#000;box-shadow:4px 4px 0 var(--rd)}
.loop .lp b{grid-row:span 2;font:400 34px/1 var(--dsp);color:var(--gold)}.loop .lp:nth-of-type(3) b{color:#000}
.loop .lp span{font:400 24px/1 var(--dsp);letter-spacing:.04em}.loop .lp small{font:600 10px var(--mono);letter-spacing:.1em;opacity:.8;text-transform:uppercase}
.loop .la{font-style:normal;justify-self:center;transform:rotate(90deg);font-size:18px;color:#000}
.nx2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-top:30px}
.nx2 div{display:grid;justify-items:start;gap:6px}.nx2 .co{border-width:3px;box-shadow:4px 4px 0 #000}
.nx2 b{font:400 26px/1 var(--dsp);text-transform:uppercase}.nx2 small{font:600 10px var(--mono);letter-spacing:.12em;color:#5c5662}
.road{display:grid;gap:18px;margin-top:40px;position:relative}
.rs{position:relative;border:3px solid #000;background:var(--s1);padding:30px 16px 16px;box-shadow:6px 6px 0 var(--vi);margin-left:22px}
.rs:before{content:"";position:absolute;left:-25px;top:-21px;bottom:-21px;width:4px;background:var(--gold)}
.rs:after{content:"";position:absolute;left:-33px;top:22px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:4px solid var(--gold)}
.rs.now{--x:1;background:var(--paper);color:#141217;box-shadow:6px 6px 0 var(--rd)}.rs.now:after{background:var(--gold)}
.rs .tag2{position:absolute;left:-3px;top:-3px;font:400 14px/1 var(--dsp);letter-spacing:.08em;background:#000;color:var(--gold);padding:7px 16px 6px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.rs b{display:block;font:400 30px/1 var(--dsp);text-transform:uppercase;margin-top:8px}.rs small{display:block;font:600 10px var(--mono);letter-spacing:.1em;color:var(--mu);margin-top:6px}.rs.now small{color:#5c5662}
.mag{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.mag .co{box-shadow:3px 3px 0 #000}
/* ladder rows */
.lad{display:grid;gap:12px;margin-top:26px}
.row{display:grid;grid-template-columns:30px 42px 1fr auto;gap:10px;align-items:center;padding:10px 12px 10px 8px;background:var(--paper);color:#141217;border:3px solid #000;box-shadow:6px 6px 0 var(--vi)}
.row .p{font:400 26px/1 var(--dsp);text-align:center}
.row .nm{font:400 21px/1 var(--dsp);letter-spacing:.04em;text-transform:uppercase}.row .nm small{display:flex;gap:3px;margin-top:6px}
.row .pc{font:400 32px/1 var(--dsp);text-align:right}.row .pc small{display:block;font:600 9.5px var(--mono);color:#5c5662;margin-top:3px}
.row.one{background:var(--gold);box-shadow:6px 6px 0 var(--rd)}.row.one .pc small{color:#3a2a05}
.row .crown{position:absolute}
.lbrow{grid-template-columns:20px 34px minmax(0,1fr) 44px 34px 58px;gap:6px;padding-left:6px;padding-right:8px}.lbrow .tile{width:34px!important;height:34px!important}.lbrow .nm{font-size:18px}.lbrow .nm small{gap:2px}.lbrow .sq{width:10px;height:10px}.lbrow .p{font-size:22px}
.lbrow .v{font:400 19px/1 var(--dsp);text-align:right;white-space:nowrap}.lbrow .v:last-child{font-size:16px}.lbrow .v small{display:block;font:600 8.5px var(--mono);color:#5c5662;margin-top:3px;letter-spacing:.04em}
.lbrow .v.u{color:var(--gr)}.lbrow .v.dn{color:var(--rd)}
.colh{display:grid;grid-template-columns:20px 34px minmax(0,1fr) 44px 34px 58px;gap:6px;padding:0 11px 0 9px;margin-top:22px;font:600 9px var(--mono);letter-spacing:.1em;color:var(--mu);text-align:right}
.colh span:nth-child(3){text-align:left}
/* the reveal */
.letter{position:relative;height:clamp(110px,24vw,220px);background:#000;overflow:hidden;margin:24px 0 0;border:3px solid #000;box-shadow:8px 8px 0 var(--gold)}.letter img{width:100%;height:100%;object-fit:cover}
.champ{position:relative;display:inline-block;margin:70px 0 0 60px;transform:rotate(-3deg)}
.champ .burst{position:absolute;left:50%;top:50%;width:250px;height:250px;transform:translate(-50%,-50%);z-index:-1}
.champ .tile{border-width:4px;box-shadow:10px 10px 0 var(--gold)}
.cname{font:400 clamp(60px,11vw,104px)/1 var(--dsp);margin-top:20px;color:var(--gold);-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:.04em .04em 0 var(--rd)}
.rv-c{text-align:center}.rv-c .champ{margin-left:0}
/* tickets */
.lastr{background:var(--s1);border:3px solid #000;box-shadow:8px 8px 0 var(--gold);position:relative}
.lastr .hd{display:flex;align-items:center;gap:10px;padding:12px 96px 12px 12px;min-height:60px;background:#000;font:400 18px/1.1 var(--dsp);letter-spacing:.04em;text-transform:uppercase}
.lastr .hd small{display:block;font:600 9.5px var(--mono);letter-spacing:.12em;color:var(--mu)}
.lastr .hd .flm{position:absolute;right:10px;top:9px;width:44px;height:44px;border:2px solid var(--gold);overflow:hidden}.lastr .hd .flm img{width:100%;height:100%;object-fit:cover}
.lastr .hd .flm:after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;background:rgba(0,0,0,.35)}
.tix{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:13px 10px 8px;position:relative}
.rcpt{position:relative;background:var(--paper);color:#0b0b0c;padding:13px 3px 10px;display:grid;justify-items:center;gap:5px;font:600 9px var(--mono);letter-spacing:.06em;text-align:center;
  -webkit-mask:radial-gradient(circle 5px at 50% 0,transparent 98%,#000) top/14px 51% repeat-x,radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) bottom/14px 51% repeat-x}
.rcpt.won{background:var(--gold)}
.rcpt .call{font:400 19px/1 var(--dsp);letter-spacing:.01em;white-space:nowrap}.rcpt .call.UP{color:var(--gr)}.rcpt .call.DOWN{color:var(--rd)}
.rcpt .ok{font:700 8.5px var(--mono);padding:2px 4px;color:#fff}.rcpt .ok.y{background:var(--gr)}.rcpt .ok.n{background:var(--rd)}
.rcpt .cr{position:absolute;top:3px;right:5px;font-size:12px}
.actual{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-top:3px solid #000}
.actual span{font:600 9.5px/1.5 var(--mono);letter-spacing:.12em;color:var(--mu)}
.actual b{font:400 38px/1 var(--dsp);white-space:nowrap;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #000}
.actual .w{font:400 14px/1 var(--dsp);letter-spacing:.06em;background:var(--gold);color:#000;padding:6px 10px 5px;border:2px solid #000;display:inline-flex;gap:6px;align-items:center;margin-top:6px}
.actual .w.none{background:#3a3546;color:var(--tx)}
/* legends */
.lg{position:relative;overflow:hidden;border:3px solid #000;box-shadow:8px 8px 0 var(--sh,var(--gold));min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;isolation:isolate;background:var(--s1)}
.lg.g{--sh:var(--grl)}.lg.r{--sh:var(--rd)}
.lg .bg{position:absolute;inset:0;z-index:-2}.lg .bg img{width:100%;height:100%;object-fit:cover;filter:saturate(.8) brightness(.75)}
.lg:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(11,10,20,.55),rgba(11,10,20,.9) 42%,rgba(11,10,20,.98))}
.lg.plain:before{background:repeating-conic-gradient(from 0deg at 30% 30%,rgba(242,182,50,.12) 0 1deg,transparent 1deg 6deg)}
.lg .lab{position:absolute;left:-3px;top:-3px;font:400 15px/1 var(--dsp);letter-spacing:.08em;color:#000;background:var(--sh,var(--gold));padding:8px 18px 7px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}.lg.r .lab{color:#fff}
.lg .bigx{font:400 64px/.9 var(--dsp);color:var(--gold);white-space:nowrap;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:5px 5px 0 #000}
.lg h3{margin:10px 0 0;font:700 18px/1.25 var(--sans)}.lg p{margin:6px 0 0;font:500 14px/1.45 var(--sans);color:#d6cebb}
.lg .who{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.lg .mini{display:inline-flex;align-items:center;gap:5px;background:#000;padding:2px 8px 2px 2px;font:400 13px/1 var(--dsp);letter-spacing:.06em}.lg .mini.n{color:var(--rdl)}.lg .mini.y{color:var(--grl)}
.lg .ticks{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}.lg .ticks i{width:22px;height:22px;display:grid;place-items:center;background:var(--grl);color:#000;border:2px solid #000;font:700 12px var(--sans);font-style:normal}
/* grid of squares */
