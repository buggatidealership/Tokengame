<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EZ-GPT</title>
<meta name="description" content="EZ-GPT: ask about the Earnings Zeason. Four AIs call earnings moves. The market grades them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0c12;--side:#131019;--card:#1a1621;--card2:#221d2b;--plate:#100e15;--line:#2e2838;--line2:#3d3549;
  --ink:#f4ede1;--ink2:#b9afc2;--ink3:#8a8095;
  --gold:#ffc94a;--gold2:#ffdf8a;--up:#4ade80;--dn:#ff6b7a;--laser:#ff2d3d;
  --c-GPT:#1f9f90;--c-KIMI:#5b8cf0;--c-CLAUDE:#d9663a;--c-GROK:#9a7fd0;
  --fd:"Bricolage Grotesque","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --fb:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px;--side-w:290px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.u{color:var(--up)}.d{color:var(--dn)}.g{color:var(--gold)}
.app{display:grid;grid-template-columns:1fr;height:100vh;height:100dvh;width:100%;overflow:hidden}

/* ---------- the $EZ mark (EZ-GPT's face) ---------- */
.mark{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;border-radius:.24em;background:#07060a;
  font:800 .52em/1 var(--fd);letter-spacing:-.04em;box-shadow:inset 0 0 0 1px #2c2635;flex:none}
.mark i{font-style:normal}.mark .m1{color:var(--gold)}.mark .m2{color:#3ed27a}.mark .m3{color:#ff4d5e}
.mark{font-size:inherit}
.mark i{font-size:.46em;line-height:1}
.mk-wrap{font-size:32px;display:inline-flex}

/* ---------- logos ---------- */
.lg{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:.42em;flex:none;vertical-align:middle;overflow:hidden}
.lg svg{width:62%;height:62%}
.co-mark{display:inline-flex;align-items:center;justify-content:center;width:var(--cs,32px);height:var(--cs,32px);border-radius:calc(var(--cs,32px)*.24);background:#f4ede1;color:#111;
  font:700 calc(var(--cs,32px)*.26)/1 var(--fm);flex:none;overflow:hidden;vertical-align:middle;letter-spacing:-.02em;text-align:center}
.co-mark.has-logo{background:#fff;padding:calc(var(--cs,32px)*.12)}
.co-mark.dk{background:#16131c}
.co-mark img{width:100%;height:100%;object-fit:contain;display:block}
/* laser eyes: only on the leader's logo (computed from EZS.rows[0]) */
.lz{position:relative;display:inline-flex;vertical-align:middle;flex:none}
.lz .lg{box-shadow:0 0 0 1.5px var(--laser),0 0 14px rgba(255,45,61,.55)}
.lz::before,.lz::after{content:"";position:absolute;top:38%;height:.12em;min-height:2px;width:1.7em;border-radius:2px;pointer-events:none;
  background:linear-gradient(90deg,#fff 0,#ffe08a 12%,var(--laser) 45%,rgba(255,45,61,0) 100%);
  box-shadow:0 0 6px 1px rgba(255,45,61,.85);transform-origin:0 50%;animation:beam 1.6s ease-in-out infinite}
.lz::before{left:34%;transform:rotate(-14deg)}
.lz::after{left:62%;transform:rotate(-6deg);animation-delay:.2s}
@keyframes beam{0%,100%{opacity:.75;filter:brightness(1)}50%{opacity:1;filter:brightness(1.4)}}

/* ---------- sidebar = chat history ---------- */
.side{position:fixed;inset:0 auto 0 0;width:min(86vw,var(--side-w));background:var(--side);border-right:1px solid var(--line);z-index:40;
  display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .25s ease;visibility:hidden}
.side.open{transform:none;visibility:visible}
.scrim{position:fixed;inset:0;background:rgba(5,4,8,.6);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.s-head{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.s-head .mk-wrap{font-size:30px}
.s-brand{font:800 20px/1 var(--fd);letter-spacing:-.02em}
.s-brand small{display:block;font:500 11px/1.3 var(--fm);color:var(--ink3);letter-spacing:.02em;margin-top:3px}
.s-new{margin:6px 12px 8px;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);text-decoration:none;font-weight:600}
.s-new:hover{border-color:var(--gold)}
.s-search{margin:0 12px 6px;position:relative}
.s-search input{width:100%;padding:9px 12px 9px 32px;border-radius:10px;border:1px solid var(--line);background:var(--plate);font-size:14px}
.s-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink3)}
.s-nav{flex:1;overflow-y:auto;padding:4px 8px 16px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.s-grp{margin-top:12px}
.s-grp h3{font:600 11px/1 var(--fm);text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin:0 8px 6px}
.s-it{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;text-decoration:none;font-size:14px;color:var(--ink2);min-height:36px}
.s-it .lg,.s-it .co-mark{font-size:13px}
.s-it .co-mark{--cs:22px}
.s-it span.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-it em{font:500 11px/1 var(--fm);font-style:normal;color:var(--ink3);white-space:nowrap}
.s-it:hover{background:var(--card);color:var(--ink)}
.s-it[aria-current="page"]{background:var(--card2);color:var(--ink);box-shadow:inset 2px 0 0 var(--gold)}
.s-it .new{font:700 10px/1 var(--fm);color:#120f17;background:var(--gold);padding:3px 5px;border-radius:5px}
.s-it .dot{width:8px;height:8px;border-radius:50%;background:var(--laser);box-shadow:0 0 0 3px rgba(255,45,61,.25);flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,45,61,0)}}
.s-ic{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink3);font:700 13px/1 var(--fm)}
.s-foot{border-top:1px solid var(--line);padding:12px 16px 14px;font:500 11px/1.5 var(--fm);color:var(--ink3)}
.s-foot b{color:var(--ink2);font-weight:600}

/* ---------- main column ---------- */
.main{display:flex;flex-direction:column;min-width:0;height:100vh;height:100dvh;position:relative}
.top{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:rgba(14,12,18,.92);backdrop-filter:blur(8px);z-index:20;min-height:54px}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:0;background:transparent;cursor:pointer;color:var(--ink2);flex:none;text-decoration:none}
.ib:hover{background:var(--card);color:var(--ink)}
.ib svg{width:20px;height:20px}
.picker{position:relative;min-width:0}
.pk-btn{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:8px 10px;border-radius:10px;cursor:pointer;font:800 18px/1 var(--fd);letter-spacing:-.02em;white-space:nowrap}
.pk-btn small{font:500 12px/1 var(--fm);color:var(--ink3);letter-spacing:0}
.pk-btn:hover{background:var(--card)}
.pk-btn svg{width:14px;height:14px;color:var(--ink3)}
.pk-menu{position:absolute;top:calc(100% + 6px);left:0;width:min(300px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:6px;z-index:50;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pk-menu[hidden]{display:none}
.pk-it{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px;cursor:pointer}
.pk-it:hover:not([disabled]){background:var(--card2)}
.pk-it b{display:block;font-weight:600}
.pk-it small{display:block;color:var(--ink3);font-size:12.5px;line-height:1.35}
.pk-it[disabled]{cursor:not-allowed;opacity:.55}
.pk-it .ck{width:18px;flex:none;color:var(--gold);font-weight:700}
.pk-sep{height:1px;background:var(--line);margin:4px 6px}
.top .sp{flex:1}
.live-pill{display:none;align-items:center;gap:7px;font:600 12px/1 var(--fm);color:var(--ink2);text-decoration:none;padding:8px 10px;border-radius:999px;border:1px solid var(--line2);white-space:nowrap}
.live-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--laser);animation:pulse 1.6s infinite}

.thread{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:auto;padding:0 14px 28px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.col{max-width:780px;margin:0 auto}

/* hero (home) */
.hero{padding:26px 2px 6px}
.hero .mk-wrap{font-size:54px;position:relative}
.hero-k{font:600 12px/1 var(--fm);color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin:18px 0 8px}
.hero h1{font:800 clamp(30px,8.4vw,52px)/.98 var(--fd);letter-spacing:-.035em;margin:0 0 12px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p.lede{color:var(--ink2);margin:0 0 4px;max-width:58ch;font-size:16px}
.motto{display:inline-block;margin-top:10px;font:600 12px/1 var(--fm);color:var(--ink3);border:1px dashed var(--line2);padding:6px 9px;border-radius:999px}
.memory{margin:18px 0 4px;border:1px solid var(--line2);border-radius:var(--r);background:linear-gradient(180deg,#1d1825,#16131c);padding:14px 14px 12px}
.memory h2{display:flex;align-items:center;gap:8px;font:600 13px/1 var(--fm);margin:0 0 10px;color:var(--gold)}
.memory h2 svg{width:16px;height:16px}
.memory p{margin:0 0 8px}
.memory ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.memory li a{display:flex;gap:10px;align-items:center;text-decoration:none;padding:8px 10px;border-radius:10px;background:var(--plate);border:1px solid var(--line)}
.memory li a:hover{border-color:var(--gold)}
.memory .co-mark{--cs:28px}

/* messages */
.ex{padding-top:22px}
.msg.user{display:flex;justify-content:flex-end;margin-bottom:14px}
.msg.user p{margin:0;max-width:82%;background:var(--gold);color:#17120a;font-weight:600;padding:10px 14px;border-radius:18px 18px 4px 18px;overflow-wrap:anywhere}
.msg.bot{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.msg.bot>.av{font-size:30px;display:flex;margin-top:2px}
@media (max-width:599px){.bot-b>.cards,.bot-b>.regen-note{margin-left:-40px}}
.bot-b{min-width:0}
.think{margin:2px 0 8px;font:500 13px/1.3 var(--fm);color:var(--ink3)}
.think summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center;padding:4px 0}
.think summary::-webkit-details-marker{display:none}
.think summary::after{content:"›";transition:transform .2s}
.think[open] summary::after{transform:rotate(90deg)}
.think ol{margin:6px 0 4px;padding-left:18px;border-left:2px solid var(--line);padding:2px 0 2px 14px;list-style:none}
.think ol li::before{content:"· "}
.think.busy summary{background:linear-gradient(90deg,var(--ink3) 0,var(--ink) 40%,var(--ink3) 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.say p{margin:0 0 10px;font-size:15.5px}
.say p.meme{color:var(--ink2)}
.say p.meme b{color:var(--ink)}
.say b{font-weight:600}
.plain .meme,.plain .memeonly{display:none!important}
.w{display:inline;animation:wIn .3s both;animation-delay:var(--d)}
@keyframes wIn{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
.rv{animation:up .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--cd,0ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 0}
.ab{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;color:var(--ink3);padding:7px 9px;border-radius:9px;cursor:pointer;font:500 12.5px/1 var(--fm);text-decoration:none}
.ab:hover{background:var(--card);color:var(--ink);border-color:var(--line)}
.ab svg{width:15px;height:15px}
.regen-note{font:500 12.5px/1.4 var(--fm);color:var(--ink3);margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--plate);border:1px dashed var(--line2)}
.ver{display:inline-flex;gap:4px;align-items:center;font:500 12px/1 var(--fm);color:var(--ink3);margin-right:4px}

/* artifacts (data cards) */
.art{border:1px solid var(--line2);border-radius:var(--r);background:var(--card);margin:12px 0;overflow:hidden;position:relative}
.art>header{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--plate);font:500 12px/1.2 var(--fm);color:var(--ink3);min-width:0}
.art>header b{color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art>header .sp{flex:1}
.art>header .tag{font:700 10.5px/1 var(--fm);letter-spacing:.06em;padding:4px 6px;border-radius:5px;background:var(--card2);color:var(--ink2);white-space:nowrap}
.art .bd{padding:14px}
.art h3{font:800 22px/1.05 var(--fd);letter-spacing:-.02em;margin:0 0 6px}
.art h4{font:600 13px/1.2 var(--fm);color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px}
.art p{margin:0 0 8px}
.fine{font:500 12px/1.45 var(--fm);color:var(--ink3)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv>div{background:var(--plate);border:1px solid var(--line);border-radius:12px;padding:10px 11px;min-width:0}
.kv b{display:block;font:700 22px/1.1 var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kv span{display:block;font-size:12.5px;color:var(--ink3);line-height:1.3;margin-top:3px}

/* round head */
.rhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.rhead .co-mark{--cs:56px}
.rhead .t{min-width:0}
.rhead .t small{display:block;font:500 12px/1.3 var(--fm);color:var(--ink3)}
.answer{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--plate);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.answer .big{font:700 clamp(34px,10vw,48px)/1 var(--fm);letter-spacing:-.04em}
.answer small{display:block;font:500 12px/1.3 var(--fm);color:var(--ink3);margin-bottom:6px}
.vibe{font:800 13px/1 var(--fd);letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-radius:999px;white-space:nowrap}
.vibe.back{background:rgba(74,222,128,.14);color:var(--up);box-shadow:inset 0 0 0 1px rgba(74,222,128,.4)}
.vibe.over{background:rgba(255,107,122,.13);color:var(--dn);box-shadow:inset 0 0 0 1px rgba(255,107,122,.4)}
.verdict{display:flex;align-items:center;gap:10px;font-weight:600;margin:0 0 12px;flex-wrap:wrap}
.verdict .lg{font-size:18px}

/* lanes (calls vs the market) */
.lanes{position:relative;margin:4px 0 6px}
.lane{display:grid;grid-template-columns:76px minmax(0,1fr) 92px;gap:8px;align-items:center;min-height:42px;border-top:1px solid var(--line)}
.lane:first-of-type{border-top:0}
.lane .who{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;min-width:0}
.lane .who .lg{font-size:13px}
.lane .trk{position:relative;height:30px}
.lane .trk::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line2)}
.lane .z{position:absolute;top:4px;bottom:4px;width:0;border-left:1px dashed var(--ink3);opacity:.6}
.lane .act{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--gold);border-radius:2px;box-shadow:0 0 8px rgba(255,201,74,.6)}
.lane .gap{position:absolute;top:50%;height:4px;margin-top:-2px;background:rgba(255,255,255,.12);border-radius:2px}
.lane .pt{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--bg)}
.lane .val{text-align:right;font:600 13px/1.25 var(--fm)}
.lane .val small{display:block;font-weight:500;color:var(--ink3);font-size:11.5px}
.lane-ax{display:grid;grid-template-columns:76px minmax(0,1fr) 92px;gap:8px;font:500 11px/1 var(--fm);color:var(--ink3)}
.lane-ax .trk{position:relative;height:16px}
.lane-ax .trk span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.lane-ax .trk span.mk{color:var(--gold);font-weight:700}
.tag2{display:inline-block;font:700 10.5px/1 var(--fm);padding:3px 5px;border-radius:5px;letter-spacing:.03em;white-space:nowrap}
.t-won{background:var(--gold);color:#17120a}.t-ok{background:rgba(74,222,128,.16);color:var(--up)}.t-bad{background:rgba(255,107,122,.15);color:var(--dn)}

/* film */
.film{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:1/1;max-height:440px;margin:0 auto}
.film video{width:100%;height:100%;object-fit:cover;display:block}
.film .fl{position:absolute;left:8px;top:8px;font:600 11px/1 var(--fm);background:rgba(0,0,0,.6);padding:5px 7px;border-radius:6px;color:#fff;pointer-events:none}
.film button.pp{position:absolute;right:8px;bottom:8px;border:0;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;padding:8px 12px;font:600 12px/1 var(--fm);cursor:pointer}

/* standings: meme archetype cards */
.stand{display:grid;gap:10px}
.sc{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line2);min-height:150px;isolation:isolate}
.sc .bgart{position:absolute;inset:0;z-index:-1}
.sc .bgart svg{width:100%;height:100%;display:block}
.sc .row1{display:flex;align-items:center;gap:10px;padding:12px 12px 0}
.plate{background:rgba(12,10,16,.93);border:1px solid var(--line2);border-radius:11px;backdrop-filter:blur(2px)}
.sc .rk{font:800 30px/1 var(--fd);padding:8px 10px;min-width:48px;text-align:center}
.sc .nm{padding:7px 10px;display:flex;align-items:center;gap:9px;min-width:0}
.sc .nm .lg,.sc .nm .lz{font-size:20px}
.sc .nm b{display:block;font:800 18px/1 var(--fd)}
.sc .nm small{display:block;font:500 11.5px/1.2 var(--fm);color:var(--ink3);margin-top:3px;white-space:nowrap}
.sc .wins{margin-left:auto;padding:7px 11px;text-align:right}
.sc .wins b{display:block;font:700 26px/1 var(--fm)}
.sc .wins small{font:500 11px/1 var(--fm);color:var(--ink3)}
.sc .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px 12px 0}
.sc .stats>div{padding:8px 9px;min-width:0}
.sc .stats b{display:block;font:700 16px/1.1 var(--fm);white-space:nowrap}
.sc .stats span{display:block;font-size:11.5px;color:var(--ink3);line-height:1.25;margin-top:2px}
.sc .foot{display:flex;align-items:center;gap:8px;padding:8px 12px 12px;flex-wrap:wrap}
.sc .arche{font:700 10.5px/1 var(--fm);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;color:var(--ink2)}
.sc .lastf{padding:5px 7px;display:flex;align-items:center;gap:6px;margin-left:auto}
.sc .lastf small{font:500 11px/1 var(--fm);color:var(--ink3)}
.form{display:inline-flex;gap:3px}
.form i{width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font:700 10px/1 var(--fm);font-style:normal}
.form .fw{background:var(--gold);color:#17120a}.form .fg{background:rgba(74,222,128,.2);color:var(--up)}.form .fr{background:rgba(255,107,122,.2);color:var(--dn)}.form .fn{border:1px dashed var(--line2);color:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font:500 11.5px/1.3 var(--fm);color:var(--ink3);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}

function buildNav(){var h='';
  h+='<div class="s-grp"><h3>Now</h3>'+(P?navItem("live","Round "+P.n+" · "+P.co,'<span class="s-ic"><span class="dot"></span></span>','<em data-cd="'+P.n+'">'+esc(leftTxt(P))+'</em>'):navItem("live","What's live",ico("●")))+navItem("my-call",myCall(P&&P.n)?"Your call (filed)":"Make your call",ico("✎"))+'</div>';
  h+='<div class="s-grp"><h3>Season</h3>'+navItem("standings","Standings",ico("#"))+navItem("rounds","Every round",ico("≡"))+navItem("next","What's next",ico("→"))+navItem("rules","How grading works",ico("§"))+'</div>';
  h+='<div class="s-grp"><h3>The AIs</h3>'+S.rows.map(function(x,i){return navItem("ai-"+x.m.toLowerCase(),S.nm(x.m)+" · "+x.ver,'<span class="s-ic">'+L(x.m)+'</span>','<em>#'+(i+1)+'</em>')}).join("")+navItem("compare","Compare AIs",ico("⇄"))+'</div>';
  h+='<div class="s-grp"><h3>Past rounds</h3>'+R.slice().reverse().map(function(r){return navItem("round-"+r.n,"R"+r.n+" · "+r.co,'<span class="s-ic">'+coMark(r.ticker)+'</span>',(NEWR[r.n]?'<span class="new">NEW</span>':'<em class="'+(r.a<0?'d':'u')+'">'+S.outTxt(r)+'</em>'))}).join("")+'</div>';
  h+='<div class="s-grp"><h3>Research</h3>'+navItem("learning","Are they learning?",ico("↗"))+navItem("findings","Unusual findings",ico("✱"))+navItem("inverse-claude","Inverse Claude (joke)",ico("⟲"))+navItem("records","Record holders",ico("★"))+'</div>';
  h+='<div class="s-grp"><h3>$EZ</h3>'+navItem("buyback","The buyback",ico("$"))+navItem("how-big","How big could it get?",ico("≈"))+navItem("get-ez","Get $EZ",ico("↓"))+navItem("about","What is EZ?",ico("?"))+navItem("browse","Browse everything",ico("▦"))+'</div>';
  $("#nav").innerHTML=h;markNav();filterNav()}
function markNav(){var k=cur?hashOf(cur):"live";$$(".s-it").forEach(function(a){if(a.getAttribute("data-h")===k)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")})}
function filterNav(){var q=$("#sq").value.toLowerCase().trim();$$(".s-it").forEach(function(a){a.style.display=!q||a.textContent.toLowerCase().indexOf(q)>-1?"":"none"});
  $$(".s-grp").forEach(function(g){g.style.display=$$(".s-it",g).some(function(a){return a.style.display!=="none"})?"":"none"})}
$("#sq").addEventListener("input",filterNav);
$("#sq").addEventListener("keydown",function(e){if(e.key==="Enter"){var a=$$(".s-it").filter(function(a){return a.style.display!=="none"})[0];if(a){location.hash=a.getAttribute("href")}}});

/* drawer */
var side=$("#side"),scrim=$("#scrim"),menuBtn=$("#menuBtn");
function openDrawer(){side.classList.add("open");scrim.classList.add("on");menuBtn.setAttribute("aria-expanded","true");setTimeout(function(){$("#sq").focus()},50)}
function closeDrawer(){if(!side.classList.contains("open"))return;side.classList.remove("open");scrim.classList.remove("on");menuBtn.setAttribute("aria-expanded","false")}
menuBtn.addEventListener("click",function(){side.classList.contains("open")?closeDrawer():openDrawer()});
scrim.addEventListener("click",closeDrawer);

/* model picker = voice picker; the numbers are the same in every mode */
var pkBtn=$("#pkBtn"),pkMenu=$("#pkMenu");
function buildPicker(){pkMenu.innerHTML=[["degen","EZ-GPT Degen","CT voice on. Memes as framing. Same numbers."],["plain","EZ-GPT Plain","Just the facts. Same numbers."]].map(function(o){return '<button type="button" role="menuitemradio" aria-checked="'+(MODE===o[0])+'" class="pk-it" data-mode="'+o[0]+'"><span class="ck">'+(MODE===o[0]?'✓':'')+'</span><span><b>'+o[1]+'</b><small>'+o[2]+'</small></span></button>'}).join("")+
  '<div class="pk-sep"></div><button type="button" class="pk-it" role="menuitem" disabled><span class="ck"></span><span><b>EZ-GPT Hindsight</b><small>Only works after the close. Not available before it.</small></span></button><button type="button" class="pk-it" role="menuitem" disabled><span class="ck"></span><span><b>Inverse Claude</b><small>A joke, not a model.</small></span></button>';
  $("#pkMode").textContent=MODE;document.body.classList.toggle("plain",MODE==="plain")}
function closePicker(){pkMenu.hidden=true;pkBtn.setAttribute("aria-expanded","false")}
pkBtn.addEventListener("click",function(e){e.stopPropagation();var o=pkMenu.hidden;pkMenu.hidden=!o;pkBtn.setAttribute("aria-expanded",String(o));if(o){var f=$('[aria-checked="true"]',pkMenu);f&&f.focus()}});
pkMenu.addEventListener("click",function(e){var b=e.target.closest("[data-mode]");if(!b)return;MODE=b.getAttribute("data-mode");S.store.set("ezgpt-mode",MODE);buildPicker();closePicker();pkBtn.focus();toast(MODE==="plain"?"Plain mode. Same numbers, no memes.":"Degen mode. Same numbers, more memes.");render(cur,null)});
document.addEventListener("click",function(e){if(!pkMenu.hidden&&!e.target.closest(".picker"))closePicker()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closePicker();closeDrawer()}
  if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="SELECT"){e.preventDefault();$("#q").focus()}});

/* asking */
function ask(text){text=String(text||"").trim();if(!text)return;var u=understand(text);
  if(u.go){var h=hashOf(u.go);if(cur&&hashOf(cur)===h){append(text,PL[u.go.id].build(u.go));return}pendingAsk=text;location.hash="#"+h;return}
  var a;if(u.say==="price")a={say:[M("As a large language model, I can't predict prices. Neither can the "+COUNT+" models, judging by the record."),T("I don't do price talk. Here is what the AIs actually called, and how the market graded them.")],body:"",chips:[["Who's winning?","who's winning"],["Get $EZ","get ez"],["The buyback","buyback"]]};
  else if(u.say==="gm")a={say:[M("gm. Few understand that the market is open somewhere right now."),T(P?"Round "+P.n+" is live: "+S.co(P)+". Grade in "+leftTxt(P)+".":S.graded+" rounds graded so far.")],body:"",chips:[["What's live?","live"],["Who's winning?","who's winning"]]};
  else if(u.say==="grass")a={say:[M("Touching grass is undefeated. It has never called a direction wrong."),T("Come back after the close. I'll remember what changed since your visit.")],body:"",chips:defChips()};
  else a={say:[M("I couldn't find that in the sheet. I could make something up, but the market would grade me."),T("Try one of these: who's winning, round 11, nike, gpt, live, inverse claude, buyback, how big, rules, what's next, get ez.")],body:"",chips:[["Browse everything","browse"]].concat(defChips())};
  append(text,a)}
$("#askForm").addEventListener("submit",function(e){e.preventDefault();var q=$("#q");ask(q.value);q.value=""});
chipsEl.addEventListener("click",function(e){var b=e.target.closest("[data-ask]");if(b)ask(b.getAttribute("data-ask"))});
col.addEventListener("click",function(e){var b=e.target.closest("[data-regen]"),c=e.target.closest("[data-copy]");
  if(b){var ex=b.closest(".ex"),n=(ex._regen||1)+1,ans=ex._ans;
    var notes=["Regenerated. Same numbers. The market doesn't regenerate.","Regenerated again. Still the same numbers. That's the point.","You can reroll me all day. The closing price stays put."];
    var nx=exchange(ex._q,ans,{regen:n+"/"+n,note:notes[(n-2)%notes.length],think:"Thought for 0.00s (nothing to change)"});nx._regen=n;ex.replaceWith(nx);wire(nx,ans)}
  if(c){var url=shareUrl();(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(function(){toast("Link copied")},function(){prompt("Copy this link",url)})}});

/* countdowns */
function tick(){if(!P)return;var t=leftTxt(P);$$('[data-cd="'+P.n+'"]').forEach(function(e){e.textContent=t});$("#livePill").innerHTML=P?'<span class="dot"></span>R'+P.n+' '+esc(P.co)+' · '+esc(t):''}
setInterval(tick,30000);

/* boot */
$("#sideMark").innerHTML=MK();
$("#sfoot").innerHTML='<b>$EZ · Earnings Zeason, with a Z</b><br>Calls filed before the print · Graded by the market · Never edited';
$("#dockFine").textContent="EZ-GPT can't change a number. The market graded them.";
buildPicker();buildNav();tick();
function go(){var p=parse(location.hash),a=pendingAsk;pendingAsk=null;render(p,a)}
window.addEventListener("hashchange",go);
var rz;window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){$$("[data-chart=hit]").forEach(mountHit)},200)});
go();
})();
</script>
</body>
</html>
