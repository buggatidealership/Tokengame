<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EZ Departures</title>
<meta name="description" content="Earnings Zeason ($EZ) as one split-flap departure board: four AIs call earnings moves, the market grades them.">
<meta name="theme-color" content="#0d0d0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0e;--wall:#121214;--frame:#18191c;--frame2:#101113;
  --flap:#26272b;--flap2:#202124;--ink:#f3eddd;--amber:#ffb224;--dim:#aca698;
  --up:#5bd892;--dn:#ff6d59;--gold:#f2b632;--green:#1e9a55;--red:#cf3a2b;--slate:#4a4d55;
  --paper:#efe7d3;--paper2:#e4d9bf;--pink:#17140e;--pdim:#5d5546;
  --cw:15px;--ch:23px;--gap:2px;--fs:17px;--plw:340px;
  --fc:"Barlow Condensed","Roboto Condensed","Arial Narrow","Liberation Sans Narrow","Helvetica Neue",Arial,sans-serif;
  --fb:"Barlow","Helvetica Neue",Arial,"Liberation Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(120% 70% at 50% 0%,#1a1b1f 0%,var(--bg) 60%);background-attachment:fixed;color:var(--ink);font-family:var(--fb);overflow-x:hidden}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#track{width:1px;pointer-events:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}

/* the board housing */
.board{position:relative;width:100%;max-width:1440px;background:linear-gradient(180deg,#1d1e22 0%,var(--frame) 30%,var(--frame2) 100%);border-radius:16px;padding:10px 8px 8px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -2px 0 rgba(0,0,0,.6),0 0 0 1px #0a0a0b,0 30px 80px rgba(0,0,0,.65),0 6px 18px rgba(0,0,0,.5)}
.board::before,.board::after{content:"";position:absolute;top:9px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#55575d,#1b1c1f 70%);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.board::before{left:9px}.board::after{right:9px}
.rail{display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;min-height:calc(var(--ch) + 6px)}
.ez{display:inline-flex;align-items:center;justify-content:center;height:calc(var(--ch) + 4px);padding:0 7px;border-radius:6px;background:#0a0a0b;border:1px solid #34353a;
  font:700 calc(var(--ch)*.78)/1 var(--fc);letter-spacing:.02em;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.ez b:nth-child(1){color:var(--gold)}.ez b:nth-child(2){color:#2fc26f}.ez b:nth-child(3){color:#ef4a39}
.hdr,.clock{display:flex;gap:var(--gap)}
.clock{margin-left:auto}
.season{display:flex;gap:1px;height:5px;margin:8px 14px 8px;border-radius:2px;overflow:hidden}
.season i{flex:1 1 0;background:#2b2c31;min-width:0}
.season i.w{background:var(--gold)}.season i.x{background:var(--red)}
.season i.now{background:var(--amber);animation:blink 1.6s steps(2,end) infinite}
@keyframes blink{50%{opacity:.25}}
.body{display:flex;flex-direction:column;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(var(--cols),var(--cw));gap:var(--gap);padding:8px;background:#0b0b0c;border-radius:8px;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.9),inset 0 0 0 1px #000;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wide .body{flex-direction:row;align-items:stretch;justify-content:center;gap:18px}

/* a flap */
.f{position:relative;width:var(--cw);height:var(--ch);perspective:calc(var(--ch)*5)}
.f::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;margin-top:-.5px;background:rgba(0,0,0,.75);z-index:4;pointer-events:none}
.h{position:absolute;left:0;right:0;overflow:hidden;background:var(--flap);color:var(--ink);backface-visibility:hidden}
.t,.ft{top:0;height:50%;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#2c2d32,var(--flap))}
.b,.fb{bottom:0;height:50%;border-radius:0 0 2px 2px;background:linear-gradient(180deg,var(--flap2),#1b1c1f)}
.ft{transform-origin:50% 100%;visibility:hidden;z-index:2}
.fb{transform-origin:50% 0;visibility:hidden;z-index:2}
.g{position:absolute;left:0;right:0;height:var(--ch);display:flex;align-items:center;justify-content:center;
  font:600 var(--fs)/1 var(--fc);white-space:pre;font-variant-numeric:tabular-nums}
.t .g,.ft .g{top:0}.b .g,.fb .g{bottom:0}
.h.a{color:var(--amber)}.h.d{color:var(--dim)}.h.u{color:var(--up)}.h.w{color:var(--dn)}
.h.tY{color:var(--gold)}.h.tG{color:#3fd07f}.h.tR{color:#ff5a46}
.t.G,.ft.G{background:linear-gradient(180deg,#25ad62,var(--green))}.b.G,.fb.G{background:#1a874a}.h.G{color:#fff}
.t.R,.ft.R{background:linear-gradient(180deg,#e04434,var(--red))}.b.R,.fb.R{background:#b63224}.h.R{color:#fff}
.t.Y,.ft.Y{background:linear-gradient(180deg,#ffc94d,var(--gold))}.b.Y,.fb.Y{background:#dca226}.h.Y{color:#1c1405}
.t.A,.ft.A{background:linear-gradient(180deg,#ffbf3f,var(--amber))}.b.A,.fb.A{background:#e89c16}.h.A{color:#1c1405}
.t.S,.ft.S{background:linear-gradient(180deg,#575a63,var(--slate))}.b.S,.fb.S{background:#40434a}.h.S{color:#fff}
.t.pY,.ft.pY{background:var(--gold)}.b.pY,.fb.pY{background:#dca226}
.t.pG,.ft.pG{background:#25ad62}.b.pG,.fb.pG{background:#1a874a}
.t.pR,.ft.pR{background:#e04434}.b.pR,.fb.pR{background:#b63224}
.h.ic .g{font-size:calc(var(--cw)*.9)}
.lg{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;border-radius:22%;flex:none;vertical-align:middle;overflow:hidden}
.lg svg{width:62%;height:62%;display:block}
.co-mark{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;border-radius:22%;background:#fff;overflow:hidden;flex:none;vertical-align:middle;
  font:700 .32em/1 var(--fb);color:#111}
.co-mark.dk{background:#141518}
.co-mark img{width:80%;height:80%;object-fit:contain;display:block}
.h.ic .co-mark,.h.ic .lg{font-size:calc(var(--cw)*.95)}

/* the enamel placard */
.plac{position:relative;background:var(--paper);color:var(--pink);border-radius:8px;overflow:auto;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),inset 0 -3px 0 rgba(0,0,0,.08),0 2px 0 #000;width:100%;scrollbar-width:thin}
.wide .plac{width:var(--plw);flex:none}
.pin{padding:14px 16px 16px;font-size:15px;line-height:1.45}
.short .pin{padding:10px 12px 12px;font-size:14px;line-height:1.38}.short .big{font-size:18px}.short .film{width:92px}.short .tgs svg{max-width:70px;margin:0 auto}
.pin.wipe{animation:wipe .34s cubic-bezier(.2,.7,.2,1)}
@keyframes wipe{from{clip-path:inset(0 0 100% 0);transform:translateY(-6px)}to{clip-path:inset(0 0 0 0);transform:none}}
.pin p{margin:0 0 .6em}.pin p:last-child{margin-bottom:0}
.kick{font:600 12px/1.2 var(--fc);letter-spacing:.14em;text-transform:uppercase;color:var(--pdim);margin:0 0 .5em!important}
.big{font:600 21px/1.18 var(--fc);letter-spacing:.005em;margin:0 0 .45em!important;color:#0f0d09}
.pin h1,.pin h2{font:700 24px/1.08 var(--fc);margin:0 0 .4em;color:#0f0d09;letter-spacing:.005em}
.fine{font-size:12.5px;color:var(--pdim)}
.pin ol,.pin ul{margin:.2em 0 .6em;padding-left:1.25em}
.pin li{margin:.25em 0}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:.4em 0 .2em;padding:0;list-style:none}
.roster li{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;line-height:1.15}
.roster .lg{font-size:26px}
.roster b{display:block;font-family:var(--fc);font-size:17px}
.stats{display:flex;flex-wrap:wrap;gap:10px 22px;margin:.3em 0 .7em}
.stats div{display:flex;flex-direction:column}
.stats b{font:700 30px/1 var(--fc);color:#0f0d09;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--pdim)}
.chips{display:flex;align-items:center;gap:8px;margin:.5em 0}
.chips .lg,.chips .co-mark{font-size:30px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--pdim);margin-top:.4em}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}
.films{display:flex;gap:10px;flex-wrap:wrap}
.film{position:relative;display:block;padding:0;border:0;background:#111;border-radius:6px;overflow:hidden;cursor:pointer;width:118px;aspect-ratio:1;flex:none;color:#fff}
.film img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.film span{position:absolute;left:6px;bottom:6px;right:6px;font:600 13px/1.1 var(--fc);text-align:left;background:rgba(0,0,0,.72);padding:4px 6px;border-radius:4px;letter-spacing:.03em}
.film.lgf{width:min(46%,170px)}
.filmrow{display:flex;gap:14px;align-items:flex-start}
.filmrow > div{flex:1;min-width:0}
.pick{margin:.2em 0 .8em}
.pick > span{display:block;font:600 12px/1.2 var(--fc);letter-spacing:.14em;text-transform:uppercase;color:var(--pdim);margin-bottom:6px}
.pick .opts{display:flex;flex-wrap:wrap;gap:6px}
.pick button,.btn{font:600 16px/1 var(--fc);letter-spacing:.04em;border-radius:7px;border:1.5px solid #1b1813;background:transparent;color:#1b1813;padding:9px 12px;min-height:40px;cursor:pointer}
.pick button[aria-pressed="true"]{background:#1b1813;color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:#1b1813;color:var(--paper);margin:0 8px 8px 0}
.btn[disabled],.btn[aria-disabled="true"]{background:transparent;color:#6a6152;border-style:dashed;cursor:not-allowed}
.wiped{font:700 19px/1.15 var(--fc);color:#a8291c;margin:.4em 0!important}
.tgs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:.6em 0 .2em}
.tgs figure{margin:0;text-align:center;min-width:0}
.tgs figcaption{display:flex;align-items:center;justify-content:center;gap:4px;font:600 14px/1 var(--fc);margin-bottom:3px}
.tgs figcaption .lg{font-size:16px}
.tgs svg{width:100%;height:auto;display:block}
.wide .tgs{grid-template-columns:repeat(2,1fr);gap:12px 16px}
.steps{list-style:none;padding:0!important}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:2px 8px;margin:.55em 0}
.steps li > i{grid-row:span 2;width:24px;height:24px;border-radius:5px;background:#1b1813;color:var(--gold);font:700 15px/24px var(--fc);text-align:center;font-style:normal}
.steps b{font-family:var(--fc);font-size:17px}
.now{display:inline-block;font:700 11px/1 var(--fc);letter-spacing:.1em;background:var(--green);color:#fff;padding:3px 5px;border-radius:3px;vertical-align:2px;margin-left:6px}
.ezm{display:inline-flex;align-items:center;background:#0c0c0e;border-radius:5px;padding:2px 6px;font:700 1em/1 var(--fc)}
.ezm b:nth-child(1){color:var(--gold)}.ezm b:nth-child(2){color:#2fc26f}.ezm b:nth-child(3){color:#ef4a39}
.disc{border-top:1px solid rgba(0,0,0,.18);padding-top:.6em;font-size:13px;color:#3d372c}

/* controls */
.ctl{display:flex;align-items:center;gap:8px;padding:10px 6px 2px}
.ctl button{font:600 15px/1 var(--fc);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:#232428;border:1px solid #3a3b41;border-radius:8px;min-height:40px;min-width:44px;padding:0 12px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.ctl button:hover{background:#2c2d32}
.ctl button[aria-pressed="true"]{color:var(--amber);border-color:#6a5422}
.ctl .where{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 13px/1.1 var(--fc);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:center}
.ctl .where b{color:var(--ink);font-size:15px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ctl .nx{color:#1c1405;background:var(--amber);border-color:#b37a12}
.ctl .nx:hover{background:#ffc04a}
button:focus-visible,a:focus-visible,.grid:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.plac button:focus-visible,.plac a:focus-visible{outline-color:#1b5fd1}
.menu{position:absolute;left:8px;right:8px;bottom:58px;max-height:70%;overflow:auto;background:#141518;border:1px solid #34353a;border-radius:10px;padding:8px;z-index:20;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.menu[hidden]{display:none}
.menu ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.menu button{width:100%;text-align:left;font:600 15px/1.1 var(--fc);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);background:#1d1e22;border:1px solid #2c2d32;border-radius:6px;padding:9px 10px;cursor:pointer}
.menu button[aria-current="true"]{color:#1c1405;background:var(--amber)}
.menu button span{color:var(--dim);margin-right:6px}
.menu button[aria-current="true"] span{color:#5a3d05}
dialog{border:0;padding:0;background:#000;border-radius:12px;max-width:min(92vw,720px);width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.82)}
dialog video{display:block;width:100%;height:auto;max-height:80vh;background:#000}
dialog .dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;font:600 16px/1.2 var(--fc);letter-spacing:.04em}
dialog .dh button{font:600 15px/1 var(--fc);letter-spacing:.06em;text-transform:uppercase;background:#232428;color:var(--ink);border:1px solid #3a3b41;border-radius:8px;min-height:38px;padding:0 12px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.pin.wipe{animation:none}.season i.now{animation:none}}
</style>
</head>
<body>
<h1 class="sr">Earnings Zeason ($EZ): We're teaching AIs to bet. The market grades them.</h1>
<noscript><p style="padding:24px;color:#f3eddd;font-family:Arial,sans-serif">This board needs JavaScript to flip. Earnings Zeason ($EZ): four AI models call earnings moves before the print, and the market grades them.</p></noscript>
<div id="track"></div>
<div id="stage">
  <div class="board" id="board">
    <div class="rail">
      <span class="ez" role="img" aria-label="$EZ"><b>$</b><b>E</b><b>Z</b></span>
      <div class="hdr" id="hdr" aria-hidden="true"></div>
      <div class="clock" id="clock" aria-hidden="true"></div>
    </div>
    <div class="season" id="season" role="img"></div>
    <div class="body">
      <div class="grid" id="grid" aria-hidden="true" title="Tap to flip to the next line"></div>
      <section class="plac" id="plac" aria-label="Notice"><div class="pin"></div></section>
    </div>
    <nav class="ctl" aria-label="Board">
      <button type="button" id="prev" aria-label="Previous">&#9664;</button>
      <div class="where" id="where" aria-live="off"><span id="wn">01 / 01</span><b id="wl"></b></div>
      <button type="button" id="all" aria-expanded="false" aria-controls="menu">All</button>
      <button type="button" id="snd" aria-pressed="false" aria-label="Flap sound">Sound</button>
      <button type="button" id="next" class="nx" aria-label="Next">&#9654;</button>
    </nav>
    <div class="menu" id="menu" hidden><ol id="mlist"></ol></div>
  </div>
</div>
<div class="sr" id="sr" aria-live="polite"></div>
<dialog id="film" aria-label="Round film"><div class="dh"><span id="ftitle"></span><button type="button" id="fclose">Close</button></div><video id="fvid" controls playsinline preload="metadata"></video></dialog>

<script src="ez-data.js"></script>
<script src="ez-story.js"></script>
<script>
(function(){
"use strict";
var S=EZS,esc=S.esc,nm=S.nm;
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}

/* ================= layout ================= */
var L={C:22,R:16,HN:12,mode:"narrow"},PW=22;
function chars(s){return Array.from(String(s))}
function ln(){var a=new Array(PW);for(var i=0;i<PW;i++)a[i]=null;return a}
var TILE={G:1,R:1,Y:1,A:1,S:1,pY:1,pG:1,pR:1};
function put(a,col,s,tone){chars(s).forEach(function(ch,i){var x=col+i;if(x<0||x>=a.length)return;a[x]=(ch===" "&&!TILE[tone])?null:{ch:ch,tone:tone||""}});return a}
function rput(a,end,s,tone){return put(a,end-chars(s).length+1,s,tone)}
function T(s,tone,col){return put(ln(),col||0,s,tone)}
function CT(s,tone){var n=chars(s).length;return put(ln(),Math.max(0,Math.floor((PW-n)/2)),s,tone)}
function setc(a,col,o){if(col>=0&&col<a.length)a[col]=o;return a}
function wrap(s,w){var out=[],cur="";String(s).split(/\s+/).forEach(function(wd){if(!wd)return;
    while(chars(wd).length>w){if(cur){out.push(cur);cur=""}out.push(chars(wd).slice(0,w).join(""));wd=chars(wd).slice(w).join("")}
    if(!wd)return;if(!cur)cur=wd;else if(chars(cur).length+1+chars(wd).length<=w)cur+=" "+wd;else{out.push(cur);cur=wd}});
  if(cur)out.push(cur);return out}
function para(s,tone,o){o=o||{};var ind=o.ind||0,w=Math.min(o.w||999,PW-ind);
  return wrap(s,w).map(function(x){var a=put(ln(),ind,x,tone);(o.hl||[]).forEach(function(h){var i=x.indexOf(h[0]);if(i>-1)put(a,ind+chars(x.slice(0,i)).length,h[0],h[1])});return a})}
function LG(m){return {html:S.logo(m),k:"L"+m,ch:"",tone:"ic",sr:nm(m)}}
function CM(t){return {html:coMark(t),k:"C"+t,ch:"",tone:"ic",sr:""}}
function ezWord(a,col){put(a,col,"$","tY");put(a,col+1,"E","tG");put(a,col+2,"Z","tR");return a}
function blanks(n){var o=[];for(var i=0;i<n;i++)o.push(ln());return o}

/* data helpers (all from ez-data.js / ez-story.js) */
function fd(d){return S.date(d)}
function dn(c){return /^DOWN/.test(c[1])}
function okc(r,c){return dn(c)===(r.a<0)}
function winTxt(r){var w=S.winners(r).map(nm);return w.length>1?w.join(" & ")+" win":w.length?w[0]+" wins":"No winner"}
function out0(r){return S.outTxt(r).replace(" ","")}
function listAnd(a){return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" and "+a[a.length-1]}
function xFmt(x){return x>=10?String(Math.round(x)):x.toFixed(1)}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
var P=S.live,LAST=S.last,H=S.highlights,REC=S.records;
var calcM=S.MCAPS[2],calcL=S.lev;
if(S.LEVS.indexOf(calcL)<0)calcL=S.LEVS[S.LEVS.length-1];
function closeAt(){return P?S.closeAt(P.resolves,P.ticker):null}
function hhmmUTC(d){function p(n){return (n<10?"0":"")+n}return p(d.getUTCHours())+":"+p(d.getUTCMinutes())+" UTC"}

/* placard helpers */
function filmBtn(r,big){if(!r||!r.poster)return "";
  return '<button type="button" class="film'+(big?' lgf':'')+'" data-film="'+r.n+'"><img src="'+MEDIA+r.poster+'.jpg" alt="" loading="lazy"><span>&#9654; Round '+r.n+' film</span></button>'}
function legendCalls(){return '<div class="legend"><span><i style="background:var(--green)"></i>Right way</span><span><i style="background:var(--red)"></i>Wrong way</span><span><i style="background:var(--gold)"></i>Winner</span><span><i style="background:var(--amber)"></i>What the stock did</span></div>'}
function ezm(){return '<span class="ezm" aria-label="$EZ"><b>$</b><b>E</b><b>Z</b></span>'}

/* ================= one graded round, as a board panel ================= */
function roundPanel(r,labels){var o=[];
  wrap(S.co(r),PW).forEach(function(s){o.push(T(s,"a"))});
  var l2=T("Round "+r.n,"d");rput(l2,PW-1,"Filed "+fd(r.called),"d");o.push(l2);
  var l3=T(out0(r),"A");rput(l3,PW-1,"Graded "+fd(r.resolves),"d");o.push(l3);
  if(labels){var lb=T("AI","d",2);put(lb,9,"Call","d");rput(lb,PW-1,"Off","d");o.push(lb)}

var FR=[];
function compose(){FR=[];var wide=L.C>=40,HW=Math.floor((L.C-2)/2);
  SCENES.forEach(function(sc){PW=L.C;var head=sc.head?sc.head():[];
    var items=[],pend=null;
    sc.panels.forEach(function(p){if(p.wideOnly&&!wide)return;
      if(wide&&p.half){PW=HW;var ls=p.f();PW=L.C;
        if(pend){var h=Math.max(pend.ls.length,ls.length),m=[];for(var k=0;k<h;k++){var a=ln(),A=pend.ls[k],B=ls[k];for(var c=0;c<HW;c++){if(A&&A[c])a[c]=A[c];if(B&&B[c])a[c+L.C-HW]=B[c]}m.push(a)}
          items.push({ls:m,metas:pend.metas.concat(p.meta?[p.meta]:[])});pend=null}
        else pend={ls:ls,metas:p.meta?[p.meta]:[]}}
      else{if(pend){items.push(padTo(pend));pend=null}PW=L.C;items.push({ls:p.f(),metas:p.meta?[p.meta]:[]})}});
    if(pend)items.push(padTo(pend));
    var pages=[],cur=null;
    function start(){cur={ls:head.map(function(r){return r.slice()}),metas:[]};if(head.length)cur.ls.push(ln())}
    start();
    items.forEach(function(it){var gap=cur.ls.length>(head.length?head.length+1:0)?1:0;
      if(cur.ls.length+gap+it.ls.length>L.R&&cur.ls.length>(head.length?head.length+1:0)){pages.push(cur);start();gap=0}
      if(gap)cur.ls.push(ln());cur.ls=cur.ls.concat(it.ls);cur.metas=cur.metas.concat(it.metas)});
    pages.push(cur);
    pages.forEach(function(pg,i){if(pages.length>1&&head.length&&pg.ls[0]){rput(pg.ls[0],L.C-1,(i+1)+"/"+pages.length,"d")}
      FR.push({sc:sc,page:i,pages:pages.length,ls:pg.ls.slice(0,L.R),metas:pg.metas})})});
  function padTo(pd){PW=HW;var m=pd.ls.map(function(r){PW=L.C;var a=ln();for(var c=0;c<HW;c++)if(r[c])a[c]=r[c];return a});PW=L.C;return {ls:m,metas:pd.metas}}
}

var CHS=" ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789$%.,:;!?'&()+-−/·▲▼~#";
var DUR=reduce?0:84;
var grid=$("#grid"),cells=[],hcells=[],kcells=[];
function key(c){return c?(c.k||c.ch)+"|"+(c.tone||""):" |"}
var BL={ch:" ",tone:""};
function mkCell(){var el=document.createElement("div");el.className="f";
  var parts=["t","b","ft","fb"].map(function(p){var h=document.createElement("div");h.className="h "+p;h._p=p;var g=document.createElement("span");g.className="g";h.appendChild(g);el.appendChild(h);return h});
  return {el:el,t:parts[0],b:parts[1],ft:parts[2],fb:parts[3],cur:BL,tgt:BL,seq:[],timer:0,start:0,an:[]}}
function draw(h,c){c=c||BL;h.className="h "+h._p+(c.tone?" "+c.tone:"");h.firstChild.innerHTML=c.html||esc(c.ch||" ")}
function settle(cell){cell.an.forEach(function(a){try{a.cancel()}catch(e){}});cell.an=[];cell.ft.style.visibility="hidden";cell.fb.style.visibility="hidden";draw(cell.b,cell.cur);draw(cell.t,cell.cur)}
function instant(cell,c){clearTimeout(cell.timer);clearTimeout(cell.start);cell.seq=[];cell.cur=c;cell.tgt=c;settle(cell)}
function seqFor(from,to){var s=[],n=2+Math.floor(Math.random()*3),i;
  var mid=TILE[to.tone]?"":(to.tone==="ic"?"":to.tone);
  if(to.html||to.ch===" "){for(i=0;i<n-1;i++)s.push({ch:CHS.charAt(1+Math.floor(Math.random()*(CHS.length-1))),tone:mid});s.push(to);return s}
  var ix=CHS.indexOf(to.ch);
  for(i=n;i>=1;i--){var ch=ix>0?CHS.charAt(((ix-i-1+CHS.length-1)%(CHS.length-1))+1):CHS.charAt(1+Math.floor(Math.random()*(CHS.length-1)));s.push({ch:ch,tone:mid})}
  s.push(to);return s}
function tick(cell){settle(cell);
  if(key(cell.cur)===key(cell.tgt)){cell.seq=[];return}
  if(!cell.seq.length)cell.seq=seqFor(cell.cur,cell.tgt);
  var nx=cell.seq.shift(),from=cell.cur;cell.cur=nx;
  draw(cell.t,nx);draw(cell.b,from);draw(cell.ft,from);draw(cell.fb,nx);
  cell.ft.style.visibility="visible";cell.fb.style.visibility="visible";
  if(cell.ft.animate){cell.an=[cell.ft.animate([{transform:"rotateX(0deg)"},{transform:"rotateX(-90deg)"}],{duration:DUR/2,easing:"ease-in",fill:"forwards"}),
    cell.fb.animate([{transform:"rotateX(90deg)"},{transform:"rotateX(0deg)"}],{duration:DUR/2,delay:DUR/2,easing:"cubic-bezier(.3,1.5,.6,1)",fill:"both"})]}
  clack();
  cell.timer=setTimeout(function(){tick(cell)},DUR+4)}
function target(cell,c,delay){c=c||BL;
  if(key(c)===key(cell.tgt)&&(key(c)===key(cell.cur)||cell.seq.length||cell.timer))return;
  cell.tgt=c;
  if(reduce||DUR===0||document.hidden){instant(cell,c);return}
  clearTimeout(cell.start);clearTimeout(cell.timer);cell.timer=0;cell.seq=[];
  cell.start=setTimeout(function(){tick(cell)},delay||0)}

function buildGrid(){grid.innerHTML="";cells=[];var fr=document.createDocumentFragment();
  for(var r=0;r<L.R;r++){var row=[];for(var c=0;c<L.C;c++){var x=mkCell();fr.appendChild(x.el);row.push(x);settle(x)}cells.push(row)}grid.appendChild(fr);
  var hd=$("#hdr");hd.innerHTML="";hcells=[];for(var i=0;i<L.HN;i++){var y=mkCell();hd.appendChild(y.el);hcells.push(y);settle(y)}
  var ck=$("#clock");ck.innerHTML="";kcells=[];for(var j=0;j<5;j++){var z=mkCell();ck.appendChild(z.el);kcells.push(z);settle(z)}}

/* the clack: a short filtered noise burst, only after the visitor turns sound on */
var AC=null,snd=false,lastClk=0,noise=null;
function clack(){if(!snd||!AC)return;var t=AC.currentTime;if(t-lastClk<.022)return;lastClk=t;
  var s=AC.createBufferSource();s.buffer=noise;var f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=1800+Math.random()*1400;f.Q.value=1.2;
  var g=AC.createGain();g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.03);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+.035)}

function show(i,opt){opt=opt||{};i=Math.max(0,Math.min(FR.length-1,i));var f=FR[i],same=i===cur;cur=i;

  var tt=chars(f.sc.title).slice(0,L.HN);for(var h=0;h<L.HN;h++){var ch=tt[h];target(hcells[h],ch&&ch!==" "?{ch:ch,tone:"a"}:BL,h*18)}
  var pk=f.sc.id+":"+f.page+":"+L.C;

    pin.innerHTML=f.sc.plac?f.sc.plac(f.metas,f.page,f.pages):"";box.innerHTML="";box.appendChild(pin);box.scrollTop=0;

/* ================= sizing ================= */
function size(){var W=document.documentElement.clientWidth,Hh=window.innerHeight,mode=W>=960?"wide":W>=600?"mid":"narrow";
  var C=mode==="wide"?44:mode==="mid"?30:22,R=mode==="wide"?18:17,HN=mode==="wide"?16:mode==="mid"?14:12,gap=W<400?1:2;
  var changed=C!==L.C||R!==L.R||!cells.length;L={C:C,R:R,HN:HN,mode:mode};
  var board=$("#board");board.classList.toggle("wide",mode==="wide");board.classList.toggle("short",mode!=="wide"&&Hh<740);
  var stagePad=mode==="narrow"?8:20,boardW=Math.min(W-2*stagePad,1440),bpad=16;
  var plw=mode==="wide"?Math.max(290,Math.min(330,Math.round(boardW*.24))):0;
  var gridW=boardW-bpad-(mode==="wide"?plw+18:0)-16;
  var cw=Math.floor((gridW-(C-1)*gap)/C);
  /* height: rail + strip + grid + (placard when stacked) + controls */
  var fixed=2*stagePad+18+16+21+58+16,plMin=mode==="wide"?0:Math.max(Hh<740?120:150,Math.min(230,Math.round(Hh*.22)));
  var chMax=Math.floor((Hh-fixed-plMin-(cw*1.5)-10)/(R+1))-gap;
  var ch=Math.max(17,Math.min(Math.round(cw*1.7),chMax));
  var rt=document.documentElement.style;
  rt.setProperty("--cw",cw+"px");rt.setProperty("--ch",ch+"px");rt.setProperty("--gap",gap+"px");rt.setProperty("--cols",C);rt.setProperty("--plw",plw+"px");
  rt.setProperty("--fs",Math.round(Math.min(ch*.72,cw*1.3))+"px");
  $("#stage").style.padding=stagePad+"px";
  if(changed){buildGrid();compose();cur=-1;placKey=""}
  /* the placard takes what is left */
  var gridH=R*(ch+gap)-gap+16,plac=$("#plac");
  if(mode==="wide"){plac.style.height=gridH+"px"}
  else{var used=2*stagePad+(ch+6)+21+gridH+10+52+18+8;plac.style.height=Math.max(150,Hh-used)+"px"}
  step=Math.max(320,Math.round(Hh*.62));$("#track").style.height=((FR.length-1)*step+Hh)+"px";
  return changed}

function go(i){i=Math.max(0,Math.min(FR.length-1,i));window.scrollTo({top:i*step,behavior:reduce?"auto":"smooth"});if(reduce||Math.abs(i-cur)>1)show(i)}
