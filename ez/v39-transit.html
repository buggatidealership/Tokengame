<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EZ Transit</title>
<meta name="description" content="Earnings Zeason as a transit network: every AI is a line, every earnings round is a station.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&family=Overpass+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2EEE3;--paper2:#E7E1D0;--card:#FBF9F3;--ink:#14161B;--ink2:#5A5D66;--rule:#CDC5B0;
  --board:#14264B;--board2:#0C1835;--bt:#F5F2EA;--bt2:#A6B3D2;
  --amber:#FFB51A;--ok:#13864A;--bad:#CF3428;--gold:#E9B32A;--eg:#22B05E;--zr:#E3382C;
  --fs:"Overpass","Helvetica Neue",Helvetica,Arial,sans-serif;
  --fm:"Overpass Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --navh:64px;
}
*{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--fs);overflow-x:hidden;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom))}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
svg a:focus-visible{outline:none}
svg a:focus-visible .hit{stroke:var(--amber);stroke-width:4}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--fm)}
.up{color:var(--ok)}.dn{color:var(--bad)}

/* the roundel: $EZ on a dark tile */
.roundel{display:inline-flex;align-items:center;justify-content:center;background:#0E0F13;border-radius:9px;font:900 15px/1 var(--fs);letter-spacing:-.02em;width:42px;height:34px;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.roundel b{font-weight:900}.roundel .d{color:var(--gold)}.roundel .e{color:var(--eg)}.roundel .z{color:var(--zr)}
.roundel.big{width:76px;height:60px;font-size:28px;border-radius:14px}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--board2);color:var(--bt);border-bottom:4px solid var(--amber)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand-t{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-t b{font-weight:800;font-size:15px;white-space:nowrap}
.brand-t span{font:600 10px/1.2 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--bt2);white-space:nowrap}
.top .sp{flex:1}
.getbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:8px;background:var(--amber);color:#1a1300;font-weight:800;text-decoration:none;white-space:nowrap;position:relative}
.getbtn::before,.getbtn::after{content:"";position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--board2)}
.getbtn::before{left:-5px}.getbtn::after{right:-5px}

/* nav: bottom bar on phones, inline in the header on wide screens */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--board2);border-top:3px solid var(--amber);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--navh);text-decoration:none;color:var(--bt2);font:700 11px/1 var(--fs);letter-spacing:.01em}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:#fff;background:rgba(255,181,26,.14);box-shadow:inset 0 3px 0 var(--amber)}
@media (min-width:960px){
  body{padding-bottom:0}
  .nav{position:static;display:flex;border:0;background:none;gap:2px;padding:0}
  .nav a{flex-direction:row;min-height:44px;padding:0 12px;border-radius:8px;font-size:14px;gap:7px}
  .nav a svg{width:18px;height:18px}
  .nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--amber)}
}

/* layout */
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
main{display:block}
.place{animation:arrive .42s cubic-bezier(.2,.7,.2,1) both}
@keyframes arrive{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.train{position:fixed;left:0;top:0;height:6px;width:100%;z-index:60;pointer-events:none;transform:translateX(-100%)}
.train.go{animation:train .6s cubic-bezier(.6,0,.3,1)}
@keyframes train{0%{transform:translateX(-100%)}60%{transform:translateX(0)}100%{transform:translateX(100%)}}
h1,h2,h3{line-height:1.08;margin:0;letter-spacing:-.01em}
h2{font-size:26px;font-weight:900}
h3{font-size:18px;font-weight:800}
p{margin:0}
.kick{font:700 11px/1.3 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.sec{margin:34px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;border-bottom:3px solid var(--ink);padding-bottom:8px}
.sec-h p{color:var(--ink2);font-size:14px}
.card{background:var(--card);border:1.5px solid var(--rule);border-radius:14px;padding:18px}
.note{font-size:13px;color:var(--ink2);line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--ink);background:var(--card);font-weight:800;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.amber{background:var(--amber);border-color:#1a1300;color:#1a1300}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed;border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--rule);background:var(--card);font-weight:700;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip .sw{width:18px;height:8px;border-radius:4px;box-shadow:0 0 0 1.5px #fff}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 12px/1 var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:18px 0 12px}
.crumbs a{min-height:32px;display:inline-flex;align-items:center;text-decoration:none;border-bottom:2px solid var(--rule)}

/* logos */
.lg{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:.36em;vertical-align:middle;flex:none}
.lg svg{width:62%;height:62%}
.co-mark{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:9px;background:#fff;border:1.5px solid var(--rule);font:700 9px/1 var(--fm);color:var(--ink);overflow:hidden;vertical-align:middle;flex:none;text-align:center}
.co-mark img{width:80%;height:80%;object-fit:contain}
.co-mark.dk{background:#12131a;border-color:#12131a}
.co-mark.lgx{width:60px;height:60px;border-radius:12px}

/* hero + next train */
.home-top{display:grid;gap:16px;margin:18px 0 16px}
@media (min-width:960px){.home-top{grid-template-columns:1.15fr 1fr;align-items:stretch}}
.hero{padding:4px 0}
.hero h1{font-size:clamp(30px,8.4vw,52px);font-weight:900;letter-spacing:-.025em;margin:8px 0 10px;line-height:1}
.hero p.lead{font-size:17px;max-width:38em}
.hero .motto{margin-top:12px;font:700 13px/1.3 var(--fm);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero .motto i{font-style:normal;background:var(--ink);color:var(--paper);padding:5px 8px;border-radius:5px}

.board{background:var(--board);color:var(--bt);border-radius:14px;padding:16px;position:relative;overflow:hidden;box-shadow:0 2px 0 var(--board2),0 10px 24px -14px rgba(10,20,50,.6)}
.board .kick{color:var(--bt2)}
.dmx{font-family:var(--fm);color:var(--amber);letter-spacing:.04em}
.nt-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.blink{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--amber);margin-right:7px;vertical-align:1px;animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.nt-name{display:flex;align-items:center;gap:12px;margin:4px 0 6px}
.nt-name h2{color:#fff;font-size:28px}
.nt-calls{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:12px 0}
@media (min-width:560px) and (max-width:959px){.nt-calls{grid-template-columns:repeat(4,1fr)}}
.nt-call{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:8px;padding:7px 9px;border-left:5px solid var(--lc);text-decoration:none;min-height:44px}
.nt-call b{font-weight:800;font-size:14px}
.nt-call span{font:700 14px var(--fm);color:var(--amber);margin-left:auto;white-space:nowrap}
.nt-call b{white-space:nowrap}
.nt-time{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;font-size:14px;color:var(--bt2)}
.nt-time .dmx{font-size:22px;font-weight:700}
.nt-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.board .btn{border-color:var(--bt2);background:transparent;color:var(--bt)}
.board .btn.amber{background:var(--amber);color:#1a1300;border-color:var(--amber)}

.svc{margin:12px 0 0;border-radius:12px;border:2px solid var(--ink);background:var(--card);padding:12px 14px 12px 16px;display:flex;gap:12px;align-items:flex-start;position:relative}
.svc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;border-radius:10px 0 0 10px;background:repeating-linear-gradient(45deg,var(--amber) 0 7px,var(--ink) 7px 14px)}
.svc .kick{color:var(--ink)}
.svc ul{margin:6px 0 0;padding-left:18px}
.svc li{margin:2px 0}
.svc .x{margin-left:auto;min-width:44px;min-height:44px;border:0;background:none;font-size:22px;cursor:pointer}

/* map */
.mapbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:20px 0 10px}
.mapbar .chips{gap:6px}
.zoom{display:none;gap:6px}
@media (min-width:760px){.zoom{display:flex}}
.zoom button{min-width:44px;min-height:44px;border-radius:10px;border:2px solid var(--ink);background:var(--card);font-weight:800;cursor:pointer}
.mapwrap{position:relative;border-radius:16px;border:2px solid var(--ink);background-color:#F7F4EC;
  background-image:linear-gradient(rgba(20,22,27,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(20,22,27,.045) 1px,transparent 1px);background-size:24px 24px;overflow:hidden}
.mapwrap.h{overflow-x:auto;overflow-y:hidden;cursor:grab;scrollbar-width:thin}
.mapwrap.h.drag{cursor:grabbing}
.mapwrap svg{display:block}
.mapwrap svg text{font-family:var(--fs)}
.mapwrap .mtxt{font-family:var(--fm)}
.st .hit{fill:transparent;stroke:transparent}
.st:hover .bd{filter:brightness(1.25)}
.st:hover .hit{fill:rgba(255,181,26,.08)}
.ln{cursor:pointer}
.ln:hover .vis{stroke-width:9}
.dim{opacity:.12;transition:opacity .2s}
.fdim{opacity:.22}
.halo{animation:halo 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:12px 0 0;font-size:13px;color:var(--ink2)}
.legend .it{display:inline-flex;align-items:center;gap:7px}
.legend svg{flex:none}
.legend a{color:var(--ink);font-weight:700}
details.lg-d{margin-top:10px}
details.lg-d summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:800}

/* station index */
.ix{display:grid;gap:8px}
.ix-row{display:grid;grid-template-columns:48px 1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--rule);text-decoration:none;min-height:64px}
.ix-row:hover{border-color:var(--ink)}
.ix-n{font:800 14px/1 var(--fm);background:var(--board);color:#fff;border-radius:8px;height:40px;display:flex;align-items:center;justify-content:center}
.ix-row.live .ix-n{background:var(--amber);color:#1a1300}
.ix-c b{font-weight:800}
.ix-c small{display:block;color:var(--ink2);font-size:13px}
.ix-m{text-align:right;font:700 15px var(--fm)}
.ix-dots{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}
.ix-row[hidden]{display:none}

/* station sign headers */
.sign{background:var(--board);color:#fff;border-radius:16px;padding:16px 18px 18px;position:relative;overflow:hidden;border-top:12px solid var(--lc,var(--amber))}
.sign .kick{color:var(--bt2)}
.sign h1{font-size:clamp(30px,8vw,56px);font-weight:900;letter-spacing:-.025em;line-height:1;margin:6px 0 8px;outline:none}
.sign .ss{color:var(--bt2);font-size:15px}
.sign .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sign.dash{background:var(--card);color:var(--ink);border:2.5px dashed var(--ink);border-top:12px solid var(--ink2)}
.sign.dash .kick,.sign.dash .ss{color:var(--ink2)}
.sign.live{background:var(--amber);color:#1a1300;border-top-color:var(--board)}
.sign.live .kick,.sign.live .ss{color:#4a3600}

.out{display:grid;gap:12px;margin:16px 0}
@media (min-width:760px){.out{grid-template-columns:1fr 1fr}}
.big{font:900 clamp(40px,12vw,72px)/1 var(--fs);letter-spacing:-.03em}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ring{display:inline-block;width:20px;height:20px;border-radius:50%;border:4px solid var(--ink);background:#fff;flex:none;vertical-align:middle}
.calls{display:grid;gap:8px;margin-top:12px}
.callr{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--rule);border-left:8px solid var(--lc);text-decoration:none;min-height:56px}
.callr .who{display:flex;align-items:center;gap:8px;font-weight:800}
.callr .who .lg{font-size:24px}
.callr .said{font:700 16px var(--fm)}
.callr .res{text-align:right;font-size:13px;color:var(--ink2)}
.callr .res b{display:block;font:800 15px var(--fm);color:var(--ink)}
.callr.win{background:#FFF8E2;border-color:var(--ink)}
.diag{margin-top:6px;width:100%}
.diag svg{display:block;width:100%;height:auto;overflow:visible}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:26px 0}
.pn a{display:flex;flex-direction:column;justify-content:center;padding:12px 14px;min-height:64px;border:2px solid var(--ink);border-radius:12px;text-decoration:none;background:var(--card)}
.pn a small{font:700 11px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.pn a b{font-weight:800}
.pn a.nx{text-align:right}
.pn span{min-height:1px}
.film{margin:0;background:#000;border-radius:14px;overflow:hidden;max-width:560px}
.film video{display:block;width:100%;aspect-ratio:1/1;background:#000}
.film.tall video{aspect-ratio:9/16}
.film figcaption{color:#cfd3dc;font-size:13px;padding:8px 12px;background:#0b0c10}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;background:var(--ink);color:var(--paper);font:700 12px/1.2 var(--fm);letter-spacing:.04em;text-decoration:none}
.tag.amber{background:var(--amber);color:#1a1300}
.share{margin-top:10px}

/* ticket */
.ticket{background:#FFF6DC;border:2px solid #1a1300;border-radius:14px;padding:18px;position:relative;margin-top:16px;
  -webkit-mask:radial-gradient(circle 12px at 0 50%,transparent 11px,#000 12px) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 50%,transparent 11px,#000 12px) right/51% 100% no-repeat;
  mask:radial-gradient(circle 12px at 0 50%,transparent 11px,#000 12px) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 50%,transparent 11px,#000 12px) right/51% 100% no-repeat}
.ticket .th{display:flex;justify-content:space-between;gap:10px;border-bottom:2px dashed #1a1300;padding-bottom:10px;margin-bottom:12px;font:700 12px/1.3 var(--fm);letter-spacing:.08em;text-transform:uppercase}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:52px;border-radius:10px;border:2px solid #1a1300;background:#fff;font-weight:900;font-size:18px;cursor:pointer}
.seg button[aria-pressed="true"].u{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg button[aria-pressed="true"].d{background:var(--bad);color:#fff;border-color:var(--bad)}
.rng{margin:14px 0 8px}
.rng label{display:flex;justify-content:space-between;font-weight:800}
.rng output{font:800 22px var(--fm)}
.rng input{width:100%;height:44px;accent-color:#1a1300}
.stamp{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--bad);color:var(--bad);font:900 14px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;border-radius:6px;transform:rotate(-4deg)}

/* standings board */
.sb{background:var(--board2);color:var(--bt);border-radius:16px;padding:8px;overflow:hidden}
.sb-h,.sb-r{display:grid;grid-template-columns:30px 1fr auto;gap:6px 12px;align-items:center;padding:12px 10px}
.sb-h{display:none;font:700 11px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--bt2)}
.sb-r{text-decoration:none;border-top:1px solid rgba(255,255,255,.1);border-left:6px solid var(--lc);border-radius:4px}
.sb-r:first-of-type{border-top:0}
.sb-r:hover{background:rgba(255,255,255,.05)}
.sb-k{font:800 18px var(--fm);color:var(--amber)}
.sb-n{display:flex;align-items:center;gap:10px;min-width:0}
.sb-n .lg{font-size:28px}
.sb-n b{font-weight:800;font-size:17px;display:block}
.sb-n small{color:var(--bt2);font-size:13px;display:block}
.sb-w{text-align:right}
.sb-w b{font:800 24px var(--fm);color:var(--amber);display:block;line-height:1}
.sb-w small{color:var(--bt2);font-size:12px}
.sb-r .sb-w{grid-column:3;grid-row:1}.sb-f{grid-column:2/-1;padding-left:0}
.sb-x{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px;padding-left:42px}
.sb-x div{font-size:12px;color:var(--bt2)}
.sb-x b{display:block;font:700 15px var(--fm);color:#fff}
@media (min-width:960px){
  .sb-h,.sb-r{grid-template-columns:40px minmax(200px,1.4fr) .8fr .8fr 1.1fr .5fr 150px}
  .sb-h{display:grid}
  .sb-x{display:contents}
  .sb-x div{font-size:12px}
  .sb-r .sb-w{grid-column:auto;grid-row:auto}.sb-f{grid-column:auto}
}
.form{display:inline-flex;gap:5px;align-items:center}
.form i{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.form i.w{background:#fff;border:4px solid var(--ink);box-shadow:0 0 0 1.5px #fff}
.form i.g{background:var(--ok);border:2px solid #fff}
.form i.r{background:#fff;border:3px solid var(--bad)}
.form i.n{border:2px dashed var(--ink2)}
.sb .form i.w{border-color:var(--amber);background:var(--board2);box-shadow:none}

.grid2{display:grid;gap:12px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;gap:12px}
@media (min-width:760px){.grid3{grid-template-columns:repeat(3,1fr)}}
.grid4{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (min-width:960px){.grid4{grid-template-columns:repeat(4,1fr)}}
.plaque{background:var(--board);color:#fff;border-radius:12px;padding:16px;text-decoration:none;display:block;border-bottom:6px solid var(--lc,var(--amber))}
.plaque .kick{color:var(--bt2)}
.plaque .v{font:900 34px/1 var(--fs);margin:10px 0 6px;letter-spacing:-.02em}
.plaque p{color:var(--bt2);font-size:14px}
.notice{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:16px;position:relative}
.notice .head{font-size:21px;font-weight:900;line-height:1.12;margin:8px 0}
.notice .stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 0 8px}
.notice .stats b{display:block;font:800 22px var(--fm)}
.notice .stats span{font-size:12px;color:var(--ink2)}
.notice.fun{background:repeating-linear-gradient(-45deg,#FFF6DC 0 14px,#FBF0CF 14px 28px)}

.route li::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:10px;background:var(--lc)}

.route li:first-child::before{top:30px}
.route li:last-child::before{bottom:calc(100% - 30px)}
.route .mk{position:absolute;left:8px;top:18px;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--ink);z-index:1}
.route .mk.w{width:30px;height:30px;left:5px;top:15px;border-width:6px}
.route .mk.r{border-color:var(--bad)}
.route .mk.p{background:var(--amber)}
.route .mk.o{border-style:dashed;border-color:var(--ink2)}
.route a,.route .stp{display:block;padding:12px 0 14px;text-decoration:none;border-bottom:1px solid var(--rule);min-height:60px}
.route b{font-weight:800}
.route .ln2{font:600 14px/1.4 var(--fm);color:var(--ink2)}
.route .res{font-weight:800;font-size:14px}

/* charts */
.chart{width:100%}

.bulls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:960px){.bulls{grid-template-columns:repeat(4,1fr)}}

.money b{display:block;font:800 18px var(--fm)}

/* timetable */
.tt{background:var(--board2);color:var(--bt);border-radius:16px;padding:8px 12px}
.tt h3{font:700 12px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);padding:14px 4px 6px;border-bottom:1px solid rgba(255,255,255,.15)}

.tt .c b{font-weight:800}
.tt .c small{display:block;color:var(--bt2);font-size:12px}
.tt .g{font:600 12px var(--fm);color:var(--bt2);text-align:right}

/* fares */
.split{display:grid;gap:12px;margin-top:14px}
@media (min-width:960px){.split{grid-template-columns:1.6fr 1fr}}

.branch.pot{background:#FFF6DC}
.branch.ops{background:var(--card)}
.pct{font:900 clamp(56px,16vw,96px)/.9 var(--fs);letter-spacing:-.04em}
.outs{display:grid;gap:8px;margin-top:14px}
@media (min-width:560px){.outs{grid-template-columns:repeat(3,1fr)}}

.steps small{display:inline-block;font:700 10px var(--fm);letter-spacing:.1em;text-transform:uppercase;background:var(--amber);padding:3px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}

.wipe svg{flex:none}
.junction{width:100%;max-width:640px;display:block;margin:6px 0}

/* get */
.tix{display:grid;gap:14px}
@media (min-width:960px){.tix{grid-template-columns:1.3fr 1fr}}
.tix-steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tix-steps li{background:var(--card);border:1.5px solid var(--rule);border-radius:12px;padding:14px 14px 14px 62px;position:relative}
.tix-steps li::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--board);color:#fff;font:800 16px/34px var(--fm);text-align:center}
.tix-steps b{font-weight:900;display:block}
.mono-box{font:700 14px var(--fm);background:#fff;border:2px dashed var(--ink2);border-radius:8px;padding:10px;margin-top:8px;word-break:break-all}

/* rules */
.rules{display:grid;gap:10px;counter-reset:r}
@media (min-width:760px){.rules{grid-template-columns:1fr 1fr}}
.rule{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:16px 16px 16px 70px;position:relative}
.rule::before{counter-increment:r;content:counter(r);position:absolute;left:14px;top:14px;width:42px;height:42px;border-radius:50%;border:6px solid var(--bad);background:#fff;font:900 18px/30px var(--fs);text-align:center}
.rule b{font-weight:900;font-size:18px;display:block}

footer.ft{margin-top:56px;background:var(--board2);color:var(--bt2);padding:28px 0 36px;border-top:4px solid var(--amber)}
.ft-in{display:grid;gap:18px}
@media (min-width:960px){.ft-in{grid-template-columns:1.2fr 1fr}}
.ft b{color:#fff}
.ft nav{display:flex;flex-wrap:wrap;gap:4px 14px}
.ft nav a{min-height:36px;display:inline-flex;align-items:center;color:var(--bt);font-size:14px}
.ft .disc{font-size:13px;margin-top:10px;max-width:46em}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .halo{display:none}
}

<script>
(function(){
"use strict";
var S=EZS,R=ROUNDS,LV=S.live,M=S.models,N=R.length;
var KEY="ez-transit-v39-seen",CK="ez-transit-v39-calls",PK="ez-transit-v39-prefs";
var COL={GPT:"#0E9F78",KIMI:"#1F6FE5",CLAUDE:"#D9663A",GROK:"#2A2C34"};
function col(m){return COL[m]||(MODELS[m]&&MODELS[m].c)||"#555"}
var nm=S.nm,esc=S.esc;
function sl(m){return m.toLowerCase()}
function fromSlug(s){return M.filter(function(m){return sl(m)===s})[0]}
function isDn(c){return /^DOWN/.test(c[1])}
function okc(r,c){return isDn(c)===(r.a<0)}
function won(r,m){return S.winners(r).indexOf(m)>-1}
function rowOf(m){return S.rows.filter(function(x){return x.m===m})[0]}
function rankOf(m){return S.rows.indexOf(rowOf(m))+1}
function fmtX(x){return (x>=10?Math.round(x):x.toFixed(1))+"x"}
function $(s,el){return (el||document).querySelector(s)}
function $$(s,el){return [].slice.call((el||document).querySelectorAll(s))}
var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
var maxA=Math.max.apply(null,R.map(function(r){return Math.abs(r.a)}));
var LOGOF=function(t){var L=CO_LOGOS[String(t).toUpperCase()];return L?{f:MEDIA+(L.f||L),dk:!!L.dark}:null};
function pts(v){return v+" pts"}
function moveCls(r){return r.a<0?"dn":"up"}
function ex(t){return {us:"New York",tw:"Taipei",jp:"Tokyo",kr:"Seoul",uk:"London",eu:"Europe"}[S.exch(t)]||"the exchange"}

/* ---------- return use: what changed since this browser was last here ---------- */
var prevVisit=S.store.get(KEY);
var since=S.since(KEY);
var prefs=S.store.get(PK)||{};
prefs.iso=prefs.iso||null;prefs.rf=prefs.rf||"all";prefs.show=prefs.show||{};
M.forEach(function(m){if(prefs.show[m]==null)prefs.show[m]=true});
function savePrefs(){S.store.set(PK,prefs)}
var mine=S.store.get(CK)||{};
function myGrade(r){var t=mine[r.n];if(!t)return null;var v=(t.d==="DOWN"?-1:1)*t.mag,ok=(v<0)===(r.a<0),off=Math.abs(v-r.a);
  var ws=r.calls.filter(function(c){return won(r,c[0])}).map(function(c){return parseFloat(c[2])}),best=ws.length?Math.min.apply(null,ws):null;
  return {t:t,v:v,ok:ok,off:off,beat:ok&&(best==null||off<best),best:best}}
function myTxt(t){return (t.d==="DOWN"?"▼ ":"▲ ")+t.mag+"%"}
var closeT=LV?S.closeAt(LV.resolves,LV.ticker):null;
function leftTxt(){var l=closeT&&S.left(closeT);return l}

/* ---------- small renderers ---------- */
function formDots(m,k){var f=S.form(m,k),lab={w:"won",g:"right way",r:"wrong way",n:"no call"};
  return '<span class="form" role="img" aria-label="Last '+k+': '+f.map(function(x){return lab[x]}).join(", ")+'">'+f.map(function(x){return '<i class="'+x+'"></i>'}).join("")+'</span>'}
function sign(o){return '<header class="sign'+(o.cls?' '+o.cls:'')+'" style="--lc:'+(o.c||'var(--amber)')+'"><div class="kick">'+o.k+'</div><div class="row">'+(o.pre||'')+'<h1 tabindex="-1">'+o.t+'</h1>'+(o.post||'')+'</div>'+(o.s?'<div class="ss">'+o.s+'</div>':'')+'</header>'}
function crumbs(a){return '<div class="crumbs"><a href="#map">Network map</a>'+a.map(function(x){return '<span aria-hidden="true">/</span>'+(x[1]?'<a href="'+x[1]+'">'+x[0]+'</a>':'<span>'+x[0]+'</span>')}).join("")+'</div>'}
function xShare(text){return '<a class="btn share" target="_blank" rel="noopener" href="'+S.post(text,location.href)+'">Share on X</a>'}
function lineChip(m){return '<span class="sw" style="background:'+col(m)+'"></span>'}

/* ======================================================================
   THE MAP: every AI is a line, every round is a station.
   Upper track = right way, lower track = wrong way, middle track = calls in, not graded yet.
   ====================================================================== */
var mapState={built:false,w:0,v:false,z:1};
function rp(p,r){/* rounded polyline */
  var q=[p[0]];for(var i=1;i<p.length;i++){var a=q[q.length-1];if(Math.abs(a[0]-p[i][0])>.01||Math.abs(a[1]-p[i][1])>.01)q.push(p[i])}
  var d="M"+q[0][0].toFixed(1)+","+q[0][1].toFixed(1);
  for(var j=1;j<q.length-1;j++){var x0=q[j-1],x1=q[j],x2=q[j+1],l1=Math.hypot(x1[0]-x0[0],x1[1]-x0[1]),l2=Math.hypot(x2[0]-x1[0],x2[1]-x1[1]),rr=Math.min(r,l1/2,l2/2);
    var ax=x1[0]+(x0[0]-x1[0])/l1*rr,ay=x1[1]+(x0[1]-x1[1])/l1*rr,bx=x1[0]+(x2[0]-x1[0])/l2*rr,by=x1[1]+(x2[1]-x1[1])/l2*rr;
    d+="L"+ax.toFixed(1)+","+ay.toFixed(1)+"Q"+x1[0].toFixed(1)+","+x1[1].toFixed(1)+" "+bx.toFixed(1)+","+by.toFixed(1)}
  var e=q[q.length-1];if(q.length>1)d+="L"+e[0].toFixed(1)+","+e[1].toFixed(1);return d}
function fit(txt,max,size,min){var w=txt.length*size*.56;if(w<=max)return size;return Math.max(min,Math.floor(max/(txt.length*.56)))}

function buildMap(){
  var wrap=$("#mapwrap");if(!wrap)return;
  var W0=wrap.clientWidth;var V=W0<760;mapState.v=V;mapState.w=W0;
  wrap.className="mapwrap"+(V?" v":" h");
  var FUT=V?3:8,up=UPCOMING,list=[];
  R.forEach(function(r){list.push({k:"g",n:r.n,r:r})});
  if(LV)list.push({k:"live",n:LV.n,r:LV});
  up.slice(0,FUT).forEach(function(u){list.push({k:"f",n:u.n,r:u})});
  if(up.length>FUT)list.push({k:"end",n:up[up.length-1].n,r:up[up.length-1],brk:true});
  var SL=V?12:14,G=V?88:116,SP=V?132:172,SPF=V?92:164,BRK=V?64:110,BW=G+3*SL;
  var a=0;list.forEach(function(s,i){if(i){var pk=list[i-1].k;a+=(s.k==="f"&&pk!=="g")||s.k==="end"?SPF:SP;if(s.brk)a+=BRK;if(V&&(s.k==="live"||pk==="live"))a+=18}s.al=a});
  var total=a,Wd,Hd,P2,top,bx,padT,padL;
  if(!V){padL=200;top=150;Wd=padL+total+150;Hd=top+BW+96;P2=function(al,ac){return [padL+al,top+ac]}}
  else{bx=W0-BW-26;padT=58;Wd=W0;Hd=padT+total+112;P2=function(al,ac){return [bx+ac,padT+(total-al)]}}
  function acr(t,k){return t==="R"?k*SL:t==="W"?G+k*SL:G/2+k*SL}
  function state(s,m){if(s.k==="g"){var c=callOf(s.r,m);return c?(okc(s.r,c)?"R":"W"):null}
    if(s.k==="live")return LV.calls.some(function(c){return c.m===m})?"P":null;
    return S.first[m]!=null||LV&&LV.calls.some(function(c){return c.m===m})?"P":null}
  var liveIdx=list.map(function(s){return s.k}).indexOf("live");if(liveIdx<0)liveIdx=R.length-1;
  var o=[];
  o.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+Wd+' '+Hd+'" width="'+Wd+'" height="'+Hd+'" role="group" aria-label="Network map: '+list.length+' stations">');
  o.push('<defs><pattern id="hz" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="10" fill="#FFB51A"/><rect x="5" width="5" height="10" fill="#14161B"/></pattern></defs>');
  /* track bands: right way / wrong way, over the graded stretch */
  var g0=list[0].al-(V?40:60),g1=list[liveIdx>0?liveIdx-1:0].al+(V?28:60);
  function band(ac0,ac1,fill){var p=P2(g0,ac0),q=P2(g1,ac1),x=Math.min(p[0],q[0]),y=Math.min(p[1],q[1]);return '<rect x="'+x+'" y="'+y+'" width="'+Math.abs(q[0]-p[0])+'" height="'+Math.abs(q[1]-p[1])+'" rx="12" fill="'+fill+'"/>'}
  o.push(band(-11,3*SL+11,"rgba(19,134,74,.11)"));o.push(band(G-11,BW+11,"rgba(207,52,40,.10)"));
  if(!V){o.push('<text x="22" y="'+(top+1.5*SL+5)+'" font-size="13" font-weight="800" fill="#13864A" letter-spacing="1.5">▲▼ RIGHT WAY</text>');
    o.push('<text x="22" y="'+(top+G+1.5*SL+5)+'" font-size="13" font-weight="800" fill="#CF3428" letter-spacing="1.5">✕ WRONG WAY</text>');
    o.push('<text x="22" y="'+(top+G/2+1.5*SL+4)+'" font-size="11" font-weight="700" fill="#5A5D66" letter-spacing="1">CALLS IN</text>')}
  var vLab='';
  if(V){var lt=P2(list[R.length-1].al,0)[1]-28;
    vLab='<g aria-hidden="true"><rect x="'+(bx-12)+'" y="'+(lt-11)+'" width="'+(3*SL+24)+'" height="16" rx="4" fill="#13864A"/><text x="'+(bx+1.5*SL)+'" y="'+(lt+1)+'" font-size="10" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing=".5">RIGHT</text>'
      +'<rect x="'+(bx+G-12)+'" y="'+(lt-11)+'" width="'+(3*SL+24)+'" height="16" rx="4" fill="#CF3428"/><text x="'+(bx+G+1.5*SL)+'" y="'+(lt+1)+'" font-size="10" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing=".5">WRONG</text></g>'}
  /* stations: hit areas, boards, platforms */
  function pill(al,cls,fill,stroke,dash){var p=P2(al-10,-12),q=P2(al+10,BW+12),x=Math.min(p[0],q[0]),y=Math.min(p[1],q[1]);
    return '<rect class="'+(cls||'')+'" x="'+x+'" y="'+y+'" width="'+Math.abs(q[0]-p[0])+'" height="'+Math.abs(q[1]-p[1])+'" rx="10" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"'+(dash?' stroke-dasharray="6 5"':'')+'/>'}
  var newN={};if(since)since.graded.forEach(function(r){newN[r.n]=1});
  list.forEach(function(s){var r=s.r,al=s.al,c=P2(al,0),href=s.k==="live"?"#live":"#round-"+s.n,lab;
    if(s.k==="g"){var ws=S.winners(r);lab="Round "+r.n+", "+S.co(r)+", market "+S.outTxt(r)+", "+(ws.length?"winner "+ws.map(nm).join(" and "):"no winner")}
    else if(s.k==="live")lab="You are here. Round "+r.n+", "+S.co(r)+", the calls are in";
    else lab="Round "+r.n+", "+S.co(r)+", under construction, calls "+S.date(r.called);

  h.push('<div class="split"><div class="branch pot"><div class="kick">The pot</div><div class="pct">'+S.pot+'%</div><p style="font-size:18px;margin-top:8px">The model on top of the leaderboard takes the pot and bets it on NVIDIA\'s earnings at <b>'+S.lev+'x leverage</b> on Hyperliquid. <span style="font-size:22px">'+nvLogo()+' '+hlLogo()+'</span></p>'
    +'<p class="note" style="margin-top:6px">On top right now: <a href="#ai-'+sl(top.m)+'"><b>'+nm(top.m)+'</b></a>.</p>'
    +'<div class="outs"><div style="--oc:var(--ok)"><b>Winning trade</b>The profits buy back $EZ.</div><div style="--oc:var(--bad)"><b>Losing trade</b>The pot shrinks.</div><div style="--oc:var(--amber)"><b>Next round</b>The pot rides on the next call.</div></div></div>');
  h.push('<div class="branch ops"><div class="kick">Operations</div><div class="pct">'+S.ops+'%</div><p style="margin-top:8px">Keeps the network running, then pays for what comes next.</p><ol class="steps">'+S.steps.map(function(s){return '<li class="'+(s[2]?'now':'')+'"><i></i><b>'+esc(s[0])+'</b>'+(s[2]?'<small>Now</small>':'')+'<p class="note">'+esc(s[1])+'</p></li>'}).join("")+'</ol></div></div>');
  h.push('<div class="wipe" role="note"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 1 21h22z" fill="#fff"/><path d="M12 9v5M12 16.5v1.5" stroke="#CF3428" stroke-width="2.4" stroke-linecap="round"/></svg>The pot can be wiped out.</div>');
  h.push('<div class="sec est"><div class="sec-h"><h2>How big could it get?</h2><p>Estimated. Pick a market cap and a leverage.</p></div><div class="card"><div class="kick">Market cap</div><div class="chips" role="group" aria-label="Market cap">'+S.MCAPS.map(function(v,i){return '<button class="chip" data-mc="'+i+'">'+S.money(v)+'</button>'}).join("")+'</div>'
    +'<div class="kick">Leverage</div><div class="chips" role="group" aria-label="Leverage">'+S.LEVS.map(function(v,i){return '<button class="chip" data-lv="'+i+'">'+v+'x</button>'}).join("")+'</div><div class="est-out" id="estout" aria-live="polite"></div><p class="note" style="margin-top:10px">'+esc(S.calcFine)+'</p></div></div>');
  h.push('<p><a class="btn amber" href="#get">Get $EZ</a></p>');return h.join("")}
function estDraw(){var c=S.calc(S.MCAPS[est.mc],S.LEVS[est.lv]);$("#estout").innerHTML='<div><span class="kick" style="color:var(--bt2)">The pot</span><b>'+S.money(c.bet)+'</b></div><div><span class="kick" style="color:var(--bt2)">If the AI is right</span><b>~'+S.money(c.buyback)+'</b><span style="font-size:13px;color:var(--bt2)">of $EZ bought back</span></div><div class="w"><span class="kick" style="color:var(--bt2)">If it\'s wrong</span><b>The pot drains</b></div>';
  $$("[data-mc]").forEach(function(b){b.setAttribute("aria-pressed",String(+b.getAttribute("data-mc")===est.mc))});$$("[data-lv]").forEach(function(b){b.setAttribute("aria-pressed",String(+b.getAttribute("data-lv")===est.lv))})}
function pGet(){var h=[];h.push(crumbs([["Get $EZ"]]));
  h.push(sign({k:"Ticket office · $EZ",t:"Get $EZ",pre:'<span class="roundel big" aria-hidden="true"><b class="d">$</b><b class="e">E</b><b class="z">Z</b></span>',s:"Three steps. Nothing is on sale yet."}));
  h.push('<div class="tix sec" style="margin-top:16px"><ol class="tix-steps">'
    +'<li><b>Check the address</b>'+(CONFIG.ca?'<div class="mono-box">'+esc(CONFIG.ca)+'</div>':'<p>Not posted yet. It appears here, and only here, at launch.</p><div class="mono-box">Address: not posted yet</div>')+'</li>'
    +'<li><b>Use this page\'s link</b><p>Only through the link on this page.</p><p style="margin-top:10px">'+(CONFIG.buyUrl?'<a class="btn amber" href="'+esc(CONFIG.buyUrl)+'" target="_blank" rel="noopener">Get $EZ</a>':'<button class="btn" disabled>Opens at launch</button>')+'</p></li>'
    +'<li><b>Watch the next print</b><p>Calls the day before, the grade after the market answers.</p>'+(LV?'<p style="margin-top:8px"><a href="#live">Round '+LV.n+' · '+esc(S.co(LV))+' is live now →</a></p>':'')+'</li></ol>'
    +'<div class="ticket" style="margin-top:0"><div class="th"><span>$EZ · Zeason one</span><span>Not valid until launch</span></div><p style="font-size:22px;font-weight:900;line-height:1.15">Earnings Zeason, with a Z</p><p style="margin-top:6px">Calls filed before the print. Graded by the market. Never edited.</p>'
    +'<p style="margin-top:14px">'+(S.xUrl?'<a class="btn solid" href="'+esc(S.xUrl)+'" target="_blank" rel="noopener">Follow on X</a>':'<button class="btn" disabled>Follow on X (link at launch)</button>')+'</p><p class="note" style="margin-top:12px">Read the fine print at the bottom of every page before you ride.</p></div></div>');
  return h.join("")}

/* ---------- router ---------- */
function parse(){var h=decodeURIComponent(location.hash.replace(/^#/,"")).toLowerCase(),m;
  if(!h||h==="map")return {p:"map"};
  if(h==="live")return LV?{p:"live"}:{p:"map"};
  if((m=h.match(/^round-(\d+)$/))){var n=+m[1];if(LV&&n===LV.n)return {p:"live"};var r=R.filter(function(x){return x.n===n})[0];if(r)return {p:"round",r:r};var u=UPCOMING.filter(function(x){return x.n===n})[0];if(u)return {p:"future",r:u};return {p:"map"}}
  if((m=h.match(/^ai-(\w+)$/))&&fromSlug(m[1]))return {p:"ai",m:fromSlug(m[1])};
  if(["lines","status","coming","buyback","get","rules"].indexOf(h)>-1)return {p:h};
  return {p:"map"}}
var cur=null,mapY=0,homeDone=false;
function navKey(r){return r.p==="round"||r.p==="future"?"map":r.p==="ai"?"lines":r.p==="rules"?"status":r.p}
function route(){var r=parse(),first=!cur;
  if(cur&&cur.p==="map")mapY=scrollY;
  var isMap=r.p==="map",pm=$("#p-map"),pp=$("#p-page");
  pm.hidden=!isMap;pp.hidden=isMap;
  if(isMap){if(!homeDone){renderHome();homeDone=true}else renderSvc();
    if(!mapState.built||Math.abs($("#mapwrap").clientWidth-mapState.w)>20)buildMap();
    pm.classList.remove("place");void pm.offsetWidth;pm.classList.add("place");
    scrollTo(0,first?0:mapY)}
  else{var html=r.p==="round"?pRound(r.r):r.p==="future"?pFuture(r.r):r.p==="live"?pLive():r.p==="ai"?pAI(r.m):r.p==="lines"?pLines():r.p==="status"?pStatus():r.p==="coming"?pComing():r.p==="buyback"?pBuyback():r.p==="get"?pGet():pRules();
    pp.innerHTML=html;pp.classList.remove("place");void pp.offsetWidth;pp.classList.add("place");scrollTo(0,0);after(r)}
  var nk=navKey(r);$$("[data-p]").forEach(function(a){if(a.getAttribute("data-p")===nk)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  var tr=$("#train");tr.style.background=r.p==="ai"?col(r.m):r.p==="live"?"var(--amber)":"var(--ink)";tr.classList.remove("go");void tr.offsetWidth;if(!first)tr.classList.add("go");
  if(!first){var h1=$((isMap?"#p-map":"#p-page")+" h1");if(h1)h1.focus({preventScroll:true})}
  cur=r;watchFilms()}
function after(r){
  if(r.p==="round")roundDiag(r.r);
  if(r.p==="live"){liveDiag();ticketUI()}
  if(r.p==="ai"){hitChart($("#ai-hit"),[r.m])}
  if(r.p==="lines")linesAfter();
  if(r.p==="buyback"){$$("[data-mc]").forEach(function(b){b.addEventListener("click",function(){est.mc=+b.getAttribute("data-mc");estDraw()})});$$("[data-lv]").forEach(function(b){b.addEventListener("click",function(){est.lv=+b.getAttribute("data-lv");estDraw()})});estDraw()}}
/* films: play only when visible, one at a time, never preloaded */
var io=null;function watchFilms(){if(io)io.disconnect();var vs=$$("video");if(!vs.length||!("IntersectionObserver" in window))return;
  io=new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target;if(e.isIntersecting&&e.intersectionRatio>.6){if(RM)return;vs.forEach(function(o){if(o!==v)o.pause()});var p=v.play();if(p&&p.catch)p.catch(function(){})}else v.pause()})},{threshold:[0,.6,1]});
  vs.forEach(function(v){io.observe(v)})}
/* footer index: every place, from anywhere */
$("#ftnav").innerHTML=[["#map","Network map"],["#live","Live round"],["#coming","Timetable"],["#lines","Compare lines"]].concat(M.map(function(m){return ["#ai-"+sl(m),nm(m)+" line"]})).concat([["#status","Network status"],["#rules","How we grade"],["#buyback","Fares and buyback"],["#get","Get $EZ"]]).map(function(x){return '<a href="'+x[0]+'">'+x[1]+'</a>'}).join("");
addEventListener("hashchange",route);
var rt;addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){if(cur&&cur.p==="map"){var w=$("#mapwrap");if(w&&Math.abs(w.clientWidth-mapState.w)>20)buildMap()}else{mapState.built=false;if(cur)after(cur)}},200)});
setInterval(tickLive,30000);
try{history.scrollRestoration="manual"}catch(e){}
route();
})();
</script>
