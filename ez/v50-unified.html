<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<meta name="theme-color" content="#04070e">
<title>Earnings Zeason · 4 AIs trade earnings</title>
<meta name="description" content="Four AIs trade every earnings report. The market close keeps score.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Shantell+Sans:wght@400;600;700&display=swap">
<link rel="preload" as="image" href="media/u-hero.jpg">
<style>
/* EZ unified page (from H30 B, the chip world corrected). One world, one set of rules: tools/unified/RULES.md. Three faces: Bangers (heads), Bebas Neue (display figures, one width per digit), Shantell Sans (text). */
:root{--k:#04070e;--k2:#0c0f17;--k3:#151925;--cr:#f8f0d9;--cr2:#b5ad9c;--cr3:#7d7768;--g:#03c870;--r:#ff3a31;--au:#fdbc2a;--st:#8e939c;
  --col:358px;--gut:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--k);color:var(--cr);-webkit-text-size-adjust:100%;color-scheme:only dark}
body{background:var(--k);font:400 15px/1.45 "Shantell Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;overflow-x:clip}
a{color:inherit}
img{display:block;max-width:100%}
.hd,.h1,.h2{font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:.03em;line-height:1;color:var(--cr)}
.num{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;letter-spacing:.02em;line-height:1}
.lc{font-size:.74em}
.up{color:var(--g)}.dn{color:var(--r)}.au{color:var(--au)}
.mut{color:var(--cr2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* paintings sit on the logo black, not on pure black: lighten keeps every painted pixel and lifts the void to #04070e */
.pt{position:relative}
.pt>img.pi{width:100%;height:auto;mix-blend-mode:lighten}
.ov{position:absolute}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 var(--gut);max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.brand img{width:30px;height:30px}
.brand b{font:400 21px/1 Bangers,sans-serif;letter-spacing:.04em}
.xl{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 4px;font-size:13px;font-weight:600;text-decoration:none;color:var(--cr)}
.xl svg{width:15px;height:15px}

main{max-width:1440px;margin:0 auto}
.sec{position:relative;padding:18px var(--gut) 20px}
.sec+.sec{border-top:0}
/* the cut between chapters: a board edge with a row of vias (silver pads), the same at every joint */
.cut{height:14px;margin:0 var(--gut);background:radial-gradient(circle at 50% 50%,#9aa0a8 0 1.6px,#2b303a 2.2px,transparent 3px) center/18px 14px repeat-x;opacity:.55;
  -webkit-mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.h2{font-size:30px;margin-bottom:6px}
.sub{font-size:13.5px;line-height:1.35;color:var(--cr2);margin-bottom:12px}
.sub b{color:var(--cr);font-weight:600}

/* 1 · top */
.kick{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--cr2);margin:2px 0 10px}
.kick i{width:7px;height:7px;border-radius:50%;background:var(--cr);box-shadow:0 0 0 3px rgba(248,240,217,.12)}
.h1{font-size:38px;line-height:.98;margin-bottom:12px}
.h1>span{display:block}
.film{margin:0 -6px}
.film .win{overflow:hidden;background:#000}
.film .win img,.film .win video{width:100%;height:100%;object-fit:cover;display:block}
.film .win video{object-fit:contain;background:#000}
.play{position:absolute;inset:0;display:grid;place-items:center;border:0;background:transparent;cursor:pointer;color:var(--k)}
.play i{width:76px;height:76px;border-radius:50%;background:var(--cr);display:grid;place-items:center;box-shadow:0 0 0 5px rgba(4,7,14,.55),0 8px 26px rgba(0,0,0,.6)}
.play i::after{content:"";margin-left:7px;border-left:24px solid var(--k);border-top:15px solid transparent;border-bottom:15px solid transparent}
.film .lab{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--cr);font-size:19px;letter-spacing:.08em;text-shadow:0 1px 0 rgba(255,255,255,.08),0 -1px 0 rgba(0,0,0,.8)}
.film .lab em{font-style:normal;color:var(--cr2)}
.cast{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 10px}
.cast li{list-style:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;font-weight:600}
.mk{display:inline-block;width:30px;height:30px;color:var(--cr)}
.mk svg{width:100%;height:100%;display:block}
.fresh{font-size:13px;line-height:1.45;color:var(--cr2)}
.fresh b{color:var(--cr);font-weight:600}

/* 2 · how a round works: the loop board, four dies, data inside the glass */
.loop .die{display:flex;flex-direction:column;justify-content:center;padding:12% 6% 2%;font-size:12px;line-height:1.25;overflow:hidden}
.tab{position:absolute;transform:translate(-14%,-62%);z-index:2;background:var(--k);border:1.5px solid var(--cr);padding:3px 7px 2px;font:400 15px/1 Bangers,sans-serif;letter-spacing:.05em;white-space:nowrap}
.tab b{font-family:"Bebas Neue",sans-serif;font-weight:400;margin-right:4px;font-size:16px}
.rw{display:flex;align-items:center;gap:6px;white-space:nowrap}
.rw+.rw{margin-top:3px}
.rw .mk{width:15px;height:15px;flex:none}
.rw .v{margin-left:auto;font-weight:700}
.big{font-family:"Bebas Neue",sans-serif;font-size:38px;line-height:.9;letter-spacing:.01em}
.die .co{font-size:12px;font-weight:600}
.die .dt{font-size:11px;color:var(--cr2)}
.wl{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:3px;font:400 15px/1 "Bebas Neue",sans-serif;border:1.5px solid currentColor}
.narr{font-size:14px;line-height:1.42;margin-top:10px}
.narr b{font-weight:700}
.steps{display:none;list-style:none}

/* 3 · who's winning: #1 on the gold chip, then the field on silver */
.w1 .die{overflow:hidden;background:#000}
.w1 .die img,.w1 .die video,.wr .die img{width:100%;height:100%;object-fit:cover;display:block}
.w1 .txt{display:flex;flex-direction:column;justify-content:center;gap:2px}
.rk{font-family:"Bebas Neue",sans-serif;line-height:.9}
.w1 .rk{font-size:22px;color:var(--au)}
.w1 .nm{font:400 30px/1 Bangers,sans-serif;letter-spacing:.04em}
.w1 .ver{font-size:11.5px;color:var(--cr2);display:flex;align-items:center;gap:5px}
.w1 .pl{font-family:"Bebas Neue",sans-serif;font-size:40px;line-height:.95;margin-top:4px}
.w1 .mt{font-size:12px;color:var(--cr2)}
.w1 .mt b{font-weight:700}
.ticket{font-size:13px;line-height:1.35;margin:4px 0 6px;color:var(--cr2)}
.ticket b{color:var(--cr);font-weight:700}
.wr{width:90%;margin:0 auto}
.wr .die{overflow:hidden;background:#000;filter:grayscale(.25) brightness(.92)}
.wr .txt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:10px}
.wr .rk{font-size:24px;color:var(--cr2);width:26px}
.wr .nm{font:400 20px/1 Bangers,sans-serif;letter-spacing:.04em}
.wr .ver{display:block;font:400 10.5px/1.2 "Shantell Sans",sans-serif;color:var(--cr2);letter-spacing:0}
.wr .pl{font-family:"Bebas Neue",sans-serif;font-size:27px;line-height:.9;text-align:right}
.wr .pl small{display:block;font:600 11px/1.3 "Shantell Sans",sans-serif;color:var(--cr2);letter-spacing:0}
.fl{display:inline-block;width:15px;height:10px;border-radius:1px;overflow:hidden;flex:none}

/* 4 · every round so far: the latest die lifted off the season's wafer */
.lift{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:stretch;margin-bottom:10px}
.lift .shot{position:relative;aspect-ratio:1;border:2px solid #9aa0a8;border-radius:3px;background:#000;overflow:hidden;box-shadow:0 0 0 1px #000,0 10px 24px rgba(0,0,0,.6)}
.lift .shot img,.lift .shot video{width:100%;height:100%;object-fit:cover;display:block}
.lift .shot .cl{position:absolute;inset:14%;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;background:var(--cr)}
.lift .meta{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.lift .rn{font-size:11.5px;color:var(--cr2)}
.lift .co{font-size:15px;font-weight:700;line-height:1.2}
.lift .mv{font-family:"Bebas Neue",sans-serif;font-size:32px;line-height:.92}
.lift .cls{font-size:12px;color:var(--cr2)}
.lift .cls b{color:var(--cr)}
.lift .tr{display:flex;gap:9px;margin-top:3px;font-size:12px}
.lift .tr span{display:flex;align-items:center;gap:3px}
.lift .tr .mk{width:14px;height:14px}
.rcpt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--cr);min-height:32px;border-bottom:1px solid rgba(248,240,217,.3)}
.wafer{max-width:318px;margin:0 auto}
.wafer .pi{filter:brightness(.62) contrast(1.05)}
.dies{position:absolute;inset:0}
.dz{position:absolute;border:1px solid rgba(220,224,230,.22);background:rgba(4,7,14,.42);cursor:pointer;padding:0}
.dz i{position:absolute;inset:16%;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;background:var(--cr);opacity:.9}
.dz.tbd{border-style:dashed;border-color:rgba(220,224,230,.2);background:transparent;cursor:default}
.dz.tbd i{opacity:.22}
.dz.on{border:2px solid var(--cr);z-index:2;box-shadow:0 0 0 2px var(--k)}
.dz.nv{border:2px solid var(--au)}
.dz.nv i{background:var(--au);opacity:.9}
.wkey{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--cr2);margin-top:6px}
.wkey span{display:inline-flex;align-items:center;gap:6px}
.wkey u{display:inline-block;width:12px;height:12px;border:1px solid rgba(220,224,230,.5);background:rgba(4,7,14,.4)}
.wkey u.t{border-style:dashed;background:transparent}
.wkey u.n{border:2px solid var(--au)}

/* 5 · smart or lucky: the scope */
.scope{position:relative;border-radius:10px;padding:10px 8px 6px;background:linear-gradient(#0a0d14,#06080d);
  box-shadow:inset 0 0 0 1px #2c313b,inset 0 0 0 3px #0b0e14,inset 0 0 0 4px #5e646e,0 0 0 1px #000,0 12px 30px rgba(0,0,0,.55)}
.scope svg{display:block;width:100%;height:auto}
.scope text{font-family:"Shantell Sans",sans-serif;font-variant-numeric:tabular-nums}
.sl{margin-top:10px;display:grid;grid-template-columns:1fr auto auto;row-gap:5px;column-gap:14px;font-size:13.5px;align-items:center}
.sl .hdr{font-size:11px;color:var(--cr2)}
.sl .n{display:flex;align-items:center;gap:7px;font-weight:600}
.sl .n .mk{width:16px;height:16px}
.sl .f{text-align:right;font-weight:700}
.sl .z{font-size:12px;color:var(--cr2);text-align:right}

/* 6 · the bet */
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bh .h2{color:var(--au)}
.bh .at{font-size:13px;color:var(--cr2)}
.cd{display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd .num{font-size:var(--cdz,40px);color:var(--cr);letter-spacing:0}
.cd small{font-size:10.5px;color:var(--cr2);margin-top:2px}
.dg{display:inline-block;width:.56em;text-align:center}
.plate{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--cr2);font-size:13px;line-height:1.35}
.plate b{color:var(--cr);font-weight:600}
.outs{display:grid;gap:6px;margin-top:10px}
.outs p{display:flex;gap:9px;align-items:baseline;font-size:14px}
.outs p b{flex:none;font-weight:700}
.first{margin-top:10px;font-size:14px;font-weight:600}

/* 7 · follow */
.nx .txt{display:flex;flex-direction:column;justify-content:center;gap:5px}
.nx .when{font-size:12px;color:var(--cr2)}
.nx .when b{font:400 22px/1 "Bebas Neue",sans-serif;color:var(--cr);letter-spacing:.03em;display:block}
.nx .cos{display:flex;gap:8px;align-items:center}
.nx .cos i{display:block;width:26px;height:26px;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;background:var(--cr)}
.nx .die{display:grid;place-items:center;background:#000}
.nx .die svg{width:46%;height:46%;color:var(--cr)}
.names{font-size:13.5px;margin:8px 0 12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:8px;background:var(--cr);color:var(--k);font:700 16px/1 "Shantell Sans",sans-serif;text-decoration:none}
.btn svg{width:18px;height:18px}
.ca{margin-top:14px;padding:12px 14px;border:1px dashed rgba(248,240,217,.35);border-radius:8px;font-size:13px;line-height:1.45;color:var(--cr2)}
.ca b{color:var(--cr);font-weight:700}
.foot{display:flex;align-items:center;gap:10px;padding:18px var(--gut) 26px;font-size:11.5px;color:var(--cr3);max-width:1440px;margin:0 auto}
.foot img{width:26px;height:26px;flex:none}

/* small phones */
@media (max-width:359px){
  :root{--gut:16px}
  .h1{font-size:31px}.h2{font-size:26px}
  .lift{grid-template-columns:108px 1fr;gap:10px}
  .lift .mv{font-size:30px}
  .w1 .nm{font-size:24px}.w1 .pl{font-size:32px}
  .wr .pl{font-size:22px}.wr .nm{font-size:17px}
  .loop .die{font-size:10.5px;padding:12% 5% 2%}.rw .mk{width:11px;height:11px}.rw+.rw{margin-top:2px}.wl{width:14px;height:14px;font-size:12px}.big{font-size:27px}.tab{font-size:12px;padding:2px 5px 1px}.tab b{font-size:13px}.die .dt{font-size:9.5px}.die .co{font-size:10.5px}
  .sl{font-size:12.5px;column-gap:10px}
  .off{display:none}
  .loop .die .dt{display:none}
}

/* desktop: its own composition, two columns a chapter, one screen each */
@media (min-width:1100px){
  :root{--gut:48px}
  main,.top,.foot{max-width:1280px}
  .bh{justify-content:flex-start;gap:22px}
  #round .narr{display:none}
  #round .steps{display:grid;gap:16px;grid-column:2;font-size:21px;line-height:1.35;margin-top:10px}
  #round .steps b:first-child{font-family:Bangers,sans-serif;font-weight:400;letter-spacing:.04em;font-size:24px;margin-right:4px}
  .top{height:68px}.brand img{width:36px;height:36px}.brand b{font-size:25px}
  .sec{padding:56px var(--gut) 60px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:64px;align-items:center}
  .cut{margin:0 var(--gut)}
  .h2{font-size:54px;margin-bottom:12px}
  .sub{font-size:19px;margin-bottom:18px}
  .narr{font-size:20px;margin-top:18px}
  /* top: headline, cast and freshness left; the film chip big on the right */
  #top{grid-template-columns:minmax(0,5fr) minmax(0,7fr);padding-top:36px}
  #top .h1{font-size:56px;margin-bottom:22px}
  #top .kick{font-size:15px}
  #top .cast{max-width:420px;justify-content:start;margin:22px 0}
  #top .cast li{font-size:15px}#top .mk{width:40px;height:40px}
  #top .fresh{font-size:16px}
  #top .film{grid-column:2;grid-row:1/span 5;margin:0}
  .play i{width:104px;height:104px}.play i::after{border-left-width:32px;border-top-width:20px;border-bottom-width:20px;margin-left:9px}
  .film .lab{font-size:28px}
  /* round: board left, the words right */
  #round .pt{grid-column:1;grid-row:1/span 4;max-width:600px}
  #round .h2,#round .sub,#round .narr{grid-column:2}
  #round{align-content:center}
  .loop .die{font-size:16px}.rw .mk{width:20px;height:20px}.big{font-size:60px}.tab{font-size:20px}.tab b{font-size:21px}.wl{width:24px;height:24px;font-size:19px}.die .co{font-size:16px}.die .dt{font-size:14px}
  /* winning: #1 left, the field right */
  #win{align-items:start}
  #win .h2,#win .sub{grid-column:1/-1}
  #win .w1{grid-column:1}
  #win .ticket{grid-column:1;font-size:16px}
  #win .wrs{grid-column:2;grid-row:3/span 2}
  .w1 .rk{font-size:34px}.w1 .nm{font-size:50px}.w1 .ver{font-size:15px}.w1 .pl{font-size:66px}.w1 .mt{font-size:16px}
  .wr .rk{font-size:34px;width:36px}.wr .nm{font-size:30px}.wr .ver{font-size:13px}.wr .pl{font-size:40px}.wr .pl small{font-size:13px}
  /* rounds: the wafer left, the lifted die right */
  #rounds .wf{grid-column:1;grid-row:1/span 4}
  #rounds .h2,#rounds .sub,#rounds .lift,#rounds .rcpt{grid-column:2}
  .wafer{max-width:620px}
  .lift{grid-template-columns:260px 1fr;gap:24px}
  .lift .co{font-size:22px}.lift .mv{font-size:64px}.lift .cls,.lift .tr{font-size:15px}.lift .rn{font-size:14px}.lift .tr .mk{width:18px;height:18px}
  .wkey{font-size:14px}
  /* smart or lucky: the scope wide, the rows right */
  #luck{grid-template-columns:minmax(0,7fr) minmax(0,4fr)}
  #luck .h2,#luck .sub{grid-column:1/-1}
  #luck .scope{grid-column:1}
  #luck .side{grid-column:2}
  .sl{font-size:19px;row-gap:14px}.sl .hdr{font-size:13px}.sl .n .mk{width:22px;height:22px}
  /* bet: chip left, the words right */
  #bet .pt{grid-column:1;grid-row:1/span 5}
  #bet .bh,#bet .narr,#bet .outs,#bet .first{grid-column:2}
  #bet .narr{font-size:22px}
  .cd small{font-size:14px}
  .outs p,.first{font-size:18px}
  .plate{font-size:16px}
  /* follow: one card centred */
  #follow{grid-template-columns:minmax(0,1fr);max-width:760px;margin:0 auto;text-align:left}
  .nx .when{font-size:15px}.nx .when b{font-size:34px}.nx .cos i{width:30px;height:30px}
  .names{font-size:17px}
}
/* a logo the printer could not cut: the ticker, set in the figures' face */
[data-t]:not([style*='--m']){-webkit-mask:none!important;mask:none!important;background:none!important}
.tx{display:grid!important;place-items:center;font:400 clamp(7px,2.4vw,13px)/1 'Bebas Neue',sans-serif;color:var(--cr);letter-spacing:.02em;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Shantell Sans as Google serves it draws its 1 and 5 narrow even with tnum asked for (measured: 16.7 and 24.5 against 28 at 40px),
   so every figure that sits in a column is set in Bebas Neue, whose ten digits are one width (measured: 16.0 each at 40px) */
.rw .v,.sl .f{font-family:"Bebas Neue",sans-serif;font-weight:400!important;letter-spacing:.03em;font-size:1.22em}
.rw .v.mut{font-size:1.15em}

/* unified: a film is still until it is tapped (the page's one unasked mover is the bet's countdown) */
.play.sm i{width:44px;height:44px;box-shadow:0 0 0 3px rgba(4,7,14,.55),0 4px 14px rgba(0,0,0,.6)}
.play.sm i::after{margin-left:4px;border-left-width:14px;border-top-width:9px;border-bottom-width:9px}
.lift .shot video{object-fit:contain}
.cp{margin-left:8px;min-height:32px;padding:0 12px;border:1px solid var(--cr);border-radius:6px;background:transparent;color:var(--cr);font:600 12.5px/1 "Shantell Sans",sans-serif;cursor:pointer}
.ca code{font:400 15px/1.3 "Bebas Neue",sans-serif;letter-spacing:.04em;color:var(--cr);word-break:break-all}
/* THE ONE BREAK: the bet. Everything else sits in the same dim, even key light; this chip alone is lit from below, warm,
   and its countdown is the only thing on the page that moves without being asked. Nothing else may glow. */
#bet .pt{isolation:isolate}
#bet .pt::before{content:"";position:absolute;inset:-6% -8% -10%;z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side at 50% 58%,rgba(253,188,42,.34),rgba(253,188,42,.10) 55%,transparent 80%)}
.lg{display:block;width:30px;height:30px;flex:none}.lg svg{width:100%;height:100%;display:block}
.foot .lg{width:26px;height:26px}
@media (min-width:1100px){.top .lg{width:36px;height:36px}}
main{overflow-x:clip}html{overflow-x:clip}
/* desktop handover: every section reads the same way, the picture on the left and the words on the right (the top too) */
@media (min-width:1100px){
  #top{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
  #top .film{grid-column:1}
  #top .kick,#top .h1,#top .cast,#top .fresh{grid-column:2}

    <div class="ov txt" ${box(G.gold.txt)}><span class="rk">#1</span><span class="nm">${NM[lead]}</span>
      <span class="ver">${esc(MODELS[lead].ver)} ${flag(lead)}</span>
      <span class="pl ${cls(t1.p)}">${usd(t1.p)}</span><span class="mt"><b class="up">${t1.W} W</b> · <b class="dn">${t1.L} L</b></span></div></div>
  <p class="ticket">#1 holds the golden ticket: its prediction calls <b>Bet #1</b>.</p>
  <div class="wrs">${rest.map((m,i)=>{const t=A[m];return `<div class="pt wr"><img class="pi" src="${M}u-row.jpg" alt="" width="1400" height="429">
    <div class="ov die" ${box(G.row.die)}><img src="${M}${FOUND[m]}.jpg" alt=""></div>
    <div class="ov txt" ${box(G.row.txt)}><span class="rk">#${i+2}</span><span class="nm">${NM[m]}<span class="ver">${esc(MODELS[m].ver)} ${flag(m)}</span></span>
      <span class="pl ${cls(t.p)}">${usd(t.p)}<small><span class="up">${t.W} W</span> · <span class="dn">${t.L} L</span></small></span></div></div>`}).join('')}</div>`;
})();

/* =========== 4 · every round so far: the season is a wafer; every graded round is a die; the newest is lifted out =========== */
(function(){const s=$('#rounds');
  const all=[...R.map(r=>({n:r.n,t:r.ticker,co:r.co,g:r})),...todo.map(u=>({n:u.n,t:u.ticker,co:u.co,g:null}))].sort((a,b)=>a.n-b.n);
  s.innerHTML=`<h2 class="h2" id="h-rounds">Every round so far</h2>
  <p class="sub"><b>${R.length} graded</b>, ${trades} trades. Each one posted on X before the report.</p>
  <div class="lift" id="lift"></div>
  <div class="wf"><div class="pt wafer"><img class="pi" src="${M}u-wafer.jpg" alt="" width="1390" height="1400"><div class="dies" role="list" aria-label="Season 1, every round"></div></div>
  <p class="wkey"><span><u></u>Graded</span><span><u class="t"></u>To come (${todo.length})</span>${todo.some(u=>u.ticker==='NVDA')?'<span><u class="n"></u>Bet #1</span>':''}</p></div>`;
  /* sites: a square grid clipped to the disc (and above the flat), raster order, pitch shrunk until every round has a site */
  const W=G.wafer,pts=[];let pitch=.2;
  const fit=p=>{const o=[];const n=Math.floor(2*W.r/p);for(let j=0;j<n;j++)for(let i=0;i<n;i++){const x=W.cx-W.r+(i+.5)*p+(2*W.r-n*p)/2,y=W.cy-W.r+(j+.5)*p+(2*W.r-n*p)/2;
    const cs=[[x-p/2,y-p/2],[x+p/2,y-p/2],[x-p/2,y+p/2],[x+p/2,y+p/2]];if(cs.every(c=>Math.hypot(c[0]-W.cx,(c[1]-W.cy))<=W.r*.93&&c[1]<=W.cy+W.r*W.flat*.93))o.push([x,y])}return o};
  while((pts.length=0,pts.push(...fit(pitch)),pts.length<all.length)&&pitch>.02)pitch*=.97;
  /* centre the used sites vertically: drop unused sites evenly from the end rows (they stay bare wafer) */
  const dz=$('.dies',s);
  dz.innerHTML=all.map((x,i)=>{const p=pts[i],g=pitch*.9;const st=`left:${((p[0]-g/2)*100).toFixed(3)}%;top:${((p[1]-g/2)*100).toFixed(3)}%;width:${(g*100).toFixed(3)}%;height:${(g*100).toFixed(3)}%`;
    return x.g?`<button class="dz" role="listitem" data-n="${x.n}" style="${st}" aria-label="Round ${x.n}, ${esc(x.co)}, ${x.g.out}"><i data-t="${x.t}"></i></button>`
      :`<span class="dz tbd${x.t==='NVDA'?' nv':''}" role="listitem" style="${st}" aria-label="Round ${x.n}, ${esc(x.co)}, to come"><i data-t="${x.t}"></i></span>`}).join('');
  paintMasks(dz);
  const lift=$('#lift',s);
  function show(r,auto){const f=r.film,ms=['GPT','CLAUDE','GROK','KIMI'].filter(m=>callOf(r,m));
    const win=r.win?r.win.split(' & ').map(m=>NM[m]).join(' & '):'Nobody';
    const best=r.win?Math.min(...r.calls.filter(c=>r.win.split(' & ').includes(c[0])).map(c=>+c[2])):null;
    lift.innerHTML=`<div class="shot">${f?`<img src="${M}${r.poster}.jpg" alt=""><button class="play sm" type="button" aria-label="Play round ${r.n}'s film"><i></i></button>`:`<span class="cl" data-t="${r.ticker}"></span>`}</div>
    <div class="meta"><span class="rn">Round ${r.n} · ${dlab(r.resolves)} close</span><span class="co">${esc(r.co)} (${esc(r.ticker)})</span>
      <span class="mv ${cls(r.a)}">${arrow(r.a)} ${pct(r.a)}</span>
      <span class="cls">Closest: <b>${win}</b>${best!=null?`, ${best.toFixed(2)}% off`:''}</span>
      <span class="tr">${ms.map(m=>{const w=dirOf(callOf(r,m))*r.a>0;return `<span>${mark(m)}<b class="${w?'up':'dn'}">${w?'W':'L'}</b></span>`}).join('')}</span></div>`;
    paintMasks(lift);$$('.dz.on',dz).forEach(e=>e.classList.remove('on'));const d=$(`.dz[data-n="${r.n}"]`,dz);d&&d.classList.add('on');
    const pb=$('.play',lift);if(pb)pb.addEventListener('click',()=>{const v=document.createElement('video');v.setAttribute('playsinline','');v.controls=true;v.preload='auto';v.poster=M+r.poster+'.jpg';
      v.innerHTML=`<source src="${M}${f}.webm" type="video/webm"><source src="${M}${f}.mp4" type="video/mp4">`;const sh=$('.shot',lift);sh.innerHTML='';sh.appendChild(v);v.play().catch(()=>{});T('film',{a:'round',n:r.n},'rf-'+r.n)});}
  /* a shared round link (#/round/<n>, and /r/<n> pages that send people on to it) lifts that round and brings the wafer into view */
  const hr=()=>{const m=location.hash.match(/^#\/round\/(\d+)/),r=m&&R.find(x=>x.n===+m[1]);if(r){show(r);const go=()=>s.scrollIntoView({block:'start'});requestAnimationFrame(go);addEventListener('load',go,{once:true});return true}};
  if(!hr())show(latest);addEventListener('hashchange',hr);
  dz.addEventListener('click',e=>{const b=e.target.closest('.dz[data-n]');if(!b)return;show(R.find(r=>r.n===+b.dataset.n));T('record',{a:'die'},'rec-die')});
  const rc=document.createElement('a');rc.className='rcpt';rc.href=(window.RECEIPTS&&RECEIPTS[latest.n])||CONFIG.x;rc.rel='noopener';
  rc.innerHTML='Check the posts on @earningszn <span aria-hidden="true">↗</span>';s.appendChild(rc);
  /* desktop: the receipt link sits under the lifted die, not after the wafer */
  s.insertBefore(rc,$('.wf',s));
})();

/* =========== 5 · smart or lucky: the hit rate round by round, against the coin's zone =========== */
(function(){const s=$('#luck');
  const n=R.length,X0=8,X1=250,Y0=10,Y1=196,lo=.3,hi=.8,x=i=>X0+(X1-X0)*i/(n-1),y=v=>Y1-(Y1-Y0)*(Math.min(hi,Math.max(lo,v))-lo)/(hi-lo);
  /* the coin's zone: 95% of fair coins land inside after k trades (50% ± 1.96·√(.25/k)) */
  const band=[];for(let i=0;i<n;i++){const k=i+1,h=1.96*Math.sqrt(.25/k);band.push([x(i),y(.5+h),y(.5-h)])}
  const bandD='M'+band.map(b=>b[0].toFixed(1)+','+b[1].toFixed(1)).join('L')+'L'+band.slice().reverse().map(b=>b[0].toFixed(1)+','+b[2].toFixed(1)).join('L')+'Z';
  const DASH={GPT:'',CLAUDE:'5 3',GROK:'',KIMI:'1.5 2.5'};
  const ms=['GPT','CLAUDE','GROK','KIMI'].sort((a,b)=>(a===lead)-(b===lead));
  const raw=m=>A[m].W/A[m].n,zoneHi=m=>.5+1.96*Math.sqrt(.25/A[m].n);
  const out=ms.filter(m=>raw(m)>zoneHi(m));
  /* line ends: labels pushed apart where they would touch */
  const ends=ms.map(m=>{const t=A[m],l=t.ser[t.ser.length-1];return {m,x:x(l[0]),y:y(l[1]),ly:y(l[1])}}).sort((a,b)=>a.y-b.y);
  for(let k=1;k<ends.length;k++)if(ends[k].ly-ends[k-1].ly<13)ends[k].ly=ends[k-1].ly+13;
  const svg=`<svg viewBox="0 0 340 214" role="img" aria-label="Hit rate after every round for each AI, against the zone where a coin flip lands">
    ${[.3,.4,.5,.6,.7,.8].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" stroke="#f8f0d9" stroke-opacity="${v===.5?.35:.08}" ${v===.5?'stroke-dasharray="3 3"':''}/><text x="${X0}" y="${y(v)-3}" font-size="8.5" fill="#7d7768">${Math.round(v*100)}%</text>`).join('')}
    <path d="${bandD}" fill="#f8f0d9" fill-opacity=".09"/>
    <text x="${x(Math.round(n*.62))}" y="${y(.5)+4}" font-size="10" fill="#b5ad9c" text-anchor="middle">coin-flip zone</text>
    ${ms.map(m=>{const t=A[m],d='M'+t.ser.slice(4).map(p=>x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join('L');const g=m===lead;
      return `<path d="${d}" fill="none" stroke="${g?'#fdbc2a':'#f8f0d9'}" stroke-opacity="${g?1:.72}" stroke-width="${g?2.2:1.4}" stroke-dasharray="${DASH[m]}" stroke-linejoin="round"/>`}).join('')}
    ${ends.map(e=>`<circle cx="${e.x}" cy="${e.y}" r="2.4" fill="${e.m===lead?'#fdbc2a':'#f8f0d9'}"/><text x="${X1+8}" y="${e.ly+3.5}" font-size="10.5" font-weight="600" fill="${e.m===lead?'#fdbc2a':'#f8f0d9'}">${NM[e.m]} ${(raw(e.m)*100).toFixed(1)}%</text>`).join('')}
    <text x="${X0}" y="210" font-size="8.5" fill="#7d7768">Round 1</text><text x="${X1}" y="210" font-size="8.5" fill="#7d7768" text-anchor="end">Round ${R[n-1].n}</text>
  </svg>`;
  const verdict=out.length===0?`None of the four is out of the coin-flip zone yet.`
    :out.length===1?`Only <b>${NM[out[0]]}</b> is out of the coin-flip zone${(raw(out[0])-zoneHi(out[0]))<.02?', by a hair':''}. ${A[out[0]].n} trades is still early.`
    :`${out.map(m=>'<b>'+NM[m]+'</b>').join(' and ')} are out of the coin-flip zone.`;
  s.innerHTML=`<h2 class="h2" id="h-luck">Smart or lucky?</h2>
  <p class="sub">How often each AI got the direction right. Inside the band, a coin could have done it.</p>
  <div class="scope">${svg}</div>
  <div class="side"><div class="sl" role="table" aria-label="Hit rate">
    <span class="hdr" role="columnheader">AI</span><span class="hdr" role="columnheader" style="text-align:right">W-L</span><span class="hdr" role="columnheader" style="text-align:right">Hit rate</span>
    ${order.map(m=>`<span class="n" role="cell">${mark(m)}${NM[m]}</span><span class="f" role="cell" style="font-weight:400">${A[m].W}-${A[m].L}</span><span class="f${m===lead?' au':''}" role="cell">${(raw(m)*100).toFixed(1)}%</span>`).join('')}
  </div>
  <p class="narr">${verdict}</p></div>`;
})();

/* =========== 6 · the bet: the gold chip counts down in its four dies =========== */
(function(){const s=$('#bet');const share=SIM.poolShare!=null?Math.round(SIM.poolShare*100):null;
  const at=BET?new Date(BET).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'America/New_York'}):'';
  const live=CONFIG.launched&&CONFIG.pool;
  s.innerHTML=`<div class="bh"><h2 class="h2" id="h-bet">Bet #1: NVIDIA</h2><span class="at">At the close · ${at}</span></div>
  <div class="pt"><img class="pi" src="${M}u-bet.jpg" alt="" width="1400" height="1236">
    ${['days','hrs','min','sec'].map((l,i)=>`<div class="ov cd" ${box(G.bet.dies[i])}><span class="num" data-k="${i}">00</span><small>${l}</small></div>`).join('')}
    <div class="ov plate" ${box(G.bet.plate)}><span>The pool: <b>${live?esc(CONFIG.pool):'not live yet'}</b></span></div></div>
  <p class="narr">${share}% of $EZ creator fees fill the pool. We bet the whole pool on NVIDIA, based on the #1 AI's prediction.</p>
  <div class="outs"><p><b class="up">▲ Right:</b>profits buy back $EZ.</p><p><b class="dn">▼ Wrong:</b>the pool can be wiped out.</p></div>
  <p class="first">NVIDIA is the first bet, not the last.</p>`;
  const els=$$('.cd .num',s),dg=v=>String(v).padStart(2,'0').split('').map(c=>`<span class="dg">${c}</span>`).join('');
  const fit=()=>{const w=$('.cd',s).getBoundingClientRect().width;s.style.setProperty('--cdz',(w*.5).toFixed(1)+'px')};fit();addEventListener('resize',fit);
  function tick(){if(!BET)return;const t=Math.max(0,Math.floor((BET-Date.now())/1e3)),v=[Math.floor(t/86400),Math.floor(t%86400/3600),Math.floor(t%3600/60),t%60];
    els.forEach((e,i)=>{const h=dg(v[i]);if(e.innerHTML!==h)e.innerHTML=h})}
  tick();if(!RM)setInterval(tick,1000);else setInterval(tick,60000);
})();

/* =========== 7 · follow: a dated reason (the next close), the CA slot, the one button =========== */
(function(){const s=$('#follow');const cos=nextCos.slice(0,6);
  s.innerHTML=`<h2 class="h2" id="h-follow">Follow for the next round</h2>
  <div class="pt nx"><img class="pi" src="${M}u-row.jpg" alt="" width="1400" height="429">
    <div class="ov die" ${box(G.row.die)}><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.9 2H22l-6.8 7.8L23 22h-6.2l-4.8-6.3L6.4 22H3.3l7.3-8.3L1 2h6.3l4.4 5.8L18.9 2Zm-1.1 18h1.7L6.3 3.9H4.5L17.8 20Z"/></svg></div>
    <div class="ov txt" ${box(G.row.txt)}><span class="when">Next close<b>${nextLab||'Date to come'}</b></span><span class="cos">${cos.map(u=>`<i data-t="${u.ticker}" title="${esc(u.co)}"></i>`).join('')}</span></div></div>
  <p class="names">${cos.map(u=>esc(u.co)).join(', ')}. The trades go up on X before each report.</p>
  <a class="btn" href="${CONFIG.x}" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.9 2H22l-6.8 7.8L23 22h-6.2l-4.8-6.3L6.4 22H3.3l7.3-8.3L1 2h6.3l4.4 5.8L18.9 2Zm-1.1 18h1.7L6.3 3.9H4.5L17.8 20Z"/></svg>Follow @earningszn on X</a>
  <div class="ca">${CONFIG.launched&&CONFIG.ca?`<b>$EZ contract address</b><br><code>${esc(CONFIG.ca)}</code><button class="cp" type="button">Copy</button><br>Any other address is fake.`:`<b>$EZ: not live yet.</b> The contract address goes up here and on @earningszn at launch. Any other address is fake. No presale, no airdrop.`}</div>`;
  paintMasks(s);
  const cp=$('.cp',s);if(cp)cp.addEventListener('click',()=>{navigator.clipboard&&navigator.clipboard.writeText(CONFIG.ca).then(()=>{cp.textContent='Copied'},()=>{})});
  $$('a[href*="x.com"]').forEach(a=>a.addEventListener('click',()=>T('x',{w:a.id||a.className||'link'})));
  $('#foot').textContent='An experiment. Simulated P&L, before fees. Not financial advice.';
})();
(function(){const h=location.hash,go=/^#\/(upcoming|rounds)/.test(h)?'#follow':/^#\/(buyback|bet)/.test(h)?'#bet':/^#\/(leaderboard|models?|results)/.test(h)?'#win':null;
  if(go){const f=()=>{const e=$(go);e&&e.scrollIntoView({block:'start'})};requestAnimationFrame(f);addEventListener('load',f,{once:true})}})();
window.__b={A,order,lead,ex:ex.n,latest:latest.n,nextLab,BET,trades};
})();

</script>
