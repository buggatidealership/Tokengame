<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EZ alerts test</title>
<link rel="manifest" href="/api/try.webmanifest">
<link rel="apple-touch-icon" href="/media/icon-180.png">
<style>
  :root { color-scheme: dark; --bg: #04070e; --fg: #f8f0d9; --mute: #b5ad9c; --line: #2a2d36; --accent: #fdbc2a }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, sans-serif }
  main { max-width: 460px; margin: 0 auto; padding: 24px 16px }
  h1 { font-size: 20px; margin: 0 0 4px } p { color: var(--mute); margin: 0 0 16px }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line) }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #11141c; color: var(--fg) }
  button.on { border-color: var(--accent); color: var(--accent) }
  #msg { min-height: 24px; color: var(--accent); margin-top: 16px }
</style>
</head>
<body>
<main>
  <h1>EZ alerts test</h1>
  <p>A bare test page for the follow flow, not the product UI. On iPhone: Share, Add to Home Screen, then open it from the Home Screen.</p>
  <div id="list"></div>
  <div id="msg"></div>
</main>
<script src="/api/client.js"></script>
<script>
  const AIS = [['gpt', 'GPT'], ['claude', 'Claude'], ['grok', 'Grok'], ['gemini', 'Gemini'], ['qwen', 'Qwen'], ['all', 'All five']];
  const msg = t => { document.getElementById('msg').textContent = t };
  async function draw() {
    const st = EZAlerts.status(), on = st === 'ok' ? await EZAlerts.following() : [];
    if (st === 'install') msg('Add this page to your Home Screen first, then open it from there.');
    if (st === 'denied') msg('Notifications are blocked for this site in your settings.');
    if (st === 'unsupported') msg('This browser cannot receive web push.');
    document.getElementById('list').innerHTML = AIS.map(([k, n]) => `<div class="row"><span>${n}</span><button data-ai="${k}" class="${on.includes(k) ? 'on' : ''}">${on.includes(k) ? 'Following' : 'Follow'}</button></div>`).join('');
  }
  document.addEventListener('click', async e => {
    const b = e.target.closest('button[data-ai]'); if (!b) return;
    const ai = b.dataset.ai, r = b.classList.contains('on') ? await EZAlerts.unfollow(ai) : await EZAlerts.follow(ai);
    msg(r.ok ? (r.ais.length ? 'Following: ' + r.ais.join(', ') : 'Not following anyone') : 'Could not: ' + (r.error || r.status));
    draw();
  });
  draw();
</script>
</body>
</html>
