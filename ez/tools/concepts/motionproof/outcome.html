<!doctype html><meta charset="utf-8"><title>EZ outcome video</title>
<!-- Outcome video template (2026-11-10): one graded round as a 10 s, 1080x1350 clip. Data in outcome.json (round, calls, move, closes, season P&L);
     the beats: the calls (who went long, who went short), the bell (the move counts up), the money (each AI's bar rises or sinks, the closest call crowned), the line. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Geist+Mono:wght@600;700&family=Instrument+Serif:ital@1&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden;background:#04070e;color:#f8f0d9}
#gl{position:absolute;inset:0;width:1080px;height:1350px}

.sz{font:400 64px/1 Anton,Impact,sans-serif;width:150px;text-align:right}
#vs{position:absolute;left:50%;top:1095px;transform:translateX(-50%) rotate(-4deg);font:400 96px/1 Anton,Impact,sans-serif;color:#04070e;background:#fdbc2a;padding:6px 26px 10px;border:5px solid #04070e;box-shadow:8px 8px 0 #f8f0d9}
#mv{position:absolute;left:0;right:0;top:470px;text-align:center;font:400 300px/1 Anton,Impact,sans-serif;letter-spacing:-.01em}
#cl{position:absolute;left:0;right:0;top:820px;text-align:center;font:600 34px/1.4 "Geist Mono",monospace;color:#cfc9ba}

.lb b{display:block;font:400 54px/1 Anton,Impact,sans-serif}.lb i{display:block;font:700 26px/1.3 "Geist Mono",monospace;font-style:normal;color:#cfc9ba}

#cc{position:absolute;font:700 24px/1 "Geist Mono",monospace;letter-spacing:.14em;color:#04070e;background:#fdbc2a;padding:9px 12px;transform:translate(-50%,0);white-space:nowrap}
#ln{position:absolute;left:0;right:0;top:380px;text-align:center;font:400 128px/0.98 Anton,Impact,sans-serif}
#ln2{position:absolute;left:0;right:0;top:720px;text-align:center;font:italic 54px/1.2 "Instrument Serif",serif;color:#cfc9ba}
#url{position:absolute;left:0;right:0;top:1120px;text-align:center;font:700 34px/1 "Geist Mono",monospace;letter-spacing:.1em;color:#fdbc2a}
#wipe{position:absolute;inset:0;display:none}
.bar{position:absolute;left:60px;right:60px;bottom:52px;height:10px;display:flex;gap:6px}.bar i{flex:1;border-radius:2px}
#ph{position:absolute;left:60px;bottom:47px;width:3px;height:20px;background:#f8f0d9}
#draft{position:absolute;right:30px;top:30px;font:700 22px/1 "Geist Mono",monospace;color:#ff3a31;letter-spacing:.2em;border:2px solid #ff3a31;padding:6px 10px;display:none}
</style>
<canvas id="gl" width="1080" height="1350"></canvas>
<div class="sc" id="A"><div class="k" style="top:118px">THE TRADES · ROUND <span id="rn"></span></div><div class="co" id="co" style="top:170px"></div><div id="rows"></div><div id="vs"></div></div>
<div class="sc" id="B"><div class="k" style="top:300px">THE BELL · <span id="cn"></span></div><div id="mv"></div><div id="cl"></div></div>
<div class="sc" id="C"><div class="k" style="top:118px">P&amp;L ON $100K</div><div id="lbs"></div><div id="cc">CLOSEST CALL</div></div>
<div class="sc" id="D"><div id="ln"></div><div id="ln2"></div><div id="url">EARNINGSZN.XYZ</div></div>
<div id="wipe"></div><div id="draft">DRAFT</div>
<div class="bar"><i style="background:#03c870"></i><i style="background:#fdbc2a"></i><i style="background:#ff3a31"></i></div><div id="ph"></div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const $=i=>document.getElementById(i),cl=x=>x<0?0:x>1?1:x,seg=(t,a,b)=>cl((t-a)/(b-a)),eo=x=>x===1?1:1-Math.pow(2,-10*x),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.7,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)},spring=x=>x>=1?1:1-Math.exp(-6*x)*Math.cos(11*x);
const O=await (await fetch('outcome.json')).json(),D=O.dur||10;if(O.draft)$('draft').style.display='block';
const COL={GPT:'#b18cff',CLAUDE:'#ef8a55',KIMI:'#58b7ff',GROK:'#e4e0d6'},NM={GPT:'ChatGPT',CLAUDE:'Claude',KIMI:'Kimi',GROK:'Grok'};
const money=v=>(v<0?'−':'+')+'$'+Math.abs(Math.round(v)).toLocaleString('en-US'),pct=v=>(v<0?'−':'+')+Math.abs(v).toFixed(2)+'%';
/* each AI: side, size, P&L on $100K (flat: right side earns |move|, wrong side loses it), miss to the move when on the right side */
const AI=O.calls.map(c=>{const up=c.dir==='UP',right=(up&&O.move>0)||(!up&&O.move<0);return {...c,up,right,pnl:1000*(right?1:-1)*Math.abs(O.move),miss:right?Math.abs((up?1:-1)*c.mag-O.move):null}});
const best=AI.filter(a=>a.right).sort((a,b)=>a.miss-b.miss)[0];
$('rn').textContent=O.n;$('co').textContent=O.co.toUpperCase();$('cn').textContent=O.ticker;
$('rows').innerHTML=AI.map((a,i)=>'<div class="row" id="r'+i+'" style="top:'+(380+i*140)+'px"><b style="color:'+COL[a.m]+'">'+NM[a.m]+'</b><span class="pill '+(a.up?'L':'S')+'">'+(a.up?'LONG':'SHORT')+'</span><span class="sz">'+a.mag+'%</span></div>').join('');
const nL=AI.filter(a=>a.up).length;$('vs').textContent=nL+' v '+(4-nL);
$('cl').innerHTML=O.closeA+' → '+O.closeB;$('ln').innerHTML=O.line[0]+'<br>'+O.line[1];$('ln2').textContent=O.line2;
/* 3D: four bars on a $0 plane, green up for a win, red down for a loss; the closest call gets a gold crown */
const ren=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,preserveDrawingBuffer:true});ren.setPixelRatio(1);ren.setSize(1080,1350,false);ren.toneMapping=THREE.ACESFilmicToneMapping;ren.outputColorSpace=THREE.SRGBColorSpace;ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
const pm=new THREE.PMREMGenerator(ren),sC=new THREE.Scene();sC.background=new THREE.Color('#04070e');sC.environment=pm.fromScene(new RoomEnvironment(),.04).texture;sC.environmentIntensity=.7;
const key=new THREE.DirectionalLight('#fff3dc',2.4);key.position.set(-5,10,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-8,right:8,top:8,bottom:-8});sC.add(key);
const plane=new THREE.Mesh(new THREE.BoxGeometry(11,.06,4.2),new THREE.MeshPhysicalMaterial({color:'#9fb0a6',transmission:.9,roughness:.25,thickness:.2,transparent:true,opacity:.35}));sC.add(plane);
const pl0=new THREE.Mesh(new THREE.PlaneGeometry(11,4.2),new THREE.ShadowMaterial({opacity:.5}));pl0.rotation.x=-Math.PI/2;pl0.position.y=.035;pl0.receiveShadow=true;sC.add(pl0);
const geo=new THREE.BoxGeometry(1.5,1,1.5);const bars=AI.map((a,i)=>{const m=new THREE.Mesh(geo,new THREE.MeshPhysicalMaterial({color:a.right?'#03c870':'#ff3a31',roughness:.25,metalness:.15,clearcoat:.6}));m.castShadow=true;m.position.x=(i-1.5)*2.5;sC.add(m);return m});
const crown=new THREE.Group(),gold=new THREE.MeshPhysicalMaterial({color:'#fdbc2a',metalness:1,roughness:.18,clearcoat:1,emissive:'#8a5c00',emissiveIntensity:.55});
crown.add(new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.32,48,1,true),gold));for(let k=0;k<5;k++){const c=new THREE.Mesh(new THREE.ConeGeometry(.17,.5,24),gold),a=k/5*Math.PI*2;c.position.set(Math.cos(a)*.55,.38,Math.sin(a)*.55);crown.add(c)}
crown.children[0].material.side=THREE.DoubleSide;sC.add(crown);
const cam=new THREE.PerspectiveCamera(30,1080/1350,.1,100);const H=2.6;
const lbs=AI.map((a,i)=>{const d=document.createElement('div');d.className='lb';d.innerHTML='<em style="color:'+(a.right?'#03c870':'#ff3a31')+'">'+money(a.pnl)+'</em><b style="color:'+COL[a.m]+'">'+NM[a.m]+'</b><i>'+(a.up?'LONG ':'SHORT ')+a.mag+'%</i>';$('lbs').appendChild(d);return d});
const proj=v=>{const p=v.clone().project(cam);return [(p.x+1)/2*1080,(1-p.y)/2*1350]};
window.R=function(t){['A','B','C','D'].forEach(s=>$(s).style.display='none');$('wipe').style.display='none';$('ph').style.left=(60+960*t/D)+'px';ren.setClearColor('#04070e',1);ren.clear();
 const wipe=(c,k,how)=>{const w=$('wipe');w.style.display='block';w.style.background=c;w.style.clipPath=how(k)};
 if(t<2.6){$('A').style.display='block';const k=seg(t,.05,.4),co=$('co');co.style.opacity=k>0?1:0;co.style.transform='scale('+(1.25-.25*back(k))+')';
  AI.forEach((a,i)=>{const r=$('r'+i),t0=.45+i*.22,k2=seg(t,t0,t0+.3);r.style.opacity=k2>0?1:0;r.style.transform='translateX('+((1-back(k2))*(i%2?-160:160))+'px)'});
  const kv=seg(t,1.55,1.85),vs=$('vs');vs.style.opacity=kv>0?1:0;vs.style.transform='translateX(-50%) rotate(-4deg) scale('+(2-back(kv))+')';
  if(t>2.3)wipe('#04070e',eio(seg(t,2.3,2.6)),k=>'inset(0 0 '+((1-k)*100)+'% 0)');return}
 if(t<4.6){$('B').style.display='block';const k=eio(seg(t,2.75,3.75)),v=O.move*k,mv=$('mv');mv.textContent=pct(v);mv.style.color=O.move>=0?'#03c870':'#ff3a31';
  mv.style.transform='scale('+(1+.08*(1-spring(seg(t,3.75,4.3))))+')';$('cl').style.opacity=eo(seg(t,3.85,4.15));
  if(t>4.3)wipe(O.move>=0?'#03c870':'#ff3a31',eio(seg(t,4.3,4.6)),k=>'circle('+(k*120)+'% at 50% 45%)');return}
 if(t<8){$('C').style.display='block';const u=t-4.6,a=-.28+.18*eio(seg(t,4.6,8));cam.position.set(Math.sin(a)*26,6.5,Math.cos(a)*26);cam.lookAt(0,1.3,0);cam.updateMatrixWorld();
  const mx=Math.max(...AI.map(a=>Math.abs(a.pnl)));
  AI.forEach((a,i)=>{const t0=5.05+i*.14,k=spring(seg(t,t0,t0+.7)),h=Math.max(.001,H*Math.abs(a.pnl)/mx*k);const m=bars[i];m.scale.set(1,h,1);m.position.y=a.right?h/2+.04:-h/2;
   const top=new THREE.Vector3(m.position.x,a.right?h+.2+(a===best?1.25*seg(t,6.3,6.6):0):.4,0),[x,y]=proj(top);const l=lbs[i];l.style.left=x+'px';l.style.top=(a.right?y:y-20)+'px';l.style.opacity=eo(seg(t,t0+.25,t0+.55))});
  if(best){const bi=AI.indexOf(best),b=bars[bi],k=seg(t,6.3,6.9),top=H*Math.abs(best.pnl)/mx;crown.visible=k>0;crown.position.set(b.position.x,top+.35+3*(1-eo(k)),0);crown.rotation.y=u*1.4;
   const [cx,cy]=proj(new THREE.Vector3(b.position.x,-.15,0));const c=$('cc');c.style.left=cx+'px';c.style.top=(cy+10)+'px';c.style.opacity=eo(seg(t,6.8,7.1))}else{crown.visible=false;$('cc').style.opacity=0}
  ren.render(sC,cam);if(t<4.9)wipe(O.move>=0?'#03c870':'#ff3a31',eio(seg(t,4.6,4.9)),k=>'circle('+((1-k)*120)+'% at 50% 45%)');
  if(t>7.7)wipe('#fdbc2a',eio(seg(t,7.7,8)),k=>'inset('+((1-k)*100)+'% 0 0 0)');return}
 $('D').style.display='block';const k=seg(t,8.1,8.45);$('ln').style.opacity=k>0?1:0;$('ln').style.transform='translateY('+((1-back(k))*80)+'px)';$('ln2').style.opacity=eo(seg(t,8.6,8.9));$('url').style.opacity=eo(seg(t,8.9,9.2));
 if(t<8.3)wipe('#fdbc2a',eio(seg(t,8,8.3)),k=>'inset(0 0 '+(k*100)+'% 0)')};
await document.fonts.ready;window.READY=1;window.R(0);
</script>
