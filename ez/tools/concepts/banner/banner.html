<!doctype html><meta charset="utf-8"><title>X banner</title>
<!-- The X profile header for @earningszn in the terminal's look (owner, 2026-11-13: "we still had the one from V1.0 of the website").
  banner.html?v=a|b|c, 1500x500 (X shows it at 600x200 on desktop and about 390x130 on phones, so only big type reads).
  a: the leaderboard card   b: the season P&L race (real lines from series.json)   c: long or short, type only.
  Kept clear: the avatar's corner (x<430, y>300), the two top corners a phone covers with its buttons (180x170 left, 350x170 right, estimates), 60px top and bottom.
  ?guide=1 draws those zones. No brand row: the profile's own name and avatar sit right under the banner. -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap');
@font-face{font-family:'Geist Mono';src:url(fonts/geistmono.woff2);font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:1500px;height:500px;overflow:hidden;background:#0e0c0b;color:#f2ede6;font-family:Inter,system-ui,sans-serif}
#b{position:relative;width:1500px;height:500px;overflow:hidden;background:
  radial-gradient(60% 55% at 78% 0%,rgba(85,214,162,.13),transparent 70%),
  radial-gradient(50% 60% at 100% 100%,rgba(232,87,107,.10),transparent 70%),
  radial-gradient(circle,rgba(242,237,230,.07) 1.2px,transparent 1.6px) 0 0/28px 28px,#0e0c0b}
.up{color:#55d6a2}.dn{color:#e8576b}.au{color:#fdbc2a}.mu{color:#8e8680}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.tx{position:absolute;left:200px;top:92px}
.h{font:900 62px/1.06 Inter;letter-spacing:-.035em;white-space:nowrap}
.s{font:600 27px/1 'Geist Mono';letter-spacing:.01em;color:#8e8680;margin-top:24px;white-space:nowrap}
.mk{display:block;flex:none}
/* a: the board */
.card{position:absolute;left:880px;top:124px;width:550px;height:308px;border-radius:26px;background:linear-gradient(180deg,#1d1917,#161312);box-shadow:inset 0 0 0 2px #2a2522,0 30px 80px rgba(0,0,0,.5)}
.card .hd{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:2px solid #2a2522;font:700 22px 'Geist Mono';letter-spacing:.14em}
.card .hd b{color:#f2ede6;font-weight:700;position:relative}.card .hd b:after{content:"";position:absolute;left:0;right:0;bottom:-19px;height:3px;background:#fdbc2a}
.card .hd span{color:#fdbc2a}
.card .r{height:62px;display:flex;align-items:center;gap:18px;padding:0 28px;border-bottom:2px solid #221e1b}
.card .r:last-child{border:0}
.card .rk{font:600 26px 'Geist Mono';color:#8e8680;width:22px}.card .r:nth-child(2) .rk{color:#fdbc2a}
.card .nm{font:800 32px Inter;letter-spacing:-.02em;width:150px}
.card svg.sp{margin-left:auto;overflow:visible}
/* b: the race */
#race{position:absolute;left:0;top:0}
.end{position:absolute;display:flex;align-items:center;gap:12px;font:800 28px Inter;letter-spacing:-.02em;white-space:nowrap}
.cap{position:absolute;font:600 19px 'Geist Mono';letter-spacing:.14em;color:#5f5853;white-space:nowrap}
/* c: long or short */
.c{position:absolute;left:450px;right:70px;top:172px;display:flex;flex-direction:column;align-items:flex-start}
.c .t{display:flex;align-items:center;gap:22px;font:800 46px Inter;letter-spacing:-.03em;white-space:nowrap}
.c .t .mks{display:flex;gap:10px;margin-right:6px}
.c .ls{display:flex;align-items:center;gap:28px;margin-top:20px;white-space:nowrap}
.c .p{font:900 112px/1 Inter;letter-spacing:-.045em;padding:10px 30px 12px;border-radius:24px}
.c .p.L{color:#55d6a2;background:rgba(85,214,162,.13);box-shadow:inset 0 0 0 4px rgba(85,214,162,.55),0 0 90px rgba(85,214,162,.18)}
.c .p.S{color:#e8576b;background:rgba(232,87,107,.12);box-shadow:inset 0 0 0 4px rgba(232,87,107,.5),0 0 90px rgba(232,87,107,.16)}
.c .or{font:800 54px Inter;color:#5f5853;letter-spacing:-.02em}
.c .s{margin-top:20px}
.g{position:absolute;border:2px dashed #fdbc2a;background:rgba(253,188,42,.10);color:#fdbc2a;font:600 16px 'Geist Mono';padding:6px}
</style>
<div id="b"></div>
<script>
const V = (new URLSearchParams(location.search).get('v') || 'a'), GUIDE = new URLSearchParams(location.search).get('guide');
const B = document.getElementById('b');
const NAMES = { GROK: 'Grok', CLAUDE: 'Claude', GPT: 'ChatGPT', KIMI: 'Kimi' };
let MD, S;
const mark = (k, s) => { const m = MD[k]; return `<svg class="mk" width="${s}" height="${s}" viewBox="-4 -4 32 32" style="border-radius:${s * .26}px;background:${m.bg};box-shadow:0 0 0 ${Math.max(1.5, s * .03)}px rgba(242,237,230,.18)"><path d="${m.d}" fill="${m.fg}"/></svg>` };
const dp = pts => 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
// green above $0, red below: one gradient with a hard stop at the $0 line
const sg = (id, z, h, a1, a0) => `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${h}"><stop offset="0" stop-color="#55d6a2" stop-opacity="${a1}"/><stop offset="${z / h}" stop-color="#55d6a2" stop-opacity="${a0}"/><stop offset="${z / h}" stop-color="#e8576b" stop-opacity="${a0}"/><stop offset="1" stop-color="#e8576b" stop-opacity="${a1}"/></linearGradient>`;
const order = () => Object.keys(S.s).sort((a, b) => S.s[b].at(-1) - S.s[a].at(-1));
const HEAD = `<div class="h">Track the P&amp;L of 4 AIs<br>trading earnings.</div><div class="s">$100K a trade. Graded at the close.</div>`;
const A = () => { const W = 190, Hh = 44;
  B.innerHTML = `<div class="tx">${HEAD}</div><div class="card"><div class="hd"><b>LEADERBOARD</b></div>${order().map((k, i) => { const s = S.s[k], lo = Math.min(...s), hi = Math.max(...s), up = s.at(-1) >= 0;
    const pts = s.map((v, j) => [j / (s.length - 1) * W, Hh - 3 - (v - lo) / (hi - lo || 1) * (Hh - 6)]), c = up ? '#55d6a2' : '#e8576b';
    return `<div class="r"><span class="rk">${i + 1}</span>${mark(k, 46)}<span class="nm">${NAMES[k]}</span><svg class="sp" width="${W}" height="${Hh}"><defs><filter id="f${i}"><feGaussianBlur stdDeviation="3"/></filter></defs><path d="${dp(pts)}" fill="none" stroke="${c}" stroke-width="7" opacity=".35" filter="url(#f${i})"/><path d="${dp(pts)}" fill="none" stroke="${c}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/></svg></div>` }).join('')}</div>` };
const Bv = () => { const x0 = 40, x1 = 1300, y0 = 176, y1 = 440, all = Object.values(S.s).flat(), lo = Math.min(...all), hi = Math.max(...all), n = S.rounds;
  const X = j => x0 + j / n * (x1 - x0), Y = v => y1 - (v - lo) / (hi - lo) * (y1 - y0), z = Y(0);
  let body = '', ends = '';
  order().reverse().forEach((k, i) => { const pts = S.s[k].map((v, j) => [X(j), Y(v)]), d = dp(pts), e = pts.at(-1);
    body += `<path d="${d}L${e[0]} ${z}L${x0} ${z}Z" fill="url(#ra)"/><path d="${d}" fill="none" stroke="url(#rl)" stroke-width="12" opacity=".28" filter="url(#rg)"/><path d="${d}" fill="none" stroke="url(#rl)" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${e[0]}" cy="${e[1]}" r="7" fill="#f2ede6"/>`;
    ends += `<div class="end" style="left:${e[0] + 18}px;top:${e[1] - 24}px">${mark(k, 48)}</div>` });
  // the headline sits on a soft patch of the ground so the early rounds' lines pass under it quietly
  B.innerHTML = `<svg id="race" width="1500" height="500"><defs>${sg('rl', z, 500, 1, 1)}${sg('ra', z, 500, .16, 0)}<filter id="rg"><feGaussianBlur stdDeviation="7"/></filter>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".3" stop-color="#fff" stop-opacity=".35"/><stop offset=".62" stop-color="#fff" stop-opacity="1"/></linearGradient><mask id="mk"><rect width="1500" height="500" fill="url(#fade)"/></mask></defs>
    <line x1="${x0}" x2="${x1}" y1="${z}" y2="${z}" stroke="#5f5853" stroke-width="2" stroke-dasharray="8 8" mask="url(#mk)"/><g mask="url(#mk)">${body}</g></svg>${ends}
    <div class="tx">${HEAD.replace(/<div class="s">.*<\/div>$/, '')}</div><div class="cap" style="left:452px;top:404px">SEASON 1 · $100K A TRADE · THROUGH ROUND ${S.last}</div>` };
const C = () => { B.innerHTML = `<div class="c"><div class="t"><span class="mks">${order().map(k => mark(k, 58)).join('')}</span><span>4 AIs. Every earnings report.</span></div>
  <div class="ls"><span class="p L">LONG</span><span class="or">or</span><span class="p S">SHORT</span></div><div class="s">$100K a trade. Graded at the close. P&amp;L tracked in public.</div></div>` };
(async () => { MD = await fetch('models.json').then(r => r.json()); S = await fetch('series.json').then(r => r.json());
  ({ a: A, b: Bv, c: C })[V]();
  if (GUIDE) B.insertAdjacentHTML('beforeend', `<div class="g" style="left:0;top:300px;width:430px;height:200px">avatar</div><div class="g" style="left:0;top:0;width:180px;height:170px">phone</div><div class="g" style="right:0;top:0;width:350px;height:170px">phone</div><div class="g" style="left:0;right:0;top:0;height:60px;opacity:.5"></div><div class="g" style="left:0;right:0;bottom:0;height:60px;opacity:.5"></div>`);
  await document.fonts.ready; await Promise.all(['900 62px Inter', '800 32px Inter', '600 27px "Geist Mono"'].map(f => document.fonts.load(f)));
  window.READY = document.fonts.check('900 62px Inter') && document.fonts.check('600 27px "Geist Mono"') ? 1 : 'nofont' })();
</script>
