<!doctype html><meta charset="utf-8"><title>Banner preview</title>
<!-- preview.html?v=a : the banner as an X profile shows it, desktop (600 wide) and phone (390 wide). The avatar's size and place and

<style>*{box-sizing:border-box;margin:0}body{background:#2a2522;font:14px Inter,system-ui,sans-serif;color:#e7e9ea;padding:28px;display:flex;gap:36px;align-items:flex-start;width:1100px}
.p{background:#000;position:relative;overflow:hidden}.p img.bn{display:block;width:100%}
.av{position:absolute;border-radius:50%;background:#04070e;border:4px solid #000;overflow:hidden}.av img{width:100%;height:100%}
.n{padding:0 16px 18px}.n b{display:block;font-size:20px;font-weight:800}.n span{color:#71767b}
.btn{position:absolute;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6)}
.cap{font:600 12px ui-monospace,monospace;color:#8e8680;margin-bottom:8px;letter-spacing:.08em}</style>
<div><div class="cap">DESKTOP · 600 WIDE</div><div class="p" style="width:600px"><img class="bn" id="i1"><div class="av" style="left:16px;top:129px;width:142px;height:142px"><img src="logo.svg"></div><div style="height:82px"></div><div class="n"><b>Earnings Zeason</b><span>@earningszn</span></div></div></div>
<div><div class="cap">PHONE · 390 WIDE</div><div class="p" style="width:390px"><img class="bn" id="i2"><div class="btn" style="left:12px;top:10px"></div><div class="btn" style="right:12px;top:10px"></div><div class="btn" style="right:56px;top:10px"></div><div class="av" style="left:14px;top:96px;width:76px;height:76px;border-width:3px"><img src="logo.svg"></div><div style="height:50px"></div><div class="n"><b>Earnings Zeason</b><span>@earningszn</span></div></div></div>
<script>const v=new URLSearchParams(location.search).get('v')||'a';i1.src=i2.src='out/banner-'+v+'.png';Promise.all([i1.decode(),i2.decode()]).then(()=>window.READY=1)</script>
