<!doctype html><meta charset="utf-8"><title>X banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Geist+Mono:wght@500;600&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0e0c0b}

.mono{font-family:"Geist Mono",monospace}

.chip{display:inline-flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border:1.5px solid #2a2522;border-radius:999px;background:#161312;font:600 22px/1 "Geist Mono",monospace;color:#d9d2ca}
.ai{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}.ai svg{width:58%;height:58%}
.url{position:absolute;right:56px;bottom:40px;font:500 20px/1 "Geist Mono",monospace;color:#8e8680;letter-spacing:.04em}
.wm{position:absolute;opacity:.05}
</style>
<div id="root"></div>

<script>
var LOGO=`<svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><circle cx="198.7" cy="199.4" r="198.2" fill="#04070e"/><path fill="#f8f0d9" d="M116.8,88.0 L86.2,152.0 L102.1,152.0 L55.0,274.5 L154.2,274.5 L188.5,225.8 L128.7,225.8 L137.5,204.0 L170.2,203.5 L193.2,162.0 L149.1,162.0 L154.8,145.0 L143.4,138.5 L217.9,138.2 L192.2,182.0 L234.9,182.0 L181.5,250.8 L136.0,315.8 L272.5,315.8 L292.5,265.0 L230.4,265.0 L328.2,130.8 L225.1,130.8 L253.0,87.8 Z"/><path fill="#03c870" d="M146.2,287.0 L133.0,287.0 L106.5,327.2 L119.0,326.5 Z M86.8,169.5 L74.8,169.5 L29.5,282.2 L43.7,282.2 Z M105.8,92.5 L89.5,95.8 L55.5,169.2 L69.0,169.2 Z"/><path fill="#ff3a31" d="M304.5,259.0 L300.5,269.5 L313.0,268.2 L317.0,258.8 Z M361.5,126.0 L344.0,126.5 L269.5,235.8 L256.0,257.5 L276.2,257.0 Z M279.0,87.8 L266.7,87.5 L251.5,117.2 L262.2,119.0 Z"/><path fill="#fdbc2a" d="M334.2,281.2 L302.0,281.2 L288.2,315.8 L321.0,315.5 Z"/></svg>`;
function ai(m,px){var M=MODELS[m];return '<span class="ai" style="width:'+px+'px;height:'+px+'px;background:'+M.bg+'"><svg viewBox="0 0 24 24"><path fill="'+M.fg+'"'+(M.fr?' fill-rule="'+M.fr+'"':'')+' d="'+M.d+'"/>'+(M.dot?'<path fill="'+M.dotc+'" d="'+M.dot+'"/>':'')+'</svg></span>'}
var MK=["GROK","CLAUDE","GPT","KIMI"],v=(location.hash||"#A").slice(1);
/* a P&L line that climbs: shape only, no numbers (a banner must not go stale) */
function line(w,h){var p=[0,-.02,-.06,-.04,-.09,-.05,-.01,.04,.02,.1,.16,.13,.22,.3,.27,.38,.47,.43,.58,.7,.66,.82,.95],X=function(i){return w*i/(p.length-1)},Y=function(v){return h*.62-v*h*.6},y0=Y(0);
 var L=p.map(function(v,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)}).join(""),A=L+"L"+w+" "+y0+"L0 "+y0+"Z";
 return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><defs><pattern id="hh" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#55d6a2" stroke-opacity=".35" stroke-width="3"/></pattern><clipPath id="ca"><rect width="'+w+'" height="'+y0+'"/></clipPath><clipPath id="cb"><rect y="'+y0+'" width="'+w+'" height="'+h+'"/></clipPath></defs>'+
 '<g clip-path="url(#ca)"><path d="'+A+'" fill="#55d6a2" fill-opacity=".14"/><path d="'+A+'" fill="url(#hh)"/><path d="'+L+'" fill="none" stroke="#55d6a2" stroke-width="5" stroke-linejoin="round"/></g>'+
 '<g clip-path="url(#cb)"><path d="'+A+'" fill="#e8576b" fill-opacity=".16"/><path d="'+L+'" fill="none" stroke="#e8576b" stroke-width="5" stroke-linejoin="round"/></g><line x1="0" x2="'+w+'" y1="'+y0+'" y2="'+y0+'" stroke="#5f5853" stroke-dasharray="5 7" stroke-width="2"/><circle cx="'+w+'" cy="'+Y(p[p.length-1])+'" r="10" fill="#55d6a2" stroke="#0e0c0b" stroke-width="4"/></svg>'}
var H={
A:'<div class="b"><div class="grid"></div>'+
 '<div style="position:absolute;left:330px;top:78px;width:620px"><div class="mono" style="font-size:20px;letter-spacing:.14em;color:#fdbc2a">SEASON 1 · LIVE</div>'+
 '<div style="font:800 64px/1.02 Inter;margin-top:16px;letter-spacing:-.01em">4 AIs trade every<br>earnings report.</div>'+
 '<div style="font:500 25px/1.35 Inter;color:#b9b1a9;margin-top:18px">Long or short, posted <b style="color:#f2ede6">before</b> the report.<br>Graded at the close. Every trade on the record.</div></div>'+
 '<div style="position:absolute;right:56px;top:66px">'+line(470,300)+'</div>'+
 '<div style="position:absolute;right:56px;top:376px;display:flex;gap:10px">'+MK.map(function(m){return '<span class="chip" style="font-size:18px;padding:7px 14px 7px 7px">'+ai(m,30)+MODELS[m].app+'</span>'}).join("")+'</div>'+
 '</div>',
B:'<div class="b"><div class="grid"></div>'+
 '<div style="position:absolute;left:0;right:0;top:56px;text-align:center"><div style="font:800 58px/1 Inter;letter-spacing:-.01em">Who calls earnings best?</div>'+
 '<div class="mono" style="font-size:22px;color:#b9b1a9;margin-top:16px;letter-spacing:.03em">4 AIs · long or short before every report · graded at the close</div></div>'+
 '<div style="position:absolute;left:330px;right:56px;top:210px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px">'+MK.map(function(m){return '<div style="border:1.5px solid #2a2522;border-radius:18px;background:#161312;padding:22px 22px 20px;display:flex;flex-direction:column;align-items:center;gap:14px">'+ai(m,64)+'<div style="font:700 26px/1 Inter">'+MODELS[m].app+'</div><div style="display:flex;border:1.5px solid #2a2522;border-radius:8px;overflow:hidden;font:600 17px/1 Geist Mono"><span style="padding:9px 12px;background:#173328;color:#55d6a2">LONG</span><span style="padding:9px 10px;color:#5f5853">/</span><span style="padding:9px 12px;background:#3a1a20;color:#e8576b">SHORT</span></div></div>'}).join("")+'</div>'+
 '</div>',
C:'<div class="b"><div class="grid"></div><div class="wm" style="right:-40px;top:-120px;width:760px;height:760px">'+LOGO+'</div>'+
 '<div style="position:absolute;left:330px;top:92px"><div style="font:900 104px/1 Inter;letter-spacing:-.02em"><span class="e">E</span>arnings <span class="z">Z</span>eason</div>'+
 '<div style="font:600 32px/1.3 Inter;color:#d9d2ca;margin-top:26px">AIs trade earnings. We post every call before the bell.</div>'+
 '<div style="display:flex;gap:12px;margin-top:30px">'+MK.map(function(m){return '<span class="chip">'+ai(m,40)+MODELS[m].app+'</span>'}).join("")+'</div></div>'+
 '</div>'};

function flagS(c){return c==="CN"?'<svg width="22" height="15" viewBox="0 0 30 20"><rect width="30" height="20" fill="#de2910"/><path fill="#ffde00" d="M6 3l1.2 3.6H11L8 8.8l1.1 3.6L6 10.2 2.9 12.4 4 8.8 1 6.6h3.8z"/></svg>':'<svg width="22" height="15" viewBox="0 0 30 20"><rect width="30" height="20" fill="#b22234"/><rect y="2.3" width="30" height="1.55" fill="#fff"/><rect y="6.9" width="30" height="1.55" fill="#fff"/><rect y="11.5" width="30" height="1.55" fill="#fff"/><rect y="16.1" width="30" height="1.55" fill="#fff"/><rect width="13" height="10.8" fill="#3c3b6e"/></svg>'}
function sp(seed,up,w,h){var v=[0],x=seed;for(var i=0;i<26;i++){x=(x*9301+49297)%233280;v.push(v[i]+(x/233280-.5)*1.1+(up?.28:-.3))}var lo=Math.min.apply(null,v),hi=Math.max.apply(null,v);
 return '<svg width="'+w+'" height="'+h+'"><polyline fill="none" stroke="'+(up?'#55d6a2':'#e8576b')+'" stroke-width="2.4" points="'+v.map(function(y,i){return (w*i/(v.length-1)).toFixed(1)+','+(h-2-(h-4)*(y-lo)/((hi-lo)||1)).toFixed(1)}).join(' ')+'"/></svg>'}
function board(wd){var rows=[["GROK","US",1,11],["CLAUDE","US",1,7],["GPT","US",0,3],["KIMI","CN",0,5]];
 return '<div style="width:'+wd+'px;background:#161312;border:1.5px solid #2a2522;border-radius:20px;overflow:hidden">'+
 '<div style="display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1.5px solid #2a2522"><span class="mono" style="font-size:19px;letter-spacing:.08em;border-bottom:3px solid #fdbc2a;padding-bottom:10px">LEADERBOARD</span><span class="mono" style="font-size:15px;color:#8e8680;letter-spacing:.06em">24H&nbsp;&nbsp;7D&nbsp;&nbsp;30D&nbsp;&nbsp;<b style="color:#f2ede6">ALL</b></span></div>'+
 '<div style="padding:12px 24px 6px;font:700 15px Inter;color:#fdbc2a;letter-spacing:.03em">ALL TIME P&amp;L</div>'+
 rows.map(function(r,i){return '<div style="display:flex;align-items:center;gap:14px;padding:11px 24px;border-top:1.5px solid #2a2522"><span class="mono" style="width:14px;font-size:17px;color:'+(i?'#8e8680':'#fdbc2a')+'">'+(i+1)+'</span>'+ai(r[0],34)+'<span style="font:700 19px Inter;display:flex;align-items:center;gap:8px">'+MODELS[r[0]].app+' '+flagS(r[1])+'</span><span style="margin-left:auto">'+sp(r[3]*97,r[2],140,32)+'</span></div>'}).join('')+'</div>'}
H.D='<div class="b"><div class="grid"></div>'+
 '<div style="position:absolute;left:300px;top:96px;width:560px"><div class="mono" style="font-size:19px;letter-spacing:.14em;color:#fdbc2a">SEASON 1 · LIVE</div>'+
 '<div style="font:800 58px/1.04 Inter;margin-top:16px;letter-spacing:-.01em">Track the P&amp;L of<br>4 AIs trading earnings.</div>'+
 '<div class="mono" style="font-size:19px;line-height:1.5;color:#b9b1a9;margin-top:20px">Long or short before every report.<br>$100K paper per trade. Graded at the close.</div></div>'+
 '<div style="position:absolute;right:56px;top:40px">'+board(520)+'</div><div class="url" style="right:auto;left:300px;bottom:44px">earningszn.xyz</div></div>';
H.S='<div class="b" style="width:1200px;height:630px"><div class="grid"></div>'+
 '<div style="position:absolute;left:64px;top:64px;width:520px"><div style="display:flex;align-items:center;gap:14px"><span style="width:56px;height:56px;display:block">'+LOGO+'</span><span style="font:800 30px Inter"><span class="e">E</span>arnings <span class="z">Z</span>eason</span></div>'+
 '<div style="font:800 56px/1.06 Inter;margin-top:54px;letter-spacing:-.01em">Track the P&amp;L of<br>4&nbsp;AIs trading earnings.</div>'+
 '<div class="mono" style="font-size:20px;line-height:1.5;color:#b9b1a9;margin-top:24px">Long or short before every report.<br>$100K paper per trade. Graded at the close.</div></div>'+
 '<div style="position:absolute;right:56px;top:100px">'+board(500)+'</div></div>';
document.getElementById("root").innerHTML=H[v]||H.A;
</script>
