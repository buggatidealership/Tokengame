<!doctype html><meta charset="utf-8"><title>Resolution B · result first</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Geist+Mono:wght@500;600;700;800&display=swap">
<style>
/* Resolution animation B (2026-11-08): result first, then the calls 24 h earlier, then the all-time board moving.
   One hero object per beat. 1080x1350, R(t) pure. Numbers from ez-data.js (flat $100K, P&L = $1,000 x side x move%). */
:root{--tx:#f5f1ea;--mu:#aab5ae;--up:#3ee09a;--dn:#ff4d63;--ac:#fdbc2a;--sans:Inter,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1350px;overflow:hidden;font-family:var(--sans);color:var(--tx);background:#050806}
#st{position:relative;width:1080px;height:1350px;overflow:hidden}
#bg{position:absolute;inset:-40px;background:url(../launchvid/hedra/img/stage-2k.jpg) center 60%/cover}
.brand{position:absolute;left:56px;top:52px;display:flex;align-items:center;gap:14px;font:800 30px/1 var(--sans);letter-spacing:-.02em;z-index:20}.brand .e{color:#03c870}.brand .z{color:#ff3a31}
.sc{position:absolute;inset:0;z-index:10;opacity:0}
.c{position:absolute;left:0;right:0;text-align:center}
.lbl{font:600 26px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.med{position:relative;border-radius:50%;display:grid;place-items:center}
.med:before{content:"";position:absolute;inset:-6%;border-radius:50%;background:conic-gradient(from 200deg,#5d6661,#e8ece9,#6f7873,#2f3532,#cfd5d1,#5d6661);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.med.gold:before{background:conic-gradient(from 200deg,#8a5a10,#ffe08a,#c98a1a,#5e3b08,#ffd55a,#8a5a10)}
.med .disc{position:absolute;inset:0;border-radius:50%}.med svg{position:relative;width:52%;height:52%}.med i{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 8px 20px rgba(255,255,255,.16),inset 0 -14px 30px rgba(0,0,0,.5)}
.u{color:var(--up)}.d{color:var(--dn)}
.call{display:flex;align-items:center;gap:26px;padding:24px 30px;border-radius:28px;background:rgba(10,14,12,.66);border:1.5px solid rgba(255,255,255,.09);backdrop-filter:blur(12px)}
.call .n{font:800 44px/1 var(--sans)}.call .s{margin-left:auto;font:900 40px/1 var(--mono);letter-spacing:.08em;padding:12px 18px;border-radius:14px;border:3.5px solid currentColor}
.row{position:absolute;left:56px;right:56px;height:150px;display:flex;align-items:center;border-radius:26px;background:rgba(10,14,12,.6);border:1.5px solid rgba(255,255,255,.08)}
.row .rk{width:70px;text-align:center;font:800 34px/1 var(--mono);color:var(--mu)}
.row .nm{margin-left:18px;width:170px;font:800 36px/1 var(--sans);margin-top:-34px}
.row .val{position:absolute;right:28px;top:22px;font:800 34px/1 var(--mono);letter-spacing:-.02em}
.row .dl{position:absolute;left:190px;bottom:16px;font:700 24px/1 var(--mono);padding:6px 10px;border-radius:9px}
.bar{position:absolute;top:84px;height:26px;border-radius:13px}
.zero{position:absolute;top:66px;bottom:24px;width:2px;background:rgba(255,255,255,.35)}
</style>
<div id="st"><div id="bg"></div><div class="brand" id="brand"></div>
<div class="sc" id="s1"></div><div class="sc" id="s2"></div><div class="sc" id="s3"></div><div class="sc" id="s4"></div></div>
<script src="../../../ez-data.js"></script>
<script>
function $(i){return document.getElementById(i)}
var EZL='__EZLOGO__',RN=72,MK=["GROK","CLAUDE","GPT","KIMI"];
var RD=ROUNDS.filter(function(r){return r.n===RN})[0],L=CO_LOGOS[RD.ticker];
var C=RD.calls.map(function(c){var s=c[1].indexOf('DOWN')===0?-1:1;return {m:c[0],s:s,ok:s*RD.a>0,pnl:1000*s*RD.a}});
var RIGHT=C.filter(function(c){return c.ok}),WIN=RD.win,WP=1000*C.filter(function(c){return c.m===WIN})[0].s*RD.a;
function st(N){var p={};MK.forEach(function(m){p[m]=0});ROUNDS.forEach(function(r){if(r.n>N)return;r.calls.forEach(function(c){var s=c[1].indexOf('DOWN')===0?-1:1;p[c[0]]+=1000*s*r.a})});return p}
var PB=st(RN-1),PA=st(RN),OB=MK.slice().sort(function(a,b){return PB[b]-PB[a]}),OA=MK.slice().sort(function(a,b){return PA[b]-PA[a]});
var GB=PB[OB[0]]-PB[OB[1]],GA=PA[OA[0]]-PA[OA[1]];
function med(m,px,cls){var M=MODELS[m];return '<span class="med '+(cls||'')+'" style="width:'+px+'px;height:'+px+'px"><span class="disc" style="background:'+M.bg+'"></span><svg viewBox="0 0 24 24"><path fill="'+M.fg+'"'+(M.fr?' fill-rule="'+M.fr+'"':'')+' d="'+M.d+'"/>'+(M.dot?'<path fill="'+M.dotc+'" d="'+M.dot+'"/>':'')+'</svg><i></i></span>'}
function money(v){return (v<0?'−':'+')+'$'+Math.abs(Math.round(v)).toLocaleString('en-US')}
function cl(x){return x<0?0:x>1?1:x}function seg(t,a,b){return cl((t-a)/(b-a))}function eo(x){return x===1?1:1-Math.pow(2,-10*x)}function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}function mix(a,b,k){return a+(b-a)*k}
function sc(id,o){var e=$(id);e.style.opacity=o;e.style.transform='';e.style.filter='';e.style.display=o>0?'block':'none'}
function rv(el,p,dy){p=eo(p);el.style.opacity=p;el.style.transform='translateY('+((1-p)*(dy||30)).toFixed(1)+'px)';el.style.filter='blur('+((1-p)*10).toFixed(1)+'px)'}
var coL='<span style="display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:#fff;overflow:hidden;vertical-align:middle;margin-right:16px">'+(L?'<img src="../../../media/'+L.f+'" style="width:76%;height:76%;object-fit:contain">':'')+'</span>';
$("brand").innerHTML='<svg width="44" height="44" viewBox="0 0 400 400">'+EZL+'</svg><span><span class="e">E</span>arnings <span class="z">Z</span>eason</span>';
/* 1 the result, first */
$("s1").innerHTML='<div class="c" id="a0" style="top:190px"><span class="lbl" style="color:var(--ac);font-size:30px">'+MODELS[WIN].app+' wins</span></div>'+
 '<div id="hero" style="position:absolute;left:50%;top:270px;margin-left:-260px">'+med(WIN,520,'gold')+'</div>'+
 '<div class="c" id="a1" style="top:860px;font:900 150px/1 var(--mono);letter-spacing:-.06em;color:var(--up)">+$0</div>'+
 '<div class="c" id="a2" style="top:1050px;font:700 44px/1 var(--sans);letter-spacing:-.02em">'+coL+RD.co+' <span class="'+(RD.a<0?'d':'u')+'">'+(RD.a<0?'−':'+')+Math.abs(RD.a).toFixed(2)+'%</span></div>'+
 '<div class="c lbl" id="a3" style="top:1150px">'+RIGHT.length+' of 4 called it · $100K trade</div>';
/* 2 the calls, 24 h earlier */
var longs=C.filter(function(c){return c.s>0}),shorts=C.filter(function(c){return c.s<0});
function callRow(c,i){return '<div class="call" id="cl'+i+'" style="position:absolute;left:84px;right:84px;top:'+(470+i*150)+'px">'+med(c.m,96)+'<span class="n">'+MODELS[c.m].app+'</span><span class="s '+(c.s>0?'u':'d')+'">'+(c.s>0?'LONG':'SHORT')+'</span></div>'}
var ord=longs.concat(shorts);
$("s2").innerHTML='<div class="c lbl" id="b0" style="top:200px;color:var(--ac)">◂◂ 24 hours earlier</div><div class="c" id="b1" style="top:256px;font:800 72px/1.05 var(--sans);letter-spacing:-.03em">'+coL+RD.co+' earnings</div>'+
 '<div class="c lbl" id="b2" style="top:370px">Locked before the report · '+longs.length+' long · '+shorts.length+' short</div>'+ord.map(callRow).join('');
/* 3 the board */
var Z0=740,PX=280/Math.max.apply(null,MK.map(function(m){return Math.max(Math.abs(PA[m]),Math.abs(PB[m]))}));
$("s3").innerHTML='<div class="c lbl" id="c0" style="top:200px;color:var(--ac)">All-time P&amp;L · $100K every trade</div><div class="c" id="c1" style="top:252px;font:800 72px/1 var(--sans);letter-spacing:-.03em">The leaderboard</div>'+
 MK.map(function(m){var cc=C.filter(function(c){return c.m===m})[0];return '<div class="row" id="r'+m+'"><span class="rk" id="k'+m+'"></span>'+med(m,84)+'<span class="nm">'+MODELS[m].app+'</span><span class="zero" style="left:'+(Z0-56)+'px"></span><span class="bar" id="b'+m+'"></span><span class="val" id="v'+m+'"></span><span class="dl" id="d'+m+'" style="background:'+(cc.ok?'rgba(62,224,154,.15)':'rgba(255,77,99,.15)')+';color:'+(cc.ok?'var(--up)':'var(--dn)')+'">'+money(cc.pnl)+' on '+RD.ticker+'</span></div>'}).join('')+
 '<div id="gap" style="position:absolute;left:84px;right:84px;top:1060px;display:flex;align-items:baseline;justify-content:center;gap:24px"><span class="lbl">Lead at the top</span><span style="font:900 64px/1 var(--mono);letter-spacing:-.04em;color:var(--ac)" id="gv"></span></div>';
/* 4 end */
$("s4").innerHTML='<div class="c" id="e0" style="top:330px"><svg width="200" height="200" viewBox="0 0 400 400">'+EZL+'</svg></div><div class="c" id="e1" style="top:600px;font:800 84px/1.05 var(--sans);letter-spacing:-.04em">Follow the next calls</div><div class="c" id="e2" style="top:720px;font:800 76px/1 var(--mono);letter-spacing:-.03em;color:var(--ac)">earningszn.xyz</div><div class="c lbl" id="e3" style="top:850px">Every AI trade, tracked live · @earningszn</div>';
window.R=function(t){["s1","s2","s3","s4"].forEach(function(s){sc(s,0)});$("bg").style.transform='scale('+(1.04-.02*Math.sin(t/13*Math.PI))+')';
 if(t<2.75){var o=t>2.45?1-seg(t,2.45,2.75):1;sc("s1",o);var a=eo(seg(t,0,.7));$("hero").style.transform='scale('+(mix(.6,1,a)*(1+.03*seg(t,.7,2.45)))+')';$("hero").style.opacity=a;
  $("hero").style.filter=t>2.45?'blur('+(seg(t,2.45,2.75)*14)+'px) saturate('+(1-seg(t,2.45,2.75))+')':'drop-shadow(0 0 '+(60*eo(seg(t,.3,1.2))).toFixed(0)+'px rgba(253,188,42,.55))';
  rv($("a0"),seg(t,.15,.5));rv($("a1"),seg(t,.3,.6));$("a1").textContent=money(WP*eio(seg(t,.35,1.6)));rv($("a2"),seg(t,1.0,1.35));rv($("a3"),seg(t,1.25,1.6))}
 if(t>=2.6&&t<5.4){var o2=eo(seg(t,2.6,2.95))*(t>5.1?1-seg(t,5.1,5.4):1);sc("s2",o2);rv($("b0"),seg(t,2.6,2.9));rv($("b1"),seg(t,2.7,3.0));rv($("b2"),seg(t,2.85,3.15));
  ord.forEach(function(c,i){var e=$("cl"+i),p=seg(t,3.0+i*.16,3.4+i*.16);e.style.opacity=eo(p);e.style.transform='translateX('+((1-eo(p))*(c.s>0?-160:160))+'px)';
   if(c.s<0){var g=seg(t,3.9,4.3);e.style.boxShadow='0 0 0 '+(2.5*g)+'px rgba(255,77,99,.9)'}})}
 if(t>=5.2&&t<10.3){var o3=eo(seg(t,5.2,5.6))*(t>10?1-seg(t,10,10.3):1);sc("s3",o3);rv($("c0"),seg(t,5.25,5.55));rv($("c1"),seg(t,5.3,5.6));
  var k=eio(seg(t,5.9,7.9)),sw=eio(seg(t,8.0,8.6));
  MK.forEach(function(m){var v=PB[m]+(PA[m]-PB[m])*k,iB=OB.indexOf(m),iA=OA.indexOf(m),pos=mix(iB,iA,sw),e=$("r"+m),p=seg(t,5.35+iB*.12,5.75+iB*.12);
   e.style.top=(390+pos*160)+'px';e.style.opacity=eo(p);e.style.transform='translateY('+((1-eo(p))*40)+'px)';
   var w=Math.abs(v)*PX,b=$("b"+m);b.style.left=(v>=0?Z0-56:Z0-56-w)+'px';b.style.width=w+'px';b.style.background=v>=0?'linear-gradient(90deg,rgba(62,224,154,.35),#3ee09a)':'linear-gradient(270deg,rgba(255,77,99,.35),#ff4d63)';
   if(m===OA[0]&&k>.98){b.style.background='linear-gradient(90deg,rgba(253,188,42,.35),#fdbc2a)';e.style.borderColor='rgba(253,188,42,.8)';e.style.boxShadow='0 0 60px rgba(253,188,42,.22)'}else{e.style.borderColor='rgba(255,255,255,.08)';e.style.boxShadow=''}
   $("v"+m).textContent=money(v);$("v"+m).style.color=v>=0?'var(--up)':'var(--dn)';$("k"+m).textContent=String(Math.round(pos)+1);
   var dd=$("d"+m),q=seg(t,5.9,6.3);dd.style.opacity=eo(q)})
  var gk=eio(seg(t,8.3,9.5));$("gv").textContent='$'+Math.round(GB+(GA-GB)*gk).toLocaleString('en-US');rv($("gap"),seg(t,8.2,8.5))}
 if(t>=10.1){sc("s4",eo(seg(t,10.1,10.5)));var lp=seg(t,10.15,10.8);$("e0").style.opacity=eo(lp);$("e0").style.transform='scale('+(.7+.3*eo(lp))+')';rv($("e1"),seg(t,10.4,10.75));rv($("e2"),seg(t,10.6,10.95));rv($("e3"),seg(t,10.85,11.2))}
};
window.R(0);
</script>
