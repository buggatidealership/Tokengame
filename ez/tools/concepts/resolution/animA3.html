<style>

   each AI races in its own lane with its own money; at the close the wrong side shatters, the winner is crowned; standings; Next.

#fx{position:absolute;inset:0;z-index:30;pointer-events:none}
.row{position:absolute;left:60px;right:60px;height:160px;display:grid;grid-template-columns:70px 110px 1fr auto;align-items:center;gap:22px;padding:0 28px;border-radius:28px;background:rgba(10,14,12,.72);border:1.5px solid rgba(255,255,255,.08)}

 '<div id="startline" style="position:absolute;left:'+(SX-2)+'px;top:'+(LANEY[0]-110)+'px;width:4px;height:'+(LANEY[3]-LANEY[0]+220)+'px;background:rgba(255,255,255,.55);border-radius:2px"></div>'+

 X.save();X.translate(x,y);X.rotate(r+a);X.globalAlpha=cl(1-k/1.4);X.fillStyle=j%3?'#ff4d63':(j%2?'#e8ece9':MODELS[ORDER[seed]].bg);X.beginPath();X.moveTo(0,-s);X.lineTo(s*.7,s*.6);X.lineTo(-s*.6,s*.4);X.closePath();X.fill();X.restore()}
 var b=seg(t,t0,t0+.35);X.globalAlpha=(1-b)*.85;var g=X.createRadialGradient(cx,cy,0,cx,cy,160*(.5+b));g.addColorStop(0,'rgba(255,90,100,.95)');g.addColorStop(1,'rgba(255,40,60,0)');X.fillStyle=g;X.beginPath();X.arc(cx,cy,180,0,6.283);X.fill();X.globalAlpha=1}

   fl.style.opacity=(lit*(1-seg(t,T.flip[i]+.5,T.flip[i]+1.4))*.9+hold*.25)*(1-cp)});
 }

 if(t>=T.collapse[0]+.3&&t<T.std[0]+.4){$("L3").style.display='block';
