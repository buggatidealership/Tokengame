:root{--tx:#f5f1ea;--mu:#aab5ae;--up:#3ee09a;--dn:#ff4d63;--ac:#fdbc2a;--sans:Inter,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace}

.card{position:absolute;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;

.nm{font:800 44px/1 var(--sans);letter-spacing:-.02em}
.dir{font:900 58px/1 var(--mono);letter-spacing:.03em}
.u{color:var(--up)}.d{color:var(--dn)}

.tag{font:700 34px/1 var(--mono);letter-spacing:.22em;color:var(--ac)}

<style>
.spark{position:absolute;width:14px;height:14px;pointer-events:none}

<script>

var RN=72,RD=ROUNDS.filter(function(r){return r.n===RN})[0],ORDER=RD.calls.map(function(c){return c[0]});
var CALL={};RD.calls.forEach(function(c){CALL[c[0]]=c[1].indexOf('DOWN')===0?-1:1});
var right=ORDER.filter(function(m){return CALL[m]*RD.a>0});
function med(m,px){var M=MODELS[m];return '<span class="med" style="width:'+px+'px;height:'+px+'px"><span class="disc" style="background:'+M.bg+'"></span><svg viewBox="0 0 24 24"><path fill="'+M.fg+'"'+(M.fr?' fill-rule="'+M.fr+'"':'')+' d="'+M.d+'"/>'+(M.dot?'<path fill="'+M.dotc+'" d="'+M.dot+'"/>':'')+'</svg></span>'}

var B={b1:'Here’s what happened.',b2:'What happened next…',b3:'Then earnings dropped.',b4:'Then the market answered.'};

var CY=640;
function sparks(x,y,w,up,n,seed){var o='';for(var j=0;j<n;j++){var r=function(k){var v=Math.sin((seed*31+j*7+k)*127.1)*43758.5;return v-Math.floor(v)};var px=x+r(1)*w,py=up?y-24-r(2)*120:y+16+r(2)*90,sz=10+r(3)*18,al=.35+r(4)*.65;
 o+=up?'<span class="spark" style="left:'+px+'px;top:'+py+'px;width:'+sz+'px;height:'+sz+'px;color:'+(j%3?'#7dffc4':'#e9fff4')+';opacity:'+al+';transform:rotate('+(r(5)*45)+'deg)"></span>':'<span class="ember" style="left:'+px+'px;top:'+py+'px;width:'+(sz*.6)+'px;height:'+(sz*.6)+'px;background:'+(j%3?'#ff4d63':'#ffb3bd')+';opacity:'+al+';box-shadow:0 0 12px #ff4d63"></span>'}return o}
function cardAt(m,i,o){o=o||{};var x=cx(i)+(o.dx||0),y=CY+(o.dy||0),w=CW*(o.sx||1),h=CH*(o.sy||1),xx=x+(CW-w)/2,yy=y+(CH-h);
 var face=o.face,lit=o.lit,s=CALL[m],inner='';
 if(o.edge){return '<div class="shadow" style="left:'+(cx(i)+20)+'px;top:'+(CY+CH+18)+'px;width:'+(CW-40)+'px;opacity:.6"></div><div class="card" style="left:'+(cx(i)+CW/2-14)+'px;top:'+(y-30)+'px;width:28px;height:'+CH+'px;background:linear-gradient(90deg,#26302b,#0b0f0d);"></div>'+
   '<div class="trail" style="left:'+(cx(i)-10)+'px;top:'+(y+60)+'px;width:'+(CW+20)+'px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);height:4px"></div><div class="trail" style="left:'+(cx(i)-10)+'px;top:'+(y+CH-90)+'px;width:'+(CW+20)+'px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);height:4px"></div>'}
 var sh='<div class="shadow" style="left:'+(cx(i)+20+(o.lift||0)*.3)+'px;top:'+(CY+CH+18)+'px;width:'+(CW-40-(o.lift||0)*.4)+'px;opacity:'+(.8-(o.lift||0)/400)+'"></div>';
 if(face){inner=med(m,140)+'<div class="nm" style="margin-top:26px">'+MODELS[m].app+'</div><div class="dir '+(s>0?'u':'d')+'" style="margin-top:24px;transform:scale('+(o.stamp||1)+')">'+(s>0?'LONG':'SHORT')+'</div>'}else inner=BACK.replace(/W/g,130);
 return sh+'<div class="card'+(lit?(s>0?' lit-u':' lit-d'):'')+'" style="left:'+xx+'px;top:'+(yy-(o.lift||0))+'px;width:'+w+'px;height:'+h+'px;transform:rotate('+(o.rot||0)+'deg)">'+inner+'</div>'+(o.fx?sparks(cx(i),s>0?yy-(o.lift||0):yy+CH-(o.lift||0),CW,s>0,o.fx,i+1):'')}
var FR={
 /* 2a: the logo has hopped up into the header (squash on take-off, stretch on the way, bounce on landing, a dust ring); the line writes on; cards drop in from below, one mid-air stretched, the others landed with a squash */
 '2a':function(){return hdr()+'<div class="ring" style="left:376px;top:34px;width:116px;height:116px;border-color:rgba(255,255,255,.22)"></div><div class="line" style="top:330px">'+HH+'</div>'+
   cardAt(ORDER[0],0,{sx:1.06,sy:.9})+cardAt(ORDER[1],1,{sx:1.02,sy:.97})+cardAt(ORDER[2],2,{sx:.9,sy:1.12,lift:80})+cardAt(ORDER[3],3,{dy:470,sx:.92,sy:1.1})},

 '2b':function(){return hdr()+'<div class="line" style="top:330px">'+HH+'</div>'+cardAt(ORDER[0],0,{face:1,lit:1,fx:16,stamp:1.18})+cardAt(ORDER[1],1,{edge:1,dy:-40})+cardAt(ORDER[2],2,{})+cardAt(ORDER[3],3,{})},

   [[2,0.55],[3,0.3]].map(function(a){var i=a[0],k=a[1],sx=cx(i)+CW/2,sy=CY+150,ex=130,ey=675,mx=(sx+ex)/2,my=Math.min(sy,ey)-260;return '<path d="M'+sx+','+sy+' Q'+mx+','+my+' '+ex+','+ey+'" fill="none" stroke="rgba(253,188,42,.25)" stroke-width="4" stroke-dasharray="4 14"/>'}).join('')+'</svg>';
   o+='<div style="position:absolute;left:100px;top:'+(675-40)+'px">'+med(ORDER[0],64)+'</div><div style="position:absolute;left:112px;top:'+(675-52)+'px">'+med(ORDER[1],64)+'</div><div class="ring" style="left:80px;top:615px;width:110px;height:110px;border-color:rgba(253,188,42,.5)"></div>';
   o+='<div style="position:absolute;left:470px;top:330px;transform:scale(1.1)">'+med(ORDER[2],96)+'</div><div style="position:absolute;left:'+(cx(3)+60)+'px;top:'+(CY+40)+'px;transform:scale(1.6) rotate(-12deg)">'+med(ORDER[3],96)+'</div>';
   return o+'<div class="line" style="top:860px;opacity:.0">.</div>'}
};
document.getElementById('S').innerHTML=FR[F]();
</script>
