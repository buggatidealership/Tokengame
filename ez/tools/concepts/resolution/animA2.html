<!doctype html><meta charset="utf-8"><title>Resolution A2: one idea per shot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Geist+Mono:wght@600;700;800&display=swap">
<style>
/* Resolution animation A2 (2026-11-08): A rebuilt after the owner's notes: one subject per shot, at most ~5 words on screen,
   every text held long enough to read, the camera carries the transitions. One world 1080x2700: the sky (P&L race) on top,
   the stage (cards on the red floor) below; the camera travels between them. R72 Reddit, flat $100K, long/short only. */
:root{--tx:#f5f1ea;--mu:#aab5ae;--up:#3ee09a;--dn:#ff4d63;--ac:#fdbc2a;--sans:Inter,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}body{width:1080px;height:1350px;overflow:hidden;font-family:var(--sans);color:var(--tx);background:#050806;position:relative}
#cam{position:absolute;inset:0;overflow:hidden}
#world{position:absolute;left:0;top:0;width:1080px;height:2700px;transform-origin:0 0}
#bg{position:absolute;inset:0;background:url(../launchvid/hedra/img/stage-2k.jpg) center/cover}
#bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,6,.15),rgba(5,8,6,0) 30%,rgba(5,8,6,.2) 55%,rgba(5,8,6,0) 80%)}
.card{position:absolute;width:210px;height:340px;perspective:1400px}
.cin{position:absolute;inset:0;transform-style:preserve-3d}
.side{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:linear-gradient(180deg,#121a16 0%,#0b0f0d 55%,#140b0b 100%);
 box-shadow:inset 0 2px 0 rgba(140,255,200,.35),inset 0 30px 46px -24px rgba(46,190,122,.35),inset 0 -28px 46px -24px rgba(255,58,49,.3),0 0 0 1.5px rgba(255,255,255,.08),0 30px 60px rgba(0,0,0,.55)}
.back svg{width:120px;height:120px;opacity:.95}
.front{transform:rotateY(180deg)}
.med{position:relative;width:118px;height:118px;border-radius:50%;display:grid;place-items:center}
.med:before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 200deg,#5d6661,#e8ece9,#6f7873,#2f3532,#cfd5d1,#5d6661)}
.med .disc{position:absolute;inset:0;border-radius:50%}.med svg{position:relative;width:54%;height:54%}
.nm{margin-top:22px;font:800 38px/1 var(--sans);letter-spacing:-.02em}
.dir{margin-top:22px;font:900 50px/1 var(--mono);letter-spacing:.04em}
.u{color:var(--up)}.d{color:var(--dn)}
.money{margin-top:10px;font:900 40px/1 var(--mono);letter-spacing:-.04em;color:var(--ac);opacity:0}
.shadow{position:absolute;left:-12%;right:-12%;bottom:-20px;height:40px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.8),transparent)}
#race{position:absolute;left:0;top:0;width:1080px;height:1350px}
.rider{position:absolute;display:flex;align-items:center;gap:16px;transform:translate(-10px,-50%)}
.rider .lg{display:flex}.rider .lg span{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,255,255,.8),0 10px 24px rgba(0,0,0,.6)}
.rider .lg span+span{margin-left:-24px}.rider .lg svg{width:58%;height:58%}
.rider b{font:900 54px/1 var(--mono);letter-spacing:-.05em;text-shadow:0 6px 24px rgba(0,0,0,.75)}
.hud{position:absolute;left:0;right:0;text-align:center;z-index:20;pointer-events:none}
.t1{font:800 92px/1.05 var(--sans);letter-spacing:-.04em;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.brand{position:absolute;left:44px;top:40px;display:flex;align-items:center;gap:12px;font:800 26px/1 var(--sans);letter-spacing:-.02em;z-index:30;opacity:.9}.brand .e{color:#03c870}.brand .z{color:#ff3a31}
.clock{position:absolute;right:56px;top:150px;font:800 46px/1 var(--mono);letter-spacing:-.02em;color:var(--mu);z-index:20}
#rlogo{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:25}
#rlogo .disc{width:380px;height:380px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6)}
#rlogo .disc img{width:78%;height:78%;object-fit:contain}
#rlogo .w{margin-top:46px;font:800 104px/1 var(--sans);letter-spacing:-.04em}
#endc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:25;background:radial-gradient(70% 50% at 50% 45%,rgba(5,8,6,.985),rgba(5,8,6,1))}
#endc .a{margin-top:56px;font:800 84px/1.05 var(--sans);letter-spacing:-.04em}
#endc .b{margin-top:30px;font:800 70px/1 var(--mono);letter-spacing:-.03em;color:var(--ac)}
</style>
<div id="cam"><div id="world"><div id="bg"></div><svg id="race" viewBox="0 0 1080 1350"></svg><div id="riders"></div><div id="cards"></div></div></div>

var CX=[150,410,670,930],BASE=2330,CW=210,CH=340;
