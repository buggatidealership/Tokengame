:root{--tx:#f5f1ea;--mu:#aab5ae;--up:#3ee09a;--dn:#ff4d63;--ac:#fdbc2a;--sans:Inter,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace}

#bg{position:absolute;inset:0;background:url(../launchvid/hedra/img/bk2-gloss-gr3.jpg) center/100% 100% no-repeat}

.big{position:absolute;left:0;right:0;text-align:center}

.med .disc{position:absolute;inset:0;border-radius:50%}.med svg{position:relative;width:54%;height:54%}
.card{position:absolute;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:linear-gradient(180deg,#121a16 0%,#0b0f0d 55%,#140b0b 100%);box-shadow:inset 0 2px 0 rgba(140,255,200,.3),0 0 0 1.5px rgba(255,255,255,.08),0 30px 60px rgba(0,0,0,.55)}

.dir{font:900 58px/1 var(--mono);letter-spacing:.03em}
.u{color:var(--up)}.d{color:var(--dn)}

.tag{font:700 34px/1 var(--mono);letter-spacing:.22em;color:var(--ac)}

var RN=72,RD=ROUNDS.filter(function(r){return r.n===RN})[0],ORDER=RD.calls.map(function(c){return c[0]});

function head(){var d='Oct 29 → Oct 30';return '<div style="position:absolute;left:120px;right:56px;top:46px;display:flex;align-items:center;gap:20px;z-index:6">'+co(RD.ticker,92)+'<div><div style="font:800 46px/1 var(--sans);letter-spacing:-.03em">'+RD.co+'</div><div style="margin-top:10px;display:inline-block;padding:5px 12px;border-radius:8px;background:rgba(253,188,42,.16);color:#fdbc2a;font:700 22px/1 var(--mono);letter-spacing:.08em">ROUND '+RN+'</div></div><div style="margin-left:auto;text-align:right;font:600 24px/1.4 var(--mono);color:#8d9791">'+d+'<br>+'+Math.round(P*24)+' h</div></div>'}

 var vals={},lo=0,hi=0;ORDER.forEach(function(m){pts.forEach(function(k){var v=pnl(m,VS[k]);lo=Math.min(lo,v);hi=Math.max(hi,v)});vals[m]=pnl(m,mv);lo=Math.min(lo,vals[m]);hi=Math.max(hi,vals[m])});

 g+='<line x1="'+X0+'" x2="'+X1+'" y1="'+sy(0)+'" y2="'+sy(0)+'" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="8 10"/>';
 var lead=ORDER.slice().sort(function(a,b){return vals[b]-vals[a]})[0];

 ORDER.forEach(function(m){var d='';pts.forEach(function(k,j){d+=(j?'L':'M')+sx(k).toFixed(1)+','+sy(pnl(m,VS[k])).toFixed(1)});d+='L'+sx(n).toFixed(1)+','+sy(vals[m]).toFixed(1);

}else{
 var lo=1e9,hi=-1e9;pts.concat([n]).forEach(function(k){var v=p0*(1+vAt(k)/100);lo=Math.min(lo,v);hi=Math.max(hi,v)});var pad=(hi-lo)*.15+1;lo-=pad;hi+=pad;function sy(v){return Y1-(Y1-Y0)*(v-lo)/(hi-lo)}

 var d='';pts.forEach(function(k,j){d+=(j?'L':'M')+sx(k).toFixed(1)+','+sy(p0*(1+VS[k]/100)).toFixed(1)});d+='L'+sx(n).toFixed(1)+','+sy(pr).toFixed(1);

 o+='<div style="position:absolute;left:'+(sx(n)-34)+'px;top:'+(sy(pr)-34)+'px;z-index:4">'+co(RD.ticker,68)+'</div>'+pill(sy(pr),'$'+pr.toFixed(2),col,'#fff');
