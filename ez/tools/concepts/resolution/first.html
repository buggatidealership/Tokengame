<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Geist+Mono:wght@600;700;800&display=swap">
<style>
/* Resolution video, scene 1 (the first frame, also the post's thumbnail on X): six takes on the locked G3 ground. ?v=A..F. R72 Reddit, data from ez-data.js. */
:root{--tx:#f5f1ea;--mu:#aab5ae;--up:#3ee09a;--dn:#ff4d63;--ac:#fdbc2a;--sans:Inter,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}body{width:1080px;height:1350px;overflow:hidden;font-family:var(--sans);color:var(--tx);background:#000;position:relative}
#bg{position:absolute;inset:0;background:url(../launchvid/hedra/img/bk2-gloss-gr3.jpg) center/100% 100% no-repeat}
.brand{position:absolute;left:44px;top:40px;z-index:40;opacity:.9}
.big{position:absolute;left:0;right:0;text-align:center}
.med{position:relative;border-radius:50%;display:grid;place-items:center;flex:none}
.med:before{content:"";position:absolute;inset:-7%;border-radius:50%;background:conic-gradient(from 200deg,#5d6661,#e8ece9,#6f7873,#2f3532,#cfd5d1,#5d6661)}
.med .disc{position:absolute;inset:0;border-radius:50%}.med svg{position:relative;width:54%;height:54%}
.card{position:absolute;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:linear-gradient(180deg,#121a16 0%,#0b0f0d 55%,#140b0b 100%);box-shadow:inset 0 2px 0 rgba(140,255,200,.3),0 0 0 1.5px rgba(255,255,255,.08),0 30px 60px rgba(0,0,0,.55)}
.nm{font:800 44px/1 var(--sans);letter-spacing:-.02em}
.dir{font:900 58px/1 var(--mono);letter-spacing:.03em}
.u{color:var(--up)}.d{color:var(--dn)}
.lit-u{box-shadow:0 0 0 4px rgba(62,224,154,.9),0 0 90px rgba(62,224,154,.45),inset 0 0 70px rgba(62,224,154,.25)}
.lit-d{box-shadow:0 0 0 4px rgba(255,77,99,.9),0 0 90px rgba(255,77,99,.45),inset 0 0 70px rgba(255,77,99,.25)}
.tag{font:700 34px/1 var(--mono);letter-spacing:.22em;color:var(--ac)}
</style>
<div id="bg"></div>
<svg class="brand" width="54" height="54" viewBox="0 0 400 400"><circle cx="198.7" cy="199.4" r="198.2" fill="#04070e"/><path fill="#f8f0d9" d="M116.8,88.0 L86.2,152.0 L102.1,152.0 L55.0,274.5 L154.2,274.5 L188.5,225.8 L128.7,225.8 L137.5,204.0 L170.2,203.5 L193.2,162.0 L149.1,162.0 L154.8,145.0 L143.4,138.5 L217.9,138.2 L192.2,182.0 L234.9,182.0 L181.5,250.8 L136.0,315.8 L272.5,315.8 L292.5,265.0 L230.4,265.0 L328.2,130.8 L225.1,130.8 L253.0,87.8 Z"/><path fill="#03c870" d="M146.2,287.0 L133.0,287.0 L106.5,327.2 L119.0,326.5 Z M86.8,169.5 L74.8,169.5 L29.5,282.2 L43.7,282.2 Z M105.8,92.5 L89.5,95.8 L55.5,169.2 L69.0,169.2 Z"/><path fill="#ff3a31" d="M304.5,259.0 L300.5,269.5 L313.0,268.2 L317.0,258.8 Z M361.5,126.0 L344.0,126.5 L269.5,235.8 L256.0,257.5 L276.2,257.0 Z M279.0,87.8 L266.7,87.5 L251.5,117.2 L262.2,119.0 Z"/><path fill="#fdbc2a" d="M334.2,281.2 L302.0,281.2 L288.2,315.8 L321.0,315.5 Z"/></svg>
<div id="S"></div>
<script src="../../../ez-data.js"></script>
<script>
var BACK='<svg width="W" height="W" viewBox="0 0 400 400"><circle cx="198.7" cy="199.4" r="198.2" fill="#04070e"/><path fill="#f8f0d9" d="M116.8,88.0 L86.2,152.0 L102.1,152.0 L55.0,274.5 L154.2,274.5 L188.5,225.8 L128.7,225.8 L137.5,204.0 L170.2,203.5 L193.2,162.0 L149.1,162.0 L154.8,145.0 L143.4,138.5 L217.9,138.2 L192.2,182.0 L234.9,182.0 L181.5,250.8 L136.0,315.8 L272.5,315.8 L292.5,265.0 L230.4,265.0 L328.2,130.8 L225.1,130.8 L253.0,87.8 Z"/><path fill="#03c870" d="M146.2,287.0 L133.0,287.0 L106.5,327.2 L119.0,326.5 Z M86.8,169.5 L74.8,169.5 L29.5,282.2 L43.7,282.2 Z M105.8,92.5 L89.5,95.8 L55.5,169.2 L69.0,169.2 Z"/><path fill="#ff3a31" d="M304.5,259.0 L300.5,269.5 L313.0,268.2 L317.0,258.8 Z M361.5,126.0 L344.0,126.5 L269.5,235.8 L256.0,257.5 L276.2,257.0 Z M279.0,87.8 L266.7,87.5 L251.5,117.2 L262.2,119.0 Z"/><path fill="#fdbc2a" d="M334.2,281.2 L302.0,281.2 L288.2,315.8 L321.0,315.5 Z"/></svg>';
var RN=72,RD=ROUNDS.filter(function(r){return r.n===RN})[0],ORDER=RD.calls.map(function(c){return c[0]});
var CALL={};RD.calls.forEach(function(c){CALL[c[0]]=c[1].indexOf('DOWN')===0?-1:1});
var right=ORDER.filter(function(m){return CALL[m]*RD.a>0});
function med(m,px){var M=MODELS[m];return '<span class="med" style="width:'+px+'px;height:'+px+'px"><span class="disc" style="background:'+M.bg+'"></span><svg viewBox="0 0 24 24"><path fill="'+M.fg+'"'+(M.fr?' fill-rule="'+M.fr+'"':'')+' d="'+M.d+'"/>'+(M.dot?'<path fill="'+M.dotc+'" d="'+M.dot+'"/>':'')+'</svg></span>'}
function co(t,px){var L=CO_LOGOS[t];return '<span style="width:'+px+'px;height:'+px+'px;border-radius:50%;background:#fff;display:inline-grid;place-items:center;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)">'+(L?'<img src="../../../media/'+L.f+'" style="width:76%;height:76%;object-fit:contain">':'')+'</span>'}
function card(m,x,y,w,h,face,lit){var s=CALL[m];return '<div class="card'+(lit?(s>0?' lit-u':' lit-d'):'')+'" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px">'+(face?med(m,Math.round(w*.56))+'<div class="nm" style="margin-top:26px">'+MODELS[m].app+'</div><div class="dir '+(s>0?'u':'d')+'" style="margin-top:24px">'+(s>0?'LONG':'SHORT')+'</div>':BACK.replace(/W/g,Math.round(w*.52)))+'</div>'}
var CW=252,CH=430,G=12,X0=(1080-(4*CW+3*G))/2;function cx(i){return X0+i*(CW+G)}
var mv=(RD.a<0?'−':'+')+Math.abs(RD.a).toFixed(2)+'%';
var V={
 /* A: today's opening: the company alone */
 A:function(){return '<div class="big" style="top:360px">'+co(RD.ticker,360)+'</div><div class="big" style="top:780px;font:800 104px/1 var(--sans);letter-spacing:-.04em">'+RD.co+'</div><div class="big tag" style="top:920px">EARNINGS · ROUND '+RN+'</div>'},
 /* B: the question: company + "Who called it?" over the four AIs, sides hidden */
 B:function(){return '<div class="big" style="top:150px">'+co(RD.ticker,220)+'</div><div class="big" style="top:420px;font:800 92px/1.05 var(--sans);letter-spacing:-.04em">'+RD.co+' earnings.</div><div class="big" style="top:540px;font:900 120px/1 var(--sans);letter-spacing:-.05em;color:var(--ac)">Who called it?</div>'+
   '<div style="position:absolute;left:0;right:0;top:860px;display:flex;justify-content:center;gap:56px">'+ORDER.map(function(m){return '<div style="text-align:center">'+med(m,170)+'<div class="nm" style="margin-top:22px;font-size:36px">'+MODELS[m].app+'</div></div>'}).join('')+'</div>'},
 /* C: the face-off: the four calls already face up and lit, the company above, "Locked before earnings." */
 C:function(){return '<div class="big" style="top:140px">'+co(RD.ticker,200)+'</div><div class="big" style="top:375px;font:800 80px/1.05 var(--sans);letter-spacing:-.04em">'+RD.co+' earnings</div><div class="big tag" style="top:480px">LOCKED BEFORE THE REPORT</div>'+ORDER.map(function(m,i){return card(m,cx(i),640,CW,CH,1,1)}).join('')+'<div class="big" style="top:1140px;font:800 60px/1 var(--sans);letter-spacing:-.03em">Who called it?</div>'},
 /* D: sealed: four face-down EZ cards, the company on top; the mystery before the flips */
 D:function(){var rot=[-9,-3,3,9];return '<div class="big" style="top:150px">'+co(RD.ticker,200)+'</div><div class="big" style="top:385px;font:800 84px/1 var(--sans);letter-spacing:-.04em">'+RD.co+'</div>'+
   ORDER.map(function(m,i){return '<div style="position:absolute;left:0;top:0;transform:translate('+(cx(i))+'px,'+(640+Math.abs(i-1.5)*26)+'px) rotate('+rot[i]+'deg);transform-origin:50% 120%">'+card(m,0,0,CW,CH,0,0)+'</div>'}).join('')+'<div class="big" style="top:500px;font:700 46px/1 var(--sans);color:#d9e2dc">4 AIs. 4 sealed calls.</div><div class="big" style="top:1150px;font:900 70px/1 var(--sans);letter-spacing:-.04em;color:var(--ac)">Who called it?</div>'},
 /* E: outcome first (cold open): the move huge, then how many saw it */
 E:function(){return '<div class="big" style="top:170px">'+co(RD.ticker,200)+'</div><div class="big" style="top:400px;font:800 72px/1 var(--sans);letter-spacing:-.03em">'+RD.co+' earnings</div><div class="big" style="top:520px;font:900 250px/1 var(--mono);letter-spacing:-.07em;color:'+(RD.a<0?'var(--dn)':'var(--up)')+';text-shadow:0 0 90px '+(RD.a<0?'rgba(255,77,99,.35)':'rgba(62,224,154,.35)')+'">'+mv+'</div>'+
   '<div style="position:absolute;left:0;right:0;top:880px;display:flex;justify-content:center;gap:48px">'+ORDER.map(function(m){var ok=right.indexOf(m)>=0;return '<div style="opacity:'+(ok?1:.32)+';filter:'+(ok?'none':'grayscale(1)')+'">'+med(m,150)+'</div>'}).join('')+'</div><div class="big" style="top:1110px;font:800 66px/1 var(--sans);letter-spacing:-.03em">'+right.length+' of 4 AIs saw it.</div>'},
 /* F: the split: bulls against bears, "3 vs 1" as the hook */
 F:function(){var L=ORDER.filter(function(m){return CALL[m]>0}),S=ORDER.filter(function(m){return CALL[m]<0});
   function side(arr,x,col,word){return '<div style="position:absolute;left:'+x+'px;width:470px;top:600px;text-align:center"><div class="dir '+col+'" style="font-size:66px">'+word+'</div><div style="margin-top:44px;display:flex;flex-wrap:wrap;justify-content:center;gap:26px">'+arr.map(function(m){return '<div>'+med(m,arr.length>2?130:180)+'<div class="nm" style="font-size:32px;margin-top:16px">'+MODELS[m].app+'</div></div>'}).join('')+'</div></div>'}
   return '<div class="big" style="top:140px">'+co(RD.ticker,200)+'</div><div class="big" style="top:375px;font:800 80px/1.05 var(--sans);letter-spacing:-.04em">'+RD.co+' earnings</div><div class="big" style="top:470px;font:900 110px/1 var(--sans);letter-spacing:-.04em"><span class="u">'+L.length+'</span> <span style="color:var(--mu);font-size:70px">vs</span> <span class="d">'+S.length+'</span></div>'+
   side(L,40,'u','LONG')+'<div style="position:absolute;left:539px;top:620px;width:2px;height:520px;background:linear-gradient(transparent,rgba(255,255,255,.25),transparent)"></div>'+side(S,570,'d','SHORT')+'<div class="big" style="top:1170px;font:800 60px/1 var(--sans);letter-spacing:-.03em;color:var(--ac)">Who called it?</div>'}
};
var v=(location.search.match(/v=(\w)/)||[0,'A'])[1];document.getElementById('S').innerHTML=V[v]();
</script>
