<!doctype html><meta charset="utf-8"><title>EZ Earnings Night · V2 Broadcast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@500;600;700;800&display=swap">
<style>
/* V2 "Broadcast": the resolution video as a sports broadcast package. 1080x1350, window.R(t), 25 s.
   Data: ez-data.js (ROUNDS, UPCOMING, PENDING, MODELS, CO_LOGOS, CAPS) and resolution/paths.js (PATHS). ?r=<round> picks the round (default 72). */
:root{--ink:#04070e;--bar:#0b0f17;--bar2:#121824;--cream:#f8f0d9;--mut:#8d95a3;--up:#03c870;--dn:#ff3a31;--gold:#fdbc2a;
 --cd:"Barlow Condensed",system-ui,sans-serif;--sn:Barlow,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--ink)}
body{font-family:var(--sn);color:var(--cream);position:relative;font-variant-numeric:tabular-nums}
#G{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.cd{font-family:var(--cd)}
.med{position:relative;border-radius:50%;display:inline-grid;place-items:center;flex:none;box-shadow:0 0 0 3px rgba(248,240,217,.16)}
.med svg{width:56%;height:56%}
.co{border-radius:50%;background:#fff;display:inline-grid;place-items:center;overflow:hidden;flex:none}
.co img{width:74%;height:74%;object-fit:contain}
.sl{clip-path:polygon(var(--k,18px) 0,100% 0,calc(100% - var(--k,18px)) 100%,0 100%)}
</style>
<div id="G"></div>
<script src="../../../../ez-data.js"></script><script src="../../resolution/paths.js"></script>
<script>
(function(){
/* ---------- data (never typed) ---------- */
var RN=+((location.search.match(/[?&]r=(\d+)/)||[])[1]||72);
var RD=ROUNDS.filter(function(r){return r.n===RN})[0];
var ORDER=RD.calls.map(function(c){return c[0]});
var SIDE={},MAG={};RD.calls.forEach(function(c){SIDE[c[0]]=/^DOWN/.test(c[1])?-1:1;MAG[c[0]]=parseFloat(String(c[1]).replace(/[^0-9.]/g,''))});
var LC={GROK:'#e4e0d6',CLAUDE:'#ef8a55',GPT:'#b18cff',KIMI:'#58b7ff'};
var WIN=(RD.win||'').split('&').map(function(s){return s.trim()}).filter(function(s){return MODELS[s]});
var RIGHT=ORDER.filter(function(m){return SIDE[m]*RD.a>0});
function pnl(m,v){return 10000*MAG[m]*SIDE[m]*v/100}           /* sized: $10K per 1% the AI predicted */
function money(v){var a=Math.round(Math.abs(v));return (v<0?'−':'+')+'$'+a.toLocaleString('en-US')}
function pct(v,d){return (v<0?'−':'+')+Math.abs(v).toFixed(d==null?2:d)+'%'}
function name(m){return MODELS[m].app}
function pd(s){var m=String(s||'').match(/(\d+)\/(\d+)\/(\d+)/);return m?new Date(Date.UTC(2000+(+m[3]%100),+m[1]-1,+m[2])):null}
function day(d,o){return d.toLocaleDateString('en-US',Object.assign({timeZone:'UTC'},o))}
var D0=pd(RD.called),D1=pd(RD.resolves);
/* the path: scaled so its last point equals the sheet's move. No path: the night is skipped (result at the bell). */
var PT=(window.PATHS||{})[RN],VS=null,NP=0;
if(PT){var pp=PT.path;NP=pp.length;var kk=(RD.a/100)/((pp[NP-1]/PT.p0)-1);VS=pp.map(function(v){return (v/PT.p0-1)*kk*100});VS[NP-1]=RD.a}
var KOPEN=NP?NP-1-26:0;   /* 15-minute closes: the last is 4:00 pm, so 9:30 am is 26 steps earlier */
/* next fixture: the first trade day strictly after this round closed, its companies biggest first */
var ALL=[].concat(ROUNDS,window.UPCOMING||[],window.PENDING||[]);
var after=ALL.filter(function(r){var d=pd(r.called);return d&&d>D1}).sort(function(a,b){return pd(a.called)-pd(b.called)});
var NXD=after.length?pd(after[0].called):null;
var NX=NXD?after.filter(function(r){return +pd(r.called)===+NXD}).sort(function(a,b){return ((CAPS||{})[b.ticker]||0)-((CAPS||{})[a.ticker]||0)}).slice(0,3):[];
var CO=CO_LOGOS[RD.ticker]||{},COC=CO.c||'#fdbc2a';
/* the book after the bell: final P&L, order */
var FIN={};ORDER.forEach(function(m){FIN[m]=pnl(m,RD.a)});
var FORD=ORDER.slice().sort(function(a,b){return FIN[b]-FIN[a]||ORDER.indexOf(a)-ORDER.indexOf(b)});

/* ---------- art helpers ---------- */
var LOGO='<svg viewBox="0 0 400 400" width="W" height="W"><circle cx="198.7" cy="199.4" r="198.2" fill="#04070e"/><path fill="#f8f0d9" d="M116.8,88.0 L86.2,152.0 L102.1,152.0 L55.0,274.5 L154.2,274.5 L188.5,225.8 L128.7,225.8 L137.5,204.0 L170.2,203.5 L193.2,162.0 L149.1,162.0 L154.8,145.0 L143.4,138.5 L217.9,138.2 L192.2,182.0 L234.9,182.0 L181.5,250.8 L136.0,315.8 L272.5,315.8 L292.5,265.0 L230.4,265.0 L328.2,130.8 L225.1,130.8 L253.0,87.8 Z"/><path fill="#03c870" d="M146.2,287.0 L133.0,287.0 L106.5,327.2 L119.0,326.5 Z M86.8,169.5 L74.8,169.5 L29.5,282.2 L43.7,282.2 Z M105.8,92.5 L89.5,95.8 L55.5,169.2 L69.0,169.2 Z"/><path fill="#ff3a31" d="M304.5,259.0 L300.5,269.5 L313.0,268.2 L317.0,258.8 Z M361.5,126.0 L344.0,126.5 L269.5,235.8 L256.0,257.5 L276.2,257.0 Z M279.0,87.8 L266.7,87.5 L251.5,117.2 L262.2,119.0 Z"/><path fill="#fdbc2a" d="M334.2,281.2 L302.0,281.2 L288.2,315.8 L321.0,315.5 Z"/></svg>';
function logo(px){return LOGO.replace(/W/g,px)}
function med(m,px,ring){var M=MODELS[m];return '<span class="med" style="width:'+px+'px;height:'+px+'px;background:'+M.bg+';box-shadow:0 0 0 '+Math.max(3,px*.045).toFixed(1)+'px '+(ring||LC[m])+'"><svg viewBox="0 0 24 24"><path fill="'+M.fg+'"'+(M.fr?' fill-rule="'+M.fr+'"':'')+' d="'+M.d+'"/>'+(M.dot?'<path fill="'+M.dotc+'" d="'+M.dot+'"/>':'')+'</svg></span>'}
function co(t,px){var L=CO_LOGOS[t],u=LG[t]||(L?'../../../../media/'+L.f:'');return '<span class="co" style="width:'+px+'px;height:'+px+'px">'+(u?'<img src="'+u+'">':'')+'</span>'}
/* logos trimmed to their ink; a wordmark (wider than 1.8:1) is cut to its leading symbol, so it reads in a disc */
var LG={};function prepLogo(t){var L=CO_LOGOS[t];if(!L)return Promise.resolve();return new Promise(function(res){var im=new Image();im.onload=function(){try{var W=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');x.drawImage(im,0,0);var d=x.getImageData(0,0,W,H).data;
 function ink(i){return d[i+3]>40&&!(d[i]>235&&d[i+1]>235&&d[i+2]>235)}
 var col=new Array(W).fill(0),x0=W,x1=-1,y0=H,y1=-1;for(var yy=0;yy<H;yy++)for(var xx=0;xx<W;xx++)if(ink((yy*W+xx)*4)){col[xx]=1;if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}
 if(x1<0)return res();
 if((x1-x0)/(y1-y0+1)>1.8){var gap=0,e=x0;for(var xx=x0;xx<=x1;xx++){if(!col[xx]){gap++;if(gap>(y1-y0)*.12){e=xx-gap;break}}else gap=0}x1=e;y0=H;y1=-1;for(var yy=0;yy<H;yy++)for(var xx=x0;xx<=x1;xx++)if(ink((yy*W+xx)*4)){if(yy<y0)y0=yy;if(yy>y1)y1=yy}}
 var w=x1-x0+1,h=y1-y0+1,S=Math.max(w,h),o=document.createElement('canvas');o.width=o.height=S;o.getContext('2d').drawImage(c,x0,y0,w,h,(S-w)/2,(S-h)/2,w,h);LG[t]=o.toDataURL()}catch(e){}res()};im.onerror=function(){res()};im.src='../../../../media/'+L.f})}
function tri(up,px,col){return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 20 20" style="flex:none"><path d="'+(up?'M10 3 L18 16 L2 16 Z':'M10 17 L18 4 L2 4 Z')+'" fill="'+col+'"/></svg>'}
function fitW(txt,w,px,up){var c=fitW.c||(fitW.c=document.createElement('canvas').getContext('2d'));c.font=(up?'':'italic ')+'900 '+px+'px "Barlow Condensed"';var m=c.measureText(txt).width;return m>w?Math.floor(px*w/m):px}
function crown(px){return '<svg width="'+px+'" height="'+(px*.7).toFixed(0)+'" viewBox="0 0 64 44" style="flex:none"><path d="M4 40 L8 10 L22 26 L32 4 L42 26 L56 10 L60 40 Z" fill="#fdbc2a"/></svg>'}
function sideChip(m,fs){var s=SIDE[m];return '<span class="cd" style="display:inline-flex;align-items:center;gap:'+(fs*.18)+'px;padding:'+(fs*.14)+'px '+(fs*.32)+'px;background:'+(s>0?'var(--up)':'var(--dn)')+';color:#04070e;font-weight:800;font-size:'+fs+'px;line-height:1;letter-spacing:.02em;clip-path:polygon('+(fs*.22)+'px 0,100% 0,calc(100% - '+(fs*.22)+'px) 100%,0 100%)">'+(s>0?'LONG':'SHORT')+' '+MAG[m]+'%</span>'}

/* ---------- time ---------- */
function cl(x){return x<0?0:x>1?1:x}function seg(t,a,b){return cl((t-a)/(b-a))}
function eo(x){return 1-Math.pow(1-x,3)}function ei(x){return x*x*x}function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function lerp(a,b,x){return a+(b-a)*x}
/* beats (s) */
var T={fx0:0,st0:3.35,st1:4.0,lu1:7.6,tw1:8.1,L0:8.1,LR:8.5,L1:10.2,L2:11.4,L3:15.2,fin:15.2,po:18.0,nx:22.0,end:25.0};
if(!NP){/* no intraday path: the night is skipped, the tower settles at the bell, the film is 6.6 s shorter */
 var dd=T.L3-T.L0-.5;T.LR=T.L1=T.L2=T.L0;T.L3=T.L0+.5;['fin','po','nx','end'].forEach(function(k){T[k]-=dd})}
var XC=/\.[A-Z]+$/.test(RD.ticker)||/^\d/.test(RD.ticker);  /* a non-US listing: its own close, so no New York clock times */  /* no path: straight to the bell */
/* path index k at time t: the first hour (the report lands), overnight fast-forward, the session */
var K1=NP?Math.min(4,NP-1):0;
function kAt(t){if(!NP)return t>=T.L3?1:0;if(t<=T.L0)return 0;if(t<=T.LR)return 0;if(t<T.L1)return lerp(0,K1,eo(seg(t,T.LR,T.L1)));if(t<T.L2)return lerp(K1,KOPEN,eio(seg(t,T.L1,T.L2)));if(t<T.L3)return lerp(KOPEN,NP-1,seg(t,T.L2,T.L3));return NP-1}
function vAt(k){if(!NP)return k>=1?RD.a:0;var a=Math.floor(k);if(a>=NP-1)return VS[NP-1];return VS[a]+(VS[a+1]-VS[a])*(k-a)}
/* New York clock: index 0 is the report (4:05 pm), index i>0 is 4:00 pm + 15i min */
function minsAt(k){var m=k<1?lerp(16*60+5,16*60+15,k):16*60+15*k;return m}
function clockAt(k,fin){var m=fin?16*60+24*60:Math.round(minsAt(k)),nd=m>=24*60,mm=m%(24*60),h=Math.floor(mm/60),mi=mm%60;
 return {d:day(nd?D1:D0,{weekday:'short'}).toUpperCase()+' '+day(nd?D1:D0,{month:'short',day:'numeric'}).toUpperCase(),t:((h%12)||12)+':'+String(mi).padStart(2,'0')+' '+(h>=12?'PM':'AM')}}
function phaseAt(k){if(!NP)return 'CLOSE';if(k>=NP-1-1e-6)return 'CLOSE';if(k>=KOPEN)return 'MARKET OPEN';var m=minsAt(k)%(24*60);return (m>=16*60&&m<20*60)?'AFTER HOURS':'OVERNIGHT'}
/* tower order and its changes, precomputed so R(t) stays stateless */
function orderAtK(k){var v=vAt(k);if(Math.abs(v)<1e-9)return ORDER.slice();return ORDER.slice().sort(function(a,b){return pnl(b,v)-pnl(a,v)||ORDER.indexOf(a)-ORDER.indexOf(b)})}
var EV=[{t:-1,o:ORDER.slice()}];(function(){for(var t=T.L0;t<=T.L3+.2;t+=1/240){var o=orderAtK(kAt(t)),p=EV[EV.length-1].o;if(o.join()!==p.join())EV.push({t:t,o:o,prev:p})}})();
/* an order change is staged as a run of two-row swaps (a climber passes one rival at a time), 0.3 s each; the final order is the data's */
function swaps(a,b){var cur=a.slice(),st=[cur.slice()];b.forEach(function(m,j){var i=cur.indexOf(m);while(i>j){var x=cur[i-1];cur[i-1]=cur[i];cur[i]=x;i--;st.push(cur.slice())}});return st}
EV.forEach(function(e){if(e.prev)e.st=swaps(e.prev,e.o)});var SW=.22;
function swapState(t){var e=EV[0];for(var i=1;i<EV.length;i++)if(EV[i].t<=t)e=EV[i];if(!e.st)return {a:e.o,b:e.o,x:1};var n=e.st.length-1,u=(t-e.t)/SW;if(u>=n)return {a:e.o,b:e.o,x:1};var j=Math.floor(u);return {a:e.st[j],b:e.st[j+1],x:eio(u-j)}}
function slotAt(m,t){var s=swapState(t);return lerp(s.a.indexOf(m),s.b.indexOf(m),s.x)}
function upNow(m,t){var s=swapState(t);return s.b.indexOf(m)<s.a.indexOf(m)}
function moveAt(m,t){var e=null;for(var i=1;i<EV.length;i++)if(EV[i].t<=t)e=EV[i];if(!e||t-e.t>3.4)return 0;return e.prev.indexOf(m)-Math.round(slotAt(m,t))}
function EVTm(m,t){var e=0;for(var i=1;i<EV.length;i++)if(EV[i].t<=t)e=EV[i].t;return e}
function evT(){return EV.length>1?EV[1].t:T.L0+.6}

/* ---------- scenes ---------- */
var o;
function bug(x,y,a){/* the channel bug: EZ disc + "EARNINGS NIGHT" */
 return '<div class="abs" style="left:'+x+'px;top:'+y+'px;display:flex;align-items:center;gap:14px;opacity:'+a+'">'+logo(58)+'<div class="cd" style="font-weight:800;font-size:30px;letter-spacing:.14em;line-height:1">EARNINGS NIGHT</div></div>'}

function fixture(t){/* the thumbnail: it reads on frame 0. The company in its own colour against the four AIs */
 var z=1+.025*seg(t,0,T.st0);
 var s='<div class="abs" style="inset:0;transform:scale('+z+');transform-origin:50% 50%">';
 
 s+='<div class="abs sl" style="--k:70px;left:-80px;right:90px;top:310px;height:390px;background:'+COC+'"></div>';
 s+='<div class="abs" style="left:72px;top:345px;display:flex;align-items:center;gap:40px">'+co(RD.ticker,320)+'<div class="cd" style="font-weight:900;font-style:italic;font-size:'+fitW(RD.co.toUpperCase(),560,210)+'px;line-height:.82;letter-spacing:-.01em;color:#fff">'+RD.co.toUpperCase()+'</div></div>';
 s+='<div class="abs sl" style="--k:70px;left:90px;right:-80px;top:750px;height:500px;background:var(--bar2)"></div>';
 s+='<div class="abs cd" style="left:150px;top:790px;font-weight:900;font-style:italic;font-size:130px;line-height:1;color:var(--gold)">VS</div>';
 s+='<div class="abs cd" style="left:360px;top:835px;font-weight:900;font-style:italic;font-size:76px;line-height:1">4 AIs</div>';
 s+='<div class="abs" style="left:150px;top:975px;display:flex;gap:28px">'+ORDER.map(function(m){return med(m,192)}).join('')+'</div>';
 s+='</div>';s+=bug(72,74,1);return s}

/* the cut under the sting: the moment the trailing black slash covers the frame */
function blackP(t){var x=seg(t,T.st0,T.st1);return eio(cl(x*1.35-4*.08))}
var TCUT=(function(){for(var t=T.st0;t<T.st1;t+=1/600)if(blackP(t)>=.47)return t;return T.st1})();
function sting(t){/* the EZ slashes sweep across: green, cream, red, gold, as in the logo */
 var x=seg(t,T.st0,T.st1),cols=['#03c870','#f8f0d9','#ff3a31','#fdbc2a','#04070e'],s='';
 cols.forEach(function(c,i){var p=eio(cl(x*1.35-i*.08));var L=i===4?lerp(-2400,1700,p):lerp(-1500,1700,p);s+='<div class="abs" style="top:-200px;height:1750px;left:'+L+'px;width:'+(i===4?2000:260)+'px;background:'+c+';transform:skewX(-22deg)"></div>'});
 var lp=seg(t,T.st0+.22,T.st0+.45),lq=seg(t,TCUT+.04,TCUT+.2);
 if(lp>0&&lq<1)s+='<div class="abs" style="left:390px;top:525px;transform:scale('+(.6+.4*eo(lp))+');opacity:'+(1-lq)+'">'+logo(300)+'</div>';
 return s}

/* row geometry: line-up (big) to the tower (compact) */
var LU={y0:440,h:178,g:22},TW={y0:690,h:118,g:12};
function rowBox(i,f){return {y:lerp(LU.y0+i*(LU.h+LU.g),TW.y0+i*(TW.h+TW.g),f),h:lerp(LU.h,TW.h,f)}}
function row(m,slot,f,t,live){
 var b=rowBox(slot,f),k=kAt(t),v=live?vAt(k):0,P=pnl(m,v),fin=t>=T.fin,lead=live&&Math.abs(v)>1e-9&&orderAtK(k)[0]===m;
 var H=b.h,ms=lerp(124,80,f),nf=lerp(70,48,f),cf=lerp(44,30,f);
 var s='<div class="abs" style="left:40px;right:40px;top:'+b.y.toFixed(1)+'px;height:'+H+'px">';
 /* position box */
 var pos=Math.round(slot)+1;
 
 var x0=lerp(0,104,f);
 s+='<div class="abs sl" style="--k:16px;left:'+x0+'px;right:0;top:0;bottom:0;background:var(--bar2)"></div>';
 s+='<div class="abs" style="left:'+(x0+14)+'px;top:0;bottom:0;width:10px;background:'+LC[m]+';transform:skewX(-8deg)"></div>';
 s+='<div class="abs" style="left:'+(x0+44)+'px;top:'+((H-ms)/2)+'px;display:flex;align-items:center;gap:'+lerp(30,22,f)+'px">'+med(m,ms)+
  '<div style="display:flex;flex-direction:column;gap:'+lerp(12,8,f)+'px"><div class="cd" style="font-weight:800;font-size:'+nf+'px;line-height:1;color:'+LC[m]+'">'+name(m)+'</div>'+(f>.02?sideChip(m,cf*1.05):'')+'</div></div>';
 if(f<=.02)s+='<div class="abs" style="right:40px;top:'+((H-cf*1.5*1.28)/2)+'px">'+sideChip(m,cf*1.5)+'</div>';
 if(f>.02){
  var mv=moveAt(m,t);
  if(mv)s+='<div class="abs cd" style="left:'+(x0+380)+'px;top:'+((H-52)/2)+'px;display:flex;align-items:center;gap:8px;font-weight:900;font-size:50px;line-height:1;color:'+(mv>0?'var(--up)':'var(--dn)')+';opacity:'+(1-seg(t,EVTm(m,t)+2.9,EVTm(m,t)+3.4))+'">'+tri(mv>0,36,mv>0?'#03c870':'#ff3a31')+Math.abs(mv)+'</div>';
  var won=fin&&WIN.indexOf(m)>=0;
  s+='<div class="abs cd" style="right:34px;top:'+((H-66)/2)+'px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:66px;line-height:1;letter-spacing:-.01em;color:'+(Math.abs(P)<.5?'var(--cream)':(P>0?'var(--up)':'var(--dn)'))+';opacity:'+seg(t,T.L0-.2,T.L0+.2)+'">'+(won?crown(54):'')+(Math.abs(P)<.5?'$0':money(P))+'</div>';
 }
 return s+'</div>'}

function lineup(t){/* the team sheet: each AI and its side, in before the report */
 var s='',a=seg(t,TCUT+.05,TCUT+.3),f=eio(seg(t,T.lu1,T.tw1));
 /* header */
 var hy=lerp(180,40,f);
 s+='<div class="abs" style="left:56px;top:'+hy+'px;opacity:'+(a*(1-seg(t,T.lu1,T.lu1+.3)))+'"><div class="cd" style="font-weight:800;font-size:30px;letter-spacing:.2em;color:var(--gold)">THE LINE-UP</div><div class="cd" style="margin-top:12px;font-weight:900;font-style:italic;font-size:112px;line-height:.88">TRADED BEFORE<br>EARNINGS</div></div>';
 return s}

function rows(t){var f=eio(seg(t,T.lu1,T.tw1)),live=t>=T.L0,s='',k=kAt(t),v=live?vAt(k):0;
 /* the position column stays put; the rows slide past it. #1 turns gold once money is on the board */
 if(f>0)for(var i=0;i<4;i++){var b=rowBox(i,1);s+='<div class="abs sl cd" style="--k:16px;left:40px;top:'+b.y+'px;height:'+b.h+'px;width:96px;transform:translateX('+((1-f)*-140)+'px);background:'+(i===0&&Math.abs(v)>1e-9&&swapState(t).x>=1&&pnl(orderAtK(k)[0],v)>0?'var(--gold)':'var(--cream)')+';color:#04070e;display:grid;place-items:center;font-weight:900;font-size:62px;line-height:1">'+(i+1)+'</div>'}
