<!doctype html><meta charset="utf-8"><title>V1 Keynote type</title>
<!-- V1 · "Keynote type": the resolution video as an Apple-keynote film of type and numbers only.
     Black, one typeface (Inter Display), one statement per beat. window.R(t) draws frame t (seconds), 1080x1350.
     ?r=<round> picks another round (default R72 Reddit). ?t=<s> shows one frame for checking.
     Every figure is computed from ez-data.js and paths.js; nothing is typed. -->
<style>

.m>i{display:inline-block;font-style:normal;will-change:transform}
#chart{position:absolute;left:0;top:0}
#S{position:absolute;left:0;top:0;width:1080px;height:1350px}
</style>
<div id="S"></div>
<svg id="chart" width="1080" height="1350"></svg>
<script src="../../../../ez-data.js"></script>
<script src="../../resolution/paths.js"></script>
<script>
/* ---------- data (template: all of this is computed per round) ---------- */
var Q=new URLSearchParams(location.search),RN=+(Q.get('r')||72);
var ALL=[].concat(ROUNDS,typeof UPCOMING!=='undefined'?UPCOMING:[],typeof PENDING!=='undefined'?PENDING:[]);
var RD=ROUNDS.filter(function(r){return r.n===RN})[0];
function side(c){return c[1].indexOf('DOWN')===0?-1:1}
function mag(c){return parseFloat(String(c[1]).replace(/[^0-9.]/g,''))}

var mvS=RD.a>0?1:(RD.a<0?-1:0);
var RIGHT=CALLS.filter(function(c){return c.s===mvS});
var WIN=(RD.win&&!/NO|NOBODY/i.test(RD.win))?RD.win.split(/\s*&\s*/):[];
function app(m){return MODELS[m].app}
/* P&L in the videos: $10,000 per 1% the AI predicted x side x the move */
function pnl(c,v){return 10000*c.g*c.s*v/100}
function money(v){var a=Math.round(Math.abs(v));return (v<0?'−':'+')+'$'+a.toLocaleString('en-US')}
function pct(v){return (v<0?'−':(v>0?'+':''))+Math.abs(v).toFixed(2)+'%'}
function dt(s){var m=String(s).match(/(\d+)\/(\d+)\/(\d+)/);return new Date(Date.UTC(2000+(+m[3]%100),+m[1]-1,+m[2]))}

var LC={GROK:'#e4e0d6',CLAUDE:'#ef8a55',GPT:'#b18cff',KIMI:'#58b7ff'},CR='#f8f0d9',X=110;

var LOGO='<svg width="W" height="W" viewBox="0 0 400 400" style="display:block;border-radius:50%;box-shadow:0 0 0 2px rgba(248,240,217,.55)"><circle cx="198.7" cy="199.4" r="198.2" fill="#04070e"/><path fill="#f8f0d9" d="M116.8,88.0 L86.2,152.0 L102.1,152.0 L55.0,274.5 L154.2,274.5 L188.5,225.8 L128.7,225.8 L137.5,204.0 L170.2,203.5 L193.2,162.0 L149.1,162.0 L154.8,145.0 L143.4,138.5 L217.9,138.2 L192.2,182.0 L234.9,182.0 L181.5,250.8 L136.0,315.8 L272.5,315.8 L292.5,265.0 L230.4,265.0 L328.2,130.8 L225.1,130.8 L253.0,87.8 Z"/><path fill="#03c870" d="M146.2,287.0 L133.0,287.0 L106.5,327.2 L119.0,326.5 Z M86.8,169.5 L74.8,169.5 L29.5,282.2 L43.7,282.2 Z M105.8,92.5 L89.5,95.8 L55.5,169.2 L69.0,169.2 Z"/><path fill="#ff3a31" d="M304.5,259.0 L300.5,269.5 L313.0,268.2 L317.0,258.8 Z M361.5,126.0 L344.0,126.5 L269.5,235.8 L256.0,257.5 L276.2,257.0 Z M279.0,87.8 L266.7,87.5 L251.5,117.2 L262.2,119.0 Z"/><path fill="#fdbc2a" d="M334.2,281.2 L302.0,281.2 L288.2,315.8 L321.0,315.5 Z"/></svg>';

/* hook block: vertically centred on the left grid */

window.R=function(t){
 var o='',svg='';

 if(t<T.h1){var v={i:1,o:iC(sg(t,T.h1-.34,T.h1))},y=HY;
  o+=el(NC+' AIs traded','left:'+X+'px;top:'+y+'px;font:600 '+HK.a+'px/1 var(--f);letter-spacing:-.02em;color:'+CR,v);y+=HK.a+20;

 }

  o+=el(wd(dCalled,true)+', '+md(dCalled),'left:'+X+'px;top:'+RY+'px;font:500 38px/1 var(--f);color:var(--mu)',vis(t,T.b0,T.b2));

  CALLS.forEach(function(c,i){var a=T.l0+i*T.ls,y=RY+250+i*152,v=vis(t,a,T.b2);
   o+=el(app(c.m),'left:'+X+'px;top:'+y+'px;font:600 96px/1 var(--f);letter-spacing:-.03em;color:'+LC[c.m],v);
   o+=el((c.s>0?'Long':'Short')+'<span style="font-weight:500;color:var(--mu);font-size:.62em;letter-spacing:-.01em;margin-left:.3em">'+SZ(c)+'</span>','right:'+X+'px;top:'+y+'px;font:700 96px/1 var(--f);letter-spacing:-.03em;color:'+CR,v);
  });
 }
 /* 3 · HELD TO THE CLOSE: one line, drawn with intent; the move as one giant number, then alone at the bell */
 if(t>=T.c0&&t<T.v0+.9){
  var vh=vis(t,T.c0,T.bell+.55),k=VS?idxAt(t):0,cur=VS?vAt(k):RD.a*ioS(sg(t,T.cA,T.cD)),done=t>=T.bell;
  o+=el('Held to '+closeDay+'’s close.','left:'+X+'px;top:170px;font:700 72px/1 var(--f);letter-spacing:-.03em',vh);
  var X0=X,X1=970,Y0=770,Y1=1140,lo=Math.min(0,Math.min.apply(null,VS||[RD.a])),hi=Math.max(0,Math.max.apply(null,VS||[RD.a])),sp=hi-lo||1;lo-=sp*.04;hi+=sp*.04;

   svg+='<circle cx="'+X0+'" cy="'+yy+'" r="9" fill="#f5f5f7"/><text x="'+X0+'" y="'+(yy-36)+'" fill="#86868b" font-family="Inter Display" font-weight="500" font-size="30">Earnings out</text>';
   svg+='<text x="'+X1+'" y="'+(yy+62)+'" text-anchor="end" fill="'+(done?'#f5f5f7':'#6e6e73')+'" font-family="Inter Display" font-weight="'+(done?700:500)+'" font-size="30">Close · '+wd(dRes,false)+'</text>';
   svg+='<circle cx="'+xx+'" cy="'+yy+'" r="'+(done?13:11)+'" fill="'+col+'"/></g>'}
  if(vo>0&&VS){
   svg+='<g opacity="'+vo.toFixed(3)+'">';
   svg+='<line x1="'+X0+'" x2="'+X1+'" y1="'+sy(0)+'" y2="'+sy(0)+'" stroke="#2c2c2e" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>';
   svg+='<circle cx="'+sx(0)+'" cy="'+sy(VS[0])+'" r="9" fill="#f5f5f7"/><text x="'+sx(0)+'" y="'+(sy(VS[0])-34)+'" fill="#86868b" font-family="Inter Display" font-weight="500" font-size="30">Earnings out · '+clockAt(0)+'</text>';
   /* the open: a short tick under its label, at the top, clear of the moving clock */
   if(k>=OPEN){var oo=cl((k-OPEN)/3);svg+='<line x1="'+sx(OPEN)+'" x2="'+sx(OPEN)+'" y1="'+(Y0-6)+'" y2="'+(Y0+26)+'" stroke="#48484d" stroke-width="2" opacity="'+oo+'"/><text x="'+sx(OPEN)+'" y="'+(Y0-22)+'" text-anchor="middle" fill="#6e6e73" font-family="Inter Display" font-weight="500" font-size="28" opacity="'+oo+'">Open · 9:30 AM</text>'}

   svg+='</g>';
  }

  if(t>=T.cA&&t<T.v0){var hp=numPos(t),nc='rgb('+Math.round(lerp(245,NUMRGB[0],red))+','+Math.round(lerp(245,NUMRGB[1],red))+','+Math.round(lerp(247,NUMRGB[2],red))+')';
   o+=el(t<T.bell?pct(cur):MV,'left:'+(X-6)+'px;top:'+hp.t.toFixed(1)+'px;font:800 '+hp.f.toFixed(1)+'px/1 var(--f);letter-spacing:-.05em;color:'+nc,{i:oQ(sg(t,T.cA,T.cA+.5)),o:0});
   o+=el('at '+closeDay+'’s close','left:'+X+'px;top:'+(HERO.t+MVW+30)+'px;font:500 44px/1 var(--f);color:var(--mu)',vis(t,T.bell+.5,T.v0+.1));}
 }

 if(t>=T.v0&&t<T.v1){

  o+=el(RD.co+' at '+closeDay+'’s close','left:'+X+'px;top:198px;font:500 36px/1 var(--f);color:var(--mu)',vis(t,T.v0+.45,T.v1));
  var VH=WIN.length===0?'Nobody won.':WIN.map(nm).join(' and ')+' won.';
  o+=el(VH,'left:'+X+'px;top:'+(VY+60)+'px;font:700 '+fit(VERD,700,860,112)+'px/1 var(--f);letter-spacing:-.04em',vis(t,T.vw,T.v1));
  var ry=WIN.length?VY+500:VY+200;
