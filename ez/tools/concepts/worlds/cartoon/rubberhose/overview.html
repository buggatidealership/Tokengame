<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EZ Picture Palace: Overview (rubberhose mockup)</title>
<link rel="stylesheet" href="rh.css">
<style>
.wrap{max-width:1200px;margin:0 auto;padding:26px 16px 30px}

/* ---------- the house: the title card projected on the screen ---------- */
.house-pic{position:relative;height:148vw;background:#140807 url(art/house-tall.jpg) 50% -36vw/150vw auto no-repeat}
.screen{position:absolute;left:20.45vw;top:34.8vw;width:58.8vw;height:78.2vw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3.4vw 3.2vw;isolation:isolate}
.screen::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:1vw;mix-blend-mode:multiply;
  background:radial-gradient(ellipse 85% 70% at 50% 40%,#6b5236 0%,#3a2a1b 55%,#1d140d 100%)}
.screen::after{content:"";position:absolute;inset:2.2vw;z-index:-1;border:1px solid rgba(244,227,191,.32);outline:1px solid rgba(244,227,191,.18);outline-offset:3px;border-radius:.6vw;pointer-events:none}
.presents{display:flex;align-items:center;gap:1.6vw;margin:0 0 2vw;font:italic 3.6vw/1 var(--tx);color:var(--cream2)}
.presents img{width:7vw;height:7vw}
.house h1{font-size:7.9vw;line-height:1.04;color:#f7e6c2;text-shadow:0 0 1.6vw rgba(255,214,140,.35),0 .3vw 0 rgba(0,0,0,.35)}
.rule{width:44%;height:1px;margin:2.6vw auto;background:linear-gradient(90deg,transparent,rgba(244,227,191,.75),transparent)}
.house .lede{margin:0;font:3.45vw/1.36 var(--tx);color:#efdcb5}
.house .stake{margin:2.4vw 0 0;font:600 2.9vw/1 var(--num);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

/* ---------- I. the acts ---------- */
.acts{background:linear-gradient(180deg,rgba(10,3,2,.55),rgba(10,3,2,.15) 30%,rgba(10,3,2,.6)),url(art/curtain.jpg) center/cover}
.bill{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.act{display:flex;flex-direction:column;border-radius:5px;padding:5px;background:linear-gradient(180deg,rgba(255,244,200,.5),rgba(0,0,0,0) 30%,rgba(60,30,0,.4)),url(art/gold.jpg) center/320px auto;box-shadow:inset 0 1px 0 rgba(255,250,220,.8),0 6px 14px rgba(0,0,0,.65)}
.act-pic{position:relative;margin:0;aspect-ratio:1;overflow:hidden;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(40,20,0,.8)}
.act-pic img{width:100%;height:100%;object-fit:cover}
.act-no{position:absolute;left:6px;top:6px;padding:4px 7px 3px;border-radius:3px;font:700 11px/1 var(--num);letter-spacing:.12em;text-transform:uppercase}
.plate{padding:8px 8px 7px;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:6px;row-gap:3px;color:#2a1606;text-shadow:0 1px 0 rgba(255,236,170,.6)}
.plate .nm{display:flex;align-items:center;gap:6px;font:700 21px/1 var(--num);letter-spacing:.05em;text-transform:uppercase}
.plate .nm .mkd{width:20px;height:20px}
.plate .ver{grid-column:1/-1;font:italic 12px/1.1 var(--tx);color:#4a2c0c;margin-top:-1px}
.plate .figs{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:4px;padding-top:5px;border-top:1px solid rgba(60,35,5,.45);box-shadow:0 1px 0 rgba(255,240,190,.4) inset}
.plate .fig b{display:block;font:700 17px/1 var(--num);letter-spacing:.01em}
.plate .fig small{display:block;margin-top:3px;font:600 9.5px/1 var(--num);letter-spacing:.12em;text-transform:uppercase;color:#4a2c0c}
.plate .fig.r{text-align:right}

/* ---------- II. the shorts: a lobby set on the walnut wall, then the whole reel ---------- */
.shorts{background:linear-gradient(180deg,rgba(8,4,2,.35),rgba(8,4,2,.1) 25%,rgba(8,4,2,.55)),url(art/lobby.jpg) center top/cover}
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.lc{display:flex;flex-direction:column;padding:5px;border-radius:4px;background:linear-gradient(180deg,rgba(255,244,200,.5),rgba(0,0,0,0) 30%,rgba(60,30,0,.4)),url(art/gold.jpg) center/320px auto;box-shadow:inset 0 1px 0 rgba(255,250,220,.8),0 8px 16px rgba(0,0,0,.7)}
.lc-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(40,20,0,.85)}
.lc-band{position:relative;margin-top:5px;padding:7px 7px 7px;border-radius:2px;color:var(--cream);
  background:var(--grain),linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.25)),#22150f;border-top:4px solid var(--bc,#8a1d14);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.lc-co{margin:0;font:600 13px/1.15 var(--num);letter-spacing:.02em}
.lc-co span{font-weight:400;color:var(--cream2)}
.lc-res{margin:5px 0 0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px}
.lc-res .mv{font:700 15px/1 var(--num)}
.won{display:inline-flex;align-items:center;gap:4px;font:500 11.5px/1 var(--num);letter-spacing:.03em;color:var(--cream)}
.won .mkd{width:17px;height:17px}
.won em{font-style:normal;color:var(--cream2)}
.lc-n{margin:5px 0 0;font:500 10px/1 var(--num);letter-spacing:.12em;text-transform:uppercase;color:#bfa77c}
.lc.hero{grid-column:1/-1}
.lc.hero .lc-band{padding:10px 11px}
.lc.hero .lc-co{font-size:20px}
.lc.hero .lc-res .mv{font-size:24px}
.lc.hero .won{font-size:15px}.lc.hero .won .mkd{width:22px;height:22px}
.lc.hero .lc-n{font-size:11.5px}

.reel-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 8px}
.reel-hd p{margin:0;font:italic 14px/1.2 var(--tx);color:var(--cream2)}
.reel{overflow-x:auto;overflow-y:hidden;margin:0 -16px;padding:0 16px 6px;scrollbar-width:thin;scrollbar-color:#8a6a2a transparent}
.strip{position:relative;display:flex;width:max-content;padding:20px 8px;border-radius:3px;
  background:var(--grainL),linear-gradient(180deg,#2b1a0e,#3a2414 18%,#24160c 50%,#3a2414 82%,#2b1a0e);box-shadow:0 8px 16px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,220,160,.12)}
.strip::before,.strip::after{content:"";position:absolute;left:0;right:0;height:8px;
  background:repeating-linear-gradient(90deg,transparent 0 7px,rgba(255,232,190,.82) 7px 17px,transparent 17px 26px);
  -webkit-mask:linear-gradient(180deg,#000,#000);border-radius:2px;opacity:.9}
.strip::before{top:6px}.strip::after{bottom:6px}
.frm{width:134px;padding:0 5px;border-right:1px solid rgba(0,0,0,.55)}
.frm img{width:124px;height:124px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.7)}
.edge{margin-top:5px;font:500 10px/1.25 var(--num);letter-spacing:.03em;color:#e8cb92}
.edge .co{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edge .r2{display:flex;align-items:center;gap:4px}
.edge .r2 .mkd{width:13px;height:13px;box-shadow:0 0 0 1px rgba(233,184,90,.7)}
.edge .mv{font-weight:700}

/* ---------- III. the newsreel: two charts projected on the screen ---------- */
.newsreel{background:linear-gradient(180deg,rgba(6,3,3,.82),rgba(6,3,3,.6) 40%,rgba(6,3,3,.88)),url(art/house-wide.jpg) center 85%/cover}
.beat{margin-top:18px}
.beat-hd{margin:0 0 8px}
.beat-hd p{margin:4px 0 0;font:700 16px/1.25 var(--tx);color:var(--cream)}
.scr{position:relative;margin:0 -16px;aspect-ratio:1;background:url(art/screen-sq.jpg) center/100% 100%}
.scr-a{position:absolute;left:11.5%;top:13.2%;width:77%;height:74.9%;isolation:isolate}
.scr-a::before{content:"";position:absolute;inset:0;z-index:-1;mix-blend-mode:multiply;border-radius:6px;
  background:radial-gradient(ellipse 90% 80% at 50% 38%,#5a4530 0%,#33251a 55%,#1a120c 100%)}
.scr-a svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.scr-foot{margin:8px 0 0;font:600 11px/1.2 var(--num);letter-spacing:.12em;text-transform:uppercase;color:var(--cream2)}
.ax text{font:500 10.5px var(--num);fill:rgba(244,227,191,.72)}
.ax line{stroke:rgba(244,227,191,.16);stroke-width:1}
.ax .ref{stroke:rgba(244,227,191,.5);stroke-dasharray:4 4}
.ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.end text{font:700 11.5px var(--num);letter-spacing:.02em}
.drawn .ln{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:draw 1.8s cubic-bezier(.3,.1,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- IV. coming attractions: glass lantern slides ---------- */
.coming{background:radial-gradient(ellipse 70% 55% at 50% 40%,rgba(255,200,130,.16),rgba(0,0,0,0) 70%),linear-gradient(180deg,rgba(14,3,3,.7),rgba(14,3,3,.55) 40%,rgba(14,3,3,.8)),url(art/curtain.jpg) center/cover}
.day{margin-top:18px}
.day-hd{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:3px;font:600 13px/1 var(--num);letter-spacing:.1em;text-transform:uppercase}
.slides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.slide{position:relative;aspect-ratio:3/4;background:url(art/slide.jpg) center/100% 100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.7))}
.sl-lab{position:absolute;left:8%;right:9%;top:2.6%;height:7.8%;display:flex;align-items:center;justify-content:center;font:600 11.5px/1 var(--num);letter-spacing:.02em;color:#2a1a0e;white-space:nowrap;overflow:hidden}
.sl-lab span{font-weight:400;color:#5a4128;margin-left:3px}
.sl-win{position:absolute;left:18%;top:18.6%;width:63%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
.sl-win img{width:56%;height:56%;object-fit:contain;mix-blend-mode:multiply}
.sl-win.dk{background:radial-gradient(circle,#1e1b1a 0 52%,transparent 53%)}
.sl-win.dk img{mix-blend-mode:normal;width:48%;height:48%}
.sl-low{position:absolute;left:8%;right:8%;top:68.5%;bottom:5%;display:flex;flex-direction:column;justify-content:center}
.trs{display:grid;grid-template-columns:1fr 1fr;gap:4px 6px}
.tr{display:flex;align-items:center;gap:4px;font:600 11px/1 var(--num);letter-spacing:.02em;color:var(--cream);white-space:nowrap}
.tr .mkd{width:15px;height:15px}
.tr b.L{color:var(--win)}.tr b.S{color:var(--loss)}
.due{margin:0;text-align:center;font:italic 12px/1.25 var(--tx);color:var(--cream2)}
.sl-rn{position:absolute;right:9%;bottom:4.6%;font:500 9px/1 var(--num);letter-spacing:.12em;text-transform:uppercase;color:#a58f6b}
.also{margin:10px 0 0;font:italic 14px/1.4 var(--tx);color:var(--cream2)}
.also b{font:600 13px var(--num);letter-spacing:.02em;font-style:normal;color:var(--cream)}

/* ---------- V. feature presentation ---------- */
.feature{background:radial-gradient(ellipse 80% 50% at 50% 20%,rgba(255,190,90,.18),rgba(0,0,0,0) 70%),linear-gradient(180deg,rgba(5,6,6,.75),rgba(5,6,6,.88)),url(art/house-wide.jpg) center 20%/cover}
.tcard{position:relative;margin:14px -4px 0;aspect-ratio:3/4;background:url(art/titlecard-tall.jpg) center/100% 100%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.75))}
.tc-in{position:absolute;left:11%;right:11%;top:9.5%;height:57%;display:flex;flex-direction:column;align-items:center;text-align:center}
.tc-k{font:600 12px/1 var(--num);letter-spacing:.3em;text-transform:uppercase;color:#e7c27a}
.tcard h2{margin-top:10px;font-size:38px;line-height:1;color:var(--gold);background:linear-gradient(180deg,rgba(255,248,215,.95),rgba(255,255,255,0) 50%,rgba(90,50,0,.35)),url(art/gold.jpg) center/220px auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 #0b2a26) drop-shadow(0 3px 6px rgba(0,0,0,.7))}
.nv{display:flex;align-items:center;gap:8px;margin-top:9px;font:600 14px/1 var(--num);letter-spacing:.14em;text-transform:uppercase;color:#f1dcae}
.nv img{width:30px;height:30px;padding:3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2b2b2b,#050505);box-shadow:0 0 0 1.5px rgba(233,184,90,.8)}
.leader{position:relative;width:58%;aspect-ratio:1;margin-top:12px}
.leader svg{position:absolute;inset:0;width:100%;height:100%}
.lead-n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lead-n b{font:700 46px/1 var(--num);color:#f6e4bd;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.lead-n small{font:600 10.5px/1 var(--num);letter-spacing:.2em;text-transform:uppercase;color:#e7c27a;margin-top:2px}
.lead-n span{margin-top:6px;font:600 13px/1 var(--num);letter-spacing:.06em;color:#f1dcae}
.sweep{transform-origin:100px 100px;animation:sweep 60s linear infinite;animation-delay:var(--d,0s)}
@keyframes sweep{to{transform:rotate(360deg)}}

.stakes{display:grid;gap:12px;margin-top:16px}
.gt{position:relative;aspect-ratio:1107/511;background:url(art/ticket.jpg) center/100% 100%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.7));color:#3a2205}
.gt-stub{position:absolute;left:4.1%;width:14%;top:13%;bottom:9%;display:grid;place-items:center}
.gt-stub span{transform:rotate(-90deg);white-space:nowrap;font:700 11px/1 var(--num);letter-spacing:.24em;text-transform:uppercase;text-shadow:0 1px 0 rgba(255,240,180,.7);color:#5a3508}
.gt-main{position:absolute;left:25.5%;right:7.5%;top:16%;bottom:17%;display:flex;flex-direction:column;justify-content:center;gap:4px;text-shadow:0 1px 0 rgba(255,242,190,.75),0 -1px 0 rgba(90,55,0,.35)}
.gt-k{font:700 10.5px/1 var(--num);letter-spacing:.22em;text-transform:uppercase;color:#6a4108}
.gt-h{display:flex;align-items:center;gap:7px;font:700 27px/1 var(--num);letter-spacing:.04em;text-transform:uppercase;color:#2a1604}
.gt-h .mkd{width:26px;height:26px}
.gt-t{font:12px/1.25 var(--tx);color:#3a2205}
.gt-t b{font:700 13px var(--num);color:#2a1604}
.pool{display:grid;grid-template-columns:44% 1fr;gap:10px;align-items:center}
.box{position:relative;aspect-ratio:1;background:url(art/strongbox.jpg) center/cover;border-radius:4px;box-shadow:0 8px 14px rgba(0,0,0,.7)}
.box b{position:absolute;left:44%;width:32%;top:49%;height:19%;display:grid;place-items:center;font:700 24px/1 var(--num);color:#3c2404;transform:skewY(-1.5deg);
  text-shadow:0 1px 0 rgba(255,240,180,.75),0 -1px 0 rgba(70,40,0,.5)}
.pool .title-card{font-size:15px}
.ends{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ends .title-card{font-size:14px;font-style:normal}
.ends h3{margin:0 0 4px;font:700 15px/1 var(--num);letter-spacing:.14em;text-transform:uppercase}
.exit{display:flex;justify-content:center;padding:6px 0 34px}

@media (prefers-reduced-motion:reduce){.sweep{animation:none}.drawn .ln{animation:none;stroke-dashoffset:0}}

/* ---------- desktop: recomposed for the wide shape ---------- */
@media (min-width:760px){
  .wrap{padding:52px 40px 56px}
  h2.gilt{font-size:54px}
  .ch-hd{flex-direction:row;align-items:baseline;gap:18px}
  .house-pic{height:56.25vw;max-height:900px;background:#140807 url(art/house-wide.jpg) center top/100vw auto no-repeat}
  .screen{left:31.2vw;top:19.73vw;width:37.4vw;height:23.73vw;padding:1.6vw 2.2vw}
  .screen::after{inset:1vw}
  .presents{font-size:1.3vw;gap:.6vw;margin-bottom:.8vw}.presents img{width:2.4vw;height:2.4vw}
  .house h1{font-size:3.3vw;text-shadow:0 0 .7vw rgba(255,214,140,.35)}
  .rule{margin:1vw auto}
  .house .lede{font-size:1.22vw}
  .house .stake{font-size:.98vw;margin-top:.9vw}
  .title-card{font-size:18px;max-width:720px}
  .bill{grid-template-columns:repeat(4,1fr);gap:18px;margin-top:22px}
  .plate{padding:10px 10px 9px}.plate .nm{font-size:26px}.plate .nm .mkd{width:24px;height:24px}.plate .ver{font-size:13px}
  .plate .fig b{font-size:22px}.plate .fig small{font-size:10.5px}
  .lobby{grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}
  .lc.hero{grid-column:1/3;grid-row:1/3}
  .lc.hero .lc-co{font-size:24px}.lc.hero .lc-res .mv{font-size:30px}.lc.hero .won{font-size:17px}
  .reel{margin:0;padding:0 0 8px}
  .frm{width:150px}.frm img{width:140px;height:140px}
  .beats{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .scr{margin:0;aspect-ratio:16/9;background-image:url(art/screen-wide.jpg)}
  .scr-a{left:12.5%;top:11.8%;width:75.6%;height:77.1%}
  .slides{grid-template-columns:repeat(4,1fr);gap:16px}
  .days{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .sl-lab{font-size:13px}.tr{font-size:12.5px}.tr .mkd{width:17px;height:17px}
  .feat{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:start;margin-top:22px}
  .tcard{margin:0;aspect-ratio:16/9;background-image:url(art/titlecard.jpg)}
  .tc-in{left:10%;right:10%;top:11%;height:58%;display:grid;grid-template-columns:1fr 38%;grid-template-rows:auto auto auto 1fr;column-gap:18px;text-align:left;align-items:start}
  .tc-k,.tcard h2,.nv,.tc-at{grid-column:1}
  .tcard h2{font-size:52px;margin-top:14px}
  .leader{grid-column:2;grid-row:1/5;width:100%;margin:0}
  .stakes{margin-top:0}
  .gt-h{font-size:32px}.gt-t{font-size:13px}
}
@media (min-width:1300px){.house-pic{background-size:min(100vw,1600px) auto}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="overview.html" aria-label="Earnings Zeason"><img src="../../../../v22/x2p-logo.svg" alt=""><span><i class="e">E</i>arnings <i class="z">Z</i>eason</span></a>
  <nav class="tabs" aria-label="Pages"><a aria-current="page" href="overview.html">Overview</a><a href="leaderboard.html">Leaderboard</a></nav>
</header>
<main id="app"></main>

<script src="../../../../../ez-data.js"></script>
<script src="rh-core.js"></script>
<script>
(function(){
var RH=window.RH,$=function(s,r){return (r||document).querySelector(s)},esc=RH.esc;
var S=RH.stats("season"),ORD=RH.rank(S,"pl"),R=RH.R,N=R.length;
var ROMAN=["I","II","III","IV","V"];
function mkd(m,cls){return '<i class="mkd '+(cls||"")+'">'+RH.mark(m,16)+'</i>'}
function wonBy(r,short){if(!r.win)return '<span class="won">'+(short?'':'Won by ')+'<em>Nobody</em></span>';var ws=r.win.split(" & ");
  return '<span class="won">'+(short?'':'Won by ')+ws.map(function(m){return mkd(m)}).join("")+ws.map(function(m){return RH.NICE[m]}).join(" & ")+'</span>'}
function cls(v){return v>0?"up":"dn"}
function thumb(n){return 'art/thumbs/r'+n+'.jpg'}
function poster(r){var f=RH.film(r.n);return f?f.poster:thumb(r.n)}
function dayOf(r){var d=RH.ymd(r.resolves);return d?RH.dayLabel(d):""}
function sd(r){var d=RH.ymd(r.resolves);return d?RH.shortDay(d):""}
var html="";

/* ===== the house ===== */
html+='<section id="house" class="ch house" aria-label="EZ presents"><div class="house-pic"><div class="screen">'+
  '<p class="presents"><img src="../../../../v22/x2p-logo.svg" alt="EZ.">presents</p>'+
  '<h1>Four AIs<br>trade<br class="m"> earnings</h1><div class="rule"></div>'+
  '<p class="lede">Before a company reports earnings, each AI goes long or short on its stock. The close grades every trade.</p>'+
  '<p class="stake">$100K a trade · simulated</p></div></div></section><div class="gutter" aria-hidden="true"></div>';

/* ===== I. the acts ===== */
var ACT={GROK:"art/act-grok.jpg",CLAUDE:"art/act-claude.jpg",GPT:"art/act-gpt.jpg",KIMI:"art/act-kimi.jpg"};
html+='<section id="acts" class="ch acts"><div class="wrap"><div class="ch-hd"><p class="kick"><span class="rn">I</span>The acts</p><h2 class="gilt">Meet the models</h2></div>'+
  '<div class="title-card"><p>Four AIs from two countries, billed by season P&amp;L.</p></div><div class="bill">'+
  ORD.map(function(m,i){var o=S.by[m];return '<article class="act" aria-label="'+RH.NICE[m]+'"><figure class="act-pic"><img src="'+ACT[m]+'" alt="'+RH.NICE[m]+', drawn as a 1930s cartoon act"><span class="act-no brass">Act '+ROMAN[i]+'</span></figure>'+
    '<div class="plate"><div class="nm">'+mkd(m)+RH.NICE[m]+'</div>'+RH.flag(m)+'<div class="ver">'+esc(MODELS[m].ver)+'</div>'+
    '<div class="figs"><div class="fig"><b class="'+(o.pl>=0?"eng-w":"eng-l")+'">'+RH.money(o.pl)+'</b><small>Season P&amp;L</small></div><div class="fig r"><b><span class="eng-w">'+o.w+'</span>-<span class="eng-l">'+o.l+'</span></b><small>W-L</small></div></div></div></article>'}).join("")+
  '</div></div></section><div class="gutter" aria-hidden="true"></div>';

/* ===== II. the shorts ===== */
var newest=R.slice().reverse();
function lobbyCard(r,hero){return '<article class="lc'+(hero?" hero":"")+'"><img class="lc-img" src="'+(hero?poster(r):thumb(r.n))+'" alt="'+esc(r.co)+', round '+r.n+'" onerror="this.onerror=null;this.src=\''+poster(r)+'\'">'+
  '<div class="lc-band" style="--bc:'+((CO_LOGOS[r.ticker]||{}).c||"#8a1d14")+'"><p class="lc-co">'+esc(r.co)+' <span>('+esc(r.ticker)+')</span></p>'+
  '<p class="lc-res"><b class="mv '+cls(r.a)+'">'+RH.mv(r.a)+'</b>'+wonBy(r)+'</p><p class="lc-n">Round '+r.n+' · '+(hero?'graded at the close · '+dayOf(r):sd(r))+'</p></div></article>'}
html+='<section id="shorts" class="ch shorts"><div class="wrap"><div class="ch-hd"><p class="kick"><span class="rn">II</span>The shorts · '+N+' graded</p><h2 class="gilt">Every round so far</h2></div>'+
  '<div class="title-card"><p>Every round is a short. <b>Won by</b>: the closest trade on the right side, both on a tie. <b>Nobody</b>: all four went the wrong way.</p></div>'+
  '<div class="lobby" id="lobby">'+lobbyCard(newest[0],true)+newest.slice(1,9).map(function(r,i){return lobbyCard(r).replace('<article class="lc"','<article class="lc'+(i>=6?' dsk':'')+'"')}).join("")+'</div>'+
  '<div class="reel-hd"><h3 class="sub">The whole reel</h3><p>'+N+' rounds, newest first</p></div>'+
  '<div class="reel" tabindex="0" aria-label="Every graded round, newest first"><div class="strip">'+newest.map(function(r){
    return '<div class="frm"><img src="'+thumb(r.n)+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\''+poster(r)+'\'"><div class="edge"><span class="co">R'+r.n+' · '+esc(r.co)+' ('+esc(r.ticker)+')</span><span class="r2"><b class="mv '+cls(r.a)+'">'+RH.mv(r.a)+'</b>'+
      (r.win?r.win.split(" & ").map(function(m){return mkd(m)}).join("")+r.win.split(" & ").map(function(m){return RH.NICE[m]}).join(" & "):'Nobody')+'</span></div></div>'}).join("")+'</div></div>'+
  '</div></section><div class="gutter" aria-hidden="true"></div>';

/* ===== III. the newsreel ===== */
html+='<section id="newsreel" class="ch newsreel"><div class="wrap"><div class="ch-hd"><p class="kick"><span class="rn">III</span>The newsreel</p><h2 class="gilt">Smart or lucky?</h2></div>'+
  '<div class="title-card"><p>We tracked every trade so you don\'t have to. Here are the stats after '+N+' rounds.</p><p>'+N+' rounds is too few to tell skill from luck.</p></div>'+
  '<div class="beats"><div class="beat"><div class="beat-hd"><h3 class="sub">Hit rate</h3><p>How often were they right on their long or short?</p></div>'+
    '<figure class="scr" style="margin-bottom:0"><div class="scr-a"><svg id="chHit" role="img" aria-label="Hit rate round by round"></svg></div></figure><p class="scr-foot">Every line starts at 50% · round 1 to '+N+'</p></div>'+
  '<div class="beat"><div class="beat-hd"><h3 class="sub">P&amp;L</h3><p>Would following them have made you money?</p></div>'+
    '<figure class="scr"><div class="scr-a"><svg id="chPl" role="img" aria-label="P&L round by round"></svg></div></figure><p class="scr-foot">$100K on every trade · round 1 to '+N+'</p></div></div>'+
  '</div></section><div class="gutter" aria-hidden="true"></div>';

/* ===== IV. coming attractions ===== */
var groups=RH.nextUp(),todayK=RH.TODAY[0]*10000+(RH.TODAY[1]+1)*100+RH.TODAY[2];
groups=groups.filter(function(g){return g.k>=todayK});
function slide(x){var u=x.u,t=u.ticker,src=RH.logoSrc(t),dk=RH.logoDark(t);
  var low=x.inn?'<div class="trs">'+RH.ORDER.map(function(m){var c=u.calls.filter(function(c){return c.m===m})[0];if(!c)return '';var L=c.dir!=="DOWN";
      return '<span class="tr">'+mkd(m)+'<b class="'+(L?"L":"S")+'">'+(L?"Long":"Short")+'</b>'+esc(c.mag)+'%</span>'}).join("")+'</div>'
    :'<p class="due">Trades due<br>before the report</p>';
  return '<div class="slide"><div class="sl-lab">'+esc(u.co)+'<span>('+esc(t)+')</span></div><div class="sl-win'+(dk?" dk":"")+'">'+(src?'<img src="'+src+'" alt="'+esc(u.co)+' logo">':'')+'</div>'+
    '<div class="sl-low">'+low+'</div><span class="sl-rn">R'+u.n+'</span></div>'}
var shown=groups.slice(0,2);
html+='<section id="coming" class="ch coming"><div class="wrap"><div class="ch-hd"><p class="kick"><span class="rn">IV</span>Coming attractions</p><h2 class="gilt">Next on the screen</h2></div>'+
  '<div class="title-card"><p>These companies report next. Each one is a round for the four AIs, not a bet.</p></div><div class="days">'+
  shown.map(function(g){var it=g.items,show=it.slice(0,4),rest=it.slice(4);var isT=g.k===todayK;
    return '<div class="day"><span class="day-hd brass">At '+(isT?"today's":"the")+' close · '+RH.dayLabel(g.d)+'</span><div class="slides">'+show.map(slide).join("")+'</div>'+
      (rest.length?'<p class="also">Also at this close: '+rest.map(function(x){return '<b>'+esc(x.u.co)+' ('+esc(x.u.ticker)+')</b>'}).join(", ")+'.</p>':'')+'</div>'}).join("")+
  '</div></div></section><div class="gutter" aria-hidden="true"></div>';

/* ===== V. feature presentation ===== */
var BT=RH.bet(),lead=ORD[0],LO=S.by[lead];
var nvL=RH.logoSrc("NVDA");
html+='<section id="feature" class="ch feature"><div class="wrap"><div class="ch-hd"><p class="kick"><span class="rn">V</span>Feature presentation</p></div><div class="feat">'+
  '<div class="tcard"><div class="tc-in"><span class="tc-k">Feature presentation</span><h2>Bet #1: NVIDIA</h2><span class="nv">'+(nvL?'<img src="'+nvL+'" alt="">':'')+'At the close · '+(BT?RH.betDay(BT):'date to come')+'</span>'+
    '<div class="leader" aria-live="off"><svg viewBox="0 0 200 200" aria-hidden="true"><defs><radialGradient id="lg" cx="50%" cy="45%"><stop offset="0" stop-color="#3a3326"/><stop offset="1" stop-color="#0f0d0a"/></radialGradient></defs>'+
      '<circle cx="100" cy="100" r="96" fill="url(#lg)" stroke="#e9d3a2" stroke-width="2.5"/><circle cx="100" cy="100" r="80" fill="none" stroke="#e9d3a2" stroke-width="1.2" opacity=".8"/>'+
      '<path class="sweep" d="M100 100 L100 4 A96 96 0 0 1 183.1 52 Z" fill="#e9d3a2" opacity=".14"/>'+
      '<line x1="100" y1="4" x2="100" y2="196" stroke="#e9d3a2" stroke-width=".9" opacity=".5"/><line x1="4" y1="100" x2="196" y2="100" stroke="#e9d3a2" stroke-width=".9" opacity=".5"/></svg>'+
      '<div class="lead-n"><b id="cdD">-</b><small>days</small><span id="cdR">-</span></div></div></div></div>'+
  '<div class="stakes">'+
    '<div class="gt"><div class="gt-stub"><span>Admit one</span></div><div class="gt-main"><span class="gt-k">The golden ticket</span><span class="gt-h">'+mkd(lead)+RH.NICE[lead]+'</span>'+
      '<span class="gt-t">Top model by season P&amp;L, <b>'+RH.money(LO.pl)+'</b>. Its trade decides long or short.</span></div></div>'+
    '<div class="pool"><div class="box" role="img" aria-label="The pool"><b>'+Math.round(RH.poolShare*100)+'%</b></div><div class="title-card"><p>of $EZ creator fees fill the pool. For Season 1 the whole pool rides on NVIDIA.</p></div></div>'+
    '<div class="ends"><div class="title-card tint-g"><h3>Right</h3><p>Profits buy back $EZ.</p></div><div class="title-card tint-r"><h3>Wrong</h3><p>The pool shrinks or can be wiped out.</p></div></div>'+
    '<div class="title-card"><p>NVIDIA is the first bet, not the last. Season 2 ups the stakes.</p></div>'+
  '</div></div></div>'+
  '<div class="exit"><a class="btn-plate brass" href="leaderboard.html">Who is top of the bill now? The marquee</a></div></section>';

$("#app").innerHTML=html;

/* countdown: days, then h m s; the leader's sweep turns once a minute, set to the seconds */
function tick(){if(!BT)return;var s=Math.max(0,Math.floor((BT-Date.now())/1e3)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sc=s%60;
  $("#cdD").textContent=d;$("#cdR").textContent=(h<10?"0":"")+h+"h "+(m<10?"0":"")+m+"m "+(sc<10?"0":"")+sc+"s"}
tick();setInterval(tick,1000);
var sw=$(".sweep");if(sw)sw.style.setProperty("--d",(-(60-((BT-Date.now())/1e3)%60))+"s");

/* charts projected on the screen */
var SER=RH.series("season");
function chart(svg,kind){var box=svg.getBoundingClientRect(),W=Math.round(box.width),H=Math.round(box.height);if(!W||!H)return;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  var ser={};RH.ORDER.forEach(function(m){ser[m]=SER.s[m][kind]});
  var ys=[];RH.ORDER.forEach(function(m){ser[m].forEach(function(p){ys.push(p.y)})});
  var lo,hi,ticks,fmt,ref;
  if(kind==="hit"){lo=.3;hi=.75;ticks=[.3,.4,.5,.6,.7];fmt=function(v){return Math.round(v*100)+"%"};ref=.5}
  else{var mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys),st=50000;lo=Math.floor(mn/st)*st;hi=Math.ceil(mx/st)*st;ticks=[];for(var t=lo;t<=hi+1;t+=st)ticks.push(t);
    fmt=function(v){return v===0?"$0":(v<0?"−":"+")+"$"+Math.abs(v/1000)+"K"};ref=0}
  var padL=kind==="hit"?30:42,labW=0,ends=[];
  RH.ORDER.forEach(function(m){var p=ser[m][ser[m].length-1];ends.push({m:m,y:p.y,txt:RH.NICE[m]+" "+(kind==="hit"?Math.round(p.y*100)+"%":RH.money(p.y,true))})});
  labW=Math.max.apply(null,ends.map(function(e){return e.txt.length}))*6.4+8;
  var x0=padL,x1=W-labW-6,y0=10,y1=H-20,nMax=SER.rounds.length;
  function X(n){return x0+(x1-x0)*n/nMax}function Y(v){return y1-(y1-y0)*(v-lo)/(hi-lo)}
  var g='<g class="ax">'+ticks.map(function(t){return '<line x1="'+x0+'" x2="'+x1+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'"'+(Math.abs(t-ref)<1e-9?' class="ref"':'')+'/><text x="'+(x0-5)+'" y="'+(Y(t)+3.5).toFixed(1)+'" text-anchor="end">'+fmt(t)+'</text>'}).join("")+
    '<text x="'+x0+'" y="'+(H-5)+'">R1</text><text x="'+x1+'" y="'+(H-5)+'" text-anchor="end">R'+nMax+'</text></g>';
  RH.ORDER.slice().reverse().forEach(function(m){var d=ser[m].map(function(p,i){return (i?"L":"M")+X(p.n).toFixed(1)+" "+Y(p.y).toFixed(1)}).join("");
    g+='<path class="ln" d="'+d+'" stroke="'+RH.COL[m]+'" pathLength="1000" style="--L:1000"'+(m===ORD[0]?' stroke-width="2.8"':'')+'/>'});
  ends.sort(function(a,b){return Y(a.y)-Y(b.y)});var last=-99;ends.forEach(function(e){var y=Math.max(Y(e.y),last+13);e.ly=y;last=y});
  var over=last-(y1+4);if(over>0)ends.forEach(function(e){e.ly-=over});
  g+='<g class="end">'+ends.map(function(e){return '<text x="'+(x1+6)+'" y="'+(e.ly+4).toFixed(1)+'" fill="'+RH.COL[e.m]+'">'+e.txt+'</text>'}).join("")+'</g>';
  svg.innerHTML=g}
function charts(){chart($("#chHit"),"hit");chart($("#chPl"),"pl")}
charts();var lw=innerWidth;addEventListener("resize",function(){if(innerWidth!==lw){lw=innerWidth;charts()}});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(charts);
/* lines draw in once when the screen is reached (progression); never with reduced motion */
if(!matchMedia("(prefers-reduced-motion: reduce)").matches&&"IntersectionObserver" in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("drawn");io.unobserve(e.target)}})},{threshold:.4});
  document.querySelectorAll(".scr").forEach(function(s){var r=s.getBoundingClientRect();if(r.top>innerHeight){io.observe(s)}})}
})();
</script>
