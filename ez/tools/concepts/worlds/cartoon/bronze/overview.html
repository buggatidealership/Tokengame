<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earnings Zeason No. 80</title>
<link rel="stylesheet" href="bz.css">
<style>
/* ---------- cover ---------- */
.cv{aspect-ratio:3/4}
.cv .clip{z-index:0}
.cbox{position:absolute;z-index:5;left:-2.5px;top:-2.5px;width:23%;padding:6px 5px 5px;border:2.5px solid var(--ink);text-align:center;
  background:radial-gradient(circle,rgba(0,0,0,.2) 32%,transparent 35%) 0 0/4px 4px,var(--pp) #f4e7c0;background-blend-mode:normal,multiply;background-size:4px 4px,260px}
.cbox img{width:62%;margin:0 auto 3px;border-radius:50%;box-shadow:0 0 0 1.5px var(--ink)}
.cbox .no{font:9px/1 BZH;letter-spacing:.08em}
.cbox .nn{font:30px/.95 BZH;color:var(--red);-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill}
.cbox .mo{font:10px/1.1 BZH;letter-spacing:.1em;margin-top:2px}
.cbox .mm{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:5px}
.cbox .mm span{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:1.5px solid var(--ink)}
.mast{position:absolute;z-index:4;left:26%;right:2%;top:1.2%;margin:0;transform:perspective(520px) rotateX(16deg);transform-origin:50% 100%;text-align:center}
.mast span{display:block;font-family:BZH;font-weight:400;white-space:nowrap;line-height:.86;color:#f6d23e;-webkit-text-stroke:2.6px var(--ink);paint-order:stroke fill;
  text-shadow:1px 1px 0 #b72e1e,2px 2px 0 #b72e1e,3px 3px 0 #b72e1e,4px 4px 0 #b72e1e,5px 5px 0 var(--ink),6px 6px 0 var(--ink),7px 7px 0 var(--ink)}
.mast .e{color:#2fae55}.mast .z{color:#e3392c}
.cv .top{position:absolute;z-index:5;left:26%;right:2%;top:-2px;transform:translateY(-100%);font:9.5px/1 BZH;letter-spacing:.12em;color:var(--ink);text-align:center;padding-bottom:3px}
.cv .star{position:absolute;z-index:5;left:26%;right:3%;top:23.5%;text-align:center;font:700 11.5px/1 BZL;letter-spacing:.06em;color:#f8ecc8;text-transform:uppercase;text-shadow:0 1px 0 #000,0 0 6px #000}
.cv .star b{font-family:BZH;font-weight:400;letter-spacing:.04em}
.cv .blurb{position:absolute;z-index:5;left:50%;bottom:2.2%;transform:translateX(-50%) rotate(-3deg);width:74%;padding:15px 14px 13px;text-align:center}
.cv .blurb .q{font:18.5px/1 BZH;color:var(--ink);text-transform:uppercase}
.cv .blurb .q em{font-style:normal;color:var(--red)}
.cv .cap.tl2{top:auto;bottom:20%;left:-2.5px;max-width:46%;font-size:11.5px}
/* ---------- splash ---------- */
.sttl{text-align:center;font-size:28px;margin:4px 0 10px;transform:rotate(-1.5deg)}
.sttl .lc{text-transform:none}
.sp{aspect-ratio:3/4}
.credits{margin:var(--g) 0 0;border:2.5px solid var(--ink);padding:6px 9px 5px;display:grid;grid-template-columns:auto 1fr;gap:2px 9px;font:700 11.5px/1.2 BZL;text-transform:uppercase;
  background:var(--pp) #f3dc7a;background-blend-mode:multiply;background-size:300px}
.credits dt{font-family:BZH;font-weight:400;font-size:10.5px;letter-spacing:.06em;padding-top:1px}
.credits dd{margin:0}
.indicia{margin:7px 2px 0;font-size:9.5px;line-height:1.3;color:rgba(23,18,13,.82)}
/* ---------- this issue: one round ---------- */
.capbar{position:relative;border:2.5px solid var(--ink);padding:5px 9px 4px;font:700 12.5px/1.22 BZL;text-transform:uppercase;
  background:radial-gradient(circle,rgba(255,255,255,.22) 30%,transparent 33%) 0 0/4px 4px,var(--pp) var(--cap);background-blend-mode:normal,multiply;background-size:4px 4px,300px}
.capbar.n2{margin-top:var(--g)}
.tier{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--g);margin-top:var(--g)}
.fc{aspect-ratio:3/4.4;overflow:visible}
.fc .clip{background:#111}
.fc .fimg{position:absolute;max-width:none}
.fc .nm{position:absolute;z-index:4;left:-2.5px;bottom:-2.5px;padding:3px 6px 1px;border:2px solid var(--ink);font:13px/1 BZH;color:var(--ink);
  background:var(--pp) var(--c);background-blend-mode:multiply;background-size:200px}
.fc .bal{left:50%;top:-8px;transform:translateX(-50%);width:104%;padding:6px 3px 5px;font-size:15px;line-height:1}
.fc .bal small{display:block;font-size:12px;margin-top:2px}
.fc .bal .tl{left:calc(50% - 10px);bottom:-20px}
.fc.gr .clip::after{content:"";position:absolute;inset:0;mix-blend-mode:multiply;background:radial-gradient(circle,rgba(0,0,0,.25) 34%,transparent 37%) 0 0/5px 5px,var(--gc)}
.fc .stamp{position:absolute;z-index:5;right:6%;top:9%;width:44%;aspect-ratio:1;display:grid;place-items:center;border:3px solid var(--sc);border-radius:50%;color:var(--sc);font:26px/1 BZH;transform:rotate(-12deg);
  background:rgba(250,240,215,.86);box-shadow:inset 0 0 0 2px rgba(250,240,215,.9),inset 0 0 0 4px var(--sc)}
.fc .pl{position:absolute;z-index:4;left:-2.5px;right:-2.5px;bottom:-2.5px;padding:4px 2px 3px;border:2px solid var(--ink);text-align:center;font:14px/1 BZH;background:var(--pp) #f6ecd0;background-blend-mode:multiply;background-size:200px}
.fc .cl{position:absolute;z-index:6;left:50%;top:-14px;transform:translateX(-50%) rotate(-7deg)}
.t2{display:grid;grid-template-columns:1.62fr 1fr;gap:var(--g);margin-top:var(--g)}
.t2 .pst{aspect-ratio:1}
.t2 .side{display:grid;grid-template-rows:auto 1fr;gap:var(--g)}
.t2 .co{padding:8px 6px 7px;text-align:center}
.t2 .co .lgp{width:72%;aspect-ratio:2/1;margin:0 auto 5px;display:grid;place-items:center;border:2px solid var(--ink);background:var(--pp) #f7efda;background-blend-mode:multiply;background-size:200px;padding:5px}
.t2 .co .lgp img{max-height:100%;max-width:100%;object-fit:contain}
.t2 .co .nm2{font:700 12px/1.1 BZL;text-transform:uppercase;color:#fbf2d9;text-shadow:0 1px 0 #000}
.t2 .mv{display:grid;place-items:center;overflow:hidden}
.t2 .mv .sfx{position:relative;text-align:center;line-height:.95}
.t2 .mv .sfx.w2{display:block;margin-bottom:4px}
.handoff{margin-top:var(--g);text-align:right}
.handoff .capbar{display:inline-block;max-width:80%}
/* ---------- the story so far ---------- */
.chap{position:relative;margin:2px 0 var(--g)}
.chap .ttl{font-size:30px;transform:rotate(-1.2deg);transform-origin:0 100%}
.chap .k{font:700 11.5px/1.2 BZL;text-transform:uppercase;margin-top:6px}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:var(--g)}
.rd{display:flex;flex-direction:column;background:var(--ink)}
.rd .ph{position:relative;aspect-ratio:1}
.rd .ph img{width:100%;height:100%;object-fit:cover}
.rd .cs{position:relative;border-top:2.5px solid var(--ink);padding:4px 6px 5px;font:700 11px/1.15 BZL;text-transform:uppercase;min-height:47px;
  background:radial-gradient(circle,rgba(255,255,255,.2) 30%,transparent 33%) 0 0/4px 4px,var(--pp) var(--cap);background-blend-mode:normal,multiply;background-size:4px 4px,300px}
.rd .cs .co{font-family:BZH;font-weight:400;font-size:10.5px;letter-spacing:.02em;display:block;margin-bottom:2px}
.rd .cs .wn{display:block}
.rd .cs .wn .mk{margin-right:3px;position:relative;top:-1px}
.rd .sfx{right:-7px;bottom:3px}
.rd.nobody .cs{background-color:#e8b9a6}
.more{display:block;width:100%;margin-top:var(--g);border:2.5px solid var(--ink);padding:9px 10px 7px;text-align:center;font:15px/1 BZH;letter-spacing:.04em;color:var(--ink);
  background:var(--pp) var(--cap);background-blend-mode:multiply;background-size:300px;box-shadow:3px 3px 0 var(--ink)}
.more:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
/* ---------- the cast ---------- */
.cast{display:grid;grid-template-columns:1fr 1fr;gap:var(--g)}
.cd{display:flex;flex-direction:column;background:var(--ink)}
.cd .por{position:relative;aspect-ratio:3/3.6;overflow:hidden}
.cd .por img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.cd .rk{position:absolute;z-index:3;left:0;top:0;padding:4px 7px 3px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);font:12px/1 BZH;background:var(--pp) #f4e7c0;background-blend-mode:multiply;background-size:200px}
.cd .nmp{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:22px 7px 4px;background:linear-gradient(transparent,rgba(8,6,4,.85) 45%)}
.cd .nmp .n{font:27px/.9 BZH;color:var(--c);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink),3px 3px 0 var(--ink);display:inline-block;vertical-align:bottom}
.cd .nmp .flag{top:-4px}
.cd .nmp .v{display:block;font:700 10.5px/1.2 BZL;color:#efe3c3;text-transform:uppercase;margin-top:3px}
.cd .st{position:relative;border-top:2.5px solid var(--ink);padding:6px 7px 6px}
.cd .st .pl{font:21px/1 BZH}
.cd .st .kv{display:grid;grid-template-columns:1fr auto;align-items:end;gap:0 6px}
.cd .st .kv>div:first-child{grid-column:1/3;display:contents}
.cd .st .kv .pl{grid-column:1/3}
.cd .st .kv .r{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.cd .st .kv .r .lb{margin:0}
.cd .st .lb{display:block;font:700 9.5px/1.2 BZL;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.cd .st .wl{font:17px/1 BZH}
.cd .st .ps{margin-top:5px;font:700 11.5px/1.2 BZL;text-transform:uppercase}
.cd .st .lr{margin-top:4px;padding-top:4px;border-top:1.5px dashed rgba(23,18,13,.5);font:700 10.5px/1.2 BZL;text-transform:uppercase}
/* ---------- smart or lucky ---------- */
.crowd{aspect-ratio:4/3}
.crowd .bal{left:1%;top:2%;width:60%;aspect-ratio:300/170;font-size:13px;line-height:1.08}
.crowd .bal .bt{position:absolute;inset:22% 15% 20%;display:grid;place-items:center}
.crowd .bal b{color:var(--red)}
.chs{display:grid;gap:var(--g);margin-top:var(--g)}
.ch{padding:0 0 2px;overflow:visible}
.ch .cap{position:relative;display:inline-block;margin:-2.5px 0 4px -2.5px}
.ch svg{display:block;width:100%;height:auto}
.ch .cap{max-width:92%}
.ch .ax{font:700 10.5px BZL;fill:#f2e6c6}
.ch .lbl{font:15px BZH}
.ch .lv{font:700 11px BZL}
.foot{margin-top:var(--g);display:flex;justify-content:flex-end}
.foot .capbar{max-width:88%;font-size:11.5px;background-color:#f1e4bf}
/* ---------- the bet ---------- */
.bet{aspect-ratio:3/4}
.bet .head{position:absolute;z-index:5;left:0;right:0;top:3%;text-align:center}
.bet .head .ttl{font-size:38px;display:inline-block;transform:rotate(-2deg)}
.bet .head .nv{display:inline-block;width:40px;height:40px;vertical-align:-4px;margin-right:8px;padding:5px;border:2.5px solid var(--ink);background:#0b0b0b;transform:rotate(-2deg)}
.bet .head .when{display:inline-block;margin-top:9px;padding:4px 10px 3px;border:2px solid var(--ink);font:13px/1 BZH;letter-spacing:.05em;background:var(--pp) #f4e7c0;background-blend-mode:multiply;background-size:200px;transform:rotate(1.5deg)}
.bet .plq{position:absolute;z-index:4;display:grid;place-items:center;text-align:center;font-family:BZH;color:#3a240b;
  text-shadow:0 1px 0 rgba(255,236,170,.75),0 -1px 0 rgba(60,30,0,.55);mix-blend-mode:multiply}
.bet .plq .a{font-size:30px;line-height:1}
.bet .cap.k1{top:24%;left:-2.5px;max-width:40%}
.bet .cap.k2{top:auto;bottom:-2.5px;left:-2.5px;max-width:52%}
.cd2{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;margin-top:var(--g);padding:9px 10px 8px}
.cd2 .lab{font:700 12px/1.15 BZL;text-transform:uppercase;max-width:9em}
.cd2 .dg{display:flex;gap:6px;justify-content:flex-end}
.cd2 .dg div{text-align:center;min-width:52px;padding:5px 4px 3px;border:2.5px solid var(--ink);background:#0d0b09}
.cd2 .dg b{display:block;font:30px/1 BZH;color:#f6d23e;font-weight:400;font-variant-numeric:tabular-nums}
.cd2 .dg i{display:block;font:700 9px/1.2 BZL;font-style:normal;color:#efe3c3;letter-spacing:.06em}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:var(--g);margin-top:var(--g)}
.rw .pn{aspect-ratio:1/1.05}
.betrow{display:block}
.rw .cap{max-width:none;right:-2.5px}
.rw .cap .h{font-family:BZH;font-weight:400;font-size:16px;display:block;margin-bottom:2px}
.s2{margin-top:var(--g)}
/* ---------- letters + next issue ---------- */
.mail{padding:10px 10px 8px}
.mail .ttl{font-size:26px;display:inline-block;transform:rotate(-1deg)}
.mail .sub{font:700 11px/1.2 BZL;text-transform:uppercase;margin:3px 0 8px}
.mail .lt{padding:8px 0 7px;border-top:1.5px solid rgba(23,18,13,.55);font:12.5px/1.38 BZT;color:var(--ink)}
.mail .lt p{margin:0}.mail .lt .q{font-weight:700;margin-bottom:3px}
.mail .lt .ed{font-weight:700}
.nx{padding:10px 10px 10px}
.nx .ttl{font-size:30px;display:inline-block;transform:rotate(-2deg)}
.nx h3{margin:10px 0 6px;font:13px/1.1 BZH;letter-spacing:.04em;font-weight:400}
.nx .tk{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;margin-top:7px;padding:6px;border:2.5px solid var(--ink);
  background:radial-gradient(110% 90% at 20% 0,rgba(255,250,230,.25),transparent 60%),var(--pp) var(--bc);background-blend-mode:soft-light,multiply;background-size:auto,300px}
.nx .tk .lg{width:52px;height:52px;border:2px solid var(--ink);display:grid;place-items:center;padding:6px;background:var(--pp) #f7efda;background-blend-mode:multiply;background-size:160px}
.nx .tk .lg.dk{background-color:#1a1612}
.nx .tk .lg img{max-width:100%;max-height:100%;object-fit:contain}
.nx .tk .nm{font:700 13px/1.1 BZL;text-transform:uppercase;color:#fbf2d9;text-shadow:0 1px 0 #000,0 0 3px rgba(0,0,0,.6)}
.nx .tk .trs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.nx .tk .tr{display:inline-flex;align-items:center;gap:3px;padding:2px 5px 1px 3px;border:1.5px solid var(--ink);font:11px/1 BZH;background:var(--pp) #f6ecd0;background-blend-mode:multiply;background-size:160px}
.nx .tk .tr .mk{border-radius:2px;padding:1px;background:var(--c)}
.nx .ups{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.nx .up1{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:center;padding:4px;border:2px solid var(--ink);background:var(--pp) var(--bc);background-blend-mode:multiply;background-size:200px}
.nx .up1 .lg{width:30px;height:30px;padding:3px;border:1.5px solid var(--ink);display:grid;place-items:center;background:var(--pp) #f7efda;background-blend-mode:multiply;background-size:120px}
.nx .up1 .lg.dk{background-color:#1a1612}
.nx .up1 .lg img{max-width:100%;max-height:100%}
.nx .up1 span{font:700 10.5px/1.1 BZL;text-transform:uppercase;color:#fbf2d9;text-shadow:0 1px 0 #000,0 0 3px rgba(0,0,0,.6)}
/* ---------- desktop recomposition ---------- */
@media (min-width:1000px){
  .sttl{font-size:46px;margin:6px 0 14px}
  .mast span{-webkit-text-stroke:3.4px var(--ink)}
  .cv .top{font-size:13px}.cv .star{font-size:16px}
  .cv .blurb .q{font-size:36px}
  .cbox .no{font-size:13px}.cbox .nn{font-size:50px}.cbox .mo{font-size:15px}
  .credits{font-size:15px}.credits dt{font-size:13px}
  .indicia{font-size:11.5px}
  .capbar{font-size:15px;padding:7px 11px 6px}
  .fc .bal{font-size:21px}.fc .bal small{font-size:15px}
  .fc .nm{font-size:17px}.fc .pl{font-size:19px}
  .t2 .co .nm2{font-size:15px}
  .chap .ttl{font-size:44px}.chap .k{font-size:15px}
  .rec{grid-template-columns:repeat(4,1fr)}
  .rd .cs{font-size:13px;min-height:56px}.rd .cs .co{font-size:12.5px}
  .cast{grid-template-columns:repeat(4,1fr)}
  .cd .nmp .n{font-size:38px}.cd .nmp .v{font-size:13px}
  .cd .st .pl{font-size:32px}.cd .st .lb{font-size:12px}.cd .st .wl{font-size:20px}.cd .st .ps{font-size:14px}.cd .st .lr{font-size:13px}
  .crowd .bal{font-size:20px;padding:22px 20px 20px}
  .ch .ax{font-size:12px}
  .betw{aspect-ratio:16/9}
  .spread>.pg{display:flex;flex-direction:column}
  .spread.s1{height:920px}
  .s1 .cv{flex:1;aspect-ratio:auto;min-height:0}
  .s1 .sp{flex:1;aspect-ratio:auto;min-height:0}
  .sol .crowd{flex:1;aspect-ratio:auto;min-height:0}
  .sol .crowd .art{object-position:58% 50%}
  .sol .crowd .bal{width:74%;left:1%;top:1.5%}
  .spread .mail,.spread .nx{flex:1}
  .rw .pn{aspect-ratio:16/10}
  .cast{grid-template-columns:1fr 1fr!important}
  .bet .head .ttl{font-size:64px}.bet .head .nv{width:62px;height:62px}.bet .head .when{font-size:19px}
  .bet .plq .a{font-size:46px}
  .betrow{display:grid;grid-template-columns:1fr 2fr;gap:var(--g);margin-top:var(--g)}
  .betrow .cd2,.betrow .rw{margin-top:0}
  .betrow .cd2{grid-template-columns:1fr;align-content:center;justify-items:center;text-align:center;gap:14px}
  .betrow .cd2 .lab{max-width:none;font-size:16px}
  .betrow .cd2 .dg{justify-content:center}.cd2 .dg div{min-width:78px}.cd2 .dg b{font-size:46px}.cd2 .dg i{font-size:12px}
  .rw .cap .h{font-size:22px}
  .mail .ttl,.nx .ttl{font-size:40px}.mail .lt{font-size:16.5px;padding:12px 0 11px}.mail .sub{font-size:15px}.mail{padding:16px 16px 10px}
  .nx .tk{grid-template-columns:64px 1fr;padding:8px}.nx .tk .lg{width:64px;height:64px}.nx .up1{grid-template-columns:40px 1fr;padding:6px}.nx .up1 .lg{width:40px;height:40px}.nx{padding:16px}
  .nx h3{font-size:16px}.nx .tk .nm{font-size:16px}.nx .tk .tr{font-size:13px}
  .nx .tks{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .nx .ups{grid-template-columns:1fr 1fr 1fr}
  .nx .up1 span{font-size:12.5px}
}
</style></head>
<body>
<main class="book" id="book" aria-label="Earnings Zeason, the latest issue"></main>
<script src="../../../../../ez-data.js"></script>
<script>MEDIA="../../../../../media/";</script>
<script src="bz-data.js"></script>
<script src="bz-ui.js"></script>
<script>
(function(){
var B=BZ,U=BZU,S=B.stats(B.R),RK=B.rank(S,"p"),N=B.R.length,L=B.R[N-1];
var DESK=matchMedia("(min-width:1000px)").matches;
var LOGO="../../../../v22/x2p-logo.svg";
var WORDS=["zero","one","two","three","four","five","six","seven","eight","nine","ten"];
function cname(m){return B.NAME[m].toUpperCase()}
function trd(t){return (t.long?"LONG ":"SHORT ")+(t.long?"+":"−")+t.mag+"%"}
function face(m,zoom,fy){/* a crop of the model's portrait, the face kept whole */
  var F={GROK:[.42,.21],CLAUDE:[.52,.27],GPT:[.63,.22],KIMI:[.62,.2]}[m];var Z=zoom||2.1,a=3/4.4;
  var left=(50-F[0]*Z*100),top=((fy||58)-F[1]*Z*(4/3)*a*100);
  return '<img class="fimg" alt="" src="art/cast-'+m.toLowerCase()+'.jpg" style="width:'+(Z*100)+'%;left:'+left.toFixed(1)+'%;top:'+top.toFixed(1)+'%">'}
var H="";
/* ===== COVER ===== */
var mo=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"][B.today.m-1];
var cover='<section class="pg" aria-label="Cover"><div class="pn cv">'+
  '<div class="clip"><img class="art" src="art/cover.jpg" alt="Four figures in silhouette on a skyscraper ledge at dusk, a giant bell swinging above them, green light from the left, red from the right."></div>'+
