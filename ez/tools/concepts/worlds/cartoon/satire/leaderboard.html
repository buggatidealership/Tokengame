<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earnings Zeason · the scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Patrick+Hand+SC&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sat.css">
<style>
/* ===== the scorecard: the magazine's sports pages, printed for the reader who comes back ===== */
.mast{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:3px solid var(--ink);background-image:linear-gradient(rgba(34,6,4,.55),rgba(28,4,3,.62)),url(art/tile-red.jpg);background-size:100% 100%,640px auto}
.mast img{width:40px;height:40px;border:2px solid var(--ink);background:#04070e;transform:rotate(-3deg)}
.mast .tt{font:400 22px/1 var(--H);color:var(--cream);text-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.mast .tt .e{color:#25c26a}.mast .tt .z{color:#ff4a3a}
.mast{flex-wrap:wrap;row-gap:0}
.mast nav{margin-left:auto;display:flex;gap:2px}
@media (max-width:999px){.mast .tt{font-size:19px}.mast nav{width:100%;margin:2px 0 -6px;justify-content:flex-start;gap:10px}.mast nav a{padding:10px 4px}.mast nav a.on{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}}
.mast nav a{font:15px/1 var(--L);letter-spacing:.05em;text-decoration:none;padding:12px 8px;min-height:44px;display:flex;align-items:center}
.mast nav a.on{color:var(--gold)}
/* the form the reader ticks: printed options, the chosen one circled in pencil */
.form{display:grid;gap:8px;margin:4px 0 14px;padding:10px 12px 11px}
.fr{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
.fr .fl{font:13px/1 var(--L);letter-spacing:.1em;color:#7a1b13;min-width:64px}
.opt{position:relative;border:0;background:none;color:var(--ink);font:17px/1 var(--L);letter-spacing:.03em;padding:12px 10px;min-height:44px;cursor:pointer}
.opt[aria-checked="true"]{color:#5c1109}
.opt svg.rg{position:absolute;left:-4px;top:4px;width:calc(100% + 8px);height:calc(100% - 8px);pointer-events:none;overflow:visible;transition:opacity .2s}
.opt[aria-checked="false"] svg.rg{opacity:0}
.wn{font:13.5px/1.2 var(--L);letter-spacing:.03em;color:rgba(21,17,13,.8)}
/* who to follow */
.who{display:grid;grid-template-columns:40% 1fr;gap:12px;align-items:start}
.who .por{border:3px solid var(--ink);box-shadow:4px 5px 0 rgba(0,0,0,.5);aspect-ratio:3/4;overflow:hidden;transform:rotate(-1.5deg)}
.who .por img{width:100%;height:100%;object-fit:cover}
.who .wf{display:grid;gap:8px}
.who .nm{font:400 34px/1 var(--H);text-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;gap:8px}
.who .nm .mk{width:26px;height:26px}
.who .big{font:400 28px/1 var(--H);text-shadow:2px 2px 0 var(--ink)}
.who .lab{font-size:14px;color:rgba(243,230,196,.85)}
.who .ln{border-bottom:1px dashed rgba(243,230,196,.3);padding-bottom:6px}
.empty{padding:12px 14px;font:16px/1.3 var(--L);letter-spacing:.02em}
.gtk{position:relative;margin:14px auto 0;max-width:400px;container-type:inline-size;transform:rotate(-1.5deg);filter:drop-shadow(3px 5px 0 rgba(0,0,0,.5))}
.gtk img{width:100%}
.gtk .gtt{position:absolute;left:26%;right:12%;top:17%;bottom:17%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#3a2404;mix-blend-mode:multiply}
.gtk .gk{font:5.2cqw/1 var(--L);letter-spacing:.12em}
.gtk .gn{display:flex;align-items:center;gap:2cqw;font:400 11cqw/1.05 var(--H)}
.gtk .gn .mk{width:8cqw;height:8cqw}
.gtk .gs{font:4.1cqw/1.15 var(--L);letter-spacing:.03em;white-space:nowrap}
.frz{margin:10px 0 0;font:italic 14.5px/1.35 var(--B);color:rgba(243,230,196,.9)}
/* the leader's next trades */
.nt{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:6px}
.tk{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 10px}
.tk .lg{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:url(art/card.jpg) center/cover;overflow:hidden}
.tk .lg.dk{background:#1b1714}.tk .lg img{width:70%;height:70%;object-fit:contain}
.tk .nm{font:400 16px/1.05 var(--H)}
.tk .wh{font:12.5px/1.2 var(--L);letter-spacing:.03em;opacity:.85}
.tk .hl{grid-column:1/-1;font:13.5px/1.2 var(--L);letter-spacing:.02em;border-top:1.5px dashed rgba(21,17,13,.4);padding-top:5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.tk .hl a{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:3px 10px 2px;border:2px solid var(--ink);border-radius:999px;text-decoration:none;color:var(--ink);background:rgba(23,112,58,.14)}
.tk .hl a b{font:400 14px/1 var(--H)}
.tk .hl .thin{color:#8a4b06}
.stampx{display:inline-flex;align-items:center;gap:5px;padding:4px 8px 2px;border:2.5px solid currentColor;border-radius:4px;font:400 16px/1 var(--H);transform:rotate(-4deg);mix-blend-mode:multiply;white-space:nowrap}
.stampx .mk{width:15px;height:15px}
.stampx.L{color:#17703a}.stampx.S{color:#a8231a}.stampx.N{color:rgba(21,17,13,.6);font:13.5px/1.1 var(--L);border-style:dashed;white-space:normal;grid-column:2/-1;justify-self:start;transform:rotate(-2deg);margin-top:3px}
.grp{font:15px/1 var(--L);letter-spacing:.06em;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,rgba(243,230,196,.5) 0 7px,transparent 7px 11px)}
/* the standings: one printed card, a shared grid, the leader's row in gold */
.tbl{padding:4px 0 2px;overflow:hidden}
.th,.tr{display:grid;grid-template-columns:24px 1fr auto;column-gap:8px;padding:0 10px}
.tr2,.th2{display:grid;grid-template-columns:96px 52px 40px 1fr;column-gap:6px;padding:0 10px 0 42px}
.th,.th2{font:11.5px/1.1 var(--L);letter-spacing:.06em;color:rgba(21,17,13,.75)}
.th{padding-top:8px}.th2{padding-bottom:6px;border-bottom:2px solid var(--ink)}
.th .r,.th2 .r,.tr .r,.tr2 .r{text-align:right}
.row{border-bottom:1.5px dashed rgba(21,17,13,.35);padding:7px 0 7px;position:relative}
.row:last-child{border-bottom:0}
.row.lead{background:linear-gradient(rgba(255,214,120,.25),rgba(170,110,10,.18)),url(art/tile-ochre.jpg) 0 0/640px auto;border-bottom:2px solid var(--ink);border-top:2px solid var(--ink);margin:-1px 0}
.tr{align-items:center}
.tr .ps{font:400 20px/1 var(--H)}
.tr .md{display:flex;align-items:center;gap:6px;font:400 19px/1 var(--H)}
.tr .md .mk{width:18px;height:18px}
.tr .pl{font:22px/1 var(--L)}
.tr2{margin-top:5px;align-items:center;font:15px/1 var(--L);letter-spacing:.02em}
.l5{display:flex;gap:3px;align-items:center}
.l5 i{font-style:normal;width:13px;height:16px;display:grid;place-items:center;font:12px/1 var(--L);border:1.5px solid var(--ink);transform:rotate(-3deg)}
.l5 i.w{color:var(--upi);background:rgba(23,112,58,.12)}.l5 i.l{color:var(--dni);background:rgba(168,35,26,.12)}
.l5 i:nth-child(even){transform:rotate(2deg)}
.tbl .up{color:var(--upi)}.tbl .dn{color:var(--dni)}
.th .dk2{display:none}
@media (max-width:359px){.tr2,.th2{grid-template-columns:84px 46px 38px minmax(0,1fr);column-gap:5px;padding-left:30px}.tr .md{font-size:17px}.l5 i{width:12px}}
.th2 small{font-size:10px;letter-spacing:.04em}
.l5 i:last-child{border-width:2.5px}
.cap2{margin:8px 0 0;font:13px/1.3 var(--L);letter-spacing:.03em;opacity:.85}
/* chart */
.chw{margin-top:18px}
.chh{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap;margin:2px 0 2px}
.chh h3{font:400 23px/1 var(--H);margin:0;text-shadow:2px 2px 0 var(--ink)}
.chh p{margin:0;font:italic 14px/1.25 var(--B);color:rgba(243,230,196,.88);flex-basis:100%}
.ch svg{display:block;overflow:visible}
.ch-ax{font:12px var(--L);fill:rgba(243,230,196,.72)}
.ch-lb{font:14px var(--L);letter-spacing:.02em;paint-order:stroke;stroke:rgba(10,8,6,.85);stroke-width:3px}
.ch-v{fill:var(--cream)}
.ch-empty{padding:30px 10px;text-align:center;font:16px/1.3 var(--L)}
/* listed-only */
.hlt{margin-top:12px;padding:10px 12px}
.hlt h3{font:400 18px/1.1 var(--H);margin:0 0 6px}
.hlt .g{display:grid;grid-template-columns:1fr 60px 92px;gap:4px 8px;font:15px/1.15 var(--L)}
.hlt .g .r{text-align:right}
.hlt .g .hd2{font-size:11.5px;letter-spacing:.06em;opacity:.75}
.hlt p{margin:7px 0 0;font:12.5px/1.3 var(--B)}
/* by sector */
.sct{padding:6px 0}
.sx{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,48px);column-gap:4px;padding:5px 10px;align-items:center;border-bottom:1.5px dashed rgba(21,17,13,.3);font:15px/1 var(--L)}
.sx:last-child{border-bottom:0}
.sx.h{font-size:11.5px;letter-spacing:.06em;border-bottom:2px solid var(--ink)}
.sx.h span{display:flex;justify-content:center}
.sx .mk{width:17px;height:17px}
.sx .c{text-align:center;position:relative;padding:6px 0}
.sx .c.best svg.rg{position:absolute;left:-2px;top:0;width:calc(100% + 4px);height:100%;pointer-events:none;overflow:visible}
.sx .s{font:14px/1.1 var(--L)}
/* biggest W and L, as gags */
.wl{display:grid;gap:10px}
.wlr{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:6px 8px;align-items:stretch}
.wlr .who2{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:54px}
.wlr .face{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--ink);box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.wlr .fn{font:400 14px/1 var(--H)}
.bx{padding:7px 8px 8px;display:flex;flex-direction:column;gap:3px}
.bx .k{font:11.5px/1 var(--L);letter-spacing:.08em}
.bx.w .k{color:var(--upi)}.bx.l .k{color:var(--dni)}
.bx .co{display:flex;align-items:center;gap:5px;font:14px/1.1 var(--L)}
.bx .co img{width:20px;height:20px;object-fit:contain;flex:none;border-radius:50%;background:url(art/card.jpg) center/cover;border:1px solid var(--ink);padding:1px}
.bx .co img.dk{background:#1b1714}
.bx .am{font:400 20px/1 var(--H)}
.bx.w .am{color:var(--upi)}.bx.l .am{color:var(--dni)}
.bx .rr{font:12px/1 var(--L);opacity:.75}
.gagl{margin:12px 0 0;padding:9px 12px;font:16px/1.3 var(--L);letter-spacing:.02em;transform:rotate(-.5deg)}
.gagl b{font:400 18px/1 var(--H)}
.small{margin-top:14px;padding:10px 12px;font:13px/1.35 var(--B)}
.small b{font:400 15px/1 var(--H);display:block;margin-bottom:3px}

@media (min-width:1000px){
  .mast{padding:12px 40px}.mast .tt{font-size:30px}.mast img{width:50px;height:50px}.mast nav a{font-size:18px}
  .who{grid-template-columns:44% 1fr;gap:22px}
  .who .nm{font-size:48px}.who .big{font-size:40px}.who .lab{font-size:16px}
  .spread.two.lb1{grid-template-columns:minmax(0,.84fr) minmax(0,1.16fr)}
  .th,.tr{grid-template-columns:28px minmax(0,1.3fr) 100px 58px 54px minmax(0,1fr) minmax(0,.9fr);padding:0 14px;align-items:center}
  .th2{display:none}
  .th .dk2{display:block}
  .th>span{grid-row:1}.th>span:nth-child(1){grid-column:1}.th>span:nth-child(2){grid-column:2}.th>span:nth-child(3){grid-column:6}.th>span:nth-child(4){grid-column:3}.th>span:nth-child(5){grid-column:4}.th>span:nth-child(6){grid-column:5}.th>span:nth-child(7){grid-column:7}
  .tr2{display:contents}
  .row{display:grid;grid-template-columns:28px minmax(0,1.3fr) 100px 58px 54px minmax(0,1fr) minmax(0,.9fr);column-gap:7px;padding:12px 14px;align-items:center}
  .row .tr{display:contents}
  .row .tr .pl{grid-column:6;text-align:right}
  .row .tr2>*{grid-row:1}
  .row .tr2 .l5{grid-column:3}.row .tr2 .wlv{grid-column:4}.row .tr2 .hit{grid-column:5}.row .tr2 .lcv{grid-column:7}
  .th{padding:10px 16px 8px;border-bottom:2px solid var(--ink);font-size:13px}
  .tr .md{font-size:21px}.tr .pl{font-size:23px}.tr2{font-size:17px}.tr .ps{font-size:22px}.th{font-size:12px}
  .chh h3{font-size:30px}
  .sx{grid-template-columns:minmax(0,1fr) repeat(4,72px);padding:11px 16px;font-size:18px}
  #sector .mg{width:170px!important}
  .wlr .who2{width:70px}.wlr .face{width:60px;height:60px}
  .bx .am{font-size:26px}.bx .co{font-size:16px}
  .nt{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="mast"><img src="../../../../../tools/v22/x2p-logo.svg" alt="EZ."><span class="tt"><span class="e">E</span>arnings <span class="z">Z</span>eason</span>
 <nav aria-label="Pages"><a href="overview.html">This issue</a><a class="on" href="leaderboard.html" aria-current="page">Scorecard</a></nav></header>
<main class="mag">
  <div class="spread two lb1"><section class="pg w-ink" id="follow" aria-labelledby="h-fl"></section><section class="pg w-green" id="board" aria-labelledby="h-bd"></section></div>
  <div class="spread two"><section class="pg w-ochre" id="sector" aria-labelledby="h-sc"></section><section class="pg w-red" id="bigwl" aria-labelledby="h-wl"></section></div>
</main>
<script src="../../../../../ez-data.js"></script>
<script src="sat-data.js"></script>
<script src="sat-ui.js"></script>
<script>
(async function(){
'use strict';
const S=window.SAT,U=window.SUI,D=S.compute(),esc=S.esc,NM=S.NM,MK=D.MK;
let HL=null;try{HL=await (await fetch('../hl-markets-2026-11-03.json')).json()}catch(e){HL=null}
const SHOT=/[?&]shot=1/.test(location.search),RMQ=matchMedia('(prefers-reduced-motion: reduce)');
const mk=(m,c)=>'<span class="mk" style="color:'+(c||S.COL[m])+'">'+U.mark(m)+'</span>';
const co=t=>esc(S.coT(t));
const logoWrap=(t,cls)=>{const L=S.logo(t);return '<span class="'+cls+(L&&L.dark?' dk':'')+'">'+(L?'<img src="'+L.src+'" alt="">':'')+'</span>'};
const issueNo=D.RS.length,p100='$100K';
const pc1=v=>(v*100).toFixed(1).replace(/\.0$/,'')+'%';
const fol=(p,lab)=>'<footer class="fol"><span>p. '+p+'</span><span>'+esc(lab)+'</span><span>Earnings Zeason · No. '+issueNo+'</span></footer>';
const st={win:'season',rank:'pnl'};
const WL={season:'Season',d7:'7 days',d1:'24 hours'};
const winLab=k=>({season:'season',d7:'7 days',d1:'24h'})[k];
const hlOf=t=>S.hlFor(HL,t);
const lcName=S.wdmd(S.dOf(D.lcRs[0].resolves)),lcShort=S.md(S.dOf(D.lcRs[0].resolves));
function order(){const w=D.win[st.win];return MK.slice().sort((a,b)=>{if(st.rank==='hit'){const x=w[a].hit,y=w[b].hit;if(x==null&&y==null)return w[b].pnl-w[a].pnl;if(x==null)return 1;if(y==null)return -1;return y-x||w[b].pnl-w[a].pnl}return w[b].pnl-w[a].pnl})}
const goldM=D.rank[0];
const frz=D.freeze?S.nyFmt(D.freeze,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';

/* the form: printed options; the chosen one is circled by the reader's pencil */
function form(){const o=(g,k,t)=>'<button type="button" class="opt" role="radio" aria-checked="'+(st[g]===k)+'" data-g="'+g+'" data-k="'+k+'">'+t+U.ring('#a8231a')+'</button>';
  return '<div class="form card" role="group" aria-label="Choose the window and the ranking">'+
   '<div class="fr" role="radiogroup" aria-label="Window"><span class="fl">Window</span>'+o('win','season','Season')+o('win','d7','7 days')+o('win','d1','24 hours')+'</div>'+
   '<div class="fr" role="radiogroup" aria-label="Rank by"><span class="fl">Rank by</span>'+o('rank','pnl','P&amp;L')+o('rank','hit','Hit rate')+'</div>'+
   '<div class="wn" id="wn"></div></div>'}

function follow(){const w=D.win[st.win],ord=order(),m=ord[0],x=w[m],W=D.WIN[st.win];
  const has=W.rs.length>0;
  const nxt=D.pend.filter(r=>{const c=S.closeAt(r.ticker,r.resolves);return !c||c>D.NOW}).concat(D.upc.filter(u=>!u.called||S.dOf(u.called)>=D.today)).slice(0,4);
  const card=r=>{const c=r.calls&&r.calls.find(c=>c.m===m),h=hlOf(r.ticker),when=r.resolves?'at the close '+S.wdmd(S.dOf(r.resolves)):'trades due '+S.md(S.dOf(r.called));
   return '<article class="tk card">'+logoWrap(r.ticker,'lg')+'<div><div class="nm">'+co(r.ticker)+'</div><div class="wh">Round '+r.n+' · '+esc(when)+'</div></div>'+
    (c?'<span class="stampx '+(c.dir==='UP'?'L':'S')+'">'+mk(m,'currentColor')+(c.dir==='UP'?'Long':'Short')+'</span>':'<span class="stampx N">trades drop before the earnings</span>')+
    '<div class="hl">'+(h?(c?'<a href="https://app.hyperliquid.xyz/trade/'+esc(h.name)+'" rel="noopener">Follow on Hyperliquid <b>'+esc(h.name)+'</b></a>':'<span>On Hyperliquid: <b style="font-weight:400">'+esc(h.name)+'</b></span>')+'<span class="'+(h.thin?'thin':'')+'">$'+h.oi.toFixed(1)+'M open interest'+(h.thin?' · thin market':'')+'</span>':'<span style="opacity:.75">No Hyperliquid market</span>')+'</div></article>'};
  document.getElementById('follow').innerHTML=
   '<p class="kick">The scorecard · who to follow right now</p><h2 class="hd" id="h-fl">Who to follow?</h2>'+form()+
   (has?'<div class="who"><div class="por"><img src="'+U.PORT[m]+'" alt="'+NM[m]+', drawn as a caricature of its lab’s founder"></div><div class="wf">'+
     '<div class="nm">'+mk(m)+NM[m]+'</div>'+
     '<div class="ln"><div class="big num '+(x.pnl>=0?'up':'dn')+'">'+S.$f(x.pnl)+'</div><div class="lab">'+esc(W.lab)+', flat '+p100+' a trade</div></div>'+
     '<div class="ln"><div class="big num">'+x.W+'-'+x.L+'</div><div class="lab">W-L, '+winLab(st.win)+'</div></div>'+
     '<div><div class="big num">'+(x.hit==null?'–':pc1(x.hit))+'</div><div class="lab">hit rate, '+winLab(st.win)+(x.hit==null?' (needs 5 trades)':' on '+x.n+' trades')+'</div></div></div></div>'
    :'<p class="empty card">'+esc(W.when)+'. Nothing new to rank yet.</p>')+
   '<div class="gtk" id="gtk"><img src="art/ticket.webp" alt=""><div class="gtt"><span class="gk">The golden ticket · season</span><span class="gn">'+mk(goldM,'currentColor')+NM[goldM]+'</span><span class="gs">top season P&amp;L: '+S.$f(D.per[goldM].pnl)+'</span></div></div>'+
   '<p class="frz">The board freezes '+esc(frz)+' New York time, 24 hours before NVIDIA reports. The top model’s trade is the bet.</p>'+
   '<p class="grp">'+NM[m]+'’s next trades</p><div class="nt">'+nxt.map(card).join('')+'</div>'+
   fol(1,'Who to follow');
  document.getElementById('wn').textContent=WL[st.win]+': '+W.when+'.';
  bind();fitTicket()}

function board(){const w=D.win[st.win],ord=order(),W=D.WIN[st.win],wl=winLab(st.win);
  const head='<div class="th"><span>#</span><span>Model</span><span class="r dk">P&amp;L · '+wl+'</span><span class="dk2">Last 5 · old → new</span><span class="dk2">W-L · '+wl+'</span><span class="dk2">Hit · '+wl+'</span><span class="dk2 r">'+esc(lcShort)+' close</span></div>'+
   '<div class="th2"><span>Last 5<br><small>old → new</small></span><span>W-L</span><span>Hit</span><span class="r">'+esc(lcShort)+' close</span></div>';
  const rows=ord.map((m,k)=>{const x=w[m],P=D.per[m];return '<div class="row'+(k===0?' lead':'')+'"><div class="tr"><span class="ps">'+(k+1)+'</span><span class="md">'+mk(m,'#15110d')+NM[m]+' '+U.flag(P.flag)+'</span><span class="pl num '+(x.pnl>=0?'up':'dn')+'">'+(W.rs.length?S.$f(x.pnl):'–')+'</span></div>'+
    '<div class="tr2"><span class="l5">'+P.last5.map(t=>'<i class="'+(t.ok?'w':'l')+'">'+(t.ok?'W':'L')+'</i>').join('')+'</span><span class="wlv num">'+(x.n?x.W+'-'+x.L:'–')+'</span><span class="hit num">'+(x.hit==null?'–':pc1(x.hit))+'</span><span class="lcv num r '+(D.lc[m].pnl>=0?'up':'dn')+'">'+S.$f(D.lc[m].pnl)+'</span></div></div>'}).join('');
  const hp=S.hlPnl(D,HL),hord=MK.slice().sort((a,b)=>hp[b].pnl-hp[a].pnl),nL=D.RS.filter(r=>hlOf(r.ticker)).length;
  document.getElementById('board').innerHTML=
   '<p class="kick">The standings · ranked by '+(st.rank==='pnl'?'P&amp;L':'hit rate')+' · '+esc(WL[st.win].toLowerCase())+'</p><h2 class="hd" id="h-bd">The table</h2>'+
   '<div class="tbl card" role="table" aria-label="Standings">'+head+rows+'</div>'+
   '<p class="cap2">'+esc(lcShort)+' close = the P&amp;L on the '+D.lcRs.length+' rounds graded at the '+esc(lcName)+' close. Last 5 = each model’s five newest trades. Hit rate shows from 5 trades.</p>'+
   '<div class="chw"><div class="chh"><h3 id="h-ch"></h3><p id="chp"></p></div><div class="ch" id="ch"></div></div>'+
   (HL?'<div class="hlt card"><h3>Only companies Hyperliquid lists today</h3><div class="g"><span class="hd2">Model · season</span><span class="hd2 r">W-L</span><span class="hd2 r">P&amp;L</span>'+hord.map(m=>'<span>'+mk(m,'#15110d')+' '+NM[m]+'</span><span class="r num">'+hp[m].W+'-'+hp[m].L+'</span><span class="r num '+(hp[m].pnl>=0?'up':'dn')+'">'+S.$f(hp[m].pnl)+'</span>').join('')+'</div>'+
    '<p>'+nL+' of '+issueNo+' rounds. Listed as of Nov 3; most of these companies were not on Hyperliquid when the trade was made.</p></div>':'')+
   fol(2,'The table')}

function chart(draw){const W=D.WIN[st.win],mode=st.rank==='hit'?'hit':'pnl';
  document.getElementById('h-ch').textContent=(mode==='pnl'?'P&L':'Hit rate')+' · '+WL[st.win];
  document.getElementById('chp').textContent=mode==='pnl'?p100+' on every trade, round by round. Under the waterline means losing money.':'How often each AI’s long or short was right, round by round. Every line starts at 50%.';
  const el=document.getElementById('ch'),w=el.clientWidth,h=Math.round(DESK()?420:Math.max(220,Math.min(290,w*.66)));
  const o={D,mode,rs:W.rs,w,h,draw,empty:W.when,aria:(mode==='pnl'?'P&L':'Hit rate')+' after each round, '+WL[st.win],labGap:18,x0:'Start',face:DESK()?10:8};U.chart(el,o);
  /* desktop: the chart takes the height the facing page leaves, so neither page of the spread ends in blank stock */
  if(DESK()){const a=document.getElementById('follow'),b=document.getElementById('board');const kids=p=>Math.max(...[...p.children].map(k=>k.getBoundingClientRect().bottom));
    const d=(kids(a)-a.getBoundingClientRect().top)-(kids(b)-b.getBoundingClientRect().top);if(Math.abs(d)>4){o.h=Math.max(300,Math.min(680,h+d));o.draw=false;U.chart(el,o)}}}

function sector(){const ord=D.rank;
  const rows=D.sectors.map(s=>{const v=ord.map(m=>D.per[m].sect[s]||{w:0,n:0}),rt=v.map(q=>q.n>=3?q.w/q.n:-1),bm=Math.max(...rt),best=rt.every(x=>x===bm)?2:bm;
   return '<div class="sx"><span class="s">'+esc(s)+'</span>'+v.map(q=>'<span class="c'+(q.n>=3&&q.w/q.n===best?' best':'')+'">'+(q.n?q.w+'/'+q.n:'–')+(q.n>=3&&q.w/q.n===best?U.ring('#a8231a'):'')+'</span>').join('')+'</div>'});
  document.getElementById('sector').innerHTML='<p class="kick">By sector · season</p><h2 class="hd" id="h-sc">Where they win</h2>'+
   '<p class="deck">Trades won of trades made, by sector. The pencil circles the best in each row (3 trades or more).</p>'+
   '<div class="sct card" role="table" aria-label="By sector"><div class="sx h"><span>Sector</span>'+ord.map(m=>'<span title="'+NM[m]+'">'+mk(m,'#15110d')+'</span>').join('')+'</div>'+rows.join('')+'</div>'+
   '<div class="mg" style="position:relative;width:110px;margin:12px 0 0 auto;transform:rotate(-3deg)"><img src="art/d-bullbear.webp" alt=""><i>long chases short, every sector</i></div>'+fol(3,'By sector')}

function bigwl(){const ord=D.rank,sh=D.shared;
  const bx=(t,k)=>{const L=S.logo(t.r.ticker);return '<div class="bx card '+k+'"><span class="k">'+(k==='w'?'Biggest W':'Biggest L')+'</span><span class="co">'+(L?'<img src="'+L.src+'" alt=""'+(L.dark?' class="dk"':'')+'>':'')+co(t.r.ticker)+'</span><span class="am num">'+S.$f(t.v)+'</span><span class="rr">Round '+t.n+' · moved '+S.mv(t.r.a)+'</span></div>'};
  let gag='';if(sh&&sh.ms.length>=2){const r=D.RS.find(x=>x.n===sh.n),other=MK.filter(m=>sh.ms.indexOf(m)<0&&D.per[m].best.n===sh.n);
   gag='<p class="gagl card"><b>Same stock, same day.</b> '+co(r.ticker)+', round '+sh.n+', is the biggest L for '+sh.ms.map(m=>NM[m]).join(', ').replace(/, ([^,]*)$/,' and $1')+' ('+S.$f(r.__t[sh.ms[0]].v)+' each)'+(other.length?', and the biggest W for '+other.map(m=>NM[m]).join(' and ')+' ('+S.$f(r.__t[other[0]].v)+').':'.')+'</p>'}
  document.getElementById('bigwl').innerHTML='<p class="kick">Biggest W and L · season</p><h2 class="hd" id="h-wl">The big score, the big ouch</h2>'+
   '<p class="deck">Each model’s best and worst single trade this season, '+p100+' a trade.</p>'+
   '<div class="wl">'+ord.map(m=>'<div class="wlr"><span class="who2"><i class="face" style="'+U.faceBg(m)+'"></i><span class="fn">'+NM[m]+'</span></span>'+bx(D.per[m].best,'w')+bx(D.per[m].worst,'l')+'</div>').join('')+'</div>'+gag+
   '<div class="small card"><b>The small print</b>Simulated record, '+p100+' a trade, before fees. Not financial advice. Trading can lose money; the pool can be wiped out. Hyperliquid is not available in every country. Market data: Hyperliquid, as of Nov 3. Everything else: the EZ sheet, '+issueNo+' graded rounds.</div>'+
   fol(4,'Biggest W and L')}

function DESK(){return matchMedia('(min-width:1000px)').matches}
function fitTicket(){const g=document.getElementById('gtk');if(!g)return;g.querySelectorAll('.gk,.gn,.gs').forEach(e=>{e.style.fontSize='';let f=parseFloat(getComputedStyle(e).fontSize),k=40;while(k-->0&&e.scrollWidth>e.parentElement.clientWidth+.5){f-=.5;e.style.fontSize=f+'px'}})}
function bind(){document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st[b.dataset.g]=b.dataset.k;all(!RMQ.matches&&!SHOT)})}
function all(draw){follow();board();chart(draw)}
all(false);sector();bigwl();
let lw=innerWidth;addEventListener('resize',()=>{if(innerWidth!==lw){lw=innerWidth;all(false)}});
if(document.fonts)document.fonts.ready.then(()=>{fitTicket();chart(false)});
if(!SHOT&&'IntersectionObserver' in window){const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){chart(!RMQ.matches);io.disconnect()}})},{threshold:.3});io.observe(document.getElementById('ch'))}
if(location.hash){const m=location.hash.match(/win=(\w+)/),r=location.hash.match(/rank=(\w+)/);if(m&&WL[m[1]])st.win=m[1];if(r)st.rank=r[1];all(false)}
window.__satD=D;
})();
</script>
</body>
