<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earnings Zeason · this month's issue</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Patrick+Hand+SC&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sat.css">
<style>
/* ===== COVER: the painted front cover. Masthead and cover lines sit in the painting's open sky; the four stand with
   their backs to us (the faces come later). ===== */
.cover{padding:0;background:#0b0a09}
.cv{position:relative;container-type:inline-size}
.cv>img{width:100%;aspect-ratio:3/4;object-fit:cover}
.cv-mast{position:absolute;left:3.2%;right:3.2%;top:1.6%;display:flex;align-items:center;gap:2.4cqw}
.cv-box{flex:none;width:12.5cqw;aspect-ratio:1;border:.5cqw solid var(--ink);background:#04070e;box-shadow:.7cqw .9cqw 0 rgba(0,0,0,.45);display:grid;place-items:center;transform:rotate(-3deg)}
.cv-box img{width:86%}
.cv-tt{flex:1;min-width:0;font:400 9cqw/1.05 var(--H);margin:0;white-space:nowrap;color:var(--cream);letter-spacing:-.01em;-webkit-text-stroke:.5cqw var(--ink);paint-order:stroke fill;text-shadow:.7cqw .9cqw 0 rgba(21,17,13,.85)}
.cv-tt .e{color:#25c26a}.cv-tt .z{color:#ff4a3a}
.cv-issue{position:absolute;left:3.4%;top:13.2%;margin:0;font:3.15cqw/1.1 var(--L);color:var(--ink);letter-spacing:.06em;transform:rotate(-1.5deg)}
.cv-issue b{font-weight:400;border-bottom:.35cqw solid var(--ink)}
.cv-line{position:absolute;left:3.4%;top:17.4%;width:72%;margin:0;font:400 4.7cqw/1.07 var(--H);color:var(--ink);transform:rotate(-2deg)}
.cv-line span{display:block;color:#a8231a;margin-top:.6cqw}
.cv-foot{background-image:linear-gradient(rgba(34,6,4,.55),rgba(28,4,3,.62)),url(art/tile-red.jpg);background-size:100% 100%,640px auto;padding:12px 16px 14px;display:grid;gap:9px;border-top:3px solid var(--ink)}
.cf-row{display:flex;gap:10px;align-items:baseline;text-decoration:none}
.cf-n{flex:none;font:400 21px/1 var(--H);color:var(--gold);text-shadow:2px 2px 0 var(--ink);min-width:44px}
.cf-t{font:15px/1.22 var(--L);letter-spacing:.02em}
.cf-t b{font-weight:400;color:var(--gold)}

/* ===== THE VERDICT ===== */
.vd{display:grid;grid-template-columns:41% 1fr;gap:12px;align-items:start}
.vd .por{border:3px solid var(--ink);box-shadow:4px 5px 0 rgba(0,0,0,.5);aspect-ratio:3/4;overflow:hidden;transform:rotate(-1.5deg)}
.vd .por img{width:100%;height:100%;object-fit:cover}
.vf{display:grid;gap:9px}
.vf .big{font:400 30px/1 var(--H);text-shadow:2px 2px 0 var(--ink)}
.vf .lab{font-size:14px;color:rgba(243,230,196,.85)}
.vf .ln{border-bottom:1px dashed rgba(243,230,196,.3);padding-bottom:7px}
.range{margin-top:14px;padding:10px 12px 8px}
.range h3{font:400 18px/1.1 var(--H);margin:0 0 2px}
.range p{margin:0 0 8px;font:13.5px/1.25 var(--B)}
.rb{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;align-items:center}
.rb .n{font:14px/1 var(--L);display:flex;align-items:center;gap:4px}
.rb .n .mk{width:15px;height:15px}
.rb .tr{position:relative;height:18px;border-left:1px solid rgba(21,17,13,.25);border-right:1px solid rgba(21,17,13,.25)}
.rb .tr::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dotted rgba(21,17,13,.35)}
.rb .bar{position:absolute;top:3px;bottom:3px;border:2px solid var(--ink);border-radius:9px;box-shadow:1px 2px 0 rgba(0,0,0,.25)}
.rb .pt{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--ink)}
.rb .fifty{position:absolute;top:-6px;bottom:-6px;border-left:2px dashed #a8231a}
.rb .ax{grid-column:2;position:relative;height:14px;font:11.5px/1 var(--L)}
.rb .ax span{position:absolute;transform:translateX(-50%)}
.handoff{margin:12px 0 0;font:italic 15px/1.3 var(--B)}
.handoff a{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--gold)}

/* the verdict's last beat: the leader's next trade, as a clipped coupon that points to the next page */
.nxc{margin-top:14px;display:grid;grid-template-columns:48px 1fr;gap:4px 10px;align-items:center;padding:9px 11px 10px;text-decoration:none;transform:rotate(-.8deg)}
.nxc .nxk{grid-column:1/-1;font:13px/1 var(--L);letter-spacing:.1em;color:#7a1b13}
.nxc .lg{width:48px;height:48px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:url(art/card.jpg) center/cover;overflow:hidden}
.nxc .lg.dk{background:#1b1714}.nxc .lg img{width:70%;height:70%;object-fit:contain}
.nxm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.nxm b{font:400 19px/1 var(--H)}
.nxm i{flex-basis:100%;font:normal 13.5px/1.2 var(--L);letter-spacing:.03em}
/* ===== NEXT TRADES ===== */
.grp{font:15px/1 var(--L);letter-spacing:.06em;margin:14px 0 7px;display:flex;align-items:center;gap:8px;color:var(--cream)}
.grp::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,rgba(243,230,196,.5) 0 7px,transparent 7px 11px)}
.nt{display:grid;gap:10px}
.tk{padding:10px 11px 10px;display:grid;grid-template-columns:52px 1fr;gap:4px 10px;align-items:start}
.tk .lg{grid-row:span 2;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:url(art/card.jpg) center/cover;overflow:hidden;box-shadow:1px 2px 0 rgba(0,0,0,.35)}
.tk .lg.dk{background:#1b1714}
.tk .lg img{width:70%;height:70%;object-fit:contain}
.tk .nm{font:400 19px/1.05 var(--H)}
.tk .wh{font:13.5px/1.15 var(--L);letter-spacing:.03em;opacity:.85;margin-top:2px}
.tk .row{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:4px}
.stampx{display:inline-flex;align-items:center;gap:6px;padding:5px 9px 3px;border:2.5px solid currentColor;border-radius:4px;font:400 19px/1 var(--H);transform:rotate(-4deg);mix-blend-mode:multiply;letter-spacing:.02em}
.stampx .mk{width:18px;height:18px}
.stampx.L{color:#17703a}.stampx.S{color:#a8231a}
.field{font:14px/1.2 var(--L);letter-spacing:.02em;display:flex;flex-wrap:wrap;gap:3px 10px}
.field span{display:inline-flex;align-items:center;gap:3px}
.field .mk{width:14px;height:14px}
.field .L{color:#17703a}.field .S{color:#a8231a}
.hl{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:6px;padding-top:7px;border-top:1.5px dashed rgba(21,17,13,.45);font:14px/1.2 var(--L);letter-spacing:.02em}
.hl a{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 10px 3px;border:2px solid var(--ink);border-radius:999px;text-decoration:none;color:var(--ink);background:rgba(23,112,58,.14);font:15px/1 var(--L)}
.hl a b{font:400 15px/1 var(--H)}
.hl .thin{color:#8a4b06}
.hl .none{opacity:.75}
.tk.sm{grid-template-columns:40px 1fr;padding:8px 10px}
.tk.sm .lg{width:40px;height:40px}
.tk.sm .nm{font-size:16px}
.tk.sm .stampx{font-size:15px;padding:4px 7px 2px}
.due{display:grid;gap:7px}
.du{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 9px;border-bottom:1.5px dashed rgba(243,230,196,.25)}
.du .lg{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);background:url(art/card.jpg) center/cover;display:grid;place-items:center;overflow:hidden}
.du .lg.dk{background:#1b1714}
.du .lg img{width:70%;height:70%;object-fit:contain}
.du .nm{font:16px/1.1 var(--L);letter-spacing:.02em}
.du .wh{font:12.5px/1.1 var(--L);opacity:.75;letter-spacing:.03em}
.du .hm{font:13px/1.1 var(--L);text-align:right;letter-spacing:.02em}
.du .hm b{display:block;font-weight:400;color:var(--up)}
.du .hm .thin{color:#f0b65a}
.stampx.sm{font-size:14px;padding:3px 6px 1px;border-width:2px;mix-blend-mode:normal}.stampx.sm.L{color:#5ad48b}.stampx.sm.S{color:#ff7a6b}
.du.hid{display:none}.due.all .du.hid{display:grid}
.more{margin:12px auto 2px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;cursor:pointer;font:16px/1 var(--L);letter-spacing:.04em}
.src{margin:10px 0 0;font:12.5px/1.3 var(--L);letter-spacing:.03em;opacity:.75}

/* ===== HOW WE KEEP SCORE ===== */
.keeper{position:relative;container-type:inline-size;margin:2px -16px 10px}
.keeper img{width:100%;-webkit-mask-image:linear-gradient(transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(transparent,#000 4%,#000 96%,transparent)}
.strip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;position:relative}
.pn{position:relative;border:2.5px solid var(--ink);box-shadow:3px 4px 0 rgba(0,0,0,.5);overflow:hidden;background-size:cover;display:flex;flex-direction:column;container-type:inline-size}
.pn .cap{position:relative;z-index:2;margin:0;padding:5px 7px 6px;font:13.5px/1.12 var(--L);letter-spacing:.015em;color:var(--ink);background:url(art/card.jpg) center/cover;border-bottom:2px solid var(--ink)}
.pn .cap b{font:400 15px/1 var(--H);margin-right:3px;color:#a8231a}
.pn .art{flex:1;position:relative;display:grid;place-items:center;padding:8px 6px}
.p1{background-image:linear-gradient(rgba(4,6,12,.25),rgba(4,6,12,.35)),url(art/tile-ink.jpg)}
.p2{background-image:linear-gradient(rgba(6,22,14,.35),rgba(6,22,14,.45)),url(art/tile-green.jpg)}
.p3{background-image:linear-gradient(rgba(38,24,4,.35),rgba(30,18,2,.45)),url(art/tile-ochre.jpg)}
.p4{background-image:linear-gradient(rgba(34,6,4,.40),rgba(28,4,3,.48)),url(art/tile-red.jpg)}
.co-card{display:grid;justify-items:center;gap:5px;text-align:center}
.co-card .lgw{width:30cqw;aspect-ratio:1;border-radius:50%;background:url(art/card.jpg) center/cover;border:2px solid var(--ink);display:grid;place-items:center;box-shadow:2px 3px 0 rgba(0,0,0,.5)}
.co-card .lgw img{width:68%;height:68%;object-fit:contain}
.co-card .nm{font:16px/1.05 var(--L);letter-spacing:.02em}
.trd{display:grid;grid-template-columns:1fr 1fr;gap:5px 6px;width:100%}
.tr{display:flex;align-items:center;gap:5px;font:13px/1 var(--L);letter-spacing:.02em}
.tr .mk{width:20px;height:20px;flex:none}
.tr .bl{background:url(art/card.jpg) center/cover;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:3px 6px 2px;white-space:nowrap}
.tr .bl.L{color:var(--upi)}.tr .bl.S{color:var(--dni)}
.tr .st{font:400 14px/1 var(--H);transform:rotate(-8deg);display:inline-block}
.mvbig{font:400 30px/1 var(--H);text-shadow:2px 2px 0 var(--ink);margin-bottom:4px}
.pnl-l{display:grid;gap:3px;width:100%;font:14px/1.1 var(--L)}
.pnl-l div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed rgba(243,230,196,.3);padding-bottom:2px}

/* ===== THE RECORD ===== */
.gags{display:grid;gap:12px}
.gag{display:grid;grid-template-columns:42% 1fr;gap:10px;align-items:start}
.gag .fr{border:3px solid var(--ink);box-shadow:4px 5px 0 rgba(0,0,0,.5);transform:rotate(-1deg);background:#000}
.gag:nth-child(2) .fr{transform:rotate(1.2deg)}
.gag .fr img{width:100%;aspect-ratio:1;object-fit:cover}
.gag .gl{font:400 19px/1.08 var(--H);margin:2px 0 5px;color:var(--cream);text-shadow:2px 2px 0 var(--ink)}
.gag .fx{font:14px/1.3 var(--L);letter-spacing:.02em}
.gag .fx .mk{width:15px;height:15px}
.sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 7px}
.tl{display:flex;flex-direction:column}
.tl .th{border:2px solid var(--ink);box-shadow:2px 3px 0 rgba(0,0,0,.5);aspect-ratio:1;overflow:hidden;background:#000}
.tl .th img{width:100%;height:100%;object-fit:cover}
.tl .tc{padding:4px 1px 0;font:12px/1.12 var(--L);letter-spacing:.01em}
.tl .tc .co{display:block;color:var(--cream)}
.tl .tc .rw{display:flex;justify-content:space-between;gap:3px;margin-top:2px}
.tl .stamp{align-self:flex-start;margin-top:3px;transform:rotate(-3deg);display:inline-flex;align-items:center;gap:2px;padding:2px 4px 1px;font:11px/1 var(--L);color:var(--ink);background:url(art/card.jpg) center/cover;border:1.5px solid var(--ink);box-shadow:1px 2px 0 rgba(0,0,0,.45);max-width:100%;white-space:nowrap;overflow:hidden}
.tl .stamp .mk{width:12px;height:12px}
.tl .stamp.nb{color:var(--dni)}
.sheet .tl.hid{display:none}.sheet.all .tl.hid{display:flex}

/* a round without its film yet: the company's mark on painted card stock over a red wash */
.nof{position:relative;display:grid;place-items:center;align-content:center;gap:6%;width:100%;aspect-ratio:1;background:linear-gradient(rgba(34,6,4,.25),rgba(28,4,3,.35)),url(art/tile-red.jpg) 0 0/640px auto;container-type:inline-size}
.nof .lgn{width:56%;aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);background:url(art/card.jpg) center/cover;display:grid;place-items:center;box-shadow:2px 3px 0 rgba(0,0,0,.5)}
.nof .lgn.dk{background:#1b1714}
.nof .lgn img{width:66%;height:66%;object-fit:contain}
.nof i{font:normal 9cqw/1 var(--L);color:rgba(243,230,196,.85);letter-spacing:.04em}
/* ===== MEET THE MODELS ===== */
.cast{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 10px}
.cm{display:flex;flex-direction:column}
.cm .por{border:3px solid var(--ink);box-shadow:4px 5px 0 rgba(0,0,0,.5);aspect-ratio:3/4;overflow:hidden}
.cm .por img{width:100%;height:100%;object-fit:cover}
.cm .np{margin:-14px 6px 0;position:relative;z-index:2;padding:6px 8px 7px;transform:rotate(-1.2deg)}
.cm:nth-child(even) .np{transform:rotate(1deg)}
.cm .nmr{display:flex;align-items:center;gap:6px}
.cm .nm{font:400 22px/1 var(--H)}
.cm .mk{width:20px;height:20px}
.cm .fig{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;gap:6px}
.cm .pl{font:21px/1 var(--L)}
.cm .wl{font:15px/1 var(--L);letter-spacing:.02em}
.cm .tg{font:10.5px/1 var(--L);letter-spacing:.05em;opacity:.75}
.cm .bio{margin:7px 2px 0;font:italic 13.5px/1.3 var(--B);color:rgba(243,230,196,.92)}

/* ===== SMART OR LUCKY ===== */
.scale{position:relative;container-type:inline-size;margin:0 -16px}
.scale img{width:100%;aspect-ratio:3/3.3;object-fit:cover;object-position:50% 70%;-webkit-mask-image:linear-gradient(transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(transparent,#000 6%,#000 94%,transparent)}
.tag{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink);font-family:var(--L);line-height:1.02;mix-blend-mode:multiply;letter-spacing:.02em;overflow:hidden}
.tag b{font:400 1em/1 var(--H);color:#7a1b13}
.chh{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap;margin:6px 0 2px}
.chh h3{font:400 23px/1 var(--H);margin:0;text-shadow:2px 2px 0 var(--ink)}
.chh p{margin:0;font:italic 14px/1.25 var(--B);color:rgba(243,230,196,.88);flex-basis:100%}
.ch+.chh{margin-top:14px}
.ch svg{display:block;overflow:visible}
.ch-ax{font:12px var(--L);fill:rgba(243,230,196,.72)}
.ch-lb{font:14px var(--L);letter-spacing:.02em;paint-order:stroke;stroke:rgba(10,8,6,.85);stroke-width:3px}
.ch-v{fill:var(--cream)}
.honest{margin:14px 0 0;padding:9px 11px;font:15px/1.25 var(--L);letter-spacing:.02em}

/* ===== THE BET ===== */
.pool{position:relative;container-type:inline-size;margin:4px -16px 0}
.pool img{width:100%}
.dl{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:0 0 12px}
.dl .lab{color:var(--gold)}
.clock{display:inline-grid;grid-auto-flow:column;gap:2px;padding:5px 8px 4px;transform:rotate(-1deg)}
.clock div{display:grid;justify-items:center;min-width:42px}
.clock b{font:400 27px/1 var(--H)}
.clock i{font:normal 11px/1 var(--L);letter-spacing:.06em}
.rules{display:grid;gap:8px;margin:12px 0 0}
.rule{display:flex;gap:10px;align-items:baseline;font:16px/1.25 var(--L);letter-spacing:.02em}
.rule b{flex:none;font:400 19px/1 var(--H);color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.s2{margin-top:14px;padding:10px 12px;transform:rotate(-.6deg)}
.s2 b{font:400 20px/1 var(--H);display:block;margin-bottom:3px}
.s2 span{font:15px/1.25 var(--L)}

/* the golden ticket: the painted prop, the holder's name printed on its face */
.gt{position:relative;margin:16px auto 0;max-width:420px;container-type:inline-size;transform:rotate(-2deg);filter:drop-shadow(3px 5px 0 rgba(0,0,0,.5))}
.gt img{width:100%}
.gtt{position:absolute;left:26%;right:12%;top:17%;bottom:17%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#3a2404;mix-blend-mode:multiply}
.gk{font:5.2cqw/1 var(--L);letter-spacing:.12em}
.gn{display:flex;align-items:center;gap:2cqw;font:400 12cqw/1.05 var(--H)}
.gn .mk{width:9cqw;height:9cqw}
.gs{font:4.4cqw/1.1 var(--L);letter-spacing:.04em}
/* ===== MOCK AD ===== */
.ad{position:relative;padding:12px 12px 10px;border:3px solid var(--ink);box-shadow:4px 5px 0 rgba(0,0,0,.55);color:var(--ink);background-image:linear-gradient(rgba(255,240,190,.10),rgba(120,70,0,.10)),url(art/tile-ochre.jpg);background-size:100% 100%,640px auto}
.ad .adt{font:13px/1 var(--L);letter-spacing:.12em;text-align:center;margin-bottom:4px}
.ad h3{font:400 25px/1.02 var(--H);margin:0 0 6px;text-align:center;color:#5c1109}
.ad .adb{display:grid;grid-template-columns:40% 1fr;gap:8px;align-items:center}
.ad .adb img{mix-blend-mode:multiply;width:100%}
.ad .adb p{margin:0;font:17px/1.15 var(--L)}
.ad .adb p b{font:400 26px/1 var(--H);display:block;color:#5c1109}
.ad .cp{margin-top:8px;border:2px dashed var(--ink);padding:7px 9px;font:15px/1.2 var(--L);display:flex;gap:8px;align-items:center}
.ad .cp a{font:400 16px/1 var(--H);text-decoration:none;border-bottom:2px solid var(--ink);white-space:nowrap}
.colo{margin:16px 0 0;padding:10px 12px;font:13px/1.35 var(--B)}
.colo b{font:400 15px/1 var(--H);display:block;margin-bottom:3px}

/* ===== THE BACK PAGE FOLD ===== */
.fq{font:400 22px/1.08 var(--H);margin:0 0 8px;text-shadow:2px 2px 0 var(--ink)}
.fq span{color:var(--gold)}
.fsheet{position:relative;perspective:900px;aspect-ratio:3/2;container-type:inline-size}
.fp{position:absolute;top:0;bottom:0;overflow:hidden;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);transition:transform .9s cubic-bezier(.45,0,.2,1),filter .9s;backface-visibility:hidden}
.fA{left:0;width:25%;border-left:3px solid var(--ink)}
.fC{right:0;width:25%;border-right:3px solid var(--ink)}
.fB1{left:25%;width:25%;transform-origin:left center}
.fB2{left:50%;width:25%;transform-origin:right center}
.fA .half,.fC .half{position:absolute;top:0;height:100%;width:200%;background-size:cover;background-position:center 30%}
.fA .half{left:0}.fC .half{right:0}
.fB{position:absolute;top:0;height:100%;width:200%;background-image:linear-gradient(rgba(34,6,4,.35),rgba(28,4,3,.45)),url(art/tile-red.jpg);background-size:100% 100%,640px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.fB1 .fB{left:0}.fB2 .fB{right:0}
.crowd{display:flex;gap:6px;justify-content:center;width:100%}
.crowd i{width:22%;aspect-ratio:1;border-radius:50%;border:2.5px solid var(--ink);box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.crowd-t{font:3.6cqw/1.15 var(--L);text-align:center;letter-spacing:.03em;padding:0 8px}

.fold.done .fans{display:block;animation:fin .5s .7s both}@keyframes fin{from{opacity:0}}
.ans{margin-top:16px}

.ans .fvs .plq{left:0}.ans .fvs .plq span{font-size:8.5cqw}.ans .fvs .plq b{font-size:12cqw}
.ans .fv p{margin:0;font:15px/1.3 var(--L);letter-spacing:.02em}

@media (min-width:1000px){
  .cv-foot{padding:14px 26px}

  .nt{grid-template-columns:repeat(3,1fr);gap:14px}

  .keeper{margin:4px auto 12px;max-width:430px}

  .gag{grid-template-columns:44% 1fr;gap:14px}
  .gag .gl{font-size:24px}.gag .fx{font-size:16px}

  .scale{margin:0}
  .pool{margin:6px 0 0}
  .chh h3{font-size:28px}
  .rule{font-size:18px}
  .clock b{font-size:40px}.clock div{min-width:60px}.clock i{font-size:13px}
  .fsheet{max-width:560px;margin:0 auto;aspect-ratio:1.22}
  .fq{font-size:28px}
  .ans .fv{grid-template-columns:150px 1fr}.ans .fv p{font-size:17px}
  .ad h3{font-size:30px}
}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="inkedge"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="1" seed="3"/><feDisplacementMap in="SourceGraphic" scale="1.2"/></filter>
</defs></svg>
<main class="mag" id="mag">
  <div class="spread two"><section class="pg cover" id="cover" aria-label="Cover"></section><section class="pg w-green" id="verdict" aria-labelledby="h-vd"></section></div>
  <div class="spread"><section class="pg w-ochre" id="next" aria-labelledby="h-nx"></section></div>
  <div class="spread two"><section class="pg w-green" id="how" aria-labelledby="h-how"></section><section class="pg w-red" id="record" aria-labelledby="h-rec"></section></div>
  <div class="spread"><section class="pg w-red" id="archive" aria-label="Every round so far"></section></div>
  <div class="spread"><section class="pg w-ochre castsp" id="cast" aria-labelledby="h-cast"></section></div>
  <div class="spread two"><section class="pg w-green" id="sol" aria-labelledby="h-sol"></section><section class="pg w-green" id="sol2" aria-label="The charts"></section></div>
  <div class="spread two"><section class="pg w-ink" id="bet" aria-labelledby="h-bet"></section><section class="pg w-ink" id="bet2" aria-label="The pool"></section></div>
  <div class="spread two"><section class="pg w-red" id="back" aria-labelledby="h-back"></section><section class="pg w-ochre" id="adpg" aria-label="Advertisement and small print"></section></div>
</main>
<script src="../../../../../ez-data.js"></script>
<script src="sat-data.js"></script>
<script src="sat-ui.js"></script>
<script>
(async function(){
'use strict';
const S=window.SAT,U=window.SUI,D=S.compute(),esc=S.esc,NM=S.NM,MK=D.MK;
let HL=null;try{HL=await (await fetch('../hl-markets-2026-11-03.json')).json()}catch(e){HL=null}
const SHOT=/[?&]shot=1/.test(location.search);
const DESK=()=>matchMedia('(min-width:1000px)').matches;
const lead=D.rank[0],LP=D.per[lead];
const issueNo=D.RS.length,lastR=D.RS[D.RS.length-1];
const mon=S.nyFmt(D.NOW,{month:'short',year:'numeric'});
const betDay=D.bet?S.nyFmt(D.bet,{weekday:'short',month:'short',day:'numeric'}):'',betMD=D.bet?S.nyFmt(D.bet,{month:'short',day:'numeric'}):'';
const frz=D.freeze?S.nyFmt(D.freeze,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
const mk=(m,c)=>'<span class="mk" style="color:'+(c||S.COL[m])+'">'+U.mark(m)+'</span>';
const co=t=>esc(S.coT(t));
const logoWrap=(t,cls)=>{const L=S.logo(t);return '<span class="'+cls+(L&&L.dark?' dk':'')+'">'+(L?'<img src="'+L.src+'" alt="" loading="'+(SHOT?'eager':'lazy')+'">':'')+'</span>'};
const PG={cover:1,verdict:2,next:3,how:4,record:5,archive:6,cast:7,sol:8,sol2:9,bet:10,bet2:11,back:12,adpg:13};
const fol=(id,lab)=>'<footer class="fol"><span>p. '+PG[id]+'</span><span>'+esc(lab)+'</span><span>Earnings Zeason · No. '+issueNo+'</span></footer>';
const trWord=d=>d>0?'Long':'Short';
const p100='$100K';
const hitPct=P=>(P.right/P.n*100).toFixed(1).replace(/\.0$/,'')+'%';
const rng=P=>S.wilson(P.right,P.n);
/* the top model's next trades: rounds with trades in (closed today and waiting, or still to close), then the ones still to come */
const NOW=D.NOW;
const pend=D.pend.map(r=>Object.assign({},r,{close:S.closeAt(r.ticker,r.resolves)}));
const open=pend.filter(r=>!r.close||r.close>NOW),waiting=pend.filter(r=>r.close&&r.close<=NOW);
const upc=D.upc;
const hlOf=t=>S.hlFor(HL,t);
const nextOpen=open[0];
const lc=r=>r.calls.find(c=>c.m===lead);

/* ---------------- COVER ---------------- */
document.getElementById('cover').innerHTML=
 '<div class="cv"><img src="art/cover.jpg" alt="A painted magazine cover: four caricatured men, seen from behind, stand on a Wall Street rooftop staring up at an empty diving board high above a swimming pool full of gold coins.">'+
 '<div class="cv-mast"><span class="cv-box"><img src="../../../../../tools/v22/x2p-logo.svg" alt="EZ."></span><h1 class="cv-tt" id="cvtt"><span class="e">E</span>ARNINGS <span class="z">Z</span>EASON</h1></div>'+
 '<p class="cv-issue">No. '+issueNo+' · <b>Free</b> · Season 1 · '+esc(mon.replace(/ 20(\d\d)$/,' ’$1'))+'</p>'+
 '<p class="cv-line" id="cvl">We track 4 AIs<br>on every earnings trade.<span>So you don’t have to.</span></p></div>'+
 '<div class="cv-foot">'+
  '<a class="cf-row" href="#verdict"><span class="cf-n">p.'+PG.verdict+'</span><span class="cf-t"><b>Who to follow, so far:</b> '+NM[lead]+', right on '+LP.right+' of '+LP.n+' trades</span></a>'+
  '<a class="cf-row" href="#next"><span class="cf-n">p.'+PG.next+'</span><span class="cf-t"><b>Its next trades,</b> and where to follow them on Hyperliquid</span></a>'+
  '<a class="cf-row" href="#record"><span class="cf-n">p.'+PG.record+'</span><span class="cf-t"><b>The receipts:</b> '+issueNo+' rounds, '+D.nTrades+' trades, each graded at the close</span></a>'+
  '<a class="cf-row" href="#bet"><span class="cf-n">p.'+PG.bet+'</span><span class="cf-t"><b>Skin in the game:</b> we bet our own pool on its trade, '+esc(betMD)+'</span></a>'+
 '</div>';

/* ---------------- THE VERDICT ---------------- */
const R=rng(LP),lo=Math.round(R[0]*100),hi=Math.round(R[1]*100);
const nxL=nextOpen&&lc(nextOpen);
document.getElementById('verdict').innerHTML=
 '<p class="kick">Cover story · who to follow, so far</p><h2 class="hd" id="h-vd">So far, it’s <span class="g">'+NM[lead]+'</span>.</h2>'+
 '<div class="vd"><div class="por"><img src="'+U.PORT[lead]+'" alt="'+NM[lead]+', drawn as a caricature of its lab’s founder"></div>'+
  '<div class="vf"><div class="ln"><div class="big num">'+LP.right+' of '+LP.n+'</div><div class="lab">trades right so far ('+hitPct(LP)+')</div></div>'+
  '<div class="ln"><div class="big num '+(LP.pnl>=0?'up':'dn')+'">'+S.$f(LP.pnl)+'</div><div class="lab">season P&amp;L, flat '+p100+' a trade</div></div>'+
  '<div><div class="big num '+(D.win.d7[lead].pnl>=0?'up':'dn')+'" style="font-size:24px">'+S.$f(D.win.d7[lead].pnl)+'</div><div class="lab">last 7 days, '+D.win.d7[lead].W+'-'+D.win.d7[lead].L+'</div></div></div></div>'+
 '<div class="range card"><h3>How sure are we?</h3><p>On '+LP.n+' trades, '+NM[lead]+'’s real hit rate could be anywhere from about '+lo+'% to '+hi+'%. The others’ ranges still overlap it.</p><div class="rb" id="rb"></div></div>'+
 (nextOpen&&nxL?'<a class="nxc card" href="#next"><span class="nxk">Its next trade</span>'+logoWrap(nextOpen.ticker,'lg')+'<span class="nxm"><b>'+co(nextOpen.ticker)+'</b><span class="stampx '+(nxL.dir==='UP'?'L':'S')+'">'+mk(lead,'currentColor')+(nxL.dir==='UP'?'Long':'Short')+'</span><i>at the close '+esc(S.wdmd(S.dOf(nextOpen.resolves)))+(hlOf(nextOpen.ticker)?' · on Hyperliquid as '+esc(hlOf(nextOpen.ticker).name):'')+'</i></span></a>':'')+
 fol('verdict','Cover story');
(function(){const A=.3,B=.85,X=v=>((v-A)/(B-A)*100).toFixed(1)+'%';let h='';
  D.rank.forEach(m=>{const P=D.per[m],r=rng(P),c=P.right/P.n;h+='<span class="n">'+mk(m,'#15110d')+NM[m]+'</span><span class="tr"><span class="fifty" style="left:'+X(.5)+'"></span><span class="bar" style="left:'+X(r[0])+';right:calc(100% - '+X(r[1])+');background:'+S.COL[m]+'"></span><span class="pt" style="left:'+X(c)+'"></span></span>'});
  h+='<span></span><span class="ax">'+[.3,.4,.5,.6,.7,.8].map(v=>'<span style="left:'+X(v)+'">'+Math.round(v*100)+'%</span>').join('')+'</span>';
  document.getElementById('rb').innerHTML=h})();

/* ---------------- NEXT TRADES ---------------- */
function hlLine(t,closed){const h=hlOf(t);if(!h)return '<span class="none">No Hyperliquid market for '+esc(S.tk(t))+'.</span>';
  if(closed)return '<span>On Hyperliquid: '+esc(h.name)+' · this trade has closed</span>';
  return '<a href="https://app.hyperliquid.xyz/trade/'+esc(h.name)+'" rel="noopener">Follow on Hyperliquid <b>'+esc(h.name)+'</b></a><span class="'+(h.thin?'thin':'')+'">$'+h.oi.toFixed(1)+'M open interest'+(h.thin?' · thin market':'')+'</span>'}
function card(r,closed,small){const L=lc(r),others=r.calls.filter(c=>c.m!==lead);
  return '<article class="tk card'+(small?' sm':'')+'">'+logoWrap(r.ticker,'lg')+'<div><div class="nm">'+co(r.ticker)+'</div><div class="wh">Round '+r.n+' · '+(closed?'closed '+esc(S.wdmd(S.dOf(r.resolves)))+', grade coming':'at the close '+esc(S.wdmd(S.dOf(r.resolves))))+'</div></div>'+
   '<div class="row">'+(L?'<span class="stampx '+(L.dir==='UP'?'L':'S')+'">'+mk(lead,'currentColor')+NM[lead]+': '+(L.dir==='UP'?'Long':'Short')+'</span>':'')+
   '<span class="field">'+others.map(c=>'<span>'+mk(c.m,'#15110d')+NM[c.m]+' <i class="'+(c.dir==='UP'?'L':'S')+'" style="font-style:normal">'+(c.dir==='UP'?'long':'short')+'</i></span>').join('')+'</span></div>'+
   '<div class="hl">'+hlLine(r.ticker,closed)+'</div></article>'}
const dueN=()=>DESK()?12:8;
const upNext=upc.filter(u=>!u.called||S.dOf(u.called)>=D.today),upPast=upc.filter(u=>u.called&&S.dOf(u.called)<D.today);
const hlCount=upc.concat(D.pend).filter(u=>hlOf(u.ticker)).length,hlBig=upc.concat(D.pend).filter(u=>{const h=hlOf(u.ticker);return h&&!h.thin}).length;
document.getElementById('next').innerHTML=
 '<p class="kick">What '+NM[lead]+' trades next · we track it, you follow it</p><h2 class="hd" id="h-nx">Its next trades</h2>'+
 '<p class="deck">The top model’s long or short on each company that reports next, with the other three beside it. Where Hyperliquid lists the company, you can follow the trade there.</p>'+
 (open.length?'<p class="grp">Next close</p><div class="nt'+(open.length===1?' one':'')+'">'+open.map(r=>card(r,false)).join('')+(open.length===1&&DESK()?'<div class="card" style="padding:12px 14px;align-self:start"><p class="lab" style="margin:0 0 6px">On the books</p><p style="margin:0;font:15px/1.35 var(--B)">'+(upc.length+D.pend.length)+' companies report next. '+hlCount+' have a market on Hyperliquid; '+hlBig+' of those have $10M or more of open interest.</p></div>':'')+'</div>':'')+
 (waiting.length?'<p class="grp">Closed '+esc(S.wdmd(S.dOf(waiting[0].resolves)))+', waiting for the grade</p><div class="due wt">'+waiting.map(r=>{const L=lc(r);return '<div class="du">'+logoWrap(r.ticker,'lg')+'<div><div class="nm">'+co(r.ticker)+'</div><div class="wh">Round '+r.n+' \u00b7 '+r.calls.filter(c=>c.m!==lead).map(c=>NM[c.m]+' '+(c.dir==='UP'?'long':'short')).join(', ')+'</div></div><div class="hm">'+(L?'<span class="stampx sm '+(L.dir==='UP'?'L':'S')+'">'+NM[lead]+': '+(L.dir==='UP'?'long':'short')+'</span>':'')+'</div></div>'}).join('')+'</div>':'')+
 '<p class="grp">Trades drop before the earnings</p><div class="due" id="due">'+upNext.map((u,k)=>{const h=hlOf(u.ticker);return '<div class="du'+(k>=dueN()?' hid':'')+'">'+logoWrap(u.ticker,'lg')+'<div><div class="nm">'+co(u.ticker)+'</div><div class="wh">Round '+u.n+' · trades due '+esc(S.md(S.dOf(u.called)))+'</div></div><div class="hm">'+(h?'<b class="'+(h.thin?'thin':'')+'">'+esc(h.name)+'</b>'+(h.thin?'thin · $'+h.oi.toFixed(1)+'M':'$'+h.oi.toFixed(1)+'M OI'):'no market')+'</div></div>'}).join('')+'</div>'+
 (upNext.length>dueN()?'<button class="more card" id="dmore" type="button">Show all '+upNext.length+'</button>':'')+
 '<p class="src">Markets: Hyperliquid, as of Nov 3 (open interest in $M; under $10M marked thin).'+(upPast.length?' Not shown: '+upPast.map(u=>co(u.ticker)).join(', ')+', whose trade date has passed with no trades in the sheet.':'')+'</p>'+
 fol('next','Its next trades');
const dm=document.getElementById('dmore');if(dm)dm.onclick=function(){const s=document.getElementById('due'),on=s.classList.toggle('all');this.textContent=on?'Show fewer':'Show all '+upNext.length};

/* ---------------- HOW WE KEEP SCORE (one real round) ---------------- */
const ex=D.RS.slice().reverse().find(r=>{const ts=MK.map(m=>r.__t[m]).filter(Boolean);return ts.length===4&&ts.filter(t=>t.dir>0).length===2&&r.win})||lastR;
const exT=MK.filter(m=>ex.__t[m]),exW=ex.win?ex.win.split(' & '):[];
document.getElementById('how').innerHTML=
 '<p class="kick">The proof · how we keep score</p><h2 class="hd" id="h-how">We track. You read.</h2>'+
 '<div class="keeper" id="keeper"><img src="art/keeper.jpg" alt="An editorial cartoon: a fussy bookkeeper on a stool ticks four ticker tapes into a giant ledger while a man relaxes in an armchair with a magazine.">'+
  '<span class="tag" id="tgk1"><b>'+D.nTrades+' trades</b>graded at the close</span><span class="tag" id="tgk2"><b>You</b>reading the verdict</span></div>'+
 '<p class="kick">One real round, start to finish</p>'+
 '<div class="strip">'+
  '<div class="pn p1"><p class="cap"><b>1</b>'+co(ex.ticker)+' reports earnings.</p><div class="art"><div class="co-card">'+logoWrap(ex.ticker,'lgw')+'<span class="nm">Round '+ex.n+'</span></div></div></div>'+
  '<div class="pn p2"><p class="cap"><b>2</b>Before it reports, each AI goes long or short.</p><div class="art"><div class="trd">'+exT.map(m=>{const t=ex.__t[m];return '<span class="tr">'+mk(m)+'<span class="bl '+(t.dir>0?'L':'S')+'">'+trWord(t.dir)+'</span></span>'}).join('')+'</div></div></div>'+
  '<div class="pn p3"><p class="cap"><b>3</b>The close grades every trade.</p><div class="art"><div class="co-card"><span class="mvbig '+(ex.a>0?'up':'dn')+'">'+S.mv(ex.a)+'</span><div class="trd">'+exT.map(m=>{const t=ex.__t[m];return '<span class="tr">'+mk(m)+'<span class="st '+(t.ok?'up':'dn')+'">'+(t.ok?'W':'L')+'</span></span>'}).join('')+'</div></div></div></div>'+
  '<div class="pn p4"><p class="cap"><b>4</b>Every trade is a flat '+p100+' (simulated).</p><div class="art"><div class="pnl-l">'+exT.map(m=>{const t=ex.__t[m];return '<div><span>'+mk(m)+' '+NM[m]+'</span><span class="'+(t.v>0?'up':'dn')+'">'+S.$f(t.v)+'</span></div>'}).join('')+'</div></div></div>'+
 '</div>'+
 '<p class="handoff">Closest trade wins the round: '+(exW.length?exW.map(m=>NM[m]).join(' and '):'nobody')+'. Then it goes on the record, with every round before it.</p>'+
 fol('how','The proof');

/* ---------------- THE RECORD ---------------- */
function gagLine(r){const ts=MK.map(m=>r.__t[m]?Object.assign({m},r.__t[m]):null).filter(Boolean),ok=ts.filter(t=>t.ok),bad=ts.filter(t=>!t.ok),n=ts.length,w=r.win?r.win.split(' & '):[];
  const mvw=(r.a>0?'rose ':'fell ')+Math.abs(r.a).toFixed(2)+'%';const names=a=>a.map(t=>NM[t.m]).join(a.length>2?', ':' and ').replace(/, ([^,]*)$/,' and $1');
  if(!ok.length)return 'All '+(n===4?'four':n)+' went '+(ts.every(t=>t.dir>0)?'long':ts.every(t=>t.dir<0)?'short':'every which way')+'. '+S.co(r.ticker)+' '+mvw+'. Nobody wins.';
  if(ok.length===1)return (n-1===3?'Three':n-1)+' went '+(ok[0].dir>0?'short':'long')+'. '+NM[ok[0].m]+' didn’t.';
  if(Math.abs(r.a)>=10&&bad.length)return names(bad)+' went '+(bad[0].dir>0?'long':'short')+'. '+S.co(r.ticker)+' '+mvw+'.';
  if(w.length>1){const c=r.__t[w[0]];return 'Same trade, same size: '+w.map(x=>NM[x]).join(' and ')+' tie.'}
  if(ok.length===n)return 'All '+(n===4?'four':n)+' got the direction. '+NM[w[0]]+' got closest.';
  return ok.length+' went '+(ok[0].dir>0?'long':'short')+', '+bad.length+' went '+(bad[0].dir>0?'long':'short')+'. '+NM[w[0]]+' got closest.'}
const newest=D.RS.slice().reverse(),featN=DESK()?4:3,feat=newest.filter(r=>FILMS[r.n]).slice(0,featN),rest=newest.filter(r=>feat.indexOf(r)<0);
/* a round's art is its film's last frame; a round whose film isn't made yet shows its company's own mark on painted card */
const art=(r,eager)=>FILMS[r.n]?'<img src="thumbs/'+FILMS[r.n].p+'.jpg" alt="The final frame of round '+r.n+'’s film" loading="'+(eager||SHOT?'eager':'lazy')+'">':'<span class="nof">'+logoWrap(r.ticker,'lgn')+'<i>film in the works</i></span>';
document.getElementById('record').innerHTML=
 '<p class="kick">The receipts · '+issueNo+' rounds</p><h2 class="hd" id="h-rec">The record</h2>'+
 '<p class="deck">Every trade is locked before the earnings and graded by the close. The latest rounds with their films:</p>'+
 '<div class="gags">'+feat.map(r=>'<article class="gag"><div class="fr">'+art(r,1)+'</div><div><p class="gl">'+esc(gagLine(r))+'</p><div class="fx">Round '+r.n+' · '+co(r.ticker)+'<br>The close: <span class="'+(r.a>0?'up':'dn')+'">'+S.mv(r.a)+'</span><br>Winner: '+(r.win?r.win.split(' & ').map(m=>mk(m)+' '+NM[m]).join(', '):'Nobody')+'</div></div></article>').join('')+'</div>'+
 fol('record','The record');
const winStamp=r=>r.win?'<span class="stamp">'+r.win.split(' & ').map(m=>mk(m,'#15110d')).join('')+' '+r.win.split(' & ').map(m=>NM[m]).join(' & ')+'</span>':'<span class="stamp nb">× Nobody</span>';
const sheetN=()=>DESK()?16:9;
document.getElementById('archive').innerHTML='<p class="kick">Every round so far · newest first · the stamp names the winner</p>'+
 '<div class="sheet" id="sheet">'+rest.map((r,k)=>'<article class="tl'+(k>=sheetN()?' hid':'')+'"><div class="th">'+art(r,k<sheetN())+'</div>'+
  '<div class="tc"><span class="co">'+co(r.ticker)+'</span><span class="rw"><span>R'+r.n+'</span><span class="num '+(r.a>0?'up':'dn')+'">'+S.mv(r.a)+'</span></span></div>'+winStamp(r)+'</article>').join('')+'</div>'+
 '<button class="more card" id="more" type="button">Show all '+rest.length+' other rounds</button>'+fol('archive','Every round so far');
document.getElementById('more').onclick=function(){const s=document.getElementById('sheet'),on=s.classList.toggle('all');this.textContent=on?'Show fewer':'Show all '+rest.length+' other rounds'};

/* ---------------- MEET THE MODELS (the cast: the entertainment wrapper) ---------------- */
const shortest=MK.slice().sort((a,b)=>D.per[a].longShare-D.per[b].longShare)[0],sizeMax=MK.slice().sort((a,b)=>D.per[b].avgSize-D.per[a].avgSize)[0];
function bio(m){const P=D.per[m],sh=P.n-P.long;
  if(m===shortest)return 'Goes short on '+sh+' of its '+P.n+' trades. Nobody shorts more.';
  if(m===sizeMax)return 'Expects the biggest moves: '+P.avgSize.toFixed(1)+'% on average, and goes short on '+sh+' of '+P.n+'.';
  if(P.longShare>=.5)return 'Goes long on '+P.long+' of '+P.n+'. Best single trade: '+S.coT(P.best.r.ticker)+', '+S.$f(P.best.v)+'.';
  return 'Best single trade: '+S.coT(P.best.r.ticker)+', '+S.$f(P.best.v)+'.'}
document.getElementById('cast').innerHTML=
 '<p class="kick">Meet the models · the four we track</p><h2 class="hd" id="h-cast">Four AIs, two countries, one season</h2>'+
 '<p class="deck">Same companies, same deadline, '+p100+' a trade. Ranked by season P&amp;L.</p>'+
 '<div class="cast">'+D.rank.map(m=>{const P=D.per[m];return '<article class="cm"><div class="por"><img src="'+U.PORT[m]+'" alt="'+NM[m]+', drawn as a caricature of its lab’s founder"></div>'+
   '<div class="np card"><div class="nmr">'+mk(m,'#15110d')+'<span class="nm">'+NM[m]+'</span>'+U.flag(P.flag)+'</div>'+
   '<div class="fig"><span class="pl num '+(P.pnl>=0?'up':'dn')+'">'+S.$f(P.pnl)+'</span><span class="wl num">'+P.W+'-'+P.L+'</span></div><div class="fig"><span class="tg">Season P&amp;L</span><span class="tg">W-L</span></div></div>'+
   '<p class="bio">'+esc(bio(m))+'</p></article>'}).join('')+'</div>'+fol('cast','Meet the models');

/* ---------------- SMART OR LUCKY ---------------- */
document.getElementById('sol').innerHTML=
 '<p class="kick">The honest part</p><h2 class="hd" id="h-sol">Smart or lucky?</h2>'+
 '<p class="deck">'+NM[lead]+' leads so far, on '+LP.n+' trades. A record this short can still flip. Our cartoonist weighs it:</p>'+
 '<div class="scale"><img src="art/scale.jpg" alt="An editorial cartoon: a brass balance scale, perfectly level, with a graduation cap on one pan and a horseshoe on the other.">'+
  '<span class="tag" id="tg1"><b>Skill</b></span><span class="tag" id="tg2"><b>Luck</b></span><span class="tag" id="tg3">'+issueNo+' rounds:<br>still weighing</span></div>'+
 fol('sol','Smart or lucky?');
document.getElementById('sol2').innerHTML=
 '<div class="chh"><h3>Hit rate</h3><p>How often each AI’s long or short was right. Every line starts at 50%.</p></div><div class="ch" id="chHit"></div>'+
 '<div class="chh"><h3>P&amp;L</h3><p>'+p100+' on every trade. Under the waterline means losing money.</p></div><div class="ch" id="chPnl"></div>'+
 '<p class="honest card">'+issueNo+' rounds is a small sample. The lines have crossed before and can cross again. No verdict on skill.</p>'+
 fol('sol2','Smart or lucky?');

/* ---------------- THE BET: skin in the game ---------------- */
const lft=S.left(D.bet);
const clock=l=>'<div><b class="num">'+l.d+'</b><i>days</i></div><div><b class="num">'+String(l.h).padStart(2,'0')+'</b><i>hrs</i></div><div><b class="num">'+String(l.m).padStart(2,'0')+'</b><i>min</i></div><div><b class="num">'+String(l.x).padStart(2,'0')+'</b><i>sec</i></div>';
const nvH=hlOf('NVDA');
document.getElementById('bet').innerHTML=
 '<p class="kick">Skin in the game</p><h2 class="hd" id="h-bet">Bet #1: <span class="g">NVIDIA</span> (NVDA)</h2>'+
 '<div class="dl"><span class="lab">At the close · '+esc(betDay)+'</span><span class="clock card" id="clock" role="timer" aria-label="Time to the bet">'+(lft?clock(lft):'')+'</span></div>'+
 '<p class="deck">We don’t just track the top model. We put our own pool on its trade.</p>'+
 '<div class="rules">'+
  '<div class="rule"><b>1</b><span>The top model’s trade decides long or short. Today that’s '+mk(lead)+' '+NM[lead]+'.</span></div>'+
  '<div class="rule"><b>2</b><span>The board freezes '+esc(frz)+' New York time, 24 hours before the bet.</span></div>'+
  '<div class="rule"><b>3</b><span>NVIDIA has a market on Hyperliquid ('+(nvH?esc(nvH.name)+', $'+nvH.oi.toFixed(1)+'M open interest':'none listed')+'), so anyone can check the bet.</span></div>'+
 '</div>'+
 '<div class="gt" id="gt"><img src="art/ticket.webp" alt=""><div class="gtt"><span class="gk">The golden ticket</span><span class="gn">'+mk(lead,'currentColor')+NM[lead]+'</span><span class="gs">holds it today \u00b7 '+S.$f(LP.pnl)+' season P&amp;L</span></div></div>'+
 '<div class="s2 card"><b>Not the last.</b><span>NVIDIA is the first bet. Season 2 brings more.</span></div>'+
 fol('bet','Skin in the game');
document.getElementById('bet2').innerHTML=
 '<p class="kick">The pool, as our cartoonist sees it</p>'+
 '<div class="pool"><img src="art/pool.jpg" alt="An editorial cartoon: a faucet pours gold coins into a pool; a diving board juts over it; coins spill into a bucket; a drain plug sits at the bottom.">'+
  '<span class="tag" id="tp1"><b>'+D.pool+'%</b>of $EZ creator fees fill the pool</span>'+
  '<span class="tag" id="tp2"><b>Bet #1</b>top model’s trade</span>'+
  '<span class="tag" id="tp3"><b>Right</b>profits buy back $EZ</span>'+
  '<span class="tag" id="tp4"><b>Wrong</b>the pool shrinks or can be wiped out</span>'+
 '</div>'+fol('bet2','Skin in the game');

/* ---------------- THE BACK PAGE: the fold ---------------- */
const W_=D.wolf,wr=W_&&W_.r,wm=W_&&W_.m,crowd=wr?MK.filter(m=>m!==wm):[];
const wv=wr?wr.__t[wm].v:0,cv=wr?wr.__t[crowd[0]].v:0;
const plq=()=>'<div class="plq"><span class="card"><b>'+NM[wm]+'</b>went '+trWord(wr.__t[wm].dir).toLowerCase()+': '+S.$f(wv)+'</span></div>';
const mid=()=>'<div class="fB"><div class="crowd">'+crowd.map(m=>'<i style="'+U.faceBg(m)+'"></i>').join('')+'</div><div class="crowd-t"><b>The crowd</b>'+crowd.map(m=>NM[m]).join(', ')+': '+S.$f(cv)+' each</div></div>';
document.getElementById('back').innerHTML=
 '<p class="kick">The back page</p><h2 class="hd" id="h-back">Fold it</h2>'+
 (wr?'<div class="fold" id="fold"><p class="fq">'+(crowd.length===3?'Three':crowd.length)+' AIs went '+(wr.__t[crowd[0]].dir>0?'long':'short')+' on <span>'+co(wr.ticker)+'</span>. Who stood outside the crowd?</p>'+
  '<div class="fsheet" id="fsheet"><div class="fp fA"><div class="half" style="background-image:url('+U.PORT[wm]+')"></div>'+plq()+'</div>'+
   '<div class="fp fB1">'+mid()+'</div><div class="fp fB2">'+mid()+'</div>'+
   '<div class="fp fC"><div class="half" style="background-image:url('+U.PORT[wm]+')"></div>'+plq()+'</div>'+
   '<span class="fg fg1"></span><span class="fg fg2"></span><span class="fg fg3"></span></div>'+
  '<button class="fbtn card" id="fbtn" type="button" aria-pressed="false">Fold the crowd away</button>'+
  '<p class="fans">Round '+wr.n+', '+co(wr.ticker)+' moved '+S.mv(wr.a)+'. The only one on the right side: '+NM[wm]+'.</p>'+
 '</div>':'')+fol('back','The back page');
const fb=document.getElementById('fbtn');
if(fb)fb.onclick=function(){const sh=document.getElementById('fsheet'),on=!sh.classList.contains('folded');sh.classList.toggle('folded',on);document.getElementById('fold').classList.toggle('done',on);this.setAttribute('aria-pressed',on);this.textContent=on?'Unfold':'Fold the crowd away'};

/* ---------------- MOCK AD + SMALL PRINT ---------------- */
const split=D.RS.filter(r=>{const ts=MK.map(m=>r.__t[m]).filter(Boolean);return ts.some(t=>t.dir>0)&&ts.some(t=>t.dir<0)}).length;
document.getElementById('adpg').innerHTML=
 '<div class="ad"><div class="adt">Advertisement (not really)</div><h3>Tired of babysitting four AIs?</h3>'+
  '<div class="adb"><img src="art/ad.jpg" alt=""><p><b>'+D.nTrades+' trades</b>graded for you, so you don’t have to. They disagreed on direction in '+split+' of '+issueNo+' rounds. Somebody has to keep score!</p></div>'+
  '<div class="cp">Send no money. There’s nothing to buy. <a href="'+esc(CONFIG.x)+'" rel="noopener">Follow on X</a> for the next round.</div></div>'+
 (wr?'<div class="ans"><p class="kick">The back page, answered (upside down, as is tradition)</p><div class="fv"><div class="fvs" style="background-image:url('+U.PORT[wm]+')">'+plq().replace('class="plq"','class="plq" style="width:100%"')+'</div><p>Folded, the crowd is gone and '+NM[wm]+' stands alone: the only one short on '+co(wr.ticker)+' in round '+wr.n+'. It moved '+S.mv(wr.a)+'.</p></div></div>':'')+
 '<div class="colo card"><b>The small print</b>Simulated record, '+p100+' a trade, before fees. Not financial advice. Trading can lose money; the pool can be wiped out. Hyperliquid is not available in every country. Market data: Hyperliquid, as of Nov 3. Everything else: the EZ sheet, '+issueNo+' graded rounds.</div>'+
 fol('adpg','Advertisement');

/* ---------------- layout passes: masthead, tags, charts, clock ---------------- */
const TAGS={/* [left, top, width, height, rotation] in % of the painting, measured on the painted blank tags (holes kept clear) */
 tg1:[4,58.6,27,12.4,0],tg2:[68.3,58.6,27,12.4,0],tg3:[33.3,79.5,33,13,0],
 tp1:[3.6,27.9,21.2,6.6,0],tp2:[61.3,30,21.4,6.5,0],tp3:[3.2,81.9,24.3,7,0],tp4:[68.2,89.9,27.4,7,0],
 tgk1:[65.6,37.6,22,8.6,10],tgk2:[66.4,87.2,22,8.6,10]};
function placeTags(){Object.keys(TAGS).forEach(id=>{const t=document.getElementById(id);if(!t)return;const g=TAGS[id];
  t.style.left=g[0]+'%';t.style.top=g[1]+'%';t.style.width=g[2]+'%';t.style.height=g[3]+'%';t.style.transform=g[4]?'rotate('+g[4]+'deg)':'';const w=t.clientWidth;const b=t.querySelector('b');if(b)b.style.fontSize='1.35em';U.fit(t,Math.min(w*0.2,24),8)})}
function gtfit(){const g=document.getElementById('gt');if(!g)return;g.querySelectorAll('.gk,.gn,.gs').forEach(e=>{e.style.fontSize='';const b=parseFloat(getComputedStyle(e).fontSize);e.style.whiteSpace='nowrap';let f=b,k=40;while(k-->0&&e.scrollWidth>e.parentElement.clientWidth+.5){f-=.5;e.style.fontSize=f+'px'}})}
function mast(){const t=document.getElementById('cvtt');U.fitW(t,parseFloat(getComputedStyle(t).fontSize)*1.3,10);}
function charts(draw){const w1=document.getElementById('chHit').clientWidth,h=Math.round(Math.max(210,Math.min(300,w1*0.62)));
  U.chart(document.getElementById('chHit'),{D,mode:'hit',w:w1,h,draw,aria:'Hit rate after each round, every line starting at 50%',labGap:18});
  U.chart(document.getElementById('chPnl'),{D,mode:'pnl',w:w1,h,draw,aria:'Season P&L after each round, $100K on every trade',labGap:18})}
let lw=0;function lay(force){const w=innerWidth;if(!force&&w===lw)return;lw=w;mast();gtfit();placeTags();charts(false)}
lay(true);if(document.fonts)document.fonts.ready.then(()=>{lay(true)});addEventListener('resize',()=>lay());
if(!SHOT&&'IntersectionObserver' in window){const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){charts(true);io.disconnect()}})},{threshold:.3});io.observe(document.getElementById('chHit'))}
if(!SHOT&&!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{const l=S.left(D.bet);if(l)document.getElementById('clock').innerHTML=clock(l)},1000);
window.__satD=D;window.__satReady=true;
})();
</script>
</body>
</html>
