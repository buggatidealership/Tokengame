<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earnings Zeason · this month's issue</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Patrick+Hand+SC&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sat.css">
<style>
/* ===== COVER: the painted front cover. Masthead and cover lines live in the painting's open sky; the cast stands
   with its backs to us (the faces are saved for Meet the models). ===== */
.cover{padding:0;background:#0b0a09}
.cv{position:relative;container-type:inline-size}
.cv>img{width:100%;aspect-ratio:3/4;object-fit:cover}
.cv-mast{position:absolute;left:3.2%;right:3.2%;top:1.6%;display:flex;align-items:center;gap:2.4cqw}
.cv-box{flex:none;width:13.5cqw;aspect-ratio:1;border:.5cqw solid var(--ink);background:#04070e;box-shadow:.7cqw .9cqw 0 rgba(0,0,0,.45);display:grid;place-items:center;transform:rotate(-3deg)}
.cv-box img{width:86%}
.cv-tt{font:400 10.4cqw/1 var(--H);margin:0;white-space:nowrap;color:var(--cream);letter-spacing:-.01em;
  -webkit-text-stroke:.55cqw var(--ink);paint-order:stroke fill;text-shadow:.8cqw 1cqw 0 rgba(21,17,13,.85)}
.cv-tt .e{color:#25c26a}.cv-tt .z{color:#ff4a3a}
.cv-issue{position:absolute;left:3.2%;top:15.2%;font:3.6cqw/1.1 var(--L);color:var(--ink);letter-spacing:.06em;transform:rotate(-2deg)}
.cv-issue b{font-weight:400;border-bottom:.35cqw solid var(--ink)}
.cv-line{position:absolute;left:3.2%;top:19.5%;width:47%;margin:0;font:400 5.5cqw/1.04 var(--H);color:var(--ink);transform:rotate(-2deg)}
.cv-line span{display:block;color:#a8231a}
/* the snipe: a printed corner flash on the sky, over nothing that matters */
.cv-snipe{position:absolute;right:2.5%;top:24.6%;width:17.5cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;transform:rotate(9deg);
  background:radial-gradient(circle at 35% 30%,#ffd76b,#e9a92a 60%,#b4760f);border:.5cqw solid var(--ink);box-shadow:.6cqw .8cqw 0 rgba(0,0,0,.45);color:var(--ink);font:2.85cqw/1.02 var(--L)}
.cv-snipe b{display:block;font:400 4.3cqw/1 var(--H)}
.cv-foot{background-image:linear-gradient(rgba(34,6,4,.55),rgba(28,4,3,.62)),url(art/wash-red.jpg);background-size:cover;padding:12px 16px 12px;display:grid;gap:8px;border-top:3px solid var(--ink)}
.cf-row{display:flex;gap:10px;align-items:baseline}
.cf-n{flex:none;font:400 22px/1 var(--H);color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.cf-t{font:15px/1.22 var(--L);letter-spacing:.02em}
.cf-t b{font-weight:400;color:var(--gold)}

/* ===== CONTENTS + HOW IT WORKS ===== */
.toc{list-style:none;margin:6px 0 14px;padding:0;display:grid;gap:4px}
.toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;font:17px/1.15 var(--L);letter-spacing:.02em;padding:5px 0;min-height:30px}
.toc a i{font-style:normal;flex:1;border-bottom:2px dotted rgba(243,230,196,.35);transform:translateY(-4px)}
.toc a b{font:400 18px/1 var(--H);color:var(--gold);min-width:22px;text-align:right}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative}
.pn{position:relative;border:2.5px solid var(--ink);box-shadow:3px 4px 0 rgba(0,0,0,.5);overflow:hidden;background-size:cover;display:flex;flex-direction:column;container-type:inline-size;min-height:0}
.pn .cap{position:relative;z-index:2;margin:0;padding:5px 7px 6px;font:13.5px/1.12 var(--L);letter-spacing:.015em;color:var(--ink);background:url(art/card.jpg) center/cover;border-bottom:2px solid var(--ink)}
.pn .cap b{font:400 15px/1 var(--H);margin-right:3px;color:#a8231a}
.pn .art{flex:1;position:relative;display:grid;place-items:center;padding:8px 6px 8px}
.p1{background-image:linear-gradient(rgba(4,6,12,.25),rgba(4,6,12,.35)),url(art/wash-ink.jpg)}
.p2{background-image:linear-gradient(rgba(6,22,14,.35),rgba(6,22,14,.45)),url(art/wash-green.jpg)}
.p3{background-image:linear-gradient(rgba(38,24,4,.35),rgba(30,18,2,.45)),url(art/wash-ochre.jpg)}
.p4{background-image:linear-gradient(rgba(34,6,4,.40),rgba(28,4,3,.48)),url(art/wash-red.jpg)}
.co-card{display:grid;justify-items:center;gap:5px;text-align:center}
.co-card .lgw{width:30cqw;aspect-ratio:1;border-radius:50%;background:url(art/card.jpg) center/cover;border:2px solid var(--ink);display:grid;place-items:center;box-shadow:2px 3px 0 rgba(0,0,0,.5)}
.co-card .lgw img{width:68%;height:68%;object-fit:contain}
.co-card .nm{font:16px/1.05 var(--L);letter-spacing:.02em}
.trd{display:grid;grid-template-columns:1fr 1fr;gap:5px 6px;width:100%}
.tr{display:flex;align-items:center;gap:5px;font:13px/1 var(--L);letter-spacing:.02em}
.tr .mk{width:20px;height:20px;flex:none}
.tr .bl{background:url(art/card.jpg) center/cover;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:3px 6px 2px;white-space:nowrap;position:relative}
.tr .bl.L{color:var(--upi)}.tr .bl.S{color:var(--dni)}
.tr .st{font:400 13px/1 var(--H);transform:rotate(-8deg);display:inline-block}
.mvbig{font:400 30px/1 var(--H);text-shadow:2px 2px 0 var(--ink);margin-bottom:4px}
.pnl-l{display:grid;gap:3px;width:100%;font:14px/1.1 var(--L)}
.pnl-l div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed rgba(243,230,196,.3);padding-bottom:2px}
.handoff{margin:10px 0 0;font:italic 15px/1.3 var(--B)}

/* ===== MEET THE MODELS ===== */
.cast{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.cm{display:flex;flex-direction:column}
.cm .por{border:3px solid var(--ink);box-shadow:4px 5px 0 rgba(0,0,0,.5);aspect-ratio:3/4;overflow:hidden;position:relative}
.cm .por img{width:100%;height:100%;object-fit:cover}
.cm .np{margin:-14px 6px 0;position:relative;z-index:2;padding:6px 8px 7px;transform:rotate(-1.2deg)}
.cm:nth-child(even) .np{transform:rotate(1deg)}
.cm .nmr{display:flex;align-items:center;gap:6px}
.cm .nm{font:400 22px/1 var(--H)}
.cm .mk{width:20px;height:20px}
.cm .fig{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;gap:6px}
.cm .pl{font:21px/1 var(--L)}
.cm .wl{font:15px/1 var(--L);letter-spacing:.02em}
.cm .tg{font:10.5px/1 var(--L);letter-spacing:.05em;opacity:.75}
.cm .bio{margin:7px 2px 0;font:italic 13.5px/1.3 var(--B);color:rgba(243,230,196,.92)}

/* ===== THE RECORD ===== */
.gags{display:grid;gap:12px}
.gag{display:grid;grid-template-columns:42% 1fr;gap:10px;align-items:start}
.gag .fr{border:3px solid var(--ink);box-shadow:4px 5px 0 rgba(0,0,0,.5);transform:rotate(-1deg);background:#000}
.gag:nth-child(2) .fr{transform:rotate(1.2deg)}
.gag .fr img{width:100%;aspect-ratio:1;object-fit:cover}
.gag .gl{font:400 19px/1.08 var(--H);margin:2px 0 5px;color:var(--cream);text-shadow:2px 2px 0 var(--ink)}
.gag .fx{font:14px/1.25 var(--L);letter-spacing:.02em}
.gag .fx .mk{width:16px;height:16px}
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 7px;margin-top:16px}
.tl{position:relative;display:flex;flex-direction:column}
.tl .th{border:2px solid var(--ink);box-shadow:2px 3px 0 rgba(0,0,0,.5);aspect-ratio:1;overflow:hidden;background:#000}
.tl .th img{width:100%;height:100%;object-fit:cover}
.tl .tc{padding:4px 1px 0;font:12px/1.1 var(--L);letter-spacing:.01em}
.tl .tc .co{display:block;color:var(--cream)}
.tl .tc .rw{display:flex;justify-content:space-between;gap:3px;margin-top:2px;align-items:center}
.tl .stamp{position:absolute;right:-3px;top:-5px;transform:rotate(9deg);display:flex;align-items:center;gap:2px;padding:2px 4px 1px;font:11px/1 var(--L);color:var(--ink);background:url(art/card.jpg) center/cover;border:1.5px solid var(--ink);box-shadow:1px 2px 0 rgba(0,0,0,.5)}
.tl .stamp .mk{width:13px;height:13px}
.tl .stamp.nb{color:var(--dni)}
.more{margin:14px auto 2px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;cursor:pointer;font:16px/1 var(--L);letter-spacing:.04em}
.sheet .tl.hid{display:none}
.sheet.all .tl.hid{display:flex}

/* ===== SMART OR LUCKY ===== */
.scale{position:relative;container-type:inline-size;margin:0 -16px}
.scale img{width:100%}
.tag{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink);font-family:var(--L);line-height:1.02;mix-blend-mode:multiply;letter-spacing:.02em;overflow:hidden}
.tag b{font:400 1em/1 var(--H);color:#7a1b13}
.chbox{margin-top:10px}
.chh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:16px 0 2px}
.chh h3{font:400 23px/1 var(--H);margin:0;text-shadow:2px 2px 0 var(--ink)}
.chh p{margin:0;font:italic 14px/1.25 var(--B);color:rgba(243,230,196,.88)}
.ch svg{display:block;overflow:visible}
.ch-ax{font:12px var(--L);fill:rgba(243,230,196,.72)}
.ch-lb{font:14px var(--L);letter-spacing:.02em;paint-order:stroke;stroke:rgba(10,8,6,.85);stroke-width:3px}
.ch-v{fill:var(--cream)}
.ch-empty{padding:30px 10px;text-align:center}
.honest{margin:14px 0 0;padding:9px 11px;font:15px/1.25 var(--L);letter-spacing:.02em}

/* ===== COVER STORY: the pool ===== */
.pool{position:relative;container-type:inline-size;margin:4px -16px 0}
.pool img{width:100%}
.dl{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:0 0 12px}
.dl .lab{color:var(--gold)}
.clock{display:inline-grid;grid-auto-flow:column;gap:2px;padding:5px 8px 4px;transform:rotate(-1deg)}
.clock div{display:grid;justify-items:center;min-width:42px}
.clock b{font:400 27px/1 var(--H)}
.clock i{font:normal 11px/1 var(--L);letter-spacing:.06em}
.rules{display:grid;gap:8px;margin:14px 0 0}
.rule{display:flex;gap:10px;align-items:baseline;font:16px/1.25 var(--L);letter-spacing:.02em}
.rule b{flex:none;font:400 19px/1 var(--H);color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.s2{margin-top:14px;padding:10px 12px;transform:rotate(-.6deg)}
.s2 b{font:400 20px/1 var(--H);display:block;margin-bottom:3px}
.s2 span{font:15px/1.25 var(--L)}

/* ===== NEXT ISSUE ===== */
.nx{display:grid;gap:9px}
.nr{display:grid;grid-template-columns:54px 1fr;gap:9px;align-items:center;padding:7px 9px 8px}
.nr .lg{width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:#fff8e8;overflow:hidden}
.nr .lg img{width:72%;height:72%;object-fit:contain}
.nr .nm{font:400 17px/1.05 var(--H)}
.nr .wh{font:13px/1.1 var(--L);letter-spacing:.03em;margin:2px 0 5px;opacity:.85}
.nr .ts{display:flex;flex-wrap:wrap;gap:4px 10px}
.nr .t1{display:flex;align-items:center;gap:3px;font:14px/1 var(--L)}
.nr .t1 .mk{width:16px;height:16px}
.due{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.due span{display:flex;align-items:center;gap:6px;padding:4px 8px 3px 4px;font:13px/1.1 var(--L);border:1.5px solid rgba(243,230,196,.45);border-radius:999px;background:rgba(0,0,0,.2)}
.due img{width:22px;height:22px;object-fit:contain;border-radius:50%;background:#fff8e8;padding:2px}

/* ===== MOCK AD ===== */
.ad{position:relative;padding:12px 12px 10px;border:3px solid var(--ink);box-shadow:4px 5px 0 rgba(0,0,0,.55);color:var(--ink);background-image:linear-gradient(rgba(255,240,190,.10),rgba(120,70,0,.10)),url(art/wash-ochre.jpg);background-size:cover}
.ad .adt{font:13px/1 var(--L);letter-spacing:.12em;text-align:center;margin-bottom:4px}
.ad h3{font:400 25px/1.02 var(--H);margin:0 0 6px;text-align:center;color:#5c1109}
.ad .adb{display:grid;grid-template-columns:40% 1fr;gap:8px;align-items:center}
.ad .adb img{mix-blend-mode:multiply;width:100%}
.ad .adb p{margin:0;font:17px/1.15 var(--L)}
.ad .adb p b{font:400 26px/1 var(--H);display:block;color:#5c1109}
.ad .cp{margin-top:8px;border:2px dashed var(--ink);padding:7px 9px;font:15px/1.2 var(--L);display:flex;gap:8px;align-items:center}
.ad .cp a{font:400 16px/1 var(--H);text-decoration:none;border-bottom:2px solid var(--ink)}
.ad .fine{margin:7px 0 0;font:11.5px/1.25 var(--B)}

/* ===== THE BACK PAGE FOLD ===== */
.fold{position:relative;margin-top:6px}
.fq{font:400 22px/1.08 var(--H);margin:0 0 8px;text-shadow:2px 2px 0 var(--ink)}
.fq span{color:var(--gold)}
.fsheet{position:relative;perspective:900px;aspect-ratio:2/1.333;--q:25%}
.fp{position:absolute;top:0;bottom:0;overflow:hidden;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);transition:transform .9s cubic-bezier(.45,0,.2,1),filter .9s;backface-visibility:hidden}
.fA{left:0;width:25%;border-left:3px solid var(--ink)}
.fC{right:0;width:25%;border-right:3px solid var(--ink)}
.fB1{left:25%;width:25%;transform-origin:left center}
.fB2{left:50%;width:25%;transform-origin:right center}
.fA .half,.fC .half{position:absolute;top:0;height:100%;width:200%;background-size:cover}
.fA .half{left:0;background-position:left center}
.fC .half{right:0;background-position:right center}
.fB{position:absolute;top:0;height:100%;width:200%;background-image:linear-gradient(rgba(34,6,4,.35),rgba(28,4,3,.45)),url(art/wash-red.jpg);background-size:cover;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.fB1 .fB{left:0}.fB2 .fB{right:0}
.crowd{display:flex;gap:4px;justify-content:center}
.crowd i{width:30%;max-width:62px;aspect-ratio:1;border-radius:50%;border:2.5px solid var(--ink);box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.crowd-t{font:14px/1.1 var(--L);text-align:center;letter-spacing:.03em;padding:0 8px}
.crowd-t b{font:400 17px/1 var(--H);display:block;color:var(--cream);text-shadow:2px 2px 0 var(--ink)}
.plq{position:absolute;bottom:6%;width:200%;display:flex;justify-content:center}
.fA .plq{left:0}.fC .plq{right:0}
.plq span{padding:5px 10px 4px;font:16px/1 var(--L);letter-spacing:.03em;white-space:nowrap}
.plq b{font:400 18px/1 var(--H)}
/* printed fold guides */
.fg{position:absolute;top:-10px;bottom:-10px;width:0;border-left:2px dashed rgba(243,230,196,.7);z-index:4;pointer-events:none;transition:opacity .4s}
.fg1{left:25%}.fg2{left:75%}.fg3{left:50%;border-left-style:dotted;opacity:.5}
.fsheet.folded .fA{transform:translateX(100%)}
.fsheet.folded .fC{transform:translateX(-100%)}
.fsheet.folded .fB1{transform:translateX(100%) rotateY(88deg);filter:brightness(.4)}
.fsheet.folded .fB2{transform:translateX(-100%) rotateY(-88deg);filter:brightness(.4)}
.fsheet.folded .fg{opacity:0}
.fbtn{margin:12px auto 0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;cursor:pointer;font:17px/1 var(--L);letter-spacing:.04em}
.fans{margin:10px 0 0;font:15px/1.3 var(--L);letter-spacing:.02em;text-align:center;opacity:0;transition:opacity .5s .7s}
.fold.done .fans{opacity:1}
.folded-view{display:none}

/* desktop: spreads */
@media (min-width:1000px){
  .cover{display:flex;flex-direction:column}
  .cv{flex:1}
  .cv>img{height:100%}
  .cv-foot{padding:14px 26px}
  .cf-t{font-size:17px}
  .toc a{font-size:20px}
  .strip{gap:10px}
  .pn .cap{font-size:15px;padding:7px 9px}
  .castsp{padding-bottom:18px}
  .cast{grid-template-columns:repeat(4,1fr);gap:22px}
  .cm .nm{font-size:30px}.cm .pl{font-size:26px}.cm .wl{font-size:18px}.cm .bio{font-size:15.5px}
  .gag{grid-template-columns:44% 1fr;gap:14px}
  .gag .gl{font-size:24px}.gag .fx{font-size:16px}
  .sheet{grid-template-columns:repeat(4,1fr);gap:12px 10px;margin-top:0}
  .tl .tc{font-size:13px}
  .scale{margin:0}
  .pool{margin:6px 0 0}
  .chh h3{font-size:28px}
  .rule{font-size:18px}
  .nr .nm{font-size:20px}
  .fsheet{max-width:560px;margin:0 auto}
  .folded-view{display:block}
  .fv{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:16px}
  .fv .fvs{position:relative;width:180px;aspect-ratio:3/4;border:3px solid var(--ink);box-shadow:4px 5px 0 rgba(0,0,0,.5);background-size:cover}
  .fv .fvs .plq{width:100%;left:0}
  .fv .fvs .plq span{font-size:13px;padding:4px 6px}
  .fv p{margin:0;font:16px/1.3 var(--L);letter-spacing:.02em}
  .ad h3{font-size:30px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="inkedge"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="1" seed="3"/><feDisplacementMap in="SourceGraphic" scale="1.2"/></filter>
</defs></svg>
<main class="mag" id="mag">
  <div class="spread two" id="s1">
    <section class="pg cover" id="cover" aria-label="Cover"></section>
    <section class="pg w-green" id="contents" aria-labelledby="h-in"></section>
  </div>
  <div class="spread" id="s2"><section class="pg w-ochre castsp" id="cast" aria-labelledby="h-cast"></section></div>
  <div class="spread two" id="s3">
    <section class="pg w-red" id="record" aria-labelledby="h-rec"></section>
    <section class="pg w-red" id="record2" aria-label="Every round so far"></section>
  </div>
  <div class="spread two" id="s4">
    <section class="pg w-green" id="sol" aria-labelledby="h-sol"></section>
    <section class="pg w-green" id="sol2" aria-label="The charts"></section>
  </div>
  <div class="spread two" id="s5">
    <section class="pg w-ink" id="bet" aria-labelledby="h-bet"></section>
    <section class="pg w-ink" id="bet2" aria-label="The pool"></section>
  </div>
  <div class="spread two" id="s6">
    <section class="pg w-ochre" id="next" aria-labelledby="h-next"></section>
    <section class="pg w-red" id="back" aria-labelledby="h-back"></section>
  </div>
</main>
<script src="../../../../../ez-data.js"></script>
<script src="sat-data.js"></script>
<script src="sat-ui.js"></script>
<script>
(function(){
'use strict';
const S=window.SAT,U=window.SUI,D=S.compute(),esc=S.esc,NM=S.NM,MK=D.MK;
const SHOT=/[?&]shot=1/.test(location.search);
const DESK=()=>matchMedia('(min-width:1000px)').matches;
const lead=D.rank[0],second=D.rank[1];
const issueNo=D.RS.length,lastR=D.RS[D.RS.length-1];
const mon=S.nyFmt(D.NOW,{month:'short',year:'numeric'});
const betDay=D.bet?S.nyFmt(D.bet,{weekday:'short',month:'short',day:'numeric'}):'',betMD=D.bet?S.nyFmt(D.bet,{month:'short',day:'numeric'}):'';
const frz=D.freeze?S.nyFmt(D.freeze,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
const mk=(m,c)=>'<span class="mk" style="color:'+(c||S.COL[m])+'">'+U.mark(m)+'</span>';
const co=t=>esc(S.coT(t));
const logoImg=t=>{const L=S.logo(t);return L?'<img src="'+L.src+'" alt="" loading="'+(SHOT?'eager':'lazy')+'">':''};
const fol=(p,lab)=>'<footer class="fol"><span>p. '+p+'</span><span>'+esc(lab)+'</span><span>Earnings Zeason · No. '+issueNo+'</span></footer>';
const NOBODY='Nobody';
const trWord=t=>t.dir>0?'Long':'Short';
const p100='$100K';

/* ---------------- COVER ---------------- */
document.getElementById('cover').innerHTML=
 '<div class="cv"><img src="art/cover.jpg" alt="A painted magazine cover: four caricatured men, seen from behind, stand on a Wall Street rooftop staring up at an empty diving board high above a swimming pool full of gold coins.">'+
 '<div class="cv-mast"><span class="cv-box"><img src="../../../../../tools/v22/x2p-logo.svg" alt="EZ."></span><h1 class="cv-tt"><span class="e">E</span>ARNINGS <span class="z">Z</span>EASON</h1></div>'+
