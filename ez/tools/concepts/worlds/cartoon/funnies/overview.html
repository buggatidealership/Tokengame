<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EZ Funnies</title>
<meta name="description" content="Mockup H47 (funnies): the Overview as the colour comics section of the EZ paper. Every figure from ez-data.js at render time.">
<link rel="stylesheet" href="common.css">
<style>
/* ---------- masthead ---------- */
.mast{grid-template-columns:2fr 1fr}
.mast .pn{min-height:0}
.mast-art{--iar:1280/720;--ar:1280/600;--st:-8%;--arm:1060/600;--swm:120.75%;--slm:-10.4%;--stm:-10%}
.mast-art .ttl{left:25.6%;width:53.4%;top:37.5%;height:22%;flex-direction:column;container-type:normal}
.mast-art .ttl span{font-family:Ultra,serif;line-height:.86;color:#d8382e;-webkit-text-stroke:.18cqw var(--ink);paint-order:stroke fill;text-shadow:.25cqw .25cqw 0 var(--ink),.45cqw .45cqw 0 var(--ink)}
.stage{container-type:inline-size}
.mast-art .ttl .a{font-size:2.9cqw;color:var(--ink);text-shadow:none;-webkit-text-stroke:0;letter-spacing:.12em}
.mast-art .ttl .b{font-size:7.6cqw;letter-spacing:.01em}
.premise{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:16px 16px 14px}
.premise .big{font-size:40px;line-height:1}
.premise p{margin:0;font-size:19px;line-height:1.22}
.premise .who{display:flex;flex-wrap:wrap;gap:6px}
.premise .who .chip{font-size:14px;padding:3px 8px 3px 3px;background:var(--paperL) var(--grain)}
.premise .fine{font:600 12.5px/1.3 "Source Serif 4",serif;text-transform:none;letter-spacing:0;border-top:1.5px solid var(--ink);padding-top:8px}
@media (max-width:700px){.mast{grid-template-columns:1fr}.premise{padding:12px}.premise .big{font-size:26px}.premise p{font-size:14.5px}.premise .who .chip{font-size:12px}}

/* ---------- a strip's title panel ---------- */
.tp{display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:12px}
.tp .hd{font-size:34px}
.tp .let{font-size:16.5px;line-height:1.22}
.tp .num{font:400 92px/.9 Ultra,serif;color:var(--ye);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.tp .flg{display:flex;flex-wrap:wrap;gap:6px}
.tp .wd{font:700 15px/1 "Comic Neue",sans-serif;text-transform:uppercase;letter-spacing:.08em}
@media (max-width:700px){.tp{grid-column:1/-1;flex-direction:row;align-items:flex-end;justify-content:space-between;padding:10px 12px}.tp .hd{font-size:25px}.tp .let{font-size:11.5px;text-align:right;max-width:52%}}

/* ---------- meet the cast ---------- */
.cast{grid-template-columns:190px repeat(4,1fr)}
.cast .pn{display:flex;flex-direction:column}
.cast .pic{position:relative;aspect-ratio:1/1;overflow:hidden}
.cast .pic img{width:100%;height:100%;object-fit:cover}
.cast .nm{position:absolute;left:-2px;top:-2px;z-index:3;display:flex;align-items:center;gap:7px;padding:5px 9px 5px 9px;border:2px solid var(--ink);font-size:21px;line-height:1}
.cast .ver{display:block;font:700 10.5px/1 "Comic Neue",sans-serif;margin-top:3px;letter-spacing:.04em}
.cast .band{border-top:2.5px solid var(--ink);padding:8px 10px 9px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 8px}
.cast .band .l{font-size:10.5px;letter-spacing:.06em;grid-column:1/-1}
.cast .band .pl{font-size:22px;line-height:1}
.cast .band .wl{font-size:13px;text-align:right}
@media (max-width:700px){.cast{grid-template-columns:1fr 1fr}.cast .nm{font-size:16px;padding:4px 7px;gap:5px}.cast .ver{font-size:9px}.cast .band{padding:6px 8px 7px}.cast .band .pl{font-size:17.5px}.cast .band .wl{font-size:11.5px}.cast .band .l{font-size:9.5px}}

/* ---------- how a round works ---------- */
.how{grid-template-columns:190px 1.55fr 1.15fr 1.55fr 1.25fr;grid-auto-rows:310px}
.how .pn{display:flex;flex-direction:column}
.heads{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:0;min-height:0}
.heads .hc{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:0;border-left:1.5px solid rgba(29,26,24,.55)}
.heads .hc:first-child{border-left:0}
.heads .hc .face{position:relative;overflow:hidden;height:56%;flex:none}
.heads .hc .face img{position:absolute;left:50%;top:0;height:178%;transform:translateX(-50%)}
.heads .hc .bwrap{flex:1;display:flex;align-items:flex-end;justify-content:center;padding:4px 2px 13px}
.heads .bal{position:relative;font-size:11px;padding:5px 6px 6px;white-space:normal;min-width:0}
.heads .bal b{font-size:1.15em}
.heads .wlbig{flex:1;display:flex;align-items:center;justify-content:center;font:400 46px/1 Ultra,serif;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);padding-top:4px}
.heads .wlbig.up{color:#3fae64}.heads .wlbig.dn{color:#e0453a}
.heads .stub{border-top:2px solid var(--ink);text-align:center;padding:5px 2px;font-size:11.5px;line-height:1.1}
.how .scene{position:relative;flex:1;overflow:hidden}
.how .scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.how .p2 .scene img{object-position:44% 30%}
.how .p4 .poster{position:relative;aspect-ratio:1/1;overflow:hidden;flex:none}
.how .p4 .poster img{width:100%;height:100%;object-fit:cover}
.how .p4 .res{flex:1;border-top:2.5px solid var(--ink);padding:7px 9px;font-size:12.5px;line-height:1.18;display:flex;flex-direction:column;justify-content:center;gap:3px}
.how .heads-wrap{flex:1;display:flex;flex-direction:column;padding-top:36px}
@media (max-width:700px){.how{grid-template-columns:1fr;grid-auto-rows:auto}.how .p1,.how .p3{height:232px}.how .p2{height:190px}.how .p4{flex-direction:row;height:auto}.how .p4 .poster{width:46%}.how .p4 .res{border-top:0;border-left:2.5px solid var(--ink);font-size:13px}}

/* ---------- the record ---------- */
.nofilm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.nofilm .lc.big{width:46%;aspect-ratio:1;border:2.5px solid var(--ink);background:var(--paperL) var(--grain);display:flex;align-items:center;justify-content:center;border-radius:6px}
.nofilm .lc.big.dk{background:#1d1a18 var(--grain)}
.nofilm .lc.big img{width:72%;height:72%;object-fit:contain}
.nofilm .let{font-size:11px;background:var(--paperL) var(--grain);border:2px solid var(--ink);padding:3px 7px}
.night{grid-template-columns:170px repeat(3,1fr) 1.5fr}
.night .tp{background-blend-mode:normal}
.night .tp .hd{font-size:32px;color:var(--ye);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink)}
.rt{display:flex;flex-direction:column}
.rt .poster{position:relative;aspect-ratio:1/1;overflow:hidden;flex:none}
.rt .poster img{width:100%;height:100%;object-fit:cover}
.rt .stub{border-top:2.5px solid var(--ink);padding:6px 8px 7px;display:grid;grid-template-columns:1fr auto;gap:3px 6px;align-items:center;flex:1;font-size:12px;line-height:1.1}
.rt .stub .co{grid-column:1/-1}
.rt .stub .co i{font-style:normal;opacity:.75}
.rt .stub .mv{font-size:15px}
.rt .stub .n{font:800 10.5px/1 "Source Serif 4",serif;letter-spacing:.04em}
.rt .wn{display:flex;gap:3px;justify-content:flex-end;flex-wrap:wrap}
.gag{display:flex;flex-direction:column}
.gag .pair{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.gag .half{position:relative;display:flex;flex-direction:column;min-height:0}
.gag .half+.half{border-left:2px solid var(--ink)}
.gag .half .bwrap{flex:1;display:flex;align-items:flex-end;justify-content:center;padding:34px 6px 14px}
.gag .half .bal{position:relative;font-size:12px;white-space:normal}
.gag .half .face{position:relative;height:58%;overflow:hidden;flex:none}
.gag .half .face img{position:absolute;left:50%;top:0;width:118%;transform:translateX(-50%)}
.gag .tally{border-top:2.5px solid var(--ink);padding:6px 9px;font-size:11.5px;line-height:1.25;display:flex;flex-wrap:wrap;gap:2px 10px}
.gag .tally span{white-space:nowrap}
.more{font-size:11.5px;line-height:1.2;text-align:left}
@media (max-width:700px){.night{grid-template-columns:repeat(3,1fr)}.night .tp{grid-column:1/-1}.night .tp .hd{font-size:21px}.night .gag{grid-column:1/-1;height:254px}.rt .stub{padding:5px 5px 6px;font-size:10px;grid-template-columns:1fr}.rt .stub .mv{font-size:13px}.rt .wn{justify-content:flex-start}.rt .stub .chip{font-size:9.5px;padding:1px 4px 1px 2px}.rt .stub .chip .dot{width:14px;height:14px}}
.night.n1{grid-template-columns:170px 1fr 2fr}.night.n2{grid-template-columns:170px 1fr 1fr 1.6fr}
@media (max-width:700px){.night.n1,.night.n2{grid-template-columns:repeat(2,1fr)}.night.n1 .rt{grid-column:1/-1;flex-direction:row}.night.n1 .rt .poster{width:46%}.night.n1 .rt .stub{border-top:0;border-left:2.5px solid var(--ink)}}
.arch{grid-template-columns:repeat(8,1fr)}
.arch .rt .stub{font-size:10.5px;padding:5px 6px}
.arch .rt .stub .mv{font-size:13px}
.arch .rt[hidden]{display:none}
.arch-foot{display:flex;justify-content:center;margin-top:12px}
@media (max-width:700px){.arch{grid-template-columns:repeat(3,1fr)}}

/* ---------- smart or lucky ---------- */
.sol{grid-template-columns:1fr 1fr;grid-auto-rows:auto}
.sol>.tp{grid-column:1/-1;flex-direction:row;align-items:flex-end;justify-content:space-between;padding:12px 14px}
.sol>.tp .let{max-width:52%;text-align:right}
.sol .chart{height:400px}
.chart{position:relative;display:flex;flex-direction:column}
.chart .cv{flex:1;position:relative;min-height:0}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart .cap.abs{max-width:70%}
@media (max-width:700px){.sol{grid-template-columns:1fr}.sol .chart{height:300px}.tp .num{font-size:64px}}

/* ---------- the bet ---------- */
.bet1{grid-template-columns:300px 1fr}
.bet2{grid-template-columns:1.45fr 1fr 1fr}
.bet3{grid-template-columns:repeat(3,1fr);grid-auto-rows:300px}
.btp{padding:16px;display:flex;flex-direction:column;gap:12px;justify-content:space-between}
.btp .hd{font-size:76px}
.btp .nv{display:flex;align-items:center;gap:10px}
.btp .nv .card{width:72px;height:72px;border:2px solid var(--ink);background:#0d0d0d var(--grain);display:flex;align-items:center;justify-content:center;flex:none}
.btp .nv .card img{width:60px;height:60px;object-fit:contain}
.btp .nv b{font:400 30px/1 Ultra,serif;color:var(--paperL)}
.btp .let{font-size:14px;line-height:1.2}
.btp .when{background:var(--ye) var(--grain);color:var(--ink);border:2px solid var(--ink);padding:6px 9px;align-self:flex-start;font-size:14px}
.tower{--iar:1280/720;--ar:892/440;--st:-6%;--arm:1/1;--swm:177.8%;--slm:-25%;--stm:0%}
.tower .plate{left:37.7%;top:44.5%;width:7.6%;height:19%;font-family:Ultra,serif;color:#1d2a44;font-size:2.15cqw;letter-spacing:.06em;writing-mode:horizontal-tb;opacity:.86;mix-blend-mode:multiply;text-shadow:0 0 .5px #1d2a44}
.clock{--iar:1280/720;--ar:497/343;--sw:121.7%;--sl:-10.85%;--arm:1280/720;--swm:100%;--slm:0%}
.clock .win{flex-direction:column;justify-content:center;gap:.3cqw;color:#ffd447;text-shadow:0 0 .6cqw rgba(255,190,40,.55)}
.clock .win b{font:700 5.4cqw/1 "Comic Neue",sans-serif}
.clock .win i{font:700 1.25cqw/1 "Comic Neue",sans-serif;font-style:normal;letter-spacing:.12em;opacity:.85}
.tix{--iar:1/1;--ar:1/1}
.tix .face{left:19%;top:35.8%;width:50%;height:25.5%;transform:rotate(-7deg);flex-direction:column;gap:.6cqw}
.tix .face .k{font:700 3cqw/1 "Comic Neue",sans-serif;letter-spacing:.2em;color:#6a4206}
.tix .face .nmx{font:400 9.5cqw/.9 Ultra,serif;color:var(--ink);text-shadow:.3cqw .3cqw 0 rgba(150,95,10,.55)}
.tix .face .pl{font:700 3.6cqw/1 "Comic Neue",sans-serif;color:#1f5a33}
.lead{display:flex;flex-direction:column}
.lead .bwrap{flex:1;display:flex;align-items:flex-end;justify-content:center;padding:40px 10px 14px}
.lead .bal{position:relative;font-size:13px;white-space:normal}
.lead .face{position:relative;height:60%;overflow:hidden;flex:none}
.lead .face img{position:absolute;left:50%;top:0;width:112%;transform:translateX(-50%)}
.bet3 .pn img.art{object-fit:cover}
.bet3 .s-f img.art{object-position:30% 30%}
.bet3 .s-c img.art{object-position:60% 50%}
.bet3 .s-m img.art{object-position:40% 50%}
.contd{position:absolute;right:-2px;bottom:-2px;z-index:3;background:var(--ye) var(--grain);border:2px solid var(--ink);padding:6px 10px;font-size:13px}
@media (max-width:700px){.bet1,.bet2,.bet3{grid-template-columns:1fr;grid-auto-rows:auto}.btp .hd{font-size:46px}.btp{flex-direction:row;flex-wrap:wrap;align-items:flex-end}.btp .hd{width:100%}.bet2 .lead{height:300px}.bet3 .pn{height:230px}}

/* ---------- the verdict ---------- */
.vd{grid-template-columns:190px 1fr 1.25fr 1fr;grid-auto-rows:300px}
.lead2{display:flex;flex-direction:column}
.lead2 .bwrap{flex:1;display:flex;align-items:flex-end;justify-content:center;padding:40px 10px 14px}
.lead2 .bal{position:relative;font-size:14px;white-space:normal;max-width:88%;padding:10px 20px 11px}
.lead2 .bal b{font-size:1.7em;margin-top:3px}
.lead2 .bal .sm{display:block;font-size:.78em;margin-top:2px}
.lead2 .face{position:relative;height:50%;overflow:hidden;flex:none}
.lead2 .face img{position:absolute;left:50%;top:0;width:100%;transform:translateX(-50%)}
.rng{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:48px 18px 16px}
.rb .rail{position:relative;height:46px;border:2px solid var(--ink);background:var(--paperL) var(--grain);margin:30px 0 4px}
.rb .band{position:absolute;top:-2px;bottom:-2px;border:2px solid var(--ink);background-color:#ecd58c;background-image:var(--grain),radial-gradient(circle,rgba(238,183,24,.95) 0 36%,transparent 40%);background-size:240px 240px,5px 5px}
.rb .band i{position:absolute;bottom:calc(100% + 4px);font:700 12px/1 "Comic Neue",sans-serif;font-style:normal}
.rb .band .a{left:-2px;transform:translateX(-50%)}.rb .band .b{right:-2px;transform:translateX(50%)}
.rb .half{position:absolute;top:-10px;bottom:-10px;border-left:2px dashed var(--ink)}
.rb .half i{position:absolute;top:100%;left:4px;font:700 10.5px/1 "Comic Neue",sans-serif;font-style:normal;text-transform:uppercase;white-space:nowrap;margin-top:2px}
.rb .pin{position:absolute;top:-2px;bottom:-2px;width:0;border-left:4px solid var(--ink)}
.rb .pin i{position:absolute;bottom:calc(100% + 18px);left:0;transform:translateX(-50%);font:700 12px/1.05 "Comic Neue",sans-serif;font-style:normal;text-transform:uppercase;text-align:center;white-space:nowrap;background:var(--ye) var(--grain);border:2px solid var(--ink);padding:3px 6px}
.rb .sc{position:relative;height:14px;font:700 11px/1 "Comic Neue",sans-serif;text-transform:uppercase;margin-top:6px}
.rb .sc span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.rb .sc span:first-child{transform:none}.rb .sc span:last-child{transform:translateX(-100%)}
.rb.mini .rail{height:14px;margin:4px 0 0;border-width:1.5px}.rb.mini .band{border-width:1.5px}.rb.mini .pin{border-left-width:3px}.rb.mini .half{top:-3px;bottom:-3px;border-left-width:1.5px}
.rtx{margin:0;font-size:14px;line-height:1.25}
.fld{padding:46px 12px 12px;display:flex}
.fl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:8px}
.fl li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 8px;font-size:13px;border-bottom:1.5px dashed rgba(29,26,24,.5);padding-bottom:7px}
.fl li .rb{grid-column:1/-1}
.fl li .rr{grid-column:1/-1;font-size:10.5px;margin-top:-1px}
.fl li:last-child{border-bottom:0}
.fl li b{font-size:16px}
@media (max-width:700px){.vd{grid-template-columns:1fr;grid-auto-rows:auto}.lead2{height:330px}.rng{padding:44px 14px 14px}.fld{padding:44px 10px 10px}}
/* ---------- what the top model trades next ---------- */
.nxt{grid-template-columns:1fr}
.nxt>.tp{flex-direction:row;align-items:flex-end;justify-content:space-between;padding:12px 14px}
.nxt>.tp .let{max-width:46%;text-align:right}
.nxc{display:flex;flex-direction:column;gap:var(--g);min-width:0}
.nxc.few{display:grid;grid-template-columns:300px 1fr;grid-template-areas:"h1 h2" "pe up" ". ft";gap:var(--g) var(--g)}
.nxc.few>.uph:nth-of-type(1){grid-area:h1}.nxc.few>.uph:nth-of-type(2){grid-area:h2}
.nxc.few>.pend{grid-area:pe;grid-template-columns:1fr}.nxc.few>.ups{grid-area:up;grid-template-columns:repeat(3,minmax(0,1fr));align-content:start}
.nxc.few>.arch-foot,.nxc.few>.srcl{grid-column:1/-1}
.nxc.few .nc .ld{min-height:96px}.nxc.few .nc .fd{font-size:13px;gap:8px}
.nc{display:flex;flex-direction:column}
.nc .top{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:2.5px solid var(--ink)}
.nc .lc{width:46px;height:46px;flex:none;border:2px solid var(--ink);background:var(--paperL) var(--grain);display:flex;align-items:center;justify-content:center;border-radius:4px}
.nc .lc img{width:36px;height:36px;object-fit:contain}
.nc .co{font-size:13px;line-height:1.1;background:var(--paperL) var(--grain);border:2px solid var(--ink);padding:4px 6px;flex:1;min-width:0}
.nc .co i{font-style:normal;display:block;font-size:10.5px;margin-top:2px;opacity:.85}
.nc .ld{position:relative;display:flex;align-items:center;gap:10px;padding:14px 10px 12px;min-height:96px;border-bottom:2px solid var(--ink)}
.nc .ld .big{width:52px;height:52px;border-radius:50%;flex:none;border:2.5px solid var(--ink);box-shadow:0 0 0 3px #efb22a,0 0 0 5px var(--ink);background:var(--paperL) var(--grain);display:flex;align-items:center;justify-content:center;margin-left:6px}
.nc .ld .bal{position:relative;font-size:15px;padding:8px 13px 9px}
.nc .ld .bal .tl{left:-12px;top:calc(50% - 10px);transform:rotate(90deg)}
.nc .ld .who{position:absolute;left:8px;bottom:3px;font-size:10.5px;letter-spacing:.06em}
.nc .fd{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:7px 9px;font-size:11.5px;border-bottom:2px solid var(--ink);flex:1}
.nc .fd>span{display:flex;align-items:center;gap:5px}
.nc .fd .dot{width:17px;height:17px;border-radius:50%;border:1.2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none}
.cp{display:flex;align-items:center;gap:8px;margin:7px;padding:6px 8px;border:2px dashed var(--ink);background:#ecd58c var(--grain);font-size:11px;line-height:1.15;flex:none;min-height:54px}
.cp .sc{width:20px;height:20px;flex:none}
.cp b{display:block;font-size:14px;letter-spacing:.02em;text-transform:none;font-family:"Source Serif 4",serif;font-weight:800}
.cp i{display:block;font-style:normal;font-size:10.5px;margin-top:1px}
.cp.thin{background:#efe1bd var(--grain)}
.cp.none{background:var(--paper2) var(--grain);border-style:solid;border-color:rgba(29,26,24,.45);justify-content:center;color:var(--ink2)}
.us em{display:block;font-style:normal;font-family:"Source Serif 4",serif;font-weight:800;font-size:11.5px;text-transform:none;margin-top:3px}
.us em.thin{opacity:.85}.us em.none{font-family:"Comic Neue",sans-serif;font-weight:700;text-transform:uppercase;font-size:10px;opacity:.7}
.us[hidden]{display:none}
.srcl{margin:2px 0 0;font:600 12px/1.3 "Source Serif 4",serif}
.sec-h.proof{margin-top:40px}
@media (max-width:700px){.nxc.few{display:flex}.nxc.few>.ups{grid-template-columns:1fr 1fr}.nxt>.tp .let{max-width:52%}.nxt>.tp .hd{font-size:23px}.nc{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"top top" "ld fd" "cp cp"}.nc .top{grid-area:top}.nc .ld{grid-area:ld;min-height:84px;border-right:2px solid var(--ink);padding:12px 6px 14px 4px;gap:6px}.nc .ld .big{width:44px;height:44px;margin-left:2px}.nc .ld .bal{font-size:13px;padding:6px 9px 7px}.nc .fd{grid-area:fd;border-bottom:2px solid var(--ink)}.nc .cp{grid-area:cp;margin:6px}.lead2 .bal{max-width:80%;padding:10px 22px 11px}}

.upw>.tp .let{max-width:46%;text-align:right}
.upc{display:flex;flex-direction:column;gap:var(--g);min-width:0}
.lc.dk{background:#1d1a18 var(--grain)!important}
.mks .mkc{height:52px;display:flex;align-items:center;justify-content:center;flex:none}
.mks .mkd{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--paperL) var(--grain);display:flex;align-items:center;justify-content:center}

.pc .lc img{width:36px;height:36px;object-fit:contain}
.pc .co{font-size:13px;line-height:1.1;background:var(--paperL) var(--grain);border:2px solid var(--ink);padding:4px 6px;flex:1;min-width:0}

@media (max-width:700px){.pend{grid-template-columns:1fr}.pc{display:grid;grid-template-columns:132px 1fr}.pc .top{flex-direction:column;align-items:stretch;border-bottom:0;border-right:2.5px solid var(--ink)}.pc .lc{align-self:center}.pc .heads{height:140px}.ups{grid-template-columns:1fr 1fr}}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:10px;border-top:3px double var(--ink);font:600 13px/1.35 "Source Serif 4",serif}

@media (max-width:700px){.sec-h{margin-top:24px;flex-direction:column;gap:4px}.sec-h .hd{font-size:27px}}

<body>
<div class="sheet" id="app"></div>
<script src="../../../../../ez-data.js"></script>
<script src="data.js"></script>
<script src="charts.js"></script>
<script>
function main(HL){
var D=F.compute(),E=F.esc,ROOT=F.ROOT,O=F.ORDER,NAME=F.NAME;
var LOGO='../../../../v22/x2p-logo.svg';
function lcard(t,cls){var L=F.logoSrc(t),dk=(CO_LOGOS[String(t).toUpperCase()]||{}).dark;return '<span class="'+cls+(dk?' dk':'')+'">'+(L?'<img src="'+L+'" alt="">':'')+'</span>'}
function img(m,p){return 'img/c-'+m.toLowerCase()+'-'+p+'.jpg'}
function tail(flip){return '<svg class="tl" viewBox="0 -4 22 24" aria-hidden="true"'+(flip?' style="transform:scaleX(-1)"':'')+'><path d="M2 -4 L2 0 C6 7 7 13 4 20 C11 14 15 8 17 0 L17 -4 Z" fill="#f3e8cc"/><path d="M2 0 C6 7 7 13 4 20 C11 14 15 8 17 0" fill="none" stroke="#1d1a18" stroke-width="2" stroke-linejoin="round"/></svg>'}
function bal(html,cls){return '<div class="bal '+(cls||'')+'">'+html+tail()+'</div>'}
function sgn(v){return v>0?'up':v<0?'dn':''}
function chip(m){return '<span class="chip let" style="background:var(--paperL)"><span class="dot" style="background:'+F.COL[m]+'">'+F.mark(m,11)+'</span>'+NAME[m].toUpperCase()+'</span>'}
function winChips(r){return r.wins.length?r.wins.map(chip).join(''):'<span class="chip let" style="background:var(--paperL)">NOBODY</span>'}
function noFilm(r){var bc=((CO_LOGOS[r.ticker]||{}).c)||'#888';return '<div class="nofilm t-m" style="--mc:'+bc+'">'+lcard(r.ticker,'lc big')+'<span class="let">Film coming</span></div>'}
function rtile(r,hide,eager){var P=F.poster(r);return '<figure class="pn rt"'+(hide?' hidden':'')+'><div class="poster">'+(P?'<img '+(eager?'':'loading="lazy" ')+'decoding="async" src="'+P+'" alt="Round '+r.n+', '+E(F.coLabel(r))+', film poster">':noFilm(r))+'</div>'+
  '<figcaption class="stub let t-cream"><span class="co"><span class="n">R'+r.n+'</span> '+E(F.coName(r.ticker))+' <i>('+E(r.ticker)+')</i></span><b class="mv '+sgn(r.a)+'">'+E(r.out)+'</b><span class="wn">'+winChips(r)+'</span></figcaption></figure>'}
var H='';

/* ===== masthead ===== */
var nowDay=F.nyDay(D.NOW);
H+='<header class="fol"><img class="lg" src="'+LOGO+'" alt="EZ."><span><b>THE EZ. DAILY</b> &middot; '+F.longDay(nowDay)+'</span><span class="sp"></span><nav aria-label="Sections"><a href="overview.html" aria-current="page">C &middot; The Funnies</a><a href="leaderboard.html">D &middot; Sports &rarr;</a></nav></header>';
H+='<section class="strip mast" aria-label="The EZ. Funnies"><div class="pn"><div class="crop mast-art"><div class="stage"><img src="img/s-mast.jpg" alt="A bull and a bear hold up the section\'s banner"><div class="on ttl"><span class="a">THE EZ.</span><span class="b">FUNNIES</span></div></div></div></div>';
H+='<div class="pn t-ye premise let"><div class="hd big" style="font-family:Ultra,serif;text-transform:none">We track 4 AIs on every earnings trade, so you don\'t have to.</div><p>Before a company reports, each AI goes <span class="up">long</span> or <span class="dn">short</span>. The close grades every trade.</p><div class="who">'+O.map(chip).join('')+'</div><p class="fine">Season 1 &middot; '+D.RS.length+' rounds graded &middot; flat $100K a trade, simulated.</p></div></section>';

/* ===== the verdict, so far ===== */
var top=D.top,T0=D.season[top],wi=F.wilson(T0.w,T0.n),field=D.rank(D.season,'pnl').filter(function(m){return m!==top});
var pc=function(v){return Math.round(v*100)+'%'};
function rangeBar(k,n,w,mini){var lo=30,hi=90,X=function(v){return ((v*100-lo)/(hi-lo)*100).toFixed(2)+'%'};
  return '<div class="rb'+(mini?' mini':'')+'"><div class="rail"><span class="half" style="left:'+X(.5)+'"></span><span class="band" style="left:'+X(w.lo)+';width:calc('+X(w.hi)+' - '+X(w.lo)+')">'+(mini?'':'<i class="a">'+pc(w.lo)+'</i><i class="b">'+pc(w.hi)+'</i>')+'</span><span class="pin" style="left:'+X(k/n)+'">'+(mini?'':'<i>'+(k/n*100).toFixed(1)+'%<br>so far</i>')+'</span></div>'+(mini?'':'<div class="sc"><span style="left:0">30%</span><span style="left:'+X(.5)+'">50% = half right</span><span style="left:'+X(.7)+'">70%</span><span style="left:100%">90%</span></div>')+'</div>'}
H+='<section class="strip vd" aria-label="The verdict, so far"><div class="pn tp t-gold"><h2 class="hd lit">The verdict, so far</h2><div class="let">We track every trade so you don\'t have to. After '+D.RS.length+' rounds, here is who has earned trust.</div></div>';
H+='<figure class="pn lead2 t-m" style="--mc:'+F.COL[top]+'"><div class="cap abs t-ye">'+NAME[top]+' leads.</div><div class="bwrap">'+bal('Right on '+T0.w+' of '+T0.n+' trades so far.<b class="up">'+F.usd(T0.pnl)+'</b><span class="sm">on a flat $100K a trade</span>')+'</div><div class="face"><img src="'+img(top,'n')+'" alt="'+NAME[top]+'"></div></figure>';
H+='<figure class="pn rng t-cream"><div class="cap abs t-ye">How sure is that?</div>'+rangeBar(T0.w,T0.n,wi)+'<p class="let rtx">On '+T0.n+' trades, '+NAME[top]+'\'s real hit rate could be anywhere from about '+pc(wi.lo)+' to '+pc(wi.hi)+'. Too few to call it skill. Every round narrows it.</p></figure>';
H+='<figure class="pn fld t-cream"><div class="cap abs t-ye">The field, on the same scale</div><ul class="fl">'+field.map(function(m){var s=D.season[m];return '<li class="let"><span class="chip" style="background:var(--paperL)"><span class="dot" style="background:'+F.COL[m]+'">'+F.mark(m,11)+'</span>'+NAME[m].toUpperCase()+'</span><span>'+s.w+' of '+s.n+' right</span><b class="'+sgn(s.pnl)+'">'+F.usd(s.pnl)+'</b>'+rangeBar(s.w,s.n,F.wilson(s.w,s.n),1)+'<span class="rr">Real rate: about '+pc(F.wilson(s.w,s.n).lo)+' to '+pc(F.wilson(s.w,s.n).hi)+'</span></li>'}).join('')+'</ul></figure></section>';

/* ===== what the top model trades next, and where to follow it ===== */
function coupon(t){var M=F.hlMarket(t,HL);if(!HL)return '<div class="cp let none">Hyperliquid snapshot not loaded</div>';
  if(!M)return '<div class="cp let none">No Hyperliquid market</div>';
  return '<div class="cp let'+(M.thin?' thin':'')+'"><svg class="sc" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="3" fill="none" stroke="#1d1a18" stroke-width="2"/><circle cx="6" cy="18" r="3" fill="none" stroke="#1d1a18" stroke-width="2"/><path d="M8.5 7.5L21 17M8.5 16.5L21 7" stroke="#1d1a18" stroke-width="2" stroke-linecap="round"/></svg><span>Follow it on Hyperliquid<b>'+E(M.name)+'</b><i>'+(M.thin?'Thin market, ':'')+'$'+M.oi.toFixed(1)+'M open interest</i></span></div>'}
function tradeOf(u,m){var c=(u.calls||[]).filter(function(c){return c.m===m})[0];return c?{dir:c.dir==='DOWN'?'SHORT':'LONG',mag:c.mag}:null}
H+='<section class="strip nxt" aria-label="What '+NAME[top]+' trades next"><div class="pn tp t-green"><h2 class="hd lit">What '+NAME[top]+' trades next</h2><div class="let">The top model\'s trade on each coming earnings, with the other three as the field.</div></div><div class="nxc'+(D.pend.length<=2?' few':'')+'">';
H+='<div class="uph">Trades in &middot; graded at the close</div><section class="strip pend" style="margin-top:0">';
D.pend.slice(0,5).forEach(function(u){var bc=((CO_LOGOS[u.ticker]||{}).c)||'#888',t=tradeOf(u,top);
  H+='<figure class="pn nc"><div class="top t-m" style="--mc:'+bc+'">'+lcard(u.ticker,'lc')+'<span class="co let">'+E(F.coName(u.ticker))+' ('+E(u.ticker)+')<i>Graded '+(u.resolves?F.wmd(F.dOf(u.resolves)):'date to come')+'</i></span></div>'+
  '<div class="ld t-m" style="--mc:'+F.COL[top]+'"><span class="big">'+F.mark(top,30)+'</span>'+(t?bal('<span class="'+(t.dir==='LONG'?'up':'dn')+'">'+t.dir+'</span><b>'+(t.dir==='LONG'?'+':'−')+E(t.mag)+'%</b>'):bal('No trade'))+'<span class="who let">'+NAME[top].toUpperCase()+'</span></div>'+
  '<div class="fd let t-cream">'+O.filter(function(m){return m!==top}).map(function(m){var q=tradeOf(u,m);return '<span><span class="dot" style="background:'+F.COL[m]+'">'+F.mark(m,11)+'</span>'+NAME[m].toUpperCase()+' '+(q?'<b class="'+(q.dir==='LONG'?'up':'dn')+'">'+q.dir+'</b>':'<b>none</b>')+'</span>'}).join('')+'</div>'+coupon(u.ticker)+'</figure>'});
H+='</section>';
var ups=D.up.filter(function(u){return u.called&&F.dOf(u.called)>=D.today}),uvis=matchMedia('(max-width:700px)').matches?6:10;
H+='<div class="uph">Next to report &middot; trades drop before the earnings</div><section class="strip ups" id="ups" style="margin-top:0">';
ups.forEach(function(u,i){var bc=((CO_LOGOS[u.ticker]||{}).c)||'#888';
  H+='<div class="pn us t-cream" style="--bc:'+bc+'"'+(i>=uvis?' hidden':'')+'>'+lcard(u.ticker,'lc')+'<span class="t let">'+E(F.coName(u.ticker))+' ('+E(u.ticker)+')<i>Trades due '+F.wmd(F.dOf(u.called))+'</i>'+(function(){var M=F.hlMarket(u.ticker,HL);return M?'<em class="'+(M.thin?'thin':'')+'">'+E(M.name)+(M.thin?' &middot; thin':'')+'</em>':'<em class="none">No Hyperliquid market</em>'})()+'</span></div>'});
H+='</section>'+(ups.length>uvis?'<div class="arch-foot"><button class="btn" id="upsBtn" aria-controls="ups" aria-expanded="false">Show all '+ups.length+' coming up</button></div>':'')+'<p class="srcl">Hyperliquid, as of Nov 3. Thin = under $10M open interest. Hyperliquid is not available in every country.</p></div></section>';

H+='<h2 class="sec-h proof"><span class="hd">The proof</span><span class="let">Every trade is locked before the earnings and graded by the close. The cast, the rounds and the films are the receipts.</span></h2>';

/* ===== meet the cast ===== */
var byPnl=D.rank(D.season,'pnl');
H+='<section class="strip cast" aria-label="Meet the cast"><div class="pn tp t-gold"><h2 class="hd lit">Meet the cast</h2><div class="flg">'+O.map(function(m){return F.flag(F.CTRY[m],34)}).join('')+'</div><div class="let">Four AIs. Two countries. One season, '+D.RS.length+' rounds in.</div></div>';
byPnl.forEach(function(m){var s=D.season[m];
  H+='<figure class="pn"><div class="pic"><img src="'+img(m,'n')+'" alt="'+NAME[m]+', drawn as a strip character"><div class="nm let t-m" style="--mc:'+F.COL[m]+'"><span>'+NAME[m].toUpperCase()+'<span class="ver">'+E(MODELS[m].ver)+'</span></span>'+F.flag(F.CTRY[m],26)+'</div></div>'+
  '<figcaption class="band let t-ye"><span class="l">Season P&amp;L</span><b class="pl '+sgn(s.pnl)+'">'+F.usd(s.pnl)+'</b><span class="wl">W-L <b>'+s.w+'-'+s.l+'</b></span></figcaption></figure>'});
H+='</section>';

/* ===== how a round works: one real round, the newest with a clear split ===== */
var ex=null;for(var i=D.RS.length-1;i>=0;i--){var r=D.RS[i],ks=O.filter(function(m){return r.T[m]}),nw=ks.filter(function(m){return r.T[m].w}).length;if(ks.length===4&&nw===2&&r.wins.length===1&&F.poster(r)){ex=r;break}}
if(!ex)ex=D.RS.filter(function(r){return F.poster(r)}).pop();
var exW=ex.wins[0];
H+='<section class="strip how" aria-label="How a round works">';
H+='<div class="pn tp t-ye"><h2 class="hd lit">How a round works</h2><div class="let">Round '+ex.n+': '+E(F.coLabel(ex))+' reports. Graded at the close, '+F.wmd(ex.day)+'. Flat $100K on every trade.</div></div>';
function headsRow(r,kind){return '<div class="heads">'+O.map(function(m){var t=r.T[m];if(!t)return '';
  if(kind==='grade')return '<div class="hc t-m" style="--mc:'+F.COL[m]+'"><div class="wlbig '+(t.w?'up':'dn')+'">'+(t.w?'W':'L')+'</div><div class="face"><img src="'+img(m,t.w?'w':'l')+'" alt=""></div><div class="stub let t-cream"><span class="'+(t.w?'up':'dn')+'">'+F.usd(t.v)+'</span></div></div>';
  var inner=kind==='trade'?'<div class="bwrap">'+bal((t.dir==='LONG'?'<span class="up">LONG</span>':'<span class="dn">SHORT</span>')+'<b>'+(t.dir==='LONG'?'+':'−')+t.mag+'%</b>')+'</div>':'';
  var pose=kind==='trade'?'n':(t.w?'w':'l');
  var stub=kind==='grade'?'<div class="stub let t-cream"><span class="'+(t.w?'up':'dn')+'">'+(t.w?'W':'L')+' '+F.usd(t.v)+'</span></div>':'<div class="stub let t-m" style="--mc:'+F.COL[m]+'">'+NAME[m].toUpperCase()+'</div>';
  return '<div class="hc t-m" style="--mc:'+F.COL[m]+'">'+inner+'<div class="face"><img src="'+img(m,pose)+'" alt=""></div>'+stub+'</div>'}).join('')+'</div>'}
H+='<figure class="pn p1"><div class="cap abs t-ye">1. Before earnings, each AI goes long or short.</div><div class="heads-wrap">'+headsRow(ex,'trade')+'</div></figure>';
H+='<figure class="pn p2"><div class="scene"><img src="img/r1-close.jpg" alt="The closing bell rings on the exchange floor"></div><div class="cap abs t-ye">2. The close grades every trade.</div><div class="sfx '+sgn(ex.a)+'" style="left:10px;bottom:16px;font-size:34px;color:'+(ex.a<0?'#e0453a':'#3fae64')+'">'+E(ex.out)+'</div></figure>';
H+='<figure class="pn p3"><div class="cap abs t-ye">3. Right way: W. Wrong way: L. Flat $100K each.</div><div class="heads-wrap">'+headsRow(ex,'grade')+'</div></figure>';
var wt=ex.T[exW];
H+='<figure class="pn p4"><div class="poster"><img src="'+F.poster(ex)+'" alt="Round '+ex.n+' film poster"></div><div class="res let t-cream"><span>4. Closest trade wins the round:</span><span>'+chip(exW)+'</span><span>'+NAME[exW]+' said '+(wt.dir==='LONG'?'+':'−')+wt.mag+'%. It closed '+E(ex.out)+'.</span></div></figure>';
H+='</section>';

/* ===== every round so far: the last 5 nights, then the whole record ===== */
H+='<h2 class="sec-h"><span class="hd">Every round so far</span><span class="let">'+D.RS.length+' rounds graded. The last five nights, then the whole record.</span></h2>';
var caps=D.caps;
D.nights.slice(0,5).forEach(function(nt,ni){
  var rs=nt.rs.slice().sort(function(a,b){return (caps[b.ticker]||0)-(caps[a.ticker]||0)||b.n-a.n}),show=rs.slice(0,3),rest=rs.length-show.length;
  var S=nt.S,act=O.filter(function(m){return S[m].n}),best=act.slice().sort(function(a,b){return S[b].pnl-S[a].pnl})[0],worst=act.slice().sort(function(a,b){return S[a].pnl-S[b].pnl})[0];
  var d=new Date(nt.day);
  H+='<section class="strip night'+(show.length===1?' n1':show.length===2?' n2':'')+'" aria-label="'+F.wmd(nt.day)+'"><div class="pn tp t-night"><div><div class="wd">'+['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getUTCDay()]+'</div><h3 class="hd">'+F.MON[d.getUTCMonth()]+' '+d.getUTCDate()+'</h3></div><div class="num">'+nt.rs.length+'</div><div class="let">round'+(nt.rs.length>1?'s':'')+' graded at the close'+(rest?'<br><span style="opacity:.8">'+rest+' more in the record below</span>':'')+'</div></div>';
  show.forEach(function(r){H+=rtile(r,false,true)});
  var half=function(m,good){var v=S[m].pnl,line=good?(v>0?'What a night!':'Least bad night.'):(v<0?'Ouch.':'Still green.');
    return '<div class="half t-m" style="--mc:'+F.COL[m]+'"><div class="bwrap">'+bal(line+'<b class="'+sgn(v)+'">'+F.usd(v)+'</b>')+'</div><div class="face"><img src="'+img(m,v>0?'w':'l')+'" alt="'+NAME[m]+'"></div></div>'};
  H+='<figure class="pn gag"><div class="cap abs t-ye">The night\'s P&amp;L</div><div class="pair">'+half(best,true)+half(worst,false)+'</div><figcaption class="tally let t-cream">'+O.filter(function(m){return S[m].n}).map(function(m){return '<span>'+NAME[m].toUpperCase()+' <b class="'+sgn(S[m].pnl)+'">'+F.usd(S[m].pnl)+'</b></span>'}).join('')+'</figcaption></figure>';
  H+='</section>';
});
var all=D.RS.slice().reverse(),vis=matchMedia('(max-width:700px)').matches?9:16;
H+='<h3 class="sec-h" style="margin-top:22px"><span class="hd" style="font-size:26px">The whole record</span><span class="let">Newest first &middot; film poster, the move, who won</span></h3>';
H+='<section class="strip arch" id="arch" aria-label="Every graded round">'+all.map(function(r,i){return rtile(r,i>=vis,false)}).join('')+'</section>';
H+='<div class="arch-foot"><button class="btn" id="archBtn" aria-controls="arch" aria-expanded="false">Show all '+all.length+' rounds</button></div>';

/* ===== smart or lucky ===== */
H+='<section class="strip sol" aria-label="Smart or lucky"><div class="pn tp t-blue"><h2 class="hd lit">Smart or lucky?</h2><div class="let">'+D.RS.length+' rounds is too few to tell skill from luck. Here is the record so far, drawn after every graded trade.</div></div>'+
 '<figure class="pn chart t-grid" id="chHit"><div class="cap abs t-ye">Hit rate, after every trade. Every line starts at 50%.</div><div class="cv"></div></figure>'+
 '<figure class="pn chart t-grid" id="chPnl"><div class="cap abs t-ye">P&amp;L, flat $100K a trade</div><div class="cv"></div></figure></section>';

/* ===== the bet ===== */
var ts=D.season[top],bt=D.betAt,btd=bt?new Date(bt):null;
