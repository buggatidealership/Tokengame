<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&display=swap">
<style>body{margin:0;background:#1b1820;padding:0}.pg{width:390px;height:560px;position:relative;overflow:hidden}.pg>svg{position:absolute;inset:0;width:100%;height:100%}</style>
<script src="lib.js"></script></head><body><div class="pg" id="pg"></div>
<script>
/* Take A, detail pass: the page of panels with all eight differences closed. Every number comes from D (the page's globals, data.js). */
window.draw=async function(D){
 await document.fonts.load('40px "Luckiest Guy"');await document.fonts.load('20px Bangers');
 const X=DT,INK=X.INK,M=D.models,N=k=>D.names[k],W=D.win[0]||D.top[0];
 const sgn=v=>v<0?'−':'+',pc=v=>sgn(v)+Math.abs(v).toFixed(2)+'%';
 /* panels: polygons with one dominant (red), angled cuts, white gutters (the page ground) and a thin ink keyline either side */
 const cut1=x=>198-23*(x-5)/380,cut2=x=>404-14*(x-5)/380; // the two row cuts (the lower edge of the upper panels)
 const PN={
  p1:[[5,5],[240,5],[215,cut1(215)],[5,cut1(5)]],
  p2:[[248,5],[385,5],[385,cut1(385)],[223,cut1(223)]],
  p3:[[5,cut1(5)+8],[113,cut1(113)+8],[96,cut2(96)],[5,cut2(5)]],
  p4:[[121,cut1(121)+8],[385,cut1(385)+8],[385,cut2(385)],[104,cut2(104)]],
  p5:[[5,cut2(5)+8],[214,cut2(214)+8],[200,555],[5,555]],
  p6:[[222,cut2(222)+8],[385,cut2(385)+8],[385,555],[208,555]]};
 const P=p=>p.map(q=>q.map(X.f1).join(',')).join(' ');
 let s=`<rect width="390" height="560" fill="#fffdf4"/><defs>${Object.entries(PN).map(([k,p])=>`<clipPath id="k${k}"><polygon points="${P(p)}"/></clipPath>`).join('')}</defs>`;
 const panel=(k,inner)=>`<g clip-path="url(#k${k})">${inner}</g><polygon points="${P(PN[k])}" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linejoin="miter"/>`;
 const lab=(t,x,y,o={})=>`<g transform="rotate(${o.rot||0} ${x} ${y})"><rect x="${x-o.w/2}" y="${y-12}" width="${o.w}" height="17" fill="${o.bg||INK}" stroke="${INK}" stroke-width="1.5"/><text x="${x}" y="${y+1}" text-anchor="middle" font-family="Bangers" font-size="${o.fs||14}" letter-spacing=".6" fill="${o.c||'#fff6c8'}">${t}</text></g>`;

 /* 1 · VS: the two leaders face off. Blue, light from the burst, darker blue dots growing to the edges, ink speed lines, bolts and stars crossing out */
 let a=X.ground(5,5,240,200,120,98,['#9fd4ff','#3d97ff','#1c5ed2','rgba(190,230,255,.28)','#123f9c'],{seed:4,sp:7,r0:70,r1:200});
 a+=X.speed(120,98,96,{n:34,l0:14,l1:60,w0:1.2,w1:4.5,seed:21,op:.85});
 a+=X.burst(120,98,64,98,13,17,{c:['#fff','#fff'],ks:[.84],drop:6,ow:3.6,sy:.86,shade:'#bcd3f2',shoff:8});
 a+=X.face(M,D.top[0],50,102,28)+X.face(M,D.top[1],190,102,28);
 a+=X.word('VS',{x:121,y:122,size:60,fill:'blue',rot:-9,jr:6,jb:.06,seed:3,depth:6,dx:1,dy:.8,grow:.12,dotTo:'br'});
 a+=lab(N(D.top[0]),50,148,{w:58,rot:-4,fs:15})+lab(N(D.top[1]),190,146,{w:68,rot:3,fs:15});
 a+=X.star(32,28,11,{c:['#ff5a4a','#c3140c'],rot:8})+X.star(212,170,9,{c:['#ff5a4a','#c3140c'],rot:-12});
 s+=panel('p1',a);
 /* 2 · BOOM: the biggest move of the latest day. Yellow with orange dots, a red burst nested white, red lettering breaking out of it */
 let b=X.ground(215,0,175,200,312,78,['#fff7b0','#ffd21f','#ffa400','rgba(255,255,220,.35)','#ff8c00'],{seed:9,sp:6.5,r0:40,r1:150});
 b+=X.speed(312,78,82,{n:30,l0:10,l1:50,w0:1,w1:3.6,seed:5,col:'#c3140c',op:.9});
 const bigTxt=X.word(pc(D.big.a),{x:312,y:142,size:24,fill:D.big.a<0?'red':'green',rot:-6,jr:3,jb:.03,seed:4,depth:3,key:1.4,out:1.8,font:'Luckiest Guy'})+lab(`${D.big.co.toUpperCase()} (${D.big.ticker})`,306,166,{w:118,rot:-5,fs:14});
 s+=panel('p2',b);
 /* 3 · the latest round: green (its move was up), a yellow burst holding the round number, the company named with its ticker */
 const up=D.last.a>=0;
 let c=X.ground(0,180,120,230,58,290,up?['#c6ffa0','#52d24a','#1f9a32','rgba(230,255,200,.25)','#0f6d22']:['#ffb3a6','#ff4a33','#c3140c','rgba(255,220,210,.25)','#7a0a05'],{seed:6,sp:6.5,r0:30,r1:130});
 c+=X.speed(58,288,46,{n:24,l0:8,l1:40,w0:1,w1:3.2,seed:8,op:.8});
 c+=X.burst(58,284,36,58,11,31,{c:['#ffd21f','#fff5a0'],ks:[.7],drop:4,ow:3.2});
 c+=X.word('ROUND',{x:58,y:262,size:15,fill:'white',font:'Luckiest Guy',jr:4,jb:.04,seed:2,depth:2,key:1,out:1.6,drop:1.5,rot:-6});
 c+=X.word(String(D.last.n),{x:58,y:305,size:40,fill:'red',jr:5,jb:.05,seed:6,depth:4,rot:-6,grow:.1,dotTo:'br'});
 c+=lab(D.last.co.toUpperCase(),55,346,{w:94,rot:-5,fs:13})+lab(`(${D.last.ticker}) ${up?'▲':'▼'}${Math.abs(D.last.a).toFixed(2)}%`,53,366,{w:90,rot:-5,fs:13,c:up?'#9dff7a':'#ff8a80'});
 s+=panel('p3',c);
 /* 4 · the dominant panel: the round's winner. Red, a cloud the winner bursts out of, impact strokes, debris, the name in big lettering */
 let d=X.ground(100,180,290,230,262,282,['#ff9a7a','#ff3a31','#c8120c','rgba(255,200,180,.22)','#8a0a05'],{seed:2,sp:7,r0:60,r1:220,n:30});
 d+=X.speed(262,280,74,{n:46,l0:18,l1:90,w0:1.2,w1:5.5,seed:44,op:.9});
 d+=X.debris(262,280,70,118,26,7);
 d+=X.cloud(262,272,74,50,{seed:5,n:10,shade:'#c5d2ec'});
 d+=X.face(M,W,262,268,30,{ow:3.8});
 const wins=X.word(`${N(W)} WINS!`,{x:250,y:378,size:44,fill:'yellow',rot:-7,jr:7,jb:.08,seed:19,grow:.26,depth:6,dot:'#ff6a0a',dotTo:'br'});
 s+=panel('p4',d);
 /* 5 · last place falls: orange, CRASH!!! in yellow-on-red lettering, the face knocked sideways, debris */
 let e=X.ground(0,390,215,170,96,470,['#ffe7a0','#ffaa2e','#ff6a0a','rgba(255,240,200,.3)','#c84a00'],{seed:7,sp:6.5,r0:30,r1:150});
 e+=X.speed(150,470,36,{n:22,l0:10,l1:46,w0:1,w1:3.6,seed:9,op:.8,a0:-2.6,a1:1.2});
 e+=X.burst(96,456,40,80,12,23,{c:['#c3140c','#ff3a31'],ks:[.7],drop:5,ow:3.4,sx:1.3,sy:.66});
 const crash=X.word('CRASH!!!',{x:96,y:470,size:32,fill:'yellow',rot:-6,jr:8,jb:.1,seed:31,grow:.3,depth:5,dot:'#e0140c',dotTo:'b'});
 e+=X.debris(176,494,26,52,18,4,{a0:-3.2,a1:.4})+`<g transform="rotate(-24 176 494)">${X.face(M,D.lastm,176,494,22)}</g>`;
 e+=lab(`LAST: ${N(D.lastm)}`,148,540,{w:84,rot:-4,fs:15});
 s+=panel('p5',e);
 /* 6 · OOPS: its season P&L. Blue (a loss is not "up"), a cloud bleeding off the page edge, the figure in red */
 let f=X.ground(200,390,190,170,300,470,['#c9ecff','#5cb6ff','#2a76e0','rgba(220,245,255,.3)','#174fa8'],{seed:8,sp:6.5,r0:30,r1:150});
 f+=X.speed(306,456,70,{n:26,l0:10,l1:40,w0:1,w1:3.2,seed:3,op:.7});
 const oops=X.cloud(326,456,80,40,{seed:9,n:11,shade:'#c8d4ea',trail:[248,500]});
 const oopsW=X.word('OOPS!',{x:310,y:470,size:36,fill:'orange',rot:-4,jr:7,jb:.08,seed:7,grow:.15,depth:5,dot:'#c84a00'});
const oopsP=X.word(D.pnl[D.lastm],{x:302,y:528,size:24,fill:'red',rot:-4,jr:3,jb:.03,seed:2,depth:3,key:1.4,out:1.8})+lab('SEASON P&amp;L',300,548,{w:84,rot:-4,fs:13});
 s+=panel('p6',f);
 /* layering: pieces that break the borders and gutters and tie the page into one composition */
 s+=X.burst(314,80,50,80,14,8,{c:['#ff3a31','#fff','#fff4d0'],ks:[.78,.55],drop:5,ow:3.4,sx:.95,sy:.9,shade:'#ffd9a8',shoff:6})+X.word('BOOM!',{x:314,y:90,size:38,fill:'red',rot:-8,jr:7,jb:.08,seed:12,grow:.22,depth:5,dotTo:'br',dot:'#8a0a05'})+bigTxt;
 s+=oops+oopsW+oopsP+wins+crash;
 s+=X.star(236,196,17,{rot:-8})+X.star(110,196,10,{rot:14})+X.star(372,214,11,{rot:6});
 s+=X.bolt(205,22,1.05,18)+X.bolt(18,150,.85,-150)+X.bolt(118,392,.8,30,{c:['#fff36a','#ffb000']});
 /* the barcode, half on the page edge as on a newsstand comic */
 s+=`<g transform="rotate(-2 46 528)"><rect x="12" y="508" width="72" height="44" fill="#fff" stroke="${INK}" stroke-width="2"/><g fill="${INK}">${[...Array(26)].map((_,i)=>{const w=[1,2,1,3,1,1,2,1][i%8];return `<rect x="${17+i*2.4}" y="512" width="${w*.7}" height="27"/>`}).join('')}</g><text x="46" y="548" text-anchor="middle" font-family="Bangers" font-size="8.5" letter-spacing=".3">S1 · NO. ${String(D.last.n).padStart(3,'0')} · ${D.day}</text></g>`;
 document.getElementById('pg').innerHTML=`<svg viewBox="0 0 390 560">${s}</svg>`;document.documentElement.classList.add('a-ready')};
</script></body></html>
