<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&display=swap">
<style>body{margin:0;background:#1b1820;padding:20px;display:flex;gap:22px;font-family:Bangers}
.pg{width:390px;height:560px;position:relative;flex:none;box-shadow:8px 8px 0 #0d0b10;overflow:hidden}.pg>svg{position:absolute;inset:0;width:100%;height:100%}
.l{color:#f8f0d9;font:400 19px Bangers;letter-spacing:.05em;margin-top:12px}
@keyframes ring{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.shake{transform-origin:195px 300px;animation:ring .12s linear infinite}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}</style></head><body>
<script>
let gid=0;
function rays(cx,cy,n,c1,c2,R=700){let s='';for(let i=0;i<n;i++){const a0=i/n*6.283,a1=(i+.5)/n*6.283;s+=`<path d="M${cx} ${cy}L${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)}L${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)}Z" fill="${i%2?c1:c2}"/>`}return s}
function burst(cx,cy,r1,r2,n,seed,sy=1){let s=seed,p=[];const rnd=()=>(s=(s*9301+49297)%233280)/233280;for(let i=0;i<n*2;i++){const a=i/(n*2)*6.283-1.57,r=i%2?r2*(.85+.3*rnd()):r1*(.9+.25*rnd());p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)*sy).toFixed(1))}return p.join(' ')}
function T(txt,x,y,sz,c1,c2,dk,rot=0,d=6,sw=4){const id='g'+(gid++);let s=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><g transform="rotate(${rot} ${x} ${y})" font-family="Luckiest Guy" font-size="${sz}" text-anchor="middle">`;
 for(let k=d;k>0;k--)s+=`<text x="${x+k}" y="${y+k}" fill="${dk}" stroke="#0d0b10" stroke-width="${k==d?sw+2:0}" stroke-linejoin="round" paint-order="stroke">${txt}</text>`;
 return s+`<text x="${x}" y="${y}" fill="url(#${id})" stroke="#0d0b10" stroke-width="${sw}" stroke-linejoin="round" paint-order="stroke">${txt}</text><text x="${x-1.2}" y="${y-1.2}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1">${txt}</text></g>`}
const ht=(id,col)=>`<defs><pattern id="p${id}" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.9" fill="${col}"/></pattern><radialGradient id="r${id}"><stop offset=".35" stop-color="#000"/><stop offset="1" stop-color="#fff"/></radialGradient><mask id="m${id}"><rect width="400" height="600" fill="url(#r${id})"/></mask></defs><rect width="390" height="560" fill="url(#p${id})" mask="url(#m${id})"/>`;
// New York time helpers
function nyParts(d){const f=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'}).formatToParts(d);const o={};f.forEach(p=>o[p.type]=p.value);return o}
function nyAt(y,m,d,h){for(const off of [4,5]){const t=new Date(Date.UTC(y,m-1,d,h+off));const p=nyParts(t);if(+p.hour%24==h&&+p.day==d)return t}}
function nextClose(now){for(let k=0;k<8;k++){const t=new Date(now.getTime()+k*864e5),p=nyParts(t);if(p.weekday=='Sat'||p.weekday=='Sun')continue;const c=nyAt(+p.year,+p.month,+p.day,16);if(c>now)return {t:c,wd:p.weekday}}}
const BET=nyAt(2026,11,18,16); // NVIDIA reports 11/17; the bet is the close the weekday after
const pad=n=>String(n).padStart(2,'0');
function A(now){const p=nyParts(now),h=+p.hour%12,m=+p.minute,s=+p.second,nc=nextClose(now),left=nc.t-now,dd=Math.floor(left/864e5),hh=Math.floor(left%864e5/36e5),mm=Math.floor(left%36e5/6e4);
 const cx=195,cy=300,R=104,ha=(h+m/60)*30-90,ma=(m+s/60)*6-90,sa=s*6-90,hand=(a,l,w,c)=>`<line x1="${cx}" y1="${cy}" x2="${cx+l*Math.cos(a*Math.PI/180)}" y2="${cy+l*Math.sin(a*Math.PI/180)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
 let ticks='';for(let i=0;i<12;i++){const a=i*30*Math.PI/180;ticks+=`<text x="${cx+(R-24)*Math.sin(a)}" y="${cy-(R-24)*Math.cos(a)+8}" text-anchor="middle" font-family="Luckiest Guy" font-size="22">${i||12}</text>`}
 const ring=dd==0&&hh==0&&mm<60;
 return `<rect width="390" height="560" fill="#ff3a31"/>${rays(195,300,34,'#ff5a4a','#e0241c')}${ht('a','rgba(110,0,10,.5)')}
 ${T('THE BELL',195,80,52,'#fff27a','#ffc414','#9a5a00',-4,6)}
 <g class="shake">
  <line x1="120" y1="400" x2="96" y2="440" stroke="#0d0b10" stroke-width="12" stroke-linecap="round"/><line x1="270" y1="400" x2="294" y2="440" stroke="#0d0b10" stroke-width="12" stroke-linecap="round"/>
  <path d="M95 210a50 50 0 0 1 70-50z" fill="#ffd21f" stroke="#0d0b10" stroke-width="5" transform="translate(5 5)" opacity="0"/>
  <g transform="translate(6 6)" fill="#0d0b10"><circle cx="118" cy="196" r="46"/><circle cx="272" cy="196" r="46"/><circle cx="${cx}" cy="${cy}" r="${R+18}"/></g>
  <path d="M74 214a46 46 0 0 1 88-34z" fill="#ffd21f" stroke="#0d0b10" stroke-width="5"/><path d="M228 180a46 46 0 0 1 88 34z" fill="#ffd21f" stroke="#0d0b10" stroke-width="5"/>
  <rect x="${cx-6}" y="172" width="12" height="22" fill="#0d0b10"/><circle cx="${cx}" cy="168" r="11" fill="#ffd21f" stroke="#0d0b10" stroke-width="4"/>
  <defs><radialGradient id="cs" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#7dc3ff"/><stop offset="1" stop-color="#1d63d6"/></radialGradient><radialGradient id="cf" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".8" stop-color="#fbf3dc"/><stop offset="1" stop-color="#e3d6b0"/></radialGradient></defs>
  <circle cx="${cx}" cy="${cy}" r="${R+18}" fill="url(#cs)" stroke="#0d0b10" stroke-width="5"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#cf)" stroke="#0d0b10" stroke-width="4"/>
  <ellipse cx="${cx-50}" cy="${cy-62}" rx="26" ry="10" fill="#fff" opacity=".85" transform="rotate(-35 ${cx-50} ${cy-62})"/>
  ${ticks}${hand(ha,52,9,'#0d0b10')}${hand(ma,78,6,'#0d0b10')}${hand(sa,86,2.5,'#e0140c')}<circle cx="${cx}" cy="${cy}" r="8" fill="#e0140c" stroke="#0d0b10" stroke-width="3"/>
 </g>
 <g stroke="#0d0b10" stroke-width="4" stroke-linecap="round"><line x1="54" y1="150" x2="30" y2="128"/><line x1="44" y1="190" x2="16" y2="186"/><line x1="336" y1="150" x2="360" y2="128"/><line x1="346" y1="190" x2="374" y2="186"/></g>
 <g transform="rotate(-6 195 486)"><rect x="40" y="456" width="310" height="62" fill="#0d0b10" transform="translate(6 6)"/><rect x="40" y="456" width="310" height="62" fill="#ffd21f" stroke="#0d0b10" stroke-width="4"/>
 <text x="195" y="480" text-anchor="middle" font-family="Bangers" font-size="17" letter-spacing="1">${nc.wd.toUpperCase()} · 4PM NEW YORK · IN</text></g>
 ${T((dd?dd+'D ':'')+hh+'H '+pad(mm)+'M',195,512,34,'#ff6b5e','#e0140c','#6a0a05',-6,5,3.5)}
 <text x="380" y="550" text-anchor="end" font-family="Bangers" font-size="13" fill="#fff">NY TIME ${pad(+p.hour%24)}:${pad(m)}</text>`}
function B(now){const left=Math.max(0,BET-now),d=Math.floor(left/864e5),h=Math.floor(left%864e5/36e5),m=Math.floor(left%36e5/6e4),s=Math.floor(left%6e4/1e3);
 const tile=(x,v,lab)=>`<g><rect x="${x+6}" y="250" width="78" height="96" rx="8" fill="#0d0b10"/><rect x="${x}" y="244" width="78" height="96" rx="8" fill="#15171f" stroke="#0d0b10" stroke-width="4"/><rect x="${x+4}" y="248" width="70" height="40" rx="5" fill="#262a36"/><line x1="${x}" y1="292" x2="${x+78}" y2="292" stroke="#0d0b10" stroke-width="3"/>
  ${T(pad(v),x+39,312,52,'#d6ff7a','#76b900','#2f4a00',0,4,3)}<text x="${x+39}" y="366" text-anchor="middle" font-family="Bangers" font-size="17" fill="#fff" stroke="#0d0b10" stroke-width="3" paint-order="stroke" letter-spacing="1">${lab}</text></g>`;
 return `<rect width="390" height="560" fill="#2b8cff"/>${rays(195,300,34,'#4aa3ff','#1d72e0')}${ht('b','rgba(0,20,80,.45)')}
 ${T('BET #1',195,92,62,'#fff27a','#ffc414','#9a5a00',-4,7)}
 
 <polygon points="${burst(195,296,190,140,16,4,.8)}" fill="#0d0b10" transform="translate(7 7)"/><polygon points="${burst(195,296,190,140,16,4,.8)}" fill="#ffd21f" stroke="#0d0b10" stroke-width="4"/><polygon points="${burst(195,296,166,122,16,4,.8)}" fill="#fff27a"/>
 <g transform="rotate(-4 195 150)"><rect x="92" y="122" width="206" height="46" fill="#0d0b10" transform="translate(5 5)"/><rect x="92" y="122" width="206" height="46" fill="#76b900" stroke="#0d0b10" stroke-width="4"/>${T('NVIDIA',195,158,34,'#ffffff','#e8ffd0','#2f4a00',0,3,3)}</g>${tile(16,d,'DAYS')}${tile(108,h,'HRS')}${tile(200,m,'MIN')}${tile(292,s,'SEC')}
 <g transform="rotate(3 195 470)"><rect x="34" y="444" width="322" height="58" fill="#0d0b10" transform="translate(6 6)"/><rect x="34" y="444" width="322" height="58" fill="#fff" stroke="#0d0b10" stroke-width="4"/>
 <text x="195" y="468" text-anchor="middle" font-family="Bangers" font-size="17" letter-spacing="1">THE GOLDEN TICKET HOLDER MAKES THE CALL.</text><text x="195" y="490" text-anchor="middle" font-family="Bangers" font-size="15" fill="#e0140c" letter-spacing="1">THE POOL CAN BE WIPED OUT.</text></g>`}
function draw(){const now=window.__now?new Date(window.__now):new Date();document.body.innerHTML=[['A · the bell (next close)',A(now)],['B · bet #1 countdown',B(now)]].map(([l,s])=>`<div><div class="pg"><svg viewBox="0 0 390 560">${s}</svg></div><div class="l">${l}</div></div>`).join('')}
draw();setInterval(draw,1000);
</script></body></html>
