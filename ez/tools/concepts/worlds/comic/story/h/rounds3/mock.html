<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rounds3 places</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Barlow+Condensed:wght@600;800&family=Cinzel:wght@700;900&family=Luckiest+Guy&family=Pirata+One&display=block">
<!-- rounds3 (round H7): "Every round so far" as a place where comic covers live. ?p=shop|tunnel|hall|kiosk|vault  &n=8
     Every word and number on a cover is page text from ROUNDS (ez-data.js); the art is tiles3's take A (guest star). Mockup only. -->
<style>
:root{--ink:#0d0b10;--cream:#f8f0d9;--gold:#fdbc2a;--green:#03c870;--red:#ff3a31;--bk:#04070e}
*{box-sizing:border-box}html,body{margin:0;background:var(--bk);color:var(--cream);font:400 16px/1.4 "Barlow Condensed",sans-serif}
.ch{position:relative;overflow:hidden}
/* establishing shot: the painting is the panel, the chapter's name set into its calm top */
.est{position:relative;aspect-ratio:3/4;max-height:92vh;width:100%;overflow:hidden}
.est picture,.est img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
@media(min-width:900px){.est{aspect-ratio:16/9;max-height:none}}
.est .ttl{position:absolute;left:0;right:0;top:4.5%;text-align:center;padding:0 16px;z-index:2}
.est .ttl h2{margin:0;line-height:.9;font-weight:400}
.est .ttl p{margin:.45em 0 0;font:800 13px/1 "Barlow Condensed";letter-spacing:.16em;text-transform:uppercase;opacity:.86}
.est::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(transparent,var(--wallc,#000));z-index:1}
/* the wall the covers live on: the place's own painted surface, tiled */
.wall{position:relative;padding:8px 16px 40px;background:var(--wallimg) center top/100% auto repeat-y,var(--wallc,#000)}
@media(min-width:900px){.wall{background-size:100% auto;padding:20px 40px 60px}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap,18px) 14px;max-width:1120px;margin:0 auto}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:var(--gapd,34px) 34px}}
.cv{all:unset;cursor:pointer;display:block;position:relative;-webkit-tap-highlight-color:transparent}
.cv:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.more{all:unset;cursor:pointer;display:block;margin:26px auto 0;text-align:center;font:400 22px/1 var(--mf,Bangers);letter-spacing:.04em;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.more small{display:block;font:800 11px/1 "Barlow Condensed";letter-spacing:.18em;text-transform:uppercase;color:var(--cream);opacity:.8;margin-top:6px;text-shadow:none}

/* ---------- the cover (trade dress as lettering; the art is the panel) ---------- */
.cover{position:relative;aspect-ratio:3/4;overflow:hidden;background:#222;container-type:inline-size}
.cover .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block}
.cover .art.top{object-position:center 30%}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,7,14,.72) 0,rgba(4,7,14,0) 30%,rgba(4,7,14,0) 66%,rgba(4,7,14,.66) 100%);z-index:1}
.mast{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:flex-start;gap:3cqw;padding:3.5cqw 4cqw 0}
.cbox{flex:none;width:19cqw;position:relative;text-align:center;color:var(--ink);padding-top:1.5cqw}
.cbox svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cbox i{position:relative;display:block;font:900 4.2cqw/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;font-style:normal}
.cbox b{position:relative;display:block;font:400 10.5cqw/.95 "Luckiest Guy";margin-top:.4cqw}
.cbox em{position:relative;display:block;font:900 3.6cqw/1 "Barlow Condensed";font-style:normal;letter-spacing:.04em;padding-bottom:1.8cqw}
.mt{flex:1;min-width:0;padding-top:.5cqw}
.mt .co{display:block;font:400 var(--fs,17cqw)/.86 "Luckiest Guy";color:var(--bc,#fdbc2a);-webkit-text-stroke:1.1cqw var(--ink);paint-order:stroke fill;text-shadow:.9cqw .9cqw 0 var(--ink);white-space:nowrap;letter-spacing:.01em}
.mt .tk{display:block;font:800 4.4cqw/1 "Barlow Condensed";letter-spacing:.14em;color:var(--cream);margin-top:1.2cqw;text-shadow:0 0 3px var(--ink),0 1px 0 var(--ink)}
.pub{display:block;font:800 3.4cqw/1 "Barlow Condensed";letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:1cqw;text-shadow:0 1px 0 var(--ink)}
.burst{position:absolute;right:-2cqw;bottom:13cqw;width:44cqw;aspect-ratio:1.25;z-index:3;display:grid;place-items:center;transform:rotate(-8deg)}
.burst svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst span{position:relative;font:400 9.4cqw/1 "Luckiest Guy";color:#fff;-webkit-text-stroke:.8cqw var(--ink);paint-order:stroke fill;text-shadow:.6cqw .6cqw 0 var(--ink)}
.cl{position:absolute;left:4cqw;right:4cqw;bottom:3.5cqw;z-index:2;font:400 11.5cqw/.9 Bangers;letter-spacing:.02em;color:var(--gold);-webkit-text-stroke:.7cqw var(--ink);paint-order:stroke fill;text-shadow:.8cqw .8cqw 0 var(--ink);transform:rotate(-3deg);transform-origin:left bottom}
.cl small{display:block;font:800 3.6cqw/1 "Barlow Condensed";letter-spacing:.14em;color:var(--cream);-webkit-text-stroke:0;text-shadow:0 1px 2px var(--ink);margin-bottom:.8cqw}
.cl.no{color:var(--cream)}

/* ---------- per place: how a cover is mounted ---------- */
/* shop: bagged and boarded on a hook */
.p-shop .bag{position:relative;padding:9% 4% 4%}
.p-shop .bag .sheen{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.9;pointer-events:none;z-index:4}
.p-shop .bag .hole{position:absolute;left:50%;top:2.4%;width:7%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle,#000 0 45%,transparent 60%);z-index:5;opacity:.8}
.p-shop .cv{filter:drop-shadow(0 10px 10px rgba(0,0,0,.6))}
/* tunnel: wheat-pasted to the wall */
.p-tunnel .post{position:relative;filter:drop-shadow(1px 3px 2px rgba(0,0,0,.55))}
.p-tunnel .post .pp{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;opacity:.85;z-index:4;pointer-events:none}
.p-tunnel .post .hl{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.18;z-index:4;pointer-events:none;filter:invert(1) grayscale(1) contrast(3)}
/* hall: in a gilded frame, the plate engraved */
.p-hall .frm{position:relative;aspect-ratio:542/750;background:url(img/frame-crop.jpg) center/100% 100%}
.p-hall .frm .cover{position:absolute;left:6.1%;top:3.9%;width:87.8%;height:91.3%;aspect-ratio:auto;box-shadow:inset 0 0 12px rgba(0,0,0,.7)}
.p-hall .frm .plq{position:absolute;left:38.5%;width:23%;top:95.2%;height:4.3%;display:grid;place-items:center;font:900 clamp(6px,1.9cqw,13px)/1 Cinzel;letter-spacing:.05em;color:#3b2706;text-shadow:0 1px 0 rgba(255,240,180,.55),0 -1px 0 rgba(0,0,0,.35);white-space:nowrap;container-type:normal}
.p-hall .frm{container-type:inline-size}
.p-hall .frm .plq{font-size:3.4cqw}@media(max-width:600px){.p-hall .frm .plq{font-size:3.6cqw;letter-spacing:0}}
.p-hall .light{position:absolute;left:10%;right:10%;top:-12%;height:40%;background:radial-gradient(ellipse at 50% 0,rgba(255,214,140,.32),transparent 70%);pointer-events:none;mix-blend-mode:screen}
.p-hall .cv{filter:drop-shadow(0 12px 12px rgba(0,0,0,.65))}
/* kiosk: pegged to the wire */
.p-kiosk .hang{position:relative;padding-top:8%;transform-origin:50% 0;transform:rotate(var(--sw,0deg))}
.p-kiosk .hang .peg{position:absolute;top:0;width:12%;aspect-ratio:.42;background:url(img/peg.png) center/contain no-repeat;z-index:5}
.p-kiosk .hang .peg.l{left:14%}.p-kiosk .hang .peg.r{right:14%}
.p-kiosk .wire{position:absolute;left:-30px;right:-30px;top:3.2%;height:12px;margin-top:-5px;background:url(img/wire.jpg) 0 0/auto 100% repeat-x}
.p-kiosk .cv{filter:drop-shadow(0 8px 8px rgba(0,0,0,.6))}
.p-kiosk .cv .cover{box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
/* vault: graded, in an acrylic slab */
.p-vault .slab{position:relative;border:13px solid transparent;border-image:url(../../../../../../../media/slab-acrylic-t1b.jpg) 120 110 fill / 13px stretch;padding:15% 3% 3%}
.p-vault .slab .lab{position:absolute;left:5%;right:5%;top:2.4%;height:10.5%;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 4%;background:linear-gradient(#f7f2e6,#e5dcc6);color:var(--ink);font:900 clamp(7px,2.6vw,12px)/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.p-vault .slab .lab b{font:400 1.7em/1 "Luckiest Guy";color:var(--red)}
.p-vault .cv{filter:drop-shadow(0 10px 14px rgba(0,0,0,.7))}

/* ---------- the tap: the cover flies out at you ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(4,7,14,.55);backdrop-filter:blur(7px) brightness(.6);-webkit-backdrop-filter:blur(7px) brightness(.6);opacity:0;transition:opacity .35s}
.scrim.on{opacity:1}
.fly{position:fixed;z-index:60;left:0;top:0;transform-origin:50% 50%;will-change:transform;cursor:pointer}
.fly .cover{box-shadow:0 30px 60px rgba(0,0,0,.7),0 0 0 2px rgba(0,0,0,.6)}
.fly .glint{position:absolute;inset:0;z-index:9;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,250,230,.55) 48%,transparent 60%);background-size:260% 100%;background-position:120% 0;mix-blend-mode:screen}
.gone{visibility:hidden}
.hint{position:fixed;left:0;right:0;bottom:18px;z-index:61;text-align:center;font:800 12px/1 "Barlow Condensed";letter-spacing:.18em;text-transform:uppercase;opacity:0;transition:opacity .4s .5s}
.scrim.on~.hint{opacity:.75}
@media (prefers-reduced-motion:reduce){.scrim{transition:none}}

/* hall: the newest rounds hang in the painting's own frames (homography onto each frame's opening); tap them there too */
.stg{position:absolute;left:0;top:0;transform-origin:0 0;z-index:1}
.stg .cv{position:absolute;left:0;top:0;width:300px;height:400px;transform-origin:0 0;filter:brightness(.82) contrast(1.05)}
.stg .cv .cover{width:300px;height:400px}
.stg .cv::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,rgba(255,214,140,.28),transparent 60%);mix-blend-mode:screen;pointer-events:none}
</style></head>
<body>
<section class="ch" id="ch"></section>
<script src="/ez-data.js"></script>
<script>
const Q=new URLSearchParams(location.search),PL=Q.get('p')||'hall',N=+(Q.get('n')||8);
const SET=[80,79,78,72,69,57,51,25].slice(0,N);
const W=(d=>d)(window.ROUNDS||[]);
const PLACES={
 shop:{wallc:'#1a0f08',title:'Back issues',tf:'400 clamp(46px,13vw,104px) Bangers',tc:'#fdbc2a',ts:'4px 4px 0 #0d0b10',sub:n=>`Every round so far · ${n} on the wall`,more:['Dig through the long box','all {N} rounds'],mf:'Bangers'},
 tunnel:{wallc:'#16120c',title:'The fight card',tf:'400 clamp(44px,12.5vw,100px) Anton',tc:'#f8f0d9',ts:'0 3px 0 #000,0 0 22px rgba(255,58,49,.45)',sub:n=>`Every round so far · ${n} fights on the wall`,more:['See the whole card','all {N} fights'],mf:'Anton'},
 hall:{wallc:'#08160d',title:'Hall of Fame',tf:'900 clamp(38px,10.5vw,88px) Cinzel',tc:'#fdbc2a',ts:'0 2px 0 #3b2706,0 0 18px rgba(253,188,42,.35)',sub:n=>`Every round so far · ${n} hung`,more:['Walk the whole hall','all {N} rounds'],mf:'Cinzel'},
 kiosk:{wallc:'#0b1a12',title:'Late edition',tf:"400 clamp(48px,14vw,110px) 'Pirata One'",tc:'#f8f0d9',ts:'0 3px 0 #000',sub:n=>`Every round so far · ${n} on the stand`,more:['Every back edition','all {N} rounds'],mf:"'Pirata One'"},
 vault:{wallc:'#07080b',title:'The vault',tf:'400 clamp(46px,13vw,104px) Anton',tc:'#fdbc2a',ts:'0 3px 0 #000,0 0 20px rgba(253,188,42,.4)',sub:n=>`Every round so far · ${n} graded`,more:['Open every drawer','all {N} graded'],mf:'Anton'},
};
const P=PLACES[PL];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rng=s=>()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0,(s^s>>>13)>>>0)/4294967296);
/* a hand-jittered star burst and corner box: every round its own shape */
function star(seed,n){const r=rng(seed*97+11);let d='';for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,k=i%2?(.62+r()*.1):(.96+r()*.08);d+=(i?'L':'M')+(50+Math.cos(a)*50*k).toFixed(1)+' '+(50+Math.sin(a)*40*k).toFixed(1)}return d+'Z'}
function box(seed){const r=rng(seed*31+7),j=()=>(r()-.5)*4;return `M${2+j()} ${2+j()}L${98+j()} ${1+j()}L${99+j()} ${98+j()}L${1+j()} ${99+j()}Z`}
const NM={GPT:'GPT',CLAUDE:'Claude',GROK:'Grok',KIMI:'Kimi'};
const winners=r=>r.win?r.win.split(' & ').filter(x=>MODELS[x]):[];
function line(r){const w=winners(r);if(!w.length)return['Nobody called it','NOBODY WINS!',true];if(w.length>1)return['A dead heat',w.map(x=>NM[x].toUpperCase()).join(' & ')+' TIE!'];return['The closest call',NM[w[0]].toUpperCase()+' WINS!']}
const pct=a=>(a>0?'+':'−')+Math.abs(a).toFixed(2)+'%';
const date=s=>{const[m,d]=s.split('/');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]+' '+(+d)};
function cover(r){const L=CO_LOGOS[r.ticker]||{};const up=r.a>0,[k,t,no]=line(r);
 return `<div class="cover" data-n="${r.n}">`+
  `<img class="art" src="${[79,80].includes(r.n)?"img":"../tiles3/img"}/a-r${r.n}-s.jpg" alt="">`+
  `<div class="mast"><div class="cbox"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${box(r.n)}" fill="#f8f0d9" stroke="#0d0b10" stroke-width="3" vector-effect="non-scaling-stroke"/></svg><i>Round</i><b>${r.n}</b><em>${esc(date(r.resolves||r.called))}</em></div>`+
  `<div class="mt"><span class="pub">EZ · Season 1</span><span class="co" style="--bc:${pop(L.c)}">${esc(r.co)}</span><span class="tk">(${esc(r.ticker)})</span></div></div>`+
  `<div class="burst"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${star(r.n,13)}" fill="${up?'#03c870':'#ff3a31'}" stroke="#0d0b10" stroke-width="3.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><span>${pct(r.a)}</span></div>`+
  `<div class="cl${no?' no':''}"><small>${k}</small>${t}</div></div>`}
/* masthead colour: the company's own colour, lifted where it is too dark to read on the art */
function pop(c){if(!c)return'#fdbc2a';const n=parseInt(c.slice(1),16),R=n>>16,G=n>>8&255,B=n&255,l=.2126*R+.7152*G+.0722*B;return l<70?'#fdbc2a':c}
function mount(r,i){const c=cover(r),lab=`Round ${r.n}: ${r.co} (${r.ticker}), ${pct(r.a)}, ${line(r)[1].toLowerCase()}`;
 const sw=((r.n*37)%7-3)*.5;
 switch(PL){
  case'shop':return `<button class="cv" aria-label="${esc(lab)}"><div class="bag">${c}<img class="sheen" src="img/sp-bag.jpg" alt=""><i class="hole"></i></div></button>`;
  case'tunnel':return `<button class="cv" aria-label="${esc(lab)}" style="transform:rotate(${sw}deg)"><div class="post">${c}<img class="pp" src="img/sp-paper.jpg" alt=""></div></button>`;
  case'hall':return `<button class="cv" aria-label="${esc(lab)}"><div class="frm">${c}<span class="plq">No. ${r.n}</span></div><i class="light"></i></button>`;
  case'kiosk':return `<button class="cv" aria-label="${esc(lab)}"><div class="hang" style="--sw:${sw*.8}deg"><i class="peg l"></i><i class="peg r"></i>${c}</div></button>`;
  case'vault':{const w=winners(r);return `<button class="cv" aria-label="${esc(lab)}"><div class="slab"><div class="lab"><span>EZ Graded</span><span>${esc(date(r.resolves||r.called))}</span></div>${c}</div></button>`}
 }}
function render(all){const rs=all?[...ROUNDS].sort((a,b)=>b.n-a.n).filter(r=>SET.includes(r.n)):SET.map(n=>ROUNDS.find(r=>r.n===n)).filter(Boolean);
 const ch=document.getElementById('ch');ch.className='ch p-'+PL;ch.style.setProperty('--wallc',P.wallc);ch.style.setProperty('--mf',P.mf);
 ch.innerHTML=`<div class="est"><picture><source media="(min-width:900px)" srcset="img/${PL}-est-16x9.jpg"><img src="img/${PL}-est-3x4.jpg" alt=""></picture>`+
  `<div class="ttl"><h2 style="font:${P.tf};color:${P.tc};text-shadow:${P.ts}">${P.title}</h2><p>${P.sub(ROUNDS.length)}</p></div></div>`+
  `<div class="wall" style="--wallimg:url(img/${PL}-tile.jpg)">${PL==='kiosk'?'':''}<div class="grid">${rs.map(mount).join('')}</div>`+
  `<button class="more">${P.more[0]}<small>${P.more[1].replace('{N}',ROUNDS.length)}</small></button></div>`;
 if(PL==='kiosk')ch.querySelectorAll('.cv').forEach(b=>{const w=document.createElement('i');w.className='wire';b.prepend(w)});
 fit();ch.querySelectorAll('.cv').forEach(b=>b.onclick=()=>fly(b));hang();}
/* fit each masthead's company name to its width (one line) */
function fit(){document.querySelectorAll('.mt .co').forEach(e=>{let f=17;e.style.setProperty('--fs',f+'cqw');while(e.scrollWidth>e.clientWidth+1&&f>6){f-=.5;e.style.setProperty('--fs',f+'cqw')}})}
/* ---------- the tap ---------- */
let open=null;
function fly(btn){if(open)return close();const src=PL==='vault'?btn.querySelector('.slab'):PL==='tunnel'?btn.querySelector('.post'):btn.querySelector('.cover');
 const R=src.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,ar=R.height/R.width;
 let w=Math.min(vw*.86,vh*.8/ar,560),h=w*ar,x=(vw-w)/2,y=(vh-h)/2-vh*.02;
 const sc=document.createElement('div');sc.className='scrim';document.body.append(sc);
 const hint=document.createElement('div');hint.className='hint';hint.textContent='Tap to put it back';document.body.append(hint);
 const f=document.createElement('div');f.className='fly p-'+PL;f.style.cssText=`width:${w}px;height:${h}px;transform:translate(${x}px,${y}px)`;
 const cl=src.cloneNode(true);cl.style.width='100%';cl.style.height='100%';if(PL==='hall'){cl.style.position='static'}
 f.append(cl);const g=document.createElement('i');g.className='glint';f.append(g);document.body.append(f);
 src.classList.add('gone');requestAnimationFrame(()=>sc.classList.add('on'));
 const s0=R.width/w,from=`translate(${R.left}px,${R.top}px) translate(${(R.width-w)/2}px,${(R.height-h)/2}px) scale(${s0})`;
 const to=`translate(${x}px,${y}px)`;
 const pre={shop:'translateY(-42%)',tunnel:'perspective(600px) rotateX(-38deg) translateY(-6%)',hall:'perspective(600px) rotateY(-32deg) translateZ(30px)',kiosk:'translateY(10%) rotate(-7deg)',vault:'translateY(-14%) scale(1.05)'}[PL];
 const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
 const K=[{transform:from,offset:0},{transform:from+' '+pre,offset:.28,easing:'cubic-bezier(.3,0,.2,1)'},
  {transform:`${to} perspective(900px) rotateX(10deg) rotateY(-14deg) scale(1.07)`,offset:.78,easing:'cubic-bezier(.2,.8,.3,1)'},{transform:to,offset:1}];
 f.animate(RM?[{opacity:0,transform:to},{opacity:1,transform:to}]:K,{duration:RM?150:820,fill:'both'});
 if(!RM)g.animate([{backgroundPosition:'120% 0'},{backgroundPosition:'-40% 0'}],{duration:700,delay:700,fill:'both',easing:'ease-out'});
 const shut=()=>close();f.onclick=shut;sc.onclick=shut;addEventListener('keydown',esck);
 open={f,sc,hint,src,from,to,pre,RM};}
function esck(e){if(e.key==='Escape')close()}
function close(){if(!open)return;const{f,sc,hint,src,from,to,pre,RM}=open;open=null;removeEventListener('keydown',esck);
 sc.classList.remove('on');hint.remove();
 const a=f.animate(RM?[{opacity:1},{opacity:0}]:[{transform:to},{transform:from+' '+pre,offset:.6},{transform:from}],{duration:RM?120:520,easing:'cubic-bezier(.4,0,.2,1)',fill:'both'});
 a.onfinish=()=>{src.classList.remove('gone');f.remove();sc.remove()}}

const QUADS={'3x4':{W:768,H:1024,q:[[[34,405],[145,429],[145,625],[34,630]],[[224,454],[289,466],[289,621],[224,628]],[[342,484],[385,491],[385,620],[342,624]]]},
 '16x9':{W:1280,H:720,q:[[[1078,282],[1222,253],[1230,465],[1087,472]],[[832,328],[918,313],[922,480],[838,488]],[[672,365],[726,357],[728,490],[674,495]]]}};
function homo(w,h,q){const[[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=q;const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3,den=dx1*dy2-dx2*dy1;
  const g=(dx3*dy2-dx2*dy3)/den,hh=(dx1*dy3-dx3*dy1)/den,a=x1-x0+g*x1,b=x3-x0+hh*x3,d=y1-y0+g*y1,e=y3-y0+hh*y3;
  return `matrix3d(${a/w},${d/w},0,${g/w},${b/h},${e/h},0,${hh/h},0,0,1,0,${x0},${y0},0,1)`}
function hang(){if(PL!=='hall')return;const est=document.querySelector('.est');const old=est.querySelector('.stg');if(old)old.remove();
 const k=innerWidth>=900?'16x9':'3x4',Qd=QUADS[k],s=est.clientWidth/Qd.W,dy=(est.clientHeight-Qd.H*s)/2;
 const rs=[...ROUNDS].sort((a,b)=>b.n-a.n).slice(0,3);
 const st=document.createElement('div');st.className='stg';st.style.cssText=`width:${Qd.W}px;height:${Qd.H}px;transform:translate(0,${dy}px) scale(${s})`;
 st.innerHTML=rs.map((r,i)=>`<button class="cv" aria-label="Round ${r.n}: ${esc(r.co)}, newest in the hall" style="transform:${homo(300,400,Qd.q[i])}">${cover(r)}</button>`).join('');
 est.append(st);st.querySelectorAll('.cv').forEach(b=>b.onclick=()=>fly(b));fit()}
window.__fly=n=>fly(document.querySelectorAll('.wall .cv')[n||0]);window.__close=close;
render();document.fonts.load('40px "Luckiest Guy"').then(()=>{fit();setTimeout(fit,300)});addEventListener('load',()=>setTimeout(fit,100));addEventListener('resize',hang);
</script>
