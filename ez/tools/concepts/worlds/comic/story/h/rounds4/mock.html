<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rounds4 places</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@600;800&family=Luckiest+Guy&display=block">
<!-- rounds4 (round H9): "Every round so far" as a drawn place where the round covers live.
     ?p=shop|tunnel|kiosk|press|locker|cinema  &s=noir|silver|shadow
     Paintings: Hedra gpt-image-2 in drawn styles (img/<p>-<s>-*). Covers: the round's T3 scene redrawn in the same style (img/cv-r<n>-<s>.jpg).
     Every word and number on a cover is page text from ROUNDS / CO_LOGOS (ez-data.js). Mounts are hand-jittered SVG ink. Mockup only. -->
<style>
:root{--ink:#0d0b10;--cream:#f8f0d9;--gold:#fdbc2a;--hg:#ffd21f;--green:#03c870;--red:#ff3a31;--bk:#04070e}
*{box-sizing:border-box}html,body{margin:0;background:var(--bk);color:var(--cream);font:400 16px/1.4 "Barlow Condensed",sans-serif}
.ch{position:relative;overflow:hidden}
.est{position:relative;aspect-ratio:3/4;max-height:92vh;width:100%;overflow:hidden}
.est img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
@media(min-width:900px){.est{aspect-ratio:16/9;max-height:none}}
.est .ttl{position:absolute;left:0;right:0;top:4%;padding:0 16px;z-index:2;max-width:1200px;margin:0 auto}
/* the Overview's one heading face (h_bet.css h2.hb-h) */
.hh{margin:0;font:400 clamp(46px,14vw,104px)/.86 Bangers,Anton,sans-serif;letter-spacing:.015em;text-transform:uppercase;transform:rotate(-2.2deg);transform-origin:0 100%}
.hh span{display:inline-block;color:var(--hg);-webkit-text-stroke:.075em var(--ink);paint-order:stroke fill;text-shadow:.02em .02em 0 #e7930b,.04em .04em 0 #c42a20,.06em .06em 0 #c42a20,.08em .08em 0 #c42a20,.1em .1em 0 var(--ink),.12em .12em 0 var(--ink),.135em .14em 0 var(--ink)}
.est .ttl p{margin:.7em 0 0 6px;font:800 14px/1.2 "Barlow Condensed";letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 0 #000,0 0 8px #000}
.est::after{content:"";position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(transparent,var(--wallc,#000));z-index:1}
.wall{position:relative;padding:10px 16px 44px;background:var(--wallimg) center top/100% auto repeat-y,var(--wallc,#000)}
.wall::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--dim,.25));pointer-events:none}
@media(min-width:900px){.wall{background-size:50% auto;padding:24px 40px 64px}}
.grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:var(--gap,20px) 14px;max-width:1120px;margin:0 auto}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:var(--gapd,40px) 34px}}
.cv{all:unset;cursor:pointer;display:block;position:relative;-webkit-tap-highlight-color:transparent}
.cv:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.more{all:unset;cursor:pointer;position:relative;display:block;margin:30px auto 0;text-align:center;font:400 26px/1 Bangers;letter-spacing:.04em;color:var(--hg);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink);transform:rotate(-1.5deg)}
.more small{display:block;font:800 12px/1 "Barlow Condensed";letter-spacing:.18em;text-transform:uppercase;color:var(--cream);margin-top:6px;-webkit-text-stroke:0;text-shadow:0 1px 2px #000}

/* ---------- the cover: art = the round's own scene redrawn; trade dress lettered on it ---------- */
.cover{position:relative;aspect-ratio:3/4;overflow:hidden;background:#111;container-type:inline-size}
.cover .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,7,14,.66) 0,rgba(4,7,14,0) 28%,rgba(4,7,14,0) 64%,rgba(4,7,14,.62) 100%);z-index:1}
.cover::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1.4cqw var(--ink);z-index:4;pointer-events:none}
.mast{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:flex-start;gap:3cqw;padding:3.5cqw 4cqw 0}
.cbox{flex:none;width:19cqw;position:relative;text-align:center;color:var(--hg);padding-top:1.6cqw}
.cbox svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cbox i{position:relative;display:block;font:900 4.2cqw/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;font-style:normal;color:var(--cream)}
.cbox b{position:relative;display:block;font:400 10.5cqw/.95 "Luckiest Guy";margin-top:.4cqw}
.cbox em{position:relative;display:block;font:900 3.6cqw/1 "Barlow Condensed";font-style:normal;letter-spacing:.04em;padding-bottom:2cqw;color:var(--cream)}
.mt{flex:1;min-width:0;padding-top:.5cqw}
.mt .co{display:block;font:400 var(--fs,17cqw)/.86 "Luckiest Guy";color:var(--bc,#fdbc2a);-webkit-text-stroke:1.1cqw var(--ink);paint-order:stroke fill;text-shadow:.9cqw .9cqw 0 var(--ink);white-space:nowrap;letter-spacing:.01em}
.mt .tk{display:block;font:800 4.4cqw/1 "Barlow Condensed";letter-spacing:.14em;color:var(--cream);margin-top:1.2cqw;text-shadow:0 0 3px var(--ink),0 1px 0 var(--ink)}
.pub{display:block;font:800 3.4cqw/1 "Barlow Condensed";letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:1cqw;text-shadow:0 1px 0 var(--ink)}
.burst{position:absolute;right:-2cqw;bottom:14cqw;width:44cqw;aspect-ratio:1.25;z-index:3;display:grid;place-items:center;transform:rotate(-8deg)}
.burst svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst span{position:relative;font:400 9.4cqw/1 "Luckiest Guy";color:#fff;-webkit-text-stroke:.8cqw var(--ink);paint-order:stroke fill;text-shadow:.6cqw .6cqw 0 var(--ink)}
.cl{position:absolute;left:4cqw;right:4cqw;bottom:3.8cqw;z-index:2;font:400 11.5cqw/.9 Bangers;letter-spacing:.02em;color:var(--hg);-webkit-text-stroke:.7cqw var(--ink);paint-order:stroke fill;text-shadow:.8cqw .8cqw 0 var(--ink);transform:rotate(-3deg);transform-origin:left bottom}
.cl small{display:block;font:800 3.6cqw/1 "Barlow Condensed";letter-spacing:.14em;color:var(--cream);-webkit-text-stroke:0;text-shadow:0 1px 2px var(--ink);margin-bottom:.8cqw}
.cl.no{color:var(--cream)}
.mk{position:absolute;pointer-events:none;overflow:visible;z-index:6}

/* ---------- mounts (drawn per place, inked per style) ---------- */
.p-shop .bag{position:relative;padding:10% 4% 4%}
.p-shop .bag .mk{inset:0;width:100%;height:100%}
.p-tunnel .post{position:relative}
.p-tunnel .post .cover{clip-path:var(--tear)}
.p-tunnel .post .paste{position:absolute;inset:0;z-index:5;background:var(--wallimg) center/240% auto;mix-blend-mode:overlay;opacity:.5;clip-path:var(--tear);pointer-events:none}
.p-tunnel .post .mk{inset:0;width:100%;height:100%}
.p-kiosk .hang,.p-press .hang{position:relative;padding-top:14.5%;transform-origin:50% 0;transform:rotate(var(--sw,0deg))}
.p-kiosk .hang .mk,.p-press .hang .mk{left:0;top:0;width:100%;height:auto;aspect-ratio:5/1}
.wire{position:absolute;left:-40px;right:-40px;height:14px;margin-top:-6px;pointer-events:none;z-index:0}
.p-press .hang .cover{box-shadow:0 1px 0 rgba(0,0,0,.4)}
.p-locker .door{position:relative;padding:8% 7% 9%}
.p-locker .door .mk{inset:0;width:100%;height:100%}
.p-locker .door .cover{z-index:1}
.p-cinema .case{position:relative;padding:8.5%}
.p-cinema .case .mk{inset:0;width:100%;height:100%}
.p-cinema .case .glass{position:absolute;inset:8.5%;z-index:5;pointer-events:none;background:linear-gradient(118deg,transparent 30%,rgba(255,250,230,.16) 38%,transparent 44%,transparent 62%,rgba(255,250,230,.08) 66%,transparent 70%)}
.cv{filter:drop-shadow(var(--shx,4px) var(--shy,7px) 0 rgba(0,0,0,.75))}
/* lesson 86: the one cover a newcomer should tap lifts a little, slowly, until something is tapped */
@keyframes nudge{0%,70%,100%{transform:translateY(0) rotate(0)}78%{transform:translateY(-6px) rotate(-1.2deg)}86%{transform:translateY(0) rotate(.6deg)}}
.cv.nudge>*{animation:nudge 3.6s ease-in-out 1.2s infinite}
@media (prefers-reduced-motion:reduce){.cv.nudge>*{animation:none}}

/* ---------- the tap ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(4,7,14,.55);backdrop-filter:blur(7px) brightness(.6);-webkit-backdrop-filter:blur(7px) brightness(.6);opacity:0;transition:opacity .35s}
.scrim.on{opacity:1}
.fly{position:fixed;z-index:60;left:0;top:0;transform-origin:50% 50%;will-change:transform;cursor:pointer}
.fly .cover{box-shadow:0 30px 60px rgba(0,0,0,.7)}
.fly .glint{position:absolute;inset:0;z-index:9;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,250,230,.5) 48%,transparent 60%);background-size:260% 100%;background-position:120% 0;mix-blend-mode:screen}
.gone{visibility:hidden}
.hint{position:fixed;left:0;right:0;bottom:18px;z-index:61;text-align:center;font:800 12px/1 "Barlow Condensed";letter-spacing:.18em;text-transform:uppercase;opacity:0;transition:opacity .4s .5s}
.scrim.on~.hint{opacity:.8}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
 <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
 <filter id="brush" x="-5%" y="-20%" width="110%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".05 .9" numOctaves="2" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/></filter>
</defs></svg>
<section class="ch" id="ch"></section>
<script src="/ez-data.js"></script>
<script>
const Q=new URLSearchParams(location.search),PL=Q.get('p')||'press',ST=Q.get('s')||'noir';
const SET=[78,77,76,75,74,72,70,51];
/* palette of the mounts per drawn style: ink, the light colour, a mid tone, the shadow drop */
const PAL={noir:{ink:'#0d0b10',hi:'#fdbc2a',mid:'#3a3a40',lo:'#16161a',dim:.32},
           silver:{ink:'#0d0b10',hi:'#ffd21f',mid:'#1f6b4a',lo:'#16264a',dim:.18},
           shadow:{ink:'#050506',hi:'#f2b632',mid:'#22454a',lo:'#3a1414',dim:.22}}[ST];
const PLACES={
 shop:{wallc:'#120c08',title:'Back issues',sub:n=>`Every round so far · ${n} on the wall`,more:['Dig through the long box','all {N} rounds'],pre:'translateY(-40%)'},
 tunnel:{wallc:'#100e0b',title:'The fight card',sub:n=>`Every round so far · ${n} fights on the wall`,more:['See the whole card','all {N} fights'],pre:'perspective(600px) rotateX(-38deg) translateY(-6%)'},
 kiosk:{wallc:'#081a10',title:'Late edition',sub:n=>`Every round so far · ${n} on the stand`,more:['Every back edition','all {N} rounds'],pre:'translateY(10%) rotate(-7deg)'},
 press:{wallc:'#0d0a09',title:'Hot off the press',sub:n=>`Every round so far · ${n} printed`,more:['Every print run','all {N} rounds'],pre:'translateY(12%) rotate(6deg)'},
 locker:{wallc:'#07150f',title:'The locker room',sub:n=>`Every round so far · ${n} lockers`,more:['Open every locker','all {N} rounds'],pre:'perspective(700px) rotateY(-48deg) translateX(-8%)'},
 cinema:{wallc:'#1a0606',title:'Now showing',sub:n=>`Every round so far · ${n} features`,more:['Every feature so far','all {N} rounds'],pre:'translateZ(0) scale(1.04) translateY(-4%)'},
};
const P=PLACES[PL];const K2=(PL==="press"&&ST==="noir")?"-2k":"";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rng=s=>()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0,(s^s>>>13)>>>0)/4294967296);
function star(seed,n){const r=rng(seed*97+11);let d='';for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,k=i%2?(.62+r()*.1):(.96+r()*.08);d+=(i?'L':'M')+(50+Math.cos(a)*50*k).toFixed(1)+' '+(50+Math.sin(a)*40*k).toFixed(1)}return d+'Z'}
function box(seed){const r=rng(seed*31+7),j=()=>(r()-.5)*4;return `M${2+j()} ${2+j()}L${98+j()} ${1+j()}L${99+j()} ${98+j()}L${1+j()} ${99+j()}Z`}
/* a wobbly hand-drawn rectangle outline (points jittered along each side) */
function wob(seed,x0,y0,x1,y1,k=.8,n=6){const r=rng(seed);const pts=[];const side=(ax,ay,bx,by)=>{for(let i=0;i<n;i++){const t=i/n;pts.push([(ax+(bx-ax)*t+(r()-.5)*k).toFixed(1),(ay+(by-ay)*t+(r()-.5)*k).toFixed(1)])}};
 side(x0,y0,x1,y0);side(x1,y0,x1,y1);side(x1,y1,x0,y1);side(x0,y1,x0,y0);return 'M'+pts.map(p=>p.join(' ')).join('L')+'Z'}
function tear(seed){const r=rng(seed*13+5);const p=[];const n=14;for(let i=0;i<=n;i++)p.push(`${(i/n*100).toFixed(1)}% ${(r()*1.6).toFixed(1)}%`);for(let i=1;i<=n;i++)p.push(`${(100-r()*1.4).toFixed(1)}% ${(i/n*100).toFixed(1)}%`);
 for(let i=n-1;i>=0;i--)p.push(`${(i/n*100).toFixed(1)}% ${(100-r()*2.2).toFixed(1)}%`);for(let i=n-1;i>0;i--)p.push(`${(r()*1.4).toFixed(1)}% ${(i/n*100).toFixed(1)}%`);return `polygon(${p.join(',')})`}
const NM={GPT:'GPT',CLAUDE:'Claude',GROK:'Grok',KIMI:'Kimi'};
const winners=r=>r.win?r.win.split(' & ').filter(x=>MODELS[x]):[];
function line(r){const w=winners(r);if(!w.length)return['Nobody called it','NOBODY WINS!',true];if(w.length>1)return['A dead heat',w.map(x=>NM[x].toUpperCase()).join(' & ')+' TIE!'];return['The closest call',NM[w[0]].toUpperCase()+' WINS!']}
const pct=a=>(a>0?'+':'−')+Math.abs(a).toFixed(2)+'%';
const date=s=>{const[m,d]=s.split('/');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]+' '+(+d)};
function pop(c){if(!c)return'#fdbc2a';const n=parseInt(c.slice(1),16),R=n>>16,G=n>>8&255,B=n&255,l=.2126*R+.7152*G+.0722*B;return l<70?'#fdbc2a':c}
function cover(r){const L=CO_LOGOS[r.ticker]||{};const up=r.a>0,[k,t,no]=line(r);
 return `<div class="cover" data-n="${r.n}"><img class="art" src="img/cv-r${r.n}-${ST}.jpg" alt="">`+
  `<div class="mast"><div class="cbox"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${box(r.n)}" fill="#0d0b10" stroke="${PAL.hi}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><i>Round</i><b>${r.n}</b><em>${esc(date(r.resolves||r.called))}</em></div>`+
  `<div class="mt"><span class="pub">EZ · Season 1</span><span class="co" style="--bc:${pop(L.c)}">${esc(r.co)}</span><span class="tk">(${esc(r.ticker)})</span></div></div>`+
  `<div class="burst"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${star(r.n,13)}" fill="${up?'#03c870':'#ff3a31'}" stroke="#0d0b10" stroke-width="3.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><span>${pct(r.a)}</span></div>`+
  `<div class="cl${no?' no':''}"><small>${k}</small>${t}</div></div>`}
/* ---- the drawn mounts (viewBox 100 x 133, the cover's own ratio plus margin) ---- */
const I=PAL.ink;
function mShop(r){/* a bagged-and-boarded sleeve on a hook: ink outline, the plastic's glints drawn as brush strokes */
 const R=rng(r.n*7+1);const g=[0,1,2].map(i=>{const x=8+R()*60,y=14+i*38+R()*8;return `<path d="M${x} ${y+22}L${x+26} ${y}" stroke="#fff" stroke-opacity=".5" stroke-width="${1.2+R()}" stroke-linecap="round" filter="url(#brush)"/>`}).join('');
 return `<svg class="mk" viewBox="0 0 100 133" preserveAspectRatio="none"><path d="${wob(r.n,1.5,8,98.5,131.5,1)}" fill="none" stroke="${I}" stroke-width="2.4" vector-effect="non-scaling-stroke" filter="url(#rough)"/>`+
 `<path d="M2 8L98 8L98 12.5L2 12.5Z" fill="rgba(255,255,255,.12)" stroke="${I}" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`+
 `<ellipse cx="50" cy="4.6" rx="6" ry="2.6" fill="${PAL.lo}" stroke="${I}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><ellipse cx="50" cy="4.6" rx="3" ry="1.1" fill="#000"/>`+
 `<path d="M50 -6Q50 2 47 4" fill="none" stroke="${PAL.hi}" stroke-width="2" vector-effect="non-scaling-stroke"/>${g}</svg>`}
function mTunnel(r){/* wheat paste: a brush smear of glue at the top corners, drawn in ink */
 return `<svg class="mk" viewBox="0 0 100 133" preserveAspectRatio="none"><path d="M-2 3Q20 -1 30 4" stroke="rgba(255,255,255,.35)" stroke-width="3" fill="none" filter="url(#brush)"/><path d="M68 2Q86 6 102 1" stroke="rgba(255,255,255,.3)" stroke-width="2.4" fill="none" filter="url(#brush)"/>`+
  `<path d="M100 120L92 133L100 133Z" fill="${PAL.lo}" stroke="${I}" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>`}
function peg(x){return `<g transform="translate(${x} 0)"><path d="M-3.4 -3L3.4 -3L2.6 17L-2.6 17Z" fill="${PAL.mid==='#3a3a40'?'#6b5432':'#8a5a2b'}" stroke="${I}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><path d="M0 -3L0 17" stroke="${I}" stroke-width=".9" vector-effect="non-scaling-stroke"/><path d="M-3 6L3 6" stroke="#bbb" stroke-width="1.4" vector-effect="non-scaling-stroke"/><path d="M-2.4 -2L-1.8 14" stroke="rgba(255,255,255,.35)" stroke-width="1"/></g>`}
function clip(x){return `<g transform="translate(${x} 0)"><path d="M-7 4L7 4L6 16L-6 16Z" fill="${I}" stroke="${I}" stroke-width="1.4" vector-effect="non-scaling-stroke"/><path d="M-6 6L6 6" stroke="${PAL.hi}" stroke-width="1.2" vector-effect="non-scaling-stroke"/><path d="M-4 4Q-6 -4 0 -4Q6 -4 4 4" fill="none" stroke="#9a9aa2" stroke-width="1.6" vector-effect="non-scaling-stroke"/></g>`}
function mHang(r){return `<svg class="mk" viewBox="0 0 100 20" preserveAspectRatio="none">${PL==='kiosk'?peg(20)+peg(80):clip(50)}</svg>`}
function mLocker(r){/* the locker's open door frame: two black gaffer strips hold the cover inside the door, vents above */
 const R=rng(r.n*3+2);const tape=(x,y,a)=>`<path d="${wob(r.n+x,x,y,x+24,y+6,.6,3)}" transform="rotate(${a} ${x+12} ${y+3})" fill="#141416" stroke="${I}" stroke-width=".8" vector-effect="non-scaling-stroke" opacity=".96"/>`;
 const vents=[0,1,2,3].map(i=>`<path d="M30 ${1.6+i*1.5}L70 ${1.6+i*1.5}" stroke="#000" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linecap="round"/>`).join('');
 return `<svg class="mk" viewBox="0 0 100 133" preserveAspectRatio="none"><path d="${wob(r.n,1,1,99,132,.6)}" fill="none" stroke="${I}" stroke-width="2.6" vector-effect="non-scaling-stroke"/>${vents}`+
  tape(-2,8,-14+R()*6)+tape(76,9,12+R()*6)+`<path d="M95 60L95 74" stroke="${PAL.hi}" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`}
function mCinema(r){/* a brass poster case: two-tone gold frame, thick outer ink, thin inner ink, mitred corners */
 return `<svg class="mk" viewBox="0 0 100 133" preserveAspectRatio="none" style="z-index:3"><path fill-rule="evenodd" d="M0 0H100V133H0Z M8.5 8.5V124.5H91.5V8.5Z" fill="${PAL.hi}"/>`+
  `<path fill-rule="evenodd" d="M0 0H100V133H0Z M4.5 4.5V128.5H95.5V4.5Z" fill="rgba(0,0,0,.0)"/><path d="M0 0L8.5 8.5M100 0L91.5 8.5M100 133L91.5 124.5M0 133L8.5 124.5" stroke="${I}" stroke-width="1" vector-effect="non-scaling-stroke"/>`+
  `<path d="M100 0V133H0L8.5 124.5H91.5V8.5Z" fill="rgba(0,0,0,.42)"/><path d="M4 4H96" stroke="rgba(255,255,255,.55)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`+
  `<path d="${wob(r.n,0,0,100,133,.5)}" fill="none" stroke="${I}" stroke-width="2.6" vector-effect="non-scaling-stroke"/><path d="M8.5 8.5H91.5V124.5H8.5Z" fill="none" stroke="${I}" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>`}
function mount(r,i){const c=cover(r),lab=`Round ${r.n}: ${r.co} (${r.ticker}), ${pct(r.a)}, ${line(r)[1].toLowerCase()}`;const sw=((r.n*37)%7-3)*.5;const nd=i===0?' nudge':'';
 switch(PL){
  case'shop':return `<button class="cv${nd}" aria-label="${esc(lab)}"><div class="bag">${c}${mShop(r)}</div></button>`;
  case'tunnel':return `<button class="cv${nd}" aria-label="${esc(lab)}" style="transform:rotate(${sw}deg);--tear:${tear(r.n)}"><div class="post">${c}<i class="paste"></i>${mTunnel(r)}</div></button>`;
  case'kiosk':case'press':return `<button class="cv${nd}" aria-label="${esc(lab)}"><div class="hang" style="--sw:${sw*.8}deg">${mHang(r)}${c}</div></button>`;
  case'locker':return `<button class="cv${nd}" aria-label="${esc(lab)}"><div class="door">${c}${mLocker(r)}</div></button>`;
  case'cinema':return `<button class="cv${nd}" aria-label="${esc(lab)}"><div class="case">${c}<i class="glass"></i>${mCinema(r)}</div></button>`;
 }}
function wires(){/* one drawn wire per row for the hanging places, sagging between the pegs */
 if(PL!=='kiosk'&&PL!=='press')return;const g=document.querySelector('.grid');g.querySelectorAll('.wire').forEach(e=>e.remove());const rows=new Map();
 g.querySelectorAll('.cv').forEach(b=>{const t=b.offsetTop;if(!rows.has(t))rows.set(t,b)});
 rows.forEach((b,t)=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','wire');s.setAttribute('viewBox','0 0 400 14');s.setAttribute('preserveAspectRatio','none');s.style.top=(t+b.offsetWidth*.055)+'px';
  s.innerHTML=`<path d="M0 3Q100 9 200 6T400 3" fill="none" stroke="${I}" stroke-width="3.2" filter="url(#rough)"/><path d="M0 2.4Q100 8.4 200 5.4T400 2.4" fill="none" stroke="${PL==='press'?'#8d8d96':PAL.hi}" stroke-width="1" opacity=".7"/>`;g.prepend(s)})}
function graded(){return ROUNDS.filter(r=>r.a!=null).length}
function render(){const rs=SET.map(n=>ROUNDS.find(r=>r.n===n)).filter(Boolean);
 const ch=document.getElementById('ch');ch.className='ch p-'+PL+' s-'+ST;ch.style.setProperty('--wallc',P.wallc);ch.style.setProperty('--wallimg',`url(img/${PL}-${ST}-wall.jpg)`);ch.style.setProperty('--dim',PAL.dim);
 ch.innerHTML=`<div class="est"><picture><source media="(min-width:900px)" srcset="img/${PL}-${ST}-est-16x9${K2}.jpg"><img src="img/${PL}-${ST}-est-3x4${K2}.jpg" alt=""></picture>`+
  `<div class="ttl"><h2 class="hh"><span>${P.title}</span></h2><p>${P.sub(graded())}</p></div></div>`+
  `<div class="wall"><div class="grid">${rs.map(mount).join('')}</div>`+
  `<button class="more">${P.more[0]}<small>${P.more[1].replace('{N}',graded())}</small></button></div>`;
 fit();wires();ch.querySelectorAll('.cv').forEach(b=>b.onclick=()=>fly(b))}
function fit(){document.querySelectorAll('.mt .co').forEach(e=>{let f=17;e.style.setProperty('--fs',f+'cqw');while(e.scrollWidth>e.clientWidth+1&&f>6){f-=.5;e.style.setProperty('--fs',f+'cqw')}})}
let open=null;
function fly(btn){if(open)return close();document.querySelectorAll('.nudge').forEach(e=>e.classList.remove('nudge'));
 const src=btn.firstElementChild,R=src.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,ar=R.height/R.width;
 let w=Math.min(vw*.86,vh*.8/ar,560),h=w*ar,x=(vw-w)/2,y=(vh-h)/2-vh*.02;
 const sc=document.createElement('div');sc.className='scrim';document.body.append(sc);
 const hint=document.createElement('div');hint.className='hint';hint.textContent='Tap to put it back';document.body.append(hint);
 const f=document.createElement('div');f.className='fly p-'+PL;f.style.cssText=`width:${w}px;height:${h}px;transform:translate(${x}px,${y}px)`;
 const cl=src.cloneNode(true);cl.style.cssText+=';width:100%;height:100%;transform:none';f.append(cl);const g=document.createElement('i');g.className='glint';f.append(g);document.body.append(f);
 src.classList.add('gone');requestAnimationFrame(()=>sc.classList.add('on'));
 const s0=R.width/w,from=`translate(${R.left}px,${R.top}px) translate(${(R.width-w)/2}px,${(R.height-h)/2}px) scale(${s0})`,to=`translate(${x}px,${y}px)`,pre=P.pre;
 const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
 const K=[{transform:from,offset:0},{transform:from+' '+pre,offset:.28,easing:'cubic-bezier(.3,0,.2,1)'},{transform:`${to} perspective(900px) rotateX(10deg) rotateY(-14deg) scale(1.07)`,offset:.78,easing:'cubic-bezier(.2,.8,.3,1)'},{transform:to,offset:1}];
 f.animate(RM?[{opacity:0,transform:to},{opacity:1,transform:to}]:K,{duration:RM?150:820,fill:'both'});
 if(!RM)g.animate([{backgroundPosition:'120% 0'},{backgroundPosition:'-40% 0'}],{duration:700,delay:700,fill:'both',easing:'ease-out'});
 f.onclick=close;sc.onclick=close;addEventListener('keydown',esck);open={f,sc,hint,src,from,to,pre,RM}}
function esck(e){if(e.key==='Escape')close()}
function close(){if(!open)return;const{f,sc,hint,src,from,to,pre,RM}=open;open=null;removeEventListener('keydown',esck);sc.classList.remove('on');hint.remove();
 const a=f.animate(RM?[{opacity:1},{opacity:0}]:[{transform:to},{transform:from+' '+pre,offset:.6},{transform:from}],{duration:RM?120:520,easing:'cubic-bezier(.4,0,.2,1)',fill:'both'});
 a.onfinish=()=>{src.classList.remove('gone');f.remove();sc.remove()}}
window.__fly=n=>fly(document.querySelectorAll('.wall .cv')[n||0]);window.__close=close;
render();document.fonts.ready.then(()=>{fit();wires()});addEventListener('load',()=>{fit();wires()});addEventListener('resize',wires);
</script>
