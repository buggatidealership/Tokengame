<!doctype html><meta charset="utf-8"><title>R106 · The sweat, final</title>
<!-- Take 7 = take 1 "The sweat" with the owner's notes (2026-11-13), music m2-phonk (its drop on the bell). 15.5 s.
  0.0  frame 0: CoreWeave, 1 LONG vs 3 SHORT, the four AIs and their sides.
  1.5  the title docks, the four AIs fly into their P&L rows, the chart opens.
  2.3  the real path plays (Hyperliquid xyz:CRWV, scaled onto +24.71%); every P&L is a smooth glow bar in the chart's own gradient,
       growing with the live P&L, its tip lit like the chart's head.
  7.5  the bell on the drop: FINAL, the winner takes gold light (row grows, WINNER tag, gold bar), the losers dim (same type size).
  9.0  the winner's row travels to the centre and opens into "GPT made +$24,710 this round" (shared element, no cut).
  11.65 the number travels into GPT's row of the season board; the season P&L runs from before the round to after it.
  Beats (130 BPM, drop at 7.5): B(n) = 7.5 + n x 0.4615; the end screens land on B4 (9.35) and B10 (12.12). -->

<div id="cam">
  <div id="glow"></div>
  <svg id="chart" viewBox="0 0 968 540"></svg>
  <div class="title" id="title"><img src="crwv.png" alt=""><div><div class="co">CoreWeave</div><div class="sub">EARNINGS · 4 AIs · $100K EACH</div></div></div>

</div>

<script src="lib.js"></script>
<script>
L.$('#base').textContent = L.css; L.chrome(document.body);
const R = L.R, cam = L.$('#cam');
const UP = '85,214,162', DN = '232,87,107', AU = '253,188,42';
let rows, srows;
const SORDER = ['GROK', 'CLAUDE', 'GPT', 'KIMI']; // the season board's order after round 106
const build = () => {
  rows = R.ai.map((a, i) => { const el = document.createElement('div'); el.className = 'row';
    el.innerHTML = `<div class="bg"></div><div class="bar"></div><div class="tip"></div><div class="gl"></div><span class="mkw"></span><span class="nm">${a.name}</span><span class="sd ${a.side[0]}">${a.side}</span>${a.side === 'LONG' ? '<span class="win">WINNER</span>' : ''}<span class="pl mono"></span><div class="sh"></div>`;
    L.$('#rows').appendChild(el); return el });
  L.$('#mwho').innerHTML = L.mark('GPT', 120) + '<span>GPT made</span>';
  srows = SORDER.map((k, i) => { const a = R.ai.find(x => x.k === k); const el = document.createElement('div'); el.className = 'srow';
    el.style.top = (420 + i * 196) + 'px';
    el.innerHTML = `<div class="bg"></div><div class="gl"></div><div class="a"><span class="rk">${i + 1}</span>${L.mark(k, 64)}<span class="nm">${a.name}</span>
      <span class="ch" style="color:${a.side === 'LONG' ? '#55d6a2' : '#e8576b'};background:rgba(${a.side === 'LONG' ? UP : DN},.13)">${L.money(a.pnl)} THIS ROUND</span><span class="v"></span></div><svg class="sbar" width="924" height="40"></svg>`;
    L.$('#srows').appendChild(el); return el });
};
// time map: video seconds -> market minutes since the Tue close
const K = [[2.3, 0], [3.3, 60], [4.1, 1050], [5.6, 1380], [7.5, 1440]];
const mAt = t => { if (t <= K[0][0]) return 0; for (let i = 1; i < K.length; i++) if (t <= K[i][0]) { const x = (t - K[i - 1][0]) / (K[i][0] - K[i - 1][0]); const e = i === K.length - 1 ? 1 - Math.pow(1 - x, 1.6) : L.eio(x) * .3 + x * .7; return L.lerp(K[i - 1][1], K[i][1], e) } return 1440 };
const TR = 7.5, BEAT = 60 / 130, B = n => TR + n * BEAT;
const A0 = 8.7, A1 = B(4), C0 = B(9), C1 = B(10), S0 = C1, S1 = B(12) + .2, END = 15.5;
const CW = 968, CH = 540, y0 = -3, y1 = 30, X = m => 20 + m / 1440 * (CW - 40), Y = v => CH - 30 - (v - y0) / (y1 - y0) * (CH - 60);
const svg = L.$('#chart');
let grain;
window.MUSIC = { f: 'm2-phonk', at: 14.79 - TR };
window.CUES = [];
(function cues() {
  const C = window.CUES; C.push([0.05, 'r11-swell', .12], [1.45, 'sfx-whoosh', .16], [2.25, 'r11-slide', .14]);
  let last = -1; for (let t = 2.3; t < TR; t += 1 / 120) { const m = mAt(t); const h = Math.floor((m + 0.001) / 60); if (h !== last && m < 1380 && h > 0) { if (C.filter(c => c[1] === 'sfx-tick' && t - c[0] < .12).length === 0) C.push([+t.toFixed(3), 'sfx-tick', .1]); last = h } }
  for (let k = 50; k >= 0; k -= 10) { let t = 5.6; while (t < TR && mAt(t) < 1440 - k) t += 1 / 240; C.push([+t.toFixed(3), 'sfx-clock', .18]) }
  C.push([5.6, 'sfx-riser', .12], [TR, 'sfx-bell', .3], [TR + .12, 'sfx-stamp', .26], [TR + .5, 'r11-kaching', .24], [TR + .6, 'r11-sparkle', .12],
    [A0, 'sfx-whoosh', .14], [A1, 'r11-thump', .16], [A1 + .75, 'r11-pluck', .12], [C0, 'sfx-whoosh', .12], [C1, 'r11-thump', .14], [S0 + .1, 'r11-card', .1], [S0 + .25, 'r11-card', .1], [S0 + .4, 'r11-card', .1], [S1, 'sfx-chime', .14]);
})();
// a smooth bar: gradient from clear to the colour, brightest at its leading edge
const barCss = (rgb, a) => `linear-gradient(90deg,rgba(${rgb},0) 0%,rgba(${rgb},${.16 * a}) 55%,rgba(${rgb},${.42 * a}) 100%)`;
window.R = t => {
  grain(t);
  const k = L.eio(L.n(t, 1.45, 2.25));
  const ti = L.$('#title'); ti.style.transform = `translate(${L.lerp(84, 56, k)}px,${L.lerp(150, 136, k)}px) scale(${L.lerp(1, .58, k)})`;
  const outA = L.eio(L.n(t, A0, A1)); // the round screen leaves as the winner's screen opens
  const outC = L.eio(L.n(t, A0, A0 + .45)), outL = L.eio(L.n(t, A0 + .1, A1)); // the chart first, then the losers
  ti.style.opacity = 1 - outA;
  const vs = L.$('#vs'); vs.style.opacity = 1 - L.n(t, 1.45, 1.8); vs.style.transform = `translateY(${-60 * L.eo(L.n(t, 1.45, 1.9))}px)`;
  const m = mAt(t), mv = L.px(m);
  rows.forEach((el, i) => { const a = R.ai[i], win = a.side === 'LONG';
    const hx = 56 + i * 242, hy = 660, ry = 880 + i * 96;
    const kk = L.eio(L.n(t, 1.55 + i * .06, 2.3 + i * .06));
    el.style.left = '0px'; el.style.top = '0px';
    el.style.width = L.lerp(232, 968, kk) + 'px'; el.style.height = L.lerp(440, 86, kk) + 'px';
    el.style.flexDirection = kk < .5 ? 'column' : 'row'; el.style.justifyContent = kk < .5 ? 'center' : 'flex-start';
    el.style.gap = (kk < .5 ? 16 : 22) + 'px'; el.style.padding = kk < .5 ? '0' : '0 22px 0 14px';
    const ms = Math.round(L.lerp(140, 58, kk)); const mw = el.querySelector('.mkw'); if (mw.dataset.s != ms) { mw.innerHTML = L.mark(a.k, ms); mw.dataset.s = ms }
    el.querySelector('.nm').style.cssText = kk < .5 ? 'width:auto;font-size:36px;text-align:center' : '';
    const pl = el.querySelector('.pl'); pl.style.display = kk < .5 ? 'none' : '';
    const v = (win ? 1 : -1) * R.stake * mv / 100;
    pl.textContent = t < 2.3 ? '$0' : L.money(v); pl.className = 'pl mono ' + (t < 2.35 ? '' : v >= 0 ? 'up' : 'dn');
    // the smooth bar grows with the live P&L (full row at a $27,000 swing, the day's high), its tip lit like the chart's head
    const on = L.n(t, 2.2, 2.5), wv = L.cl(Math.abs(v) / 27000) * (968 - 0) * on;
    const goldK = win ? L.eo(L.n(t, TR + .15, TR + .7)) : 0;
    const rgb = v >= 0 ? UP : DN; const bar = el.querySelector('.bar'), tip = el.querySelector('.tip');
    bar.style.width = wv + 'px'; bar.style.background = goldK > 0 ? `${barCss(AU, goldK)},${barCss(UP, 1 - goldK)}` : barCss(rgb, 1);
    bar.style.display = kk < .95 ? 'none' : ''; tip.style.display = bar.style.display;
    tip.style.left = Math.max(0, wv - 4) + 'px'; const tc = goldK > .5 ? AU : rgb;
    tip.style.background = `rgb(${tc})`; tip.style.boxShadow = `0 0 18px 4px rgba(${tc},.6)`; tip.style.opacity = on * (wv > 6 ? 1 : 0);
    // the bell: the winner takes the light and grows; the losers dim, same type size
    el.querySelector('.gl').style.opacity = goldK;
    if (win) { const w = el.querySelector('.win'); const wk = L.n(t, TR + .35, TR + .65); w.style.opacity = wk; w.style.transform = `scale(${L.lerp(1.6, 1, L.eo5(wk))})`;
      const sh = el.querySelector('.sh'); const sk = L.n(t, TR + .3, TR + 1.2); sh.style.opacity = Math.sin(Math.PI * sk); sh.style.backgroundPosition = '0 0'; sh.style.transform = `translateX(${L.lerp(-700, 700, sk)}px)`; el.querySelector('.pl').style.color = goldK > .5 ? '#ffd56b' : '' }
    const grow = win ? 1 + .06 * L.eo(L.n(t, TR + .15, TR + .6)) : 1;
    // after 9.0 the winner's row travels to the centre and opens; the losers sink and fade
    let tx = L.lerp(hx, 56, kk), ty = L.lerp(hy, ry, kk), sc = grow, op = 1;
    if (win) { tx = L.lerp(tx, 56, outA); ty = L.lerp(ty, 470, outA); sc = L.lerp(grow, 1.03, outA); op = 1 - L.n(t, A0 + .2, A1) }
    else { ty += 120 * outL; op = 1 - outL }
    el.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; el.style.opacity = op;
    el.style.filter = !win && t > TR ? `brightness(${1 - .42 * L.n(t, TR + .15, TR + .6)}) saturate(${1 - .45 * L.n(t, TR + .15, TR + .6)})` : '';
  });
  // chart
  const on = L.eo(L.n(t, 1.9, 2.4)) * (1 - outC);
  svg.style.opacity = on; svg.style.transform = `translateY(${-60 * outC}px)`;
  let d = '', area = ''; const pts = L.path.filter(p => p[0] <= m).map(p => [X(p[0]), Y(p[1])]); pts.push([X(m), Y(mv)]);
  if (pts.length > 1) { d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L'); area = d + `L${X(m).toFixed(1)} ${Y(0)}L${X(0)} ${Y(0)}Z` }
  const ring = L.n(t, TR, TR + 1.1);
  svg.innerHTML = `<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55d6a2" stop-opacity=".34"/><stop offset="1" stop-color="#55d6a2" stop-opacity="0"/></linearGradient>
   <filter id="gw"><feGaussianBlur stdDeviation="6"/></filter></defs>
   ${[0, 10, 20, 30].map(v => `<line x1="20" x2="${CW - 20}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v ? '#2a2522' : '#5f5853'}" stroke-width="2" ${v ? '' : 'stroke-dasharray="8 8"'}/><text x="${CW - 20}" y="${Y(v) - 10}" text-anchor="end" fill="#5f5853" font-family="Geist Mono" font-size="20">${v ? '+' + v + '%' : '0%'}</text>`).join('')}
   ${[[0, 'TUE 4 PM · REPORT'], [1050, 'WED OPEN'], [1440, 'CLOSE']].map(([mm, s], i) => `<text x="${X(mm)}" y="${CH - 2}" text-anchor="${['start', 'middle', 'end'][i]}" fill="#5f5853" font-family="Geist Mono" font-size="19" letter-spacing="1.5">${s}</text>`).join('')}
   <rect x="${X(1380)}" y="16" width="${X(1440) - X(1380)}" height="${CH - 60}" fill="#fdbc2a" opacity="${.07 * L.n(t, 5.4, 5.7)}"/>
   <path d="${area}" fill="url(#ga)"/><path d="${d}" fill="none" stroke="#55d6a2" stroke-width="10" opacity=".35" filter="url(#gw)"/>
   <path d="${d}" fill="none" stroke="#55d6a2" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${X(m)}" cy="${Y(mv)}" r="11" fill="#f2ede6"/><circle cx="${X(m)}" cy="${Y(mv)}" r="${11 + 26 * (0.5 + 0.5 * Math.sin(t * 9))}" fill="none" stroke="#55d6a2" stroke-width="2" opacity="${t < TR ? .5 : 0}"/>
   ${ring > 0 && ring < 1 ? [0, .18, .36].map(o => { const r = L.n(ring, o, o + .64); return r > 0 && r < 1 ? `<circle cx="${X(1440)}" cy="${Y(R.move)}" r="${14 + 300 * L.eo(r)}" fill="none" stroke="#fdbc2a" stroke-width="${6 * (1 - r)}" opacity="${1 - r}"/>` : '' }).join('') : ''}`;
  const nw = L.$('#now'); nw.textContent = L.pct(mv); nw.style.opacity = on * (1 - L.n(t, TR + .3, TR + .6));
  nw.style.left = Math.min(56 + X(m) + 24, 1024 - 300) + 'px'; nw.style.top = Math.max(300, 300 + Y(mv) - 100) + 'px';
  const c = L.clock(m); L.$('#cd').textContent = t < 2.3 ? 'NEW YORK' : c.day + ' · NEW YORK'; L.$('#ct').textContent = t < 2.3 ? '' : c.t;
  const left = 1440 - m; L.$('#cc').textContent = m >= 1380 && t < TR ? 'CLOSE IN ' + Math.floor(left) + ':' + String(Math.floor((left % 1) * 60)).padStart(2, '0') : t >= TR ? 'THE CLOSE' : '';
  L.$('#clock').style.opacity = L.n(t, 2.0, 2.4) * (1 - outC);
  const f = L.n(t, TR + .08, TR + .45), fo = 1 - L.n(t, 8.3, 8.75); const fe = L.$('#final');
  fe.style.opacity = (f > 0 ? 1 : 0) * fo; fe.style.transform = `translate(-50%,-50%) rotate(-8deg) scale(${L.lerp(2.2, 1, L.eo5(f))})`;
  // screen A: GPT made +$24,710 this round (opens out of the winner's row)
  const ma = L.$('#made'), ain = L.eo(L.n(t, A0 + .25, A1 + .15)), aout = L.eio(L.n(t, C0, C1));
  ma.style.opacity = ain * (1 - L.n(t, C0, C0 + .25)); ma.style.transform = `translateY(${30 * (1 - ain)}px) scale(${L.lerp(.9, 1, ain) * (1 + .015 * L.n(t, A1, C0))})`;
  L.$('#ms1').style.opacity = L.n(t, A1 + .1, A1 + .4); L.$('#ms2').style.opacity = L.n(t, A1 + .75, A1 + 1.05);
  L.$('#mamt').style.backgroundPosition = `${L.lerp(100, 0, L.eio(L.n(t, A1 + .3, A1 + 1.5)))}% 0`;
  // the big number travels into GPT's season row
  const amt = L.$('#mamt'); const gi = SORDER.indexOf('GPT');
  amt.style.transform = aout > 0 ? `translate(${L.lerp(0, 300, aout)}px,${L.lerp(0, (420 + gi * 196 + 52) - 650, aout)}px) scale(${L.lerp(1, .3, aout)})` : '';
  // screen B: the season, before the round -> after it
  const sin = L.eo(L.n(t, C0 + .1, C1 + .2)); const sh = L.$('#ssn'); sh.style.opacity = sin; sh.style.transform = `translateY(${24 * (1 - sin)}px)`;
  const run = L.eio(L.n(t, S0 + .15, S1));
  srows.forEach((el, i) => { const k = SORDER[i], win = k === 'GPT'; const kin = L.spring(t - C0 - .05 - i * .08, 1.6, 7);
    el.style.opacity = L.cl(kin * 1.3) * (t > C0 ? 1 : 0); el.style.transform = `translateY(${(1 - kin) * 60}px)`;
    const v = L.lerp(R.season0[k], R.season1[k], run); const ve = el.querySelector('.v'); ve.textContent = L.money(v);
    ve.style.color = Math.abs(v) < 500 ? '#f2ede6' : v >= 0 ? '#55d6a2' : '#e8576b';
    el.querySelector('.ch').style.opacity = L.n(t, S0 + .1 + i * .05, S0 + .4 + i * .05);
    el.querySelector('.gl').style.opacity = win ? L.eo(L.n(t, S1 - .2, S1 + .3)) : 0;
    el.style.filter = !win ? `brightness(${1 - .25 * L.n(t, S1 - .2, S1 + .3)})` : '';
    // a smooth diverging bar from the $0 line (scale: $210,000 to each side)
    const Z = 462, w = v / 210000 * 440, rgb = Math.abs(v) < 500 ? '242,237,230' : v >= 0 ? UP : DN;
    const x0 = w >= 0 ? Z : Z + w, ww = Math.max(4, Math.abs(w));
    el.querySelector('svg.sbar').innerHTML = `<defs><linearGradient id="sg${i}" x1="${w >= 0 ? 0 : 1}" y1="0" x2="${w >= 0 ? 1 : 0}" y2="0"><stop offset="0" stop-color="rgb(${rgb})" stop-opacity=".08"/><stop offset="1" stop-color="rgb(${rgb})" stop-opacity=".75"/></linearGradient>
      <filter id="sb${i}"><feGaussianBlur stdDeviation="6"/></filter></defs>
      <rect x="0" y="14" width="924" height="12" rx="6" fill="#1d1917"/>
      <rect x="${x0}" y="8" width="${ww}" height="24" rx="12" fill="url(#sg${i})"/>
      <rect x="${w >= 0 ? x0 + ww - 5 : x0}" y="6" width="5" height="28" rx="2.5" fill="rgb(${rgb})" filter="url(#sb${i})" opacity=".9"/>
      <rect x="${w >= 0 ? x0 + ww - 3 : x0}" y="8" width="3" height="24" rx="1.5" fill="rgb(${rgb})"/>
      <line x1="${Z}" x2="${Z}" y1="0" y2="40" stroke="#8e8680" stroke-width="2"/>`;
  });
  // colour script
  const w = L.cl(mv / 25), b = L.n(t, TR, TR + .6) * (1 - .5 * L.n(t, TR + .6, 9.5)), ga = ain * (1 - aout);
  L.$('#glow').style.background = `radial-gradient(ellipse 80% 45% at 30% 20%,rgba(85,214,162,${(.05 + .16 * w) * (1 - outA) + .2 * ga}),transparent 70%),radial-gradient(ellipse 90% 40% at 50% 100%,rgba(232,87,107,${(.03 + .11 * w) * (1 - outA)}),transparent 70%),radial-gradient(ellipse 70% 50% at 50% 70%,rgba(253,188,42,${.18 * b * (1 - outA) + .1 * ga}),transparent 70%),radial-gradient(ellipse 70% 40% at 50% 60%,rgba(253,188,42,${.07 * sin}),transparent 70%)`;
  // camera: slow push, harder in the last hour, a kick at the bell, a gentle drift through the end screens
  const push = 1 + .015 * L.n(t, 0, 2.3) + .03 * L.eio(L.n(t, 5.6, TR)) - .03 * L.eio(L.n(t, TR + .3, 8.6)) + .045 * L.n(t, A1, C0) - .045 * L.eio(L.n(t, C0, C1)) + .02 * L.n(t, C1, END);
  const kick = t > TR ? Math.exp(-(t - TR) * 9) * Math.sin((t - TR) * 60) * 4 : 0;
  cam.style.transform = `translate(${kick}px,${kick * .6}px) scale(${push})`;
};
L.boot(async () => { build(); grain = L.grain(L.$('#grain'), .08); });
</script>
