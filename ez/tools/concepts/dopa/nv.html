<!-- The prediction video for the season's last round (owner, 2026-11-17: "it's NVIDIA earnings. I definitely want to do a prediction
  video for that one... full freedom... Hedra or not... good cinematics, motion, visual effects, clean execution, no dead noise, simplicity").
  nv.html?r=<round>&v=race|chip reads data/c<round>.json (prep-calls.js: the sheet only; SAMPLE=... for mock-ups, then SAMPLE CALLS is
  printed on every frame).
  race  14.2 s  the whole season as one P&L race (every graded round, $100K flat), which folds into the corner; then the four calls
                land from 4th place to the leader, the LONG and SHORT counts tick, graded at the close
  chip  10.4 s  the site's painted NVIDIA chip (media/bet-chip-h2.jpg; hedra/chip-a frames when present: the same painting with living
                light, camera locked); its four dies are the four AIs, each lights green or red with its side, the calls under it
  No result, no "locked N minutes before": the sheet has no posting time. window.R(t), READY, CUES, MUSIC as the other pages. -->

<script>

  S.lg = D.logo ? add(`<div class="title" style="left:0;top:0;transform-origin:0 0"><img src="${D.logo}"></div>`) : null;
  S.sub = add(`<div class="sub" style="top:306px">${fin()}</div>`);
  S.c1 = add(`<div class="colh2" style="left:707px;top:422px;width:136px;text-align:center">SIDE</div>`); S.c2 = add(`<div class="colh2" style="left:869px;top:422px;width:129px;text-align:right">CALLS</div>`);
  S.rows = ord.map((k, i) => { const a = D.ai.find(x => x.k === k), sp = D.season[k], nc = a.side === 'NO CALL';
    const el = add(`<div class="row" style="top:${462 + i * 124}px"><div class="bg"></div><div class="tn" style="background:linear-gradient(90deg,transparent 30%,${col(a)}22)"></div><div class="sw" style="background:linear-gradient(90deg,transparent,${col(a)}55,transparent)"></div>

  const b = x => +(x * BT).toFixed(3);

  S.tC0 = Math.min(...S.rows.map(r => r.tc)); S.tEnd = Math.max(...S.rows.map(r => r.tc)); S.tS = b(22); S.tG = b(23); DUR = b(28);
  S.tl = add(`<div class="tb L" style="left:56px;top:968px">LONG <b>0</b></div>`); S.ts = add(`<div class="tb S" style="left:552px;top:968px">SHORT <b>0</b></div>`);
  const lone = D.lone && D.ai.find(x => x.k === D.lone);
  S.st = add(`<div class="st" style="top:1108px">${lone ? `${lone.name} stood alone <b>${D.loneRec.times} times</b> before. Right <b class="au">${D.loneRec.right}</b>.` : D.kind === 'unanimous' ? 'Nobody took the other side.' : 'A split room.'}</div>`);
  S.gp = add(`<div class="gp" style="top:1166px"><div class="p"><i></i>$100K EACH · GRADED ${D.close || 'AT THE CLOSE'}</div></div>`);
  C.push([.05, 'r11-swell', .09]); for (let r = 10; r <= n; r += 10) C.push([+(S.r0 + (S.r1 - S.r0) * invE(r / n)).toFixed(3), 'sfx-tick', .035]);
  C.push([S.tB, 'sfx-whoosh', .09], [S.tT, 'r11-thump', .15]); S.rows.forEach(r => C.push([r.tc, r.last ? 'r11-knock' : 'r11-card', r.last ? .2 : .13])); C.push([S.tS, 'r11-ping', .07], [S.tG, 'sfx-chime', .16]);
  window.MUSIC = { f: 'i4-house', at: +(q.get('at') || .042) };
}
const raceE = x => L.eio(x) * .5 + x * .5, invE = y => { let a = 0, b = 1; for (let i = 0; i < 30; i++) { const m = (a + b) / 2; raceE(m) < y ? a = m : b = m } return (a + b) / 2 };
function rRace(t) {

  const bx = { x: L.lerp(56, 742, k), y: L.lerp(366, 146, k), w: L.lerp(740, 268, k), h: L.lerp(850, 196, k) };
  const X = r => bx.x + bx.w * r / (n + S.ahead), Y = v => bx.y + bx.h * (S.hi - v) / (S.hi - S.lo), y0 = Y(0);
  const sg = L.$('#sg'); sg.setAttribute('y1', bx.y); sg.setAttribute('y2', bx.y + bx.h); const off = (y0 - bx.y) / bx.h; L.$('#s1').setAttribute('offset', off); L.$('#s2').setAttribute('offset', off);
  const z = L.$('#z'); z.setAttribute('x1', bx.x); z.setAttribute('x2', bx.x + bx.w); z.setAttribute('y1', y0); z.setAttribute('y2', y0);
  const ga = 1 - L.n(k, 0, .3); S.grid.forEach(g => { const y = Y(g.v); g.ln.setAttribute('x1', bx.x); g.ln.setAttribute('x2', bx.x + bx.w); g.ln.setAttribute('y1', y); g.ln.setAttribute('y2', y); g.ln.style.opacity = g.v === 0 ? 0 : ga; if (g.lb) { g.lb.style.top = y + 'px'; g.lb.style.opacity = ga } });
  S.zl.style.top = y0 + 'px'; S.zl.style.opacity = ga;
  const i0 = Math.floor(fi), fr = fi - i0, sw = L.lerp(5, 3, k), hy = [];
  S.ln.forEach((l, j) => { const s = D.race.s[l.k]; let d = ''; for (let i = 0; i <= i0; i++) d += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(s[i]).toFixed(1);
    const v = i0 >= n ? s[n] : L.lerp(s[i0], s[i0 + 1], fr), hx = X(fi), y = Y(v); if (i0 < n) d += 'L' + hx.toFixed(1) + ' ' + y.toFixed(1);
    l.p.setAttribute('d', d); l.p.setAttribute('stroke-width', sw); l.g.setAttribute('d', d); l.g.setAttribute('stroke-width', sw * 2.4); hy[j] = { y, v, hx } });

  S.ln.forEach((l, j) => { const h = hy[j], ms = L.lerp(1, .5, k), a0 = L.n(fi, .2, 2.5);
    l.hd.style.transform = `translate(${h.hx - 22 * ms}px,${h.y + h.o - 22}px) scale(${ms})`; l.hd.style.opacity = a0; const v = l.hd.lastElementChild; v.textContent = money0(Math.round(h.v / 10) * 10); v.style.color = h.v >= 0 ? G : Rd; v.style.opacity = 1 - L.n(k, 0, .5) });
  const wl = L.$('#wall'), wk = 1, pulse = .62 + .38 * (.5 + .5 * Math.sin(t * Math.PI * 2 / (BT * 2) - 1.2));
  if (S.lg) { const z2 = L.lerp(64, 120 * S.ts0, k) / 120; S.lg.style.transform = `translate(${L.lerp(796 - 32, 56, k)}px,${L.lerp(366 - 82, 214 - 60 * S.ts0, k)}px) scale(${z2})` }

  S.ml.style.left = '674px'; S.ml.style.width = '350px'; S.ml.style.top = '356px'; S.ml.style.opacity = L.n(t, S.tB + .6, S.tB + 1);
  const oA = 1 - L.n(t, S.tB - .1, S.tB + .25); S.hdA.style.opacity = oA; S.hdA.style.transform = `translateY(${-30 * (1 - oA)}px)`; S.ctr.style.opacity = oA;

  const tk = L.spring(t - S.tT, 1.6, 6) * L.n(t, S.tT, S.tT + .02); S.title.style.opacity = L.n(t, S.tT, S.tT + .12); S.title.style.transform = `translateY(${(1 - tk) * 60}px) scale(${S.ts0})`;

  S.rows.forEach(r => { const ke = L.eo(L.n(t, S.tR + r.i * .08, S.tR + r.i * .08 + .4)); r.el.style.opacity = ke; r.el.style.transform = `translateY(${(1 - ke) * 34}px)`;

    cl.style.opacity = on ? L.n(dt, .04, .16) : 0; if (!r.nc) cl.textContent = callTxt(r.a, r.a.size * L.eo(L.n(dt, .04, .4)));
    r.el.querySelector('.tn').style.opacity = on ? L.n(dt, 0, .3) : 0; const sw2 = r.el.querySelector('.sw'), sk = L.n(dt, 0, .55), hs = L.n(t, S.tG + .5 + r.i * .45, S.tG + 1.25 + r.i * .45);
