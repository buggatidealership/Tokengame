<!-- The Season 2 FEED teaser (2026-11-20). In app: one phone enters and stays; the camera never rests; a fingertip taps; cards are lifted
  out of the phone onto frosted glass by layout zoom (text drawn at its final size, never a scaled raster), the screen behind dims and blurs.
  Default story (the coordinator's lines after the owner's Grok research on X: name who competes, show the disagreement, one real reason readable,
  end on Coming soon): Intuit's in-play card lifts and the five sides land one by one, 3 LONG v 2 SHORT ("Same report / Five AIs disagree"); a
  new FEED tab is tapped and the posts arrive ("Read the reasoning / In their own words"); Qwen LONG (+4%) and Claude SHORT (−4%) lift with
  their key clauses marked (no headline); Grok's post lifts, the fingertip opens "In plain words" ("We translate the jargon"); SEASON 2,
  The feed, Coming soon, the logo. ?open=owner gives the owner's own opening (SEASON 1 / Long or short over Season 1's Disney row, then
  SEASON 2 / Now the why at the tap). Data: w6/fl/data.json (w6/fl/prep.py: calls.csv, feed/words.json verbatim, ez-data.js rows 110 to 112).
  Bed i4-house (118.4 BPM, beat 0.5068 s, first beat 0.025 s), every cut and lift on a beat.
  Switches: ?copy=a|b, any line by ?s1k=&s1=&s1b=&s2k=&s2=&s2b=&s4=&ek=&e1=&e2= ({g word} green, {r word} red, {y word} gold), ?end=soon|live.
  ?pace=up (owner, 2026-11-20: "missing some type of excitement... a bit more upbeat"): the same story and words, faster: bed fl-up (r10-house,
  122 BPM, cut by bedx.py so its kick drops back in on Qwen's pop-out at 6.9 s and again on the end card at 22.6 s, its breaks under the tab tap and
  under the plain-words read), a camera that moves on the beat (a dolly by layout zoom down to the tab bar, up to the feed, a punch in; on the
  glass: push, focus Qwen, focus Claude, then into the plain-words panel), the words of the plain reading lit in reading order, a stronger kick
  light; every move starts on a beat; 25.6 s. -->

<script>
const Q = new URLSearchParams(location.search), PU = Q.get('pace') === 'up', BT = PU ? .4918 : .5068, PH = PU ? .020 : .025, B = n => PH + n * BT, DUR = PU ? 25.6 : 26.0;
const END = Q.get('end') || 'soon', OWN = Q.get('open') === 'owner';
// the on-screen lines; the default is the coordinator's set after the owner's Grok research; ?open=owner keeps the owner's own opening.
// {g w} green, {r w} red, {y w} gold; any line can be set by its own parameter
const COPY = {
  a: { s1k: '', s1: 'Same report', s1b: 'Five AIs disagree', s2k: '', s2: 'Read the reasoning', s2b: 'In their own words', s4: 'We translate the jargon', ek: 'SEASON 2', e1: 'The feed' },
  b: { s1k: '', s1: 'One stock', s1b: 'Five AIs split', s2k: '', s2: 'Every trade', s2b: 'With its reason', s4: 'Jargon made {y plain}', ek: 'SEASON 2', e1: 'The feed' } };
const CP = Object.assign({}, COPY[Q.get('copy')] || COPY.a);
if (OWN) Object.assign(CP, { s1k: 'SEASON 1', s1: '{g Long} or {r short}', s1b: '', s2k: 'SEASON 2', s2: 'Now the {y why}', s2b: '' });
for (const k of Object.keys(COPY.a).concat(['e2'])) if (Q.has(k)) CP[k] = Q.get(k);
if (!Q.has('e2')) CP.e2 = END === 'live' ? 'Live now' : 'Coming soon';
const fmt = s => s.replace(/\{([gry]) ([^}]+)\}/g, (_, c, w) => w.split(' ').map(x => `\u0001${c}${x}`).join(' '));
const wordsHTML = (s, n0) => { let n = n0; return fmt(s).split(/\s+/).filter(Boolean).map(w => { const c = w[0] === '\u0001' ? w[1] : ''; const x = c ? w.slice(2) : w;
  return `<span class="w"><i class="${c}" data-n="${n++}">${x.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</i></span>` }).join(' ') };
const NOP = /[.,;:!?'"“”‘’()·]/;   // headline lines carry no punctuation (owner's rule); the page refuses to start with one
['s1k', 's1', 's1b', 's2k', 's2', 's2b', 's4', 'ek', 'e1', 'e2'].forEach(k => { if (NOP.test((CP[k] || '').replace(/\{[gry] /g, '').replace(/\}/g, ''))) throw new Error('punctuation in line ' + k + ': ' + CP[k]) });

let D, grain, gl, lifts = {};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const mark = (k, s) => { const m = D.marks[k];
  return `<span class="aim" style="width:${s}px;height:${s}px;background:${m.bg}"><svg viewBox="0 0 24 24" width="${(s * .58).toFixed(1)}" height="${(s * .58).toFixed(1)}"><path fill="${m.fg}"${m.fr ? ` fill-rule="${m.fr}"` : ''} d="${m.d}"/>${m.dot ? `<path fill="${m.dotc}" d="${m.dot}"/>` : ''}</svg></span>` };
const flag = (c, w) => c === 'CN' ? `<svg class="fl" width="${w}" height="${w * 2 / 3}" viewBox="0 0 30 20"><rect width="30" height="20" fill="#de2910"/><path fill="#ffde00" d="M6 3l1.2 3.6H11L8 8.8l1.1 3.6L6 10.2 2.9 12.4 4 8.8 1 6.6h3.8z"/></svg>`
  : `<svg class="fl" width="${w}" height="${w * 2 / 3}" viewBox="0 0 30 20"><rect width="30" height="20" fill="#b22234"/>${[2.3, 6.9, 11.5, 16.1].map(y => `<rect y="${y}" width="30" height="1.55" fill="#fff"/>`).join('')}<rect width="13" height="10.8" fill="#3c3b6e"/></svg>`;
const hwords = s => { const w = s.split(/\s+/).filter(Boolean); let o = '';
  w.forEach((x, i) => { const sp = i < w.length - 1; o += `<span class="hw${sp ? ' sp' : ''}">${esc(x)}<i>${esc(x)}</i></span>${sp ? ' ' : ''}` }); return o };
const quote = (keep, hl) => { const i = keep.indexOf(hl); if (i < 0) throw new Error('highlight not in text: ' + hl);
  return `<span class="rest">${esc(keep.slice(0, i))}</span><span class="hlc">${hwords(hl)}</span><span class="rest">${esc(keep.slice(i + hl.length))}</span>` };
const sweep = (el, p) => { const ln = w => w.firstChild.textContent.length + (w.classList.contains('sp') ? 1 : 0), ws = [...el.querySelectorAll('.hw')], n = ws.reduce((s, w) => s + ln(w), 0); let c = 0;
  ws.forEach(w => { const l = ln(w), x = Math.min(1, Math.max(0, (p * n - c) / l)); c += l; w.lastChild.style.clipPath = `inset(-12% ${((1 - x) * 100).toFixed(2)}% -12% 0)`; w.lastChild.style.opacity = x > 0 ? 1 : 0 }) };
const sideTxt = x => `${x.side} <span>(${x.side === 'LONG' ? '+' : '−'}${x.size}%)</span>`;   // owner: "LONG (+4%)"
const ICON = { LEADERBOARD: '<path d="M5 20V10M12 20V4M19 20v-7"/>', FEED: '<path d="M4 5.5h16v10.5H10l-4.5 3.5V16H4z"/><path d="M8 9.5h8M8 12.5h5"/>', 'AI PROFILES': '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.8 14.2c2.4.1 4.1 1.6 4.7 4.8"/>', UPCOMING: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>' };
const S1ORD = ['GPT', 'KIMI', 'CLAUDE', 'GROK'], CARD = ['QWEN', 'CLAUDE', 'GPT', 'GROK', 'GEMINI'];   // the card's sides land alternating, so the split shows as it builds

// ---- timeline (beats of i4-house) ----
const T = {   // every hold is at least 1 s + 0.08 s a character of the longest line in it (checked in the report)
  inPh: 0, s1in: B(0) + .1, s1b: B(3), cardUp: B(1), rows: [2, 3, 4, 5, 6].map(B), cardDn: B(8), s1out: B(7.9),
