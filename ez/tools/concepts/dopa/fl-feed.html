<!doctype html><meta charset="utf-8"><title>EZ feed teaser</title>
<!-- The Season 2 FEED teaser (2026-11-20). In app: one phone enters and stays; the camera never rests; a fingertip taps; posts are lifted
  out of the phone onto frosted glass by layout zoom (text drawn at its final size, never a scaled raster), the screen behind dims and blurs.
  Story: Season 1 showed the side (a Disney row of plain LONG and SHORT chips), Season 2 adds the why (a new FEED tab is tapped), two AIs on
  the same stock trade opposite sides in their own words (Intuit: Qwen LONG vs Claude SHORT), a jargon-heavy reason opens "In plain words"
  (Grok, our short reading), then the logo and "coming soon" (owner: a teaser; the fuller post follows when the feature ships).
  Data: w6/fl/data.json (w6/fl/prep.py: calls.csv, feed/words.json verbatim, ez-data.js rows 110 to 112). Bed i4-house (118.4 BPM,
  beat 0.5068 s, first beat 0.025 s), every cut and lift on a beat.
  Switches: ?copy=a|b|c (the on-screen lines; the owner is researching the wording), any single line by ?s1k=&s1=&s2k=&s2=&s3=&s3b=&s4=&ek=&e1=&e2=
  ({g word} green, {r word} red, {y word} gold), ?end=soon (default, the teaser) | live. -->
<style>

#ph .body{position:absolute;inset:-14px;border-radius:66px;background:linear-gradient(145deg,#5a605c 0%,#1d201e 13%,#0b0d0c 32%,#0b0d0c 68%,#1c1f1d 87%,#4b514d 100%);box-shadow:0 60px 120px rgba(0,0,0,.7),0 -20px 60px -26px rgba(40,200,130,.4),0 22px 70px -26px rgba(255,60,70,.36),inset 0 0 0 2px rgba(255,255,255,.12),inset 0 6px 6px -4px rgba(90,235,170,.55),inset 0 -6px 6px -4px rgba(255,84,94,.5)}

/* the app: the terminal's own look at phone size */

.pq .rest{transition:none}
.pt{display:flex;align-items:center;gap:7px;margin-top:11px;font:700 13.5px/1 Inter;color:var(--ac)}
.pt svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pt .cv{margin-left:auto;width:16px;height:16px}
.pp{overflow:hidden;height:0}
.ppi{margin-top:10px;padding:11px 13px 12px;border-radius:14px;background:rgba(253,188,42,.08);box-shadow:inset 3px 0 0 var(--ac)}
.ppi small{display:block;font:700 13.5px/1 'Geist Mono';letter-spacing:.08em;color:var(--ac)}.ppi small i{font-style:normal;font-weight:500;color:var(--mu);letter-spacing:.02em;margin-left:6px}

.tc .sd{margin-left:auto;white-space:nowrap;font:700 16px/1 'Geist Mono';letter-spacing:.04em;transform-origin:100% 50%}.tc .sd span{font-weight:600;font-size:14.5px;letter-spacing:0}
.L{color:var(--up)}.S{color:var(--dn)}

#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#nav .on{color:var(--tx)}#nav .nf{color:var(--ac)}
#tab{position:absolute;bottom:71px;height:3px;border-radius:0 0 3px 3px;background:var(--ac);box-shadow:0 0 12px rgba(253,188,42,.7);z-index:5}
.aim{border-radius:50%;display:inline-grid;place-items:center;flex:none;box-shadow:0 0 0 1.5px rgba(242,237,230,.14)}.aim svg{display:block}

.hlc{white-space:normal}

.hw.sp i{right:-.3em}
.hw:first-child i{left:-.1em;padding-left:.1em;border-radius:.12em 0 0 .12em}.hw:last-child i{right:-.1em;border-radius:0 .12em .12em 0}
/* lifted: a copy of the post on frosted glass, grown by layout zoom; the glass's own light drifts (--gx, --gy) */
#veil{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 52%,rgba(0,0,0,.55),rgba(0,0,0,.35));opacity:0;pointer-events:none}
#lift{position:absolute;inset:0;pointer-events:none}
.lw{position:absolute;left:0;top:0;width:0;height:0;display:none}

.lc.glass::before{content:'';position:absolute;left:var(--gx,30%);top:var(--gy,0%);width:300px;height:220px;margin:-110px 0 0 -150px;border-radius:50%;background:radial-gradient(closest-side,var(--gc,rgba(3,200,112,.28)),transparent);mix-blend-mode:screen;pointer-events:none}
.lc.glass .tc,.lc.glass .ch{background:rgba(4,7,6,.55)}
.lc.glass.foc .pq .rest{color:rgba(231,225,217,.5)}
.lc .ph small,.lc .tc .cn span,.lc .tc .cn small,.lc .rh span{color:#a9b4ad}
/* the fingertip on the glass (vid2.html's) */
#td{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.62),rgba(255,255,255,.3) 62%,rgba(255,255,255,.05));box-shadow:0 0 0 1.5px rgba(255,255,255,.4),0 6px 18px rgba(0,0,0,.45);opacity:0;pointer-events:none}
#tr{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;border:2.5px solid rgba(255,255,255,.75);opacity:0;pointer-events:none}
/* the lines: a small gold kicker over one big line; words rise one by one */
#hl{position:absolute;left:40px;right:40px;top:64px;text-align:center;pointer-events:none}
#hl small{display:block;height:34px;font:700 30px/34px 'Geist Mono';letter-spacing:.18em;color:var(--ac);margin-bottom:14px}
#hl small:empty{height:0;margin:0}#hl h2{font:800 92px/1.04 Inter;letter-spacing:-.045em;color:var(--tx);text-wrap:balance}
#hl .w{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em .04em .16em;margin:-.04em -.04em -.16em}.w>i{display:inline-block;font-style:normal}
#hl .g,#end .g{color:#03c870}#hl .r,#end .r{color:#ff3a31}#hl .y,#end .y{color:var(--ac)}
#end{position:absolute;left:0;right:0;top:70px;text-align:center;opacity:0}
#end img{width:150px;height:150px;display:block;margin:0 auto}
#end h3{margin-top:30px;font:900 118px/1 Inter;letter-spacing:-.05em}
#end p{margin-top:30px;font:800 50px/1 'Geist Mono';letter-spacing:.14em;color:var(--ac)}
</style>

<div id="gnd"></div>
<div id="cam"><div id="phw"><div id="ph"><div class="body"></div><div id="scr"><div id="app">

<script src="lib.js"></script>
<script>
const Q = new URLSearchParams(location.search), BT = .5068, B = n => .025 + n * BT, DUR = 25.0;
const END = Q.get('end') || 'soon';
// the on-screen lines (the owner is researching the wording on X; any line can be set by its own parameter). {g w} green, {r w} red, {y w} gold
const COPY = {
  a: { s1k: 'SEASON 1', s1: '{g Long} or {r short}', s2k: 'SEASON 2', s2: 'Now the {y why}', s3: 'Same stock', s3b: 'Opposite trades', s4: 'We add {y plain words}', ek: '', e1: 'The Feed' },
  b: { s1k: 'SEASON 1', s1: 'You saw the trade', s2k: 'SEASON 2', s2: 'Now see {y why}', s3: 'Two AIs', s3b: 'Two sides', s4: 'Jargon made {y plain}', ek: '', e1: 'The Feed' },
  c: { s1k: 'SEASON 1', s1: 'What they traded', s2k: 'SEASON 2', s2: 'Why they {y traded}', s3: 'Same stock', s3b: '{g Long} vs {r short}', s4: 'Plus {y our reading}', ek: '', e1: 'The Feed' } };
const CP = Object.assign({}, COPY[Q.get('copy')] || COPY.a); for (const k of Object.keys(COPY.a).concat(['e2'])) if (Q.has(k)) CP[k] = Q.get(k);
if (!Q.has('e2')) CP.e2 = END === 'live' ? 'Live now' : 'Coming soon';
const fmt = s => s.replace(/\{([gry]) ([^}]+)\}/g, (_, c, w) => w.split(' ').map(x => `\u0001${c}${x}`).join(' '));
// words of a line as rising spans (a coloured word keeps its colour); one call per line, reused while the line is the same
const wordsHTML = (s, n0) => { let n = n0; return fmt(s).split(/\s+/).filter(Boolean).map(w => { const c = w[0] === '\u0001' ? w[1] : ''; const x = c ? w.slice(2) : w;
  return `<span class="w"><i class="${c}" data-n="${n++}">${L.$ ? x.replace(/&/g, '&amp;').replace(/</g, '&lt;') : x}</i></span>` }).join(' ') };
const NOP = /[.,;:!?'"“”‘’()·]/;   // headline lines carry no punctuation (owner's rule); the page refuses to start with one
['s1k', 's1', 's2k', 's2', 's3', 's3b', 's4', 'ek', 'e1', 'e2'].forEach(k => { if (NOP.test((CP[k] || '').replace(/\{[gry] /g, '').replace(/\}/g, ''))) throw new Error('punctuation in line ' + k + ': ' + CP[k]) });

let D, grain, gl, lifts = {}, src = {};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const mark = (k, s) => { const m = D.marks[k];
  return `<span class="aim" style="width:${s}px;height:${s}px;background:${m.bg}"><svg viewBox="0 0 24 24" width="${(s * .58).toFixed(1)}" height="${(s * .58).toFixed(1)}"><path fill="${m.fg}"${m.fr ? ` fill-rule="${m.fr}"` : ''} d="${m.d}"/>${m.dot ? `<path fill="${m.dotc}" d="${m.dot}"/>` : ''}</svg></span>` };
const flag = (c, w) => c === 'CN' ? `<svg class="fl" width="${w}" height="${w * 2 / 3}" viewBox="0 0 30 20"><rect width="30" height="20" fill="#de2910"/><path fill="#ffde00" d="M6 3l1.2 3.6H11L8 8.8l1.1 3.6L6 10.2 2.9 12.4 4 8.8 1 6.6h3.8z"/></svg>`
  : `<svg class="fl" width="${w}" height="${w * 2 / 3}" viewBox="0 0 30 20"><rect width="30" height="20" fill="#b22234"/>${[2.3, 6.9, 11.5, 16.1].map(y => `<rect y="${y}" width="30" height="1.55" fill="#fff"/>`).join('')}<rect width="13" height="10.8" fill="#3c3b6e"/></svg>`;
// the key clause as words with a marker copy each (an.js's recipe), the rest of the reason in .rest spans
const hwords = s => { const w = s.split(/\s+/).filter(Boolean); let o = '';
  w.forEach((x, i) => { const sp = i < w.length - 1; o += `<span class="hw${sp ? ' sp' : ''}">${esc(x)}<i>${esc(x)}</i></span>${sp ? ' ' : ''}` }); return o };
const quote = (keep, hl) => { const i = keep.indexOf(hl); if (i < 0) throw new Error('highlight not in text: ' + hl);
  return `<span class="rest">${esc(keep.slice(0, i))}</span><span class="hlc">${hwords(hl)}</span><span class="rest">${esc(keep.slice(i + hl.length))}</span>` };
const sweep = (el, p) => { const ln = w => w.firstChild.textContent.length + (w.classList.contains('sp') ? 1 : 0), ws = [...el.querySelectorAll('.hw')], n = ws.reduce((s, w) => s + ln(w), 0); let c = 0;
  ws.forEach(w => { const l = ln(w), x = Math.min(1, Math.max(0, (p * n - c) / l)); c += l; w.lastChild.style.clipPath = `inset(-12% ${((1 - x) * 100).toFixed(2)}% -12% 0)`; w.lastChild.style.opacity = x > 0 ? 1 : 0 }) };
const sideTxt = x => `${x.side} <span>(${x.side === 'LONG' ? '+' : '−'}${x.size}%)</span>`;   // owner: "LONG (+4%)"
const ICON = { LEADERBOARD: '<path d="M5 20V10M12 20V4M19 20v-7"/>', FEED: '<path d="M4 5.5h16v10.5H10l-4.5 3.5V16H4z"/><path d="M8 9.5h8M8 12.5h5"/>', 'AI PROFILES': '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.8 14.2c2.4.1 4.1 1.6 4.7 4.8"/>', UPCOMING: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>' };
const S1ORD = ['GPT', 'KIMI', 'CLAUDE', 'GROK'];

// ---- timeline (beats of i4-house) ----
const T = {
  inPh: 0, s1in: B(0) + .1, rowUp: B(3), chip: [B(4), B(5), B(6), B(7)], rowDn: B(7) - .05, s1out: B(7.2),
  s2in: B(8), tabIn: B(8) + .2, tap1: B(10), view: B(10) + .06, s2out: B(15.1),
  qUp: B(16), qMk: B(17), pair: B(19), cUp: B(19), cMk: B(20), s3in: B(20), dn3: B(27.6), s3out: B(27.7),
  flick: B(28.3), gUp: B(29), gMk: B(30), tap2: B(33), s4in: B(33), s4out: B(41.3), gDn: B(41.4),
  endIn: B(42), endLogo: B(42) + .15, endT: B(43), endP: B(44) };
const ARRIVE = [0, 1, 2, 3, 4].map(i => B(10.9) + i * .17);   // the feed's posts arrive one by one after the tap

(async () => {
  D = await fetch('w6/fl/data.json').then(r => r.json());
  const st = document.createElement('style'); st.textContent = L.css; document.head.prepend(st);
  // Season 1: three last rounds, four plain chips each (no reason)
  L.$('#v1').innerHTML = `<div class="vh"><small>LAST MATCHDAY</small><b>Season 1</b></div>` + D.s1.map((r, i) => `<div class="row" id="r${i}"><div class="rh"><img src="${r.logo}" alt=""><b>${r.co}</b><span>${r.t}</span></div>
    <div class="chs">${S1ORD.map(k => `<div class="ch">${mark(k, 22)}<b class="${r.sides[k][0]}">${r.sides[k]}</b></div>`).join('')}</div></div>`).join('');
  // Season 2: the feed, Intuit's five posts (Qwen and Claude first: the split; Grok third: the jargon)
  const co = D.cos.INTU;
  L.$('#v2').innerHTML = `<div class="vh"><small>FEED</small><b>Season 2</b></div><div id="fl">` + D.feed.map((x, i) => `<div class="post" id="p${i}"><div class="ph">${mark(x.k, 40)}<div><b>${x.name}</b><small>${flag(x.flag, 19)}${x.lab}<span class="d">Nov 19</span></small></div></div>
    <div class="pq">${quote(x.keep, x.hl)}</div>
    ${x.plain.length ? `<div class="pt"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg>In plain words<svg class="cv" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div><div class="pp"><div class="ppi"><small>IN PLAIN WORDS<i>our reading</i></small><p>${x.plain.map(esc).join(' ')}</p></div></div>` : ''}
    <div class="tc"><img src="${co.logo}" alt=""><div class="cn"><b>${co.co}</b><span>${x.t}</span><small>${x.conf}% confident</small></div><div class="sd ${x.side[0]}">${sideTxt(x)}</div></div></div>`).join('') + `</div>`;
  L.$('#nav').innerHTML = Object.keys(ICON).map(n => `<div data-n="${n}"><svg viewBox="0 0 24 24">${ICON[n]}</svg>${n}</div>`).join('');
  L.$('#end h3').innerHTML = wordsHTML(CP.e1, 0); L.$('#end p').textContent = CP.e2;
