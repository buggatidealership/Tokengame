<!doctype html><meta charset="utf-8"><title>in 2</title>
<!-- Animation sample in-2 (2026-11-20): the argument, x2p-post-a2.png in motion. The line alone ("Elastic reports after the close"), then
  its halves fly into the card. Four AIs land on the LONG side one after the other, the count ticking; then Qwen lands alone on the SHORT side.
  The two who disagree take a gold ring while the other three step back. Gemini's reason rises and the marker sweeps "despite four straight
  beats"; then Qwen's, a line at a time, and the marker sweeps "not beats" on the bed's drop. The two clauses then light in turn, and the
  camera pulls back to the whole post. The AIs' words as a2 sets them: no punctuation, a line per clause, the words unchanged and checked
  against calls.csv. No P&L: nothing is graded. Bed w8f-horns (174 BPM, first drop at 12.41 s; the horns bed of the Season 2 videos). -->
<style>
:root{--pn:#161312;--pn2:#1d1917;--ln:#2a2522;--tx:#f2ede6;--mu:#8e8680;--mu2:#5f5853;--up:#55d6a2;--dn:#e8576b;--ac:#fdbc2a}
#chrome{position:relative;z-index:27}
#vig{opacity:.55}
#stage{position:absolute;left:0;right:0;top:132px;bottom:0;overflow:hidden;-webkit-mask:linear-gradient(transparent 0,#000 24px);mask:linear-gradient(transparent 0,#000 24px)}
#doc{position:absolute;left:34px;width:1012px;top:0;transform-origin:50% 0}
.pn::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(100deg,transparent 40%,rgba(255,250,235,.16) 50%,transparent 60%);background-size:300% 100%;background-position:var(--sx,150%) 0;opacity:var(--so,0)}
.pn{position:relative;background:var(--pn);border-radius:32px;box-shadow:inset 0 0 0 2px var(--ln),0 26px 70px rgba(0,0,0,.45);overflow:hidden}
.gp{height:26px}
.hd{display:flex;align-items:center;gap:26px;padding:28px 38px;border-bottom:2px solid var(--ln);font:500 28px/1 'Geist Mono';letter-spacing:.08em;color:var(--mu);white-space:nowrap}
.hd .r{margin-left:auto;color:var(--tx)}
.st{display:inline-flex;align-items:center;gap:14px;padding:14px 18px;border-radius:14px;font:700 27px/1 'Geist Mono';letter-spacing:.1em;background:var(--pn2);color:var(--tx);box-shadow:inset 0 0 0 2px var(--ln)}
.st i{width:15px;height:15px;border-radius:50%;background:#f2ede6}
.mt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:36px 28px 32px}
.mt{position:relative}.mt>*{position:relative}
.mt .gw{position:absolute;top:0;bottom:0;pointer-events:none;opacity:0}
.mt .gwL{left:0;width:62%;background:radial-gradient(ellipse 70% 80% at 40% 55%,rgba(85,214,162,.34),rgba(85,214,162,.08) 55%,transparent 75%)}
.mt .gwR{right:0;width:34%;background:radial-gradient(ellipse 75% 80% at 55% 55%,rgba(232,87,107,.42),rgba(232,87,107,.1) 55%,transparent 75%)}
.cn2{display:flex;flex-direction:column;align-items:center;gap:24px}
.sl{display:flex;gap:6px}
.p{display:flex;flex-direction:column;align-items:center;gap:13px;width:122px}
.p b{font:600 32px/1 Inter;white-space:nowrap}.p small{font:500 30px/1 'Geist Mono';color:#d9d2ca;font-variant-numeric:tabular-nums}
.p .rg{position:relative;border-radius:50%}
.p .rg::after{content:"";position:absolute;inset:-7px;border-radius:50%;box-shadow:0 0 0 6px var(--ac),0 0 26px rgba(253,188,42,.5);opacity:var(--ro,0)}
.md{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;align-self:center}
.md .cn{font:800 58px/1 Inter;letter-spacing:-.02em;margin-top:6px}.md .tk{font:500 27px/1 'Geist Mono';color:var(--mu);letter-spacing:.08em}
.md .sc{display:flex;align-items:baseline;gap:12px;font:700 92px/1 'Geist Mono';margin-top:6px;font-variant-numeric:tabular-nums}.md .sc i{font:500 30px/1 'Geist Mono';font-style:normal;color:var(--mu)}
.md .sc b{display:inline-block}
.u{color:var(--up)}.d{color:var(--dn)}
.chip{display:inline-block;font:700 30px/1 'Geist Mono';letter-spacing:.07em;padding:15px 20px 13px;border-radius:13px}
.chip.u{background:#173328;color:var(--up)}.chip.d{background:#3a1a20;color:var(--dn)}
.note{display:flex;justify-content:space-between;padding:20px 38px 22px;border-top:2px solid var(--ln);font:400 25px/1.3 'Geist Mono';color:var(--mu)}
.mh{display:flex;align-items:center;gap:22px;padding:30px 38px 6px;white-space:nowrap}
.mh b{font:700 46px/1 Inter}.mh .r{margin-left:auto;font:500 25px/1 'Geist Mono';letter-spacing:.1em;color:var(--mu)}
.mb{padding:16px 38px 34px}
.mb p{font:400 49px/1.34 Inter;color:#e6e0d8;letter-spacing:-.01em;overflow:hidden}
#line{position:absolute;left:0;right:0;top:0;text-align:center;z-index:30;pointer-events:none}
#line h2{font:900 96px/1.06 Inter;letter-spacing:-.04em;white-space:nowrap}
#line span{display:inline-block;transform-origin:0 0}
</style>
<div id="gnd"></div>
<div id="chrome"></div>
<div id="stage"><div id="doc"></div></div>
<div id="line"><h2><span id="l1">Elastic</span><br><span id="l2">reports after the close</span></h2></div>
<div id="vig"></div><canvas id="grain"></canvas>
<script src="lib.js"></script><script src="w6/an/an.js"></script>
<script>
const DROP = 12.41, DUR = 16.8;
// the AIs' words as a2 sets them; [ ] marks the clause the marker sweeps
const GL = ['Broad software selloff dragged ESTC back to its pre Q1 price [despite four straight beats] and real AI search momentum'];
const QL = ['Market grades Elastic on subscription acceleration', '[not beats]', 'Whisper sits above guidance and Datadog just guided consumption flat'];
const LONGS = ['GPT', 'CLAUDE', 'GROK', 'GEMINI'];
const T_LINE = .12, T_DOCK = 1.0, T_LC = 1.6, PT = [1.95, 2.65, 3.35, 4.05], T_SC = 4.45, T_Q = 4.85, T_NOTE = 5.45, T_RING = 5.75,
  T_B = 6.25, GLN = [6.6], T_GS = 6.95, T_C = 10.45, QLN = [10.8, 11.25, 13.25], T_QS = 11.45, T_TURN = 14.1, T_FIT = 14.9;
const SH = 1218, GAP = 26;
let grain, gl, doc, ps, glines, qlines, A0, BH, CH, B0, C0, GLH, QLH;
(async () => {
  await AN.load();
  L.$('#chrome').innerHTML = AN.brand();
  const C = AN.D.cos.ESTC, tr = k => AN.tr(k, 'ESTC'), G = tr('GEMINI'), Q = tr('QWEN');
  AN.checkLines(G.why, GL); AN.checkLines(Q.why, QL);
  const p = x => `<span class="p" data-k="${x.k}"><span class="rg">${AN.mark(x.k, 84)}</span><b>${x.name}</b><small>${x.side === 'LONG' ? '+' : '−'}${AN.num(x.call)}%</small></span>`;
  const msg = (id, x, ls) => `<div class="gp" id="g${id}"></div><div class="pn" id="${id}"><div class="mh">${AN.mark(x.k, 88)}<b>${x.name}</b><span class="chip ${x.side === 'LONG' ? 'u' : 'd'}">${x.side}</span><span class="r">IN ITS OWN WORDS</span></div><div class="mb">${AN.lines(ls, 'pg')}</div></div>`;
  L.$('#doc').innerHTML = `<div class="pn" id="pa"><div class="hd"><span class="st"><i></i>IN PLAY</span><span>TRADE ${C.s2n}</span><span class="r" id="hdr">REPORTS AFTER THE CLOSE</span></div>
    <div class="mt"><i class="gw gwL"></i><i class="gw gwR"></i><div class="cn2"><span class="chip u" id="cl">LONG</span><div class="sl">${LONGS.map(k => p(tr(k))).join('')}</div></div>
      <div class="md">${AN.co('ESTC', 112, .24)}<span class="cn" id="cnb">${C.co}</span><span class="tk">${C.ticker}</span><span class="sc"><b class="u" id="nl">0</b><i>v</i><b class="d" id="ns">0</b></span></div>
      <div class="cn2"><span class="chip d" id="cs">SHORT</span><div class="sl">${p(Q)}</div></div></div>
    <div class="note"><span>Called move under each name</span><span>Graded Fri at the close</span></div></div>
    ${msg('pb', G, GL)}${msg('pc', Q, QL)}`;
  doc = L.$('#doc'); ps = L.$$('.p'); glines = L.$$('#pb .mb p'); qlines = L.$$('#pc .mb p');
  gl = AN.ground(L.$('#gnd'), 1); grain = L.grain(L.$('#grain'), .07);
  await AN.ready();
  // full heights, measured once; the cards then grow as they arrive (no box bigger than what is in it)
  A0 = L.$('#pa').offsetHeight; GLH = glines.map(e => e.offsetHeight); QLH = qlines.map(e => e.offsetHeight);
  B0 = L.$('#pb').offsetHeight - GLH.reduce((s, h) => s + h, 0); C0 = L.$('#pc').offsetHeight - QLH.reduce((s, h) => s + h, 0);
  window.CUES = [[0.05, 'r11-swell', .14], [T_DOCK, 'sfx-whoosh', .12], [T_LC, 'r11-slide', .08]];
  PT.forEach(t => CUES.push([t, 'r11-card', .1])); CUES.push([T_SC, 'r11-slide', .08], [T_Q, 'sfx-stamp', .24], [T_Q + .05, 'r11-thump', .16], [T_RING, 'sfx-chime', .08],
    [T_B, 'sfx-whoosh', .1], [T_GS, 'r11-slide', .1], [T_C, 'sfx-whoosh', .1], [T_QS, 'r11-slide', .12], [T_QS + .02, 'r11-sparkle', .08], [T_TURN, 'sfx-tick', .06], [T_TURN + .69, 'sfx-tick', .06], [T_FIT, 'sfx-whoosh', .08]);
  window.MUSIC = { f: 'w8f-horns', at: +(DROP - T_QS).toFixed(3) }; window.DUR = DUR;
  const hg = 1 + .08 * 'despite four straight beats'.length, hq = 1 + .08 * 'not beats'.length;
  if (T_C < T_GS + hg) console.error('Gemini hold short'); if (QLN[2] < T_QS + hq) console.error('Qwen hold short');
  await AN.go();
})();
const grow = (h, t0, u) => h * L.eio(L.n(u, t0 - .05, t0 + .32));
const bH = u => u < T_B ? 0 : grow(B0, T_B, u) + GLH.reduce((s, h, i) => s + grow(h, GLN[i], u), 0);
const cH = u => u < T_C ? 0 : grow(C0, T_C, u) + QLH.reduce((s, h, i) => s + grow(h, QLN[i], u), 0);
const gp = (t0, u) => GAP * L.n(u, t0, t0 + .3);
const docH = u => A0 + (u < T_B ? 0 : gp(T_B, u) + bH(u)) + (u < T_C ? 0 : gp(T_C, u) + cH(u));
// the camera: centred while the post fits, then a reading point on the newest card's newest line, held at 720 px; a critically damped
// follow smooths it; after the last line it pulls back to the whole post
const focus = u => { let y = A0 / 2; if (u >= T_B) y = A0 + GAP + B0 + 60; if (u >= T_C) y = A0 + GAP + bH(u) + GAP + C0 - 20; QLN.forEach((t, i) => { if (u >= t - .1) y = A0 + 2 * GAP + bH(u) + C0 + QLH.slice(0, i + 1).reduce((s, h) => s + h, 0) - 30 }); return y };
// while Gemini's words are read the camera keeps leaning towards them (26 px a second up the page), so the hold is never still
const lean = u => 26 * Math.max(0, Math.min(u, T_C) - (T_GS + .3));
const tgt = u => { const H = docH(u); return H + 60 <= SH ? (SH - H) / 2 - lean(u) : Math.max(SH - H - 30, Math.min(30, 720 - focus(u))) };
const camY = t => { let y = tgt(0), v = 0, w = 4.6, dt = 1 / 120; for (let u = 0; u < t; u += dt) { const a = w * w * (tgt(u) - y) - 2 * w * v; v += a * dt; y += v * dt } return y };
window.R = t => {
  grain(t); gl(t);
  { const t0 = T_FIT + .75, q = t < t0 ? 0 : ((t - t0) % 1.6) / 1.2; doc.style.setProperty('--so', t < t0 || q > 1 ? 0 : Math.sin(Math.PI * q).toFixed(3)); doc.style.setProperty('--sx', (150 - 150 * L.eio(Math.min(1, q))).toFixed(1) + '%') }
  // the cards grow with what is in them
  const pb = L.$('#pb'), pc = L.$('#pc');
  pb.style.display = L.$('#gpb').style.display = t < T_B ? 'none' : ''; pc.style.display = L.$('#gpc').style.display = t < T_C ? 'none' : '';
  L.$('#gpb').style.height = gp(T_B, t) + 'px'; L.$('#gpc').style.height = gp(T_C, t) + 'px';
  glines.forEach((e, i) => e.style.height = grow(GLH[i], GLN[i], t).toFixed(1) + 'px'); qlines.forEach((e, i) => e.style.height = grow(QLH[i], QLN[i], t).toFixed(1) + 'px');
  // the camera, then the final pull-back to the whole post
  const H = docH(DUR), fit = Math.min(1, (SH - 50) / H), pk = L.eio(L.n(t, T_FIT, T_FIT + .9)), fy = (SH - H * fit) / 2, sc = L.lerp(1.05, 1, L.eio(L.n(t, 0, T_FIT)));
  doc.style.transform = `translateY(${(L.lerp(camY(t), fy, pk) + 260 * (1 - L.eio(L.n(t, T_DOCK - .1, T_DOCK + .6)))).toFixed(1)}px) scale(${L.lerp(sc, fit, pk).toFixed(4)})`;
  doc.style.opacity = L.n(t, T_DOCK - .05, T_DOCK + .35).toFixed(3);
  L.$('#chrome').style.opacity = L.eio(L.n(t, T_DOCK - .1, T_DOCK + .5));
  // the line alone; its halves fly into the card: the company's name and the header's "reports after the close"
  const li = L.eo(L.n(t, T_LINE, T_LINE + .8)), dk = L.eio(L.n(t, T_DOCK, T_DOCK + .6)), ln = L.$('#line');
  const rise = 1 - Math.pow(1 - L.n(t, T_LINE, T_DOCK + .3), 2); ln.style.transform = `translateY(${(500 + 100 * (1 - rise)).toFixed(1)}px) scale(${(1 + .05 * L.n(t, T_LINE, T_DOCK)).toFixed(4)})`;
  const l1 = L.$('#l1'), l2 = L.$('#l2'); l1.style.transform = l2.style.transform = 'none';
  [[l1, L.$('#cnb')], [l2, L.$('#hdr')]].forEach(([a, b]) => { const s = a.getBoundingClientRect(), d = b.getBoundingClientRect(), k = d.height / s.height;
    a.style.transform = `translate(${(dk * (d.left - s.left)).toFixed(1)}px,${(dk * (d.top - s.top)).toFixed(1)}px) scale(${L.lerp(1, k, dk).toFixed(4)})`;
    a.style.opacity = (L.cl(li * 1.6) * (1 - L.n(t, T_DOCK + .45, T_DOCK + .6))).toFixed(3); b.style.opacity = L.n(t, T_DOCK + .45, T_DOCK + .6).toFixed(3) });
  L.$('.hd .st').style.opacity = L.$$('.hd>span')[1].style.opacity = L.n(t, T_DOCK + .5, T_DOCK + .85);
  L.$('.md .col').style.opacity = L.n(t, T_DOCK + .2, T_DOCK + .6); L.$('.md .tk').style.opacity = L.n(t, T_DOCK + .5, T_DOCK + .8); L.$('.md .sc').style.opacity = L.n(t, T_LC, T_LC + .3);
  // the sides: the LONG label, four AIs one after the other; the SHORT label, Qwen alone with a harder landing; the counts tick
  const chipIn = (el, t0) => { const q = L.n(t, t0, t0 + .25); el.style.opacity = q > 0 ? 1 : 0; el.style.transform = `scale(${L.lerp(1.5, 1, L.eo5(q)).toFixed(3)})` };
  chipIn(L.$('#cl'), T_LC); chipIn(L.$('#cs'), T_SC);
  const land = [...PT, T_Q]; let nl = 0, ns = 0;
  ps.forEach((e, i) => { const t0 = land[i], hard = i === 4, sp = L.spring(t - t0, hard ? 2.2 : 1.8, hard ? 6 : 8);
    e.style.opacity = t < t0 ? 0 : L.cl((t - t0) * 4).toFixed(3); e.style.transform = t < t0 ? '' : `translateY(${((hard ? -300 : 320) * (1 - sp)).toFixed(1)}px) scale(${L.lerp(hard ? 1.6 : .8, 1, L.cl(sp)).toFixed(3)})`;   // each AI rises into its side; Qwen drops onto the SHORT side
    if (t >= t0 + .1) i < 4 ? nl++ : ns++;
    // the two who disagree take a gold ring; the other three step back
    const k = e.dataset.k, sp2 = k === 'GEMINI' || k === 'QWEN', r = L.eio(L.n(t, T_RING, T_RING + .4));
    e.querySelector('.rg').style.setProperty('--ro', sp2 ? r : 0); if (t >= t0 + .5) e.style.opacity = sp2 ? 1 : (1 - .45 * r).toFixed(3) });
  const bump = (el, v, tl) => { el.textContent = v; el.style.opacity = v ? 1 : .3; const q = L.n(t, tl, tl + .3); el.style.transform = `scale(${(1 + .3 * Math.sin(Math.PI * q)).toFixed(3)})` };
  bump(L.$('#nl'), nl, (nl ? PT[nl - 1] : -9) + .1); bump(L.$('#ns'), ns, T_Q + .1);
  // each trade lands with a pulse of its side's light, and the side's light grows with the count (the LONG side fills green, one AI at a time;
  // Qwen's lone SHORT lands with a harder red pulse); it settles to a low glow when the two who disagree take their rings
  const pulse = ts => ts.reduce((s, t0) => s + (t >= t0 ? Math.exp(-(t - t0) * 3.2) : 0), 0), settle = 1 - .6 * L.n(t, T_RING, T_RING + .8);
  L.$('.gwL').style.opacity = Math.min(1, (.12 * nl + .55 * pulse(PT)) * settle).toFixed(3); L.$('.gwR').style.opacity = Math.min(1, (.3 * ns + .9 * pulse([T_Q])) * settle).toFixed(3);
  L.$('.note').style.opacity = L.n(t, T_NOTE, T_NOTE + .35);
  { const k = t > T_Q ? Math.exp(-(t - T_Q) * 8) * Math.sin((t - T_Q) * 55) * 7 : 0; L.$('#pa').style.transform = `translate(${k.toFixed(1)}px,${(k * .5).toFixed(1)}px)` }
  // the reasons: each card rises; its lines come in one after the other; the marker sweeps the clause; then the two clauses light in turn
  [[pb, T_B, glines, GLN], [pc, T_C, qlines, QLN]].forEach(([c, t0, ls, tl]) => { const sp = L.spring(t - t0, 1.6, 7.5); c.style.opacity = L.cl((t - t0) * 2.6).toFixed(3); c.style.transform = `translateY(${(110 * (1 - sp)).toFixed(1)}px)`;
    ls.forEach((e, i) => { const q = L.n(t, tl[i], tl[i] + .45); e.style.opacity = q.toFixed(3); e.style.transform = `translateY(${(32 * (1 - L.eo(q))).toFixed(1)}px)` }) });
  AN.sweep(L.$('#pb .hlc'), L.eio(L.n(t, T_GS, T_GS + .6))); AN.sweep(L.$('#pc .hlc'), L.eio(L.n(t, T_QS, T_QS + .32)));
  const BT2 = 2 * 60 / 174, k = t < T_TURN ? -1 : Math.floor((t - T_TURN) / BT2), on = k < 0 || k >= 2 ? -1 : k % 2;   // Gemini, then Qwen, then both
  [[L.$('#pb .hlc'), 0], [L.$('#pc .hlc'), 1]].forEach(([h, j]) => { const lit = on === -1 || on === j; h.querySelectorAll('i').forEach(i => { i.style.filter = lit ? 'none' : 'brightness(.55) saturate(.6)' });
    h.style.textShadow = ''; h.parentElement.closest('.pn').style.boxShadow = on === j ? 'inset 0 0 0 3px rgba(253,188,42,.75),0 26px 70px rgba(0,0,0,.45)' : '' });
};
</script>
