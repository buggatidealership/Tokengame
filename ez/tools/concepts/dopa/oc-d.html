<!doctype html><meta charset="utf-8"><title>The close, concept D: the board</title>
<!-- Season 2 outcome video, concept D "diegetic" (owner, 2026-11-20: "everything is integrated within the animation"). Brief: the lead's
  scratchpad oc/BRIEF.md. Every word and number lives on a surface in one painted world: the trading hall of the EZ exchange
  (w6/oc-d/hall.webp, Hedra gpt-image-2 in the bet chip's recipe, the board's face and the nameplate painted blank), its split-flap board,
  its gold nameplate, its clock and its closing bell (w6/oc-d/bell.webp, keyed off flat blue). No floating card, no overlay type: the
  only thing outside the world is the PREVIEW tag, as close.html has it.
  The story: before 4 pm the board posts what each AI traded (one company a bar, the most confident AI's reason on the board's wire row),
  the clock jumps a minute every bar, the bell rings on the drop (4 pm), the moves flap in on the CLOSE row, right trades light and wrong
  ones go dark, every P&L spins to its total, and the board re-flaps into the Season 2 leaderboard, P&L after 3 trades.
  Same contract as close.html: window.R(t), window.READY, DUR, MUSIC, CUES, lib.js. Data: data/close-<date>.json (all numbers),
  w6/oc-d/lines.json (the approved short lines and each call's confidence, from data/s2-calls/calls.csv). m2-phonk at 130 BPM, its drop
  (14.79 s in the file) on the bell, TR = beat 32 = 14.77 s.
  ?q=0 leaves the wire row's reasons out (the board posts sides only). Words on screen: no punctuation of any kind; sides are LONG or
  SHORT; every number carries its label (the column heads P&L and the row head CLOSE). -->

<script>
L.$('#base').textContent = L.css;
const Q = new URLSearchParams(location.search), DATE = Q.get('d') || '2026-11-20', QUOTES = Q.get('q') !== '0';
const BEAT = 60 / 130, BAR = 4 * BEAT, TR = 32 * BEAT, B = n => TR + n * BEAT;
const T_TITLE = .25, T_NAMES = 4 * BEAT, T_CO = 6 * BEAT, CO_LEN = 8 * BEAT, T_SORT = B(8), T_LEAD = B(10) + .1;
const CX = 768;                                   // the board's centre line in the painting
const SPIN = { c: .42, w: .32, g: .3 }, STEP = .055;
const POOL = { c: 'ABCDEFGHIKLMNOPRSTUVWXYZ0123456789$%+', w: ['LONG', 'SHORT', 'CLOSE', 'GROK', 'QWEN', 'GPT', 'GEMINI', 'CLAUDE', ''] };
let D, LN, MOD, grain, mods = [], W = L.$('#w'), board = L.$('#board');
const money0 = v => v === 0 ? '$0' : L.money(v);
const hash = (a, b) => { let h = (a * 2654435761 ^ b * 40503) >>> 0; h = (h ^ h >>> 13) * 1274126177 >>> 0; return h };
const mark = (k, s) => { const m = MOD[k]; return `<svg width="${s}" height="${s}" viewBox="-4 -4 32 32" style="border-radius:${s * .2}px;background:${m.bg}"><path d="${m.d}" fill="${m.fg}"${m.fr ? ' fill-rule="evenodd"' : ''}/></svg>` };
// a module: kind c (one character), w (a word or a line), g (a logo or mark); sched [[t, value, meta]], landed values render, spins scramble
const mk = (kind, x, y, w, h, fs, opt = {}) => { const el = document.createElement('div'); el.className = 'm' + (kind === 'g' ? ' lg' : '') + (opt.cls ? ' ' + opt.cls : '');
  el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  el.innerHTML = `<div class="t" style="font-size:${fs}px${opt.al ? ';justify-content:' + opt.al + ';padding:0 ' + (opt.pad || 0) + 'px' : ''}"></div><div class="ff"></div>${opt.lamp ? '<div class="lp"></div>' : ''}`;
  board.insertBefore(el, L.$('#lead')); const o = { el, t: el.firstChild, ff: el.children[1], lp: el.querySelector('.lp'), kind, sched: [], id: mods.length, last: null, opt }; mods.push(o); return o };

const drawMod = (o, t) => { const s = o.sched; let k = -1; for (let i = 0; i < s.length; i++) if (s[i][0] <= t) k = i;
  const cur = k < 0 ? ['', '', {}] : s[k], dt = k < 0 ? 99 : t - cur[0], sp = SPIN[o.kind] * (o.opt.slow || 1);
  let key, h, meta = cur[2];
  if (dt < sp) { const n = Math.floor(dt / STEP), ph = (dt % STEP) / STEP;
    if (o.kind === 'c') { const P = POOL.c; h = P[hash(o.id, n) % P.length]; meta = {} }
    else if (o.kind === 'w') { const P = o.opt.pool || POOL.w; h = P[hash(o.id, n) % P.length]; meta = {} }
    else { h = ''; meta = {} }
    key = 'spin' + n; o.ff.style.opacity = 1; o.ff.style.transform = `scaleY(${Math.cos(ph * Math.PI / 2).toFixed(3)})` }
  else { key = 'v' + k; h = html(o, cur[1]); o.ff.style.opacity = 0 }
  if (o.last !== key) { o.t.innerHTML = h; o.last = key; o.t.className = 't' + (dt >= sp && meta.cls ? ' ' + meta.cls : '') }
  return { dt, sp, meta, landed: dt >= sp && k >= 0 } };
// the board's layout, in the painting's pixels inside the frame's face (1096 x 623)
const G = { rk: [14, 36], mkc: [56, 56], nm: [118, 152], co: [282, 486, 690], cw: 192, pl: [894, 188], yH: 14, yC: 124, yR: i => 190 + i * 69, rh: 63, yW: 546, wh: 63 };
const setup = () => {
  const N = D.rounds.length;
  if (D.preview) { const pv = L.$('#pv'); pv.style.display = 'block'; const c = clockOf(D.total); pv.textContent = ['PREVIEW', 'PRICES AT ' + c + ' ET', 'NOT FINAL'].join(' ') }
  // the plate: the owner's title, later the board's name
  const title = N === 1 ? 'First trade of Season 2' : `First ${N} trades of Season 2`;
  L.$('#pl0').textContent = L.$('#pi0').textContent = D.before ? `Season 2 trades ${D.before + 1} to ${D.after}` : title;
  L.$('#pl1').textContent = L.$('#pi1').textContent = 'Season 2 leaderboard';
  // the header row: each company's logo flap over its name flap; the P&L column head
  const M = {}; M.hdr = []; M.hdrN = []; M.mov = []; M.rows = []; M.wire = {};
  [G.rk, G.mkc, G.nm].forEach(([x, w]) => mk('w', x, G.yH, w, 98, 30));                     // blank modules: the board's own stock
  D.rounds.forEach((r, j) => { const x = G.co[j];
    const lgo = mk('g', x + G.cw / 2 - 31, G.yH, 62, 60, 0, { ls: 52 }); at(lgo, T_CO + j * CO_LEN, 'co:' + r.logo); M.hdr.push(lgo);
    const nm = mk('w', x, G.yH + 64, G.cw, 34, 26, { fmt: v => v ? `${v.split(' ')[0]}<span class="tk">${v.split(' ')[1]}</span>` : '', pool: ['', 'INTUIT INTU', 'KEYSIGHT KEYS', 'ELASTIC ESTC'] });
    at(nm, T_CO + j * CO_LEN + .05, r.co.toUpperCase() + ' ' + r.ticker); M.hdrN.push(nm) });
  mk('w', G.pl[0], G.yH, G.pl[1], 60, 30); const plh = mk('w', G.pl[0], G.yH + 64, G.pl[1], 34, 26); at(plh, T_NAMES, 'P&L');
  // the CLOSE row: its label, the moves in character flaps
  mk('w', G.rk[0], G.yC, G.rk[1], 56, 30); mk('w', G.mkc[0], G.yC, G.mkc[1], 56, 30);
  const cl = mk('w', G.nm[0], G.yC, G.nm[1], 56, 32); at(cl, T_NAMES + .04, 'CLOSE');
  D.rounds.forEach((r, j) => { const cs = [], w = 28, g = 3, x0 = G.co[j] + (G.cw - (6 * w + 5 * g)) / 2;
    for (let c = 0; c < 6; c++) { const o = mk('c', x0 + c * (w + g), G.yC, w, 56, 40, { slow: 1.4 }); cs.push(o) }
    const s = r.pct.padStart(6, ' '); cs.forEach((o, c) => at(o, TR + .1 + j * .16 + c * .03, s[c] === ' ' ? '' : s[c], { cls: r.move < 0 ? 'd' : 'u' })); M.mov.push(cs) });
  mk('w', G.pl[0], G.yC, G.pl[1], 56, 30);
  // the five AI rows: rank, mark, name, a side per company, the P&L in character flaps
  const ord0 = D.ais.map(a => a.k), ord1 = D.order, pnl = D.season1;
  for (let s = 0; s < 5; s++) { const y = G.yR(s), row = {};
    row.rk = mk('c', G.rk[0], y, G.rk[1], G.rh, 38);
    row.mk = mk('g', G.mkc[0], y + 3.5, G.mkc[1], 56, 0, { ls: 46 });
    row.nm = mk('w', G.nm[0], y, G.nm[1], G.rh, 36, { pool: ['GPT', 'CLAUDE', 'GROK', 'GEMINI', 'QWEN', ''] });
    row.sd = D.rounds.map((r, j) => mk('w', G.co[j] + 16, y, G.cw - 32, G.rh, 42, { lamp: 1, pool: ['LONG', 'SHORT', ''] }));
    row.pl = []; { const w = 21.5, g = 2.4, x0 = G.pl[0] + G.pl[1] - (8 * w + 7 * g); for (let c = 0; c < 8; c++) row.pl.push(mk('c', x0 + c * (w + g), y, w, G.rh, 36)) }
    M.rows.push(row);
    const tn = T_NAMES + s * BEAT / 5, a0 = ord0[s], a1 = ord1[s], ts = T_SORT + s * .07, nm = k => D.ais.find(a => a.k === k).name.toUpperCase();
    at(row.mk, tn, a0); at(row.nm, tn + .03, nm(a0));
    if (a1 !== a0) { at(row.mk, ts, a1); at(row.nm, ts + .03, nm(a1)) }
    at(row.rk, ts + .02, String(s + 1));
    D.rounds.forEach((r, j) => { const c0 = r.calls.find(c => c.k === a0), c1 = r.calls.find(c => c.k === a1), o = row.sd[j];
      at(o, T_CO + j * CO_LEN + .9 + s * .1, c0.side, { cls: c0.side === 'LONG' ? 'u' : 'd', right: c0.right, j });
      if (a1 !== a0 && c1.side !== c0.side) at(o, ts + .04 * (j + 1), c1.side, { cls: c1.side === 'LONG' ? 'u' : 'd', right: c1.right, j, re: 1 });
      else if (a1 !== a0) o.sched.push([ts + .04 * (j + 1), c1.side, { cls: c1.side === 'LONG' ? 'u' : 'd', right: c1.right, j, re: 1, hold: 1 }]) });
    const put = (t0, v, cls) => { const s8 = money0(v).padStart(8, ' '); row.pl.forEach((o, c) => at(o, t0 + c * .025, s8[c] === ' ' ? '' : s8[c], { cls })) };
    put(tn + .12, 0, '');
    put(TR + 1.3 + s * .09, pnl[a0], pnl[a0] > 0 ? 'u' : pnl[a0] < 0 ? 'd' : '');
    if (a1 !== a0) put(ts + .1, pnl[a1], pnl[a1] > 0 ? 'u' : pnl[a1] < 0 ? 'd' : '') }
  // the wire row: the most confident AI's reason for each company as it posts; at the end the board's line
  { const y = G.yW; mk('c', G.rk[0], y, G.rk[1], G.wh, 36); M.wire.mk = mk('g', G.mkc[0], y + 3.5, G.mkc[1], 56, 0, { ls: 46 });
    M.wire.nm = mk('w', G.nm[0], y, G.nm[1], G.wh, 34, { pool: ['GPT', 'CLAUDE', 'GROK', 'GEMINI', 'QWEN', ''] }); M.wire.ch = [];
    const w = 24, g = 1, x0 = G.co[0]; for (let c = 0; c < 32; c++) M.wire.ch.push(mk('c', x0 + c * (w + g), y, w, G.wh, 34));
    const line = (t0, s, cls) => { const u = s.toUpperCase().padEnd(32, ' '); M.wire.ch.forEach((o, c) => at(o, t0 + c * .018, u[c] === ' ' ? '' : u[c], { cls })) };
    if (QUOTES) D.rounds.forEach((r, j) => { const ls = LN[r.ticker], k = Object.keys(ls).sort((a, b) => ls[b].conf - ls[a].conf)[0], t0 = T_CO + j * CO_LEN + .15;
      at(M.wire.mk, t0, k); at(M.wire.nm, t0 + .03, D.ais.find(a => a.k === k).name.toUpperCase()); line(t0 + .08, ls[k].line, '') });
    at(M.wire.mk, TR + .05, ''); at(M.wire.nm, TR + .05, ''); line(TR + .05, '', '');
    line(T_SORT + .45, `P&L after ${D.after} trades`, '') }
  window.M = M;
  // the clock face's mark: the house logo under the centre, where the hands never rest
  const C = window.CUES = [[0.05, 'r11-swell', .12], [T_TITLE, 'r11-sparkle', .08], [T_NAMES, 'r11-card', .1]];
  for (let n = 0; n < 8; n++) C.push([+(n * BAR + .001).toFixed(3), 'sfx-tick', .07]);
  D.rounds.forEach((r, j) => { const t0 = T_CO + j * CO_LEN; C.push([+t0.toFixed(3), 'r11-slide', .12], [+(t0 + .9).toFixed(3), 'r11-card', .1]) });
  C.push([TR - 1.6, 'sfx-riser', .12], [TR, 'sfx-bell', .32], [TR + .12, 'r11-slide', .12], [TR + .9, 'sfx-stamp', .16], [TR + 1.35, 'r11-kaching', .18], [TR + 1.45, 'r11-sparkle', .08],
    [T_SORT, 'sfx-whoosh', .12], [T_SORT + .05, 'r11-slide', .12], [T_LEAD, 'sfx-chime', .14], [T_LEAD + .05, 'r11-sparkle', .1]);
  window.MUSIC = { f: 'm2-phonk', at: +(14.79 - TR).toFixed(3) }; window.DUR = 22;
};
const clockOf = m => { const tot = 16 * 60 + Math.round(m), mm = tot % 1440; let h = Math.floor(mm / 60); const mi = mm % 60, ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + String(mi).padStart(2, '0') + ' ' + ap };
// the camera: [t, centre x, centre y, scale] in the painting's pixels, eased between keys
const CAM = () => [[0, 772, 610, 1.2], [1.7, 772, 640, 1.16], [2.75, CX, 1010, .975], [6.4, CX, 1018, .982], [10.1, CX, 1024, .985], [13.7, CX, 1030, .985],
  [14.45, CX, 820, .955], [TR + .7, CX, 840, .965], [TR + 2.2, CX, 960, .985], [T_SORT, CX, 960, .985], [22, CX, 920, .985]];
const camAt = t => { const K = CAM(); let i = 1; while (i < K.length - 1 && K[i][0] < t) i++; const a = K[i - 1], b = K[i], x = L.eio(L.n(t, a[0], b[0])); return [0, 1, 2, 3].map(q => L.lerp(a[q], b[q], x)).slice(1) };
window.R = t => {
  grain(t);
  // the camera, with the bell's knock

  W.style.transform = `translate(${(540 - cx * s + kick).toFixed(2)}px,${(675 - cy * s + kick * .5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  // the plate: the title engraved in behind a glint; at the sort, the board's name
  const p0 = L.eo(L.n(t, T_TITLE, T_TITLE + .7)), p1 = L.eo(L.n(t, T_SORT, T_SORT + .7));
  const clip = (a, b) => `inset(0 ${(100 - 100 * a).toFixed(2)}% 0 ${(100 * b).toFixed(2)}%)`;
  ['#pl0', '#pi0'].forEach(q => L.$(q).style.clipPath = clip(p0, p1)); ['#pl1', '#pi1'].forEach(q => L.$(q).style.clipPath = clip(p1, 0));
  const gq = t < T_SORT - .2 ? p0 : p1, gl = L.$('#pgl'); gl.style.left = (-120 + 763 * gq) + 'px'; gl.style.opacity = gq > 0 && gq < 1 ? .9 : 0;
