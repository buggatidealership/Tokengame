<!doctype html><meta charset="utf-8"><title>LONG vs SHORT, the fight card</title>
<!-- Season 2 outcome video, concept c: LONG VS SHORT, the fight card (oc BRIEF.md, 2026-11-20). One close told as a fight night: every
  company is a bout in a painted prize ring (w6/oc-c/ring.webp, Hedra gpt-image-2, the S2 recipe: ink, gold key light, the green corner
  cushion on the left = LONG, the red one on the right = SHORT). The content is grouped by side, not by AI.
  Order: the bouts go from the smallest move to the biggest, so the biggest move is the main event and its bell lands on the bed's drop.
  The beats (m2-phonk, 130 BPM, drop at 14.79 s in the file = TD here, MUSIC.at 0; beat B(n) = TD + n x 60/130):
   0.12  the title alone on the hanging scoreboard; B(-30..-28) the night's three bouts land on the canvas, LONG marks against SHORT marks
   B(-25) bout 1 (3.25), B(-15) bout 2 (7.87), B(-5) the main event (12.48). Each bout, 10 beats:
     +0    the company on the scoreboard, the AIs walk to their corners (LONG left, SHORT right), each with its called move
     +0.5  the LONG corner's case in a balloon (its boldest call speaks), +1.5 the SHORT corner's case
     +1.5..5 the real price path as a tug of war on the top rope: the tag is the stock's live move, pulled toward LONG when the stock is up
           and toward SHORT when it is down (one square-root scale for the night), the pull lit in green or red, the ground it covered faint
     +5    the bell (5.56, 10.17, 14.79 = the drop): the final move stamped, the winning corner lit (gold rims, its cushion glows), every
           AI's called move turns into its signed P&L, the losing corner dimmed; held 2.3 s
   B(5)  the Season 2 leaderboard (17.10), P&L after 3 trades, each AI's three trades as lit or dimmed company marks; B(9) the leader's gold
         rim (18.94); 21.8 s in all.
  Holds (1 s + 0.08 s a character): the longest case line, 32 characters, is up 3.72 s (3.56 needed); each P&L 1.98 s (1.88 needed).
  Words on screen: no punctuation; sides are LONG or SHORT only; every number carries its label; $100K on every trade. -->

<script>
L.$('#base').textContent = L.css;
const Q = new URLSearchParams(location.search), DATE = Q.get('d') || '2026-11-20', SHOWCALL = Q.get('called') !== '0';   // ?called=0: no called moves before the bell (fewer words)
const GN = '#55d6a2', RD = '#e8576b', AU = '#fdbc2a', CR = '#f2ede6', MU = '#a49a90';
const BPM = 130, BT = 60 / BPM, TD = 14.79, B = n => TD + n * BT;      // TD: the main event's bell, on the bed's drop
const T_TITLE = .12, T_BILL = [B(-30), B(-29), B(-28)], S0 = B(-25), BOUT = 10 * BT, T_LB = B(5), T_LEAD = B(9), DUR = 21.8;
const A_LONG = .5 * BT, A_SHORT = 1.5 * BT, OUT = .2;           // the two cases land on the off-beats; a bout fades in its last .2 s

const CW_Y = 556, BAL_Y = 664, TILE_Y = 850, TH = 84, TG = 10, COLX = { LONG: 50, SHORT: 560 }, BALX = { LONG: 184, SHORT: 560 }, BALW = 336;
// the approved reason lines (oc BRIEF.md table, verbatim); a corner's case is spoken by its boldest call (the biggest called move)
const LINES = {
  INTU: { GPT: 'Higher QuickBooks prices lift sales', CLAUDE: 'Its own guide says growth slows', GROK: 'AI fear outlasts a beat', GEMINI: 'Down 52% this year bounce due', QWEN: 'Priced for AI ruin' },
  KEYS: { GPT: 'Orders ran ahead of shipments', CLAUDE: 'Keeps beating its own guide', GROK: 'Not sold off enough yet', GEMINI: 'Supply limits and a broken chart', QWEN: 'Orders up 56% low bar' },
  ESTC: { GPT: 'Cloud sales up 27%', CLAUDE: 'Down 27% backlog still rising', GROK: 'AI adoption better than feared', GEMINI: 'Four straight beats sold anyway', QWEN: 'Datadog just guided flat' } };
let D, MOD, grain, BO, VMAX, EL = {};
const sc = () => L.$('#sc');
// the pull: up is toward LONG (left), down toward SHORT (right); one scale for the night, square-rooted so a 2% fight still swings
// visibly while the biggest move still pulls furthest (order kept; the tag carries the exact figure)
const PULL = v => -Math.sign(v) * Math.sqrt(Math.min(1, Math.abs(v) / VMAX)) * KMAX;
const add = (h, p = sc()) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };
const put = (el, x, y, s = 1, o = 1, ex = '') => { if (!(o > .001)) { if (el._d !== 0) { el.style.display = 'none'; el._d = 0 } return 0 } if (el._d !== 1) { el.style.display = ''; el._d = 1 }
  el.style.opacity = o >= 1 ? '' : o.toFixed(3); el.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${s.toFixed(4)})${ex}`; return 1 };
const mark = (k, s) => { const m = MOD[k]; return `<svg class="mk" width="${s}" height="${s}" viewBox="-4 -4 32 32" style="border-radius:${s * .26}px;background:${m.bg};box-shadow:0 0 0 ${Math.max(1.5, s * .035)}px rgba(242,237,230,.24),0 10px 22px rgba(0,0,0,.5)"><path d="${m.d}" fill="${m.fg}"${m.fr ? ` fill-rule="${m.fr}" clip-rule="${m.fr}"` : ''}/></svg>` };
const NAME = k => D.ais.find(a => a.k === k).name.toUpperCase();
const called = v => (v < 0 ? '−' : '+') + (+Math.abs(v).toFixed(2)) + '%';
const glass = (cls, w, h, inner, r = 28) => add(`<div class="ab gl ${cls}" style="width:${w}px;height:${h}px;border-radius:${r}px"><div class="in">${inner}</div><i class="rim" style="border-radius:${r + 2}px"></i></div>`);
const RIM = (a, c = '253,188,42') => `conic-gradient(from ${a.toFixed(1)}deg,rgba(${c},.95) 0deg,#fff6d6 16deg,rgba(${c},.9) 38deg,rgba(${c},.45) 170deg,#ffedb8 196deg,rgba(${c},.45) 222deg,rgba(${c},.95) 360deg)`;
// a balloon's outline: rounded box w x h plus a tail from its bottom edge to the tip (tx, ty), all in the balloon's own frame
const balPath = (w, h, r, b0, b1, tx, ty) => `M${r} 0H${w - r}Q${w} 0 ${w} ${r}V${h - r}Q${w} ${h} ${w - r} ${h}H${b1}L${tx} ${ty}L${b0} ${h}H${r}Q0 ${h} 0 ${h - r}V${r}Q0 0 ${r} 0Z`;
const setup = () => {
  // the bouts: smallest move first, the biggest move is the main event
  BO = D.rounds.map(r => r).sort((a, b) => Math.abs(a.move) - Math.abs(b.move));
  VMAX = Math.max(...BO.flatMap(r => (r.path || [[0, r.move]]).map(p => Math.abs(p[1]))), ...BO.map(r => Math.abs(r.move))) * 1.03;
  BO.forEach((r, k) => {
    r.k = k; r.s = S0 + k * BOUT; r.p0 = r.s + 1.5 * BT; r.p1 = r.s + 5 * BT; r.e = r.s + BOUT; r.main = k === BO.length - 1;
    r.win = r.move > 0 ? 'LONG' : r.move < 0 ? 'SHORT' : null;
    // the path in compressed time: each step weighs at most 10 minutes, so the dark hours between sessions pass fast
    const P = r.path || [[0, 0], [D.total, r.move]]; let acc = 0; r.cum = P.map((p, i) => i ? (acc += Math.min(10, p[0] - P[i - 1][0])) : 0); r.P = P;
    r.at = u => { const c = u * acc; let i = 1; while (i < P.length && r.cum[i] < c) i++; if (i >= P.length) return r.move; const a = r.cum[i - 1], b = r.cum[i]; return L.lerp(P[i - 1][1], P[i][1], b > a ? (c - a) / (b - a) : 1) };
    r.side = { LONG: [], SHORT: [] }; r.calls.forEach(c => r.side[c.side].push(c));
    ['LONG', 'SHORT'].forEach(sd => { const A = r.side[sd]; if (!A.length) return; const sp = A.reduce((m, c) => Math.abs(c.call) > Math.abs(m.call) ? c : m, A[0]);
      r.side[sd] = [sp, ...A.filter(c => c !== sp)]; r['sp' + sd] = sp });
  });
  // the hanging scoreboard: one glass sheet, three faces
  EL.jb = glass('', 600, 220, `<div id="jbT"><div class="k sh">First 3 trades<br>of Season 2</div></div>
    <div id="jbB"></div><div id="jbL"><div class="k sh">Season 2 leaderboard</div><div class="bb">P&amp;L after ${D.after} trades</div></div>`);
  EL.jb.id = 'jb'; EL.jbT = L.$('#jbT'); EL.jbB = L.$('#jbB'); EL.jbL = L.$('#jbL');
  EL.cab = add(`<svg class="lay" viewBox="0 0 1080 1350"><g stroke="#0b0b0d" stroke-width="5"><line id="cb1"/><line id="cb2"/></g><g stroke="rgba(253,188,42,.45)" stroke-width="1.5"><line id="cb3"/><line id="cb4"/></g></svg>`);
  EL.jb.parentNode.appendChild(EL.jb);
  BO.forEach(r => { r.jb = `<img src="${r.logo}" alt=""><div class="tx">${r.main ? '<div class="bb lb">MAIN EVENT</div>' : ''}<div class="k nm sh">${r.co}</div><div class="bb tk">${r.ticker}</div></div>` });
  // the corner words, lettered beside the painted cushions
  EL.cwL = add(`<div class="ab k cw sh" style="color:${GN}">LONG</div>`); EL.cwR = add(`<div class="ab k cw sh" style="color:${RD};transform-origin:100% 50%">SHORT</div>`);
  // the night's card: every bout as LONG marks against SHORT marks
  EL.bill = BO.map(r => { const ms = sd => r.calls.filter(c => c.side === sd).map(c => `<span class="ring" style="box-shadow:0 0 0 3px ${sd === 'LONG' ? GN : RD};display:block;border-radius:12px">${mark(c.k, 46)}</span>`).join('');
    // the LONG marks end under the LONG word's right side, the SHORT marks start under SHORT's left; the company sits between, centred
    const el = glass('bill', 780, 104, `<div class="sd" style="right:${780 - 245}px">${ms('LONG')}</div>
      <div class="co"><img src="${r.logo}" alt=""><div class="t"><div class="k nm">${r.co}</div><div class="bb tk">${r.ticker}</div></div></div>
      <div class="sd" style="left:535px">${ms('SHORT')}</div>`, 24);
    if (r.main) { el.style.overflow = 'visible'; el.insertAdjacentHTML('beforeend', '<div class="bb me">MAIN EVENT</div>') } return el });
  // the fighters and their cases, bout by bout
  BO.forEach(r => {
    r.tiles = []; r.bal = {};
    ['LONG', 'SHORT'].forEach(sd => r.side[sd].forEach((c, i) => {
      const el = glass('tile', 470, TH, `<span class="mkw">${mark(c.k, 60)}</span><span class="k nm">${NAME(c.k)}</span>
        <span class="vb"><span class="bb">CALLED</span><span class="m">${called(c.call)}</span></span>`, 22);
      el._c = c; el._sd = sd; el._i = i; el._lab = el.querySelector('.vb .bb'); el._val = el.querySelector('.vb .m'); el._mk = el.querySelector('.mkw'); el._nm = el.querySelector('.nm'); el._vb = el.querySelector('.vb'); r.tiles.push(el) }));
    ['LONG', 'SHORT'].forEach(sd => { const sp = r['sp' + sd]; if (!sp) return;
      const txt = (LINES[r.ticker] || {})[sp.k] || ''; if (!txt) return;
      const el = add(`<div class="bal"><div class="fr"></div><svg></svg><div class="tx">${txt}</div></div>`); el._sd = sd; r.bal[sd] = el });
  });
  // the tag on the rope
  EL.kn = glass('', 176, 80, `<span class="bb"></span><span class="m"></span>`, 22); EL.kn.id = 'kn'; EL.knT = EL.kn.querySelector('.bb'); EL.knV = EL.kn.querySelector('.m');
  // the leaderboard: P&L after the night, each AI's trades as lit or dimmed company marks (in the order they were fought)
  EL.lb = D.order.map((k, i) => { const rec = BO.map(r => { const c = r.calls.find(x => x.k === k); return `<img src="${r.logo}" alt="" style="${c.right ? `box-shadow:0 0 0 3px ${GN}` : 'opacity:.45;filter:grayscale(1)'}">` }).join('');
    const v = D.season1[k]; const el = glass('lbr', 712, 128, `<span class="m rk">${i + 1}</span><span class="mkw">${mark(k, 72)}</span><span class="k nm">${NAME(k)}</span><span class="rec">${rec}</span>
      <span class="m pl" style="color:${v > 0 ? GN : v < 0 ? RD : CR}">${v === 0 ? '$0' : L.money(v)}</span>`, 26); el._k = k; return el });
  // chrome
  L.chrome(document.body); const bug = L.$('.bug'); bug.querySelector('b').remove(); bug.style.display = 'flex'; bug.style.alignItems = 'center';
  L.$('.fine').textContent = '$100K on every trade' + '  ' + 'not advice';
  if (D.preview) { const pv = L.$('#pv'), c = clock(D.total); pv.style.display = 'block'; pv.textContent = ['PREVIEW', 'PRICES AT ' + c + ' ET', 'NOT FINAL'].join(' ') }
  EL.cgL = L.$('#cgL'); EL.cgR = L.$('#cgR'); EL.veil = L.$('#veil');
  EL.cgL.style.background = 'radial-gradient(closest-side,rgba(85,214,162,.8),rgba(85,214,162,.25) 50%,rgba(85,214,162,0) 75%)';
  EL.cgR.style.background = 'radial-gradient(closest-side,rgba(232,87,107,.85),rgba(232,87,107,.28) 50%,rgba(232,87,107,0) 75%)';
  // sound and bed
  const C = window.CUES = [[.05, 'r11-swell', .12]];
  T_BILL.forEach(t => C.push([+t.toFixed(3), 'r11-card', .1]));
  BO.forEach(r => { C.push([+(r.s - .05).toFixed(3), 'sfx-whoosh', .14], [+(r.s + A_LONG).toFixed(3), 'r11-pluck', .1], [+(r.s + A_SHORT).toFixed(3), 'r11-pluck', .1], [+(r.p0 + .2).toFixed(3), 'r11-slide', .1],
    [+r.p1.toFixed(3), 'sfx-bell', r.main ? .32 : .24], [+(r.p1 + .1).toFixed(3), 'sfx-stamp', .22], [+(r.p1 + .45).toFixed(3), 'r11-kaching', r.main ? .2 : .14]) });
  C.push([+(T_LB - .05).toFixed(3), 'sfx-whoosh', .14], [+T_LB.toFixed(3), 'r11-thump', .14], [+T_LEAD.toFixed(3), 'sfx-chime', .14], [+(T_LEAD + .05).toFixed(3), 'r11-sparkle', .1]);
  window.MUSIC = { f: 'm2-phonk', at: +(14.79 - TD).toFixed(3) }; window.DUR = DUR;
};
const wd = el => { if (el._d === 0) { el.style.display = ''; el._d = 1 } return el.offsetWidth };
const clock = m => { const tot = 16 * 60 + Math.round(m), mm = tot % 1440; let h = Math.floor(mm / 60); const mi = mm % 60, ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + String(mi).padStart(2, '0') + ' ' + ap };
// a balloon: glass, its tail to the speaker's mark
const drawBal = (el, x, y, w, tipX, tipY) => { const tx = el.querySelector('.tx'); tx.style.width = (w - 44) + 'px'; tx.style.transform = 'translate(22px,16px)';
  const h = Math.ceil(tx.offsetHeight + 34); if (el._h !== h || el._w !== w) { el._h = h; el._w = w;
