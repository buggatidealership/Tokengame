<!doctype html><meta charset="utf-8"><title>EZ season switch</title>
<!-- The season switch film (night studio, 2026-11-20), kit S2-A Glass. One phone shows the real EZ Terminal (screens shot from the mockup page
  tools/concepts/night/season/ by its cap.js, 3x, so lifted rows stay sharp); a fingertip taps "Season 2" at the top and the page re-sets in Season
  2's kit on m3-electro's kick (7.77 s, beat 16); Gemini and Qwen lift out as new rows, Kimi's relegated row slides in; the camera returns to the
  header while the fingertip taps "Season 1" and the page wipes back, the mark never moving (RESEARCH.md switch rule 6); the end card is the mark.
  The transition frames are the real View Transition of the mockup, paused and stepped every 1/30 s (cap.js), not a re-creation.
  Single-minded line: one tap at the top switches seasons, and each season has its own look over the same mark.
  Brand: the house bug top left from frame 0 (a signature); the mark in the scene (the terminal's header) centred in the middle 60% of the frame
  from 0 s, 3.41 s and 12.61 s, plus the end card. Every cut and move on m3-electro's grid (124 BPM, beat 0.4839 s, first beat 0.025 s). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@1,700;1,800;1,900&family=Manrope:wght@600;700;800&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden;background:#07090e;color:#f8f0d9;font-family:Manrope,sans-serif}
#st{position:absolute;inset:0;overflow:hidden}
#gnd{position:absolute;left:-60px;top:-75px;width:1200px;height:1500px;background:url(w6/nt/season/ground.jpg) center/cover;transform-origin:50% 40%}
#veil{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 45%,rgba(7,9,14,.15),rgba(7,9,14,.62))}
#pulse{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;background:radial-gradient(90% 34% at 30% 0%,rgba(3,200,112,.55),transparent 72%),radial-gradient(90% 34% at 70% 100%,rgba(255,58,49,.5),transparent 72%)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(60% 40% at 60% 20%,rgba(248,240,217,.55),rgba(253,188,42,.18) 45%,transparent 75%);mix-blend-mode:screen}
/* the phone (fl-feed.html's device) */
#phw{position:absolute;left:0;top:0;transform-origin:0 0}
#ph{position:absolute;left:0;top:0;width:390px;height:844px}
#ph .body{position:absolute;inset:-14px;border-radius:66px;background:linear-gradient(145deg,#5a605c 0%,#1d201e 13%,#0b0d0c 32%,#0b0d0c 68%,#1c1f1d 87%,#4b514d 100%);box-shadow:0 60px 120px rgba(0,0,0,.7),0 -20px 60px -26px rgba(40,200,130,.4),0 22px 70px -26px rgba(255,60,70,.36),inset 0 0 0 2px rgba(255,255,255,.12),inset 0 6px 6px -4px rgba(90,235,170,.55),inset 0 -6px 6px -4px rgba(255,84,94,.5)}
#ph .body::after{content:'';position:absolute;inset:8px;border-radius:59px;box-shadow:0 0 0 2px #020302,0 0 0 3px rgba(255,255,255,.05)}
#scr{position:absolute;inset:0;border-radius:52px;overflow:hidden;background:#060a08}
#si{position:absolute;left:0;top:0;width:390px;height:844px;display:block}
#isl{position:absolute;left:50%;top:11px;width:104px;height:30px;margin-left:-52px;border-radius:18px;background:#000;z-index:5}
.glare{position:absolute;inset:0;border-radius:52px;background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.035) 18%,rgba(255,255,255,.09) 30%,rgba(255,255,255,.02) 41%,transparent 50%,transparent 74%,rgba(255,255,255,.04) 86%,transparent 100%);background-size:230% 230%;background-repeat:no-repeat;pointer-events:none;z-index:6}
/* lifted rows: the real rows, out of the phone onto glass */
.lf{position:absolute;left:0;top:0;transform-origin:0 0;display:none;border-radius:22px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.85),0 0 0 1.5px rgba(248,240,217,.16),0 0 40px rgba(253,188,42,.0)}
.lf img{display:block;width:100%;height:100%}
.lf.k1{border-radius:6px}
/* the fingertip on the glass */
#td{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.62),rgba(255,255,255,.3) 62%,rgba(255,255,255,.05));box-shadow:0 0 0 1.5px rgba(255,255,255,.4),0 6px 18px rgba(0,0,0,.45);opacity:0;z-index:30}
#tr{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2.5px solid rgba(255,255,255,.75);opacity:0;z-index:30}
/* the lines, on a sheet of glass (the Season 2 kit's own material) */
#ln{position:absolute;left:90px;right:90px;bottom:70px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 30px 30px;border-radius:30px;z-index:20;
  background:linear-gradient(180deg,rgba(30,32,41,.74),rgba(12,14,20,.84));backdrop-filter:blur(22px);box-shadow:inset 0 1.5px 0 rgba(248,240,217,.22),inset 0 0 0 1px rgba(248,240,217,.08),0 30px 60px -24px rgba(0,0,0,.9)}
#ln small{display:block;font:800 30px/1 Manrope;letter-spacing:.18em;color:#fdbc2a;text-transform:uppercase}
#ln h2{font:italic 800 78px/1 Kanit;text-transform:uppercase;letter-spacing:.005em;text-align:center;white-space:nowrap}
#ln h2 span{display:inline-block}
/* the house bug: a signature in one fixed corner (s2d.html's) */
#bug{position:absolute;left:44px;top:44px;display:flex;align-items:center;gap:16px;z-index:40}
#bug img{width:64px;height:64px}
#bug span{font:italic 800 31px/1 Kanit;letter-spacing:.01em;color:#f2ede6}
/* the end card: the mark */
#end{position:absolute;left:0;right:0;top:380px;display:flex;flex-direction:column;align-items:center;gap:30px;opacity:0;z-index:25}
#end img{width:300px;height:300px}
#end b{font:italic 800 76px/1 Kanit;letter-spacing:.01em}
#end b i{font-style:inherit}#end .e{color:#03c870}#end .z{color:#ff3a31}
#end small{font:800 34px/1 Manrope;letter-spacing:.2em;color:#fdbc2a;text-transform:uppercase}
#grain{position:absolute;inset:0;width:1080px;height:1350px;mix-blend-mode:overlay;pointer-events:none;z-index:50;opacity:.06}
</style>
<div id="st">
  <div id="gnd"></div><div id="veil"></div><div id="pulse"></div>
  <div id="phw"><div id="ph"><div class="body"></div><div id="scr"><img id="si" alt=""><div id="isl"></div><div class="glare"></div></div></div></div>
  <div class="lf" id="lfGrok1"><img src="w6/nt/season/el-s1-grok.png" alt=""></div>
  <div class="lf" id="lfGem"><img src="w6/nt/season/el-s2-gemini.png" alt=""></div>
  <div class="lf" id="lfQwen"><img src="w6/nt/season/el-s2-qwen.png" alt=""></div>
  <div class="lf" id="lfKimi"><img src="w6/nt/season/el-s2-kimi.png" alt=""></div>
  <div id="flash"></div>
  <div id="ln"><small></small><h2></h2></div>
  <div id="end"><img src="ezlogo.svg" alt=""><b><i class="e">E</i>ARNINGS <i class="z">Z</i>EASON</b><small>Season 2 live now</small></div>
  <div id="td"></div><div id="tr"></div>
  <div id="bug"><img src="ezlogo.svg" alt=""><span>EARNINGS ZEASON</span></div>
  <canvas id="grain"></canvas>
</div>
<script>
const $ = s => document.querySelector(s), cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), n = (t, a, b) => cl((t - a) / (b - a)), lerp = (a, b, x) => a + (b - a) * x;
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const spr = x => x <= 0 ? 0 : x >= 1.6 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(2 * Math.PI * 1.35 * x);
const BT = 60 / 124, B = k => .025 + k * BT;          // m3-electro's grid
const DUR = 20.6, TAP1 = B(16), TAP2 = B(30), STEP = 1 / 30, NF = 31;
let EL = null;
/* the camera: z = phone zoom; (fx, fy) a point on the 390x844 screen placed at (px, py) on the frame. Each move starts on a beat. */
const CAM = [
  [0,      1.92, 150, 142, 500, 430],    // the header, Season 1: the mark and the switch big
  [B(3),   1.60, 195, 466, 540, 640],   // down to the board: Grok on top
  [B(6),   1.02, 195, 422, 540, 660],   // the whole phone
  [B(7),   2.30, 160, 138, 520, 560],    // up to the switch
  [B(9),   2.38, 180, 139, 520, 565],
  [B(12),  2.50, 200, 139, 520, 570],    // the fingertip arrives
  [B(16),  2.50, 200, 139, 520, 570],    // tap, on the kick
  [B(16) + .12, 1.70, 195, 306, 540, 560], // the page re-sets: pull out as it resolves
  [B(18),  1.06, 195, 422, 540, 652],   // the whole phone in Season 2
  [B(20),  .86, 195, 422, 540, 690],    // back, so the rows can lift
  [B(24),  .82, 195, 422, 545, 700],
  [B(26),  2.30, 160, 138, 520, 560],    // the header again: same mark
  [B(28),  2.42, 130, 139, 560, 565],    // toward Season 1
  [B(30),  2.42, 130, 139, 560, 565],    // tap back
  [B(30) + .12, 1.62, 195, 466, 540, 640], // Season 1's board
  [B(32),  1.50, 195, 516, 540, 660],
  [B(34),  1.04, 195, 422, 540, 650],   // the whole phone
  [B(36),  .98, 195, 422, 540, 660],
  [B(37),  .62, 195, 422, 540, 1500],   // it drops away for the mark
];
function camAt(t) { let i = 0; while (i < CAM.length - 1 && CAM[i + 1][0] <= t) i++; const a = CAM[i], prev = CAM[i - 1];
  const p = prev || a, d = i === 0 ? 1 : Math.min(.62, a[0] - p[0] > 0 ? a[0] - p[0] : .62), k = i === 0 ? 1 : eio(n(t, a[0], a[0] + (a[0] === B(16) + .12 || a[0] === B(30) + .12 ? .7 : d)));
  const v = j => lerp(p[j], a[j], k);
  // a slow drift so the frame never freezes (a fraction of a pixel per frame), on top of the move
  const dz = .012 * Math.sin(t * .9), dx = 6 * Math.sin(t * .55), dy = 5 * Math.cos(t * .47);
  return { z: v(1) * (1 + dz), fx: v(2), fy: v(3), px: v(4) + dx, py: v(5) + dy } }
function place(c) { const w = $('#phw'); w.style.transform = `translate(${(c.px - c.fx * c.z).toFixed(2)}px,${(c.py - c.fy * c.z).toFixed(2)}px)`; $('#ph').style.zoom = c.z.toFixed(4) }
const toF = (c, sx, sy) => [c.px + (sx - c.fx) * c.z, c.py + (sy - c.fy) * c.z];
/* the screen: which real screen shows at t */
function screenAt(t) { if (t < TAP1) return 'w6/nt/season/s1.jpg'; if (t < TAP1 + NF * STEP) return 'w6/nt/season/up-' + String(Math.floor((t - TAP1) / STEP)).padStart(2, '0') + '.jpg';
  if (t < TAP2) return 'w6/nt/season/s2.jpg'; if (t < TAP2 + NF * STEP) return 'w6/nt/season/bk-' + String(Math.floor((t - TAP2) / STEP)).padStart(2, '0') + '.jpg'; return 'w6/nt/season/s1.jpg' }
/* the lines: [from, to, kicker, line] (no punctuation; at most 8 words; held 1 s + 0.08 s a character or more) */
const LN = [[0, B(6), 'Season 1', 'Grok wins'], [B(7), B(15), 'One tap', 'New season new look'], [B(16), B(20), '', 'Season 2'],
  [B(20), B(26), 'Two new AIs', 'Kimi out'], [B(26), B(32), 'Same mark', 'Same colours'], [B(32), B(37), 'One tap away', 'Season 1 stays']];
function lines(t) { const L = LN.find(x => t >= x[0] && t < x[1]), e = $('#ln');
  if (!L) { e.style.opacity = 0; return } const k = eo(n(t, L[0], L[0] + .32)) * (1 - eio(n(t, L[1] - .18, L[1])));
  e.style.opacity = k.toFixed(3); e.style.transform = `translateY(${((1 - eo(n(t, L[0], L[0] + .4))) * 40).toFixed(1)}px)`;
  if (e.dataset.k !== L[3]) { e.dataset.k = L[3]; e.querySelector('small').textContent = L[2]; e.querySelector('small').style.display = L[2] ? 'block' : 'none';
    e.querySelector('h2').innerHTML = L[3].split(' ').map(w => '<span>' + w + '</span>').join(' ') }
  // the words of the line arrive one by one, on a 0.12 s step
  e.querySelectorAll('h2 span').forEach((s, i) => { const kk = eo(n(t, L[0] + .06 + i * .12, L[0] + .36 + i * .12)); s.style.opacity = kk.toFixed(3); s.style.transform = `translateY(${((1 - kk) * 18).toFixed(1)}px)` }) }
/* a fingertip at a screen point */
function touch(c, sx, sy, k, pr, rp) { const [x, y] = toF(c, sx, sy), d = $('#td'), r = $('#tr'); d.style.opacity = (cl(k) * .95).toFixed(3);
  d.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(1.2 - .2 * cl(k) - .22 * (pr || 0)).toFixed(3)})`;
  r.style.opacity = rp > 0 && rp < 1 ? (.85 * (1 - rp)).toFixed(3) : 0; r.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(1 + 2 * eo(rp || 0)).toFixed(3)})` }
function finger(t, c) { const s2 = EL.s1.sw2, s1 = EL.s2.sw1;
  if (t > B(10) && t < TAP1 + .7) { const x = s2[0] + s2[2] * .5, y = s2[1] + s2[3] * .55, a = eo(n(t, B(10), B(12))), off = 1 - a;
    touch(c, x + off * 120, y + off * 210, a * (1 - n(t, TAP1 + .25, TAP1 + .6)), n(t, B(15), TAP1) * (1 - n(t, TAP1, TAP1 + .15)), n(t, TAP1, TAP1 + .6)); return }
  if (t > B(27) && t < TAP2 + .7) { const x = s1[0] + s1[2] * .5, y = s1[1] + s1[3] * .55, a = eo(n(t, B(27), B(28.5))), off = 1 - a;
    touch(c, x - off * 60, y + off * 230, a * (1 - n(t, TAP2 + .25, TAP2 + .6)), n(t, B(29), TAP2) * (1 - n(t, TAP2, TAP2 + .15)), n(t, TAP2, TAP2 + .6)); return }
  $('#td').style.opacity = 0; $('#tr').style.opacity = 0 }
/* a lift: the real row grows out of its place on the screen (or from the phone's foot) to a place on the frame, then settles back */
function lift(id, t, up, dn, src, tgt, c) { const o = $(id), kU = spr(n(t, up, up + .9) * 1.6), kD = eio(n(t, dn, dn + .42)), k = kU * (1 - kD);
  if (t < up || (t > dn + .42)) { o.style.display = 'none'; return 0 } o.style.display = 'block';
  const [sx, sy] = toF(c, src[0], src[1]), sw = src[2] * c.z, sh = src[3] * c.z, w = lerp(sw, tgt[2], k), h = w * src[3] / src[2];
  const x = lerp(sx, tgt[0] - tgt[2] / 2, k), y = lerp(sy, tgt[1], k);
  o.style.width = w.toFixed(1) + 'px'; o.style.height = h.toFixed(1) + 'px'; o.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${(tgt[3] || 0) * k}deg)`;
  o.style.opacity = (k < .02 ? 0 : 1); return k }
let grainF = null;
window.R = async t => {
  const c = camAt(t); place(c);
  const src = screenAt(t), si = $('#si'); if (si.dataset.s !== src) { si.dataset.s = src; si.src = src; try { await si.decode() } catch (e) {} }
  // the ground drifts; the light pulses on every kick once the beat is in
  const g = $('#gnd'); g.style.transform = `scale(${(1.04 + .03 * Math.sin(t * .23)).toFixed(4)}) translate(${(8 * Math.sin(t * .31)).toFixed(1)}px,${(6 * Math.cos(t * .27)).toFixed(1)}px)`;
  const ph = ((t - .025) / BT) % 1, kick = t >= TAP1 ? Math.exp(-ph * 5.5) : .12 * Math.exp(-ph * 6);
  $('#pulse').style.opacity = (t >= TAP1 && t < B(37) ? .18 + .5 * kick : .08 + kick).toFixed(3);
  $('#flash').style.opacity = (Math.max(0, 1 - n(t, TAP1, TAP1 + .5)) * (t >= TAP1 ? .85 : 0) + Math.max(0, 1 - n(t, TAP2, TAP2 + .4)) * (t >= TAP2 ? .45 : 0)).toFixed(3);
  // the screen behind the lifts dims and blurs
  const dim = Math.max(eio(n(t, B(20), B(20) + .5)) * (1 - eio(n(t, B(25.6), B(26)))), eio(n(t, B(3), B(3) + .4)) * (1 - eio(n(t, B(5.6), B(6)))) * .7);
  $('#ph').style.filter = dim > .01 ? `blur(${(dim * 5).toFixed(2)}px) brightness(${(1 - .42 * dim).toFixed(3)})` : 'none';
  $('.glare').style.backgroundPosition = `${(20 + 60 * n(t, 0, DUR)).toFixed(1)}% 0`;
  // Season 1: Grok's row on top; Season 2: the two new rows, then Kimi out
  lift('#lfGrok1', t, B(3), B(5.6), EL.s1['row-GROK'], [540, 520, 900, -1.2], c);
  lift('#lfGem', t, B(20), B(25.6), EL.s2['row-GEMINI'], [540, 330, 900, -1.5], c);
  lift('#lfQwen', t, B(21), B(25.6), EL.s2['row-QWEN'], [540, 540, 900, 1.2], c);
  lift('#lfKimi', t, B(22.5), B(25.6), [EL.s2kimi[0], 844, EL.s2kimi[2], EL.s2kimi[3]], [540, 760, 860, -.8], c);
  finger(t, c); lines(t);
  // the end card: the phone falls away, the mark arrives and holds
  const ke = eo(n(t, B(37) + .15, B(38) + .2)); const e = $('#end'); e.style.opacity = ke.toFixed(3); e.style.transform = `translateY(${((1 - ke) * 50).toFixed(1)}px) scale(${(.94 + .06 * ke + .01 * Math.sin(t * 2)).toFixed(4)})`;
  $('#phw').style.opacity = (1 - n(t, B(37) + .1, B(38))).toFixed(3);
  if (grainF) grainF(t) };
// grain tiles, picked by frame so renders repeat
(function () { const cv = $('#grain'), W = 540, H = 675; cv.width = W; cv.height = H; const tiles = []; for (let k = 0; k < 6; k++) { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'), im = x.createImageData(W, H); let s = 1234 + k * 977; const r = () => (s = (s * 16807) % 2147483647) / 2147483647; for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255 } x.putImageData(im, 0, 0); tiles.push(c) } grainF = t => cv.getContext('2d').drawImage(tiles[Math.floor(t * 24) % 6], 0, 0) })();
window.DUR = DUR;
window.MUSIC = { f: 'm3-electro', at: 0 };
// sounds: the EZ chime as the sonic mark at the start (a placeholder until the owner picks one), the taps, a whoosh per lift, the riser into the kick
window.CUES = [[.12, 'sfx-chime', .12], [B(16), 'sfx-riser', .1], [TAP1, 'sfx-tap', .16], [B(3), 'sfx-whoosh', .06], [B(20), 'sfx-whoosh', .08], [B(21), 'sfx-whoosh', .07], [B(22.5), 'sfx-whoosh', .07], [TAP2, 'sfx-tap', .14], [B(37), 'r11-swell', .09]];
(async () => { EL = await fetch('w6/nt/season/el.json').then(r => r.json()); await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => 0)));
  // warm the screens so a frame never waits on a first decode
  const all = ['s1', 's2'].concat([...Array(NF).keys()].map(i => 'up-' + String(i).padStart(2, '0')), [...Array(NF).keys()].map(i => 'bk-' + String(i).padStart(2, '0')));
  await Promise.all(all.map(f => { const im = new Image(); im.src = 'w6/nt/season/' + f + '.jpg'; return im.decode().catch(() => 0) }));
  await window.R(0); window.READY = 1 })();
</script>
