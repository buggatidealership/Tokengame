<!doctype html><meta charset="utf-8"><title>Season 1 report cards</title>
<!-- Take C of the Season 1 conclusion, round 3 (owner, 2026-11-18; WRAP-BRIEF.md "Round 3" and "Round 3b"): by character, the loud one.
  Full-bleed colour cards cut hard on the beat. Every scene shows at most two data points about one subject (P1), at most 12 words (P2),
  as one centred block (P3); a held scene drifts 1 to 1.03 and breathes on the beat (P5); content is cut, not squeezed (P6).
  The run: the premise, the report cards from last place to first (each AI: its P&L; BULL or BEAR with its lean; for the relegated and
  the first also the hit rate against 50%), two big rounds (the move, then the one AI that stood out), the lesson (the stocks fell, the
  bears were paid, shorting everything), the table built from the bottom one row a beat, and the gold winner card. No Season 2 card:
  one small line. Every number from data/wrap.json (node prep-wrap.js); ?final=1 only forces the final labels.
  Bed s1-c (Hedra elevenlabs-music): 140.0 BPM, bed beat k at 0.414 s + k x 0.4286 s, the full beat enters on bed beat 21, the drop's
  downbeat is bed beat 61 (26.56 s), the last phrase starts on bed beat 125 (53.99 s), the track ends at 56.1 s (all measured). The bed
  plays from 0, so the video's beat m sits 15 ms after bed beat m - 1: the first report card lands on the beat coming in (m 22), the
  first-place card on the drop (m 62), the winner on the last phrase (m 126).
  window.R(t), READY, CUES, MUSIC, DUR as the other pages. -->

<script>
const q = new URLSearchParams(location.search), G = '#55d6a2', Rd = '#e8576b', Au = '#fdbc2a', Cr = '#f2ede6', K = '#0e0c0b';
const cam = L.$('#cam'), add = (h, p = cam) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };
const BT = 60 / 140, b = x => +(x * BT).toFixed(4);             // s1-c: 140.0 BPM (measured)
let D, FIN, DUR, SC = [], C = [], grain, FT, FL, FLT = [], WIN;
const mk = (k, s) => L.mark(k, s, false), money = L.money, up = s => s.toUpperCase(), ai = k => D.ai.find(a => a.k === k);
const names = ks => { const n = ks.map(k => up(ai(k).name)); return n.length < 2 ? n[0] : n.slice(0, -1).join(', ') + ' AND ' + n.at(-1) };
// a scene: the stretch between two cuts. lab = the small label top left, blk = the one centred block of content.
function scene(m0, len, bg, dark, lab, blk, draw, extra = '') { const el = add(`<div class="sc ${dark ? 'lt' : 'dk'}" style="background:${bg}"><div class="in">${lab ? `<div class="lab">${lab}</div>` : ''}${blk}${extra}</div></div>`);
  const s = { el, inn: el.firstElementChild, m0, m1: m0 + len, t0: b(m0), t1: b(m0 + len), dark, i: SC.length, draw, shake: 0, $: x => el.querySelector(x), $$: x => [...el.querySelectorAll(x)] }; SC.push(s); return s }
// arrivals: pure functions of dt (seconds since the element's beat), settled within 0.5 s
const slam = (el, dt, from = 1.35) => { el.style.opacity = dt >= 0 ? 1 : 0; if (dt >= 0) el.style.transform = `scale(${from + (1 - from) * L.spring(dt, 2.3, 10)})` };
const pop = (el, dt) => { el.style.opacity = dt >= 0 ? 1 : 0; if (dt >= 0) el.style.transform = `scale(${.5 + .5 * L.spring(dt, 2.6, 9)})` };
const rise = (el, dt, dy = 50, d = .26, o = 1) => { const k = L.eo5(L.n(dt, 0, d)); el.style.opacity = dt >= 0 ? o * Math.min(1, k * 2.5) : 0; el.style.transform = `translateY(${(1 - k) * dy}px)` };
const cnt = (v, k) => (v < 0 ? '−' : '+') + '$' + Math.round(Math.abs(v) * k).toLocaleString('en-US');
const grow = (el, dt, d = .45) => { el.style.transform = `scaleX(${L.eo5(L.n(dt, 0, d))})` };

function build() {
  const rev = [...D.ai].reverse(), n4 = D.ai.length, lead = D.ai[0]; let m = 0;
  // 1. the hook (22 beats, the bed's quiet intro): the premise is whole on the first frame
  scene(m, 9, Cr, false, '', `<div class="blk" style="gap:44px"><div class="mrow">${D.ai.map(a => mk(a.k, 180)).join('')}</div>
    <div class="un"><div class="x" data-g="h1" data-f="940">${n4} AIs TRADED</div><div class="x" data-g="h1">${D.total} EARNINGS</div><div class="x" data-g="h1">REPORTS.</div></div></div>`, function (dt) {
    this.$('.un').style.transform = `scale(${1 + .04 * (1 - L.eo5(L.n(dt, 0, .5)))})`; this.$$('.mrow .mk').forEach((e, j) => { const d = dt - b(j); e.style.transform = `scale(${1 + (d >= 0 ? .14 * Math.exp(-d * 9) * Math.cos(d * 14) : 0)})` }) });
  C.push([.03, 'r11-thump', .18], [b(1), 'r11-knock', .1], [b(2), 'r11-knock', .1], [b(3), 'r11-knock', .1]); m += 9;
  scene(m, 7, K, true, '', `<div class="blk">${[['PAPER MONEY.', Au], ['REAL CALLS.', G], ['PUBLIC RECORD.', Cr]].map(([w, c]) => `<div class="bnd" style="background:${c}"><div class="x" data-g="h2" data-f="940">${w}</div></div>`).join('')}</div>`, function (dt) {
    this.$$('.bnd').forEach((e, j) => { const d = dt - b(j); e.style.opacity = d >= 0 ? 1 : 0; e.style.transform = `scaleX(${L.eo5(L.n(d, 0, .22))})`; slam(e.firstElementChild, d - .06) }) });
  C.push([b(m), 'r11-thump', .2], [b(m + 1), 'r11-thump', .2], [b(m + 2), 'r11-thump', .2]); m += 7;
  scene(m, 6, Au, false, '', `<div class="blk" style="gap:26px"><div class="tt"><div class="x" data-g="tt" data-f="948">THE</div><div class="x" data-g="tt">REPORT</div><div class="x" data-g="tt">CARDS.</div></div><div class="sl">LAST PLACE FIRST</div></div>`, function (dt) {
    slam(this.$('.tt'), dt - .02); this.$('.tt').style.transformOrigin = '0 50%'; rise(this.$('.sl'), dt - .1, 20, .2, .62) });
  C.push([b(m), 'r11-thump', .2], [b(m + 6), 'sfx-riser', .1]); m += 6;
  // 2. the report cards, last place to first: 40 beats before the leader (the bed's groove), the leader on the drop
  const relFirst = rev.slice(0, -1).find(a => D.releg.includes(a.k));
  rev.forEach(a => { const first = a.rank === 1, rel = D.releg.includes(a.k), three = first || a === relFirst, bg = a.pnl >= 0 ? G : Rd, sh = a.lean === 'BEAR', N = up(a.name), nn = sh ? a.shorts : a.longs;
    const la = first ? 4 : 4, lb = 6, lc = first ? 5 : 10;
    scene(m, la, bg, false, `<span>#${a.rank} OF ${n4}</span>`, `<div class="blk" style="gap:34px"><div class="nr un">${mk(a.k, 240)}<div class="x" data-g="nm" data-f="664">${N}</div></div><div class="n" data-g="pn" data-f="940">${cnt(a.pnl, 1)}</div><div class="sl">SEASON P&amp;L · $100K A TRADE</div></div>`, function (dt) {
      slam(this.$('.nr'), dt - .02, 1.25); const pn = this.$('.n'); slam(pn, dt - .04, 1.25); pn.textContent = cnt(a.pnl, L.eo(L.n(dt, 0, .4))); rise(this.$('.sl'), dt - .1, 16, .2, .62) });
    C.push([b(m), first ? 'sfx-boom' : 'r11-thump', first ? .28 : .22]); if (first) FLT.push(b(m)); m += la;
    scene(m, lb, bg, false, `${mk(a.k, 60)}<span>${N} · #${a.rank} OF ${n4}</span>`, `<div class="blk" style="gap:30px"><div class="x vd" data-g="vd" data-f="940">${a.lean}</div><div class="x ln" data-g="ln" data-f="940">${sh ? 'SHORT' : 'LONG'} ON ${nn} OF ${a.calls}</div><div class="pb"><i style="width:${nn / a.calls * 100}%"></i></div></div>`, function (dt) {
      slam(this.$('.vd'), dt - .02); rise(this.$('.ln'), dt - .17, 40); this.$('.pb').style.opacity = L.n(dt, .17, .3); grow(this.$('.pb i'), dt - .2) });
    C.push([b(m), 'r11-knock', .16]); m += lb;
    if (three) { scene(m, lc, bg, false, mk(a.k, 60), `<div class="blk" style="gap:26px"><div class="x hp" data-g="hp">${a.hit}%</div><div class="hbw"><div class="pb"><i style="width:${a.hitx}%"></i></div><i class="tk"></i><i class="tk2" style="background:${bg}"></i><div class="t50 sl">50%</div></div>
        <div class="hl">${rel ? `<div class="x" data-g="hl" data-f="940">${N} WAS WRONG MORE</div><div class="x" data-g="hl">OFTEN THAN RIGHT.</div>` : '<div class="x" data-g="hl">CALLS RIGHT.</div>'}</div></div>`, function (dt) {
        const hp = this.$('.hp'); slam(hp, dt - .02); hp.textContent = Math.round(a.hit * L.eo(L.n(dt, 0, .4))) + '%'; grow(this.$('.pb i'), dt - .02, .5); rise(this.$('.hl'), dt - b(.75), 40);
        const st = this.$('.stamp'); if (st) { const ds = dt - b(5); st.style.opacity = ds >= 0 ? 1 : 0; if (ds >= 0) st.style.transform = `rotate(-5deg) scale(${1 + 1.4 * (1 - L.spring(ds, 2.2, 10))})`; this.shake = ds >= 0 ? Math.exp(-ds * 9) * Math.sin(ds * 70) * 12 : 0 } },
        rel ? '<div class="stamp"><b>RELEGATED.</b></div>' : '');
      C.push([b(m), 'r11-knock', .16]); if (rel) C.push([b(m + 5), 'sfx-boom', .24], [b(m + 5), 'r11-knock', .2]); m += lc } });
  // 3. two big rounds: the biggest moves on which one AI stood alone (right or wrong); each: the move, then that AI and its P&L
  const solo = D.big.filter(x => x.right.length === 1 || x.wrong.length === 1), rounds = [...solo, ...D.big.filter(x => !solo.includes(x))].slice(0, 2);
  rounds.forEach(x => { const CO = up(x.co), nr = x.right.length, nw = x.wrong.length, who = nr === 1 ? x.right : nw === 1 ? x.wrong : nr === 0 ? x.wrong : x.right, p = x.p[who[0]], bg = p >= 0 ? G : Rd;
    const v = nr === 1 ? [`ONLY ${names(who)}`, `WAS ${x.side[who[0]]}.`] : nw === 1 ? [`ONLY ${names(who)}`, 'MISSED.'] : nr === 0 ? ['ALL FOUR', 'GOT IT WRONG.'] : [names(who), 'CALLED IT.'];
    scene(m, 4, K, true, `<span>ROUND ${x.n}</span>`, `<div class="blk" style="gap:34px"><div class="nr un"><div class="lg"${x.dark ? ' style="background:#1d1917"' : ''}>${x.logo ? `<img src="${x.logo}">` : ''}</div><div class="x" data-g="co" data-f="664">${CO}</div></div><div class="n mv" data-g="mv" data-f="940" style="color:${x.move < 0 ? Rd : G}">${L.pct(x.move)}</div></div>`, function (dt) {
      slam(this.$('.nr'), dt - .02, 1.25); const mv = this.$('.mv'); slam(mv, dt - .04, 1.25); mv.textContent = L.pct(x.move * L.eo(L.n(dt, 0, .4))) });
    C.push([b(m), 'r11-thump', .22]); m += 4;
    scene(m, 6, bg, false, `<div class="lgs">${x.logo ? `<img src="${x.logo}">` : ''}</div><span>ON ${CO}</span>`, `<div class="blk" style="gap:30px"><div class="ms">${who.map(k => mk(k, who.length > 1 ? 150 : 200)).join('')}</div><div class="un"><div class="x rv" data-g="rv" data-f="940">${v[0]}</div><div class="x rv" data-g="rv">${v[1]}</div></div><div class="n" data-g="rp" data-f="940">${cnt(p, 1)}</div></div>`, function (dt) {
      pop(this.$('.ms'), dt - .02); slam(this.$('.un'), dt - .02, 1.25); const pn = this.$('.n'); slam(pn, dt - b(1), 1.25); pn.textContent = cnt(p, L.eo(L.n(dt, b(1), b(1) + .4))) });
    C.push([b(m), 'r11-knock', .16], [b(m + 1), 'r11-thump', .18]); m += 6 });
  // 4. the lesson: the stocks fell, the bears were paid, shorting everything
  const dp = D.mkt.down / (D.mkt.down + D.mkt.up) * 100, bears = D.ai.filter(a => a.lean === 'BEAR'), bulls = D.ai.filter(a => a.lean === 'BULL'), clean = bears.length && bulls.length && bears.every(a => a.pnl > 0) && bulls.every(a => a.pnl < 0), beat = D.mkt.short > lead.pnl;
  scene(m, 9, Rd, false, '', `<div class="blk" style="gap:24px"><div class="x big">${D.mkt.down}</div><div class="un"><div class="x l1" data-g="l1" data-f="940">OF ${D.rounds} STOCKS</div><div class="x l1" data-g="l1">FELL ON EARNINGS.</div></div><div class="pb two"><i style="width:${dp}%"></i></div></div>`, function (dt) {
    const bg = this.$('.big'); slam(bg, dt - .02); bg.textContent = Math.round(D.mkt.down * L.eo(L.n(dt, 0, .4))); rise(this.$('.un'), dt - .1, 40); this.$('.pb').style.opacity = L.n(dt, b(1.5), b(1.5) + .1); grow(this.$('.pb i'), dt - b(1.5)) });
  C.push([b(m), 'r11-thump', .22]); m += 9;
  const band = (bg, l1, l2, list) => `<div class="bnd2" style="background:${bg}"><div><div class="x" data-g="l2" data-f="640">${l1}</div><div class="x" data-g="l2">${l2}</div></div><div class="ms">${list.map(a => mk(a.k, 136)).join('')}</div></div>`;
  scene(m, 6, K, true, '', `<div class="blk">${clean ? band(G, 'THE BEARS', 'GOT PAID.', bears) + band(Rd, 'THE BULLS', 'GOT REKT.', bulls) : band(G, 'SHORTS', 'BEAT LONGS.', bears)}</div>`, function (dt) {
    this.$$('.bnd2').forEach((e, i) => { const k = L.eo5(L.n(dt, 0, .3)); e.style.transform = `translateX(${(i ? 1 : -1) * (1 - k) * 1080}px)` }) });
  C.push([b(m), 'r11-thump', .22]); m += 6;
  scene(m, 8, G, false, '', `<div class="blk" style="gap:28px"><div class="un"><div class="x l3" data-g="l3" data-f="940">SHORT</div><div class="x l3" data-g="l3">EVERYTHING:</div></div><div class="n" data-f="940">${cnt(D.mkt.short, 1)}</div><div class="slab"><div class="x" data-f="940">${beat ? 'NO AI BEAT THAT.' : `${up(lead.name)} BEAT IT.`}</div></div></div>`, function (dt) {
    slam(this.$('.un'), dt - .02, 1.25); const pn = this.$('.n'); slam(pn, dt - .04, 1.25); pn.textContent = cnt(D.mkt.short, L.eo(L.n(dt, 0, .45)));
    const sb = this.$('.slab'), d = dt - b(2); sb.style.opacity = d >= 0 ? 1 : 0; sb.style.transform = `scaleY(${L.eo5(L.n(d, 0, .14))})`; slam(sb.firstElementChild, d - .05, 1.5); this.shake = d >= 0 ? Math.exp(-d * 9) * Math.sin(d * 70) * 8 : 0 });
  C.push([b(m), 'r11-thump', .22], [b(m + 2), 'sfx-boom', .2]); m += 8;
  // 5. the table, from the bottom, one row a beat: only the newest row at full contrast
  const mT = m; scene(m, 6, K, true, `<span>${FIN ? `FINAL P&amp;L · ${D.total} ROUNDS` : `P&amp;L AFTER ${D.rounds} OF ${D.total}`}</span>`, `<div class="blk" style="gap:16px">${D.ai.map(a => `<div class="trow${a.rank === 1 ? ' top' : ''}">${mk(a.k, 112)}<div class="x" data-g="tn" data-f="300">${up(a.name)}</div><div class="n" data-g="tp" data-f="420"${a.rank === 1 ? '' : ` style="color:${a.pnl >= 0 ? G : Rd}"`}>${cnt(a.pnl, 1)}</div></div>`).join('')}</div>`, function (dt) {
    this.$$('.trow').forEach((e, i) => { const o = n4 - 1 - i, d = dt - b(o), k = L.eo5(L.n(d, 0, .28)), dim = i ? 1 - .65 * L.eo(L.n(dt - b(o + 1), 0, .2)) : 1; e.style.opacity = d >= 0 ? dim * Math.min(1, k * 2.5) : 0; e.style.transform = `translateY(${(1 - k) * 70}px)` }) });
  for (let j = 0; j < n4; j++) C.push([b(m + j), j === n4 - 1 ? 'r11-thump' : 'r11-knock', j === n4 - 1 ? .22 : .16]); m += 6;
  // 6. the winner, on the bed's last phrase; Season 2 is one small line

    pop(this.$('.blk .mk'), dt - .1); slam(this.$('.un'), dt - .1, 1.3); const pn = this.$('.n'); slam(pn, dt - b(1), 1.3); pn.textContent = cnt(lead.pnl, L.eo(L.n(dt, b(1), b(1) + .45))); rise(this.$('.s2'), dt - b(2), 20, .3, .72); rise(this.$('.fp'), dt - b(2), 0, .3, .62) }, '<div class="fp sl">SIMULATED · NOT ADVICE</div>');
  C.push([b(m), 'sfx-boom', .3], [b(m), 'sfx-chime', .16], [b(m + 1), 'r11-thump', .2]); FLT.push(b(m)); m += 8; DUR = b(m);
  FT = add(`<div id="ft"><img src="ezlogo.svg" alt="">${FIN ? '' : '<b>DRAFT</b>'}</div>`); FL = add('<div id="fl"></div>');
  window.MUSIC = { f: 's1-c', at: 0 };
}
