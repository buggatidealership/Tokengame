<!-- Take C of the Season 1 conclusion (owner, 2026-11-18; WRAP-BRIEF.md): by character, the loud one. Full-bleed colour cards cut hard on the
  beat (the Slam's grammar): the premise, then one report card per AI from last place to first (verdict BULL or BEAR, season P&L, hit rate,
  best and worst trade; under 50% is stamped RELEGATED), the rounds that split them, the lesson (the bears won), the table, Season 2 with
  the relegated seat empty. Every number from data/wrap.json (node prep-wrap.js); ?final=1 only forces the final labels.
  Bed s1-c (Hedra elevenlabs-music): 140.0 BPM, beats at 0.414 s + n x 0.4286 s, the full beat enters on bed beat 21 (9.41 s), the drop's
  downbeat is bed beat 61 (26.56 s), the last phrase starts on bed beat 125 (53.99 s), the track ends at 56.1 s (all measured). The video's
  beat m is bed beat m + 3, so the first report card lands on the beat coming in, the first-place card on the drop, Season 2 on the last phrase.
  window.R(t), READY, CUES, MUSIC, DUR as the other pages. -->

<script src="lib.js"></script>
<script>
const q = new URLSearchParams(location.search), G = '#55d6a2', Rd = '#e8576b', Au = '#fdbc2a', Cr = '#f2ede6', K = '#0e0c0b';
const cam = L.$('#cam'), add = (h, p = cam) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };
const BT = 60 / 140, b = x => +(x * BT).toFixed(4);             // s1-c: 140.0 BPM (measured)
let D, FIN, DUR, SC = [], C = [], grain, FT, FL, FLT = [];
const mk = (k, s) => L.mark(k, s, false), money = L.money, up = s => s.toUpperCase();
const names = ks => { const n = ks.map(k => up(D.ai.find(a => a.k === k).name)); return n.length < 2 ? n[0] : n.slice(0, -1).join(', ') + ' AND ' + n.at(-1) };
const wp = (w, c = '') => `<div class="wp ${c}" data-w="${w}"></div>`;
function scene(m0, m1, bg, dark, html, draw) { const el = add(`<div class="sc ${dark ? 'lt' : 'dk'}" style="background:${bg}"><div class="in">${html}</div></div>`);
  const s = { el, inn: el.firstElementChild, m0, m1, t0: b(m0), t1: b(m1), dark, i: SC.length, draw, shake: 0, $: x => el.querySelector(x), $$: x => [...el.querySelectorAll(x)] }; SC.push(s); return s }
// entrances: all pure functions of dt (seconds since the element's beat)
const slam = (el, dt, from = 1.6) => { el.style.opacity = dt >= 0 ? 1 : 0; if (dt >= 0) el.style.transform = `scale(${from + (1 - from) * L.spring(dt, 2.3, 9)})` };
const pop = (el, dt) => { el.style.opacity = dt >= 0 ? 1 : 0; if (dt >= 0) el.style.transform = `scale(${.45 + .55 * L.spring(dt, 2.6, 8)})` };
const rise = (el, dt, dy = 60, d = .26, o = 1) => { const k = L.eo5(L.n(dt, 0, d)); el.style.opacity = dt >= 0 ? o * Math.min(1, k * 2.5) : 0; el.style.transform = `translateY(${(1 - k) * dy}px)` };
const slideX = (el, dt, dx = 240, d = .28) => { const k = L.eo5(L.n(dt, 0, d)); el.style.opacity = dt >= 0 ? 1 : 0; el.style.transform = `translateX(${(1 - k) * dx}px)` };
const cnt = (v, k) => (v < 0 ? '−' : '+') + '$' + Math.round(Math.abs(v) * k).toLocaleString('en-US');

function build() {
  const rev = [...D.ai].reverse(), n4 = D.ai.length, dr = FIN ? `FINAL · ${D.total} ROUNDS` : `DRAFT · ${D.rounds} OF ${D.total} ROUNDS`;
  // 1. the hook: the premise, complete by beat 5 (2.1 s)
  scene(0, 12, Cr, false, `${wp('EARNINGS', 'soft')}<div class="h1">WE PAID FOR<br>THE TOP PLAN<br>OF ${n4} AIs.</div>
    <div class="hm">${D.ai.map(a => `<div class="m">${mk(a.k, 150)}<span>${a.name}</span></div>`).join('')}</div>
    <div class="h2">${D.total} EARNINGS REPORTS.</div>
    <div class="h3"><span style="background:${G}">LONG</span><i>OR</i><span style="background:${Rd}">SHORT.</span></div>
    <div class="h4"><div class="bd"></div><span>$100K ON EVERY TRADE.</span></div>`, function (dt) { const B = x => dt - b(x);
    this.$('.h1').style.transform = `scale(${1 + .04 * (1 - L.eo5(L.n(dt, 0, .55)))})`;
    this.$$('.hm .m').forEach((m, j) => { const d = B(j * .5); m.style.transform = `scale(${1 + (d >= 0 ? .16 * Math.exp(-d * 9) * Math.cos(d * 14) : 0)})` });
    slam(this.$('.h2'), B(2), 1.5); slam(this.$('.h3'), B(4), 1.5);
    this.$('.h4 .bd').style.transform = `scaleX(${L.eo5(L.n(B(5), -.02, .2))})`; slam(this.$('.h4 span'), B(5) - .04, 1.5) });
  C.push([.03, 'r11-thump', .18], [b(2), 'r11-knock', .14], [b(4), 'r11-knock', .14], [b(5), 'r11-thump', .22]);
  // 2. the title
  scene(12, 18, Au, false, `${wp('SEASON 1')}<div class="top"><span>SEASON 1</span><span>${n4} AIs · ${D.total} REPORTS</span></div>
    <div class="tt"><div>THE</div><div>REPORT</div><div>CARDS.</div></div><div class="tl">LAST PLACE FIRST.</div>
    <div class="tm">${rev.map(a => `<div class="m">${mk(a.k, 150)}<span>#${a.rank}</span></div>`).join('')}</div>`, function (dt) { const B = x => dt - b(x);
    this.$$('.tt div').forEach((d, j) => slam(d, B(j * .25), 1.5)); rise(this.$('.tl'), B(.4)); this.$$('.tm .m').forEach((m, j) => pop(m, B(2 + j * .75))) });
  C.push([b(12), 'r11-thump', .2], [b(18), 'sfx-riser', .1]);
  // 3. the report cards, last place to first: 40 beats for the cards before the leader's (the bed's groove), the leader's on the drop
  const rel0 = rev.slice(0, -1).find(a => D.releg.includes(a.k)) || rev[0]; let m = 18;
  rev.forEach(a => { const first = a.rank === 1, rel = D.releg.includes(a.k), bg = first ? Au : a.pnl >= 0 ? G : Rd, sh = a.lean === 'BEAR', len = first ? 12 : (40 - 4) / (n4 - 1) + (a === rel0 ? 4 : 0), m0 = m; m += len;
    scene(m0, m, bg, false, `${wp(a.lean)}<div class="top"><span>#${a.rank} OF ${n4}</span>${first ? `<span class="tag">${FIN ? 'SEASON 1 WINNER' : 'LEADS SEASON 1'}</span>` : '<span>SEASON 1 REPORT CARD</span>'}</div>
      <div class="mkw">${mk(a.k, 190)}</div><div class="nm">${up(a.name)}</div>
      <div class="vd">${a.lean}</div><div class="ln"><span>WENT ${sh ? 'SHORT' : 'LONG'} ON</span><b>${sh ? a.shorts : a.longs} OF ${a.calls}</b><span>CALLS</span></div>
      <div class="plb">SEASON P&amp;L · $100K ON EVERY TRADE</div><div class="pn">${cnt(a.pnl, 1)}</div>
      <div class="hp">${a.hit}%</div><div class="hl">RIGHT ON DIRECTION · ${a.w} OF ${a.w + a.l}</div><div class="hb"><i class="hf"></i></div><i class="tk"></i><i class="tk2" style="background:${bg}"></i><div class="t50">50%</div>
      <div class="bw b1"><span>BEST TRADE</span><b>${a.best.co}</b><em>${money(a.best.p)}</em></div><div class="bw b2"><span>WORST TRADE</span><b>${a.worst.co}</b><em>${money(a.worst.p)}</em></div>
      ${rel ? '<div class="stamp"><b>RELEGATED</b><span>RIGHT LESS THAN HALF THE TIME.</span></div>' : ''}`, function (dt) { const B = x => dt - b(x);
      pop(this.$('.mkw'), B(0) - .02); slideX(this.$('.nm'), B(0)); const tg = this.$('.tag'); if (tg) slam(tg, B(0) - .1, 1.5);
      slam(this.$('.vd'), B(1), 1.5); rise(this.$('.ln'), B(.5), 50);
      rise(this.$('.plb'), B(2), 20, .2, .78); const pn = this.$('.pn'); slam(pn, B(2), 1.3); pn.textContent = cnt(a.pnl, L.eo(L.n(dt, b(2), b(3.5))));
      const hp = this.$('.hp'); slam(hp, B(3), 1.4); hp.textContent = Math.round(a.hit * L.eo(L.n(dt, b(3), b(4)))) + '%'; rise(this.$('.hl'), B(3), 20, .2);
      const kb = L.n(B(3), 0, .15); this.$('.hb').style.opacity = kb; this.$('.hf').style.width = a.hitx * L.eo5(L.n(dt, b(3), b(4.3))) + '%'; ['.tk', '.tk2', '.t50'].forEach(x => this.$(x).style.opacity = L.n(B(3.5), 0, .12));
      rise(this.$('.b1'), B(3.5), 50); rise(this.$('.b2'), B(4.25), 50);
      const st = this.$('.stamp'); if (st) { const ds = B(8); st.style.opacity = ds >= 0 ? 1 : 0; if (ds >= 0) st.style.transform = `rotate(-4deg) scale(${1 + 1.5 * (1 - L.spring(ds, 2.2, 10))})`; this.shake = ds >= 0 ? Math.exp(-ds * 9) * Math.sin(ds * 70) * 14 : 0 } });
    C.push([b(m0), first ? 'sfx-boom' : 'r11-thump', first ? .26 : .2]); if (rel) C.push([b(m0 + 8), 'sfx-boom', .24], [b(m0 + 8), 'r11-knock', .2]); if (first) FLT.push(b(m0)) });
  // 4. the rounds that split them: the biggest move, then the round all four got wrong
  const rA = D.big[0], rB = D.worstR.n !== rA.n ? D.worstR : D.big[1];
  [rA, rB].forEach(x => { const m0 = m; m += 8; const nr = x.right.length, tk = x.t.replace(/\..*$/, '');
    scene(m0, m, K, true, `${wp(tk)}<div class="top"><span>${x.n === D.big[0].n ? 'THE BIGGEST MOVE OF SEASON 1' : x.n === D.worstR.n ? 'THE WORST ROUND FOR THE FOUR' : 'ONE OF THE BIGGEST MOVES'}</span><span>ROUND ${x.n}</span></div>
      <div class="lg"${x.dark ? ` style="background:#1d1917;box-shadow:0 0 0 2px rgba(242,237,230,.25)"` : ''}>${x.logo ? `<img src="${x.logo}">` : ''}</div><div class="co">${up(x.co)}</div><div class="sb">THE STOCK AFTER EARNINGS</div>
      <div class="mv" style="color:${x.move < 0 ? Rd : G}">${L.pct(x.move)}</div>
      <div class="chips">${D.ai.map(a => { const p = x.p[a.k], sd = x.side[a.k]; return `<div class="chip" style="background:${p > 0 ? G : p < 0 ? Rd : '#8e8680'}">${mk(a.k, 92)}<b>${a.name}</b><span>${sd ? 'WENT ' + sd : 'NO CALL'}</span><em>${sd ? money(p) : '$0'}</em></div>` }).join('')}</div>
      <div class="vl">${nr === 0 ? 'ALL FOUR WERE WRONG.' : nr === n4 ? 'ALL FOUR WERE RIGHT.' : nr === 1 ? `ONLY ${names(x.right)} WAS RIGHT.` : `${names(x.right)} WERE RIGHT.`}</div>`, function (dt) { const B = x2 => dt - b(x2);
      pop(this.$('.lg'), B(0) - .02); slideX(this.$('.co'), B(0)); rise(this.$('.sb'), B(0) - .1, 20, .2);
      const mv = this.$('.mv'); slam(mv, B(.5), 1.4); mv.textContent = L.pct(x.move * L.eo(L.n(dt, b(.5), b(1.25))));
      this.$$('.chip').forEach((c, j) => pop(c, B(.5 + j * .25))); slam(this.$('.vl'), B(1.75), 1.4) });
    C.push([b(m0), 'r11-thump', .2], [b(m0 + 1.75), 'r11-knock', .14]) });
