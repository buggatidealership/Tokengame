<!doctype html><meta charset="utf-8"><title>The bell</title>
<!-- Night studio outcome take 5, THE BELL (2026-11-20): the close told as one strike. A painted bronze bell hangs in a dark hall over a
  gold-ringed floor (w6/nt/ov/ov5-hall.jpg, ov5-bell.webp keyed off blue; Hedra gpt-image-2 in the bet chip's recipe). The five AIs stand
  round it on bronze plaques (a pentagon), each plaque its side on every company and its live P&L; the companies hang between bell and
  plaques with their live moves while the night runs (New York's clock in the band at the foot). The bell swings, and on the drop it
  strikes: a shock ring runs out from the bell and as it reaches each plaque the plaque jolts, its right trades light up and its wrong
  ones go dark, its P&L locks. Then the ring turns: the plaques roll round to their Season 2 places, 1 at the top under the bell, 2 to 5
  clockwise, the leader in gold, and the bell rings once more. No rows anywhere: the circle is the board.
  Faces: Cinzel (words, engraved) and Space Grotesk (every figure, tabular). Bed m2-phonk (130 BPM), its drop (14.789 s in the file) on the
  strike: TR = 6.923 s, MUSIC.at = 7.866. Data: data/close-<date>.json (nt-ov5.html?d=<YYYY-MM-DD>). Scales to 10 companies: each plaque
  lists one row per company (up to 5 at full size; 6 to 10 as a grid of company marks lit or dark with L or S); the companies hang on
  a ring of up to 5 gaps, two to a gap past five.
  Words of our own on screen: no punctuation; sides are LONG or SHORT; every money figure is a signed P&L with its label. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#04070e;color:#f8f0d9;font-family:Cinzel,serif}
.num{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}
#st{position:absolute;inset:0;overflow:hidden}
#cam{position:absolute;inset:0;transform-origin:540px 730px}
#gnd{position:absolute;left:-40px;top:-120px;width:1160px;height:1547px;transform-origin:50% 55%}
#gnd img{width:100%;height:100%;display:block}
#vg{position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 52%,rgba(4,7,14,0) 40%,rgba(4,7,14,.78) 100%),linear-gradient(180deg,rgba(4,7,14,.55),rgba(4,7,14,0) 20%,rgba(4,7,14,0) 80%,rgba(4,7,14,.85))}
#shock{position:absolute;left:0;top:0;width:1080px;height:1350px;pointer-events:none}
#bellw{position:absolute;left:410px;top:588px;width:260px;height:314px;transform-origin:50% 6%}
#bellw img{width:260px;height:314px;display:block;filter:drop-shadow(0 20px 40px rgba(0,0,0,.7))}
#bellglow{position:absolute;left:290px;top:495px;width:500px;height:500px;border-radius:50%;background:radial-gradient(closest-side,rgba(253,188,42,.55),rgba(253,188,42,.15) 45%,rgba(253,188,42,0) 75%);mix-blend-mode:screen;pointer-events:none}
.moon{position:absolute;left:0;top:0;width:150px;display:flex;flex-direction:column;align-items:center;gap:8px}
.moon img{width:70px;height:70px;border-radius:16px;box-shadow:0 0 0 2px rgba(248,240,217,.35),0 10px 26px rgba(0,0,0,.6)}
.moon .mv{font:700 32px/1 'Space Grotesk';padding:6px 9px 5px;border-radius:10px;background:rgba(4,7,14,.82);box-shadow:inset 0 0 0 1.5px rgba(253,188,42,.35)}
/* the plaques: dark bronze with a bevel, a gold keyline and a brushed sheen */
.pq{position:absolute;left:0;top:0;width:274px;padding:18px 15px 16px;border-radius:22px;
  background:linear-gradient(160deg,rgba(253,188,42,.16),rgba(253,188,42,0) 38%),repeating-linear-gradient(90deg,rgba(248,240,217,.025) 0 1px,transparent 1px 4px),linear-gradient(180deg,#1c150b,#0b0906 70%,#120d07);
  box-shadow:inset 0 0 0 2px rgba(253,188,42,.42),inset 0 2px 0 rgba(255,236,170,.4),inset 0 -3px 0 rgba(0,0,0,.6),0 26px 50px rgba(0,0,0,.65)}
.pq .hd{display:flex;align-items:center;gap:12px}
.pq .hd b{font:800 32px/1 Cinzel;letter-spacing:.02em}
.pq .rws{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.pq .rw{display:flex;align-items:center;gap:8px;height:38px;padding:0 7px;border-radius:9px}
.pq .rw img{width:30px;height:30px;border-radius:7px}
.pq .rw span{position:relative;font:700 26px/1 'Space Grotesk';letter-spacing:.03em}
.pq .rw span i{position:absolute;left:-4px;right:-4px;top:50%;height:3px;margin-top:-1px;background:#ff3a31;transform-origin:0 50%;transform:scaleX(0)}
.pq .rw em{margin-left:auto;font:800 24px/1 Cinzel;letter-spacing:.06em;font-style:normal;opacity:0}
#emb{position:absolute;left:78px;top:132px;width:104px}
#emb .a,#emb .b{position:absolute;left:0;top:0}
.pq .pl{margin-top:12px;font:700 35px/1 'Space Grotesk';text-align:right;white-space:nowrap}
.pq .pl small{font:700 24px/1 Cinzel;letter-spacing:.08em;color:rgba(248,240,217,.7);float:left;margin-top:9px}
.pq .rk{position:absolute;left:-16px;top:-16px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 32px/1 'Space Grotesk';background:#04070e;color:#f8f0d9;box-shadow:inset 0 0 0 2px rgba(253,188,42,.6),0 6px 16px rgba(0,0,0,.6);opacity:0}
.pq .flash{position:absolute;inset:0;border-radius:22px;pointer-events:none;opacity:0;background:radial-gradient(80% 70% at 50% 40%,rgba(255,240,200,.65),rgba(253,188,42,.18) 60%,transparent)}
.pq .rim{position:absolute;inset:-5px;padding:5px;border-radius:26px;pointer-events:none;opacity:0;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
#band{position:absolute;left:0;right:0;top:1226px;height:90px;display:flex;align-items:center;justify-content:center}
#band .tx{position:absolute;font:800 44px/1 Cinzel;letter-spacing:.12em;white-space:nowrap;text-align:center}
#band .tx .num{font-weight:700;letter-spacing:.02em}
#title{position:absolute;left:0;right:0;top:1040px;text-align:center}
#title .a{font:900 92px/1 Cinzel;letter-spacing:.03em}
#title .b{font:800 48px/1 Cinzel;letter-spacing:.2em;color:#fdbc2a;margin-top:18px}
.foil{color:transparent!important;background-image:linear-gradient(100deg,#fdbc2a 38%,#fff1c2 50%,#fdbc2a 62%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text}
</style>
<div id="st"><div id="cam">
  <div id="gnd"><img src="w6/nt/ov/ov5-hall.jpg" alt=""></div>
  <div id="vg"></div>
  <div id="bellglow"></div>
  <svg id="shock" viewBox="0 0 1080 1350"></svg>
  <div id="bellw"><img src="w6/nt/ov/ov5-bell.webp" alt=""><div id="emb"><div class="a"></div><div class="b"></div></div></div>
  <div id="moons"></div>
  <div id="pqs"></div>
  <div id="title"><div class="a"></div><div class="b"></div></div>
  <div id="band"><div class="tx" id="bk"></div><div class="tx" id="bc"></div><div class="tx" id="bb"></div></div>
</div></div>
<script src="lib.js"></script><script src="nt-ov.js"></script><script src="nt-ovx.js"></script>
<script>
const TR = 6.923, CX = 540, CY = 745, RP = 370, RM = 215;  // (radius and push keep every plaque 20 px or more inside the frame, director's frame check 01:00)
let D, G, grain, PQ = [], MO = [], ANG0 = [], ANG1 = [];
const AT = a => [CX + RP * Math.cos(a * Math.PI / 180), CY + RP * Math.sin(a * Math.PI / 180)];
const setup = () => {
  G = OV.grid(130, TR, 14.789, 'm2-phonk'); const B = G.B; window.DUR = 15.0;
  OV.bug("700 30px Cinzel", { css: 'letter-spacing:.04em', endFont: "800 60px Cinzel", subFont: "800 30px Cinzel" });
  grain = OV.grain(.065);
  L.$('#title .a').textContent = D.title[0]; L.$('#title .b').textContent = D.title[1];
  // the mark cast into the bell's waist: a dark cast shadow and the lit bronze letters
  L.$('#emb .a').innerHTML = OV.markSvg(104, 'rgba(40,24,6,.85)', false, 'transform:translate(1.5px,2.5px)'); L.$('#emb .b').innerHTML = OV.markSvg(104, '#ffe3a0', true);
  const N = D.N, small = N > 5;
  // plaques: the AIs in the sheet's order round the pentagon, 1 to 5 by Season 2 P&L after the turn
  D.ais.forEach((a, i) => { ANG0.push(-90 + 72 * i); ANG1.push(-90 + 72 * a.rank);
    const el = document.createElement('div'); el.className = 'pq';
    el.innerHTML = `<div class="flash"></div><div class="rim"></div><div class="rk">${a.rank + 1}</div><div class="hd">${OV.mark(a.k, 46, 'box-shadow:0 0 0 2px rgba(253,188,42,.4)')}<b>${a.name}</b></div>
      <div class="rws">${D.rounds.map((r, j) => `<div class="rw" data-j="${j}"><img src="${r.logo}" alt=""><span style="color:${a.calls[j].side === 'LONG' ? OV.G : OV.R}">${small ? a.calls[j].side[0] : a.calls[j].side}<i></i></span>${small ? '' : `<em style="color:${a.calls[j].right ? OV.AU : OV.R}">${a.calls[j].right ? 'RIGHT' : 'WRONG'}</em>`}</div>`).join('')}</div>
      <div class="pl num"><small>P&amp;L</small><span></span></div>`;
    if (small) { const rw = el.querySelector('.rws'); rw.style.cssText = 'display:grid;grid-template-columns:repeat(5,1fr);gap:6px' }
    L.$('#pqs').appendChild(el); PQ.push(el) });
  // the companies hang in the gaps between the plaques
  const gaps = [90, 234, -54, 162, 18];
  D.rounds.forEach((r, j) => { const el = document.createElement('div'); el.className = 'moon';
    el.innerHTML = `<img src="${r.logo}" alt=""><div class="mv num"></div>`; el.dataset.a = gaps[j % 5] + (j >= 5 ? 0 : 0); el.dataset.r = j >= 5 ? RM + 70 : RM;
    if (N > 5) { el.style.zoom = .8 } L.$('#moons').appendChild(el); MO.push(el) });
  // sound
  const C = window.CUES = [[.05, 'r11-swell', .14]]; OV.sting(C);
  D.ais.forEach((a, i) => C.push([+B(-13 + i).toFixed(3), 'r11-card', .1]));
  D.rounds.forEach((r, j) => C.push([+(B(-8) + j * .5 * G.p).toFixed(3), 'r11-ping', .08]));
  C.push([B(-8), 'r11-slide', .1], [B(-4), 'sfx-riser', .12], [B(-4), 'sfx-clock', .14], [B(-2), 'sfx-clock', .14],
    [TR, 'sfx-bell', .34], [TR + .01, 'sfx-boom', .2], [TR + .05, 'r11-thump', .2]);
  D.ais.forEach((a, i) => C.push([+(TR + .25 + i * .03).toFixed(3), 'sfx-tick', .06]));
  C.push([TR + .45, 'r11-kaching', .18], [B(5), 'sfx-whoosh', .14], [B(5.5), 'r11-slide', .1], [B(9), 'sfx-bell', .14], [B(9) + .05, 'r11-sparkle', .12], [B(12), 'sfx-whoosh', .14], [B(12) + .12, 'r11-thump', .14]);
};
const mNow = t => OV.night(OV.fr(t), G.B(-8), TR - .05);
const live = (r, t) => t >= TR ? r.move : r.px(mNow(t));
// the bell's swing (degrees): still, a growing swing from B(-4), the strike at TR (the far end of a swing), a slow decay, one more ring at B(9)
const swing = t => { const B = G.B, p = G.p; if (t < B(-4)) return 1.2 * Math.sin(t * 2.1);
  if (t < TR) { const x = (t - B(-4)) / (TR - B(-4)); return 22 * Math.pow(x, 1.4) * Math.cos(Math.PI * (t - B(-4)) / p) };
  const a = 22 * Math.exp(-(t - TR) * 1.6) * Math.cos(Math.PI * (t - TR) / p * .5); const b = t > B(9) ? 9 * Math.exp(-(t - B(9)) * 2) * Math.sin(Math.PI * (t - B(9)) / p) : 0; return a + b };
window.R = t => {
  const B = G.B, p = G.p, T0 = OV.fr(t); grain(t);
  // hall: slow drift; the light breathes; it flares gold on the strike and on the leader
  const g = L.$('#gnd'); g.style.transform = `scale(${(1.02 + .05 * L.n(t, 0, 15)).toFixed(4)}) translate(${(6 * Math.sin(t * .35)).toFixed(1)}px,${(-10 * L.n(t, 0, 15)).toFixed(1)}px)`;
  const strike = t >= TR ? Math.exp(-(t - TR) * 2.2) : 0, ring2 = t >= B(9) ? Math.exp(-(t - B(9)) * 2.5) : 0;
  L.$('#bellglow').style.opacity = (.35 + .12 * Math.sin(t * 3) + .9 * strike + .5 * ring2).toFixed(3);
  L.$('#bellglow').style.transform = `scale(${(1 + .6 * strike).toFixed(3)})`;
  // the bell
  const sw = swing(t); L.$('#bellw').style.transform = `rotate(${sw.toFixed(2)}deg)`;
  // the cast mark catches the light three times: the opening, the strike, the second ring (brand moments B3)
  const gl = Math.max(...[[.2, 1], [TR, 1.2], [B(9), 1]].map(([t0, a]) => t >= t0 ? a * Math.exp(-(t - t0) * 1.6) : 0));
  L.$('#emb .b').style.filter = `brightness(${(.78 + .7 * gl).toFixed(3)}) drop-shadow(0 0 ${(16 * gl).toFixed(1)}px rgba(253,188,42,${(.9 * gl).toFixed(2)}))`; L.$('#emb .b').style.opacity = (.82 + .18 * gl).toFixed(3);
  // the shock: three rings run out from the bell on the strike (and a small one on the second ring)
  const rings = []; [[TR, 0], [TR + .1, 1], [TR + .22, 2], [B(9), 3]].forEach(([t0, i]) => { const q = L.n(t, t0, t0 + (i === 3 ? .9 : 1.1)); if (q > 0 && q < 1) { const r = (i === 3 ? 500 : 1000) * L.eo(q);
    rings.push(`<circle cx="${CX}" cy="${CY}" r="${r.toFixed(1)}" fill="none" stroke="${i === 1 ? '#f8f0d9' : '#fdbc2a'}" stroke-width="${((i === 0 ? 26 : 10) * (1 - q)).toFixed(1)}" opacity="${(1 - q).toFixed(3)}"/>`) } });
  L.$('#shock').innerHTML = rings.join('');
  const shockR = t >= TR ? 1000 * L.eo(L.n(t, TR, TR + 1.1)) : 0;
  // title: alone, then it gives way to the band
  const ti = L.$('#title'), tin = 1 - .25 * (1 - L.eo5(L.n(t, 0, .5))); ti.style.opacity = tin * (1 - L.n(t, B(-13) - .1, B(-13) + .15));
  ti.style.transform = `translateY(${(40 * (1 - tin) - 30 * L.n(t, 0, B(-13))).toFixed(1)}px)`;
  // the band at the foot: the title small, then New York's clock, then the close, then the board's name
  const c = OV.clock(mNow(t)), bk = L.$('#bk'), bc = L.$('#bc'), bb = L.$('#bb');
  bk.textContent = `ONE BELL GRADES ${D.N * D.ais.length} TRADES`; bk.style.fontSize = '42px';
  bk.style.opacity = L.n(t, B(-13), B(-12.5)) * (1 - L.n(t, B(-6) - .1, B(-6) + .1));
  bc.innerHTML = t < TR ? `${c.day} <span class="num">${c.t}</span> NEW YORK` : 'THE CLOSE'; bc.style.color = t < TR ? '#f8f0d9' : '#fdbc2a';
  bc.style.opacity = L.n(t, B(-6) - .1, B(-6) + .1) * (1 - L.n(t, B(5) - .1, B(5) + .1));
  bb.textContent = 'SEASON 2 LEADERBOARD'; bb.style.color = '#fdbc2a'; bb.style.opacity = L.n(t, B(5) + .1, B(5) + .3);
  [bk, bc, bb].forEach(x => x.style.transform = `scale(${(1 + .06 * strike).toFixed(3)})`);
  // the companies: they drop in one a half beat, sway, their moves live; stamped on the strike; they fade before the turn
  MO.forEach((el, j) => { const r = D.rounds[j], t0 = B(-8) + j * .5 * p, k = L.spring(t - t0, 1.8, 7), a = (+el.dataset.a + 4 * Math.sin(t * 1.3 + j)) * Math.PI / 180, R0 = +el.dataset.r;
    const x = CX + R0 * Math.cos(a), y = CY + R0 * Math.sin(a) - 60 * (1 - k);
    el.style.transform = `translate(${(x - 75).toFixed(1)}px,${(y - 60).toFixed(1)}px) scale(${(1 + .08 * Math.exp(-Math.max(0, t - TR - .15) * 5) * (t > TR + .1 ? 1 : 0)).toFixed(3)})`;
    el.style.opacity = (t >= t0 ? L.cl(k * 2) : 0) * (1 - L.n(t, B(5) - .1, B(5) + .2));
    const v = live(r, T0), mv = el.querySelector('.mv'); mv.textContent = OV.pct(v); mv.style.color = Math.abs(v) < .005 ? '#f8f0d9' : v > 0 ? OV.G : OV.R;
    mv.style.boxShadow = t >= TR ? `inset 0 0 0 2.5px #fdbc2a,0 0 ${(30 * strike).toFixed(1)}px rgba(253,188,42,.8)` : 'inset 0 0 0 1.5px rgba(253,188,42,.35)' });
  // the plaques
  const turn = L.eio(L.n(t, B(5), B(5) + 1.15));
  PQ.forEach((el, i) => { const a = D.ais[i], t0 = B(-13 + i), k = L.eo5(L.n(t, t0, t0 + .4));
    let ang = ANG0[i]; let d1 = ANG1[i] - ANG0[i]; if (d1 > 180) d1 -= 360; if (d1 < -180) d1 += 360; ang += d1 * turn;
    const sep = 80 * Math.sign(d1) * Math.sin(Math.PI * turn), [x, y] = [CX + (RP + sep) * Math.cos(ang * Math.PI / 180), CY + (RP + sep) * Math.sin(ang * Math.PI / 180)], out = 500 * (1 - k), ra = ang * Math.PI / 180;  // plaques turning one way pass outside, the other way inside
    // the shock: when the ring reaches the plaque it jolts outward and flashes
    const hitT = TR + 1.1 * (1 - Math.cbrt(1 - Math.min(.999, (RP - 60) / 1000))), hk = t >= hitT ? Math.exp(-(t - hitT) * 7) : 0;
    const jol = 14 * hk * Math.cos((t - hitT) * 30) + 6 * OV.kick(t, G, B(-13));
    const ox = (out + jol) * Math.cos(ra), oy = (out + jol) * Math.sin(ra);
    const h = el.offsetHeight; el.style.transform = `translate(${(x - 137 + ox).toFixed(1)}px,${(y - h / 2 + oy).toFixed(1)}px) rotate(${(3 * hk * Math.sin((t - hitT) * 40)).toFixed(2)}deg) scale(${(1 - .2 * Math.sin(Math.PI * turn)).toFixed(4)})`;
    el.style.opacity = t >= t0 ? L.cl(k * 1.6) : 0;
    el.querySelector('.flash').style.opacity = (hk * 1.2).toFixed(3);
    const graded = t >= hitT;
    el.querySelectorAll('.rw').forEach((rw, j) => { const cc = a.calls[j], gk = graded ? L.n(t, hitT, hitT + .25) : 0;
      if (cc.right) { rw.style.background = `rgba(253,188,42,${(.22 * gk).toFixed(3)})`; rw.style.boxShadow = gk ? `inset 0 0 0 2px rgba(253,188,42,${(.8 * gk).toFixed(2)})` : ''; rw.style.opacity = 1 }
      else { rw.style.background = `rgba(255,58,49,${(.1 * gk).toFixed(3)})`; rw.style.boxShadow = gk ? `inset 0 0 0 2px rgba(255,58,49,${(.85 * gk).toFixed(2)})` : ''; rw.querySelector('span i').style.transform = `scaleX(${L.eo(gk).toFixed(3)})` }
      const em = rw.querySelector('em'); if (em) em.style.opacity = gk });
    const v = graded ? a.night : Math.round(D.rounds.reduce((s, r, j) => s + (a.calls[j].side === 'LONG' ? 1 : -1) * live(r, T0) * 1000, 0));
    const shown = t >= B(5) && D.before ? Math.round(L.lerp(a.night, a.s1, turn)) : v;
    const sp = el.querySelector('.pl span'); sp.textContent = t < B(-8) ? '$0' : OV.money(shown); sp.style.color = OV.sgn(shown);
    el.querySelector('.pl small').textContent = t >= B(5) && D.before ? 'SEASON' : 'P&L';
    // rank badges after the turn; the leader's gold rim and foil
    const rk = el.querySelector('.rk'), rq = L.n(t, B(6.5) + a.rank * .08, B(6.5) + .25 + a.rank * .08); rk.style.opacity = rq; rk.style.transform = `scale(${(1 + .5 * (1 - L.eo5(rq))).toFixed(3)})`;
    const lead = D.lead.includes(a.k), go = lead ? L.eo(L.n(t, B(9) - .1, B(9) + .3)) : 0, rm = el.querySelector('.rim'), nm = el.querySelector('.hd b');
    rm.style.opacity = go; if (go > 0) { rm.style.background = `conic-gradient(from ${((t - B(9)) * 90 % 360).toFixed(1)}deg,rgba(253,188,42,.95) 0deg,#fff1c2 18deg,rgba(253,188,42,.95) 40deg,rgba(253,188,42,.4) 170deg,#ffe9a8 196deg,rgba(253,188,42,.4) 222deg,rgba(253,188,42,.95) 360deg)`;
      nm.classList.add('foil'); nm.style.backgroundPosition = `${(100 - 100 * L.n((t - B(9)) % 1.6, .2, 1.2)).toFixed(1)}% 0`; rk.style.background = '#fdbc2a'; rk.style.color = '#04070e' }
    else { nm.classList.remove('foil'); rk.style.background = ''; rk.style.color = '' }
    el.style.filter = !lead && t > B(9) ? `brightness(${(1 - .25 * L.n(t, B(9), B(9) + .3)).toFixed(3)})` : '';
    el.style.zIndex = 10 + (lead && t > B(5) ? 5 : 0) });
  // camera: a push toward the bell before the strike, the kick, a pull back for the turn
  const drift = 10 * Math.sin((t - TR) * 1.3) * L.n(t, B(1), B(2)) * (1 - L.n(t, B(5), B(6)));
  const push = 1 + .01 * L.n(t, 0, B(-8)) + .03 * L.eio(L.n(t, B(-4), TR)) - .03 * L.eio(L.n(t, TR + .2, B(2))) + .02 * L.n(t, B(5), B(12));
  const kick = t > TR ? Math.exp(-(t - TR) * 7) * Math.sin((t - TR) * 48) * 8 : 0;
  L.$('#cam').style.transform = `translate(${(kick + drift).toFixed(2)}px,${(kick * .7).toFixed(2)}px) scale(${push.toFixed(4)})`;
  OV.endR(t, B(12));
  OV.beat(t, G, [L.$('#gnd'), L.$('#bellglow')], L.$('#cam'), .45, .014); OV.endFx(t, B(12), G);
};
(async () => {
  D = await OV.load(); setup();
  await OV.ready(["900 92px Cinzel", "800 32px Cinzel", "700 36px 'Space Grotesk'", "700 30px Cinzel"]);
})();
</script>
