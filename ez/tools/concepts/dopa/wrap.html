<!-- The video that concludes a season (owner, 2026-11-17: the race take "could be a nice video we can create to sort of conclude season
  one, and make it a bit longer"; his answers: its own post after the round's outcome video, 30 to 40 s, each AI's record, the biggest
  win and loss, a Season 2 line with no date). wrap.html reads data/wrap.json (prep-wrap.js: the sheet only, $100K flat a trade).
  1 title  2 the whole season as one P&L race (the leader's mark ringed gold)  3 the biggest win and loss  4 the standings, last place
  to the winner on the music's drop  5 Season 2 is coming. While any round is ungraded it prints DRAFT and says "after N of M rounds".

<script>

    <filter id="gf" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter></defs>

  S.bco = same ? add(`<div id="bco">${W.logo ? `<img src="${W.logo}">` : ''}<div class="co">${W.co}</div><div class="mv" style="color:${W.move < 0 ? Rd : G}">${pct(W.move)}</div></div>`) : null;
  const pan = (x, cls, ttl, c) => add(`<div class="pan ${cls}"><div class="t" style="color:${c}">${ttl}</div>${same ? '' : `<div class="cx">${x.logo ? `<img src="${x.logo}">` : ''}${x.co} <span class="mono" style="color:${x.move < 0 ? Rd : G}">${pct(x.move)}</span></div>`}

  S.ch1 = add(`<div class="colh" style="left:472px;width:150px">W-L</div>`); S.ch2 = add(`<div class="colh" style="left:644px;width:104px">RIGHT</div>`); S.ch3 = add(`<div class="colh" style="left:824px;width:170px">P&amp;L</div>`);
  S.rows = D.ai.map((a, i) => { const first = i === 0, tc = first ? T.winner : T.rows[D.ai.length - 1 - i] ?? T.rows[0];
    return { a, i, first, tc, el: add(`<div class="row" style="top:${484 + i * 184}px"><div class="bg"></div><div class="au"></div><div class="sw"></div><span class="rk">#${a.rank}</span>${L.mark(a.k, 72)}<div class="nb"><div class="nm">${a.name}</div><div class="tg">${first ? (D.final ? 'SEASON 1 WINNER' : 'LEADS THE SEASON') : ''}</div></div>
      <span class="wl">${a.w}-${a.l}</span><span class="ht">${a.hit}%</span><span class="pl" style="color:${a.pnl >= 0 ? G : Rd}"></span></div>`) } });
  // 5 the next season
  S.s2 = add(`<div id="s2"><img src="ezlogo.svg" alt=""><div class="a">SEASON 2</div><div class="b">IS COMING</div><div class="z"></div><div class="ms">${ord.map(k => L.mark(k, 86)).join('')}</div><div class="zl">EVERYONE BACK TO $0</div></div>`);
  S.fl = add(`<div id="fl"></div>`);
  C.push([.05, 'r11-swell', .09]); for (let r = 10; r <= n; r += 10) C.push([+(T.race0 + (T.race1 - T.race0) * invE(r / n)).toFixed(3), 'sfx-tick', .03]);
  C.push([T.fold, 'sfx-whoosh', .09], [T.win, 'r11-kaching', .15], [T.loss, 'r11-thump', .18], [T.stand, 'sfx-whoosh', .07]); S.rows.forEach(r => C.push([r.tc, r.first ? 'sfx-boom' : 'r11-card', r.first ? .26 : .13]));
  C.push([T.winner + .25, 'sfx-chime', .16], [T.s2 + b(1), 'r11-thump', .16]);
  window.MUSIC = { f: q.get('bed') || 's1-wrap', at: +(q.get('at') || 3.02) };
}
function R(t) {
  S.t = t; const n = S.n, kt = L.eio(L.n(t, T.race0 - 1.3, T.race0 - .35));                       // the title goes to the top left

  S.ts.style.opacity = 1 - L.n(kt, 0, .35); S.tm.style.opacity = 1 - L.n(kt, 0, .4); S.tm.style.transform = `translateY(${kt * 60}px)`; L.$$('#tm .m').forEach((m, j) => { m.style.transform = `scale(${.9 + .1 * L.spring(t - b(1) - j * BT, 2.4, 8) })` });
  const p = raceE(L.n(t, T.race0, T.race1)), fi = p * n, fq = raceE(L.n(Math.floor(t * 15 + 1e-6) / 15, T.race0, T.race1)) * n, iq = Math.min(n - 1, Math.floor(fq)), k = L.eio(L.n(t, T.fold, T.fold + .7)), vis = L.n(kt, .45, 1);
  const bx = { x: L.lerp(56, 742, k), y: L.lerp(366, 146, k), w: L.lerp(740, 268, k), h: L.lerp(850, 196, k) }, X = r => bx.x + bx.w * r / D.total, Y = v => bx.y + bx.h * (S.hi - v) / (S.hi - S.lo), y0 = Y(0);
  S.ch.style.opacity = vis; const sg = L.$('#sg'); sg.setAttribute('y1', bx.y); sg.setAttribute('y2', bx.y + bx.h); const off = (y0 - bx.y) / bx.h; L.$('#s1').setAttribute('offset', off); L.$('#s2g').setAttribute('offset', off);
  const zz = L.$('#z'); zz.setAttribute('x1', bx.x); zz.setAttribute('x2', bx.x + bx.w); zz.setAttribute('y1', y0); zz.setAttribute('y2', y0);
  const ga = 1 - L.n(k, 0, .3); S.grid.forEach(g => { const y = Y(g.v); g.ln.setAttribute('x1', bx.x); g.ln.setAttribute('x2', bx.x + bx.w); g.ln.setAttribute('y1', y); g.ln.setAttribute('y2', y); g.ln.style.opacity = g.v === 0 ? 0 : ga; if (g.lb) { g.lb.style.top = y + 'px'; g.lb.style.opacity = ga } });

    const v = i0 >= n ? s[n] : L.lerp(s[i0], s[i0 + 1], fr), hx = X(Math.min(fi, n)), y = Y(v); if (i0 < n) d += 'L' + hx.toFixed(1) + ' ' + y.toFixed(1);
    l.p.setAttribute('d', d); l.p.setAttribute('stroke-width', sw); l.g.setAttribute('d', d); l.g.setAttribute('stroke-width', sw * 2.4); hy[j] = { y, v, hx, vq: fq >= n ? s[n] : L.lerp(s[iq], s[iq + 1], fq - iq) } });
  const gap = L.lerp(56, 0, k); hy.forEach((h, j) => { let o = 0; hy.forEach((g, m) => { if (m === j) return; const d = h.y - g.y; if (Math.abs(d) < gap) o += (gap - Math.abs(d)) / 2 * Math.tanh(d / 3 + (j - m) * .3) }); h.o = o + (j - (hy.length - 1) / 2) * 50 * (1 - L.eio(L.n(fi, 0, 4))) * (1 - k) });
  const top = Math.max(...hy.map(h => h.v));

    l.hd.style.transform = `translate(${h.hx - 22 * ms}px,${h.y + h.o - 22}px) scale(${ms})`; const v = l.hd.lastElementChild; v.textContent = money0(Math.round(h.vq / 10) * 10); v.style.color = h.vq >= 0 ? G : Rd; v.style.opacity = (1 - L.n(k, 0, .5)) * L.n(fi, .3, 3);
    l.hd.querySelector('i').style.opacity = L.cl((h.v - others) / 4000 + .5) * L.n(fi, 3, 6) });
  const wl = L.$('#wall'); wl.setAttribute('x', bx.x + bx.w - 2); wl.setAttribute('width', 5); wl.setAttribute('y', bx.y); wl.setAttribute('height', bx.h); wl.style.opacity = .62 + .38 * (.5 + .5 * Math.sin(t * Math.PI / BT / 2 - 1.2));
  const mx = X(D.win.i), mo = L.n(fi, D.win.i - .5, D.win.i + 1.5) * (1 - L.n(k, 0, .4)), m72 = L.$('#m72'); m72.setAttribute('x1', mx); m72.setAttribute('x2', mx); m72.setAttribute('y1', bx.y); m72.setAttribute('y2', bx.y + bx.h); m72.style.opacity = mo * .6;
  S.mk.style.left = mx + 'px'; S.mk.style.top = (bx.y - 38) + 'px'; S.mk.style.opacity = mo;
  S.ml.style.opacity = L.n(t, T.fold + .5, T.fold + .9); S.ctr.style.opacity = vis * (1 - L.n(t, T.fold - .1, T.fold + .25)); S.ctr.lastElementChild.textContent = Math.round(fq);
