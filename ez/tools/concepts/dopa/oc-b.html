<!doctype html><meta charset="utf-8"><title>The blotter</title>
<!-- Season 2 outcome, concept B "The blotter" (2026-11-20, a still set for the owner; renders with wrapx.sh unchanged if picked).
  The trader's own positions screen, full frame: the five AIs' books as one blotter of 15 positions, over a painted New York whose sky
  is the clock (dusk at Thursday's close, night, dawn at the last price). oc-b.html?d=<YYYY-MM-DD> reads data/close-<date>.json.
  130 BPM on m2-phonk, the drop on the bell (TR = 12.0 s, beat B(n) = TR + n x 0.4615 s):
  0.12  the title alone over the painted skyline
  1.38  the screen turns on: the title docks, the three markets land one a beat (logo, name and ticker, the move, a live sparkline)
  2.77  orders fill, one AI every two beats: its account opens and its three positions fill (market, LONG or SHORT and $100K, the
        called move), the open count runs 0 to 15
  7.85  the night: the New York clock runs, the sky turns from dusk to night to dawn, every mark moves on its real path, each position's
        P&L ticks (a green or red flash on each tick), each account's P&L is the sum of its three
  12.0  the bell (the drop): a gold sweep closes every position, CLOSED 15, the P&Ls freeze
  13.38 the blotter collapses: each account's three rows fold into three chips, the account P&L moves right
  14.31 the accounts sort by P&L into the Season 2 leaderboard; 15.69 the leader takes the gold rim; held to 19 s.
  Words on screen: no punctuation of any kind; sides are LONG or SHORT; the called move is labelled CALLED MOVE, never size; every
  number carries its label; money is a signed P&L. Type sizes chosen for a phone (see the report in ez/x2p-oc-b-board.png's notes). -->

<script>
L.$('#base').textContent = L.css;
const Q = new URLSearchParams(location.search), DATE = Q.get('d') || '2026-11-20';
const UP = '85,214,162', DN = '232,87,107', AU = '253,188,42', CR = '242,237,230';
const TR = 12.0, BEAT = 60 / 130, B = n => TR + n * BEAT;
const T_LINE = .12, T_ON = B(-23), T_FILL = B(-20), T_NIGHT = B(-9), T_FOLD = B(3), T_SORT = B(5), T_LEAD = B(8), DUR = 19;
const SEP = ' ', DAYS3 = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
// the blotter's grid (block-local x in px; the block is 968 wide): identity | market and side | called move | status | P&L
const BW = 968, BHA = 170, BHB = 180, GA = 9.5, GB = 12, Y0A = 376, Y0B = 300, ROWH = 52, ROW0 = 33;
const X_LOGO = 250, X_SIDE = 304, X_SIZE = 420, X_CALL = 652, X_ST = 676, X_PL = 946;
let D, MOD, N, grain, K, mAt, tiles, blks, hdr, PX, V0, V1;
const money0 = v => Math.round(v) === 0 ? '$0' : L.money(v);
const pctc = v => (v < 0 ? '−' : '+') + Math.abs(v) + '%';                       // a called move as the AI wrote it: +4.5%, −4%, +11.5%
const pct0 = v => Math.abs(v) < .005 ? '0.00%' : L.pct(v);
const mark = (k, s) => { const m = MOD[k]; return `<svg class="mk" width="${s}" height="${s}" viewBox="-4 -4 32 32" style="display:block;border-radius:${s * .26}px;background:${m.bg};box-shadow:0 0 0 ${Math.max(1.5, s * .03)}px rgba(242,237,230,.18)"><path d="${m.d}" fill="${m.fg}"${m.fr ? ' fill-rule="evenodd"' : ''}/></svg>` };
const clock = m => { const tot = 16 * 60 + Math.round(m), d = Math.floor(tot / 1440), mm = tot % 1440; let h = Math.floor(mm / 60); const mi = mm % 60, ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return { day: DAYS3[(DAYS3.indexOf(D.day0) + d) % 7], t: h + ':' + String(mi).padStart(2, '0') + ' ' + ap } };
// place an absolutely positioned element: x, y in its parent; ax 0 = left edge on x, 1 = right edge on x; vertically centred on y
const put = (el, x, y, ax = 0, o = 1) => { el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(${(-100 * ax).toFixed(1)}%,-50%)`; el.style.opacity = o };
const setup = () => {
  N = D.rounds.length; const T = D.total;
  L.$('#tbig').innerHTML = D.before ? `Season 2<br>trades ${D.before + 1} to ${D.after}` : N === 1 ? 'First trade<br>of Season 2' : `First ${N} trades<br>of Season 2`;
  L.$('#tdock').textContent = D.before ? `Season 2 trades ${D.before + 1} to ${D.after}` : N === 1 ? 'First trade of Season 2' : `First ${N} trades of Season 2`;
  if (D.preview) { const pv = L.$('#pv'); pv.style.display = 'block'; pv.textContent = ['PREVIEW', 'PRICES AT ' + clock(T).t + ' ET', 'NOT FINAL'].join(SEP) }
  L.chrome(document.body); L.$('.bug b').remove(); L.$('.fine').textContent = 'not advice';
  // the night's time map: the first 90 minutes after the close (the reports land), then the night to the last price (or the open and the session)
  const o = D.open;
  K = o != null ? [[T_NIGHT, 0], [T_NIGHT + 1.3, 90], [T_NIGHT + 1.9, o], [TR - 1.1, T - 60], [TR - .05, T]] : [[T_NIGHT, 0], [T_NIGHT + 1.7, 90], [TR - .1, T]];
  mAt = t => { if (t <= K[0][0]) return 0; for (let i = 1; i < K.length; i++) if (t <= K[i][0]) { const x = (t - K[i - 1][0]) / (K[i][0] - K[i - 1][0]); return L.lerp(K[i - 1][1], K[i][1], i === K.length - 1 ? 1 - Math.pow(1 - x, 1.6) : L.eio(x) * .3 + x * .7) } return T };
  D.rounds.forEach(r => { r.px = m => { const P = r.path; if (!P) return m >= T ? r.move : 0; if (m <= 0) return 0; if (m >= T) return r.move; let i = 1; while (i < P.length && P[i][0] < m) i++; const a = P[i - 1], b = P[i] || P[i - 1]; return L.lerp(a[1], b[1], (m - a[0]) / Math.max(1, b[0] - a[0])) } });
  // one shared scale for the three sparklines, so a 3% move looks like a 3% move in every tile
  const vals = D.rounds.flatMap(r => r.path ? r.path.map(p => p[1]) : [0, r.move]); V0 = Math.min(0, ...vals); V1 = Math.max(0, ...vals);
  // the market strip: one tile a market
  tiles = D.rounds.map((r, j) => { const el = document.createElement('div'); el.className = 'gls tile';
    el.innerHTML = `<div class="sh"></div><div class="bg"></div><img class="lg" src="${r.logo}"><div class="nm">${r.co}<b>${r.ticker}</b></div><div class="ml lbl">MOVE</div><div class="mv"></div><svg viewBox="0 0 140 50"></svg>`;
    L.$('#tiles').appendChild(el); return el });
  // the column heads
  hdr = {}; [['op', 'OPEN 0', 18, 0], ['po', 'POSITION', X_LOGO, 0], ['cm', 'CALLED MOVE', X_CALL, 1], ['pl', 'P&L', X_PL, 1]].forEach(([k, s, x, ax]) => {
    const el = document.createElement('div'); el.className = 'ab lbl'; el.textContent = s; el.style.left = x + 'px'; if (ax) el.style.transform = 'translateX(-100%)'; L.$('#hdr').appendChild(el); hdr[k] = el });
  // the accounts: one glass block an AI, its three positions as rows
  blks = D.ais.map((a, i) => { const el = document.createElement('div'); el.className = 'gls blk';
    el.innerHTML = `<div class="sh"></div><div class="bg"></div><div class="fl"></div><div class="dv"></div>
      ${D.rounds.map(() => `<div class="sep"></div>`).join('')}
      <div class="ab rk"></div><div class="ab mkw">${mark(a.k, 52)}</div><div class="ab nm">${a.name}</div><div class="ab lbl apl">P&L</div><div class="ab ap"></div>
      ${D.rounds.map((r, j) => { const c = r.calls.find(x => x.k === a.k); return `<div class="pos" data-j="${j}"><img class="lgo" src="${r.logo}"><div class="ab sd" style="color:rgb(${c.side === 'LONG' ? UP : DN})">${c.side}</div><div class="ab sz">$100K</div><div class="ab cm">${pctc(c.call)}</div><div class="dot"></div><div class="ab st"></div><div class="ab pl"></div></div>` }).join('')}
      <div class="gl"></div><div class="rim"></div>`;
    L.$('#blks').appendChild(el); return { el, a, k: a.k, i, pos: L.$$('.pos', el), seps: L.$$('.sep', el) } });
  L.$('#ssk').textContent = `P&L AFTER ${D.after} TRADES`;
  // P&L of one position at minute m (or its exact P&L once closed)
  PX = (k, j, m, closed) => { const r = D.rounds[j], c = r.calls.find(x => x.k === k); return closed ? c.pnl : (c.side === 'LONG' ? 1 : -1) * r.px(m) * 1000 };
  // sound
  const C = window.CUES = [[0.05, 'r11-swell', .12], [T_ON - .05, 'sfx-whoosh', .14]];
  D.rounds.forEach((r, j) => C.push([+(T_ON + j * BEAT).toFixed(3), 'r11-card', .1]));
  D.ais.forEach((a, i) => { const t0 = T_FILL + i * 2 * BEAT; C.push([+t0.toFixed(3), 'r11-slide', .1]); [0, 1, 2].forEach(q => C.push([+(t0 + .12 + q * .15).toFixed(3), 'sfx-tick', .09])) });
  let last = -1; for (let t = T_NIGHT; t < TR; t += 1 / 120) { const m = mAt(t), h = Math.floor((m + .001) / 60); if (h !== last && h > 0 && m < T - 30 && !C.some(c => c[1] === 'sfx-clock' && t - c[0] < .14)) { C.push([+t.toFixed(3), 'sfx-clock', .08]); last = h } }
  C.push([TR - .02, 'sfx-riser', .12], [TR, 'sfx-bell', .3], [TR + .12, 'sfx-stamp', .24], [TR + .45, 'r11-kaching', .18], [TR + .55, 'r11-sparkle', .1],
    [T_FOLD, 'sfx-whoosh', .14], [T_FOLD + .45, 'r11-card', .08], [T_SORT, 'r11-thump', .14], [T_SORT + .3, 'sfx-whoosh', .08], [T_LEAD, 'sfx-chime', .14], [T_LEAD + .05, 'r11-sparkle', .1]);
  window.MUSIC = { f: 'm2-phonk', at: 14.79 - TR }; window.DUR = DUR;
};
const spark = (r, m) => { const W = 140, H = 50, T = D.total, X = mm => mm / T * W, Y = v => 3 + (V1 - v) / (V1 - V0) * (H - 6), z = Y(0);
  let pts = []; if (r.path) { pts = r.path.filter(p => p[0] <= m).map(p => [X(p[0]), Y(p[1])]); pts.push([X(m), Y(r.px(m))]) }
  const d = pts.length > 1 ? 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') : '';
  const hx = X(m), hy = Y(r.px(m)), id = 'c' + r.ticker;
  return `<defs><clipPath id="${id}a"><rect x="-4" y="-6" width="150" height="${z + 6}"/></clipPath><clipPath id="${id}b"><rect x="-4" y="${z}" width="150" height="${H - z + 8}"/></clipPath></defs>
    <line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="rgba(242,237,230,.32)" stroke-width="1.5" stroke-dasharray="4 5"/>
    <g clip-path="url(#${id}a)"><path d="${d}" fill="none" stroke="rgb(${UP})" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g clip-path="url(#${id}b)"><path d="${d}" fill="none" stroke="rgb(${DN})" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g>
    <circle cx="${hx}" cy="${hy}" r="4.5" fill="#f2ede6"/>` };
window.R = t => {
  grain(t);
  const T = D.total, m = mAt(t), on = L.eio(L.n(t, T_ON - .1, T_ON + .45)), fz = L.n(t, T_FOLD, T_FOLD + .2), fold = L.eio(L.n(t, T_FOLD + .12, T_FOLD + .8)), fb = L.eo(L.n(t, T_FOLD + .55, T_FOLD + .9)), srt = L.eio(L.n(t, T_SORT, T_SORT + .7));
  const closedT = j => TR + .08 + j * .03;                                    // the gold sweep reaches block row j
  // the sky is the clock: dusk at Thursday's close, night, dawn at the last price (and the day after it for a full session)
  const night = L.n(m, 45, 150) * (1 - L.n(m, 760, 860)), dawn = L.eio(L.n(m, 800, 900));
  L.$('#sk2').style.opacity = dawn; L.$('#tint').style.background = `rgba(3,5,16,${(.45 * night).toFixed(3)})`;
  const drift = -150 + 40 * L.n(t, 0, DUR); L.$$('#sky img').forEach(im => im.style.top = drift.toFixed(1) + 'px');
  L.$('#scrim').style.opacity = .25 + .75 * on; L.$('#dim').style.opacity = (.62 * dawn * on).toFixed(3);
  // the title: alone over the city, then docked top left as the screen comes on
  const tb = L.$('#tbig'), tin = L.eo5(L.n(t, T_LINE, T_LINE + .45)), out = L.eio(L.n(t, T_ON - .05, T_ON + .35));
  tb.style.transform = `translate(${L.lerp(0, -260, out)}px,${L.lerp(330 + 28 * (1 - tin), 40, out)}px) scale(${L.lerp(1, .36, out)})`; tb.style.opacity = tin * (1 - out);
  const td = L.$('#tdock'); td.style.opacity = L.n(t, T_ON + .2, T_ON + .45) * (1 - fold);
  L.$('#clock').style.opacity = L.n(t, T_ON + .1, T_ON + .4) * (1 - fold);
  const c = clock(m); L.$('#ct').textContent = c.day + ' ' + c.t;
  // the market strip
  tiles.forEach((el, j) => { const r = D.rounds[j], t0 = T_ON + j * BEAT, k = L.spring(t - t0, 2, 8), a = L.cl(L.n(t, t0, t0 + .18));
    const x = 56 + j * 328, y = 188 + 36 * (1 - k) - 40 * fold; el.style.transform = `translate(${x}px,${y.toFixed(1)}px)`; el.style.opacity = (t >= t0 ? a : 0) * (1 - fold);
    const v = r.px(m), mv = L.$('.mv', el); mv.textContent = pct0(v); mv.style.color = Math.abs(v) < .005 ? '#f2ede6' : v > 0 ? `rgb(${UP})` : `rgb(${DN})`;
    L.$('svg', el).innerHTML = spark(r, m) });
  // the column heads; the open count runs with the fills and flips to CLOSED at the bell
  const filled = blks.reduce((s, b) => s + [0, 1, 2].filter(q => t >= T_FILL + b.i * 2 * BEAT + .12 + q * .15).length, 0);
  const cl = t >= TR + .1; hdr.op.textContent = cl ? `CLOSED ${N * D.ais.length}` : `OPEN ${filled}`; hdr.op.style.color = cl ? '#fdbc2a' : filled ? '#f2ede6' : '';
  L.$('#hdr').style.opacity = L.n(t, T_FILL - .2, T_FILL + .1) * (1 - fold);
  // the accounts
  blks.forEach(b => { const { el, k, i } = b, t0 = T_FILL + i * 2 * BEAT, ki = L.spring(t - t0, 1.8, 9), ka = L.n(t, t0, t0 + .2);
    const p0 = i, p2 = D.order.indexOf(k), pos = L.lerp(p0, p2, srt);
    const yA = Y0A + p0 * (BHA + GA), yB = Y0B + pos * (BHB + GB), y = L.lerp(yA, yB, fold), h = L.lerp(BHA, BHB, fold);
    el.style.height = h.toFixed(1) + 'px'; el.style.transform = `translate(56px,${(y + 60 * (1 - ki)).toFixed(1)}px)`; el.style.opacity = t >= t0 ? ka : 0; el.style.zIndex = 10 - Math.round(pos);
    // live P&L of each position and of the account; a flash on every tick, green when it rose and red when it fell
    const closed = j => t >= closedT(j), mm = t < T_NIGHT ? 0 : m, mp = t - .1 < T_NIGHT ? 0 : mAt(t - .1);
    const pv = D.rounds.map((r, j) => t < T_NIGHT ? 0 : PX(k, j, mm, closed(j))), pp = D.rounds.map((r, j) => t - .1 < T_NIGHT ? 0 : PX(k, j, mp, t - .1 >= closedT(j)));
    const acc = pv.reduce((s, v) => s + v, 0), accp = pp.reduce((s, v) => s + v, 0);
