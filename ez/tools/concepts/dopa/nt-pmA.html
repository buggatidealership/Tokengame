<!doctype html><meta charset="utf-8"><title>EZ feed mockups walkthrough A</title>
<!-- Night studio, feed product desk A (20 Nov 2026): a 21 s walkthrough of the five production mockups of the Season 2 Feed (PM1 to PM5,
  built inside the live terminal by tools/concepts/night/feed-a/pm.js and shot by feed-a/cap.js into w6/nt/pmA/). One phone, one journey through
  the product, one call followed through it (Qwen SHORT on Elastic, the lone short of five): the timeline (Qwen's post lifts with our plain
  reading), a tap on By company (the Elastic card's 4 LONG v 1 SHORT split lifts), a tap on LONG v SHORT (the face-off before the close; on
  the bed's drop the close lands: Elastic −2.20%, SHORT was right, four wrong), a tap on Qwen's card (the post page; the trade and its receipt
  lift), a tap on AI PROFILES (Qwen's record lifts: 1-2, P&L −$17,660), then the logo. Bed m3-electro from 0 (124 BPM, beat 0.4839 s,
  first beat 0.0251 s, kick in at beat 16 = 7.77 s, the drop on the close). Every cut, lift and tap on a beat. Ground: the painted living-light
  loop (w6/e/gl, Hedra, take E), dimmed, with the brand's green and red rim light and a kick light on every beat.
  The house bug (s2d.html's: the EZ. logo 64 px and EARNINGS ZEASON in Kanit italic 800 31 px) sits 44 px from the top left from frame 0;
  the mark is also inside the scene, in the app's header on the phone, at rest at every segment start (5 times) and on the end card. -->
