<!doctype html><meta charset="utf-8"><title>Season 1, the last round, in glass</title>
<!-- The last round of Season 1 (R112 NVIDIA) in the Season 2 mockup's glass look (owner, 2026-11-18: "Use the glass, aspect, motions,
  effects... as the last round of the season"; wording: long or short only, never "up or down", "a fall", "not real money", "every
  earnings report"). s2a.html's engine: one frosted sheet that changes shape with every scene over slow brand-colour light, each
  element arriving alone with a focus pull. Every number comes from data/r<n>.json (prep.js: the sheet, and Hyperliquid's price path
  scaled onto the sheet's move). Six scenes, one thought each, rolled out one element at a time:
  1 the company, the last trade of Season 1   2 all four went long   3 the report, the path, the move at the close
  4 what each lost (or made)   5 Season 1 is over: the final standings, 4th to 1st   6 the winner and its exact total
  ?r=<round>. The bed m2-phonk-nv (m2-phonk with two bars repeated so it holds through the winner) drops, 14.79 s into it, on the move. window.R(t), READY, CUES, MUSIC, DUR as the other pages.
  Render: bash wrapx.sh "nvglass.html?r=112" 28 post/r112-NVDA-finale-glass m2-phonk-nv 0 .32 -->

</div>

<script>
const q = new URLSearchParams(location.search), RN = +(q.get('r') || 112);
// scene starts: company | sides | report, path, move | the money | the standings | the winner
const T = [0, 3.2, 7.4, 14.8, 19.0, 24.2], DUR = 28, MV = T[2] + 5.4; T.push(DUR + 9);
const G = [[540, 640, 860, 760, 88], [540, 640, 940, 720, 88], [540, 695, 1000, 960, 72], [540, 650, 900, 690, 88], [540, 690, 900, 910, 80], [540, 650, 860, 770, 96]];
const Gn = '#55d6a2', Rd = '#e8576b', Au = '#fdbc2a';
const S = {}, C = []; let t = 0, grain, D;
const add = (h, p) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };
const sp = (x, f = 1.15, d = 8.5) => x <= 0 ? 0 : 1 - Math.exp(-d * x) * Math.cos(2 * Math.PI * f * x);
const arrive = (el, t0, dur = .45, dy = 22, bl = 9) => { const k = L.eo(L.n(t, t0, t0 + dur)); el.style.opacity = k; el.style.transform = `translateY(${dy * (1 - k)}px)`; el.style.filter = k < 1 ? `blur(${(bl * (1 - k)).toFixed(2)}px)` : 'none'; return k };
const pop = (el, a, s0 = .84, bl = 9) => { const x = sp(t - a, 1.25, 8); el.style.opacity = L.n(t, a, a + .16); el.style.transform = `scale(${(s0 + (1 - s0) * x).toFixed(4)})`; el.style.filter = t < a + .4 ? `blur(${(bl * (1 - L.n(t, a, a + .4))).toFixed(2)}px)` : 'none' };
const DAY = { MON: 'Monday', TUE: 'Tuesday', WED: 'Wednesday', THU: 'Thursday', FRI: 'Friday', SAT: 'Saturday', SUN: 'Sunday' };
const NUM = ['No', 'One', 'Two', 'Three', 'All four'], Kk = v => (v < 0 ? '−' : '+') + '$' + Math.round(Math.abs(v) / 1000) + 'K', ORD = ['1st', '2nd', '3rd', '4th', '5th'];

function build() {
  const fld = L.$('#fld'), scs = L.$('#scs'), A = k => D.ai.find(a => a.k === k), n = D.ai.length, down = D.move < 0;
  const longs = D.ai.filter(a => a.side === 'LONG'), shorts = D.ai.filter(a => a.side === 'SHORT'), one = !longs.length || !shorts.length, right = D.ai.filter(a => a.right), wrong = D.ai.filter(a => !a.right);

    ['232,87,107', 780, [.4, .12 + .88 * sr, down ? .2 : .2, down ? 1 : .1, !right.length ? 1 : wrong.length ? .5 : .1, .3, .3], [1070, 1290], [820, 900], 60, 70, 17, 4.2]]

  const sc = () => add('<div class="sc"></div>', scs);
  // 1 the company
  { const s = sc(); S.lg = add(`<div class="c" style="top:322px"><span class="lg"><img src="${D.logo}" alt=""></span></div>`, s); S.co = add(`<div class="c hl" style="top:622px"><span class="fit">${D.co}</span></div>`, s);

  { const s = sc(); S.h2 = add(`<div class="c sub" style="top:360px;font-size:84px">${one ? (n === 4 ? 'All four AIs' : `All ${n} AIs`) : `${longs.length} long. ${shorts.length} short.`}</div>`, s);
    S.b2 = add(`<div class="c hl" style="top:476px;font-size:176px;color:${S.sideC}"><span class="fit">${one ? `went ${longs.length ? 'long' : 'short'}.` : ''}</span></div>`, s);
    S.r2 = add(`<div class="row" style="top:${one ? 742 : 560}px">${D.ai.map(a => `<div class="m">${L.mark(a.k, 144)}<span style="color:${a.side === 'LONG' ? Gn : Rd}">${a.side}</span></div>`).join('')}</div>`, s); S.m2 = L.$$('.m', S.r2) }
  // 3 the report, the path, the move
  { const s = sc(); S.h3 = add(`<div class="c sub" style="top:252px;font-size:64px"><span class="fit">Then ${D.co} reported earnings.</span></div>`, s);
    const X0 = 120, X1 = 960, Y0 = 440, Y1 = 800, P = D.path && D.path.length > 2 ? D.path : [[0, 0], [D.total, D.move]], hi = Math.max(0, ...P.map(p => p[1])), lo = Math.min(0, ...P.map(p => p[1])), pad = (hi - lo) * .1;
    const X = m => X0 + (X1 - X0) * m / D.total, Y = v => Y0 + (hi + pad - v) / (hi - lo + 2 * pad) * (Y1 - Y0), pts = P.map(p => [X(p[0]), Y(p[1])]), cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    // the turn worth a pause: the furthest point against the final move, when it is a real swing (over 1%) before the close
    let pk = -1; P.forEach((p, i) => { if (Math.sign(p[1]) === -Math.sign(D.move) && Math.abs(p[1]) > 1 && (pk < 0 || Math.abs(p[1]) > Math.abs(P[pk][1]))) pk = i });
    const y0 = Y(0), off = ((y0 - Y0 + 60) / (Y1 - Y0 + 120) * 100).toFixed(2);
    S.ch = add(`<svg id="ch"><defs><linearGradient id="lg1" gradientUnits="userSpaceOnUse" x1="0" y1="${Y0 - 60}" x2="0" y2="${Y1 + 60}"><stop offset="${off}%" stop-color="${Gn}"/><stop offset="${off}%" stop-color="${Rd}"/></linearGradient></defs>
      <line x1="${X0}" y1="${y0}" x2="${X1}" y2="${y0}" stroke="rgba(242,237,230,.28)" stroke-width="2" stroke-dasharray="3 9"/>
      <path id="pl" d="M${pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L')}" fill="none" stroke="url(#lg1)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${cum[cum.length - 1].toFixed(1)}" filter="drop-shadow(0 0 10px rgba(0,0,0,.4))"/>
      <circle id="dot" r="11" fill="#f2ede6"/></svg>`, s);
    S.pl = L.$('#pl', S.ch); S.dot = L.$('#dot', S.ch); S.pts = pts; S.cum = cum; S.len = cum[cum.length - 1]; S.fp = pk > 0 ? cum[pk] / S.len : 0; S.y0 = y0;
    S.axA = add(`<div class="ax" style="left:${X0}px;top:${y0 + (P.slice(0, Math.ceil(P.length * .3)).reduce((a, p) => a + p[1], 0) > 0 ? 16 : -44)}px">${(DAY[D.day0] || D.day0).toUpperCase()}'S CLOSE</div>`, s);
    if (pk > 0) { const v = P[pk][1]; S.tag = add(`<div class="tag" style="left:${pts[pk][0] - 4}px;top:${pts[pk][1] - 84}px;color:${v > 0 ? Gn : Rd}">${v > 0 ? '+' : '−'}${Math.round(Math.abs(v))}%</div>`, s);
      S.c3 = add(`<div class="c sub" style="top:900px;font-size:76px">${v > 0 ? 'First it jumped.' : 'First it dropped.'}</div>`, s) }
    S.mv = add(`<div class="c hl" style="top:866px;font-size:178px;color:${down ? Rd : Gn}">${L.pct(D.move)}</div>`, s);
    S.mvl = add(`<div class="c lab" style="top:1072px">BY ${(DAY[D.day1] || D.day1).toUpperCase()}'S CLOSE</div>`, s) }
  // 4 the money
  { const s = sc(), same = one, amt = '$' + D.amt.toLocaleString('en-US');
    S.h4 = add(`<div class="c sub" style="top:378px;font-size:74px"><span class="fit">${same ? `${D.ai[0].side === 'LONG' ? 'Long' : 'Short'} was the ${right.length ? 'right' : 'wrong'} side.` : `${NUM[right.length] || right.length} ${right.length === 1 ? 'was' : 'were'} on the right side.`}</span></div>`, s);
    S.r4 = add(`<div class="row" style="top:512px;gap:26px">${D.ai.map(a => `<div class="m">${L.mark(a.k, 118)}${same ? '' : `<span style="color:${a.right ? Gn : Rd}">${a.right ? '+' : '−'}${amt}</span>`}</div>`).join('')}</div>`, s); S.m4 = L.$$('.m', S.r4);
    S.b4 = add(`<div class="c hl" style="top:${same ? 690 : 742}px;font-size:${same ? 188 : 120}px;color:${S.resC}"><span class="fit">${same ? (right.length ? '+' : '−') + amt : `${right.map(a => a.name).join(', ')} made ${amt}.`}</span></div>`, s);
    S.e4 = add(`<div class="c lab" style="top:${same ? 902 : 888}px">${same ? 'EACH' : ''}</div>`, s) }
  // 5 the standings, arriving 4th to 1st
  { const s = sc(); S.h5 = add(`<div class="c sub" style="top:296px;font-size:84px">Season 1 is over.</div>`, s);
    S.rows = D.order.map((k, i) => add(`<div class="sr" style="top:${452 + i * 150}px"><span class="rk">${ORD[i]}</span>${L.mark(k, 96)}<span class="nm"${i ? '' : ` style="color:${Au}"`}>${A(k).name}</span><span class="am" style="color:${i ? (D.season1[k] < 0 ? Rd : Gn) : Au}">${Kk(D.season1[k])}</span></div>`, s)) }
  // 6 the winner
  { const s = sc(), w = A(D.order[0]); S.w6 = add(`<div class="c" style="top:338px"><span class="ring">${L.mark(w.k, 210)}</span></div>`, s);
    S.a6 = add(`<div class="c hl" style="top:606px;font-size:132px"><span class="fit">${w.name} wins</span></div>`, s); S.b6 = add(`<div class="c hl" style="top:738px;font-size:132px;color:${Au}">Season 1.</div>`, s);
    S.t6 = add(`<div class="c tot" style="top:908px">${L.money(D.season1[w.k])}</div>`, s) }
  S.all = L.$$('.sc', scs);
  L.$('#fine').textContent = `$100K on every trade${D.path ? ' · price path: ' + (/Hyperliquid/.test(D.pathNote || '') ? 'Hyperliquid ' + D.ticker : 'exchange prices') : ''}`;
  // sound: sparing; the bed drops on the move
  C.push([.1, 'r11-swell', .1], [T[1] + .8, 'r11-pluck', .09], [T[2] + .1, 'r11-ping', .08], [MV - 1.6, 'sfx-riser', .12], [MV, 'sfx-boom', .22], [T[3] + 1.6, 'r11-thump', .16], [T[4] + .1, 'r11-ping', .08],
    ...[0, 1, 2].map(j => [T[4] + .9 + j * .62, 'r11-card', .11]), [T[4] + 2.9, 'sfx-chime', .13], [T[5] + .1, 'r11-sparkle', .1], [T[5] + .95, 'r11-kaching', .1]);
  window.MUSIC = { f: q.get('bed') || 'm2-phonk-nv', at: +(q.get('at') || (14.79 - MV).toFixed(2)) };
}

function R(tt) { t = tt; if (grain) grain(t);
  let i = 0; while (i < 5 && t >= T[i + 1]) i++;
  // the light
  let li = 0; while (li < 6 && t >= S.LT[li + 1] - .3) li++;
  S.bl.forEach((o, j) => { const a0 = o.K[Math.max(0, li - 1)], b0 = o.K[li], k = li ? L.eio(L.n(t, S.LT[li] - .3, S.LT[li] + .5)) : 1, st = L.lerp(a0, b0, k), nr = j ? L.cl((st - .35) / .5) : 0;
    const a = 2 * Math.PI * t / o.per + o.ph, x = L.lerp(o.far[0], o.near[0], nr) + o.ax * Math.sin(a), y = L.lerp(o.far[1], o.near[1], nr) + o.ay * Math.cos(a * .8);
    o.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(1 + .1 * Math.sin(a * 1.3)).toFixed(3)})`; o.el.style.opacity = Math.min(1, st).toFixed(3) });
  S.rg.style.transform = `translate(${(880 - 14 * t).toFixed(1)}px,${(230 + 9 * t).toFixed(1)}px)`;
  S.bars.forEach(o => { const p = (t / 26 + o.off) % 1; o.el.style.transform = `rotate(${o.rot}deg) translateY(${(-1100 + 2200 * p).toFixed(1)}px)` });
  // the sheet springs from the last scene's box to this one's
  const PU = .04, end = j => Math.min(T[j + 1], DUR), pu = 1 + PU * L.n(t, T[i], end(i)), k = i ? sp(t - T[i]) : 1, A = G[Math.max(0, i - 1)], B = G[i], g = A.map((v, j) => L.lerp(v * (j > 1 && j < 4 ? 1 + PU : 1), B[j], k) * (j > 1 && j < 4 ? pu : 1));
  const w = Math.max(60, g[2]), h = Math.max(60, g[3]), gl = L.$('#gl'), in0 = sp(t - .05, 1.05, 9);
  gl.style.width = w.toFixed(1) + 'px'; gl.style.height = h.toFixed(1) + 'px'; gl.style.borderRadius = Math.min(g[4], h / 2).toFixed(1) + 'px';
  gl.style.transform = `translate(${(g[0] - w / 2).toFixed(1)}px,${(g[1] - h / 2 + 40 * (1 - Math.min(1, in0))).toFixed(1)}px) scale(${(.92 + .08 * in0).toFixed(4)})`; gl.style.opacity = L.n(t, .02, .3);
  gl.firstElementChild.nextElementSibling.style.transform = `translateX(${(-62 + 124 * L.eio(L.n(t, T[i] + 1.2, end(i) - .2))).toFixed(2)}%)`;
  S.all.forEach((s, j) => { const out = j < 5 ? 1 - L.n(t, T[j + 1] - .2, T[j + 1] - .02) : 1, on = t >= T[j] - .02 && t < T[j + 1] + .05; s.style.display = on ? 'block' : 'none'; s.style.opacity = out;
    if (on) { s.style.transformOrigin = `${G[j][0]}px ${G[j][1]}px`; s.style.transform = `scale(${(1 + PU * L.n(t, T[j], end(j))).toFixed(5)})` } s.style.filter = out < 1 ? `blur(${(8 * (1 - out)).toFixed(2)}px)` : 'none' });
  if (i === 0) { pop(S.lg.firstElementChild, .12, .8); S.lg.style.opacity = 1; arrive(S.co, .5, .45, 26); arrive(S.l1, 1.3, .45) }
  if (i === 1) { const t0 = T[1]; arrive(S.h2, t0 + .1, .4); pop(S.b2, t0 + .85, .86); S.m2.forEach((m, j) => { const a = t0 + (S.one ? 1.6 : .9) + j * .2, x = sp(t - a, 1.3, 8); m.style.opacity = L.n(t, a, a + .16); m.style.transform = `translateY(${(18 * (1 - Math.min(1, x))).toFixed(1)}px) scale(${(.84 + .16 * x).toFixed(4)})` }) }
  if (i === 2) { const t0 = T[2]; arrive(S.h3, t0 + .1, .4); S.ch.style.opacity = L.n(t, t0 + .8, t0 + 1.1); S.axA.style.opacity = L.n(t, t0 + .8, t0 + 1.1);
    // the line draws to the turn, rests there while it is named, then runs to the close, where the move lands on the bed's drop
    const f = S.fp ? L.lerp(0, S.fp, L.eo(L.n(t, t0 + 1.1, t0 + 2.1))) + (1 - S.fp) * L.eio(L.n(t, t0 + 3.3, MV - .15)) : L.eio(L.n(t, t0 + 1.1, MV - .15)), d = f * S.len;
