  Built from s2d.src.html by mk-s2d.py (it pastes Gemini's, Qwen's and Intuit's marks from s2c.html).
  Render: CRF=20 bash wrapx.sh s2d.html 34.5 x2p-s2-intro-d-draft w8f-horns 0 .34
  0 the EZ. logo, EARNINGS ZEASON, the golden ticket SEASON 2 | 1.38 push to the ticket | 2.76 Season 1: the four on the podium, 4 AIs |
  4.14 112 TRADES | 5.52 the rule on glass: hit rate under 50% | 6.90 RELEGATED stamped | 8.28 the hit-rate chart, every trade, the 50% floor
  in glass | 10.34 push to the line ends | 12.41 drop 1: Kimi's tag shatters, the floor cracks, RELEGATED | 13.79 Kimi on the broken
  pedestal, hit rate 46% 51-61 | 15.17 3 STAY | 16.55 GROK DEFENDS THE TITLE | 17.93 NEW FROM CHINA, Qwen's card | 19.31 Qwen takes the
  seat | 20.69 NEW FROM THE US, Gemini's card on the five-pedestal stage | 22.07 Gemini takes the fifth | 23.45 roll call, one a beat
  pair | 24.83 push in | 26.55 drop 2: 5 AIs | 27.93 SAME RULE: hit rate under 50%, RELEGATED stamped over the five (owner, 19 Nov: the rule
  carries into Season 2) | 29.31 EVERY TRADE WITH ITS REASON, Season 2's first posts (Intuit, from the sheet) | 30.69 Gemini's post lifts |
  31.72 the logo, the ticket SEASON 2 and, on glass, EVERYONE STARTS AT P&L $0 (owner, 19 Nov: every AI starts Season 2 at $0), held to the end.
  The newcomers' cards carry the versions the owner named, checked on the labs' own pages on 19 Nov: Qwen4-Max (Alibaba, released 16 Nov 2026)

T.sst = T.same + 2 * BT;   // the second RELEGATED stamp
const SHOTS = [0, 4, 8, 12, 16, 20, 24, 30, 36, 40, 44, 48, 52, 56, 60, 64, 68, 72, 77, 81, 85].map(bt);
/*NEW*/
/*INTU*/
const NAME = { GPT: 'GPT', CLAUDE: 'CLAUDE', GROK: 'GROK', KIMI: 'KIMI', QWEN: 'QWEN', GEMINI: 'GEMINI' };
const TKR = 472 / 927;
// the two podiums (positions measured on the keyed paintings: pedestal centres, the gold plate's centre line, pedestal tops)
const PS4 = 1040 / 995, PX4 = [124.5, 374, 621, 871].map(x => 20 + x * PS4), PL4 = 912 + 174 * PS4, PH4 = 325 * PS4, ORD4 = ['GPT', 'CLAUDE', 'GROK', 'KIMI'];
const PS5 = 1040 / 1000, PX5 = [102, 301.5, 501.5, 699.5, 898.5].map(x => 20 + x * PS5), PL5 = 912 + 167.5 * PS5, PH5 = 318 * PS5, ORD5 = ['GPT', 'CLAUDE', 'GROK', 'QWEN', 'GEMINI'];
const BKW = 600, BKH = 631, BKC = 265, BKR = d => ` translate(${BKC}px,${BKH}px) rotate(${d.toFixed(2)}deg) translate(-${BKC}px,-${BKH}px)`;          // broken.webp and the x of its mass
// the chart: trades 0 to 112 across, hit rate 30% to 80% up; the 50% floor
const CX0 = 214, CX1 = 836, CY = v => 1176 - (v - .30) / .50 * 800, FY = CY(.5), CXJ = j => CX0 + (CX1 - CX0) * j / 112;
const S = { glass: [] }, C = []; let D, t = 0, grain;
const add = (h, p) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };
const vis = (el, v) => { const d = v ? '' : 'none'; if (el._v !== d) { el.style.display = d; el._v = d } return v };
const blr = (el, px) => { el.style.filter = px > .15 ? `blur(${px.toFixed(2)}px)` : '' };
const kick = x => Math.exp(-6.5 * (((x % BT) + BT) % BT)) * (1 - L.n(x, DUR - 1.2, DUR));
const sweep = (el, k) => { el.style.backgroundPosition = `${(125 - 150 * k).toFixed(1)}% 0` };
const glint = (el, u, per) => { const x = ((u % per) + per) % per; el.style.backgroundPosition = `${(100 - 100 * L.n(x, .1, 1.1)).toFixed(1)}% 0` };
const RIM = a => `conic-gradient(from ${a.toFixed(1)}deg,rgba(253,188,42,.95) 0deg,#fff6d6 16deg,rgba(253,188,42,.9) 38deg,rgba(253,188,42,.45) 170deg,#ffedb8 196deg,rgba(253,188,42,.45) 222deg,rgba(253,188,42,.95) 360deg)`;
// put: show at (x, y) with scale and opacity (o 0 hides it)
const put = (el, x, y, s = 1, o = 1, ex = '') => { if (!(o > .001)) { if (el._d !== 0) { el.style.display = 'none'; el._d = 0 } return 0 } if (el._d !== 1) { el.style.display = ''; el._d = 1 }
  el.style.opacity = o >= 1 ? '' : o.toFixed(3); el.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${s.toFixed(4)})${ex}`; return 1 };
const win = (a, b) => t >= a && t < b;
const obj = (cls, src, w, h, inner = '') => `<div class="ob ${cls}" style="width:${w.toFixed(1)}px;height:${h.toFixed(1)}px"><img src="${src}" alt=""><div class="sw"></div>${inner}</div>`;
const mark = (k, s, ring = true) => { if (NEW[k]) return `<svg class="mk" width="${s}" height="${s}" viewBox="-4 -4 32 32" style="border-radius:${s * .26}px;background:#000;${ring ? `box-shadow:0 0 0 ${Math.max(1.5, s * .03)}px rgba(242,237,230,.22),0 18px 30px rgba(0,0,0,.55)` : ''}"><path d="${NEW[k].d}" fill="#fff"${NEW[k].fr ? ' fill-rule="evenodd" clip-rule="evenodd"' : ''}/></svg>`;
  const m = L.models[k]; return `<svg class="mk" width="${s}" height="${s}" viewBox="-4 -4 32 32" style="border-radius:${s * .26}px;background:${m.bg};${ring ? `box-shadow:0 0 0 ${Math.max(1.5, s * .03)}px rgba(242,237,230,.22),0 18px 30px rgba(0,0,0,.55)` : ''}"><path d="${m.d}" fill="${m.fg}"${m.fr ? ` fill-rule="${m.fr}" clip-rule="${m.fr}"` : ''}/>${m.dot ? `<path d="${m.dot}" fill="${m.dotc}"/>` : ''}</svg>` };
// glass: a frosted sheet whose frost is the painted ground behind it, redrawn every frame it shows
function glass(parent, x, y, w, h, r, inner = '', bd = '') { const el = add(`<div class="gl" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${r}px"><canvas class="fr"></canvas><div class="gt"></div><div class="tp"></div><div class="sp"></div><i class="bd"${bd ? ` style="border-color:${bd}"` : ''}></i><i class="rim"></i><div class="in">${inner}</div></div>`, parent);
  const cv = el.querySelector('.fr'); cv.width = Math.max(8, Math.round(w / 4)); cv.height = Math.max(8, Math.round(h / 4)); const g = { el, cv, fx: cv.getContext('2d'), w, h, on: 0 }; S.glass.push(g); return g }
function frost(g) { const r = g.el.getBoundingClientRect(); if (r.width < 4 || r.bottom < 0 || r.top > 1350 || r.right < 0 || r.left > 1080) return; const gr = S.gr, k = 1080 / gr.width;
  const sx = (r.left - gr.left) * k, sy = (r.top - gr.top) * k, sw = r.width * k, sh = r.height * k, P = 40, ax = g.cv.width / sw, ay = g.cv.height / sh, x = g.fx;
  x.filter = 'blur(3px) saturate(160%) brightness(1.12)'; x.drawImage(S.gc, sx - P, sy - P, sw + 2 * P, sh + 2 * P, -P * ax, -P * ay, (sw + 2 * P) * ax, (sh + 2 * P) * ay) }
// a gently waving flag (painted once, drawn in strips with a travelling wave and its light)
function star(x, cx, cy, r, col, rot = 0) { x.fillStyle = col; x.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / 5, rr = i % 2 ? r * .4 : r; x.lineTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a)) } x.closePath(); x.fill() }
function flag(parent, kind, W, H) { const b = document.createElement('canvas'); b.width = W; b.height = H; const x = b.getContext('2d');
  if (kind === 'US') { for (let i = 0; i < 13; i++) { x.fillStyle = i % 2 ? '#f2ede6' : '#c8302b'; x.fillRect(0, i * H / 13, W, H / 13 + 1) } x.fillStyle = '#26315f'; x.fillRect(0, 0, W * .42, H * 7 / 13);
    for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) star(x, W * .42 * (c + .5) / 6, H * 7 / 13 * (r + .5) / 5, H * .03, '#f2ede6') }
  else { x.fillStyle = '#de2910'; x.fillRect(0, 0, W, H); star(x, W * .17, H * .27, H * .15, '#ffde00'); [[.33, .1, .9], [.4, .2, .5], [.4, .35, 0], [.33, .45, -.4]].forEach(([a, c, r]) => star(x, W * a, H * c, H * .05, '#ffde00', r)) }
  const cv = add(`<canvas class="ab" width="${W + 8}" height="${H + 40}"></canvas>`, parent); return { cv, x: cv.getContext('2d'), base: b, W, H } }
function drawFlag(f, tt) { const x = f.x, W = f.W, H = f.H, st = 3; x.clearRect(0, 0, W + 8, H + 40);
  for (let i = 0; i < W; i += st) { const u = i / W, ph = u * 7.5 - tt * 5.2, a = 10 * u * Math.sin(ph), sh = .2 * u * Math.cos(ph), y = 18 + a;
    x.drawImage(f.base, i, 0, st, H, i, y, st + .7, H); x.fillStyle = sh < 0 ? `rgba(0,0,0,${(-sh * 1.4).toFixed(3)})` : `rgba(255,255,255,${(sh * .7).toFixed(3)})`; x.fillRect(i, y, st + .7, H) } }
// the ribbon of a line: one outline, round head and tail
function ribbon(x, pts, w, f = 1) { const n = pts.length; if (n < 2) return; const A = [], B = []; let d0, d1;
  for (let i = 0; i < n; i++) { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)]; let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1, h = w * f / 2; dx /= l; dy /= l; if (!i) d0 = [dx, dy]; d1 = [dx, dy]; A.push(pts[i][0] - dy * h, pts[i][1] + dx * h); B.push(pts[i][0] + dy * h, pts[i][1] - dx * h) }
  x.beginPath(); x.moveTo(A[0], A[1]); for (let i = 1; i < n; i++) x.lineTo(A[2 * i], A[2 * i + 1]); const a1 = Math.atan2(d1[0], -d1[1]); x.arc(pts[n - 1][0], pts[n - 1][1], w * f / 2, a1, a1 - Math.PI, true);
  for (let i = n - 1; i >= 0; i--) x.lineTo(B[2 * i], B[2 * i + 1]); const a0 = Math.atan2(-d0[0], d0[1]); x.arc(pts[0][0], pts[0][1], w * f / 2, a0, a0 - Math.PI, true); x.closePath(); x.fill() }

/* ───────── build ───────── */
function build() {

  S.p4b = add(`<div class="pod" style="width:1040px;height:${PH4.toFixed(1)}px;clip-path:inset(0 0 0 ${(20 + 0 + 760 * PS4).toFixed(1)}px)"><img src="w6/e/podium.webp" alt=""></div>`, sc);
  S.bkr = add(`<div class="beam r" style="left:${(PX4[3] - 95).toFixed(1)}px;top:380px"></div>`, sc);
  S.bk = add(`<img class="ab" src="w6/s2/broken.webp" width="${BKW}" height="${BKH}" alt="">`, sc);
  S.beams5 = PX5.map((x, i) => add(`<div class="beam${i === 4 ? ' g' : ''}" style="left:${(x - 95).toFixed(1)}px;top:380px"></div>`, sc));
  S.p5 = add(`<div class="pod" style="width:1040px;height:${PH5.toFixed(1)}px"><img src="w6/s2/podium5.webp" alt=""></div>`, sc);
  S.p5e = add(`<div class="pod" style="width:1040px;height:${PH5.toFixed(1)}px;clip-path:inset(0 0 0 ${(805 * PS5).toFixed(1)}px)"><img src="w6/s2/podium5.webp" alt=""></div>`, sc);
