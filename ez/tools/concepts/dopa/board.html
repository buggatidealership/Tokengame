<!doctype html><meta charset="utf-8"><title>R106 five cuts</title>
<!-- Review board: five frames per cut (frame 0, the build, the reveal, after it, the end hold), from bd/v<n>-<k>.jpg (board.sh). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&family=Geist+Mono:wght@500;600&display=swap">
<style>
*{margin:0;box-sizing:border-box}body{width:1790px;background:#0e0c0b;color:#f2ede6;font-family:Inter;padding:44px 40px}
h1{font:900 46px Inter;letter-spacing:-.03em}p.s{font:500 19px 'Geist Mono';color:#8e8680;margin:10px 0 30px;letter-spacing:.04em}
.r{display:grid;grid-template-columns:300px repeat(5,264px);gap:14px;align-items:start;margin-bottom:26px}
.r .t b{display:block;font:900 30px Inter;letter-spacing:-.02em}.r .t span{display:block;font:500 17px/1.45 'Geist Mono';color:#8e8680;margin-top:8px}
.r figure img{width:264px;height:330px;border-radius:12px;display:block;box-shadow:0 0 0 1px #2a2522}
.r figcaption{font:500 15px 'Geist Mono';color:#5f5853;margin-top:6px;letter-spacing:.04em}
</style>
<h1>R106 CoreWeave · five resolution cuts</h1>
<p class="s">1080 drafts with sound · real Hyperliquid path scaled onto the sheet's +24.71% · checks in ez/x-dopamine-spec.md</p>
<div id="rows"></div>
<script>
const C = [
 ['1 · The sweat', 'Suspense spread over time: the real path, every P&L live, the last hour slow, the bell.', [0, 3.5, 6.6, 7.6, 10.5]],
 ['2 · The balance', 'Space as the stakes: four tanks of $100K; one fills, three drain, the surface sloshes with the speed of the move.', [0, 2.5, 4.6, 6.1, 9.0]],
 ['3 · The P&L cards', 'The shape traders share: belief, the close, the shorts turn first, the only long last.', [0, 2.6, 3.9, 5.3, 9.5]],
 ['4 · The standings swing', 'Inside the app: the result card grades, the chips fly into the season board, GPT back to even.', [0, 2.0, 4.1, 5.6, 9.6]],
 ['5 · The number', 'Kinetic type on the beat (130 BPM), the drop on the reveal, the size of the move against a normal one.', [0, 2.0, 5.0, 5.8, 10.5]]];
const K = ['frame 0', 'the build', 'the reveal', 'after', 'end hold'];
document.getElementById('rows').innerHTML = C.map((c, i) => `<div class="r"><div class="t"><b>${c[0]}</b><span>${c[1]}</span></div>${c[2].map((t, k) => `<figure><img src="bd/v${i + 1}-${k}.jpg"><figcaption>${t.toFixed(1)} s · ${K[k]}</figcaption></figure>`).join('')}</div>`).join('');
Promise.all([...document.images].map(i => i.decode().catch(() => 0))).then(() => document.fonts.ready).then(() => window.READY = 1);
</script>
