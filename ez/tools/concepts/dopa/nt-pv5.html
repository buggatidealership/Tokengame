<!doctype html><meta charset="utf-8"><title>pv5 the vote</title>
<!-- Night prediction film 5, "The vote" (2026-11-20). One line: five AIs cast their votes before the report, and one stands alone.
  A painted marble hall (Hedra, w6/nt/pv/pv5-hall.jpg) with two glass urns on the plinth, LONG lit green and SHORT lit red, the EZ. mark etched
  in each. The count comes first: on the bed's drop all five ballots fall into the urns and the urns count them. Then each ballot is drawn out
  and read: the AI, its side and called move, its confidence, its own words with the key clause marked; the lone side is read last.
  The grading line, then the logo. Kanit (everything; it is also the logotype's face) and Geist Mono (numbers). Default company Elastic (4 LONG
  v 1 SHORT); ?co=INTU|KEYS|ESTC. Bed m2-phonk (130 BPM, drops at 7.40 and 14.80 s), entered so its first drop lands on the count.
  window.R(t), READY, DUR, MUSIC, CUES. No outcome anywhere. -->
<style>
#hall{position:absolute;left:-70px;top:-90px;width:1220px;height:1627px;object-fit:cover}
#gl{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
#scene{position:absolute;inset:0}
.urn{position:absolute;top:706px;width:330px;height:450px;margin-left:-165px}
.urn .bk{position:absolute;inset:0;border-radius:40px 40px 26px 26px;background:linear-gradient(90deg,rgba(248,240,217,.06),rgba(248,240,217,.02) 40%,rgba(248,240,217,.07));box-shadow:inset 0 0 0 2px rgba(248,240,217,.18)}
.urn .in{position:absolute;left:14px;right:14px;top:30px;bottom:16px;border-radius:30px 30px 18px 18px}
.urn .fr{position:absolute;inset:0;border-radius:40px 40px 26px 26px;pointer-events:none;
  background:linear-gradient(90deg,rgba(248,240,217,.22) 0,rgba(248,240,217,.04) 12%,transparent 30%,transparent 70%,rgba(248,240,217,.05) 86%,rgba(248,240,217,.2) 100%);
  box-shadow:inset 0 0 0 2.5px rgba(248,240,217,.35),inset 0 22px 30px -18px rgba(248,240,217,.35),0 30px 60px rgba(0,0,0,.5)}
.urn .rim{position:absolute;left:-8px;right:-8px;top:-10px;height:30px;border-radius:15px;background:linear-gradient(180deg,rgba(248,240,217,.5),rgba(248,240,217,.12));box-shadow:0 6px 16px rgba(0,0,0,.4)}
.urn .slot{position:absolute;left:90px;right:90px;top:-4px;height:10px;border-radius:5px;background:#04070e}
.urn .et{position:absolute;left:0;right:0;top:40px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.urn .et img{opacity:.75;filter:drop-shadow(0 0 10px rgba(248,240,217,.25))}
.urn .et b{font:italic 800 40px/1 Kanit;letter-spacing:.06em}
.urn .ct{position:absolute;left:0;right:0;top:-150px;text-align:center;font:700 120px/1 'Geist Mono';letter-spacing:-.04em;text-shadow:0 0 30px currentColor}
.urn .glow{position:absolute;left:-60px;right:-60px;bottom:-40px;height:200px;border-radius:50%;filter:blur(30px);opacity:.5}
.slip{position:absolute;left:50%;width:260px;height:52px;margin-left:-130px;border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:linear-gradient(160deg,rgba(248,240,217,.32),rgba(248,240,217,.12));box-shadow:inset 0 0 0 1.5px rgba(248,240,217,.45),0 8px 16px rgba(0,0,0,.4)}
.slip b{font:italic 800 28px/1 Kanit;color:#f8f0d9}
.slip i{margin-left:auto;width:12px;height:30px;border-radius:4px}
#top{position:absolute;left:44px;right:44px;top:140px;height:150px;z-index:30;display:flex;align-items:center;gap:26px;padding:0 32px;border-radius:24px;
  background:linear-gradient(160deg,rgba(248,240,217,.16),rgba(248,240,217,.05));backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(248,240,217,.55),inset 0 0 0 1.5px rgba(248,240,217,.22),0 24px 60px rgba(0,0,0,.5)}
#top b{font:italic 800 84px/1 Kanit;color:#f8f0d9;letter-spacing:-.005em}
#top span{margin-left:auto;text-align:right;font:500 34px/1.12 Kanit;color:#f8f0d9}
#big{position:absolute;left:0;right:0;top:360px;text-align:center;z-index:35;pointer-events:none;font:italic 800 150px/1 Kanit;text-shadow:0 14px 50px rgba(0,0,0,.7)}
#big i{font-style:italic;font-weight:500;font-size:90px;color:#f8f0d9;margin:0 26px}
#big small{font-size:58px;letter-spacing:.04em;margin-left:14px}
#bal{position:absolute;left:70px;width:940px;top:330px;z-index:40;padding:36px 44px 42px;border-radius:30px;
  background:linear-gradient(160deg,rgba(248,240,217,.2),rgba(248,240,217,.06) 45%,rgba(248,240,217,.11));backdrop-filter:blur(18px) saturate(1.25);
  box-shadow:inset 0 1.5px 0 rgba(248,240,217,.7),inset 0 0 0 2px rgba(248,240,217,.25),0 40px 90px rgba(0,0,0,.6)}
#bal .hd{display:flex;align-items:center;gap:22px}
#bal .hd b{font:italic 800 70px/1 Kanit;color:#f8f0d9}
#bal .seal{position:absolute;left:50%;top:-40px;margin-left:-40px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55))}
#bal .sd{display:inline-flex;align-items:baseline;gap:14px;margin-top:28px;padding:12px 22px 10px;border-radius:14px;color:#04070e;font:italic 800 60px/1 Kanit;letter-spacing:.02em}
#bal .sd span{font:700 52px/1 'Geist Mono';letter-spacing:-.03em;font-style:normal}
#bal .cf{margin-top:22px;font:600 42px/1 'Geist Mono';color:#f8f0d9}
#bal .ow{margin-top:30px;font:600 26px/1 Kanit;letter-spacing:.16em;text-transform:uppercase;color:rgba(248,240,217,.7)}
#bal .cl{margin-top:12px;font:italic 600 72px/1.1 Kanit;color:#f8f0d9}
#alone{position:absolute;left:0;right:0;top:1090px;text-align:center;z-index:41;font:italic 800 56px/1 Kanit;color:#f8f0d9;text-shadow:0 6px 30px rgba(0,0,0,.8)}
#gr{position:absolute;left:0;right:0;top:420px;text-align:center;z-index:36;font:italic 700 66px/1 Kanit;color:#f8f0d9;text-shadow:0 8px 40px rgba(0,0,0,.8)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 60% at 50% 50%,transparent 50%,rgba(0,0,0,.6));z-index:5}
#end{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(55% 40% at 50% 45%,rgba(253,188,42,.2),transparent 70%),rgba(4,7,14,.9);opacity:0}
#end b{font:italic 800 70px/1 Kanit;color:#f8f0d9}
#end span{font:500 42px/1 Kanit;color:#f8f0d9}
</style>
<img id="hall" src="w6/nt/pv/pv5-hall.jpg"><div id="gl"></div>
<div id="scene"><div class="urn" id="uL"></div><div class="urn" id="uS"></div></div>
<div id="vig"></div>
<div id="top"></div><div id="big"></div><div id="bal"></div><div id="alone"></div><div id="gr"></div><div id="end"></div>
<div id="bugw"></div><canvas id="grain"></canvas>
<script src="w6/nt/pv/pv.js"></script>
<script>
const B = 60 / 130, P0 = .02, AT = P0 + 10 * B;        // m2-phonk: 130 BPM, first beat 0.02 s, drops on its beats 16 and 32; entered on beat 10, so they are film beats 6 and 22
const G = { B, at: n => n * B, beat: t => t / B };
let T = {}, ord, grain, slips = {};
(async () => {
  await PV.load('ESTC', 'https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700;1,800&display=swap');
  PV.$('#bugw').innerHTML = PV.bug();
  // the reading order: the bigger side by confidence, the lone (or smaller) side last
  ord = [...PV.calls.filter(x => x.side === PV.maj).sort((a, b) => b.conf - a.conf), ...PV.calls.filter(x => x.side !== PV.maj).sort((a, b) => b.conf - a.conf)];
  PV.$('#top').innerHTML = `${PV.coLogo(104)}<b>${PV.esc(PV.co.co)}</b><span>Reports ${PV.co.callDay}<br>${PV.co.when}</span>`;
  const urn = (id, side, n) => { const col = side === 'LONG' ? PV.C.green : PV.C.red;
    PV.$(id).innerHTML = `<i class="glow" style="background:${col}"></i><div class="bk"></div><div class="in"></div><div class="et">${PV.logo(66)}<b style="color:${col}">${side}</b></div><div class="ct" style="color:${col}">0</div><div class="fr"></div><div class="rim"></div><i class="slot"></i>` };
  urn('#uL', 'LONG'); urn('#uS', 'SHORT');
  PV.$('#uL').style.left = '290px'; PV.$('#uS').style.left = '790px';
  // the slips: one per AI, falling into its urn and stacking at the bottom
  ord.forEach(x => { const u = x.side === 'LONG' ? PV.$('#uL .in') : PV.$('#uS .in'), el = document.createElement('div'); el.className = 'slip';
    el.innerHTML = `${PV.mark(x.k, 38)}<b>${x.name}</b><i style="background:${PV.side(x)}"></i>`; u.appendChild(el); slips[x.k] = el });
  PV.$('#big').innerHTML = `<span style="color:${PV.C.green}">${PV.nL}<small>LONG</small></span><i>v</i><span style="color:${PV.C.red}">${PV.nS}<small>SHORT</small></span>`;
  const lone = Math.min(PV.nL, PV.nS) === 1 ? `1 against ${Math.max(PV.nL, PV.nS)}` : '';
  PV.$('#alone').textContent = lone;
  PV.$('#gr').textContent = PV.graded;
  PV.$('#end').innerHTML = `${PV.logo(300)}<b>EARNINGS ZEASON</b><span>${PV.graded}</span>`;
  grain = PV.grain(PV.$('#grain'), .06); pulse = PV.pulse('253,188,42', '50% 14%');
  // the timeline in beats: the urns (0 to 6), the ballots fall and the count on the drop (6), each ballot read (6 beats; 7 for a long clause), the end
  const fall = ord.map((_, i) => 1.4 + i);           // each slip lands on a beat (2 to 6), the last on the drop
  const len = ord.map(x => PV.need(x.clause) > 3.5 ? 7 : 6), starts = []; let b = 8; len.forEach(l => { starts.push(b); b += l });
  T = { fall, count: 6, starts, len, end: b, logo: b + 2, dur: b + 8.5 };
  window.TL = { count: +G.at(6).toFixed(3), drop2: +G.at(22).toFixed(3), starts: starts.map(s => +G.at(s).toFixed(3)), end: +G.at(b).toFixed(3), dur: +G.at(T.dur).toFixed(3) };
  window.HOLD = ord.map((x, i) => ({ k: x.k, clause: x.clause, need: +PV.need(x.clause).toFixed(2), onScreen: +((len[i] - 1.1) * B).toFixed(2) }));
  window.CUES = [[.04, 'r11-swell', .1]];
  fall.forEach(f => CUES.push([G.at(f + .6), 'r11-knock', .1]));
  CUES.push([G.at(6), 'r11-thump', .16], [G.at(6) + .01, 'sfx-coin', .1]);
  starts.forEach(s => CUES.push([G.at(s), 'sfx-whoosh', .1], [G.at(s + .6), 'r11-ping', .07]));
  CUES.push([G.at(b), 'r11-card', .1], [G.at(T.logo), 'sfx-chime', .1]);
  window.MUSIC = { f: 'm2-phonk', at: +AT.toFixed(4) }; window.DUR = +G.at(T.dur).toFixed(3);
  await PV.ready(['italic 800 84px Kanit', 'italic 600 72px Kanit', '500 34px Kanit', '700 120px "Geist Mono"']);
  await PV.go();
})();
let bk = '';
const fillBal = x => { if (bk === x.k) return; bk = x.k;
  PV.$('#bal').innerHTML = `<span class="seal">${PV.logo(80)}</span><div class="hd">${PV.mark(x.k, 92)}<b>${x.name}</b></div><span class="sd" style="background:${PV.side(x)}">${x.side} <span>(${PV.mv(x)})</span></span>
    <div class="cf">${PV.conf(x)}</div><div class="ow">In its own words</div><div class="cl">${PV.words(x.clause)}</div>` };
let pulse = () => {};
window.R = t => {
  grain(t); const k = G.beat(t); pulse(k);
  const cur = T.starts.filter(s => k >= s).length - 1, inB = cur >= 0 && k < T.end, sp = inB ? ord[cur] : null;
  // the camera: a slow orbit by parallax (the hall moves less than the urns), a lean toward the urn of the ballot in hand, punches on the drops
  const punch = d => { const x = k - d; return x < 0 ? 0 : .035 * Math.exp(-3.5 * x) };
  let lean = 0; if (inB) { const to = sp.side === 'LONG' ? -1 : 1, from = cur ? (ord[cur - 1].side === 'LONG' ? -1 : 1) : 0; lean = PV.lerp(from, to, PV.eio(PV.n(k, T.starts[cur], T.starts[cur] + 1))) }
  const m2 = inB ? PV.eio(PV.n(k, T.starts[cur] + 3, T.starts[cur] + 3.5)) : 0; const orb = 40 * Math.sin(t * .35) + 70 * lean - 50 * lean * m2, sc = PV.lerp(1.14, 1, PV.eo(PV.n(k, 0, 6))) + punch(6) + punch(22) + .015 * Math.sin(t * .7) + .06 * m2;
  PV.$('#hall').style.transform = `translate(${(orb * .45).toFixed(1)}px,${(8 * Math.sin(t * .5)).toFixed(1)}px) scale(${(1 + (sc - 1) * .6).toFixed(4)})`;
  PV.$('#scene').style.transform = `translate(${(orb).toFixed(1)}px,${(10 * Math.sin(t * .5)).toFixed(1)}px) scale(${sc.toFixed(4)})`; PV.$('#scene').style.transformOrigin = '540px 900px';
  const ph = ((k % 1) + 1) % 1; PV.$('#gl').style.background = `radial-gradient(40% 30% at 50% 10%,rgba(253,188,42,${(.12 + .12 * Math.exp(-5 * ph)).toFixed(3)}),transparent 70%)`;
  // the title glass: in at once
  const ti = PV.n(k, -.6, .6); PV.$('#top').style.opacity = (ti * (1 - PV.n(k, T.logo, T.logo + .5))).toFixed(3); PV.$('#top').style.transform = `translateY(${(-30 * (1 - PV.eo(ti))).toFixed(1)}px)`;
  // the slips fall into their urns and stack; the urn's count steps as each lands; a drawn slip leaves its urn while read
  const cnt = { LONG: 0, SHORT: 0 }, last = { LONG: -9, SHORT: -9 }, idx = { LONG: 0, SHORT: 0 };
  ord.forEach((x, i) => { const el = slips[x.k], f = T.fall[i], q = PV.n(k, f, f + .6), land = f + .6, j = idx[x.side]++;
    const restY = 390 - 56 * (j + 1), y = q < 1 ? PV.lerp(-560, restY, PV.ei(q)) : restY + (k < land + .5 ? -14 * Math.exp(-6 * (k - land)) * Math.sin((k - land) * 12) : 0);
    const out = inB && sp.k === x.k ? PV.eo(PV.n(k, T.starts[cur], T.starts[cur] + .5)) * (1 - PV.n(k, T.starts[cur] + T.len[cur] - .5, T.starts[cur] + T.len[cur])) : 0;
    el.style.top = (y - 500 * out).toFixed(1) + 'px'; el.style.opacity = k < f ? 0 : 1; el.style.transform = `rotate(${((j % 2 ? 1 : -1) * 4 * (1 - .5 * q)).toFixed(2)}deg)`;
    if (k >= land) { cnt[x.side]++; last[x.side] = land } });
  ['LONG', 'SHORT'].forEach(s => { const e = PV.$(s === 'LONG' ? '#uL .ct' : '#uS .ct'); e.textContent = cnt[s]; const q = PV.n(k, last[s], last[s] + .7);
    e.style.transform = `scale(${(1 + .4 * Math.sin(Math.PI * q)).toFixed(3)})`; e.style.opacity = cnt[s] ? 1 : .3 });
  // the urn of the ballot in hand glows; the other dims a little
  ['#uL', '#uS'].forEach((id, i) => { const side = i ? 'SHORT' : 'LONG', on = inB && sp.side === side; PV.$(id + ' .glow').style.opacity = (.35 + .35 * (on ? 1 : 0) + .2 * Math.exp(-5 * ph)).toFixed(3); PV.$(id).style.filter = inB && !on ? 'brightness(.7)' : '' });
  // the count: big on the drop, then it rests in the urns
  const bg = PV.$('#big'), c = PV.n(k, 6, 6.35), co = PV.n(k, 7.3, 8);
  bg.style.opacity = ((c > 0 ? 1 : 0) * (1 - co)).toFixed(3); bg.style.transform = `scale(${(PV.lerp(1.8, 1, PV.eo5(c)) * PV.lerp(1, .8, co)).toFixed(3)}) rotate(${PV.lerp(-6, -2, c).toFixed(2)}deg)`;
  // the ballot in hand: drawn up out of its urn, read, put back
  const bl = PV.$('#bal');
  if (inB) { fillBal(sp); const s0 = T.starts[cur], l = T.len[cur], a = PV.eo5(PV.n(k, s0 + .2, s0 + .8)), o = PV.ei(PV.n(k, s0 + l - .5, s0 + l)), q = Math.min(a, 1 - o);
    const ux = sp.side === 'LONG' ? -250 : 250; bl.style.opacity = PV.cl(q * 2).toFixed(3);
    bl.style.transform = `translate(${(ux * (1 - q)).toFixed(1)}px,${(380 * (1 - q)).toFixed(1)}px) scale(${PV.lerp(.3, 1, q).toFixed(3)}) rotate(${((1 - q) * (ux > 0 ? 6 : -6) + .8 * Math.sin(t * 1.2)).toFixed(2)}deg)`;
    PV.sweep(bl.querySelector('.cl'), PV.eio(PV.n(k, s0 + 1.4, s0 + 3.6)));
    const sd = bl.querySelector('.sd'), sq = PV.n(k, s0 + .7, s0 + 1.1); sd.style.transform = `scale(${PV.lerp(1.4, 1, PV.eo5(sq)).toFixed(3)})`; sd.style.transformOrigin = '0 50%' }
  else bl.style.opacity = 0;
  // the lone side: said once, under its ballot
  const isLone = inB && cur === ord.length - 1 && Math.min(PV.nL, PV.nS) === 1, al = isLone ? PV.n(k, T.starts[cur] + 1, T.starts[cur] + 1.6) * (1 - PV.n(k, T.end - .5, T.end)) : 0;
  PV.$('#alone').style.opacity = al.toFixed(3); PV.$('#alone').style.color = PV.nL < PV.nS ? PV.C.green : PV.C.red;
  // the grading line, then the end card
  const g = PV.n(k, T.end, T.end + .5); PV.$('#gr').style.opacity = (g * (1 - PV.n(k, T.logo, T.logo + .4))).toFixed(3);
  const ce = PV.n(k, T.logo, T.logo + .6), en = PV.$('#end'); en.style.opacity = ce.toFixed(3);
  en.querySelector('img').style.transform = `scale(${(1.15 - .15 * PV.eo5(ce) + .02 * Math.exp(-5 * ph)).toFixed(3)}) rotate(${(2 * Math.sin(t * .9)).toFixed(2)}deg)`;
};
</script>
