<!doctype html><meta charset="utf-8"><title>EZ night fv2 translate</title>
<!-- Night studio, feed film FV2 "Translate" (desk A, 2026-11-20). Message: we translate the jargon. Feature: the "In plain words" layer.
  On cream paper (painted), Grok's Intuit reason types in verbatim in Geist Mono; a red pencil marks its jargon; on the drop the macro camera
  follows it phrase by phrase while each phrase condenses into our plain reading in Instrument Serif: "Heavy washout and AI-disruption
  overhang" becomes "Already sold hard on AI fears.", "beat unlikely to re-anchor ownership" becomes "A beat is unlikely to bring buyers back",
  "before next close." becomes "by the close."; the clause the reading leaves out crumbles; the words both say (AI, beat, unlikely, close)
  glide across in gold, so the facts are seen to stay. Then the paragraph flies into the app's In plain words panel under Grok's post;
  SEASON 2, In plain words. The plain reading is w6/fl/data.json's (it adds no fact Grok did not write). Bed m3-electro from 3.871 s
  (8 beats in), so its kick drops in at B(8) = 3.896 s, the first translation. Type: Instrument Serif (our words) and Geist Mono (Grok's
  words, labels). Switches: ?s1=&s2= (the lines), ?name=. -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');
#st{background:#f8f0d9}
#gnd{position:absolute;left:-40px;top:-50px;width:1160px;height:1450px;background:url(w6/nt/fv2/ground.jpg) center/cover;transform-origin:540px 600px}
#lite{position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 44%,rgba(253,188,42,.22),transparent 70%);opacity:0;pointer-events:none}
#bug b{font-family:'Instrument Serif',serif;font-weight:400;font-size:42px;color:#04070e;text-shadow:none;letter-spacing:-.005em}
#bug img{filter:none}
#pg{position:absolute;inset:0;transform-origin:0 0}
#kick{position:absolute;left:72px;top:250px;display:flex;align-items:center;gap:16px;font:700 30px/1 'Geist Mono';letter-spacing:.12em;color:#04070e}
#kick .S{color:#d7262e}#kick img{width:44px;height:44px;border-radius:11px}
.par{position:absolute;left:72px;width:936px}
#jg{top:356px;font:500 40px/1.42 'Geist Mono';color:rgba(4,7,14,.86);letter-spacing:-.01em}
#pl{top:350px;font:400 88px/1.04 'Instrument Serif',serif;color:#04070e;letter-spacing:-.012em}
.par span{display:inline-block;white-space:pre}
#pl span{opacity:0}
#jg .an,#pl .an{color:#04070e}
#cur{position:absolute;width:22px;height:46px;background:#04070e;opacity:0}
#sq{position:absolute;left:0;top:0;width:1080px;height:1350px;overflow:visible;pointer-events:none}
#sq path{fill:none;stroke:#e0281f;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.mk{position:absolute;height:.9em;background:rgba(253,188,42,.75);border-radius:.12em;transform-origin:0 50%;mix-blend-mode:multiply}
.ln{position:absolute;left:60px;right:60px;top:1066px;z-index:40;text-align:center;font:400 104px/1 'Instrument Serif',serif;color:#04070e;letter-spacing:-.015em}
.ln i.y{color:#04070e;background:linear-gradient(transparent 62%,rgba(253,188,42,.8) 62%)}
#phw{position:absolute;left:0;top:0}
#end{top:380px}#end small{color:#04070e;background:linear-gradient(transparent 55%,rgba(253,188,42,.85) 55%);display:inline-block;padding:0 .3em}
#end h3{font-family:'Instrument Serif',serif;font-weight:400;font-size:150px;color:#04070e;letter-spacing:-.02em}
#end img{filter:drop-shadow(0 18px 40px rgba(4,7,14,.25))}
#grain{opacity:.04!important}
#vig{background:radial-gradient(ellipse 80% 70% at 50% 48%,transparent 60%,rgba(70,50,20,.22))}
#l2{top:160px}
</style>
<div id="st">
<div id="gnd"></div><div id="lite"></div>
<div id="pg"><div id="kick"></div><div class="par" id="jg"></div><div class="par" id="pl"></div><div id="cur"></div><svg id="sq"></svg></div>
<div id="phw"></div>
<div class="ln" id="l1"></div><div class="ln" id="l2"></div>
<div id="lift"></div>
<div id="td"></div><div id="tr"></div>
<div id="vig"></div><canvas id="grain"></canvas>
</div>
<script src="lib.js"></script>
<script src="w6/nt/fva/fv.js"></script>
<script>
const Q = new URLSearchParams(location.search), B = FV.B, n = FV.n, cl = FV.cl, lerp = FV.lerp, eo = FV.eo, eio = FV.eio, spr = FV.spr, $ = FV.$, $$ = FV.$$;
const S1 = Q.get('s1') || 'We {y translate} the jargon', S2 = Q.get('s2') || 'Same facts plain words', NAME = Q.get('name') || 'In plain words', DUR = 15.4, AT = 8 * FV.BT;
// Grok's reason, verbatim (calls.csv), in four groups; our plain reading (data.json) in three; a word marked * is in both (the facts kept)
const JG = [['Heavy', 'washout', 'and', '*AI-disruption', 'overhang'], ['leave', 'residual', 'owned', 'slower-growth', 'story', 'as', 'confirmation;'], ['*beat', '*unlikely', 'to', 're-anchor', 'ownership'], ['before', 'next', '*close.']];
const PL = [['Already', 'sold', 'hard', 'on', '*AI', 'fears.'], ['A', '*beat', 'is', '*unlikely', 'to', 'bring', 'buyers', 'back'], ['by', 'the', '*close.']];
const MAP = [0, -1, 1, 2];   // jargon group -> plain group (-1: left out, it crumbles)
const SQ = [[0, 1], [0, 4], [1, 1, 2], [2, 3, 4]];   // the red pencil: under washout, overhang, residual owned, re-anchor ownership
// ---- the beats ----
const T = { type0: B(0) + .15, type1: B(3.6), sq: [4, 5, 6, 7].map(B), drop: B(8), g: [B(8), B(11), B(14)], crumble: B(8), wide: B(17), mark: B(17.5), phone: B(20), end: B(24.5) };
let grain, M = {};
(async () => {
  await FV.boot(async () => {
    $('#st').insertAdjacentHTML('afterbegin', FV.bug()); $('#st').insertAdjacentHTML('beforeend', FV.end('SEASON 2', NAME));
    FV.line($('#l1'), S1); FV.line($('#l2'), S2);
    const D = FV.D, g = FV.F('GROK'), co = D.cos.INTU;
    if (JG.flat().join(' ').replace(/\*/g, '') !== D.feed.find(x => x.k === 'GROK').keep) throw new Error('Grok text differs from data.json');
    if (PL.flat().join(' ').replace(/\*/g, '') !== g.plain.join(' ')) throw new Error('plain reading differs from data.json');
    $('#kick').innerHTML = `${FV.mark('GROK', 44)}<span>GROK</span><span class="S">SHORT (−${g.size}%)</span><img src="${co.logo}" alt=""><span>INTUIT</span>`;
    const sp = (G, cls) => G.map((grp, gi) => grp.map((w, wi) => { const a = w[0] === '*'; return `<span class="${a ? 'an' : ''}" data-g="${gi}" data-w="${wi}">${FV.esc(a ? w.slice(1) : w)}</span>` }).join(' ')).join(' ');
    $('#jg').innerHTML = sp(JG); $('#pl').innerHTML = sp(PL);
    // the crumbling clause: its letters
    $$('#jg span[data-g="1"]').forEach(s => { s.innerHTML = [...s.textContent].map(c => `<i style="display:inline-block;font-style:normal">${FV.esc(c)}</i>`).join('') });
    // the phone: Grok's post with its In plain words panel open (the app's own UI)
    $('#phw').innerHTML = FV.phone(`<div class="vw" id="v2"><div class="vh"><small>FEED</small><b>Season 2</b></div>${FV.post(g, { id: 'gp', plain: 1 })}</div>`);
  }, ['400 88px "Instrument Serif"', '400 42px "Instrument Serif"']);
  $('#gp .pp').style.height = 'auto';
  FV.navOn($('#phw'), 'FEED');
  // measure: every word of both layers at its own place (no transforms)
  const rect = e => { const r = e.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, cx: r.left + r.width / 2, cy: r.top + r.height / 2 } };
  M.j = $$('#jg span[data-g]').map(e => ({ e, g: +e.dataset.g, an: e.classList.contains('an'), r: rect(e), t: e.textContent }));
  M.p = $$('#pl span[data-g]').map(e => ({ e, g: +e.dataset.g, an: e.classList.contains('an'), r: rect(e), t: e.textContent }));
  M.gr = g => { const ws = M.p.filter(w => w.g === g), x0 = Math.min(...ws.map(w => w.r.x)), x1 = Math.max(...ws.map(w => w.r.x + w.r.w)), y0 = Math.min(...ws.map(w => w.r.y)), y1 = Math.max(...ws.map(w => w.r.y + w.r.h)); return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, x0, x1, y0, y1 } };
  M.jr = g => { const ws = M.j.filter(w => w.g === g), x0 = Math.min(...ws.map(w => w.r.x)), x1 = Math.max(...ws.map(w => w.r.x + w.r.w)), y0 = Math.min(...ws.map(w => w.r.y)), y1 = Math.max(...ws.map(w => w.r.y + w.r.h)); return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 } };
  // each anchor: its jargon twin (same word stem)
  M.p.filter(w => w.an).forEach(w => { const st = w.t.replace(/[.,;]/g, ''); w.tw = M.j.find(j => j.an && j.t.replace(/[.,;]/g, '').startsWith(st)) });
  // the pencil marks
  $('#sq').innerHTML = SQ.map(([g, ...ws], i) => { const r = ws.map(k => M.j.find(w => w.g === g && w.e.dataset.w == k).r), x0 = r[0].x - 4, x1 = r[r.length - 1].x + r[r.length - 1].w + 4, y = r[0].y + r[0].h - 2;
    let d = `M${x0.toFixed(1)} ${y.toFixed(1)}`; for (let x = x0; x < x1; x += 14) d += ` q7 ${i % 2 ? -7 : 7} 14 0`; return `<path d="${d}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>` }).join('');
  // the camera on the paper: wide, the pencil, then each phrase in close-up, then wide again (scale about the frame centre)
  const foc = g => { const r = M.gr(g); return { s: 1.45, x: r.cx, y: r.cy } };
  M.cam = [[0, { s: 1, x: 540, y: 560 }], [4, { s: 1.08, x: 540, y: 500 }], [8, foc(0)], [11, foc(1)], [14, foc(2)], [17, { s: 1, x: 540, y: 600 }], [20, { s: .92, x: 540, y: 640 }]];
  grain = L.grain($('#grain'), .04);
  window.CUES = [[T.type0, 'sfx-type', .08], [B(1.5), 'sfx-type', .07], [B(2.8), 'sfx-type', .06], ...T.sq.map(t => [t, 'r11-tape', .06]), [T.drop, 'sfx-whoosh', .1], [T.drop, 'r11-thump', .08],
    [T.g[1], 'r11-slide', .08], [T.g[2], 'r11-slide', .08], [T.mark, 'r11-sparkle', .06], [T.phone, 'sfx-whoosh', .09], [T.end, 'sfx-chime', .12]];
  window.MUSIC = { f: 'm3-electro', at: AT }; window.DUR = DUR;
  window.R(0); await FV.raf(); window.R(.5); await FV.raf(); window.READY = 1;
})().catch(e => { document.title = 'ERR ' + e.message; console.error(e) });

const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) };
window.R = t => {
  grain(t);
  const BT = FV.BT, bp = t < FV.PH ? 0 : Math.exp(-((t - FV.PH) % BT) / .22), drop = t >= T.drop ? 1 : .3;
  $('#lite').style.opacity = (.35 + .65 * bp * drop).toFixed(3);
  // the camera: scale s about the point (x, y), which is brought to (540, 640)
  const C = FV.trk(M.cam, t, .9), s = C.s, sway = 3 * Math.sin(t * .6);
  $('#pg').style.transform = `translate(${(540 - C.x * s + sway).toFixed(2)}px,${(640 - C.y * s).toFixed(2)}px) scale(${s.toFixed(4)}) rotate(${(.25 * Math.sin(t * .4)).toFixed(3)}deg)`;
  $('#gnd').style.transform = `scale(${(1 + (s - 1) * .4 + .004 * bp * drop).toFixed(4)}) translate(${((540 - C.x) * .15).toFixed(1)}px,${((640 - C.y) * .1).toFixed(1)}px)`;
  // typing: word by word, a block cursor after the last one
  const nj = M.j.length, typed = (t - T.type0) / (T.type1 - T.type0) * nj;
  let last = null; const gone = eio(n(t, T.phone - .2, T.phone + .5));
  M.j.forEach((w, i) => { const on = i < typed; let o = on ? 1 : 0, tf = '', blur = 0;
    if (on) last = w;
    const pg = MAP[w.g];
    if (pg >= 0) { const tg = T.g[pg], k = eio(n(t, tg - .05, tg + .45));
      const r = M.gr(pg), dx = (r.cx - w.r.cx) * k, dy = (r.cy - w.r.cy) * k;
      if (w.an) { o *= k < .5 ? 1 : 0 } else { o *= 1 - k; blur = 6 * k }
      tf = `translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) scale(${(1 - .45 * k).toFixed(3)},${(1 - .2 * k).toFixed(3)})`;
      // the macro's depth of field: the group in focus is sharp, the others soft
      if (t >= T.drop && t < T.wide) { const cur = [0, 0, 0].reduce((a, _, i) => t >= T.g[i] ? i : a, 0); if (pg > cur) { blur = Math.max(blur, 3.5); o *= .45 } }
    } else {   // the clause left out: letters fall
      const k = n(t, T.crumble, T.crumble + 1.3); if (k > 0) { w.e.querySelectorAll('i').forEach((c, ci) => { const r = rnd(i * 31 + ci), d = Math.max(0, k * 1.3 - r * .3);
        c.style.transform = `translate(${(40 * (r - .5) * d).toFixed(1)}px,${(520 * d * d).toFixed(1)}px) rotate(${(140 * (r - .5) * d).toFixed(1)}deg)`; c.style.opacity = (1 - d).toFixed(3) }) }
    }
    w.e.style.opacity = o.toFixed(3); w.e.style.transform = tf; w.e.style.filter = blur > .1 ? `blur(${blur.toFixed(1)}px)` : '' });
  const cu = $('#cur'); if (last && t < T.type1 + .5) { cu.style.left = (last.r.x + last.r.w + 6) + 'px'; cu.style.top = (last.r.y + 6) + 'px'; cu.style.opacity = Math.floor(t * 4) % 2 ? .8 : .2 } else cu.style.opacity = 0;
  // the pencil
  $$('#sq path').forEach((p, i) => { const a = T.sq[i], k = eo(n(t, a, a + .35)); p.style.strokeDashoffset = (1 - k).toFixed(3); p.style.opacity = (t < T.drop + .1 ? 1 : 1 - n(t, T.drop + .1, T.drop + .5)).toFixed(3) });
  // the plain words: each group condenses out of its jargon group on its beat; an anchor glides from its twin's place, in gold
  M.p.forEach((w, i) => { const tg = T.g[w.g], k = spr(n(t, tg + .02 + (w.an ? 0 : i % 9 * .035), tg + .75 + (w.an ? 0 : i % 9 * .035))), jr = M.jr(MAP.indexOf(w.g));
    let x0 = jr.cx - w.r.cx, y0 = jr.cy - w.r.cy, sc = .55;
    if (w.an && w.tw) { x0 = w.tw.r.cx - w.r.cx; y0 = w.tw.r.cy - w.r.cy; sc = w.tw.r.h / w.r.h }
    const o = w.an ? (t >= tg ? 1 : 0) : cl(k * 1.6), gold = w.an ? Math.max(eo(n(t, tg, tg + .3)) * (1 - n(t, tg + 1.2, tg + 1.8)), eo(n(t, T.mark, T.mark + .4))) : 0;
    w.e.style.opacity = (o * (1 - gone)).toFixed(3);
    w.e.style.transform = `translate(${(x0 * (1 - k)).toFixed(1)}px,${(y0 * (1 - k)).toFixed(1)}px) scale(${lerp(sc, 1, k).toFixed(3)})`;
    w.e.style.filter = !w.an && k < .9 ? `blur(${(6 * (1 - k)).toFixed(1)}px)` : '';
    w.e.style.color = gold > .01 ? `rgb(${lerp(4, 200, gold).toFixed(0)},${lerp(7, 140, gold).toFixed(0)},${lerp(14, 20, gold).toFixed(0)})` : '';
    w.e.style.background = w.an && t >= T.mark ? `linear-gradient(transparent 60%,rgba(253,188,42,.75) 60%) no-repeat 0 0/${(100 * eo(n(t, T.mark, T.mark + .4))).toFixed(0)}% 100%` : '' });
  $('#kick').style.opacity = (eo(n(t, 0, .4)) * (1 - n(t, T.wide - .2, T.wide + .1))).toFixed(3); $('#kick').style.transform = `translateY(${(14 * (1 - eo(n(t, 0, .5)))).toFixed(1)}px)`;
  // the phone: rises into the frame; the paragraph flies into its In plain words panel
  const ph = $('#phw .phw'), kp = spr(n(t, T.phone, T.phone + 1)), out = eio(n(t, T.end, T.end + 1.1)), z = 1.3 + .08 * n(t, T.phone, T.end) - .3 * out;
  ph.style.display = t >= T.phone - .1 ? 'block' : 'none';
  if (t >= T.phone - .1) { ph.style.zoom = z.toFixed(4); ph.style.left = ((540 - 195 * z) / z).toFixed(2) + 'px'; ph.style.top = ((lerp(1500, 150, kp) + 300 * out) / z).toFixed(2) + 'px';
    ph.style.transform = `rotate(${(2.5 * (1 - kp) - .6 * Math.sin(t * .7)).toFixed(3)}deg)`; ph.style.opacity = (1 - .9 * out).toFixed(3);
    $('#gp .ppi').style.opacity = n(t, T.phone + .5, T.phone + .9).toFixed(3) }
  if (t >= T.phone - .2) { const pr = $('#gp .ppi p').getBoundingClientRect(), pc = M.gr(1), fly = eio(n(t, T.phone - .1, T.phone + .7));
    $('#pl').style.transform = `translate(${((pr.left + pr.width / 2 - pc.cx) * fly).toFixed(1)}px,${((pr.top + pr.height / 2 - pc.cy) * fly).toFixed(1)}px) scale(${lerp(1, pr.width / 936, fly).toFixed(3)})`; $('#pl').style.transformOrigin = `${(pc.cx - 72).toFixed(0)}px ${(pc.cy - 350).toFixed(0)}px` } else $('#pl').style.transform = '';
  FV.lineR($('#l1'), t, T.drop + .05, T.g[2] + 1.2); FV.lineR($('#l2'), t, T.wide + .1, T.end - .35);
  FV.endR(t, T.end);
};
</script>
