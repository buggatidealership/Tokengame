<!doctype html><meta charset="utf-8"><title>EZ feed FV8 What they read</title>
<!-- FEED FILMS DESK B, FV8 "Five minds, one report" (night of 20 Nov 2026). The feature: every post shows what its AI read (its sources).
  Message: five AIs read the same report differently, and each call shows what it read.
  Story (one source, five readings, then the receipts): a page of Intuit's quarter as the AIs cited it, marked CONCEPT (every line is a fact one AI
  quoted in calls.csv: Gemini "$4.30B-$4.31B", Claude "11% this quarter against 14% last quarter", Grok "FY27 guide reset to 9-10% growth",
  Qwen "reaffirmed Sept 17", GPT "raised renewal prices on three QuickBooks plans"); five highlighters, one per AI in its own colour, each mark
  a different line; on the drop the marks peel off the page into the app's feed; Claude's and Qwen's posts lift with the line each built on, their
  key clause marked (verbatim) and their real sources rows ("Intuit results-date notice, Oct 29; ..." and "207 sources"); the close grades them
  (Claude RIGHT, Qwen WRONG; research F2.10: a reason beside its outcome). Ground: painted cream paper (Hedra, w6/nt/fvb/g8.jpg), the only
  light ground of the five. Type: Newsreader (the page and our lines, ink on paper) and Inter / Geist Mono (the app). Camera: a top-down
  document camera that dollies line to line by layout zoom with a rack focus, then pulls back. Motion: marker sweeps, a peel and fly.
  Brand in the scene: the page's EZ. folder tab (0 to 6 s), the app header (from 6.6 s), the receipts' EZ. marks (from 10.2 s).
  Bed nt-fv8 (m3-electro from 1.452 s, bedx.py): its kick drops at B(13) = 6.32 s, on the peel. -->
<style>
#pgw{position:absolute;left:0;top:0;transform-origin:540px 640px}
#page{position:relative;width:1080px;height:1350px;background:url(w6/nt/fvb/g8.jpg) 50% 50%/cover;color:#04070e}
#page .tab{position:absolute;left:250px;top:382px;width:580px;height:84px;border-radius:18px 18px 0 0;display:flex;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(180deg,#0b1114,#04070e);box-shadow:0 -1px 0 rgba(255,255,255,.2) inset,0 10px 24px rgba(4,7,14,.25);font:700 26px/1 'Geist Mono';letter-spacing:.16em;color:#f8f0d9}
#page .tab .bm{width:54px;height:54px}
#page .tab em{font-style:normal;color:#fdbc2a;font-size:22px;letter-spacing:.12em;padding:6px 10px;border-radius:8px;box-shadow:inset 0 0 0 2px rgba(253,188,42,.6)}
#page .doc{position:absolute;left:90px;top:466px;width:900px;padding:34px 44px 30px;border-radius:6px;background:linear-gradient(180deg,rgba(255,252,240,.62),rgba(255,250,235,.38));box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 18px 40px rgba(60,40,10,.16),0 2px 6px rgba(60,40,10,.12)}
#page .dh{display:flex;align-items:center;gap:18px;padding-bottom:22px;border-bottom:2px solid rgba(4,7,14,.8)}
#page .dh img{width:62px;height:62px;border-radius:14px}
#page .dh b{display:block;font:600 46px/1 Newsreader;letter-spacing:-.01em}#page .dh small{display:block;margin-top:8px;font:500 24px/1 'Geist Mono';letter-spacing:.1em;color:rgba(4,7,14,.62)}
#page .ln{position:relative;margin-top:26px;padding-left:4px;font:500 40px/1.18 Newsreader;letter-spacing:-.01em}
#page .ln .hm{position:absolute;left:-10px;top:2px;height:52px;border-radius:6px 10px 8px 4px;mix-blend-mode:multiply;transform-origin:0 50%}
#page .ln span{position:relative}
#page .tg{position:absolute;left:-96px;top:-2px;display:flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:50%;opacity:0}
#hl{position:absolute;left:40px;right:40px;top:1132px;height:140px;text-align:center;z-index:70;font:600 100px/1 Newsreader;letter-spacing:-.025em;color:#04070e}
#hl.dk{color:#f8f0d9}
#hl>div{position:absolute;left:0;right:0;top:0}
#topv{position:absolute;left:0;right:0;top:0;height:190px;z-index:6;pointer-events:none;background:linear-gradient(180deg,rgba(4,7,14,.82),rgba(4,7,14,.5) 50%,rgba(4,7,14,0))}
#shade{position:absolute;inset:0;z-index:5;background:radial-gradient(90% 70% at 50% 45%,rgba(4,7,14,.55),rgba(4,7,14,.86));opacity:0;pointer-events:none}
#cam{z-index:10}
#lift{z-index:30}
#strips{position:absolute;inset:0;z-index:35;pointer-events:none}
#strips div{position:absolute;left:0;top:0;border-radius:6px;opacity:0;mix-blend-mode:normal;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#bot{position:absolute;left:0;right:0;bottom:0;height:300px;z-index:60;background:linear-gradient(180deg,rgba(248,240,217,0),rgba(248,240,217,.75) 55%,rgba(248,240,217,.9));pointer-events:none}
#bot2{position:absolute;left:0;right:0;bottom:0;height:380px;z-index:60;background:linear-gradient(180deg,rgba(4,7,14,0),rgba(4,7,14,.7) 50%,rgba(4,7,14,.9));pointer-events:none;opacity:0}
/* compact posts in the phone: a colour band (the highlighter), head, sources, side */
.cp{position:relative;margin-bottom:10px;padding:12px 14px 12px 18px;border-radius:18px;background:rgba(12,16,18,.97);box-shadow:inset 0 0 0 1.5px var(--ln);overflow:hidden}
.cp .band{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--hc)}
.cp .ph b{display:block;font:700 16px/1 Inter}.cp .ph small{display:block;margin-top:5px;font:500 12px/1 'Geist Mono';color:var(--mu)}
.cp .sd{margin-left:auto;font:700 14px/1 'Geist Mono';white-space:nowrap}.cp .sd span{font-size:12.5px}
.cp .sr{margin-top:9px;font:500 11.5px/1.3 'Geist Mono';color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src{display:flex;gap:9px;margin-top:11px;padding:9px 11px;border-radius:13px;background:rgba(3,5,7,.6);box-shadow:inset 0 0 0 1.2px var(--ln)}
.src svg{flex:none;width:16px;height:16px;margin-top:1px;fill:none;stroke:#f8f0d9;stroke-width:1.9;stroke-linejoin:round}
.src small{display:block;font:700 11.5px/1 'Geist Mono';letter-spacing:.12em;color:#fdbc2a}.src p{margin-top:5px;font:600 13.5px/1.35 Inter;color:#f8f0d9}
.rd{margin-top:11px;padding:9px 11px 10px 14px;border-radius:13px;background:color-mix(in srgb,var(--hc) 16%,transparent);box-shadow:inset 4px 0 0 var(--hc)}
.rd small{display:block;font:700 11.5px/1 'Geist Mono';letter-spacing:.12em;color:var(--hc)}.rd p{margin-top:5px;font:600 15px/1.3 Newsreader;color:#f8f0d9;font-size:17px}
.rcx{overflow:hidden;height:0}.pqx{overflow:hidden}
#endc h3{font-family:Newsreader;font-weight:600;font-size:124px;letter-spacing:-.03em}
</style>
<div id="st">
<div id="pgw"><div id="page"></div></div>
<div id="shade"></div><div id="topv"></div>
<div id="cam"></div>
<div id="lift"></div><div id="strips"></div>
<div id="bot"></div><div id="bot2"></div><div id="hl"></div>
<div id="td"></div><div id="tr"></div>
<div id="vig" style="opacity:.6"></div><canvas id="grain"></canvas>
</div>
<script src="lib.js"></script><script src="w6/nt/fvb/fvb.js"></script>
<script>
const B = FB.B, n = FB.n, cl = FB.cl, lerp = FB.lerp, eo = FB.eo, eio = FB.eio, spr = FB.spr, DUR = 15.5;
const LINES = [['One report', -1, B(4.3)], ['Five AIs read it differently', B(4.8), B(11.6)], ['Each call shows what it read', B(13.3), B(20.2)], ['Graded at the close', B(20.6), B(26)]];
// the page: a line each AI cited (calls.csv), its colour (the AI's own), the side it took
const DOC = [['GEMINI', 'Revenue $4.30B to $4.31B', '#7dd3fc'], ['CLAUDE', 'Growth about 11% against 14% last quarter', '#d97757'], ['GROK', 'Fiscal 2027 growth reset to 9% to 10%', '#fdbc2a'],
  ['QWEN', 'Outlook reaffirmed at Investor Day Sept 17', '#a78bfa'], ['GPT', 'QuickBooks prices raised on three plans', '#10a37f']];
const HM = [B(3), B(4.5), B(6), B(7.5), B(9)];   // each marker on its beat; the camera reaches each line a beat early
const T = { pull: B(10.5), peel: B(13), cl: B(15), qw: B(17.5), both: B(20), grade: B(21), end: B(26) };
const KEY = { CLAUDE: "Intuit's own guide says growth slows again tonight", QWEN: 'Guide already reset' };   // the clause each built on, verbatim from its words
let grain, F = {};
(async () => {
  await FB.load(`@import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap');`, ["600 100px Newsreader", "500 40px Newsreader"]);
  const D = FB.D, co = D.cos.INTU;
  L.$('#page').innerHTML = `<div class="tab">${FB.EZ(54)}WHAT THEY READ<em>CONCEPT</em></div><div class="doc"><div class="dh"><img src="${co.logo}" alt=""><div><b>Intuit</b><small>FIRST QUARTER FISCAL 2027</small></div></div>
    ${DOC.map(([k, s, c], i) => `<div class="ln" id="ln${i}"><div class="hm" style="background:${c}"></div><div class="tg" style="background:${c}">${FB.mark(k, 50)}</div><span class="tx">${s}</span></div>`).join('')}</div>`;
  // the app: five compact posts (band in the AI's colour, sources, side); full posts for the two lifts
  const doc = ['CLAUDE', 'QWEN', 'GROK', 'GEMINI', 'GPT'].map(k => [k, DOC.find(d => d[0] === k)]);
  const fileI = '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>';
  const cps = doc.map(([k, d]) => { const x = FB.post(k, 'INTU'); return `<div class="cp" id="cp${k}" style="--hc:${d[2]}"><div class="band"></div><div class="ph">${FB.mark(k, 34)}<div><b>${x.name}</b><small>${x.lab}</small></div><div class="sd ${x.side[0]}">${FB.sideTxt(x)}</div></div><div class="sr">${FB.esc(x.sources)}</div></div>` }).join('');
  L.$('#cam').innerHTML = FB.phoneHTML(`<div class="vw"><div class="vh"><small>FEED</small><b>Intuit</b></div>${cps}</div>`);
  const full = k => { const x = Object.assign({}, FB.post(k, 'INTU'), { hl: KEY[k] }), d = DOC.find(e => e[0] === k);
    return FB.postHTML(x, { id: 'fp' + k, qid: 'q' + k, rows: `<div class="rd" style="--hc:${d[2]}"><small>MARKED</small><p>${d[1]}</p></div><div class="src">${fileI}<div><small>SOURCES</small><p>${FB.esc(x.sources)}</p></div></div>`, tail: `<div class="rcx">${FB.rcHTML(x)}</div>` }) };
  const hold = document.createElement('div'); hold.style.cssText = 'position:absolute;left:-2000px;top:0;width:358px'; hold.innerHTML = full('CLAUDE') + full('QWEN'); document.body.appendChild(hold);
  L.$('#strips').innerHTML = DOC.map(d => `<div style="background:${d[2]}"></div>`).join('');
  FB.bug(L.$('#st'));
  L.$('#st').insertAdjacentHTML('beforeend', FB.endHTML('What they read', 'Newsreader'));
  L.$('#hl').innerHTML = LINES.map((l, i) => `<div id="h${i}">${FB.words(l[0])}</div>`).join('');
  grain = L.grain(L.$('#grain'), .05);
  await document.fonts.ready;
  // the highlighter's length for each line, and each line's centre on the page (for the dolly)
  DOC.forEach((d, i) => { const ln = L.$('#ln' + i), sp = ln.querySelector('.tx'); F[i] = { w: sp.offsetWidth + 22, y: ln.offsetTop + ln.offsetHeight / 2 + 466, x: 90 + 44 + sp.offsetWidth / 2 }; ln.querySelector('.hm').style.width = F[i].w + 'px' });
  FB.mkLift('cl', L.$('#fpCLAUDE'), 'foc'); FB.mkLift('qw', L.$('#fpQWEN'), 'foc'); FB.lifts.cl.el = L.$('#cpCLAUDE'); FB.lifts.qw.el = L.$('#cpQWEN');
  ['cl', 'qw'].forEach(id => { const o = FB.lifts[id], r = o.c.querySelector('.rcx'), q = o.c.querySelector('.pqx'); o.w.style.display = 'block'; o.hr = o.c.offsetHeight; o.qh = q.scrollHeight; r.style.height = 'auto'; o.rh = r.scrollHeight; q.style.height = '0px'; o.hg = o.c.offsetHeight; r.style.height = '0px'; q.style.height = 'auto'; o.w.style.display = 'none' });
  window.CUES = [[.05, 'r11-swell', .1], ...HM.map(a => [a, 'r11-slide', .09]), [T.pull, 'sfx-whoosh', .07], [T.peel, 'sfx-whoosh', .12], [T.peel + .1, 'r11-card', .07],
    [T.cl, 'sfx-whoosh', .09], [T.qw, 'sfx-whoosh', .09], [T.both, 'r11-slide', .07], [T.grade, 'sfx-stamp', .1], [T.grade + FB.BT, 'sfx-stamp', .09], [T.end + .1, 'sfx-chime', .12], [T.end + .6, 'r11-sparkle', .07]];
  window.MUSIC = { f: 'nt-fv8', at: 0 }; window.DUR = DUR;
  await FB.ready();
})().catch(e => { document.title = 'ERR ' + e.message; console.error(e) });

// the document camera: a key per line (zoom about that line, a little lean); the whole page before and after
const CAMK = () => [[0, { z: 1, fx: 540, fy: 640 }], ...HM.map((a, i) => [a - FB.BT * .9, { z: 1.15, fx: 480, fy: F[i].y + 40 }]), [T.pull, { z: 1, fx: 540, fy: 640 }]];
window.R = t => {
  grain(t);
  // the page: zoom about the focus (layout zoom: the type stays sharp), clamped so the paper always fills the frame; it recedes on the peel
  const C = FB.track(CAMK(), t, .62, FB.ss), pe = eio(n(t, T.peel, T.peel + .9)), pg = L.$('#page');
  const z = C.z * (1 - .1 * pe), tx = 540, ty = 640;
  let lx = tx - C.fx * z, ly = ty - C.fy * z; lx = Math.min(0, Math.max(1080 - 1080 * z, lx)); ly = Math.min(0, Math.max(1350 - 1350 * z, ly));
  pg.style.zoom = z.toFixed(4); const pw = L.$('#pgw'); pw.style.left = lx.toFixed(2) + 'px'; pw.style.top = (ly - 60 * pe).toFixed(2) + 'px';
  pw.style.transform = `rotate(${(.6 * Math.sin(t * .4) - 1.2 * pe).toFixed(3)}deg)`;
  // the rack focus: the line being marked is sharp, the others soften (only while the camera is in)
  const focus = HM.findIndex((a, i) => t >= a - FB.BT * .9 && (i === 4 ? t < T.pull : t < HM[i + 1] - FB.BT * .9)), inz = cl((C.z - 1) / .15);
  DOC.forEach((d, i) => { const ln = L.$('#ln' + i), mk = ln.querySelector('.hm'), tg = ln.querySelector('.tg'), a = HM[i], k = FB.ss(n(t, a, a + .42));
    ln.querySelector('.tx').style.filter = focus >= 0 && i !== focus && inz > .05 ? `blur(${(2.2 * inz).toFixed(2)}px)` : '';
    mk.style.clipPath = `inset(0 ${((1 - k) * 100).toFixed(2)}% 0 0)`; mk.style.opacity = (t >= T.peel + .05 ? .78 * (1 - eio(n(t, T.peel, T.peel + .25))) : .78).toFixed(3);
    mk.style.transform = `skewX(-8deg) scaleY(${(.94 + .06 * Math.sin(i * 2.1)).toFixed(3)})`;
    const g = spr(n(t, a + .3, a + .9)); tg.style.opacity = cl(g * 2) * (1 - eio(n(t, T.peel, T.peel + .3))); tg.style.transform = `scale(${(.4 + .6 * g).toFixed(3)}) rotate(${(-12 + 12 * g).toFixed(1)}deg)` });
  // the peel: each mark lifts off its line and flies into its post's band in the phone (staggered)
  const cpK = ['CLAUDE', 'QWEN', 'GROK', 'GEMINI', 'GPT'];
  L.$$('#strips div').forEach((s, i) => { const a = T.peel + i * .07, k = eio(n(t, a, a + .62)); if (t < a || k >= 1) { s.style.opacity = 0; return }
    const r0 = L.$('#ln' + i + ' .hm').getBoundingClientRect(), r1 = L.$('#cp' + DOC[i][0] + ' .band').getBoundingClientRect();
    const x = lerp(r0.left, r1.left, k), y = lerp(r0.top, r1.top, k) - 120 * Math.sin(Math.PI * k), w = lerp(r0.width, r1.width, k), h = lerp(r0.height, r1.height, k);
    s.style.opacity = .95; s.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${(10 * Math.sin(Math.PI * k) * (i % 2 ? -1 : 1)).toFixed(2)}deg)`; s.style.width = w.toFixed(1) + 'px'; s.style.height = h.toFixed(1) + 'px' });
  L.$$('.cp .band').forEach((b, i) => { const j = DOC.findIndex(d => d[0] === cpK[i]); b.style.opacity = t >= T.peel + j * .07 + .6 ? 1 : 0 });
  // the phone: rises on the drop, its header (the EZ. logo) in the middle of the frame; the paper dims behind it
  const up = spr(n(t, T.peel, T.peel + 1)), dn = eio(n(t, T.end - .2, T.end + .6));
  FB.place(L.$('.phw'), { t, cx: 540 + 6 * Math.sin(t * .5), cy: lerp(1900, 700, up) + 1200 * dn, z: 1.08, rx: 3 + 1.4 * Math.sin(t * .43), ry: 2.6 * Math.sin(t * .51), rz: lerp(-6, 0, up) + .4 * Math.sin(t * .37) });
  L.$('#shade').style.opacity = Math.max(eio(n(t, T.peel, T.peel + .8)), dn).toFixed(3); L.$('#pgw').style.opacity = (1 - eio(n(t, T.end - .2, T.end + .5))).toFixed(3);
  L.$('#bot').style.opacity = (1 - eio(n(t, T.peel, T.peel + .5))).toFixed(3); L.$('#bot2').style.opacity = eio(n(t, T.peel, T.peel + .5)).toFixed(3);
  L.$('#hl').classList.toggle('dk', t >= T.peel + .3);
  // the lifts: Claude's post (SHORT), then Qwen's (LONG) over it; then both side by side and the close stamps their receipts
  const bo = eio(n(t, T.both, T.both + .7)), zs = Math.min(1.4, (1095 - 430) / Math.max(FB.lifts.cl.hg, FB.lifts.qw.hg));
  const zf = Math.min(2.25, (1090 - 300) / FB.lifts.cl.hr);
  const k1 = FB.lift('cl', t, T.cl, T.end - .2, () => ({ x: lerp(540, 540 - 179 * zs - 9, bo), y: lerp(lerp(300, 260, eio(n(t, T.qw, T.qw + .6))), 430, bo), z: lerp(lerp(zf, zf * .9, eio(n(t, T.qw, T.qw + .6))), zs, bo) }), { float: 3 });
  const k2 = FB.lift('qw', t, T.qw, T.end - .2, () => ({ x: lerp(560, 540 + 179 * zs + 9, bo), y: lerp(330, 430, bo), z: lerp(Math.min(2.2, (1090 - 330) / FB.lifts.qw.hr), zs, bo) }), { float: 3 });
  FB.lifts.cl.c.style.opacity = (1 - .5 * eio(n(t, T.qw, T.qw + .5)) * (1 - bo)).toFixed(3);
  FB.sweep(FB.lifts.cl.hlc, eio(n(t, T.cl + .55, T.cl + 1.2))); FB.sweep(FB.lifts.qw.hlc, eio(n(t, T.qw + .55, T.qw + 1)));
  ['cl', 'qw'].forEach(id => { const o = FB.lifts[id]; o.c.querySelector('.pqx').style.height = (o.qh * (1 - eio(n(t, T.both, T.both + .5)))).toFixed(1) + 'px' });
  [['cl', T.grade], ['qw', T.grade + FB.BT]].forEach(([id, a]) => { const o = FB.lifts[id], r = o.c.querySelector('.rcx'), q = n(t, a, a + .35); r.style.height = (o.rh * eio(n(t, T.grade - .3, T.grade + .2))).toFixed(1) + 'px';
    const rc = r.firstElementChild; rc.style.opacity = t >= a ? 1 : 0; rc.style.transform = `scale(${(1 + .3 * (1 - eo(q))).toFixed(3)})` });
  const dim = cl(Math.max(k1, k2)); L.$('.app').style.filter = dim > .01 ? `blur(${(4 * dim).toFixed(2)}px) brightness(${(1 - .35 * dim).toFixed(3)})` : '';
  LINES.forEach((l, i) => FB.rise(L.$('#h' + i), t, l[1], l[2]));
  const fo = (1 - eio(n(t, T.end - .2, T.end + .3))).toFixed(3); ['cl', 'qw'].forEach(id => FB.lifts[id].w.style.opacity = fo);
  FB.endR(t, T.end + .1);
};
</script>
