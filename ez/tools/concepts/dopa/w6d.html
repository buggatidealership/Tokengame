<!doctype html><meta charset="utf-8"><title>Season 1 wrap-up, take D: the terminal</title>
<!-- Season 1's wrap-up, round 6, take D (W6-BRIEF.md, owner 2026-11-19: "a PDF slideshow... no charts... not hype"): the product itself, the
  EZ Terminal, drawn full frame at video scale. The frame is the screen: a header with the EZ. logo, dark panels with hairlines, Geist
  Mono for every figure, the logo's heavy italic (Kanit) for names and headlines. Five messages:
  1 brand open (the logo, "Season 1" typed at the prompt)   2 what it was (4 AIs, 112 earnings trades, long or short, $100K on every trade)
  3 the season as one live P&L chart with the trade tape under it, finishing on drop 1 with each final P&L at its line's end
  4 the leaderboard by P&L, then a click on Accuracy re-fills it with accuracy and W-L (Kimi relegated)
  5 on drop 2 the winner's row opens to the whole frame: Grok wins Season 1, P&L +$169,450, Season 2 soon, the logo.
  Panels re-lay themselves out on the beat (a chart maximised, the readouts as four tiles, a pair of rows opened) instead of a camera zooming
  into small type. Every number from data/wrap.json (node prep-wrap.js) and w6/d/trades.json (node w6/d/prep.js); nothing typed by hand.
  Bed w6-techno-x at 0: 140 BPM, a beat every 0.428571 s, drop 1 at 12.857 s (beat 30), drop 2 at 26.571 s (beat 62).
  Draft render (the main session): CRF=20 bash wrapx.sh w6d.html 34.5 x2p-s1-wrap6-d-draft w6-techno-x 0 .34 -->

<script>
const B = 60 / 140, bt = n => +(n * B).toFixed(3), DUR = 34.5;
// the shots, each on a beat of the bed: brand | 4 AIs and 112 trades | long or short, $100K | chart (split, maximised, the four readouts, split) |
// drop 1: the finished chart | P&L board (all, top pair, bottom pair, all) | accuracy board (same four) | drop 2: the winner | its P&L | hold | the logo
const T = { kpi: bt(4), ord: bt(10), ch: bt(14), c2: bt(18), c3: bt(21), c4: bt(24), d1: bt(30), b1: bt(34), b2: bt(37), b3: bt(40), b4: bt(43), a1: bt(46), a2: bt(50), a3: bt(54), a4: bt(58), d2: bt(62), w2: bt(66), w3: bt(70), w4: bt(76) };
const SHOTS = [0, ...Object.values(T)];
const Gn = '#55d6a2', Rd = '#e8576b', Au = '#fdbc2a', Cr = '#f2ede6', BG = '#0a0908';
const COL = { GROK: Au, CLAUDE: Gn, GPT: Cr, KIMI: Rd };           // one colour an AI, on the chart, its readout and its row
const VT = 160, VB = 1276, VC = (VT + VB) / 2;                      // the panel area between the header and the ticker
const S = {}, C = []; let t = 0, grain, D, TR, AI, EM = {};
const add = (h, p) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };
const sp = (x, f = 1.5, d = 9) => x <= 0 ? 0 : 1 - Math.exp(-d * x) * Math.cos(2 * Math.PI * f * x);    // a snap with one small overshoot
const k3 = (a, u) => u < .5 ? L.lerp(a[0], a[1], u * 2) : L.lerp(a[1], a[2], (u - .5) * 2);
const kick = () => Math.exp(-7 * (t % B)) * (t >= 24.86 && t < 26.571 ? .4 : 1);   // 1 on every beat, gone before the next; held back in the bed's break
const Kr = v => (v < 0 ? '−' : '+') + '$' + Math.round(Math.abs(v) / 1000);                              // the K is the .kk class
const pos = (el, x, y, s) => el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)` + (s == null ? '' : ` scale(${s.toFixed(4)})`);
const tw = (s, font) => { const c = tw.c || (tw.c = document.createElement('canvas').getContext('2d')); c.font = font; return c.measureText(s).width };
const mkSize = (el, s) => { el.style.width = el.style.height = s.toFixed(1) + 'px'; el.style.borderRadius = (s * .26).toFixed(1) + 'px' };

function build() {
  const cam = L.$('#cam'); AI = D.ai; const n = AI.length;
  const sc = id => add(`<div class="sc" id="${id}"></div>`, cam);
  EM.mono = tw('0', '600 100px "Geist Mono"') / 100; AI.forEach(a => EM[a.k] = tw(a.name, 'italic 900 100px Kanit') / 100); EM.max = Math.max(...AI.map(a => EM[a.k]));
  // ---- 1 brand
  let s = S.brand = sc('sBrand');
  S.bL = add(`<img class="ab" src="ezlogo.svg" alt="" style="width:520px;height:520px">`, s);
  S.bT = add(`<div class="ab kan" id="bT" style="font-size:212px;letter-spacing:-.01em">${[...'SEASON 1'].map((c, i) => `<span style="${i > 6 ? `color:${Au};text-shadow:.045em 0 0 #ff3a31` : 'text-shadow:-.045em 0 0 #03c870'}">${c === ' ' ? '&nbsp;' : c}</span>`).join('')}</div>`, s);
  S.bC = add(`<i id="bCur" style="width:26px;height:170px"></i>`, s);
  S.bS = add(`<div class="ab mo" style="font:600 50px/1 'Geist Mono';letter-spacing:.3em;color:${Cr}">FINAL</div>`, s);
  S.bB = add(`<svg class="ab" width="1080" height="60" style="top:1160px"><rect data-chrome x="120" y="8" width="840" height="34" rx="6" fill="rgba(242,237,230,.12)"/><rect id="bFill" x="120" y="8" width="0" height="34" rx="6" fill="${Au}"/></svg>`, s);
  // ---- 2 what it was: two tiles, then the order ticket
  s = S.kpi = sc('sKpi');
  S.kA = add(`<div class="pn" style="left:24px;width:1032px"><div class="ab" id="kL1" style="width:1032px;transform-origin:516px 0;display:flex;justify-content:center;align-items:baseline;gap:34px;height:250px"><span class="mo" style="font:700 250px/1 'Geist Mono';color:${Au}">${n}</span><span class="kan" style="font-size:196px">AIs</span></div><div class="ab" id="kMs" style="width:1032px;transform-origin:516px 0;display:flex;justify-content:center;gap:62px">${AI.map(a => `<div class="km">${L.mark(a.k, 150)}<span>${a.name}</span></div>`).join('')}</div></div>`, s);
  S.kM = L.$$('.km', S.kA);
  const cw = (984 - 15 * 10) / 16;
  S.kB = add(`<div class="pn" style="left:24px;width:1032px;height:544px"><span class="ab mo" id="kN" style="left:36px;top:24px;font:700 236px/1 'Geist Mono';color:${Au}">${D.total}</span><div class="ab kan" style="left:500px;top:40px;font-size:100px;line-height:1.02">EARNINGS<br>TRADES</div><svg class="ab" width="1032" height="290" style="top:262px">${TR.map((x, i) => `<rect x="${(24 + (i % 16) * (cw + 10)).toFixed(1)}" y="${Math.floor(i / 16) * 38}" width="${cw.toFixed(1)}" height="28" rx="5"/>`).join('')}</svg></div>`, s);
  S.kC = L.$$('rect', S.kB); S.kN = L.$('#kN', S.kB);
  s = S.ord = sc('sOrd');
  S.oR = L.$$('rect', add(`<svg class="ab" width="1080" height="1350" style="overflow:visible"><rect x="26" y="170" width="504" height="488" rx="26" stroke-width="4" style="transform-box:fill-box;transform-origin:50% 50%"/><rect x="550" y="170" width="504" height="488" rx="26" stroke-width="4" style="transform-box:fill-box;transform-origin:50% 50%"/></svg>`, s));
  S.oL = add(`<div class="ob" style="left:24px;top:168px;width:508px;height:492px">LONG</div>`, s); S.oS = add(`<div class="ob" style="left:548px;top:168px;width:508px;height:492px">SHORT</div>`, s);
  add(`<div class="ab mo" style="z-index:2;left:494px;top:368px;width:92px;height:92px;border-radius:50%;background:${BG};border:2px solid rgba(242,237,230,.3);font:600 34px/88px 'Geist Mono';text-align:center;color:rgba(242,237,230,.8)">OR</div>`, s);
  S.oK = add(`<div class="ab mo" style="left:0;width:1080px;top:690px;text-align:center;font:700 292px/1 'Geist Mono';color:${Au};letter-spacing:-.02em">$100K</div>`, s);
  S.oT = add(`<div class="ab kan" style="left:0;width:1080px;top:1098px;text-align:center;font-size:110px">ON EVERY TRADE</div>`, s);
  // ---- 3 the chart, the readouts and the tape
  s = S.chart = sc('sChart');
  S.cT = add(`<div class="ab kan" style="left:30px;top:170px;font-size:62px;font-weight:800">SEASON 1 <span class="au">P&amp;L</span></div>`, s);
  S.cLv = add(`<div class="ab mo" data-chrome style="left:0;top:178px;font:600 30px/1 'Geist Mono';letter-spacing:.1em;padding:10px 16px;border-radius:10px;border:2px solid ${Gn};color:${Gn}"><i style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${Gn};margin-right:12px"></i><span>REPLAY</span></div>`, s);
  S.cS = add(`<svg id="cSvg" width="1080" height="1350"><defs><linearGradient id="cAg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${Au}" stop-opacity=".3"/><stop offset="1" stop-color="${Au}" stop-opacity="0"/></linearGradient></defs><g data-chrome id="cGr"></g><path id="cAr" data-chrome fill="url(#cAg)"/><g id="cLn"></g><g data-chrome><line id="cHx" stroke-width="2.5" stroke-dasharray="4 9"/><circle id="cRg" fill="none" stroke-width="4"/></g></svg>`, s);
  const ORDZ = ['KIMI', 'GPT', 'CLAUDE', 'GROK']; S.cP = {}; ORDZ.forEach(k => { add(`<path data-chrome fill="none" stroke="${COL[k]}" stroke-opacity=".2" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>`, L.$('#cLn', s)); S.cP[k] = [L.$('#cLn', s).lastElementChild, add(`<path fill="none" stroke="${COL[k]}" stroke-width="${k === 'GROK' ? 7 : 5}" stroke-linejoin="round" stroke-linecap="round"/>`, L.$('#cLn', s))] });
  // an svg element made through insertAdjacentHTML on an svg parent keeps the svg namespace
  S.tip = AI.map(a => add(`<div class="tip">${L.mark(a.k, 52)}<span class="tv" style="color:${COL[a.k]}"><span class="kk">${Kr(a.pnl)}</span></span></div>`, s));
  S.hL = add(`<div class="hc"><span class="ab mo mu" style="left:16px;top:20px;font:600 28px/1 'Geist Mono';letter-spacing:.1em;color:rgba(242,237,230,.6)">TRADE</span><span class="ab mo" id="cN" style="left:14px;top:58px;font:700 62px/1 'Geist Mono'">000</span><i class="ab" style="left:16px;top:124px;width:188px;height:6px;background:rgba(242,237,230,.14);border-radius:3px"><i id="cPb" style="display:block;height:6px;background:${Au};border-radius:3px;width:0"></i></i></div>`, s);
  S.hc = AI.map(a => { const el = add(`<div class="hc"><i class="bar" style="background:${COL[a.k]}"></i>${L.mark(a.k, 44)}<span class="ab kan nm" style="font-weight:800">${a.name}</span><span class="ab mo pv" style="font-weight:700">+$0</span></div>`, s); const m = el.querySelector('svg'); m.style.position = 'absolute'; m.style.left = m.style.top = '0'; return { el, m, nm: el.querySelector('.nm'), pv: el.querySelector('.pv') } });
  S.tape = add(`<div id="tape"></div>`, s);
  S.tr = Array.from({ length: 9 }, () => { const el = add(`<div class="tr"><svg class="ab" width="1080" height="60">${AI.map((a, j) => `<rect x="${249 + j * 203}" y="9" width="197" height="42" rx="8" stroke-width="2"/>`).join('')}</svg><span class="tl" data-chrome><i></i><b style="font-weight:600"></b></span>${AI.map((a, j) => `<span class="ch" data-chrome style="left:${248 + j * 203}px"></span>`).join('')}</div>`, S.tape); return { el, n: el.querySelector('i'), tk: el.querySelector('b'), ch: L.$$('.ch', el), rc: L.$$('rect', el) } });
  // running extremes of the four series, for the live scale
  S.mx = [0]; S.mn = [0]; for (let i = 1; i <= D.rounds; i++) { S.mx[i] = Math.max(S.mx[i - 1], ...AI.map(a => D.s[a.k][i])); S.mn[i] = Math.min(S.mn[i - 1], ...AI.map(a => D.s[a.k][i])) }
  // ---- 4 the leaderboard
  s = S.board = sc('sBoard');
  const arrow = `<svg width="30" height="22" viewBox="0 0 30 22"><path d="M2 3L28 3L15 20Z" fill="${Au}"/></svg>`;
  S.tP = add(`<div class="tab" style="left:24px">P&amp;L${arrow}</div>`, s); S.tA = add(`<div class="tab" style="left:262px">ACCURACY${arrow}</div>`, s);
  S.wlH = add(`<div class="ab mo" style="top:190px;font:600 40px/1 'Geist Mono';letter-spacing:.06em;color:rgba(242,237,230,.7)">W-L</div>`, s);
  S.mid = add(`<div class="ab mo" data-chrome style="left:440px;width:200px;text-align:center;top:264px;font:600 30px/1 'Geist Mono';color:rgba(242,237,230,.55)"></div>`, s);
  S.bars = add(`<svg class="ab" width="1080" height="1350">${AI.map(() => `<rect data-chrome rx="6" x="36" width="1008" fill="rgba(242,237,230,.07)"/><rect rx="6"/><rect data-chrome x="538.5" width="3" fill="rgba(242,237,230,.75)"/>`).join('')}</svg>`, s);
  const mxP = Math.max(...AI.map(a => Math.abs(a.pnl)));
  S.row = AI.map((a, i) => { const acc = Math.round(100 * a.w / (a.w + a.l)), el = add(`<div class="lr"><i class="ln"></i><i class="hi"></i><span class="ab mo rk" style="font-weight:700;color:${i ? 'rgba(242,237,230,.55)' : Au}">${i + 1}</span>${L.mark(a.k, 100)}<span class="ab kan nm">${a.name}</span><span class="ab mo wl" style="font-weight:600;color:rgba(242,237,230,.82)">${a.w}–${a.l}</span><div class="vb"><span class="vp kk" style="color:${i ? (a.pnl < 0 ? Rd : Gn) : Au}">${Kr(a.pnl)}</span><span class="va" style="color:${i ? (acc < 50 ? Rd : Gn) : Au}">${acc}%</span></div>${D.releg.includes(a.k) ? '<span class="stp">RELEGATED</span>' : ''}</div>`, s);
    const m = el.querySelector('svg'); m.style.position = 'absolute'; m.style.left = m.style.top = '0';
    return { a, el, m, rk: el.querySelector('.rk'), nm: el.querySelector('.nm'), wl: el.querySelector('.wl'), vb: el.querySelector('.vb'), vp: el.querySelector('.vp'), va: el.querySelector('.va'), st: el.querySelector('.stp'), hi: el.querySelector('.hi'), acc,
      bt: S.bars.querySelectorAll('rect')[i * 3], bv: S.bars.querySelectorAll('rect')[i * 3 + 1], bm: S.bars.querySelectorAll('rect')[i * 3 + 2], bp: a.pnl / mxP * 470, ba: (a.w / (a.w + a.l) * 100 - 50) / 12 * 470, cp: i ? (a.pnl < 0 ? Rd : Gn) : Au, ca: i ? (acc < 50 ? Rd : Gn) : Au } });
  // ---- 5 the winner, the close
