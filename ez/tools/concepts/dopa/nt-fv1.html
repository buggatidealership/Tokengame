<!doctype html><meta charset="utf-8"><title>EZ night fv1 split</title>
<!-- Night studio, feed film FV1 "Split decision" (desk A, 2026-11-20). Message: the same report, opposite reasons. Feature: a company's
  both-sides view in the feed (Intuit: LONG 3 v SHORT 2). Story: in the app the fingertip taps SPLIT and Intuit's five posts part into a
  LONG column and a SHORT column; cut: the frame itself splits on a painted stage (green half, red half, a gold seam); the five AIs slam
  into their side on the beat; on the drop the two sharpest reasons fly to the seam and meet (Qwen's "Priced for AI ruin at 13x." against
  Claude's "its last two slower quarters were sold", both verbatim); back in the app; SEASON 2, Both sides. Bed m3-electro as it is
  (beat 0.4839 s, first beat 0.025 s; its kick drops in at B(16) = 7.77 s, the clash). Type: Anton (our lines, the bug, LONG and SHORT) and
  Geist Mono (labels and figures); the AIs' words keep the app's Inter. Switches: ?s1=&s2= (the two lines), ?name= (the feature name). -->
<style>
@font-face{font-family:Anton;src:url(w6/c/anton.woff2) format('woff2')}
#gnd{position:absolute;left:0;top:-45px;width:1080px;height:1440px;background:url(w6/nt/fv1/ground.jpg) center/cover;transform-origin:541px 700px}
#gfl{position:absolute;inset:0;background:url(w6/nt/fv1/ground.jpg) center/cover;mix-blend-mode:screen;opacity:0}
#seam{position:absolute;left:539px;top:0;width:4px;height:1350px;background:linear-gradient(180deg,transparent,#fdbc2a 10%,#ffe7a6 50%,#fdbc2a 90%,transparent);box-shadow:0 0 30px 6px rgba(253,188,42,.55);opacity:0;z-index:5}
#shk{position:absolute;inset:0}
#cam{position:absolute;inset:0}
#bug b,.ln,#lab b,#end h3,.cnt b{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em}
#bug b{font-size:36px;letter-spacing:.02em}
.ln{position:absolute;left:60px;right:60px;text-align:center;font-size:118px;line-height:1.02;color:var(--tx);text-transform:uppercase;z-index:40;text-shadow:0 8px 40px rgba(0,0,0,.6)}
#l1{top:150px}#l2{top:150px}
/* the in-app both-sides view */
.vtop{display:flex;align-items:center;gap:10px;padding:12px 2px 10px}.vtop img{width:34px;height:34px;border-radius:9px}.vtop b{font:800 21px/1 Inter;letter-spacing:-.02em}
.vtop span{font:500 12.5px/1 'Geist Mono';color:var(--mu);letter-spacing:.04em}.vtop small{margin-left:auto;font:600 11px/1 'Geist Mono';letter-spacing:.12em;color:var(--ac)}
.seg{position:relative;display:flex;height:34px;border-radius:11px;background:#0b100e;box-shadow:inset 0 0 0 1.2px var(--ln);font:700 12px/34px 'Geist Mono';letter-spacing:.12em;margin-bottom:12px}
.seg div{flex:1;text-align:center;color:var(--mu2);position:relative;z-index:1}.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:8px;background:rgba(253,188,42,.16);box-shadow:inset 0 0 0 1.4px rgba(253,188,42,.55)}
.colh{position:absolute;top:0;font:800 13px/1 'Geist Mono';letter-spacing:.14em}
.mc{position:absolute;left:0;top:0;padding:10px 11px 11px;border-radius:15px;background:rgba(14,19,17,.97);box-shadow:inset 0 0 0 1.4px var(--ln)}
.mc .h{display:flex;align-items:center;gap:7px}.mc .h b{font:700 14px/1 Inter}.mc .h .sd{margin-left:auto;font:700 12px/1 'Geist Mono';white-space:nowrap}.mc .h .sd span{font-size:11px}
.mc p{margin-top:8px;font:500 12.5px/1.36 Inter;color:#d9d3ca}
.mc.Lm{box-shadow:inset 0 0 0 1.4px rgba(85,214,162,.35)}.mc.Sm{box-shadow:inset 0 0 0 1.4px rgba(255,90,110,.35)}
/* the diptych: LONG and SHORT, the five slam cards, the count bar */
#lab b{position:absolute;top:118px;font-size:168px;line-height:1;text-shadow:0 10px 50px rgba(0,0,0,.55);z-index:20}
#lab .lL{left:56px;color:var(--g)}#lab .lS{right:56px;color:var(--r)}
.sc{position:absolute;width:444px;padding:22px 24px 24px;border-radius:26px;z-index:22;
  background:linear-gradient(160deg,rgba(248,240,217,.16),rgba(248,240,217,.05) 38%,rgba(6,10,9,.8) 75%,rgba(5,8,7,.88));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 24px 60px rgba(0,0,0,.6)}
.sc.Lc{box-shadow:inset 0 0 0 1.5px rgba(3,200,112,.55),inset 6px 0 0 -1px rgba(3,200,112,.8),inset 0 1px 0 rgba(255,255,255,.3),0 24px 60px rgba(0,0,0,.6)}
.sc.Sc{box-shadow:inset 0 0 0 1.5px rgba(255,58,49,.55),inset -6px 0 0 -1px rgba(255,58,49,.8),inset 0 1px 0 rgba(255,255,255,.3),0 24px 60px rgba(0,0,0,.6)}
.sc .h{display:flex;align-items:center;gap:16px}.sc .h b{font:800 34px/1 Inter;letter-spacing:-.02em;color:var(--tx)}
.sc .h small{display:block;margin-top:9px;font:500 24px/1 'Geist Mono';color:#b6c0b9}
.sc .sd{margin-left:auto;align-self:flex-start;font:700 26px/1 'Geist Mono';white-space:nowrap}.sc .sd span{font-size:24px;font-weight:600}
.sc p{margin-top:16px;font:600 28px/1.3 Inter;color:var(--cr);letter-spacing:-.01em}
.cnt{position:absolute;left:56px;right:56px;top:1150px;height:96px;z-index:22}
.cnt .bar{position:absolute;left:0;right:0;top:64px;height:18px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.cnt .bar i{position:absolute;top:0;bottom:0;border-radius:9px}.cnt .bar .bl{left:0;background:var(--g);box-shadow:0 0 18px rgba(3,200,112,.7)}.cnt .bar .bs{right:0;background:var(--r);box-shadow:0 0 18px rgba(255,58,49,.7)}
.cnt b{position:absolute;top:0;font-size:56px;line-height:1}.cnt .nL{left:0;color:var(--g)}.cnt .nS{right:0;color:var(--r)}
.cnt span{position:absolute;top:18px;font:700 26px/1 'Geist Mono';letter-spacing:.14em;color:#c9c2b5}.cnt .tL{left:52px}.cnt .tS{right:52px}
/* the clash: the two reasons meet at the seam, Intuit on the seam above them */
#co{position:absolute;left:540px;top:360px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:14px 26px 14px 16px;border-radius:22px;z-index:24;opacity:0;
  background:linear-gradient(160deg,rgba(253,188,42,.22),rgba(6,10,9,.85) 60%);box-shadow:inset 0 0 0 1.5px rgba(253,188,42,.6),0 20px 50px rgba(0,0,0,.6)}
#co img{width:64px;height:64px;border-radius:16px}#co b{font:800 44px/1 Inter;letter-spacing:-.02em;color:var(--tx)}#co span{font:600 30px/1 'Geist Mono';color:var(--ac);letter-spacing:.06em}
.cl{position:absolute;width:484px;z-index:26;padding:26px 28px 30px;border-radius:28px;background:linear-gradient(160deg,rgba(248,240,217,.18),rgba(6,10,9,.86) 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 30px 70px rgba(0,0,0,.65)}
.cl .h{display:flex;align-items:center;gap:14px;font:700 30px/1 'Geist Mono'}.cl .h b{font:800 34px/1 Inter;color:var(--tx);letter-spacing:-.02em}.cl .h span{margin-left:auto;white-space:nowrap}.cl .h span i{font-style:normal;font-size:26px}
.cl p{margin-top:20px;font:800 60px/1.1 Inter;letter-spacing:-.025em;color:var(--tx)}
.cl p em{font-style:normal;padding:0 .08em;border-radius:.12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#cq{left:34px;top:520px;text-align:right;box-shadow:inset 0 0 0 2px rgba(3,200,112,.7),inset 0 1px 0 rgba(255,255,255,.3),0 30px 70px rgba(0,0,0,.65)}#cq .h{flex-direction:row-reverse}#cq .h span{margin-left:0;margin-right:auto}
#cc{left:562px;top:800px;box-shadow:inset 0 0 0 2px rgba(255,58,49,.7),inset 0 1px 0 rgba(255,255,255,.3),0 30px 70px rgba(0,0,0,.65)}
#cq p em{background:linear-gradient(90deg,rgba(3,200,112,.42),rgba(3,200,112,.42)) no-repeat 0 0/var(--m,0%) 100%}
#cc p em{background:linear-gradient(90deg,rgba(255,58,49,.45),rgba(255,58,49,.45)) no-repeat 0 0/var(--m,0%) 100%}
#end h3{text-transform:uppercase}#end{top:390px}
#fls{position:absolute;inset:0;background:radial-gradient(40% 30% at 50% 52%,rgba(255,236,180,.9),rgba(253,188,42,.25) 50%,transparent 75%);opacity:0;z-index:28;mix-blend-mode:screen;pointer-events:none}
</style>
<div id="st">
<div id="shk"><div id="cam"><div id="gnd"><div id="gfl"></div></div><div id="seam"></div>
  <div id="ph"></div>
  <div id="dip"><div id="lab"><b class="lL">LONG</b><b class="lS">SHORT</b></div><div id="cards"></div>
    <div class="cnt"><b class="nL">0</b><span class="tL">LONG</span><b class="nS">0</b><span class="tS">SHORT</span><div class="bar"><i class="bl"></i><i class="bs"></i></div></div></div>
  <div id="clash"><div id="co"></div><div class="cl" id="cq"></div><div class="cl" id="cc"></div></div>
  <div id="fls"></div>
</div></div>
<div class="ln" id="l1"></div><div class="ln" id="l2"></div>
<div id="lift"></div>
<div id="td"></div><div id="tr"></div>
<div id="vig"></div><canvas id="grain"></canvas>
</div>
<script src="lib.js"></script>
<script src="w6/nt/fva/fv.js"></script>
<script>
const Q = new URLSearchParams(location.search), B = FV.B, n = FV.n, cl = FV.cl, lerp = FV.lerp, eo = FV.eo, eio = FV.eio, spr = FV.spr, $ = FV.$, $$ = FV.$$;
const S1 = Q.get('s1') || 'Same report', S2 = Q.get('s2') || 'Opposite reasons', NAME = Q.get('name') || 'Both sides', DUR = 17.7;
const LS = ['QWEN', 'GEMINI', 'GPT'], SS = ['CLAUDE', 'GROK'];   // Intuit: LONG Qwen, Gemini, GPT; SHORT Claude, Grok (calls.csv)
// ---- the beats (m3-electro as it is: the kick drops in at B(16), the clash) ----
const T = { tap: B(3), split: B(3.5), dip: B(6), slams: [8, 9, 10, 11, 12].map(B), hold: B(13), clash: B(16), m1: B(19), m2: B(21.5), app: B(24), end: B(28) };
const SLOT = { QWEN: [56, 336], GEMINI: [56, 568], GPT: [56, 800], CLAUDE: [580, 336], GROK: [580, 568] };   // the diptych's card places
let grain, P = {};
(async () => {
  await FV.boot(async () => {
    $('#st').insertAdjacentHTML('afterbegin', FV.bug()); $('#st').insertAdjacentHTML('beforeend', FV.end('SEASON 2', NAME));
    FV.line($('#l1'), S1); FV.line($('#l2'), S2);
    const D = FV.D, co = D.cos.INTU, F = FV.F;
    // the app: Intuit's five posts, first as a list, then parted into a LONG and a SHORT column
    const mini = k => { const x = F(k); return `<div class="mc ${x.side[0]}m" data-k="${k}"><div class="h">${FV.mark(k, 26)}<b>${x.name}</b><span class="sd ${x.side[0]}">${FV.sideTxt(x)}</span></div><p>${FV.esc(x.hl)}</p></div>` };
    $('#ph').innerHTML = FV.phone(`<div class="vw" id="v1"><div class="vtop"><img src="${co.logo}" alt=""><b>${co.co}</b><span>INTU</span><small>NOV 19</small></div>
      <div class="seg"><i></i><div>ALL</div><div>SPLIT</div></div><div id="mcs" style="position:relative;height:560px"><div class="colh L">LONG 3</div><div class="colh S">2 SHORT</div>${['QWEN', 'CLAUDE', 'GEMINI', 'GROK', 'GPT'].map(mini).join('')}</div></div>`);
    $('.phw').style.zoom = 1.13;
    // the diptych cards
    $('#cards').innerHTML = LS.concat(SS).map(k => { const x = F(k); return `<div class="sc ${x.side[0]}c" data-k="${k}" style="left:${SLOT[k][0]}px;top:${SLOT[k][1]}px"><div class="h">${FV.mark(k, 56)}<div><b>${x.name}</b><small>${x.conf}% confident</small></div><span class="sd ${x.side[0]}">${FV.sideTxt(x)}</span></div><p>${FV.esc(x.hl)}</p></div>` }).join('');
    // the clash: Intuit on the seam; the two reasons, verbatim, their sides
    $('#co').innerHTML = `<img src="${co.logo}" alt=""><b>${co.co}</b><span>INTU</span>`;
    const q = F('QWEN'), c = F('CLAUDE');
    $('#cq').innerHTML = `<div class="h">${FV.mark('QWEN', 56)}<b>Qwen</b><span class="L">LONG <i>(+${q.size}%)</i></span></div><p><em>${FV.esc(q.hl)}</em></p>`;
    $('#cc').innerHTML = `<div class="h">${FV.mark('CLAUDE', 56)}<b>Claude</b><span class="S">SHORT <i>(−${c.size}%)</i></span></div><p><em>${FV.esc(c.hl)}</em></p>`;
  }, ['400 118px Anton']);
  // the list and column places of the five minis (measured once): list = full width, stacked; split = two columns under their heads
  const mcs = $$('#mcs .mc'), W = 358, CW = 172;
  mcs.forEach(m => { m.style.width = W + 'px' }); let y = 0; const L0 = {}; mcs.forEach(m => { L0[m.dataset.k] = [0, y, W]; y += m.offsetHeight + 9 });
  mcs.forEach(m => { m.style.width = CW + 'px' }); const S0 = {}; let yl = 26, ys = 26;
  mcs.forEach(m => { const k = m.dataset.k, Lg = LS.includes(k); S0[k] = [Lg ? 0 : W - CW, Lg ? yl : ys, CW]; if (Lg) yl += m.offsetHeight + 9; else ys += m.offsetHeight + 9 });
  P = { L0, S0 }; $('#mcs .colh.L').style.left = '2px'; $('#mcs .colh.S').style.right = '2px';
  grain = L.grain($('#grain'), .055);
  FV.navOn($('#ph'), 'FEED');
  window.CUES = [[.05, 'r11-swell', .1], [T.tap, 'sfx-tap', .14], [T.split, 'r11-slide', .09], [T.dip - .05, 'sfx-whoosh', .11], [T.dip, 'r11-thump', .1],
    ...T.slams.map(t => [t, 'r11-card', .1]), ...T.slams.map(t => [t, 'r11-thump', .06]), [T.clash, 'sfx-boom', .14], [T.clash, 'sfx-strike', .08],
    [T.m1, 'sfx-whoosh', .05], [T.app, 'sfx-whoosh', .09], [T.end, 'sfx-chime', .12], [T.end + FV.BT, 'r11-sparkle', .07]];
  window.MUSIC = { f: 'm3-electro', at: 0 }; window.DUR = DUR;
  window.R(0); await FV.raf(); window.R(.5); await FV.raf(); window.READY = 1;
})().catch(e => { document.title = 'ERR ' + e.message; console.error(e) });

// an impact: a short decaying shake starting at a time
const shake = (t, ts, amp) => { let x = 0, y = 0; ts.forEach(a => { const d = t - a; if (d < 0 || d > .45) return; const k = amp * Math.exp(-d * 11); x += k * Math.sin(d * 78); y += k * Math.cos(d * 63) }); return [x, y] };
window.R = t => {
  grain(t);
  const BT = FV.BT, bp = t < FV.PH ? 0 : Math.exp(-((t - FV.PH) % BT) / .2), drop = t >= T.clash ? 1 : .35;
  // the stage: a slow push on the painting; its two spotlights flare with the kick (stronger from the drop)
  const g = $('#gnd'), ph1 = t < T.dip || t >= T.app;
  g.style.transform = `scale(${(1.04 + .05 * n(t, 0, DUR) + (ph1 ? 0 : .03)).toFixed(4)})`; g.style.filter = ph1 ? 'brightness(.8)' : '';
  $('#gfl').style.opacity = (bp * drop * .55).toFixed(3);
  $('#seam').style.opacity = (t >= T.dip && t < T.app ? .55 + .45 * bp : .25 * eo(n(t, 0, 1))).toFixed(3);
  const [sx, sy] = shake(t, [T.dip, ...T.slams, T.clash], 9); const [cx2, cy2] = shake(t, [T.clash], 14);
  $('#shk').style.transform = `translate(${(sx + cx2).toFixed(1)}px,${(sy + cy2).toFixed(1)}px)`;
  // ---- the app (B0 to B6, and B24 to the end) ----
  const ph = $('.phw'), enter = spr(n(t, 0, 1.1)), back = spr(n(t, T.app, T.app + .9)), out = eio(n(t, T.end, T.end + 1.2));
  const vis = t < T.dip || t >= T.app; ph.style.display = vis ? 'block' : 'none';
  if (vis) { const a = t < T.dip; const z = a ? 1.13 + .12 * spr(n(t, B(2), B(2) + .8)) + .1 * spr(n(t, T.split, T.split + .8)) : lerp(1.6, 1.13, back) - .25 * out;
    const yy = a ? 330 + 900 * (1 - enter) - 90 * spr(n(t, T.split, T.split + .8)) : lerp(160, 330, back) + 260 * out;
    ph.style.zoom = z.toFixed(4); ph.style.left = ((540 - 195 * z) / z).toFixed(2) + 'px'; ph.style.top = (yy / z).toFixed(2) + 'px';
    ph.style.transform = `rotate(${(a ? .6 * Math.sin(t * .8) : -.5 * Math.sin(t * .7)).toFixed(3)}deg)`; ph.style.opacity = (1 - .85 * out).toFixed(3) }
  // the both-sides view: the segment slides to SPLIT, the posts part into their columns
  const s = spr(n(t, T.split, T.split + .7)); $('.seg i').style.transform = `translateX(${(100 * eio(n(t, T.split, T.split + .35))).toFixed(1)}%)`;
  $$('.seg div').forEach((d, i) => d.style.color = (i === 1) === (t >= T.split) ? 'var(--ac)' : '');
  $$('#mcs .mc').forEach((m, i) => { const k = m.dataset.k, a = P.L0[k], b = P.S0[k], e = spr(n(t, T.split + i * .05, T.split + .75 + i * .05));
    m.style.width = lerp(a[2], b[2], e).toFixed(1) + 'px'; m.style.transform = `translate(${lerp(a[0], b[0], e).toFixed(1)}px,${lerp(a[1], b[1], e).toFixed(1)}px)` });
  $$('#mcs .colh').forEach(h => h.style.opacity = eo(n(t, T.split + .2, T.split + .6)).toFixed(3));
  FV.touch(0, 0, 0, 0, 0); FV.tap(t, T.tap, $$('.seg div')[1]);
  // ---- the diptych (B6 to B24): LONG and SHORT slam in, then the five cards, then the count ----
  const dip = t >= T.dip && t < T.app; $('#dip').style.display = dip ? 'block' : 'none';
  if (dip) { const lk = FV.slam(n(t, T.dip - .06, T.dip + .4)), gone = eio(n(t, T.clash - .3, T.clash));
    $('#lab .lL').style.transform = `translateX(${(-600 * (1 - lk)).toFixed(1)}px)`; $('#lab .lS').style.transform = `translateX(${(600 * (1 - lk)).toFixed(1)}px)`;
    $('#lab').style.opacity = (1 - gone).toFixed(3);
    let nL = 0, nS = 0;
    $$('#cards .sc').forEach((c, i) => { const k = c.dataset.k, a = T.slams[i] - .06, e = FV.slam(n(t, a, a + .38)), Lg = i < 3, dim = eo(n(t, T.hold, T.hold + .5));
      const keep = k === 'QWEN' || k === 'CLAUDE';
      c.style.transform = `translate(${((Lg ? -700 : 700) * (1 - e)).toFixed(1)}px,${(-60 * gone * (keep ? 0 : 1)).toFixed(1)}px) rotate(${((Lg ? -3 : 3) * (1 - e)).toFixed(2)}deg)`;
      c.style.opacity = (t < a ? 0 : (1 - gone) * (keep ? 1 : 1 - .55 * dim)).toFixed(3); if (t >= a + .06) Lg ? nL++ : nS++ });
    $('.cnt .nL').textContent = nL; $('.cnt .nS').textContent = nS; $('.cnt').style.opacity = (eo(n(t, T.slams[0], T.slams[0] + .3)) * (1 - gone)).toFixed(3);
    $('.cnt .bl').style.width = (100 * nL / 5).toFixed(1) + '%'; $('.cnt .bs').style.width = (100 * nS / 5).toFixed(1) + '%';
    // the build: the camera leans toward the seam over the last three beats before the drop
    const lean = eio(n(t, T.hold, T.clash)) * (1 - gone);
    $('#dip').style.transform = `scale(${(1 + .04 * lean).toFixed(4)})`; $('#dip').style.transformOrigin = '540px 640px' }
  // ---- the clash (B16 to B24) ----
  const cv = t >= T.clash && t < T.app; $('#clash').style.display = cv ? 'block' : 'none';
  if (cv) { const kq = FV.slam(n(t, T.clash - .08, T.clash + .4)), kc = FV.slam(n(t, T.clash - .04, T.clash + .44));
    $('#cq').style.transform = `translateX(${(-620 * (1 - kq)).toFixed(1)}px)`; $('#cc').style.transform = `translateX(${(620 * (1 - kc)).toFixed(1)}px)`;
    $('#cq').style.setProperty('--m', (100 * eio(n(t, B(17), B(18)))).toFixed(1) + '%'); $('#cc').style.setProperty('--m', (100 * eio(n(t, B(18), B(19.5)))).toFixed(1) + '%');
    const ki = spr(n(t, B(17), B(17) + .7)); $('#co').style.opacity = cl(ki * 2).toFixed(3); $('#co').style.transform = `translateX(-50%) translateY(${(-30 * (1 - ki)).toFixed(1)}px)`;
    // the camera: a push on the seam, then a tilt down to Claude's reason, then back (every move starts on a beat)
    const C = FV.trk([[16, { s: 1, y: 0, r: 0 }], [19, { s: 1.07, y: 30, r: -.6 }], [21.5, { s: 1.07, y: -70, r: .6 }], [23, { s: 1.02, y: 0, r: 0 }]], t);
    $('#clash').style.transform = `translateY(${C.y.toFixed(1)}px) scale(${C.s.toFixed(4)}) rotate(${C.r.toFixed(3)}deg)`; $('#clash').style.transformOrigin = '540px 760px' }
  $('#fls').style.opacity = (t >= T.clash ? Math.exp(-(t - T.clash) * 6) * .9 + .12 * bp * (cv ? 1 : 0) : 0).toFixed(3);
  // our two lines
  FV.lineR($('#l1'), t, .1, T.dip - .3); FV.lineR($('#l2'), t, B(16.5), T.app - .35);
  FV.endR(t, T.end);
};
</script>
