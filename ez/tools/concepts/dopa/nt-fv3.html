<!doctype html><meta charset="utf-8"><title>EZ night fv3 receipts</title>
<!-- Night studio, feed film FV3 "Receipts" (desk A, 2026-11-20). Message: every reason gets its receipt. Feature: graded posts that stay in
  the feed, the wrong ones as plain as the right ones (RESEARCH.md F2.10: a shown reason raises trust whether the AI is right or wrong, so the
  receipt has to sit beside it). In the app, Claude's and Qwen's Intuit posts (locked Nov 19, before the report); Claude's lifts onto glass;
  a clock runs from Thursday's 4:00 PM close to Friday's while Intuit's real path draws under it (close-2026-11-20.json: −11.94% five
  minutes after the report, −12.79% at Friday's close) and the painted skyline goes through the night; on the drop the close prints Claude's
  receipt, RIGHT P&L +$12,790, and the EZ. seal stamps it; a whip pan to Qwen's: WRONG P&L −$12,790, the same size; both together; back in
  the feed, both posts carry their receipts; SEASON 2, Receipts. Bed m3-electro as it is (its kick drops in at B(16) = 7.77 s, the close).
  Type: Saira Condensed (our words, RIGHT and WRONG) and Geist Mono (the clock, every figure). Switches: ?s1=&s2=, ?name=. -->
<style>
@font-face{font-family:'Saira Condensed';font-weight:800;src:url(w6/a/sc800.woff2) format('woff2')}
@font-face{font-family:'Saira Condensed';font-weight:900;src:url(w6/a/sc900.woff2) format('woff2')}
#gnd{position:absolute;left:-30px;top:-40px;width:1140px;height:1520px;background:url(w6/nt/fv3/ground.jpg) center/cover;transform-origin:540px 900px}
#night{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,4,12,.9),rgba(2,6,10,.55) 60%,rgba(2,4,8,.4));opacity:0;pointer-events:none}
#day{position:absolute;inset:0;background:radial-gradient(70% 45% at var(--sx,50%) 34%,rgba(255,214,140,.75),rgba(253,188,42,.25) 45%,transparent 75%),linear-gradient(180deg,rgba(255,226,170,.22),transparent 60%);mix-blend-mode:screen;opacity:0;pointer-events:none}
#lites{position:absolute;inset:0;background:url(w6/nt/fv3/ground.jpg) center/cover;mix-blend-mode:screen;opacity:0;pointer-events:none;left:-30px;top:-40px;width:1140px;height:1520px}
.ln{position:absolute;left:50px;right:50px;top:150px;text-align:center;font:800 86px/1 'Saira Condensed';text-transform:uppercase;letter-spacing:.005em;color:var(--tx);z-index:40;text-shadow:0 8px 40px rgba(0,0,0,.65)}
#clk{position:absolute;left:84px;right:84px;top:880px;height:330px;border-radius:30px;padding:26px 32px;z-index:25;opacity:0;
  background:linear-gradient(160deg,rgba(248,240,217,.15),rgba(6,10,9,.78) 45%,rgba(5,8,7,.88));box-shadow:inset 0 0 0 1.5px rgba(248,240,217,.22),inset 0 1px 0 rgba(255,255,255,.3),0 26px 60px rgba(0,0,0,.6)}
#clk .tm{display:flex;align-items:baseline;gap:18px;font:700 54px/1 'Geist Mono';color:var(--ac);font-variant-numeric:tabular-nums;letter-spacing:.02em}
#clk .tm small{font:600 30px/1 'Geist Mono';color:#c9c2b5;letter-spacing:.1em}
#clk .mv{position:absolute;right:32px;top:30px;display:flex;align-items:center;gap:12px;font:700 46px/1 'Geist Mono';color:var(--dn);font-variant-numeric:tabular-nums}
#clk .mv img{width:44px;height:44px;border-radius:11px}
#clk svg{position:absolute;left:32px;top:110px;width:848px;height:190px;overflow:visible}
#clk svg .base{stroke:rgba(248,240,217,.28);stroke-width:2;stroke-dasharray:6 8}
#clk svg .pth{fill:none;stroke:var(--r);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(255,58,49,.6))}
#clk svg .hd{fill:var(--r);filter:drop-shadow(0 0 10px rgba(255,58,49,.9))}
#clk svg text{font:600 24px 'Geist Mono';fill:#b8b1a4}
/* the receipt: thermal paper printed out of the card's foot */
.rc{overflow:hidden;height:0;margin:12px -16px -16px}
.rci{position:relative;padding:12px 16px 22px;background:#f8f0d9;color:#04070e;-webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at 50% 100%,#000 90deg,transparent 0) bottom/14px 8px repeat-x;mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at 50% 100%,#000 90deg,transparent 0) bottom/14px 8px repeat-x}
.rci::before{content:'';position:absolute;inset:0;background:url(w6/nt/fv2/ground.jpg) center/400px;mix-blend-mode:multiply;opacity:.55;pointer-events:none}
.rci .rb{position:relative;display:flex;align-items:center;gap:10px}
.rci .rb b{font:800 26px/1 'Saira Condensed';letter-spacing:.06em;padding:5px 10px 4px;border-radius:6px;color:#f8f0d9}
.rc.ok .rb b{background:#03995a}.rc.no .rb b{background:#d7262e}
.rci .rb span{margin-left:auto;font:700 22px/1 'Geist Mono';font-variant-numeric:tabular-nums;white-space:nowrap}
.rc.ok .rb span{color:#03804b}.rc.no .rb span{color:#c41f26}
.rci small{position:relative;display:block;margin-top:9px;font:600 13.5px/1 'Geist Mono';letter-spacing:.08em;color:rgba(4,7,14,.72)}
.lc.glass .rc{margin:12px -16px -16px}
.seal{position:absolute;left:0;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;z-index:35;opacity:0;display:grid;place-items:center;
  background:radial-gradient(closest-side,rgba(4,7,14,.0) 62%,rgba(253,188,42,.95) 63%,rgba(253,188,42,.95) 70%,transparent 71%,transparent 78%,rgba(253,188,42,.8) 79%,rgba(253,188,42,.8) 83%,transparent 84%)}
.seal img{width:96px;height:96px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
#flash{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 60%,rgba(255,240,200,.75),transparent 70%);opacity:0;z-index:28;mix-blend-mode:screen;pointer-events:none}
#end h3{font-family:'Saira Condensed';font-weight:900;text-transform:uppercase;font-size:150px}
#pc,#pq{overflow:hidden}
#shk{position:absolute;inset:0}
#kp{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;background:radial-gradient(100% 38% at 50% 0%,rgba(3,200,112,.62),transparent 72%),radial-gradient(100% 36% at 50% 100%,rgba(255,58,49,.58),transparent 72%),radial-gradient(70% 45% at 50% 50%,rgba(253,188,42,.07),transparent 70%)}
</style>
<div id="st">
<div id="shk"><div id="gnd"></div><div id="lites"></div><div id="night"></div><div id="day"></div><div id="kp"></div>
  <div id="ph"></div>
  <div id="clk"><div class="tm"><small class="dy">THU</small><span class="tt">4:00 PM</span></div><div class="mv"><img alt=""><span class="mvv">+0.00%</span></div><svg viewBox="0 0 848 190"></svg></div>
</div>
<div class="ln" id="l1"></div><div class="ln" id="l2"></div>
<div id="lift"></div>
<div class="seal" id="sl1"><img src="ezlogo.svg" alt=""></div><div class="seal" id="sl2"><img src="ezlogo.svg" alt=""></div>
<div id="flash"></div>
<div id="td"></div><div id="tr"></div>
<div id="vig"></div><canvas id="grain"></canvas>
</div>
<script src="lib.js"></script>
<script src="w6/nt/fva/fv.js"></script>
<script>
const Q = new URLSearchParams(location.search), B = FV.B, n = FV.n, cl = FV.cl, lerp = FV.lerp, eo = FV.eo, eio = FV.eio, spr = FV.spr, $ = FV.$, $$ = FV.$$;
const S1 = Q.get('s1') || 'Called before the report', S2 = Q.get('s2') || 'Every reason gets its {y receipt}', NAME = Q.get('name') || 'Receipts', DUR = 18.0;
// ---- the beats (m3-electro as it is: the kick drops in at B(16), the close) ----
const T = { lift: B(3), out: B(5), c0: B(6), c1: B(16), close: B(16), whip: B(19), q: B(20), pair: B(23), back: B(26), app: B(26), end: B(30) };
let grain, PATH, MOVE, C = {}, Pm = {};
(async () => {
  await FV.boot(async () => {
    $('#st').insertAdjacentHTML('afterbegin', FV.bug()); $('#st').insertAdjacentHTML('beforeend', FV.end('SEASON 2', NAME));
    FV.line($('#l1'), S1); FV.line($('#l2'), S2);
    const cd = await fetch('data/close-2026-11-20.json').then(r => r.json()), r = cd.rounds.find(x => x.ticker === 'INTU'); PATH = r.path; MOVE = r.move;
    if (MOVE !== -12.79) throw new Error('INTU move differs');
    const D = FV.D, co = D.cos.INTU; $('#clk .mv img').src = co.logo;
    // the receipt (the same row in the app and on the glass); P&L = $100K x the move, on the AI's side (calls.csv pnl_usd)
    const rc = k => { const x = FV.F(k), ok = x.side === 'SHORT', pnl = (ok ? 1 : -1) * 100000 * Math.abs(MOVE) / 100;
      return `<div class="rc ${ok ? 'ok' : 'no'}"><div class="rci"><div class="rb"><b>${ok ? 'RIGHT' : 'WRONG'}</b><span>P&amp;L ${FV.money(pnl)}</span></div><small>INTU −12.79% AT THE CLOSE NOV 20</small></div></div>` };
    $('#ph').innerHTML = FV.phone(`<div class="vw" id="v2"><div class="vh"><small>FEED</small><b>Season 2</b></div>${FV.post(FV.F('CLAUDE'), { id: 'pc', grade: rc('CLAUDE') })}${FV.post(FV.F('QWEN'), { id: 'pq', grade: rc('QWEN') })}</div>`);
    // the path strip: minutes from Thursday's close (0) to Friday's (1440), 0% to −16%
    const X = m => 848 * m / 1440, Y = v => 10 + 170 * (-v / 16);
    $('#clk svg').innerHTML = `<line class="base" x1="0" y1="${Y(0)}" x2="848" y2="${Y(0)}"/><polyline class="pth" points="${PATH.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}"/><circle class="hd" r="9"/>`;
    Pm = { X, Y };
  }, ['800 104px "Saira Condensed"', '900 150px "Saira Condensed"']);
  FV.navOn($('#ph'), 'FEED'); const ph = $('.phw'); ph.style.zoom = 1.13;
  // the receipts' printed height (measured open), then closed
  $$('.rc').forEach(r => { r.style.height = 'auto'; r.dataset.h = r.offsetHeight; r.style.height = '0px' });
  const pl = $('#clk .pth'); C.len = pl.getTotalLength(); pl.style.strokeDasharray = C.len;
  FV.mkLift('c', $('#pc'), 'foc'); FV.mkLift('q', $('#pq'), 'foc');
  $$('#lift .lw').forEach(w => w.style.display = 'block'); $$('#lift .rc').forEach(r => { r.style.height = 'auto'; r.dataset.h = r.offsetHeight; r.style.height = '0px' }); $$('#lift .lw').forEach(w => w.style.display = 'none');
  grain = L.grain($('#grain'), .055);
  window.CUES = [FV.STING, [T.lift, 'sfx-whoosh', .1], [T.out, 'r11-slide', .06], [T.c0, 'sfx-clock', .06], [B(10), 'sfx-tick', .05], [B(13), 'sfx-tick', .05],
    [T.close, 'sfx-bell', .12], [T.close, 'sfx-stamp', .12], [T.close + .15, 'r11-tape', .07], [T.whip, 'sfx-whoosh', .11], [T.q, 'sfx-stamp', .11], [T.q + .15, 'r11-tape', .07],
    [T.pair, 'r11-slide', .07], [T.back, 'sfx-whoosh', .09], [T.end, 'sfx-chime', .12]];
  window.MUSIC = { f: 'm3-electro', at: 0 }; window.DUR = DUR;
  window.R(0); await FV.raf(); window.R(.5); await FV.raf(); window.READY = 1;
})().catch(e => { document.title = 'ERR ' + e.message; console.error(e) });

// the clock: minutes since Thursday's 4:00 PM close for time t (fast through the night, slower at both ends)
const mAt = t => { const u = n(t, T.c0, T.c1); return 1440 * (u < .5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u)) * .35 + 1440 * u * .65 };
const pxAt = m => { const p = PATH; if (m <= 0) return 0; if (m >= 1440) return MOVE; let i = 1; while (i < p.length && p[i][0] < m) i++; const a = p[i - 1], b = p[i]; return lerp(a[1], b[1], (m - a[0]) / Math.max(1, b[0] - a[0])) };
const clock = m => { const tot = 16 * 60 + Math.round(m), d = Math.floor(tot / 1440), mm = tot % 1440; let h = Math.floor(mm / 60); const mi = mm % 60, ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return [d ? 'FRI' : 'THU', h + ':' + String(mi).padStart(2, '0') + ' ' + ap] };
const shake = (t, ts, amp) => { let x = 0, y = 0; ts.forEach(a => { const d = t - a; if (d < 0 || d > .45) return; const k = amp * Math.exp(-d * 11); x += k * Math.sin(d * 78); y += k * Math.cos(d * 63) }); return [x, y] };
// place a glass copy: centre x, top y, zoom z, roll r
const place = (o, x, y, z, r, op) => { o.w.style.display = op > .001 ? 'block' : 'none'; o.c.style.zoom = z.toFixed(4); o.w.style.transform = `translate(${(x - o.w0 * z / 2).toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg)`; o.w.style.opacity = op.toFixed(3);
  o.c.style.setProperty('--gx', (50 + 38 * Math.sin(x / 300)).toFixed(1) + '%') };
const seal = (el, o, t, ts, on) => { if (!on || t < ts - .08) { el.style.opacity = 0; return } const r = o.c.getBoundingClientRect(), k = FV.slam(n(t, ts - .08, ts + .35));
  el.style.opacity = cl(k * 3).toFixed(3); el.style.transform = `translate(${(r.right - 40).toFixed(1)}px,${(r.top + 34).toFixed(1)}px) rotate(${(-14 + 4 * (1 - k)).toFixed(2)}deg) scale(${lerp(1.9, 1, k).toFixed(3)})` };
window.R = t => {
  grain(t);
  const BT = FV.BT, bp = t < FV.PH ? 0 : Math.exp(-((t - FV.PH) % BT) / .2), drop = t >= T.close ? 1 : .35;
  // the sky goes through the night: dusk, night, dawn, the afternoon of the close (the windows go dark at day)
  const m = t < T.c0 ? 0 : mAt(t), night = cl(n(m, 20, 120) - n(m, 780, 960)), day = n(m, 840, 1100);
  $('#night').style.opacity = (.85 * night).toFixed(3); $('#day').style.opacity = (.85 * day).toFixed(3); $('#day').style.setProperty('--sx', (20 + 60 * n(m, 840, 1440)).toFixed(1) + '%');
  $('#kp').style.opacity = (bp * (drop === 1 ? .9 : .4)).toFixed(3);   // the kick light: the brand's green and red swell on every kick (fl-feed's)
  $('#lites').style.opacity = ((.15 + .4 * night) * (1 - .8 * day) + .25 * bp * drop).toFixed(3);
  $('#gnd').style.transform = `scale(${(1.02 + .05 * n(t, 0, DUR)).toFixed(4)}) translateY(${(-30 * n(t, T.c0, T.c1)).toFixed(1)}px)`;
  $('#gnd').style.filter = `brightness(${(.78 + .3 * day).toFixed(3)}) saturate(${(1 - .25 * day).toFixed(3)})`;
  // the camera: pushes in on the beats while the clock runs (every move starts on a beat), the glass a little faster than the city (depth)
  const K = FV.trk([[0, { s: 1, y: 0 }], [6, { s: 1.035, y: -10 }], [9, { s: 1, y: 6 }], [11, { s: 1.04, y: -14 }], [13, { s: 1.01, y: 0 }], [14.5, { s: 1.05, y: -16 }], [16, { s: 1, y: 0 }], [21.5, { s: 1.03, y: -8 }], [23, { s: 1, y: 0 }]], t);
  const [sx, sy] = shake(t, [T.close, T.q], 12); $('#shk').style.transform = `translate(${sx.toFixed(1)}px,${(sy + K.y).toFixed(1)}px) scale(${K.s.toFixed(4)})`; $('#shk').style.transformOrigin = '540px 700px';
  $('#lift').style.transform = `translate(${sx.toFixed(1)}px,${(sy + K.y * 1.6).toFixed(1)}px) scale(${(1 + (K.s - 1) * 1.6).toFixed(4)})`; $('#lift').style.transformOrigin = '540px 700px';
  // ---- the app: the feed at the start; back in it at the end, both posts with their receipts ----
  const ph = $('.phw'), inA = t < T.out + .4, inB = t >= T.back - .1, kb = spr(n(t, T.back, T.back + .9)), ko = eio(n(t, T.out, T.out + .5)), out = eio(n(t, T.end, T.end + 1.1));
  ph.style.display = inA || inB ? 'block' : 'none';
  if (inA || inB) { const z = inA ? 1.13 + .04 * n(t, 0, T.out) : lerp(1.5, 1.13, kb) - .25 * out, top = inA ? 270 + 1100 * ko : lerp(1400, 270, kb) + 280 * out;
    ph.style.zoom = z.toFixed(4); ph.style.left = ((540 - 195 * z) / z).toFixed(2) + 'px'; ph.style.top = (top / z).toFixed(2) + 'px';
    ph.style.transform = `rotate(${(.5 * Math.sin(t * .8)).toFixed(3)}deg)`; ph.style.opacity = (1 - .85 * out).toFixed(3);
    const gr = eo(n(t, T.back + .5, T.back + 1)); $$('#ph .rc').forEach(r => r.style.height = (+r.dataset.h * (inB ? gr : 0)).toFixed(1) + 'px');
    $('#v2').style.transform = `translateY(${(inB ? -30 * gr : 0).toFixed(1)}px)` }
  const dim = inA ? eo(n(t, T.lift, T.lift + .5)) : 0; $('.app').style.filter = dim > .01 ? `blur(${(4 * dim).toFixed(1)}px) brightness(${(1 - .4 * dim).toFixed(3)})` : '';
  // ---- Claude's post on glass: lifted at B3, graded at the close, whipped left at B19, back for the pair at B23, into the feed at B26 ----
  const oc = FV.lifts.c, oq = FV.lifts.q, kL = spr(n(t, T.lift, T.lift + .78)), kW = eio(n(t, T.whip, T.whip + .45)), kP = spr(n(t, T.pair, T.pair + .85)), kD = eio(n(t, T.back - .05, T.back + .5));
  const zc = 1.85, zp = 1.32;
  if (t >= T.lift && t < T.back + .5) { let x = 540, y = 360, z = zc;
    if (t < T.lift + .8) { const r = $('#pc').getBoundingClientRect(); x = lerp(r.left + r.width / 2, 540, kL); y = lerp(r.top, 360, kL); z = lerp(r.width / 358, zc, kL) }
    x += -1100 * kW * (1 - kP); y += 18 * Math.sin(t * 1.1);
    if (t >= T.pair) { x = lerp(x, 540, kP); y = lerp(y, 370, kP); z = lerp(z, zp, kP) }
    if (t >= T.back - .05) { const r = $('#pc').getBoundingClientRect(); x = lerp(x, r.left + r.width / 2, kD); y = lerp(y, r.top, kD); z = lerp(z, r.width / 358, kD) }
    place(oc, x, y, z, .4 * Math.sin(t * .9) * (1 - kD), 1 - n(t, T.back + .3, T.back + .5)); $('#pc').style.opacity = t < T.back + .3 ? 0 : 1 } else { oc.w.style.display = 'none'; $('#pc').style.opacity = 1 }
  // Qwen's: whips in from the right at B19, graded at B20, joins the pair under Claude's
  if (t >= T.whip && t < T.back + .5) { const kQ = eio(n(t, T.whip, T.whip + .45)); let x = lerp(1640, 540, kQ), y = 360 + 18 * Math.sin(t * 1.1 + 1), z = zc;
    if (t >= T.pair) { const hc = oc.c.offsetHeight * zp; x = 540; y = lerp(y, 370 + hc + 64, kP); z = lerp(zc, zp, kP) }
    if (t >= T.back - .05) { const r = $('#pq').getBoundingClientRect(); x = lerp(x, r.left + r.width / 2, kD); y = lerp(y, r.top, kD); z = lerp(z, r.width / 358, kD) }
    place(oq, x, y, z, -.4 * Math.sin(t * .9) * (1 - kD), 1 - n(t, T.back + .3, T.back + .5)); $('#pq').style.opacity = t < T.back + .3 ? 0 : 1 } else { oq.w.style.display = 'none'; $('#pq').style.opacity = 1 }
  // the receipts print out of the cards' feet (the close for Claude, B20 for Qwen); the seals stamp them
  const pr = (o, a) => { const r = o.c.querySelector('.rc'); r.style.height = (+r.dataset.h * eo(n(t, a, a + .45))).toFixed(1) + 'px' };
  pr(oc, T.close); pr(oq, T.q);
  seal($('#sl1'), oc, t, T.close, oc.w.style.display === 'block' && t < T.back); seal($('#sl2'), oq, t, T.q, oq.w.style.display === 'block' && t < T.back);
  $('#flash').style.opacity = (Math.max(t >= T.close ? Math.exp(-(t - T.close) * 6) : 0, t >= T.q ? .8 * Math.exp(-(t - T.q) * 7) : 0)).toFixed(3);
  // ---- the clock and Intuit's path, from Thursday's close to Friday's ----
  const kc = eo(n(t, T.out, T.out + .5)) * (1 - eio(n(t, T.close + .1, T.close + .5))); $('#clk').style.opacity = kc.toFixed(3); $('#clk').style.transform = `translateY(${(40 * (1 - eo(n(t, T.out, T.out + .5))) + 60 * n(t, T.close + .1, T.close + .5)).toFixed(1)}px)`;
  const cm = clock(m); $('#clk .dy').textContent = cm[0] + ' NOV ' + (cm[0] === 'THU' ? 19 : 20); $('#clk .tt').textContent = cm[1];
  const v = t < T.c0 ? 0 : pxAt(m); $('#clk .mvv').textContent = (v < 0 ? '−' : '+') + Math.abs(v).toFixed(2) + '%'; $('#clk .mv').style.color = v < 0 ? 'var(--dn)' : 'var(--tx)';
  const pl = $('#clk .pth'), fr = m / 1440; pl.style.strokeDashoffset = (C.len * (1 - fr)).toFixed(1); const hd = $('#clk .hd'); hd.setAttribute('cx', Pm.X(m).toFixed(1)); hd.setAttribute('cy', Pm.Y(v).toFixed(1));
  // our lines
  FV.lineR($('#l1'), t, -.65, B(6.6)); FV.lineR($('#l2'), t, B(8), T.back - .4);
  FV.endR(t, T.end);
};
</script>
