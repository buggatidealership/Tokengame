<!doctype html><meta charset="utf-8"><title>EZ feed product mockups PM6 to PM10</title>
<!-- FEED PRODUCT DESK B, the walkthrough film of the five Season 2 Feed mockups (night of 20 Nov 2026). 21.4 s, 1080x1350, bed m3-electro
  (124 BPM, beat 0.48387 s, first beat 0.0252 s; its kick drops in at beat 16 = 7.77 s). Every cut, tap and pop sits on a beat.
  The screens are the real mockups, shot inside a copy of the live terminal by tools/concepts/night/feed-b/run.js (FILM=only) into
  w6/nt/pmB/ (fNa.jpg at 390 css x3, f7*.jpg at 1280 css x1.5, geo.json = where each element sits on its page). Nothing here is drawn
  from memory: the phone shows those pictures, scrolled, tapped and swapped; a lifted card is a crop of the same picture grown by
  layout size (never scale() under perspective).
  PM6 Compact (phone)  0.03 s: scroll the tape, tap Grok's row, its reason opens, our plain reading lifts out
  PM7 Three columns (a landscape monitor)  3.41 s: the cursor clicks Grok's post, the open post swaps in, the camera pushes to our reading
  PM8 Report day (phone)  6.80 s: 1 of 5 in, GPT lands on the drop (7.77 s), Qwen two beats later, all five locked at 9.22 s
  PM9 Plain words first (phone)  10.19 s: our reading, a tap on "Read Claude's words in full", the sources light, the camera pushes in
  PM10 Graded (phone)  13.57 s: the day's verdict, a tap on RIGHT, the receipt lifts out
  End card  16.96 s: the EZ. logo and the line, held 4.4 s.
  The house bug is s2d.html's .bug (the EZ. logo 64 px and EARNINGS ZEASON in Kanit italic 800 31 px), 44 px from the top left as the brief sets it. The ground is the
  painted w6/e/ground.jpg (Hedra, gold light with green and red rims), dimmed and drifting, with a brand-light pulse on each kick. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Kanit:ital,wght@1,800&display=swap">
<style>
@font-face{font-family:'Geist Mono';src:url(fonts/geistmono.woff2) format('woff2');font-weight:100 900}
:root{--cr:#f8f0d9;--ac:#fdbc2a;--gn:#03c870;--rd:#ff3a31;--bk:#04070e}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bk);color:var(--cr);font-family:Inter,sans-serif}
#st{position:absolute;inset:0;overflow:hidden}
#gnd{position:absolute;left:-60px;top:-75px;width:1200px;height:1500px;background:url(w6/e/ground.jpg) center/cover;filter:brightness(.42) saturate(1.05);transform-origin:50% 70%}
#vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 55%,transparent 40%,rgba(4,7,14,.75) 100%)}
#pulse{position:absolute;inset:0;opacity:0;mix-blend-mode:screen;background:radial-gradient(90% 34% at 50% 0%,rgba(3,200,112,.42),transparent 72%),radial-gradient(90% 30% at 50% 100%,rgba(255,58,49,.36),transparent 72%)}
#grain{position:absolute;inset:0;width:1080px;height:1350px;mix-blend-mode:overlay;opacity:.06}
/* the house bug */
.bug{position:absolute;left:44px;top:44px;height:64px;display:flex;align-items:center;gap:16px;z-index:50;white-space:nowrap}
.bug img{width:64px;height:64px;display:block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.55))}
.bug span{font:italic 800 31px/1 Kanit,sans-serif;letter-spacing:.01em;color:var(--cr);text-shadow:0 2px 12px rgba(0,0,0,.65)}
/* the line of each shot: a gold badge and one headline, no punctuation */
#cap{position:absolute;left:0;right:0;top:150px;text-align:center;z-index:40}
#cap .bd{display:inline-block;padding:9px 14px 8px;border-radius:10px;font:700 28px/1 'Geist Mono';letter-spacing:.12em;color:var(--bk);background:var(--ac)}
#cap h2{margin-top:18px;font:800 58px/1.02 Inter;letter-spacing:-.035em;color:var(--cr);text-shadow:0 4px 24px rgba(0,0,0,.6)}
#cap .w{display:inline-block;overflow:hidden;vertical-align:top;padding:.05em .03em .14em;margin:-.05em -.03em -.14em}#cap .w>i{display:inline-block;font-style:normal}
/* the camera: a 2D push (no perspective, so every layer rasters at its final size) */
#cam{position:absolute;inset:0;transform-origin:0 0}
#scrim{position:absolute;left:0;right:0;top:0;height:420px;opacity:0;z-index:35;pointer-events:none;background:linear-gradient(180deg,rgba(4,7,14,.96) 0%,rgba(4,7,14,.9) 62%,rgba(4,7,14,0) 100%)}
/* the phone (fl-feed.html's body), its screen holding the real mockup pictures */
#phw{position:absolute;left:319.6px;top:330px;width:440.7px;height:953.7px}
#ph{position:absolute;left:0;top:0;width:390px;height:844px;zoom:1.13}
#ph .body{position:absolute;inset:-14px;border-radius:66px;background:linear-gradient(145deg,#5a605c 0%,#1d201e 13%,#0b0d0c 32%,#0b0d0c 68%,#1c1f1d 87%,#4b514d 100%);box-shadow:0 60px 120px rgba(0,0,0,.7),0 -20px 60px -26px rgba(3,200,112,.45),0 22px 70px -26px rgba(255,58,49,.38)}
#ph .body::after{content:'';position:absolute;inset:8px;border-radius:59px;box-shadow:0 0 0 2px #020302,0 0 0 3px rgba(255,255,255,.05)}
#scr{position:absolute;inset:0;border-radius:52px;overflow:hidden;background:#060a08}
#sb{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 40px;font:600 15px/1 Inter;color:#f2ede6;z-index:4;background:#0c3a27}
#sb i{font-style:normal;letter-spacing:.02em}
#isl{position:absolute;left:50%;top:11px;width:104px;height:30px;margin-left:-52px;border-radius:18px;background:#000;z-index:6}
.lay{position:absolute;inset:0}
.lay .hd{position:absolute;left:0;top:46px;width:390px;height:66px;background-repeat:no-repeat;z-index:3}
.lay .ct{position:absolute;left:0;top:112px;width:390px;bottom:69px;overflow:hidden}
.lay .ct img{position:absolute;left:0;top:0;width:390px;display:block}
#nav{position:absolute;left:0;bottom:0;width:390px;height:69px;z-index:3}
.glare{position:absolute;inset:0;border-radius:52px;background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.03) 18%,rgba(255,255,255,.08) 30%,rgba(255,255,255,.015) 41%,transparent 50%);pointer-events:none;z-index:7}
#dim{position:absolute;inset:0;border-radius:52px;background:#020403;opacity:0;z-index:8;pointer-events:none}
/* the monitor (a screen in a scene is landscape) */
#mon{position:absolute;left:52px;top:420px;width:976px;height:616px;opacity:0}
#mon .bz{position:absolute;inset:0;border-radius:22px;background:linear-gradient(160deg,#3d423f,#121514 22%,#0a0c0b 70%,#2a2e2c);box-shadow:0 50px 110px rgba(0,0,0,.7),0 -16px 50px -20px rgba(3,200,112,.4),0 18px 60px -24px rgba(255,58,49,.35),inset 0 0 0 1.5px rgba(255,255,255,.06)}
#mon .sc{position:absolute;left:8px;top:8px;width:960px;height:600px;border-radius:14px;overflow:hidden;background:#060a08}
#mon .sc img{position:absolute;left:0;top:0;width:960px;height:600px}
#mon .nk{position:absolute;left:428px;top:616px;width:120px;height:96px;background:linear-gradient(90deg,#141716,#2c302e 50%,#141716);clip-path:polygon(16% 0,84% 0,100% 100%,0 100%)}
#mon .ft{position:absolute;left:338px;top:708px;width:300px;height:18px;border-radius:9px;background:linear-gradient(180deg,#2c302e,#0d0f0e);box-shadow:0 18px 40px rgba(0,0,0,.6)}
#cur{position:absolute;left:0;top:0;width:30px;height:30px;opacity:0;z-index:5;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
/* the fingertip and its ripple (vid2.html's) */
#td{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.62),rgba(255,255,255,.3) 62%,rgba(255,255,255,.05));box-shadow:0 0 0 1.5px rgba(255,255,255,.4),0 6px 18px rgba(0,0,0,.45);opacity:0;z-index:30}
#tr{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;border:2.5px solid rgba(255,255,255,.75);opacity:0;z-index:30}
/* a lifted card: a crop of the same picture, grown by layout size, on frosted glass with an edge light */
.lift{position:absolute;left:0;top:0;display:none;z-index:20;border-radius:16px;background-repeat:no-repeat;box-shadow:0 0 0 1.5px rgba(248,240,217,.22),0 30px 80px rgba(0,0,0,.7),0 -10px 40px -12px rgba(253,188,42,.35)}
.lift::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(125deg,rgba(255,255,255,.14),transparent 30%,transparent 70%,rgba(255,255,255,.06));pointer-events:none}
/* a ring that marks a slot or a tab as it lands */
.ring{position:absolute;left:0;top:0;border-radius:14px;box-shadow:0 0 0 3px var(--ac),0 0 26px rgba(253,188,42,.55);opacity:0;z-index:9;pointer-events:none}
/* the end card */
#end{position:absolute;left:0;right:0;top:420px;text-align:center;opacity:0;z-index:45}
#end img{width:200px;height:200px;display:block;margin:0 auto;filter:drop-shadow(0 14px 40px rgba(0,0,0,.6))}
#end h3{margin:52px auto 0;max-width:900px;font:900 74px/1.04 Inter;letter-spacing:-.04em;color:var(--cr)}
#end h3 .y{color:var(--ac)}
#end .w{display:inline-block;overflow:hidden;vertical-align:top;padding:.05em .03em .14em;margin:-.05em -.03em -.14em}#end .w>i{display:inline-block;font-style:normal}
</style>
<div id="st">
  <div id="gnd"></div><div id="vig"></div><div id="pulse"></div><canvas id="grain"></canvas>
  <div id="cam">
    <div id="phw"><div id="ph"><div class="body"></div><div id="scr">
      <div id="sb"><i>1:09</i><i>5G</i></div><div id="isl"></div>
      <div id="lays"></div>
      <img id="nav" src="w6/nt/pmB/nav.jpg" alt=""><div class="glare"></div><div id="dim"></div>
      <div class="ring" id="rg"></div>
    </div></div></div>
    <div id="mon"><div class="bz"></div><div class="sc"><img id="ma" alt=""><img id="mb" alt=""></div><div class="nk"></div><div class="ft"></div>
      <svg id="cur" viewBox="0 0 24 24"><path d="M4 2.5l15.5 11-6.6.9 3.9 7.3-2.9 1.5-3.8-7.4L5 20z" fill="#f8f0d9" stroke="#04070e" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
    <div class="lift" id="lf"></div>
  </div>
  <div id="scrim"></div><div id="td"></div><div id="tr"></div>
  <div id="cap"><span class="bd"></span><h2></h2></div>
  <div id="end"><img src="ezlogo.svg" alt=""><h3></h3></div>
  <div class="bug"><img src="ezlogo.svg" alt=""><span>EARNINGS ZEASON</span></div>
</div>
<script>
const $ = s => document.querySelector(s);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), n = (t, a, b) => cl((t - a) / (b - a)), lerp = (a, b, x) => a + (b - a) * x;
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const spr = x => x <= 0 ? 0 : x >= 1.6 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(2 * Math.PI * 1.25 * x);
const BT = 60 / 124, B0 = .0252, B = k => B0 + k * BT, KICK = B(16), DUR = 21.4;
const IMG = 'w6/nt/pmB/';
let G = null;
// the shots: [start beat, end beat, badge, headline]
const SH = [[0, 7, 'PM6', 'Scan every trade in one line'], [7, 14, 'PM7', 'Open one trade see the case'], [14, 21, 'PM8', 'Calls land before the bell'],
  [21, 28, 'PM9', 'Plain words first and sourced'], [28, 35, 'PM10', 'Every call gets its receipt']];
const END = B(35), ENDLINE = 'Read why then see {y who was right}';
/* each phone shot: a list of picture states over time [t, picture, scroll (css px of the page under the header)] and a camera track */
const P = {
  6: [[0, 'f6a', 0], [B(1), 'f6a', 330], [B(2), 'f6b', 330], [B(3), 'f6b', 520]],
  8: [[B(14), 'f8a', 230], [KICK, 'f8b', 230], [B(17), 'f8c', 230], [B(19), 'f8d', 214]],
  9: [[B(21), 'f9a', 190], [B(23), 'f9b', 190], [B(26), 'f9b', 330]],
  10: [[B(28), 'f10a', 0], [B(30), 'f10a', 560], [B(31), 'f10b', 560], [B(32), 'f10b', 700]]};
const SCROLL_T = .55;   // a scroll eases over 0.55 s from its start beat
window.MUSIC = { f: 'm3-electro', at: 0 }; window.DUR = DUR;
window.CUES = [[.12, 'sfx-chime', .2],
  [B(2), 'sfx-tap', .14], [B(4), 'sfx-whoosh', .08], [B(7), 'r11-slide', .1], [B(9), 'sfx-tap', .12], [B(10), 'sfx-whoosh', .07],
  [B(14), 'r11-slide', .1], [KICK, 'r11-pluck', .1], [B(17), 'r11-pluck', .09], [B(19), 'sfx-lock', .12],
  [B(21), 'r11-slide', .1], [B(23), 'sfx-tap', .14], [B(24), 'r11-sparkle', .07], [B(28), 'r11-slide', .1], [B(31), 'sfx-tap', .14], [B(33), 'r11-ping', .1],
  [END, 'r11-swell', .12]];

function wordsHTML(s) { return s.replace(/\{y ([^}]*)\}/g, (m, x) => x.split(' ').map(w => '\u0001' + w).join(' ')).split(' ').map((w, i) => {
  const y = w[0] === '\u0001'; return `<span class="w${y ? ' y' : ''}"><i data-n="${i}"${y ? ' style="color:var(--ac)"' : ''}>${y ? w.slice(1) : w}</i></span>` }).join(' ') }

/* the phone's pictures: one layer per picture (made once, so a swap never waits for a decode), each its sticky header and its page at a scroll */
const LAY = {};
function mkLayers() { ['f6a', 'f6b', 'f8a', 'f8b', 'f8c', 'f8d', 'f9a', 'f9b', 'f10a', 'f10b'].forEach(p => { const g = G[p], url = IMG + p + '.jpg', d = document.createElement('div'); d.className = 'lay'; d.style.opacity = 0;
  d.innerHTML = `<div class="hd" style="background-image:url(${url});background-size:390px ${g.H}px"></div><div class="ct"><img src="${url}" alt="" style="height:${g.H}px"></div>`; $('#lays').appendChild(d); LAY[p] = d }) }
function showLayers(map) { for (const p in LAY) { const v = map[p]; LAY[p].style.opacity = v ? v[1].toFixed(3) : 0; if (v) LAY[p].querySelector('.ct img').style.transform = `translateY(${(-(66 + v[0])).toFixed(2)}px)` } }
/* the state of a phone shot at t: the current picture and scroll, and the one before it while they cross */
function phoneAt(list, t) { let i = 0; while (i + 1 < list.length && t >= list[i + 1][0]) i++;
  const cur = list[i], prev = list[i - 1];
  /* the scroll: from the previous entry's scroll to this one's, eased over SCROLL_T */
  const s0 = prev ? prev[2] : cur[2], sc = lerp(s0, cur[2], eio(n(t, cur[0], cur[0] + SCROLL_T)));
  const x = prev && prev[1] !== cur[1] ? eo(n(t, cur[0], cur[0] + .18)) : 1;
  return { pic: cur[1], prevPic: prev ? prev[1] : null, sc, x } }
/* where a page element sits in stage pixels for the phone (phone at its layout zoom, camera applied separately) */
function onPhone(r, sc) { const z = 1.13; return { x: 319.6 + z * r[0], y: 330 + z * (112 + r[1] - 66 - sc), w: z * r[2], h: z * r[3] } }
function cam(s, fx, fy, tx = 0, ty = 0) { $('#cam').style.transform = `translate(${(fx - fx * s + tx).toFixed(2)}px,${(fy - fy * s + ty).toFixed(2)}px) scale(${s.toFixed(4)})` }
function stage(x, y) { const m = new DOMMatrix(getComputedStyle($('#cam')).transform); return { x: m.a * x + m.e, y: m.d * y + m.f } }
function touch(x, y, k, pr, rp) { const d = $('#td'), r = $('#tr'); k = cl(k); d.style.opacity = (k * .95).toFixed(3); d.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(1.18 - .18 * k - .2 * (pr || 0)).toFixed(3)})`;
  r.style.opacity = rp > 0 && rp < 1 ? (.8 * (1 - rp)).toFixed(3) : 0; r.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(1 + 1.9 * eo(rp || 0)).toFixed(3)})` }
function tapAt(t, Tt, px, py) { if (t < Tt - .7 || t > Tt + .65) return false; const S0 = stage(px, py); px = S0.x; py = S0.y; const k = eo(n(t, Tt - .7, Tt - .35)) * (1 - n(t, Tt + .15, Tt + .4)), a = 1 - eo(n(t, Tt - .7, Tt - .1));
  touch(px + a * 30, py + a * 70, k, n(t, Tt - .1, Tt) * (1 - n(t, Tt, Tt + .14)), n(t, Tt, Tt + .55)); return true }
/* a lift: a crop {x,y,w,h} of a picture (page css px) grows from its place to a target centre and size */
function lift(pic, r, from, k, tgt) { const L = $('#lf'); if (k <= .001) { L.style.display = 'none'; return }
  const g = G[pic], z = lerp(from.w / r[2], tgt.w / r[2], k), w = r[2] * z, h = r[3] * z, cx = lerp(from.x + from.w / 2, tgt.x, k), cy = lerp(from.y + from.h / 2, tgt.y, k);
  L.style.display = 'block'; L.style.backgroundImage = `url(${IMG + pic}.jpg)`; L.style.backgroundSize = `${(390 * z).toFixed(2)}px ${(g.H * z).toFixed(2)}px`;
  L.style.backgroundPosition = `${(-r[0] * z).toFixed(2)}px ${(-r[1] * z).toFixed(2)}px`; L.style.width = w.toFixed(2) + 'px'; L.style.height = h.toFixed(2) + 'px';
  L.style.transform = `translate(${(cx - w / 2).toFixed(2)}px,${(cy - h / 2 + 5 * Math.sin(k * 3)).toFixed(2)}px)`; L.style.borderRadius = (12 * z).toFixed(1) + 'px' }

/* the line of the shot: badge, then the words rising one by one; out at the shot's end */
let capKey = '';
function caption(t) { const c = $('#cap'), i = SH.findIndex(s => (t >= B(s[0]) || s[0] === 0) && t < B(s[1]));
  if (i < 0 || t >= END) { c.style.opacity = 0; return } const s = SH[i], a = B(s[0]), b = B(s[1]);
  if (capKey !== s[2]) { capKey = s[2]; c.querySelector('.bd').textContent = s[2]; c.querySelector('h2').innerHTML = wordsHTML(s[3]) }
  const out = n(t, b - .2, b); c.style.opacity = (1 - out).toFixed(3);
  /* the first shot is on screen whole from frame 0 (its line and its picture are the premise); later ones rise in */
  const k0 = i === 0 ? 1 : eo(n(t, a, a + .3)); c.querySelector('.bd').style.transform = `translateY(${(16 * (1 - k0)).toFixed(1)}px)`;
  c.querySelectorAll('.w>i').forEach(w => { const k = i === 0 ? 1 : eo(n(t, a + .05 + .055 * w.dataset.n, a + .45 + .055 * w.dataset.n)); w.style.transform = `translateY(${(112 * (1 - k)).toFixed(1)}%)` }) }

let grainT = null;
function grainInit() { const cv = $('#grain'); cv.width = 540; cv.height = 675; grainT = [];
  for (let k = 0; k < 6; k++) { const c = document.createElement('canvas'); c.width = 540; c.height = 675; const x = c.getContext('2d'), im = x.createImageData(540, 675); let s = 1234 + k * 977;
    for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = s / 2147483647 * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255 } x.putImageData(im, 0, 0); grainT.push(c) } }

window.R = t => {
  $('#grain').getContext('2d').drawImage(grainT[Math.floor(t * 24) % 6], 0, 0);
  /* the painted ground drifts; its brand light swells on every kick once the kick is in */
  $('#gnd').style.transform = `translate(${(14 * Math.sin(t * .23)).toFixed(1)}px,${(-10 * t / DUR).toFixed(1)}px) scale(${(1.02 + .05 * t / DUR).toFixed(4)})`;
  const ph = t < KICK ? 0 : Math.exp(-((t - KICK) % BT) / .18) * (t < END ? 1 : .6); $('#pulse').style.opacity = (ph * .9).toFixed(3);
  caption(t);
  const sec = t < B(7) ? 6 : t < B(14) ? 7 : t < B(21) ? 8 : t < B(28) ? 9 : t < END ? 10 : 0;
  touch(0, 0, 0, 0, 0); $('#scrim').style.opacity = 0; $('#lf').style.display = 'none'; $('#rg').style.opacity = 0; $('#dim').style.opacity = 0;
  const phw = $('#phw'), mon = $('#mon');
  /* the end card: the phone glides down and away, the logo and the line arrive */
  const ke = eio(n(t, END, END + .7));
  phw.style.opacity = sec === 7 ? 0 : (1 - ke).toFixed(3); phw.style.transform = `translateY(${(ke * 420).toFixed(1)}px)`;
  const ec = $('#end'); ec.style.opacity = eo(n(t, END + .25, END + .7)).toFixed(3); $('#end img').style.transform = `scale(${(.86 + .14 * spr(n(t, END + .25, END + 1.3))).toFixed(4)})`;
  ec.querySelectorAll('.w>i').forEach(w => { const k = eo(n(t, B(36) + .06 * w.dataset.n, B(36) + .42 + .06 * w.dataset.n)); w.style.transform = `translateY(${(112 * (1 - k)).toFixed(1)}%)` });
  $('.bug').style.opacity = (1 - eo(n(t, END, END + .4))).toFixed(3);
  mon.style.opacity = sec === 7 ? 1 : 0;
  if (sec === 0) { cam(1, 540, 700); return }
  if (sec === 7) {
    /* the monitor: wide, the cursor clicks Grok's post, the open post swaps in, the camera pushes to our reading */
    const a = B(7), kin = spr(n(t, a, a + .9)); mon.style.transform = `translateY(${(140 * (1 - kin)).toFixed(1)}px)`;
