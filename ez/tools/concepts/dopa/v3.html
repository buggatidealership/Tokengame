<!doctype html><meta charset="utf-8"><title>R106 · The P&amp;L cards</title>
<!-- Take 3 "The P&L cards" (the format crypto already shares: a big signed number, the ticker, the side, a brand mark). 11.5 s.
  0.0  frame 0: CoreWeave, 1 LONG vs 3 SHORT, four cards face down, each showing its AI and its side.
  1.0  the shock set up: what the AIs believed (3 of 4 said down).
  3.2  the reveal beat: the close counter rolls to +24.71% (1.2 s).
  4.6  the cards turn: the three shorts first, the only long last. All four stay the same size (losses shown as clearly as the win).
  7.0  the end hold: the four cards, "Only GPT went long", GPT's season, the next round. No near-miss is staged. -->
<style id="base"></style>
<style>
#glow{position:absolute;inset:0}
#cam{position:absolute;inset:0;transform-origin:50% 60%}
#hd{position:absolute;left:56px;right:56px;top:128px}
#co{display:flex;align-items:center;gap:22px;font:900 92px/1 Inter;letter-spacing:-.04em}
#co img{width:86px;height:86px;border-radius:20px;background:#f2ede6;padding:10px}
#sub{position:absolute;left:0;top:118px;font:900 74px/1 Inter;letter-spacing:-.03em;white-space:nowrap}
#sub i{font-style:normal;color:#5f5853;font-size:44px;font-weight:800;margin:0 14px;vertical-align:10px}
#mid{position:absolute;left:56px;right:56px;top:350px;height:150px}
#belief{position:absolute;inset:0}
#belief .k{font:600 22px 'Geist Mono';letter-spacing:.14em;color:#8e8680;margin-bottom:14px}
#belief .bar{display:flex;height:58px;border-radius:14px;overflow:hidden;font:900 28px Inter;letter-spacing:.04em}
#belief .bar div{display:flex;align-items:center;padding:0 22px}
#close{position:absolute;inset:0;display:flex;align-items:center;gap:26px;white-space:nowrap}
#close .k{font:600 22px 'Geist Mono';letter-spacing:.14em;color:#8e8680;line-height:1.5}
#close .p{font:600 128px 'Geist Mono';letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:#55d6a2;text-shadow:0 0 40px rgba(85,214,162,.35)}
#grid{position:absolute;left:56px;top:530px;width:968px;height:700px;perspective:1800px}
.cd{position:absolute;width:476px;height:342px;transform-style:preserve-3d}
.cd .f,.cd .b{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;overflow:hidden}
.cd .b{background:linear-gradient(150deg,#1d1917,#161312 60%);box-shadow:inset 0 0 0 2px #2a2522;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.cd .b .nm{font:800 40px Inter;letter-spacing:-.02em}
.cd .b .sd{font:900 44px Inter;letter-spacing:.06em;padding:10px 24px 8px;border-radius:12px}
.cd .b .cl{position:absolute;left:24px;bottom:20px;font:600 22px 'Geist Mono';letter-spacing:.06em;color:#8e8680}
.cd .b .ez{position:absolute;right:20px;bottom:18px;width:40px;opacity:.5}
.cd .b .q{position:absolute;left:24px;top:20px;font:600 20px 'Geist Mono';letter-spacing:.12em;color:#5f5853}
.cd .f{transform:rotateY(180deg);background:linear-gradient(150deg,#1d1917,#121010 70%);box-shadow:inset 0 0 0 2px #2a2522;padding:24px 26px}
.cd .f .top{display:flex;align-items:center;gap:14px;font:800 32px Inter}
.cd .f .ch{margin-left:auto;font:800 20px Inter;letter-spacing:.08em;padding:7px 12px 5px;border-radius:9px}
.cd .f .pl{font:700 84px 'Geist Mono';letter-spacing:-.05em;margin-top:36px;font-variant-numeric:tabular-nums}
.cd .f .roi{font:600 30px 'Geist Mono';letter-spacing:-.02em;margin-top:4px}
.cd .f .ft{position:absolute;left:26px;right:26px;bottom:20px;display:flex;align-items:center;font:600 18px 'Geist Mono';letter-spacing:.06em;color:#5f5853}
.cd .f .ft img{width:34px;margin-left:auto}
.cd .f .win{position:absolute;right:24px;top:84px;font:900 22px Inter;letter-spacing:.12em;color:#fdbc2a}
.cd .gl{position:absolute;inset:-4px;border-radius:30px;box-shadow:0 0 0 4px #fdbc2a,0 0 70px rgba(253,188,42,.5);opacity:0;pointer-events:none}
.cd .sh{position:absolute;inset:0;border-radius:26px;background:linear-gradient(105deg,transparent 35%,rgba(253,188,42,.28) 50%,transparent 65%);mix-blend-mode:screen;opacity:0}
#endl{position:absolute;left:56px;right:56px;top:1252px;text-align:center;font:600 24px 'Geist Mono';letter-spacing:.08em;color:#8e8680}
#endl b{color:#f2ede6;font-weight:600}
.fine{bottom:26px}
</style>
<div id="cam"><div id="glow"></div>
<div id="hd"><div id="co"><img src="crwv.png" alt="">CoreWeave</div>
  <div id="sub"><span class="up">1 LONG</span><i>vs</i><span class="dn">3 SHORT</span></div></div>
<div id="mid">
  <div id="belief"><div class="k">WHAT THE AIs SAID</div><div class="bar"><div style="width:25%;background:rgba(85,214,162,.2);color:#55d6a2">UP</div><div style="width:75%;background:rgba(232,87,107,.18);color:#e8576b;justify-content:flex-end">3 OF 4 SAID DOWN</div></div></div>
  <div id="close"><div class="k">THE CLOSE<br>WED 4:00 PM</div><div class="p" id="cp"></div></div>
</div>
<div id="grid"></div>
<div id="endl"></div></div>
<div id="vig"></div><canvas id="grain"></canvas>
<script src="lib.js"></script>
<script>
L.$('#base').textContent = L.css; L.chrome(document.body);
const R = L.R, cam = L.$('#cam');
// card order on the grid: GPT top left; flip order: the shorts first, the long last
const POS = [[0, 0], [492, 0], [0, 358], [492, 358]], FLIP = { KIMI: 4.6, CLAUDE: 5.0, GROK: 5.4, GPT: 6.0 }, TR = 3.2, TE = 4.4;
let cards;
const mkCards = () => cards = R.ai.map((a, i) => { const el = document.createElement('div'); el.className = 'cd';
  const L_ = a.side === 'LONG', col = L_ ? '#55d6a2' : '#e8576b';
  el.innerHTML = `<div class="b"><span class="q">CRWV · ROUND 106</span>${L.mark(a.k, 120)}<div class="nm">${a.name}</div><div class="cl">CALLED ${a.call > 0 ? "+" : "−"}${Math.abs(a.call)}%</div>
    <div class="sd" style="color:${col};background:${L_ ? 'rgba(85,214,162,.15)' : 'rgba(232,87,107,.13)'};box-shadow:inset 0 0 0 2px ${col}88">${a.side}</div><img class="ez" src="ezlogo.svg" alt=""></div>
   <div class="f"><div class="top">${L.mark(a.k, 54)}${a.name}<span class="ch" style="color:${col};background:${L_ ? 'rgba(85,214,162,.15)' : 'rgba(232,87,107,.13)'}">CRWV ${a.side}</span></div>
    ${L_ ? '<div class="win">THE ONLY LONG</div>' : ''}
    <div class="pl" style="color:${L_ ? '#55d6a2' : '#e8576b'}">${L.money(a.pnl)}</div>
    <div class="roi" style="color:${col}">${L.pct((L_ ? 1 : -1) * R.move)} on $100K</div>
    <div class="ft">TUE CLOSE → WED CLOSE<img src="ezlogo.svg" alt=""></div><div class="sh"></div></div><div class="gl"></div>`;
  L.$('#grid').appendChild(el); return el });
let grain;
window.CUES = [[0.05, 'r11-swell', .12], [0.25, 'r11-card', .14], [0.37, 'r11-card', .14], [0.49, 'r11-card', .14], [0.61, 'r11-card', .14],
  [1.1, 'r11-pluck', .14], [1.5, 'r11-pluck', .14], [1.9, 'r11-pluck', .14], [2.3, 'r11-pluck', .14], [2.0, 'sfx-riser', .14], [TR, 'r10-tick', .18], [TE, 'sfx-boom', .3],
  [FLIP.KIMI + .18, 'sfx-flip', .2], [FLIP.KIMI + .3, 'r11-thump', .16], [FLIP.CLAUDE + .18, 'sfx-flip', .2], [FLIP.CLAUDE + .3, 'r11-thump', .16], [FLIP.GROK + .18, 'sfx-flip', .2], [FLIP.GROK + .3, 'r11-thump', .16],
  [FLIP.GPT + .3, 'sfx-flip', .22], [FLIP.GPT + .45, 'r11-kaching', .28], [FLIP.GPT + .5, 'r11-sparkle', .14], [7.2, 'sfx-whoosh', .1], [8.6, 'sfx-chime', .14]];
window.R = t => {
  grain(t);
  // frame 0 holds the stakes; the cards land from below one by one (they are already in place on frame 0's thumbnail)
  cards.forEach((el, i) => { const a = R.ai[i]; const [x, y] = POS[i];
    const d = L.spring(t - .2 - i * .12, 1.6, 7), lift = t < .2 ? 0 : (1 - d) * 30;
    const ft = FLIP[a.k], dur = a.side === 'LONG' ? .7 : .45, f = L.eio(L.n(t, ft, ft + dur));
    const rise = a.side === 'LONG' ? Math.sin(Math.PI * L.n(t, ft, ft + dur)) * 40 : Math.sin(Math.PI * L.n(t, ft, ft + dur)) * 20;
    const settle = a.side === 'LONG' ? 1 + .04 * L.eo(L.n(t, ft + dur, ft + dur + .3)) - .04 * L.eo(L.n(t, ft + dur + .3, ft + dur + .9)) : 1;
    el.style.transform = `translate(${x}px,${y + lift}px) translateZ(${rise}px) rotateY(${180 * f}deg) scale(${settle})`;
    el.style.opacity = t < .2 ? 1 : L.cl(d * 1.4);
    const cc = el.querySelector('.b .cl'); cc.style.opacity = L.n(t, 1.1 + i * .4, 1.4 + i * .4); cc.style.transform = `translateY(${8 * (1 - L.eo(L.n(t, 1.1 + i * .4, 1.5 + i * .4)))}px)`;
    // the losers settle a touch darker, the winner takes the light
    el.querySelector('.f').style.filter = a.side === 'SHORT' ? `brightness(${1 - .12 * L.n(t, ft + dur, ft + dur + .4)})` : '';
    el.querySelector('.gl').style.opacity = a.side === 'LONG' ? L.eo(L.n(t, ft + .5, ft + 1.0)) : 0;
    el.querySelector('.sh').style.opacity = a.side === 'LONG' ? Math.sin(Math.PI * L.n(t, ft + .6, ft + 1.4)) : 0;
    el.querySelector('.sh').style.transform = `translateX(${L.lerp(-480, 480, L.n(t, ft + .6, ft + 1.4))}px)`;
    // dim the cards while the close counter rolls
    el.querySelector('.b').style.filter = `brightness(${1 - .35 * L.n(t, TR - .2, TR) * (1 - L.n(t, TE, TE + .3))})`;
  });
  L.$('#sub').style.opacity = 1;
  // the middle band: belief (1.0) -> the close (3.2)
  const bl = L.$('#belief'); bl.style.opacity = 1 - L.n(t, TR - .3, TR);
  const cl = L.$('#close'); cl.style.opacity = L.n(t, TR - .1, TR + .15);
  const r = L.eo5(L.n(t, TR, TE)); L.$('#cp').textContent = L.pct(R.move * r);
  L.$('#cp').style.transform = `scale(${1 + .1 * Math.sin(Math.PI * L.n(t, TE, TE + .4))})`; L.$('#cp').style.transformOrigin = '0 60%';
  // after the turn: the header line says the shock
  if (t > 6.9) { L.$('#sub').innerHTML = '<span class="au">Only GPT went long.</span>'; L.$('#sub').style.opacity = L.n(t, 6.9, 7.3) }
  else L.$('#sub').innerHTML = '<span class="up">1 LONG</span><i>vs</i><span class="dn">3 SHORT</span>';
  const e = L.$('#endl');
  e.innerHTML = t < 9.0 ? 'GPT SEASON: <b>−$24,740 → −$30</b>' : 'NEXT: <b>NEBIUS</b> · 3 LONG v 1 SHORT · TODAY\'S CLOSE';
  e.style.opacity = t < 9.0 ? L.n(t, 7.4, 7.8) * (1 - L.n(t, 8.6, 9.0)) : L.n(t, 9.0, 9.4);
  const b = L.n(t, FLIP.GPT + .4, FLIP.GPT + 1) * (1 - .5 * L.n(t, 7.5, 9));
  L.$('#glow').style.background = `radial-gradient(ellipse 70% 40% at 40% 32%,rgba(85,214,162,${.16 * L.n(t, TR, TE)}),transparent 70%),radial-gradient(ellipse 50% 40% at 28% 62%,rgba(253,188,42,${.22 * b}),transparent 70%)`;
  const push = 1 + .03 * L.eio(L.n(t, 1.0, TE)) - .03 * L.eio(L.n(t, TE + .1, 6.9));
  const kick = t > TE ? Math.exp(-(t - TE) * 9) * Math.sin((t - TE) * 55) * 5 : 0;
  cam.style.transform = `translate(${kick}px,${kick * .5}px) scale(${push})`;
};
L.boot(async () => { mkCards(); grain = L.grain(L.$('#grain'), .08); await Promise.all(L.$$('img').map(i => i.decode().catch(() => 0))) });
</script>
