<!doctype html><meta charset="utf-8"><title>Callouts and receipts</title>
<!-- Season 2 outcome video, concept A: CALLOUTS AND RECEIPTS (oc BRIEF, 2026-11-20). A trader's call channel: before the report each AI
  posts its trade as a message (its mark, LONG or SHORT with the called move); at the close every message gets its receipt, a signed P&L
  stamped onto it, right trades lit and wrong ones dimmed; the channel ends on the Season 2 leaderboard. Same contract as close.html
  (window.R(t), READY, DUR, MUSIC, CUES, lib.js), so wrapx.sh renders it unchanged. Data: data/close-<date>.json (prep-close.js).
  The room is a Hedra painting (w6/oc-a/ground.jpg: a night trading desk, green screens on the left wall, red on the right; the bell,
  w6/oc-a/bell.webp, is the market's mark). Messages sit on the side of their trade: LONG on the green side, SHORT on the red side.
  At the close the room takes the colour of the night (the larger side of the three moves).
  Reading load (15 trades with 15 reasons need about 72 s of reading; the video has about 20): one company per screen; every call is one
  line (mark, side, called move), read as a pattern; ONE reason per company is shown in full: the trade against the crowd (the side
  fewer AIs took; of two, the higher confidence). Its message opens the thread, so it is on screen longest (2.95 s, the longest reason
  needs 2.92). The quote names its AI; the other calls carry the AI's mark only; the board names all five.
  Beats (130 BPM, B = 0.4615 s; the bed's drop at 14.79 s in the file lands on the close, beat 25; MUSIC.at = 3.252):
  0      the channel name alone: First 3 trades of Season 2
  b4     it docks as the channel header; THU BEFORE EARNINGS; the Intuit thread: the contrarian's message with its reason, then the rest
  b11    Keysight thread          b18  Elastic thread
  b25    DROP: the bell rings in Elastic's header, FRI CLOSE and the move; half a beat later the receipts stamp on every message
  b30.5  scroll back up to Keysight: its close and receipts          b36  back up to Intuit: its close and receipts (the night's biggest)
  b41.5  the Season 2 leaderboard, P&L after 3 trades, each AI's three receipts beside its P&L; b43.5 the leader's gold rim; end b47.5
  (21.92 s). ?ch=0 drops the docked channel name after the first thread (4 words fewer on every later shot).
  Words on screen: no punctuation of any kind; sides are LONG or SHORT; every number carries its label; $100K on every trade. -->

<style>

.rc{display:flex;align-items:center;height:68px;clip-path:inset(-30px 0 -30px -30px)}

.st.up{border-color:rgba(85,214,162,.9);background:rgba(85,214,162,.16);box-shadow:0 0 26px rgba(85,214,162,.35)}

/* the leaderboard */
#board{position:absolute;left:56px;top:170px;width:968px;height:1110px;display:flex;flex-direction:column;justify-content:center;gap:18px}
#board .h{font:italic 900 74px/1 Kanit;letter-spacing:-.01em;color:#f2ede6;white-space:nowrap}
#board .k{font:400 38px/1 'Bebas Neue';letter-spacing:.16em;color:#b9b1a8;margin:2px 0 14px}
.br{position:relative;height:132px;border-radius:26px;display:flex;align-items:center;padding:0 30px 0 22px}

.br .nm{position:relative;font:italic 900 54px/1 Kanit;color:#f2ede6;margin-left:22px;width:214px;white-space:nowrap}

.br .rcs img{width:50px;height:50px;border-radius:13px;display:block}

.br .rim{position:absolute;inset:-4px;padding:4px;border-radius:30px;pointer-events:none;opacity:0;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* the channel name: alone first, then docked under the bug */
#title{position:absolute;left:0;top:0;transform-origin:0 0;white-space:nowrap}
#title .h{font:italic 900 128px/1.02 Kanit;letter-spacing:-.01em;color:#f2ede6;text-shadow:0 8px 0 rgba(0,0,0,.45),0 0 60px rgba(5,6,10,.9)}

<script>
L.$('#base').textContent = L.css;
const Q = new URLSearchParams(location.search), DATE = Q.get('d') || '2026-11-20';
const UP = '85,214,162', DN = '232,87,107', AU = '253,188,42';
const B = 60 / 130, bt = n => n * B;
const T_DOCK = bt(4), S = j => bt(4 + 7 * j), TR = bt(25), PL = 5.5, T_BOARD = bt(25 + 3 * PL), T_LEAD = T_BOARD + bt(2), END = T_BOARD + bt(6);
const H = 1030, SEP = ' ';
// the approved short reason lines (oc BRIEF; verbatim essence of ez/data/s2-calls/calls.csv, no punctuation by rule) and the AIs'
// confidence that they have the direction right (calls.csv confidence_pct)
const WHY = {
  INTU: { GPT: 'Higher QuickBooks prices lift sales', CLAUDE: 'Its own guide says growth slows', GROK: 'AI fear outlasts a beat', GEMINI: 'Down 52% this year bounce due', QWEN: 'Priced for AI ruin' },
  KEYS: { GPT: 'Orders ran ahead of shipments', CLAUDE: 'Keeps beating its own guide', GROK: 'Not sold off enough yet', GEMINI: 'Supply limits and a broken chart', QWEN: 'Orders up 56% low bar' },
  ESTC: { GPT: 'Cloud sales up 27%', CLAUDE: 'Down 27% backlog still rising', GROK: 'AI adoption better than feared', GEMINI: 'Four straight beats sold anyway', QWEN: 'Datadog just guided flat' } };
const CONF = { INTU: { GPT: 57, CLAUDE: 56, GROK: 65, GEMINI: 61, QWEN: 58 }, KEYS: { GPT: 59, CLAUDE: 53, GROK: 60, GEMINI: 58, QWEN: 56 }, ESTC: { GPT: 55, CLAUDE: 52, GROK: 58, GEMINI: 62, QWEN: 55 } };
let D, MOD, grain, N, TH = [], BR = [], cam = L.$('#cam');
const mark = (k, s) => { const m = MOD[k]; return `<svg width="${s}" height="${s}" viewBox="-4 -4 32 32" style="background:${m.bg}"><path d="${m.d}" fill="${m.fg}"${m.fr ? ' fill-rule="evenodd"' : ''}/></svg>` };
const callTxt = c => String(Math.abs(c.call)) + '%';
// the reason shown in full: the trade against the crowd (the side fewer AIs took); of several, the highest confidence
const pickQuote = r => { const nL = r.calls.filter(c => c.side === 'LONG').length, side = nL * 2 < r.calls.length ? 'LONG' : nL * 2 > r.calls.length ? 'SHORT' : null;
  const pool = side ? r.calls.filter(c => c.side === side) : r.calls; return pool.slice().sort((a, b) => CONF[r.ticker][b.k] - CONF[r.ticker][a.k])[0] };
const ease = (t, keys) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const [t0, v0] = keys[i - 1], [t1, v1] = keys[i]; return t1 === t0 ? v1 : L.lerp(v0, v1, L.eio((t - t0) / (t1 - t0))) } return keys.at(-1)[1] };
// the receipt phases: the drop lands on the last thread (Elastic), then the channel scrolls back up to Keysight and Intuit
const PH = () => [2, 1, 0].map((j, i) => ({ j, t0: bt(25 + PL * i) }));
const clockAt = m => { const tot = 16 * 60 + Math.round(m), mm = tot % 1440; let h = Math.floor(mm / 60); const mi = mm % 60, ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + String(mi).padStart(2, '0') + ' ' + ap };
const setup = () => {
  N = D.rounds.length;
  if (D.preview) { const pv = L.$('#pv'); pv.style.display = 'block'; pv.textContent = ['PREVIEW', 'PRE MARKET PRICES', 'NOT FINAL'].join('  ') }
  L.$('#bk').textContent = `P&L after ${D.after} trades`;
  const col = L.$('#col');
  D.rounds.forEach((r, j) => {
    const th = document.createElement('div'); th.className = 'th'; th.style.top = j * H + 'px';
    const q = pickQuote(r), order = [q, ...r.calls.filter(c => c !== q)], up = r.move >= 0;
    th.innerHTML = (j === 0 ? `<div class="dv"><i></i>${D.day0} BEFORE EARNINGS<i></i></div>` : '') +
      `<div class="hdr"><div class="gl"></div><img class="lg" src="${r.logo}"><div class="cn"><span class="co">${r.co}</span><span class="tk">${r.ticker}</span></div>
        <div class="cls"><div class="in"><img class="bell" src="w6/oc-a/bell.webp"><div class="cv"><b>${D.day1} CLOSE</b><i style="color:${up ? '#6ff0bb' : '#ff7a8c'}">${L.pct(r.move)}</i></div></div></div></div>` +
      order.map(c => { const qq = c === q, s = c.side[0];
        return `<div class="msg ${s}${qq ? ' qm' : ''}" data-k="${c.k}"><div class="av">${mark(c.k, qq ? 88 : 80)}</div><div class="bub ${qq ? 'q' : 'c'}"><div class="gl"></div>${qq ? `<div class="nm">${D.ais.find(a => a.k === c.k).name}</div>` : ''}
          <div class="cl"><span class="sd ${s}">${c.side}</span><span class="mv">${callTxt(c)}</span><span class="rc"><span class="st ${c.pnl >= 0 ? 'up' : 'dn'}"><b>P&L</b><i>${L.money(c.pnl)}</i></span></span></div>
          ${qq ? `<div class="why">${WHY[r.ticker][c.k]}</div>` : ''}</div></div>` }).join('');
    col.appendChild(th);
    TH.push({ r, el: th, hdr: th.querySelector('.hdr'), cls: th.querySelector('.cls'), bell: th.querySelector('.bell'), dv: th.querySelector('.dv'),
      msgs: [...th.querySelectorAll('.msg')].map((el, i) => ({ el, c: order[i], q: i === 0, bub: el.querySelector('.bub'), rc: el.querySelector('.rc'), st: el.querySelector('.st'), dimEls: el.querySelectorAll('.av,.nm,.sd,.mv,.why'), gl: el.querySelector('.gl') })) });
  });
  // the leaderboard rows, in the season's order; each row carries the AI's three receipts (lit right, dimmed wrong)
  const rows = L.$('#rows');
  D.order.forEach((k, i) => { const el = document.createElement('div'); el.className = 'br'; el.style.marginTop = i ? '20px' : '0'; const v = D.season1[k];
    el.innerHTML = `<div class="gl"></div><div class="rim"></div><span class="rk">${i + 1}</span><div class="av">${mark(k, 68)}</div><span class="nm">${D.ais.find(a => a.k === k).name}</span>
      <span class="rcs">${D.rounds.map(r => { const c = r.calls.find(x => x.k === k); return `<img class="${c.right ? 'ok' : 'no'}" src="${r.logo}">` }).join('')}</span>
      <span class="pl" style="color:${v > 0 ? '#6ff0bb' : v < 0 ? '#ff7a8c' : '#f2ede6'}">${v === 0 ? '$0' : L.money(v)}</span>`;
    rows.appendChild(el); BR.push({ k, el, i, gl: el.querySelector('.gl'), rim: el.querySelector('.rim'), nm: el.querySelector('.nm') }) });
  // sound: a pop for every message, the bell on the drop, a stamp for every set of receipts
  const C = window.CUES = [[0.05, 'r11-swell', .12], [T_DOCK - .04, 'sfx-whoosh', .16]];
  TH.forEach((T, j) => { if (j) C.push([+(S(j) - .1).toFixed(3), 'sfx-whoosh', .1]); C.push([+S(j).toFixed(3), 'r11-card', .1]);
    T.msgs.forEach((m, i) => C.push([+(msgT(j, i)).toFixed(3), i ? 'r11-bubble' : 'r11-ping', i ? .08 : .12])) });
  C.push([TR, 'sfx-riser', .12], [TR, 'sfx-bell', .3]);
  PH().forEach((p, i) => { if (i) C.push([+(p.t0 - .12).toFixed(3), 'sfx-whoosh', .12], [+p.t0.toFixed(3), 'sfx-bell', .16]); C.push([+(p.t0 + B / 2).toFixed(3), 'sfx-stamp', .24], [+(p.t0 + B / 2 + .12).toFixed(3), 'r11-kaching', .14]) });
  C.push([T_BOARD, 'sfx-whoosh', .12], [T_BOARD + .3, 'r11-thump', .14]); BR.forEach((r, i) => C.push([+(boardT(i)).toFixed(3), 'r11-card', .07]));
  C.push([T_LEAD, 'sfx-chime', .14], [T_LEAD + .05, 'r11-sparkle', .1]);
  window.MUSIC = { f: 'm2-phonk', at: +(14.79 - TR).toFixed(3) }; window.DUR = +END.toFixed(2);
};
// when each message lands: the quote half a beat after the header, the rest on half beats after it
const msgT = (j, i) => S(j) + (i ? (.5 + .5 * i) * B : .25 * B);
const boardT = i => T_BOARD + .5 * B + i * .25 * B;
const measure = () => {
  // one slot width for every called move, so the receipts of one side stand in one column (siblings are one component)
  const mvs = L.$$('.bub .mv'), mw = Math.ceil(Math.max(...mvs.map(e => e.getBoundingClientRect().width)));
  mvs.forEach(e => e.style.width = mw + 'px');
  TH.forEach(T => { T.clsW = T.cls.scrollWidth; T.msgs.forEach(m => { m.rcW = Math.ceil(m.st.offsetWidth) + 24 + 10 }) });
};
window.R = t => {
  grain(t);
  // the room: a slow drift; at the close it takes the colour of the night (the larger side of the three moves)
  const g = L.$('#gnd'); g.style.transform = `translate(${-54 + 10 * Math.sin(t / 7)}px,${-68 - 16 * L.n(t, 0, END)}px) scale(${1 + .025 * L.n(t, 0, END)})`;
  const net = D.rounds.reduce((s, r) => s + r.move, 0) / N, w = L.cl(Math.abs(net) / 4), nc = L.eio(L.n(t, TR, TR + .6)), downNight = net < 0;
  const lo = downNight ? 'left' : 'right', hiC = downNight ? DN : UP;
  L.$('#nite').style.background = `linear-gradient(${downNight ? 90 : 270}deg,rgba(5,6,10,${.62 * nc * w}) 0%,rgba(5,6,10,${.3 * nc * w}) 34%,rgba(5,6,10,0) 56%),
    radial-gradient(ellipse 60% 70% at ${downNight ? 100 : 0}% 45%,rgba(${hiC},${.22 * nc * w}),rgba(${hiC},0) 70%)`;
  // the channel name: alone, then docked as the header
  const ti = L.$('#title'), tin = L.eo5(L.n(t, .12, .55)), dk = L.eio(L.n(t, T_DOCK - .1, T_DOCK + .4)), tw = ti.offsetWidth, th0 = ti.offsetHeight;
  ti.style.transform = `translate(${L.lerp(540 - tw / 2, 56, dk)}px,${L.lerp(540 - th0 / 2 + 30 * (1 - tin), 132, dk)}px) scale(${L.lerp(1, .35, dk)})`; ti.style.opacity = tin * (1 - L.n(t, T_BOARD, T_BOARD + .3)) * (Q.get('ch') === '0' ? 1 - L.n(t, S(1) - .35 * B, S(1)) : 1);
  // the channel scroll: one thread a screen before the close; back up through them for the receipts; away for the board
  const P = PH();
  const keys = [[T_DOCK - .1, -.25], [T_DOCK + .35, 0], [S(1) - .35 * B, 0], [S(1), 1], [S(2) - .35 * B, 1], [S(2), 2], [P[1].t0 - .35 * B, 2], [P[1].t0, 1], [P[2].t0 - .35 * B, 1], [P[2].t0, 0]];
  let y = -ease(t, keys) * H;
  const away = L.eio(L.n(t, T_BOARD - .15, T_BOARD + .2)); y -= away * 220;
  L.$('#col').style.transform = `translateY(${y.toFixed(1)}px)`;
  TH.forEach((T, j) => {
    const vis = (1 - away);
    // the divider and the header land with the thread
    const hin = L.eo5(L.n(t, S(j) - .2, S(j) + .2));
