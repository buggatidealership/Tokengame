<!doctype html><meta charset="utf-8"><title>Full time</title>
<!-- Night studio outcome take 2, FULL TIME (2026-11-20): the close told as a football results show. Every company is a fixture, LONG
  against SHORT, each side's line-up the AIs that took it (their marks); the match clock is New York's clock from the close before to
  this close; the score box is the stock's live move, the side that would be paid glows; the bell is the full-time whistle: the moves
  lock, the paid side is lit gold with its P&L under its marks, the other side goes dark with its P&L; then the table (Season 2 standings:
  W and L of this close, P&L) slides in row by row, the leader in gold; the end card. A painted floodlit stadium (w6/nt/ov/ov2-stadium.jpg)
  under broadcast glass panels. Faces: Barlow Condensed (every word and figure, tabular) and Anton (the full-time slam only).
  Bed w8f-horns (174 BPM), its first drop (12.414 s in the file, beat 36) on the whistle: TR = 8.276 s here, MUSIC.at = 4.138.
  Data: data/close-<date>.json (nt-ov2.html?d=<YYYY-MM-DD>). Up to 4 fixtures a page; more companies page through on the beat (a page per
  4 beats while live, per 6 beats after the whistle), so the film grows by about 2 s a page past the first.
  Words of our own on screen: no punctuation; sides are LONG or SHORT; every money figure is a signed P&L with its label. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&family=Anton&display=swap">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#04070e;color:#f8f0d9;font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
#st{position:absolute;inset:0;overflow:hidden}

  box-shadow:inset 0 2px 0 rgba(248,240,217,.34),inset 0 -2px 0 rgba(0,0,0,.5),0 22px 50px rgba(0,0,0,.55)}
#title{left:0;top:0;width:1080px;height:1350px}
#title .lg{position:absolute;left:465px;top:290px;width:150px;height:150px;filter:drop-shadow(0 12px 30px rgba(0,0,0,.6))}
#title .h{position:absolute;left:0;right:0;top:470px;text-align:center;font:italic 900 150px/0.9 'Barlow Condensed';letter-spacing:-.01em;text-transform:uppercase}
#title .s{position:absolute;left:50%;top:620px;transform:translateX(-50%);padding:10px 34px 8px;font:italic 800 58px/1 'Barlow Condensed';letter-spacing:.06em;color:#04070e;background:#fdbc2a;clip-path:polygon(18px 0,100% 0,calc(100% - 18px) 100%,0 100%);text-transform:uppercase}
.stripe{position:absolute;left:-200px;width:1500px;height:44px;transform:rotate(-24deg);transform-origin:50% 50%}
#clk{position:absolute;right:54px;top:50px;height:64px;display:flex;align-items:center;z-index:700}

#clk .lv i{width:14px;height:14px;border-radius:50%;background:#f8f0d9;display:block}

.fx .l .lab{color:#03c870}.fx .r .lab{color:#ff3a31}

.fx .mid{position:absolute;left:340px;width:312px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.fx .crest{display:flex;align-items:center;gap:14px}
.fx .crest img{width:62px;height:62px;border-radius:14px;box-shadow:0 0 0 2px rgba(248,240,217,.3)}
.fx .crest b{font:800 44px/1 'Barlow Condensed';letter-spacing:.01em}
.fx .sc{min-width:250px;height:74px;padding:0 18px;display:flex;align-items:center;justify-content:center;font:800 58px/1 'Barlow Condensed';letter-spacing:.01em;background:#04070e;border-radius:10px;box-shadow:inset 0 0 0 2px rgba(248,240,217,.22),inset 0 10px 18px rgba(248,240,217,.05)}
.fx .glow{position:absolute;top:0;bottom:0;width:340px;pointer-events:none;opacity:0}
.fx .gl-l{left:0;background:linear-gradient(90deg,rgba(3,200,112,.42),rgba(3,200,112,0))}
.fx .gl-r{right:0;background:linear-gradient(270deg,rgba(255,58,49,.42),rgba(255,58,49,0))}
.fx .win{position:absolute;top:0;bottom:0;width:340px;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 4px #fdbc2a,inset 0 0 60px rgba(253,188,42,.35)}
.fx .win.l{left:0}.fx .win.r{right:0}
.fx .tag{position:absolute;top:20px;padding:6px 14px 4px;font:italic 900 30px/1 'Barlow Condensed';letter-spacing:.08em;color:#04070e;background:#fdbc2a;opacity:0}
.fx .tag.l{left:150px}.fx .tag.r{right:166px}
#strip{left:44px;top:1196px;width:992px;height:110px;clip-path:polygon(22px 0,100% 0,100% 100%,0 100%,0 22px)}
#strip .k{position:absolute;left:26px;top:16px;font:italic 800 30px/1 'Barlow Condensed';letter-spacing:.1em;color:#fdbc2a}
#strip .row{position:absolute;left:26px;right:20px;top:54px;display:flex;justify-content:space-between}
#strip .it{display:flex;align-items:center;gap:10px;font:700 34px/1 'Barlow Condensed'}
#slam{left:0;top:0;width:1080px;height:1350px;pointer-events:none;z-index:600}
#slam .lg{position:absolute;left:450px;top:300px;width:180px;height:180px;filter:drop-shadow(0 10px 0 #04070e) drop-shadow(0 0 40px rgba(253,188,42,.6))}
#slam .w{position:absolute;left:0;right:0;top:520px;text-align:center;font:italic 400 230px/1 Anton;letter-spacing:.01em;color:#f8f0d9;text-transform:uppercase;text-shadow:0 10px 0 #04070e,0 0 60px rgba(253,188,42,.55)}
#slam .bar{position:absolute;left:-100px;width:1300px;height:38px;transform:rotate(-8deg)}
#tbl{left:44px;top:230px;width:992px}
#tbl .th{position:absolute;left:0;top:0;width:992px;height:108px;clip-path:polygon(0 0,100% 0,calc(100% - 26px) 100%,0 100%)}
#tbl .th .t{position:absolute;left:30px;top:20px;font:italic 900 70px/1 'Barlow Condensed';letter-spacing:.02em;text-transform:uppercase}
#tbl .th .t b{color:#fdbc2a}
#tbl .th img{position:absolute;left:640px;top:12px;width:84px;height:84px}
#tbl .ch{position:absolute;top:132px;font:700 30px/1 'Barlow Condensed';letter-spacing:.14em;color:#fdbc2a}
.tr{position:absolute;left:0;width:992px;height:140px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.tr .pos{position:absolute;left:0;top:0;bottom:0;width:96px;display:flex;align-items:center;justify-content:center;font:italic 900 62px/1 'Barlow Condensed';background:rgba(248,240,217,.07)}
.tr .mkw{position:absolute;left:122px;top:34px}
.tr .nm{position:absolute;left:208px;top:40px;font:800 58px/1 'Barlow Condensed';letter-spacing:.01em}
.tr .w,.tr .lo{position:absolute;top:42px;width:70px;text-align:center;font:700 56px/1 'Barlow Condensed'}
.tr .w{left:478px;color:#03c870}.tr .lo{left:578px;color:#ff3a31}
.tr .pl{position:absolute;right:34px;top:36px;font:800 64px/1 'Barlow Condensed';letter-spacing:.01em;text-align:right}
.tr .tn{position:absolute;right:34px;top:8px;font:700 26px/1 'Barlow Condensed';letter-spacing:.08em;opacity:.85}
.tr .rim{position:absolute;inset:0;box-shadow:inset 0 0 0 4px #fdbc2a,inset 0 0 70px rgba(253,188,42,.3);opacity:0}
.tr .sp{position:absolute;inset:0;mix-blend-mode:screen;opacity:0}
.foil{color:transparent!important;background-image:linear-gradient(100deg,#fdbc2a 38%,#f8f0d9 50%,#fdbc2a 62%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text}
</style>
<div id="st"><div id="cam">
  <div id="gnd"><img src="w6/nt/ov/ov2-stadium.jpg" alt=""></div>
  <div id="flood"></div>
  <div id="scrim"></div>
  <div id="board" class="ab" style="width:1080px;height:1350px">
    <div id="hd" class="ab pn"><div class="t"></div><div class="ft">FULL TIME</div></div>
    <div id="fxs"></div>
    <div id="strip" class="ab pn"><div class="k">LIVE P&amp;L</div><div class="row"></div></div>
  </div>
  <div id="tbl" class="ab"><div class="th pn"><div class="t"></div></div><div id="trs"></div></div>
  <div id="title" class="ab"><img class="lg" src="ezlogo.svg" alt=""><div class="h"></div><div class="s"></div></div>
</div>
<div id="slam" class="ab"><img class="lg" src="ezlogo.svg" alt=""><div class="w">Full time</div></div>
<div id="clk"><div class="lv"><i></i>LIVE</div><div class="tm pn"><b></b><span></span></div></div>
</div>
<script src="lib.js"></script><script src="nt-ov.js"></script>
<script>
const BPM = 174, TR = 8.276;
let D, G, grain, FX = [], TRS = [], STRIP = [], PG, NPG, stripes = [];
const UPR = 4; // fixtures a page
const setup = () => {
  G = OV.grid(BPM, TR, 12.414, 'w8f-horns'); const B = G.B;
  NPG = Math.ceil(D.N / UPR); const extra = (NPG - 1) * 6 * G.p; window.DUR = +(16.4 + extra).toFixed(2);
  OV.bug("italic 800 34px 'Barlow Condensed'", { css: 'letter-spacing:.02em', endFont: "italic 900 64px 'Barlow Condensed'", subFont: "italic 800 30px 'Barlow Condensed'" });
  grain = OV.grain(.07);
  L.$('#title .h').textContent = D.title[0]; L.$('#title .s').textContent = D.title[1];
  L.$('#hd .t').innerHTML = '<span class="g">LONG</span><span class="v">v</span><span class="r">SHORT</span>';
  // the fixtures
  D.rounds.forEach((r, j) => { const el = document.createElement('div'); el.className = 'fx ab pn';
    const side = (cs, cl, lab) => `<div class="sd ${cl}"><div class="lab">${lab}</div><div class="mks">${cs.map(c => OV.mark(c.k, 56, 'box-shadow:0 0 0 2px rgba(248,240,217,.25)')).join('')}</div><div class="pl"></div></div>`;
    el.innerHTML = `<div class="glow gl-l"></div><div class="glow gl-r"></div><div class="win l"></div><div class="win r"></div>
      ${side(r.longs, 'l', 'LONG')}${side(r.shorts, 'r', 'SHORT')}
      <div class="mid"><div class="crest"><img src="${r.logo}" alt=""><b>${r.co}</b></div><div class="sc"></div></div>
      <div class="tag l"></div><div class="tag r"></div>`;
    L.$('#fxs').appendChild(el); FX.push(el) });
  // live P&L strip
  L.$('#strip .row').innerHTML = D.ais.map(a => `<div class="it">${OV.mark(a.k, 40)}<span></span></div>`).join(''); STRIP = L.$$('#strip .it span');
  // the table
  L.$('#tbl .th .t').innerHTML = 'Season 2 <b>table</b>'; L.$('#tbl .th').insertAdjacentHTML('beforeend', '<img src="ezlogo.svg" alt="">');
  L.$('#tbl').insertAdjacentHTML('beforeend', `<div class="ch" style="left:22px">POS</div><div class="ch" style="left:208px">AI</div><div class="ch" style="left:500px">W</div><div class="ch" style="left:604px">L</div><div class="ch" style="right:34px;text-align:right">${D.before ? 'SEASON P&amp;L' : 'P&amp;L'}</div>`);
  D.ranked.forEach((a, i) => { const el = document.createElement('div'); el.className = 'tr pn';
    el.innerHTML = `<div class="rim"></div><div class="sp"></div><div class="pos">${i + 1}</div><div class="mkw">${OV.mark(a.k, 64, 'box-shadow:0 0 0 2px rgba(248,240,217,.25)')}</div><div class="nm">${a.name}</div><div class="w">${a.W}</div><div class="lo">${a.L}</div>${D.before ? `<div class="tn" style="color:${OV.sgn(a.night)}">TONIGHT ${OV.money(a.night)}</div>` : ''}<div class="pl" style="color:${OV.sgn(a.s1)};${D.before ? 'top:44px;font-size:56px' : ''}">${OV.money(a.s1)}</div>`;
    L.$('#trs').appendChild(el); TRS.push(el) });
  // floodlight beams and the wipe stripes
  const fl = L.$('#flood'); fl.innerHTML = [0, 1, 2, 3].map(i => `<div class="ab" style="left:${120 + i * 260}px;top:-200px;width:220px;height:1100px;transform-origin:50% 0;background:linear-gradient(180deg,rgba(253,188,42,.20),rgba(253,188,42,0) 80%);filter:blur(30px)"></div>`).join('');
  [['#03c870', 0], ['#fdbc2a', 1], ['#ff3a31', 2], ['#f8f0d9', 3]].forEach(([c, i]) => { const s = document.createElement('div'); s.className = 'stripe'; s.style.background = c; s.style.zIndex = 650; L.$('#st').appendChild(s); stripes.push(s) });
  const bars = [['#03c870', 470], ['#fdbc2a', 780], ['#ff3a31', 805]]; L.$('#slam').insertAdjacentHTML('afterbegin', bars.map(([c, y]) => `<div class="bar" style="top:${y}px;background:${c}"></div>`).join(''));
  // sound
  const C = window.CUES = [[.05, 'r11-swell', .12], [.3, 'sfx-whoosh', .12], [B(-20), 'sfx-whoosh', .12]]; OV.sting(C);
  D.rounds.forEach((r, j) => C.push([+(B(-20) + (j % UPR) * 2 * G.p).toFixed(3), 'r11-card', .1]));
  C.push([B(-14), 'r11-slide', .1], [B(-10), 'sfx-whoosh', .1], [B(-6), 'sfx-whoosh', .1], [B(-4), 'sfx-clock', .14], [B(-2), 'sfx-clock', .14], [B(-1), 'sfx-riser', .1],
    [TR, 'sfx-bell', .32], [TR + .02, 'r11-thump', .22], [TR + .08, 'sfx-stamp', .2], [B(2), 'sfx-whoosh', .12], [B(2.5), 'r11-kaching', .16], [B(5), 'sfx-whoosh', .08], [B(10), 'sfx-whoosh', .14]);
  TRS.forEach((_, i) => C.push([+(B(10.5) + i * .5 * G.p).toFixed(3), 'r11-card', .08]));
  C.push([B(15), 'sfx-chime', .14], [B(15) + .05, 'r11-sparkle', .1], [B(18), 'sfx-whoosh', .14], [B(18) + .15, 'r11-thump', .14]);
};
// live move of round j at film time t (frame-snapped), the whole night between B(-14) and the whistle
const mNow = t => OV.night(OV.fr(t), G.B(-14), TR);
const live = (r, t) => t >= TR ? r.move : r.px(mNow(t));
window.R = t => {
  const B = G.B, p = G.p, T0 = OV.fr(t); grain(t);
  const pgLen = 6 * p, ex = (NPG - 1) * pgLen, TB = B(10) + ex, TL = B(15) + ex, TE = B(18) + ex;
  // the ground: a slow push and drift; floodlights breathe; a gold flare on the whistle
  const g = L.$('#gnd'); g.style.transform = `scale(${(1 + .05 * L.n(t, 0, window.DUR)).toFixed(4)}) translate(${(-8 * Math.sin(t * .4)).toFixed(1)}px,${(-14 * L.n(t, 0, window.DUR)).toFixed(1)}px)`;
  L.$$('#flood > div').forEach((b, i) => { b.style.transform = `rotate(${(-14 + 9 * i + 6 * Math.sin(t * .9 + i * 1.7)).toFixed(2)}deg)`; b.style.opacity = (.55 + .25 * Math.sin(t * 2.3 + i) + .9 * Math.exp(-Math.max(0, t - TR) * 3) * (t >= TR ? 1 : 0)).toFixed(3) });
  // the wipes: four slanted stripes cross the frame at the opening, the title-to-board change, the table and the end card
  const wipes = [0, B(-20) - .18, TB - .18, TE - .18];
  stripes.forEach((s, i) => { let y = -400; for (const w0 of wipes) { const q = L.n(t, w0 + i * .035, w0 + .42 + i * .035); if (q > 0 && q < 1) y = L.lerp(-300, 1700, L.eio(q)) } s.style.top = (y + i * 52) + 'px' });
  // the title
  const ti = L.$('#title'), tin = 1 - .3 * (1 - L.eo5(L.n(t, 0, .45))), tout = L.n(t, B(-20) - .1, B(-20) + .1);
  ti.querySelector('.lg').style.transform = `scale(${(.92 + .08 * L.spring(t, 1.4, 6)).toFixed(4)}) rotate(${(-6 * (1 - L.eo(L.n(t, 0, .6)))).toFixed(2)}deg)`;
  ti.style.opacity = tin * (1 - tout); ti.querySelector('.h').style.transform = `translateX(${(-80 * (1 - tin) + 40 * L.n(t, 0, B(-20))).toFixed(1)}px)`;
  ti.querySelector('.s').style.transform = `translateX(calc(-50% + ${(60 * (1 - L.eo5(L.n(t, 0, .5))) - 30 * L.n(t, 0, B(-20))).toFixed(1)}px))`;
  // the board (fixtures page by page)
  const bon = L.n(t, B(-20) - .05, B(-20) + .1) * (1 - L.n(t, TB - .1, TB + .1));
  L.$('#board').style.opacity = bon;
  const pgAt = t < TR ? Math.min(NPG - 1, Math.max(0, Math.floor((t - B(-20)) / (4 * p * 1.5)))) : Math.min(NPG - 1, Math.max(0, Math.floor((t - B(4)) / pgLen)));
  const hin = L.eo5(L.n(t, B(-20), B(-20) + .3)); L.$('#hd').style.transform = `translateX(${(-1100 * (1 - hin)).toFixed(1)}px)`;
  L.$('#hd .ft').style.opacity = L.n(t, B(2), B(2) + .1); L.$('#hd .ft').style.transform = `scale(${(1 + .3 * (1 - L.eo5(L.n(t, B(2), B(2) + .3)))).toFixed(3)})`;
  const sin = L.eo5(L.n(t, B(-14), B(-14) + .35)); L.$('#strip').style.transform = `translateY(${(200 * (1 - sin)).toFixed(1)}px)`;
  const nOn = Math.min(UPR, D.N), SP = Math.min(290, (1180 - 282) / nOn), FH = Math.min(262, SP - 18);
  const big = D.rounds.reduce((b, r, j) => Math.abs(r.move) > Math.abs(D.rounds[b].move) ? j : b, 0) % UPR;
  const foc = L.eio(L.n(t, B(-10), B(-10) + .3)) * (1 - L.eio(L.n(t, B(-6), B(-6) + .3)));
  FX.forEach((el, j) => { const r = D.rounds[j], pg = Math.floor(j / UPR), slot = j % UPR, t0 = B(-20) + slot * 2 * p;
    const k = L.eo5(L.n(t, t0, t0 + .32)), dir = slot % 2 ? 1 : -1;
    el.style.top = (282 + slot * SP) + 'px'; el.style.height = FH + 'px'; el.style.opacity = (pg === pgAt ? 1 : 0) * (1 - .62 * foc * (slot === big ? 0 : 1)); el.style.transform = `translateX(${(dir * 1100 * (1 - k)).toFixed(1)}px)`;
    const v = live(r, T0), sc = el.querySelector('.sc'); sc.textContent = OV.pct(v); sc.style.color = Math.abs(v) < .005 ? '#f8f0d9' : v > 0 ? OV.G : OV.R;
    const lv = L.n(t, B(-14), B(-14) + .3) * (t < TR ? 1 : 0), ahead = v > 0 ? 'l' : v < 0 ? 'r' : null;
    el.querySelector('.gl-l').style.opacity = ahead === 'l' ? (.55 + .35 * Math.sin(t * 9)) * lv : 0; el.querySelector('.gl-r').style.opacity = ahead === 'r' ? (.55 + .35 * Math.sin(t * 9)) * lv : 0;
    // full time: the paid side lit gold, the other dark; each side's P&L under its marks
    const f = L.n(t, TR + .05 + slot * .12, TR + .3 + slot * .12), w = r.win;
    sc.style.boxShadow = f > 0 ? `inset 0 0 0 ${(2 + 2 * f).toFixed(1)}px rgba(253,188,42,${(.3 + .7 * f).toFixed(2)}),0 0 ${(40 * f * Math.exp(-(t - TR) * 2)).toFixed(1)}px rgba(253,188,42,.8)` : '';
    ['l', 'r'].forEach(s => { const paid = (s === 'l' ? 'LONG' : 'SHORT') === w, sd = el.querySelector('.sd.' + s);
      const wn = el.querySelector('.win.' + s), tg = el.querySelector('.tag.' + s), has = (s === 'l' ? r.longs : r.shorts).length > 0 && !!w;
      wn.style.opacity = has ? f : 0; wn.style.boxShadow = paid ? 'inset 0 0 0 4px #fdbc2a,inset 0 0 60px rgba(253,188,42,.35)' : 'inset 0 0 0 4px #ff3a31,inset 0 0 60px rgba(255,58,49,.25)';
      tg.textContent = paid ? 'RIGHT' : 'WRONG'; tg.style.background = paid ? '#fdbc2a' : '#ff3a31'; tg.style.color = paid ? '#04070e' : '#f8f0d9';
