<!doctype html><meta charset="utf-8"><title>pv1 sealed</title>
<!-- Night prediction film 1, "Sealed" (2026-11-20). One line: five AIs sealed their calls before the report, and the last envelope decides the split.
  A painted walnut desk seen from above (Hedra, w6/nt/pv/pv1-desk.jpg). Five wax-sealed envelopes, one per AI, its mark pressed in the wax.
  The camera pushes onto each envelope, the seal breaks, the letter rises to the lens: the AI, its side and called move ("LONG (+5%)"), its
  confidence, and its own words with the key clause marked. Each letter is filed on the LONG or the SHORT tray; the count builds there.
  The order alternates the sides (the majority opens and closes), so the last envelope settles the split, on the bed's second drop.
  Fraunces (our words, the AI's words) and Geist Mono (numbers). Bed w8f-horns, entered so its drops land on the second envelope and the count.
  ?co=INTU|KEYS|ESTC. window.R(t), READY, DUR, MUSIC, CUES. No outcome anywhere. -->
<style>

  background:#f8f0d9;box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 0 0 2px rgba(4,7,14,.08)}

#card{position:absolute;left:0;top:0;width:880px;z-index:50;transform-origin:0 0;padding:46px 54px 50px;border-radius:8px;color:#04070e;
  box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 0 1px rgba(4,7,14,.12)}

  background:rgba(4,7,14,.82);box-shadow:inset 0 0 0 2px rgba(248,240,217,.14),0 14px 30px rgba(0,0,0,.5)}

#end b{font:700 76px/1 Fraunces;letter-spacing:-.02em;color:#f8f0d9}#end b i{font-style:normal}
#end span{font:500 40px/1 Fraunces;font-style:italic;color:#f8f0d9;opacity:.85}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(75% 62% at 50% 50%,transparent 50%,rgba(0,0,0,.6));z-index:45}
</style>
<div id="cam"><img id="desk" src="w6/nt/pv/pv1-desk.jpg"><div id="envs"></div></div>
<div id="lamp"></div><div id="vig"></div>
<div id="dock"></div>
<div class="tray" id="tL"></div><div class="tray" id="tS"></div>
<div id="card" class="paper"></div>
<div id="big"></div>
<div id="end"></div>
<div id="bugw"></div>
<canvas id="grain"></canvas>
<script src="w6/nt/pv/pv.js"></script>
<script>
const G = PV.grid(174, 0);                     // w8f-horns: 174 BPM, beats from 0 in the file
const B = G.B;
// the film in beats: the opener, five envelopes (the second starts on the bed's first drop), the count on the second drop, the end card
const OPEN = 4, SLOT = [10, 11, 10, 10, 10];
let T = {}, ord, grain, envs = [], cardEls = {};
const POS = [[320, 560, -6], [762, 540, 5], [540, 770, -2], [300, 985, 4], [775, 990, -5]];   // envelope centres on the desk (world px) and turn
const waxPath = (r, seed) => { let d = ''; for (let i = 0; i <= 40; i++) { const a = i / 40 * Math.PI * 2, rr = r * (1 + .06 * Math.sin(a * 5 + seed) + .04 * Math.sin(a * 11 + seed * 2)); d += (i ? 'L' : 'M') + (rr * Math.cos(a)).toFixed(1) + ',' + (rr * Math.sin(a)).toFixed(1) } return d + 'Z' };
(async () => {
  await PV.load('INTU', 'https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500;1,9..144,600&display=swap');
  ord = PV.alt();
  PV.$('#bugw').innerHTML = PV.bug();
  PV.$('#dock').innerHTML = `${PV.coLogo(70)}<span class="nm">${PV.esc(PV.co.co)}</span><span class="wh">${PV.reports}</span>`;
  // the envelopes: cream paper, the flap closed under a wax seal with the AI's mark
  PV.$('#envs').innerHTML = ord.map((x, i) => { const m = PV.D.marks[x.k], [cx, cy, r] = POS[i];
    return `<div class="env" data-i="${i}" style="left:${cx}px;top:${cy}px;transform:rotate(${r}deg)">
      <svg class="body" width="400" height="290" viewBox="0 0 400 290"><defs><linearGradient id="eg${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6ecd2"/><stop offset="1" stop-color="#e7d8b6"/></linearGradient>
        <filter id="pn${i}"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="${i + 3}"/><feColorMatrix values="0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .12 0 0 0 .12 0"/><feComposite in2="SourceGraphic" operator="in"/></filter></defs>
        <rect width="400" height="290" rx="6" fill="url(#eg${i})"/><rect width="400" height="290" rx="6" fill="#000" filter="url(#pn${i})"/>
        <path d="M0 290 L200 130 L400 290" fill="none" stroke="rgba(90,66,40,.25)" stroke-width="2"/>
        <g class="flap"><path d="M0 4 Q0 0 6 0 L394 0 Q400 0 400 4 L200 150 Z" fill="#efe2c3" stroke="rgba(90,66,40,.3)" stroke-width="2"/></g></svg>
      <span class="st">Locked</span><span class="from">${PV.logo(42)}From ${x.name}</span>
      <div class="wax"><svg class="h hl" viewBox="-52 -52 104 104"><defs><radialGradient id="wg${i}" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#ff6a52"/><stop offset=".55" stop-color="#c8261c"/><stop offset="1" stop-color="#7a0f0b"/></radialGradient></defs>
        <g class="L"><path d="${waxPath(46, i)}" fill="url(#wg${i})"/><circle r="31" fill="none" stroke="rgba(60,0,0,.45)" stroke-width="3"/><g transform="translate(-17 -17) scale(1.42)"><path d="${m.d}" fill="rgba(70,4,2,.62)"${m.fr ? ` fill-rule="${m.fr}"` : ''}/></g></g></svg></div></div>` }).join('');
  envs = PV.$$('.env');
  // the wax splits in two: two copies of the seal clipped along a jagged crack
  envs.forEach(e => { const w = e.querySelector('.wax'), s = w.querySelector('svg'); const s2 = s.cloneNode(true); s.classList.add('a'); s2.classList.add('b'); w.appendChild(s2);
    s.style.clipPath = 'polygon(0 0,58% 0,46% 30%,60% 52%,44% 74%,55% 100%,0 100%)'; s2.style.clipPath = 'polygon(58% 0,100% 0,100% 100%,55% 100%,44% 74%,60% 52%,46% 30%)' });
  // the trays where the letters are filed, with the count
  const tray = (id, side) => PV.$(id).innerHTML = `<div class="lb"><b style="color:${side === 'LONG' ? PV.C.green : PV.C.red}">${side}</b><span>0</span></div>`;
  tray('#tL', 'LONG'); tray('#tS', 'SHORT');
  // the mini letters on the trays (one per AI, shown once filed)
  ord.forEach((x, i) => { const el = document.createElement('div'); el.className = 'mini paper'; const sameBefore = ord.slice(0, i).filter(y => y.side === x.side).length;
    el.innerHTML = `<div class="r">${PV.mark(x.k, 44)}${x.name}</div><span class="s" style="background:${PV.side(x)}">${x.side} <span class="nm">(${PV.mv(x)})</span></span>`;
    el.style.left = (14 + sameBefore * 40) + 'px'; el.style.transform = `rotate(${(sameBefore % 2 ? 3 : -3) + sameBefore}deg)`; el.style.opacity = 0;
    (x.side === 'LONG' ? PV.$('#tL') : PV.$('#tS')).insertBefore(el, (x.side === 'LONG' ? PV.$('#tL') : PV.$('#tS')).querySelector('.lb')); cardEls[x.k] = el });
  PV.$('#big').innerHTML = `<div class="ct"><span style="color:${PV.C.green}">${PV.nL}</span><small style="color:${PV.C.green}">LONG</small><i>v</i><span style="color:${PV.C.red}">${PV.nS}</span><small style="color:${PV.C.red}">SHORT</small></div><div class="gr">${PV.graded}</div>`;
  PV.$('#end').innerHTML = `${PV.logo(300)}<b><i style="color:${PV.C.green}">E</i>arnings <i style="color:${PV.C.red}">Z</i>eason</b><span>${PV.graded}</span>`;
  grain = PV.grain(PV.$('#grain'), .06);
  // the timeline in beats
  const starts = []; let b = OPEN; SLOT.forEach(s => { starts.push(b); b += s });
  T = { starts, count: b, end: b + 3, dur: b + 3 + 5 };
  const at = 26.55 - T.count * B;            // the bed enters so its second drop (26.55 s in the file) lands on the count
  window.TL = { starts: starts.map(s => +(s * B).toFixed(3)), count: +(T.count * B).toFixed(3), end: +(T.end * B).toFixed(3), dur: +(T.dur * B).toFixed(3), drop1: +(12.41 - at).toFixed(3), at };
  // the clause in focus on screen, per AI, for the report
  window.HOLD = ord.map((x, i) => ({ k: x.k, clause: x.clause, need: +PV.need(x.clause).toFixed(2), onScreen: +((SLOT[i] - 2.4) * B).toFixed(2) }));
  // the card's content, rebuilt when the speaker changes
  window.CUES = [[0.04, 'r11-swell', .12]];
  ord.forEach((x, i) => { const s = starts[i] * B; CUES.push([s, 'sfx-whoosh', .1], [s + .6 * B, 'sfx-shatter', .07], [s + 1.2 * B, 'r11-slide', .12], [(starts[i] + SLOT[i] - 1) * B, 'r11-card', .1], [(starts[i] + SLOT[i]) * B - .01, 'sfx-stamp', .12]) });
  CUES.push([T.count * B, 'r11-thump', .16], [T.count * B + .02, 'sfx-stamp', .14], [T.end * B, 'sfx-bell', .1]);
  window.MUSIC = { f: 'w8f-horns', at: +at.toFixed(4) }; window.DUR = +(T.dur * B).toFixed(3);
  await PV.ready(['700 60px Fraunces', 'italic 500 70px Fraunces', '800 116px Fraunces', '600 44px "Geist Mono"']);
  await PV.go();
})();
let shown = -1;
const fillCard = i => { if (shown === i) return; shown = i; const x = ord[i];
  PV.$('#card').innerHTML = `<div class="lh">${PV.logo(58)}<span>EARNINGS ZEASON</span></div><div class="hd">${PV.mark(x.k, 84)}<b>${x.name}</b></div><span class="sd" style="background:${PV.side(x)}">${x.side} <span class="nm">(${PV.mv(x)})</span></span>
    <div class="cf">${PV.conf(x)}</div><div class="rl"></div><div class="ow">In its own words</div><div class="cl">${PV.words(x.clause)}</div>` };
window.R = t => {
  grain(t); const k = t / B;
  const cur = T.starts.filter(s => k >= s).length - 1;                    // the envelope in hand (-1 in the opener)
  // the camera: wide over the desk in the opener and the count; pushes onto the envelope in hand; drifts all the time
  const dr = [Math.sin(t * .7) * 22, Math.cos(t * .53) * 16], rot = Math.sin(t * .41) * 1.2;
  let cx = 540, cy = 760, sc = 1, ro = 0;
  if (cur >= 0 && k < T.count) { const s0 = T.starts[cur], [ex, ey, er] = POS[cur], p = PV.eio(PV.n(k, s0, s0 + 1)), q = PV.eio(PV.n(k, s0 + SLOT[cur] - 1.6, s0 + SLOT[cur] - .2));
    const nx = cur + 1 < 5 ? POS[cur + 1] : [540, 780, 0];
    cx = PV.lerp(PV.lerp(540, ex, p), PV.lerp(540, nx[0], .25), q); cy = PV.lerp(PV.lerp(760, ey, p), 760, q); sc = PV.lerp(PV.lerp(1, 1.55, p), 1.08, q); ro = PV.lerp(-er * .6 * p, 0, q) }
  else if (k >= T.count) { const p = PV.eo(PV.n(k, T.count, T.count + 1.5)); sc = 1.18 - .12 * p; cy = 820 }
  else { const p = PV.eo(PV.n(k, 0, OPEN)); sc = 1.3 - .3 * p }
  const punch = d => { const x = k - d; return x < 0 ? 0 : .03 * Math.exp(-4 * x) };
  sc += punch(T.starts[1]) + punch(T.count);
  PV.$('#cam').style.transform = `translate(${(540 - cx + dr[0]).toFixed(1)}px,${(675 - cy + dr[1] - 45).toFixed(1)}px) rotate(${(ro + rot).toFixed(2)}deg) scale(${sc.toFixed(4)})`;
  PV.$('#cam').style.transformOrigin = `${cx}px ${cy}px`;
  // the lamp breathes on the beat
  const ph = k % 1; PV.$('#lamp').style.background = `radial-gradient(55% 40% at ${50 + 6 * Math.sin(t * .6)}% 28%,rgba(253,188,42,${(.38 + .22 * Math.exp(-5 * ph)).toFixed(3)}),transparent 70%)`;
  // the envelopes: dealt onto the desk in the opener, one a beat; the one in hand opens; the opened ones are gone (filed)
  envs.forEach((e, i) => { const a = PV.n(k, i * .5 - 1, i * .5 - .1), d = PV.eo5(a); const s0 = T.starts[i];
    const opened = k >= s0 + 1.1; e.style.opacity = k < s0 + 1.6 ? PV.cl(a * 3).toFixed(3) : (1 - PV.n(k, s0 + 1.6, s0 + 2.2)).toFixed(3);
    e.style.transform = `translate(${(0).toFixed(1)}px,${(-520 * (1 - d)).toFixed(1)}px) rotate(${(POS[i][2] - 14 * (1 - d)).toFixed(2)}deg)`;
    const f = PV.n(k, s0 + .7, s0 + 1.3); e.querySelector('.flap').style.transform = `translate(0,0) scale(1,${(1 - 2 * PV.eio(f)).toFixed(3)})`; e.querySelector('.flap').style.transformOrigin = '200px 0px';
    const w = PV.n(k, s0 + .35, s0 + 1.2), wa = e.querySelector('.a'), wb = e.querySelector('.b');
    wa.style.transform = `translate(${(-30 * PV.eo(w)).toFixed(1)}px,${(40 * w * w).toFixed(1)}px) rotate(${(-25 * w).toFixed(1)}deg)`; wb.style.transform = `translate(${(30 * PV.eo(w)).toFixed(1)}px,${(46 * w * w).toFixed(1)}px) rotate(${(22 * w).toFixed(1)}deg)`;
    e.querySelector('.wax').style.opacity = (1 - PV.n(k, s0 + .9, s0 + 1.3)).toFixed(3);
    // the seal throbs on the beat before it breaks
    const nod = k < s0 + .35 && k > s0 - 1 ? .06 * Math.exp(-6 * (k % 1)) : 0; e.querySelector('.wax').style.scale = (1 + nod).toFixed(3) });
  // the letter: rises from the envelope to the lens, held, then filed on its tray (a layout zoom, so the type stays crisp)
  const card = PV.$('#card');
  if (cur >= 0 && k < T.count + .01) { fillCard(cur); const s0 = T.starts[cur], sl = SLOT[cur], x = ord[cur];
    const up = PV.spring(PV.n(k, s0 + 1.1, s0 + 9) * (sl - 1.1) * B * 1.2, 1.25, 6.5), out = PV.eio(PV.n(k, s0 + sl - 1, s0 + sl));
    const tray = (x.side === 'LONG' ? PV.$('#tL') : PV.$('#tS')).getBoundingClientRect();
    const z = PV.lerp(PV.lerp(.34, 1, up), .3, out); card.style.zoom = z.toFixed(4);
    const W = 880 * z, H = card.offsetHeight * z;
    const fx = PV.lerp(PV.lerp(540, 540, up), tray.left + tray.width / 2, out), fy = PV.lerp(PV.lerp(900, 700, up), tray.top + 70, out);
    const sway = Math.sin(t * 1.3) * 1.4 * (1 - out);
    card.style.left = ((fx - W / 2) / z).toFixed(2) + 'px'; card.style.top = ((fy - H / 2) / z).toFixed(2) + 'px';
    card.style.transform = `rotate(${(PV.lerp(-6, 0, up) + sway + (x.side === 'LONG' ? -8 : 8) * out).toFixed(2)}deg)`;
    card.style.opacity = (PV.n(k, s0 + 1.05, s0 + 1.35) * (1 - PV.n(k, s0 + sl - .22, s0 + sl))).toFixed(3);
    PV.sweep(card.querySelector('.hlc') || card.querySelector('.cl'), PV.eio(PV.n(k, s0 + 3, s0 + 5.5)));
    const sd = card.querySelector('.sd'), sp = PV.n(k, s0 + 2, s0 + 2.6); sd.style.transform = `scale(${PV.lerp(1.5, 1, PV.eo5(sp)).toFixed(3)}) rotate(${PV.lerp(-6, -1.5, sp).toFixed(2)}deg)`; sd.style.opacity = sp > 0 ? 1 : 0;
    card.querySelector('.cf').style.opacity = PV.n(k, s0 + 2.4, s0 + 3).toFixed(3);
  } else card.style.opacity = 0;
  // the trays: each letter lands, the count steps
  let nl = 0, ns = 0, lastL = -9, lastS = -9;
  ord.forEach((x, i) => { const land = T.starts[i] + SLOT[i], el = cardEls[x.k], a = PV.n(k, land, land + .4);
    el.style.opacity = a > 0 ? 1 : 0; el.style.translate = `0 ${(-30 * (1 - PV.eo(a))).toFixed(1)}px`;
    if (k >= land) { if (x.side === 'LONG') { nl++; lastL = land } else { ns++; lastS = land } } });
  const bump = (el, v, tl) => { el.textContent = v; const q = PV.n(k, tl, tl + .8); el.style.transform = `scale(${(1 + .45 * Math.sin(Math.PI * q)).toFixed(3)})` };
  bump(PV.$('#tL .lb span'), nl, lastL); bump(PV.$('#tS .lb span'), ns, lastS);
  // the count: stamped over the desk on the drop, then the grading line
  const big = PV.$('#big'), c = PV.n(k, T.count, T.count + .5), cg = PV.n(k, T.count + 1, T.count + 1.6), ce = PV.n(k, T.end, T.end + .6);
  big.style.opacity = (c > 0 ? 1 : 0) * (1 - ce); big.querySelector('.ct').style.transform = `scale(${PV.lerp(1.6, 1, PV.eo5(c)).toFixed(3)}) rotate(${PV.lerp(-8, -2, c).toFixed(2)}deg)`;
  big.querySelector('.gr').style.opacity = cg.toFixed(3); big.querySelector('.gr').style.transform = `translateY(${(30 * (1 - PV.eo(cg))).toFixed(1)}px)`;
  // the end card
  const en = PV.$('#end'); en.style.opacity = ce.toFixed(3); en.querySelector('img').style.transform = `scale(${(1.12 - .12 * PV.eo(ce) + .015 * Math.sin(t * 2)).toFixed(3)}) rotate(${(2 * Math.sin(t * .9)).toFixed(2)}deg)`;
  PV.$('#dock').style.opacity = (1 - ce).toFixed(3); PV.$$('.tray').forEach(e => e.style.opacity = (1 - ce).toFixed(3));
  PV.$('#dock').style.transform = `translateX(${(60 * (1 - PV.eo(PV.n(k, -.6, 1.4)))).toFixed(1)}px)`;
};
</script>
