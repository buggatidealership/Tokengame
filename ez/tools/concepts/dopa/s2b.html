<!-- Season 2 launch video, mockup B "Official" (owner, 2026-11-18: Season 2 has five models, Gemini and Qwen join, Kimi is out; every
  call comes with its reasoning; "we change the style a little bit"). The form X knows from transfer announcements: one squad notice a
  scene, a small tag, the mark large, one line. The changed style: the brand's cream ground with ink type (every Season 1 video was black),
  one accent colour a card. Bound by WRAP-BRIEF.md round 3b: P1 two related data points a scene, P2 at most 12 words, P3 centred content
  35 to 70% of the height, P5 one transition a scene change and a slow drift while it holds. No glass (that is mockup A's).
  Nothing invented: no versions for the new models, no reasoning text (the reasons are blurred bars), no numbers, no date.
  Marks: models.json for the four of Season 1; Gemini (Simple Icons, CC0) and Qwen (LobeHub icons, MIT) are the one-colour marks the
  site's tryouts ticket already prints (tools/v22/x2plus.js C5), set white on black like GPT's and Grok's tiles.
  Bed s2-b (Hedra elevenlabs-music, $0.60): 120.0 BPM, beats 10 to 15 ms before the half-second grid, strong hits on whole seconds, the
  groove runs to 20.5 s and rings out by 22 s (both measured); every cut sits on a beat.
  window.R(t), READY, CUES, MUSIC, DUR as the other pages. bash wrapx.sh s2b.html 22 x2p-s2-intro-b-draft s2-b 0 .3 -->

<body><div id="cam"></div>

<script>
const NEW = {"GEMINI": {"bg": "#000", "fg": "#fff", "d": "M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81", "app": "Gemini", "lab": "GOOGLE"}, "QWEN": {"bg": "#000", "fg": "#fff", "d": "M12.604 1.34c.393.69.784 1.382 1.174 2.075a.18.18 0 00.157.091h5.552c.174 0 .322.11.446.327l1.454 2.57c.19.337.24.478.024.837-.26.43-.513.864-.76 1.3l-.367.658c-.106.196-.223.28-.04.512l2.652 4.637c.172.301.111.494-.043.77-.437.785-.882 1.564-1.335 2.34-.159.272-.352.375-.68.37-.777-.016-1.552-.01-2.327.016a.099.099 0 00-.081.05 575.097 575.097 0 01-2.705 4.74c-.169.293-.38.363-.725.364-.997.003-2.002.004-3.017.002a.537.537 0 01-.465-.271l-1.335-2.323a.09.09 0 00-.083-.049H4.982c-.285.03-.553-.001-.805-.092l-1.603-2.77a.543.543 0 01-.002-.54l1.207-2.12a.198.198 0 000-.197 550.951 550.951 0 01-1.875-3.272l-.79-1.395c-.16-.31-.173-.496.095-.965.465-.813.927-1.625 1.387-2.436.132-.234.304-.334.584-.335a338.3 338.3 0 012.589-.001.124.124 0 00.107-.063l2.806-4.895a.488.488 0 01.422-.246c.524-.001 1.053 0 1.583-.006L11.704 1c.341-.003.724.032.9.34zm-3.432.403a.06.06 0 00-.052.03L6.254 6.788a.157.157 0 01-.135.078H3.253c-.056 0-.07.025-.041.074l5.81 10.156c.025.042.013.062-.034.063l-2.795.015a.218.218 0 00-.2.116l-1.32 2.31c-.044.078-.021.118.068.118l5.716.008c.046 0 .08.02.104.061l1.403 2.454c.046.081.092.082.139 0l5.006-8.76.783-1.382a.055.055 0 01.096 0l1.424 2.53a.122.122 0 00.107.062l2.763-.02a.04.04 0 00.035-.02.041.041 0 000-.04l-2.9-5.086a.108.108 0 010-.113l.293-.507 1.12-1.977c.024-.041.012-.062-.035-.062H9.2c-.059 0-.073-.026-.043-.077l1.434-2.505a.107.107 0 000-.114L9.225 1.774a.06.06 0 00-.053-.031zm6.29 8.02c.046 0 .058.02.034.06l-.832 1.465-2.613 4.585a.056.056 0 01-.05.029.058.058 0 01-.05-.029L8.498 9.841c-.02-.034-.01-.052.028-.054l.216-.01 const cam = L.$('#cam'), S = {}, C = [], DUR = 22;
// the cuts, on the bed's beats (120 BPM)
const T = { a: 0, gem: 2.5, qw: 5, kimi: 7.5, squad: 10, rule: 14, why: 15, end: 20 };
const mk = (k, s) => { const m = L.models[k]; return `<svg class="mk" width="${s}" height="${s}" viewBox="-4 -4 32 32" style="border-radius:${s * .26}px;background:${m.bg};box-shadow:0 0 0 ${Math.max(2, s * .012)}px rgba(14,12,11,.16)"><path d="${m.d}" fill="${m.fg}"${m.fr ? ` fill-rule="${m.fr}" clip-rule="${m.fr}"` : ''}/>${m.dot ? `<path d="${m.dot}" fill="${m.dotc}"/>` : ''}</svg>` };
const add = (h, p = cam) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };
const sc = (id, t0, t1) => { const el = add(`<div class="sc" id="${id}"><div class="g"></div></div>`); const s = { el, g: el.firstElementChild, t0, t1 }; (S.sc = S.sc || []).push(s); return s };
const fitF = (el, maxW) => { const k = Math.min(1, maxW / el.offsetWidth); return k };
function build() {
  add(`<img id="bug" src="ezlogo.svg" alt="">`);
  // 1 and 7, the bookends
  const book = (id, t0, t1, line) => { const s = sc(id, t0, t1); s.lg = add(`<img class="lg" src="ezlogo.svg" alt="">`, s.g); s.h = add(`<div class="h1"><span>Season 2.</span></div>`, s.g); s.gb = add(`<div class="gb"><span>${line}</span></div>`, s.g); return s };
  S.s1 = book('s1', T.a, T.gem, 'Squad news.'); S.s7 = book('s7', T.end, DUR + 1, 'Soon.');
  // 2 to 4, the notices: one template
  const note = (id, t0, t1, tag, k, line, lab, col) => { const s = sc(id, t0, t1); add(`<div class="tag">${tag}</div>`, s.g); s.pan = add(`<div class="pan" style="background:${col}"><div class="mkw">${mk(k, 320)}</div></div>`, s.g);
    s.mkw = s.pan.firstElementChild; s.hd = add(`<div class="hd"><span>${line}</span></div>`, s.g); s.lab = add(`<div class="lab">${lab}</div>`, s.g); return s };
  S.s2 = note('s2', T.gem, T.qw, 'OFFICIAL', 'GEMINI', 'Gemini joins.', 'GOOGLE', '#55d6a2');
  S.s3 = note('s3', T.qw, T.kimi, 'OFFICIAL', 'QWEN', 'Qwen joins.', 'ALIBABA', '#55d6a2');
  S.s4 = note('s4', T.kimi, T.squad, 'OUT', 'KIMI', 'Kimi. Relegated.', 'MOONSHOT AI', '#e8576b');
  // 5 the squad
  { const s = S.s5 = sc('s5', T.squad, T.rule); s.h = add(`<div class="h1"><span>Five AIs.</span></div>`, s.g); s.sub = add(`<div class="sub"><span>Every earnings report.</span></div>`, s.g);
    s.row = add(`<div class="row">${['GROK', 'CLAUDE', 'GPT', 'GEMINI', 'QWEN'].map((k, i) => `<div class="m" style="left:${33 + i * 188}px">${mk(k, 150)}${L.models[k].app === 'ChatGPT' ? 'GPT' : L.models[k].app}${NEW[k] ? '<div class="nw">NEW</div>' : ''}</div>`).join('')}</div>`, s.g); s.nw = L.$$('.nw', s.row) }
  // 6 the new rule
  { const s = S.s6 = sc('s6', T.rule, T.end); add(`<div class="tag" style="top:256px">NEW RULE</div>`, s.g); s.hd = add(`<div class="hd"><span>Show your work.</span></div>`, s.g);
    s.card = add(`<div class="card"><div class="chip">LONG</div>${[[208, 872], [262, 770], [316, 540]].map(([y, w]) => `<div class="bar" style="top:${y}px;width:${w}px"></div>`).join('')}</div>`, s.g); s.bars = L.$$('.bar', s.card);
    s.ln = add(`<div class="ln"><span>Every call comes with its reasons.</span></div>`, s.g) }
  // sound: one thump a cut, a stamp where Kimi drops, a ping for NEW, a chime for the reasons, the last hit
  [T.gem, T.qw, T.kimi, T.squad, T.rule].forEach(t => C.push([t, 'r11-thump', .16])); C.push([T.kimi + 1, 'sfx-stamp', .2], [T.squad + 1.5, 'r11-ping', .1], [T.why, 'sfx-chime', .13], [T.end, 'sfx-boom', .2]);
  window.MUSIC = { f: 's2-b', at: 0 };
}
function fitAll() {
  S.sc.forEach(s => s.el.style.display = 'block');

  const kN = Math.min(...[S.s2, S.s3, S.s4].map(s => fitF(s.hd.firstElementChild, 968))); [S.s2, S.s3, S.s4].forEach(s => s.hd.style.fontSize = 150 * kN + 'px');
  // the bookends: each fitted to the frame's width on its longer line, then the block (logo, line, gold line) centred on the frame
  [S.s1, S.s7].forEach(s => { const k = Math.min(1.3, fitF(s.h.firstElementChild, 968), fitF(s.gb, 968)), f = 200 * k, bh = 236 * k, H = 150 + 40 + f + 34 + bh, y0 = 675 - H / 2, g = s.gb.firstElementChild;
    s.lg.style.top = y0 + 'px'; s.h.style.top = y0 + 190 + 'px'; s.h.style.fontSize = f + 'px'; g.style.fontSize = f + 'px'; g.style.lineHeight = bh + 'px'; s.gb.style.height = bh + 'px'; s.gb.style.top = y0 + 190 + f + 34 + 'px' });
  S.s5.h.style.fontSize = 176 * fitF(S.s5.h.firstElementChild, 968) + 'px'; S.s5.sub.style.fontSize = 76 * fitF(S.s5.sub.firstElementChild, 960) + 'px';
  S.s6.hd.style.fontSize = 150 * fitF(S.s6.hd.firstElementChild, 968) + 'px'; S.s6.ln.style.fontSize = 56 * fitF(S.s6.ln.firstElementChild, 960) + 'px';

// an element that rises into place
const rise = (el, dt, a = .06, d = .34, dy = 44) => { const k = L.eo5(L.n(dt, a, a + d)); el.style.opacity = L.n(dt, a, a + .12); el.style.transform = `translateY(${(1 - k) * dy}px)` };
// a block that wipes in from the left
const wipe = (el, dt, a = 0, d = .32, r = 44) => { const k = L.eo5(L.n(dt, a, a + d)); el.style.clipPath = `inset(0 ${(100 * (1 - k)).toFixed(2)}% 0 0 round ${r}px)` };
function R(t) {

  S.sc.forEach((s, i) => { const on = t >= s.t0 && t < s.t1; s.el.style.display = on ? 'block' : 'none'; if (!on) return; const dt = t - s.t0, h = L.n(t, s.t0, Math.min(s.t1, DUR));
    // the hold: a slow push and a slow slide, the other way on every other card

  { const s = S.s1, dt = t - s.t0; if (dt >= 0 && t < s.t1) { wipe(s.gb, dt, .22, .34, 30) } }

    if (s === S.s4) { const x = dt - 1, k = x <= 0 ? 0 : L.spring(x, 1.6, 8); s.mkw.style.transform = `translateY(${k * 54}px) rotate(${-7 * k}deg)`; s.mkw.style.opacity = 1 - .45 * L.n(x, 0, .3) } });
  { const s = S.s5, dt = t - s.t0; if (dt >= 0 && t < s.t1) { rise(s.h, dt, 0, .3); s.sub.style.opacity = L.n(dt, .1, .3); wipe(s.row, dt, .08, .4);
      const x = dt - 1.5, k = x <= 0 ? 0 : L.spring(x, 2.2, 8); s.nw.forEach(n => { n.style.opacity = L.n(x, 0, .06); n.style.transform = `scale(${1.6 - .6 * k})` }) } }
  { const s = S.s6, dt = t - s.t0; if (dt >= 0 && t < s.t1) { rise(s.hd, dt); wipe(s.card, dt, .08, .36); const x = t - T.why;
      s.bars.forEach((b, j) => { const k = L.eo(L.n(x, j * .16, .5 + j * .16)); b.style.transform = `scaleX(${k})`; b.style.opacity = k ? .9 : 0 }); rise(s.ln, x, .1, .34, 30) } }
  { const s = S.s7, dt = t - s.t0; if (dt >= 0) { rise(s.h, dt, 0, .3, 50); wipe(s.gb, dt, .2, .34, 30) } }
}
window.R = R;
(async () => {
  L.$('#base').textContent = L.css; L.models = Object.assign(await fetch('models.json').then(r => r.json()), NEW); build();
