<!doctype html><meta charset="utf-8"><title>Round prediction</title>
<!-- The prediction video for a round with its calls in (owner, 2026-11-13: "the prediction videos... in line with the style that the
  outcome videos have... 5 different mock-ups... in different gradings"). predict.html?r=<round>&v=1..5 reads data/c<round>.json
  (prep-calls.js, the sheet only; the run-in is Hyperliquid's real path). A ladder from calm to intense, same tokens and rows as outcome.html:
  1 slate    6 s  a loop: the split and the four calls, one row lit at a time (frame 0 already says everything)
  2 roll     9 s  LONG or SHORT? each AI files into its column, the tally counts
  3 chart   10 s  the stock's real run into the report, a wall at EARNINGS, each call projected into the unknown
  4 stake   11 s  the face-off, then what a close up or down pays each AI ($100K flat: side x move)
  5 trailer 14 s  chart, calls, face-off on the drop, the stake, the cliffhanger
  No result, no "locked N minutes before": the sheet has no posting time. -->

/* ---------- 1 slate ---------- */
let s1 = {}; const mk1 = () => { s1.vs = add(`<div class="big" style="top:420px">${splitHtml()}</div>`); mkRows(); s1.end = add(`<div class="gold" style="top:1112px">${closeTxt()}<small>$100K EACH · P&amp;L TRACKED IN PUBLIC</small></div>`);

  rows.forEach((el, i) => { const p = pulse(t, .6 + i * 1.15) * w; rowAt(el, 610 + i * 108, 1, p, D.ai[i], 1 + .018 * p) });
  const pl = D.ai.reduce((s, a, i) => s + (sgn(a) > 0 ? pulse(t, .6 + i * 1.15) : 0), 0) * w, ps = D.ai.reduce((s, a, i) => s + (sgn(a) < 0 ? pulse(t, .6 + i * 1.15) : 0), 0) * w;
  const u = s1.vs.querySelector('.up'), d = s1.vs.querySelector('.dn'); if (u) { u.style.transform = `scale(${1 + .05 * pl})`; u.style.textShadow = `0 0 ${40 * pl}px rgba(${UP},.6)` } if (d) { d.style.transform = `scale(${1 + .05 * ps})`; d.style.textShadow = `0 0 ${40 * ps}px rgba(${DN},.6)` }

  s2.cd = D.ai.map(a => add(`<div class="cd"><div class="bg"></div><span class="mw"></span><span class="nm">${a.name}</span><span class="cl" style="color:${col(a)}">${callTxt(a)}</span></div>`));
  s2.vs = add(`<div class="big" style="top:1004px;font-size:96px">${splitHtml()}</div>`); s2.end = add(`<div class="gold" style="top:1136px">${closeTxt()}<small>$100K EACH · P&amp;L TRACKED IN PUBLIC</small></div>`);
  L.$('#csub').textContent = 'EARNINGS · ' + (D.report || 'THIS WEEK');
  s2.T = FILE.map((_, j) => 2.5 + j * .9); s2.tEnd = s2.T.at(-1) + .9;
  C.push([.05, 'r11-swell', .1], [1.25, 'sfx-whoosh', .12]); s2.T.forEach(tt => C.push([tt + .42, 'r11-card', .16], [tt + .45, 'sfx-tick', .1])); C.push([s2.tEnd, 'r11-thump', .2], [s2.tEnd + .8, 'sfx-chime', .14]); window.MUSIC = { f: 'i2-lofi', at: 2 } };

    const land = j >= 0 && t >= tt + .42; if (land) sgn(a) > 0 ? nl++ : ns++; const pu = j < 0 ? 0 : pulse(t, tt + .42, 2.2); if (sgn(a) > 0) pL += pu; else pS += pu;
    const w = L.lerp(232, 472, f), h = L.lerp(250, 128, f), arc = -70 * Math.sin(Math.PI * f); el.style.width = w + 'px'; el.style.height = h + 'px';

    const inn = L.eio(L.n(t, .12 + i * .14, .62 + i * .14)); const wait = inn * (j < 0 ? 1 : 1 - .35 * L.n(t, 2.0, 2.4) * (1 - L.n(t, tt - .1, tt + .1)));

  ch.groups = []; FILE.forEach((i, j) => { const a = D.ai[i], c = sgn(a) * a.size, tp = o.tP + j * o.dP; let g = ch.groups.find(q => q.c === c); if (!g) { g = { c, t0: tp, m: [] }; ch.groups.push(g) } g.m.push({ i, tp }) });

const doChart = (t) => { const o = ch, on = L.eo(L.n(t, o.tIn, o.tIn + .5)) * (o.tOut ? 1 - L.eio(L.n(t, o.tOut, o.tOut + .45)) : 1), X = o.X, Y = o.Y;
