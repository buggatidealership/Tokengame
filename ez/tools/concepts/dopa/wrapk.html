<!doctype html><meta charset="utf-8"><title>Season 1, the keynote (glass)</title>
<!-- Take K of the Season 1 conclusion, round 3 (WRAP-BRIEF.md "Round 3" and "Round 3b", owner 2026-11-18): the polished, glassy one.
  One sheet of glass over a slow field of brand-colour light; sixteen scenes, each with at most two related data points at full
  contrast (P1), at most 12 words and 3 type sizes (P2), centred and filling 35 to 70% of the height (P3), calm motion (P5).
  It ends on the winner, on the bed's drop at 48.0 s, then one small line: "Season 2 soon." No Season 2 card, no replacement named.
  Reads data/wrap.json (node prep-wrap.js); nothing is typed here; every line of the copy deck is printed only while the data makes
  it true. While D.final is false: a DRAFT tag, "P&L after N of M rounds", "leads" for "wins". ?final=1 forces the final labels.
  The bed s1-k is exactly 120 BPM from 0.007 s: its beat enters at 8.0 s (the tease), it drops out at 47 s and drops at 48.0 s.
  The round-2 cut (zoom-through keynote with a recap grid and a Season 2 card) is git fb6654d6 and ez/x2p-s1-wrap-k-draft.mp4.
  window.R(t), READY, CUES, MUSIC, DUR as the other pages. Render: bash wrapx.sh wrapk.html 54 x2p-s1-wrap-k2-draft s1-k 0 .3 -->
<style id="base"></style>

<script>
const q = new URLSearchParams(location.search), G = '#55d6a2', Rd = '#e8576b', Au = '#fdbc2a', Cr = '#f2ede6';
const stage = L.$('#stage'), add = (h, p = stage) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };
let D, DUR, S = {}, C = [], grain, t = 0; const SH = [];
const money0 = v => (v < 0 ? '−' : '+') + '$' + Math.abs(Math.round(v)).toLocaleString('en-US'), moneyK = v => (v < 0 ? '−' : '+') + '$' + Math.round(Math.abs(v) / 1000) + 'K', pct = (v, d = 2) => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(d) + '%', col = v => v >= 0 ? G : Rd;
// calm arrivals: half a second or less, on an ease or a spring
const e = (el, t0, d = .45, dy = 30) => { const k = L.eo5(L.n(t, t0, t0 + d)); el.style.opacity = L.n(t, t0, t0 + d * .6); el.style.transform = `translateY(${(1 - k) * dy}px)`; return k };
const pop = (el, t0, s0 = .8, f = 1.8, dm = 9) => { const x = t - t0; el.style.opacity = L.n(x, 0, .12); el.style.transform = `scale(${x <= 0 ? s0 : s0 + (1 - s0) * L.spring(x, f, dm)})` };
const and = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a.at(-1), ord = n => n === 1 ? '' : (['', '', '2ND', '3RD'][n] || n + 'TH') + ' ';
// the cut, in seconds; the bed is 120 BPM from 0.007 s, so every time is on a half-second beat. The winner lands on its drop (48.0).
const T = [0, 2, 5, 8, 11.5, 15.5, 19.5, 23.5, 27.5, 31.5, 36, 40, 42, 44, 46, 48, 54];
// a scene: its content, and the light behind the glass [green, red, gold] (the light says which way the number went)
const scene = (i, fx, html) => { const el = add(`<div class="shot"><div class="blk">${html}</div></div>`), s = { i, t0: T[i], t1: T[i + 1], fx, el, blk: el.firstChild, fn: () => 0, fit: [] }; SH.push(s); return s };

function build() {
  if (q.get('final')) D.final = true;
  const A = k => D.ai.find(a => a.k === k), n = D.rounds, tot = D.total, mk = D.mkt, nm = mk.up + mk.down, first = D.ai[0], last = D.ai.at(-1); DUR = T.at(-1);
  add(`<img id="bug" src="ezlogo.svg" alt="">`, document.body); if (!D.final) add(`<div id="dr">DRAFT · ${n} OF ${tot}</div>`, document.body);

  // 1 the cast: [4]
  { const s = scene(0, [.5, .45, .35], `<div class="big" style="font-size:330px">${D.ai.length} AIs.</div><div class="ms">${D.ai.map(a => `<div class="m">${L.mark(a.k, 150)}<span>${a.name}</span></div>`).join('')}</div>`), b = s.blk.firstChild, ms = L.$$('.m', s.el);
    s.fit = [[[b], 800, 330]]; C.push([.05, 'r11-swell', .08]);
    s.fn = () => { pop(b, .05, .9, 1.5, 8); ms.forEach((m, j) => e(m, .35 + j * .12, .4, 24)) } }
  // 2 the job: [112], the stake as its label (the hook is complete here, before 3.0 s)
  { const s = scene(1, [.5, .4, .4], `<div class="big" style="font-size:420px">0</div><div class="ln" style="margin-top:6px">earnings reports.</div><div class="lb" style="margin-top:40px">$100K ON EVERY TRADE</div>`), [b, l, lb] = s.blk.children;
    s.fit = [[[l], 820, 110]]; s.fn = () => { b.textContent = Math.round(tot * L.eo(L.n(t, s.t0, s.t0 + .7))); e(l, s.t0 + .15); e(lb, s.t0 + .55, .4, 14) } }
  // 3 the stake: [$100K]
  { const s = scene(2, [.3, .25, .8], `<div class="big" style="color:${Au}">$100K</div><div class="ln" style="margin-top:44px">on every trade.</div><div class="lb" style="margin-top:44px;letter-spacing:.08em;padding-left:.08em">LONG OR SHORT · SIMULATED · NOT ADVICE</div>`), [b, l, lb] = s.blk.children;
    s.fit = [[[b], 800, 320], [[l], 820, 120]]; s.fn = () => { pop(b, s.t0 + .05, .9, 1.5, 8); e(l, s.t0 + .3); e(lb, s.t0 + .8, .4, 14) } }
  // 4 the tease, where the bed's beat enters: [first P&L, last P&L] (only while the first is up and the last is down)
  { const two = first.pnl > 0 && last.pnl < 0, s = scene(3, [.7, .7, .15], `<div class="ln">${two ? 'One made' : 'First place:'}</div><div class="big" style="color:${col(first.pnl)}">${moneyK(first.pnl)}</div><div class="ln" style="margin-top:30px">${two ? 'One lost' : 'Last place:'}</div><div class="big" style="color:${col(last.pnl)}">${moneyK(last.pnl)}</div>`), [l1, b1, l2, b2] = s.blk.children;
    if (two) { b1.textContent = '$' + Math.round(first.pnl / 1000) + 'K.'; b2.textContent = '$' + Math.round(-last.pnl / 1000) + 'K.' }
    s.fit = [[[b1, b2], 780, 240], [[l1, l2], 820, 84]]; C.push([s.t0, 'r11-thump', .1], [s.t0 + 1, 'r11-thump', .1]);
    s.fn = () => { e(l1, s.t0 + .02, .4); pop(b1, s.t0 + .1, .88, 1.6, 8); e(l2, s.t0 + 1, .4); pop(b2, s.t0 + 1.08, .88, 1.6, 8) } }
  // 5 and 6 the two big rounds where one AI stood out: [the move, the verdict]
  { const lone = D.big.filter(x => x.right.length === 1 || x.wrong.length === 1), pick = [...lone, ...D.big.filter(x => !lone.includes(x))].slice(0, 2);
    pick.forEach((x, j) => { const c = col(x.move), r1 = x.right.length === 1, w1 = x.wrong.length === 1, who = r1 ? A(x.right[0]) : w1 ? A(x.wrong[0]) : null;
      const v = r1 ? `Only ${who.name} was ${x.side[who.k] === 'LONG' ? 'long' : 'short'}.` : w1 ? `Only ${who.name} missed.` : !x.right.length ? 'All four got it wrong.' : `${and(D.ai.filter(a => x.right.includes(a.k)).map(a => a.name))} called it.`;
      const s = scene(4 + j, x.move < 0 ? [.15, .85, .1] : [.85, .15, .1], `<div class="lb">THE ${ord(D.big.indexOf(x) + 1)}BIGGEST MOVE</div><div class="co ln" style="margin-top:30px">${x.logo ? `<img src="${x.logo}" class="${x.dark ? 'dk' : ''}">` : ''}<span>${x.co}</span></div><div class="big" style="color:${c};margin-top:8px">${pct(x.move)}</div><div class="who ln" style="margin-top:26px">${who ? L.mark(who.k, 84) : ''}<span>${v}</span></div>`), [lb, co, b, vd] = s.blk.children;
      s.fx2 = r1 ? [.8, .25, .15] : s.fx; s.fit = [[[b], 820, 300], [[co.lastChild, vd.lastChild], 700, 88]]; C.push([s.t0 + 1, 'r11-card', .08]);
      s.fn = () => { e(lb, s.t0 + .05, .4, 14); e(co, s.t0 + .05); b.textContent = pct(x.move * L.eo(L.n(t, s.t0 + .1, s.t0 + .6))); b.style.opacity = L.n(t, s.t0, s.t0 + .25); e(vd, s.t0 + 1) } }) }
  // 7 the season's tilt: [how many fell, of how many]
  { const dn = mk.down >= mk.up, s = scene(6, dn ? [.1, .9, .1] : [.9, .1, .1], `<div class="big" style="font-size:360px;color:${dn ? Rd : G}">0</div><div class="ln">of ${nm} stocks</div><div class="ln"><span style="color:${dn ? Rd : G}">${dn ? 'fell' : 'rose'}</span> on earnings.</div>`), [b, l1, l2] = s.blk.children;
    s.fit = [[[l1, l2], 820, 120]]; s.fn = () => { b.textContent = Math.round((dn ? mk.down : mk.up) * L.eo(L.n(t, s.t0 + .05, s.t0 + .8))); e(l1, s.t0 + .2); e(l2, s.t0 + .45) } }
  // 8 the plain strategy: [what it made, whether any AI beat it]
  { const sh = mk.short >= mk.long, v = sh ? mk.short : mk.long, beat = v > first.pnl, s = scene(7, [.85, .1, .35], `<div class="ln">${sh ? 'Short' : 'Long'}</div><div class="ln">everything:</div><div class="big" style="color:${col(v)};margin-top:16px">${money0(v)}</div><div class="ln" style="color:${Au};margin-top:30px">${beat ? 'No AI beat that.' : first.name + ' beat it.'}</div><div class="lb" style="margin-top:40px">$100K ${sh ? 'SHORT' : 'LONG'}, EVERY REPORT</div>`), [l1, l2, b, l3, lb] = s.blk.children;
    s.fit = [[[b], 820, 220], [[l1, l2, l3], 800, 112]]; C.push([s.t0 + 1.5, 'r11-card', .08]);
    s.fn = () => { e(l1, s.t0 + .05); e(l2, s.t0 + .12); b.textContent = money0(Math.round(v * L.eo5(L.n(t, s.t0 + .2, s.t0 + 1)) / 10) * 10); b.style.opacity = L.n(t, s.t0 + .15, s.t0 + .4); e(lb, s.t0 + .7, .4, 14); e(l3, s.t0 + 1.5) } }
  // 9 the winner's lean: [its shorts, its calls]
  { const bear = first.lean === 'BEAR', k = bear ? first.shorts : first.longs, s = scene(8, bear ? [.5, .6, .2] : [.6, .5, .2], `<div class="who ln">${L.mark(first.k, 104)}<span>${first.name} ${bear ? 'shorted' : 'went long on'}</span></div><div class="big" style="font-size:330px">0</div><div class="ln">of its ${first.calls} calls.</div>`), [w, b, l] = s.blk.children;
    s.fit = [[[w.lastChild, l], 700, 110]]; s.fn = () => { e(w, s.t0 + .05); b.textContent = Math.round(k * L.eo(L.n(t, s.t0 + .2, s.t0 + 1))); b.style.opacity = L.n(t, s.t0 + .15, s.t0 + .4); e(l, s.t0 + .6) } }
  // 10 accuracy: [the best, the lowest]; the other two are bars without numbers
  { const best = D.ai.reduce((a, b) => b.hitx > a.hitx ? b : a), low = D.ai.find(a => D.releg.includes(a.k)) || D.ai.reduce((a, b) => b.hitx < a.hitx ? b : a), H = 330, MAX = 75, hy = v => H * Math.min(MAX, v) / MAX;
    const s = scene(9, [.6, .6, .1], `<div class="ln">How often did they</div><div class="ln">pick the right side?</div><div class="acc">${D.ai.map((a, i) => { const on = a === best || a === low, c = a.hitx < 50 ? Rd : G; return `<div class="c${on ? '' : ' dimmed'}" style="left:${i * 210}px"><div class="bar" style="height:${hy(a.hitx)}px;background:${c}"></div>${L.mark(a.k, 80)}${on ? `<div class="v" style="color:${c};bottom:${96 + Math.max(hy(a.hitx), hy(50)) + 56}px">0%</div><div class="nm" style="bottom:${96 + Math.max(hy(a.hitx), hy(50)) + 16}px">${a.name}</div>` : ''}</div>` }).join('')}<div class="half" style="bottom:${96 + hy(50)}px"></div></div>`), [l1, l2, ac] = s.blk.children, cs = L.$$('.c', ac), half = ac.querySelector('.half');
    S.low = low; s.fit = [[[l1, l2], 820, 88]];
    s.fn = () => { e(l1, s.t0 + .05); e(l2, s.t0 + .15); half.style.transform = `scaleX(${L.eo5(L.n(t, s.t0 + .5, s.t0 + 1.1))})`;
      cs.forEach((c, i) => { const a = D.ai[i], dt = t - (s.t0 + .6 + i * .1), k = L.eo5(L.n(dt, 0, .9)); c.querySelector('.bar').style.transform = `scaleY(${Math.max(.001, k)})`; c.querySelector('.mk').style.opacity = L.n(dt, -.1, .1); const v = c.querySelector('.v'); if (v) { v.textContent = Math.round(a.hit * k) + '%'; v.style.opacity = L.n(dt, .1, .4); c.querySelector('.nm').style.opacity = L.n(dt, .3, .6) } }) } }
  // 11 the lowest one: [its hit rate]
  { const a = S.low, rel = D.releg.includes(a.k), s = scene(10, rel ? [.1, .85, .1] : [.6, .3, .2], `<div class="who">${L.mark(a.k, 130)}</div><div class="ln" style="margin-top:22px">${a.name} was ${rel ? 'wrong' : 'right'} more</div><div class="ln">often than ${rel ? 'right' : 'wrong'}.</div><div class="big" style="font-size:280px;color:${rel ? Rd : G};margin-top:8px">0%</div>`), [w, l1, l2, b] = s.blk.children;
    s.fit = [[[l1, l2], 820, 96]]; s.fn = () => { pop(w, s.t0 + .05); e(l1, s.t0 + .1); e(l2, s.t0 + .2); b.textContent = Math.round(a.hit * L.eo(L.n(t, s.t0 + .5, s.t0 + 1.3))) + '%'; b.style.opacity = L.n(t, s.t0 + .45, s.t0 + .7) } }
  // 12 the verdict: [relegated]; who replaces it is not this video's news
  { const a = S.low, rel = D.releg.includes(a.k), s = scene(11, rel ? [.05, .9, .05] : [.8, .1, .2], `<div class="who">${L.mark(a.k, 250)}</div><div class="st" ${rel ? '' : `style="color:${G};border-color:${G}"`}>${rel ? 'RELEGATED' : 'STAYS'}</div>`), [w, st] = s.blk.children, m = w.firstChild;
    C.push([s.t0, 'sfx-stamp', .24]); s.fn = () => { const x = t - s.t0, ks = x <= 0 ? 0 : L.spring(x, 2.2, 9); st.style.opacity = L.n(x, 0, .06); st.style.transform = `rotate(-5deg) scale(${1.9 - .9 * ks})`; w.style.opacity = L.n(t, s.t0 - .2, s.t0); if (rel) m.style.opacity = 1 - .5 * L.eio(L.n(x, .1, .9)) } }
  // 13 to 16 the table, one row a scene from last place up, then the winner on the bed's drop: [who, how much]
  { const lab = D.final ? `FINAL P&amp;L · ${tot} ROUNDS` : `P&amp;L AFTER ${n} OF ${tot} ROUNDS`, rows = [...D.ai].reverse();
    rows.forEach((a, j) => { const win = j === rows.length - 1, prev = rows.slice(0, j).reverse(), c = col(a.pnl);
      const s = scene(12 + j, win ? [.25, .05, .95] : a.pnl >= 0 ? [.85, .1, .15] : [.1, .85, .1], `<div class="tb"><div class="top lb">${win ? '' : lab}</div><div class="hero">${L.mark(a.k, win ? 210 : 160, !win).replace('class="mk"', `class="mk${win ? ' ring' : ''}"`)}<div class="ln" style="margin-top:${win ? 34 : 18}px">${win ? `${a.name} ${D.final ? 'wins' : 'leads'} Season 1.` : a.name}</div><div class="big" style="color:${c};margin-top:6px">${money0(a.pnl)}</div></div>
        <div class="foot"><div class="li">${prev.map(p => `<div class="it">${L.mark(p.k, 44)}${win ? '' : `<span style="font-family:Inter;font-weight:800;letter-spacing:-.01em">${p.name}</span>`}<span style="color:${col(p.pnl)}">${money0(p.pnl)}</span></div>`).join('')}</div>${win ? `<div class="s2">Season 2 soon.</div>` : ''}</div></div>`), tb = s.blk.firstChild, top = tb.children[0], hero = tb.children[1], [m, nmEl, b] = hero.children, its = L.$$('.it', tb), s2 = tb.querySelector('.s2');
      s.fit = [[[b], 820, win ? 190 : 210], [[nmEl], 820, win ? 96 : 130]]; C.push(win ? [s.t0, 'sfx-boom', .3] : [s.t0, 'r11-card', .09]); if (win) C.push([s.t0, 'sfx-riser', .1], [s.t0 + .5, 'sfx-chime', .13]);
      s.fn = () => { top.style.opacity = j ? 1 : L.n(t, s.t0, s.t0 + .3); win ? pop(m, s.t0, .6, 1.5, 7) : pop(m, s.t0 + .02, .85); e(nmEl, s.t0 + .08, .4); b.textContent = money0(Math.round(a.pnl * L.eo5(L.n(t, s.t0 + .1, s.t0 + (win ? 1.1 : .7))) / 10) * 10); b.style.opacity = L.n(t, s.t0 + .08, s.t0 + .3);
        its.forEach((it, i) => { const k = i === 0 ? L.eo5(L.n(t, s.t0 + .05, s.t0 + .5)) : 1; it.style.opacity = .35 * k; it.style.transform = `translateY(${(1 - k) * -26}px)` }); if (s2) e(s2, s.t0 + 2.5, .5, 12) } }) }
  window.MUSIC = { f: q.get('bed') || 's1-k', at: +(q.get('at') || 0) };
