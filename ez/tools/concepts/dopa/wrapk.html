const q = new URLSearchParams(location.search), G = '#55d6a2', Rd = '#e8576b', Au = '#fdbc2a', Cr = '#f2ede6', BG = [14, 12, 11];
const stage = L.$('#stage'), add = (h, p = stage) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };
let D, DUR, S = {}, C = [], grain, t = 0; const SH = [];
const money0 = v => (v < 0 ? '−' : '+') + '$' + Math.abs(Math.round(v)).toLocaleString('en-US'), pct = (v, d = 2) => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(d) + '%', col = v => v >= 0 ? G : Rd;
const mix = (hex, a) => { const c = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16)); return `rgb(${c.map((x, i) => Math.round(x * a + BG[i] * (1 - a))).join(',')})` };
const dim = c => mix(c, c === Cr ? .86 : .76), gt = c => `--c1:${c};--c2:${dim(c)}`;                                       // text that a highlight can travel across
const sheen = (el, ...ts) => { let k = 0; ts.forEach(t0 => { const x = L.n(t, t0, t0 + .9); if (x > 0 && x < 1) k = L.eio(x) }); el.style.backgroundPosition = (100 - 100 * k) + '% 0' };
const e = (el, t0, d = .45, dy = 36) => { const k = L.eo5(L.n(t, t0, t0 + d)); el.style.opacity = L.n(t, t0, t0 + d * .55); el.style.transform = `translateY(${(1 - k) * dy}px)`; return k };
const pop = (el, t0, s0 = .7, f = 2.1, dm = 8.5) => { const x = t - t0; el.style.opacity = L.n(x, 0, .1); el.style.transform = `scale(${x <= 0 ? s0 : s0 + (1 - s0) * L.spring(x, f, dm)})` };
const shine = (el, t0, d = .9) => { const sh = el._sh || (el._sh = el.querySelector('.shn')), w = el._w || (el._w = el.offsetWidth), ks = L.n(t, t0, t0 + d); sh.style.opacity = ks > 0 && ks < 1 ? Math.sin(ks * Math.PI) : 0; sh.style.transform = `translateX(${L.lerp(-260, w + 40, L.eio(ks))}px) skewX(-14deg)` };
const and = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a.at(-1);
// the cut, in seconds: the bed is 120 BPM, so every time here is on its half-second beat (or the quarter between two)
const T = { A: 0, B: 4, C: 8, D: [14, 18, 22], E1: 26, E2: 30, E3: 34, F1: 38.5, F2: 42, G: 48, H: 52, END: 58 };
const shot = (id, t0, t1, ox = 50, oy = 46, cls = '') => { const el = add(`<div class="shot ${cls}" id="${id}" style="transform-origin:${ox}% ${oy}%"></div>`); const s = { id, t0, t1, el, fn: null, o: [ox * 10.8, oy * 13.5] }; SH.push(s); return s };

function build() {
  if (q.get('final')) D.final = true;
  const A = k => D.ai.find(a => a.k === k), n = D.rounds, tot = D.total, mk = D.mkt, nm = mk.up + mk.down; DUR = T.END;
  // chrome: the series, the draft tag, the six chapters, the fine print
  add(`<div id="bug"><img src="ezlogo.svg" alt=""><span>EARNINGS ZEASON</span></div>`, document.body);
  if (!D.final) add(`<div id="dr">DRAFT · ${n} OF ${tot}</div>`, document.body);
  S.chap = add(`<div id="chap">${'<i><b></b></i>'.repeat(6)}</div>`, document.body); S.chT = [[T.A, T.C], [T.C, T.D[0]], [T.D[0], T.E1], [T.E1, T.F1], [T.F1, T.G], [T.G, T.END]];
  add(`<div id="fine">Simulated · $100K on every trade · not advice</div>`, document.body);

  // A the hook
  { const s = shot('A', T.A, T.B), el = s.el, w = (x, c = Cr) => x.split(' ').map(y => `<span class="gt" style="${gt(c)}">${y} </span>`).join('');
    add(`<h1>${w('We paid for')}<br>${w('the')}${w('top plan', Au)}<br>${w('of ' + D.ai.length + ' AIs.')}</h1>`, el);
    add(`<div class="ms">${D.ai.map(a => `<div class="m">${L.mark(a.k, 168)}<span>${a.name}</span></div>`).join('')}</div>`, el);
    const ws = L.$$('h1 span', el), ms = L.$$('.m', el);
    D.ai.forEach((a, j) => C.push([.5 + j * .5, 'r11-pluck', .07])); C.push([.05, 'r11-swell', .08]);
    s.fn = () => { ws.forEach((x, j) => { e(x, .08 + j * .07, .5, 44); sheen(x, 2.35 + j * .05) }); ms.forEach((m, j) => { pop(m, .5 + j * .5); if (t > 2.6) m.style.transform = `translateY(${-8 * Math.sin((t - 2.6) * 2.6 - j * .7) * L.n(t, 2.6, 3)}px)` }) } }

  // B the job
  { const s = shot('B', T.B, T.C), el = s.el;
    const k = add(`<div class="ct kick" style="top:204px">THEIR JOB</div>`, el), nu = add(`<div class="ct num gt" style="${gt(Cr)}">0</div>`, el), l1 = add(`<div class="ct l1">earnings reports.</div>`, el);
    const l2 = add(`<div class="l2"><span class="pill" style="color:${G};background:rgba(85,214,162,.14);box-shadow:inset 0 0 0 3px rgba(85,214,162,.55)">LONG</span><span class="or">or</span><span class="pill" style="color:${Rd};background:rgba(232,87,107,.13);box-shadow:inset 0 0 0 3px rgba(232,87,107,.5)">SHORT</span><span>on each.</span></div>`, el);
    const l3 = add(`<div class="ct l3"><span style="color:${Au}">$100K</span> on every trade.</div>`, el), ps = L.$$('.l2 > *', el);
    C.push([T.B, 'sfx-whoosh', .05], [T.B + 1, 'r11-thump', .1]);
    s.fn = () => { e(k, T.B + .1); nu.textContent = Math.round(tot * L.eo(L.n(t, T.B, T.B + 1))); nu.style.opacity = L.n(t, T.B - .05, T.B + .2); sheen(nu, T.B + 2.5); e(l1, T.B + .25);
      ps.forEach((p, j) => { const x = t - (T.B + .6 + j * .08); p.style.opacity = L.n(x, 0, .12); p.style.transform = `translateY(${(1 - L.spring(Math.max(0, x), 1.9, 8)) * 40 + (j % 2 ? 0 : -5 * Math.sin((t - T.B - 1.6) * 3 + j) * L.n(t, T.B + 1.8, T.B + 2.2))}px)` });
      e(l3, T.B + 1); } }

  // C how it went: the title becomes the header, then last place to first, each number riding its own season line
  { const s = shot('C', T.C, T.D[0]), el = s.el; let lo = 0, hi = 0; D.order.forEach(k => D.s[k].forEach(v => { lo = Math.min(lo, v); hi = Math.max(hi, v) }));
    const ti = add(`<div class="ti gt" style="${gt(Cr)}">Here’s how it went.</div>`, el), sub = add(`<div class="ct sub">${D.final ? 'FINAL P&amp;L · ALL ' + tot + ' ROUNDS' : 'P&amp;L AFTER ' + n + ' OF ' + tot + ' ROUNDS'}</div>`, el);
    const SW = 216, SHh = 108, Y = v => SHh * (hi - v) / (hi - lo), rows = D.ai.map((a, i) => { const ser = D.s[a.k], pts = ser.map((v, j) => `${(j / (ser.length - 1) * SW).toFixed(1)},${Y(v).toFixed(1)}`).join(' '), tc = T.C + 1.5 + (D.ai.length - 1 - i) * .5;
      const r = add(`<div class="row" style="top:${342 + i * 212}px"><div class="au"></div>${L.mark(a.k, 104)}<div class="nb"><div class="nm">${a.name}</div><div class="tg">${i ? '' : D.final ? 'WINNER' : 'IN FRONT'}</div></div>
        <svg class="sp" width="${SW}" height="${SHh}"><line x1="0" x2="${SW}" y1="${Y(0)}" y2="${Y(0)}" stroke="#5f5853" stroke-width="2" stroke-dasharray="3 7"/><polyline points="${pts}" pathLength="1" fill="none" stroke="${col(a.pnl)}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1"/><circle r="7" fill="${col(a.pnl)}"/></svg>
