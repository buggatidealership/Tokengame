<!doctype html><meta charset="utf-8"><title>Season 1, the glass take</title>
<!-- Take K of the Season 1 conclusion, round 4 (WRAP-BRIEF.md "Round 4", owner 2026-11-18, evening): no longer a stats recap.
  Six small scenes that each build one thought, in the brief's fixed words, for a stranger on X with the sound off:
  1 what this is  2 one example  3 who won, counted 4th to 1st  4 why  5 who is out  6 the end.
  R1 a scene opens on its plain line, alone for 0.7 s or more. R2 one thing arrives at a time, 0.7 s or more apart, and stays
  (the newest line is at full contrast, the lines before it rest at 35%: P1, P2). R3 every line is given its reading time
  (0.5 s + 0.05 s a character) before the next arrives, the scene holds 1.6 s or more (and 1 s + 0.08 s a character of the last
  line) after its last element, and lasts about 1 s + 0.08 s a character of all its text. R5 whole per cents and thousands; the
  one exact number is the winner's total on the last card. The look is P4: one sheet of glass over slow brand-colour light.
  Reads data/wrap.json (node prep-wrap.js); every word that carries a fact is bound to it. While D.final is false: a DRAFT tag,
  "After N of M reports:", "leads" for "wins". ?final=1 forces the final wording.
  The bed s1-k4 (120 BPM, cut from s1-k4-src: the opening groove twice, its build bar, the drop, a second lift) drops at 30.0 s
  ("1st") and lifts at 52.0 s (the last card). Earlier cuts: git fb6654d6 (round 2), x2p-s1-wrap-k-draft.mp4.
  window.R(t), READY, CUES, MUSIC, DUR as the other pages. Render: bash wrapx.sh wrapk.html 58 x2p-s1-wrap-k4-draft s1-k4 0 .34 -->
<style id="base"></style>
<style>
#field{position:absolute;inset:0;overflow:hidden}
#field i{position:absolute;left:0;top:0;width:1240px;height:1240px;margin:-620px 0 0 -620px;border-radius:50%}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
/* the one sheet of glass: a faint cream fill, the field blurred and saturated behind it, a bright edge where the light would hit
   (top and top-left), a faint shade at the foot, a soft shadow; one slow specular band */
#glass{position:absolute;left:80px;width:920px;border-radius:60px;overflow:hidden;background:linear-gradient(165deg,rgba(242,237,230,.115),rgba(242,237,230,.06) 46%,rgba(242,237,230,.085));
  -webkit-backdrop-filter:blur(26px) saturate(135%);backdrop-filter:blur(26px) saturate(135%);box-shadow:inset 0 -26px 46px -30px rgba(0,0,0,.5),0 34px 90px -26px rgba(0,0,0,.7)}
#glass:before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.6px;background:linear-gradient(152deg,rgba(242,237,230,.62),rgba(242,237,230,.14) 30%,rgba(242,237,230,0) 58%,rgba(242,237,230,.16));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
#glass .sp{position:absolute;top:-30%;bottom:-30%;left:0;width:340px;background:linear-gradient(90deg,transparent,rgba(242,237,230,.07),transparent);transform:skewX(-16deg)}
#stage{position:absolute;inset:0}
.shot{position:absolute;left:100px;width:880px;top:0;height:1350px;display:none;align-items:center;justify-content:center}
.blk{display:flex;flex-direction:column;align-items:center;text-align:center;white-space:nowrap;gap:40px}
.ln{font:800 84px/1.14 Inter;letter-spacing:-.04em;color:#f2ede6}
.big{font:900 200px/1 Inter;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.sm{font:600 34px/1.2 'Geist Mono';letter-spacing:.06em;color:#8e8680}
.ms{display:flex;gap:34px}
.logo{width:124px;height:124px;border-radius:30px;background:#f2ede6;padding:15px;object-fit:contain}.logo.dk{background:#1d1917;box-shadow:inset 0 0 0 2px rgba(242,237,230,.2)}
.rw{display:flex;align-items:center;justify-content:center;gap:.3em}.rw i{font-style:normal;color:#8e8680}
.st{font:900 104px/1 Inter;letter-spacing:-.02em;color:#e8576b;padding:16px 36px 18px;border:9px solid #e8576b;border-radius:28px}
.ring{box-shadow:0 0 0 7px #fdbc2a}
#bug{position:absolute;left:56px;top:54px;width:52px;height:52px;z-index:40}
#dr{position:absolute;right:56px;top:56px;font:600 30px 'Geist Mono';letter-spacing:.1em;color:#e8576b;padding:6px 14px 5px;border-radius:10px;box-shadow:inset 0 0 0 2px rgba(232,87,107,.6);z-index:40}
</style>
<div id="field"><i id="fg"></i><i id="fr"></i><i id="fa"></i></div>
<div id="cam"><div id="glass"><div class="sp"></div></div><div id="stage"></div></div><div id="vig"></div><canvas id="grain"></canvas>
<script src="lib.js"></script>
<script>
const q = new URLSearchParams(location.search), G = '#55d6a2', Rd = '#e8576b', Au = '#fdbc2a', Cr = '#f2ede6';
const stage = L.$('#stage'), add = (h, p = stage) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };
let D, DUR, S = {}, C = [], grain, t = 0; const SH = [];
const K = v => '$' + Math.round(Math.abs(v) / 1000) + 'K', money0 = v => (v < 0 ? '−' : '+') + '$' + Math.abs(Math.round(v)).toLocaleString('en-US'), c = (s, col) => `<span style="color:${col}">${s}</span>`;
const NUM = ['zero', 'one', 'two', 'three', 'four', 'five', 'six'], CAP = s => s[0].toUpperCase() + s.slice(1), ORD = ['', '1st', '2nd', '3rd', '4th', '5th', '6th'];
// a scene [t0, t1] with the light behind the glass [green, red, gold]; an element arrives at `at` and stays. focus: the newest
// line is at full contrast and the lines before it rest at 35% (set to false where the whole scene is two data points or fewer)
const scene = (t0, t1, fx, focus = true) => { const el = add(`<div class="shot"><div class="blk"></div></div>`), s = { t0, t1, fx, focus, el, blk: el.firstChild, els: [] }; SH.push(s); return s };
const put = (s, at, html, o = {}) => { const el = add(html, o.into || s.blk), x = { el, at, line: !!o.line, fn: o.fn || null, snd: o.snd }; s.els.push(x); if (o.snd !== 0) C.push([at, o.snd || 'r11-card', o.gain || .05]); return x };
const line = (s, at, html, o = {}) => put(s, at, `<div class="ln">${html}</div>`, { ...o, line: true });

function build() {
  if (q.get('final')) D.final = true;
  const A = k => D.ai.find(a => a.k === k), n = D.rounds, tot = D.total, mk = D.mkt, nm = mk.up + mk.down, first = D.ai[0], N = D.ai.length; DUR = 58;
  add(`<img id="bug" src="ezlogo.svg" alt="">`, document.body); if (!D.final) add(`<div id="dr">DRAFT · ${n} OF ${tot}</div>`, document.body);

  // 1 what this is
  { const s = scene(0, 9.5, [0, 0, .62]);
    line(s, 0, `${N} AIs bet on ${tot}<br>earnings reports.`, { snd: 'r11-swell', gain: .07 });
    put(s, 1, `<div class="ms">${D.ai.map(a => L.mark(a.k, 116)).join('')}</div>`);
    line(s, 2.5, `Each time: will the stock<br>go ${c('up', G)}, or ${c('down', Rd)}?`);
    line(s, 5, `${c('$100K', Au)} a bet.<br>Not real money.`) }

  // 2 one example: the biggest move where exactly one AI was right (else where one was wrong, else the biggest move)
  { const x = D.big.find(b => b.right.length === 1) || D.big.find(b => b.wrong.length === 1) || D.big[0], solo = x.right.length === 1 ? A(x.right[0]) : x.wrong.length === 1 ? A(x.wrong[0]) : null, won = solo && x.right.length === 1;
    const dir = sd => sd === 'SHORT' ? 'fall' : 'rise', amt = K(x.move * 1000), others = solo ? D.ai.filter(a => a !== solo && x.p[a.k]).length : 0, s = scene(9.5, 22, x.move < 0 ? [0, .8, 0] : [.45, 0, 0]);
    line(s, 9.5, `One example: ${x.co}.`); if (x.logo) put(s, 10.5, `<img class="logo${x.dark ? ' dk' : ''}" src="${x.logo}">`);
    line(s, 11.5, `After earnings,<br>the stock ${c((x.move < 0 ? 'fell ' : 'rose ') + Math.round(Math.abs(x.move)) + '%', x.move < 0 ? Rd : G)}.`);
    const ms = put(s, 14, `<div class="ms">${D.ai.map(a => L.mark(a.k, 96)).join('')}</div>`), mks = L.$$('.mk', ms.el);
    if (solo) { line(s, 15, `Only ${solo.name} bet on a ${dir(x.side[solo.k])}.`, { fn: () => { const k = L.eio(L.n(t, 15, 15.5)); mks.forEach((m, i) => { const me = D.ai[i] === solo; m.style.opacity = me ? 1 : 1 - .68 * k; m.style.transform = `scale(${me ? 1 + .1 * k : 1 - .06 * k})`; m.style.boxShadow = me ? `0 0 0 ${5 * k}px ${won ? G : Rd}` : '' }) } });
      line(s, 17, others === N - 1 ? `${solo.name} ${c((won ? 'made ' : 'lost ') + amt, won ? G : Rd)}. The other<br>${NUM[others]} ${c((won ? 'lost ' : 'made ') + amt, won ? Rd : G)} each.` : `${solo.name} ${c((won ? 'made ' : 'lost ') + amt, won ? G : Rd)}.`) }
    else { const r = D.ai.filter(a => x.right.includes(a.k)); line(s, 15, r.length ? `${r.length} of ${N} bet on a ${dir(x.side[r[0].k])}.` : `All ${NUM[N]} bet the wrong way.`); line(s, 17, r.length ? `They ${c('made ' + amt, G)} each.` : `Each ${c('lost ' + amt, Rd)}.`) } }

  // 3 who won, counted from last place up; the winner lands on the bed's drop, in gold
  { const lit = a => a.pnl >= 0 ? [.45, 0, 0] : [0, .75, 0], s = scene(22, 33, lit(D.ai.at(-1))); s.fx2 = [...D.ai].reverse().map((a, j) => [24 + j * 2, j === N - 1 ? [0, 0, .95] : lit(a)]);
    line(s, 22, D.final ? `After ${tot} reports:` : `After ${n} of ${tot} reports:`); const slots = D.ai.map(() => add(`<div></div>`, s.blk));
    [...D.ai].reverse().forEach((a, j) => { const i = N - 1 - j, win = i === 0, at = 24 + j * 2, col = win ? Au : a.pnl >= 0 ? G : Rd;
      const x = put(s, at, `<div class="ln rw" style="${win ? 'color:' + Au : ''}"><span>${ORD[i + 1]}</span><i>·</i>${L.mark(a.k, 68)}<span>${a.name}</span><i>·</i><span style="color:${col}">${a.pnl >= 0 ? 'made' : 'lost'} ${K(a.pnl)}</span></div>`, { into: slots[i], line: true, snd: win ? 'sfx-boom' : 'r11-card', gain: win ? .3 : .08 });
      if (win) { C.push([at, 'sfx-riser', .1]); x.fn = () => { const d = t - at; x.el.style.transform = `scale(${d <= 0 ? 1 : 1 + .14 * Math.exp(-d * 5)})` } } }) }

  // 4 why: the winner's lean, and whether the market leaned the same way
  { const s = scene(33, 46, first.lean === 'BEAR' ? [0, .75, 0] : [.45, 0, 0]), bear = first.lean === 'BEAR', share = bear ? first.shorts / first.calls : first.longs / first.calls, n10 = Math.round(share * 10), way = bear ? 'fall' : 'rise', agree = bear ? mk.down > mk.up : mk.up > mk.down, plain = bear ? mk.short : mk.long;
    line(s, 33, D.final ? `How did ${first.name} win?` : `How is ${first.name} winning?`);
    line(s, 34.5, `It bet on a ${way}<br>${c(n10 >= 10 ? 'every single time' : n10 + ' times out of 10', Au)}.`);
    if (agree) line(s, 37, `And most stocks did ${way}:<br>${c((bear ? mk.down : mk.up) + ' of ' + nm, bear ? Rd : G)}.`);
    if (agree && plain > first.pnl) line(s, 39.5, `Betting on a ${way} every<br>single time would have<br>${c('made even more', G)}.`) }

  // 5 who is out (who replaces it is not this video's news)
  { const out = D.ai.filter(a => D.releg.includes(a.k)), s = scene(46, 52, out.length ? [0, .85, 0] : [.45, 0, 0], false);
    if (out.length) { const a = out[0], names = out.map(x => x.name);
      line(s, 46, out.length === 1 ? 'One AI is out.' : `${CAP(NUM[out.length])} AIs are out.`); put(s, 46.75, `<div class="ms">${out.map(x => L.mark(x.k, 170)).join('')}</div>`);
      line(s, 47.5, `${names.length < 2 ? a.name + ' was' : names.slice(0, -1).join(', ') + ' and ' + names.at(-1) + ' were'} ${c('wrong', Rd)} more<br>often than right.`);
      const st = put(s, 50, `<div class="st">Relegated.</div>`, { snd: 'sfx-stamp', gain: .24 }); st.fn = () => { const d = t - 50; st.el.style.transform = `rotate(-4deg) scale(${d <= 0 ? 1.5 : 1.5 - .5 * L.spring(d, 2.2, 9)})` } }
    else { line(s, 46, 'No AI is out.'); put(s, 46.75, `<div class="ms">${D.ai.map(a => L.mark(a.k, 116)).join('')}</div>`); line(s, 47.5, `All ${NUM[N]} were right more<br>often than wrong.`) } }

  // 6 the end: the winner, the one exact number, one small line
  { const s = scene(52, 60, [0, 0, .95], false);
    line(s, 52, `${first.name} ${D.final ? 'wins' : 'leads'} Season 1.`, { snd: 'sfx-chime', gain: .14 }); put(s, 53, L.mark(first.k, 190, false).replace('class="mk"', 'class="mk ring"'));
    const b = put(s, 54, `<div class="big" style="color:${Au}">${money0(first.pnl)}</div>`, { snd: 'r11-kaching', gain: .13 }); b.fn = () => { b.el.textContent = money0(Math.round(first.pnl * L.eo5(L.n(t, 54, 54.8)) / 10) * 10) }; S.big = b.el;
    put(s, 55.5, `<div class="sm">Season 2 soon.</div>`, { snd: 0 }) }
  window.MUSIC = { f: q.get('bed') || 's1-k4', at: +(q.get('at') || 0) };
}
function R(tt) {
  t = tt; let H = SH[0].H, fx = SH[0].fx;
  SH.forEach((s, i) => { const vis = t >= s.t0 - .05 && t <= s.t1 + .05; s.el.style.display = vis ? 'flex' : 'none';
    if (i) { const k = L.eio(L.n(t, s.t0 - .3, s.t0 + .25)); H = L.lerp(H, s.H, k); const kf = L.eio(L.n(t, s.t0 - .5, s.t0 + .9)); fx = fx.map((v, j) => L.lerp(v, s.fx[j], kf)) }
    (s.fx2 || []).forEach(([at, f2]) => { const kf = L.eio(L.n(t, at - .1, at + .7)); fx = fx.map((v, j) => L.lerp(v, f2[j], kf)) });
    if (!vis) return; const lines = s.els.filter(x => x.line);
    s.els.forEach(x => { const k = L.eo5(L.n(t, x.at, x.at + .45)), nx = s.focus && x.line ? lines[lines.indexOf(x) + 1] : null, dim = nx ? L.lerp(1, .35, L.eio(L.n(t, nx.at, nx.at + .4))) : 1;
      x.el.style.opacity = L.n(t, x.at, x.at + .3) * dim; x.el.style.transform = `translateY(${((1 - k) * 24).toFixed(2)}px)`; if (x.fn) x.fn() });
    // the scene leaves in one move as the next one's sheet takes its size; while it holds it only drifts (never frozen, never busy)
    const x = L.n(t, s.t0, s.t1), out = s.t1 >= DUR ? 0 : L.eio(L.n(t, s.t1 - .32, s.t1 - .02)); s.el.style.opacity = 1 - out; s.el.style.transform = `translateY(${(6 - 12 * x - 18 * out).toFixed(2)}px)` });
  const g = S.glass; g.style.height = H.toFixed(1) + 'px'; g.style.top = (675 - H / 2).toFixed(1) + 'px'; const cur = SH.findLast(s => t >= s.t0) || SH[0], xs = L.n(t, cur.t0, cur.t1); S.sp.style.transform = `translateX(${L.lerp(-420, 1000, .5 - .5 * Math.cos(Math.PI * xs))}px) skewX(-16deg)`;
  S.cam.style.transform = `scale(${(1.015 - .015 * Math.cos(t * 2 * Math.PI / 14.5)).toFixed(5)})`;
  // the field: three slow lights; how bright each is comes from the scene
  S.fl.forEach(([el, x, y, ax, ay, px, py, ph], j) => { el.style.transform = `translate(${(x + ax * Math.sin(t / px * 2 + ph)).toFixed(1)}px,${(y + ay * Math.cos(t / py * 2 + ph)).toFixed(1)}px)`; el.style.opacity = (.5 * fx[j]).toFixed(3) });
  grain(t);
}
window.R = R;
(async () => {
  // the web fonts first, and for certain: the font sheet is awaited before anything is measured (a late swap from the local Inter to the
  // web Inter changes every width by several percent, and two renderers must never disagree on the type)
  await new Promise(res => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = (L.css.match(/@import url\('([^']+)'\)/) || [])[1]; l.onload = l.onerror = res; document.head.appendChild(l); setTimeout(res, 20000) });
  L.$('#base').textContent = L.css; [D, L.models] = await Promise.all([fetch('data/wrap.json').then(r => r.json()), fetch('models.json').then(r => r.json())]); build();
  const smp = 'Season 2 soon. 4 AIs bet on 112 earnings reports. Relegated. −+$%,·:?0123456789K';
  await Promise.all(['800 84px Inter', '900 200px Inter', '600 34px "Geist Mono"'].map(f => document.fonts.load(f, smp))); await document.fonts.ready; await Promise.all(L.$$('img').map(i => i.decode().catch(() => 0)));
  window.FONTS = [...document.fonts].filter(f => f.status === 'loaded').map(f => f.family.replace(/"/g, '') + ' ' + f.weight).filter((x, i, a) => a.indexOf(x) === i);
  [['#fg', G], ['#fr', Rd], ['#fa', Au]].forEach(([id, col]) => L.$(id).style.background = `radial-gradient(closest-side,${col},${col}66 34%,${col}1c 66%,transparent)`);
  S.fl = [[L.$('#fg'), 300, 430, 150, 130, 7.3, 9.1, 0], [L.$('#fr'), 790, 930, 140, 120, 8.2, 6.7, 1.3], [L.$('#fa'), 560, 640, 190, 170, 10.4, 7.9, 2.6]]; S.cam = L.$('#cam');
  // one type size for the lines of a scene: the largest (84px at most) at which its widest line is 820px wide
  const tw = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width };
  SH.forEach(s => { s.el.style.display = 'flex'; const ls = L.$$('.ln', s.el), m = Math.max(...ls.map(tw)); if (m > 820) ls.forEach(x => x.style.fontSize = Math.floor(84 * 820 / m) + 'px');
    s.H = Math.round(Math.min(1040, Math.max(560, s.blk.offsetHeight + 150))); s.el.style.display = 'none' });
  if (S.big) { const sh = SH.at(-1); sh.el.style.display = 'flex'; const w = tw(S.big); if (w > 820) S.big.style.fontSize = Math.floor(200 * 820 / w) + 'px'; sh.H = Math.round(Math.min(1040, Math.max(560, sh.blk.offsetHeight + 150))); sh.el.style.display = 'none' }
  S.glass = L.$('#glass'); S.sp = L.$('#glass .sp'); grain = L.grain(L.$('#grain'), .04); window.CUES = C; window.DUR = DUR; window.SCENES = SH.map(s => ({ t0: s.t0, t1: Math.min(s.t1, DUR), els: s.els.map(x => ({ at: x.at, text: x.el.tagName === 'svg' || x.el.tagName === 'IMG' || x.el.classList.contains('ms') ? '(picture)' : x.el.innerText.replace(/\s+/g, ' ').trim(), line: x.line })) })); R(0); window.READY = 1;
})();
</script>
