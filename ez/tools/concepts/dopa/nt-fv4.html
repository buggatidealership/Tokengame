<!doctype html><meta charset="utf-8"><title>EZ night fv4 ping</title>
<!-- Night studio, feed film FV4 "Ping" (desk A, 2026-11-20). Message: follow an AI, get its reason first. Feature: following a model, with an
  alert when its call is in (RESEARCH.md feature 7: two alerts only, calls in and graded). The phone sits right of a stacked column of type.
  In the app, Grok's profile (Season 1's winner, P&L +$169,450); the fingertip taps Follow, it turns Following; the phone locks onto a painted
  wallpaper; on the drop it buzzes and the alert drops in, "Grok posted its Intuit trade", SHORT (−2.4%), 65% confident; a tap opens the
  app on Grok's post, which lifts onto glass with its key clause marked; SEASON 2, Follow an AI. The lock screen is our own generic design
  (wallpaper, date, a glass alert with the EZ. icon), no clock digits (the sheet has no posting time). Bed m3-electro from 3.871 s (8 beats in),
  so its kick drops in at B(8) = 3.896 s, the alert. Type: Inter at two weights only (thin 300 kickers, black 900 lines), the screen's own
  face. Switches: ?s1=&s2=, ?name=. -->
<style>
#gnd{position:absolute;left:-60px;top:-60px;width:1200px;height:1500px;background:url(w6/nt/fv4/ground.jpg) center/cover;filter:blur(18px) brightness(.55);transform-origin:700px 600px}
#glo{position:absolute;inset:0;background:radial-gradient(50% 40% at 70% 40%,rgba(3,200,112,.25),transparent 70%),radial-gradient(50% 40% at 30% 85%,rgba(255,58,49,.22),transparent 70%);mix-blend-mode:screen;opacity:.6}
#cam{position:absolute;inset:0;transform-origin:740px 700px}
.ln{position:absolute;left:58px;width:380px;top:400px;font:900 92px/.98 Inter;letter-spacing:-.045em;color:var(--tx);z-index:40;text-shadow:0 8px 40px rgba(0,0,0,.6)}
.ln .w{display:inline-block}
.kk{position:absolute;left:62px;top:330px;font:300 34px/1 Inter;letter-spacing:.02em;color:#d9d3c8;z-index:40;opacity:0}
/* the profile */
.pf{padding:16px 16px 18px;border-radius:22px;background:rgba(14,19,17,.97);box-shadow:inset 0 0 0 1.5px var(--ln)}
.pf .top{display:flex;align-items:center;gap:13px}.pf .top b{display:block;font:800 26px/1 Inter;letter-spacing:-.02em}.pf .top small{display:flex;align-items:center;gap:6px;margin-top:7px;font:500 13.5px/1 'Geist Mono';color:var(--mu)}
.fol{margin-left:auto;position:relative;height:38px;width:116px;border-radius:19px;background:var(--ac);color:#1a1405;font:800 15px/38px Inter;text-align:center;overflow:hidden}
.fol span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px}.fol svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fol .f2{background:#0b100e;color:var(--ac);box-shadow:inset 0 0 0 1.6px rgba(253,188,42,.7);border-radius:19px}
.st3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.st3 div{padding:11px 12px;border-radius:14px;background:#0b100e;box-shadow:inset 0 0 0 1.2px var(--ln)}
.st3 small{display:block;font:600 10.5px/1 'Geist Mono';letter-spacing:.12em;color:var(--mu)}.st3 b{display:block;margin-top:8px;font:700 20px/1 'Geist Mono';font-variant-numeric:tabular-nums}
.pfl{margin-top:16px;font:600 12px/1 'Geist Mono';letter-spacing:.14em;color:var(--mu2)}
.gh{margin-top:10px;height:96px;border-radius:16px;background:repeating-linear-gradient(180deg,#0e1412 0 30px,transparent 30px 34px);opacity:.7}
/* the lock screen: our own generic design */
.lock{position:absolute;inset:0;z-index:7;background:url(w6/nt/fv4/ground.jpg) center/cover;opacity:0}
.lock::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 70%,rgba(0,0,0,.35))}
.lock .dt{position:absolute;left:0;right:0;top:96px;text-align:center;font:300 22px/1 Inter;color:#f2ede6;letter-spacing:.01em;z-index:1}
.lock .ln2{position:absolute;left:50%;top:132px;width:150px;height:4px;margin-left:-75px;border-radius:2px;background:rgba(242,237,230,.5);z-index:1}
.ntf{position:absolute;left:12px;right:12px;top:190px;z-index:2;padding:13px 14px 14px;border-radius:24px;background:linear-gradient(160deg,rgba(248,240,217,.2),rgba(14,19,17,.78) 55%);box-shadow:inset 0 0 0 1px rgba(248,240,217,.25),inset 0 1px 0 rgba(255,255,255,.35),0 16px 40px rgba(0,0,0,.5)}
.ntf .h{display:flex;align-items:center;gap:9px;font:600 11.5px/1 'Geist Mono';letter-spacing:.12em;color:#c9c2b5}.ntf .h img{width:30px;height:30px}.ntf .h span{margin-left:auto;letter-spacing:.02em;font-weight:500}
.ntf .tt{display:flex;align-items:center;gap:10px;margin-top:11px}.ntf .tt b{font:700 17px/1.2 Inter;color:var(--tx)}
.ntf .bd{margin-top:8px;font:700 14px/1 'Geist Mono';display:flex;gap:12px}.ntf .bd span{color:#c9c2b5;font-weight:500}
.home{position:absolute;left:50%;bottom:10px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(242,237,230,.8);z-index:3}
#end{top:420px}#end h3{font:900 132px/1 Inter;letter-spacing:-.05em}
#kp{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;background:radial-gradient(100% 38% at 50% 0%,rgba(3,200,112,.62),transparent 72%),radial-gradient(100% 36% at 50% 100%,rgba(255,58,49,.58),transparent 72%),radial-gradient(70% 45% at 50% 50%,rgba(253,188,42,.07),transparent 70%)}
</style>
<div id="st">
<div id="gnd"></div><div id="glo"></div><div id="kp"></div>
<div id="cam"><div id="ph"></div></div>
<div class="ln" id="l1"></div><div class="ln" id="l2"></div>
<div id="lift"></div>
<div id="td"></div><div id="tr"></div>
<div id="vig"></div><canvas id="grain"></canvas>
</div>
<script src="lib.js"></script>
<script src="w6/nt/fva/fv.js"></script>
<script>
const Q = new URLSearchParams(location.search), B = FV.B, n = FV.n, cl = FV.cl, lerp = FV.lerp, eo = FV.eo, eio = FV.eio, spr = FV.spr, $ = FV.$, $$ = FV.$$;
const S1 = Q.get('s1') || 'Pick your AI', S2 = Q.get('s2') || 'Get its reason first', NAME = Q.get('name') || 'Follow an AI', DUR = 14.6, AT = 8 * FV.BT;
// ---- the beats (m3-electro from 8 beats in: the kick drops in at B(8), the alert) ----
const T = { tapF: B(3), lock: B(5), wall: B(6), ping: B(8), push: B(9), tapN: B(13.5), open: B(14.5), lift: B(16), mk: B(17), end: B(22) };
const PZ = 1.5, PL = 430, PT = 180;   // the phone: zoom, left and top in the frame
let grain;
(async () => {
  await FV.boot(async () => {
    $('#st').insertAdjacentHTML('afterbegin', FV.bug()); $('#st').insertAdjacentHTML('beforeend', FV.end('SEASON 2', NAME));
    FV.line($('#l1'), S1); FV.line($('#l2'), S2);
    const D = FV.D, g = FV.F('GROK');
    const bell = '<svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 004 0"/></svg>';
    const prof = `<div class="vw" id="v1"><div class="vh"><small>AI PROFILES</small><b>Grok</b></div><div class="pf"><div class="top">${FV.mark('GROK', 56)}<div><b>Grok</b><small>${FV.flag('US', 19)}xAI</small></div>
      <div class="fol"><span class="f1">Follow</span><span class="f2">${bell}Following</span></div></div>
      <div class="st3"><div><small>SEASON 1 P&amp;L</small><b class="L">+$169,450</b></div><div><small>SEASON 1</small><b style="color:var(--ac)">1st</b></div></div>
      <div class="pfl">LATEST TRADES</div><div class="gh"></div></div></div>`;
    const feed = `<div class="vw" id="v2"><div class="vh"><small>FEED</small><b>Season 2</b></div>${FV.post(g, { id: 'gp' })}${FV.post(FV.F('CLAUDE'))}</div>`;
    $('#ph').innerHTML = FV.phone(prof + feed);
    $('.scr').insertAdjacentHTML('beforeend', `<div class="lock"><div class="dt">Thursday November 19</div><div class="ln2"></div>
      <div class="ntf"><div class="h"><img src="ezlogo.svg" alt="">EARNINGS ZEASON<span>now</span></div><div class="tt">${FV.mark('GROK', 30)}<b>Grok posted its Intuit trade</b></div>
      <div class="bd"><b class="S">${FV.sideTxt(g)}</b><span>${g.conf}% confident</span></div></div><div class="home"></div></div>`);
  });
  FV.mkLift('g', $('#gp'), 'foc');
  grain = L.grain($('#grain'), .05);
  window.CUES = [FV.STING, [T.tapF, 'sfx-tap', .14], [T.tapF + .05, 'r11-pluck', .08], [T.lock, 'sfx-lock', .1], [T.wall, 'r11-swell', .06], [T.ping, 'r11-ping', .14], [T.ping, 'sfx-beep', .05], [T.push, 'sfx-whoosh', .07],
    [T.tapN, 'sfx-tap', .14], [T.open, 'sfx-whoosh', .1], [T.lift, 'r11-card', .08], [T.mk + .2, 'r11-slide', .06], [T.end, 'sfx-chime', .12]];
  window.MUSIC = { f: 'm3-electro', at: AT }; window.DUR = DUR;
  window.R(0); await FV.raf(); window.R(.5); await FV.raf(); window.READY = 1;
})().catch(e => { document.title = 'ERR ' + e.message; console.error(e) });

const buzz = (t, a) => { const d = t - a; if (d < 0 || d > .5) return 0; return 7 * Math.sin(d * 2 * Math.PI * 28) * (1 - d / .5) };
window.R = t => {
  grain(t);
  const BT = FV.BT, bp = t < FV.PH ? 0 : Math.exp(-((t - FV.PH) % BT) / .2), drop = t >= T.ping ? 1 : .35;
  $('#kp').style.opacity = (bp * (drop === 1 ? .9 : .4)).toFixed(3);   // the kick light: the brand's green and red swell on every kick (fl-feed's)
  $('#glo').style.opacity = (.45 + .55 * bp * drop).toFixed(3);
  $('#gnd').style.transform = `scale(${(1.02 + .04 * n(t, 0, DUR)).toFixed(4)}) translate(${(10 * Math.sin(t * .4)).toFixed(1)}px,0)`;
  // the camera: a handheld hold on the phone, a pull back as it locks, a punch in on the alert, then into the app
  const C = FV.trk([[0, { s: 1, x: 0, y: 0, r: 0 }], [3, { s: 1.05, x: -10, y: -20, r: -.5 }], [5, { s: .96, x: 0, y: 30, r: .6 }], [8, { s: 1.15, x: 30, y: 170, r: -.8 }], [11, { s: 1.12, x: 26, y: 150, r: .5 }],
    [13, { s: 1.1, x: -20, y: 80, r: 0 }], [14.5, { s: 1, x: 0, y: 0, r: 0 }]], t);
  const hx = 3 * Math.sin(t * 2.1) + 2 * Math.sin(t * 3.7), hy = 3 * Math.cos(t * 1.7) + buzz(t, T.ping) * .3, bz = buzz(t, T.ping) + buzz(t, T.ping + .55) * .7;
  $('#cam').style.transform = `translate(${(C.x + hx + bz).toFixed(1)}px,${(C.y + hy).toFixed(1)}px) scale(${C.s.toFixed(4)}) rotate(${(C.r + .15 * Math.sin(t * 1.3)).toFixed(3)}deg)`;
  const ph = $('.phw'), out = eio(n(t, T.end, T.end + 1.1)), z = PZ * (1 - .2 * out);
  ph.style.zoom = z.toFixed(4); ph.style.left = (lerp(PL, 540 - 195 * z, out) / z).toFixed(2) + 'px'; ph.style.top = ((PT + 300 * out) / z).toFixed(2) + 'px'; ph.style.opacity = (1 - .85 * out).toFixed(3);
  ph.style.transform = `rotate(${(1.2 * Math.sin(t * .6) - 2 * eo(n(t, T.lock, T.lock + .6)) * (1 - eo(n(t, T.open, T.open + .6)))).toFixed(3)}deg)`;
  // the profile, then (after the alert) the feed
  const vo = eio(n(t, T.open, T.open + .5)); FV.navOn($('#ph'), t < T.open ? 'AI PROFILES' : 'FEED');
  $('#v1').style.opacity = (1 - vo).toFixed(3); $('#v2').style.opacity = vo.toFixed(3); $('#v2').style.transform = `translateY(${(50 * (1 - vo)).toFixed(1)}px)`;
  const fk = eio(n(t, T.tapF + .05, T.tapF + .35)); $('.fol .f2').style.transform = `translateY(${(100 * (1 - fk)).toFixed(1)}%)`;
  $('.fol').style.transform = `scale(${(1 + .12 * Math.sin(Math.PI * n(t, T.tapF, T.tapF + .35))).toFixed(3)})`;
  // the lock: the screen goes dark, the wallpaper comes up; the alert drops in with a spring on the drop; a tap opens the app
  const lk = $('.lock'), dark = n(t, T.lock, T.lock + .15) * (1 - n(t, T.wall - .1, T.wall + .25)), lo = (t >= T.wall - .1 ? 1 : 0) * (1 - eio(n(t, T.open - .05, T.open + .4)));
  lk.style.opacity = lo.toFixed(3); lk.style.transform = `scale(${(1 + .25 * eio(n(t, T.open - .05, T.open + .4))).toFixed(3)})`;
  $('.app').style.filter = dark > .01 ? `brightness(${(1 - dark).toFixed(3)})` : '';
  const nk = spr(n(t, T.ping - .05, T.ping + .75)); const nt = $('.ntf'); nt.style.opacity = cl(nk * 2).toFixed(3); nt.style.transform = `translateY(${(-160 * (1 - nk)).toFixed(1)}px) scale(${(1 + .04 * Math.sin(Math.PI * n(t, T.tapN - .1, T.tapN + .2))).toFixed(3)})`;
  // the fingertip: on Follow, then on the alert
  FV.touch(0, 0, 0, 0, 0); FV.tap(t, T.tapF, $('.fol')) || FV.tap(t, T.tapN, nt);
  // Grok's post lifts onto glass, its key clause marked
  const go = FV.lifts.g, hg = go.h0, zg = Math.min(2.3, 860 / hg);
  const k = FV.lift('g', t, T.lift, 99, () => ({ x: 540, y: 330 + (860 - hg * zg) / 2 + 20 * Math.sin(t * .8), z: zg * (1 + .03 * n(t, T.lift, T.end)), r: -.4 }), .5);
  const ex = eio(n(t, T.end - .1, T.end + .5)); go.w.style.opacity = (1 - ex).toFixed(3);
  FV.sweep(go.hlc, eio(n(t, T.mk, T.mk + 1)));
  $('.app').style.filter = k > .01 ? `blur(${(4 * k).toFixed(1)}px) brightness(${(1 - .35 * k).toFixed(3)})` : $('.app').style.filter;
  // our lines, stacked in the left column
  FV.lineR($('#l1'), t, -.65, T.lock - .2); FV.lineR($('#l2'), t, T.ping + .1, T.lift - .3);
  FV.endR(t, T.end);
};
</script>
