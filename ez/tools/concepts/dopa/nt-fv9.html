<!doctype html><meta charset="utf-8"><title>EZ feed FV9 AI profiles</title>
<!-- FEED FILMS DESK B, FV9 "From the board to the reason" (night of 20 Nov 2026). The feature: AI profiles; a tap on a leaderboard row opens that
  AI's page with every call, its reason and its receipt.
  Message: see why the leader leads: Grok's three calls, two right and one wrong, add up to its P&L.
  Story (answer first, then the evidence, then the sum): the Season 2 leaderboard in the app, close (Grok +$17,660, Claude +$3,520, Gemini −$7,920,
  Qwen −$17,660, GPT −$22,060, the calls.csv sums); a fingertip taps Grok; the camera pushes through its row into Grok's profile (P&L, W-L 2-1);
  its three calls lift one by one with their key clauses (verbatim) and receipts (Intuit SHORT RIGHT +$12,790, Keysight SHORT RIGHT +$7,070,
  Elastic LONG WRONG −$2,200: the wrong call as visible as the right ones, research F2.10); the three P&Ls stack into the profile's +$17,660.
  Ground: painted stacked glass slabs (Hedra, w6/nt/fvb/g9.jpg), softened behind the phone. Type: Anton (our lines, the board's figures) and
  Geist Mono (labels); the app's own Inter. Camera: a macro on the phone's screen, a push-through zoom on the tap, then a vertical scroll
  through the profile. Motion: count-up, push-through, lift, stack. Brand in the scene: the app header (0 to 2.9 s, again from 3.9 s once the
  camera pulls back), the receipts' EZ. marks (to 9 s), the sum card's EZ. strip (from 9.2 s).
  Bed nt-fv9 (m3-electro from 4.839 s, bedx.py): its kick drops at B(6) = 2.93 s, on the push-through. -->
<style>
#gnd{filter:blur(3px) brightness(.8)}
#hl{position:absolute;left:30px;right:30px;top:1172px;height:120px;text-align:center;z-index:70;font:400 108px/1 Anton;letter-spacing:.005em;color:#f8f0d9;text-transform:uppercase}
#hl>div{position:absolute;left:0;right:0;top:0}
#scrim{position:absolute;left:0;right:0;bottom:0;height:330px;z-index:65;pointer-events:none;background:linear-gradient(180deg,rgba(4,7,14,0),rgba(4,7,14,.78) 50%,rgba(4,7,14,.92))}
#pulse{background:radial-gradient(70% 45% at 50% 30%,rgba(253,188,42,.35),transparent 70%)}
#veil{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 45%,rgba(0,0,0,.42),rgba(0,0,0,.25));opacity:0;pointer-events:none;z-index:20}
#lift{z-index:30}
/* the leaderboard in the app */
.lbh{display:flex;padding:0 12px 8px;font:700 10.5px/1 'Geist Mono';letter-spacing:.14em;color:var(--mu2)}.lbh span:first-child{flex:1}.lbh span:nth-child(2){width:46px;text-align:center}.lbh span:last-child{width:96px;text-align:right}
.lr{position:relative;display:flex;align-items:center;gap:10px;height:66px;margin-bottom:8px;padding:0 12px;border-radius:16px;background:rgba(12,16,18,.97);box-shadow:inset 0 0 0 1.5px var(--ln)}
.lr .rk{width:18px;font:400 22px/1 Anton;color:var(--mu)}.lr .nm{flex:1}.lr .nm b{display:block;font:700 17px/1 Inter}.lr .nm small{display:block;margin-top:5px;font:500 11.5px/1 'Geist Mono';color:var(--mu)}
.lr .wl{width:46px;text-align:center;font:400 20px/1 Anton;color:#f8f0d9}.lr .pl{width:96px;text-align:right;font:400 24px/1 Anton;letter-spacing:.01em}
.lr.top{box-shadow:inset 0 0 0 2px rgba(253,188,42,.75),0 0 24px rgba(253,188,42,.18)}.lr.top .rk{color:#fdbc2a}
/* the profile */
.pfh{display:flex;align-items:center;gap:13px;padding:6px 2px 14px}.pfh b{display:block;font:700 26px/1 Inter;letter-spacing:-.02em}.pfh small{display:flex;align-items:center;gap:6px;margin-top:7px;font:500 13px/1 'Geist Mono';color:var(--mu)}
.pfs{display:flex;gap:8px;margin-bottom:12px}.pfs div{flex:1;padding:10px 12px;border-radius:14px;background:rgba(12,16,18,.97);box-shadow:inset 0 0 0 1.5px var(--ln)}
.pfs small{display:block;font:700 10.5px/1 'Geist Mono';letter-spacing:.14em;color:var(--mu)}.pfs b{display:block;margin-top:7px;font:400 26px/1 Anton;letter-spacing:.01em}
.pft{display:flex;gap:16px;margin:2px 2px 12px;font:700 11px/1 'Geist Mono';letter-spacing:.14em;color:var(--mu2)}.pft .on{color:#fdbc2a;box-shadow:0 2px 0 #fdbc2a;padding-bottom:6px}
/* the sum card */
.sum{width:358px;padding:0 18px 18px;border-radius:22px;background:rgba(12,16,18,.97);box-shadow:inset 0 0 0 1.5px var(--ln);overflow:hidden}
.sum .ss{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 -18px 12px;padding:9px 0;background:rgba(253,188,42,.1);box-shadow:inset 0 -1px 0 rgba(253,188,42,.3);font:700 12.5px/1 'Geist Mono';letter-spacing:.16em;color:#fdbc2a}
.sum .sr{display:flex;align-items:center;gap:10px;height:40px;font:600 14px/1 Inter;color:#f8f0d9}.sum .sr img{width:26px;height:26px;border-radius:7px;background:#fff;object-fit:contain}
.sum .sr b{margin-left:auto;font:400 26px/1 Anton;letter-spacing:.01em}.sum .sr i{font-style:normal;font:700 11px/1 'Geist Mono';letter-spacing:.08em;padding:4px 6px;border-radius:6px;color:#04070e}
.sum .tot{display:flex;align-items:center;margin-top:8px;padding-top:12px;border-top:2px solid rgba(248,240,217,.7);font:700 12px/1 'Geist Mono';letter-spacing:.14em;color:var(--mu)}.sum .tot b{margin-left:auto;font:400 40px/1 Anton;color:#03c870}
#endc h3{font-family:Anton;font-weight:400;font-size:150px;letter-spacing:.005em;text-transform:uppercase}
</style>
<div id="st">
<div id="gnd"></div><div id="pulse"></div>
<div id="cam"></div>
<div id="veil"></div><div id="lift"></div>
<div id="scrim"></div><div id="hl"></div>
<div id="td"></div><div id="tr"></div>
<div id="vig"></div><canvas id="grain"></canvas>
</div>
<script src="lib.js"></script><script src="w6/nt/fvb/fvb.js"></script>
<script>
const B = FB.B, n = FB.n, cl = FB.cl, lerp = FB.lerp, eo = FB.eo, eio = FB.eio, spr = FB.spr, DUR = 14.6;
const LINES = [['Grok leads {y Season 2}', -1, B(5.6)], ['See {y why}', B(6.3), B(10.4)], ['Three calls three reasons', B(10.6), B(16.8)], ['Two {g right} one {r wrong}', B(17.2), B(23.6)]];
const T = { tap: B(5), thru: B(6), back: B(7.2), up: [B(10), B(13), B(16)], sum: B(19), end: B(24) };
const ORDER = ['GROK', 'CLAUDE', 'GEMINI', 'QWEN', 'GPT'], CALLS = ['INTU', 'KEYS', 'ESTC'];
let grain, P0 = {};
(async () => {
  await FB.load(`@import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');`, ["400 108px Anton", "400 24px Anton"]);
  const D = FB.D, bd = Object.fromEntries(D.board), wl = k => { const p = D.posts.filter(x => x.k === k); return p.filter(x => x.right).length + '-' + p.filter(x => !x.right).length };
  L.$('#gnd').style.backgroundImage = 'url(w6/nt/fvb/g9.jpg)';
  const lab = k => FB.post(k, 'INTU').lab;
  const board = `<div class="vw" id="vL"><div class="vh"><small>LEADERBOARD</small><b>Season 2</b></div><div class="lbh"><span>MODEL</span><span>W-L</span><span>P&amp;L</span></div>
    ${ORDER.map((k, i) => `<div class="lr${i ? '' : ' top'}" id="lr${k}"><b class="rk">${i + 1}</b>${FB.mark(k, 36)}<div class="nm"><b>${FB.post(k, 'INTU').name}</b><small>${lab(k)}</small></div><div class="wl">${wl(k)}</div><div class="pl ${bd[k] >= 0 ? 'L' : 'S'}" data-v="${bd[k]}">${FB.money(bd[k])}</div></div>`).join('')}</div>`;
  const g = FB.post('GROK', 'INTU');
  const prof = `<div class="vw" id="vP"><div class="pfh">${FB.mark('GROK', 58)}<div><b>Grok</b><small>${FB.flag('US', 18)}xAI</small></div></div>
    <div class="pfs"><div><small>P&amp;L</small><b class="L">${FB.money(bd.GROK)}</b></div><div><small>W-L</small><b>${wl('GROK')}</b></div><div><small>CALLS</small><b>3</b></div></div>
    <div class="pft"><span class="on">CALLS</span><span>LESSONS</span><span>SOURCES</span></div>
    ${CALLS.map(t => FB.postHTML(FB.post('GROK', t), { id: 'g' + t, tail: FB.rcHTML(FB.post('GROK', t)) })).join('')}</div>`;
  L.$('#cam').innerHTML = FB.phoneHTML(board + prof);
  // the sum: the three receipts stacked into the P&L (a glass card with the EZ. strip)
  const hold = document.createElement('div'); hold.style.cssText = 'position:absolute;left:-2000px;top:0';
  hold.innerHTML = `<div class="sum" id="sumc"><div class="ss">${FB.EZ(26)}GROK SEASON 2</div>${CALLS.map(t => { const x = FB.post('GROK', t); return `<div class="sr"><img src="${x.logo}" alt="">${x.co}<i style="background:${x.right ? '#03c870' : '#ff3a31'}">${x.right ? 'RIGHT' : 'WRONG'}</i><b class="${x.pnl >= 0 ? 'L' : 'S'}">${FB.money(x.pnl)}</b></div>` }).join('')}<div class="tot">P&amp;L<b>${FB.money(bd.GROK)}</b></div></div>`;
  document.body.appendChild(hold);
  FB.bug(L.$('#st'));
  L.$('#st').insertAdjacentHTML('beforeend', FB.endHTML('AI profiles', 'Anton'));
  L.$('#hl').innerHTML = LINES.map((l, i) => `<div id="h${i}">${FB.words(l[0])}</div>`).join('');
  grain = L.grain(L.$('#grain'), .05);
  await document.fonts.ready;
  CALLS.forEach(t => FB.mkLift(t, L.$('#g' + t), 'foc')); FB.mkLift('sum', L.$('#sumc')); FB.lifts.sum.el = L.$('#vP .pfs');
  // where Grok's row sits on the phone (unzoomed), so the push-through can centre it
  const w = L.$('.phw'); FB.place(w, { cx: 540, cy: 675, z: 1 }); const pr = w.getBoundingClientRect(), rr = L.$('#lrGROK').getBoundingClientRect(), hr = L.$('.tb img').getBoundingClientRect();
  P0 = { rx: rr.left + rr.width / 2 - (pr.left + pr.width / 2), ry: rr.top + rr.height / 2 - (pr.top + pr.height / 2), hx: hr.left + hr.width / 2 - (pr.left + pr.width / 2), hy: hr.top + hr.height / 2 - (pr.top + pr.height / 2) };
  window.CUES = [[.05, 'r11-swell', .1], ...ORDER.map((_, i) => [B(1) + i * FB.BT / 2, 'r11-pluck', .06]), [T.tap, 'sfx-tap', .14], [T.thru - .1, 'sfx-whoosh', .12], [T.back, 'r11-slide', .07],
    ...T.up.map(a => [a, 'sfx-whoosh', .09]), ...T.up.map(a => [a + FB.BT, 'sfx-stamp', .08]), [T.sum, 'sfx-whoosh', .08], [T.sum + FB.BT * 2, 'sfx-cash', .1], [T.end + .1, 'sfx-chime', .12], [T.end + .6, 'r11-sparkle', .07]];
  window.MUSIC = { f: 'nt-fv9', at: 0 }; window.DUR = DUR;
  await FB.ready();
})().catch(e => { document.title = 'ERR ' + e.message; console.error(e) });

window.R = t => {
  grain(t);
  L.$('#gnd').style.transform = `translateY(${(-30 * n(t, 0, DUR) + 8 * Math.sin(t * .3)).toFixed(1)}px) scale(${(1.06 + .02 * Math.sin(t * .2)).toFixed(4)})`;
  const bp = t < T.thru ? .3 * Math.exp(-((t - FB.PH) % FB.BT) / .2) : Math.exp(-((t - FB.PH) % FB.BT) / .18); L.$('#pulse').style.opacity = (bp * .7).toFixed(3);
  // the camera: a macro on the board (the app header's EZ. logo inside the middle of the frame), the push through Grok's row, a pull back into the profile
  const w = L.$('.phw'), th = eio(n(t, T.thru - .15, T.thru + .45)), bk = eio(n(t, T.back - .1, T.back + .6)), ed = eio(n(t, T.end - .2, T.end + .7));
  const z0 = 1.9 + .04 * n(t, 0, T.tap), zT = 4.2, z1 = 1.62;
  // A: the board, the phone's header logo near (300, 300); B: Grok's row travels to (540, 600) while the zoom grows (the push-through); C: pull back to the profile
  let z, cx, cy;
  if (t < T.back) { z = lerp(z0, zT, th); const X = lerp(600 + P0.rx * z0, 540, th), Y = lerp(950 + P0.ry * z0, 600, th); cx = X - P0.rx * z; cy = Y - P0.ry * z }
  else { z = lerp(zT, z1, bk); cx = lerp(540 - P0.rx * zT, 540, bk); cy = lerp(600 - P0.ry * zT, 860, bk) }
  FB.place(w, { t, cx: cx + 4 * Math.sin(t * .5), cy: cy + 1300 * ed + 4 * Math.sin(t * .6), z, rx: 1.5 * Math.sin(t * .43), ry: 1.8 * Math.sin(t * .51), rz: .3 * Math.sin(t * .37) });
  // the app: the board's rows arrive and count up; on the push-through the screen turns into the profile
  L.$$('#vL .lr').forEach((r, i) => { const a = B(1) + i * FB.BT / 2, k = spr(n(t, a, a + .6)); r.style.opacity = cl(k * 1.8).toFixed(3); r.style.transform = `translateX(${(40 * (1 - k)).toFixed(1)}px)`;
    const pl = r.querySelector('.pl'), v = +pl.dataset.v, c = eo(n(t, a + .1, a + 1.1)); pl.textContent = FB.money(v * c) });
  const sw = eio(n(t, T.thru + .05, T.thru + .4)); L.$('#vL').style.opacity = (1 - sw).toFixed(3); L.$('#vP').style.opacity = sw.toFixed(3); L.$('#vP').style.transform = `translateY(${(40 * (1 - sw)).toFixed(1)}px)`;
  L.$('#lrGROK').style.boxShadow = t >= T.tap ? `inset 0 0 0 ${(2 + 3 * Math.sin(Math.PI * n(t, T.tap, T.tap + .5))).toFixed(2)}px rgba(253,188,42,.95),0 0 30px rgba(253,188,42,.3)` : '';
  // the profile scrolls as each call lifts, so the source stays near the middle
  const scr = 130 * eio(n(t, T.up[1] - .4, T.up[1] + .3)) + 130 * eio(n(t, T.up[2] - .4, T.up[2] + .3)) - 260 * eio(n(t, T.sum - .3, T.sum + .4));
  L.$('#vP').style.top = (-scr).toFixed(1) + 'px';
  // the three calls lift one by one: key clause, then the receipt stamps
  let kk = 0; CALLS.forEach((c, i) => { const a = T.up[i], b = i < 2 ? T.up[i + 1] - .15 : T.sum - .1, o = FB.lifts[c];
    const k = FB.lift(c, t, a, b, () => ({ x: 540, y: 250, z: Math.min(2.25, (1120 - 250) / o.h0) }), { dd: .4 }); kk = Math.max(kk, k);
    FB.sweep(o.hlc, eio(n(t, a + .45, a + 1.1))); const r = o.c.querySelector('.rc'), q = n(t, a + FB.BT, a + FB.BT + .35); r.style.transform = `scale(${(1 + .3 * (1 - eo(q))).toFixed(3)})`; r.style.opacity = t < a + FB.BT ? .25 : 1 });
  // the sum: the three P&Ls stacked into the profile's P&L, the total counts up
  const ks = FB.lift('sum', t, T.sum, T.end - .2, () => ({ x: 540, y: 330, z: 2.2 }), { dd: .4 }); kk = Math.max(kk, ks);
  const sc = FB.lifts.sum.c; sc.querySelectorAll('.sr').forEach((r, i) => { const a = T.sum + .3 + i * .25, k = spr(n(t, a, a + .5)); r.style.opacity = cl(k * 1.8).toFixed(3); r.style.transform = `translateX(${(-30 * (1 - k)).toFixed(1)}px)` });
  const tb = sc.querySelector('.tot b'), tc = eo(n(t, T.sum + 1.1, T.sum + 1.9)); tb.textContent = FB.money(17660 * tc); tb.style.transform = `scale(${(1 + .25 * Math.sin(Math.PI * n(t, T.sum + 1.8, T.sum + 2.3))).toFixed(3)})`; tb.style.display = 'inline-block';
  const dim = cl(kk); L.$('.app').style.filter = dim > .01 ? `blur(${(4 * dim).toFixed(2)}px) brightness(${(1 - .35 * dim).toFixed(3)})` : ''; L.$('#veil').style.opacity = (.75 * dim).toFixed(3);
  FB.touch(0, 0, 0, 0, 0); FB.tap(t, T.tap, L.$('#lrGROK'), 60, 0);
  LINES.forEach((l, i) => FB.rise(L.$('#h' + i), t, l[1], l[2]));
  const fo = (1 - eio(n(t, T.end - .2, T.end + .3))).toFixed(3); FB.lifts.sum.w.style.opacity = fo;
  FB.endR(t, T.end + .1);
};
</script>
