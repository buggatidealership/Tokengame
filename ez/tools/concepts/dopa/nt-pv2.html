<!doctype html><meta charset="utf-8"><title>pv2 tale of the tape</title>
<!-- Night prediction film 2, "Tale of the tape" (2026-11-20). One line: tonight's report is a fight, and the five AIs have picked their corners.
  A painted boxing ring (Hedra, w6/nt/pv/pv2-ring.jpg: the left corner lit green, the right corner red). The fight card on top (the company,
  when it reports); the weigh-in: each AI's card slams into its corner, one a beat (side and called move, confidence); the count slams in the
  middle on the trailer's hit; then each AI's own words in turn, the camera whipping to its corner, the key clause marked; the grading line
  and the logo. Anton (display) and Barlow Condensed (everything else). Bed m1-trailer (120 BPM, hits every 8 beats), entered at 4 s so a hit
  lands on the count. ?co=INTU|KEYS|ESTC. window.R(t), READY, DUR, MUSIC, CUES. No outcome anywhere. -->
<style>
#cam{position:absolute;left:-60px;top:-75px;width:1200px;height:1500px;transform-origin:600px 750px}
#ring{position:absolute;inset:0;width:1200px;height:1500px;object-fit:cover}
#haze{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 60% at 50% 46%,transparent 45%,rgba(0,0,0,.7));z-index:5}
#card{position:absolute;left:44px;right:44px;top:132px;height:178px;z-index:30;display:flex;align-items:center;gap:26px;padding:0 30px;
  background:linear-gradient(180deg,rgba(4,7,14,.86),rgba(4,7,14,.78));border-radius:6px;box-shadow:inset 0 0 0 2px rgba(253,188,42,.55),0 20px 50px rgba(0,0,0,.6)}
#card .me{position:absolute;left:30px;top:-17px;font:400 26px/1 Anton;letter-spacing:.18em;color:#04070e;background:#fdbc2a;padding:6px 14px 5px;border-radius:3px}
#card .co{font:400 116px/1 Anton;letter-spacing:.01em;color:#f8f0d9;text-transform:uppercase;white-space:nowrap}
#card .wh{margin-left:auto;text-align:right;font:600 38px/1.08 'Barlow Condensed';color:#f8f0d9;font-style:italic;white-space:nowrap}
#card .wh b{display:block;font:800 54px/1 'Barlow Condensed';font-style:normal;letter-spacing:.02em}
.col{position:absolute;top:418px;width:486px;z-index:20}
#cL{left:104px}#cS{right:104px}
.col h3{display:flex;align-items:center;gap:14px;height:52px;font:400 40px/1 Anton;letter-spacing:.12em;margin:0 0 14px 4px;text-shadow:0 4px 20px rgba(0,0,0,.8)}
.col h3 .cn{display:inline-grid;place-items:center;height:52px;border-radius:6px;color:#04070e;font:400 44px/1 Anton;letter-spacing:0;text-shadow:none;overflow:hidden}
.fc{position:relative;height:134px;margin-bottom:14px;display:grid;grid-template-columns:86px 1fr;grid-template-rows:auto auto;column-gap:18px;align-items:center;padding:14px 20px;
  background:linear-gradient(100deg,rgba(4,7,14,.9),rgba(4,7,14,.74));border-radius:6px;box-shadow:inset 0 0 0 2px rgba(248,240,217,.12),0 16px 34px rgba(0,0,0,.55);transform-origin:50% 50%}
.fc .pvm{grid-row:1/3}
.fc .nm{font:400 50px/1 Anton;color:#f8f0d9;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:baseline;gap:16px}
.fc .nm small{font:600 30px/1 'Barlow Condensed';letter-spacing:.04em;color:rgba(248,240,217,.75)}
.fc .sd{font:800 46px/1 'Barlow Condensed';letter-spacing:.02em;white-space:nowrap;margin-top:6px;font-variant-numeric:tabular-nums}
.fc .lit{position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 4px #fdbc2a,0 0 40px rgba(253,188,42,.45);opacity:0;pointer-events:none}
.fc .bar{position:absolute;top:0;bottom:0;width:10px;border-radius:6px 0 0 6px}
#cL .fc .bar{left:0}#cS .fc .bar{right:0;border-radius:0 6px 6px 0}
#ct{position:absolute;left:0;right:0;top:470px;text-align:center;z-index:40;pointer-events:none}
#ct .n{display:inline-flex;align-items:center;gap:40px;font:400 330px/1 Anton;text-shadow:0 20px 60px rgba(0,0,0,.8)}
#ct .n i{font-style:normal;font-size:150px;color:#f8f0d9}
#ct .l{display:flex;justify-content:center;gap:200px;margin-top:4px;font:400 60px/1 Anton;letter-spacing:.14em}
#tally{position:absolute;right:74px;top:270px;z-index:35;font:400 40px/1 Anton;letter-spacing:.06em;padding:8px 16px 6px;background:#04070e;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(253,188,42,.6);white-space:nowrap}
#q{position:absolute;left:44px;right:44px;top:1052px;height:256px;z-index:45;padding:26px 34px;border-radius:6px;overflow:hidden;
  background:linear-gradient(180deg,rgba(248,240,217,.97),rgba(240,229,200,.97));box-shadow:0 24px 60px rgba(0,0,0,.65)}
#q .who{display:flex;align-items:center;gap:16px;font:400 40px/1 Anton;letter-spacing:.06em;color:#04070e}
#q .who span.s{font:800 34px/1 'Barlow Condensed';letter-spacing:.04em;padding:6px 12px 4px;border-radius:4px;color:#04070e}
#q .who em{margin-left:auto;font:600 26px/1 'Barlow Condensed';letter-spacing:.14em;color:rgba(4,7,14,.55);font-style:normal;text-transform:uppercase}
#q .cl{margin-top:20px;font:700 76px/1.04 'Barlow Condensed';font-style:italic;color:#04070e;letter-spacing:-.005em}
#end{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(55% 40% at 50% 45%,rgba(253,188,42,.22),transparent 70%),rgba(4,7,14,.9);opacity:0}
#end b{font:400 96px/1 Anton;letter-spacing:.04em;color:#f8f0d9}#end b i{font-style:normal}
#end span{font:600 46px/1 'Barlow Condensed';font-style:italic;color:#f8f0d9}
#flash{position:absolute;inset:0;background:#f8f0d9;mix-blend-mode:overlay;opacity:0;z-index:60;pointer-events:none}
</style>
<div id="cam"><img id="ring" src="w6/nt/pv/pv2-ring.jpg"><div id="haze"></div>
  <div class="col" id="cL"></div><div class="col" id="cS"></div></div>
<div id="vig"></div>
<div id="card"></div>
<div id="ct"></div><div id="q"></div><div id="flash"></div><div id="end"></div>
<div id="bugw"></div><canvas id="grain"></canvas>
<script src="w6/nt/pv/pv.js"></script>
<script>
const G = PV.grid(120, .02), B = G.B, AT = 4.0;   // m1-trailer: 120 BPM, first beat at 0.02 s; entered at 4.0 s so its hits land on film beats 8, 16, 24, 32
let T = {}, ord, weigh, grain, fcs = {};
(async () => {
  await PV.load('INTU', 'https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap');
  PV.$('#bugw').innerHTML = PV.bug();
  PV.$('#card').innerHTML = `<span class="me">MAIN EVENT</span>${PV.coLogo(112)}<span class="co">${PV.esc(PV.co.co)}</span><span class="wh"><b>REPORTS ${PV.co.callDay.toUpperCase()}</b>after the close</span>`;
  // the weigh-in order: by corner, the bigger corner first; the words alternate the corners (PV.alt)
  weigh = [...PV.calls.filter(x => x.side === PV.maj), ...PV.calls.filter(x => x.side !== PV.maj)];
  ord = PV.alt();
  const col = side => `<h3 style="color:${side === 'LONG' ? PV.C.green : PV.C.red}"><b class="cn" style="background:${side === 'LONG' ? PV.C.green : PV.C.red}">${side === 'LONG' ? PV.nL : PV.nS}</b>${side} CORNER</h3>` + PV.calls.filter(x => x.side === side).sort((a, b) => b.conf - a.conf).map(x =>
    `<div class="fc" data-k="${x.k}"><i class="bar" style="background:${PV.side(x)}"></i>${PV.mark(x.k, 86, 'box-shadow:0 0 0 3px rgba(248,240,217,.2)')}<span class="nm">${x.name}<small>${x.conf}% confident</small></span>
      <span class="sd" style="color:${PV.side(x)}">${PV.call(x)}</span><i class="lit"></i></div>`).join('');
  PV.$('#cL').innerHTML = col('LONG'); PV.$('#cS').innerHTML = col('SHORT');
  PV.$$('.fc').forEach(e => fcs[e.dataset.k] = e);
  PV.$('#ct').innerHTML = `<div class="n"><span style="color:${PV.C.green}">${PV.nL}</span><i>v</i><span style="color:${PV.C.red}">${PV.nS}</span></div><div class="l"><span style="color:${PV.C.green}">LONG</span><span style="color:${PV.C.red}">SHORT</span></div>`;
  PV.$('#end').innerHTML = `${PV.logo(300)}<b><i style="color:${PV.C.green}">E</i>ARNINGS <i style="color:${PV.C.red}">Z</i>EASON</b><span>${PV.graded}</span>`;
  grain = PV.grain(PV.$('#grain'), .07);
  // the timeline in beats: the card, the weigh-in one a beat, the count on the hit (beat 8), the words (5 or 6 beats each), the end card
  const len = ord.map(x => PV.need(x.clause) > 2.9 ? 6 : 5), starts = []; let b = 10; len.forEach(l => { starts.push(b); b += l });
  T = { weigh: weigh.map((_, i) => 2 + i), count: 8, starts, len, end: b, dur: b + 5 };
  window.TL = { count: +G.at(8).toFixed(3), starts: starts.map(s => +G.at(s).toFixed(3)), end: +G.at(b).toFixed(3), dur: +G.at(T.dur).toFixed(3) };
  window.HOLD = ord.map((x, i) => ({ k: x.k, clause: x.clause, need: +PV.need(x.clause).toFixed(2), onScreen: +((len[i] - .8) * B).toFixed(2) }));
  window.CUES = [[.04, 'r11-swell', .1], [G.at(.5), 'sfx-strike', .1]];
  T.weigh.forEach(w => CUES.push([G.at(w), 'sfx-stamp', .14], [G.at(w) + .01, 'r11-thump', .1]));
  CUES.push([G.at(8), 'sfx-bell', .16], [G.at(8) + .01, 'sfx-boom', .14]);
  starts.forEach((s, i) => CUES.push([G.at(s), 'sfx-whoosh', .12], [G.at(s + .5), 'r11-card', .08]));
  CUES.push([G.at(b), 'sfx-bell', .12]);
  window.MUSIC = { f: 'm1-trailer', at: AT }; window.DUR = +(G.at(T.dur) + .0).toFixed(3);
  await PV.ready(['400 100px Anton', '800 46px "Barlow Condensed"', 'italic 700 76px "Barlow Condensed"', '600 38px "Barlow Condensed"']);
  await PV.go();
})();
let qk = '';
const fillQ = x => { if (qk === x.k) return; qk = x.k;
  PV.$('#q').innerHTML = `<div class="who">${PV.mark(x.k, 58)}${x.name.toUpperCase()}<span class="s" style="background:${PV.side(x)}">${PV.call(x)}</span><em>In its own words</em></div><div class="cl">${PV.words(x.clause)}</div>` };
window.R = t => {
  grain(t); const k = G.beat(t);
  const cur = T.starts.filter(s => k >= s).length - 1, inW = cur >= 0 && k < T.end, sp = inW ? ord[cur] : null;
  // the camera: a slow push over the ring, a whip to the speaker's corner, punches on the hits
  const punch = d => { const x = k - d; return x < 0 ? 0 : .045 * Math.exp(-3.5 * x) };
  let px = 0, sc = 1.02 + .02 * Math.sin(t * .5);
  if (k < 2) sc = 1.16 - .14 * PV.eo(PV.n(k, 0, 2));
  if (inW) { const side = sp.side === 'LONG' ? 1 : -1, prev = cur ? (ord[cur - 1].side === 'LONG' ? 1 : -1) : 0, w = PV.eio(PV.n(k, T.starts[cur], T.starts[cur] + .5));
    px = 46 * PV.lerp(prev, side, w); sc = 1.05 + .03 * PV.n(k, T.starts[cur], T.starts[cur] + T.len[cur]) }
  sc += punch(8) + punch(16) + punch(24) + punch(32) + punch(T.end);
  T.weigh.forEach(w => sc += .4 * punch(w));
  const shake = k >= 8 && k < 8.6 ? 10 * Math.exp(-6 * (k - 8)) * Math.sin(k * 40) : 0;
  PV.$('#cam').style.transform = `translate(${(px + shake + 10 * Math.sin(t * .8)).toFixed(1)}px,${(6 * Math.sin(t * .6)).toFixed(1)}px) scale(${sc.toFixed(4)})`;
  // the spotlight haze breathes on the beat
  const ph = ((k % 1) + 1) % 1; PV.$('#haze').style.background = `radial-gradient(34% 40% at ${50 + 3 * Math.sin(t * .7)}% 24%,rgba(253,188,42,${(.16 + .14 * Math.exp(-5 * ph)).toFixed(3)}),transparent 70%)`;
  // the fight card: in from the top on the first beat
  const c0 = PV.n(k, 0, .8); PV.$('#card').style.transform = `translateY(${(-60 * (1 - PV.eo5(c0))).toFixed(1)}px) scale(${PV.lerp(1.08, 1, PV.eo5(c0)).toFixed(3)})`; PV.$('#card').style.opacity = PV.cl(c0 * 2) * (1 - PV.n(k, T.end, T.end + .6));
  // the corner labels and the weigh-in: each card slams in on its beat
  PV.$$('.col h3').forEach(h => h.style.opacity = PV.n(k, 1.4, 2).toFixed(3));
  weigh.forEach((x, i) => { const e = fcs[x.k], w = T.weigh[i], a = PV.n(k, w - .3, w), s = PV.n(k, w, w + .5), dir = x.side === 'LONG' ? -1 : 1;
    e.style.opacity = a > 0 ? PV.cl(a * 2).toFixed(3) : 0;
    e.style.transform = `translateX(${(dir * 260 * (1 - PV.eo5(a))).toFixed(1)}px) scale(${(1 + .12 * Math.sin(Math.PI * s)).toFixed(3)}) rotate(${(dir * 4 * (1 - PV.eo(a))).toFixed(2)}deg)`;
    const spk = sp && sp.k === x.k, li = spk ? PV.eo(PV.n(k, T.starts[cur], T.starts[cur] + .5)) : 0;
    e.querySelector('.lit').style.opacity = li.toFixed(3);
    e.style.filter = inW && !spk ? `brightness(${(1 - .45 * PV.n(k, T.starts[0], T.starts[0] + .6)).toFixed(3)})` : '' });
  // the count: slams in the middle on the hit, then goes up into the tally on the fight card
  const ct = PV.$('#ct'), a = PV.n(k, 8, 8.35), o = PV.n(k, 9.4, 10);
  ct.style.opacity = (a > 0 ? 1 : 0) * (1 - o); ct.style.transform = `translateY(${(-180 * PV.ei(o)).toFixed(1)}px) scale(${(PV.lerp(2.2, 1, PV.eo5(a)) * PV.lerp(1, .3, PV.ei(o))).toFixed(3)})`;
  PV.$('#flash').style.opacity = k >= 8 ? (.6 * Math.exp(-6 * (k - 8))).toFixed(3) : 0;
  const ty = PV.n(k, 9.4, 10); PV.$$('.col h3 .cn').forEach(e => { e.style.width = (52 * PV.eo5(ty)).toFixed(1) + 'px'; e.style.opacity = ty > 0 ? 1 : 0; e.style.marginRight = ty > 0 ? '' : '-14px' });
  // the words: the speaker's quote card under the corners, the clause marked
  const q = PV.$('#q');
  if (inW) { fillQ(sp); const s0 = T.starts[cur], l = T.len[cur], qa = PV.n(k, s0, s0 + .45), qo = PV.n(k, s0 + l - .35, s0 + l);
    const dir = sp.side === 'LONG' ? -1 : 1; q.style.opacity = (PV.cl(qa * 2) * (1 - (cur === ord.length - 1 ? PV.n(k, T.end, T.end + .4) : qo))).toFixed(3);
    q.style.transform = `translateX(${(dir * 140 * (1 - PV.eo5(qa)) - dir * 100 * PV.ei(cur === ord.length - 1 ? 0 : qo)).toFixed(1)}px) rotate(${(dir * -.6).toFixed(2)}deg)`;
    PV.sweep(q.querySelector('.cl'), PV.eio(PV.n(k, s0 + .9, s0 + 2.6)));
    const cl = q.querySelector('.cl'); cl.style.opacity = PV.n(k, s0 + .3, s0 + .7).toFixed(3) }
  else q.style.opacity = 0;
  // the end card
  const ce = PV.n(k, T.end, T.end + .7), en = PV.$('#end'); en.style.opacity = ce.toFixed(3);
  en.querySelector('img').style.transform = `scale(${(1.2 - .2 * PV.eo5(ce) + .02 * Math.exp(-5 * (((k % 1) + 1) % 1))).toFixed(3)})`;
};
</script>
