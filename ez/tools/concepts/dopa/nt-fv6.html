  Story (a flashback, true to calls.csv and ez-data.js): Grok's Intuit post (SHORT) on the feed; a tap on its new "What it learned" row scrubs
  the app back a day to Season 1's last round, NVIDIA (all four LONG, −2.89% at the Nov 18 close, Grok's P&L −$2,890, row 112); Grok's notebook
  shows the lessons filter it quoted in its Intuit reasoning, verbatim, naming the NVDA example (journal receipt: 28 dated entries); on the drop
  the app scrubs forward and the lesson docks into the Intuit post; the same filter sits in its Keysight post (both verbatim from
  other_reasoning); the date rolls to the Nov 20 close and both posts take their receipts (RIGHT, P&L +$12,790 and +$7,070; research F2.10: a

  Ground: a painted slate (Hedra, w6/nt/fvb/g6.jpg). Type: Instrument Serif (our lines, italic) and Geist Mono (dates, labels); the bug is the
  house logotype. Camera: horizontal whip scrubs through time with a rolling date chip, pushes in between. Brand in the scene: the app header
  (0 to 1 s), the notebook's EZ. strip (from 5.1 s), the receipts' EZ. marks (from 11.7 s). Bed m3-electro uncut: its kick drops at B(16) = 7.77 s,

    set('.wilx', st.w ? 'auto' : '0px'); set('.rcx', st.r ? 'auto' : '0px'); set('.pqx', st.q ? 'auto' : '0px'); const h = o.c.offsetHeight; set('.wilx', '0px'); set('.rcx', '0px'); set('.pqx', 'auto'); o.w.style.display = 'none'; return h };
  const P = FB.lifts.post, K = FB.lifts.keys;
  Z.one = Math.min(1.9, (1090 - 390) / hOf(P, { w: 1, q: 1 })); Z.front = Math.min(1.6, (1095 - 530) / hOf(K, { w: 1, q: 1 }));
  Z.two = Math.min(1.36, (1090 - 440) / Math.max(hOf(P, { w: 1, r: 1 }), hOf(K, { w: 1, r: 1 })));   // side by side at the grade
  window.CUES = [[.05, 'r11-swell', .1], [T.lift1, 'sfx-whoosh', .09], [T.tap, 'sfx-tap', .13], [T.back, 'sfx-whoosh', .12], [T.nv, 'r11-card', .08],

function views(t) {   // the app's views: the feed (A), Season 1 (B), Grok's notebook (C); each scrub slides the screen sideways
  const toB = eio(n(t, T.back, T.back + .5)), toC = eio(n(t, T.note - .2, T.note + .3)), toA = eio(n(t, T.fwd, T.fwd + .5));

  L.$('#vC').style.transform = `translateX(${(-420 * (1 - toC) + 420 * toA).toFixed(1)}px)`; L.$('#vC').style.opacity = t < T.note - .2 ? 0 : 1;

  const H = (s, o) => document.querySelectorAll(s).forEach(x => x.style.height = (OPEN[s] * o).toFixed(2) + 'px');
  H('#xI', eio(n(t, T.fwd + .3, T.fwd + .8))); H('#xK', eio(n(t, T.keys - .2, T.keys + .3)));
  const g = eio(n(t, T.grade, T.grade + .5)); H('#qI', 1 - g); H('#qK', 1 - g); H('#rI', eio(n(t, T.grade + FB.BT - .15, T.grade + FB.BT + .3))); H('#rK', eio(n(t, T.grade + 2 * FB.BT - .15, T.grade + 2 * FB.BT + .3)));
}
window.R = t => {
  grain(t);
  // the ground: the slate slides against every scrub (a whip); the kick lights it after the drop
  const sb = eio(n(t, T.back, T.back + .5)), sf = eio(n(t, T.fwd, T.fwd + .5)), sg = eio(n(t, T.grade, T.grade + .5));

  const bp = t < B(16) ? .25 * Math.exp(-((t - FB.PH) % FB.BT) / .2) : Math.exp(-((t - FB.PH) % FB.BT) / .18); L.$('#pulse').style.opacity = (bp * .8).toFixed(3);
  const whipK = a => Math.sin(Math.PI * n(t, a - .05, a + .55)); L.$('#scrub').style.opacity = (.9 * Math.max(whipK(T.back), whipK(T.fwd), .7 * whipK(T.grade))).toFixed(3);
  // the phone: on screen from frame 0, its header (the EZ. logo, Earnings Zeason) in the middle of the frame; a slow push; it whips with each scrub; it leaves before the end
  const whip = 26 * Math.sin(Math.PI * n(t, T.back, T.back + .5)) - 26 * Math.sin(Math.PI * n(t, T.fwd, T.fwd + .5)), end = eio(n(t, T.end - .2, T.end + .7));
  FB.place(L.$('.phw'), { t, cx: 540 + whip + 6 * Math.sin(t * .4), cy: 690 - 14 * n(t, 0, 1.2) + 1150 * end + 5 * Math.sin(t * .6), z: 1.15 + .05 * n(t, 0, T.end), rx: 2.5 + 1.5 * Math.sin(t * .43), ry: 2.6 * Math.sin(t * .51 + .6) + whip * .12, rz: .4 * Math.sin(t * .37) });
  views(t);
  // the date chip: Nov 19 (Season 2) back to Nov 18 (Season 1), forward to Nov 19, then the Nov 20 close
  let y = 0; DATES.forEach((d, i) => { if (i) y = lerp(y, i * 96, eio(n(t, d[2] + .05, d[2] + .45))) }); L.$('#date .st').style.transform = `translateY(${(-y).toFixed(1)}px)`;
  L.$('#date').style.transform = `scale(${(1 + .12 * Math.max(whipK(T.back), whipK(T.fwd), whipK(T.grade))).toFixed(3)})`;
  // lifts: Grok's Intuit post, Season 1's NVIDIA card (then a thumbnail, the memory), the notebook page, the post again with its lesson, the Keysight post
  const k1 = FB.lift('post', t, T.lift1, T.back, () => ({ x: 540, y: 210, z: 2.2 }), { dd: .45 });
  const kn = FB.lift('nv', t, T.nv, T.end - .2, tt => { const sh = eio(n(tt, T.note - .5, T.note + .2)); return { x: lerp(540, 908, sh), y: lerp(250, 172, sh), z: lerp(2.2, .5, sh), r: 2.5 * sh } }, { du: .6, wob: .2 });
  const ko = FB.lift('note', t, T.note, T.fwd, () => ({ x: 520, y: 430, z: 2.05 }), { dd: .45 });
  const fr = eio(n(t, T.keys, T.keys + .6)), gr = eio(n(t, T.grade, T.grade + .7));

  const k2 = t >= T.fwd ? FB.lift('post', t, T.fwd + .1, T.end - .2, () => ({ x: lerp(lerp(520, 300, fr), xs, gr), y: lerp(lerp(390, 160, fr), 440, gr), z: lerp(lerp(Z.one, .7, fr), Z.two, gr) }), { du: .7, float: 3 }) : 0;
  const k3 = FB.lift('keys', t, T.keys, T.end - .2, () => ({ x: lerp(600, xs2, gr), y: lerp(530, 440, gr), z: lerp(Z.front, Z.two, gr) }), { du: .7, float: 0 });
  FB.lifts.post.c.style.opacity = (1 - .45 * fr * (1 - gr)).toFixed(3);
  // Season 1's card: the move stamps, then Grok's row trades its side for its P&L
  [L.$('#nvc'), FB.lifts.nv.c].forEach(card => { const mv = card.querySelector('.nvm'), q = n(t, T.mv, T.mv + .35); mv.style.transform = `scale(${(1 + .6 * (1 - eo(q))).toFixed(3)})`; mv.style.opacity = t < T.mv ? 0 : 1;
    card.querySelectorAll('.ar').forEach((r, i) => { const a = T.nv + .15 + i * .1, k = spr(n(t, a, a + .55)); r.style.opacity = cl(k * 1.8).toFixed(3); r.style.transform = `translateX(${(36 * (1 - k)).toFixed(1)}px)`;
      const pq = eio(n(t, T.pop, T.pop + .35)), on = r.dataset.k === 'GROK'; r.querySelector('.sd').style.opacity = on ? (1 - pq).toFixed(3) : 1; r.querySelector('.pl').style.opacity = on ? pq.toFixed(3) : 0;

};
// the thread: from the NVIDIA thumbnail (the memory) into the lesson inside each post
function thread(t) {
  const p1 = L.$('#th1'), p2 = L.$('#th2'), d = L.$('#thd');

    path.setAttribute('d', `M${cx.toFixed(1)} ${cy.toFixed(1)} C${(cx - 30).toFixed(1)} ${(cy + 170).toFixed(1)} ${(tx + 140).toFixed(1)} ${(ty - 50).toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)}`);
