  Message: Grok kept a lesson from its NVIDIA loss and used it on its next two calls; they learn in public.
  Story (a flashback, true to calls.csv): Grok's Intuit post (SHORT) on the feed; a tap on its new "What it learned" row scrubs the app back a day
  to Season 1's last round, NVIDIA (all four LONG, NVIDIA −2.89%, Grok's P&L −$2,890, ez-data.js row 112); Grok's notebook page shows the
  lessons filter it quoted in its Intuit reasoning, verbatim, naming the NVDA example; on the drop the app scrubs forward and the lesson docks into
  the Intuit post, then the same filter in its Keysight post (both verbatim from other_reasoning). No outcome is claimed: the film shows the loop,
  not a score. Ground: a painted slate (Hedra, w6/nt/fvb/g6.jpg). Type: Instrument Serif (our lines, italic) and Geist Mono (dates, labels).
  Camera: horizontal whip scrubs through time with the date chip rolling, pushes in between. Bed m3-electro uncut: its kick drops at B(16) =

FB.ready0 = Promise.resolve();

// the app's views: feed (A), Season 1 (B), Grok's notebook (C); which one shows, and the scrub between them
function views(t) {

  b.style.transform = `translateX(${(-420 * (1 - toB) + 420 * toC).toFixed(1)}px)`; b.style.opacity = t < T.back ? 0 : 1;
  c.style.transform = `translateX(${(-420 * (1 - toC) + 420 * toA).toFixed(1)}px)`; c.style.opacity = t < T.note - .2 ? 0 : 1;
  // the feed: posts arrive; later the list moves so the Keysight post is in view
  L.$$('#vA .post').forEach((p, i) => { const k = spr(n(t, .05 + i * .12, .75 + i * .12)); p.style.transform = `translateY(${(50 * (1 - k)).toFixed(1)}px)`; p.style.opacity = cl(k * 2).toFixed(3) });
  // the What it learned rows open on the dock (in the phone and on the glass alike)
  [['#xI', T.fwd + .3], ['#xK', T.keys - .2]].forEach(([s, a0]) => { const o = eio(n(t, a0, a0 + .5)); document.querySelectorAll(s).forEach(x => x.style.height = (OPEN[s] * o).toFixed(2) + 'px') });
}
window.R = t => {
  grain(t);
  // the ground: the slate slides against every scrub (a whip), the kick lights it from the upper right after the drop
  const sb = eio(n(t, T.back, T.back + .5)), sf = eio(n(t, T.fwd, T.fwd + .5)), gx = 60 * sb - 60 * sf + 10 * Math.sin(t * .3);
  L.$('#gnd').style.transform = `translate(${gx.toFixed(1)}px,${(6 * Math.sin(t * .23)).toFixed(1)}px) scale(${(1.04 + .015 * n(t, 0, DUR)).toFixed(4)})`;
  const bp = t < B(16) ? .25 * Math.exp(-((t - FB.PH) % FB.BT) / .2) : Math.exp(-((t - FB.PH) % FB.BT) / .18); L.$('#pulse').style.opacity = (bp * .8).toFixed(3);
  const sc = Math.max(Math.sin(Math.PI * n(t, T.back - .05, T.back + .55)), Math.sin(Math.PI * n(t, T.fwd - .05, T.fwd + .55))); L.$('#scrub').style.opacity = (sc * .9).toFixed(3);
  // the phone: in from below, a slow push; it whips with each scrub; at the end it steps back
  const ent = spr(n(t, 0, 1)), whip = 26 * Math.sin(Math.PI * n(t, T.back, T.back + .5)) - 26 * Math.sin(Math.PI * n(t, T.fwd, T.fwd + .5)), end = eio(n(t, T.end, T.end + .9));
  FB.place(L.$('.phw'), { t, cx: 540 + whip + 6 * Math.sin(t * .4), cy: 650 + 500 * (1 - ent) + 700 * end + 6 * Math.sin(t * .6), z: 1.0 + .06 * n(t, 0, T.end), rx: 3 + 1.5 * Math.sin(t * .43), ry: 3 * Math.sin(t * .51 + .6) + whip * .12, rz: .4 * Math.sin(t * .37) });
  views(t);
  // the date chip: Nov 19 (Season 2) rolls back to Nov 18 (Season 1) and forward again
  const dB = eio(n(t, T.back + .05, T.back + .45)), dF = eio(n(t, T.fwd + .05, T.fwd + .45)), dd = t < T.fwd ? dB : 1 - dF;
  L.$('#d9').style.transform = `translateY(${(-44 * dd).toFixed(1)}px)`; L.$('#d8').style.transform = `translateY(${(44 - 44 * dd).toFixed(1)}px)`;
  L.$('#ds2').style.transform = `translateY(${(-26 * dd).toFixed(1)}px)`; L.$('#ds1').style.transform = `translateY(${(26 - 26 * dd).toFixed(1)}px)`;
  L.$('#date').style.transform = `scale(${(1 + .12 * Math.max(Math.sin(Math.PI * n(t, T.back, T.back + .5)), Math.sin(Math.PI * n(t, T.fwd, T.fwd + .5)))).toFixed(3)})`;
  // lifts: Grok's Intuit post (before the scrub, then again after it with the lesson open), Season 1's NVIDIA card, the notebook page, the Keysight post
  const P = FB.lifts.post, NV = FB.lifts.nv, NO = FB.lifts.note, KE = FB.lifts.keys;

  const k2 = t >= T.fwd ? FB.lift('post', t, T.fwd + .1, T.end, () => ({ x: xc, y: y0, z: zA }), { du: .7, float: 3 }) : 0;
  const k3 = FB.lift('keys', t, T.keys, T.end, () => { const b = FB.lifts.post.c.getBoundingClientRect(); return { x: xc, y: b.bottom + 22, z: zA } }, { du: .7, float: 0 });

  [L.$('#nvc'), NV.c].forEach(card => { const mv = card.querySelector('#nvm') || card.querySelector('.mv b'); const q = n(t, T.mv, T.mv + .35); mv.style.display = 'inline-block'; mv.style.transform = `scale(${(t < T.mv ? 0 : 1 + .5 * (1 - eo(q))).toFixed(3)})`; mv.style.opacity = t < T.mv ? 0 : 1;

      const pq = eio(n(t, T.pop, T.pop + .35)), on = r.dataset.k === 'GROK'; r.querySelector('.sd').style.opacity = on ? (1 - pq).toFixed(3) : 1; r.querySelector('.pl').style.opacity = on ? pq.toFixed(3) : 0;

  if (t >= T.end) [P, KE].forEach(o => { o.w.style.opacity = (1 - eio(n(t, T.end, T.end + .5))).toFixed(3) }); else [P, KE].forEach(o => o.w.style.opacity = 1);

};
function thread(t) {
  const p1 = L.$('#th1'), p2 = L.$('#th2'), d = L.$('#thd');
  const on = t >= T.mark + .4 && t < T.end + .4, f = 1 - eio(n(t, T.end, T.end + .4));

  const r = (el) => { const b = el.getBoundingClientRect(); return [b.left + b.width / 2, b.top + b.height / 2, b] };

  if (t < T.fwd) { const h = FB.lifts.note.hlc; if (!h) return; const [x, y, b] = r(h); const g = eio(n(t, T.mark + .4, T.mark + 1.2));
    p1.setAttribute('d', `M${b.left.toFixed(1)} ${(b.bottom + 8).toFixed(1)} L${(b.left + (b.right - b.left) * g).toFixed(1)} ${(b.bottom + 8).toFixed(1)}`); p1.style.opacity = f; p2.setAttribute('d', ''); d.setAttribute('r', 0); return }
