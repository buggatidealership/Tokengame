  tower for both leaderboards, the season as a race trace with a lower third calling the leader as it changes.
  Bed w6-broadcast: 150 BPM, beat every 0.4 s from 0.025 s, drops at 12.825 s (the chart finishes) and 25.625 s (the winner lands).
  Five messages: 1 brand open   2 4 AIs, 112 earnings trades, long or short, $100K on every trade   3 the season's P&L chart, live
  4 the P&L leaderboard, then the accuracy leaderboard (Kimi relegated)   5 Grok wins Season 1, P&L +$169,450, Season 2 soon, the logo.
  Every number from data/wrap.json. Pure function of t: window.R(t).

<script>
const q = new URLSearchParams(location.search);
const BT = .4, B0 = .025, b = n => +(B0 + n * BT).toFixed(3), DUR = 33.2, DROP1 = b(32), DROP2 = b(64);
// shots (every one on a beat): open | 4 AIs | 112 earnings trades | long or short | chart opens | Grok takes the lead | the run home |
// the drop: final P&L | P&L tower 4th to 2nd | its leader | accuracy tower | its bars | relegated | the winner | its total | the logo close
const SHOTS = [0, 3, 7, 13, 18, 24, 28, 32, 36, 43, 49, 55, 59, 64, 69, 75].map((n, i) => i ? b(n) : 0);
const A = [0, b(3), b(7), b(13), b(18), b(36), b(49), b(64), b(75), DUR + 9];     // scene starts
const TR = [null, ['wipeR', .3], ['pushL', .26], ['pushL', .24], ['doors', .34], ['pushU', .26], ['wipeL', .3], ['slam', .02], ['wipeR', .3]];
const TAN = Math.tan(12 * Math.PI / 180), SL = 1350 * TAN;
const GN = '#55d6a2', RD = '#e8576b', AU = '#fdbc2a', CR = '#f2ede6', BK = '#04070e';
const COL = { GROK: '#fdbc2a', CLAUDE: '#55d6a2', GPT: '#f2ede6', KIMI: '#e8576b' };   // one line colour per AI, the leader gold
const S = { sc: [] }, C = []; let t = 0, D, grain;
const add = (h, p) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };
const vis = (el, on) => { el.style.visibility = on ? 'visible' : 'hidden' };
const tx = (el, x, y = 0, s = 1, ex = '') => { el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)` + (s !== 1 ? ` scale(${s.toFixed(4)})` : '') + ex };
const enter = (el, t0, dx, dy = 0, dur = .24, s = 1) => { const k = L.eo5(L.n(t, t0, t0 + dur)); vis(el, t >= t0); tx(el, dx * (1 - k), dy * (1 - k), s); return k };
const beat = () => { const u = t - B0, n = Math.floor(u / BT); return [n, u - n * BT] };
const kick = (d = 10) => Math.exp(-d * beat()[1]);
const mod = (x, p) => ((x % p) + p) % p;
const Kf = v => { const k = Math.round(Math.abs(v) / 1000); return k ? (v < 0 ? '−' : '+') + '$' + k + 'K' : '$0' };
const meter = (x0, x1, y, h, wf = .56) => { const p = (x1 - x0) / 112, w = p * wf, o = h * TAN; return `<svg class="ov mt">${Array.from({ length: 112 }, (_, i) => { const x = x0 + i * p; return `<path d="M${(x + o).toFixed(1)} ${y}h${w.toFixed(1)}L${(x + w).toFixed(1)} ${y + h}h${(-w).toFixed(1)}Z"/>` }).join('')}</svg>` };
const lit = (m, n, on = AU, off = 'rgba(242,237,230,.16)', head = -9, hc = '#fff6dc') => { const ps = m.children; for (let i = 0; i < 112; i++) ps[i].style.fill = Math.abs(i - head) < 3 ? hc : i < n ? on : off };
const foil = (el, u, per = 1.6) => { el.style.backgroundPosition = `${(100 - 100 * L.n(mod(u, per), .1, .9)).toFixed(1)}% 0` };

function build() {
  const cam = L.$('#cam'), lt = L.$('#lt'), KS = Object.keys(D.s), AI = k => D.ai.find(a => a.k === k), win = D.ai[0], N = D.total;
  const G = S.g = { sa: L.$('#gnd .sa'), sb: L.$('#gnd .sb') };
  G.lb = [['253,188,42', .34], ['3,200,112', .28], ['255,58,49', .28]].map(([c, a]) => add(`<div class="lbar" style="background:linear-gradient(90deg,rgba(${c},0),rgba(${c},${a}) 50%,rgba(${c},0))"></div>`, L.$('#lgt')));
  for (let j = 0; j < 9; j++) S.sc.push(add(`<div class="sc" id="s${j}"></div>`, cam));
  const sc = S.sc;
  // 0 brand open
  S.o1 = add(`<div class="ctr i9" style="top:742px;font-size:250px;line-height:1;color:${CR}"><span data-fit="990">SEASON 1</span></div>`, sc[0]);
  S.o2 = add(`<div class="pl" style="left:70px;top:1048px;width:940px;height:184px;justify-content:center"><i class="bg" style="background:${AU}"></i><span class="i9" style="font-size:170px;line-height:1;color:${BK};letter-spacing:.3em;margin-right:-.3em">FINAL</span></div>`, sc[0]);
  // 1 the line-up
  S.l0 = add(`<div class="ctr i9" style="top:122px;font-size:330px;line-height:1;color:${CR}"><span><span class="au">${D.ai.length}</span> AIs</span></div>`, sc[1]);
  const slash = (x, y, w, h, c) => `<path d="M${x + h * TAN} ${y}h${w}L${x + w} ${y + h}h${-w}Z" fill="${c}"/>`;
  S.l1 = add(`<svg class="ov">${slash(40, 190, 44, 230, '#03c870')}${slash(104, 190, 22, 230, '#03c870')}${slash(946, 190, 44, 230, '#ff3a31')}${slash(908, 190, 22, 230, '#ff3a31')}</svg>`, sc[1]);
  S.lp = KS.map((k, j) => add(`<div class="lp" style="left:${j % 2 ? 556 : 38}px;top:${j < 2 ? 470 : 862}px"><i class="bg"></i><i class="cb" style="background:${COL[k]}"></i><span class="mw">${L.mark(k, 156)}</span><span class="nm i9">${AI(k).name.toUpperCase()}</span><svg class="sv" width="486" height="372">${[0, 1, 2].map(n => `<path d="M${286 + n * 62 + 150 * TAN} 40h${[40, 24, 12][n]}L${286 + n * 62 + [40, 24, 12][n]} 190h${-[40, 24, 12][n]}Z" fill="${COL[k]}" fill-opacity="${[1, .7, .45][n]}"/>`).join('')}</svg></div>`, sc[1]));
  // 2 112 earnings trades
  S.n0 = add(`<div class="ctr i9 au" style="top:92px;font-size:610px;line-height:1"><span class="foil">${N}</span></div>`, sc[2]);
  S.m2 = add(meter(46, 1010, 640, 104), sc[2]);
  S.n1 = add(`<div class="ctr i9" style="top:752px;font-size:240px;line-height:1;color:${CR}"><span data-fit="990">EARNINGS</span></div>`, sc[2]);
  S.n2 = add(`<div class="ctr i9" style="top:962px;font-size:300px;line-height:1;color:${CR}"><span data-fit="990">TRADES</span></div>`, sc[2]);
  // 3 long or short
  S.ls1 = add(`<div class="slab" style="background:${GN};clip-path:polygon(0 150px,1080px 150px,1080px 560px,0 700px)"><span class="i9" style="top:158px;font-size:440px">LONG</span></div>`, sc[3]);
  S.ls2 = add(`<div class="slab" style="background:${RD};clip-path:polygon(0 730px,1080px 590px,1080px 1100px,0 1100px)"><span class="i9" style="top:660px;font-size:420px">SHORT</span></div>`, sc[3]);
  S.ls3 = add(`<div class="pl" style="left:452px;top:584px;width:176px;height:122px;justify-content:center"><i class="bg" style="background:${BK};box-shadow:0 0 0 5px ${CR}"></i><span class="i9" style="font-size:92px;line-height:1;color:${CR}">OR</span></div>`, sc[3]);
  S.lt1 = add(`<div class="pl" style="left:40px;top:1128px;width:1000px;height:124px"><i class="bg" style="background:${CR}"></i><div class="pl" style="position:relative;height:124px;margin-left:0"><i class="bg" style="background:${AU}"></i><span class="i9" style="font-size:116px;line-height:1;color:${BK};padding:0 32px 0 36px">$100K</span></div><span class="i9" style="font-size:96px;line-height:1;color:${BK};padding-left:30px"><span data-fit="596">ON EVERY TRADE</span></span></div>`, lt);
  // 4 the season chart
  const X0 = 56, X1 = 822, Y0 = 306, Y1 = 1034; S.cx = { X0, X1, Y0, Y1 };
  S.ch = add(`<div class="pl" style="left:40px;top:150px;height:104px"><i class="bg" style="background:${AU}"></i><span class="i9" style="font-size:80px;line-height:1;color:${BK};padding:0 34px 0 36px">SEASON 1 P&amp;L</span></div>`, sc[4]);
  S.cc = add(`<div class="ab i9" data-chrome style="right:40px;top:164px;font-size:64px;line-height:1.1;color:${CR}"><span style="font-size:40px;color:rgba(242,237,230,.6);margin-right:14px">TRADE</span><b class="au" style="font-weight:900">0</b><span style="font-size:40px;color:rgba(242,237,230,.6);margin-left:14px">OF ${N}</span></div>`, sc[4]);
  S.cb = add(`<div class="cpb" data-chrome></div>`, sc[4]);
  S.cs = add(`<svg class="ov"><g data-chrome>${Array.from({ length: 9 }, () => `<line x1="${X0}" x2="${X1 + 14}" stroke="rgba(242,237,230,.13)" stroke-width="2"/>`).join('')}<line id="zl" x1="${X0}" x2="${X1 + 14}" stroke="rgba(242,237,230,.7)" stroke-width="3"/></g>
    ${KS.map(k => `<path class="gw" fill="none" stroke="${COL[k]}" stroke-width="18" stroke-opacity=".2" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}
    ${KS.map(k => `<path class="ln" fill="none" stroke="${COL[k]}" stroke-width="${k === win.k ? 8 : 5.5}" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}
    ${KS.map(k => `<path class="cm" fill="none" stroke="#fffaf0" stroke-width="${k === win.k ? 8 : 5.5}" stroke-linecap="round"/>`).join('')}
    ${KS.map(k => `<circle class="hd" r="11" fill="${COL[k]}" stroke="${BK}" stroke-width="4"/>`).join('')}</svg>`, sc[4]);
  S.gl = L.$$('g line', S.cs).slice(0, 9); S.zl = L.$('#zl'); S.gw = L.$$('.gw', S.cs); S.ln = L.$$('.ln', S.cs); S.cm = L.$$('.cm', S.cs); S.hd = L.$$('.hd', S.cs);
  S.tk = Array.from({ length: 9 }, () => add(`<div class="tk i8" data-chrome></div>`, sc[4]));
  S.m4 = add(meter(46, 1026, 1060, 40, .5), sc[4]);
  S.tg = KS.map(k => add(`<div class="tg"><i class="bg"></i><i class="ed" style="background:${COL[k]}"></i>${L.mark(k, 44)}<b class="i8">$0</b></div>`, sc[4]));
  S.KS = KS;
  // its lower third: the leader, called as it changes
  S.ld = add(`<div class="ab" style="left:40px;top:1128px;width:790px;height:124px"><div class="pl" style="left:0;top:0;width:250px;height:124px;justify-content:center"><i class="bg" style="background:${AU}"></i><span class="i9" style="font-size:66px;line-height:1;color:${BK};letter-spacing:.03em">LEADER</span></div>
    <div class="pl" style="left:252px;top:0;width:538px;height:124px;overflow:visible"><i class="bg" style="background:${CR}"></i><i class="bg wf" style="background:#fff"></i>${KS.map(k => `<div class="nmx" style="position:absolute;left:34px;top:0;height:124px;display:flex;align-items:center;gap:22px">${L.mark(k, 88)}<span class="i9" style="font-size:104px;line-height:1;color:${BK}">${AI(k).name.toUpperCase()}</span></div>`).join('')}</div></div>`, sc[4]);
  S.ldn = L.$$('.nmx', S.ld); S.ldf = L.$('.wf', S.ld);
  S.fp = add(`<div class="fp i8" data-chrome style="top:1156px">$100K ON<br>EVERY TRADE</div>`, sc[4]);
  // the chart's clock: trade number r at time t (slower through the lead changes, fastest into the drop), and the scale's envelope
  S.rt = [[b(19), 0], [b(22), 33], [b(24), 46], [b(25.5), 59], [b(28), 67], [DROP1, N]];
  const hi = [], lo = []; for (let r = 0; r <= N; r++) { let h = 30000, l = -30000; for (const k of KS) for (let j = 0; j <= Math.min(N, r + 3); j++) { h = Math.max(h, D.s[k][j]); l = Math.min(l, D.s[k][j]) } hi.push(h); lo.push(l) }
  const sm = a => a.map((_, r) => { let s = 0, n = 0; for (let j = r - 5; j <= r + 5; j++) { s += a[L.cl(j, 0, N)]; n++ } return s / n }); S.hi = sm(hi); S.lo = sm(lo);
  S.lead = D.lead.map(e => ({ k: e.k, r: e.i, t: S.rt.reduce((a, p, i, m) => i && e.i > m[i - 1][1] && e.i <= p[1] ? L.lerp(m[i - 1][0], p[0], (e.i - m[i - 1][1]) / (p[1] - m[i - 1][1])) : a, b(19)) }));
