<!doctype html><meta charset="utf-8"><title>Late edition</title>
<!-- Night studio outcome take 4, LATE EDITION (2026-11-20): the close told as the newspaper that comes off the press at 4 pm. In a
  painted night press hall (w6/nt/ov/ov4-press.jpg, Hedra gpt-image-2 in ink-wash): the early edition first, held still, the night's
  trades as its table (every AI's LONG or SHORT on every company); the press runs; on the drop (the bell) the late edition's front pages
  spin in one by one, the old film trope, one company a page: its move as the headline over its night as a halftone chart, the RIGHT
  column and the WRONG column of AIs, each with the P&L it took; on the second hit the last page: who leads Season 2, with the standings
  box; the end card. The masthead on every page is the EZ. mark and EARNINGS ZEASON (brand inside the main object, research B1 and B3).
  Faces: Playfair Display (headlines) and Oswald (every label and figure, tabular). Ink is logo black on newsprint in logo cream; the
  only colours are the brand's green, red and gold as spot inks, and each company's own logo. Bed m1-trailer (120 BPM), its hit at 8.02 s
  in the file on the bell (TR = 4.0 s here, MUSIC.at = 4.02) and its hit at 16.03 s on the standings page (12.0 s here).
  Data: data/close-<date>.json (nt-ov4.html?d=<YYYY-MM-DD>). One page a company, 5 beats each: 4 companies fit before the second hit;
  past that the film grows 2.5 s a company (10 companies: 34 s), or two companies share a page (?two=1, a page every 5 beats).
  Words of our own on screen: no punctuation; sides are LONG or SHORT; every money figure is a signed P&L with its label. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;0,900;1,800&family=Oswald:wght@500;600;700&display=swap">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#04070e;color:#04070e;font-family:Oswald,sans-serif}
.f{font-variant-numeric:tabular-nums}
#st{position:absolute;inset:0;overflow:hidden}
#gnd{position:absolute;left:-60px;top:-90px;width:1200px;height:1600px;transform-origin:50% 60%}
#gnd img{width:100%;height:100%;display:block}
#rush{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}
#rush i{position:absolute;left:0;height:3px;border-radius:2px;display:block}
#shade{position:absolute;inset:0;background:radial-gradient(75% 60% at 50% 55%,rgba(4,7,14,.25),rgba(4,7,14,.82))}
#cam{position:absolute;inset:0;transform-origin:540px 730px}
.pg{position:absolute;left:70px;top:212px;width:940px;height:1110px;transform-origin:50% 50%;color:#04070e;padding:34px 40px 30px;overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.7),0 0 0 1px rgba(4,7,14,.25)}
.pg canvas.paper{position:absolute;inset:0;width:940px;height:1160px;z-index:0}
.pg > *:not(canvas){position:relative;z-index:1}
.mh{display:flex;align-items:center;justify-content:center;gap:18px;padding-bottom:12px;border-bottom:5px double #04070e}
.mh img{width:78px;height:78px}
.mh b{font:900 62px/1 'Playfair Display';letter-spacing:.01em}
.sl{display:flex;justify-content:space-between;font:600 24px/1 Oswald;letter-spacing:.14em;padding:10px 2px 9px;border-bottom:2px solid #04070e}
.sl .ed{color:#04070e;background:#fdbc2a;padding:2px 10px 0}
.hl{display:flex;align-items:center;gap:22px;margin-top:20px}
.hl img{width:96px;height:96px;border-radius:20px}
.hl h1{font:900 104px/0.95 'Playfair Display';letter-spacing:-.02em;white-space:nowrap}
.hl h1 span{display:block}
.dk{font:italic 800 38px/1.1 'Playfair Display';margin-top:12px}
.ph{margin-top:16px;height:372px;position:relative;border:2px solid #04070e}
.ph canvas{position:absolute;inset:0;width:100%;height:100%}
.ph .cap{position:absolute;left:12px;bottom:8px;font:600 24px/1 Oswald;letter-spacing:.1em;background:#f8f0d9;padding:3px 8px}
.cols{display:flex;gap:28px;margin-top:20px}
.col{flex:1;border-top:4px solid #04070e;padding-top:10px}
.col h3{display:flex;align-items:center;gap:12px;font:700 32px/1 Oswald;letter-spacing:.06em}
.col h3 .tg{font:700 26px/1 Oswald;padding:4px 10px 2px;letter-spacing:.1em}
.col .ai{display:flex;align-items:center;gap:12px;height:58px;border-bottom:1px solid rgba(4,7,14,.35)}
.col .ai b{font:600 30px/1 Oswald;width:120px}
.col .ai span{margin-left:auto;font:700 30px/1 Oswald}
.col .none{font:600 26px/52px Oswald;opacity:.6}
.tb{margin-top:22px;width:100%;border-collapse:collapse}
.tb th{font:700 26px/1 Oswald;letter-spacing:.1em;text-align:center;padding:0 0 12px}
.tb th img{width:56px;height:56px;border-radius:12px;display:block;margin:0 auto 8px}
.tb td{height:92px;border-top:2px solid #04070e;text-align:center;font:700 30px/1 Oswald;letter-spacing:.06em}
.tb td.nm{text-align:left}
.tb td.nm div{display:flex;align-items:center;gap:14px;font:600 34px/1 Oswald;letter-spacing:.02em}
.st{margin-top:22px;width:100%;border-collapse:collapse}
.st th{font:700 24px/1 Oswald;letter-spacing:.12em;padding:0 8px 10px;text-align:right}
.st th:nth-child(2){text-align:left}
.st td{height:104px;border-top:2px solid #04070e;font:700 40px/1 Oswald;text-align:right;padding:0 8px}
.st td.rk{font:900 52px/1 'Playfair Display';text-align:center;width:70px}
.st td.nm{text-align:left}.st td.nm div{display:flex;align-items:center;gap:16px;font:600 42px/1 Oswald}
.st tr.ld td{background:rgba(253,188,42,.55)}
.stamp{position:absolute;z-index:5;font:700 44px/1 Oswald;letter-spacing:.12em;padding:10px 18px 6px;border:5px solid;transform-origin:50% 50%;opacity:0;mix-blend-mode:multiply}
#flash{position:absolute;inset:0;background:#f8f0d9;opacity:0;pointer-events:none;z-index:400}
</style>
<div id="st">
  <div id="gnd"><img src="w6/nt/ov/ov4-press.jpg" alt=""></div><div id="rush"></div><div id="shade"></div>
  <div id="cam"><div id="pages"></div></div>
  <div id="flash"></div>
</div>
<script src="lib.js"></script><script src="nt-ov.js"></script><script src="nt-ovx.js"></script>
<script>
const TR = 4.0, PER = 5;
let D, G, grain, PG = [], SPIN = [], NP, ST;
const BLK = '#04070e';
// newsprint: logo cream with fibres, grain, a fold and a darker edge, drawn once per page
const paper = (cv, seed) => { cv.width = 940; cv.height = 1160; const x = cv.getContext('2d'); x.fillStyle = '#f8f0d9'; x.fillRect(0, 0, 940, 1160);
  let s = seed * 7919 + 13; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const im = x.getImageData(0, 0, 940, 1160); for (let i = 0; i < im.data.length; i += 4) { const n = (r() - .5) * 22; im.data[i] += n; im.data[i + 1] += n; im.data[i + 2] += n * .9 } x.putImageData(im, 0, 0);
  for (let k = 0; k < 900; k++) { x.strokeStyle = `rgba(90,70,40,${(.05 + r() * .08).toFixed(3)})`; x.lineWidth = .6 + r(); x.beginPath(); const a = r() * 940, b = r() * 1160, ang = r() * 6.28, l = 4 + r() * 14; x.moveTo(a, b); x.quadraticCurveTo(a + l * .5 * Math.cos(ang + .6), b + l * .5 * Math.sin(ang + .6), a + l * Math.cos(ang), b + l * Math.sin(ang)); x.stroke() }
  const g = x.createLinearGradient(0, 0, 940, 0); g.addColorStop(0, 'rgba(120,90,40,.14)'); g.addColorStop(.08, 'rgba(0,0,0,0)'); g.addColorStop(.92, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(120,90,40,.16)'); x.fillStyle = g; x.fillRect(0, 0, 940, 1160);
  const f = x.createLinearGradient(0, 560, 0, 600); f.addColorStop(0, 'rgba(0,0,0,0)'); f.addColorStop(.5, 'rgba(60,40,10,.12)'); f.addColorStop(.55, 'rgba(255,255,255,.25)'); f.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = f; x.fillRect(0, 560, 940, 40) };
// the night as a halftone chart: the area to the line in a dot screen, the line in ink, the close as a spot-ink dot
const halftone = (cv, r) => { const W = 856, H = 368; cv.width = W * 2; cv.height = H * 2; const x = cv.getContext('2d'); x.scale(2, 2);
  const P = r.path || [[0, 0], [D.total, r.move]]; const vals = P.map(p => p[1]).concat([0]); const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * .14 + .3;
  const X = m => 20 + m / D.total * (W - 70), Y = v => 16 + (hi + pad - v) / (hi - lo + 2 * pad) * (H - 40);
  const ink = r.move < 0 ? 'rgba(255,58,49,' : 'rgba(3,200,112,';
  for (let gy = 4; gy < H; gy += 7) for (let gx = 4; gx < W; gx += 7) { const m = (gx - 20) / (W - 70) * D.total; if (m < 0 || m > D.total) continue; const v = r.px(m), y0 = Y(0), yv = Y(v);
    const inA = (gy >= Math.min(y0, yv) && gy <= Math.max(y0, yv)); if (!inA) continue; const dd = Math.abs(gy - y0) / Math.max(8, Math.abs(yv - y0)); x.fillStyle = ink + '.85)'; x.beginPath(); x.arc(gx, gy, 1 + 2.1 * (.35 + .65 * dd), 0, 6.283); x.fill() }
  x.strokeStyle = BLK; x.setLineDash([8, 6]); x.lineWidth = 2; x.beginPath(); x.moveTo(20, Y(0)); x.lineTo(W - 50, Y(0)); x.stroke(); x.setLineDash([]);
  x.lineWidth = 4; x.lineJoin = 'round'; x.beginPath(); P.forEach((p, i) => i ? x.lineTo(X(p[0]), Y(p[1])) : x.moveTo(X(p[0]), Y(p[1]))); x.lineTo(X(D.total), Y(r.move)); x.stroke();
  x.fillStyle = r.move < 0 ? '#ff3a31' : '#03c870'; x.strokeStyle = BLK; x.lineWidth = 3; x.beginPath(); x.arc(X(D.total), Y(r.move), 11, 0, 6.283); x.fill(); x.stroke() };
const mast = (ed) => `<div class="mh"><img src="ezlogo.svg" alt=""><b>EARNINGS ZEASON</b></div><div class="sl"><span>${D.day1} CLOSE</span><span class="ed">${ed}</span><span>SEASON 2</span></div>`;
const aiRow = c => `<div class="ai">${OV.mark(c.k, 36)}<b>${D.byK[c.k].name}</b><span style="color:${c.pnl > 0 ? '#027a45' : '#c8241c'}">P&amp;L ${OV.money(c.pnl)}</span></div>`;
const setup = () => {
  G = OV.grid(120, TR, 8.02, 'm1-trailer'); const B = G.B, p = G.p;
  NP = D.N; const extra = Math.max(0, NP - 4) * PER * p; ST = B(16) + extra; window.DUR = +(ST + 4.5).toFixed(2);
  OV.bug('700 30px Oswald', { subFont: "700 30px Oswald" }); grain = OV.grain(.07);
  const add = (html, seed) => { const el = document.createElement('div'); el.className = 'pg'; el.innerHTML = `<canvas class="paper"></canvas>` + html; L.$('#pages').appendChild(el); paper(el.querySelector('canvas.paper'), seed); return el };
  // the early edition: the trades
  PG.push(add(`${mast('EARLY EDITION')}<div class="hl" style="margin-top:26px"><h1 style="font-size:96px"><span>${D.title[0]}</span><span>${D.title[1]}</span></h1></div>
    <div class="dk">Every AI takes a side before the report</div>
    <table class="tb"><tr><th></th>${D.rounds.map(r => `<th><img src="${r.logo}" alt="">${r.ticker}</th>`).join('')}</tr>
    ${D.ais.map(a => `<tr><td class="nm"><div>${OV.mark(a.k, 44)}${a.name}</div></td>${a.calls.map(c => `<td style="color:${c.side === 'LONG' ? '#027a45' : '#c8241c'}">${c.side}</td>`).join('')}</tr>`).join('')}</table>`, 1));
  // the late edition: one page a company
  D.rounds.forEach((r, j) => { const rc = r.calls.filter(c => c.right), wc = r.calls.filter(c => !c.right);
    const col = (cs, ok) => `<div class="col"><h3><span class="tg" style="background:${ok ? '#fdbc2a' : '#ff3a31'};color:${ok ? BLK : '#f8f0d9'}">${ok ? 'RIGHT' : 'WRONG'}</span>${cs.length ? cs[0].side : ''}</h3>${cs.length ? cs.map(aiRow).join('') : '<div class="none">Nobody</div>'}</div>`;
    const el = add(`${mast('LATE EDITION')}<div class="hl"><img src="${r.logo}" alt=""><h1><span>${r.co}</span><span style="color:${r.move < 0 ? '#c8241c' : '#027a45'}">${OV.pct(r.move)}</span></h1></div>
      <div class="ph"><canvas></canvas><div class="cap">${D.day0} 4 PM TO ${D.day1} 4 PM</div></div>
      <div class="cols">${col(rc, true)}${col(wc, false)}</div>`, 2 + j);
    halftone(el.querySelector('.ph canvas'), r); PG.push(el) });
  // the standings page
  const ld = D.lead.map(k => D.byK[k].name.toUpperCase());
  PG.push(add(`${mast('FINAL EDITION')}<div class="hl" style="margin-top:28px"><h1 style="font-size:${ld.length > 1 ? 80 : 108}px"><span>${ld.join(' AND ')}</span><span>${ld.length > 1 ? 'SHARE THE LEAD' : 'LEADS SEASON 2'}</span></h1></div>
    <div class="dk">Season 2 standings after ${D.after} trades</div>
    <table class="st"><tr><th></th><th>AI</th><th>W</th><th>L</th><th>${D.before ? 'SEASON P&amp;L' : 'P&amp;L'}</th></tr>
    ${D.ranked.map((a, i) => `<tr class="${D.lead.includes(a.k) ? 'ld' : ''}"><td class="rk">${i + 1}</td><td class="nm"><div>${OV.mark(a.k, 50)}${a.name}</div></td><td style="color:#027a45">${a.W}</td><td style="color:#c8241c">${a.L}</td><td style="color:${a.s1 > 0 ? '#027a45' : a.s1 < 0 ? '#c8241c' : BLK}">${OV.money(a.s1)}</td></tr>`).join('')}</table>`, 9));
  // the press rush (light streaks of paper running through the rollers)
  L.$('#rush').innerHTML = Array.from({ length: 22 }, (_, i) => `<i style="top:${(40 + i * 61) % 1350}px;width:${200 + (i * 97) % 500}px;background:linear-gradient(90deg,transparent,rgba(${i % 5 ? OV.rgb.CR : OV.rgb.AU},.5),transparent)"></i>`).join('');
  // sound
  const C = window.CUES = [[.05, 'r11-swell', .1]]; OV.sting(C);
  C.push([B(-5), 'sfx-whoosh', .08], [B(-2), 'sfx-riser', .12], [TR, 'sfx-bell', .32], [TR + .02, 'sfx-boom', .16]);
  D.rounds.forEach((r, j) => { const t0 = TR + j * PER * p; C.push([+(t0 + .05).toFixed(3), 'sfx-whoosh', .14], [+(t0 + p - .02).toFixed(3), 'r11-thump', .18], [+(t0 + p + .05).toFixed(3), 'sfx-stamp', .12]) });
  C.push([ST - p + .05, 'sfx-whoosh', .14], [ST, 'r11-thump', .22], [ST + .05, 'sfx-stamp', .14], [ST + 2 * p, 'sfx-chime', .12], [ST + 5 * p, 'sfx-whoosh', .12], [ST + 5 * p + .12, 'r11-thump', .12]);
};
window.R = t => {
  const B = G.B, p = G.p; grain(t);
  const run = L.n(t, B(-2), TR) + (t >= TR ? 1 : 0);
  // the hall: the press runs faster from the bell, a slow push
  L.$('#gnd').style.transform = `scale(${(1.02 + .05 * L.n(t, 0, window.DUR)).toFixed(4)}) translate(${(5 * Math.sin(t * .5)).toFixed(1)}px,0)`;
  L.$$('#rush i').forEach((el, i) => { const sp = 160 + 1400 * Math.min(1, run) + (i % 4) * 90; const x = ((t * sp + i * 377) % 1700) - 400; el.style.transform = `translateX(${x.toFixed(1)}px)`; el.style.opacity = (.25 + .6 * Math.min(1, run)).toFixed(3) });
  L.$('#flash').style.opacity = (t >= TR ? .55 * Math.exp(-(t - TR) * 7) : 0) + (t >= ST ? .35 * Math.exp(-(t - ST) * 8) : 0);
  // pages: the early edition held, pushed in on its table; then each page spins in and lands on a beat, the one before slides off
  const tE = PG.length - 1, ln = [];
  PG.forEach((el, i) => { let t0, t1; if (i === 0) { t0 = -1; t1 = TR } else if (i < tE) { t0 = TR + (i - 1) * PER * p; t1 = TR + i * PER * p } else { t0 = ST - p; t1 = 99 }
    if (i === tE - 1) t1 = ST - p;
    const sp = i === 0 ? 1 : L.eo(L.n(t, t0, t0 + p)), land = i === 0 ? 1 : L.spring(t - t0 - p, 2.2, 9), out = L.eio(L.n(t, t1, t1 + .35));
    const rot = i === 0 ? -1.2 : L.lerp(i % 2 ? 900 : -900, i % 2 ? -1.6 : 1.4, sp), sc = i === 0 ? 1 : L.lerp(.05, 1, sp) * (1 + .06 * (1 - land));
    el.style.opacity = (t >= t0 ? 1 : 0) * (out < 1 ? 1 : 0);
    el.style.transform = `translate(${(out * (i % 2 ? -1300 : 1300)).toFixed(1)}px,${(80 * out).toFixed(1)}px) rotate(${(rot + out * 20).toFixed(2)}deg) scale(${sc.toFixed(4)})`;
    el.style.zIndex = 10 + i;
    // the stamps of a company page: RIGHT and WRONG land after the page settles (the columns carry the words; the page shakes)
  });
  // camera: early edition push to the table, each page a push from the headline to the columns, the standings push to the table
  // (the page's top edge stays below the house bug: the push is anchored near the masthead, at most 7 percent)
  let fy = 330, z = 1, dy = 0;
  if (t < TR) { const k = L.eio(L.n(t, .3, B(-5))); z = 1 + .05 * k + .02 * L.n(t, B(-5), TR); dy = -30 * k }
  else if (t < ST - p) { const j = Math.floor((t - TR) / (PER * p)), t0 = TR + j * PER * p + 1.6 * p, k = L.eio(L.n(t, t0, t0 + 1.6 * p)); z = 1.02 + .05 * k; dy = -36 * k }
  else { const k = L.eio(L.n(t, ST + 1.5 * p, ST + 3 * p)); z = 1 + .06 * k; dy = -20 * k }
  const kick = (t >= TR ? Math.exp(-(t - TR) * 7) * Math.sin((t - TR) * 50) * 10 : 0) + (t >= ST ? Math.exp(-(t - ST) * 7) * Math.sin((t - ST) * 50) * 8 : 0);
  const cam = L.$('#cam'); cam.style.transformOrigin = `540px ${fy.toFixed(1)}px`; cam.style.transform = `translate(${kick.toFixed(2)}px,${(kick * .5 + dy).toFixed(2)}px) scale(${z.toFixed(4)})`;
  OV.endR(t, ST + 5 * p);
  OV.beat(t, G, [L.$('#gnd'), L.$('#rush')], L.$('#cam'), .3, .010); OV.endFx(t, ST + 5 * p, G);
};
(async () => {
  D = await OV.load(); setup();
  await OV.ready(["900 104px 'Playfair Display'", "italic 800 38px 'Playfair Display'", "700 30px Oswald", "600 24px Oswald"]);
})();
</script>
