const add = (h, p) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };

const sv = (a, f) => { f = L.cl(f, 0, 112); const i = Math.min(111, Math.floor(f)); return a.s[i] + (a.s[i + 1] - a.s[i]) * (f - i) };

/* ───────── build ───────── */
function build() {

  const acc = [...S.ai].sort((a, b) => b.hit - a.hit || b.w - a.w); S.ai.forEach(a => a.ar = acc.indexOf(a));
  const pmax = Math.max(...S.ai.map(a => Math.abs(a.pnl))); S.ai.forEach(a => { a.Lp = 440 * a.pnl / pmax; a.La = (BX1 - BX0) * a.hit / 100 });
  // gates of type the camera flies through
  S.g = [
    add(`<div class="gate"><div class="c k cr" style="top:752px;font-size:100px"><span data-fit="900">EARNINGS ZEASON</span></div><div class="c k au" style="top:846px;font-size:250px"><span data-fit="980">SEASON 1</span></div>${slash(1122)}</div>`, gates),
    add(`<div class="gate"><div class="c" style="top:92px"><span class="m au" style="font-size:236px;font-weight:800">${S.ai.length}</span><span class="k cr" style="font-size:236px;margin-left:36px">AIs</span></div>${S.ai.map((a, i) => `<div class="l" style="left:112px;top:${336 + i * 226}px">${mark(a.k, 190)}</div><div class="l k" style="left:344px;top:${346 + i * 226}px;font-size:170px;color:${a.col}"><span data-fit="max620">${a.name}</span></div>`).join('')}</div>`, gates),
    add(`<div class="gate"><div class="c m au" style="top:70px;font-size:560px;font-weight:800;letter-spacing:-.04em">${D.total}</div><div class="c k cr" style="top:596px;font-size:210px"><span data-fit="980">EARNINGS</span></div><div class="c k cr" style="top:792px;font-size:285px"><span data-fit="980">TRADES</span></div>${slash(1130)}</div>`, gates),
    add(`<div class="gate"><div class="c k gn" style="top:84px;font-size:370px"><span data-fit="900">LONG</span></div><div class="c k" style="top:428px;font-size:92px;color:#8e8680">OR</div><div class="c k rd" style="top:500px;font-size:310px"><span data-fit="960">SHORT</span></div><div class="c m au" style="top:812px;font-size:215px;font-weight:800;letter-spacing:-.03em">$100K</div><div class="c k cr" style="top:1038px;font-size:112px"><span data-fit="900">ON EVERY TRADE</span></div></div>`, gates)];
  S.lg0 = add(`<img class="ab" src="ezlogo.svg" width="620" height="620" alt="">`, ov);
  // the chart's furniture
  S.t1 = add(`<div class="ab k cr" style="font-size:150px">P&amp;L</div>`, ov); S.t2 = add(`<div class="ab k cr" style="font-size:150px">ACCURACY</div>`, ov);
  S.t3 = add(`<div class="ab k" style="font-size:60px;letter-spacing:.08em;color:#a39b94">LEADERBOARD</div>`, ov);
  S.call = add(`<div class="ab k" style="font-size:112px"></div>`, ov);
  S.cnt = add(`<div class="ab m" style="left:auto;right:56px;transform-origin:100% 0;font-size:64px;color:${CR}"><span style="font-size:32px;letter-spacing:.16em;color:#a39b94;font-weight:600;margin-right:18px">TRADE</span><b style="font-weight:700"></b></div>`, ov);
  S.pg = add(`<div class="ab" style="width:968px;height:10px;border-radius:5px;background:rgba(242,237,230,.14)"><i style="position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:${CR};box-shadow:0 0 14px rgba(242,237,230,.5)"></i></div>`, ov);
  S.tkr = []; for (let r = 0; r <= 110; r += 10) S.tkr.push({ r, el: add(`<div class="tk">${r}</div>`, ax) });
  S.tkv = [200000, 100000, 0, -100000].map(v => ({ v, el: add(`<div class="tk">${v ? (v < 0 ? '−' : '+') + '$' + Math.abs(v) / 1000 + 'K' : '$0'}</div>`, ax) }));
  // the four AIs: a tag at its line's head, which becomes its leaderboard row
  S.ai.forEach((a, i) => {
    a.plate = add(`<div class="ab plate" style="border:2px solid rgba(${a.rgb},.62);background:linear-gradient(100deg,rgba(${a.rgb},.17),rgba(8,10,16,.86) 42%)"><i></i></div>`, rows);
    a.mk = add(`<div class="ab">${mark(a.k, 96)}</div>`, rows);
    a.nm = add(`<div class="ab k" style="font-size:76px;color:${a.col}">${a.name}</div>`, rows);
    a.vK = add(`<div class="ab m" style="font-size:68px"></div>`, rows);
    a.vX = add(`<div class="ab m" style="font-size:68px;color:${i ? (a.pnl < 0 ? RD : GN) : AU}">${L.money(a.pnl)}</div>`, rows);
    a.vA = add(`<div class="ab m" style="font-size:88px;color:${i ? CR : AU}">${a.hit}%</div>`, rows);
    a.wl = add(`<div class="ab m" style="font-size:44px;font-weight:600;color:#b9b1a8">${a.w}–${a.l}</div>`, rows);
    a.rk = add(`<div class="ab m rkb" style="background:${a.col}">${i + 1}</div>`, rows);
  });
  S.wlh = add(`<div class="ab m" style="font-size:34px;font-weight:700;letter-spacing:.1em;color:#d5cdc3">W–L</div>`, rows);
  S.out = S.ai.find(a => (D.releg || []).includes(a.k));
  S.rel = add(`<div class="ab k rd" style="transform-origin:50% 50%;font-size:58px;padding:0 22px 6px 16px;border:5px solid ${RD};border-radius:14px;background:rgba(4,7,14,.86)">RELEGATED</div>`, rows);

  S.s1 = add(`<div class="ab k foil" style="font-size:200px"><span data-fit="940">SEASON 1</span></div>`, win);
  S.pl = add(`<div class="ab" style="transform-origin:50% 50%"><span class="k cr" style="font-size:96px;margin-right:28px">P&amp;L</span><span class="m foil" style="font-size:104px;display:inline-block;text-align:left"></span></div>`, win);
  S.stars = [[86, 1052, 26, 0], [1000, 1078, 22, .35], [940, 1010, 16, .7], [150, 1170, 16, 1.05], [1014, 1172, 14, .5]].map(([x, y, r, ph]) => ({ x, y, ph, el: add(`<svg class="ab" width="2" height="2" style="overflow:visible"><path d="M0 ${-r}C${r * .12} ${-r * .12} ${r * .12} ${-r * .12} ${r} 0C${r * .12} ${r * .12} ${r * .12} ${r * .12} 0 ${r}C${-r * .12} ${r * .12} ${-r * .12} ${r * .12} ${-r} 0C${-r * .12} ${-r * .12} ${-r * .12} ${-r * .12} 0 ${-r}Z" fill="#fff3c8"/></svg>`, win) }));
  S.s2 = add(`<div class="ab k cr" style="font-size:66px;font-weight:800">SEASON 2 SOON</div>`, end);
  S.lg1 = add(`<img class="ab" src="ezlogo.svg" width="150" height="150" alt="" style="transform-origin:50% 50%">`, end);
  S.wm = add(`<div class="ab k cr" style="font-size:80px"><span data-fit="640">EARNINGS ZEASON</span></div>`, end);
  S.gc = L.$('#gnd'); S.gx = S.gc.getContext('2d'); S.lc = L.$('#ln'); S.lx = S.lc.getContext('2d');
  // dust: slashes in the logo's green, red and cream that stream past
  let sd = 4242; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647; S.pt = Array.from({ length: 110 }, (_, i) => ({ x: rnd() * 5000, z: rnd() * 5000, y: rnd(), c: i % 3, w: .6 + rnd() }));
  // the race's clock: time -> trade number, slow on the lead changes, which land on beats
  const lead = f => { let b = 0, bv = -1e18; S.ai.forEach((a, i) => { const v = sv(a, f); if (v > bv + 1e-6) { bv = v; b = i } }); return b }; S.lead = lead;
  const X = []; let pl = lead(0); for (let f = .005; f <= 112; f += .005) { const l = lead(f); if (l !== pl) { X.push({ f, i: l }); pl = l } }
  const cross = (n, k) => { const e = X.filter(e => e.f > n - 1.01 && e.f <= n + .01 && S.ai[e.i].k === k).pop(); return e ? e.f : n };
  const ks = KEYS.filter(([n, k]) => (D.lead || []).some(e => e.n === n && e.k === k)).map(([n, k, b]) => [bt(b), cross(n, k)]);
  const xs = [T.race, ...ks.map(k => k[0]), T.d1], ys = [0, ...ks.map(k => k[1]), 112], n = xs.length, h = [], d = [], m = [];
  for (let i = 0; i < n - 1; i++) { h[i] = xs[i + 1] - xs[i]; d[i] = (ys[i + 1] - ys[i]) / h[i] }
  m[0] = d[0]; m[n - 1] = d[n - 2]; for (let i = 1; i < n - 1; i++) { const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1]; m[i] = d[i - 1] * d[i] <= 0 ? 0 : (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]) }
  S.FI = t => { if (t <= xs[0]) return 0; if (t >= xs[n - 1]) return 112; let i = 0; while (t > xs[i + 1]) i++; const u = (t - xs[i]) / h[i], u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * ys[i] + (u3 - 2 * u2 + u) * h[i] * m[i] + (-2 * u3 + 3 * u2) * ys[i + 1] + (u3 - u2) * h[i] * m[i + 1] };
  const inv = f => { let a = xs[0], b = xs[n - 1]; for (let i = 0; i < 40; i++) { const c = (a + b) / 2; S.FI(c) < f ? a = c : b = c } return (a + b) / 2 };
  S.x0 = ks.length ? ks[0][1] : 3; S.ev = X.filter(e => e.f >= S.x0 - 1e-6).map(e => ({ t: inv(e.f), i: e.i, f: e.f }));
  // the close camera's height and zoom: the four heads always fill the middle of the frame
  const lo = [], hi = []; for (let j = 0; j <= 448; j++) { const v = S.ai.map(a => sv(a, j / 4)); lo.push(Math.min(...v)); hi.push(Math.max(...v)) }
  S.cv = []; S.sp = []; for (let j = 0; j <= 448; j++) { let c = 0, s = 0, w = 0; for (let e = -20; e <= 20; e++) { const i = Math.min(448, Math.max(0, j + e)), g = 21 - Math.abs(e); c += g * (lo[i] + hi[i]) / 2; s += g * (hi[i] - lo[i]); w += g } S.cv.push(c / w); S.sp.push(Math.max(s / w, (hi[j] - lo[j]) * .82)) }
  const look = (arr, f) => { const x = L.cl(f, 0, 112) * 4, i = Math.min(447, Math.floor(x)); return arr[i] + (arr[i + 1] - arr[i]) * (x - i) };
  S.CV = f => look(S.cv, f); S.PV = f => Math.min(520 / 45000, 520 / (look(S.sp, f) + 10000));
  // the cruise after the boards form: trades a second, slow in the break, a kick on drop 2
  S.cr = []; let r = 60; for (let j = 0; j <= (DUR + 1 - T.brd) * 120; j++) { const u = T.brd + j / 120, v = u < T.push ? 22 : u < T.win ? L.lerp(22, 3, L.eio(L.n(u, T.push, T.win - .2))) : 26 + 70 * Math.exp(-(u - T.win) / .7); S.cr.push(r); r += v / 120 }

  S.ev.filter(e => KEYS.some(k => Math.abs(bt(k[2]) - e.t) < .03)).forEach(e => C.push([e.t, 'r11-ping', .06]));
  C.push([T.d1, 'sfx-riser', .1], [T.d1, 'sfx-boom', .2], [T.brd + .1, 'sfx-whoosh', .07], [T.acc, 'r11-card', .07], [T.acc + BT, 'r11-card', .07], [T.acc + 2 * BT, 'r11-card', .07], [T.acc + 3 * BT, 'r11-card', .07],
    [T.rel, 'sfx-stamp', .16], [T.win, 'sfx-riser', .12], [T.win, 'sfx-boom', .22], [T.pnl, 'sfx-chime', .13], [T.close, 'r11-sparkle', .09]);
  window.MUSIC = { f: q.get('bed') || 'w6-dnb-x', at: +(q.get('at') || 0) };
}

/* ───────── camera ───────── */
// the camera is given by what it looks at: a target on the chart plane (trade camR, P&L camV) that sits at screen (hx, cy) and depth zh,
// the yaw psi (positive: looking back along the season), pv screen px per $ at the target's depth, hF the floor's depth under the eye
const mixS = (a, b, k) => k <= 0 ? a : k >= 1 ? b : { psi: L.lerp(a.psi, b.psi, k), zh: Math.exp(L.lerp(Math.log(a.zh), Math.log(b.zh), k)), hx: L.lerp(a.hx, b.hx, k), cy: L.lerp(a.cy, b.cy, k), camR: L.lerp(a.camR, b.camR, k), camV: L.lerp(a.camV, b.camV, k), pv: Math.exp(L.lerp(Math.log(a.pv), Math.log(b.pv), k)), hF: Math.exp(L.lerp(Math.log(a.hF), Math.log(b.hF), k)) };
function flight(t) { t = Math.max(0, t); let i = 0; while (i < 3 && t >= T.g[i + 1] - TAU) i++;
  if (t < T.g[i]) { const k = L.eio((t - (T.g[i] - TAU)) / TAU), a = GO[i - 1], b = GO[i]; return { zh: L.lerp(GZ[i - 1] - CREEP, GZ[i], k), x: L.lerp(a[0], b[0], k), y: L.lerp(a[1], b[1], k), r: L.lerp(a[2], b[2], k), i } }
  const e = i < 3 ? T.g[i + 1] - TAU : T.race - .3; return { zh: GZ[i] - CREEP * (t - T.g[i]) / (e - T.g[i]), x: GO[i][0], y: GO[i][1], r: GO[i][2], i } }
