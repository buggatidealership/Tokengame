<!doctype html><meta charset="utf-8"><title>Season conclusion, take L: one line</title>
<!-- Take L of the Season 1 conclusion, round 4 (WRAP-BRIEF.md "Round 4", owner 2026-11-18): the fixed script of six small scenes, told
  with ONE continuous camera over one drawing, no cuts. The drawing is the season as four lines with their marks and nothing else:
  no axis numbers, no grid, no counter, no figures on the lines. The script's words are set large above it, one line at a time:
  a line arrives, the one before it steps back to 35% and stays, and the whole column crawls slowly upward so a hold is never frozen.
  1 what this is (the empty start line, the four marks)  2 one example (the lines grow to the round, time stops, then the step:
  the losers drop and the one that was right jumps)  3 who won (the race runs to the end with no numbers, then 4th to 1st, each by
  lighting that AI's line; 1st in gold on the bed's drop)  4 why (ten dots, one bar)  5 who is out (its line greys and drops away)
  6 the end (only the winner's line, gold, and the one exact number).
  Every number comes from data/wrap.json (node prep-wrap.js) and is rounded (whole per cents, whole thousands) except the last.
  While a round is ungraded it prints DRAFT and says "After N of M reports", "is ... winning" and "leads"; ?final=1 only forces the
  final words for a check. The bed is s1-l4: s1-l-src.mp3 (Hedra elevenlabs-music, 120 BPM, first beat at 0.016 s) cut on bar lines:
  source 0-28 s, its break 30-32, its full section 32-54, the break again, 32-36, its end 54-58; so the breaks sit at 28-30 s and
  52-54 s, the drop lands at 30.0 s ("1st") and the lift at 54.0 s (the last card).
  (Round 2, a data-dense cut with a Season 2 end card, is in git history; its bed is s1-l.) window.R(t), READY, CUES, MUSIC, DUR. -->

<script>
