<!-- Take L of the Season 1 conclusion (WRAP-BRIEF.md, owner 2026-11-18): by time, ONE continuous camera over one chart world, no cuts.
  The world, in world px: the premise lies on the $0 baseline left of round 1; the race chart (round r at x = r*18, P&L v at y = -v*.0027);
  the standings under the pulled-back chart; then, straight down, bears against bulls (how each AI leaned), the simplest strategy
  (short every report against the four AIs), the accuracy lanes with the 50% line and the relegation; the end title sits above the chart,
  so the last move rises past the whole season. Every zone is a 1080x1350 page placed in the world at its reference camera; the camera
  (cx, cy, zoom) is a pure function of t: a ride that follows the lines' heads (time slows at the three biggest moves, where a card grows
  out of the spike), eased travels between zones and a slow drift in every hold.
  Every number comes from data/wrap.json (node prep-wrap.js). While a round is ungraded it prints DRAFT and "after N of M rounds";
  ?final=1 only forces the final labels for a check. The bed is s1-l (Hedra elevenlabs-music, 120 BPM, first beat at 0.016 s), cut on
  bar lines from s1-l-src.mp3: source 0-26 s, its break 30-32, its full section 32-54, the break again, 32-36, then its end 54-58;
  so the break sits at 26-28 s and 50-52 s here and the two drops land at 28.0 s (the standings) and 52.0 s (Season 2).
  window.R(t), READY, CUES, MUSIC, DUR as the other pages. -->

<script>
const q = new URLSearchParams(location.search), G = '#55d6a2', Rd = '#e8576b', Au = '#fdbc2a', NS = 'http://www.w3.org/2000/svg';
const world = L.$('#world'), hud = L.$('#hud'), add = (h, p) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };
let D, S = {}, C = [], grain, FINAL, A;
const RX = 18, YS = .0027, X = i => i * RX, Y = v => -v * YS;
const money0 = v => (v < 0 ? '−' : '+') + '$' + Math.abs(Math.round(v)).toLocaleString('en-US'), pct = v => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(2) + '%';
const sm = x => x * x * (3 - 2 * x), at = (a, f) => { const i = Math.min(a.length - 2, Math.max(0, Math.floor(f))); return L.lerp(a[i], a[i + 1], L.cl(f - i)) };
const svg = (tag, at, p) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); p.appendChild(e); return e };
// a monotone cubic through (t, value) points that starts and ends at rest: the season's clock, slow at the big rounds
function pchip(P) { const n = P.length, h = [], d = [], m = []; for (let i = 0; i < n - 1; i++) { h[i] = P[i + 1][0] - P[i][0]; d[i] = (P[i + 1][1] - P[i][1]) / h[i] }
  m[0] = 0; m[n - 1] = 0; for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : 3 * (h[i - 1] + h[i]) / ((2 * h[i] + h[i - 1]) / d[i - 1] + (h[i] + 2 * h[i - 1]) / d[i]);
  return t => { if (t <= P[0][0]) return P[0][1]; if (t >= P[n - 1][0]) return P[n - 1][1]; let i = 0; while (t > P[i + 1][0]) i++; const s = (t - P[i][0]) / h[i], s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * P[i][1] + (s3 - 2 * s2 + s) * h[i] * m[i] + (-2 * s3 + 3 * s2) * P[i + 1][1] + (s3 - s2) * h[i] * m[i + 1] } }
// the cut, in seconds; every hit sits on a beat of the bed (120 BPM, beats on the half second)
const T = { trio: [1, 1.5, 2], go: [4.7, 6], marks: [5, 5.25, 5.5, 5.75], race0: 6, cards: [11, 15, 19], hold: 3.4, race1: 26, stand: 28, toB1: [32, 33], b1: 33, toB2: [37.9, 39], b2: 39, toC: [43, 44], c: 44, rise: [50, 52], s2: 52, end: 57.5 };
const PX = -700, B1Y = 3500, B2Y = 4850, CY = 6400, TY = -1950;
function build() {
  const n = D.rounds, ord = D.order; A = k => D.ai.find(a => a.k === k); S.n = n; FINAL = D.final || q.get('final') === '1';
  const of = FINAL ? `${D.total} ROUNDS` : `AFTER ${n} OF ${D.total} ROUNDS`;
  let lo = 0, hi = 0; ord.forEach(k => D.s[k].forEach(v => { lo = Math.min(lo, v); hi = Math.max(hi, v) })); const pad = (hi - lo) * .06; S.lo = lo - pad; S.hi = hi + pad;
  // the three biggest moves the ride stops at, in the season's order (a round's place in the series: its number less the open rounds before it)
  S.big = D.big.slice(0, 3).map((x, r) => ({ x, r, i: L.cl(x.n - D.open.filter(o => o.n < x.n).length, 1, n) })).sort((a, b) => a.i - b.i);
  S.big.forEach((b, j) => { b.tc = T.cards[j]; b.tf = b.tc + T.hold; b.top = Math.max(...ord.map(k => D.s[k][b.i])) });
  const P = [[T.race0, 0]]; S.big.forEach(b => { const prev = P[P.length - 1][1]; P.push([b.tc - (b === S.big[0] ? .6 : .35), Math.max(prev + .05, b.i - 1)], [b.tc, b.i], [b.tf, Math.min(n, b.i + .4)]) }); P.push([T.race1, n]); S.fi = pchip(P);
  const last = S.big[S.big.length - 1]; S.kc = t => L.eio(L.n(t, S.big[0].tc - .7, S.big[0].tc - .05)) * (1 - L.eio(L.n(t, last.tf + .05, last.tf + .7)));
  // what the ride's camera frames: the heads of the last dozen rounds, smoothed
  const env = []; for (let i = 0; i <= n; i++) { let a = 0, b = 0; for (let j = Math.max(0, i - 12); j <= Math.min(n, i + 2); j++) ord.forEach(k => { a = Math.min(a, D.s[k][j]); b = Math.max(b, D.s[k][j]) }); env.push([a, b]) }
  const gs = arr => arr.map((_, i) => { let s = 0, w = 0; for (let j = -15; j <= 15; j++) { const x = arr[Math.min(n, Math.max(0, i + j))], ww = Math.exp(-j * j / 50); s += x * ww; w += ww } return s / w }); S.elo = gs(env.map(e => e[0])); S.ehi = gs(env.map(e => e[1]));
  // the pulled-back camera: the whole season across the frame, the chart's middle at y 490
  const x0 = -30, x1 = D.total * RX + 60, zp = 968 / (x1 - x0); S.pc = { cx: (x0 + x1) / 2, cy: (Y(S.hi) + Y(S.lo)) / 2 - (490 - 675) / zp, z: zp }; const ZX = S.pc.cx; S.ZX = ZX;
  // --- the world ---
  S.svg = add(`<svg id="wsvg" width="1" height="1"></svg>`, world);
  svg('defs', {}, S.svg).innerHTML = `<linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="${Y(S.hi)}" y2="${Y(S.lo)}"><stop offset="0" stop-color="${G}"/><stop offset="${(0 - Y(S.hi)) / (Y(S.lo) - Y(S.hi))}" stop-color="${G}"/><stop offset="${(0 - Y(S.hi)) / (Y(S.lo) - Y(S.hi))}" stop-color="${Rd}"/><stop offset="1" stop-color="${Rd}"/></linearGradient>`;
  const ve = { fill: 'none' }; S.sw = []; const svgs = (tag, a, w, dash) => { const e = svg(tag, { ...ve, ...a }, S.svg); S.sw.push([e, w, dash]); return e };
  S.grid = []; for (let v = Math.ceil(S.lo / 50000) * 50000; v <= S.hi; v += 50000) if (v) S.grid.push({ v, ln: svgs('line', { x1: -40, x2: x1, y1: Y(v), y2: Y(v), stroke: 'rgba(242,237,230,.08)' }, 2), lb: add(`<div class="gl">${v < 0 ? '−' : '+'}$${Math.abs(v) / 1000}K</div>`, hud) });
  svgs('line', { x1: -2600, x2: x1, y1: 0, y2: 0, stroke: '#8e8680', 'stroke-linecap': 'round' }, 2, [3, 9]); S.zl = add(`<div class="gl">$0</div>`, hud);
  S.big.forEach(b => b.mk = svgs('line', { x1: X(b.i), x2: X(b.i), y1: Y(S.hi), y2: Y(S.lo), stroke: '#f2ede6', opacity: 0 }, 2, [2, 7]));
  S.wall = svgs('line', { x1: X(D.total), x2: X(D.total), y1: Y(S.hi), y2: Y(S.lo), stroke: Au }, 5);
  S.ln = ord.map(k => ({ k, u: svg('path', { ...ve, stroke: '#0e0c0b', 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: .7 }, S.svg) }));
  S.ln.forEach(l => { l.p = svg('path', { ...ve, stroke: 'url(#sg)', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, S.svg); l.hd = add(`<div class="hd"><span class="m">${L.mark(l.k, 44)}<i></i></span><span class="v mono"></span></div>`, hud) });
  const page = (id, cam) => { const el = add(`<div class="pg" id="${id}"></div>`, world), w = 1080 / cam.z, h = 1350 / cam.z, x = cam.cx - 540 / cam.z, y = cam.cy - 675 / cam.z; el.style.transform = `translate(${x}px,${y}px) scale(${1 / cam.z})`; S.pages.push({ el, x, y, w, h }); return el }; S.pages = [];
  // 1 the premise, on the baseline before round 1 (the baseline crosses this page at y 800)
  const pp = page('pp', { cx: PX, cy: -125, z: 1 }); S.pages[S.pages.length - 1].until = 9;
  S.p1 = add(`<div id="p1"><span>We paid for</span><span>the top plan</span><span>of ${D.ai.length} AIs.</span></div>`, pp);
  S.p2 = add(`<div id="p2"><span>${D.total} earnings reports.</span><span>Long or short.</span><span><b style="color:${Au};font-weight:800">$100K</b> on every trade.</span></div>`, pp);
  // 3 the standings, under the pulled-back chart
  const ps = page('ps', S.pc); S.pages[S.pages.length - 1].until = T.toB1[1] + .3;
  S.sl = add(`<div class="lab" style="top:170px">${FINAL ? 'FINAL P&amp;L · ' + D.total + ' ROUNDS' : 'P&amp;L ' + of}</div>`, ps);
  S.rows = D.ai.map((a, i) => ({ a, i, el: add(`<div class="srow ${i ? '' : 'w'}" style="top:${790 + i * 108}px"><div class="bg"></div><div class="au"></div><span class="rk">#${a.rank}</span>${L.mark(a.k, 68)}<div class="nb"><span class="nm">${a.name}</span>${i ? '' : `<span class="tg">${FINAL ? 'SEASON 1 WINNER' : 'LEADS THE SEASON'}</span>`}</div><span class="pl" style="color:${a.pnl >= 0 ? G : Rd}"></span></div>`, ps) }));
  // 4 bears against bulls: how each AI leaned
  const b1 = page('b1', { cx: ZX, cy: B1Y, z: 1 }), M = D.mkt;
  add(`<div class="lab" style="top:204px">BEARS VS BULLS</div>`, b1);
