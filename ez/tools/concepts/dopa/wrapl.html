<!doctype html><meta charset="utf-8"><title>Season conclusion, take L: one line</title>
<!-- Take L of the Season 1 conclusion, round 3 (WRAP-BRIEF.md "Round 3" and "Round 3b", owner 2026-11-18): by time, ONE continuous
  camera over one chart world, no cuts, and at most two related data points at full contrast in any scene (P1).
  The world, in world px: the hook lies on the $0 baseline left of round 1 (two blocks, one a scene); the race chart (round r at
  x = r*18, P&L v at y = -v*.0027); under the chart four pages the camera loops through (how many stocks fell, the leader's lean,
  short everything, the accuracy lanes and the relegation); then back out to the whole season for the last beat, the winner.
  The scenes: 1 hook a  2 hook b  3 the ride (only the leader's P&L is printed; the other lines are dimmed)  4, 5 the two biggest
  moves where one AI stood out (the move, that AI's P&L)  6 the whole season  7, 8, 9 the standings, one row a scene, last place first,
  each settling into a dim list  10 stocks that fell  11 the leader's lean  12 short everything  13 accuracy, the best one's number
  14 the relegation  15 the winner, on the bed's second drop  16 "Season 2 soon."
  Every number comes from data/wrap.json (node prep-wrap.js). While a round is ungraded it prints DRAFT and says "leads", not "wins";
  ?final=1 only forces the final labels for a check. The bed is s1-l3: s1-l-src.mp3 (Hedra elevenlabs-music, 120 BPM, first beat at
  0.016 s) cut on bar lines: source 0-22 s, its break 30-32, its full section 32-54, 32-36 again, the break, 32-36, its end 54-58;
  so the breaks sit at 22-24 s and 50-52 s, the drops land at 24.0 s (the standings) and 52.0 s (the winner), a lift at 46.0 s.
  (Round 2's cut, with a Season 2 end card, is in git history; its bed is s1-l.) window.R(t), READY, CUES, MUSIC, DUR as the other pages. -->

<script>
const q = new URLSearchParams(location.search), G = '#55d6a2', Rd = '#e8576b', Au = '#fdbc2a', NS = 'http://www.w3.org/2000/svg';
const world = L.$('#world'), hud = L.$('#hud'), add = (h, p) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };
let D, S = {}, C = [], grain, FINAL, A;
const RX = 18, YS = .0027, X = i => i * RX, Y = v => -v * YS;
const money0 = v => (v < 0 ? '−' : '+') + '$' + Math.abs(Math.round(v)).toLocaleString('en-US'), pct = v => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(2) + '%';
const at = (a, f) => { const i = Math.min(a.length - 2, Math.max(0, Math.floor(f))); return L.lerp(a[i], a[i + 1], L.cl(f - i)) };
const svg = (tag, at, p) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); p.appendChild(e); return e };
const win = (t, a, b, f = .25) => L.n(t, a, a + f) * (1 - L.n(t, b - f, b));        // 1 between a and b, eased in and out over f seconds
// a monotone cubic through (t, value) points that starts and ends at rest: the season's clock, slow at the big rounds
function pchip(P) { const n = P.length, h = [], d = [], m = []; for (let i = 0; i < n - 1; i++) { h[i] = P[i + 1][0] - P[i][0]; d[i] = (P[i + 1][1] - P[i][1]) / h[i] }
  m[0] = 0; m[n - 1] = 0; for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : 3 * (h[i - 1] + h[i]) / ((2 * h[i] + h[i - 1]) / d[i - 1] + (h[i] + 2 * h[i - 1]) / d[i]);
  return t => { if (t <= P[0][0]) return P[0][1]; if (t >= P[n - 1][0]) return P[n - 1][1]; let i = 0; while (t > P[i + 1][0]) i++; const s = (t - P[i][0]) / h[i], s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * P[i][1] + (s3 - 2 * s2 + s) * h[i] * m[i] + (-2 * s3 + 3 * s2) * P[i + 1][1] + (s3 - s2) * h[i] * m[i + 1] } }
// the cut, in seconds; every hit sits on a beat of the bed (120 BPM, beats on the half second)
const T = { pan: [2.4, 2.95], go: [6.3, 7.5], race0: 7.5, cards: [12.5, 16.5], hold: 3.4, race1: 22, back0: [21.4, 23.6], rows: [24, 25.5, 27], rowLen: 1.5,
  tr: [[28.5, 29.5], [32.5, 33.5], [36.5, 37.5], [41, 42]], f: [29.5, 33.5, 37.5, 42], rel: 46, stamp: 47.5, ret: [50, 52], win: 52, s2: 54.3, end: 57.5 };
const PA = -1950, PB = -750, HY = -305;
function build() {
  const n = D.rounds, ord = D.order; A = k => D.ai.find(a => a.k === k); S.n = n; FINAL = D.final || q.get('final') === '1';
  let lo = 0, hi = 0; ord.forEach(k => D.s[k].forEach(v => { lo = Math.min(lo, v); hi = Math.max(hi, v) })); const pad = (hi - lo) * .06; S.lo = lo - pad; S.hi = hi + pad;
  // the two biggest moves where one AI stood out (the only one right, or the only one wrong), in the season's order
  const so = D.big.filter(x => x.right.length === 1 || x.wrong.length === 1), list = a => a.map(k => A(k).name).join(', ').replace(/, ([^,]*)$/, ' and $1');
  S.big = (so.length >= 2 ? so : D.big).slice(0, 2).map(x => ({ x, i: L.cl(x.n - D.open.filter(o => o.n < x.n).length, 1, n) })).sort((a, b) => a.i - b.i);
  S.big.forEach((b, j) => { const x = b.x; b.tc = T.cards[j]; b.tf = b.tc + T.hold; b.top = Math.max(...ord.map(k => D.s[k][b.i]));
    b.k = x.right.length === 1 ? x.right[0] : x.wrong.length === 1 ? x.wrong[0] : x.right[0] || null;
    b.say = x.right.length === 1 ? `Only ${A(b.k).name} was ${x.side[b.k].toLowerCase()}.` : x.wrong.length === 1 ? `Only ${A(b.k).name} missed.` : !x.right.length ? 'All four got it wrong.' : `${list(x.right)} called it.` });
  const P = [[T.race0, 0]]; S.big.forEach((b, j) => { const prev = P[P.length - 1][1]; P.push([b.tc - (j ? .35 : .6), Math.max(prev + .05, b.i - 1)], [b.tc, b.i], [b.tf, Math.min(n, b.i + .4)]) }); P.push([T.race1, n]); S.fi = pchip(P);
  S.cardK = t => S.big.reduce((a, b) => Math.max(a, win(t, b.tc - .05, b.tf + .3, .3)), 0);
  // what the ride's camera frames: the heads of the last dozen rounds, smoothed
  const env = []; for (let i = 0; i <= n; i++) { let a = 0, b = 0; for (let j = Math.max(0, i - 12); j <= Math.min(n, i + 2); j++) ord.forEach(k => { a = Math.min(a, D.s[k][j]); b = Math.max(b, D.s[k][j]) }); env.push([a, b]) }
  const gs = arr => arr.map((_, i) => { let s = 0, w = 0; for (let j = -15; j <= 15; j++) { const x = arr[Math.min(n, Math.max(0, i + j))], ww = Math.exp(-j * j / 50); s += x * ww; w += ww } return s / w }); S.elo = gs(env.map(e => e[0])); S.ehi = gs(env.map(e => e[1]));
  // the pulled-back camera: the whole season across the frame, centred
  const x0 = -30, x1 = D.total * RX + 60, zp = 968 / (x1 - x0); S.pc = { cx: (x0 + x1) / 2, cy: (Y(S.hi) + Y(S.lo)) / 2, z: zp }; const ZX = S.pc.cx;
  S.F = [{ cx: ZX - 1150, cy: 1900 }, { cx: ZX - 1150, cy: 3300 }, { cx: ZX, cy: 3300 }, { cx: ZX, cy: 1900 }];
  // --- the world ---
  S.svg = add(`<svg id="wsvg" width="1" height="1"></svg>`, world);
  svg('defs', {}, S.svg).innerHTML = `<linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="${Y(S.hi)}" y2="${Y(S.lo)}"><stop offset="0" stop-color="${G}"/><stop offset="${(0 - Y(S.hi)) / (Y(S.lo) - Y(S.hi))}" stop-color="${G}"/><stop offset="${(0 - Y(S.hi)) / (Y(S.lo) - Y(S.hi))}" stop-color="${Rd}"/><stop offset="1" stop-color="${Rd}"/></linearGradient>`;
  S.base = svg('line', { fill: 'none', x1: -3600, x2: x1, y1: 0, y2: 0, stroke: '#8e8680', 'stroke-linecap': 'round' }, S.svg); S.cg = svg('g', {}, S.svg);
  const ve = { fill: 'none' }; S.sw = [[S.base, 2, [3, 9]]]; const svgs = (tag, a, w, dash) => { const e = svg(tag, { ...ve, ...a }, S.cg); S.sw.push([e, w, dash]); return e };
  S.grid = []; for (let v = Math.ceil(S.lo / 50000) * 50000; v <= S.hi; v += 50000) if (v) S.grid.push({ v, ln: svgs('line', { x1: -40, x2: x1, y1: Y(v), y2: Y(v), stroke: 'rgba(242,237,230,.08)' }, 2), lb: add(`<div class="gl">${v < 0 ? '−' : '+'}$${Math.abs(v) / 1000}K</div>`, hud) });
  S.zl = add(`<div class="gl">$0</div>`, hud);
  S.big.forEach(b => b.mk = svgs('line', { x1: X(b.i), x2: X(b.i), y1: Y(S.hi), y2: Y(S.lo), stroke: '#f2ede6', opacity: 0 }, 2, [2, 7]));
  S.wall = svgs('line', { x1: X(D.total), x2: X(D.total), y1: Y(S.hi), y2: Y(S.lo), stroke: Au }, 5);
  S.ln = ord.map(k => ({ k, u: svg('path', { ...ve, stroke: '#0e0c0b', 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: .7 }, S.cg) }));
  S.ln.forEach(l => { l.p = svg('path', { ...ve, stroke: 'url(#sg)', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, S.cg); l.hd = add(`<div class="hd"><span class="m">${L.mark(l.k, 44)}<i></i></span><span class="nm">${A(l.k).name.toUpperCase()}</span><span class="v mono"></span></div>`, hud) });
  const page = (id, cam) => { const el = add(`<div class="pg" id="${id}"></div>`, world), z = cam.z || 1, w = 1080 / z, h = 1350 / z, x = cam.cx - 540 / z, y = cam.cy - 675 / z; el.style.transform = `translate(${x}px,${y}px) scale(${1 / z})`; S.pages.push({ el, x, y, w, h }); return el }; S.pages = [];
  // 1, 2 the hook, two blocks on the baseline before round 1 (the baseline crosses these pages at y 980)
  S.h1 = add(`<div class="blk"><div class="big" style="font-size:118px"><span>We made <b style="color:${Au};font-weight:900">${D.ai.length} AIs</b></span><span>trade earnings</span><span>for a whole</span><span>season.</span></div></div>`, page('pa', { cx: PA, cy: HY }));
  S.h2 = add(`<div class="blk"><div class="big" style="font-size:118px;line-height:1.42"><span><b style="color:${Au};font-weight:900">${D.total}</b> reports.</span><span>Long or short.</span><span><b style="color:${Au};font-weight:900">$100K</b> a trade.</span></div></div>`, page('pb', { cx: PB, cy: HY }));
  // 6 to 9 and 15, 16: the whole season, the standings one block a scene, the winner
  const ps = page('ps', S.pc); S.ps = ps; const rest = D.ai.slice(1).reverse();                       // last place first; the winner waits for the end
  S.rl = add(`<div class="lb hx" style="top:176px">${FINAL ? 'FINAL P&amp;L · ' + D.total + ' ROUNDS' : 'P&amp;L AFTER ' + n + ' OF ' + D.total + ' ROUNDS'}</div>`, ps);
  S.sb = rest.map((a, j) => ({ a, t0: T.rows[j] ?? T.rows[T.rows.length - 1], row: D.ai.indexOf(a) - 1, el: add(`<div class="sb"><div class="lb">#${a.rank}</div><div class="mkw">${L.mark(a.k, 150)}</div><div class="big">${a.name}</div><div class="num" style="color:${a.pnl >= 0 ? G : Rd}"></div></div>`, ps),
    sr: add(`<div class="sr" style="top:${1096 + (D.ai.indexOf(a) - 1) * 54}px">${L.mark(a.k, 38)}<span>${a.name}</span><span class="p" style="color:${a.pnl >= 0 ? G : Rd}">${money0(a.pnl)}</span></div>`, ps) }));
  const w = D.ai[0]; S.wb = add(`<div class="sb"><div class="mkw">${L.mark(w.k, 150)}<i></i></div><div class="big"><span>${w.name} ${FINAL ? 'wins' : 'leads'}</span><span>Season 1.</span></div><div class="num" style="color:${w.pnl >= 0 ? G : Rd}"></div></div>`, ps);
  S.s2 = add(`<div id="s2l">Season 2 soon.</div>`, ps);
  // 10 how many stocks fell
  const M = D.mkt, dn = M.down >= M.up, f1 = page('f1', S.F[0]);
  S.f1 = add(`<div class="blk"><div class="big" style="font-size:170px;line-height:1"><b style="color:${dn ? Rd : G};font-weight:900"></b> of ${n}</div><div class="big" style="margin-top:26px"><span>stocks ${dn ? 'fell' : 'rose'}</span><span>on earnings.</span></div><div class="dots">${Array.from({ length: n }, () => '<i></i>').join('')}</div></div>`, f1); S.f1n = dn ? M.down : M.up; S.f1c = dn ? Rd : G; S.f1o = dn ? G : Rd;
  // 11 the leader's lean
  const bear = w.lean === 'BEAR', ls = bear ? w.shorts : w.longs, f2 = page('f2', S.F[1]);
  S.f2 = add(`<div class="blk"><div class="big" style="line-height:1.12"><span style="display:flex;align-items:center;justify-content:center;gap:24px">${L.mark(w.k, 104)}${w.name} ${bear ? 'shorted' : 'bought'}</span><span><b style="color:${bear ? Rd : G};font-weight:900">${ls}</b> of its ${w.calls}</span><span>calls.</span></div>
    <div class="split"><i class="a" style="left:0;background:${bear ? Rd : G}"></i><i class="b" style="right:0;background:${bear ? G : Rd};opacity:.35"></i></div></div>`, f2); S.f2w = Math.round(900 * ls / Math.max(1, w.calls));
  // 12 short everything against the leader
  const beat = M.short > w.pnl, f3 = page('f3', S.F[2]), vmax = Math.max(M.short, w.pnl, 1);
  S.f3 = add(`<div class="blk"><div class="big">Short everything:</div><div class="num" style="color:${Au};margin-top:14px"></div><div class="big" style="margin-top:18px">${beat ? 'No AI beat that.' : w.name + ' beat it.'}</div>
    <div class="bar2"><i class="mk"></i></div><div class="bar2" style="margin-top:16px;opacity:.35"><i style="background:${w.pnl >= 0 ? G : Rd};width:${Math.max(8, 900 * Math.max(0, w.pnl) / vmax)}px"></i></div><div class="lb" style="margin-top:16px;align-self:flex-start;margin-left:90px">${w.name.toUpperCase()} ${money0(w.pnl)}</div></div>`, f3); S.f3w = 900 * Math.max(0, M.short) / vmax;
  // 13, 14 accuracy: the best one's number, then the relegation
  const f4 = page('f4', S.F[3]), sc = 872 / 75, x50 = 56 + 96 + 50 * sc, rl = D.ai.filter(a => D.releg.includes(a.k)), best = [...D.ai].sort((a, b) => b.hitx - a.hitx)[0];
  S.f4 = add(`<div class="blk" style="height:0"><div class="big hd4" style="position:absolute;left:0;width:1080px"><span>How often did they</span><span>pick the right side?</span></div>
    <div class="big rl4" style="position:absolute;left:0;width:1080px"><span>${rl.length ? list(rl.map(a => a.k)) + (rl.length > 1 ? ' were' : ' was') + ' wrong' : 'All four were right'}</span><span>more often than ${rl.length ? 'right.' : 'wrong.'}</span></div></div>`, f4);
  S.lane = D.ai.map((a, i) => { const rel = D.releg.includes(a.k), el = add(`<div class="lane">${L.mark(a.k, 72)}<div class="tr"></div><div class="fl" style="background:${rel ? Rd : G}"></div><div class="pc" style="color:${rel ? '#0e0c0b' : G}"></div></div>`, f4); return { a, i, rel, best: a === best, el, w: a.hitx * sc } });
  S.h50 = add(`<div id="h50"></div>`, f4); S.l50 = add(`<div class="lb" style="position:absolute;transform:translateX(-50%);left:${x50}px;font-size:44px;letter-spacing:0">50%</div>`, f4); S.x50 = x50;
  S.stamp = rl.length ? add(`<div id="stamp">RELEGATED</div>`, f4) : null; S.rel = rl;
  // --- on the frame ---
  add(`<div class="bug"><img src="ezlogo.svg" alt=""><span>EARNINGS ZEASON</span><b>SEASON 1</b></div>`, document.body);
  if (!FINAL) add(`<div id="dr">DRAFT · ${n}/${D.total} GRADED</div>`, document.body);
  S.ctr = add(`<div id="ctr" class="lb">ROUND 0</div>`, hud);
