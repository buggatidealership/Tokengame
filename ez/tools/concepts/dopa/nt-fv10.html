<!doctype html><meta charset="utf-8"><title>EZ feed FV10 Most confident</title>
<!-- FEED FILMS DESK B, FV10 "Conviction" (night of 20 Nov 2026). The feature: sort the feed by confidence; every post's stated confidence shown as an
  instrument. Message: see who means it, then see who was right (research F2.16: a confidence number beside the observed record calibrates trust).
  Story (measure, sort, grade): Intuit's five calls in the app; a cut to the confidence instrument, five dials on a 50 to 100% scale, the needles
  swing to each AI's stated confidence (Qwen 58, Claude 56, Grok 65, Gemini 61, GPT 57, calls.csv); pull back; the fingertip sets the feed's sort to
  MOST CONFIDENT and on the drop the posts re-sort (Grok, Gemini, Qwen, GPT, Claude); Grok's post lifts with its dial and key clause (verbatim);
  the close stamps every post RIGHT or WRONG down the sorted list (Grok and Claude RIGHT, the other three WRONG): confidence is shown, not sold.
  Ground: painted brushed metal (Hedra, w6/nt/fvb/g10.jpg). Type: Saira Condensed (our lines, the dial figures) and Geist Mono (scales, labels);
  the app's own Inter. Camera: wide, a hard cut to a locked macro on the instrument, a pull-back reveal, a push on the leader. Motion: needles on
  springs with overshoot, a physical re-sort, stamps. Brand in the scene: the app header (0 to 2 s, again from 4.9 s after the pull-back), the
  instrument's EZ. plate (2 to 4.8 s), the receipts' EZ. marks (from 8.7 s).
  Bed nt-fv10 (m3-electro from 1.936 s, bedx.py): its kick drops at B(12) = 5.83 s, on the re-sort. -->
<style>
#hl{position:absolute;left:30px;right:30px;top:150px;height:120px;text-align:center;z-index:70;font:800 104px/1 'Saira Condensed';letter-spacing:-.01em;color:#f8f0d9;text-shadow:0 8px 30px rgba(0,0,0,.6)}
#hl>div{position:absolute;left:0;right:0;top:0}
#hls{position:absolute;left:0;right:0;top:0;height:330px;z-index:69;pointer-events:none;background:linear-gradient(180deg,rgba(4,7,14,.85),rgba(4,7,14,.6) 55%,rgba(4,7,14,0))}
#pulse{background:radial-gradient(60% 45% at 35% 25%,rgba(253,188,42,.4),transparent 70%)}
#veil{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 50%,rgba(0,0,0,.5),rgba(0,0,0,.3));opacity:0;pointer-events:none;z-index:20}
#lift{z-index:30}
/* the instrument: dials on a glass plate */
.ins{width:358px;margin-bottom:12px;padding:0 12px 14px;border-radius:22px;background:rgba(10,13,15,.97);box-shadow:inset 0 0 0 1.5px var(--ln);overflow:hidden}
.ins .is{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 -12px 8px;padding:8px 0;background:rgba(253,188,42,.1);box-shadow:inset 0 -1px 0 rgba(253,188,42,.3);font:700 11.5px/1 'Geist Mono';letter-spacing:.16em;color:#fdbc2a}
.ins .is em{font-style:normal;color:var(--mu)}
.dg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.dl{grid-column:span 2;position:relative;height:118px;border-radius:14px;background:radial-gradient(90% 70% at 50% 85%,#121a1c,#05080a);box-shadow:inset 0 0 0 1.2px rgba(248,240,217,.16),inset 0 1px 0 rgba(255,255,255,.1)}
.dl:nth-child(4){grid-column:2 / span 2}
.dl svg.ar{position:absolute;left:6px;top:6px;width:100px;height:58px}
.dl .v{position:absolute;left:0;right:0;top:44px;text-align:center;font:800 26px/1 'Saira Condensed';color:#f8f0d9}
.dl .who{position:absolute;left:0;right:0;bottom:9px;display:flex;align-items:center;justify-content:center;gap:5px;font:700 10.5px/1 Inter;color:#f8f0d9}
.dl .who b{font:700 9.5px/1 'Geist Mono';letter-spacing:.04em}
/* the feed (sortable): compact posts with a small dial */
.srt{display:flex;align-items:center;gap:8px;margin:0 2px 10px;font:700 10.5px/1 'Geist Mono';letter-spacing:.12em;color:var(--mu)}
.srt .chip{position:relative;margin-left:auto;height:28px;width:164px;border-radius:9px;background:rgba(253,188,42,.1);box-shadow:inset 0 0 0 1.5px rgba(253,188,42,.4);overflow:hidden;color:#fdbc2a}
.srt .chip span{position:absolute;left:0;right:0;top:0;height:28px;line-height:28px;text-align:center}
.fd{position:relative;height:560px}
.fp{position:absolute;left:0;width:358px;height:96px;padding:11px 12px;border-radius:18px;background:rgba(12,16,18,.97);box-shadow:inset 0 0 0 1.5px var(--ln)}
.fp .ph b{display:block;font:700 15.5px/1 Inter}.fp .ph small{display:block;margin-top:5px;font:500 11.5px/1 'Geist Mono';color:var(--mu)}
.fp .sd{position:absolute;left:62px;bottom:13px;font:700 13.5px/1 'Geist Mono';white-space:nowrap}.fp .sd span{font-size:12px}
.fp .md{position:absolute;right:10px;top:10px;width:76px;height:76px}
.fp .md svg{position:absolute;left:0;top:4px;width:76px;height:44px}.fp .md b{position:absolute;left:0;right:0;top:44px;text-align:center;font:800 22px/1 'Saira Condensed';color:#f8f0d9}
.fp .md small{position:absolute;left:0;right:0;top:66px;text-align:center;font:600 8.5px/1 'Geist Mono';letter-spacing:.06em;color:var(--mu)}
.fp .stp{position:absolute;right:94px;top:50%;margin-top:-16px;height:32px;padding:0 9px;border-radius:8px;font:800 16px/32px 'Geist Mono';letter-spacing:.06em;color:#04070e;opacity:0;display:flex;gap:6px;align-items:center}
.fp .stp .bm{width:16px;height:16px}
.fp .stp.ok{background:#03c870}.fp .stp.no{background:#ff3a31}
/* the lifted post's dial row */
.cdl{position:relative;display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px 12px;border-radius:14px;background:rgba(3,5,7,.6);box-shadow:inset 0 0 0 1.2px var(--ln)}
.cdl svg{width:96px;height:56px;flex:none}.cdl b{font:800 34px/1 'Saira Condensed';color:#f8f0d9}.cdl small{display:block;font:700 11px/1 'Geist Mono';letter-spacing:.12em;color:var(--mu)}
#endc h3{font-family:'Saira Condensed';font-weight:800;font-size:132px;letter-spacing:-.01em}
</style>
<div id="st">
<div id="gnd"></div><div id="pulse"></div>
<div id="cam"></div>
<div id="veil"></div><div id="lift"></div>
<div id="hls"></div><div id="hl"></div>
<div id="td"></div><div id="tr"></div>
<div id="vig"></div><canvas id="grain"></canvas>
</div>
<script src="lib.js"></script><script src="w6/nt/fvb/fvb.js"></script>
<script>
const B = FB.B, n = FB.n, cl = FB.cl, lerp = FB.lerp, eo = FB.eo, eio = FB.eio, spr = FB.spr, DUR = 15.0;
const LINES = [['How sure is each AI', -1, B(4.4)], ['Five AIs on {y Intuit}', B(4.8), B(10.2)], ['Most {y confident} first', B(12.3), B(18)], ['Then see who was {g right}', B(18.4), B(24.6)]];
const T = { macro: B(4), needles: [B(5), B(6), B(7), B(8), B(9)], back: B(10), tap: B(11), sort: B(12), lead: B(14), leadDn: B(17.6), grade: B(18.5), end: B(25) };
const CHRONO = ['QWEN', 'CLAUDE', 'GROK', 'GEMINI', 'GPT'];
let grain, ORD;
// a dial: a 50 to 100% half circle; ticks every 5; the filled arc and the needle at the value (v is set per frame)
const ARC = (w, h, stroke) => `<svg class="ar" viewBox="0 0 100 58"><path d="M8 52 A42 42 0 0 1 92 52" fill="none" stroke="rgba(248,240,217,.16)" stroke-width="${stroke}" stroke-linecap="round"/>
  <path class="fill" d="M8 52 A42 42 0 0 1 92 52" fill="none" stroke-width="${stroke}" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
  ${Array.from({ length: 11 }, (_, i) => { const a = Math.PI * (1 - i / 10), r1 = 42 - stroke / 2 - 2, r2 = r1 - (i % 5 ? 4 : 7); return `<line x1="${(50 + r1 * Math.cos(a)).toFixed(2)}" y1="${(52 - r1 * Math.sin(a)).toFixed(2)}" x2="${(50 + r2 * Math.cos(a)).toFixed(2)}" y2="${(52 - r2 * Math.sin(a)).toFixed(2)}" stroke="rgba(248,240,217,.5)" stroke-width="1.2"/>` }).join('')}
  <line class="ndl" x1="50" y1="52" x2="50" y2="16" stroke="#fdbc2a" stroke-width="2.6" stroke-linecap="round"/><circle cx="50" cy="52" r="4" fill="#fdbc2a"/></svg>`;
const setDial = (svg, v, col) => { if (!svg) return; const f = cl((v - 50) / 50), a = -90 + 180 * f; svg.querySelector('.ndl').setAttribute('transform', `rotate(${a.toFixed(2)} 50 52)`);
  const fl = svg.querySelector('.fill'); fl.setAttribute('stroke-dasharray', `${(100 * f).toFixed(2)} 100`); fl.setAttribute('stroke', col) };
(async () => {
  await FB.load(`@import url('https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&display=swap');`, ["800 104px 'Saira Condensed'", "800 26px 'Saira Condensed'"]);
  const D = FB.D, P = k => FB.post(k, 'INTU'); ORD = CHRONO.slice().sort((a, b) => P(b).conf - P(a).conf);
  L.$('#gnd').style.backgroundImage = 'url(w6/nt/fvb/g10.jpg)';
  const ins = `<div class="ins" id="ins"><div class="is">${FB.EZ(22)}CONFIDENCE<em>INTUIT</em></div><div class="dg">${CHRONO.map(k => `<div class="dl" data-k="${k}">${ARC(100, 58, 7)}<div class="v">–</div><div class="who">${FB.mark(k, 16, false)}${P(k).name}<b class="${P(k).side[0]}">${P(k).side}</b></div></div>`).join('')}</div></div>`;
  const fps = CHRONO.map(k => { const x = P(k); return `<div class="fp" data-k="${k}"><div class="ph">${FB.mark(k, 38)}<div><b>${x.name}</b><small>${x.lab}</small></div></div><div class="sd ${x.side[0]}">${FB.sideTxt(x)}</div>
    <div class="md">${ARC(76, 44, 6).replace('class="ar"', '')}<b>${x.conf}%</b><small>CONFIDENT</small></div><div class="stp ${x.right ? 'ok' : 'no'}">${FB.EZ(16)}${x.right ? 'RIGHT' : 'WRONG'}</div></div>` }).join('');
  L.$('#cam').innerHTML = FB.phoneHTML(`<div class="vw"><div class="vh"><small>FEED</small><b>Intuit</b></div>${ins}<div class="srt">SORT<div class="chip"><span id="c1">LATEST</span><span id="c2">MOST CONFIDENT</span></div></div><div class="fd">${fps}</div></div>`);
  const g = P('GROK'); const hold = document.createElement('div'); hold.style.cssText = 'position:absolute;left:-2000px;top:0;width:358px';
  hold.innerHTML = FB.postHTML(g, { id: 'gp', rows: `<div class="cdl">${ARC(96, 56, 7)}<div><small>CONFIDENT</small><b>${g.conf}%</b></div></div>` }); document.body.appendChild(hold);
  FB.bug(L.$('#st'));
  L.$('#st').insertAdjacentHTML('beforeend', FB.endHTML('Most confident', "'Saira Condensed'"));
  L.$('#hl').innerHTML = LINES.map((l, i) => `<div id="h${i}">${FB.words(l[0])}</div>`).join('');
  grain = L.grain(L.$('#grain'), .05);
  await document.fonts.ready;
  FB.mkLift('ins', L.$('#ins')); FB.mkLift('gp', L.$('#gp'), 'foc'); FB.lifts.gp.el = L.$('.fp[data-k="GROK"]');
  window.CUES = [[.05, 'r11-swell', .1], [T.macro, 'sfx-whoosh', .1], ...T.needles.map(a => [a, 'r11-pluck', .08]), [T.back, 'sfx-whoosh', .08], [T.tap, 'sfx-tap', .13],
    [T.sort, 'sfx-whoosh', .1], [T.sort + .1, 'r11-card', .08], [T.lead, 'sfx-whoosh', .09], ...ORD.map((_, i) => [T.grade + i * FB.BT / 2, 'sfx-stamp', .07]), [T.end + .1, 'sfx-chime', .12], [T.end + .6, 'r11-sparkle', .07]];
  window.MUSIC = { f: 'nt-fv10', at: 0 }; window.DUR = DUR;
  await FB.ready();
})().catch(e => { document.title = 'ERR ' + e.message; console.error(e) });

const colOf = x => x.side === 'LONG' ? '#03c870' : '#ff3a31';
window.R = t => {
  grain(t);
  const bp = t < T.sort ? .3 * Math.exp(-((t - FB.PH) % FB.BT) / .2) : Math.exp(-((t - FB.PH) % FB.BT) / .18); L.$('#pulse').style.opacity = (bp * .75).toFixed(3);
  const ma = t >= T.macro && t < T.back + .6, ed = eio(n(t, T.end - .2, T.end + .7));
  L.$('#gnd').style.transform = `translate(${(ma ? -30 : 0)}px,${(ma ? -20 : 0)}px) scale(${((ma ? 1.25 : 1.05) + .01 * Math.sin(t * .4)).toFixed(4)})`;
  // the phone: wide at first (its header in the middle of the frame); it waits under the instrument; after the pull-back it sits a little larger
  const pb = eio(n(t, T.back, T.back + .7));
  FB.place(L.$('.phw'), { t, cx: 540 + 5 * Math.sin(t * .5), cy: lerp(780, 820, pb) + 1300 * ed + 5 * Math.sin(t * .6), z: lerp(1.02, 1.55, pb), rx: 2.5 + 1.4 * Math.sin(t * .43), ry: 2.4 * Math.sin(t * .51), rz: .3 * Math.sin(t * .37) });
  // the instrument: a hard cut to it (lifted, filling the frame); its needles swing to each AI's confidence on the beats; then it drops back into the feed
  const ki = FB.lift('ins', t, T.macro - .02, T.back, () => ({ x: 540, y: 360, z: 2.62 }), { du: .25, dd: .55, float: 2, wob: .15 });
  const P = k => FB.post(k, 'INTU');
  [L.$('#ins'), FB.lifts.ins.c].forEach(card => card.querySelectorAll('.dl').forEach((d, i) => { const x = P(d.dataset.k), a = T.needles[i], s = FB.sprB(n(t, a, a + 1.4)), v = 50 + (x.conf - 50) * s;
    setDial(d.querySelector('svg'), v, colOf(x)); d.querySelector('.v').textContent = t < a ? '–' : Math.round(50 + (x.conf - 50) * cl(s)) + '%';
    d.style.boxShadow = t >= a && t < a + .5 ? `inset 0 0 0 ${(1.2 + 1.8 * Math.sin(Math.PI * n(t, a, a + .5))).toFixed(2)}px rgba(253,188,42,.8)` : '' }));
  // after the pull-back the instrument folds away in the phone, so the whole feed shows
  const ih = L.$('#ins'); if (!ih.dataset.h) ih.dataset.h = ih.offsetHeight; const fo = eio(n(t, T.back + .3, T.back + .8)); ih.style.height = (ih.dataset.h * (1 - fo)).toFixed(1) + 'px'; ih.style.marginBottom = (12 * (1 - fo)).toFixed(1) + 'px'; ih.style.opacity = (1 - fo).toFixed(3);
  // the feed's small dials (set) and the re-sort on the drop: each post travels to its rank, with a little swing
  L.$$('.fp').forEach(f => { const x = P(f.dataset.k), i0 = CHRONO.indexOf(x.k), i1 = ORD.indexOf(x.k), a = T.sort + .04 * i1, k = FB.sprB(n(t, a, a + 1.2));
    const y = lerp(i0 * 104, i1 * 104, k), sw = Math.sin(Math.PI * cl(n(t, a, a + .5))) * (i1 < i0 ? -1 : 1);
    f.style.transform = `translate(${(18 * sw).toFixed(1)}px,${y.toFixed(1)}px) rotate(${(1.5 * sw).toFixed(2)}deg)`; f.style.zIndex = i1 < i0 ? 3 : 1;
    setDial(f.querySelector('.md svg'), t < T.needles[0] ? 50 : x.conf, colOf(x));
    const st = f.querySelector('.stp'), g = T.grade + i1 * FB.BT / 2, q = n(t, g, g + .3); st.style.opacity = t >= g ? 1 : 0; st.style.transform = `scale(${(1 + .5 * (1 - eo(q))).toFixed(3)})` });
  const cs = eio(n(t, T.tap + .1, T.tap + .4)); L.$('#c1').style.transform = `translateY(${(-28 * cs).toFixed(1)}px)`; L.$('#c2').style.transform = `translateY(${(28 - 28 * cs).toFixed(1)}px)`;
  // the leader lifts: its dial big, its key clause, then it drops back for the grade
  const o = FB.lifts.gp, kg = FB.lift('gp', t, T.lead, T.leadDn, () => ({ x: 540, y: 340, z: Math.min(2.3, (1160 - 340) / o.h0) }), { dd: .5 });
  setDial(o.c.querySelector('.cdl svg'), 50 + 15 * FB.sprB(n(t, T.lead + .3, T.lead + 1.6)), '#ff3a31'); FB.sweep(o.hlc, eio(n(t, T.lead + .7, T.lead + 1.5)));
  const dim = cl(Math.max(ki, kg)); FB.dim(dim); L.$('#veil').style.opacity = (.8 * dim).toFixed(3);
  FB.touch(0, 0, 0, 0, 0); FB.tap(t, T.tap, L.$('.srt .chip'), 30, 0);
  LINES.forEach((l, i) => FB.rise(L.$('#h' + i), t, l[1], l[2]));
  L.$('#gnd').style.opacity = (1 - .7 * ed).toFixed(3);
  FB.endR(t, T.end + .1);
};
</script>
