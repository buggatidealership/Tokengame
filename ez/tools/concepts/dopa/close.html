<!doctype html><meta charset="utf-8"><title>The close</title>
<!-- Season 2's outcome video: one video per market close, every round graded at that close in it (owner, 2026-11-20: "3 into one...
  there will be days where we'll have like 5, 6, or even like 10"). close.html?d=<YYYY-MM-DD> reads data/close-<date>.json, written by
  prep-close.js from the sheet. The approved outcome format (outcome.html: the chart moving, the P&Ls at the bottom, glass) widened to
  a whole close, on m2-phonk with its drop on the bell (130 BPM, beat B(n) = 7.5 + n x 0.4615 s):
  0.12  the plain line alone: the day's close; the companies land one a beat under it, name and ticker
  1.96  the line docks top left, the companies become the chart's line heads and the board's column heads, the five AIs fly into rows
  2.42  the night: every company's real path on one chart from the close before (green above 0, red below), the clock, each AI's P&L
        live as the sum of its trades, each AI's side under each company
  7.50  the bell: FINAL, every trade graded (right lit, wrong dimmed), the P&Ls land
  8.42  the rows sort by the night's P&L       9.35 the chart folds away, the rows become the Season 2 board
  9.81  Season 2 P&L (from the second close on, the totals roll from the season before to after, with the night's P&L beside them)
  13.2  the leader takes the gold rim; held to the end.
  Words on screen: no punctuation of any kind; sides are LONG or SHORT; every number carries its label; $100K on every trade. -->

<script>
L.$('#base').textContent = L.css;

    pv.textContent = ['PREVIEW', 'PRICES AT ' + clock(D.total).t + ' ET', 'NOT FINAL'].join(SEP) }
  L.chrome(document.body); L.$('.bug b').remove(); L.$('.fine').textContent = '$100K on every trade' + SEP + SEP + 'not advice';

  const cw = N <= 4 ? 110 : Math.min(60, 470 / N); cols = D.rounds.map((r, j) => 290 + cw * j + cw / 2);
  rows = D.ais.map(a => { const el = document.createElement('div'); el.className = 'row'; el.dataset.k = a.k;
    el.innerHTML = `<div class="bg"></div><div class="bar"></div><div class="tip"></div><div class="gl"></div><div class="rim"></div><div class="sp"></div>
      <div class="in"><span class="rk"></span><span class="mkw">${mark(a.k, 50)}</span><span class="nm">${a.name}</span><span class="pl"></span></div><span class="tn"></span>
      ${D.rounds.map((r, j) => { const c = r.calls.find(x => x.k === a.k); return `<div class="cell ${c.side[0]}${N > 4 ? ' p' : ''}" style="left:${cols[j] - (N > 4 ? 20 : 48)}px">${N > 4 ? '' : c.side}</div>` }).join('')}`;

    [T_SORT, 'sfx-whoosh', .1], [T_SORT + .3, 'r11-card', .08], [T_FOLD, 'sfx-whoosh', .14], [T_SSN, 'r11-thump', .14], [T_LEAD, 'sfx-chime', .14], [T_LEAD + .05, 'r11-sparkle', .1]);

    const bl = [[AU, 900, [540, 900], 150, 120, 15, 0], [UP, 760, [40, 1000], 60, 70, 13, 2.1], [DN, 760, [1050, 1250], 60, 70, 17, 4.2]].map(([c, sz, p, ax, ay, per, ph]) => ({ p, ax, ay, per, ph, el: add(`<div class="bl" style="width:${sz}px;height:${sz}px;margin:${-sz / 2}px 0 0 ${-sz / 2}px;background:radial-gradient(closest-side,rgba(${c},.5),rgba(${c},.2) 38%,rgba(${c},0) 74%)"></div>`) }));

};
const coGap = () => N <= 3 ? BEAT : N <= 6 ? BEAT / 2 : BEAT / 3;

// line heads never sit on each other: spread to a 60px gap inside the chart, in value order

  const over = o.at(-1).y - (CH - 40); if (over > 0) for (let i = o.length - 1; i >= 0; i--) { o[i].y -= over; if (i && o[i].y - o[i - 1].y >= g) break; if (i) o[i - 1].y = Math.min(o[i - 1].y, o[i].y - g) }
  const r = []; o.forEach(x => r[x.i] = Math.max(20, x.y)); return r };

  const T = D.total, m = mAt(t), dk = L.eio(L.n(t, T_DOCK, T_DOCK + .55)), fold = L.eio(L.n(t, T_FOLD, T_FOLD + .6));

  L.$('#ts').style.opacity = 1 - L.n(t, T_DOCK, T_DOCK + .25);

  heads.forEach((el, j) => { const r = D.rounds[j], v = vNow[j], on = L.n(t, T_DOCK + .2, T_NIGHT + .1) * (1 - fold), sp = el.lastElementChild;

  const c = clock(m); L.$('#cd').textContent = t < T_NIGHT ? 'NEW YORK' : c.day + SEP + 'NEW YORK'; L.$('#ct').textContent = t < T_NIGHT ? '' : (t >= TR && !D.preview ? '4:00 PM' : c.t);

      ce.style.opacity = cc.right ? 1 : 1 - .72 * g; ce.style.filter = cc.right ? `brightness(${1 + .5 * g}) drop-shadow(0 0 ${10 * g}px rgba(${cc.side === 'LONG' ? UP : DN},.6))` : `saturate(${1 - .7 * g})`;

  // Season 2 P&L

  // the colour of the night: the larger side's colour washes in with the move; gold at the bell
  const net = D.rounds.reduce((s, r, j) => s + vNow[j], 0) / N, w = L.cl(Math.abs(net) / 6), mc = net >= 0 ? UP : DN, oc = net >= 0 ? DN : UP, b = L.n(t, TR, TR + .6) * (1 - .6 * L.n(t, TR + .6, 9.5));
  L.$('#glow').style.background = `radial-gradient(ellipse 80% 40% at 30% 18%,rgba(${mc},${(.05 + .14 * w) * (1 - fold)}),transparent 70%),radial-gradient(ellipse 90% 35% at 50% 100%,rgba(${oc},${(.03 + .08 * w)}),transparent 70%),radial-gradient(ellipse 70% 45% at 50% 45%,rgba(253,188,42,${.16 * b}),transparent 70%)`;
  const push = 1 + .015 * L.n(t, 0, T_NIGHT) + .025 * L.eio(L.n(t, 5.8, TR)) - .025 * L.eio(L.n(t, TR + .3, T_SORT)) + .02 * L.n(t, T_SSN, 15.5);
  const kick = t > TR ? Math.exp(-(t - TR) * 9) * Math.sin((t - TR) * 60) * 4 : 0;
  cam.style.transform = `translate(${kick}px,${kick * .6}px) scale(${push})`;
};
