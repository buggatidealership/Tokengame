<!doctype html><meta charset="utf-8"><title>Round outcome P&amp;L</title>
<!-- P&L-chart takes (owner, 2026-11-13: "instead of having these stock price in a chart format, show in chart format the P&Ls
  of each individual model"). ?m=1 one chart, a line per side with the AIs on it riding its head; ?m=2 one lane per AI, its own
  P&L line under its name (the rows and the chart become one). Same scale for every line; flat $100K, so same-side AIs share a line.
  Everything else is cut 7.
  The round outcome video for any graded round (owner, 2026-11-13: "keep this format... the one that you did for Core Weave... for
  every single round that gets resolved"). outcome.html?r=<round> reads data/r<round>.json, written by prep.js from ez-data.js only.
  Cut 7's design and timing (15.5 s, m2-phonk with its drop on the bell at 7.5 s):
  0.0  the stakes (company, the split, the four AIs and their sides)   1.5 the title docks, the AIs fly into their P&L rows
  2.3  the real path (Hyperliquid, scaled onto the sheet's move), every P&L a live glow bar; without a market the clock runs and
       only the two real closes are drawn (no invented intraday prices), the P&Ls land at the bell
  7.5  the bell: FINAL, the right-side AIs take gold light (WINNER), the others dim at the same type size
  8.45 the winners' screen ("<AI> made +$X", counted up from $0)   11.4 the season board, before the round -> after it, rows swap
       if a rank changes. -->

<script>
L.$('#base').textContent = L.css;
const QS = new URLSearchParams(location.search), RN = +(QS.get('r') || 106), M = +(QS.get('m') || 1);
let D, R, cam = L.$('#cam');
const UP = '85,214,162', DN = '232,87,107', AU = '253,188,42';
const TR = 7.5, BEAT = 60 / 130, B = n => TR + n * BEAT;
const A0 = 8.45, A1 = B(4), C0 = B(9) - .3, C1 = B(10), S0 = C1, S1 = B(12) + .2, END = 15.5;
const CW = 968, CH = 540;
let P0, P1, YP, pgrid, groups, LK, LH = 138, LW = 940, hds, rows, srows, K, mAt, X, Y, y0, y1, grid, PATH, pxAt, barFull, xlabels;
const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const setup = () => {
  R = D; R.stake = 100000; L.R = { ...L.R, n: D.n }; L.chrome(document.body);
  const T = D.total, o = D.open, rp = D.report == null ? 0 : D.report;
  // the time map: the first hour after the close (or after the report), the night, the session, the last hour slow
  const k1 = Math.min(Math.max(60, rp + 45), o - 30);
  K = [[2.3, 0], [3.3, k1], [4.1, o], [5.6, T - 60], [TR, T]];
  mAt = t => { if (t <= K[0][0]) return 0; for (let i = 1; i < K.length; i++) if (t <= K[i][0]) { const x = (t - K[i - 1][0]) / (K[i][0] - K[i - 1][0]); return L.lerp(K[i - 1][1], K[i][1], i === K.length - 1 ? 1 - Math.pow(1 - x, 1.6) : L.eio(x) * .3 + x * .7) } return T };
  PATH = D.path;
  pxAt = m => { if (!PATH) return 0; if (m <= 0) return 0; if (m >= T) return D.move; let i = 1; while (i < PATH.length && PATH[i][0] < m) i++; const a = PATH[i - 1], b = PATH[i] || PATH[i - 1]; return L.lerp(a[1], b[1], (m - a[0]) / Math.max(1, b[0] - a[0])) };
  // the chart's scale follows the move: gridlines at a round step, the 0% line always in
  const vals = PATH ? PATH.map(p => p[1]) : [0, D.move, ...D.ai.filter(a => a.call != null).map(a => a.call)]; let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals); const r = hi - lo;
  const step = r > 24 ? 10 : r > 10 ? 5 : r > 4 ? 2 : r > 2 ? 1 : .5; y0 = Math.floor((lo - r * .08) / step) * step; y1 = Math.ceil((hi + r * .12) / step) * step;
  grid = []; for (let v = y0; v <= y1 + 1e-9; v += step) grid.push(+v.toFixed(2));
  X = m => 20 + m / T * (CW - 40); Y = v => CH - 30 - (v - y0) / (y1 - y0) * (CH - 60);
  barFull = Math.max(Math.abs(D.move), ...vals.map(Math.abs)) * 1000 * 1.08;
  const hr = h => { const H = Math.floor(h); return (H > 12 ? H - 12 : H) + (h % 1 ? ':30' : '') + (H >= 12 ? ' PM' : ' AM') };
  const rep = D.report != null && D.report > 0 && D.report < T;
  xlabels = [[0, `${D.day0} ${hr(D.closeH).replace(':00', '')}${rep && D.report < 30 ? ' · REPORT' : ''}`, 'start'], [o, `${D.day1} OPEN`, 'middle'], [T, 'CLOSE', 'end']];
  if (rep && D.report >= 30 && Math.abs(D.report - o) > 90) xlabels.push([D.report, 'REPORT', 'middle']);
  // the P&L scale: every line on one scale, the $0 line always in, gridlines at a round dollar step
  groups = ['LONG', 'SHORT'].map(sd => ({ sd, g: sd === 'LONG' ? 1 : -1, ai: D.ai.filter(a => a.side === sd) })).filter(q => q.ai.length);
  const pv = (PATH ? PATH.map(p => p[1]) : [0, D.move]).map(x => x * 1000);
  const dv = groups.flatMap(q => pv.map(x => q.g * x)); let plo = Math.min(0, ...dv), phi = Math.max(0, ...dv); const pr = phi - plo || 1;
  const pst = [500, 1000, 2000, 2500, 5000, 10000, 20000, 25000, 50000].find(x => pr / x <= 10) || 100000;
  P0 = Math.floor((plo - pr * .04) / pst) * pst; P1 = Math.ceil((phi + pr * .04) / pst) * pst;
  // lanes: one dollars-per-pixel for all four, each lane's $0 line placed so its own path fills the lane
  groups.forEach(q => { const w = pv.map(x => q.g * x); q.lo = Math.min(0, ...w); q.hi = Math.max(0, ...w) }); LK = (LH - 20) / Math.max(1, ...groups.map(q => q.hi - q.lo));
  pgrid = []; for (let v = P0; v <= P1 + 1e-9; v += pst) pgrid.push(v);
  YP = v => CH - 30 - (v - P0) / (P1 - P0) * (CH - 60);
  L.$('#ck').style.color = D.move >= 0 ? '#55d6a2' : '#e8576b';
  if (M === 1) hds = groups.map(q => { const el = document.createElement('div'); el.className = 'hd';
    el.innerHTML = `<span class="mks">${q.ai.map(a => L.mark(a.k, 52)).join('')}</span><span class="v"></span>`; L.$('#hds').appendChild(el); return el });
  // the static words
  L.$('#cname').textContent = D.co; L.$('#clogo').src = D.logo || 'ezlogo.svg';
  const sp = D.split.match(/^(\d+) LONG vs (\d+) SHORT$/);
  L.$('#vs').innerHTML = sp ? `<span class="up">${sp[1]} LONG</span><i>vs</i><span class="dn">${sp[2]} SHORT</span>` : `<span class="${/LONG/.test(D.split) ? 'up' : 'dn'}">${D.split}</span>`;
  L.$('#ssk').textContent = `$100K A TRADE · AFTER ROUND ${D.n}`;
  L.$('#ms1').textContent = `THIS ROUND · ${D.co.toUpperCase()} ${D.pct}`; L.$('#ms2').textContent = D.line3;
  const who = D.line1.replace(/ [+−]\$[\d,]+( each)?$/, ''), each = / each$/.test(D.line1), W = D.ai.filter(a => a.right);
  const marks = (W.length ? W : D.ai).map(a => L.mark(a.k, W.length === 1 ? 120 : 76)).join('');
  L.$('#mwho').innerHTML = `<span class="mks">${marks}</span><span>${who}</span>`; if (who.length > 14) L.$('#mwho').classList.add('long');
  const won = D.kind !== 'all-wrong', col = won ? '#55d6a2' : '#e8576b', hl = won ? '#e8fff4' : '#ffe8ec';
  const amt = L.$('#mamt'); amt.style.backgroundImage = `linear-gradient(100deg,${col} 42%,${hl} 50%,${col} 58%)`; amt.style.filter = `drop-shadow(0 0 28px rgba(${won ? UP : DN},.45))`;
  amt.dataset.each = each ? '1' : '';
  L.$('#now').style.color = D.move >= 0 ? '#55d6a2' : '#e8576b'; L.$('#now').style.textShadow = `0 0 30px rgba(${D.move >= 0 ? UP : DN},.35)`;
  rows = D.ai.map((a, i) => { const el = document.createElement('div'); el.className = 'row';
    el.innerHTML = `<div class="bg"></div><div class="bar"></div><div class="tip"></div><div class="gl"></div><span class="mkw"></span><span class="nm">${a.name}</span><span class="sd ${a.side === 'NO CALL' ? 'N' : a.side[0]}">${a.side}</span>${a.right ? '<span class="win">WINNER</span>' : ''}<span class="pl mono"></span><div class="sh"></div>${M === 2 ? `<svg class="lane" width="${LW}" height="${LH}"></svg>` : ''}`;
    L.$('#rows').appendChild(el); return el });
  srows = D.order.map(k => { const a = D.ai.find(x => x.k === k); const el = document.createElement('div'); el.className = 'srow'; el.dataset.k = k;
    el.innerHTML = `<div class="bg"></div><div class="gl"></div><div class="a"><span class="rk"></span>${L.mark(k, 64)}<span class="nm">${a.name}</span>
      <span class="ch" style="color:${a.pnl > 0 ? '#55d6a2' : a.pnl < 0 ? '#e8576b' : '#8e8680'};background:rgba(${a.pnl > 0 ? UP : a.pnl < 0 ? DN : '142,134,128'},.13)">${a.pnl ? L.money(a.pnl) : '$0'} THIS ROUND</span><span class="v"></span></div><svg class="sbar" width="924" height="40"></svg>`;
    L.$('#srows').appendChild(el); return el });
  // sound: an hour tick on the clock before the last hour, the last hour counted in tens of minutes, the hits
  const C = window.CUES = [[0.05, 'r11-swell', .12], [1.45, 'sfx-whoosh', .16], [2.25, 'r11-slide', .14]];
  let last = -1; for (let t = 2.3; t < TR; t += 1 / 120) { const m = mAt(t); const h = Math.floor((m + 0.001) / 60); if (h !== last && m < T - 60 && h > 0) { if (C.filter(c => c[1] === 'sfx-tick' && t - c[0] < .12).length === 0) C.push([+t.toFixed(3), 'sfx-tick', .1]); last = h } }
  for (let k = 50; k >= 0; k -= 10) { let t = 5.6; while (t < TR && mAt(t) < T - k) t += 1 / 240; C.push([+t.toFixed(3), 'sfx-clock', .18]) }
  C.push([5.6, 'sfx-riser', .12], [TR, 'sfx-bell', .3], [TR + .12, 'sfx-stamp', .26], [TR + .5, won ? 'r11-kaching' : 'r11-thump', .24], [TR + .6, 'r11-sparkle', won ? .12 : 0],
    [A0, 'sfx-whoosh', .14], [A1, 'r11-thump', .16], [A1 + .75, 'r11-pluck', .12], [C0, 'sfx-whoosh', .12], [C1, 'r11-thump', .14], [S0 + .1, 'r11-card', .1], [S0 + .25, 'r11-card', .1], [S0 + .4, 'r11-card', .1], [S1, 'sfx-chime', .14]);
  for (let q = 0; q < 6; q++) C.push([+(A0 + .3 + q * .09).toFixed(3), 'sfx-tick', .06]);
  window.MUSIC = { f: 'm2-phonk', at: 14.79 - TR };
};
// the clock: local exchange time from the earlier close
const clock = m => { const tot = D.closeH * 60 + Math.round(m); const d = Math.floor(tot / 1440), mm = tot % 1440; let h = Math.floor(mm / 60); const mi = mm % 60;
  const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return { day: DAYS[(DAYS.indexOf(D.day0) + d) % 7], t: h + ':' + String(mi).padStart(2, '0') + ' ' + ap } };
const barCss = (rgb, a) => `linear-gradient(90deg,rgba(${rgb},0) 0%,rgba(${rgb},${.16 * a}) 55%,rgba(${rgb},${.42 * a}) 100%)`;
let grain;
const kfmt = v => (v > 0 ? '+' : v < 0 ? '−' : '') + '$' + (Math.abs(v) >= 1000 ? +(Math.abs(v) / 1000).toFixed(1) + 'K' : Math.abs(v));
// the colour of a P&L line is its sign: green above $0, red below (one gradient, a hard stop at the $0 line)
const signGrad = (id, y0, h, a1, a0) => `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${h}">
  <stop offset="0" stop-color="#55d6a2" stop-opacity="${a1}"/><stop offset="${y0 / h}" stop-color="#55d6a2" stop-opacity="${a0}"/>
  <stop offset="${y0 / h}" stop-color="#e8576b" stop-opacity="${a0}"/><stop offset="1" stop-color="#e8576b" stop-opacity="${a1}"/></linearGradient>`;
// one side's P&L path up to minute m, in a box of width w, x0 and a value->y map
const ppath = (g, m, mv, xf, yf) => { let pts;
  if (PATH) { pts = PATH.filter(p => p[0] <= m).map(p => [xf(p[0]), yf(g * p[1] * 1000)]); pts.push([xf(m), yf(g * mv * 1000)]) }
  else pts = [[xf(0), yf(0)], [xf(L.lerp(0, D.total, L.cl(Math.abs(mv) / Math.max(1e-9, Math.abs(D.move))))), yf(g * mv * 1000)]];
  return pts };
const dpath = pts => pts.length > 1 ? 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') : '';
function pchart(t, m, mv, ring) {
  const T = D.total, z = YP(0), win = groups.find(q => q.ai.some(a => a.right));
  let body = '';
  groups.forEach((q, gi) => { const pts = ppath(q.g, m, mv, X, YP); const d = dpath(pts); if (!d) return; const h = pts[pts.length - 1];
    const isW = q === win, gk = isW ? L.eo(L.n(t, TR + .15, TR + .7)) : 0, dim = !isW && t > TR ? 1 - .55 * L.n(t, TR + .15, TR + .6) : 1;
    const area = d + `L${h[0].toFixed(1)} ${z}L${pts[0][0]} ${z}Z`;
    body += `<g opacity="${dim}"><path d="${area}" fill="url(#pa)"/><path d="${d}" fill="none" stroke="url(#pl)" stroke-width="12" opacity=".3" filter="url(#gw)"/>
      <path d="${d}" fill="none" stroke="url(#pl)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" ${PATH ? '' : 'stroke-dasharray="14 10"'}/>
      ${gk > 0 ? `<path d="${d}" fill="none" stroke="#fdbc2a" stroke-width="12" opacity="${.45 * gk}" filter="url(#gw)"/><path d="${d}" fill="none" stroke="#ffd56b" stroke-width="5.5" stroke-linejoin="round" opacity="${gk}"/>` : ''}
      <circle cx="${h[0]}" cy="${h[1]}" r="10" fill="#f2ede6"/></g>`;
    // the AIs on this line ride its head, with the live P&L (averaged over 0.2 s so it never snaps)
    const el = hds[gi]; let hx = 0, hy = 0; for (let k = 0; k < 8; k++) { const tq = Math.max(0, t - k * .025), mq = mAt(tq), vq = PATH ? pxAt(mq) : mv, pq = ppath(q.g, mq, vq, X, YP), e = pq[pq.length - 1]; hx += e[0]; hy += e[1] }
    hx /= 8; hy /= 8; const v = t >= TR + .4 ? q.g * D.move * 1000 : Math.round(q.g * mv * 1000);
