<!doctype html><meta charset="utf-8"><title>feed 2</title>
<!-- Animation sample feed-2 (2026-11-20): the F1 "room" (x2p-feed-F1.png, the T2 teaser): Intuit's chat. LONG speaks from the left, SHORT
  from the right. Qwen (LONG) types, its reason lands, the marker sweeps its key clause; Grok (SHORT) types and answers; then EZ's own plain
  words for Grok, labelled as ours (feed/words.json, unchanged words; our line carries no punctuation). The camera follows the conversation as
  it is read. On the bed's drop the move lands (PREVIEW, pre-market prices, not the close) and a P&L receipt stamps on each bubble as the
  camera pulls back to the whole room. Bed m2-phonk (130 BPM, drop at 14.79 s; the outcome videos' bed, the move on the drop as close.html).
  The highlighted clauses hold at least 1 s + 0.08 s a letter from their sweep. -->
<style>
:root{--pn:rgba(14,19,17,.95);--pn2:#151c19;--ln:#24302b;--tx:#f2ede6;--mu:#8e9a93;--mu2:#5d6963;--up:#55d6a2;--dn:#ff5a6e;--ac:#fdbc2a}
#chrome{position:relative;z-index:27}
#vig{opacity:.55}
#stage{position:absolute;left:0;right:0;top:140px;bottom:0;overflow:hidden;-webkit-mask:linear-gradient(transparent 0,#000 26px);mask:linear-gradient(transparent 0,#000 26px)}
#room::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(100deg,transparent 40%,rgba(255,250,235,.15) 50%,transparent 60%);background-size:300% 100%;background-position:var(--sx,150%) 0;opacity:var(--so,0)}
#room{position:absolute;left:36px;width:1008px;top:16px;transform-origin:50% 0;border-radius:34px;background:var(--pn);box-shadow:inset 0 0 0 2px var(--ln),0 30px 80px rgba(0,0,0,.5);padding:0 0 34px}
.rh{display:flex;align-items:center;gap:26px;padding:34px 38px 20px}
.rh .cn b{font:800 52px/1 Inter;letter-spacing:-.02em}.rh .cn span{font:500 32px/1 'Geist Mono';color:var(--mu);margin-left:16px;letter-spacing:.04em}
.rh .cn small{display:block;margin-top:14px;font:500 27px/1 'Geist Mono';color:var(--mu)}
.mv{margin-left:auto;text-align:right;opacity:0}
.mv .tk{font:600 36px/1 'Geist Mono';color:var(--mu);margin-right:26px;letter-spacing:.04em}
.mv #mvn{display:inline-block}
.mv b{display:block;font:700 66px/1 'Geist Mono';letter-spacing:-.03em;color:var(--dn);font-variant-numeric:tabular-nums}
.mv .pvt{display:inline-block;margin-top:14px}
.pvl{padding:0 38px 6px;font:500 23px/1 'Geist Mono';letter-spacing:.06em;color:var(--mu);opacity:0;text-align:right;height:0}
.sides{display:flex;justify-content:space-between;padding:14px 38px 6px;font:700 28px/1 'Geist Mono';letter-spacing:.12em}
.msgs{padding:0 30px}
.mw{overflow:visible}
.m{display:flex;align-items:flex-end;gap:20px;transform-origin:0 100%}
.m.S{flex-direction:row-reverse;transform-origin:100% 100%}
.bb{position:relative;width:812px;padding:26px 30px 24px;background:var(--pn2)}
.m.L .bb{border-radius:32px 32px 32px 8px;box-shadow:inset 4px 0 0 var(--up)}
.m.S .bb{border-radius:32px 32px 8px 32px;box-shadow:inset -4px 0 0 var(--dn)}
.bw{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px}
.bw b{font:700 40px/1 Inter}.bw .sd{font:700 33px/1 'Geist Mono';letter-spacing:.06em}.bw .sd small{font:600 27px/1 'Geist Mono';margin-left:14px;letter-spacing:0}
.bq{font:500 44px/1.38 Inter;color:#e7e1d9;letter-spacing:-.01em}
.bf{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;min-height:52px}
.bf .cf{font:500 26px/1 'Geist Mono';color:var(--mu)}
.rc{display:inline-flex;align-items:center;gap:12px;padding:13px 20px 11px;border-radius:16px;font:700 38px/1 'Geist Mono';white-space:nowrap;opacity:0;transform-origin:100% 50%}
.rc svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rc.ok{color:var(--up);background:rgba(85,214,162,.12);box-shadow:inset 0 0 0 2px rgba(85,214,162,.5)}.rc.no{color:var(--dn);background:rgba(255,90,110,.1);box-shadow:inset 0 0 0 2px rgba(255,90,110,.45)}
.m.E .bb{background:#0c100e;box-shadow:inset 0 0 0 2px #3a332e;border-radius:8px 32px 32px 32px}
.m.E.S .bb{border-radius:32px 8px 32px 32px}
.m.E{align-items:flex-start}
.ez{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;flex:none;background:#04070e;box-shadow:inset 0 0 0 2px #3a332e;overflow:hidden}
.el{font:700 25px/1.2 'Geist Mono';letter-spacing:.1em;color:#b9b1a9}.el i{font-style:normal;font-weight:500;color:var(--mu);margin-left:14px;letter-spacing:.06em}
.eg p{margin-top:12px;font:500 36px/1.42 Inter;color:#c9c1b8}
.dots{position:absolute;top:30px;display:flex;gap:12px;padding:26px 30px;background:var(--pn2);opacity:0}
.dots i{width:18px;height:18px;border-radius:50%;background:#8e9a93}
.m.L .dots{left:104px;border-radius:30px 30px 30px 8px}.m.S .dots{right:104px;border-radius:30px 30px 8px 30px}
.mw{position:relative}
#line{position:absolute;left:0;right:0;top:0;text-align:center;z-index:30}
#line h2{font:900 92px/1.06 Inter;letter-spacing:-.04em}
#wash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 50% at 50% 30%,rgba(255,90,110,.22),transparent 70%);opacity:0}
</style>
<div id="gnd"></div><div id="wash"></div>
<div id="chrome"></div>
<div id="stage"><div id="room"></div></div>
<div id="line"><h2>Qwen and Grok<br>split on Intuit</h2></div>
<div id="vig"></div><canvas id="grain"></canvas>
<script src="lib.js"></script><script src="w6/an/an.js"></script>
<script>
const BT = 60 / 130, T_CL = 14.79, B = n => T_CL + n * BT, DUR = 18.0;
// Qwen at beat -28, Grok at -19, our plain words at -14; the move on the drop; the receipts a beat and two beats after
const T_LINE = .12, T_ROOM = .95, MS = [{ k: 'QWEN', b: B(-28) }, { k: 'GROK', b: B(-19) }, { k: 'EZ', b: B(-14) }], T_RC = [B(1), B(2)], TYPE = .55;
const GLOSS = s => s.split(/(?<=\.)\s+/).map(x => x.replace(/[.,]/g, ''));   // our words, unchanged; no punctuation on our line, a line per sentence
let grain, gl, Q, G, C, room, msgEls, H0, FIT;
const DOTH = 104, SH = 1210;
const X = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>', V = '<svg viewBox="0 0 24 24"><path d="M4.5 12.8l4.8 4.8L19.5 7"/></svg>';
(async () => {
  await AN.load();
  L.$('#chrome').innerHTML = AN.brand();
  Q = AN.tr('QWEN', 'INTU'); G = AN.tr('GROK', 'INTU'); C = AN.D.cos.INTU;
  const bub = (x, i) => `<div class="mw" id="w${i}"><div class="m ${x.side[0]}" id="m${i}">${AN.mark(x.k, 84)}<div class="bb"><div class="bw"><b>${x.name}</b><span class="sd ${x.side[0]}" style="color:var(--${x.side === 'LONG' ? 'up' : 'dn'})">${x.side}<small>called ${x.side === 'LONG' ? '+' : '−'}${AN.num(x.call)}%</small></span></div>
      <div class="bq">${AN.quote(x.keep, x.hl)}</div><div class="bf"><span class="cf">${x.conf}% confident</span><span class="rc ${x.right ? 'ok' : 'no'}">${x.right ? V : X}P&amp;L ${AN.money(x.pnl)}</span></div></div></div>
      <div class="dots"><i></i><i></i><i></i></div></div>`;
  L.$('#room').innerHTML = `<div class="rh">${AN.co('INTU', 104, .24)}<div class="cn"><b>${C.co}</b><span>${C.ticker}</span><small>trade 1<span style="margin-left:24px">Nov 19</span></small></div>
      <div class="mv"><b><span class="tk">${C.ticker}</span><span id="mvn">${C.pct}</span></b><span class="pvt">PREVIEW</span></div></div>
    <div class="pvl">PRICES BEFORE THE OPEN<span style="margin-left:26px">NOT THE CLOSE</span></div>
    <div class="sides"><span style="color:var(--up)">LONG</span><span style="color:var(--dn)">SHORT</span></div>
    <div class="msgs">${bub(Q, 0)}${bub(G, 1)}
      <div class="mw" id="w2"><div class="m S E" id="m2"><span class="ez">${AN.logo(84)}</span><div class="bb eg"><div class="el">IN PLAIN WORDS<i>OUR READING OF GROK</i></div>${GLOSS(G.plain).map(p => `<p>${AN.esc(p)}</p>`).join('')}</div></div>
      <div class="dots" style="right:104px;border-radius:30px 8px 30px 30px"><i></i><i></i><i></i></div></div></div>`;
  room = L.$('#room'); msgEls = [0, 1, 2].map(i => L.$('#w' + i));
  gl = AN.ground(L.$('#gnd'), 1); grain = L.grain(L.$('#grain'), .07);
  await AN.ready();
  // each message's full height (with its 30 px gap) and the room's height without messages, for the room that grows as the chat does
  msgEls.forEach((el, i) => { el.style.paddingTop = '30px'; MS[i].h = el.offsetHeight; MS[i].top = el.offsetTop });
  H0 = room.offsetHeight - MS.reduce((s, m) => s + m.h, 0);
  FIT = Math.min(1, (SH - 40) / (MS[1].top + MS[1].h + 40));   // the pull-back that shows the header, the move and both receipts
  [Q, G].forEach((x, i) => { const m = MS[i]; m.s = m.b + .45; m.sw = Math.min(1.1, Math.max(.55, x.hl.length * .022)) });
  window.CUES = [[0.05, 'r11-swell', .14], [T_ROOM, 'sfx-whoosh', .12]];
  MS.forEach((m, i) => { for (let j = 0; j < 3; j++) CUES.push([+(m.b - TYPE + .08 + j * .16).toFixed(3), 'sfx-tick', .05]); CUES.push([m.b, 'r11-card', .12]); if (m.s) CUES.push([m.s + .05, 'r11-slide', .07]) });
  CUES.push([T_CL - 1.2, 'sfx-riser', .12], [T_CL, 'r11-thump', .26], [T_CL + .05, 'sfx-whoosh', .1], [T_RC[0], 'sfx-stamp', .24], [T_RC[1], 'sfx-stamp', .26], [T_RC[1] + .12, 'r11-kaching', .18], [T_RC[1] + .2, 'r11-sparkle', .08]);
  window.MUSIC = { f: 'm2-phonk', at: 0 }; window.DUR = DUR;
  const hq = 1 + .08 * Q.hl.length, hg = 1 + .08 * G.hl.length;
  if (MS[1].b - TYPE < MS[0].s + hq - .05) console.error('Qwen hold short'); if (DUR < MS[1].s + hg) console.error('Grok hold short');
  await AN.go();
})();
// the chat grows as it is read: a message takes the dots' height while its AI types, then its full height as the bubble lands
const mwH = (i, u) => { const m = MS[i]; return u < m.b - TYPE ? 0 : u < m.b ? DOTH * L.eio(L.n(u, m.b - TYPE, m.b - TYPE + .2)) : L.lerp(DOTH, m.h, L.eio(L.n(u, m.b, m.b + .45))) };
const roomH = u => H0 + MS.reduce((s, m, i) => s + mwH(i, u), 0);
// the camera: the room sits centred until the first message; then the reading point runs down each message over its reading time (to
// the next message, or to the move) and is held at 740 px, so the chat keeps scrolling up as it is read, like a real chat; for the move
// and the receipts it rises back to the top of the room. A critically damped follow smooths it, so it never jumps
const readY = u => { let y = 0; MS.forEach((m, i) => { const t1 = i < 2 ? MS[i + 1].b - TYPE : T_CL - .8; if (u >= m.b) y = m.top + 30 + Math.min(1, (u - m.b) / (t1 - m.b)) * (m.h - 30) }); return y };
const tgt = u => { if (u > T_CL - .8) return 16; if (u < MS[0].b) return (SH - roomH(u)) / 2; return Math.min(16 + 300, 740 - readY(u)) };
const camY = t => { let y = tgt(0), v = 0, w = 6.5, dt = 1 / 120; for (let u = 0; u < t; u += dt) { const a = w * w * (tgt(u) - y) - 2 * w * v; v += a * dt; y += v * dt } return y };
window.R = t => {
  grain(t); gl(t);
  { const t0 = T_RC[1] + .35, q = t < t0 ? 0 : ((t - t0) % 1.5) / 1.1; room.style.setProperty('--so', t < t0 || q > 1 ? 0 : Math.sin(Math.PI * q).toFixed(3)); room.style.setProperty('--sx', (150 - 150 * L.eio(Math.min(1, q))).toFixed(1) + '%') }
  // the line alone, then it lifts away as the room comes up under it
  const ln = L.$('#line'), li = L.eo(L.n(t, T_LINE, T_LINE + .8)), lo = L.eio(L.n(t, T_ROOM - .1, T_ROOM + .5)), rise = 1 - Math.pow(1 - L.n(t, T_LINE, T_ROOM + .2), 2);
  ln.style.opacity = (li * (1 - lo)).toFixed(3); ln.style.transform = `translateY(${(500 + 100 * (1 - rise) - 260 * lo).toFixed(1)}px) scale(${(1 + .05 * L.n(t, T_LINE, T_ROOM) - .15 * lo).toFixed(3)})`;
  const ri = L.eio(L.n(t, T_ROOM, T_ROOM + .65)); L.$('#chrome').style.opacity = ri;
  // the room: it grows with the chat; the camera keeps it centred, then follows the reading, then rises to the top for the move
  MS.forEach((m, i) => { msgEls[i].style.height = mwH(i, t).toFixed(1) + 'px' });
  const ty = camY(t) + 300 * (1 - ri), pb = L.eio(L.n(t, T_CL - .8, T_CL)); room.style.transform = `translateY(${ty.toFixed(1)}px) scale(${L.lerp(1, FIT, pb).toFixed(4)})`; room.style.opacity = ri.toFixed(3);
  // the messages: dots while the AI types, then the bubble pops from its mark's corner; the marker sweeps the key clause
  MS.forEach((m, i) => { const el = msgEls[i], mm = el.querySelector('.m'), d = el.querySelector('.dots'), k = L.n(t, m.b, m.b + .4), sp = L.spring(t - m.b, 1.8, 8);
    mm.style.opacity = t < m.b ? 0 : L.cl(k * 2.5).toFixed(3); mm.style.transform = t < m.b ? 'scale(.6)' : `scale(${L.lerp(.6, 1, sp).toFixed(4)})`; mm.style.visibility = t < m.b ? 'hidden' : 'visible';
    const dv = t >= m.b - TYPE && t < m.b + .1; d.style.opacity = dv ? L.cl((t - (m.b - TYPE)) * 6) * (1 - L.n(t, m.b - .05, m.b + .1)) : 0;
    d.querySelectorAll('i').forEach((b, j) => { const ph = (t - j * .14) * 2 * Math.PI * 2.2; b.style.transform = `translateY(${(-9 * Math.max(0, Math.sin(ph))).toFixed(1)}px)`; b.style.opacity = .5 + .5 * Math.max(0, Math.sin(ph)) });
    if (m.s) AN.sweep(el.querySelector('.hlc'), L.eio(L.n(t, m.s, m.s + m.sw))) });
  // the move lands on the drop: counted from 0 to the PREVIEW move, the night washes red; the receipts stamp, the right side lights
  const mv = L.$('.mv'), mk = L.n(t, T_CL - .35, T_CL + .05); mv.style.opacity = L.cl(mk * 3); const v = AN.D.cos.INTU.move * L.eo(L.n(t, T_CL - .35, T_CL));
  L.$('#mvn').textContent = (t >= T_CL ? AN.D.cos.INTU.pct : (v < 0 ? '−' : '') + Math.abs(v).toFixed(2) + '%'); L.$('#mvn').style.transform = `scale(${(1 + .14 * Math.exp(-Math.max(0, t - T_CL) * 7) * (t >= T_CL ? 1 : 0)).toFixed(3)})`; L.$('#mvn').style.transformOrigin = '100% 50%';
  const pv = L.$('.pvl'); pv.style.opacity = L.n(t, T_CL + .2, T_CL + .6); pv.style.height = (34 * L.eio(L.n(t, T_CL - .4, T_CL))).toFixed(1) + 'px';
  L.$('#wash').style.opacity = (L.n(t, T_CL, T_CL + .2) * (1 - .6 * L.n(t, T_CL + .2, T_CL + 1.6))).toFixed(3);
  [Q, G].forEach((x, i) => { const rc = msgEls[i].querySelector('.rc'), s = L.n(t, T_RC[i], T_RC[i] + .22);
    rc.style.opacity = s > 0 ? 1 : 0; rc.style.transform = `scale(${L.lerp(1.7, 1, L.eo5(s)).toFixed(3)}) rotate(${L.lerp(-8, 0, L.eo5(s)).toFixed(2)}deg)`;
    const bb = msgEls[i].querySelector('.bb'), g = L.n(t, T_RC[i] + .1, T_RC[i] + .5);
    bb.style.filter = x.right ? `drop-shadow(0 0 ${(26 * g).toFixed(1)}px rgba(85,214,162,${(.35 * g).toFixed(3)}))` : `brightness(${(1 - .25 * g).toFixed(3)}) saturate(${(1 - .5 * g).toFixed(3)})` });
  const kick = t > T_CL ? Math.exp(-(t - T_CL) * 9) * Math.sin((t - T_CL) * 60) * 5 : 0; L.$('#stage').style.transform = `translate(${kick.toFixed(1)}px,${(kick * .6).toFixed(1)}px)`;
};
</script>
