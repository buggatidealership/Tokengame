<!doctype html><meta charset="utf-8"><title>EZ feed FV7 Your call</title>
<!-- FEED FILMS DESK B, FV7 "Your call" (night of 20 Nov 2026). The feature: before the report, the viewer taps LONG or SHORT on a company; the
  five AIs' calls open only after; graded with them at the close; kept on the viewer's phone (research F2.14: predicting first raises curiosity).
  Message: call it yourself before you read the five.
  Story (a game: question, countdown, deal, reveal, verdict): Intuit reports tonight; the app's YOUR CALL panel (LONG or SHORT, the five posts
  locked); a 3 2 1 countdown for the viewer to decide; the five calls are dealt face down out of the phone onto a card table (EZ. card backs);
  on the drop they flip one per beat (Qwen LONG, Claude SHORT, Gemini LONG, Grok SHORT, GPT LONG, sides, sizes and confidence from calls.csv)
  and slide to their side, 3 LONG v 2 SHORT; the Nov 20 close lands (Intuit −12.79%) and every card is stamped RIGHT or WRONG with its P&L,
  wrong as loud as right. Ground: a painted card table (Hedra, w6/nt/fvb/g7.jpg). Type: Kanit black italic (our lines, the countdown) and
  Inter with Geist Mono (cards, UI). Camera: locked overhead, hard cuts on beats (wide, close on the panel, wide). Motion: deal, flip, slide,
  stamp. Brand in the scene: the app header and the panel's EZ. strip (0 to 3 s), the card backs (from 3.4 s), the close slip (from 9.7 s).
  Bed nt-fv7 (m3-electro from 1.936 s, bedx.py): its kick drops at B(12) = 5.83 s, on the first flip. -->
<style>
#hls{position:absolute;left:0;right:0;top:0;height:420px;z-index:69;pointer-events:none;background:linear-gradient(180deg,rgba(4,7,14,.94),rgba(4,7,14,.8) 50%,rgba(4,7,14,0))}
#hl{position:absolute;left:40px;right:40px;top:168px;height:200px;text-align:center;z-index:70;font:italic 900 96px/1.02 Kanit;letter-spacing:-.01em;color:#f8f0d9;text-shadow:0 8px 30px rgba(0,0,0,.55)}
#hl>div{position:absolute;left:0;right:0;top:0}
#pulse{background:radial-gradient(60% 45% at 50% 52%,rgba(253,188,42,.5),transparent 70%),radial-gradient(90% 30% at 50% 100%,rgba(255,58,49,.22),transparent 70%)}
#cd{position:absolute;left:0;right:0;top:420px;height:420px;text-align:center;z-index:72;font:italic 900 400px/420px Kanit;color:#fdbc2a;text-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 #000;pointer-events:none}
#cd span{position:absolute;left:0;right:0;top:0;opacity:0;-webkit-text-stroke:6px #04070e;paint-order:stroke fill}
#tbl{position:absolute;inset:0;z-index:40;perspective:1600px}
.cd{position:absolute;left:0;top:0;width:190px;height:286px;transform-style:preserve-3d;transform-origin:0 0}
.cd>div{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cb{background:repeating-linear-gradient(45deg,rgba(253,188,42,.09) 0 2px,transparent 2px 11px),radial-gradient(80% 60% at 50% 40%,#0d1a14,#04070e);box-shadow:inset 0 0 0 2px rgba(253,188,42,.55),inset 0 0 0 9px #04070e,inset 0 0 0 10.5px rgba(253,188,42,.45),0 14px 30px rgba(0,0,0,.55);display:grid;place-items:center}
.cb img{width:104px;height:104px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6))}
.cf{transform:rotateY(180deg);background:linear-gradient(165deg,rgba(248,240,217,.16),rgba(6,10,12,.94) 45%),#070b0d;box-shadow:inset 0 0 0 2px var(--sc),0 14px 30px rgba(0,0,0,.55);padding:18px 14px 0;text-align:center;overflow:hidden}
.cf .aim{margin:0 auto}.cf b{display:block;margin-top:12px;font:700 31px/1 Inter;letter-spacing:-.02em;color:#f8f0d9}
.cf .sd{margin-top:13px;font:800 34px/1 'Geist Mono';letter-spacing:.02em}.cf .sz{margin-top:6px;font:700 29px/1 'Geist Mono'}
.cf small{display:block;margin-top:11px;font:600 23px/1 'Geist Mono';color:rgba(248,240,217,.66)}
.cf .stp{position:absolute;left:8px;right:8px;bottom:8px;height:66px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;opacity:0}
.cf .stp i{font:italic 900 42px/1 Kanit;letter-spacing:.02em;font-style:italic}.cf .stp em{font:800 28px/1 'Geist Mono';font-style:normal;letter-spacing:-.04em}
.cf .stp.ok{background:#03c870;color:#04070e}.cf .stp.no{background:#ff3a31;color:#04070e}
.grp{position:absolute;top:516px;width:520px;text-align:center;z-index:41;font:italic 900 74px/1 Kanit;opacity:0}
.grp em{display:block;margin-top:14px;height:34px;font:800 32px/34px 'Geist Mono';font-style:normal;letter-spacing:-.02em;opacity:0}
.grp span{display:inline-block}
#slip{position:absolute;left:290px;top:984px;width:500px;height:150px;z-index:45;border-radius:22px;opacity:0;display:flex;align-items:center;gap:22px;padding:0 30px;
  background:linear-gradient(160deg,rgba(248,240,217,.2),rgba(5,8,10,.9) 55%);box-shadow:inset 0 0 0 1.5px rgba(248,240,217,.32),inset 0 1px 0 rgba(255,255,255,.35),0 24px 50px rgba(0,0,0,.6)}
#slip .bm{width:84px;height:84px}
#slip small{display:block;font:700 24px/1 'Geist Mono';letter-spacing:.14em;color:#fdbc2a}#slip b{display:block;margin-top:10px;font:800 52px/1 'Geist Mono';letter-spacing:-.02em}
/* the YOUR CALL panel in the app */
.row{margin-bottom:12px;padding:14px 14px 15px;border-radius:20px;background:rgba(12,16,18,.97);box-shadow:inset 0 0 0 1.5px var(--ln)}
.rh{display:flex;align-items:center;gap:11px}.rh img{width:34px;height:34px;border-radius:9px;background:#fff;object-fit:contain}
.rh b{font:700 17px/1 Inter}.rh span{font:500 12.5px/1 'Geist Mono';color:var(--mu);letter-spacing:.04em}.rh small{margin-left:auto;font:600 11.5px/1 'Geist Mono';letter-spacing:.12em;color:var(--au)}
.yc{margin-top:13px;border-radius:16px;background:#080c0e;box-shadow:inset 0 0 0 1.5px rgba(253,188,42,.35);overflow:hidden}
.ycs{display:flex;align-items:center;justify-content:center;gap:9px;padding:9px 0;background:rgba(253,188,42,.1);font:800 13px/1 'Geist Mono';letter-spacing:.2em;color:#fdbc2a}
.ycb{display:flex;gap:10px;padding:12px}
.ycb div{flex:1;height:52px;border-radius:13px;display:grid;place-items:center;font:800 19px/1 'Geist Mono';letter-spacing:.08em}
.ycb .bl{color:#03c870;box-shadow:inset 0 0 0 2px rgba(3,200,112,.6);background:rgba(3,200,112,.08)}.ycb .bs{color:#ff3a31;box-shadow:inset 0 0 0 2px rgba(255,58,49,.6);background:rgba(255,58,49,.08)}
.lk{display:flex;align-items:center;gap:8px;margin:2px 12px 12px;font:600 12px/1 'Geist Mono';color:var(--mu);letter-spacing:.04em}
.lk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.lr{display:flex;align-items:center;gap:10px;margin:0 12px 8px;padding:7px 10px;border-radius:12px;background:#05080a;box-shadow:inset 0 0 0 1px var(--ln)}
.lr i{flex:1;height:10px;border-radius:5px;background:rgba(248,240,217,.12);filter:blur(1.5px)}.lr svg{width:14px;height:14px;fill:none;stroke:rgba(248,240,217,.5);stroke-width:2}
#endc h3{font-family:Kanit;font-style:italic;font-weight:900;font-size:130px}
</style>
<div id="st">
<div id="gnd"></div><div id="pulse"></div>
<div id="cam"></div>
<div id="tbl"></div><div class="grp" id="gL" style="left:14px;color:#03c870"><span>LONG <span class="nL">0</span></span><em class="S">P&amp;L −$12,790 each</em></div><div class="grp" id="gS" style="left:546px;color:#ff3a31"><span>SHORT <span class="nS">0</span></span><em class="L">P&amp;L +$12,790 each</em></div>
<div id="slip"></div>
<div id="cd"><span>3</span><span>2</span><span>1</span></div>
<div id="hls"></div><div id="hl"></div>
<div id="td"></div><div id="tr"></div>
<div id="vig"></div><canvas id="grain"></canvas>
</div>
<script src="lib.js"></script><script src="w6/nt/fvb/fvb.js"></script>
<script>
const B = FB.B, n = FB.n, cl = FB.cl, lerp = FB.lerp, eo = FB.eo, eio = FB.eio, spr = FB.spr, DUR = 15.6;
const LINES = [['Intuit reports {y tonight}', -1, 2.85], ['Call it before you read them', B(6.6), B(12.6)], ['Who sided with {y you}', B(13), B(18.6)], ['{r SHORT} was right', B(20.5), B(25.6)]];
const T = { close: B(2), cd: [B(4), B(5), B(6)], deal: B(7), flip: B(12), sort: B(17), slip: B(20), stamp: B(21), end: B(26) };
const ORD = ['QWEN', 'CLAUDE', 'GEMINI', 'GROK', 'GPT'];   // flipped in this order: LONG, SHORT, LONG, SHORT, LONG (the split builds)
let grain, PAN = {}, cards = [], DX = 0, DY = 0;
(async () => {
  await FB.load('', ["italic 900 96px Kanit", "italic 900 400px Kanit"]);
  const D = FB.D, co = D.cos.INTU;
  L.$('#gnd').style.backgroundImage = 'url(w6/nt/fvb/g7.jpg)';
  const lock = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  const up = `<div class="vw" id="vU"><div class="vh"><small>IN PLAY</small><b>Upcoming</b></div><div class="row" id="ic"><div class="rh"><img src="${co.logo}" alt=""><b>Intuit</b><span>INTU</span><small>TONIGHT</small></div>
    <div class="yc" id="yc"><div class="ycs">${FB.EZ(22)}YOUR CALL</div><div class="ycb"><div class="bl">LONG</div><div class="bs">SHORT</div></div>
    <div class="lk">${lock}The five open after your call</div>${ORD.map(k => `<div class="lr">${FB.mark(k, 22)}<i></i>${lock}</div>`).join('')}</div></div></div>`;
  L.$('#cam').innerHTML = FB.phoneHTML(up);
  // the five cards: back (the EZ. card back), face (the AI's call), its stamp after the close
  L.$('#tbl').innerHTML = ORD.map(k => { const x = FB.post(k, 'INTU');
    return `<div class="cd" data-k="${k}" style="--sc:${x.side === 'LONG' ? 'rgba(3,200,112,.75)' : 'rgba(255,58,49,.75)'}"><div class="cb">${FB.EZ(104)}</div><div class="cf">${FB.mark(k, 64)}<b>${x.name}</b><div class="sd ${x.side[0]}">${x.side}</div><div class="sz ${x.side[0]}">${x.side === 'LONG' ? '+' : '−'}${x.size}%</div><small>${x.conf}% confident</small>
      <div class="stp ${x.right ? 'ok' : 'no'}"><i>${x.right ? 'RIGHT' : 'WRONG'}</i></div></div></div>` }).join('');
  cards = L.$$('.cd').map(c => ({ el: c, x: FB.post(c.dataset.k, 'INTU') }));
  L.$('#slip').innerHTML = `${FB.EZ(84)}<div><small>CLOSE NOV 20</small><b class="S">INTU −12.79%</b></div>`;
  FB.bug(L.$('#st'));
  L.$('#st').insertAdjacentHTML('beforeend', FB.endHTML('Your call', 'Kanit'));
  L.$('#hl').innerHTML = LINES.map((l, i) => `<div id="h${i}">${FB.words(l[0])}</div>`).join('');
  grain = L.grain(L.$('#grain'), .05);
  await document.fonts.ready;
  // where the YOUR CALL panel sits inside the phone (unzoomed), so the close-up can centre it
  const w = L.$('.phw'); FB.place(w, { cx: 540, cy: 675, z: 1 }); const pr = w.getBoundingClientRect(), yr = L.$('#yc').getBoundingClientRect();
  PAN = { dx: (yr.left + yr.width / 2) - (pr.left + pr.width / 2), dy: (yr.top + yr.height / 2) - (pr.top + pr.height / 2) };
  window.CUES = [[.05, 'r11-swell', .1], [T.close, 'sfx-whoosh', .08], ...T.cd.map(a => [a, 'sfx-tick', .12]), ...ORD.map((_, i) => [T.deal + i * FB.BT / 2, 'r11-card', .08]),
    ...ORD.map((_, i) => [T.flip + i * FB.BT, 'sfx-flip', .1]), [T.sort, 'sfx-whoosh', .08], [T.slip, 'sfx-stamp', .12], ...ORD.map((_, i) => [T.stamp + i * .1, 'sfx-stamp', .05]),
    [T.end + .1, 'sfx-chime', .12], [T.end + .6, 'r11-sparkle', .07]];
  window.MUSIC = { f: 'nt-fv7', at: 0 }; window.DUR = DUR;
  await FB.ready();
})().catch(e => { document.title = 'ERR ' + e.message; console.error(e) });

// card places: dealt in a row (a slight fan), then sorted into LONG (left) and SHORT (right) groups
const ROW = i => ({ x: 40 + i * 204, y: 600 + 10 * Math.abs(i - 2) * Math.abs(i - 2) / 2, r: (i - 2) * 2.6, s: 1 });
const GRP = (k, j) => k === 'L' ? { x: 22 + j * 172, y: 690 + 6 * Math.abs(j - 1), r: (j - 1) * 2.2, s: .9 } : { x: 588 + j * 172, y: 690, r: (j - .5) * 2.6, s: .9 };
window.R = t => {
  grain(t);
  const bp = t < T.flip ? .3 * Math.exp(-((t - FB.PH) % FB.BT) / .2) : Math.exp(-((t - FB.PH) % FB.BT) / .18); L.$('#pulse').style.opacity = Math.min(1, bp).toFixed(3);
  // hard cuts: wide (phone on the table), close on the panel (B2), wide with the deal (B7): the camera holds still between cuts but for a slow push
  const shot = t < T.close ? 0 : t < T.deal ? 1 : 2, ts = t - [0, T.close, T.deal][shot];
  const hx = 14 * Math.sin(t * .9) + 6 * Math.sin(t * 2.1), hy = 10 * Math.cos(t * .75) + 4 * Math.sin(t * 1.7), kick = t >= T.flip ? 5 * bp : 0;   // drift, and a small jolt on every kick after the drop
  DX = hx; DY = hy + kick;
  L.$('#gnd').style.transform = `translate(${((shot === 1 ? -20 : 0) + .6 * hx).toFixed(1)}px,${((shot === 1 ? 40 : 0) + .6 * DY).toFixed(1)}px) scale(${([1.04, 1.32, 1.06][shot] + .02 * ts).toFixed(4)})`;
  ['#tbl', '#gL', '#gS'].forEach(q => L.$(q).style.translate = `${DX.toFixed(1)}px ${DY.toFixed(1)}px`); L.$('#slip').style.translate = `${DX.toFixed(1)}px ${DY.toFixed(1)}px`;
  L.$('#vU .vh').style.opacity = shot === 1 ? 0 : 1;   // the view's title stays out of the close-up (it showed behind the line)
  const w = L.$('.phw');
  if (shot === 0) FB.place(w, { t, cx: 540, cy: 720 - 8 * ts, z: 1.02 + .02 * ts, rz: -3, rx: 0 });
  else if (shot === 1) { const z = 2.45 + .06 * ts; FB.place(w, { t, cx: 540 - PAN.dx * z, cy: 850 - PAN.dy * z, z, rz: -1.5 }) }
  else { const k = eio(n(t, T.deal + .2, T.deal + 2.6)); FB.place(w, { t, cx: 540, cy: lerp(1060, 1900, k), z: .62, rz: -3 }) }
  // the countdown: 3 2 1 on the beats, the buttons glow in turn
  L.$$('#cd span').forEach((s, i) => { const a = T.cd[i], q = n(t, a, a + FB.BT); s.style.opacity = t >= a && t < a + FB.BT ? 1 : 0; s.style.transform = `scale(${(1.35 - .35 * eo(n(t, a, a + .22)) + .05 * q).toFixed(3)})` });
  L.$$('.ycb div').forEach((b, i) => { const g = shot === 1 && t >= T.cd[0] ? Math.max(0, Math.sin(Math.PI * (((t - T.cd[0]) / FB.BT + i) % 2) / 2)) : 0; b.style.boxShadow = g > .05 ? `inset 0 0 0 ${(2 + 2 * g).toFixed(2)}px ${i ? 'rgba(255,58,49,.95)' : 'rgba(3,200,112,.95)'},0 0 ${(18 * g).toFixed(1)}px ${i ? 'rgba(255,58,49,.6)' : 'rgba(3,200,112,.6)'}` : '' });
  // the cards: dealt out of the phone face down, flipped one per beat on the drop, slid to their side, stamped at the close
  let nL = 0, nS = 0; const jL = [], jS = [];
  cards.forEach((c, i) => { const s = c.x.side[0], d = T.deal + i * FB.BT / 2, f = T.flip + i * FB.BT, m = spr(n(t, d, d + .7)), fp = eio(n(t, f, f + .38));
    if (t >= f + .2) { if (s === 'L') nL++; else nS++ }
    const j = s === 'L' ? jL.push(i) - 1 : jS.push(i) - 1, A = ROW(i), G = GRP(s, j), so = eio(n(t, T.sort + i * .06, T.sort + .6 + i * .06));
    const pr = w.getBoundingClientRect(), from = { x: pr.left + pr.width / 2 - 92, y: pr.top + pr.height * .45, r: -20 };
    const x = lerp(lerp(from.x, A.x, m), G.x, so), y = lerp(lerp(from.y, A.y, m), G.y, so), r = lerp(lerp(from.r, A.r, m), G.r, so), sc = lerp(1, G.s, so);
    const hov = t > d + .7 && t < f ? 9 * Math.sin(2 * Math.PI * (t - T.deal) / (2 * FB.BT) + i * 1.1) * FB.ss(n(t, d + .7, d + 1.2)) * (1 - FB.ss(n(t, f - .3, f))) : 0;
    const lift = Math.sin(Math.PI * fp) * 40 + hov, wrong = t >= T.stamp && !c.x.right ? .55 * eio(n(t, T.stamp, T.stamp + .4)) : 0;
    c.el.style.opacity = t < d ? 0 : 1; c.el.style.zIndex = 10 + (so > .5 ? j + (s === 'S' ? 10 : 0) : i);
    c.el.style.transform = `translate(${x.toFixed(1)}px,${(y - lift).toFixed(1)}px) rotateZ(${r.toFixed(2)}deg) scale(${sc.toFixed(4)}) translateX(95px) rotateY(${(180 * fp).toFixed(2)}deg) translateX(-95px)`;
    const st = c.el.querySelector('.stp'), a = T.stamp + i * .1, q = n(t, a, a + .3); st.style.opacity = t >= a ? 1 : 0; st.style.transform = `scale(${(1 + .5 * (1 - eo(q))).toFixed(3)}) rotate(${(-4 + 8 * (i % 2)).toFixed(1)}deg)`;
    c.el.querySelector('.cf').style.filter = wrong ? `brightness(${(1 - wrong * .35).toFixed(3)})` : '' });
  L.$('.nL').textContent = nL; L.$('.nS').textContent = nS;
  const gk = eo(n(t, T.sort, T.sort + .5)); ['#gL', '#gS'].forEach(s => { const g = L.$(s); g.style.opacity = gk.toFixed(3); g.style.transform = `translateY(${(30 * (1 - gk)).toFixed(1)}px)` });
  ['#gL', '#gS'].forEach((s, i) => { const on = t >= T.stamp && (i === 1); L.$(s + '>span').style.opacity = (t >= T.stamp ? (on ? 1 : 1 - .4 * eio(n(t, T.stamp, T.stamp + .4))) : 1).toFixed(3) });
  L.$$('.grp em').forEach((m, i) => { const a = T.stamp + .3 + i * .15, q = eo(n(t, a, a + .3)); m.style.opacity = q.toFixed(3); m.style.transform = `translateY(${(10 * (1 - q)).toFixed(1)}px)` });
  // the close: the slip with the EZ. mark lands on the table
  const sl = L.$('#slip'), sq = n(t, T.slip, T.slip + .35); sl.style.opacity = t >= T.slip ? 1 : 0; sl.style.transform = `scale(${(1 + .45 * (1 - eo(sq))).toFixed(3)}) rotate(${(-2.5 + 1.5 * eo(sq)).toFixed(2)}deg)`;
  LINES.forEach((l, i) => FB.rise(L.$('#h' + i), t, l[1], l[2]));
  // the end: the cards sweep off the table, the logo, SEASON 2, the feature's name
  const e = eio(n(t, T.end - .2, T.end + .4)); L.$('#tbl').style.opacity = (1 - e).toFixed(3); L.$('#slip').style.opacity = t >= T.slip ? (1 - e).toFixed(3) : 0; ['#gL', '#gS'].forEach(s => L.$(s).style.opacity = (parseFloat(L.$(s).style.opacity) * (1 - e)).toFixed(3));
  FB.endR(t, T.end + .1);
};
</script>
