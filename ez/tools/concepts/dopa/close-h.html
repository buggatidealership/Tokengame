<!doctype html><meta charset="utf-8"><title>The close, handcrafted</title>
<!-- The Season 2 outcome video, handcrafted (owner, 2026-11-20: "the fonts, everything, the background needs to be handcrafted. Handcrafted
  attention to detail. That's what sets it apart from mediocrity"). close.html's structure, beats, timing, bed and data unchanged
  (close.html?d=<date> stays the template close.sh renders); this page redraws every layer. close-h.html?d=<date>&take=a|b
  Take a, the Season 2 announcement's world: a painted stock exchange hall at the closing bell (w6/ch/a-ground.jpg, the chip's ink and
    light, as s2d's ground) with its living light (w6/ch/a-live, Kling), and the bell itself (w6/ch/bell.webp, keyed) that rings at the
    close; every fact on frosted glass; Kanit black italic for words, Barlow Condensed (tabular figures) for every number.
  Take b, Lower Manhattan at dusk in oil (w6/ch/b-ground.jpg, b-live), smoked glass with a gold deco keyline; Archivo, the site's stub
    face, expanded for words and condensed for figures (tabular by default).
  The layers, one job each: paint = the world and the close (the bell rings, the city flares); glass = every fact; type = one headline.
  Checks (CLOSE-H in the report): no flat ground, two faces, nothing under 24 px on the 1080 x 1350 frame, numbers snap to the frame
  (window.TQ: every figure is computed at the frame's own time, so the three motion-blur samples of a frame show the same digits),
  rows, chips and marks one template, every P&L = side x move x $1,000 summed (from the data file).
  0.12 the line alone, the companies land one a beat | 1.96 dock: chart, clock, rows | 2.42 the night | 7.50 the bell: FINAL, every trade
  graded | 8.42 sort | 9.35 the chart folds, the board | 9.81 Season 2 leaderboard | 13.24 the leader's gold rim; held to 15.5. -->

<div id="st">
  <div id="sh">
    <canvas id="gnd" width="1080" height="1350" data-chrome></canvas>

<script>
const Q = new URLSearchParams(location.search), DATE = Q.get('d') || '2026-11-20', TAKE = Q.get('take') === 'b' ? 'b' : 'a';
document.body.className = 't' + TAKE;
const UP = '85,214,162', DN = '232,87,107', AU = '253,188,42', CR = '242,237,230', BK = '#04070e';
const TR = 7.5, BEAT = 60 / 130, B = n => TR + n * BEAT;
const T_LINE = .12, T_CO = B(-15), T_DOCK = B(-12), T_NIGHT = B(-11), T_SORT = B(2), T_FOLD = B(4), T_SSN = B(5), T_ROLL = B(6), T_LEAD = B(12) + .2;
// the layout (1080 x 1350): bug 46 | docked line and clock 112 to 240 | the chart's glass 252 to 760 | column heads 774 | rows 838 to 1250 |
// fine print 1282. The board after the fold: its headline 236, rows 548 to 1156.
const CGX = 40, CGY = 252, CW = 1000, CH = 508, ROW0 = 838, RH = 84, RHH = 76, BRD0 = 560, BRH = 124, BRHH = 112, RX = 40, RW = 1000;
const SEP = ' ';
let D, MOD, N, K, mAt, X, Y, grid, rows, cols, heads, cos, chs, xlabels, SROLL, grain, G = [], gx, gc, gr, still, live = [], vb, vbx;
const DAYS3 = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const money0 = v => v === 0 ? '$0' : L.money(v);
const add = (h, p) => { p.insertAdjacentHTML('beforeend', h); return p.lastElementChild };
// headlines kerned by hand: tracking per line in the CSS, then these pairs (em) where the face's own spacing leaves a hole or a clash
const KERN = { a: { 'FI': -.012, 'RS': -.008, 'ST': -.02, 'TR': -.012, 'RA': -.03, 'AD': -.012, 'ES': -.006, 'OF': -.026, 'EA': -.022, 'AS': -.014, 'SO': -.01, 'ON': -.012, 'LE': -.03, 'DE': -.008, 'ER': -.012, 'RB': -.006, 'BO': -.01, 'OA': -.032, 'RD': -.006 },
  b: { 'FI': -.01, 'TR': -.01, 'RA': -.025, 'AD': -.01, 'OF': -.02, 'EA': -.02, 'AS': -.01, 'LE': -.025, 'OA': -.03, 'Y ': -.02 } };
const kern = s => { const k = KERN[TAKE]; let o = ''; for (let i = 0; i < s.length; i++) { const c = s[i], p = s.slice(i, i + 2), m = k[p]; o += m ? `<span class="kp" style="margin-right:${m}em">${c === ' ' ? '&nbsp;' : c}</span>` : (c === ' ' ? ' ' : c) } return o };
// a grain tile for the glass (one noise texture, not an even pattern: two scales of noise added)
const noiseURL = (() => { const c = document.createElement('canvas'); c.width = c.height = 160; const x = c.getContext('2d'), im = x.createImageData(160, 160);
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const lo = Array.from({ length: 21 * 21 }, rnd);
  for (let y = 0; y < 160; y++) for (let xx = 0; xx < 160; xx++) { const v = 128 + 70 * (rnd() - .5) + 46 * (lo[(y >> 3) * 21 + (xx >> 3)] - .5), i = 4 * (y * 160 + xx); im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255 }
  x.putImageData(im, 0, 0); return c.toDataURL() })();
// the deco corner (take b): a stepped corner drawn once, mirrored to the four corners
const DECO = `<svg viewBox="0 0 22 22"><path d="M0 22V8h4V4h4V0h14" fill="none" stroke="rgba(253,188,42,.72)" stroke-width="1.6"/><path d="M5 22V13h4V9h4V5h9" fill="none" stroke="rgba(253,188,42,.36)" stroke-width="1.1"/><rect x="-1" y="-1" width="3.4" height="3.4" fill="#fdbc2a" transform="rotate(45 1 1) translate(3 -1)"/></svg>`;
const decoHTML = () => [['-1px', '-1px', ''], ['', '-1px', 'scaleX(-1)'], ['-1px', '', 'scaleY(-1)'], ['', '', 'scale(-1,-1)']].map(([l, t, tf], i) => `<i style="position:absolute;${i % 2 ? 'right:-1px' : 'left:' + l};${i > 1 ? 'bottom:-1px' : 'top:' + t};width:22px;height:22px;transform:${tf || 'none'}">${DECO}</i>`).join('');
function glass(parent, x, y, w, h, r, inner = '', cls = '') {
  const el = add(`<div class="gl ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${r != null ? `border-radius:${r}px` : ''}"><canvas class="fr"></canvas><div class="gt"></div><div class="gn" style="background-image:url(${noiseURL})"></div><div class="tp"></div><div class="sp"></div><i class="dc">${decoHTML()}</i><i class="ed"></i><i class="rim"></i><div class="in">${inner}</div></div>`, parent);
  const cv = el.querySelector('.fr'); cv.width = Math.max(8, Math.round(w / 4)); cv.height = Math.max(8, Math.round(h / 4)); const g = { el, cv, fx: cv.getContext('2d'), w, h, sp: el.querySelector('.sp'), ph: Math.random() * 7 }; G.push(g); return g }
function frost(g, t) { const o = +getComputedStyle(g.el).opacity; if (o < .01) return; const r = g.el.getBoundingClientRect(); if (r.width < 4 || r.bottom < 0 || r.top > 1350 || r.right < 0 || r.left > 1080) return;
  const k = 1080 / gr.width, sx = (r.left - gr.left) * k, sy = (r.top - gr.top) * k, sw = r.width * k, sh = r.height * k, P = 40, ax = g.cv.width / sw, ay = g.cv.height / sh, x = g.fx;
  x.filter = TAKE === 'a' ? 'blur(3px) saturate(160%) brightness(1.1)' : 'blur(3.5px) saturate(135%) brightness(1.05)'; x.drawImage(gc, sx - P, sy - P, sw + 2 * P, sh + 2 * P, -P * ax, -P * ay, (sw + 2 * P) * ax, (sh + 2 * P) * ay);
  // the slow specular: one soft band crossing each sheet every few seconds, each sheet on its own phase
  const u = ((t + g.ph) % 6.5) / 6.5; g.sp.style.transform = `translateX(${(-46 + 92 * u).toFixed(2)}%)` }
const mark = (k, s) => { const m = MOD[k]; return `<svg class="mk" width="${s}" height="${s}" viewBox="-4 -4 32 32" style="display:block;border-radius:${s * .26}px;background:${m.bg};box-shadow:0 0 0 ${Math.max(1.5, s * .035)}px rgba(242,237,230,.24),0 8px 18px rgba(0,0,0,.45)"><path d="${m.d}" fill="${m.fg}"${m.fr ? ' fill-rule="evenodd"' : ''}/></svg>` };
const clock = m => { const tot = 16 * 60 + Math.round(m), d = Math.floor(tot / 1440), mm = tot % 1440; let h = Math.floor(mm / 60); const mi = mm % 60, ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return { day: DAYS3[(DAYS3.indexOf(D.day0) + d) % 7], t: h + ':' + String(mi).padStart(2, '0') + ' ' + ap } };
const coGap = () => N <= 3 ? BEAT : N <= 6 ? BEAT / 2 : BEAT / 3;
// line heads never sit on each other: spread to a gap inside the chart, in value order
const spread = (ys, g, lo, hi) => { const o = ys.map((y, i) => ({ y, i })).sort((a, b) => a.y - b.y); for (let i = 1; i < o.length; i++) o[i].y = Math.max(o[i].y, o[i - 1].y + g);
  const over = o.at(-1).y - hi; if (over > 0) for (let i = o.length - 1; i >= 0; i--) { o[i].y -= over; if (i && o[i].y - o[i - 1].y >= g) break; if (i) o[i - 1].y = Math.min(o[i - 1].y, o[i].y - g) }
  const r = []; o.forEach(x => r[x.i] = Math.max(lo, x.y)); return r };

const setup = () => {
  N = D.rounds.length; const T = D.total;
  const lines = D.before ? ['SEASON 2', `TRADES ${D.before + 1} TO ${D.after}`] : N === 1 ? ['FIRST TRADE', 'OF SEASON 2'] : [`FIRST ${N} TRADES`, 'OF SEASON 2'];
  L.$('#title').innerHTML = `<span class="l hf cr sh">${kern(lines[0])}</span><span class="l hf foil" style="filter:drop-shadow(0 5px 0 rgba(90,50,0,.75)) drop-shadow(0 0 30px rgba(4,7,14,.9))">${kern(lines[1])}</span>`;
  if (D.preview) { const pv = L.$('#pv'); pv.style.display = 'block'; pv.textContent = ['PREVIEW', 'PRICES AT ' + clock(D.total).t + ' ET', 'NOT FINAL'].join(SEP) }
  L.$('.fine').innerHTML = '$100K on every trade<i></i>not advice';
  // the night's time map: the first 90 minutes after the close (the reports land), the night and the morning, the session, the last hour
