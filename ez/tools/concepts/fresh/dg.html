<!doctype html><meta charset="utf-8"><title>Diegetic styles</title>
<!-- Diegetic versions of the three styles (2026-11-11, owner: "everything is part of the world, nothing is slapped on").
     Every word sits on, or is made of, an object in the scene, in that scene's own technique:
     1 sculpture: gilded wall inscription, gold-leaf names down the stone, numbers engraved in the gold plaques.
     2 claymation: letters pressed into the clay (the tower's blocks, the ground's front face), signs hand-lettered.
     3 pixel art: the level on a strict 4 px grid; the title written in stars, wooden signs drawn on the same grid.
     Positions are in the painting's own pixels (1536x2048); the page shows it from y=64 (4:5). ?s=1|2|3 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Serif&family=Baloo+2:wght@800&family=Patrick+Hand&family=Press+Start+2P&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{width:1536px;height:1920px;overflow:hidden;background:#0e0c0b}
#bg{position:absolute;left:0;top:-64px;width:1536px;height:2048px;image-rendering:pixelated}
.t{position:absolute;white-space:nowrap;transform:translate(-50%,-50%);text-align:center}
/* 1 */
.gild{font:600 112px/1 "Cormorant Garamond";letter-spacing:.22em;background:linear-gradient(180deg,#fff1c7 0%,#fdbc2a 38%,#b07f10 62%,#fdbc2a 80%,#6e4f0a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 1px rgba(0,0,0,.85)) drop-shadow(0 0 18px rgba(253,188,42,.18))}
.vinyl{font:500 34px/1.5 "Cormorant Garamond";letter-spacing:.32em;color:rgba(242,237,230,.72);text-transform:uppercase}
.vinyl b{font-weight:600;color:rgba(253,188,42,.8)}
.leaf{font:600 50px/1 "Cormorant Garamond";letter-spacing:.42em;writing-mode:vertical-rl;text-orientation:upright;background:linear-gradient(90deg,#6e4f0a,#fdbc2a 45%,#fff1c7 55%,#b07f10);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.92;filter:drop-shadow(0 1px 0 rgba(0,0,0,.9))}
.eng{font:400 54px/1 "Instrument Serif";color:#2b1d06;mix-blend-mode:multiply;text-shadow:0 1.5px 0 rgba(255,236,170,.55),0 -1.5px 0 rgba(0,0,0,.45)}
.eng.big{font-size:104px;color:#1a1300;mix-blend-mode:normal;opacity:.86}
/* 2: pressed into clay: the letter is a hollow, so the light lip is below-right and the shadow wall above-left */
.prs{font:800 96px/1 "Baloo 2";mix-blend-mode:multiply;text-shadow:0 3px 1px rgba(255,255,255,.35),0 -3px 2px rgba(0,0,0,.35)}
.prs.cr{color:rgba(150,128,104,.62)}.prs.gr{color:rgba(10,60,40,.55);font-size:62px;text-shadow:0 3px 1px rgba(160,255,210,.25),0 -3px 2px rgba(0,0,0,.45)}
.prs.sm{font-size:40px;letter-spacing:.06em}
.sg{font:400 50px/.92 "Patrick Hand";color:#1d1917;transform:translate(-50%,-50%) rotate(-3deg)}.sg small{display:block;font-size:28px;color:#5f5853}
/* 3 */
.px{position:absolute;font:400 32px/32px "Press Start 2P";color:#1d1917;-webkit-font-smoothing:none}
.board{position:absolute;background:#c9bfa9;box-shadow:inset 0 0 0 4px #6e4f0a,inset 4px 4px 0 4px #f2ede6;padding:12px 16px 8px}
.post{position:absolute;width:12px;background:#6e4f0a;box-shadow:inset 4px 0 0 #b07f10}
.star{position:absolute;width:8px;height:8px;background:#f2ede6}.star.g{background:#fdbc2a}.star.s{width:4px;height:4px;margin:2px}
</style>
<img id="bg"><div id="L"></div>
<script>
const s=new URLSearchParams(location.search).get('s')||'1',L=document.getElementById('L'),Y=64;
document.getElementById('bg').src={1:'img/g1.png',2:'img/g2.png',3:'img/g3p.png'}[s];
const at=(x,y,html,cls,css)=>{const d=document.createElement('div');d.className='t '+cls;d.style.left=x+'px';d.style.top=(y-Y)+'px';if(css)d.style.cssText+=css;d.innerHTML=html;L.appendChild(d);return d};
if(s==='1'){
 at(1060,250,'COREWEAVE','gild');
 at(1060,370,'One long &nbsp;·&nbsp; three short','vinyl');
 at(1060,432,'<b>Settles Wednesday · 4 pm ET</b>','vinyl','font-size:28px');
 at(1060,1950,'Earnings Zeason','vinyl','font-size:24px;letter-spacing:.5em;color:rgba(142,134,128,.8)');
 at(382,470,'+8%','eng big');at(382,760,'CHATGPT','leaf','writing-mode:vertical-rl;background:none;color:#2b1d06;-webkit-text-fill-color:#2b1d06;mix-blend-mode:multiply;filter:none;font-size:34px;letter-spacing:.3em;text-shadow:0 1px 0 rgba(255,236,170,.5)');
 at(395,1330,'KIMI','leaf');at(740,1380,'CLAUDE','leaf');at(1065,1230,'GROK','leaf');
 at(397,1698,'−10%','eng');at(741,1849,'−12%','eng');at(1067,1483,'−1.6%','eng')}
if(s==='2'){
 at(267,432,'+8%','prs gr','font-size:70px');at(267,516,'ChatGPT','prs gr','font-size:40px');
 at(238,1330,'CoreWeave','prs cr','font-size:78px');at(238,1420,'ONE UP. THREE DOWN.','prs cr sm','font-size:30px');
 at(1316,1300,'SETTLES WED','prs cr sm');at(1316,1352,'4 PM ET','prs cr sm');at(1316,1440,'EARNINGS ZEASON','prs cr sm','font-size:26px;letter-spacing:.12em');
 at(552,1478,'−10%<small>Kimi</small>','sg');at(1013,1552,'−12%<small>Claude</small>','sg');at(1283,1522,'−1.6%<small>Grok</small>','sg')}
if(s==='3'){
 /* the title written in stars: a 5x7 dot font on the art's grid (pitch 16 px = 4 grid cells) */
 const F={C:['01110','10001','10000','10000','10000','10001','01110'],O:['01110','10001','10001','10001','10001','10001','01110'],R:['11110','10001','10001','11110','10100','10010','10001'],E:['11111','10000','10000','11110','10000','10000','11111'],W:['10001','10001','10001','10101','10101','10101','01010'],A:['01110','10001','10001','11111','10001','10001','10001'],V:['10001','10001','10001','10001','10001','01010','00100']};
 let x0=520,y0=200,k=0;for(const ch of 'COREWEAVE'){const g=F[ch];g.forEach((row,r)=>[...row].forEach((v,c)=>{if(v==='1'){const d=document.createElement('i');d.className='star'+((k*7+r*3+c)%11===0?' g':'')+((k+r+c)%5===0?' s':'');d.style.left=(x0+c*16)+'px';d.style.top=(y0+r*16-Y)+'px';L.appendChild(d)}}));x0+=104;k++}
 const sign=(cx,ground,lines,w)=>{const hgt=lines.length*40+24,top=ground-80-hgt;const p=document.createElement('i');p.className='post';p.style.left=(cx-4)+'px';p.style.top=(top+hgt-Y)+'px';p.style.height=(ground-top-hgt)+'px';L.appendChild(p);
  const b=document.createElement('div');b.className='board';b.style.left=(cx-w/2)+'px';b.style.top=(top-Y)+'px';b.style.width=w+'px';b.style.height=hgt+'px';
  b.innerHTML=lines.map(([t,c])=>'<div class="px" style="position:static;color:'+c+';text-align:center;height:40px">'+t+'</div>').join('');L.appendChild(b)};
 /* ChatGPT's sign is nailed to the tower's bricks (no room for a post on top beside the hero) */
 sign(316,700,[['CHATGPT','#1d1917'],['+8%','#1f5c43']],256);document.querySelectorAll('.post')[0].remove();
 sign(576,1020,[['KIMI','#1d1917'],['-10%','#7a1d18']],176);
 sign(940,1020,[['CLAUDE','#1d1917'],['-12%','#7a1d18']],224);
 sign(1252,1020,[['GROK','#1d1917'],['-1.6%','#7a1d18']],192);
 const g=document.createElement('div');g.className='px';g.style.cssText='left:520px;top:'+(340-Y)+'px;color:#fdbc2a;font-size:32px;line-height:48px';g.innerHTML='SETTLES WED 4PM ET<br><span style="color:#8e8680;font-size:16px">EARNINGS ZEASON</span>';L.appendChild(g)}
document.fonts.ready.then(()=>document.getElementById('bg').decode()).then(()=>window.READY=1);
</script>
