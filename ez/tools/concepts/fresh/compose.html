<!doctype html><meta charset="utf-8"><title>Three styles</title>
<!-- Three styles for the trades post (2026-11-11): a Hedra-painted set (img/s1..s3.jpg, 1536x2048, no text) with the real
     trades set as crisp live type on the surfaces the painting left blank. ?s=1|2|3. Rendered at 1536x1920 (the painting
     cropped 64px top and bottom to 4:5), then scaled to 1080x1350. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Baloo+2:wght@700;800&family=Patrick+Hand&family=Press+Start+2P&family=Figtree:wght@600;700;800&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{width:1536px;height:1920px;overflow:hidden;background:#0e0c0b}
#bg{position:absolute;left:0;top:-64px;width:1536px;height:2048px}
.t{position:absolute;white-space:nowrap}
.c{transform:translate(-50%,-50%);text-align:center}
.foot{position:absolute;left:0;right:0;bottom:44px;text-align:center;font:700 30px/1 Figtree;letter-spacing:.16em;color:#8e8680}
.foot b{color:#f2ede6}.foot i{font-style:normal;color:#03c870}.foot u{text-decoration:none;color:#ff3a31}
/* 1: cinematic sculpture, engraved serif */
.s1 .hd{right:90px;top:150px;text-align:right;font:400 150px/.9 "Instrument Serif";color:#f2ede6}
.s1 .hd2{right:92px;top:300px;text-align:right;font:italic 400 64px/1 "Instrument Serif";color:#fdbc2a}
.s1 .eg{font:400 52px/1 "Instrument Serif";color:#3b2a14;text-shadow:0 1px 0 rgba(255,245,220,.6),0 -1px 0 rgba(0,0,0,.35);mix-blend-mode:multiply}
.s1 .nm{font:600 28px/1 Figtree;letter-spacing:.3em;color:#f2ede6;text-transform:uppercase}
.s1 .eg.g{color:#0e0c0b;font-size:150px;mix-blend-mode:normal;opacity:1;text-shadow:0 2px 0 rgba(255,236,170,.45),0 -2px 0 rgba(0,0,0,.4)}
/* 2: claymation, hand-lettered signs */
.s2 .hd{right:84px;top:120px;text-align:right;font:800 132px/.9 "Baloo 2";color:#f2ede6;text-shadow:0 8px 0 #000}
.s2 .hd2{right:88px;top:250px;text-align:right;font:700 52px/1 "Baloo 2";color:#fdbc2a}
.s2 .sg{font:400 50px/.92 "Patrick Hand";color:#1d1917;transform:translate(-50%,-50%) rotate(-3deg)}.s2 .sg small{display:block;font-size:28px;color:#5f5853}
.s2 .fl{font:800 70px/1 "Baloo 2";color:#55d6a2;text-shadow:0 6px 0 #000}.s2 .fl small{display:block;font-size:40px;color:#f2ede6}
/* 3: pixel art, pixel type */
.s3 .hd{right:84px;top:150px;text-align:right;font:400 64px/1.2 "Press Start 2P";color:#f2ede6}
.s3 .hd2{right:84px;top:250px;text-align:right;font:400 30px/1.5 "Press Start 2P";color:#fdbc2a}
.s3 .px{font:400 34px/1.3 "Press Start 2P";color:#f2ede6;background:#0e0c0b;padding:10px 12px;box-shadow:0 0 0 4px #f2ede6}
.s3 .px b{display:block;font-weight:400;font-size:28px}
/* the foot sits under the headline where the painting's lower half is busy */
.s1 .foot,.s3 .foot{left:auto;right:92px;bottom:auto;top:400px;text-align:right;font-size:26px}.s3 .foot{top:340px;font:400 18px/1.6 'Press Start 2P';letter-spacing:0}
.up{color:#55d6a2!important}.dn{color:#e8576b!important}
</style>
<img id="bg">
<div id="L"></div>
<div class="foot"><b>SETTLES WED · 4 PM ET</b> &nbsp;·&nbsp; <i>E</i>ARNINGS <u>Z</u>EASON</div>
<script>
/* positions are in the painting's own pixels (1536x2048); the page shows it from y=64 */
const s=new URLSearchParams(location.search).get('s')||'1',L=document.getElementById('L');document.body.className='s'+s;
document.getElementById('bg').src='img/g'+s+'.png';
const at=(x,y,html,cls)=>{const d=document.createElement('div');d.className='t c '+(cls||'');d.style.left=x+'px';d.style.top=(y-64)+'px';d.innerHTML=html;L.appendChild(d)};
const hd=(a,b)=>{L.insertAdjacentHTML('beforeend','<div class="t hd">'+a+'</div><div class="t hd2">'+b+'</div>')};
if(s==='1'){hd('CoreWeave','One long. Three short.');
 at(380,560,'+8%','eg g');at(380,1100,'ChatGPT','nm up');
 at(391,1673,'−10%','eg');at(391,1790,'Kimi','nm');
 at(733,1820,'−12%','eg');at(910,1820,'Claude','nm');
 at(1056,1461,'−1.6%','eg');at(1056,1578,'Grok','nm')}
if(s==='2'){hd('CoreWeave','One up. Three down.');
 at(520,250,'+8%<small>ChatGPT</small>','fl');
 at(552,1478,'−10%<small>Kimi</small>','sg');at(1013,1552,'−12%<small>Claude</small>','sg');at(1283,1522,'−1.6%<small>Grok</small>','sg')}
if(s==='3'){hd('COREWEAVE','1 LONG VS 3 SHORT');
 at(640,200,'<b>CHATGPT</b>+8%','px up');
 at(569,1640,'<b>KIMI</b>−10%','px dn');at(897,1690,'<b>CLAUDE</b>−12%','px dn');at(1213,1190,'<b>GROK</b>−1.6%','px dn')}
document.fonts.ready.then(()=>document.getElementById('bg').decode()).then(()=>window.READY=1);
</script>
