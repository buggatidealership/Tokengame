<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upcoming expand mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap">
<style>
/* Upcoming row expanded in place (2026-11-08). Every figure is computed from ez-data.js and the terminal's REPORT/HL maps (read from hyperdash/index.html). No invented words. */
:root{--pn:rgba(14,19,17,.9);--pn2:#141b18;--ln:#24302b;--tx:#f2ede6;--mu:#8e9a93;--mu2:#5d6963;--up:#55d6a2;--dn:#ff5a6e;--ac:#fdbc2a;--mono:"Geist Mono",ui-monospace,monospace;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}body{background:#1b1d1c;font-family:var(--sans);color:var(--tx);padding:24px;display:flex;gap:28px;align-items:flex-start}
.cap{font:600 12px/1.45 var(--mono);color:#cfd6d2;letter-spacing:.03em;margin-bottom:10px;min-height:52px}
.ph{width:var(--w,390px);height:844px;position:relative;border-radius:30px;overflow:hidden;border:1px solid #333;background:linear-gradient(180deg,#0e5a3a 0%,#0b3d29 9%,#0a2e20 16%,#08190f 28%,#07120e 36%,#060a08 46%,#060908 90%,#140909 100%)}
.top{display:flex;align-items:center;gap:9px;padding:14px 14px 10px}.top b{font:800 16px/1 var(--sans);white-space:nowrap}.top .e{color:#03c870}.top .z{color:#ff3a31}
.pill{margin-left:auto;display:flex;align-items:center;gap:6px;font:700 10.5px/1 var(--mono);letter-spacing:.08em;padding:6px 9px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid #2c3a33;white-space:nowrap}.pill i{width:7px;height:7px;border-radius:50%;background:var(--dn);box-shadow:0 0 8px var(--dn)}
.nav{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--ln)}.nav b{font:600 12px/1 var(--mono);letter-spacing:.08em;color:var(--mu);padding:12px 0 11px;border-bottom:2px solid transparent}.nav b.on{color:var(--tx);border-color:var(--ac)}
.pnl{margin:12px 12px 0;border-radius:14px;background:var(--pn);border:1px solid var(--ln);overflow:hidden}
.ph h3{display:flex;align-items:center;gap:8px;padding:13px 14px;font:600 12.5px/1 var(--mono);letter-spacing:.1em;border-bottom:1px solid var(--ln)}
.day{padding:10px 14px 6px;font:700 11px/1 var(--mono);letter-spacing:.1em;color:var(--ac)}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--ln)}
.row b{font:700 14px/1.15 var(--sans)}.row small{display:block;margin-top:4px;font:500 11px/1.2 var(--mono);color:var(--mu)}
.hl{font:700 9.5px/1 var(--mono);padding:3px 5px;border-radius:4px;background:#123a2a;color:var(--up);margin-left:6px;vertical-align:2px}
.chev{font:600 14px/1 var(--mono);color:var(--mu)}.row.op{background:rgba(253,188,42,.06)}.row.op .chev{color:var(--ac);transform:rotate(90deg)}
.co{border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}.co img{width:76%;height:76%;object-fit:contain}
.ai{border-radius:50%;display:grid;place-items:center;flex:none}.ai svg{width:58%;height:58%}
.ex{padding:4px 14px 14px;background:rgba(253,188,42,.04);border-top:1px dashed #3a4a42}
.k{margin-top:11px;font:700 10px/1 var(--mono);letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
.t{width:100%;border-collapse:collapse;margin-top:7px}.t td,.t th{padding:6px 0;font:500 12.5px/1 var(--mono);text-align:right;white-space:nowrap}.t th{font:600 9.5px/1 var(--mono);letter-spacing:.1em;color:var(--mu2);text-transform:uppercase}
.t td:first-child,.t th:first-child{text-align:left}.t td:first-child{font:600 13px/1 var(--sans)}.t td:first-child span{display:inline-flex;align-items:center;gap:7px}.t tr+tr td{border-top:1px solid var(--ln)}
.t tr.best td{color:var(--ac)}.cr{font-size:12px}
.w{color:var(--up)}.l{color:var(--dn)}
.line{margin-top:10px;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:var(--pn2);border:1px solid var(--ln);font:500 12.5px/1.3 var(--sans)}.line b{color:var(--ac)}
.calls{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.calls span{display:flex;align-items:center;gap:5px;font:600 11px/1 var(--mono);padding:5px 7px;border-radius:7px;background:var(--pn2);border:1px solid var(--ln);color:var(--mu)}
.hr{display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}.hr:first-of-type{border-top:0}
.hr .n{font:700 13px/1.1 var(--sans)}.hr .n small{font:500 11px/1 var(--mono);margin-left:6px}
.dots{display:flex;gap:5px;margin-top:5px}.dots i{display:flex;align-items:center;gap:3px;font:600 10.5px/1 var(--mono);font-style:normal;padding:3px 5px;border-radius:5px}.dots i.ok{background:#123a2a;color:var(--up)}.dots i.no{background:#3d1820;color:var(--dn)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin-top:8px;font:500 12.5px/1.25 var(--mono)}.kv dt{color:var(--mu)}.kv dd{text-align:right}
.note{margin-top:10px;font:400 10.5px/1.4 var(--mono);color:var(--mu2)}
</style>
<script src="../../../ez-data.js"></script>
<body>
<script>
var MK=["GROK","CLAUDE","GPT","KIMI"],TARGET=104;
var src=new XMLHttpRequest();src.open('GET','../hyperdash/index.html',false);src.send();var H=src.responseText;
var REPORT=eval('('+H.match(/var REPORT=(\{[\s\S]*?\});/)[1]+')'),HL=eval('('+H.match(/var HL=(\{[\s\S]*?\});/)[1]+')');
function aiIcon(m,px){var M=MODELS[m];return '<span class="ai" style="width:'+px+'px;height:'+px+'px;background:'+M.bg+'"><svg viewBox="0 0 24 24"><path fill="'+M.fg+'"'+(M.fr?' fill-rule="'+M.fr+'"':'')+' d="'+M.d+'"/>'+(M.dot?'<path fill="'+M.dotc+'" d="'+M.dot+'"/>':'')+'</svg></span>'}
function coIcon(t,px){var L=CO_LOGOS[t];return '<span class="co" style="width:'+px+'px;height:'+px+'px">'+(L?'<img src="../../../media/'+L.f+'">':'')+'</span>'}
var logo='';try{var x=new XMLHttpRequest();x.open('GET','../launchvid/ez-logo-inner.svgfrag',false);x.send();logo=x.responseText}catch(e){}
function sgn(c){return c[1].indexOf('DOWN')===0?-1:1}function mag(c){return parseFloat(c[1].replace(/[^0-9.]/g,''))}
function stats(rs){var o={};MK.forEach(function(m){o[m]={w:0,l:0,sz:0,n:0}});rs.forEach(function(r){r.calls.forEach(function(c){var s=o[c[0]];if(!s)return;var ok=sgn(c)*r.a>0;ok?s.w++:s.l++;s.sz+=mag(c);s.n++})});return o}
function hr(s){return s.w+s.l?s.w/(s.w+s.l):0}
function best(st){var b=null;MK.forEach(function(m){var s=st[m];if(s.w+s.l<3)return;if(!b||hr(s)>hr(st[b])||(hr(s)===hr(st[b])&&s.w>st[b].w))b=m});return b}
var U=UPCOMING.filter(function(u){return u.n===TARGET})[0],META=RMETA[TARGET],SEC=META.sector;
var secR=ROUNDS.filter(function(r){return (RMETA[r.n]||{}).sector===SEC}),SS=stats(secR),ALL=stats(ROUNDS),B=best(SS);
var D=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];function utc(iso){var d=new Date(iso);return D[d.getUTCDay()]+' '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')}
function drop(iso){var d=new Date(iso),a=new Date(d-2*36e5),b=new Date(d-36e5);function h(x){return String(x.getUTCHours()).padStart(2,'0')+':'+String(x.getUTCMinutes()).padStart(2,'0')}return h(a)+'–'+h(b)}
var head='<div class="top"><svg width="26" height="26" viewBox="0 0 400 400">'+logo+'</svg><b><span class="e">E</span>arnings <span class="z">Z</span>eason</b><span class="pill"><i></i>IN PLAY '+coIcon('BRK.B',16)+'</span></div><div class="nav"><b>LEADERBOARD</b><b class="on">UPCOMING</b><b>AIS</b></div>';
function rowC(u,op){var R=REPORT[u.ticker]||{},hl=HL[u.ticker.split('.')[0]];return '<div class="row'+(op?' op':'')+'">'+coIcon(u.ticker,30)+'<div><b>'+u.co+(hl?'<span class="hl">HL</span>':'')+'</b><small>'+(R.t?'Reports '+utc(R.t)+' · trades '+drop(R.t):'Date to come')+'</small></div><span class="chev">›</span></div>'}
var others=UPCOMING.filter(function(u){return u.called===U.called&&u.n!==TARGET}).slice(0,1).concat(UPCOMING.filter(function(u){return u.called!==U.called&&u.n>TARGET}).slice(0,2));
var BL='<div class="line">👑 <span>Best in '+SEC.replace('Information Technology','Tech')+': <b>'+MODELS[B].app+'</b>, '+SS[B].w+'-'+SS[B].l+' ('+Math.round(hr(SS[B])*100)+'%)</span></div>';
var tradesNote='<div class="k">Trades</div><div class="calls">'+MK.map(function(m){return '<span>'+aiIcon(m,16)+'not in yet</span>'}).join('')+'</div>';
/* A who to watch */
var A=BL+'<table class="t"><tr><th>'+SEC.replace('Information Technology','Tech')+' · '+secR.length+' rounds</th><th>W-L</th><th>Hit</th><th>All</th></tr>'+
 MK.slice().sort(function(a,b){return hr(SS[b])-hr(SS[a])||SS[b].w-SS[a].w}).map(function(m){var s=SS[m],o=ALL[m];return '<tr'+(m===B?' class="best"':'')+'><td><span>'+aiIcon(m,20)+MODELS[m].app+(m===B?' <span class="cr">👑</span>':'')+'</span></td><td><span class="w">'+s.w+'</span>-<span class="l">'+s.l+'</span></td><td>'+Math.round(hr(s)*100)+'%</td><td style="color:var(--mu)">'+Math.round(hr(o)*100)+'%</td></tr>'}).join('')+'</table>'+tradesNote;
/* B history: same company, else same themes */
var same=ROUNDS.filter(function(r){return r.ticker===U.ticker});var th=META.themes;
var sim=same.length?same:ROUNDS.filter(function(r){var t=(RMETA[r.n]||{}).themes||[];return th.every(function(x){return t.indexOf(x)>=0})});var SIM=stats(sim);
var Bv='<div class="k">'+(same.length?'Past reports':'No past report in the sheet · '+th.join(' + ')+' names, '+sim.length+' rounds')+'</div>'+
 sim.slice(-3).reverse().map(function(r){return '<div class="hr">'+coIcon(r.ticker,26)+'<div><div class="n">'+r.co+'<small class="'+(r.a>=0?'w':'l')+'">'+(r.a>=0?'+':'−')+Math.abs(r.a)+'%</small></div><div class="dots">'+MK.map(function(m){var c=r.calls.filter(function(x){return x[0]===m})[0];if(!c)return '';var ok=sgn(c)*r.a>0;return '<i class="'+(ok?'ok':'no')+'">'+aiIcon(m,13)+(ok?'✓':'✗')+'</i>'}).join('')+'</div></div></div>'}).join('')+
 '<table class="t" style="margin-top:4px"><tr><th>On '+th.join(' + ')+'</th><th>W-L</th><th>Hit</th></tr>'+MK.slice().sort(function(a,b){return hr(SIM[b])-hr(SIM[a])}).map(function(m){var s=SIM[m];return '<tr><td><span>'+aiIcon(m,18)+MODELS[m].app+'</span></td><td><span class="w">'+s.w+'</span>-<span class="l">'+s.l+'</span></td><td>'+Math.round(hr(s)*100)+'%</td></tr>'}).join('')+'</table>';
/* C the setup */
var R=REPORT[U.ticker],hl=HL[U.ticker];
var C='<dl class="kv"><dt>Reports</dt><dd>'+utc(R.t)+' UTC'+(R.est?' (est.)':'')+'</dd><dt>When</dt><dd>'+R.w+'</dd><dt>Trades drop</dt><dd>'+drop(R.t)+' UTC</dd><dt>Graded</dt><dd>at the next close</dd><dt>Hyperliquid</dt><dd>'+(hl?hl[1]+':'+hl[0]+' · $'+hl[2]+'M OI':'no market')+'</dd></dl>'+
 '<table class="t" style="margin-top:10px"><tr><th>Avg size in '+SEC.replace('Information Technology','Tech')+'</th><th>Avg move</th></tr>'+MK.map(function(m){var s=SS[m];return '<tr><td><span>'+aiIcon(m,18)+MODELS[m].app+'</span></td><td>'+(s.sz/s.n).toFixed(1)+'%</td></tr>'}).join('')+'</table>'+
 '<div class="note">Avg size: the move each AI called, in its '+SEC.replace('Information Technology','Tech')+' trades. The sector\'s real moves averaged '+(secR.reduce(function(a,r){return a+Math.abs(r.a)},0)/secR.length).toFixed(1)+'%.</div>'+BL;
function phone(cap,ex,w){return '<div><div class="cap" style="width:'+(w||390)+'px">'+cap+'</div><div class="ph" style="--w:'+(w||390)+'px">'+head+'<div class="pnl"><h3>NEXT TRADES</h3><div class="day">TUESDAY · NOV 10 · UTC</div>'+rowC(UPCOMING.filter(function(u){return u.n===107})[0])+rowC(U,true)+'<div class="ex">'+ex+'</div><div class="day" style="border-top:1px solid var(--ln);padding-top:12px">THURSDAY · NOV 12</div>'+rowC(UPCOMING.filter(function(u){return u.n===106})[0])+rowC(UPCOMING.filter(function(u){return u.n===109})[0])+'</div></div></div>'}
U.co=U.co||'CoreWeave';
document.body.innerHTML=phone('A · WHO TO WATCH. The sector record: each AI\'s W-L and hit rate in '+SEC+', best one crowned (3+ trades, ties to more wins).',A)+
 phone('B · HISTORY. '+U.co+' never reported in the sheet, so the nearest record: other '+th.join(' + ')+' names, each AI right or wrong.',Bv)+
 phone('C · THE SETUP. Report time and trade window, the market to follow, how big each AI calls in this sector.',C)+
 phone('A at 320 px',A,320);
window.__ok=1;
</script>
