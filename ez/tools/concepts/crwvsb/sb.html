<!doctype html><meta charset="utf-8"><title>CoreWeave trades storyboard</title>
<!-- Storyboard for the CoreWeave trades post (2026-11-10, after the owner's "not good enough to post"): the conflict in frame one,
     the site's own In play card as the hero, one pop per beat, 8 s. ?f=1..4 draws one frame. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Geist+Mono:wght@600;700&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden;background:#000;color:#f2ede6;font-family:Inter,sans-serif}
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#0c4a2e 0%,#062216 8%,#010503 16%,#000 22%,#000 78%,#0d0304 86%,#2e090d 94%,#440d13 100%)}
.f{position:absolute;inset:0;display:none}
.lab{position:absolute;left:0;right:0;top:120px;text-align:center;font:700 70px/1.05 Inter,sans-serif;letter-spacing:-.035em}.lab b{font-weight:900}
.mu{color:#8e8680}.up{color:#55d6a2}.dn{color:#e8576b}.go{color:#fdbc2a}
/* frame 1: the conflict */
#f1 .h{position:absolute;left:0;right:0;top:170px;text-align:center;font:900 132px/0.95 Inter,sans-serif;letter-spacing:-.055em}
#f1 .ring{position:absolute;border-radius:50%;background:#000 center/62% no-repeat}
#f1 .gpt{left:110px;top:640px;width:330px;height:330px;box-shadow:0 0 0 8px #55d6a2,0 0 90px rgba(85,214,162,.55)}
#f1 .s{width:190px;height:190px;box-shadow:0 0 0 6px #e8576b,0 0 60px rgba(232,87,107,.45)}
#f1 .v{position:absolute;left:470px;top:735px;font:800 120px/1 Inter,sans-serif;letter-spacing:-.05em;color:#8e8680}
#f1 .t{position:absolute;left:0;right:0;top:1190px;text-align:center;font:700 34px/1 "Geist Mono",monospace;letter-spacing:.12em;color:#fdbc2a}
/* frames 2-3: the site's card, lifted */
.card{position:absolute;left:50%;top:400px;width:980px;height:504px;margin-left:-490px;border-radius:30px;background:url(crwv.png) 0 0/980px auto no-repeat;box-shadow:0 0 0 2px rgba(255,255,255,.08),0 60px 140px rgba(0,0,0,.8);transform:perspective(1800px) rotateX(8deg)}
.pop{position:absolute;background:url(crwv.png) no-repeat;border-radius:22px;box-shadow:0 0 0 3px var(--g),0 0 40px var(--g),0 30px 70px rgba(0,0,0,.7)}
.dimc{filter:brightness(.45) blur(2px)}
.note{position:absolute;left:0;right:0;top:1150px;text-align:center;font:600 30px/1.4 "Geist Mono",monospace;color:#8e8680}
/* frame 4 */
#f4 .h{position:absolute;left:0;right:0;top:360px;text-align:center;font:900 150px/0.95 Inter,sans-serif;letter-spacing:-.055em}
#f4 .lk{position:absolute;left:0;right:0;top:930px;display:flex;align-items:center;justify-content:center;gap:22px;font:800 64px/1 Inter,sans-serif;letter-spacing:-.035em}
#f4 .lk img{width:96px;height:96px}#f4 .lk .e{color:#03c870}#f4 .lk .z{color:#ff3a31}
</style>
<div id="bg"></div>
<div class="f" id="f1"><div class="h">ChatGPT<br><span class="mu">vs</span> everyone.</div>
 <div class="ring gpt" id="g1"></div><div class="v">1v3</div><div class="ring s" id="k1" style="left:700px;top:560px"></div><div class="ring s" id="c1" style="left:820px;top:760px"></div><div class="ring s" id="r1" style="left:660px;top:930px"></div>
 <div class="t">COREWEAVE REPORTS TONIGHT</div></div>
<div class="f" id="f2"><div class="lab">The trades <b>are in</b></div><div class="card"></div><div class="note">The live card from earningszn.xyz,<br>lifted toward the camera.</div></div>
<div class="f" id="f3"><div class="lab">Claude says <b class="dn">−12%</b></div><div class="card dimc"></div>
 <div class="pop" style="--g:rgba(85,214,162,.85);left:120px;top:580px;width:220px;height:330px;background-size:1078px auto;background-position:-123px -186px;transform:scale(1.15)"></div>
 <div class="pop" style="--g:rgba(232,87,107,.85);left:690px;top:580px;width:320px;height:300px;background-size:1078px auto;background-position:-715px -205px;transform:scale(1.15)"></div>
 <div class="note">ChatGPT's long lifts out first,<br>then the three shorts, Claude's 12% the biggest pop.</div></div>
<div class="f" id="f4"><div class="h">Who's<br><span class="go">right?</span></div><div class="note" style="top:720px;font-size:36px;color:#cfc9ba">Wednesday's close decides.</div>
 <div class="lk"><img src="ezlogo.svg"><span><span class="e">E</span>arnings <span class="z">Z</span>eason</span></div></div>
<script>
fetch('models.json').then(r=>r.json()).then(M=>{const svg=m=>{const x=M[m];return 'url("data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="'+x.fg+'"'+(x.fr?' fill-rule="'+x.fr+'"':'')+' d="'+x.d+'"/>'+(x.dot?'<path fill="'+x.dotc+'" d="'+x.dot+'"/>':'')+'</svg>')+'")'};
 g1.style.backgroundImage=svg('GPT');k1.style.backgroundImage=svg('KIMI');c1.style.backgroundImage=svg('CLAUDE');c1.style.backgroundColor=M.CLAUDE.bg;r1.style.backgroundImage=svg('GROK');
 const f=new URLSearchParams(location.search).get('f')||'1';document.getElementById('f'+f).style.display='block';document.fonts.ready.then(()=>window.READY=1)});
</script>
