<style>
:root{--bg:#0e0c0b;--pn:#161312;--pn2:#1d1917;--ln:#2a2522;--tx:#f2ede6;--mu:#8e8680;--mu2:#5f5853;--up:#55d6a2;--dn:#e8576b;--ac:#fdbc2a;--acx:#1a1300;--mono:"Geist Mono",ui-monospace,Menlo,monospace;--sans:Inter,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.app{max-width:1180px;margin:0 auto;padding:0 16px 96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}

.brand svg{width:30px;height:30px;flex:none}.brand b{white-space:nowrap;font-weight:800;letter-spacing:.005em}.brand b i{font-style:normal}.brand .e{color:#03c870}.brand .z{color:#ff3a31}
.ib{width:42px;height:42px;border-radius:10px;background:var(--pn2);border:1px solid var(--ln);display:grid;place-items:center;flex:none}
.ib svg{width:20px;height:20px;stroke:var(--tx);fill:none;stroke-width:1.8}
.cta{background:var(--ac);color:var(--acx);font:700 15px/1 var(--sans);padding:13px 16px;border-radius:10px;white-space:nowrap}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:14px;margin-top:14px;overflow:hidden}
.tabs{display:flex;gap:26px;padding:0 20px;border-bottom:1px solid var(--ln);overflow-x:auto;scrollbar-width:none}
.tabs button{font:500 14px/1 var(--mono);letter-spacing:.06em;color:var(--mu);padding:20px 0 16px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--tx);border-color:var(--ac)}

.sub{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--ln);overflow-x:auto;scrollbar-width:none}

.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:.07;font:800 54px/1 var(--sans);letter-spacing:-.02em}
/* who: the trader header */
.who{display:flex;gap:14px;align-items:center;padding:18px 20px}

.rk{margin-left:auto;text-align:right;font:500 11px/1.3 var(--mono);color:var(--mu)}.rk b{display:block;font:700 22px/1 var(--sans);color:var(--ac)}
.pick{display:flex;gap:8px;padding:0 20px 16px;overflow-x:auto;scrollbar-width:none}

.kv{display:none;grid-template-columns:1fr 1fr;gap:22px 16px;padding:6px 20px 22px}.row.op .kv{display:grid}

.lr .rt{text-align:right}.lr .rt b{display:block;font:500 17px/1 var(--mono)}.lr .rt svg{display:block;margin:7px 0 0 auto;width:96px;height:24px}

.sum{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--ln)}
.sum div{padding:16px 10px 16px 20px;border-right:1px solid var(--ln)}.sum div:last-child{border-right:0}
.sum small{display:block;font:600 11px/1.2 var(--sans);letter-spacing:.06em;color:var(--mu);text-transform:uppercase}.sum b{display:block;margin-top:8px;font:500 17px/1 var(--mono)}
.note{padding:14px 20px;font:400 11.5px/1.5 var(--mono);color:var(--mu)}
.empty{padding:22px 20px;font:500 13px/1.5 var(--mono);color:var(--mu)}
.cd{font:500 12px/1 var(--mono);color:var(--ac);white-space:nowrap}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#121010;border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(4,1fr);padding:0 0 env(safe-area-inset-bottom,0px)}

.nav button.on{color:var(--tx);border-color:var(--ac)}

.v{display:none}.v.on{display:block}

.nm2{display:flex;align-items:center;gap:8px}.nm2 .no{width:14px;font:600 13px/1 var(--mono);color:var(--mu)}.nm2 .no.g{color:var(--ac)}

.lrd{display:inline-flex;align-items:center;gap:6px;text-align:right}.lrd small{display:block;margin-top:3px;font:400 10px/1 var(--mono);color:var(--mu)}.lrd .co{width:20px;height:20px}.lrd .pl{font-size:13px}
.pc b{display:block;font:600 17px/1 var(--mono)}.pc svg{display:block;margin:6px 0 0 auto;width:70px;height:18px}.pc .gt{margin:6px 0 0}

.mono{font:500 14px/1 var(--mono)}

.sw{overflow-x:auto}.st{width:100%;border-collapse:collapse;}
.st th{padding:12px 6px 10px;border-bottom:1px solid var(--ln);text-align:center;font:600 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}
.st th:first-child{text-align:left;padding-left:20px}.st th .ai{margin:0 auto}

.lbg{display:block}
@media (min-width:980px){.lbg{display:grid;grid-template-columns:1fr 1fr;gap:16px}.lbg>div>.pn{height:calc(100% - 14px)}}
@media (max-width:420px){.top .ib{display:none}.brand b{font-size:15px}}
@media (max-width:370px){.lt td,.lt th{padding-right:12px}.lt td.ac{padding-left:12px}.nm2 small{display:none}.lrd .co{display:none}.pc b,.hr{font-size:14px}.lt .pc svg{width:54px}
 .st td b{font-size:11.5px}.st td.sn{padding-left:12px;font-size:11.5px;max-width:84px}.st th:first-child{padding-left:12px}.brand b{font-size:13.5px}.cta{font-size:12px;padding:11px 9px}}

.uz{padding:14px 20px;font:400 11.5px/1.5 var(--mono);color:var(--mu);border-bottom:1px solid var(--ln)}
.ud{padding:14px 20px 8px;font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--ac)}
.ur{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--ln)}
.ur .as{align-items:center}.ur .cn{display:block;font:600 15px/1.1 var(--sans)}.ur .as small{display:block;margin-top:4px;font:400 11px/1.2 var(--mono);color:var(--mu);white-space:normal}
.ur .as>span{white-space:normal}
.ut{text-align:right}.ut small{display:block;font:600 10px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}.ut b{display:block;margin-top:5px;font:600 14px/1 var(--mono);color:var(--tx);white-space:nowrap}

.ab{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.ab a,.ab button{font:600 13px/1 var(--sans);padding:10px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--pn2);color:var(--tx);text-decoration:none}
.ab a{background:var(--ac);color:var(--acx);border-color:var(--ac)}
</style>

<script>
(function(){
var MK=["GROK","CLAUDE","GPT","KIMI"],LAB={GROK:"xAI",CLAUDE:"Anthropic",GPT:"OpenAI",KIMI:"Moonshot AI"},FLAG={GROK:"US",CLAUDE:"US",GPT:"US",KIMI:"CN"};
var NOW=new Date();
function pd(s){var m=String(s||"").match(/(\d+)\/(\d+)\/(\d+)/);return m?new Date(2000+(+m[3]%100),+m[1]-1,+m[2]):null}
function money(v,sign){var a=Math.abs(v),s=a>=1e6?(a/1e6).toFixed(2)+"M":a.toLocaleString("en-US",{maximumFractionDigits:0});return (v<0?"−":sign?"+":"")+"$"+s}
function kfmt(v){var a=Math.abs(v),s=a>=1e6?(a/1e6).toFixed(1)+"M":a>=1e3?(a/1e3).toFixed(a>=1e5?0:1)+"K":a.toFixed(0);return (v<0?"−":"")+"$"+s}
function aiIcon(m,px){var M=MODELS[m];return '<span class="ai" style="width:'+px+'px;height:'+px+'px;background:'+M.bg+'"><svg viewBox="0 0 24 24"><path fill="'+M.fg+'"'+(M.fr?' fill-rule="'+M.fr+'"':'')+' d="'+M.d+'"/>'+(M.dot?'<path fill="'+M.dotc+'" d="'+M.dot+'"/>':'')+'</svg></span>'}
function coIcon(t){var L=CO_LOGOS[t];return L?'<span class="co'+(L.dark?' k':'')+'"><img src="media/'+L.f+'" alt="" loading="lazy"></span>':'<span class="co k"></span>'}
/* every graded trade per model: flat $100K, P&L = $100K x direction x move */
var T={};MK.forEach(function(m){T[m]=[]});
ROUNDS.forEach(function(r){r.calls.forEach(function(c){var s=c[1].indexOf("DOWN")===0?-1:1,mag=parseFloat(c[1].replace(/[^0-9.]/g,""));
  T[c[0]].push({r:r,s:s,mag:mag,pnl:1000*s*r.a,ok:(s>0)===(r.a>0),off:+c[2],win:(r.win||"").split(" & ").indexOf(c[0])>-1,date:pd(r.resolves)||pd(r.called)})})});
function inWin(x,w){if(w==="ALL")return true;var d=(NOW-x.date)/864e5;return w==="24H"?d<=1.5:w==="7D"?d<=7:d<=30}
function agg(m,w){var L=T[m].filter(function(x){return inWin(x,w)}),p=0,ok=0;L.forEach(function(x){p+=x.pnl;if(x.ok)ok++});return {L:L,p:p,w:ok,l:L.length-ok,hr:L.length?ok/L.length:0}}
var st={v:"leaders",m:"GROK",tab:"pnl",met:"PNL",win:"ALL",low:"trades",lbw:"ALL",open:{},all:false};
function rank(w){return MK.slice().sort(function(a,b){return agg(b,w).p-agg(a,w).p})}

/* series: one point per close date, from 0 */
function series(m){var L=T[m].filter(function(x){return inWin(x,st.win)}).slice().sort(function(a,b){return a.date-b.date}),pts=[],cum=0,ok=0,n=0;
  if(!L.length)return pts;pts.push({t:+L[0].date-864e5,v:st.met==="HIT"?50:0});
  L.forEach(function(x,i){cum+=x.pnl;n++;if(x.ok)ok++;var v=st.met==="PNL"?cum:st.met==="HIT"?100*ok/n:(2*ok-n);
