// the chart on the screen, each AI's logo on its disc, its trade on its plate. The first hour after the report plays in slow
// motion from Hyperliquid's own 5-minute (or 1-minute) candles, with the New York clock beside it; then the rest of the night

const L=document.createElement('canvas');L.width=W;L.height=H;const g=L.getContext('2d');// the screen's own layer
