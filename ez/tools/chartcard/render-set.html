const money=v=>(v<0?'−':'+')+'$'+Math.abs(Math.round(v)).toLocaleString('en-US');

// ---- the price path: hours since the close before (x=0); the first hour at the fine step; the day before as the stock's own line
function fine(){const b=C.bars[C.iRep];if(C.fine&&C.fine.length>1)return C.fine;

  let hi=Math.max(...vals),lo=Math.min(...vals);const pd=(hi-lo)*.12;hi+=pd;lo-=pd;const Yp=d=>py1-(py1-py0)*(d-lo)/(hi-lo),z0=Yp(0);
