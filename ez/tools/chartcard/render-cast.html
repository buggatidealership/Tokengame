<canvas id="c" width="1080" height="1350"></canvas>
<script>

async function init(cfg){C=cfg;const k=C.calls.length,r1=R0+k*RS;

 await new Promise(r=>{if(!C.logo)return r();const i=new Image();i.onload=()=>{img.co=i;r()};i.onerror=r;i.src=C.logo});
 await new Promise(r=>{const i=new Image();i.onload=()=>{img.ez=i;r()};i.onerror=r;i.src=C.ezLogo});
 for(const c of C.calls){const v=document.createElement('video');v.muted=true;v.preload='auto';v.src=C.cast[c.m].src;
  await new Promise(r=>{v.onloadeddata=r;v.onerror=r});V[c.m]=v}

async function seek(t){await Promise.all(Object.values(V).map(v=>new Promise(r=>{const d=v.duration||5,tt=(t%d);if(Math.abs(v.currentTime-tt)<1e-3)return r();v.onseeked=()=>r();v.currentTime=tt})))}
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function face(m,X,Y,s,ring,alpha=1){const v=V[m],hb=C.cast[m].head;x.save();x.globalAlpha*=alpha;x.beginPath();x.arc(X+s/2,Y+s/2,s/2,0,7);x.closePath();x.save();x.clip();

function portrait(m,X,Y,w,h,ring){const v=V[m];x.save();rr(X,Y,w,h,18);x.save();x.clip();x.fillStyle='#222';x.fillRect(X,Y,w,h);if(v)x.drawImage(v,0,0,v.videoWidth||600,v.videoHeight||800,X,Y,w,h);x.restore();
