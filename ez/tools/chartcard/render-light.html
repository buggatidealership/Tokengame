<script>
// v9 "light" (owner, 5 Nov: "a bit cleaner... with the EZ branding... a sort of white background... EZ presents round whatever...
// the lettering of the name of the company should definitely be different... use some of our fonts... at the end the winner needs to
// stand out, the one that made the most money"). One P&L chart on a white screen, every word and line drawn crisp; three letterings:
// A ticket (Anton, Barlow Condensed: the X2+ tickets), B logo (Kanit black italic with the logo's green and red edges, Saira Condensed),
// C show (Lilita One, Fredoka: the live site). The winner = the most money this round.
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=1080,H=1350;
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>clamp((t-a)/(b-a),0,1),lerp=(a,b,f)=>a+(b-a)*f;
const NM={GPT:'GPT',CLAUDE:'Claude',KIMI:'Kimi',GROK:'Grok'};
const BR={ink:'#04070e',cream:'#f8f0d9',green:'#03c870',red:'#ff3a31',gold:'#fdbc2a'};
const TAKES={
 A:{bg:'#faf6ec',panel:'#ffffff',rule:'#e6dfcf',ink:BR.ink,mut:'#6f6a5e',up:'#08834a',dn:'#d4231b',disp:['','Anton'],lab:['800','BarlowC'],num:['','Anton'],caps:1,bands:1,winPlate:'gold',ls:.06},
 B:{bg:'#ffffff',panel:'#ffffff',rule:'#e9eaee',ink:BR.ink,mut:'#6b7080',up:'#08834a',dn:'#d4231b',disp:['italic 900','Kanit'],lab:['800','SairaC'],num:['italic 700','Kanit'],caps:1,edge:1,dot:1,winPlate:'ink',ls:.04},
 D:{bg:BR.ink,panel:'#0b0f16',rule:'#1d2533',ink:BR.cream,mut:'#8f95a3',up:BR.green,dn:BR.red,disp:['italic 900','Kanit'],lab:['800','SairaC'],num:['italic 700','Kanit'],caps:1,edge:1,dot:1,winPlate:'ink',ls:.04,dark:1,
   lc:{GPT:'#b18cff',CLAUDE:'#ef8a55',KIMI:'#58b7ff',GROK:'#e4e0d6'}},
 C:{bg:'#fffdf8',panel:'#ffffff',rule:'#ece6d8',ink:BR.ink,mut:'#6f6a5e',up:'#08834a',dn:'#d4231b',disp:['','Lilita'],lab:['600','Fredoka'],num:['','Lilita'],caps:0,drop:1,winPlate:'show',ls:.01}};

TAKES.P={...TAKES.D,bg:'#000000',lab:['600','Inter'],num:['800','InterTight'],ls:.01,polish:1};

// line colours on white: the site's chart colours, darkened to read on paper; Grok in ink
const LC={GPT:'#7b4dff',CLAUDE:'#e0662a',KIMI:'#1e80ff',GROK:BR.ink};
let C,K,tl,img={},P2={};
const F=(k,size)=>{const f=K[k];return (f[0]?f[0]+' ':'')+size+'px "'+f[1]+'"'};
function rnd(seed){let s=seed>>>0;return()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0,((s^s>>>14)>>>0)/4294967296))}
const li=(k,src)=>new Promise(r=>{if(!src)return r();const i=new Image();i.onload=()=>{img[k]=i;r()};i.onerror=r;i.src=src});
function rr(c,X,Y,w,h,r){c.beginPath();c.roundRect(X,Y,w,h,r)}
function txt(c,s,X,Y,font,col,align='left',alpha=1,ls=0){if(alpha<=0)return;c.save();c.globalAlpha*=alpha;c.font=font;c.textAlign=align;c.textBaseline='alphabetic';c.letterSpacing=ls+'px';c.fillStyle=col;c.fillText(s,X,Y);c.restore()}

function fit(c,s,k,size,max,min=12){while(tw(c,s,F(k,size))>max&&size>min)size-=1;return size}
const up=s=>K.caps?s.toUpperCase():s;
// the take's display lettering: A printed ink, B the logo's green and red edges and its gold dot, C ink with a gold drop
function disp(c,s,X,Y,size,align='left',alpha=1,col,dot=0){if(alpha<=0)return 0;const f=F('disp',size),w=tw(c,s,f),x0=align==='center'?X-w/2:align==='right'?X-w:X;col=col||K.ink;

 if(K.edge){const o=Math.max(2,size*.05);c.fillStyle=BR.green;c.fillText(s,x0-o,Y);c.fillStyle=BR.red;c.fillText(s,x0+o,Y)}

 if(K.dot&&dot){const q=size*.2;c.fillStyle=BR.gold;c.fillRect(x0+w+size*.06,Y-q,q,q)}c.restore();return w+(K.dot&&dot?size*.3:0)}
// a model's mark on its own disc (the app icon), with a hairline where the disc is pale
function mark(c,m,cx,cy,r,alpha=1){const M=C.models[m],p=P2[m];c.save();c.globalAlpha*=alpha;c.beginPath();c.arc(cx,cy,r,0,7);c.fillStyle=M.bg;c.fill();
 if(M.bg!=='#000'){c.lineWidth=Math.max(1.5,r*.05);c.strokeStyle='rgba(4,7,14,.18)';c.stroke()}else if(K.dark){c.lineWidth=Math.max(1.5,r*.05);c.strokeStyle='rgba(248,240,217,.3)';c.stroke()}

function crown(c,cx,cy,s,col){c.save();c.translate(cx,cy);c.beginPath();c.moveTo(-s,s*.55);c.lineTo(-s,-s*.25);c.lineTo(-s*.5,s*.12);c.lineTo(0,-s*.6);c.lineTo(s*.5,s*.12);c.lineTo(s,-s*.25);c.lineTo(s,s*.55);c.closePath();c.fillStyle=col;c.fill();c.lineWidth=Math.max(2,s*.12);c.strokeStyle=BR.ink;c.lineJoin='round';c.stroke();c.restore()}
function logoTile(c,X,Y,s,alpha=1){if(!img.co)return;c.save();c.globalAlpha*=alpha;rr(c,X,Y,s,s,s*.2);c.fillStyle='#fff';c.fill();c.lineWidth=2;c.strokeStyle=K.rule;c.stroke();const i=img.co,ar=i.width/i.height,p=s*.14,iw=ar>1?s-2*p:(s-2*p)*ar,ih=ar>1?(s-2*p)/ar:s-2*p;c.drawImage(i,X+(s-iw)/2,Y+(s-ih)/2,iw,ih);c.restore()}

const money=v=>(v<0?'−':'+')+'$'+Math.abs(Math.round(v)).toLocaleString('en-US');

const side=c=>c.dir>0?'LONG':'SHORT';
// ---- the price path (as render-set): hours since the close before; the first hour at the fine step
function fine(){const b=C.bars[C.iRep];if(C.fine&&C.fine.length>1)return C.fine;const dn=b[4]<b[1];return[[b[0],b[1],dn?b[2]:b[3],dn?b[2]:b[3],dn?b[2]:b[3]],[b[0],dn?b[2]:b[3],dn?b[3]:b[2],dn?b[3]:b[2],dn?b[3]:b[2]],[b[0],b[4],b[4],b[4],b[4]]]}
let PTS;function pts(){const b=C.bars,ir=C.iRep,ip=C.iPrev??ir,Fn=fine(),n=Fn.length,o=[[0,C.prev]],xr0=ir-ip;for(let i=ip;i<ir;i++)o.push([i-ip+1,b[i][4]]);
 Fn.forEach((f,j)=>o.push([xr0+(j+1)/n,f[4]]));for(let i=ir+1;i<b.length;i++)o.push([i-ip+1,b[i][4]]);
 const gr=[];for(let i=Math.max(0,ip-24);i<ip;i++)gr.push([i-ip+1,b[i][4]]);return{pts:o,xr0,grey:gr,end:o[o.length-1][0]}}
function pAt(xx){const p=PTS.pts;if(xx<=0)return p[0][1];for(let i=1;i<p.length;i++)if(p[i][0]>=xx){const f=(xx-p[i-1][0])/(p[i][0]-p[i-1][0]);return lerp(p[i-1][1],p[i][1],f)}return p[p.length-1][1]}
function prep(){const mode=C.pnl||'flat';for(const c of C.calls){c.stake=mode==='size'?2e4*(+c.mag):1e5;c.key=mode==='flat'?String(c.dir):c.dir+'|'+c.mag;c.fin=pnl(c,PTS.end)}
 const best=Math.max(...C.calls.map(c=>c.fin));C.top=best>0?C.calls.filter(c=>c.fin>best-1).map(c=>c.m):[]}
function pnl(c,xx){if(xx<=0)return 0;return c.dir*c.stake*(pAt(xx)/C.prev-1)}
async function init(cfg){C=cfg;K=TAKES[C.take||'A'];K.take=C.take||'A';if(K.lc)Object.assign(LC,K.lc);
 for(const k in C.models)P2[k]={d:new Path2D(C.models[k].d),dot:C.models[k].dot?new Path2D(C.models[k].dot):null,fr:C.models[k].fr};
 await li('co',C.logo);await li('bg',C.bgUrl);await li('ez',C.ezLogo);for(const k of ['disp','lab','num'])await document.fonts.load(F(k,40));
 const k=C.calls.length,R0=1.75,RS=1.3,RV=1.15,r1=R0+k*RS,ch=[r1+.05,r1+1.2],boom=ch[1]+3;
 tl={hits:[.12,.62],title:[1.3,1.6],R0,RS,RV,roll:[R0,r1],chart:ch,cd:[ch[1],boom],boom,slow:[boom+.2,boom+3.2],rest:[boom+3.2,boom+5.8],close:[boom+5.8,boom+6.5],win:[boom+7,boom+9.4],tab:[boom+9.4,boom+9.9],T:boom+12.5};
 if(K.polish)tl.T+=1.5;tl.lands=C.calls.map((c,i)=>R0+i*RS+RV-.15);const nf=C.fine&&C.fine.length>1?C.fine.length:3;tl.ticks=[...Array(Math.min(nf,16))].map((_,j,a)=>tl.slow[0]+(j+1)*(tl.slow[1]-tl.slow[0])/a.length);

function clock(t){const np=PTS.end-PTS.xr0;if(t<tl.boom)return{xc:PTS.xr0,v:1};if(t<tl.rest[0]){const f=seg(t,tl.slow[0],tl.slow[1]);return{xc:PTS.xr0+f,v:1}}

const rk=k=>tl.R0+k*tl.RS;
function confetti(c,cx,cy,f,seed,n=120,r=520){const R=rnd(seed),cols=[BR.gold,BR.green,BR.red,K.dark?BR.cream:BR.ink];c.save();for(let i=0;i<n;i++){const a=R()*6.283,d=(30+R()*r)*ease(f*1.6),w=6+R()*10,h=4+R()*6;c.globalAlpha=Math.max(0,1-f*.9);c.fillStyle=cols[i%4];
 c.save();c.translate(cx+Math.cos(a)*d,cy+Math.sin(a)*d*.7+f*f*160);c.rotate(R()*6+f*6*(R()-.5));c.fillRect(-w/2,-h/2,w,h);c.restore()}c.restore()}
// ---- layout
const M0=56,TOPB=40,HDR=128,CH0=270,CH1=1000,RO=1040,FOOT=1300;
function frame(c){if(img.bg&&!K.mat){c.fillStyle=K.bg;c.fillRect(0,0,W,H);const i=img.bg,s=Math.max(W/i.width,H/i.height);c.drawImage(i,(W-i.width*s)/2,(H-i.height*s)/2,i.width*s,i.height*s);return}if(K.mat){c.fillStyle='#ffffff';c.fillRect(0,0,W,H);rr(c,22,22,W-44,H-44,34);c.fillStyle=K.bg;c.fill()}else{c.fillStyle=K.bg;c.fillRect(0,0,W,H)}if(K.bands){c.fillStyle=BR.green;c.fillRect(0,0,W,14);c.fillStyle=BR.red;c.fillRect(0,H-14,W,14)}}
function amb(c,t){if(!K.polish)return;const g=(X,Y,r,col)=>{const q=c.createRadialGradient(X,Y,0,X,Y,r);q.addColorStop(0,col);q.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=q;c.fillRect(0,0,W,H)};
 g(0,0,900,'rgba(3,200,112,.10)');g(W,H,900,'rgba(255,58,49,.09)');if(tl&&t>=tl.boom)g(W/2,H*.45,1100,(C.a>=0?'rgba(3,200,112,':'rgba(255,58,49,')+(.16*Math.exp(-(t-tl.boom)*.8)+.04)+')')}
function brandBar(c,a){if(a<=0)return;ezLogo(c,M0,TOPB-4,58,a);const s=K.caps?'PRESENTS':'presents';txt(c,s,M0+72,TOPB+38,F('lab',26),K.ink,'left',a,K.ls*26);

function footer(c){txt(c,'@earningszn',M0,FOOT+12,F('lab',24),K.mut,'left',1,K.ls*24);txt(c,'earningszn.xyz/r/'+C.n,W-M0,FOOT+12,F('lab',24),K.mut,'right',1,K.ls*24)}
function pill(c,st,t,a){const lv=st==='LIVE',f=F('lab',22),w=tw(c,st,f,K.ls*22)+(lv?54:36),X=W-M0-w,Y=TOPB+2;c.save();c.globalAlpha*=a;rr(c,X,Y,w,44,K.take==='A'?6:22);
 c.fillStyle=lv?BR.red:st==='CLOSED'?(K.dark?BR.cream:BR.ink):(K.dark?'rgba(0,0,0,0)':'#fff');c.fill();if(!lv&&st!=='CLOSED'){c.lineWidth=2;c.strokeStyle=K.ink;c.stroke()}
 if(lv){c.beginPath();c.arc(X+23,Y+22,6,0,7);c.fillStyle='rgba(255,255,255,'+(.55+.45*Math.sin(t*7))+')';c.fill()}c.restore();
 txt(c,st,X+(lv?38:18),Y+31,f,lv?'#fff':st==='CLOSED'?(K.dark?BR.ink:'#fff'):K.ink,'left',a,K.ls*22)}
function draw(t){const calls=C.calls,cx=W/2;x.setTransform(1,0,0,1,0,0);
 const sh=t>tl.boom?Math.max(0,1-(t-tl.boom)/.55)*(K.polish?5:9):0;if(K.polish){const z=1+.022*t/tl.T+(t>=tl.boom?.045*Math.exp(-(t-tl.boom)*3.5):0);x.translate(cx,H*.5);x.scale(z,z);x.translate(-cx,-H*.5)}frame(x);amb(x,t);x.translate(sh?Math.sin(t*90)*sh:0,sh?Math.cos(t*77)*sh*.8:0);
 const verdict=t>=tl.close[0],vv=verdict?ease(seg(t,tl.close[0],tl.close[1])):0,{xc,v}=clock(t),post=t>=tl.boom;
 // ---- 1. title card: EZ. presents, the round, then the company in the take's lettering
 if(t<tl.title[1]){const o=1-seg(t,tl.title[0],tl.title[1]);x.save();x.globalAlpha=o;
  const p1=t>=tl.hits[0]?ease(seg(t,tl.hits[0],tl.hits[0]+.3)):0,p2=t>=tl.hits[1]?ease(seg(t,tl.hits[1],tl.hits[1]+.3)):0;
  const ls=170,lx=cx-ls/2;ezLogo(x,lx,250,ls);const ps=K.caps?'PRESENTS':'presents';txt(x,ps,cx,486,F('lab',44),K.ink,'center',1,K.ls*44*2);
  if(K.bands){x.fillStyle=K.rule;x.fillRect(cx-210,530,420,3);x.fillRect(cx-210,538,420,1.5)}
  const rs=up('Round ')+C.n,fr=fit(x,rs,'disp',110,W*.7);x.save();x.translate(0,lerp(24,0,p1));disp(x,rs,cx,700,fr,'center',p1,K.take==='A'?K.mut:K.ink);x.restore();
  const cn=up(C.co),fc=fit(x,cn,'disp',210,W-2*M0-40,60);x.save();x.translate(cx,960);x.scale(lerp(1.25,1,p2),lerp(1.25,1,p2));

 // ---- header after the title card: the brand bar, the company, the state

  logoTile(x,M0,HDR,92,ho);const cn=up(C.co),fs=fit(x,cn,'disp',84,560,40);x.save();x.globalAlpha=ho;disp(x,cn,M0+112,HDR+78,fs,'left',1,null,1);x.restore();
  if(post){const pr=verdict?C.fin:pAt(xc),ch=100*(pr/C.prev-1),a=ease(seg(t,tl.boom,tl.boom+.4));txt(x,pct(ch),W-M0,HDR+66,F('num',64),ch>=0?K.up:K.dn,'right',a);txt(x,(verdict?'at the close':'live'),W-M0,HDR+98,F('lab',24),K.mut,'right',a,K.ls*24)}
  }
 // ---- 2. the chart: the stock trading into the report, then each AI's P&L on one chart

  const LW=250,px0=44,px1=W-36-LW,py0=CH0,py1=CH1,xr0=PTS.xr0,G=PTS.grey,gx0=G.length?G[0][0]:0;
  const fg=lerp(.3,.12,ease(seg(t,tl.slow[0],tl.slow[0]+.8))),fo=xr0>0?.1:0;
  const Xp=xx=>xx<=0?px0+(px1-px0)*fg*(gx0?(xx-gx0)/(-gx0):1):xx<=xr0?px0+(px1-px0)*(fg+fo*xx/xr0):px0+(px1-px0)*(fg+fo+(1-fg-fo)*(xx-xr0)/v);
  const gd=seg(t,tl.chart[0],tl.chart[1]),gEnd=lerp(gx0,0,gd);
  const vals=[0,2500,-2500];G.filter(p=>p[0]<=gEnd).forEach(p=>vals.push(100*(p[1]/C.prev-1)*1000));

  let hi=Math.max(...vals),lo=Math.min(...vals);const pd=(hi-lo)*.1;hi+=pd;lo-=pd;const Yp=d=>py1-(py1-py0)*(d-lo)/(hi-lo),z0=Yp(0);
  x.save();rr(x,16,py0-30,W-32,py1-py0+60,K.take==='A'?4:18);if(K0.dieg){x.shadowColor='rgba(40,190,230,.55)';x.shadowBlur=60}x.fillStyle=img.bg&&!K0.dark?'rgba(8,11,17,.62)':K.panel;x.fill();x.lineWidth=2;x.strokeStyle=K.rule;x.stroke();x.restore();
