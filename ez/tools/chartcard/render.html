<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1350"></canvas>
<script>
// v2, 4:5 for X (5 Nov 2026, from ez/x-chart-video-research.md):
// frame 0 is a complete still (the stock into the report, four calls on their lines, "Who called it?"),
// a 1.5 s countdown, the report lands, the price runs to the close while "closest now" moves between the AIs,
// graded at the close, then the result, the season standings and the next round. 15 s.
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=1080,H=1350;
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const MC={GPT:'#b18cff',CLAUDE:'#ef8a55',KIMI:'#58b7ff',GROK:'#e4e0d6'},NM={GPT:'GPT',CLAUDE:'Claude',KIMI:'Kimi',GROK:'Grok'};
const T={bg:'#0a0d13',grid:'#171d29',ax:'#6f7789',fg:'#f6efdc',mut:'#958f80',up:'#22d17a',dn:'#ff4a3f',gold:'#fdbc2a',panel:'#121823',edge:'#232c3c'};
const tl={still:[0,1.6],cd:[1.8,3.3],boom:3.3,post:[3.3,10.4],close:[10.4,11.3],end:[11.6,12.4],T:15};
let C,img={},P2={};
function load(k,src){return new Promise(r=>{if(!src)return r(0);const i=new Image();i.onload=()=>{img[k]=i;r(1)};i.onerror=()=>r(0);i.src=src})}
async function init(cfg){C=cfg;for(const k in C.models)P2[k]={d:new Path2D(C.models[k].d),dot:C.models[k].dot?new Path2D(C.models[k].dot):null,fr:C.models[k].fr};
 await load('co',C.logo);await load('ez',C.ezLogo);return 1}
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function mark(m,X,Y,s){x.save();rr(X,Y,s,s,s*.22);x.fillStyle='#000';x.fill();x.strokeStyle='rgba(255,255,255,.16)';x.lineWidth=2;x.stroke();
 x.translate(X+s*.16,Y+s*.16);x.scale(s*.68/24,s*.68/24);x.fillStyle=m==='CLAUDE'?'#d97757':'#fff';x.fill(P2[m].d,P2[m].fr||'nonzero');
 if(P2[m].dot){x.fillStyle=C.models[m].dotc||'#1e80ff';x.fill(P2[m].dot)}x.restore()}
function crown(cx,cy,s,col){x.save();x.translate(cx,cy);x.beginPath();x.moveTo(-s,s*.55);x.lineTo(-s,-s*.25);x.lineTo(-s*.5,s*.12);x.lineTo(0,-s*.6);x.lineTo(s*.5,s*.12);x.lineTo(s,-s*.25);x.lineTo(s,s*.55);x.closePath();x.fillStyle=col;x.fill();x.restore()}
function badge(cx,cy,r,ok){x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle=ok?T.up:T.dn;x.fill();x.strokeStyle='#05080d';x.lineWidth=r*.26;x.lineCap='round';x.beginPath();
 if(ok){x.moveTo(cx-r*.45,cy);x.lineTo(cx-r*.1,cy+r*.38);x.lineTo(cx+r*.5,cy-r*.38)}else{x.moveTo(cx-r*.38,cy-r*.38);x.lineTo(cx+r*.38,cy+r*.38);x.moveTo(cx+r*.38,cy-r*.38);x.lineTo(cx-r*.38,cy+r*.38)}x.stroke();x.restore()}
const money=v=>(v<0?'−':'+')+'$'+Math.abs(Math.round(v)).toLocaleString('en-US');
const kmoney=v=>Math.abs(v)>=10000?(v<0?'−':'+')+'$'+(Math.abs(v)/1000).toFixed(Math.abs(v)>=100000?0:1)+'K':money(v);
const pct=(v,d=2)=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d)+'%';
function nice(r){const p=Math.pow(10,Math.floor(Math.log10(r))),m=r/p;return (m<1.5?1:m<3?2:m<7?5:10)*p}
function fmtP(v){return v>=1000?v.toFixed(0):v>=100?v.toFixed(0):v.toFixed(1)}
function fit(txt,font,max){x.font=font;return x.measureText(txt).width<=max}
// price path: p = bars after the report revealed (fractional)
function postP(t){if(t<tl.boom)return 0;const s=seg(t,tl.post[0],tl.post[1]);return (C.bars.length-C.iRep)*(1-Math.pow(1-s,1.5))}
function priceAt(t){const p=postP(t),ir=C.iRep,b=C.bars;if(p<=0)return C.prev;const i=Math.min(b.length-1,ir+Math.floor(p-1e-9)),f=p-Math.floor(p-1e-9);const bar=b[i];return f>=1?bar[4]:bar[1]+(bar[4]-bar[1])*f}
function leaderAt(t){const pr=t>=tl.close[0]?C.fin:priceAt(t);let best=null,d=1e9;for(const c of C.calls){const e=Math.abs(pr-c.lv);if(e<d){d=e;best=c.m}}return best}
function draw(t){
 const bars=C.bars,ir=C.iRep,n=bars.length,prev=C.prev,fin=C.fin,np=n-ir;
 const sk=t>tl.boom?Math.max(0,1-(t-tl.boom)/.45):0;
 x.setTransform(1,0,0,1,0,0);x.fillStyle=T.bg;x.fillRect(0,0,W,H);x.translate(sk?Math.sin(t*90)*10*sk:0,sk?Math.cos(t*77)*8*sk:0);
 // ---- header
 const s0=104;if(img.co){x.save();rr(48,48,s0,s0,22);x.fillStyle='#fff';x.fill();x.clip();const r=Math.min((s0-18)/img.co.width,(s0-18)/img.co.height);
  x.drawImage(img.co,48+(s0-img.co.width*r)/2,48+(s0-img.co.height*r)/2,img.co.width*r,img.co.height*r);x.restore()}
 x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle=T.fg;let tf=100;while(!fit(C.title,'900 '+tf+'px "Inter Display"',500)&&tf>56)tf-=4;x.font='900 '+tf+'px "Inter Display"';x.fillText(C.title,176,128);
 x.fillStyle=T.mut;x.font='600 36px "Inter"';x.fillText(C.sub,178,182);
 // status pill + big move
 const live=t>=tl.boom&&t<tl.close[0],st=t<tl.cd[0]?'CALLS LOCKED':t<tl.boom?'EARNINGS IN':live?'LIVE':'AT THE CLOSE';
 x.font='800 34px "Inter"';const sw=x.measureText(st).width+(live?74:48);rr(W-48-sw,52,sw,64,32);x.fillStyle=live?T.dn:T.panel;x.fill();
 if(!live){x.strokeStyle=T.edge;x.lineWidth=2;x.stroke()}
 if(live){x.beginPath();x.arc(W-48-sw+30,84,9,0,7);x.fillStyle=(Math.floor(t*3)%2)?'#fff':'#ffc7c2';x.fill()}
 x.fillStyle=T.fg;x.textAlign='center';x.textBaseline='middle';x.fillText(st,W-48-sw/2+(live?16:0),85);
 if(t>=tl.boom){const mv=t>=tl.close[0]?C.a:100*(priceAt(t)/prev-1);x.textAlign='right';x.textBaseline='alphabetic';x.font='600 36px "Inter"';const se=178+x.measureText(C.sub).width+36;let fs=110;while(fs>60&&!fit(pct(mv),'900 '+fs+'px "Inter Display"',W-48-se))fs-=4;x.fillStyle=mv>=0?T.up:T.dn;x.font='900 '+fs+'px "Inter Display"';x.fillText(pct(mv),W-48,236)}
 // ---- chart geometry: the time before the report squeezed left, the reaction gets room
 const L=48,R=690,TOP=300,BOT=990,preW=(R-L)*.5,xr=L+preW,postW=R-xr;
 const lv=C.calls.map(c=>c.lv),lo0=Math.min(...bars.map(b=>b[3]),...lv,fin),hi0=Math.max(...bars.map(b=>b[2]),...lv,fin),pad=(hi0-lo0)*.06,lo=lo0-pad,hi=hi0+pad;
 const Y=v=>BOT-(BOT-TOP)*(v-lo)/(hi-lo),bwA=preW/ir,bwB=postW/np,X=i=>i<ir?L+bwA*(i+.5):xr+bwB*(i-ir+.5);
 x.font='600 28px "JetBrains Mono"';x.textBaseline='bottom';x.textAlign='left';const step=nice((hi-lo)/4);
 for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){x.strokeStyle=T.grid;x.lineWidth=2;x.beginPath();x.moveTo(L,Y(v));x.lineTo(R,Y(v));x.stroke();x.fillStyle=T.ax;x.fillText(fmtP(v),L+4,Y(v)-6)}
 // report marker + the close before it
 x.save();x.strokeStyle=T.ax;x.setLineDash([4,8]);x.lineWidth=2;x.beginPath();x.moveTo(xr,TOP-6);x.lineTo(xr,BOT);x.stroke();x.restore();
 x.fillStyle=T.mut;x.font='700 26px "Inter"';x.textAlign='center';x.textBaseline='alphabetic';x.fillText('REPORT',xr,TOP-18);
 x.save();x.strokeStyle='rgba(246,239,220,.35)';x.setLineDash([3,7]);x.lineWidth=2;x.beginPath();x.moveTo(L,Y(prev));x.lineTo(R,Y(prev));x.stroke();x.restore();
 // target lines
 const verdict=t>=tl.close[0],vv=verdict?ease(seg(t,tl.close[0],tl.close[1])):0,lead=t>=tl.boom?leaderAt(t):null;
 for(const c of C.calls){const win=C.win.includes(c.m),yy=Y(c.lv);x.save();x.strokeStyle=verdict&&win?T.gold:MC[c.m];x.lineWidth=verdict&&win?6:(lead===c.m?5:3.5);
  x.globalAlpha=verdict&&!win?1-.6*vv:1;x.setLineDash([16,10]);x.beginPath();x.moveTo(xr,yy);x.lineTo(R,yy);x.stroke();x.restore()}
 // candles (style A) or line (style B), with the live bar growing
 const p=postP(t),full=ir+Math.floor(p),cur=ir+Math.floor(p),f=p-Math.floor(p);
 const show=[];for(let i=0;i<ir;i++)show.push(bars[i]);for(let i=ir;i<Math.min(n,full);i++)show.push(bars[i]);
 if(f>0&&cur<n){const b=bars[cur],c4=b[1]+(b[4]-b[1])*f;show.push([b[0],b[1],Math.max(b[1],c4)+(b[2]-Math.max(b[1],b[4]))*f,Math.min(b[1],c4)-(Math.min(b[1],b[4])-b[3])*f,c4])}
 if(C.style==='A'){show.forEach((b,i)=>{const up=b[4]>=b[1],cx=X(i),bw=i<ir?bwA:bwB;x.strokeStyle=x.fillStyle=up?T.up:T.dn;x.lineWidth=Math.max(2,bw*.14);
   x.beginPath();x.moveTo(cx,Y(b[2]));x.lineTo(cx,Y(b[3]));x.stroke();const y1=Y(Math.max(b[1],b[4])),y2=Y(Math.min(b[1],b[4]));x.fillRect(cx-bw*.36,y1,bw*.72,Math.max(3,y2-y1))})}
 else{const pts=show.map((b,i)=>[X(i),Y(b[4])]),last=show[show.length-1][4],col=last>=prev?T.up:T.dn,gr=x.createLinearGradient(0,TOP,0,BOT);gr.addColorStop(0,col+'55');gr.addColorStop(1,col+'00');
   x.beginPath();x.moveTo(pts[0][0],BOT);pts.forEach(q=>x.lineTo(q[0],q[1]));x.lineTo(pts[pts.length-1][0],BOT);x.closePath();x.fillStyle=gr;x.fill();
   x.beginPath();pts.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.strokeStyle=col;x.lineWidth=5;x.lineJoin='round';x.stroke();
   const q=pts[pts.length-1];x.beginPath();x.arc(q[0],q[1],10,0,7);x.fillStyle=col;x.fill()}
 // ---- chips on the right, at their lines (spread so they never touch)
 const CH=74,GAP=10,cx0=R+14,cw=W-48-cx0;const ch=C.calls.map(c=>({...c,y:Y(c.lv),ly:Y(c.lv)})).sort((a,b)=>a.y-b.y);
 for(let k=1;k<ch.length;k++)if(ch[k].y-ch[k-1].y<CH+GAP)ch[k].y=ch[k-1].y+CH+GAP;const ov=ch[ch.length-1].y-(BOT-CH/2);if(ov>0)ch.forEach(c=>c.y-=ov);
 if(ch[0].y<TOP+CH/2-40){const d=TOP+CH/2-40-ch[0].y;ch.forEach(c=>c.y+=d)}
 const lPrev=leaderAt(t-.3);
 for(const c of ch){const win=C.win.includes(c.m),isL=!verdict&&lead===c.m,pop=isL&&lPrev!==c.m?1.06:1;
  x.save();x.globalAlpha=verdict&&!win?1-.55*vv:1;
  x.strokeStyle=verdict&&win?T.gold:MC[c.m];x.lineWidth=3;x.beginPath();x.moveTo(R,c.ly);x.lineTo(cx0,c.y);x.stroke();
  x.translate(cx0+cw/2,c.y);x.scale(pop,pop);x.translate(-(cx0+cw/2),-c.y);
  rr(cx0,c.y-CH/2,cw,CH,14);x.fillStyle=(verdict&&win)||isL?'#1d1a10':T.panel;x.fill();x.lineWidth=(verdict&&win)||isL?5:3;x.strokeStyle=(verdict&&win)||isL?T.gold:MC[c.m];x.stroke();
  mark(c.m,cx0+10,c.y-27,54);x.fillStyle=T.fg;x.textAlign='left';x.textBaseline='middle';x.font='800 36px "Inter"';x.fillText(NM[c.m],cx0+76,c.y+2);
  x.textAlign='right';x.font='700 36px "JetBrains Mono"';x.fillStyle=c.dir>0?T.up:T.dn;x.fillText((c.dir>0?'▲':'▼')+c.mag+'%',cx0+cw-14,c.y+2);
  if(verdict&&vv>.2){x.globalAlpha=ease((vv-.2)/.8);badge(cx0+cw-6,c.y-CH/2+4,17,(c.dir>0)===(C.a>0))}
  if(verdict&&win)crown(cx0+40,c.y-CH/2-8,18*vv,T.gold);
  x.restore()}
 // ---- caption under the chart (one line, big)
 x.textBaseline='alphabetic';x.textAlign='left';
 if(t<tl.boom){x.fillStyle=T.fg;x.font='900 76px "Inter Display"';x.fillText('Who called it?',48,1110);x.fillStyle=T.mut;x.font='600 34px "Inter"';x.fillText('Calls locked before the report.',50,1164)}
 else if(!verdict){const m=lead,c=C.calls.find(q=>q.m===m),pr=priceAt(t),off=Math.abs(100*(pr/prev-1)-c.dir*c.mag);x.fillStyle=T.mut;x.font='700 30px "Inter"';x.fillText('CLOSEST RIGHT NOW',50,1072);
  mark(m,48,1094,72);x.fillStyle=T.gold;x.font='900 76px "Inter Display"';const nw=x.measureText(NM[m]).width;x.fillText(NM[m],136,1157);x.font='700 40px "JetBrains Mono"';x.fillStyle=T.mut;x.fillText(off.toFixed(2)+'% off',136+nw+24,1153)}
 // footer
 if(img.ez){x.drawImage(img.ez,48,1250,56,56)}x.fillStyle=T.mut;x.font='700 30px "Inter"';x.textAlign='left';x.textBaseline='middle';x.fillText('@earningszn',116,1279);
 x.textAlign='right';x.fillText('earningszn.xyz/r/'+C.n,W-48,1279);
 // ---- countdown
 if(t>=tl.cd[0]&&t<tl.boom){const k=Math.floor((t-tl.cd[0])/.5),f2=((t-tl.cd[0])%.5)/.5;x.save();x.fillStyle='rgba(5,8,13,.6)';x.fillRect(0,250,W,800);x.textAlign='center';x.textBaseline='middle';
  x.fillStyle=T.mut;x.font='800 44px "Inter"';x.fillText('EARNINGS IN',W/2,470);x.globalAlpha=1-f2*.5;x.fillStyle=T.fg;x.font='900 '+(330-80*f2)+'px "Inter Display"';x.fillText(3-k,W/2,690);x.restore()}
 // ---- boom
 if(t>=tl.boom&&t<tl.boom+1){const f3=(t-tl.boom);x.save();x.fillStyle='rgba(255,255,255,'+Math.max(0,.55-f3*1.8)+')';x.fillRect(-20,-20,W+40,H+40);
  x.globalAlpha=Math.max(0,1-f3*1.2);x.translate(W/2,640);x.rotate(-.06);x.scale(1+.22*(1-f3),1+.22*(1-f3));x.textAlign='center';x.textBaseline='middle';x.font='900 150px "Inter Display"';
  x.lineWidth=18;x.strokeStyle='#05080d';x.strokeText('EARNINGS',0,0);x.fillStyle=T.gold;x.fillText('EARNINGS',0,0);x.restore()}
 // ---- verdict line under the chart
 if(verdict&&t<tl.end[0]+.3){x.save();x.globalAlpha=ease(seg(t,tl.close[0],tl.close[1]));x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle=T.gold;x.font='900 80px "Inter Display"';
  x.fillText(C.winLine,48,1140);x.fillStyle=T.mut;x.font='600 34px "Inter"';x.fillText(C.winSub,50,1192);x.restore()}
 // ---- end card: result, every AI, the season, next round
 if(t>=tl.end[0]){const g=ease(seg(t,tl.end[0],tl.end[1])),top=560+(1-g)*700;x.save();rr(28,top,W-56,H-top-110,26);x.fillStyle='#0f141d';x.fill();x.strokeStyle=T.edge;x.lineWidth=2;x.stroke();
  x.beginPath();x.rect(28,top,W-56,H-top-110);x.clip();let y=top+96;x.textAlign='left';x.textBaseline='alphabetic';
  if(C.win.length)crown(84,y-46,26,T.gold);x.fillStyle=T.gold;x.font='900 84px "Inter Display"';x.fillText(C.winLine,C.win.length?124:64,y);
  x.fillStyle=T.mut;x.font='600 32px "Inter"';x.fillText(C.winSub,66,y+50);
  y+=120;x.font='700 24px "Inter"';x.fillStyle=T.ax;x.textAlign='right';x.fillText('THIS ROUND',760,y);x.fillText('SEASON',W-64,y);
  C.rows.forEach((rw,k)=>{const yy=y+30+k*82,ok=(rw.dir>0)===(C.a>0);mark(rw.m,64,yy,58);x.textAlign='left';x.fillStyle=C.win.includes(rw.m)?T.gold:T.fg;x.font='800 38px "Inter"';x.fillText(NM[rw.m],140,yy+42);
   badge(380,yy+29,19,ok);x.textAlign='right';x.font='700 38px "JetBrains Mono"';x.fillStyle=rw.pl>=0?T.up:T.dn;x.fillText(kmoney(rw.pl),760,yy+42);
   x.fillStyle=rw.season>=0?T.up:T.dn;x.fillText(kmoney(rw.season),W-64-(rw.mv?54:0),yy+42);
   if(rw.mv){x.fillStyle=rw.mv>0?T.up:T.dn;x.font='800 28px "Inter"';x.fillText(rw.mv>0?'▲'+rw.mv:'▼'+(-rw.mv),W-64,yy+40)}});
  x.restore();
  x.save();x.globalAlpha=g;x.textAlign='center';x.textBaseline='middle';x.fillStyle=T.fg;x.font='800 40px "Inter"';x.fillText(C.next,W/2,1205);x.restore()}
}
</script></body></html>
