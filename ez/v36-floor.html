<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EZ The Floor</title>
<meta name="description" content="Earnings Zeason: four AIs call earnings moves, the market grades them. Walk the floor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d10;--floor:#101318;--room:#14181e;--screen:#05070a;
  --ink:#eee8dc;--ink2:#a6a196;--ink3:#6f6c65;
  --line:rgba(238,232,220,.16);--line2:rgba(238,232,220,.32);--wall:rgba(222,214,198,.62);
  --grid:rgba(238,232,220,.045);
  --gold:#f2c040;--green:#43d17c;--red:#ff5c4f;--hi:#f2c040;
  --fb:"Archivo","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --gut:16px;--ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--fb);overflow-x:hidden;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--fm)}
.up{color:var(--green)}.dn{color:var(--red)}.au{color:var(--gold)}
.mute{color:var(--ink2)}
.wide{font-stretch:125%}
.cond{font-stretch:75%}

/* logos */
.lg{display:inline-grid;place-items:center;width:1em;height:1em;border-radius:.24em;vertical-align:middle;overflow:hidden;flex:none}
.lg svg{width:62%;height:62%;display:block}
.co-mark{--s:36px;display:inline-flex;align-items:center;justify-content:center;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.22);
  background:#f3efe6;color:#111;font:800 calc(var(--s)*.24)/1 var(--fm);overflow:hidden;vertical-align:middle;flex:none}
.co-mark.dk{background:#181b20}
.co-mark img{width:78%;height:78%;object-fit:contain;display:block}

/* the $EZ mark */
.ez{display:inline-flex;align-items:center;justify-content:center;gap:.02em;background:#000;border:1px solid rgba(255,255,255,.14);border-radius:.22em;
  padding:.08em .22em;font:900 1em/1 var(--fb);font-stretch:110%;letter-spacing:-.02em;text-decoration:none}
.ez .d{color:var(--gold)}.ez .e{color:var(--green)}.ez .z{color:var(--red)}

/* ---------- the persistent bar ---------- */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px var(--gut);min-height:60px;
  background:rgba(11,13,16,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .home{font-size:22px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:8px}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font:600 12px/1.2 var(--fm);text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);overflow:hidden;white-space:nowrap}
.crumbs a{text-decoration:none;color:var(--ink2);padding:12px 2px}
.crumbs a:hover{color:var(--ink)}
.crumbs b{color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.crumbs i{font-style:normal;color:var(--ink3)}
.crumbs .ttl{display:flex;flex-direction:column;gap:2px;text-transform:none;letter-spacing:0}
.crumbs .ttl b{font:800 15px/1.1 var(--fb);font-stretch:118%;letter-spacing:.01em}
.crumbs .ttl span{font:500 11px/1.2 var(--fm);color:var(--ink2)}
.minimap{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px 6px 4px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--floor);cursor:pointer}
.minimap span{font:700 11px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.minimap svg{display:block;width:30px;height:38px}
.mm-r{fill:none;stroke:rgba(238,232,220,.35);stroke-width:1}
.mm-r.on{fill:var(--gold);stroke:var(--gold)}
.mm-you{fill:var(--gold)}

/* ---------- views ---------- */
.view{min-height:calc(100vh - 60px)}
.view[hidden]{display:none}
#placeView{background:var(--bg)}

/* ---------- the floor (home) ---------- */
.lobby{padding:18px var(--gut) 6px;display:grid;gap:14px}
.lobby h1{margin:0;font:800 clamp(27px,7.4vw,58px)/1.02 var(--fb);font-stretch:112%;letter-spacing:-.015em;text-wrap:balance}
.lobby h1 em{font-style:normal;color:var(--gold)}
.lobby .line{margin:0;color:var(--ink2);max-width:58ch;font-size:15px}
.lobby .line b{color:var(--ink);font-weight:600}

.slip{position:relative;background:#f4e7a8;color:#1e1b12;border-radius:3px;padding:12px 14px 12px 16px;box-shadow:0 10px 24px rgba(0,0,0,.45);transform:rotate(-.7deg);max-width:520px}
.slip::before{content:"";position:absolute;top:-7px;left:50%;width:54px;height:14px;margin-left:-27px;background:rgba(255,255,255,.4);transform:rotate(2deg)}
.slip h2{margin:0 0 4px;font:800 12px/1.2 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:#7b2e18}
.slip p{margin:0;font-size:14.5px;line-height:1.4}
.slip p+p{margin-top:4px}
.slip a{color:#1e1b12;font-weight:700}

.building{margin:10px var(--gut) 0;position:relative;border:6px double var(--wall);border-bottom-width:6px;
  background-color:var(--floor);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;
  padding:14px}
.plan{display:grid;gap:14px;grid-template-columns:1fr 1fr;
  grid-template-areas:"board board" "pit pit" "arch arch" "score test" "coming rules" "vault vault" "door door"}
.entrance{position:relative;height:66px;margin:0 var(--gut) 8px;display:flex;justify-content:center}
.entrance .gap{position:absolute;top:-6px;left:50%;width:96px;margin-left:-48px;height:6px;background:var(--bg)}
.entrance .you{position:relative;margin-top:12px;display:flex;align-items:center;gap:8px;font:700 11px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.entrance .you i{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(242,192,64,.7);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(242,192,64,.6)}80%,100%{box-shadow:0 0 0 14px rgba(242,192,64,0)}}

.room{position:relative;border:5px double var(--wall);background:var(--room);min-width:0;display:flex;flex-direction:column;text-decoration:none;color:inherit;
  transition:background .2s,border-color .2s,transform .25s var(--ease)}
a.room:hover,.room .rhead:hover{background:#1a1f27}
a.room:hover{border-color:var(--gold)}
.room .tag{display:flex;align-items:center;gap:8px;padding:9px 10px 0;font:700 10.5px/1.2 var(--fm);letter-spacing:.11em;text-transform:uppercase;color:var(--ink2)}
.room .tag .no{color:var(--gold)}
.room .tag .new{margin-left:auto;background:var(--gold);color:#111;border-radius:99px;padding:3px 7px;letter-spacing:.06em}
.room h3{margin:2px 10px 0;font:800 19px/1.1 var(--fb);font-stretch:118%;letter-spacing:-.005em}
.room .go{margin-top:auto;min-height:44px;padding:8px 10px 10px;font:600 13px/1.2 var(--fb);color:var(--gold);display:flex;align-items:center;gap:6px}
.door{position:absolute;width:30px;height:6px;background:var(--room);pointer-events:none}
.door::after{content:"";position:absolute;width:30px;height:30px;border-left:1.5px solid var(--wall);border-top:1px dashed var(--line2);border-right:1px dashed var(--line2);border-top-right-radius:100%}
.door.b{bottom:-5px;right:16px}.door.b::after{bottom:6px;left:0}
.door.t{top:-5px;right:16px}.door.t::after{top:6px;left:0;transform:scaleY(-1)}

/* the big board on the floor */
.r-board{grid-area:board;background:var(--screen);border-color:var(--wall)}
.r-board .scr{margin:8px 10px 0;padding:12px;border-radius:6px;background:#020304;border:1px solid #1c222b;
  background-image:radial-gradient(rgba(242,192,64,.07) 1px,transparent 1.2px);background-size:5px 5px}
.r-board .live{display:inline-flex;align-items:center;gap:7px;font:800 11px/1 var(--fm);letter-spacing:.14em;color:var(--red)}
.r-board .live i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.r-board .co{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.r-board .co b{font:800 24px/1.05 var(--fb);font-stretch:112%}
.r-board .co span{display:block;font:500 12px/1.3 var(--fm);color:var(--ink2)}
.calls4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 0}
.calls4 div{border:1px solid #1d232c;border-radius:6px;padding:8px 4px 7px;text-align:center;background:#06090c}
.calls4 .lg{font-size:24px}
.calls4 b{display:block;margin-top:5px;font:800 15px/1 var(--fm)}
.calls4 small{display:block;margin-top:4px;font:500 10px/1 var(--fm);color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.clock{display:flex;align-items:baseline;gap:10px;margin-top:12px;flex-wrap:wrap}
.clock b{font:800 34px/1 var(--fm);color:var(--gold);letter-spacing:-.02em;text-shadow:0 0 18px rgba(242,192,64,.35)}
.clock span{font:500 12.5px/1.3 var(--fm);color:var(--ink2)}

/* desks */
.r-pit{grid-area:pit;display:grid;grid-template-columns:1fr 1fr;gap:12px 12px;padding:30px 0 6px;position:relative}
.r-pit::before{content:"The pit · four desks";position:absolute;top:4px;left:0;font:700 10.5px/1.2 var(--fm);letter-spacing:.11em;text-transform:uppercase;color:var(--ink2)}
.desk{--c:var(--ink);position:relative;display:block;text-decoration:none;color:inherit;padding-bottom:28px;min-width:0}
.desk .top{position:relative;border:2px solid var(--wall);border-radius:4px;background:var(--room);padding:8px;transition:border-color .2s,transform .25s var(--ease)}
.desk:hover .top{border-color:var(--c)}
.desk .mon{border-radius:4px;background:var(--screen);border:1px solid #20262f;padding:9px 8px;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 22px -6px var(--c)}
.desk .mon .row1{display:flex;align-items:center;gap:8px}
.desk .mon .lg{font-size:30px}
.desk .mon .nm{font:800 17px/1 var(--fb);font-stretch:115%}
.desk .mon .vr{display:block;font:500 10.5px/1.2 var(--fm);color:var(--ink2);margin-top:3px}
.desk .rk{margin-left:auto;font:800 22px/1 var(--fm);color:var(--c)}
.desk dl{display:grid;grid-template-columns:minmax(0,auto) 1fr;gap:3px 8px;margin:9px 0 0;font:500 12px/1.25 var(--fm)}
.desk dt{color:var(--ink2)}
.desk dd{margin:0;text-align:right;font-weight:700;white-space:nowrap}
.desk dt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desk .chair{position:absolute;bottom:2px;left:50%;width:30px;height:22px;margin-left:-15px;border:2px solid var(--wall);border-top:none;border-radius:0 0 16px 16px;opacity:.75}
.desk .lamp{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.form{display:inline-flex;gap:3px;vertical-align:middle}
.form i{width:10px;height:10px;border-radius:2px;display:inline-block}
.form .w{background:var(--gold)}.form .g{background:var(--green)}.form .r{background:var(--red)}.form .n{background:transparent;border:1px solid var(--ink3)}

/* archive room */
.r-arch{grid-area:arch}
.r-arch .rhead{display:block;text-decoration:none;color:inherit;min-height:44px}
.drawers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px}
.drawer{min-height:48px;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:5px 7px;border:1px solid var(--line2);border-left:4px solid var(--ink3);border-radius:3px;
  background:linear-gradient(#1b2028,#161a21);text-decoration:none;color:inherit;font:600 11px/1.1 var(--fm);min-width:0}
.drawer:hover{border-color:var(--gold)}
.drawer b{font-size:12px}
.drawer span{display:flex;align-items:center;gap:4px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.drawer .lg{font-size:14px}
.drawer.nw{border-left-color:var(--red)}
.drawer.hw{border-left-color:var(--gold)}
.drawer.fresh{box-shadow:0 0 0 2px var(--gold)}
/* scoreboard etc */
.r-score{grid-area:score}.r-test{grid-area:test}.r-coming{grid-area:coming}.r-rules{grid-area:rules}.r-vault{grid-area:vault}.r-door{grid-area:door}
.mini{padding:8px 10px 0;font:500 12px/1.35 var(--fm)}
.mini li{display:flex;align-items:center;gap:6px;padding:2px 0}
.mini ol,.mini ul{list-style:none;margin:0;padding:0}
.mini .lg{font-size:15px}
.mini b{margin-left:auto}
.recmini{display:none;padding:12px 10px 0;margin-top:10px;border-top:1px dashed var(--line2)}
.recmini p{margin:0 0 8px;font:500 11.5px/1.35 var(--fm);color:var(--ink2)}
.recmini p b{display:block;color:var(--gold);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.spark{display:block;width:100%;height:56px;margin:8px 0 0;padding:0 10px}
.dial{display:flex;align-items:center;gap:14px;padding:10px}
.dial svg{width:92px;height:92px;flex:none}
.dial p{margin:0;font:500 12.5px/1.4 var(--fm);color:var(--ink2)}
.dial p b{color:var(--ink);font-size:22px;display:block;font-family:var(--fm)}
.r-door{background:linear-gradient(90deg,var(--room),#0f1a13)}
.exit{display:inline-block;margin:10px 10px 0;padding:5px 10px;border-radius:3px;background:#0d6b33;color:#eafff0;font:900 14px/1 var(--fb);font-stretch:125%;letter-spacing:.14em;box-shadow:0 0 18px rgba(67,209,124,.45)}
.r-door .ez{font-size:26px;margin:10px 10px 0}

/* ---------- places ---------- */
.place{padding:0 var(--gut) 40px;max-width:1180px;margin:0 auto}
.plaque{display:flex;align-items:flex-end;gap:14px;padding:26px 0 18px;border-bottom:5px double var(--wall);margin-bottom:22px;flex-wrap:wrap}
.plaque .no{font:800 13px/1 var(--fm);color:#111;background:var(--gold);padding:7px 9px;border-radius:3px;letter-spacing:.06em;align-self:flex-start}
.plaque .tx{flex:1;min-width:220px}
.plaque .kick{font:700 11.5px/1.3 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.plaque h1{margin:6px 0 0;font:800 clamp(30px,8vw,60px)/1 var(--fb);font-stretch:115%;letter-spacing:-.02em;outline:none;text-wrap:balance}
.plaque .sub{margin:10px 0 0;color:var(--ink2);max-width:62ch;font-size:15.5px}
.sec{margin:34px 0 0}
.sec>h2{margin:0 0 12px;font:800 22px/1.15 var(--fb);font-stretch:112%;letter-spacing:-.005em}
.sec>h2 small{display:block;font:700 11px/1.3 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.sec>p{margin:0 0 12px;color:var(--ink2);max-width:64ch}
.note{font:500 12.5px/1.5 var(--fm);color:var(--ink2);margin:10px 0 0;max-width:72ch}
.panel{border:1px solid var(--line2);border-radius:8px;background:var(--room);padding:14px}
.screen{border:1px solid #1d232c;border-radius:8px;background:var(--screen);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:8px;border:1px solid var(--line2);background:var(--floor);
  color:var(--ink);text-decoration:none;font:700 15px/1.1 var(--fb);cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);color:#121212;border-color:var(--gold)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed;border-style:dashed}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{text-decoration:none;min-height:44px;padding:8px 13px;border-radius:99px;border:1px solid var(--line2);background:var(--floor);cursor:pointer;font:600 13.5px/1 var(--fb);display:inline-flex;align-items:center;gap:7px}
.chip .lg{font-size:18px}
.chip[aria-pressed=true]{background:var(--ink);color:#111;border-color:var(--ink)}
.grid2{display:grid;gap:14px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:800 28px/1.05 var(--fm);letter-spacing:-.02em}
.stat span{font:500 12px/1.35 var(--fm);color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 14px}

/* number line instrument */
.strip{position:relative;height:var(--h,150px);margin:6px 4px 0}
.strip .axis{position:absolute;left:0;right:0;bottom:30px;height:2px;background:var(--line2)}
.strip .zero{position:absolute;bottom:22px;width:1px;height:calc(100% - 26px);background:var(--ink3)}
.strip .zero::after{content:"0";position:absolute;bottom:-18px;left:-4px;font:600 11px/1 var(--fm);color:var(--ink2)}
.strip .tick{position:absolute;bottom:4px;transform:translateX(-50%);font:500 10.5px/1 var(--fm);color:var(--ink3)}
.strip .mk{position:absolute;bottom:32px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.strip .mk .lg{font-size:24px;box-shadow:0 0 0 2px var(--screen)}
.strip .mk b{font:800 11.5px/1 var(--fm);background:var(--screen);padding:1px 3px;border-radius:3px;white-space:nowrap}
.strip .mk .stem{width:1px;background:var(--line2)}
.strip .mk.you .dot{width:22px;height:22px;border-radius:50%;background:var(--gold);color:#111;display:grid;place-items:center;font:900 10px/1 var(--fb)}
.strip .real{position:absolute;bottom:22px;top:0;width:3px;margin-left:-1.5px;background:var(--ink);box-shadow:0 0 12px rgba(238,232,220,.5)}
.strip .real span{position:absolute;top:0;left:7px;white-space:nowrap;font:800 12px/1 var(--fm);background:var(--ink);color:#111;padding:3px 5px;border-radius:3px}
.strip .real.l span{left:auto;right:7px}

/* live board place */
.board{position:relative;border:5px double var(--wall);border-radius:6px;background:#020304;padding:16px;
  background-image:radial-gradient(rgba(242,192,64,.06) 1px,transparent 1.2px);background-size:5px 5px}
.board .head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.board .head .co-mark{--s:52px}
.board .head h2{margin:0;font:800 30px/1 var(--fb);font-stretch:112%}
.board .head p{margin:4px 0 0;font:500 12.5px/1.3 var(--fm);color:var(--ink2)}
.callrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.callrow a{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #1d232c;border-radius:6px;background:#06090c;text-decoration:none;min-height:56px}
.callrow a:hover{border-color:var(--gold)}
.callrow .lg{font-size:30px}
.callrow b{font:800 20px/1 var(--fm)}
.callrow small{display:block;font:500 11px/1.2 var(--fm);color:var(--ink2)}
.mycall{margin-top:14px}
.mycall .dir{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mycall .dir button{min-height:56px;border-radius:8px;border:2px solid var(--line2);background:var(--floor);font:800 18px/1 var(--fb);font-stretch:112%;cursor:pointer}
.mycall .dir button[aria-pressed=true].u{background:var(--green);border-color:var(--green);color:#06210f}
.mycall .dir button[aria-pressed=true].d{background:var(--red);border-color:var(--red);color:#2a0805}
.size{display:flex;align-items:center;gap:10px;margin-top:12px}
.size button{width:48px;height:48px;border-radius:8px;border:1px solid var(--line2);background:var(--floor);font:800 22px/1 var(--fm);cursor:pointer;flex:none}
.size input{flex:1;min-width:0;accent-color:var(--gold);height:44px}
.size output{font:800 22px/1 var(--fm);min-width:86px;text-align:right}
.saved{margin-top:10px;font:600 13px/1.4 var(--fm);color:var(--gold)}

/* rounds */
.ledger{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--ink3);border-radius:6px;background:var(--room);text-decoration:none;min-height:56px}
.lrow:hover{border-color:var(--gold)}
.lrow.nw{border-left-color:var(--red)}.lrow.hw{border-left-color:var(--gold)}
.lrow .n{font:800 13px/1 var(--fm);color:var(--ink2);width:36px}
.lrow .c{display:flex;align-items:center;gap:9px;min-width:0}

/* hit rate after each round, one line per AI */
function hitChart(el,sel){var W=Math.max(280,el.clientWidth||600),H=W<520?230:280,pl=34,pr=W<520?96:120,pt=12,pb=26,N=R.length;
  function X(i){return pl+(W-pl-pr)*(i)/(N-1||1)}function Y(p){return pt+(H-pt-pb)*(1-p/100)}
  var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Hit rate after each round">';
  [0,50,100].forEach(function(p){s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(p)+'" y2="'+Y(p)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(Y(p)+4)+'" text-anchor="end" font-size="11" fill="var(--ink2)" font-family="var(--fm)">'+p+'%</text>'});
  [0,Math.floor((N-1)/2),N-1].forEach(function(i){s+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="var(--ink2)" font-family="var(--fm)">R'+R[i].n+'</text>'});
  var labs=[];
  sel.forEach(function(m){var pts=S.hitPath[m].map(function(p,i){return p?[X(i),Y(p.pct),p]:null}).filter(Boolean);if(!pts.length)return;
    s+='<path d="'+pts.map(function(p,k){return (k?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)}).join("")+'" fill="none" stroke="'+col(m)+'" stroke-width="2.5" stroke-linejoin="round"/>';
    pts.forEach(function(p){s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="'+col(m)+'"/>'});
    var e=pts[pts.length-1];labs.push({m:m,y:e[1],p:e[2]})});
  labs.sort(function(a,b){return a.y-b.y});for(var i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<30)labs[i].y=labs[i-1].y+30;
  var ov=labs.length?labs[labs.length-1].y-(H-pb):0;if(ov>0)labs.forEach(function(l){l.y-=ov});
  labs.forEach(function(l){s+='<text x="'+(W-pr+10)+'" y="'+(l.y-1)+'" font-size="12" font-weight="700" fill="'+col(l.m)+'" font-family="var(--fm)">'+S.nm(l.m)+' '+l.p.pct+'%</text>'+
    '<text x="'+(W-pr+10)+'" y="'+(l.y+13)+'" font-size="11" fill="var(--ink2)" font-family="var(--fm)">'+rowOf(l.m).right+' of '+l.p.calls+' right</text>'});
  el.innerHTML=s+'</svg>'}

  h+='</div>';return h}
function wireComing(p){var b=$("#more");if(b)b.addEventListener("click",function(){$$("#sched [hidden]").forEach(function(x){x.hidden=false});b.remove()});
  if(p.hl){var e=$("#up-"+p.hl);if(e)setTimeout(function(){e.scrollIntoView({block:"center",behavior:RM?"auto":"smooth"})},RM?0:420)}}

function placeRules(){var h=plaque("06","Floor rules","How we grade","Four rules, the same every round. Graded at the first market close after earnings.");
  h+='<ol class="rules">'+S.rules.map(function(x){return '<li><div><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div></li>'}).join("")+'</ol>';
  h+='<div class="btns"><a class="btn" href="#archive">See the rules applied to every round</a>'+(P?'<a class="btn pri" href="#live">Watch Round '+P.n+'</a>':'')+'</div>';return h}

function placeVault(){var h=plaque("07","The vault","An AI with one goal: buy back $EZ","Every $EZ trade pays a fee. Here is where it goes.");
  h+='<div class="vaultdoor"><div>'+dialSVG(320).replace('style="width:320px;height:320px"','style="width:100%;max-width:320px;height:auto;display:block;margin:0 auto"')+'<p class="note" style="text-align:center;margin:10px auto 0"><span class="au">Gold: the pot, '+S.pot+'%.</span> Grey: operations, '+S.ops+'%.</p></div><div class="flow">'+
    '<div class="panel" style="border-color:var(--gold)"><div class="stat"><b class="au">'+S.pot+'%</b><span>The pot</span></div><h3 style="margin-top:10px">The top AI bets it</h3><p>The model on top of the leaderboard takes the pot and bets it on NVIDIA\'s earnings at '+S.lev+'x leverage on Hyperliquid. '+'<span style="font-size:22px;display:inline-flex;gap:6px;vertical-align:middle">'+nvLogo()+hlLogo()+'</span>'+'</p>'+
      '<div class="outs"><div><b class="up">Winning trade</b><span>The profits buy back $EZ.</span></div><div><b class="dn">Losing trade</b><span>The pot shrinks.</span></div><div><b>Next round</b><span>The pot rides on the next call.</span></div></div></div>'+
    '<div class="panel"><div class="stat"><b>'+S.ops+'%</b><span>Operations</span></div><h3 style="margin-top:10px">Keeps the lights on</h3><p>It keeps the project running, then pays for what\'s next:</p><ol class="steps" style="margin-top:10px">'+
      S.steps.map(function(s){return '<li'+(s[2]?' class="now"':'')+'><b>'+esc(s[0])+'</b>'+(s[2]?'<em>NOW</em>':'')+'<span>'+esc(s[1])+'</span></li>'}).join("")+'</ol></div></div></div>';
  h+='<p class="wipe">The pot can be wiped out. A '+S.lev+'x bet that goes wrong drains it.</p>';
  h+='<div class="sec panel est" id="est"><h2 style="margin:0;font:800 22px/1.1 var(--fb);font-stretch:112%">How big could it get? <span class="mute" style="font-size:14px;font-weight:600">(Estimated)</span></h2>'+
    '<div class="row"><span>If $EZ had a market cap of</span><div class="chips" role="group" aria-label="Market cap">'+S.MCAPS.map(function(v,i){return '<button type="button" class="chip" data-mc="'+v+'" aria-pressed="'+(i===1)+'">'+S.money(v)+'</button>'}).join("")+'</div></div>'+
    '<div class="row"><span>and the bet used leverage of</span><div class="chips" role="group" aria-label="Leverage">'+S.LEVS.map(function(v){return '<button type="button" class="chip" data-lv="'+v+'" aria-pressed="'+(v===S.lev)+'">'+v+'x</button>'}).join("")+'</div></div>'+
    '<div class="out" aria-live="polite"><div><b id="eBet"></b><span>in the pot</span></div><div><b id="eBuy"></b><span id="eBuyT"></span></div></div><p class="note">If it\'s wrong, the pot drains. '+esc(S.calcFine)+'</p></div>';
  h+='<div class="btns"><a class="btn" href="#scoreboard">Who is on top of the leaderboard</a><a class="btn" href="#get">Get $EZ</a></div>';return h}
function wireVault(){var mc=S.MCAPS[1],lv=S.lev;function draw(){var c=S.calc(mc,lv);$("#eBet").textContent=S.money(c.bet);$("#eBuy").textContent="~"+S.money(c.buyback);$("#eBuyT").textContent="If the AI is right, it buys back ~"+S.money(c.buyback)+" of $EZ"}
  $$("#est [data-mc]").forEach(function(b){b.addEventListener("click",function(){mc=+b.getAttribute("data-mc");$$("#est [data-mc]").forEach(function(x){x.setAttribute("aria-pressed",x===b)});draw()})});
  $$("#est [data-lv]").forEach(function(b){b.addEventListener("click",function(){lv=+b.getAttribute("data-lv");$$("#est [data-lv]").forEach(function(x){x.setAttribute("aria-pressed",x===b)});draw()})});draw()}

function placeDoor(){var h=plaque("08","Exit","Get $EZ","Three steps, and only three. Nothing here is live until launch.");
  h+='<ol class="doorsteps"><li><b>Check the address</b><div class="addr">'+(CONFIG.ca?esc(CONFIG.ca):'Not posted yet. It appears here, and only here, at launch.')+'</div></li>'+
    '<li><b>Use this page\'s link</b><p>Only through the link on this page.</p><div class="btns">'+(CONFIG.buyUrl?'<a class="btn pri" href="'+esc(CONFIG.buyUrl)+'" target="_blank" rel="noopener">Get $EZ</a>':'<button class="btn" type="button" disabled>Opens at launch</button>')+'</div></li>'+
    '<li><b>Watch the next print</b><p>Calls the day before, the grade after the market answers.'+(P?' <a href="#live">Round '+P.n+' · '+esc(S.co(P))+' is on the board now.</a>':'')+'</p></li></ol>';
  h+='<div class="btns">'+(S.xUrl?'<a class="btn" href="'+esc(S.xUrl)+'" target="_blank" rel="noopener">Follow on X</a>':'<button class="btn" type="button" disabled>Follow on X (link at launch)</button>')+'</div>';
  h+='<p class="disc">$EZ is a memecoin. Nothing here is financial advice or a promise of value, return or payout.</p>';return h}

/* ---------- breadcrumb, mini-map, plan sheet ---------- */
var MM={live:[3,3,24,6],"ai":[7,11,16,8],archive:[3,20,11,6],score:[16,20,11,6],test:[3,27,11,4],coming:[16,27,11,4],rules:[3,32,7,3],vault:[11,32,8,3],door:[20,32,7,3]};
function mmKey(p){return p.k==="round"?"archive":p.k==="ai"?"ai":p.k}
function drawMini(p){var k=mmKey(p),s='<rect x="1" y="1" width="28" height="36" fill="none" stroke="rgba(238,232,220,.5)" stroke-width="1"/>';
  Object.keys(MM).forEach(function(x){var r=MM[x];s+='<rect class="mm-r'+(x===k?' on':'')+'" x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'"/>'});
  if(k==="floor")s+='<circle class="mm-you" cx="15" cy="36" r="2.4"/>';
  $("#mm").innerHTML=s}
function crumbs(p){var c='<a href="#floor">Floor</a>';function sep(){return '<i aria-hidden="true">›</i>'}
  if(p.k==="floor")return '<span class="ttl"><b>Earnings Zeason</b><span>Zeason one · '+(P?'Round '+P.n+' of '+S.total+' live':R.length+' rounds graded')+'</span></span>';
  if(p.k==="round")return c+sep()+'<a href="#archive">Archive</a>'+sep()+'<b>Round '+p.r.n+'</b>';
  if(p.k==="ai")return c+sep()+'<span>Pit</span>'+sep()+'<b>'+S.nm(p.m)+'\'s desk</b>';
  var n={live:"The Big Board",archive:"Archive",score:"Scoreboard",test:"Test room",coming:"Coming up",rules:"Floor rules",vault:"The vault",door:"Exit · Get $EZ"}[p.k];
  return c+sep()+'<b>'+esc(n)+'</b>'}
function sheetHTML(cur){function a(href,label,extra){return '<a href="'+href+'"'+(cur===href?' aria-current="page"':'')+'>'+label+(extra?'<small>'+extra+'</small>':'')+'</a>'}
  return '<div class="hd"><b>Floor plan</b><button class="close" type="button" id="sheetX" aria-label="Close the plan">✕</button></div>'+
    '<svg viewBox="0 0 30 38" style="width:90px;height:114px;display:block;margin:12px auto 0" aria-hidden="true">'+$("#mm").innerHTML+'</svg>'+
    '<nav aria-label="All places"><h4>Front</h4>'+a("#floor","The floor","home")+(P?a("#live","The Big Board · Round "+P.n,"live"):"")+
    '<h4>The pit</h4>'+M.map(function(m){return a("#ai-"+slug(m),logo(m)+" "+S.nm(m)+"'s desk","#"+rank(m))}).join("")+
    '<h4>Rooms</h4>'+a("#archive","Archive",R.length+" rounds")+a("#scoreboard","Scoreboard wall")+a("#test","Test room · compare AIs")+a("#coming","Coming up",UPCOMING.length+" rounds")+a("#rules","Floor rules")+a("#buyback","The vault · buyback")+a("#get","Exit · Get $EZ")+
    '<h4>Every round</h4><div class="rgrid">'+R.map(function(r){return a("#round-"+r.n,"R"+r.n)}).join("")+'</div></nav>'}
var lastFocus=null;
function openSheet(){lastFocus=document.activeElement;$("#sheetIn").innerHTML=sheetHTML(location.hash||"#floor");$("#sheet").hidden=false;$("#sheetX").focus();
  $("#sheetX").addEventListener("click",closeSheet);$$("#sheet nav a").forEach(function(x){x.addEventListener("click",function(){closeSheet(true)})})}
function closeSheet(nav){$("#sheet").hidden=true;if(!nav&&lastFocus)lastFocus.focus()}
$("#mmBtn").addEventListener("click",openSheet);
$("#sheet").addEventListener("click",function(e){if(e.target.id==="sheet")closeSheet()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(!$("#sheet").hidden){closeSheet();return}if(cur&&cur.k!=="floor"){location.hash="#floor"}}
  if(e.key==="Tab"&&!$("#sheet").hidden){var f=$$("#sheet button,#sheet a"),first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

/* ---------- films: only when visible, one at a time ---------- */
var io=null;
function wireFilms(){if(io)io.disconnect();var vids=$$("#placeView video");if(!vids.length||!("IntersectionObserver" in window))return;
  io=new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target;if(e.isIntersecting&&e.intersectionRatio>.6){if(RM)return;$$("video").forEach(function(o){if(o!==v)o.pause()});var pr=v.play();if(pr&&pr.catch)pr.catch(function(){})}else v.pause()})},{threshold:[0,.6,1]});
  vids.forEach(function(v){io.observe(v)})}

/* ---------- router with the zoom ---------- */
var cur=null,floorScroll=0,clickRect=null;
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("[data-room]");clickRect=a?a.getBoundingClientRect():null},true);
function lens(from,to,done){if(RM||!from||!document.body.animate){done&&done();return}
  var l=document.createElement("div");l.className="lens";document.body.appendChild(l);
  function box(r){return {left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"}}
  var an=l.animate([box(from),box(to)],{duration:340,easing:"cubic-bezier(.2,.7,.1,1)",fill:"forwards"});
  an.onfinish=function(){l.remove();done&&done()}}
function fullRect(){return {left:0,top:0,width:innerWidth,height:innerHeight}}
function roomEl(p){var key=roomOf(p);if(p.k==="round")return $('#floorView .drawer[href="#round-'+p.r.n+'"]')||$('#floorView [data-room="archive"]');return $('#floorView [data-room="'+key+'"]')}

function show(){var p=parse(location.hash),prev=cur;cur=p;if(io)io.disconnect();$$("video").forEach(function(v){v.pause()});
  $("#crumbs").innerHTML=crumbs(p);drawMini(p);
  if(p.k==="floor"){var fromPlace=prev&&prev.k!=="floor";
    renderFloor();$("#placeView").hidden=true;$("#placeView").innerHTML="";$("#floorView").hidden=false;
    if(p.miss){var s=$(".slip");if(s)s.insertAdjacentHTML("afterbegin",'<p><b>No place called "'+esc(p.miss)+'" on this floor.</b> Here is the plan.</p>')}
    if(fromPlace){window.scrollTo(0,floorScroll);var el=roomEl(prev);if(el){var r=el.getBoundingClientRect();lens(fullRect(),r);el.focus({preventScroll:true})}
      if(!RM&&$("#floorView").animate)$("#floorView").animate([{opacity:.3,transform:"scale(1.04)"},{opacity:1,transform:"none"}],{duration:340,easing:"cubic-bezier(.2,.7,.1,1)"})}
    return}
  if(!prev||prev.k==="floor")floorScroll=prev?window.scrollY:0;
  var fromRect=clickRect||(prev&&prev.k==="floor"?(function(){var e=roomEl(p);return e&&e.getBoundingClientRect()})():null);clickRect=null;
  var html=p.k==="live"?placeLive():p.k==="archive"?placeArchive():p.k==="round"?placeRound(p.r):p.k==="ai"?placeAI(p.m):p.k==="score"?placeScore():p.k==="test"?placeTest(p):p.k==="coming"?placeComing(p):p.k==="rules"?placeRules():p.k==="vault"?placeVault():placeDoor();
  var pv=$("#placeView");pv.innerHTML='<div class="place">'+html+'<div class="btns" style="margin-top:34px;border-top:1px solid var(--line);padding-top:18px"><a class="btn" href="#floor">← Back to the floor</a><button class="btn" type="button" data-plan>Floor plan</button></div></div>';
  $("#floorView").hidden=true;pv.hidden=false;window.scrollTo(0,0);
  if(p.k==="live")wireLive();if(p.k==="archive")wireArchive();if(p.k==="test")wireTest();if(p.k==="coming")wireComing(p);if(p.k==="vault")wireVault();
  $$("[data-plan]",pv).forEach(function(b){b.addEventListener("click",openSheet)});
  wireFilms();
  var h1=$("h1",pv);if(h1)h1.focus({preventScroll:true});
  if(prev&&prev.k==="floor"&&fromRect){lens(fromRect,fullRect());if(!RM&&pv.animate)pv.animate([{opacity:0,transform:"scale(.97)"},{opacity:1,transform:"none"}],{duration:360,easing:"cubic-bezier(.2,.7,.1,1)"})}
  else if(!RM&&prev&&pv.animate)pv.animate([{opacity:0,transform:"translateX(18px)"},{opacity:1,transform:"none"}],{duration:260,easing:"ease-out"})}
window.addEventListener("hashchange",show);

/* the countdown keeps ticking */
setInterval(function(){var cl=close();if(!cl)return;var l=S.left(cl);$$("[data-left]").forEach(function(e){e.textContent=l||"Closed"})},30000);

$("#foot").innerHTML='<p><span class="ez" aria-hidden="true"><b class="d">$</b><b class="e">E</b><b class="z">Z</b></span><b>$EZ · Earnings Zeason, with a Z</b></p><p>Calls filed before the print · Graded by the market · Never edited</p>';
show();
})();
</script>
</body>
